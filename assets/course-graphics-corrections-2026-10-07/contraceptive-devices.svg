<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1530" viewBox="0 0 700 765" role="img" aria-labelledby="title desc">
<title id="title">Contraceptive devices at one common scale</title><desc id="desc">Course examples: diaphragm 7 cm wide; cap 3 cm; sponge 5.5 cm; ring 5.4 cm; IUD body 3.2 cm tall; implant 4 cm long and 2 mm thick. All use 23 drawing units per cm. Cap width is 3/7 of diaphragm width.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07182f"/><stop offset="1" stop-color="#171331"/></linearGradient>
<radialGradient id="teal"><stop stop-color="#9ef4e9"/><stop offset=".6" stop-color="#16a798"/><stop offset="1" stop-color="#075d64"/></radialGradient>
<radialGradient id="pink"><stop stop-color="#ffb6df"/><stop offset="1" stop-color="#9d3287"/></radialGradient>
<radialGradient id="sponge"><stop stop-color="#ffebad"/><stop offset="1" stop-color="#d89936"/></radialGradient>
<linearGradient id="rod"><stop stop-color="#faf5ff"/><stop offset=".45" stop-color="#c6aeec"/><stop offset="1" stop-color="#7441b0"/></linearGradient></defs>
<rect width="700" height="765" rx="20" fill="url(#bg)"/>
<g font-family="Arial,sans-serif" fill="#f9f7ed">
<text x="30" y="43" font-size="26" font-weight="700">Contraceptives: see the size</text>
<text x="30" y="73" font-size="17" fill="#bdeef4">Six course examples. One shared scale.</text>
<rect x="30" y="92" width="23" height="7" rx="2" fill="#f8d477"/>
<text x="64" y="103" font-size="15" fill="#e7d5a5">1 cm · 23 drawing units (screen size varies)</text><g transform="translate(20 125)"><rect width="325" height="190" rx="15" fill="#111f3e" stroke="#455372"/><text x="18" y="29" font-size="20" font-weight="700">Diaphragm</text><text x="18" y="53" font-size="17" fill="#a9e8ef">7 cm across</text><path data-dimension="161" d="M82 107 Q162.5 189 243 107 Q162.5 51 82 107Z" fill="url(#teal)"/><ellipse cx="162.5" cy="107" rx="80.5" ry="26" fill="none" stroke="#b0f0e7" stroke-width="2"/><text x="162.5" y="174" text-anchor="middle" font-size="15">Shallow dome · springy rim</text></g><g transform="translate(355 125)"><rect width="325" height="190" rx="15" fill="#111f3e" stroke="#455372"/><text x="18" y="29" font-size="20" font-weight="700">Cervical cap</text><text x="18" y="53" font-size="17" fill="#a9e8ef">3 cm across</text><path data-dimension="69" d="M128 101 Q128 149 162.5 151 Q197 149 197 101 Q162.5 75 128 101Z" fill="url(#pink)"/><ellipse cx="162.5" cy="101" rx="34.5" ry="12" fill="none" stroke="#ffd1eb" stroke-width="2"/><text x="162.5" y="174" text-anchor="middle" font-size="15">Less than half as wide</text></g><g transform="translate(20 325)"><rect width="325" height="190" rx="15" fill="#111f3e" stroke="#455372"/><text x="18" y="29" font-size="20" font-weight="700">Sponge</text><text x="18" y="53" font-size="17" fill="#a9e8ef">5.5 cm across</text><circle data-dimension="126.5" cx="162.5" cy="120" r="63.25" fill="url(#sponge)"/><ellipse cx="162.5" cy="120" rx="21" ry="12" fill="#9a672d" opacity=".6"/><path d="M155 166 Q143 188 164 184 Q180 186 170 168" fill="none" stroke="#fff0c7" stroke-width="3"/></g><g transform="translate(355 325)"><rect width="325" height="190" rx="15" fill="#111f3e" stroke="#455372"/><text x="18" y="29" font-size="20" font-weight="700">Vaginal ring</text><text x="18" y="53" font-size="17" fill="#a9e8ef">5.4 cm across</text><circle data-dimension="124.2" cx="162.5" cy="120" r="57.1" stroke="url(#teal)" stroke-width="10" fill="none"/><circle cx="162.5" cy="120" r="59" stroke="#c9fff6" stroke-width="1.2" fill="none"/></g><g transform="translate(20 525)"><rect width="325" height="190" rx="15" fill="#111f3e" stroke="#455372"/><text x="18" y="29" font-size="20" font-weight="700">IUD</text><text x="18" y="53" font-size="17" fill="#a9e8ef">3.2 cm tall</text><path data-dimension="73.6" d="M126 77 H199 V82 H165 V150.6 H160 V82 H126Z" fill="#f6cd78"/><path d="M160 100H165 M160 105H165 M160 110H165 M160 115H165 M160 120H165 M160 125H165 M160 130H165 M160 135H165" stroke="#a4643e" stroke-width="2"/><path d="M161 150.6 Q160 170 151 178 M164 150.6 Q167 169 177 178" fill="none" stroke="#f4e4b6" stroke-width="1.4"/><text x="18" y="174" font-size="15">Body only</text></g><g transform="translate(355 525)"><rect width="325" height="190" rx="15" fill="#111f3e" stroke="#455372"/><text x="18" y="29" font-size="20" font-weight="700">Implant</text><text x="18" y="53" font-size="17" fill="#a9e8ef">4 cm long × 2 mm thick</text><rect data-dimension="92" x="116.5" y="115" width="92" height="4.6" rx="2.3" fill="url(#rod)"/><path d="M116.5 131V140 M208.5 131V140 M116.5 135H208.5" stroke="#d6b4fa" stroke-width="1.5"/><text x="162.5" y="174" text-anchor="middle" font-size="15">A slim rod under the skin</text></g><text x="350" y="747" text-anchor="middle" font-size="16" fill="#f7d477">Compare outlines; these examples are not every available device size.</text></g></svg>