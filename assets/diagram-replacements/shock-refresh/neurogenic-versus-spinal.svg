<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Neurogenic shock vs spinal shock</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">One concerns circulation; the other describes acute neurologic suppression.</text><rect x="48" y="210" width="630" height="690" rx="20" fill="white" stroke="#b8d6d3" stroke-width="3"/><rect x="722" y="210" width="630" height="690" rx="20" fill="white" stroke="#cbbbdc" stroke-width="3"/><text x="82" y="260" fill="#087e86" font-family="Arial,sans-serif" font-size="36" font-weight="700">NEUROGENIC SHOCK</text><text x="756" y="260" fill="#7046a2" font-family="Arial,sans-serif" font-size="36" font-weight="700">SPINAL SHOCK</text><text x="82" y="305" fill="#087e86" font-family="Arial,sans-serif" font-size="25" font-weight="700">CIRCULATION</text><text x="756" y="305" fill="#7046a2" font-family="Arial,sans-serif" font-size="25" font-weight="700">REFLEXES &amp; MUSCLE TONE</text><circle cx="215" cy="425" r="83" fill="#e3f0ed" stroke="#087e86" stroke-width="6"/><path d="M160 445 Q151 365 215 365 Q279 365 272 445" fill="none" stroke="#087e86" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 425 L167 449" fill="none" stroke="#b63c64" stroke-width="8" stroke-linecap="round"/><circle cx="215" cy="425" r="9" fill="#087e86" stroke="none" stroke-width="1"/><text x="332" y="399.0" fill="#087e86" font-family="Arial,sans-serif" font-size="35" font-weight="700">Blood pressure</text><text x="332" y="445.2" fill="#087e86" font-family="Arial,sans-serif" font-size="35" font-weight="700">falls</text><text x="332" y="478.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Pulse may be slow</text><rect x="770" y="365" width="186" height="120" rx="14" fill="#eee6f3" stroke="none" stroke-width="1"/><text x="790" y="408.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="26" font-weight="700">Spinal</text><text x="790" y="442.32" fill="#7046a2" font-family="Arial,sans-serif" font-size="26" font-weight="700">reflex</text><text x="790" y="476.64" fill="#7046a2" font-family="Arial,sans-serif" font-size="26" font-weight="700">circuits</text><path d="M965 425 H1040" stroke="#7046a2" stroke-width="5" stroke-dasharray="10 8"/><path d="M1027 416 L1040 425 L1027 434" fill="none" stroke="#7046a2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1060" y="365" width="242" height="120" rx="14" fill="#eee6f3" stroke="none" stroke-width="1"/><text x="1080" y="400.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="26" font-weight="700">Response</text><text x="1080" y="434.32" fill="#7046a2" font-family="Arial,sans-serif" font-size="26" font-weight="700">reduced /</text><text x="1080" y="468.64" fill="#7046a2" font-family="Arial,sans-serif" font-size="26" font-weight="700">absent</text><path d="M82 534 L644 534" fill="none" stroke="#d6e0e1" stroke-width="2" stroke-linecap="round"/><text x="82" y="560" fill="#087e86" font-family="Arial,sans-serif" font-size="22" font-weight="700">WHY</text><text x="82" y="598.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Loss of sympathetic vascular control.</text><path d="M82 644 L644 644" fill="none" stroke="#d6e0e1" stroke-width="2" stroke-linecap="round"/><text x="82" y="670" fill="#087e86" font-family="Arial,sans-serif" font-size="22" font-weight="700">LOOK FOR</text><text x="82" y="708.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Hypotension, often with bradycardia; warm skin</text><text x="82" y="742.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">may occur.</text><path d="M82 754 L644 754" fill="none" stroke="#d6e0e1" stroke-width="2" stroke-linecap="round"/><text x="82" y="780" fill="#087e86" font-family="Arial,sans-serif" font-size="22" font-weight="700">CARE FOCUS</text><text x="82" y="818.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Restore perfusion with prescribed, monitored</text><text x="82" y="852.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">treatment.</text><path d="M756 534 L1318 534" fill="none" stroke="#d6e0e1" stroke-width="2" stroke-linecap="round"/><text x="756" y="560" fill="#7046a2" font-family="Arial,sans-serif" font-size="22" font-weight="700">WHY</text><text x="756" y="598.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Acute suppression of spinal function below the</text><text x="756" y="632.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">injury.</text><path d="M756 644 L1318 644" fill="none" stroke="#d6e0e1" stroke-width="2" stroke-linecap="round"/><text x="756" y="670" fill="#7046a2" font-family="Arial,sans-serif" font-size="22" font-weight="700">LOOK FOR</text><text x="756" y="708.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Reduced or absent reflexes and flaccid muscle</text><text x="756" y="742.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">tone.</text><path d="M756 754 L1318 754" fill="none" stroke="#d6e0e1" stroke-width="2" stroke-linecap="round"/><text x="756" y="780" fill="#7046a2" font-family="Arial,sans-serif" font-size="22" font-weight="700">CARE FOCUS</text><text x="756" y="818.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Support the injury and repeat neurologic</text><text x="756" y="852.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">examinations.</text><rect x="48" y="925" width="1304" height="71" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="968.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Both can occur together. Return of reflexes does not mean that the spinal cord injury has</text><text x="78" y="1004.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">healed.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>