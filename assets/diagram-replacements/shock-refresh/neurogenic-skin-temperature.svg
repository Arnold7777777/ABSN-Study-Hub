<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Skin and temperature after cord injury</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Front view; the dashed line marks an illustrative injury level.</text><rect x="505" y="215" width="390" height="650" rx="25" fill="#e2edeb" stroke="none" stroke-width="1"/><circle cx="700" cy="294" r="53" fill="#ddb08d" stroke="#17384b" stroke-width="3"/><rect x="682" y="340" width="36" height="35" rx="8" fill="#ddb08d" stroke="none" stroke-width="1"/><path d="M638 370 Q607 369 588 404 L548 522 L540 619 Q545 638 564 631 L580 537 L617 450 L617 585 L640 625 L760 625 L783 585 L783 450 L820 537 L836 631 Q855 638 860 619 L852 522 L812 404 Q793 369 762 370 Z" fill="#ddb08d" stroke="#17384b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 625 L695 625 L685 802 Q681 820 644 814 L634 806 Z" fill="#ddb08d" stroke="#17384b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M705 625 L760 625 L766 806 L756 814 Q719 820 715 802 Z" fill="#ddb08d" stroke="#17384b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M617 480 L783 480 L783 585 L760 625 L640 625 L617 585 Z" fill="#efc2ba" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M505 480 H895" fill="none" stroke="#b63c64" stroke-width="5" stroke-dasharray="12 8"/><text x="544" y="455" fill="#b63c64" font-family="Arial,sans-serif" font-size="25" font-weight="700">Illustrative injury level</text><rect x="48" y="235" width="415" height="255" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="235" width="415" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><text x="72" y="293.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Skin and vessels</text><text x="72" y="344.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Warm or flushed skin may</text><text x="72" y="378.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">reflect loss of vasoconstriction</text><text x="72" y="413.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">below the injury.</text><rect x="937" y="235" width="415" height="255" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="937" y="235" width="415" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="961" y="293.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Sweating and</text><text x="961" y="332.6" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">temperature</text><text x="961" y="384.2" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Sweating and temperature</text><text x="961" y="418.52" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">regulation may be impaired in</text><text x="961" y="452.84" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">affected regions.</text><rect x="48" y="535" width="415" height="300" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="535" width="415" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><text x="72" y="593.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Findings vary</text><text x="72" y="644.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">The injury level, completeness,</text><text x="72" y="678.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">environment and other injuries</text><text x="72" y="713.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">affect the examination.</text><rect x="937" y="535" width="415" height="300" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="937" y="535" width="415" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="961" y="593.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Nursing assessment</text><text x="961" y="644.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Monitor temperature, perfusion</text><text x="961" y="678.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">and skin integrity. Use</text><text x="961" y="713.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">prescribed temperature support.</text><rect x="48" y="885" width="1304" height="111" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="928.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Warm skin is not unique to neurogenic shock. A skin pattern is a clue; assess circulation</text><text x="78" y="964.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">and possible bleeding at the same time.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>