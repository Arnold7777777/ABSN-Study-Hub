<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Recognize a concerning pattern</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Hypotension with bradycardia after high cord injury needs urgent assessment.</text><rect x="48" y="220" width="625" height="330" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="220" width="625" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="72" y="278.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Pattern that raises concern</text><text x="72" y="329.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">After a high spinal cord injury: low blood pressure</text><text x="72" y="363.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">with a pulse that is slow or fails to increase as</text><text x="72" y="398.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">expected.</text><rect x="705" y="220" width="647" height="330" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="705" y="220" width="647" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><text x="729" y="278.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Assess the whole picture</text><text x="729" y="329.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Check mentation, skin, perfusion, urine output,</text><text x="729" y="363.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">temperature, ECG and the injury mechanism.</text><rect x="48" y="600" width="1304" height="190" rx="16" fill="#f4d8e2" stroke="none" stroke-width="1"/><text x="80" y="650" fill="#b63c64" font-family="Arial,sans-serif" font-size="27" font-weight="700">ILLUSTRATIVE VITAL SIGNS</text><text x="80" y="725" fill="#b63c64" font-family="Arial,sans-serif" font-size="54" font-weight="700">BP 78/50 mmHg</text><text x="790" y="725" fill="#b63c64" font-family="Arial,sans-serif" font-size="54" font-weight="700">Pulse 46/min</text><rect x="48" y="868" width="1304" height="128" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="911.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">This pattern supports suspicion; it does not prove the cause. Bleeding, medicines,</text><text x="78" y="947.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">conduction disease and other causes of shock must also be assessed.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>