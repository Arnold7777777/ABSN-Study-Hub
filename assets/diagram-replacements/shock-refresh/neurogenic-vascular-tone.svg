<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Vasodilation: less resistance, more pooling</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Equal red-cell counts illustrate redistribution, not an exact pressure model.</text><rect x="48" y="215" width="634" height="590" rx="18" fill="white" stroke="#c7d9dc" stroke-width="2"/><text x="76" y="270" fill="#087e86" font-family="Arial,sans-serif" font-size="31" font-weight="700">Normal vascular tone</text><rect x="93" y="430.0" width="544" height="110" rx="55.0" fill="#efd5df" stroke="#087e86" stroke-width="6"/><circle cx="168" cy="457.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="244" cy="457.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="320" cy="457.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="396" cy="457.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="472" cy="457.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="548" cy="457.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="168" cy="513.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="244" cy="513.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="320" cy="513.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="396" cy="513.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="472" cy="513.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="548" cy="513.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><text x="78" y="660.0" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">Arterioles maintain resistance; veins return</text><text x="78" y="698.28" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">blood to the heart.</text><rect x="718" y="215" width="634" height="590" rx="18" fill="white" stroke="#c7d9dc" stroke-width="2"/><text x="746" y="270" fill="#b63c64" font-family="Arial,sans-serif" font-size="31" font-weight="700">Loss of vascular tone</text><rect x="763" y="370.0" width="544" height="230" rx="115.0" fill="#efd5df" stroke="#b63c64" stroke-width="6"/><circle cx="838" cy="397.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="914" cy="397.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="990" cy="397.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="1066" cy="397.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="1142" cy="397.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="1218" cy="397.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="838" cy="573.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="914" cy="573.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="990" cy="573.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="1066" cy="573.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="1142" cy="573.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="1218" cy="573.0" r="13" fill="#b63c64" stroke="none" stroke-width="1"/><text x="748" y="660.0" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">Dilated veins hold more blood; arterial</text><text x="748" y="698.28" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">resistance also falls.</text><rect x="48" y="868" width="1304" height="128" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="911.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Blood may pool without primary blood loss: relative hypovolemia. Trauma can also cause</text><text x="78" y="947.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">bleeding, so assess for both mechanisms.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>