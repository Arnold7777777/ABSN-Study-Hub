<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Cerebral perfusion pressure: MAP − ICP</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Subtract the opposing intracranial pressure from mean arterial pressure.</text><rect x="48" y="245" width="380" height="320" rx="20" fill="white" stroke="#c7d9dc" stroke-width="2"/><text x="80" y="305" fill="#087e86" font-family="Arial,sans-serif" font-size="35" font-weight="700">MAP</text><text x="128" y="448" fill="#087e86" font-family="Arial,sans-serif" font-size="112" font-weight="700">70</text><text x="158" y="512" fill="#087e86" font-family="Arial,sans-serif" font-size="29" font-weight="400">mmHg</text><rect x="510" y="245" width="380" height="320" rx="20" fill="white" stroke="#c7d9dc" stroke-width="2"/><text x="542" y="305" fill="#7046a2" font-family="Arial,sans-serif" font-size="35" font-weight="700">ICP</text><text x="590" y="448" fill="#7046a2" font-family="Arial,sans-serif" font-size="112" font-weight="700">22</text><text x="620" y="512" fill="#7046a2" font-family="Arial,sans-serif" font-size="29" font-weight="400">mmHg</text><rect x="972" y="245" width="380" height="320" rx="20" fill="white" stroke="#c7d9dc" stroke-width="2"/><text x="1004" y="305" fill="#b63c64" font-family="Arial,sans-serif" font-size="35" font-weight="700">CPP</text><text x="1052" y="448" fill="#b63c64" font-family="Arial,sans-serif" font-size="112" font-weight="700">48</text><text x="1082" y="512" fill="#b63c64" font-family="Arial,sans-serif" font-size="29" font-weight="400">mmHg</text><text x="448" y="430" fill="#17384b" font-family="Arial,sans-serif" font-size="60" font-weight="700">−</text><text x="908" y="430" fill="#17384b" font-family="Arial,sans-serif" font-size="60" font-weight="700">=</text><rect x="48" y="615" width="1304" height="185" rx="16" fill="#e4ebdf" stroke="none" stroke-width="1"/><text x="80" y="670" fill="#087e86" font-family="Arial,sans-serif" font-size="32" font-weight="700">If ICP rises by 5 while MAP stays the same:</text><text x="80" y="751" fill="#087e86" font-family="Arial,sans-serif" font-size="55" font-weight="700">70 − 27 = 43 mmHg</text><rect x="48" y="855" width="1304" height="141" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="898.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">CPP falls when ICP rises or MAP falls. The pressure difference helps assess perfusion; it is</text><text x="78" y="934.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">not a direct measurement of brain blood flow.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>