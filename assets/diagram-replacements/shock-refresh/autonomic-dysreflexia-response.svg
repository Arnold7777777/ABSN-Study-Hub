<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Autonomic dysreflexia: respond to rising BP</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">A hypertensive emergency after spinal cord injury.</text><rect x="48" y="215" width="1304" height="136" rx="16" fill="#f4d8e2" stroke="none" stroke-width="1"/><text x="78" y="257.0" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">AUTONOMIC DYSREFLEXIA: sudden BP rise, usually with injury at or above T6. A full</text><text x="78" y="295.28" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">bladder or blocked catheter is a common trigger.</text><rect x="48" y="390" width="634" height="210" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="390" width="634" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="90" cy="441" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="451" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="120" y="448.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Sit upright; get help</text><text x="72" y="499.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Lower legs if safe, loosen tight items and check</text><text x="72" y="533.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">blood pressure.</text><rect x="718" y="390" width="634" height="210" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="718" y="390" width="634" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="760" cy="441" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="752" y="451" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="790" y="448.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Look for the trigger</text><text x="742" y="499.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Check bladder drainage first; assess other triggers</text><text x="742" y="533.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">using the clinical protocol.</text><rect x="48" y="625" width="634" height="210" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="625" width="634" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="90" cy="676" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="686" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="120" y="683.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Recheck frequently</text><text x="72" y="734.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Monitor BP every 2–5 minutes and escalate</text><text x="72" y="768.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">persistent or severe hypertension.</text><rect x="718" y="625" width="634" height="210" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="718" y="625" width="634" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="760" cy="676" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="752" y="686" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">4</text><text x="790" y="683.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Treat as prescribed</text><text x="742" y="734.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Rapid-acting medication may be needed while the</text><text x="742" y="768.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">trigger is investigated.</text><rect x="48" y="906" width="1304" height="90" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="949.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Neurogenic shock: BP too low. Autonomic dysreflexia: BP rises sharply above the person’s</text><text x="78" y="985.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">baseline. Heart rate may be slow, normal or fast.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>