<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Shock can worsen before BP falls</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Recognize changing perfusion and escalate early.</text><rect x="48" y="220" width="634" height="260" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="220" width="634" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="90" cy="271" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="281" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="120" y="278.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Initial dysfunction</text><text x="72" y="329.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Reduced oxygen delivery may be present before</text><text x="72" y="363.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">obvious hypotension.</text><rect x="718" y="220" width="634" height="260" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="718" y="220" width="634" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="760" cy="271" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="752" y="281" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="790" y="278.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Compensation</text><text x="742" y="329.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Heart rate, breathing and vascular tone may</text><text x="742" y="363.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">change to maintain circulation.</text><rect x="48" y="510" width="634" height="260" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="510" width="634" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="90" cy="561" r="24" fill="#b63c64" stroke="none" stroke-width="1"/><text x="82" y="571" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="120" y="568.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Progressive failure</text><text x="72" y="619.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Perfusion worsens; mentation, urine output and</text><text x="72" y="653.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">blood pressure may deteriorate.</text><rect x="718" y="510" width="634" height="260" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="718" y="510" width="634" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="760" cy="561" r="24" fill="#b63c64" stroke="none" stroke-width="1"/><text x="752" y="571" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">4</text><text x="790" y="568.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Refractory shock</text><text x="742" y="619.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Persistent circulatory failure despite treatment</text><text x="742" y="653.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">carries a high risk of organ injury and death.</text><rect x="48" y="885" width="1304" height="111" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="928.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">This is a teaching framework, not a measured time curve. Patients may present at different</text><text x="78" y="964.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">points; respond to deterioration before hypotension appears.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>