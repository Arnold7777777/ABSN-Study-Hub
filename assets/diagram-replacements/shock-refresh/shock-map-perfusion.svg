<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Pressure is one part of perfusion</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Use trends and the ordered target, not a single universal cutoff.</text><rect x="48" y="220" width="1304" height="200" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="110" y="310" fill="#087e86" font-family="Arial,sans-serif" font-size="48" font-weight="700">MAP ≈ (SBP + 2 × DBP) ÷ 3</text><text x="110" y="377" fill="#17384b" font-family="Arial,sans-serif" font-size="30" font-weight="400">Example: 90/60 mmHg gives a MAP of about 70 mmHg</text><rect x="48" y="465" width="625" height="345" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="465" width="625" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="72" y="523.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">A common initial target</text><text x="72" y="574.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">For adults with septic shock on vasopressors, an</text><text x="72" y="608.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">initial MAP target of 65 mmHg is recommended.</text><text x="72" y="643.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Individual goals may differ.</text><rect x="705" y="465" width="647" height="345" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="705" y="465" width="647" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><text x="729" y="523.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Assess perfusion as well</text><text x="729" y="574.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Trend mentation, urine output, skin perfusion and</text><text x="729" y="608.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">lactate alongside pressure. A single MAP does not</text><text x="729" y="643.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">describe every organ.</text><rect x="48" y="868" width="1304" height="128" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="911.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Adult urine output below 0.5 mL/kg/hour is concerning in context. It is not proof that the</text><text x="78" y="947.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">kidneys have “shut down.”</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>