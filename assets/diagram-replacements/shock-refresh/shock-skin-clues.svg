<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Warm or cool skin: useful clues, not a diagnosis</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Combine the bedside examination with the full clinical picture.</text><rect x="48" y="220" width="625" height="480" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="220" width="625" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><text x="72" y="278.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Cool / poorly perfused pattern</text><text x="72" y="329.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Cool, pale or mottled skin, weak pulses and</text><text x="72" y="363.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">delayed refill can accompany reduced flow or</text><text x="72" y="398.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">vasoconstriction.</text><rect x="705" y="220" width="647" height="480" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="705" y="220" width="647" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><text x="729" y="278.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Warm / vasodilated pattern</text><text x="729" y="329.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Warm or flushed skin can occur in distributive shock,</text><text x="729" y="363.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">including sepsis. Sweating and pulse character are</text><text x="729" y="398.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">variable.</text><rect x="48" y="750" width="1304" height="100" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="805.0" fill="#087e86" font-family="Arial,sans-serif" font-size="29" font-weight="700">Assess skin temperature, moisture, color, refill and pulses together.</text><rect x="48" y="885" width="1304" height="111" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="928.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Skin findings do not identify the cause by themselves. They can change during illness,</text><text x="78" y="964.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">resuscitation or exposure to medicines and temperature.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>