<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Neurogenic vs spinal shock vs dysreflexia</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Compare blood pressure, reflexes and the immediate care focus.</text><rect x="48" y="210" width="1304" height="225" rx="18" fill="white" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="210" width="12" height="225" rx="6" fill="#087e86" stroke="none" stroke-width="1"/><text x="78" y="255.0" fill="#087e86" font-family="Arial,sans-serif" font-size="31" font-weight="700">NEUROGENIC</text><text x="78" y="295.92" fill="#087e86" font-family="Arial,sans-serif" font-size="31" font-weight="700">SHOCK</text><text x="78" y="360.0" fill="#087e86" font-family="Arial,sans-serif" font-size="32" font-weight="700">BP FALLS</text><text x="440" y="250" fill="#087e86" font-family="Arial,sans-serif" font-size="21" font-weight="700">WHAT CHANGES</text><text x="440" y="292.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Loss of sympathetic control. Pulse</text><text x="440" y="326.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">is often slow; warm skin may</text><text x="440" y="360.64" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">occur.</text><text x="885" y="250" fill="#087e86" font-family="Arial,sans-serif" font-size="21" font-weight="700">CARE FOCUS</text><text x="885" y="292.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Support circulation and the injured</text><text x="885" y="326.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">spine; use prescribed fluids and</text><text x="885" y="360.64" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">vasoactive treatment.</text><rect x="48" y="460" width="1304" height="225" rx="18" fill="white" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="460" width="12" height="225" rx="6" fill="#7046a2" stroke="none" stroke-width="1"/><text x="78" y="505.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="31" font-weight="700">SPINAL SHOCK</text><text x="78" y="610.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="32" font-weight="700">REFLEXES FALL</text><text x="440" y="500" fill="#7046a2" font-family="Arial,sans-serif" font-size="21" font-weight="700">WHAT CHANGES</text><text x="440" y="542.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Acute loss or reduction of reflexes</text><text x="440" y="576.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">and muscle tone below a spinal</text><text x="440" y="610.64" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">injury.</text><text x="885" y="500" fill="#7046a2" font-family="Arial,sans-serif" font-size="21" font-weight="700">CARE FOCUS</text><text x="885" y="542.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Support the spinal injury and repeat</text><text x="885" y="576.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">neurologic examinations. BP does not</text><text x="885" y="610.64" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">define this condition.</text><rect x="48" y="710" width="1304" height="225" rx="18" fill="white" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="710" width="12" height="225" rx="6" fill="#b63c64" stroke="none" stroke-width="1"/><text x="78" y="755.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="31" font-weight="700">AUTONOMIC</text><text x="78" y="795.92" fill="#b63c64" font-family="Arial,sans-serif" font-size="31" font-weight="700">DYSREFLEXIA</text><text x="78" y="860.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="32" font-weight="700">BP RISES</text><text x="440" y="750" fill="#b63c64" font-family="Arial,sans-serif" font-size="21" font-weight="700">WHAT CHANGES</text><text x="440" y="792.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">A trigger below the injury</text><text x="440" y="826.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">provokes hypertension.</text><text x="440" y="860.64" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Headache, flushing or sweating</text><text x="440" y="894.96" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">may occur.</text><text x="885" y="750" fill="#b63c64" font-family="Arial,sans-serif" font-size="21" font-weight="700">CARE FOCUS</text><text x="885" y="792.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Sit upright, seek help, check bladder</text><text x="885" y="826.32" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">and other triggers, and recheck BP.</text><text x="885" y="860.64" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Use ordered treatment.</text><text x="70" y="979.0" fill="#17384b" font-family="Arial,sans-serif" font-size="24" font-weight="700">Neurogenic and spinal shock may coexist. Autonomic dysreflexia is a different emergency; its pulse may be</text><text x="70" y="1010.68" fill="#17384b" font-family="Arial,sans-serif" font-size="24" font-weight="700">slow, normal or fast.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>