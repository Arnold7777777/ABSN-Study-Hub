<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Neurogenic shock: autonomic pathways</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">A high cord injury can impair both vascular tone and heart-rate responses.</text><rect x="48" y="215" width="620" height="200" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="215" width="620" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><text x="72" y="273.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Sympathetic route</text><text x="72" y="324.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Descending signals travel through the spinal cord</text><text x="72" y="358.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">to thoracolumbar sympathetic neurons.</text><rect x="732" y="215" width="620" height="200" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="732" y="215" width="620" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="756" y="273.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Vagal route</text><text x="756" y="324.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">The vagus travels from the brainstem to the heart</text><text x="756" y="358.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">outside the spinal cord.</text><path d="M350 425 L350 488" fill="none" stroke="#7046a2" stroke-width="5" stroke-linecap="round"/><path d="M341 476 L350 488 L359 476" fill="none" stroke="#7046a2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1040 425 L1040 488" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round"/><path d="M1031 476 L1040 488 L1049 476" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="500" width="620" height="290" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="500" width="620" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><text x="72" y="558.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">High spinal cord injury</text><text x="72" y="609.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Loss of vascular sympathetic control permits</text><text x="72" y="643.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">dilation and pooling. Cardiac sympathetic</text><text x="72" y="678.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">disruption is greatest with higher injuries.</text><rect x="732" y="500" width="620" height="290" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="732" y="500" width="620" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="756" y="558.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Relative vagal predominance</text><text x="756" y="609.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">A slow pulse can accompany hypotension when</text><text x="756" y="643.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">sympathetic cardiac drive is reduced.</text><rect x="48" y="868" width="1304" height="128" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="911.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Reduced vascular resistance + reduced venous return can lower cardiac output and tissue</text><text x="78" y="947.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">perfusion. Injury level and completeness affect the findings.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>