<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Compare shock by mechanism</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Start with volume, pump, obstruction or vascular tone.</text><rect x="48" y="215" width="1304" height="700" rx="18" fill="white" stroke="#c7d9dc" stroke-width="2"/><text x="70" y="262" fill="#087e86" font-family="Arial,sans-serif" font-size="25" font-weight="700">MECHANISM</text><text x="370" y="262" fill="#087e86" font-family="Arial,sans-serif" font-size="25" font-weight="700">COMMON EXAMPLES</text><text x="805" y="262" fill="#087e86" font-family="Arial,sans-serif" font-size="25" font-weight="700">INTERPRETATION</text><path d="M70 295 L1330 295" fill="none" stroke="#c7d9dc" stroke-width="2" stroke-linecap="round"/><text x="70" y="337.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="700">Volume loss</text><text x="370" y="337.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">Bleeding; fluid loss</text><text x="805" y="337.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">Venous return and cardiac output fall.</text><path d="M70 440 L1330 440" fill="none" stroke="#c7d9dc" stroke-width="2" stroke-linecap="round"/><text x="70" y="482.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="700">Pump failure</text><text x="370" y="482.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">Myocardial infarction; severe</text><text x="370" y="517.64" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">heart failure</text><text x="805" y="482.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">Low output may coexist with congestion.</text><path d="M70 585 L1330 585" fill="none" stroke="#c7d9dc" stroke-width="2" stroke-linecap="round"/><text x="70" y="627.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="700">Flow obstruction</text><text x="370" y="627.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">Pulmonary embolism;</text><text x="370" y="662.64" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">tamponade; tension</text><text x="370" y="698.28" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">pneumothorax</text><text x="805" y="627.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">An obstruction limits filling or forward</text><text x="805" y="662.64" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">flow.</text><path d="M70 730 L1330 730" fill="none" stroke="#c7d9dc" stroke-width="2" stroke-linecap="round"/><text x="70" y="772.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="700">Distributive</text><text x="370" y="772.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">Sepsis; anaphylaxis;</text><text x="370" y="807.64" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">neurogenic shock</text><text x="805" y="772.0" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">Loss of vascular tone lowers resistance;</text><text x="805" y="807.64" fill="#17384b" font-family="Arial,sans-serif" font-size="27" font-weight="400">output varies.</text><rect x="48" y="930" width="1304" height="66" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="973.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Neurogenic shock is a distributive form. Heart rate, preload, cardiac output and skin</text><text x="78" y="1009.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="700">findings vary with phase, treatment and mixed causes.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>