<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Prepare the room before it is needed</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">An individualized safety plan supports rapid response.</text><rect x="350" y="300" width="700" height="310" rx="32" fill="#dceceb" stroke="none" stroke-width="1"/><rect x="390" y="360" width="600" height="100" rx="28" fill="white" stroke="#087e86" stroke-width="4"/><rect x="405" y="375" width="120" height="70" rx="20" fill="#b9dad8" stroke="none" stroke-width="1"/><path d="M365 480 L1035 480" fill="none" stroke="#087e86" stroke-width="12" stroke-linecap="round"/><path d="M400 480 L400 575" fill="none" stroke="#087e86" stroke-width="10" stroke-linecap="round"/><path d="M1000 480 L1000 575" fill="none" stroke="#087e86" stroke-width="10" stroke-linecap="round"/><circle cx="400" cy="590" r="20" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="1000" cy="590" r="20" fill="#7046a2" stroke="none" stroke-width="1"/><text x="500" y="665" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">LOW BED • BRAKES ON</text><rect x="48" y="210" width="270" height="475" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="210" width="270" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="90" cy="261" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="271" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="120" y="268.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Plan ahead</text><text x="72" y="319.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Know the rescue</text><text x="72" y="353.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">plan. Keep the call</text><text x="72" y="388.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">bell and help</text><text x="72" y="422.56000000000006" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">available. Review</text><text x="72" y="456.88" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">seizure history.</text><rect x="1080" y="210" width="272" height="475" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="1080" y="210" width="272" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="1122" cy="261" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="1114" y="271" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="1152" y="268.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Prepare</text><text x="1104" y="319.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Keep oxygen and</text><text x="1104" y="353.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">suction accessible</text><text x="1104" y="388.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">in clinical care. Use</text><text x="1104" y="422.56000000000006" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">ordered</text><text x="1104" y="456.88" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">precautions.</text><rect x="48" y="740" width="625" height="255" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="740" width="625" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="90" cy="791" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="801" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="120" y="798.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Reduce injury risk</text><text x="72" y="849.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Keep the floor clear. Pad rails when indicated by</text><text x="72" y="883.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">local policy; avoid entrapment and restraint.</text><rect x="705" y="740" width="647" height="255" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="705" y="740" width="647" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="747" cy="791" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="739" y="801" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">4</text><text x="777" y="798.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">After the event</text><text x="729" y="849.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Check breathing, injuries, responsiveness and</text><text x="729" y="883.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">recovery. Document timing and observations.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>