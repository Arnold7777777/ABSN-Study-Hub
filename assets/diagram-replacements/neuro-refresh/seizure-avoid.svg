<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Seizure first aid: three actions to avoid</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Calm protection is safer than trying to stop the movements.</text><circle cx="255" cy="320" r="75" fill="#fae5e9" stroke="#b63c64" stroke-width="8"/><path d="M205 270 L305 370" fill="none" stroke="#b63c64" stroke-width="12" stroke-linecap="round"/><rect x="48" y="450" width="414" height="390" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="450" width="414" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="90" cy="501" r="24" fill="#b63c64" stroke="none" stroke-width="1"/><text x="82" y="511" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="120" y="508.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Nothing in the mouth</text><text x="72" y="559.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Do not insert fingers, spoons or</text><text x="72" y="593.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">other objects. A person cannot</text><text x="72" y="628.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">swallow their tongue.</text><circle cx="700" cy="320" r="75" fill="#fae5e9" stroke="#b63c64" stroke-width="8"/><path d="M650 270 L750 370" fill="none" stroke="#b63c64" stroke-width="12" stroke-linecap="round"/><rect x="493" y="450" width="414" height="390" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="493" y="450" width="414" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="535" cy="501" r="24" fill="#b63c64" stroke="none" stroke-width="1"/><text x="527" y="511" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="565" y="508.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">No forced restraint</text><text x="517" y="559.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Do not hold down the limbs or</text><text x="517" y="593.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">try to stop the movements.</text><circle cx="1145" cy="320" r="75" fill="#fae5e9" stroke="#b63c64" stroke-width="8"/><path d="M1095 270 L1195 370" fill="none" stroke="#b63c64" stroke-width="12" stroke-linecap="round"/><rect x="938" y="450" width="414" height="390" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="938" y="450" width="414" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="980" cy="501" r="24" fill="#b63c64" stroke="none" stroke-width="1"/><text x="972" y="511" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="1010" y="508.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Do not leave</text><text x="962" y="559.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Stay and summon help.</text><text x="962" y="593.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Withhold food and drink until</text><text x="962" y="628.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">fully alert.</text><rect x="48" y="885" width="1304" height="110" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="928.0" fill="#17384b" font-family="Arial,sans-serif" font-size="30" font-weight="700">Protect the person and keep observing. Avoid actions that add injury or aspiration risk.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>