<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">A safer home, room by room</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Reduce hazards while supporting familiar routines and safe movement.</text><rect x="485" y="240" width="420" height="510" rx="18" fill="#dce9e4" stroke="#087e86" stroke-width="4"/><path d="M475 240 L695 190 L915 240" fill="none" stroke="#087e86" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M695 250 L695 730" fill="none" stroke="#88b8b4" stroke-width="4" stroke-linecap="round"/><path d="M500 492 L890 492" fill="none" stroke="#88b8b4" stroke-width="4" stroke-linecap="round"/><circle cx="595" cy="355" r="50" fill="#087e86" stroke="none" stroke-width="1"/><text x="583" y="370" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700">1</text><text x="547" y="440" fill="#087e86" font-family="Arial,sans-serif" font-size="23" font-weight="700">BATH</text><circle cx="795" cy="355" r="50" fill="#087e86" stroke="none" stroke-width="1"/><text x="783" y="370" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700">2</text><text x="747" y="440" fill="#087e86" font-family="Arial,sans-serif" font-size="23" font-weight="700">PATHS</text><circle cx="595" cy="620" r="50" fill="#087e86" stroke="none" stroke-width="1"/><text x="583" y="635" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700">3</text><text x="547" y="705" fill="#087e86" font-family="Arial,sans-serif" font-size="23" font-weight="700">EXITS</text><circle cx="795" cy="620" r="50" fill="#087e86" stroke="none" stroke-width="1"/><text x="783" y="635" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700">4</text><text x="747" y="705" fill="#087e86" font-family="Arial,sans-serif" font-size="23" font-weight="700">STORAGE</text><rect x="48" y="210" width="400" height="295" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="210" width="400" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="90" cy="261" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="271" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="120" y="268.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Safer bathing</text><text x="72" y="319.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Use secure grab bars and</text><text x="72" y="353.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">nonslip surfaces. Mark hot and</text><text x="72" y="388.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">cold taps; reduce scald risk.</text><rect x="952" y="210" width="400" height="295" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="952" y="210" width="400" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="994" cy="261" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="986" y="271" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="1024" y="268.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Clear routes</text><text x="976" y="319.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Remove loose rugs and</text><text x="976" y="353.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">clutter. Light halls and the</text><text x="976" y="388.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">bathroom route; repair</text><text x="976" y="422.56000000000006" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">hazards.</text><rect x="48" y="545" width="400" height="295" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="545" width="400" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="90" cy="596" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="82" y="606" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="120" y="603.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Wandering plan</text><text x="72" y="654.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Use supervision, identification</text><text x="72" y="688.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">and door alerts. Maintain safe</text><text x="72" y="723.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">emergency exit access.</text><rect x="952" y="545" width="400" height="295" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="952" y="545" width="400" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="994" cy="596" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="986" y="606" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">4</text><text x="1024" y="603.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Secure hazards</text><text x="976" y="654.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Lock medicines, chemicals,</text><text x="976" y="688.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">sharp tools and weapons</text><text x="976" y="723.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">away. Check stove safety.</text><rect x="48" y="878" width="1304" height="118" rx="16" fill="#e7e1ef" stroke="none" stroke-width="1"/><text x="76" y="920.0" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">Reassess room by room as abilities change. Choose safeguards that protect dignity and</text><text x="76" y="958.28" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">do not trap the person during a fire.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>