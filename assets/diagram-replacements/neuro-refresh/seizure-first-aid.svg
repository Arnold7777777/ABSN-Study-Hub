<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">During a seizure: stay, time and protect</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Follow the individual rescue plan and clinical protocol when available.</text><rect x="48" y="215" width="1304" height="210" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="120" y="300" fill="#087e86" font-family="Arial,sans-serif" font-size="45" font-weight="700">STAY</text><text x="440" y="300" fill="#087e86" font-family="Arial,sans-serif" font-size="45" font-weight="700">TIME</text><text x="750" y="300" fill="#087e86" font-family="Arial,sans-serif" font-size="45" font-weight="700">PROTECT</text><text x="1080" y="300" fill="#087e86" font-family="Arial,sans-serif" font-size="45" font-weight="700">ASSESS</text><path d="M350 285 L392 285" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round"/><path d="M380 276 L392 285 L380 294" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M660 285 L702 285" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round"/><path d="M690 276 L702 285 L690 294" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1000 285 L1042 285" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round"/><path d="M1030 276 L1042 285 L1030 294" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="375" fill="#17384b" font-family="Arial,sans-serif" font-size="31" font-weight="700">Start the timer immediately and call for help from the bedside.</text><rect x="48" y="475" width="414" height="300" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="475" width="414" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="90" cy="526" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="536" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="120" y="533.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Protect from injury</text><text x="72" y="584.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Clear hard objects. Cushion the</text><text x="72" y="618.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">head with something soft and</text><text x="72" y="653.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">flat.</text><rect x="493" y="475" width="414" height="300" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="493" y="475" width="414" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="535" cy="526" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="527" y="536" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="565" y="533.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Support the airway</text><text x="517" y="584.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Gently turn onto the side when</text><text x="517" y="618.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">feasible; do not force</text><text x="517" y="653.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">movement.</text><rect x="938" y="475" width="414" height="300" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="938" y="475" width="414" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="980" cy="526" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="972" y="536" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="1010" y="533.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Check recovery</text><text x="962" y="584.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Monitor breathing and</text><text x="962" y="618.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">responsiveness. Reassure and</text><text x="962" y="653.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">remain with the person.</text><rect x="48" y="820" width="1304" height="176" rx="16" fill="#fae5e9" stroke="none" stroke-width="1"/><text x="78" y="867.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="29" font-weight="700">Get emergency help for a first seizure, injury, breathing problems, a seizure in water,</text><text x="78" y="905.28" fill="#b63c64" font-family="Arial,sans-serif" font-size="29" font-weight="700">pregnancy, 5 minutes of convulsions, or repeated seizures without recovery.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>