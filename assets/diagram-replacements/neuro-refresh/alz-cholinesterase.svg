<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Cholinesterase inhibitors: preserve the signal</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Simplified mechanism; drug choice and dosing are individualized.</text><rect x="48" y="218" width="1304" height="416" rx="16" fill="#e0edeb" stroke="none" stroke-width="1"/><text x="88" y="273" fill="#087e86" font-family="Arial,sans-serif" font-size="27" font-weight="700">NERVE SIGNAL</text><text x="88" y="323" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">Acetylcholine (ACh)</text><circle cx="150" cy="410" r="22" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="230" cy="410" r="22" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="310" cy="410" r="22" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="390" cy="410" r="22" fill="#087e86" stroke="none" stroke-width="1"/><path d="M445 410 L560 410" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round"/><path d="M548 401 L560 410 L548 419" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="345" width="320" height="132" rx="16" fill="#f4d8e2" stroke="none" stroke-width="1"/><text x="632" y="402" fill="#b63c64" font-family="Arial,sans-serif" font-size="29" font-weight="700">AChE enzyme</text><text x="622" y="445" fill="#b63c64" font-family="Arial,sans-serif" font-size="25" font-weight="400">breaks down ACh</text><path d="M612 334 L886 493" fill="none" stroke="#b63c64" stroke-width="9" stroke-linecap="round"/><text x="666" y="303" fill="#b63c64" font-family="Arial,sans-serif" font-size="26" font-weight="700">INHIBITOR</text><path d="M950 410 L1065 410" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round"/><path d="M1053 401 L1065 410 L1053 419" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1090" y="335" width="212" height="190" rx="16" fill="white" stroke="none" stroke-width="1"/><text x="1110" y="385.0" fill="#087e86" font-family="Arial,sans-serif" font-size="28" font-weight="700">More ACh</text><text x="1110" y="421.96" fill="#087e86" font-family="Arial,sans-serif" font-size="28" font-weight="700">remains</text><text x="1110" y="458.92" fill="#087e86" font-family="Arial,sans-serif" font-size="28" font-weight="700">available</text><text x="88" y="578.0" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">Blocking the enzyme supports signaling; it does not replace lost neurons.</text><rect x="48" y="675" width="625" height="320" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="675" width="625" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="72" y="733.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Examples and limits</text><text x="72" y="784.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Donepezil, rivastigmine and galantamine treat</text><text x="72" y="818.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">symptoms. Benefits vary. These medicines do not</text><text x="72" y="853.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">cure Alzheimer’s.</text><rect x="705" y="675" width="647" height="320" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="705" y="675" width="647" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><text x="729" y="733.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Nursing monitoring</text><text x="729" y="784.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Watch nausea, diarrhea, appetite or weight loss,</text><text x="729" y="818.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">dizziness and fainting. Bradycardia or heart block</text><text x="729" y="853.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">can occur.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>