<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Convulsive status: treat without delay</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Do not wait 30 minutes for repeated seizures without recovery.</text><rect x="48" y="210" width="1304" height="146" rx="16" fill="#f5dce5" stroke="none" stroke-width="1"/><text x="80" y="270" fill="#b63c64" font-family="Arial,sans-serif" font-size="42" font-weight="700">5 MINUTES</text><text x="420" y="255.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="29" font-weight="700">of convulsions, or repeated seizures without recovery: activate</text><text x="420" y="293.28" fill="#b63c64" font-family="Arial,sans-serif" font-size="29" font-weight="700">emergency treatment.</text><rect x="48" y="390" width="1304" height="128" rx="16" fill="white" stroke="#c7d9dc" stroke-width="2"/><circle cx="90" cy="454" r="26" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="464" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="143" y="436" fill="#087e86" font-family="Arial,sans-serif" font-size="28" font-weight="700">Immediately</text><text x="143" y="478.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Support airway and breathing; check glucose. Obtain help, monitoring and IV access.</text><rect x="48" y="540" width="1304" height="128" rx="16" fill="white" stroke="#c7d9dc" stroke-width="2"/><circle cx="90" cy="604" r="26" fill="#7046a2" stroke="none" stroke-width="1"/><text x="82" y="614" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="143" y="586" fill="#7046a2" font-family="Arial,sans-serif" font-size="28" font-weight="700">First-line rescue</text><text x="143" y="628.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Give a benzodiazepine using the ordered route and emergency plan. Monitor breathing.</text><rect x="48" y="690" width="1304" height="128" rx="16" fill="white" stroke="#c7d9dc" stroke-width="2"/><circle cx="90" cy="754" r="26" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="764" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="143" y="736" fill="#087e86" font-family="Arial,sans-serif" font-size="28" font-weight="700">Persistent seizure</text><text x="143" y="778.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Repeat rescue dosing and give second-line therapy according to protocol; do not delay escalation.</text><rect x="48" y="840" width="1304" height="128" rx="16" fill="white" stroke="#c7d9dc" stroke-width="2"/><circle cx="90" cy="904" r="26" fill="#b63c64" stroke="none" stroke-width="1"/><text x="82" y="914" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">4</text><text x="143" y="886" fill="#b63c64" font-family="Arial,sans-serif" font-size="28" font-weight="700">Refractory status</text><text x="143" y="928.0" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Urgent specialist / ICU care, airway support and continuous EEG as indicated.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>