<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Alzheimer’s stages: match support to function</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Clinical stages guide care; they are not a fixed timetable.</text><rect x="48" y="360" width="414" height="440" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="360" width="414" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="90" cy="411" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="421" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="120" y="418.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Mild / early</text><text x="72" y="469.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Recent memory and word</text><text x="72" y="503.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">finding may change. Support</text><text x="72" y="538.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">medicines, appointments and</text><text x="72" y="572.5600000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">complex tasks while preserving</text><text x="72" y="606.88" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">independence.</text><path d="M468 580 L487 580" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round"/><path d="M475 571 L487 580 L475 589" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="493" y="360" width="414" height="440" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="493" y="360" width="414" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="535" cy="411" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="527" y="421" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="565" y="418.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Moderate / middle</text><text x="517" y="469.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Confusion, communication and</text><text x="517" y="503.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">self-care difficulties increase.</text><text x="517" y="538.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Add cueing, supervision and</text><text x="517" y="572.5600000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">tailored safety support.</text><path d="M913 580 L932 580" fill="none" stroke="#7046a2" stroke-width="5" stroke-linecap="round"/><path d="M920 571 L932 580 L920 589" fill="none" stroke="#7046a2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="938" y="360" width="414" height="440" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="938" y="360" width="414" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="980" cy="411" r="24" fill="#b63c64" stroke="none" stroke-width="1"/><text x="972" y="421" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="1010" y="418.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Severe / late</text><text x="962" y="469.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Extensive daily care is needed.</text><text x="962" y="503.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Mobility, communication and</text><text x="962" y="538.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">swallowing may be affected;</text><text x="962" y="572.5600000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">prioritize comfort and safe</text><text x="962" y="606.88" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">feeding.</text><rect x="48" y="210" width="1304" height="112" rx="16" fill="#d9edeb" stroke="none" stroke-width="1"/><text x="76" y="251.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">Before dementia: biological changes and mild cognitive impairment may occur. MCI does not</text><text x="76" y="287.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">always progress to Alzheimer’s dementia.</text><rect x="48" y="846" width="1304" height="150" rx="16" fill="#e7e1ef" stroke="none" stroke-width="1"/><text x="76" y="891.0" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">The pace and order vary. There is no fixed number of years for each stage. A sudden</text><text x="76" y="929.28" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">change needs assessment for another cause, such as delirium.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>