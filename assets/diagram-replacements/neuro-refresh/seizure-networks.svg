<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Seizure classification: where it begins</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Also classify as unknown or unclassified when evidence is insufficient.</text><rect x="80" y="300" width="490" height="270" rx="90" fill="#e1eded" stroke="#087e86" stroke-width="3"/><path d="M325 320 L325 550" fill="none" stroke="#8eb2b6" stroke-width="3" stroke-linecap="round"/><path d="M180 380 L260 425" fill="none" stroke="#90aeb5" stroke-width="4" stroke-linecap="round"/><path d="M260 425 L165 500" fill="none" stroke="#90aeb5" stroke-width="4" stroke-linecap="round"/><path d="M180 380 L165 500" fill="none" stroke="#90aeb5" stroke-width="4" stroke-linecap="round"/><path d="M420 380 L490 445" fill="none" stroke="#90aeb5" stroke-width="4" stroke-linecap="round"/><path d="M490 445 L410 515" fill="none" stroke="#90aeb5" stroke-width="4" stroke-linecap="round"/><path d="M420 380 L410 515" fill="none" stroke="#90aeb5" stroke-width="4" stroke-linecap="round"/><path d="M260 425 L420 380" fill="none" stroke="#90aeb5" stroke-width="4" stroke-linecap="round"/><path d="M260 425 L410 515" fill="none" stroke="#90aeb5" stroke-width="4" stroke-linecap="round"/><circle cx="180" cy="380" r="24" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="260" cy="425" r="24" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="165" cy="500" r="24" fill="#b7d1d2" stroke="none" stroke-width="1"/><circle cx="420" cy="380" r="24" fill