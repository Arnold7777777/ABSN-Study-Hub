29" font-weight="400">Begins in a network within one</text><text x="80" y="658.28" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">hemisphere. It can spread to both</text><text x="80" y="696.56" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">sides.</text><text x="830" y="620.0" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">Rapidly engages networks distributed</text><text x="830" y="658.28" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">on both sides of the brain.</text><rect x="48" y="760" width="625" height="235" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="760" width="625" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="72" y="818.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Describe what you see</text><text x="72" y="869.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Record onset, movements, response, awareness,</text><text x="72" y="903.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">duration and recovery.</text><rect x="705" y="760" width="647" height="235" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="705" y="760" width="647" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><text x="729" y="818.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Do not classify by fainting alone</text><text x="729" y="869.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Consciousness changes do not by themselves prove</text><text x="729" y="903.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">generalized onset.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>