<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Phenytoin: interpret the level and the patient</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">A reference interval is not a stand-alone dosing instruction.</text><text x="65" y="257" fill="#087e86" font-family="Arial,sans-serif" font-size="29" font-weight="700">TOTAL PHENYTOIN</text><text x="65" y="310" fill="#17384b" font-family="Arial,sans-serif" font-size="33" font-weight="700">Common reference range: 10–20 mcg/mL</text><rect x="80" y="365" width="390" height="90" rx="0" fill="#dbe7ea" stroke="none" stroke-width="1"/><rect x="470" y="365" width="390" height="90" rx="0" fill="#a8d9c6" stroke="none" stroke-width="1"/><rect x="860" y="365" width="390" height="90" rx="0" fill="#efbdd0" stroke="none" stroke-width="1"/><path d="M80 455 L80 475" fill="none" stroke="#17384b" stroke-width="3" stroke-linecap="round"/><text x="70" y="510" fill="#17384b" font-family="Arial,sans-serif" font-size="25" font-weight="400">0</text><path d="M275 455 L275 475" fill="none" stroke="#17384b" stroke-width="3" stroke-linecap="round"/><text x="265" y="510" fill="#17384b" font-family="Arial,sans-serif" font-size="25" font-weight="400">5</text><path d="M470 455 L470 475" fill="none" stroke="#17384b" stroke-width="3" stroke-linecap="round"/><text x="460" y="510" fill="#17384b" font-family="Arial,sans-serif" font-size="25" font-weight="400">10</text><path d="M665 455 L665 475" fill="none" stroke="#17384b" stroke-width="3" stroke-linecap="round"/><text x="655" y="510" fill="#17384b" font-family="Arial,sans-serif" font-size="25" font-weight="400">15</text><path d="M860 455 L860 475" fill="none" stroke="#17384b" stroke-width="3" stroke-linecap="round"/><text x="850" y="510" fill="#17384b" font-family="Arial,sans-serif" font-size="25" font-weight="400">20</text><path d="M1055 455 L1055 475" fill="none" stroke="#17384b" stroke-width="3" stroke-linecap="round"/><text x="1045" y="510" fill="#17384b" font-family="Arial,sans-serif" font-size="25" font-weight="400">25</text><path d="M1250 455 L1250 475" fill="none" stroke="#17384b" stroke-width="3" stroke-linecap="round"/><text x="1240" y="510" fill="#17384b" font-family="Arial,sans-serif" font-size="25" font-weight="400">30</text><text x="170" y="422" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="700">LOWER</text><text x="515" y="422" fill="#087e86" font-family="Arial,sans-serif" font-size="26" font-weight="700">REFERENCE RANGE</text><text x="1000" y="422" fill="#b63c64" font-family="Arial,sans-serif" font-size="26" font-weight="700">HIGHER</text><rect x="48" y="570" width="625" height="305" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="570" width="625" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="72" y="628.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Interpret in context</text><text x="72" y="679.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Free phenytoin: often 1–2 mcg/mL. Albumin,</text><text x="72" y="713.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">kidney disease, symptoms and sample timing</text><text x="72" y="748.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">affect interpretation.</text><rect x="705" y="570" width="647" height="305" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="705" y="570" width="647" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><text x="729" y="628.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Recognize toxicity</text><text x="729" y="679.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Nystagmus, ataxia, slurred speech and confusion</text><text x="729" y="713.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">warrant prompt assessment and level review.</text><rect x="48" y="912" width="1304" height="84" rx="16" fill="#e7e1ef" stroke="none" stroke-width="1"/><text x="73" y="948.0" fill="#17384b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Do not adjust a dose from the number alone; use the prescription, laboratory range and clinician</text><text x="73" y="981.0" fill="#17384b" font-family="Arial,sans-serif" font-size="25" font-weight="700">guidance.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>