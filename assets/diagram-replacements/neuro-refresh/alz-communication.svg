<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Communication that preserves dignity</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Connect with the person before moving to the task.</text><rect x="48" y="214" width="625" height="260" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="214" width="625" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><text x="72" y="272.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Instead of pressure</text><text x="72" y="323.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Avoid arguing, quizzing, rushing or presenting</text><text x="72" y="357.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">several instructions at once.</text><rect x="705" y="214" width="647" height="260" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="705" y="214" width="647" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="729" y="272.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Use a calm invitation</text><text x="729" y="323.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Approach from the front, speak clearly and allow</text><text x="729" y="357.92" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">time. Offer one step or a small choice.</text><rect x="48" y="530" width="414" height="300" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="530" width="414" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="90" cy="581" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="591" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="120" y="588.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Notice the feeling</text><text x="72" y="639.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">“You sound worried. I’m here</text><text x="72" y="673.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">with you.”</text><path d="M468 675 L487 675" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round"/><path d="M475 666 L487 675 L475 684" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="493" y="530" width="414" height="300" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="493" y="530" width="414" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="535" cy="581" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="527" y="591" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="565" y="588.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Offer reassurance</text><text x="517" y="639.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Listen, acknowledge the</text><text x="517" y="673.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">concern and check comfort.</text><path d="M913 675 L932 675" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round"/><path d="M920 666 L932 675 L920 684" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="938" y="530" width="414" height="300" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="938" y="530" width="414" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="980" cy="581" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="972" y="591" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="1010" y="588.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Invite a familiar</text><text x="1010" y="627.6" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">activity</text><text x="962" y="679.2" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">“Would you help me fold these</text><text x="962" y="713.5200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">towels?”</text><rect x="48" y="870" width="1304" height="126" rx="16" fill="#e7e1ef" stroke="none" stroke-width="1"/><text x="78" y="914.0" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">Treat the person as an adult. Gentle orientation can help when it is reassuring; repeated</text><text x="78" y="952.28" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">correction that causes distress is not helpful.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>