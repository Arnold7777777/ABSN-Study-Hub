<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Sundowning: anticipate, assess, reassure</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">A practical daily sequence—not an invented agitation score.</text><path d="M115 340 L1285 340" fill="none" stroke="#087e86" stroke-width="8" stroke-linecap="round"/><circle cx="175" cy="340" r="45" fill="#087e86" stroke="none" stroke-width="1"/><text x="163" y="355" fill="white" font-family="Arial,sans-serif" font-size="40" font-weight="700">1</text><text x="100" y="261" fill="#087e86" font-family="Arial,sans-serif" font-size="26" font-weight="700">DAYTIME</text><circle cx="690" cy="340" r="45" fill="#7046a2" stroke="none" stroke-width="1"/><text x="678" y="355" fill="white" font-family="Arial,sans-serif" font-size="40" font-weight="700">2</text><text x="615" y="261" fill="#7046a2" font-family="Arial,sans-serif" font-size="26" font-weight="700">BEFORE DUSK</text><circle cx="1200" cy="340" r="45" fill="#b63c64" stroke="none" stroke-width="1"/><text x="1188" y="355" fill="white" font-family="Arial,sans-serif" font-size="40" font-weight="700">3</text><text x="1125" y="261" fill="#b63c64" font-family="Arial,sans-serif" font-size="26" font-weight="700">EVENING</text><rect x="48" y="420" width="414" height="335" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="420" width="414" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="72" y="478.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Support the body clock</text><text x="72" y="529.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Offer daylight, activity and a</text><text x="72" y="563.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">familiar routine. Review sleep</text><text x="72" y="598.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">and daytime rest needs.</text><rect x="493" y="420" width="414" height="335" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="493" y="420" width="414" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><text x="517" y="478.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Reduce predictable</text><text x="517" y="517.6" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">stress</text><text x="517" y="569.2" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Improve lighting before</text><text x="517" y="603.5200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">shadows deepen. Check pain,</text><text x="517" y="637.84" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">toileting, hunger and fatigue.</text><rect x="938" y="420" width="414" height="335" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="938" y="420" width="414" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><text x="962" y="478.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">Respond calmly</text><text x="962" y="529.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Reduce noise, offer</text><text x="962" y="563.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">reassurance and a familiar</text><text x="962" y="598.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">activity. Avoid arguing or</text><text x="962" y="632.5600000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">rushing.</text><rect x="48" y="800" width="1304" height="195" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="80" y="848.0" fill="#17384b" font-family="Arial,sans-serif" font-size="30" font-weight="700">Sundowning describes late-day worsening of confusion or agitation in some people. It</text><text x="80" y="887.6" fill="#17384b" font-family="Arial,sans-serif" font-size="30" font-weight="700">has no universal 4–8 PM peak. New or abrupt symptoms need clinical assessment.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>