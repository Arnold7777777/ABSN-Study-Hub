<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#f2f5ef" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1400" height="170" rx="0" fill="#113f50" stroke="none" stroke-width="1"/><text x="48" y="41" fill="#9adbd9" font-family="Arial,sans-serif" font-size="21" font-weight="700">NUR 258  /  EXAM 3</text><text x="48" y="94.0" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Tonic–clonic seizure: recognize the sequence</text><text x="48" y="144.0" fill="#d7e8e9" font-family="Arial,sans-serif" font-size="24" font-weight="400">Not every seizure follows this pattern.</text><rect x="48" y="210" width="1304" height="125" rx="16" fill="#e4deed" stroke="none" stroke-width="1"/><text x="78" y="252.0" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">A prodrome is not the seizure. An aura can itself be a focal seizure; neither occurs in every person</text><text x="78" y="288.96" fill="#17384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">or before every tonic–clonic seizure.</text><rect x="48" y="470" width="414" height="380" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="470" width="414" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><circle cx="90" cy="521" r="24" fill="#087e86" stroke="none" stroke-width="1"/><text x="82" y="531" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="120" y="528.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">TONIC</text><text x="72" y="579.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Sustained stiffening.</text><text x="72" y="613.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Consciousness is impaired;</text><text x="72" y="648.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">breathing may be affected.</text><path d="M468 650 L487 650" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round"/><path d="M475 641 L487 650 L475 659" fill="none" stroke="#087e86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="493" y="470" width="414" height="380" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="493" y="470" width="414" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><circle cx="535" cy="521" r="24" fill="#7046a2" stroke="none" stroke-width="1"/><text x="527" y="531" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="565" y="528.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">CLONIC</text><text x="517" y="579.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Repeated rhythmic jerking.</text><text x="517" y="613.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Observe the pattern without</text><text x="517" y="648.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">restraining movement.</text><path d="M913 650 L932 650" fill="none" stroke="#7046a2" stroke-width="5" stroke-linecap="round"/><path d="M920 641 L932 650 L920 659" fill="none" stroke="#7046a2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="938" y="470" width="414" height="380" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="938" y="470" width="414" height="10" rx="4" fill="#b63c64" stroke="none" stroke-width="1"/><circle cx="980" cy="521" r="24" fill="#b63c64" stroke="none" stroke-width="1"/><text x="972" y="531" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="1010" y="528.0" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">POSTICTAL</text><text x="962" y="579.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Recovery may include</text><text x="962" y="613.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">confusion, sleepiness,</text><text x="962" y="648.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">headache or soreness.</text><text x="962" y="682.5600000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Reassess breathing and</text><text x="962" y="716.88" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">neurologic status.</text><text x="135" y="408" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">STIFFENING</text><text x="600" y="408" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">JERKING</text><text x="1030" y="408" fill="#b63c64" font-family="Arial,sans-serif" font-size="30" font-weight="700">RECOVERY</text><rect x="48" y="890" width="1304" height="105" rx="16" fill="#dceceb" stroke="none" stroke-width="1"/><text x="78" y="933.0" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">Time the actual event. Durations vary; a convulsive seizure at 5 minutes requires</text><text x="78" y="971.28" fill="#17384b" font-family="Arial,sans-serif" font-size="29" font-weight="700">emergency treatment.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>