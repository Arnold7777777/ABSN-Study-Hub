xt><text x="802" y="602" fill="#7046a2" font-family="Arial,sans-serif" font-size="24" font-weight="700">ILLUSTRATIVE TRACES ONLY</text><rect x="48" y="660" width="414" height="335" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="48" y="660" width="414" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="72" y="718.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Clean, dry hair</text><text x="72" y="769.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Avoid oils and styling products</text><text x="72" y="803.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">that interfere with electrode</text><text x="72" y="838.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">contact.</text><rect x="493" y="660" width="414" height="335" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="493" y="660" width="414" height="10" rx="4" fill="#7046a2" stroke="none" stroke-width="1"/><text x="517" y="718.0" fill="#7046a2" font-family="Arial,sans-serif" font-size="30" font-weight="700">Follow test instructions</text><text x="517" y="769.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Food is usually allowed.</text><text x="517" y="803.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Caffeine and sleep instructions</text><text x="517" y="838.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">depend on the planned EEG.</text><rect x="938" y="660" width="414" height="335" rx="18" fill="#ffffff" stroke="#c7d9dc" stroke-width="2"/><rect x="938" y="660" width="414" height="10" rx="4" fill="#087e86" stroke="none" stroke-width="1"/><text x="962" y="718.0" fill="#087e86" font-family="Arial,sans-serif" font-size="30" font-weight="700">Medicines and results</text><text x="962" y="769.6" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">Do not stop medication unless</text><text x="962" y="803.9200000000001" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">directed. A normal routine EEG</text><text x="962" y="838.24" fill="#17384b" font-family="Arial,sans-serif" font-size="26" font-weight="400">does not exclude epilepsy.</text><path d="M48 1036 L1352 1036" fill="none" stroke="#bed2d4" stroke-width="2" stroke-linecap="round"/><text x="48" y="1072" fill="#4b6671" font-family="Arial,sans-serif" font-size="21" font-weight="400">Educational schematic • Details and sources appear in the page caption</text></svg>