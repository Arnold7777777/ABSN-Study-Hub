<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#087b80"/></marker></defs><rect x="0" y="0" width="1600" height="1600" rx="0" fill="#fffef9" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1600" height="17" rx="0" fill="#087b80" stroke="none" stroke-width="0"/><text x="60" y="65" fill="#087b80" font-family="Arial,sans-serif" font-size="22" font-weight="700">ABSN STUDY HUB</text><text x="1110" y="65" fill="#6b7280" font-family="Arial,sans-serif" font-size="22" font-weight="400">CLINICAL CONCEPT DIAGRAM</text><text x="60" y="136.0" fill="#18384b" font-family="Arial,sans-serif" font-size="49" font-weight="700">Autonomic dysreflexia: find the trigger</text><rect x="55" y="255" width="495" height="580" rx="24" fill="#eef5f4" stroke="none" stroke-width="0"/><g transform="translate(75,270)"><text x="69" y="55" fill="#18384b" font-family="Arial,sans-serif" font-size="32" font-weight="700">Connected decisions</text><path d="M225,280 L225,125" fill="none" stroke="#92b7bd" stroke-width="6" stroke-linecap="round"/><circle cx="225" cy="125" r="48" fill="#e0e9ed" stroke="#465aa3" stroke-width="4"/><text x="187.2" y="133" fill="#18384b" font-family="Arial,sans-serif" font-size="21" font-weight="700">History</text><path d="M225,280 L80,260" fill="none" stroke="#92b7bd" stroke-width="6" stroke-linecap="round"/><circle cx="80" cy="260" r="48" fill="#e0e9ed" stroke="#465aa3" stroke-width="4"/><text x="58.4" y="268" fill="#18384b" font-family="Arial,sans-serif" font-size="21" font-weight="700">Exam</text><path d="M225,280 L370,260" fill="none" stroke="#92b7bd" stroke-width="6" stroke-linecap="round"/><circle cx="370" cy="260" r="48" fill="#e0e9ed" stroke="#465aa3" stroke-width="4"/><text x="348.4" y="268" fill="#18384b" font-family="Arial,sans-serif" font-size="21" font-weight="700">Data</text><path d="M225,280 L135,425" fill="none" stroke="#92b7bd" stroke-width="6" stroke-linecap="round"/><circle cx="135" cy="425" r="48" fill="#e0e9ed" stroke="#465aa3" stroke-width="4"/><text x="113.4" y="433" fill="#18384b" font-family="Arial,sans-serif" font-size="21" font-weight="700">Plan</text><path d="M225,280 L315,425" fill="none" stroke="#92b7bd" stroke-width="6" stroke-linecap="round"/><circle cx="315" cy="425" r="48" fill="#e0e9ed" stroke="#465aa3" stroke-width="4"/><text x="282.6" y="433" fill="#18384b" font-family="Arial,sans-serif" font-size="21" font-weight="700">Review</text><circle cx="225" cy="280" r="65" fill="#087b80" stroke="none" stroke-width="0"/><text x="178" y="291" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Assess</text><text x="18" y="530" fill="#18384b" font-family="Arial,sans-serif" font-size="25" font-weight="400">Link findings to the next action</text></g><rect x="605" y="255" width="940" height="170" rx="20" fill="#f3f5f9" stroke="none" stroke-width="0"/><circle cx="647" cy="298" r="22" fill="#087b80" stroke="none" stroke-width="0"/><text x="638" y="308" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="690" y="304.0" fill="#087b80" font-family="Arial,sans-serif" font-size="32" font-weight="700">Susceptible spinal injury</text><text x="637" y="361.0" fill="#18384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">Usually injury at or above T6.</text><path d="M647,431 L647,443" fill="none" stroke="#87aab0" stroke-width="4" stroke-linecap="round"/><rect x="605" y="450" width="940" height="170" rx="20" fill="#f3f5f9" stroke="none" stroke-width="0"/><circle cx="647" cy="493" r="22" fill="#465aa3" stroke="none" stroke-width="0"/><text x="638" y="503" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="690" y="499.0" fill="#465aa3" font-family="Arial,sans-serif" font-size="32" font-weight="700">Stimulus below injury</text><text x="637" y="556.0" fill="#18384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">Bladder distention, bowel problems or skin pressure can trigger a</text><text x="637" y="595.15" fill="#18384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">response.</text><path d="M647,626 L647,638" fill="none" stroke="#87aab0" stroke-width="4" stroke-linecap="round"/><rect x="605" y="645" width="940" height="170" rx="20" fill="#f3f5f9" stroke="none" stroke-width="0"/><circle cx="647" cy="688" r="22" fill="#8d477b" stroke="none" stroke-width="0"/><text x="638" y="698" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="690" y="694.0" fill="#8d477b" font-family="Arial,sans-serif" font-size="32" font-weight="700">Severe hypertension</text><text x="637" y="751.0" fill="#18384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">Uncontrolled sympathetic activity raises blood pressure.</text><text x="60" y="906" fill="#087b80" font-family="Arial,sans-serif" font-size="25" font-weight="700">ASSESSMENT AND CARE</text><rect x="55" y="940" width="480" height="385" rx="20" fill="#f1f4f6" stroke="none" stroke-width="0"/><rect x="55" y="940" width="480" height="8" rx="4" fill="#087b80" stroke="none" stroke-width="0"/><text x="82" y="998.0" fill="#087b80" font-family="Arial,sans-serif" font-size="31" font-weight="700">Recognize</text><text x="82" y="1091.0" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">Sudden headache, flushing or</text><text x="82" y="1128.8" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">sweating above the lesion and a</text><text x="82" y="1166.6" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">significant blood-pressure rise;</text><text x="82" y="1204.4" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">pulse may vary.</text><rect x="560" y="940" width="480" height="385" rx="20" fill="#f1f4f6" stroke="none" stroke-width="0"/><rect x="560" y="940" width="480" height="8" rx="4" fill="#465aa3" stroke="none" stroke-width="0"/><text x="587" y="998.0" fill="#465aa3" font-family="Arial,sans-serif" font-size="31" font-weight="700">Immediate response</text><text x="587" y="1091.0" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">Sit upright, loosen constrictive</text><text x="587" y="1128.8" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">items, call for help and measure</text><text x="587" y="1166.6" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">blood pressure frequently.</text><rect x="1065" y="940" width="480" height="385" rx="20" fill="#f1f4f6" stroke="none" stroke-width="0"/><rect x="1065" y="940" width="480" height="8" rx="4" fill="#8d477b" stroke="none" stroke-width="0"/><text x="1092" y="998.0" fill="#8d477b" font-family="Arial,sans-serif" font-size="31" font-weight="700">Remove the trigger</text><text x="1092" y="1091.0" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">Check bladder drainage first and</text><text x="1092" y="1128.8" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">assess other triggers under</text><text x="1092" y="1166.6" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">protocol. Give ordered rapid</text><text x="1092" y="1204.4" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">treatment if needed.</text><rect x="55" y="1365" width="1490" height="140" rx="19" fill="#e4efed" stroke="none" stroke-width="0"/><text x="85" y="1414.0" fill="#005e65" font-family="Arial,sans-serif" font-size="30" font-weight="700">This is an emergency. Do not leave the person flat while investigating the cause.</text><text x="60" y="1558" fill="#536774" font-family="Arial,sans-serif" font-size="21" font-weight="400">Concept schematic, not anatomical scale. Full references accompany the study page.</text></svg>