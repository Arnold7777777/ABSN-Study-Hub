<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#087b80"/></marker></defs><rect x="0" y="0" width="1600" height="1600" rx="0" fill="#fffef9" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1600" height="17" rx="0" fill="#087b80" stroke="none" stroke-width="0"/><text x="60" y="65" fill="#087b80" font-family="Arial,sans-serif" font-size="22" font-weight="700">ABSN STUDY HUB</text><text x="1110" y="65" fill="#6b7280" font-family="Arial,sans-serif" font-size="22" font-weight="400">CLINICAL CONCEPT DIAGRAM</text><text x="60" y="136.0" fill="#18384b" font-family="Arial,sans-serif" font-size="49" font-weight="700">Shock: why tissue perfusion fails</text><rect x="55" y="255" width="495" height="580" rx="24" fill="#eef5f4" stroke="none" stroke-width="0"/><g transform="translate(75,270)"><text x="145" y="55" fill="#18384b" font-family="Arial,sans-serif" font-size="32" font-weight="700">Circulation</text><rect x="45" y="125" width="120" height="85" rx="18" fill="#465aa3" stroke="none" stroke-width="0"/><text x="79" y="181" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">RA</text><rect x="45" y="270" width="120" height="85" rx="18" fill="#465aa3" stroke="none" stroke-width="0"/><text x="79" y="326" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">RV</text><rect x="285" y="125" width="120" height="85" rx="18" fill="#a84764" stroke="none" stroke-width="0"/><text x="319" y="181" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">LA</text><rect x="285" y="270" width="120" height="85" rx="18" fill="#a84764" stroke="none" stroke-width="0"/><text x="319" y="326" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">LV</text><path d="M105,215 L105,258" fill="none" stroke="#465aa3" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M345,215 L345,258" fill="none" stroke="#a84764" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M165 312 H205 V95 H345 V114" fill="none" stroke="#465aa3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 312 H248 V410 H105 V110" fill="none" stroke="#a84764" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="86" fill="#465aa3" font-family="Arial,sans-serif" font-size="25" font-weight="700">Lungs</text><text x="189" y="455" fill="#a84764" font-family="Arial,sans-serif" font-size="25" font-weight="700">Body</text><text x="39" y="388" fill="#465aa3" font-family="Arial,sans-serif" font-size="24" font-weight="400">Right heart</text><text x="284" y="388" fill="#a84764" font-family="Arial,sans-serif" font-size="24" font-weight="400">Left heart</text></g><rect x="605" y="255" width="940" height="170" rx="20" fill="#f3f5f9" stroke="none" stroke-width="0"/><circle cx="647" cy="298" r="22" fill="#087b80" stroke="none" stroke-width="0"/><text x="638" y="308" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="690" y="304.0" fill="#087b80" font-family="Arial,sans-serif" font-size="32" font-weight="700">Circulatory problem</text><text x="637" y="361.0" fill="#18384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">Volume, pump, vascular tone or obstruction is the cause.</text><path d="M647,431 L647,443" fill="none" stroke="#87aab0" stroke-width="4" stroke-linecap="round"/><rect x="605" y="450" width="940" height="170" rx="20" fill="#f3f5f9" stroke="none" stroke-width="0"/><circle cx="647" cy="493" r="22" fill="#465aa3" stroke="none" stroke-width="0"/><text x="638" y="503" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="690" y="499.0" fill="#465aa3" font-family="Arial,sans-serif" font-size="32" font-weight="700">Inadequate delivery</text><text x="637" y="556.0" fill="#18384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">Cells receive insufficient oxygen for their needs.</text><path d="M647,626 L647,638" fill="none" stroke="#87aab0" stroke-width="4" stroke-linecap="round"/><rect x="605" y="645" width="940" height="170" rx="20" fill="#f3f5f9" stroke="none" stroke-width="0"/><circle cx="647" cy="688" r="22" fill="#8d477b" stroke="none" stroke-width="0"/><text x="638" y="698" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="690" y="694.0" fill="#8d477b" font-family="Arial,sans-serif" font-size="32" font-weight="700">Organ dysfunction</text><text x="637" y="751.0" fill="#18384b" font-family="Arial,sans-serif" font-size="29" font-weight="400">Mentation, urine output and skin perfusion may change.</text><text x="60" y="906" fill="#087b80" font-family="Arial,sans-serif" font-size="25" font-weight="700">ASSESSMENT AND CARE</text><rect x="55" y="940" width="480" height="385" rx="20" fill="#f1f4f6" stroke="none" stroke-width="0"/><rect x="55" y="940" width="480" height="8" rx="4" fill="#087b80" stroke="none" stroke-width="0"/><text x="82" y="998.0" fill="#087b80" font-family="Arial,sans-serif" font-size="31" font-weight="700">Hypovolemic</text><text x="82" y="1091.0" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">Insufficient circulating volume</text><text x="82" y="1128.8" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">from bleeding or fluid loss.</text><rect x="560" y="940" width="480" height="385" rx="20" fill="#f1f4f6" stroke="none" stroke-width="0"/><rect x="560" y="940" width="480" height="8" rx="4" fill="#465aa3" stroke="none" stroke-width="0"/><text x="587" y="998.0" fill="#465aa3" font-family="Arial,sans-serif" font-size="31" font-weight="700">Cardiogenic</text><text x="587" y="1091.0" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">Pump failure; fluids may worsen</text><text x="587" y="1128.8" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">congestion when not indicated.</text><rect x="1065" y="940" width="480" height="385" rx="20" fill="#f1f4f6" stroke="none" stroke-width="0"/><rect x="1065" y="940" width="480" height="8" rx="4" fill="#8d477b" stroke="none" stroke-width="0"/><text x="1092" y="998.0" fill="#8d477b" font-family="Arial,sans-serif" font-size="31" font-weight="700">Distributive or obstructive</text><text x="1092" y="1091.0" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">Vasodilation or a physical</text><text x="1092" y="1128.8" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">blockage requires cause-specific</text><text x="1092" y="1166.6" fill="#18384b" font-family="Arial,sans-serif" font-size="28" font-weight="400">treatment.</text><rect x="55" y="1365" width="1490" height="140" rx="19" fill="#e4efed" stroke="none" stroke-width="0"/><text x="85" y="1414.0" fill="#005e65" font-family="Arial,sans-serif" font-size="30" font-weight="700">Treat the cause and reassess perfusion. One fluid strategy does not fit every shock type.</text><text x="60" y="1558" fill="#536774" font-family="Arial,sans-serif" font-size="21" font-weight="400">Concept schematic, not anatomical scale. Full references accompany the study page.</text></svg>