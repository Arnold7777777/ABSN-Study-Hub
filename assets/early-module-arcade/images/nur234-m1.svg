<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 530" role="img"><title>nur234-m1 study reference</title><desc>Four method cards: a condom, T-shaped copper IUD, combined-pill pack and a symbolic permanently interrupted pathway.</desc><g transform="translate(0,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">A · Condom</text><path d="M135 164 V96 Q135 62 169 61 V52 Q180 35 191 52 V61 Q225 62 225 96 V164" fill="#5a667b" stroke="#88e5eb" stroke-width="5"/><ellipse cx="180" cy="171" rx="54" ry="13" fill="#34435a" stroke="#88e5eb" stroke-width="5"/><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Barrier method</text></g><g transform="translate(370,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">B · Copper IUD</text><path d="M123 86 L237 86" fill="none" stroke="#f2cc77" stroke-width="13" stroke-linecap="round"/><path d="M180 87 L180 170" fill="none" stroke="#88e5eb" stroke-width="13" stroke-linecap="round"/><path d="M173 105 L187 105" fill="none" stroke="#f2cc77" stroke-width="3" stroke-linecap="round"/><path d="M173 114 L187 114" fill="none" stroke="#f2cc77" stroke-width="3" stroke-linecap="round"/><path d="M173 123 L187 123" fill="none" stroke="#f2cc77" stroke-width="3" stroke-linecap="round"/><path d="M173 132 L187 132" fill="none" stroke="#f2cc77" stroke-width="3" stroke-linecap="round"/><path d="M173 141 L187 141" fill="none" stroke="#f2cc77" stroke-width="3" stroke-linecap="round"/><path d="M173 150 L187 150" fill="none" stroke="#f2cc77" stroke-width="3" stroke-linecap="round"/><path d="M173 159 L187 159" fill="none" stroke="#f2cc77" stroke-width="3" stroke-linecap="round"/><path d="M173 168 L187 168" fill="none" stroke="#f2cc77" stroke-width="3" stroke-linecap="round"/><path d="M179 173 Q180 194 169 202 M184 173 Q189 194 181 204" fill="none" stroke="#88e5eb" stroke-width="2"/><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Placed inside the uterus</text></g><g transform="translate(0,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">C · Combined pill</text><rect x="105" y="51" width="150" height="154" rx="12" fill="#394967"/><circle cx="130" cy="78" r="12" fill="#f2cc77"/><circle cx="130" cy="118" r="12" fill="#f2cc77"/><circle cx="130" cy="158" r="12" fill="#bcabfb"/><circle cx="180" cy="78" r="12" fill="#f2cc77"/><circle cx="180" cy="118" r="12" fill="#f2cc77"/><circle cx="180" cy="158" r="12" fill="#bcabfb"/><circle cx="230" cy="78" r="12" fill="#f2cc77"/><circle cx="230" cy="118" r="12" fill="#f2cc77"/><circle cx="230" cy="158" r="12" fill="#bcabfb"/><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Estrogen + progestin</text></g><g transform="translate(370,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">D · Sterilization</text><path d="M112 170 Q125 96 180 96 Q235 96 248 170" fill="none" stroke="#f6a6c5" stroke-width="13"/><rect x="118" y="114" width="23" height="18" rx="3" fill="#f2cc77"/><rect x="220" y="114" width="23" height="18" rx="3" fill="#f2cc77"/><text x="180" y="193" fill="#f2cc77" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">PERMANENT</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Counsel for a lasting choice</text></g></svg>