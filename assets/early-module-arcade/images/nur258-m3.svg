<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 530" role="img"><title>nur258-m3 study reference</title><desc>A shows IgE and a mast cell releasing mediators; B shows antibodies targeting a cell; C shows complexes depositing in tissue; D shows a T-cell response.</desc><g transform="translate(0,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">A · Mast-cell mediators</text><circle cx="171" cy="125" r="49" fill="#bcabfb"/><text x="171" y="132" fill="#10182f" font-size="17" text-anchor="middle" font-family="Arial,sans-serif">Mast cell</text><circle cx="110" cy="80" r="5" fill="#f2cc77"/><circle cx="231" cy="85" r="5" fill="#f2cc77"/><circle cx="239" cy="145" r="5" fill="#f2cc77"/><circle cx="127" cy="185" r="5" fill="#f2cc77"/><circle cx="248" cy="179" r="5" fill="#f2cc77"/><text x="171" y="60" fill="#f2cc77" font-size="18" text-anchor="middle" font-family="Arial,sans-serif">IgE</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">IgE-associated activation</text></g><g transform="translate(370,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">B · Antibody targets a cell</text><circle cx="180" cy="124" r="49" fill="#f6a6c5"/><path d="M112 110 l-10 -12 m10 12 l10 -12 m-10 12 v20" fill="none" stroke="#f2cc77" stroke-width="4"/><path d="M246 110 l-10 -12 m10 12 l10 -12 m-10 12 v20" fill="none" stroke="#f2cc77" stroke-width="4"/><path d="M180 63 l-10 -12 m10 12 l10 -12 m-10 12 v20" fill="none" stroke="#f2cc77" stroke-width="4"/><text x="180" y="131" fill="#10182f" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">Cell</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">A cell or tissue is the target</text></g><g transform="translate(0,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">C · Complexes deposit</text><rect x="63" y="149" width="234" height="43" rx="5" fill="#496c77"/><circle cx="98" cy="129" r="11" fill="#f6a6c5"/><path d="M98 145 v-13 m0 1 l-12 -12 m12 12 l12 -12" fill="none" stroke="#f2cc77" stroke-width="4"/><circle cx="149" cy="129" r="11" fill="#f6a6c5"/><path d="M149 145 v-13 m0 1 l-12 -12 m12 12 l12 -12" fill="none" stroke="#f2cc77" stroke-width="4"/><circle cx="200" cy="129" r="11" fill="#f6a6c5"/><path d="M200 145 v-13 m0 1 l-12 -12 m12 12 l12 -12" fill="none" stroke="#f2cc77" stroke-width="4"/><circle cx="251" cy="129" r="11" fill="#f6a6c5"/><path d="M251 145 v-13 m0 1 l-12 -12 m12 12 l12 -12" fill="none" stroke="#f2cc77" stroke-width="4"/><text x="180" y="177" fill="#fff" font-size="18" text-anchor="middle" font-family="Arial,sans-serif">Tissue</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Antigen–antibody complexes</text></g><g transform="translate(370,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">D · T-cell response</text><circle cx="118" cy="113" r="38" fill="#83dfbe"/><text x="118" y="120" fill="#10182f" font-size="18" text-anchor="middle" font-family="Arial,sans-serif">T cell</text><path d="M169 113 L218 113" fill="none" stroke="#88e5eb" stroke-width="4" stroke-linecap="round"/><path d="M211 102 L231 113 L211 124" fill="#88e5eb"/><rect x="239" y="77" width="66" height="72" rx="14" fill="#bcabfb"/><text x="180" y="193" fill="#f2cc77" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">Delayed response</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">T cel