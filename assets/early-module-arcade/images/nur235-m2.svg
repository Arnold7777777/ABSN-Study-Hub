<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 530" role="img"><title>nur235-m2 study reference</title><desc>Setup A shows back sleeping on a bare firm flat surface. Setup B includes a pillow and loose blanket. Other panels depict a hidden toy and an upward growth trend.</desc><g transform="translate(0,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Setup A</text><rect x="68" y="64" width="224" height="135" rx="12" fill="#647588"/><rect x="78" y="75" width="204" height="109" rx="3" fill="#d3e1e3"/><circle cx="178" cy="95" r="15" fill="#efc5a6"/><path d="M153 113 Q178 99 203 113 L178 172 Z" fill="#bcabfb" stroke="#e7dbff" stroke-width="2"/><path d="M67 195 L67 211" fill="none" stroke="#88e5eb" stroke-width="6" stroke-linecap="round"/><path d="M293 195 L293 211" fill="none" stroke="#88e5eb" stroke-width="6" stroke-linecap="round"/><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Back · firm · flat · bare</text></g><g transform="translate(370,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Setup B</text><rect x="68" y="64" width="224" height="135" rx="12" fill="#647588"/><rect x="78" y="75" width="204" height="109" rx="3" fill="#d3e1e3"/><circle cx="178" cy="95" r="15" fill="#efc5a6"/><path d="M153 113 Q178 99 203 113 L178 172 Z" fill="#bcabfb" stroke="#e7dbff" stroke-width="2"/><rect x="128" y="77" width="102" height="30" rx="14" fill="#f6a6c5"/><path d="M81 158 Q138 134 188 159 Q237 144 279 160 V183 H81 Z" fill="#f2cc77"/><path d="M67 195 L67 211" fill="none" stroke="#88e5eb" stroke-width="6" stroke-linecap="round"/><path d="M293 195 L293 211" fill="none" stroke="#88e5eb" stroke-width="6" stroke-linecap="round"/><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Pillow and loose bedding present</text></g><g transform="translate(0,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">A hidden toy still exists</text><rect x="94" y="132" width="169" height="45" rx="12" fill="#bcabfb"/><circle cx="180" cy="153" r="24" fill="#f2cc77"/><path d="M77 171 Q180 95 283 171" fill="#69aaba" opacity=".9"/><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Object permanence</text></g><g transform="translate(370,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Watch growth over time</text><path d="M74 187 L288 187" fill="none" stroke="#88e5eb" stroke-width="3" stroke-linecap="round"/><path d="M74 187 L74 65" fill="none" stroke="#88e5eb" stroke-width="3" stroke-linecap="round"/><path d="M85 172 L147 145 L215 116 L277 72" fill="none" stroke="#83dfbe" stroke-width="5"/><text x="183" y="210" fill="#88e5eb" font-size="18" text-anchor="middle" font-family="Arial,sans-serif">Age →</text><text x="20" y="226" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">A trend matters more than one</text><text x="20" y="246" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">point</text></g></svg>