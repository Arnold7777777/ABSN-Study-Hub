<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 530" role="img"><title>nur234-m3 study reference</title><desc>Client-reported nausea, a positive hCG test, a fetus on ultrasound and five separate GTPAL counters illustrate different kinds of evidence.</desc><g transform="translate(0,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Client reports a change</text><g transform="translate(105 70) scale(0.9)"><circle cx="0" cy="0" r="15" fill="#efc5a6"/><rect x="-19" y="19" width="38" height="50" rx="12" fill="#bcabfb"/><path d="M-8 65 L-12 103" fill="none" stroke="#bcabfb" stroke-width="11" stroke-linecap="round"/><path d="M8 65 L12 103" fill="none" stroke="#bcabfb" stroke-width="11" stroke-linecap="round"/><path d="M-19 29 L-35 61" fill="none" stroke="#bcabfb" stroke-width="9" stroke-linecap="round"/><path d="M19 29 L35 61" fill="none" stroke="#bcabfb" stroke-width="9" stroke-linecap="round"/></g><rect x="162" y="73" width="162" height="70" rx="12" fill="#334765"/><text x="243" y="103" fill="#f5f3ff" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">“I feel</text><text x="243" y="132" fill="#f5f3ff" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">nauseated.”</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Subjective evidence</text></g><g transform="translate(370,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">A test detects hCG</text><rect x="101" y="102" width="160" height="42" rx="12" fill="#d6e6ea"/><rect x="159" y="111" width="70" height="22" rx="4" fill="#285466"/><path d="M176 113 L176 129" fill="none" stroke="#f6a6c5" stroke-width="4" stroke-linecap="round"/><path d="M202 113 L202 129" fill="none" stroke="#f6a6c5" stroke-width="4" stroke-linecap="round"/><text x="180" y="184" fill="#f2cc77" font-size="21" text-anchor="middle" font-family="Arial,sans-serif">hCG detected</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Objective, not definitive</text></g><g transform="translate(0,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Evidence of the fetus</text><rect x="92" y="60" width="177" height="127" rx="12" fill="#456884"/><rect x="101" y="68" width="159" height="109" rx="6" fill="#070f21"/><circle cx="180" cy="85" r="15" fill="#efc5a6"/><path d="M155 103 Q180 89 205 103 L180 162 Z" fill="#bcabfb" stroke="#e7dbff" stroke-width="2"/><path d="M178 188 L178 205" fill="none" stroke="#88e5eb" stroke-width="8" stroke-linecap="round"/><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Fetus seen on ultrasound</text></g><g transform="translate(370,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">G · T · P · A · L</text><circle cx="58" cy="121" r="25" fill="#88e5eb"/><text x="58" y="128" fill="#10182f" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">G</text><circle cx="119" cy="121" r="25" fill="#f6a6c5"/><text x="119" y="128" fill="#10182f" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">T</text><circle cx="180" cy="121" r="25" fill="#f2cc77"/><text x="180" y="128" fill="#10182f" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">P</text><circle cx="241" cy="121" r="25" fill="#83dfbe"/><text x="241" y="128" fill="#10182f" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">A</text><circle cx="302" cy="121" r="25" fill="#bcabfb"/><text x="302" y="128" fill="#10182f" font-size="20" text-anchor="middle" font-family="Arial,sans-serif">L</text><text x="180" y="185" fill="#f2cc77" font-size="17" text-anchor="middle" font-family="Arial,sans-serif">Pregnancies ≠ number of babies</text><text x="20" y="226" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Count birth events and living</text><text x="20" y="246" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">children</text></g></svg>