<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 530" role="img"><title>nur258-m2 study reference</title><desc>Airborne room with inward airflow and N95, a procedure mask for droplet precautions, a protective gown for contact precautions, and standard precautions for every client.</desc><g transform="translate(0,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Airborne route</text><rect x="100" y="54" width="150" height="155" rx="5" fill="#30435e"/><rect x="119" y="73" width="114" height="62" rx="3" fill="#11182e"/><text x="175" y="109" fill="#88e5eb" font-size="25" text-anchor="middle" font-family="Arial,sans-serif">N95</text><path d="M64 169 L140 169" fill="none" stroke="#88e5eb" stroke-width="4" stroke-linecap="round"/><path d="M129 159 L149 169 L129 179" fill="#88e5eb"/><text x="20" y="226" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Air flows into a negative-pressure</text><text x="20" y="246" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">room</text></g><g transform="translate(370,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Droplet route</text><path d="M112 84 Q180 110 248 84 L235 155 Q180 180 125 155 Z" fill="#88e5eb"/><path d="M124 116 L235 116" fill="none" stroke="#476876" stroke-width="2" stroke-linecap="round"/><path d="M128 135 L231 135" fill="none" stroke="#476876" stroke-width="2" stroke-linecap="round"/><text x="180" y="199" fill="#88e5eb" font-size="21" text-anchor="middle" font-family="Arial,sans-serif">Mask</text><text x="20" y="226" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Follow the indicated added</text><text x="20" y="246" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">precautions</text></g><g transform="translate(0,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Contact route</text><path d="M125 61 L160 48 H200 L235 61 L263 118 L233 134 L218 106 V194 H142 V106 L127 134 L97 118 Z" fill="#bcabfb"/><path d="M180 57 L180 184" fill="none" stroke="#72698a" stroke-width="3" stroke-linecap="round"/><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Gown / gloves as indicated</text></g><g transform="translate(370,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Standard precautions</text><circle cx="180" cy="123" r="64" fill="#26434e"/><text x="180" y="113" fill="#83dfbe" font-size="25" text-anchor="middle" font-family="Arial,sans-serif">EVERY</text><text x="180" y="150" fill="#83dfbe" font-size="25" text-anchor="middle" font-family="Arial,sans-serif">CLIENT</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Hand hygiene + exposure-based PPE</text></g></svg>