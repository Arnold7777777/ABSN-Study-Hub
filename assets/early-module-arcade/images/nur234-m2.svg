<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 530" role="img"><title>nur234-m2 study reference</title><desc>The umbilical vein points from placenta to fetus; two arteries point back. A cord cross-section shows three vessels inside jelly. A fetus is surrounded by amniotic fluid.</desc><g transform="translate(0,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Cord · toward the fetus</text><rect x="35" y="74" width="75" height="110" rx="28" fill="#f6a6c5"/><text x="72" y="210" fill="#f5f3ff" font-size="16" text-anchor="middle" font-family="Arial,sans-serif">Placenta</text><circle cx="290" cy="92" r="15" fill="#efc5a6"/><path d="M265 110 Q290 96 315 110 L290 169 Z" fill="#bcabfb" stroke="#e7dbff" stroke-width="2"/><path d="M122 119 L245 119" fill="none" stroke="#f6a6c5" stroke-width="10" stroke-linecap="round"/><path d="M230 105 L252 119 L230 133 Z" fill="#f6a6c5"/><text x="182" y="88" fill="#f6a6c5" font-size="18" text-anchor="middle" font-family="Arial,sans-serif">1 vein</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Oxygenated blood travels in</text></g><g transform="translate(370,0)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Cord · away from fetus</text><rect x="35" y="74" width="75" height="110" rx="28" fill="#f6a6c5"/><text x="72" y="210" fill="#f5f3ff" font-size="16" text-anchor="middle" font-family="Arial,sans-serif">Placenta</text><circle cx="290" cy="92" r="15" fill="#efc5a6"/><path d="M265 110 Q290 96 315 110 L290 169 Z" fill="#bcabfb" stroke="#e7dbff" stroke-width="2"/><path d="M125 106 L245 106" fill="none" stroke="#88e5eb" stroke-width="6" stroke-linecap="round"/><path d="M125 144 L245 144" fill="none" stroke="#88e5eb" stroke-width="6" stroke-linecap="round"/><path d="M139 93 L118 106 L139 119 M139 131 L118 144 L139 157" fill="#88e5eb"/><text x="182" y="76" fill="#88e5eb" font-size="18" text-anchor="middle" font-family="Arial,sans-serif">2 arteries</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Blood returns to the placenta</text></g><g transform="translate(0,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Cross-section of the cord</text><circle cx="180" cy="127" r="70" fill="#535173"/><circle cx="149" cy="126" r="21" fill="#88e5eb"/><circle cx="207" cy="112" r="21" fill="#88e5eb"/><circle cx="191" cy="159" r="26" fill="#f6a6c5"/><path d="M237 171 L282 186" fill="none" stroke="#f2cc77" stroke-width="2" stroke-linecap="round"/><text x="283" y="204" fill="#f2cc77" font-size="16" text-anchor="middle" font-family="Arial,sans-serif">Jelly</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Wharton’s jelly surrounds vessels</text></g><g transform="translate(370,270)"><rect x="4" y="4" width="352" height="252" rx="18" fill="#192743"/><text x="20" y="32" fill="#f2cc77" font-size="20" text-anchor="start" font-family="Arial,sans-serif">Fluid around the fetus</text><ellipse cx="180" cy="130" rx="99" ry="76" fill="#224b60" stroke="#88e5eb" stroke-width="3"/><circle cx="180" cy="86" r="15" fill="#efc5a6"/><path d="M155 104 Q180 90 205 104 L180 163 Z" fill="#bcabfb" stroke="#e7dbff" stroke-width="2"/><text x="180" y="211" fill="#88e5eb" font-size="17" text-anchor="middle" font-family="Arial,sans-serif">Amniotic sac</text><text x="20" y="235" fill="#dbe5f5" font-size="17" text-anchor="start" font-family="Arial,sans-serif">Amniotic fluid cushions movement</text></g></svg>