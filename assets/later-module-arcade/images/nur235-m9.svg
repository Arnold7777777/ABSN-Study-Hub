<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" role="img" aria-labelledby="title desc"><title id="title">Follow the Blood Flow</title><desc id="desc">Simplified labeled teaching schematic for Follow the Blood Flow. Not to scale.</desc><rect width="360" height="310" rx="20" fill="#101b34"/><g font-family="system-ui,Segoe UI,sans-serif"><rect x="29" y="73" width="127" height="42" rx="12" fill="#172d49" stroke="#e0b3ff" stroke-width="2"/><text x="92.5" y="99.0" font-size="15" fill="#eff5ff" text-anchor="middle">Body → veins</text><path d="M92 116 L92 143" fill="none" stroke="#e0b3ff" stroke-width="3"/><text x="108" y="137" font-size="19" fill="#e0b3ff" text-anchor="middle">↓</text><rect x="29" y="144" width="127" height="42" rx="12" fill="#172d49" stroke="#e0b3ff" stroke-width="2"/><text x="92.5" y="170.0" font-size="15" fill="#eff5ff" text-anchor="middle">Right atrium</text><path d="M92 187 L92 213" fill="none" stroke="#e0b3ff" stroke-width="3"/><text x="108" y="209" font-size="19" fill="#e0b3ff" text-anchor="middle">↓</text><rect x="29" y="214" width="127" height="42" rx="12" fill="#172d49" stroke="#e0b3ff" stroke-width="2"/><text x="92.5" y="240.0" font-size="15" fill="#eff5ff" text-anchor="middle">Right ventricle</text><rect x="204" y="214" width="127" height="42" rx="12" fill="#172d49" stroke="#88e7e2" stroke-width="2"/><text x="267.5" y="240.0" font-size="15" fill="#eff5ff" text-anchor="middle">Lungs</text><path d="M158 235 H201" fill="none" stroke="#f7cb70" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="180" y="226" font-size="22" fill="#f7cb70" text-anchor="middle">→</text><rect x="204" y="144" width="127" height="42" rx="12" fill="#172d49" stroke="#88e7e2" stroke-width="2"/><text x="267.5" y="170.0" font-size="15" fill="#eff5ff" text-anchor="middle">Left atrium</text><text x="267" y="211" font-size="22" fill="#88e7e2" text-anchor="middle">↑</text><rect x="204" y="73" width="127" height="42" rx="12" fill="#172d49" stroke="#88e7e2" stroke-width="2"/><text x="267.5" y="99.0" font-size="15" fill="#eff5ff" text-anchor="middle">Left ventricle</text><text x="267" y="140" font-size="22" fill="#88e7e2" text-anchor="middle">↑</text><text x="180" y="50" font-size="15" fill="#f7cb70" text-anchor="middle">Aorta → body</text><path d="M267 73 V52 H224" fill="none" stroke="#f7cb70" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="180" y="282" font-size="12" fill="#eff5ff" text-anchor="middle">Pulmonary artery: right heart → lungs</text></g></svg>