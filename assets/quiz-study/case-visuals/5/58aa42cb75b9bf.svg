<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A nurse notices that an open-system enteral formula bag for a 55-year-old client has been hanging at the bedside for 14 hours, and the client has begun having foul-smelling diarrhea and a low-grade fever. Which of the following actions should the nurse take?</title><desc>BACTERIAL CONTAMINATION from excessive HANG TIME is a classic cause of diarrhea; open-system formula is limited to about 4 to 8 hours, and bag and tubing are changed every 24 hours with clean technique and clear date and time labeling. Topping off an old bag spreads contamination, icing does not kill bacteria and cold formula worsens diarrhea, and jumping to TPN is far beyond the problem.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Causes of Diarrhea with Enteral</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">(G-Tube) Feedings</text><rect x="23" y="139" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse notices that an open-system</text><text x="41" y="231" fill="#f6faf5" font-size="21">enteral formula bag for a 55-year-old</text><text x="41" y="258" fill="#f6faf5" font-size="21">client has been hanging at the bedside for</text><text x="41" y="285" fill="#f6faf5" font-size="21">14 hours, and the client has begun having</text><text x="41" y="312" fill="#f6faf5" font-size="21">foul-smelling diarrhea and a low-grade</text><text x="41" y="339" fill="#f6faf5" font-size="21">fever.</text><path d="M319 363v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="379" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 392) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="413" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="444" fill="#f6faf5" font-size="21">Discard the formula, change the bag and</text><text x="41" y="471" fill="#f6faf5" font-size="21">tubing, and hang fresh formula labeled</text><text x="41" y="498" fill="#f6faf5" font-size="21">with the date and time.</text><path d="M319 522v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="538" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 551) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="572" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="603" fill="#f6faf5" font-size="21">BACTERIAL CONTAMINATION from excessive</text><text x="41" y="630" fill="#f6faf5" font-size="21">HANG TIME is a classic cause of diarrhea;</text></g></svg>