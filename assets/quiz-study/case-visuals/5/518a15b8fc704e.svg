<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>After a marathon, a client has diaphoresis and weakness. Sodium 129 (135-145), potassium 3.6 (3.5-5.0). Which prescriptions should the nurse anticipate? (SATA)</title><desc>The problem is hyponatremia (Na 129); potassium is normal, so don&#x27;t treat it. Correct what&#x27;s abnormal: 0.9% NS and high-sodium foods raise sodium; seizure precautions because low sodium risks seizures; monitor I&amp;O. Skip KCl and hypotonic 0.45% NS.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">After a marathon, a client has diaphoresis</text><text x="41" y="198" fill="#f6faf5" font-size="21">and weakness. Sodium 129 (135-145),</text><text x="41" y="225" fill="#f6faf5" font-size="21">potassium 3.6 (3.5-5.0). Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">prescriptions should the nurse anticipate?</text><text x="41" y="279" fill="#f6faf5" font-size="21">(SATA)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Administer 0.9% sodium chloride IV ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Initiate seizure precautions · Provide</text><text x="41" y="438" fill="#f6faf5" font-size="21">high-sodium foods · Closely monitor intake</text><text x="41" y="465" fill="#f6faf5" font-size="21">and output</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">The problem is hyponatremia (Na 129);</text><text x="41" y="597" fill="#f6faf5" font-size="21">potassium is normal, so don&#x27;t treat it.</text><text x="41" y="624" fill="#f6faf5" font-size="21">Correct what&#x27;s abnormal: 0.9% NS and high-</text><text x="41" y="651" fill="#f6faf5" font-size="21">sodium foods raise sodium; seizure</text><text x="41" y="678" fill="#f6faf5" font-size="21">precautions because low sodium risks</text><text x="41" y="705" fill="#f6faf5" font-size="21">seizures; monitor I&amp;O. Skip KCl and</text><text x="41" y="732" fill="#f6faf5" font-size="21">hypotonic 0.45% NS.</text></g></svg>