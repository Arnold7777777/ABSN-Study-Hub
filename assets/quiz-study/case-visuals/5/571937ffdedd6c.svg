<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is caring for a client who is at 14 weeks of gestation and has hyperemesis gravidarum. Which findings are risk factors? Select all that apply.</title><desc>Hyperemesis tracks with high hCG levels and a first or young pregnancy : multifetal gestation and molar pregnancy raise hCG, and obesity, age under 30 and a previous episode all raise the risk. Grand multiparity and smoking are not risk factors - smoking is actually associated with a lower rate.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client who is at</text><text x="41" y="198" fill="#f6faf5" font-size="21">14 weeks of gestation and has hyperemesis</text><text x="41" y="225" fill="#f6faf5" font-size="21">gravidarum. Which findings are risk</text><text x="41" y="252" fill="#f6faf5" font-size="21">factors? Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Obesity · Multifetal pregnancy · Age</text><text x="41" y="384" fill="#f6faf5" font-size="21">younger than 30 years · A history of</text><text x="41" y="411" fill="#f6faf5" font-size="21">hyperemesis in a prior pregnancy</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Hyperemesis tracks with high hCG levels</text><text x="41" y="543" fill="#f6faf5" font-size="21">and a first or young pregnancy :</text><text x="41" y="570" fill="#f6faf5" font-size="21">multifetal gestation and molar pregnancy</text><text x="41" y="597" fill="#f6faf5" font-size="21">raise hCG, and obesity, age under 30 and a</text><text x="41" y="624" fill="#f6faf5" font-size="21">previous episode all raise the risk. Grand</text><text x="41" y="651" fill="#f6faf5" font-size="21">multiparity and smoking are not risk</text><text x="41" y="678" fill="#f6faf5" font-size="21">factors - smoking is actually associated</text><text x="41" y="705" fill="#f6faf5" font-size="21">with a lower rate.</text></g></svg>