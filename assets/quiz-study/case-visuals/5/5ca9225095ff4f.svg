<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A fetus is in an occiput posterior position and the client reports severe back pain. Which measure should the nurse use?</title><desc>Counter-pressure on the sacrum relieves the pain of the fetal head pressing against it. Position changes help rotate the baby too - which is why a client at 8 cm in an occiput posterior position is helped onto her hands and knees .</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A fetus is in an occiput posterior</text><text x="41" y="198" fill="#f6faf5" font-size="21">position and the client reports severe</text><text x="41" y="225" fill="#f6faf5" font-size="21">back pain. Which measure should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">use?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Sacral counter-pressure</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Counter-pressure on the sacrum relieves</text><text x="41" y="489" fill="#f6faf5" font-size="21">the pain of the fetal head pressing</text><text x="41" y="516" fill="#f6faf5" font-size="21">against it. Position changes help rotate</text><text x="41" y="543" fill="#f6faf5" font-size="21">the baby too - which is why a client at 8</text><text x="41" y="570" fill="#f6faf5" font-size="21">cm in an occiput posterior position is</text><text x="41" y="597" fill="#f6faf5" font-size="21">helped onto her hands and knees .</text></g></svg>