<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which response by a client at 8 weeks of gestation indicates an understanding of teaching?</title><desc>Leukorrhea - a thin white discharge - is normal and comes from the rise in estrogen and progesterone. She reports it only if it itches, smells or changes color . For the timings: quickening at 16 to 20 weeks in a first pregnancy, and the abdomen begins to show around 14 weeks .</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which response by a client at 8 weeks of</text><text x="41" y="198" fill="#f6faf5" font-size="21">gestation indicates an understanding of</text><text x="41" y="225" fill="#f6faf5" font-size="21">teaching?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">“I can expect a white vaginal discharge</text><text x="41" y="357" fill="#f6faf5" font-size="21">through the pregnancy.”</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Leukorrhea - a thin white discharge - is</text><text x="41" y="489" fill="#f6faf5" font-size="21">normal and comes from the rise in estrogen</text><text x="41" y="516" fill="#f6faf5" font-size="21">and progesterone. She reports it only if</text><text x="41" y="543" fill="#f6faf5" font-size="21">it itches, smells or changes color . For</text><text x="41" y="570" fill="#f6faf5" font-size="21">the timings: quickening at 16 to 20 weeks</text><text x="41" y="597" fill="#f6faf5" font-size="21">in a first pregnancy, and the abdomen</text><text x="41" y="624" fill="#f6faf5" font-size="21">begins to show around 14 weeks .</text></g></svg>