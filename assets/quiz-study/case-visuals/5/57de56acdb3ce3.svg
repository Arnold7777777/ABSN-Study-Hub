<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is preparing to administer an oral medication. Which of the following actions should the nurse take? (Select all that apply.)</title><desc>Education, checking the expiration date, verifying the dose and asking about allergies are all part of safe administration. Calling a client by name is not an acceptable way to identify them. Someone who is confused, hard of hearing, or simply trying to be helpful will answer to a name that is not theirs. Two identifiers are required, and the client states their own name and date of birth — you do not supply it for them.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Rights of Med Admin</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to administer an oral</text><text x="41" y="198" fill="#f6faf5" font-size="21">medication. Which of the following actions</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse take? (Select all that</text><text x="41" y="252" fill="#f6faf5" font-size="21">apply.)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Provide client education about the</text><text x="41" y="384" fill="#f6faf5" font-size="21">medication · Check the expiration date of</text><text x="41" y="411" fill="#f6faf5" font-size="21">the medication · Verify the dosage of the</text><text x="41" y="438" fill="#f6faf5" font-size="21">medication · Ask the client if they have</text><text x="41" y="465" fill="#f6faf5" font-size="21">any allergies</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Education, checking the expiration date,</text><text x="41" y="597" fill="#f6faf5" font-size="21">verifying the dose and asking about</text><text x="41" y="624" fill="#f6faf5" font-size="21">allergies are all part of safe</text><text x="41" y="651" fill="#f6faf5" font-size="21">administration.</text></g></svg>