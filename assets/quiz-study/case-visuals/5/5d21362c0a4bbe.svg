<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client has a respiratory rate of 32/min, SpO2 98% on 2 L/min nasal cannula, PaCO2 38 mmHg, and is alert and oriented. Which finding BEST indicates adequate ventilation?</title><desc>Ventilation is judged by CO2, and a PaCO2 of 38 is normal, meaning air is moving in and out effectively. SpO2 is tempting but it measures oxygenation, not ventilation — a client can have a perfect saturation while retaining CO2.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Acute Respiratory Failure</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has a respiratory rate of 32/min,</text><text x="41" y="198" fill="#f6faf5" font-size="21">SpO2 98% on 2 L/min nasal cannula, PaCO2</text><text x="41" y="225" fill="#f6faf5" font-size="21">38 mmHg, and is alert and oriented. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">finding BEST indicates adequate</text><text x="41" y="279" fill="#f6faf5" font-size="21">ventilation?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">The PaCO2 of 38 mmHg</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Ventilation is judged by CO2, and a PaCO2</text><text x="41" y="516" fill="#f6faf5" font-size="21">of 38 is normal, meaning air is moving in</text><text x="41" y="543" fill="#f6faf5" font-size="21">and out effectively. SpO2 is tempting but</text><text x="41" y="570" fill="#f6faf5" font-size="21">it measures oxygenation, not ventilation —</text><text x="41" y="597" fill="#f6faf5" font-size="21">a client can have a perfect saturation</text><text x="41" y="624" fill="#f6faf5" font-size="21">while retaining CO2.</text></g></svg>