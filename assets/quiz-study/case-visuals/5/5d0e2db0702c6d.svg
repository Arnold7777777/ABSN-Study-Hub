<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>What should be taught to a client with a new ostomy? Select all that apply.</title><desc>Chew well, avoid gas producers, skip high fiber for the first 6 to 8 weeks, empty at one-half to one-third full and change every 3 to 7 days with a good skin barrier. Only SIGMOID colostomies are irrigated for regulation — not the others.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">New Ostomy Teaching</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">What should be taught to a client with a</text><text x="41" y="198" fill="#f6faf5" font-size="21">new ostomy? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Chew food thoroughly · Avoid foods that</text><text x="41" y="330" fill="#f6faf5" font-size="21">cause gas · Avoid high-fiber foods for the</text><text x="41" y="357" fill="#f6faf5" font-size="21">first 6 to 8 weeks · Empty the pouch when</text><text x="41" y="384" fill="#f6faf5" font-size="21">it is one-half to one-third full · Change</text><text x="41" y="411" fill="#f6faf5" font-size="21">the pouch every 3 to…</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Chew well, avoid gas producers, skip high</text><text x="41" y="543" fill="#f6faf5" font-size="21">fiber for the first 6 to 8 weeks, empty at</text><text x="41" y="570" fill="#f6faf5" font-size="21">one-half to one-third full and change</text><text x="41" y="597" fill="#f6faf5" font-size="21">every 3 to 7 days with a good skin</text><text x="41" y="624" fill="#f6faf5" font-size="21">barrier. Only SIGMOID colostomies are</text><text x="41" y="651" fill="#f6faf5" font-size="21">irrigated for regulation — not the others.</text></g></svg>