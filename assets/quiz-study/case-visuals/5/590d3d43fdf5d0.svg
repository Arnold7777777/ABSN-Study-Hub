<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is developing a care plan for a client with von Willebrand disease. Which interventions should be included? Select all that apply.</title><desc>Von Willebrand disease is an inherited inability of platelets to form a plug, so the plan is bleeding precautions : no IM injections, soft toothbrush, monitor for and teach the signs of bleeding. Aspirin inhibits platelets and contact sports raise bleeding risk, so both are avoided.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Von Willebrand disease</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is developing a care plan for a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client with von Willebrand disease. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">interventions should be included? Select</text><text x="41" y="252" fill="#f6faf5" font-size="21">all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Avoid intramuscular injections. · Use a</text><text x="41" y="384" fill="#f6faf5" font-size="21">soft-bristled toothbrush. · Monitor for</text><text x="41" y="411" fill="#f6faf5" font-size="21">hematuria and melena. · Educate on signs</text><text x="41" y="438" fill="#f6faf5" font-size="21">of internal bleeding.</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Von Willebrand disease is an inherited</text><text x="41" y="570" fill="#f6faf5" font-size="21">inability of platelets to form a plug, so</text><text x="41" y="597" fill="#f6faf5" font-size="21">the plan is bleeding precautions : no IM</text><text x="41" y="624" fill="#f6faf5" font-size="21">injections, soft toothbrush, monitor for</text><text x="41" y="651" fill="#f6faf5" font-size="21">and teach the signs of bleeding. Aspirin</text><text x="41" y="678" fill="#f6faf5" font-size="21">inhibits platelets and contact sports</text><text x="41" y="705" fill="#f6faf5" font-size="21">raise bleeding risk, so both are avoided.</text></g></svg>