<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A nurse is planning care for a client with panic disorder. Which outcome is most appropriate?</title><desc>Demonstrating a technique that shortens an attack is observable, achievable, and directly builds self-efficacy . Staying with the client is the tempting distractor because presence is genuinely therapeutic during panic, but it describes the nurse, not the client, and does not build skill. Never having another attack is unrealistic, and being able to explain physiology does not mean the client can manage an attack.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anxiety: Panic Disorder</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is planning care for a client with</text><text x="41" y="198" fill="#f6faf5" font-size="21">panic disorder. Which outcome is most</text><text x="41" y="225" fill="#f6faf5" font-size="21">appropriate?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The client will demonstrate a breathing</text><text x="41" y="357" fill="#f6faf5" font-size="21">technique that reduces panic symptoms</text><text x="41" y="384" fill="#f6faf5" font-size="21">within 10 minutes of onset</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Demonstrating a technique that shortens an</text><text x="41" y="516" fill="#f6faf5" font-size="21">attack is observable, achievable, and</text><text x="41" y="543" fill="#f6faf5" font-size="21">directly builds self-efficacy .</text></g></svg>