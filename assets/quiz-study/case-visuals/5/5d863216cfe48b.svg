<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which interventions reduce the risk of CAUTI? (SATA)</title><desc>Bundle = bag below bladder, early removal, no kinks, peri-care. Prophylactic antibiotics and routine irrigation are NOT done; monitoring fever detects but doesn&#x27;t prevent.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which interventions reduce the risk of</text><text x="41" y="198" fill="#f6faf5" font-size="21">CAUTI? (SATA)</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Keep bag below bladder level · Remove</text><text x="41" y="330" fill="#f6faf5" font-size="21">catheter as soon as not needed · Keep</text><text x="41" y="357" fill="#f6faf5" font-size="21">tubing straight/unkinked · Perineal care</text><text x="41" y="384" fill="#f6faf5" font-size="21">every shift &amp; PRN</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Bundle = bag below bladder, early removal,</text><text x="41" y="516" fill="#f6faf5" font-size="21">no kinks, peri-care. Prophylactic</text><text x="41" y="543" fill="#f6faf5" font-size="21">antibiotics and routine irrigation are NOT</text><text x="41" y="570" fill="#f6faf5" font-size="21">done; monitoring fever detects but doesn&#x27;t</text><text x="41" y="597" fill="#f6faf5" font-size="21">prevent.</text></g></svg>