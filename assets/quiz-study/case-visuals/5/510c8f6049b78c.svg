<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A nurse is giving erythromycin eye ointment to a newborn. Which action is correct?</title><desc>A ribbon of ointment goes into the lower conjunctival sac, inner to outer. It is not rinsed off and never applied to the cornea. It can safely be delayed up to about an hour so the first skin-to-skin contact and eye contact are not interrupted.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Normal Newborn &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Thermoregulation</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is giving erythromycin eye</text><text x="41" y="231" fill="#f6faf5" font-size="21">ointment to a newborn. Which action is</text><text x="41" y="258" fill="#f6faf5" font-size="21">correct?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Apply a ribbon into the lower conjunctival</text><text x="41" y="390" fill="#f6faf5" font-size="21">sac from inner to outer canthus</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">A ribbon of ointment goes into the lower</text><text x="41" y="522" fill="#f6faf5" font-size="21">conjunctival sac, inner to outer. It is</text><text x="41" y="549" fill="#f6faf5" font-size="21">not rinsed off and never applied to the</text><text x="41" y="576" fill="#f6faf5" font-size="21">cornea. It can safely be delayed up to</text><text x="41" y="603" fill="#f6faf5" font-size="21">about an hour so the first skin-to-skin</text><text x="41" y="630" fill="#f6faf5" font-size="21">contact and eye contact are not</text><text x="41" y="657" fill="#f6faf5" font-size="21">interrupted.</text></g></svg>