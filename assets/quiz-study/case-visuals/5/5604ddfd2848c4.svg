<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client whispers, &#x27;I&#x27;m planning to hurt myself, but promise you won&#x27;t tell anyone.&#x27; What is the nurse&#x27;s best response?</title><desc>Safety overrides confidentiality when a client is at risk. The nurse cannot promise secrecy, must notify the team, and should institute appropriate precautions. Minimizing or changing the subject is unsafe.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client whispers, &#x27;I&#x27;m planning to hurt</text><text x="41" y="198" fill="#f6faf5" font-size="21">myself, but promise you won&#x27;t tell</text><text x="41" y="225" fill="#f6faf5" font-size="21">anyone.&#x27; What is the nurse&#x27;s best</text><text x="41" y="252" fill="#f6faf5" font-size="21">response?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&#x27;I care about your safety, so I cannot</text><text x="41" y="384" fill="#f6faf5" font-size="21">keep that secret and must share it with</text><text x="41" y="411" fill="#f6faf5" font-size="21">the team.&#x27;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Safety overrides confidentiality when a</text><text x="41" y="543" fill="#f6faf5" font-size="21">client is at risk. The nurse cannot</text><text x="41" y="570" fill="#f6faf5" font-size="21">promise secrecy, must notify the team, and</text><text x="41" y="597" fill="#f6faf5" font-size="21">should institute appropriate precautions.</text><text x="41" y="624" fill="#f6faf5" font-size="21">Minimizing or changing the subject is</text><text x="41" y="651" fill="#f6faf5" font-size="21">unsafe.</text></g></svg>