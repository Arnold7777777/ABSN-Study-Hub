<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which statement by a client starting antiretroviral therapy shows they need re-teaching?</title><desc>St John&#x27;s wort induces liver enzymes and strips antiretroviral levels , risking treatment failure and resistance - it is contraindicated, and every herbal product needs checking. The other three are all correct, including undetectable = untransmittable , which is now established.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">HIV - prevention &amp; ART</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which statement by a client starting</text><text x="41" y="198" fill="#f6faf5" font-size="21">antiretroviral therapy shows they need re-</text><text x="41" y="225" fill="#f6faf5" font-size="21">teaching?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">“I take St John&#x27;s wort for low mood.”</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">St John&#x27;s wort induces liver enzymes and</text><text x="41" y="462" fill="#f6faf5" font-size="21">strips antiretroviral levels , risking</text><text x="41" y="489" fill="#f6faf5" font-size="21">treatment failure and resistance - it is</text><text x="41" y="516" fill="#f6faf5" font-size="21">contraindicated, and every herbal product</text><text x="41" y="543" fill="#f6faf5" font-size="21">needs checking. The other three are all</text><text x="41" y="570" fill="#f6faf5" font-size="21">correct, including undetectable =</text><text x="41" y="597" fill="#f6faf5" font-size="21">untransmittable , which is now</text><text x="41" y="624" fill="#f6faf5" font-size="21">established.</text></g></svg>