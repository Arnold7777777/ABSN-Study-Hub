<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A Weber test lateralizes to a client&#x27;s right ear, and the Rinne test on the right shows bone conduction lasting longer than air conduction. Which conclusion should the nurse draw?</title><desc>In conductive loss the sound lateralizes to the affected ear and bone conduction exceeds air conduction, because something is blocking sound from reaching the inner ear while bone transmission still works. In sensorineural loss the tone shifts to the better ear and air conduction still exceeds bone conduction, just for a shorter time.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Rinne and Weber</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A Weber test lateralizes to a client&#x27;s</text><text x="41" y="198" fill="#f6faf5" font-size="21">right ear, and the Rinne test on the right</text><text x="41" y="225" fill="#f6faf5" font-size="21">shows bone conduction lasting longer than</text><text x="41" y="252" fill="#f6faf5" font-size="21">air conduction. Which conclusion should</text><text x="41" y="279" fill="#f6faf5" font-size="21">the nurse draw?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Conductive hearing loss in the right ear</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">In conductive loss the sound lateralizes</text><text x="41" y="516" fill="#f6faf5" font-size="21">to the affected ear and bone conduction</text><text x="41" y="543" fill="#f6faf5" font-size="21">exceeds air conduction, because something</text><text x="41" y="570" fill="#f6faf5" font-size="21">is blocking sound from reaching the inner</text><text x="41" y="597" fill="#f6faf5" font-size="21">ear while bone transmission still works.</text></g></svg>