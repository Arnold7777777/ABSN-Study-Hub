<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client reports that her last menstrual period began on June 8 and that her cycles are regular at 28 days. Using Nagele&#x27;s rule, which estimated date of delivery should the nurse calculate?</title><desc>Nagele&#x27;s rule is LMP minus 3 months, plus 7 days, plus 1 year: June 8 becomes March 8, then March 15 . March 8 is the common miss because the 7 days are left off. Because the rule assumes a regular 28-day cycle, the date is an estimate, not a promise.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client reports that her last menstrual</text><text x="41" y="231" fill="#f6faf5" font-size="21">period began on June 8 and that her cycles</text><text x="41" y="258" fill="#f6faf5" font-size="21">are regular at 28 days. Using Nagele&#x27;s</text><text x="41" y="285" fill="#f6faf5" font-size="21">rule, which estimated date of delivery</text><text x="41" y="312" fill="#f6faf5" font-size="21">should the nurse calculate?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">March 15</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Nagele&#x27;s rule is LMP minus 3 months, plus</text><text x="41" y="549" fill="#f6faf5" font-size="21">7 days, plus 1 year: June 8 becomes March</text><text x="41" y="576" fill="#f6faf5" font-size="21">8, then March 15 . March 8 is the common</text><text x="41" y="603" fill="#f6faf5" font-size="21">miss because the 7 days are left off.</text><text x="41" y="630" fill="#f6faf5" font-size="21">Because the rule assumes a regular 28-day</text><text x="41" y="657" fill="#f6faf5" font-size="21">cycle, the date is an estimate, not a</text><text x="41" y="684" fill="#f6faf5" font-size="21">promise.</text></g></svg>