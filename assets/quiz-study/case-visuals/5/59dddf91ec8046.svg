<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse notes that the fluid in the water-seal chamber rises and falls with the client&#x27;s respirations. How should the nurse interpret this?</title><desc>Tidaling is the normal fluctuation of the water-seal fluid with the pressure changes of breathing and confirms the system is patent. An air leak is signaled by continuous bubbling instead, and cessation of tidaling suggests either full lung re-expansion or an obstruction.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Chest Tube Tidaling</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse notes that the fluid in the water-</text><text x="41" y="198" fill="#f6faf5" font-size="21">seal chamber rises and falls with the</text><text x="41" y="225" fill="#f6faf5" font-size="21">client&#x27;s respirations. How should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse interpret this?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">This is tidaling, an expected finding</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Tidaling is the normal fluctuation of the</text><text x="41" y="489" fill="#f6faf5" font-size="21">water-seal fluid with the pressure changes</text><text x="41" y="516" fill="#f6faf5" font-size="21">of breathing and confirms the system is</text><text x="41" y="543" fill="#f6faf5" font-size="21">patent. An air leak is signaled by</text><text x="41" y="570" fill="#f6faf5" font-size="21">continuous bubbling instead, and cessation</text><text x="41" y="597" fill="#f6faf5" font-size="21">of tidaling suggests either full lung re-</text><text x="41" y="624" fill="#f6faf5" font-size="21">expansion or an obstruction.</text></g></svg>