<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="404" viewBox="0 0 640 404"><title>Match the medication emergency to its cause + hallmark.</title><desc>Rigid &amp; slow → NMS. Jumpy &amp; fast → serotonin syndrome. Clozapine → ANC. MAOI → diet.</desc><rect width="640" height="404" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match the medication emergency to its</text><text x="41" y="198" fill="#f6faf5" font-size="21">cause + hallmark.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">Rigid &amp; slow → NMS. Jumpy &amp; fast →</text><text x="41" y="330" fill="#f6faf5" font-size="21">serotonin syndrome. Clozapine → ANC. MAOI</text><text x="41" y="357" fill="#f6faf5" font-size="21">→ diet.</text></g></svg>