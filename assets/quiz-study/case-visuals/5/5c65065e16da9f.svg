<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse helps design a screening program for a rural county. Select all statements that reflect sound screening practice.</title><desc>Screening only helps when early treatment changes the outcome, when positives can actually get follow-up, and when people will agree to the test. A positive screen only signals the need for diagnostic testing, so option three is false. A condition with no detectable early stage cannot be screened for at all.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Epidemiology</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse helps design a screening program</text><text x="41" y="198" fill="#f6faf5" font-size="21">for a rural county. Select all statements</text><text x="41" y="225" fill="#f6faf5" font-size="21">that reflect sound screening practice.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The condition should be treatable, and</text><text x="41" y="357" fill="#f6faf5" font-size="21">earlier treatment should help · A referral</text><text x="41" y="384" fill="#f6faf5" font-size="21">plan must exist for anyone whose result is</text><text x="41" y="411" fill="#f6faf5" font-size="21">positive · The test should be safe, quick,</text><text x="41" y="438" fill="#f6faf5" font-size="21">and acceptable to…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Screening only helps when early treatment</text><text x="41" y="570" fill="#f6faf5" font-size="21">changes the outcome, when positives can</text><text x="41" y="597" fill="#f6faf5" font-size="21">actually get follow-up, and when people</text><text x="41" y="624" fill="#f6faf5" font-size="21">will agree to the test.</text></g></svg>