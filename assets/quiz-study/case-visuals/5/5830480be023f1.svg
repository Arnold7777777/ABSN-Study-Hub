<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>The nurse is caring for a client who is experiencing heart palpitations. Which interventions should the nurse include in the plan of care?</title><desc>Bearing down (Valsalva maneuver) and forceful coughing stimulate the vagus nerve, increasing parasympathetic tone and slowing the heart rate. A 12-lead ECG identifies the rhythm. Lidocaine is not first-line for palpitations without diagnosis; Trendelenburg is not recommended.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Dysrhythmias</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is caring for a client who is</text><text x="41" y="198" fill="#f6faf5" font-size="21">experiencing heart palpitations. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">interventions should the nurse include in</text><text x="41" y="252" fill="#f6faf5" font-size="21">the plan of care?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Have the client bear down as if for a</text><text x="41" y="384" fill="#f6faf5" font-size="21">bowel movement (Valsalva) · Ask the client</text><text x="41" y="411" fill="#f6faf5" font-size="21">to cough forcefully · Obtain 12-lead ECG</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Bearing down (Valsalva maneuver) and</text><text x="41" y="543" fill="#f6faf5" font-size="21">forceful coughing stimulate the vagus</text><text x="41" y="570" fill="#f6faf5" font-size="21">nerve, increasing parasympathetic tone and</text><text x="41" y="597" fill="#f6faf5" font-size="21">slowing the heart rate. A 12-lead ECG</text><text x="41" y="624" fill="#f6faf5" font-size="21">identifies the rhythm. Lidocaine is not</text><text x="41" y="651" fill="#f6faf5" font-size="21">first-line for palpitations without</text><text x="41" y="678" fill="#f6faf5" font-size="21">diagnosis; Trendelenburg is not</text><text x="41" y="705" fill="#f6faf5" font-size="21">recommended.</text></g></svg>