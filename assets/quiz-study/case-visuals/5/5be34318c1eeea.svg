<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="569" viewBox="0 0 640 569"><title>What does that document mean right now?</title><desc>A durable power of attorney for health care names who will decide if the client cannot, and while she has capacity, she decides. When an agent&#x27;s authority activates, how broad it is, and what it may cover are set by state law and by the wording of the document, so the precise answer depends on where it was signed. Nothing in the document removes a capacitated adult&#x27;s right to refuse.</desc><rect width="640" height="569" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Refusal of Treatment, Capacity,</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">and Family Conflict</text><rect x="23" y="139" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">What does that document mean right now?</text><path d="M319 228v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="244" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 257) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="278" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="309" fill="#f6faf5" font-size="21">It is not yet in effect, because a client</text><text x="41" y="336" fill="#f6faf5" font-size="21">with capacity speaks for herself</text><path d="M319 360v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="376" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 389) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="410" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="441" fill="#f6faf5" font-size="21">A durable power of attorney for health</text><text x="41" y="468" fill="#f6faf5" font-size="21">care names who will decide if the client</text><text x="41" y="495" fill="#f6faf5" font-size="21">cannot, and while she has capacity, she</text><text x="41" y="522" fill="#f6faf5" font-size="21">decides.</text></g></svg>