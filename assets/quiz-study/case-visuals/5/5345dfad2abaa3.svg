<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A nurse is caring for a hospitalized 5-year-old who has started wetting the bed and asking to be fed by a parent, behaviors the child had outgrown at home. Which of the following responses by the nurse is appropriate?</title><desc>REGRESSION DURING HOSPITALIZATION IS AN EXPECTED, TEMPORARY STRESS RESPONSE, not a true developmental deviation like regression that occurs at home without a stressor. A preschooler is in INITIATIVE VERSUS GUILT, so offering choices and letting the child help preserves initiative. Doing everything for the child fosters guilt, shaming increases regression, and referral is not needed for stress-related regression.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Identifying Developmental</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Deviations</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is caring for a hospitalized</text><text x="41" y="231" fill="#f6faf5" font-size="21">5-year-old who has started wetting the bed</text><text x="41" y="258" fill="#f6faf5" font-size="21">and asking to be fed by a parent,</text><text x="41" y="285" fill="#f6faf5" font-size="21">behaviors the child had outgrown at home.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Reassure the parent this is a temporary</text><text x="41" y="417" fill="#f6faf5" font-size="21">stress response and let the child choose</text><text x="41" y="444" fill="#f6faf5" font-size="21">the order of care tasks</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">REGRESSION DURING HOSPITALIZATION IS AN</text><text x="41" y="576" fill="#f6faf5" font-size="21">EXPECTED, TEMPORARY STRESS RESPONSE, not a</text><text x="41" y="603" fill="#f6faf5" font-size="21">true developmental deviation like</text><text x="41" y="630" fill="#f6faf5" font-size="21">regression that occurs at home without a</text><text x="41" y="657" fill="#f6faf5" font-size="21">stressor.</text></g></svg>