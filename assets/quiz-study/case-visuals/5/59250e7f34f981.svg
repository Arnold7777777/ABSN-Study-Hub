<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client with blood type A negative needs an emergency transfusion before typing is complete. Which product is appropriate?</title><desc>O negative is the universal red cell donor — no A, B or Rh antigens for the recipient&#x27;s antibodies to attack — so it is the emergency choice before a type and crossmatch is back. AB positive is the universal plasma donor and universal red cell recipient .</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematologic Disorders</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with blood type A negative needs</text><text x="41" y="198" fill="#f6faf5" font-size="21">an emergency transfusion before typing is</text><text x="41" y="225" fill="#f6faf5" font-size="21">complete. Which product is appropriate?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">O negative packed red blood cells</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">O negative is the universal red cell donor</text><text x="41" y="462" fill="#f6faf5" font-size="21">— no A, B or Rh antigens for the</text><text x="41" y="489" fill="#f6faf5" font-size="21">recipient&#x27;s antibodies to attack — so it</text><text x="41" y="516" fill="#f6faf5" font-size="21">is the emergency choice before a type and</text><text x="41" y="543" fill="#f6faf5" font-size="21">crossmatch is back. AB positive is the</text><text x="41" y="570" fill="#f6faf5" font-size="21">universal plasma donor and universal red</text><text x="41" y="597" fill="#f6faf5" font-size="21">cell recipient .</text></g></svg>