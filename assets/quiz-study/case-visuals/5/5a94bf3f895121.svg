<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is observing a nursing student care for a client who has severe vision loss. Which action by the student requires intervention by the nurse?</title><desc>Furniture and personal belongings must be kept in a CONSISTENT PLACE, and NOTHING SHOULD BE MOVED WITHOUT TELLING THE CLIENT, because an unexpected change creates a fall hazard and disorientation. Announcing arrival and departure and keeping the call light in a consistent, reachable spot are all correct actions that require no intervention.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Vision Deficit</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is observing a nursing student</text><text x="41" y="198" fill="#f6faf5" font-size="21">care for a client who has severe vision</text><text x="41" y="225" fill="#f6faf5" font-size="21">loss. Which action by the student requires</text><text x="41" y="252" fill="#f6faf5" font-size="21">intervention by the nurse?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">The student moves the bedside chair to the</text><text x="41" y="384" fill="#f6faf5" font-size="21">far wall to create more space for walking</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Furniture and personal belongings must be</text><text x="41" y="516" fill="#f6faf5" font-size="21">kept in a CONSISTENT PLACE, and NOTHING</text><text x="41" y="543" fill="#f6faf5" font-size="21">SHOULD BE MOVED WITHOUT TELLING THE</text><text x="41" y="570" fill="#f6faf5" font-size="21">CLIENT, because an unexpected change</text><text x="41" y="597" fill="#f6faf5" font-size="21">creates a fall hazard and disorientation.</text></g></svg>