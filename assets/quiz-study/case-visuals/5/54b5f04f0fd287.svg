<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A 6-year-old receiving chemotherapy has an absolute neutrophil count of 320 and a new fever. Which action is the priority?</title><desc>An ANC under 500 with fever is an emergency, and the first action is cultures plus antibiotics within the hour . Protective isolation is the tempting answer because it belongs to neutropenic care, but it only prevents new exposure and does nothing about the infection already underway.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 6-year-old receiving chemotherapy has an</text><text x="41" y="198" fill="#f6faf5" font-size="21">absolute neutrophil count of 320 and a new</text><text x="41" y="225" fill="#f6faf5" font-size="21">fever. Which action is the priority?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Obtain cultures and administer antibiotics</text><text x="41" y="357" fill="#f6faf5" font-size="21">within the hour</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">An ANC under 500 with fever is an</text><text x="41" y="489" fill="#f6faf5" font-size="21">emergency, and the first action is</text><text x="41" y="516" fill="#f6faf5" font-size="21">cultures plus antibiotics within the hour</text><text x="41" y="543" fill="#f6faf5" font-size="21">. Protective isolation is the tempting</text><text x="41" y="570" fill="#f6faf5" font-size="21">answer because it belongs to neutropenic</text><text x="41" y="597" fill="#f6faf5" font-size="21">care, but it only prevents new exposure</text><text x="41" y="624" fill="#f6faf5" font-size="21">and does nothing about the infection</text><text x="41" y="651" fill="#f6faf5" font-size="21">already underway.</text></g></svg>