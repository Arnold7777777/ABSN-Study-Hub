<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A 5-year-old admitted to rule out acute lymphocytic leukemia has these results: WBC 42,000/mcL (5,000–10,000), RBC 4 million/mcL (4.2–5.4), Hgb 10 g/dL (12–16), Hct 31% (36–48), platelets 90,000/mcL (140,000–400,000), neutrophils 30% (55–70), lymphocytes 65% (20–40). Which statement completes the sentence correctly? &quot;Following review of the laboratory results, the nurse is most concerned about ___, ___, and ___.&quot;</title><desc>A WBC of 42,000 with 65% lymphocytes reflects the leukemic cells crowding the marrow, and platelets of 90,000 explain her bleeding. The RBC, Hgb and Hct are only mildly low and are less urgent.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology &amp; Childhood Neoplasms</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 5-year-old admitted to rule out acute</text><text x="41" y="198" fill="#f6faf5" font-size="21">lymphocytic leukemia has these results:</text><text x="41" y="225" fill="#f6faf5" font-size="21">WBC 42,000/mcL (5,000–10,000), RBC 4</text><text x="41" y="252" fill="#f6faf5" font-size="21">million/mcL (4.2–5.4), Hgb 10 g/dL</text><text x="41" y="279" fill="#f6faf5" font-size="21">(12–16), Hct 31% (36–48), platelets</text><text x="41" y="306" fill="#f6faf5" font-size="21">90,000/mcL…</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">WBC, platelets, and lymphocytes</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A WBC of 42,000 with 65% lymphocytes</text><text x="41" y="543" fill="#f6faf5" font-size="21">reflects the leukemic cells crowding the</text><text x="41" y="570" fill="#f6faf5" font-size="21">marrow, and platelets of 90,000 explain</text><text x="41" y="597" fill="#f6faf5" font-size="21">her bleeding. The RBC, Hgb and Hct are</text><text x="41" y="624" fill="#f6faf5" font-size="21">only mildly low and are less urgent.</text></g></svg>