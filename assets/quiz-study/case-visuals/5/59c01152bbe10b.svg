<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client who has a newly diagnosed terminal illness tells the nurse, &#x27;If I can just live long enough to see my daughter graduate in June, I promise I will quit smoking and go to church every week.&#x27; Which stage of grief according to Kubler-Ross is the client demonstrating?</title><desc>BARGAINING involves attempting to NEGOTIATE FOR MORE TIME, often with a higher power, and typically uses &#x27;if...then&#x27; language tied to a promise. The nurse should remember that the KUBLER-ROSS STAGES ARE NOT LINEAR AND NOT EVERY PERSON EXPERIENCES ALL OF THEM; denial would sound like refusing to accept the diagnosis, and acceptance is a calm readiness rather than negotiation.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Grief</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who has a newly diagnosed</text><text x="41" y="198" fill="#f6faf5" font-size="21">terminal illness tells the nurse, &#x27;If I</text><text x="41" y="225" fill="#f6faf5" font-size="21">can just live long enough to see my</text><text x="41" y="252" fill="#f6faf5" font-size="21">daughter graduate in June, I promise I</text><text x="41" y="279" fill="#f6faf5" font-size="21">will quit smoking and go to church every</text><text x="41" y="306" fill="#f6faf5" font-size="21">week.&#x27; Which…</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">Bargaining</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">BARGAINING involves attempting to</text><text x="41" y="543" fill="#f6faf5" font-size="21">NEGOTIATE FOR MORE TIME, often with a</text><text x="41" y="570" fill="#f6faf5" font-size="21">higher power, and typically uses</text><text x="41" y="597" fill="#f6faf5" font-size="21">&#x27;if...then&#x27; language tied to a promise.</text></g></svg>