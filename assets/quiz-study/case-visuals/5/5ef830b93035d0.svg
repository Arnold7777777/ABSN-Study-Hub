<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client with a long history of alcohol use has confusion, abnormal eye movements and an unsteady gait. Which deficiency should the nurse suspect?</title><desc>That triad - altered mental status, oculomotor dysfunction and ataxia - is Wernicke&#x27;s encephalopathy , from thiamine (B1) deficiency . Alcohol blocks its absorption. It is treatable if caught , which is why thiamine is given before glucose in this group.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with a long history of alcohol</text><text x="41" y="198" fill="#f6faf5" font-size="21">use has confusion, abnormal eye movements</text><text x="41" y="225" fill="#f6faf5" font-size="21">and an unsteady gait. Which deficiency</text><text x="41" y="252" fill="#f6faf5" font-size="21">should the nurse suspect?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Thiamine, vitamin B1</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">That triad - altered mental status,</text><text x="41" y="489" fill="#f6faf5" font-size="21">oculomotor dysfunction and ataxia - is</text><text x="41" y="516" fill="#f6faf5" font-size="21">Wernicke&#x27;s encephalopathy , from thiamine</text><text x="41" y="543" fill="#f6faf5" font-size="21">(B1) deficiency . Alcohol blocks its</text><text x="41" y="570" fill="#f6faf5" font-size="21">absorption. It is treatable if caught ,</text><text x="41" y="597" fill="#f6faf5" font-size="21">which is why thiamine is given before</text><text x="41" y="624" fill="#f6faf5" font-size="21">glucose in this group.</text></g></svg>