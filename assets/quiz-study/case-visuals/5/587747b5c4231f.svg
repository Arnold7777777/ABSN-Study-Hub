<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is preparing to teach a 4-year-old child about an upcoming dressing change. Which approach should the nurse use?</title><desc>Preschoolers learn through play and hands-on exploration, and simple concrete language with a doll lets the child rehearse what will happen. Long lead time before a procedure increases fear at this age, and teaching only the parents leaves the child unprepared for what they will experience.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Teaching Children</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to teach a 4-year-old</text><text x="41" y="198" fill="#f6faf5" font-size="21">child about an upcoming dressing change.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which approach should the nurse use?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Use simple words and let the child handle</text><text x="41" y="357" fill="#f6faf5" font-size="21">the supplies and practice on a doll</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Preschoolers learn through play and hands-</text><text x="41" y="489" fill="#f6faf5" font-size="21">on exploration, and simple concrete</text><text x="41" y="516" fill="#f6faf5" font-size="21">language with a doll lets the child</text><text x="41" y="543" fill="#f6faf5" font-size="21">rehearse what will happen. Long lead time</text><text x="41" y="570" fill="#f6faf5" font-size="21">before a procedure increases fear at this</text><text x="41" y="597" fill="#f6faf5" font-size="21">age, and teaching only the parents leaves</text><text x="41" y="624" fill="#f6faf5" font-size="21">the child unprepared for what they will</text><text x="41" y="651" fill="#f6faf5" font-size="21">experience.</text></g></svg>