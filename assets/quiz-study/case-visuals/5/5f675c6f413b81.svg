<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is assigned four clients receiving antipsychotic medication. Which client should the nurse assess first?</title><desc>Acute dystonia within hours of a parenteral antipsychotic can involve the laryngeal muscles; a thickened voice with difficulty handling secretions signals a threatened airway and requires immediate intramuscular benztropine or diphenhydramine. Tardive dyskinesia is the tempting distractor because it is the more feared long-term complication, but lip smacking is not an emergency. Anticholinergic effects and pseudoparkinsonism are uncomfortable but do not threaten the airway.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology: Acute Dystonia</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assigned four clients receiving</text><text x="41" y="198" fill="#f6faf5" font-size="21">antipsychotic medication. Which client</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse assess first?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A client who received intramuscular</text><text x="41" y="357" fill="#f6faf5" font-size="21">haloperidol 90 minutes ago whose neck is</text><text x="41" y="384" fill="#f6faf5" font-size="21">pulled to one side, whose voice sounds</text><text x="41" y="411" fill="#f6faf5" font-size="21">thickened, and who is having difficulty</text><text x="41" y="438" fill="#f6faf5" font-size="21">swallowing his own saliva</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Acute dystonia within hours of a</text><text x="41" y="570" fill="#f6faf5" font-size="21">parenteral antipsychotic can involve the</text><text x="41" y="597" fill="#f6faf5" font-size="21">laryngeal muscles;</text></g></svg>