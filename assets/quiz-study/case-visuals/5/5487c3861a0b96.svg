<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client on the unit says, &quot;I&#x27;ve been holding in my anger at my brother for weeks.&quot; Which response by the nurse best helps the client manage the anger?</title><desc>Anger is uncomfortable energy that keeps building when it is held in, until the person reacts or explodes. Helping the client name the feeling and release it safely (talking, walking, exercise, music) prevents escalation. Suppressing or denying it lets the tension grow.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anger - healthy outlets</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client on the unit says, &quot;I&#x27;ve been</text><text x="41" y="198" fill="#f6faf5" font-size="21">holding in my anger at my brother for</text><text x="41" y="225" fill="#f6faf5" font-size="21">weeks.&quot; Which response by the nurse best</text><text x="41" y="252" fill="#f6faf5" font-size="21">helps the client manage the anger?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;Let&#x27;s look at safe ways to release it,</text><text x="41" y="384" fill="#f6faf5" font-size="21">such as talking it through, walking, or</text><text x="41" y="411" fill="#f6faf5" font-size="21">exercising.&quot;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Anger is uncomfortable energy that keeps</text><text x="41" y="543" fill="#f6faf5" font-size="21">building when it is held in, until the</text><text x="41" y="570" fill="#f6faf5" font-size="21">person reacts or explodes. Helping the</text><text x="41" y="597" fill="#f6faf5" font-size="21">client name the feeling and release it</text><text x="41" y="624" fill="#f6faf5" font-size="21">safely (talking, walking, exercise, music)</text><text x="41" y="651" fill="#f6faf5" font-size="21">prevents escalation. Suppressing or</text><text x="41" y="678" fill="#f6faf5" font-size="21">denying it lets the tension grow.</text></g></svg>