<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>The clinic nurse is caring for a client who has been diagnosed with emphysema and who has just had a pulmonary function test (PFT) ordered. The client asks, &quot;What exactly is this test for?&quot; What would be the nurse&#x27;s best response?</title><desc>PFTs are routinely used in clients with chronic respiratory disorders. They are performed to assess respiratory function and to determine the extent of dysfunction. Such tests include measurements of lung volumes, ventilatory function, and the mechanics of breathing, diffusion, and gas exchange. Lung elasticity and diffusion can often be implied from PFTs, but they are not directly assessed. Energy obtained from respiration is not measured directly.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 6 · PFTs</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The clinic nurse is caring for a client</text><text x="41" y="198" fill="#f6faf5" font-size="21">who has been diagnosed with emphysema and</text><text x="41" y="225" fill="#f6faf5" font-size="21">who has just had a pulmonary function test</text><text x="41" y="252" fill="#f6faf5" font-size="21">(PFT) ordered.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;A PFT measures how much air moves in and</text><text x="41" y="384" fill="#f6faf5" font-size="21">out of your lungs when you breathe.&quot;</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">PFTs are routinely used in clients with</text><text x="41" y="516" fill="#f6faf5" font-size="21">chronic respiratory disorders.</text></g></svg>