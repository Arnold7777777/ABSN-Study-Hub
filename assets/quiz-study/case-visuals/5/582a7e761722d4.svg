<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A nurse plans to use two identifiers before giving a medication. Which actions correctly identify the client? (Select all that apply.)</title><desc>The wristband, the client stating their own name, the client stating their own date of birth, and the bar code are all acceptable identifiers. A room number is never one. Clients are moved between rooms and beds, and the number identifies a location rather than a person — which is exactly how a medication reaches the wrong client.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Patient Identification Before</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Medication</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse plans to use two identifiers</text><text x="41" y="231" fill="#f6faf5" font-size="21">before giving a medication. Which actions</text><text x="41" y="258" fill="#f6faf5" font-size="21">correctly identify the client? (Select all</text><text x="41" y="285" fill="#f6faf5" font-size="21">that apply.)</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Compare the name on the wristband with the</text><text x="41" y="417" fill="#f6faf5" font-size="21">name on the medication administration</text><text x="41" y="444" fill="#f6faf5" font-size="21">record · Ask the client to state their</text><text x="41" y="471" fill="#f6faf5" font-size="21">date of birth · Ask the client to state</text><text x="41" y="498" fill="#f6faf5" font-size="21">their name · Scan the…</text><path d="M319 522v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="538" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 551) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="572" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="603" fill="#f6faf5" font-size="21">The wristband, the client stating their</text><text x="41" y="630" fill="#f6faf5" font-size="21">own name, the client stating their own</text><text x="41" y="657" fill="#f6faf5" font-size="21">date of birth, and the bar code are all</text><text x="41" y="684" fill="#f6faf5" font-size="21">acceptable identifiers.</text></g></svg>