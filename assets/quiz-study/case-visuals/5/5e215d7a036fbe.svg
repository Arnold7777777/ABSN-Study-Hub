<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="833" viewBox="0 0 640 833"><title>A nurse reviews the record of a client who wants a trial of labor after cesarean (TOLAC). Which findings support her as a favorable candidate? Select all that apply.</title><desc>TOLAC is favored by a prior low transverse incision , one or two prior cesareans, 18–19 months between births, and immediate surgical backup. A classical vertical incision is the tempting distractor because it is still a prior cesarean, but it is not the incision type that supports TOLAC.</desc><rect width="640" height="833" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Labor &amp; Birth</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse reviews the record of a client who</text><text x="41" y="198" fill="#f6faf5" font-size="21">wants a trial of labor after cesarean</text><text x="41" y="225" fill="#f6faf5" font-size="21">(TOLAC). Which findings support her as a</text><text x="41" y="252" fill="#f6faf5" font-size="21">favorable candidate? Select all that</text><text x="41" y="279" fill="#f6faf5" font-size="21">apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">A prior low transverse uterine incision ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">A history of two previous cesarean births</text><text x="41" y="438" fill="#f6faf5" font-size="21">· An interval of 19 months between the</text><text x="41" y="465" fill="#f6faf5" font-size="21">last birth and this pregnancy · Surgical</text><text x="41" y="492" fill="#f6faf5" font-size="21">backup immediately…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">TOLAC is favored by a prior low transverse</text><text x="41" y="624" fill="#f6faf5" font-size="21">incision , one or two prior cesareans,</text><text x="41" y="651" fill="#f6faf5" font-size="21">18–19 months between births, and immediate</text><text x="41" y="678" fill="#f6faf5" font-size="21">surgical backup. A classical vertical</text><text x="41" y="705" fill="#f6faf5" font-size="21">incision is the tempting distractor</text><text x="41" y="732" fill="#f6faf5" font-size="21">because it is still a prior cesarean, but</text><text x="41" y="759" fill="#f6faf5" font-size="21">it is not the incision type that supports</text><text x="41" y="786" fill="#f6faf5" font-size="21">TOLAC.</text></g></svg>