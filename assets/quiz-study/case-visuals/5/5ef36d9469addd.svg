<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is teaching a client who will begin disulfiram. Which points should be included? Select all that apply.</title><desc>Disulfiram causes acetaldehyde buildup with any alcohol exposure, so all sources must be avoided, including hidden ones; the reaction can occur up to about 2 weeks after stopping. No amount of alcohol is safe, making the wine statement incorrect.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a client who will</text><text x="41" y="198" fill="#f6faf5" font-size="21">begin disulfiram. Which points should be</text><text x="41" y="225" fill="#f6faf5" font-size="21">included? Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Avoid alcohol in all forms, including</text><text x="41" y="357" fill="#f6faf5" font-size="21">mouthwash and cough syrup · Aftershave and</text><text x="41" y="384" fill="#f6faf5" font-size="21">colognes can trigger a reaction · The</text><text x="41" y="411" fill="#f6faf5" font-size="21">reaction can occur up to 2 weeks after the</text><text x="41" y="438" fill="#f6faf5" font-size="21">last dose · Report…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Disulfiram causes acetaldehyde buildup</text><text x="41" y="570" fill="#f6faf5" font-size="21">with any alcohol exposure, so all sources</text><text x="41" y="597" fill="#f6faf5" font-size="21">must be avoided, including hidden ones;</text><text x="41" y="624" fill="#f6faf5" font-size="21">the reaction can occur up to about 2 weeks</text><text x="41" y="651" fill="#f6faf5" font-size="21">after stopping. No amount of alcohol is</text><text x="41" y="678" fill="#f6faf5" font-size="21">safe, making the wine statement incorrect.</text></g></svg>