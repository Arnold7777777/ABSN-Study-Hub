<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which teaching strategy best supports learning in the affective domain?</title><desc>The affective domain involves feelings, beliefs, and values, so discussion and shared reflection are the methods that reach it. A lecture delivers facts efficiently, which serves the cognitive domain but does little to change how a client feels about living with the illness.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Affective Domain</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which teaching strategy best supports</text><text x="41" y="198" fill="#f6faf5" font-size="21">learning in the affective domain?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">A discussion group in which clients share</text><text x="41" y="330" fill="#f6faf5" font-size="21">their feelings about the diagnosis</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">The affective domain involves feelings,</text><text x="41" y="462" fill="#f6faf5" font-size="21">beliefs, and values, so discussion and</text><text x="41" y="489" fill="#f6faf5" font-size="21">shared reflection are the methods that</text><text x="41" y="516" fill="#f6faf5" font-size="21">reach it. A lecture delivers facts</text><text x="41" y="543" fill="#f6faf5" font-size="21">efficiently, which serves the cognitive</text><text x="41" y="570" fill="#f6faf5" font-size="21">domain but does little to change how a</text><text x="41" y="597" fill="#f6faf5" font-size="21">client feels about living with the</text><text x="41" y="624" fill="#f6faf5" font-size="21">illness.</text></g></svg>