<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client with active TB has repeatedly missed clinic appointments and doses. Which intervention best promotes adherence?</title><desc>Directly observed therapy (DOT) has a health care worker watch the client swallow each dose, which is the proven strategy for nonadherent clients. Written schedules and phone calls help motivated clients but do not verify ingestion, and no nurse may shorten a regimen or drop drugs.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">DOT Adherence</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with active TB has repeatedly</text><text x="41" y="198" fill="#f6faf5" font-size="21">missed clinic appointments and doses.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which intervention best promotes</text><text x="41" y="252" fill="#f6faf5" font-size="21">adherence?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Arrange directly observed therapy</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Directly observed therapy (DOT) has a</text><text x="41" y="489" fill="#f6faf5" font-size="21">health care worker watch the client</text><text x="41" y="516" fill="#f6faf5" font-size="21">swallow each dose, which is the proven</text><text x="41" y="543" fill="#f6faf5" font-size="21">strategy for nonadherent clients. Written</text><text x="41" y="570" fill="#f6faf5" font-size="21">schedules and phone calls help motivated</text><text x="41" y="597" fill="#f6faf5" font-size="21">clients but do not verify ingestion, and</text><text x="41" y="624" fill="#f6faf5" font-size="21">no nurse may shorten a regimen or drop</text><text x="41" y="651" fill="#f6faf5" font-size="21">drugs.</text></g></svg>