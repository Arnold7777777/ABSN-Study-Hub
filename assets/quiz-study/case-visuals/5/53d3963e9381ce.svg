<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A nurse is giving medications on a busy unit. Which identifiers are acceptable? (Select all that apply.)</title><desc>The client stating their own name and date of birth, the wristband and the bar code are all acceptable. A room and bed number is never an identifier — clients are moved, and that is exactly how a medication reaches the wrong person.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Patient Identification Before</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Medication</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is giving medications on a busy</text><text x="41" y="231" fill="#f6faf5" font-size="21">unit. Which identifiers are acceptable?</text><text x="41" y="258" fill="#f6faf5" font-size="21">(Select all that apply.)</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">The client states their full name · The</text><text x="41" y="390" fill="#f6faf5" font-size="21">client states their date of birth · The</text><text x="41" y="417" fill="#f6faf5" font-size="21">name on the wristband · The bar code on</text><text x="41" y="444" fill="#f6faf5" font-size="21">the wristband</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">The client stating their own name and date</text><text x="41" y="576" fill="#f6faf5" font-size="21">of birth, the wristband and the bar code</text><text x="41" y="603" fill="#f6faf5" font-size="21">are all acceptable. A room and bed number</text><text x="41" y="630" fill="#f6faf5" font-size="21">is never an identifier — clients are</text><text x="41" y="657" fill="#f6faf5" font-size="21">moved, and that is exactly how a</text><text x="41" y="684" fill="#f6faf5" font-size="21">medication reaches the wrong person.</text></g></svg>