<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>Which points should the nurse include in teaching? Select all that apply.</title><desc>Small frequent volumes are absorbed even when a child vomits, which is why 5 mL every few minutes by syringe works. Counting wet diapers gives the family a concrete measure. Feeding continues through gastroenteritis rather than being withheld. A floppy or unrousable infant needs to be seen at once. Juice and sports drinks have the wrong osmolality and make diarrhea worse.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Dehydration in the Infant</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which points should the nurse include in</text><text x="41" y="198" fill="#f6faf5" font-size="21">teaching? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Give oral rehydration solution in small</text><text x="41" y="330" fill="#f6faf5" font-size="21">amounts frequently, even if he vomits ·</text><text x="41" y="357" fill="#f6faf5" font-size="21">Count wet diapers and report fewer than</text><text x="41" y="384" fill="#f6faf5" font-size="21">expected for his age · Continue breast or</text><text x="41" y="411" fill="#f6faf5" font-size="21">formula feeding through…</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Small frequent volumes are absorbed even</text><text x="41" y="543" fill="#f6faf5" font-size="21">when a child vomits, which is why 5 mL</text><text x="41" y="570" fill="#f6faf5" font-size="21">every few minutes by syringe works.</text></g></svg>