<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client reports vertigo, tinnitus, and a sense of fullness in one ear, with episodes lasting hours. Which instruction is the priority for safety?</title><desc>Ménière&#x27;s disease brings on vertigo without warning; the danger is falling or crashing a car , so the client stops moving and does not drive. Sodium is restricted , not increased, because it worsens endolymph volume. Head movement makes an attack worse, and irrigation has no role.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Disorders - Eye &amp; Ear</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client reports vertigo, tinnitus, and a</text><text x="41" y="198" fill="#f6faf5" font-size="21">sense of fullness in one ear, with</text><text x="41" y="225" fill="#f6faf5" font-size="21">episodes lasting hours. Which instruction</text><text x="41" y="252" fill="#f6faf5" font-size="21">is the priority for safety?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Sit or lie down immediately when an attack</text><text x="41" y="384" fill="#f6faf5" font-size="21">begins and do not drive</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Ménière&#x27;s disease brings on vertigo</text><text x="41" y="516" fill="#f6faf5" font-size="21">without warning; the danger is falling or</text><text x="41" y="543" fill="#f6faf5" font-size="21">crashing a car , so the client stops</text><text x="41" y="570" fill="#f6faf5" font-size="21">moving and does not drive. Sodium is</text><text x="41" y="597" fill="#f6faf5" font-size="21">restricted , not increased, because it</text><text x="41" y="624" fill="#f6faf5" font-size="21">worsens endolymph volume. Head movement</text><text x="41" y="651" fill="#f6faf5" font-size="21">makes an attack worse, and irrigation has</text><text x="41" y="678" fill="#f6faf5" font-size="21">no role.</text></g></svg>