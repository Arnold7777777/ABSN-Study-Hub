<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A 62-year-old client who completed menopause 10 years ago reports a week of vaginal spotting. She has been taking tamoxifen for 3 years. Which response by the nurse is most appropriate?</title><desc>Postmenopausal bleeding is always abnormal and always referred — it is exactly why endometrial cancer tends to be caught earlier than ovarian cancer. Tamoxifen is a reason for higher suspicion, not reassurance, because it raises endometrial cancer risk by stimulating uterine estrogen receptors, and CA-125 tracks known disease and is not a screening test .</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Reproductive Disorders</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 62-year-old client who completed</text><text x="41" y="198" fill="#f6faf5" font-size="21">menopause 10 years ago reports a week of</text><text x="41" y="225" fill="#f6faf5" font-size="21">vaginal spotting. She has been taking</text><text x="41" y="252" fill="#f6faf5" font-size="21">tamoxifen for 3 years. Which response by</text><text x="41" y="279" fill="#f6faf5" font-size="21">the nurse is most appropriate?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Report the bleeding to the provider today,</text><text x="41" y="411" fill="#f6faf5" font-size="21">because bleeding after menopause is never</text><text x="41" y="438" fill="#f6faf5" font-size="21">normal</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Postmenopausal bleeding is always abnormal</text><text x="41" y="570" fill="#f6faf5" font-size="21">and always referred — it is exactly why</text><text x="41" y="597" fill="#f6faf5" font-size="21">endometrial cancer tends to be caught</text><text x="41" y="624" fill="#f6faf5" font-size="21">earlier than ovarian cancer.</text></g></svg>