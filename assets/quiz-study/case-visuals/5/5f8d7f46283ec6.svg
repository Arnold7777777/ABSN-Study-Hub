<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A client has been taking sertraline for 5 days. Which findings should the nurse report to the provider immediately?</title><desc>Two dangerous clusters, and they are the whole question. Serotonin syndrome = agitation, confusion, hyperreflexia, rigidity, tremor, diaphoresis, fever, unstable vitals — often within hours to days. SIADH/hyponatremia = Na &lt;135, headache, lethargy, confusion, seizures — more common in older adults . On Practice Test A you added heart rate; 88/min is normal — that was over-reach. Mild nausea is expected and self-limiting.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has been taking sertraline for 5</text><text x="41" y="198" fill="#f6faf5" font-size="21">days. Which findings should the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">report to the provider immediately?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Agitation, confusion, and diaphoresis ·</text><text x="41" y="357" fill="#f6faf5" font-size="21">Muscle rigidity with hyperreflexia and</text><text x="41" y="384" fill="#f6faf5" font-size="21">tremor · Serum sodium 128 mEq/L ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Headache, lethargy, and new confusion</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Two dangerous clusters, and they are the</text><text x="41" y="543" fill="#f6faf5" font-size="21">whole question.</text></g></svg>