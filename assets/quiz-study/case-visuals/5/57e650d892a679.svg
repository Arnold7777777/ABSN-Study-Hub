<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A nurse is assessing a 12-month-old at a well-child visit. Which of the following findings should the nurse report to the provider?</title><desc>A PERSISTENT MORO REFLEX PAST 6 MONTHS IS ABNORMAL and suggests a central nervous system problem, so it is reported. A pincer grasp should be present by 12 months, cruising is normal with independent walking expected by 15 months (a red flag only if absent at 18 months), and 3 to 5 words at 12 months is on target. Primitive reflexes that stick around are always the red flag.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Identifying Developmental</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Deviations</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is assessing a 12-month-old at a</text><text x="41" y="231" fill="#f6faf5" font-size="21">well-child visit. Which of the following</text><text x="41" y="258" fill="#f6faf5" font-size="21">findings should the nurse report to the</text><text x="41" y="285" fill="#f6faf5" font-size="21">provider?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">The child&#x27;s arms abduct and extend</text><text x="41" y="417" fill="#f6faf5" font-size="21">symmetrically when startled by a loud</text><text x="41" y="444" fill="#f6faf5" font-size="21">noise</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">A PERSISTENT MORO REFLEX PAST 6 MONTHS IS</text><text x="41" y="576" fill="#f6faf5" font-size="21">ABNORMAL and suggests a central nervous</text><text x="41" y="603" fill="#f6faf5" font-size="21">system problem, so it is reported.</text></g></svg>