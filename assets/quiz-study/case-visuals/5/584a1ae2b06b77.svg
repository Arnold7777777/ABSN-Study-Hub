<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is teaching a group of older adults about advance directives. Which statements should the nurse include?</title><desc>Clients retain the right to revise or cancel a directive as long as they have capacity, the document should be on the chart and shared with the proxy, and it guides care only when the client can no longer speak for themselves. Facilities must ask about and offer information on directives, but no client can be required to have one as a condition of care.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Advance Directives</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a group of older</text><text x="41" y="198" fill="#f6faf5" font-size="21">adults about advance directives. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">statements should the nurse include?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">An advance directive can be changed or</text><text x="41" y="357" fill="#f6faf5" font-size="21">revoked by the client at any time while</text><text x="41" y="384" fill="#f6faf5" font-size="21">they still have capacity · A copy should</text><text x="41" y="411" fill="#f6faf5" font-size="21">be given to the health care facility and</text><text x="41" y="438" fill="#f6faf5" font-size="21">to the person named as the…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Clients retain the right to revise or</text><text x="41" y="570" fill="#f6faf5" font-size="21">cancel a directive as long as they have</text><text x="41" y="597" fill="#f6faf5" font-size="21">capacity, the document should be on the</text><text x="41" y="624" fill="#f6faf5" font-size="21">chart and shared with the proxy, and it</text><text x="41" y="651" fill="#f6faf5" font-size="21">guides care only when the client can no</text><text x="41" y="678" fill="#f6faf5" font-size="21">longer speak for themselves.</text></g></svg>