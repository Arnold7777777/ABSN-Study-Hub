<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A 5-year-old is recovering in the procedure area after conscious sedation for a bone marrow aspiration. Which actions should the nurse include? Select all that apply.</title><desc>Lateral/side-lying is the airway-protective recovery position, NPO holds until the gag reflex returns, and continuous cardiorespiratory monitoring stays on. Prone is rejected for obstruction risk, and no ambulation is allowed until protective reflexes and full alertness return.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 5-year-old is recovering in the</text><text x="41" y="198" fill="#f6faf5" font-size="21">procedure area after conscious sedation</text><text x="41" y="225" fill="#f6faf5" font-size="21">for a bone marrow aspiration. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">actions should the nurse include? Select</text><text x="41" y="279" fill="#f6faf5" font-size="21">all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Position the child side-lying · Keep the</text><text x="41" y="411" fill="#f6faf5" font-size="21">child NPO until the gag reflex has</text><text x="41" y="438" fill="#f6faf5" font-size="21">returned · Maintain continuous respiratory</text><text x="41" y="465" fill="#f6faf5" font-size="21">rate, heart rate and SpO2 monitoring</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Lateral/side-lying is the airway-</text><text x="41" y="597" fill="#f6faf5" font-size="21">protective recovery position, NPO holds</text><text x="41" y="624" fill="#f6faf5" font-size="21">until the gag reflex returns, and</text><text x="41" y="651" fill="#f6faf5" font-size="21">continuous cardiorespiratory monitoring</text><text x="41" y="678" fill="#f6faf5" font-size="21">stays on. Prone is rejected for</text><text x="41" y="705" fill="#f6faf5" font-size="21">obstruction risk, and no ambulation is</text><text x="41" y="732" fill="#f6faf5" font-size="21">allowed until protective reflexes and full</text><text x="41" y="759" fill="#f6faf5" font-size="21">alertness return.</text></g></svg>