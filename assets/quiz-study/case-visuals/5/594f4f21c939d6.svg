<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is about to hang an antibiotic when she sees a newly charted allergy to that drug class. She holds the dose and pages the prescriber. Which principle best explains her action?</title><desc>Nonmaleficence means do not cause harm. Holding a drug the client may react to prevents injury. Beneficence is tempting, but that principle is about actively doing good; here the nurse is blocking a possible harm.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Ethical Principles</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is about to hang an antibiotic</text><text x="41" y="198" fill="#f6faf5" font-size="21">when she sees a newly charted allergy to</text><text x="41" y="225" fill="#f6faf5" font-size="21">that drug class. She holds the dose and</text><text x="41" y="252" fill="#f6faf5" font-size="21">pages the prescriber. Which principle best</text><text x="41" y="279" fill="#f6faf5" font-size="21">explains her action?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Nonmaleficence</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Nonmaleficence means do not cause harm.</text><text x="41" y="516" fill="#f6faf5" font-size="21">Holding a drug the client may react to</text><text x="41" y="543" fill="#f6faf5" font-size="21">prevents injury. Beneficence is tempting,</text><text x="41" y="570" fill="#f6faf5" font-size="21">but that principle is about actively doing</text><text x="41" y="597" fill="#f6faf5" font-size="21">good; here the nurse is blocking a</text><text x="41" y="624" fill="#f6faf5" font-size="21">possible harm.</text></g></svg>