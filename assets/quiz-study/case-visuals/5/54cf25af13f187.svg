<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which antibiotic group treats Legionnaires&#x27; disease?</title><desc>Macrolides or respiratory fluoroquinolones. Penicillins and cephalosporins do not work, because Legionella lives inside cells and those drugs do not get in. Delay in starting the right drug is what drives the mortality, so it is begun on suspicion.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Legionnaires&#x27; disease</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which antibiotic group treats</text><text x="41" y="198" fill="#f6faf5" font-size="21">Legionnaires&#x27; disease?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">A macrolide such as azithromycin, or a</text><text x="41" y="330" fill="#f6faf5" font-size="21">respiratory fluoroquinolone such as</text><text x="41" y="357" fill="#f6faf5" font-size="21">levofloxacin</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Macrolides or respiratory</text><text x="41" y="489" fill="#f6faf5" font-size="21">fluoroquinolones. Penicillins and</text><text x="41" y="516" fill="#f6faf5" font-size="21">cephalosporins do not work, because</text><text x="41" y="543" fill="#f6faf5" font-size="21">Legionella lives inside cells and those</text><text x="41" y="570" fill="#f6faf5" font-size="21">drugs do not get in. Delay in starting the</text><text x="41" y="597" fill="#f6faf5" font-size="21">right drug is what drives the mortality,</text><text x="41" y="624" fill="#f6faf5" font-size="21">so it is begun on suspicion.</text></g></svg>