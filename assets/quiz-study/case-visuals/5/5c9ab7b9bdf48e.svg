<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A 3-year-old arrives sitting upright, drooling, with a muffled voice and a high fever, refusing to lie down. What must the nurse avoid?</title><desc>This is epiglottitis . Nothing goes in the mouth — inspecting the throat can trigger complete airway obstruction. Keep the child upright and calm with the parent, give oxygen as tolerated, and have intubation equipment ready.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Respiratory</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 3-year-old arrives sitting upright,</text><text x="41" y="198" fill="#f6faf5" font-size="21">drooling, with a muffled voice and a high</text><text x="41" y="225" fill="#f6faf5" font-size="21">fever, refusing to lie down. What must the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse avoid?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Examining the throat with a tongue blade</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">This is epiglottitis . Nothing goes in the</text><text x="41" y="489" fill="#f6faf5" font-size="21">mouth — inspecting the throat can trigger</text><text x="41" y="516" fill="#f6faf5" font-size="21">complete airway obstruction. Keep the</text><text x="41" y="543" fill="#f6faf5" font-size="21">child upright and calm with the parent,</text><text x="41" y="570" fill="#f6faf5" font-size="21">give oxygen as tolerated, and have</text><text x="41" y="597" fill="#f6faf5" font-size="21">intubation equipment ready.</text></g></svg>