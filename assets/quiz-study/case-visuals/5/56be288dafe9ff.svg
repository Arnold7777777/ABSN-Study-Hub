<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client who has a terminal illness shouts at the nurse, &#x27;You people are all incompetent! Nobody in this place knows what they are doing!&#x27; Which response by the nurse is most appropriate?</title><desc>Anger in grief is frequently DISPLACED onto staff and family, and the therapeutic response ACKNOWLEDGES THE FEELING AND INVITES THE CLIENT TO EXPRESS IT rather than taking it personally. Defending the staff blocks communication, &#x27;why&#x27; questions sound judgmental and demand justification, and withdrawing from the client abandons them at a vulnerable time.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Grief</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who has a terminal illness shouts</text><text x="41" y="198" fill="#f6faf5" font-size="21">at the nurse, &#x27;You people are all</text><text x="41" y="225" fill="#f6faf5" font-size="21">incompetent! Nobody in this place knows</text><text x="41" y="252" fill="#f6faf5" font-size="21">what they are doing!&#x27; Which response by</text><text x="41" y="279" fill="#f6faf5" font-size="21">the nurse is most appropriate?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&#x27;You sound really angry. Tell me more</text><text x="41" y="411" fill="#f6faf5" font-size="21">about what is happening for you right</text><text x="41" y="438" fill="#f6faf5" font-size="21">now.&#x27;</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Anger in grief is frequently DISPLACED</text><text x="41" y="570" fill="#f6faf5" font-size="21">onto staff and family, and the therapeutic</text><text x="41" y="597" fill="#f6faf5" font-size="21">response ACKNOWLEDGES THE FEELING AND</text><text x="41" y="624" fill="#f6faf5" font-size="21">INVITES THE CLIENT TO EXPRESS IT rather</text><text x="41" y="651" fill="#f6faf5" font-size="21">than taking it personally.</text></g></svg>