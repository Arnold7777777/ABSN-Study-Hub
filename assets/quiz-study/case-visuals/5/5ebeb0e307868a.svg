<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which lubricant is appropriate for a client whose nares are dry from continuous nasal cannula use?</title><desc>Only water-soluble lubricant is safe with oxygen; oil-based products are flammable, can be aspirated, and break down the cannula tubing. Petroleum jelly is soothing and available at home, which is exactly why clients reach for it — it must be specifically taught against.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nasal Cannula Care</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which lubricant is appropriate for a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client whose nares are dry from continuous</text><text x="41" y="225" fill="#f6faf5" font-size="21">nasal cannula use?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A water-soluble lubricant</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Only water-soluble lubricant is safe with</text><text x="41" y="462" fill="#f6faf5" font-size="21">oxygen; oil-based products are flammable,</text><text x="41" y="489" fill="#f6faf5" font-size="21">can be aspirated, and break down the</text><text x="41" y="516" fill="#f6faf5" font-size="21">cannula tubing. Petroleum jelly is</text><text x="41" y="543" fill="#f6faf5" font-size="21">soothing and available at home, which is</text><text x="41" y="570" fill="#f6faf5" font-size="21">exactly why clients reach for it — it must</text><text x="41" y="597" fill="#f6faf5" font-size="21">be specifically taught against.</text></g></svg>