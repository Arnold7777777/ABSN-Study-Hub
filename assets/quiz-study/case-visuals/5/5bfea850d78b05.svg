<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>Which nutrient should the nurse tell a client at 8 weeks to increase?</title><desc>Iron - blood volume rises about 50% in pregnancy, so demand climbs and deficiency is the commonest anemia. Two others: folic acid 600 mcg daily in pregnancy, which prevents neural tube defects , and enough calcium . High-dose vitamin A is teratogenic.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which nutrient should the nurse tell a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client at 8 weeks to increase?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Iron</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">Iron - blood volume rises about 50% in</text><text x="41" y="435" fill="#f6faf5" font-size="21">pregnancy, so demand climbs and deficiency</text><text x="41" y="462" fill="#f6faf5" font-size="21">is the commonest anemia. Two others: folic</text><text x="41" y="489" fill="#f6faf5" font-size="21">acid 600 mcg daily in pregnancy, which</text><text x="41" y="516" fill="#f6faf5" font-size="21">prevents neural tube defects , and enough</text><text x="41" y="543" fill="#f6faf5" font-size="21">calcium . High-dose vitamin A is</text><text x="41" y="570" fill="#f6faf5" font-size="21">teratogenic.</text></g></svg>