<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client with a serum calcium of 6.8 mg/dL reports tingling around the mouth and now has a high-pitched crowing sound on inspiration. Which action should the nurse take first?</title><desc>Stridor with severe hypocalcemia means laryngospasm — the airway is closing, which makes this an emergency requiring immediate help and IV calcium at the bedside. Rechecking Chvostek&#x27;s sign only confirms what is already obvious and wastes time on an airway problem.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hypocalcemia Priority</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with a serum calcium of 6.8 mg/dL</text><text x="41" y="198" fill="#f6faf5" font-size="21">reports tingling around the mouth and now</text><text x="41" y="225" fill="#f6faf5" font-size="21">has a high-pitched crowing sound on</text><text x="41" y="252" fill="#f6faf5" font-size="21">inspiration. Which action should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">take first?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Stay with the client and call for</text><text x="41" y="411" fill="#f6faf5" font-size="21">emergency assistance to secure the airway</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Stridor with severe hypocalcemia means</text><text x="41" y="543" fill="#f6faf5" font-size="21">laryngospasm — the airway is closing,</text><text x="41" y="570" fill="#f6faf5" font-size="21">which makes this an emergency requiring</text><text x="41" y="597" fill="#f6faf5" font-size="21">immediate help and IV calcium at the</text><text x="41" y="624" fill="#f6faf5" font-size="21">bedside. Rechecking Chvostek&#x27;s sign only</text><text x="41" y="651" fill="#f6faf5" font-size="21">confirms what is already obvious and</text><text x="41" y="678" fill="#f6faf5" font-size="21">wastes time on an airway problem.</text></g></svg>