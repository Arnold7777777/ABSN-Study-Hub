<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>Which findings in a client with ARDS require the nurse to notify the provider immediately? Select all that apply.</title><desc>Refractory hypoxemia despite oxygen, new confusion with hypoxia, and absent breath sounds with tracheal deviation (tension pneumothorax) are all red flags demanding immediate action. Crackles already documented and a low-grade fever are expected in ARDS and do not change the plan by themselves.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">ARDS</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which findings in a client with ARDS</text><text x="41" y="198" fill="#f6faf5" font-size="21">require the nurse to notify the provider</text><text x="41" y="225" fill="#f6faf5" font-size="21">immediately? Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">SpO2 of 86% despite a nonrebreather at 15</text><text x="41" y="357" fill="#f6faf5" font-size="21">L/min · Sudden absence of breath sounds on</text><text x="41" y="384" fill="#f6faf5" font-size="21">the right with tracheal deviation · New</text><text x="41" y="411" fill="#f6faf5" font-size="21">confusion with worsening hypoxia</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Refractory hypoxemia despite oxygen, new</text><text x="41" y="543" fill="#f6faf5" font-size="21">confusion with hypoxia, and absent breath</text><text x="41" y="570" fill="#f6faf5" font-size="21">sounds with tracheal deviation (tension</text><text x="41" y="597" fill="#f6faf5" font-size="21">pneumothorax) are all red flags demanding</text><text x="41" y="624" fill="#f6faf5" font-size="21">immediate action. Crackles already</text><text x="41" y="651" fill="#f6faf5" font-size="21">documented and a low-grade fever are</text><text x="41" y="678" fill="#f6faf5" font-size="21">expected in ARDS and do not change the</text><text x="41" y="705" fill="#f6faf5" font-size="21">plan by themselves.</text></g></svg>