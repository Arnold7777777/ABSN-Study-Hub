<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>Which points should the nurse include when teaching a client after a kidney transplant? Select all that apply.</title><desc>Immunosuppressants such as cyclosporine are lifelong, contact sports can injure the graft, and daily BP plus signs of infection or rejection are monitored at home. Stopping the immunosuppressant when feeling well is the single most dangerous action — it triggers rejection.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Kidney Transplant</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which points should the nurse include when</text><text x="41" y="198" fill="#f6faf5" font-size="21">teaching a client after a kidney</text><text x="41" y="225" fill="#f6faf5" font-size="21">transplant? Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Take immunosuppressants for the rest of</text><text x="41" y="357" fill="#f6faf5" font-size="21">your life · Avoid contact sports · Monitor</text><text x="41" y="384" fill="#f6faf5" font-size="21">and record your blood pressure daily ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Report fever, decreased urine output, or</text><text x="41" y="438" fill="#f6faf5" font-size="21">graft tenderness</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Immunosuppressants such as cyclosporine</text><text x="41" y="570" fill="#f6faf5" font-size="21">are lifelong, contact sports can injure</text><text x="41" y="597" fill="#f6faf5" font-size="21">the graft, and daily BP plus signs of</text><text x="41" y="624" fill="#f6faf5" font-size="21">infection or rejection are monitored at</text><text x="41" y="651" fill="#f6faf5" font-size="21">home. Stopping the immunosuppressant when</text><text x="41" y="678" fill="#f6faf5" font-size="21">feeling well is the single most dangerous</text><text x="41" y="705" fill="#f6faf5" font-size="21">action — it triggers rejection.</text></g></svg>