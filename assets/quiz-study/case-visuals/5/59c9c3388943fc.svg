<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="512" viewBox="0 0 640 512"><title>80. While inserting a Foley in a female client, after 3 inches there is no urine return; the nurse suspects the catheter is in the vagina. Which is correct?</title><desc>b. Leave the misplaced catheter as a landmark for the vaginal opening, then use a NEW sterile catheter for the urethra. Reusing the same catheter contaminates the field.</desc><rect width="640" height="512" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">80. While inserting a Foley in a female</text><text x="41" y="198" fill="#f6faf5" font-size="21">client, after 3 inches there is no urine</text><text x="41" y="225" fill="#f6faf5" font-size="21">return; the nurse suspects the catheter is</text><text x="41" y="252" fill="#f6faf5" font-size="21">in the vagina. Which is correct?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">b. Leave the misplaced catheter as a</text><text x="41" y="384" fill="#f6faf5" font-size="21">landmark for the vaginal opening, then use</text><text x="41" y="411" fill="#f6faf5" font-size="21">a NEW sterile catheter for the urethra.</text><text x="41" y="438" fill="#f6faf5" font-size="21">Reusing the same catheter contaminates the</text><text x="41" y="465" fill="#f6faf5" font-size="21">field.</text></g></svg>