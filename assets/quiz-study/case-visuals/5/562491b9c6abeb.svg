<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client with systemic lupus erythematosus asks what can bring on a flare. Which triggers should the nurse teach the client to avoid? Select all that apply.</title><desc>Avoid the S&#x27;s of lupus : sun/UV light (the most tested - teach sunscreen, hats and long sleeves), smoking , stress and sepsis/infection . Gentle regular exercise is encouraged to limit fatigue and joint stiffness, not avoided.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Allergic, Inflammatory &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Immunologic Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client with systemic lupus erythematosus</text><text x="41" y="231" fill="#f6faf5" font-size="21">asks what can bring on a flare. Which</text><text x="41" y="258" fill="#f6faf5" font-size="21">triggers should the nurse teach the client</text><text x="41" y="285" fill="#f6faf5" font-size="21">to avoid? Select all that apply.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Sun and UV light exposure without</text><text x="41" y="417" fill="#f6faf5" font-size="21">protection · Smoking · Physical and</text><text x="41" y="444" fill="#f6faf5" font-size="21">emotional stress · Infections</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Avoid the S&#x27;s of lupus : sun/UV light (the</text><text x="41" y="576" fill="#f6faf5" font-size="21">most tested - teach sunscreen, hats and</text><text x="41" y="603" fill="#f6faf5" font-size="21">long sleeves), smoking , stress and</text><text x="41" y="630" fill="#f6faf5" font-size="21">sepsis/infection . Gentle regular exercise</text><text x="41" y="657" fill="#f6faf5" font-size="21">is encouraged to limit fatigue and joint</text><text x="41" y="684" fill="#f6faf5" font-size="21">stiffness, not avoided.</text></g></svg>