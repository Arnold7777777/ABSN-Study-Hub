<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which methods are used to verify endotracheal tube placement? Select all that apply.</title><desc>Placement is confirmed with end-tidal CO2, a chest x-ray, bilateral breath sounds, and symmetrical chest rise. SpO2 alone is unreliable because it lags by minutes — an esophageal intubation can look acceptable on the pulse oximeter at first.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Endotracheal Tube</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which methods are used to verify</text><text x="41" y="198" fill="#f6faf5" font-size="21">endotracheal tube placement? Select all</text><text x="41" y="225" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Chest x-ray · Observation of symmetrical</text><text x="41" y="357" fill="#f6faf5" font-size="21">chest rise · End-tidal CO2 detection ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Auscultation for bilateral breath sounds</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Placement is confirmed with end-tidal CO2,</text><text x="41" y="516" fill="#f6faf5" font-size="21">a chest x-ray, bilateral breath sounds,</text><text x="41" y="543" fill="#f6faf5" font-size="21">and symmetrical chest rise. SpO2 alone is</text><text x="41" y="570" fill="#f6faf5" font-size="21">unreliable because it lags by minutes — an</text><text x="41" y="597" fill="#f6faf5" font-size="21">esophageal intubation can look acceptable</text><text x="41" y="624" fill="#f6faf5" font-size="21">on the pulse oximeter at first.</text></g></svg>