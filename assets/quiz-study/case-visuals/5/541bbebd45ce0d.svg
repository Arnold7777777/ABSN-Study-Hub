<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client sustained a deep laceration from a rusty object. The wound was left open for 10 days while the infection was treated, then surgically closed. This describes which type of wound healing?</title><desc>TERTIARY INTENTION (DELAYED PRIMARY CLOSURE) IS EXACTLY THIS: left open 5–10 days so contamination or infection can be treated, THEN surgically closed. Primary intention is a clean wound closed right away with minimal scarring, and secondary intention is left open to granulate in from the bottom up with significant scarring.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Wound Healing</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client sustained a deep laceration from</text><text x="41" y="198" fill="#f6faf5" font-size="21">a rusty object. The wound was left open</text><text x="41" y="225" fill="#f6faf5" font-size="21">for 10 days while the infection was</text><text x="41" y="252" fill="#f6faf5" font-size="21">treated, then surgically closed. This</text><text x="41" y="279" fill="#f6faf5" font-size="21">describes which type of wound healing?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Tertiary intention</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">TERTIARY INTENTION (DELAYED PRIMARY</text><text x="41" y="516" fill="#f6faf5" font-size="21">CLOSURE) IS EXACTLY THIS: left open 5–10</text><text x="41" y="543" fill="#f6faf5" font-size="21">days so contamination or infection can be</text><text x="41" y="570" fill="#f6faf5" font-size="21">treated, THEN surgically closed.</text></g></svg>