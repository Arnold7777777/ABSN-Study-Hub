<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A 54-year-old man on a med-surg unit has a serum potassium of 2.8 mEq/L. A new order reads: Potassium chloride 20 mEq IV push now. What is the nurse&#x27;s BEST action?</title><desc>Hold the dose and clarify. NEVER IV PUSH POTASSIUM - it causes cardiac arrest. Pushing it slowly, or diluting it in a syringe first, is still an IV push and is still lethal. KCl must be premixed/diluted in a bag and infused on a pump.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">IV Potassium Safety</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 54-year-old man on a med-surg unit has a</text><text x="41" y="198" fill="#f6faf5" font-size="21">serum potassium of 2.8 mEq/L. A new order</text><text x="41" y="225" fill="#f6faf5" font-size="21">reads: Potassium chloride 20 mEq IV push</text><text x="41" y="252" fill="#f6faf5" font-size="21">now. What is the nurse&#x27;s BEST action?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Hold the dose and call the provider to</text><text x="41" y="384" fill="#f6faf5" font-size="21">clarify the route</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Hold the dose and clarify. NEVER IV PUSH</text><text x="41" y="516" fill="#f6faf5" font-size="21">POTASSIUM - it causes cardiac arrest.</text><text x="41" y="543" fill="#f6faf5" font-size="21">Pushing it slowly, or diluting it in a</text><text x="41" y="570" fill="#f6faf5" font-size="21">syringe first, is still an IV push and is</text><text x="41" y="597" fill="#f6faf5" font-size="21">still lethal. KCl must be premixed/diluted</text><text x="41" y="624" fill="#f6faf5" font-size="21">in a bag and infused on a pump.</text></g></svg>