<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client who is receiving warfarin asks the nurse for help shaving. Which item should the nurse provide?</title><desc>An electric razor does not break the skin, which matters for any client on anticoagulants or with a low platelet count because a small shaving nick can bleed for a long time. Shaving cream and warm compresses make a blade shave more comfortable but do nothing to prevent the cut itself.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Shaving Safety</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who is receiving warfarin asks</text><text x="41" y="198" fill="#f6faf5" font-size="21">the nurse for help shaving. Which item</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse provide?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">An electric razor</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">An electric razor does not break the skin,</text><text x="41" y="462" fill="#f6faf5" font-size="21">which matters for any client on</text><text x="41" y="489" fill="#f6faf5" font-size="21">anticoagulants or with a low platelet</text><text x="41" y="516" fill="#f6faf5" font-size="21">count because a small shaving nick can</text><text x="41" y="543" fill="#f6faf5" font-size="21">bleed for a long time. Shaving cream and</text><text x="41" y="570" fill="#f6faf5" font-size="21">warm compresses make a blade shave more</text><text x="41" y="597" fill="#f6faf5" font-size="21">comfortable but do nothing to prevent the</text><text x="41" y="624" fill="#f6faf5" font-size="21">cut itself.</text></g></svg>