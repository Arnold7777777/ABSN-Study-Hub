<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is auscultating lung sounds. Which of the following findings should the nurse report to the provider?</title><desc>Absent sounds suggest collapse, consolidation, or pneumothorax, crackles that persist after coughing suggest fluid rather than mobile secretions, and a grating rub suggests inflamed pleura. Vesicular sounds in the periphery and bronchovesicular sounds between the scapulae are normal for those locations, and reporting them reflects not matching the sound to where it was heard.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Lung Sounds</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is auscultating lung sounds. Which</text><text x="41" y="198" fill="#f6faf5" font-size="21">of the following findings should the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">report to the provider?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Absent breath sounds over the right lower</text><text x="41" y="357" fill="#f6faf5" font-size="21">lobe · Coarse crackles that do not clear</text><text x="41" y="384" fill="#f6faf5" font-size="21">with coughing · A grating sound heard on</text><text x="41" y="411" fill="#f6faf5" font-size="21">both inspiration and expiration over the</text><text x="41" y="438" fill="#f6faf5" font-size="21">lateral chest</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Absent sounds suggest collapse,</text><text x="41" y="570" fill="#f6faf5" font-size="21">consolidation, or pneumothorax, crackles</text><text x="41" y="597" fill="#f6faf5" font-size="21">that persist after coughing suggest fluid</text><text x="41" y="624" fill="#f6faf5" font-size="21">rather than mobile secretions, and a</text><text x="41" y="651" fill="#f6faf5" font-size="21">grating rub suggests inflamed pleura.</text></g></svg>