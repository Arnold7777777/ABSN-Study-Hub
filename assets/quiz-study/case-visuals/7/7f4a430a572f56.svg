<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse reviews contraction patterns on four laboring clients. Which pattern requires intervention?</title><desc>More than 5 contractions in 10 minutes is a red-flag pattern, as are contractions lasting over 90 seconds or fewer than 30 seconds of relaxation, because all three cut placental perfusion. The other patterns leave adequate resting time for uterine blood flow.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Labor &amp; Birth</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse reviews contraction patterns on</text><text x="41" y="198" fill="#f6faf5" font-size="21">four laboring clients. Which pattern</text><text x="41" y="225" fill="#f6faf5" font-size="21">requires intervention?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Six contractions in 10 minutes</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">More than 5 contractions in 10 minutes is</text><text x="41" y="462" fill="#f6faf5" font-size="21">a red-flag pattern, as are contractions</text><text x="41" y="489" fill="#f6faf5" font-size="21">lasting over 90 seconds or fewer than 30</text><text x="41" y="516" fill="#f6faf5" font-size="21">seconds of relaxation, because all three</text><text x="41" y="543" fill="#f6faf5" font-size="21">cut placental perfusion. The other</text><text x="41" y="570" fill="#f6faf5" font-size="21">patterns leave adequate resting time for</text><text x="41" y="597" fill="#f6faf5" font-size="21">uterine blood flow.</text></g></svg>