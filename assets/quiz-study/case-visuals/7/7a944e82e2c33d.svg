<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>Which finding is a positive sign of pregnancy?</title><desc>Positive signs can only be produced by a fetus and must be detected by the examiner: a fetal heartbeat heard or seen, the fetus visualized on sonogram, and fetal movement felt by the examiner . What the client reports feeling is presumptive; a pregnancy test is probable.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which finding is a positive sign of</text><text x="41" y="231" fill="#f6faf5" font-size="21">pregnancy?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">The examiner hears the fetal heartbeat</text><text x="41" y="363" fill="#f6faf5" font-size="21">with a Doppler</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">Positive signs can only be produced by a</text><text x="41" y="495" fill="#f6faf5" font-size="21">fetus and must be detected by the</text><text x="41" y="522" fill="#f6faf5" font-size="21">examiner: a fetal heartbeat heard or seen,</text><text x="41" y="549" fill="#f6faf5" font-size="21">the fetus visualized on sonogram, and</text><text x="41" y="576" fill="#f6faf5" font-size="21">fetal movement felt by the examiner . What</text><text x="41" y="603" fill="#f6faf5" font-size="21">the client reports feeling is presumptive;</text><text x="41" y="630" fill="#f6faf5" font-size="21">a pregnancy test is probable.</text></g></svg>