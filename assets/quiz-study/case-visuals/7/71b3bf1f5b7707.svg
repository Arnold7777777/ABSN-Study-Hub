<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client asks the nurse, &quot;What exactly is a neurotransmitter?&quot; Which response is most accurate?</title><desc>Neurotransmitters are chemicals manufactured by neurons that cross the synapse to relay information throughout the body. They are not electrical impulses — the impulse triggers release of the chemical, and the chemical carries the message across the gap.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Foundations, Neurobiology &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Psychopharm Basics</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client asks the nurse, &quot;What exactly is</text><text x="41" y="231" fill="#f6faf5" font-size="21">a neurotransmitter?&quot; Which response is</text><text x="41" y="258" fill="#f6faf5" font-size="21">most accurate?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">They are chemical substances made by</text><text x="41" y="390" fill="#f6faf5" font-size="21">neurons that carry information from one</text><text x="41" y="417" fill="#f6faf5" font-size="21">nerve cell to the next</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Neurotransmitters are chemicals</text><text x="41" y="549" fill="#f6faf5" font-size="21">manufactured by neurons that cross the</text><text x="41" y="576" fill="#f6faf5" font-size="21">synapse to relay information throughout</text><text x="41" y="603" fill="#f6faf5" font-size="21">the body. They are not electrical impulses</text><text x="41" y="630" fill="#f6faf5" font-size="21">— the impulse triggers release of the</text><text x="41" y="657" fill="#f6faf5" font-size="21">chemical, and the chemical carries the</text><text x="41" y="684" fill="#f6faf5" font-size="21">message across the gap.</text></g></svg>