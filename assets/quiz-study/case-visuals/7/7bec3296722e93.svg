<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which nursing measures address a preschooler&#x27;s fears about hospitalization? Select all that apply.</title><desc>Preschoolers fear bodily mutilation , so a plaster over a puncture genuinely reassures. They also believe illness is punishment, so saying plainly that it is not is a real intervention. Painful procedures are done in a treatment room , never in bed - the bed must stay safe.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Toddler &amp; Preschooler</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which nursing measures address a</text><text x="41" y="198" fill="#f6faf5" font-size="21">preschooler&#x27;s fears about hospitalization?</text><text x="41" y="225" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Use bandages after procedures · Allow</text><text x="41" y="357" fill="#f6faf5" font-size="21">choices where real choices exist · Correct</text><text x="41" y="384" fill="#f6faf5" font-size="21">magical thinking that illness is a</text><text x="41" y="411" fill="#f6faf5" font-size="21">punishment · Encourage medical play</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Preschoolers fear bodily mutilation , so a</text><text x="41" y="543" fill="#f6faf5" font-size="21">plaster over a puncture genuinely</text><text x="41" y="570" fill="#f6faf5" font-size="21">reassures. They also believe illness is</text><text x="41" y="597" fill="#f6faf5" font-size="21">punishment, so saying plainly that it is</text><text x="41" y="624" fill="#f6faf5" font-size="21">not is a real intervention. Painful</text><text x="41" y="651" fill="#f6faf5" font-size="21">procedures are done in a treatment room ,</text><text x="41" y="678" fill="#f6faf5" font-size="21">never in bed - the bed must stay safe.</text></g></svg>