<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Pernicious anemia develops when the stomach fails to secrete a substance that is required for absorption of a specific nutrient in the ileum. Which pairing is correct?</title><desc>INTRINSIC FACTOR, SECRETED BY GASTRIC PARIETAL CELLS, IS ESSENTIAL FOR ABSORPTION OF VITAMIN B12 IN THE TERMINAL ILEUM. Loss of intrinsic factor leads to B12 deficiency and pernicious anemia. Folic acid does not require intrinsic factor for its absorption.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">pernicious anemia</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Pernicious anemia develops when the</text><text x="41" y="198" fill="#f6faf5" font-size="21">stomach fails to secrete a substance that</text><text x="41" y="225" fill="#f6faf5" font-size="21">is required for absorption of a specific</text><text x="41" y="252" fill="#f6faf5" font-size="21">nutrient in the ileum. Which pairing is</text><text x="41" y="279" fill="#f6faf5" font-size="21">correct?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Intrinsic factor — vitamin B12</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">INTRINSIC FACTOR, SECRETED BY GASTRIC</text><text x="41" y="516" fill="#f6faf5" font-size="21">PARIETAL CELLS, IS ESSENTIAL FOR</text><text x="41" y="543" fill="#f6faf5" font-size="21">ABSORPTION OF VITAMIN B12 IN THE TERMINAL</text><text x="41" y="570" fill="#f6faf5" font-size="21">ILEUM. Loss of intrinsic factor leads to</text><text x="41" y="597" fill="#f6faf5" font-size="21">B12 deficiency and pernicious anemia.</text><text x="41" y="624" fill="#f6faf5" font-size="21">Folic acid does not require intrinsic</text><text x="41" y="651" fill="#f6faf5" font-size="21">factor for its absorption.</text></g></svg>