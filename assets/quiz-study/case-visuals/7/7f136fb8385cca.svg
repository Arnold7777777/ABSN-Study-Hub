<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A child with sickle cell crisis weighs 16 kg and is receiving IV maintenance fluids at 52 mL/hr. Using the maintenance formula (up to 10 kg: 100 mL/kg; 11–20 kg: 1,000 mL + 50 mL/kg for each kg over 10), the nurse double-checks the rate. Which conclusion is correct?</title><desc>1,000 mL + 50 mL × 6 kg = 1,300 mL per 24 hr ÷ 24 = 54.2 mL/hr , so 52 mL/hr is still acceptable. 1,300 is the daily total, not the hourly rate; 66.7 mL/hr uses 100 mL/kg for all 16 kg; 5.4 mL/hr is a decimal slip.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology &amp; Childhood Neoplasms</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A child with sickle cell crisis weighs 16</text><text x="41" y="198" fill="#f6faf5" font-size="21">kg and is receiving IV maintenance fluids</text><text x="41" y="225" fill="#f6faf5" font-size="21">at 52 mL/hr.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The maintenance rate is about 54.2 mL/hr,</text><text x="41" y="357" fill="#f6faf5" font-size="21">so 52 mL/hr is acceptable.</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">1,000 mL + 50 mL × 6 kg = 1,300 mL per 24</text><text x="41" y="489" fill="#f6faf5" font-size="21">hr ÷ 24 = 54.2 mL/hr , so 52 mL/hr is</text><text x="41" y="516" fill="#f6faf5" font-size="21">still acceptable. 1,300 is the daily</text><text x="41" y="543" fill="#f6faf5" font-size="21">total, not the hourly rate; 66.7 mL/hr</text><text x="41" y="570" fill="#f6faf5" font-size="21">uses 100 mL/kg for all 16 kg; 5.4 mL/hr is</text><text x="41" y="597" fill="#f6faf5" font-size="21">a decimal slip.</text></g></svg>