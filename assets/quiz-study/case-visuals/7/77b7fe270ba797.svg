<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client who is Rh-negative and unsensitized is at 28 weeks of gestation. Which statement about Rho(D) immune globulin is correct?</title><desc>The standard schedule is 26 to 28 weeks and again within 72 hours of birth of an Rh-positive newborn . It is also indicated after amniocentesis, after external version, and after any loss, ectopic or molar evacuation.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client who is Rh-negative and</text><text x="41" y="231" fill="#f6faf5" font-size="21">unsensitized is at 28 weeks of gestation.</text><text x="41" y="258" fill="#f6faf5" font-size="21">Which statement about Rho(D) immune</text><text x="41" y="285" fill="#f6faf5" font-size="21">globulin is correct?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">It is given at 28 weeks and again within</text><text x="41" y="417" fill="#f6faf5" font-size="21">72 hours of birth if the newborn is Rh-</text><text x="41" y="444" fill="#f6faf5" font-size="21">positive</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">The standard schedule is 26 to 28 weeks</text><text x="41" y="576" fill="#f6faf5" font-size="21">and again within 72 hours of birth of an</text><text x="41" y="603" fill="#f6faf5" font-size="21">Rh-positive newborn . It is also indicated</text><text x="41" y="630" fill="#f6faf5" font-size="21">after amniocentesis, after external</text><text x="41" y="657" fill="#f6faf5" font-size="21">version, and after any loss, ectopic or</text><text x="41" y="684" fill="#f6faf5" font-size="21">molar evacuation.</text></g></svg>