<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="596" viewBox="0 0 640 596"><title>A client admitted for seizure monitoring has been in a generalized tonic-clonic seizure for 7 minutes without regaining consciousness. The airway is protected and she is positioned on her side. Which intervention does the nurse anticipate first?</title><desc>A seizure lasting longer than 5 minutes is status epilepticus, and IV lorazepam is given first ; fosphenytoin or levetiracetam follows to keep the seizure from returning. Fosphenytoin is the tempting choice because it is the drug that maintains control, but it is not the first agent — and nothing is ever placed in the mouth during a seizure.</desc><rect width="640" height="596" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic Dysfunction &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Cerebrovascular Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client admitted for seizure monitoring</text><text x="41" y="231" fill="#f6faf5" font-size="21">has been in a generalized tonic-clonic</text><text x="41" y="258" fill="#f6faf5" font-size="21">seizure for 7 minutes without regaining</text><text x="41" y="285" fill="#f6faf5" font-size="21">consciousness.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Administering IV lorazepam</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">A seizure lasting longer than 5 minutes is</text><text x="41" y="522" fill="#f6faf5" font-size="21">status epilepticus, and IV lorazepam is</text><text x="41" y="549" fill="#f6faf5" font-size="21">given first ;</text></g></svg>