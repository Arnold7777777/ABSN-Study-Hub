<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A client with a traumatic brain injury has cerebral edema and an ICP of 24 mm Hg. Which IV fluid does the nurse anticipate the provider prescribing?</title><desc>Hypertonic (3%) saline pulls water out of swollen brain tissue into the bloodstream and lowers ICP, like the osmotic diuretic mannitol. Hypotonic fluids such as 0.45% saline and D5W, which acts as free water, move fluid into the brain cells and worsen cerebral edema.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic Dysfunction &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Cerebrovascular Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client with a traumatic brain injury has</text><text x="41" y="231" fill="#f6faf5" font-size="21">cerebral edema and an ICP of 24 mm Hg.</text><text x="41" y="258" fill="#f6faf5" font-size="21">Which IV fluid does the nurse anticipate</text><text x="41" y="285" fill="#f6faf5" font-size="21">the provider prescribing?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">3% sodium chloride</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Hypertonic (3%) saline pulls water out of</text><text x="41" y="522" fill="#f6faf5" font-size="21">swollen brain tissue into the bloodstream</text><text x="41" y="549" fill="#f6faf5" font-size="21">and lowers ICP, like the osmotic diuretic</text><text x="41" y="576" fill="#f6faf5" font-size="21">mannitol. Hypotonic fluids such as 0.45%</text><text x="41" y="603" fill="#f6faf5" font-size="21">saline and D5W, which acts as free water,</text><text x="41" y="630" fill="#f6faf5" font-size="21">move fluid into the brain cells and worsen</text><text x="41" y="657" fill="#f6faf5" font-size="21">cerebral edema.</text></g></svg>