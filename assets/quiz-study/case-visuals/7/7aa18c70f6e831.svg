<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is teaching a community group about levels of prevention. Which activity should the nurse describe as primary prevention?</title><desc>Primary prevention happens before any disease or injury occurs and protects healthy people, so car seat education fits. Colorectal screening is tempting, but screening finds disease that is already present without symptoms, which makes it secondary prevention.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Levels of Prevention</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a community group</text><text x="41" y="198" fill="#f6faf5" font-size="21">about levels of prevention. Which activity</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse describe as primary</text><text x="41" y="252" fill="#f6faf5" font-size="21">prevention?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Leading a car seat installation class for</text><text x="41" y="384" fill="#f6faf5" font-size="21">expectant parents</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Primary prevention happens before any</text><text x="41" y="516" fill="#f6faf5" font-size="21">disease or injury occurs and protects</text><text x="41" y="543" fill="#f6faf5" font-size="21">healthy people, so car seat education</text><text x="41" y="570" fill="#f6faf5" font-size="21">fits. Colorectal screening is tempting,</text><text x="41" y="597" fill="#f6faf5" font-size="21">but screening finds disease that is</text><text x="41" y="624" fill="#f6faf5" font-size="21">already present without symptoms, which</text><text x="41" y="651" fill="#f6faf5" font-size="21">makes it secondary prevention.</text></g></svg>