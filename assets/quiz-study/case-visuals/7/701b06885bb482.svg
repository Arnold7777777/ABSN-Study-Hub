<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>Which findings indicate that rapport has been established between the nurse and client? Select all that apply.</title><desc>Rapport is harmony and understanding demonstrated by mutual respect, acceptance, trust, and open communication. Secret-keeping and refusing all other staff signal boundary blurring and dependence, which look like closeness but are not rapport.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which findings indicate that rapport has</text><text x="41" y="231" fill="#f6faf5" font-size="21">been established between the nurse and</text><text x="41" y="258" fill="#f6faf5" font-size="21">client? Select all that apply.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Mutual respect · Acceptance · Trust · Open</text><text x="41" y="390" fill="#f6faf5" font-size="21">communication</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Rapport is harmony and understanding</text><text x="41" y="522" fill="#f6faf5" font-size="21">demonstrated by mutual respect,</text><text x="41" y="549" fill="#f6faf5" font-size="21">acceptance, trust, and open communication.</text><text x="41" y="576" fill="#f6faf5" font-size="21">Secret-keeping and refusing all other</text><text x="41" y="603" fill="#f6faf5" font-size="21">staff signal boundary blurring and</text><text x="41" y="630" fill="#f6faf5" font-size="21">dependence, which look like closeness but</text><text x="41" y="657" fill="#f6faf5" font-size="21">are not rapport.</text></g></svg>