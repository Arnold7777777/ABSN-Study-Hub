<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>The nurse administers a sedative-hypnotic at 2200 to an older adult client. Which action is the priority?</title><desc>Sedatives cause confusion and unsteady gait in older adults, so fall prevention is the priority right after administration. Extra fluids are actively harmful here because they send a sedated client to the bathroom repeatedly during the night.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sedative Safety</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse administers a sedative-hypnotic</text><text x="41" y="198" fill="#f6faf5" font-size="21">at 2200 to an older adult client. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">action is the priority?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Lower the bed, ensure the call light is</text><text x="41" y="357" fill="#f6faf5" font-size="21">within reach, and remind the client to</text><text x="41" y="384" fill="#f6faf5" font-size="21">call before getting up</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Sedatives cause confusion and unsteady</text><text x="41" y="516" fill="#f6faf5" font-size="21">gait in older adults, so fall prevention</text><text x="41" y="543" fill="#f6faf5" font-size="21">is the priority right after</text><text x="41" y="570" fill="#f6faf5" font-size="21">administration. Extra fluids are actively</text><text x="41" y="597" fill="#f6faf5" font-size="21">harmful here because they send a sedated</text><text x="41" y="624" fill="#f6faf5" font-size="21">client to the bathroom repeatedly during</text><text x="41" y="651" fill="#f6faf5" font-size="21">the night.</text></g></svg>