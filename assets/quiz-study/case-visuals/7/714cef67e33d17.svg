<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>An 78-year-old client says, &quot;Something is wrong with me. I fall asleep by 8:30 p.m., wake up three or four times at night, and I am wide awake at 5 a.m.&quot; Which response by the nurse is most appropriate?</title><desc>NORMAL AGE-RELATED SLEEP CHANGES INCLUDE EARLIER BEDTIME AND WAKE TIME, MORE FREQUENT AWAKENINGS, LESS N3 DEEP SLEEP, AND MORE DAYTIME NAPPING; total sleep need remains about 7 to 9 hours. Validating the change while assessing daytime habits, including naps, is therapeutic and gathers data. Routinely recommending nightly sleep aids is unsafe in older adults because sedative-hypnotics increase confusion and fall risk.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sleep and Aging</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An 78-year-old client says, &quot;Something is</text><text x="41" y="198" fill="#f6faf5" font-size="21">wrong with me. I fall asleep by 8:30 p.m.,</text><text x="41" y="225" fill="#f6faf5" font-size="21">wake up three or four times at night, and</text><text x="41" y="252" fill="#f6faf5" font-size="21">I am wide awake at 5 a.m.&quot; Which response</text><text x="41" y="279" fill="#f6faf5" font-size="21">by the nurse is most appropriate?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&quot;Earlier bedtimes and more nighttime</text><text x="41" y="411" fill="#f6faf5" font-size="21">awakenings are expected changes with</text><text x="41" y="438" fill="#f6faf5" font-size="21">aging; let&#x27;s review what your daytime</text><text x="41" y="465" fill="#f6faf5" font-size="21">routine looks like.&quot;</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">NORMAL AGE-RELATED SLEEP CHANGES INCLUDE</text><text x="41" y="597" fill="#f6faf5" font-size="21">EARLIER BEDTIME AND WAKE TIME, MORE</text><text x="41" y="624" fill="#f6faf5" font-size="21">FREQUENT AWAKENINGS, LESS N3 DEEP SLEEP,</text><text x="41" y="651" fill="#f6faf5" font-size="21">AND MORE DAYTIME NAPPING;</text></g></svg>