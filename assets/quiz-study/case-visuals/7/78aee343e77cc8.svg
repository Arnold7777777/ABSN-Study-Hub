<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A medical client rings the call bell and expresses alarm to the nurse, stating, &quot;I&#x27;ve just coughed up this blood. That can&#x27;t be good, can it?&quot; How can the nurse best determine whether the source of the blood was the client&#x27;s lungs?</title><desc>Though not definitive, blood from the lung is usually bright red, frothy, and mixed with sputum. Testing the pH of nonarterial blood samples is not common practice and would not provide important data. Similarly, oral suctioning and swabbing the client&#x27;s mouth would not reveal the source.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 6 · ABGs / Acid-Base</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A medical client rings the call bell and</text><text x="41" y="198" fill="#f6faf5" font-size="21">expresses alarm to the nurse, stating,</text><text x="41" y="225" fill="#f6faf5" font-size="21">&quot;I&#x27;ve just coughed up this blood.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Try to see if the blood is frothy or mixed</text><text x="41" y="357" fill="#f6faf5" font-size="21">with mucus.</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Though not definitive, blood from the lung</text><text x="41" y="489" fill="#f6faf5" font-size="21">is usually bright red, frothy, and mixed</text><text x="41" y="516" fill="#f6faf5" font-size="21">with sputum. Testing the pH of nonarterial</text><text x="41" y="543" fill="#f6faf5" font-size="21">blood samples is not common practice and</text><text x="41" y="570" fill="#f6faf5" font-size="21">would not provide important data.</text><text x="41" y="597" fill="#f6faf5" font-size="21">Similarly, oral suctioning and swabbing</text><text x="41" y="624" fill="#f6faf5" font-size="21">the client&#x27;s mouth would not reveal the</text><text x="41" y="651" fill="#f6faf5" font-size="21">source.</text></g></svg>