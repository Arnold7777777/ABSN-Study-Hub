<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A neighbor calls the unit and says, &quot;I heard Mrs. Vaughn is on your floor. How is she doing?&quot; Which response by the nurse is correct?</title><desc>Even confirming that a person is a client can breach privacy. The partial answer is the trap, because &quot;stable&quot; is still health information. Send the caller to the family or to the client herself.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Confidentiality</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A neighbor calls the unit and says, &quot;I</text><text x="41" y="198" fill="#f6faf5" font-size="21">heard Mrs. Vaughn is on your floor. How is</text><text x="41" y="225" fill="#f6faf5" font-size="21">she doing?&quot; Which response by the nurse is</text><text x="41" y="252" fill="#f6faf5" font-size="21">correct?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;I am not able to confirm or discuss</text><text x="41" y="384" fill="#f6faf5" font-size="21">anyone who might be here.&quot;</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Even confirming that a person is a client</text><text x="41" y="516" fill="#f6faf5" font-size="21">can breach privacy. The partial answer is</text><text x="41" y="543" fill="#f6faf5" font-size="21">the trap, because &quot;stable&quot; is still health</text><text x="41" y="570" fill="#f6faf5" font-size="21">information. Send the caller to the family</text><text x="41" y="597" fill="#f6faf5" font-size="21">or to the client herself.</text></g></svg>