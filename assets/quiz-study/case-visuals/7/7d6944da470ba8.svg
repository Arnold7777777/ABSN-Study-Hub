<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse gives an oral medication to an infant, who pushes some of it back out with the tongue. What should the nurse do?</title><desc>Tongue thrust is a reflex, not a refusal. Collect what is pushed out with the edge of the syringe and give it again slowly. A second full dose would be an overdose, and putting it into a bottle means the dose depends on how much the infant finishes.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Infant (0–1 year)</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse gives an oral medication to an</text><text x="41" y="198" fill="#f6faf5" font-size="21">infant, who pushes some of it back out</text><text x="41" y="225" fill="#f6faf5" font-size="21">with the tongue. What should the nurse do?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Scoop the medication from the lips and</text><text x="41" y="357" fill="#f6faf5" font-size="21">chin with the syringe and re-offer it</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Tongue thrust is a reflex, not a refusal.</text><text x="41" y="489" fill="#f6faf5" font-size="21">Collect what is pushed out with the edge</text><text x="41" y="516" fill="#f6faf5" font-size="21">of the syringe and give it again slowly. A</text><text x="41" y="543" fill="#f6faf5" font-size="21">second full dose would be an overdose, and</text><text x="41" y="570" fill="#f6faf5" font-size="21">putting it into a bottle means the dose</text><text x="41" y="597" fill="#f6faf5" font-size="21">depends on how much the infant finishes.</text></g></svg>