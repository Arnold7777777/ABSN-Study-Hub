<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which findings should the nurse report as early cues of a medication emergency?</title><desc>Fever, severe rigidity, and autonomic instability appearing one to three days after a dopamine blocker was started or increased is the neuroleptic malignant syndrome picture. Clear lungs and no urinary symptoms make an infectious source less likely, which makes the drug reaction more likely rather than less. Staying in bed is a consequence of the rigidity, not an independent cue.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neuroleptic Malignant Syndrome</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which findings should the nurse report as</text><text x="41" y="198" fill="#f6faf5" font-size="21">early cues of a medication emergency?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Temperature of 38.3 degrees Celsius with</text><text x="41" y="330" fill="#f6faf5" font-size="21">no obvious source of infection · Rigidity</text><text x="41" y="357" fill="#f6faf5" font-size="21">that resists movement through the entire</text><text x="41" y="384" fill="#f6faf5" font-size="21">range · Heart rate 112 with blood pressure</text><text x="41" y="411" fill="#f6faf5" font-size="21">148/90 and heavy…</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Fever, severe rigidity, and autonomic</text><text x="41" y="543" fill="#f6faf5" font-size="21">instability appearing one to three days</text><text x="41" y="570" fill="#f6faf5" font-size="21">after a dopamine blocker was started or</text><text x="41" y="597" fill="#f6faf5" font-size="21">increased is the neuroleptic malignant</text><text x="41" y="624" fill="#f6faf5" font-size="21">syndrome picture.</text></g></svg>