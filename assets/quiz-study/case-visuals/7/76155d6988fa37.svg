<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A child weighs 16 kg. Using the Holliday-Segar method, how many milliliters of maintenance fluid should this child receive in 24 hours?</title><desc>100 mL/kg for the first 10 kg = 1,000 mL, then 50 mL/kg for kg 11-20 = 6 x 50 = 300 mL, totaling 1,300 mL/day . 1,600 comes from misapplying the over-20-kg step, and 1,800 comes from using 100 mL/kg throughout.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A child weighs 16 kg. Using the Holliday-</text><text x="41" y="198" fill="#f6faf5" font-size="21">Segar method, how many milliliters of</text><text x="41" y="225" fill="#f6faf5" font-size="21">maintenance fluid should this child</text><text x="41" y="252" fill="#f6faf5" font-size="21">receive in 24 hours?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">1,300 mL</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">100 mL/kg for the first 10 kg = 1,000 mL,</text><text x="41" y="489" fill="#f6faf5" font-size="21">then 50 mL/kg for kg 11-20 = 6 x 50 = 300</text><text x="41" y="516" fill="#f6faf5" font-size="21">mL, totaling 1,300 mL/day . 1,600 comes</text><text x="41" y="543" fill="#f6faf5" font-size="21">from misapplying the over-20-kg step, and</text><text x="41" y="570" fill="#f6faf5" font-size="21">1,800 comes from using 100 mL/kg</text><text x="41" y="597" fill="#f6faf5" font-size="21">throughout.</text></g></svg>