<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A charge nurse is reviewing types of prescriptions with a newly licensed nurse. Which prescription is an example of a standing prescription?</title><desc>A standing prescription is protocol based: it tells the nurse what to do when a defined situation arises, such as a fever. A PRN order is given at the nurse&#x27;s judgment when the client needs it. A stat order is given once, immediately. A single order is given once, at a specified time.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Medication Orders</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A charge nurse is reviewing types of</text><text x="41" y="198" fill="#f6faf5" font-size="21">prescriptions with a newly licensed nurse.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which prescription is an example of a</text><text x="41" y="252" fill="#f6faf5" font-size="21">standing prescription?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Acetaminophen 650 mg by mouth every 6 hr</text><text x="41" y="384" fill="#f6faf5" font-size="21">for temperature greater than 38.4°C</text><text x="41" y="411" fill="#f6faf5" font-size="21">(101.2°F)</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A standing prescription is protocol based:</text><text x="41" y="543" fill="#f6faf5" font-size="21">it tells the nurse what to do when a</text><text x="41" y="570" fill="#f6faf5" font-size="21">defined situation arises, such as a fever.</text><text x="41" y="597" fill="#f6faf5" font-size="21">A PRN order is given at the nurse&#x27;s</text><text x="41" y="624" fill="#f6faf5" font-size="21">judgment when the client needs it. A stat</text><text x="41" y="651" fill="#f6faf5" font-size="21">order is given once, immediately. A single</text><text x="41" y="678" fill="#f6faf5" font-size="21">order is given once, at a specified time.</text></g></svg>