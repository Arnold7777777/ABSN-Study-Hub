<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>Which teaching points are appropriate for a school-age child starting methylphenidate for ADHD? Select all that apply.</title><desc>Stimulants cause insomnia, appetite suppression with growth effects, and have abuse potential (Schedule II). Doses should be given with or after meals to reduce appetite loss, so the empty-stomach instruction is incorrect.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which teaching points are appropriate for</text><text x="41" y="198" fill="#f6faf5" font-size="21">a school-age child starting</text><text x="41" y="225" fill="#f6faf5" font-size="21">methylphenidate for ADHD? Select all that</text><text x="41" y="252" fill="#f6faf5" font-size="21">apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Give the last dose by mid-afternoon to</text><text x="41" y="384" fill="#f6faf5" font-size="21">limit insomnia · Monitor height and weight</text><text x="41" y="411" fill="#f6faf5" font-size="21">over time · Store the medication in a</text><text x="41" y="438" fill="#f6faf5" font-size="21">locked, secure place · The medication is a</text><text x="41" y="465" fill="#f6faf5" font-size="21">controlled substance and…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Stimulants cause insomnia, appetite</text><text x="41" y="597" fill="#f6faf5" font-size="21">suppression with growth effects, and have</text><text x="41" y="624" fill="#f6faf5" font-size="21">abuse potential (Schedule II). Doses</text><text x="41" y="651" fill="#f6faf5" font-size="21">should be given with or after meals to</text><text x="41" y="678" fill="#f6faf5" font-size="21">reduce appetite loss, so the empty-stomach</text><text x="41" y="705" fill="#f6faf5" font-size="21">instruction is incorrect.</text></g></svg>