<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>In the hospital cafeteria, a nurse tells friends who do not work there that a named client &quot;is faking her pain to score pills.&quot; The statement is untrue and gets back to the client&#x27;s employer. Which term describes this?</title><desc>False statements that damage a reputation are slander when spoken and libel when written. The nurse spoke, so slander fits. Libel is the near-miss answer; the difference is only the format of the false statement.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Negligence &amp; Liability</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">In the hospital cafeteria, a nurse tells</text><text x="41" y="198" fill="#f6faf5" font-size="21">friends who do not work there that a named</text><text x="41" y="225" fill="#f6faf5" font-size="21">client &quot;is faking her pain to score</text><text x="41" y="252" fill="#f6faf5" font-size="21">pills.&quot; The statement is untrue and gets</text><text x="41" y="279" fill="#f6faf5" font-size="21">back to the client&#x27;s employer.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Slander, a form of defamation</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">False statements that damage a reputation</text><text x="41" y="516" fill="#f6faf5" font-size="21">are slander when spoken and libel when</text><text x="41" y="543" fill="#f6faf5" font-size="21">written. The nurse spoke, so slander fits.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Libel is the near-miss answer; the</text><text x="41" y="597" fill="#f6faf5" font-size="21">difference is only the format of the false</text><text x="41" y="624" fill="#f6faf5" font-size="21">statement.</text></g></svg>