<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is caring for four clients. Which of the following clients should the nurse suction first?</title><desc>RISING PEAK INSPIRATORY PRESSURE PLUS GURGLING PLUS AGITATION = SECRETIONS OBSTRUCTING THE AIRWAY, the only client with an airway that is actively failing to clear. The tracheostomy client with clear sounds and an effective cough is clearing secretions on his own, and the postoperative client with a strong cough and SpO2 of 97% needs coughing and deep breathing, not a catheter. Diminished sounds at a chest tube site with pleuritic pain point to splinting and pain control, not suctioning.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for four clients. Which</text><text x="41" y="198" fill="#f6faf5" font-size="21">of the following clients should the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">suction first?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A 72-year-old on a ventilator with rising</text><text x="41" y="357" fill="#f6faf5" font-size="21">peak inspiratory pressures, coarse</text><text x="41" y="384" fill="#f6faf5" font-size="21">gurgling over the trachea, and increasing</text><text x="41" y="411" fill="#f6faf5" font-size="21">agitation</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">RISING PEAK INSPIRATORY PRESSURE PLUS</text><text x="41" y="543" fill="#f6faf5" font-size="21">GURGLING PLUS AGITATION = SECRETIONS</text><text x="41" y="570" fill="#f6faf5" font-size="21">OBSTRUCTING THE AIRWAY, the only client</text><text x="41" y="597" fill="#f6faf5" font-size="21">with an airway that is actively failing to</text><text x="41" y="624" fill="#f6faf5" font-size="21">clear.</text></g></svg>