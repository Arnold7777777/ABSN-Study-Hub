<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A hospitalized 2-year-old screams and pushes the cup away at every medication time and keeps pulling at his IV dressing. Which nursing approaches are appropriate for this child? Select all that apply.</title><desc>A toddler&#x27;s need is control , met by limited choices, preserved routines, and ignoring tantrum behavior while keeping the child safe, since attention reinforces it. An open question like &quot;Will you take your medicine?&quot; sounds respectful but hands a negativistic toddler the word &quot;no,&quot; and a detailed explanation is what a preschooler needs, not a 2-year-old.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Toddler &amp; Preschooler</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A hospitalized 2-year-old screams and</text><text x="41" y="198" fill="#f6faf5" font-size="21">pushes the cup away at every medication</text><text x="41" y="225" fill="#f6faf5" font-size="21">time and keeps pulling at his IV dressing.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which nursing approaches are appropriate</text><text x="41" y="279" fill="#f6faf5" font-size="21">for this child? Select all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Offer a choice between two acceptable</text><text x="41" y="411" fill="#f6faf5" font-size="21">options, such as &quot;Do you want the pink cup</text><text x="41" y="438" fill="#f6faf5" font-size="21">or the blue cup?&quot; · Keep his home routines</text><text x="41" y="465" fill="#f6faf5" font-size="21">and rituals in place around care times ·</text><text x="41" y="492" fill="#f6faf5" font-size="21">If he has a tantrum,…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">A toddler&#x27;s need is control , met by</text><text x="41" y="624" fill="#f6faf5" font-size="21">limited choices, preserved routines, and</text><text x="41" y="651" fill="#f6faf5" font-size="21">ignoring tantrum behavior while keeping</text><text x="41" y="678" fill="#f6faf5" font-size="21">the child safe, since attention reinforces</text><text x="41" y="705" fill="#f6faf5" font-size="21">it.</text></g></svg>