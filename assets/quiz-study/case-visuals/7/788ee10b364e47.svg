<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client with borderline personality disorder makes frequent small requests and stays near the nurses&#x27; station most of the day. How should the nurse interpret this behavior?</title><desc>An intense fear of abandonment drives clinging, attention-seeking behavior in borderline personality disorder. Respond with consistent limits and scheduled, predictable contact rather than reacting to each request.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Borderline personality - fear of</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">abandonment</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client with borderline personality</text><text x="41" y="231" fill="#f6faf5" font-size="21">disorder makes frequent small requests and</text><text x="41" y="258" fill="#f6faf5" font-size="21">stays near the nurses&#x27; station most of the</text><text x="41" y="285" fill="#f6faf5" font-size="21">day. How should the nurse interpret this</text><text x="41" y="312" fill="#f6faf5" font-size="21">behavior?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Fear of abandonment and a need for</text><text x="41" y="444" fill="#f6faf5" font-size="21">attention</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">An intense fear of abandonment drives</text><text x="41" y="576" fill="#f6faf5" font-size="21">clinging, attention-seeking behavior in</text><text x="41" y="603" fill="#f6faf5" font-size="21">borderline personality disorder. Respond</text><text x="41" y="630" fill="#f6faf5" font-size="21">with consistent limits and scheduled,</text><text x="41" y="657" fill="#f6faf5" font-size="21">predictable contact rather than reacting</text><text x="41" y="684" fill="#f6faf5" font-size="21">to each request.</text></g></svg>