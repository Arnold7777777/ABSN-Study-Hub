<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>Match each antidepressant class to its key client teaching point.</title><desc>The teaching point that matters most differs by class: SSRIs → delayed onset and the suicide-risk window, MAOIs → tyramine, TCAs → anticholinergic effects and overdose lethality, SNRIs → blood pressure .</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match each antidepressant class to its key</text><text x="41" y="198" fill="#f6faf5" font-size="21">client teaching point.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="222" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">The teaching point that matters most</text><text x="41" y="330" fill="#f6faf5" font-size="21">differs by class: SSRIs → delayed onset</text><text x="41" y="357" fill="#f6faf5" font-size="21">and the suicide-risk window, MAOIs →</text><text x="41" y="384" fill="#f6faf5" font-size="21">tyramine, TCAs → anticholinergic effects</text><text x="41" y="411" fill="#f6faf5" font-size="21">and overdose lethality, SNRIs → blood</text><text x="41" y="438" fill="#f6faf5" font-size="21">pressure .</text></g></svg>