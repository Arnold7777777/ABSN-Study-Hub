<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A nurse reviews four clients in the early pregnancy clinic. Which client does the nurse assess first?</title><desc>First-trimester bleeding with cramping is the priority finding, suggesting threatened miscarriage or ectopic pregnancy, and calls for ultrasound and hCG. Nausea, urinary frequency and absent fetal movement at 10 weeks are all expected.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse reviews four clients in the early</text><text x="41" y="231" fill="#f6faf5" font-size="21">pregnancy clinic. Which client does the</text><text x="41" y="258" fill="#f6faf5" font-size="21">nurse assess first?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">A client at 10 weeks with vaginal bleeding</text><text x="41" y="390" fill="#f6faf5" font-size="21">and cramping</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">First-trimester bleeding with cramping is</text><text x="41" y="522" fill="#f6faf5" font-size="21">the priority finding, suggesting</text><text x="41" y="549" fill="#f6faf5" font-size="21">threatened miscarriage or ectopic</text><text x="41" y="576" fill="#f6faf5" font-size="21">pregnancy, and calls for ultrasound and</text><text x="41" y="603" fill="#f6faf5" font-size="21">hCG. Nausea, urinary frequency and absent</text><text x="41" y="630" fill="#f6faf5" font-size="21">fetal movement at 10 weeks are all</text><text x="41" y="657" fill="#f6faf5" font-size="21">expected.</text></g></svg>