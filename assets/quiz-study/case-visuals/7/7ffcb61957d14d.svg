<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client who has opioid use disorder states, “I was just using the medication for my back. I can stop whenever I want.” Which defense mechanism is the client using?</title><desc>Denial — refusing to accept the reality of the problem. This is the answer that trips people up on intellectualization items: it is a refusal , not a lecture. No facts, statistics, or theory appear here.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who has opioid use disorder</text><text x="41" y="198" fill="#f6faf5" font-size="21">states, “I was just using the medication</text><text x="41" y="225" fill="#f6faf5" font-size="21">for my back. I can stop whenever I want.”</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which defense mechanism is the client</text><text x="41" y="279" fill="#f6faf5" font-size="21">using?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Denial</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Denial — refusing to accept the reality of</text><text x="41" y="516" fill="#f6faf5" font-size="21">the problem. This is the answer that trips</text><text x="41" y="543" fill="#f6faf5" font-size="21">people up on intellectualization items: it</text><text x="41" y="570" fill="#f6faf5" font-size="21">is a refusal , not a lecture. No facts,</text><text x="41" y="597" fill="#f6faf5" font-size="21">statistics, or theory appear here.</text></g></svg>