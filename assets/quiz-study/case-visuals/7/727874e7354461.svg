<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>What is the correct sequence for ECG rhythm interpretation?</title><desc>The ATI/NCLEX standard sequence: 1-Rate, 2-Rhythm regularity, 3-P wave assessment, 4-PR interval, 5-QRS duration, 6-T wave/ST segment changes. Following this sequence prevents missing key findings.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">ECG Basics</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">What is the correct sequence for ECG</text><text x="41" y="198" fill="#f6faf5" font-size="21">rhythm interpretation?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Rate -&gt; Rhythm regularity -&gt; P wave -&gt; PR</text><text x="41" y="330" fill="#f6faf5" font-size="21">interval -&gt; QRS -&gt; T wave</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">The ATI/NCLEX standard sequence: 1-Rate,</text><text x="41" y="462" fill="#f6faf5" font-size="21">2-Rhythm regularity, 3-P wave assessment,</text><text x="41" y="489" fill="#f6faf5" font-size="21">4-PR interval, 5-QRS duration, 6-T wave/ST</text><text x="41" y="516" fill="#f6faf5" font-size="21">segment changes. Following this sequence</text><text x="41" y="543" fill="#f6faf5" font-size="21">prevents missing key findings.</text></g></svg>