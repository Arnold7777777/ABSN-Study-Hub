<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which findings show the plan is working? Select all that apply.</title><desc>The plan targeted safe swallowing, no aspiration and adequate intake, so the matching outcomes are quiet meals with a clear voice, normal respiratory findings, and stable weight with most of the meal eaten. Missing coffee and asking about thin liquids are understandable and worth addressing with the speech-language pathologist, but neither tells you whether the swallow is safe. Absence of fever and clear lungs argue against aspiration pneumonia developing after the Day 4 event.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Dysphagia and Aspiration</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which findings show the plan is working?</text><text x="41" y="198" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">No coughing and no voice change during two</text><text x="41" y="330" fill="#f6faf5" font-size="21">observed meals · Oxygen saturation 96</text><text x="41" y="357" fill="#f6faf5" font-size="21">percent on room air with clear lungs · He</text><text x="41" y="384" fill="#f6faf5" font-size="21">ate about 75 percent of meals and his</text><text x="41" y="411" fill="#f6faf5" font-size="21">weight is stable</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The plan targeted safe swallowing, no</text><text x="41" y="543" fill="#f6faf5" font-size="21">aspiration and adequate intake, so the</text><text x="41" y="570" fill="#f6faf5" font-size="21">matching outcomes are quiet meals with a</text><text x="41" y="597" fill="#f6faf5" font-size="21">clear voice, normal respiratory findings,</text><text x="41" y="624" fill="#f6faf5" font-size="21">and stable weight with most of the meal</text><text x="41" y="651" fill="#f6faf5" font-size="21">eaten.</text></g></svg>