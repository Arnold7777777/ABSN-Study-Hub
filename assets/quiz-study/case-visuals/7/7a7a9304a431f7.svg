<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>Which newborn findings are expected? Select all that apply.</title><desc>Acrocyanosis, milia, molding and Mongolian spots are all normal newborn findings that alarm parents and need explaining rather than treating. Central cyanosis - the lips, tongue and trunk - is never normal and means a cardiac or respiratory problem.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Normal Newborn &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Thermoregulation</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which newborn findings are expected?</text><text x="41" y="231" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Acrocyanosis in the first 24 hours · Milia</text><text x="41" y="363" fill="#f6faf5" font-size="21">across the nose · Molding of the head</text><text x="41" y="390" fill="#f6faf5" font-size="21">after vaginal birth · Mongolian spots on</text><text x="41" y="417" fill="#f6faf5" font-size="21">the lower back</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Acrocyanosis, milia, molding and Mongolian</text><text x="41" y="549" fill="#f6faf5" font-size="21">spots are all normal newborn findings that</text><text x="41" y="576" fill="#f6faf5" font-size="21">alarm parents and need explaining rather</text><text x="41" y="603" fill="#f6faf5" font-size="21">than treating. Central cyanosis - the</text><text x="41" y="630" fill="#f6faf5" font-size="21">lips, tongue and trunk - is never normal</text><text x="41" y="657" fill="#f6faf5" font-size="21">and means a cardiac or respiratory</text><text x="41" y="684" fill="#f6faf5" font-size="21">problem.</text></g></svg>