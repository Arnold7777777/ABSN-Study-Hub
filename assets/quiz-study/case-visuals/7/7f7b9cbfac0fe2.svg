<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A 9-year-old child is in the pediatric intensive care unit following surgical removal of a supratentorial brain tumor. The nurse is reviewing the post-operative orders and planning care for the next several hours. Which intervention should the nurse prioritize during the immediate post-operative period?</title><desc>After brain surgery the child is at high risk for cerebral edema, bleeding and increased ICP, and because a supratentorial tumor sits above the tentorium, elevating the head of the bed to 30 degrees helps reduce intracranial pressure . Close neurological monitoring is the priority.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Post-op brain tumor care</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 9-year-old child is in the pediatric</text><text x="41" y="198" fill="#f6faf5" font-size="21">intensive care unit following surgical</text><text x="41" y="225" fill="#f6faf5" font-size="21">removal of a supratentorial brain tumor.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Monitor for signs of increased</text><text x="41" y="357" fill="#f6faf5" font-size="21">intracranial pressure and maintain head</text><text x="41" y="384" fill="#f6faf5" font-size="21">elevation at 30 degrees.</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">After brain surgery the child is at high</text><text x="41" y="516" fill="#f6faf5" font-size="21">risk for cerebral edema, bleeding and</text><text x="41" y="543" fill="#f6faf5" font-size="21">increased ICP, and because a</text><text x="41" y="570" fill="#f6faf5" font-size="21">supratentorial tumor sits above the</text><text x="41" y="597" fill="#f6faf5" font-size="21">tentorium, elevating the head of the bed</text><text x="41" y="624" fill="#f6faf5" font-size="21">to 30 degrees helps reduce intracranial</text><text x="41" y="651" fill="#f6faf5" font-size="21">pressure . Close neurological monitoring</text><text x="41" y="678" fill="#f6faf5" font-size="21">is the priority.</text></g></svg>