<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse at a health department is planning heart disease programs. Which activity should the nurse include as primary prevention?</title><desc>Nutrition and activity teaching for people who do not yet have heart disease lowers their risk before disease develops, which is primary prevention. Cholesterol screening looks like prevention, but it detects an existing problem early, so it belongs to secondary prevention.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Primary Prevention</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse at a health department is planning</text><text x="41" y="198" fill="#f6faf5" font-size="21">heart disease programs. Which activity</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse include as primary</text><text x="41" y="252" fill="#f6faf5" font-size="21">prevention?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Teaching a class on heart-healthy eating</text><text x="41" y="384" fill="#f6faf5" font-size="21">and daily physical activity to healthy</text><text x="41" y="411" fill="#f6faf5" font-size="21">adults</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Nutrition and activity teaching for people</text><text x="41" y="543" fill="#f6faf5" font-size="21">who do not yet have heart disease lowers</text><text x="41" y="570" fill="#f6faf5" font-size="21">their risk before disease develops, which</text><text x="41" y="597" fill="#f6faf5" font-size="21">is primary prevention. Cholesterol</text><text x="41" y="624" fill="#f6faf5" font-size="21">screening looks like prevention, but it</text><text x="41" y="651" fill="#f6faf5" font-size="21">detects an existing problem early, so it</text><text x="41" y="678" fill="#f6faf5" font-size="21">belongs to secondary prevention.</text></g></svg>