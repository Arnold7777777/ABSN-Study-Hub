<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A patient reports sudden, severe eye pain with nausea, vomiting, and halos around lights. On exam the pupil is fixed and nonreactive. What does the nurse anticipate?</title><desc>This is acute angle-closure glaucoma and it is a surgical emergency — sight is lost in hours without treatment. The fixed, mid-dilated pupil is cranial nerve III being compressed by the pressure. Open-angle glaucoma is the opposite picture: gradual, painless, and peripheral.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Disorders - Eye &amp; Ear</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A patient reports sudden, severe eye pain</text><text x="41" y="198" fill="#f6faf5" font-size="21">with nausea, vomiting, and halos around</text><text x="41" y="225" fill="#f6faf5" font-size="21">lights. On exam the pupil is fixed and</text><text x="41" y="252" fill="#f6faf5" font-size="21">nonreactive. What does the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">anticipate?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Preparing the patient for emergency</text><text x="41" y="411" fill="#f6faf5" font-size="21">surgery</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">This is acute angle-closure glaucoma and</text><text x="41" y="543" fill="#f6faf5" font-size="21">it is a surgical emergency — sight is lost</text><text x="41" y="570" fill="#f6faf5" font-size="21">in hours without treatment. The fixed,</text><text x="41" y="597" fill="#f6faf5" font-size="21">mid-dilated pupil is cranial nerve III</text><text x="41" y="624" fill="#f6faf5" font-size="21">being compressed by the pressure. Open-</text><text x="41" y="651" fill="#f6faf5" font-size="21">angle glaucoma is the opposite picture:</text><text x="41" y="678" fill="#f6faf5" font-size="21">gradual, painless, and peripheral.</text></g></svg>