<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A nurse teaches food safety to a client at 12 weeks. Which foods does the nurse tell her to avoid? Select all that apply.</title><desc>Unpasteurized soft cheeses and cold deli meats carry listeria , and predatory fish such as swordfish carry mercury . Pasteurized dairy and fully cooked poultry are safe and are valuable protein sources.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nutrition &amp; Health Promotion in</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse teaches food safety to a client at</text><text x="41" y="231" fill="#f6faf5" font-size="21">12 weeks. Which foods does the nurse tell</text><text x="41" y="258" fill="#f6faf5" font-size="21">her to avoid? Select all that apply.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Unpasteurized soft cheese · Swordfish ·</text><text x="41" y="390" fill="#f6faf5" font-size="21">Cold deli turkey straight from the package</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Unpasteurized soft cheeses and cold deli</text><text x="41" y="522" fill="#f6faf5" font-size="21">meats carry listeria , and predatory fish</text><text x="41" y="549" fill="#f6faf5" font-size="21">such as swordfish carry mercury .</text><text x="41" y="576" fill="#f6faf5" font-size="21">Pasteurized dairy and fully cooked poultry</text><text x="41" y="603" fill="#f6faf5" font-size="21">are safe and are valuable protein sources.</text></g></svg>