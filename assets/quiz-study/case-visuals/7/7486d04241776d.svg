<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>A client with systemic lupus erythematosus takes azathioprine and prednisone. Which finding should the nurse report to the provider first?</title><desc>On immunosuppressants a fever may be the only sign of a serious infection , because the usual response is blunted - report it right away (along with a rising WBC). An elevated CRP is expected with active autoimmune inflammation and is not specific; it was the most-chosen wrong answer in the video&#x27;s question banks. Stiffness and a sun-triggered rash need follow-up, not first priority.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Allergic, Inflammatory &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Immunologic Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client with systemic lupus erythematosus</text><text x="41" y="231" fill="#f6faf5" font-size="21">takes azathioprine and prednisone. Which</text><text x="41" y="258" fill="#f6faf5" font-size="21">finding should the nurse report to the</text><text x="41" y="285" fill="#f6faf5" font-size="21">provider first?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Temperature 38.3 °C (100.9 °F)</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">On immunosuppressants a fever may be the</text><text x="41" y="522" fill="#f6faf5" font-size="21">only sign of a serious infection , because</text><text x="41" y="549" fill="#f6faf5" font-size="21">the usual response is blunted - report it</text><text x="41" y="576" fill="#f6faf5" font-size="21">right away (along with a rising WBC).</text></g></svg>