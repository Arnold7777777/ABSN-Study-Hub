<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is providing discharge teaching to a client who had cataract extraction with intraocular lens implantation earlier today. Which instructions should the nurse include? (Select all that apply.)</title><desc>After cataract surgery, all teaching centers on AVOIDING INCREASED INTRAOCULAR PRESSURE: no bending at the waist, no heavy lifting, and no straining, coughing, or sneezing; the eye shield protects the eye during sleep. SUDDEN EYE PAIN OR A SUDDEN DECREASE IN VISION IS AN EMERGENCY suggesting increased pressure or hemorrhage. The client should sleep on the NONOPERATIVE side, and bleeding or bright red drainage is never an expected finding.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Cataracts</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is providing discharge teaching to</text><text x="41" y="198" fill="#f6faf5" font-size="21">a client who had cataract extraction with</text><text x="41" y="225" fill="#f6faf5" font-size="21">intraocular lens implantation earlier</text><text x="41" y="252" fill="#f6faf5" font-size="21">today. Which instructions should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">include? (Select all that apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Wear the protective eye shield at night</text><text x="41" y="411" fill="#f6faf5" font-size="21">for the prescribed period · Avoid bending</text><text x="41" y="438" fill="#f6faf5" font-size="21">at the waist and avoid lifting objects</text><text x="41" y="465" fill="#f6faf5" font-size="21">heavier than 5 lb (2.3 kg) · Report sudden</text><text x="41" y="492" fill="#f6faf5" font-size="21">eye pain or a sudden…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">After cataract surgery, all teaching</text><text x="41" y="624" fill="#f6faf5" font-size="21">centers on AVOIDING INCREASED INTRAOCULAR</text><text x="41" y="651" fill="#f6faf5" font-size="21">PRESSURE: no bending at the waist, no</text><text x="41" y="678" fill="#f6faf5" font-size="21">heavy lifting, and no straining, coughing,</text><text x="41" y="705" fill="#f6faf5" font-size="21">or sneezing;</text></g></svg>