<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is preparing to ambulate a client who is blind from the bed to the bathroom. Which action should the nurse take?</title><desc>In the SIGHTED-GUIDE technique, THE CLIENT TAKES THE NURSE&#x27;S ARM (just above the elbow) and walks about a HALF STEP BEHIND, which lets the client feel the nurse&#x27;s body movement and anticipate turns, steps, and stops. Pushing or pulling the client from behind or the side removes the client&#x27;s control and increases the risk of a fall.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Vision Deficit</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to ambulate a client</text><text x="41" y="198" fill="#f6faf5" font-size="21">who is blind from the bed to the bathroom.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which action should the nurse take?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Offer an arm and have the client grasp it</text><text x="41" y="357" fill="#f6faf5" font-size="21">just above the elbow, then walk about a</text><text x="41" y="384" fill="#f6faf5" font-size="21">half step ahead of the client</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">In the SIGHTED-GUIDE technique, THE CLIENT</text><text x="41" y="516" fill="#f6faf5" font-size="21">TAKES THE NURSE&#x27;S ARM (just above the</text><text x="41" y="543" fill="#f6faf5" font-size="21">elbow) and walks about a HALF STEP BEHIND,</text><text x="41" y="570" fill="#f6faf5" font-size="21">which lets the client feel the nurse&#x27;s</text><text x="41" y="597" fill="#f6faf5" font-size="21">body movement and anticipate turns, steps,</text><text x="41" y="624" fill="#f6faf5" font-size="21">and stops.</text></g></svg>