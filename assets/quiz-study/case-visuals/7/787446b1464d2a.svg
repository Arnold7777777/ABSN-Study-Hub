<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A 6-year-old is brought in with a limp that has been present for several weeks. He says his hip and knee ache but the limp itself is painless, and imaging shows avascular necrosis of the femoral head. Which nursing action does the nurse anticipate?</title><desc>This is Legg-Calve-Perthes , avascular necrosis of the femoral head, and the care point is to limit weight bearing on that hip. The Pavlik harness is tempting because it is also a hip device, but it belongs to DDH in infants under 6 months, not to a school-age child with Perthes.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Musculoskeletal</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 6-year-old is brought in with a limp</text><text x="41" y="198" fill="#f6faf5" font-size="21">that has been present for several weeks.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Limit weight bearing on the affected hip</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">This is Legg-Calve-Perthes , avascular</text><text x="41" y="435" fill="#f6faf5" font-size="21">necrosis of the femoral head, and the care</text><text x="41" y="462" fill="#f6faf5" font-size="21">point is to limit weight bearing on that</text><text x="41" y="489" fill="#f6faf5" font-size="21">hip. The Pavlik harness is tempting</text><text x="41" y="516" fill="#f6faf5" font-size="21">because it is also a hip device, but it</text><text x="41" y="543" fill="#f6faf5" font-size="21">belongs to DDH in infants under 6 months,</text><text x="41" y="570" fill="#f6faf5" font-size="21">not to a school-age child with Perthes.</text></g></svg>