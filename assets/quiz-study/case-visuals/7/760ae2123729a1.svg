<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is teaching an 80-year-old client who has mild age-related hearing and vision changes how to use a new metered-dose inhaler. Which actions should the nurse take?</title><desc>Older adults benefit from SHORT, FREQUENT SESSIONS, EXTRA TIME to process and respond, LARGE HIGH-CONTRAST PRINT, and a quiet, well-lit environment. Because presbycusis causes loss of HIGH-FREQUENCY SOUNDS FIRST, a HIGH-PITCHED, SHOUTED VOICE IS HARDER TO UNDERSTAND, and teaching must be directed to the CLIENT, who remains capable of learning.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Teaching Older Adults</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching an 80-year-old client</text><text x="41" y="198" fill="#f6faf5" font-size="21">who has mild age-related hearing and</text><text x="41" y="225" fill="#f6faf5" font-size="21">vision changes how to use a new metered-</text><text x="41" y="252" fill="#f6faf5" font-size="21">dose inhaler. Which actions should the</text><text x="41" y="279" fill="#f6faf5" font-size="21">nurse take?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Schedule several short teaching sessions</text><text x="41" y="411" fill="#f6faf5" font-size="21">rather than one long session · Provide</text><text x="41" y="438" fill="#f6faf5" font-size="21">written material in a large, high-contrast</text><text x="41" y="465" fill="#f6faf5" font-size="21">font · Allow extra time for the client to</text><text x="41" y="492" fill="#f6faf5" font-size="21">process information and…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">Older adults benefit from SHORT, FREQUENT</text><text x="41" y="624" fill="#f6faf5" font-size="21">SESSIONS, EXTRA TIME to process and</text><text x="41" y="651" fill="#f6faf5" font-size="21">respond, LARGE HIGH-CONTRAST PRINT, and a</text><text x="41" y="678" fill="#f6faf5" font-size="21">quiet, well-lit environment.</text></g></svg>