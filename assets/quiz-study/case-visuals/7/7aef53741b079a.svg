<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client at 26 weeks of gestation has a hemoglobin of 10.2 g/dL, hematocrit of 31%, and ferritin of 8 ng/mL. Normal in pregnancy: hemoglobin 11 g/dL or higher (10.5 or higher in the second trimester), hematocrit 33% or higher (32% or higher in the second trimester), ferritin 10 ng/mL or higher. Which prescription does the nurse anticipate?</title><desc>Her values meet the pregnancy anemia thresholds ( Hgb &lt;11, Hct &lt;33%, ferritin &lt;10 ), and deficiency is treated with 60-120 mg of elemental iron plus a stool softener — 27 mg is only the baseline supplement dose. Raising folic acid is tempting but wrong: folic acid prevents neural tube defects, not anemia , and calcium inhibits iron absorption.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client at 26 weeks of gestation has a</text><text x="41" y="198" fill="#f6faf5" font-size="21">hemoglobin of 10.2 g/dL, hematocrit of</text><text x="41" y="225" fill="#f6faf5" font-size="21">31%, and ferritin of 8 ng/mL.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">60-120 mg of elemental iron daily with a</text><text x="41" y="357" fill="#f6faf5" font-size="21">stool softener</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Her values meet the pregnancy anemia</text><text x="41" y="489" fill="#f6faf5" font-size="21">thresholds ( Hgb &lt;11, Hct &lt;33%, ferritin</text><text x="41" y="516" fill="#f6faf5" font-size="21">&lt;10 ), and deficiency is treated with</text><text x="41" y="543" fill="#f6faf5" font-size="21">60-120 mg of elemental iron plus a stool</text><text x="41" y="570" fill="#f6faf5" font-size="21">softener — 27 mg is only the baseline</text><text x="41" y="597" fill="#f6faf5" font-size="21">supplement dose.</text></g></svg>