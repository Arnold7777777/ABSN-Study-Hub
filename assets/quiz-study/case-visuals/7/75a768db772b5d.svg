<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client has disseminated intravascular coagulation. Which findings does the nurse expect? Select all that apply.</title><desc>DIC is the paradox: clotting and bleeding at once . Clotting consumes platelets and factors, so counts fall and times lengthen; the clot breakdown raises D-dimer. Fibrinogen falls, not rises - it is being used up - and that is the option most often chosen wrongly.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematologic Disorders</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has disseminated intravascular</text><text x="41" y="198" fill="#f6faf5" font-size="21">coagulation. Which findings does the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">expect? Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Prolonged PT and aPTT · Low platelet count</text><text x="41" y="357" fill="#f6faf5" font-size="21">· Elevated D-dimer · Bleeding from IV</text><text x="41" y="384" fill="#f6faf5" font-size="21">sites with simultaneous clotting</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">DIC is the paradox: clotting and bleeding</text><text x="41" y="516" fill="#f6faf5" font-size="21">at once . Clotting consumes platelets and</text><text x="41" y="543" fill="#f6faf5" font-size="21">factors, so counts fall and times</text><text x="41" y="570" fill="#f6faf5" font-size="21">lengthen; the clot breakdown raises</text><text x="41" y="597" fill="#f6faf5" font-size="21">D-dimer. Fibrinogen falls, not rises - it</text><text x="41" y="624" fill="#f6faf5" font-size="21">is being used up - and that is the option</text><text x="41" y="651" fill="#f6faf5" font-size="21">most often chosen wrongly.</text></g></svg>