<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>19. A client stands up and reports dizziness; the nurse suspects orthostatic hypotension. This is confirmed by a systolic BP drop of at least:</title><desc>c. Orthostatic hypotension = systolic drop ≥20 mmHg (or diastolic ≥10) within 3 minutes of standing. Teach the client to change positions slowly and dangle first.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">19. A client stands up and reports</text><text x="41" y="198" fill="#f6faf5" font-size="21">dizziness; the nurse suspects orthostatic</text><text x="41" y="225" fill="#f6faf5" font-size="21">hypotension. This is confirmed by a</text><text x="41" y="252" fill="#f6faf5" font-size="21">systolic BP drop of at least:</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">c. Orthostatic hypotension = systolic drop</text><text x="41" y="384" fill="#f6faf5" font-size="21">≥20 mmHg (or diastolic ≥10) within 3</text><text x="41" y="411" fill="#f6faf5" font-size="21">minutes of standing. Teach the client to</text><text x="41" y="438" fill="#f6faf5" font-size="21">change positions slowly and dangle first.</text></g></svg>