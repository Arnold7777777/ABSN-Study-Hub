<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is assessing a client who has major depressive disorder. Which of the following client statements is an overt comment about suicide? (Select all that apply.)</title><desc>Overt statements talk directly about suicide and the wish to no longer be alive. Options b and d are covert statements.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assessing a client who has</text><text x="41" y="198" fill="#f6faf5" font-size="21">major depressive disorder. Which of the</text><text x="41" y="225" fill="#f6faf5" font-size="21">following client statements is an overt</text><text x="41" y="252" fill="#f6faf5" font-size="21">comment about suicide? (Select all that</text><text x="41" y="279" fill="#f6faf5" font-size="21">apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&quot;My family will be better off if I&#x27;m</text><text x="41" y="411" fill="#f6faf5" font-size="21">dead.&quot; · &quot;I wish my life was over.&quot; · &quot;If</text><text x="41" y="438" fill="#f6faf5" font-size="21">I kill myself then my problems will go</text><text x="41" y="465" fill="#f6faf5" font-size="21">away.&quot;</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Overt statements talk directly about</text><text x="41" y="597" fill="#f6faf5" font-size="21">suicide and the wish to no longer be</text><text x="41" y="624" fill="#f6faf5" font-size="21">alive. Options b and d are covert</text><text x="41" y="651" fill="#f6faf5" font-size="21">statements.</text></g></svg>