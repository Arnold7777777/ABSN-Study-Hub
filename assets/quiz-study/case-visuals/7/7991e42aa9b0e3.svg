<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>A 17-year-old client at 18 weeks of gestation reviews her nutrition plan with the nurse. Which statements by the client indicate correct understanding? Select all that apply.</title><desc>Calcium is 1,000 mg/day but 1,300 mg/day for clients under 19 , caffeine is capped at 200 mg/day , iron is taken between meals with vitamin C , and the second trimester adds +340 kcal/day . Taking iron with milk sounds like reasonable stomach protection, but milk and caffeine block iron absorption — iron with milk is never the right answer.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nutrition &amp; Health Promotion in</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A 17-year-old client at 18 weeks of</text><text x="41" y="231" fill="#f6faf5" font-size="21">gestation reviews her nutrition plan with</text><text x="41" y="258" fill="#f6faf5" font-size="21">the nurse. Which statements by the client</text><text x="41" y="285" fill="#f6faf5" font-size="21">indicate correct understanding? Select all</text><text x="41" y="312" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">&quot;I need 1,300 mg of calcium a day because</text><text x="41" y="444" fill="#f6faf5" font-size="21">I&#x27;m under 19.&quot; · &quot;I should keep my</text><text x="41" y="471" fill="#f6faf5" font-size="21">caffeine at 200 mg a day or less.&quot; · &quot;I&#x27;ll</text><text x="41" y="498" fill="#f6faf5" font-size="21">take my iron between meals with a glass of</text><text x="41" y="525" fill="#f6faf5" font-size="21">orange juice.&quot; · &quot;I need…</text><path d="M319 549v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="565" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 578) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="599" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="630" fill="#f6faf5" font-size="21">Calcium is 1,000 mg/day but 1,300 mg/day</text><text x="41" y="657" fill="#f6faf5" font-size="21">for clients under 19 , caffeine is capped</text><text x="41" y="684" fill="#f6faf5" font-size="21">at 200 mg/day , iron is taken between</text><text x="41" y="711" fill="#f6faf5" font-size="21">meals with vitamin C , and the second</text><text x="41" y="738" fill="#f6faf5" font-size="21">trimester adds +340 kcal/day .</text></g></svg>