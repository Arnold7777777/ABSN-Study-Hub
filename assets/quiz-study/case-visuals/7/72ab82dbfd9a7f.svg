<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A female client is asked to provide a midstream urine specimen. Which instructions should the nurse give?</title><desc>CLEAN-CATCH MIDSTREAM MEANS: cleanse front to back FIRST, start the stream INTO THE TOILET to flush out perineal flora, then catch the MIDDLE portion in the container. Starting in the container collects contaminants and gives a falsely positive culture. Cleansing after starting to void defeats the purpose entirely.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Urinary Specimens</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A female client is asked to provide a</text><text x="41" y="198" fill="#f6faf5" font-size="21">midstream urine specimen. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">instructions should the nurse give?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">“Urinate a bit into the toilet first, and</text><text x="41" y="357" fill="#f6faf5" font-size="21">then fill the container as you continue to</text><text x="41" y="384" fill="#f6faf5" font-size="21">urinate.”</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">CLEAN-CATCH MIDSTREAM MEANS: cleanse front</text><text x="41" y="516" fill="#f6faf5" font-size="21">to back FIRST, start the stream INTO THE</text><text x="41" y="543" fill="#f6faf5" font-size="21">TOILET to flush out perineal flora, then</text><text x="41" y="570" fill="#f6faf5" font-size="21">catch the MIDDLE portion in the container.</text></g></svg>