<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>Which foods should a pregnant client avoid? Select all that apply.</title><desc>Soft unpasteurized cheese, cold deli meat and raw sprouts carry Listeria , which crosses the placenta and causes stillbirth. Swordfish, king mackerel, shark and tilefish are the high-mercury four. Cooked low-mercury fish such as salmon is encouraged - the omega-3s support fetal brain development.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nutrition &amp; Health Promotion in</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which foods should a pregnant client</text><text x="41" y="231" fill="#f6faf5" font-size="21">avoid? Select all that apply.</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Unpasteurized soft cheese · Deli meats</text><text x="41" y="363" fill="#f6faf5" font-size="21">unless heated until steaming · Swordfish</text><text x="41" y="390" fill="#f6faf5" font-size="21">and king mackerel · Raw sprouts</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Soft unpasteurized cheese, cold deli meat</text><text x="41" y="522" fill="#f6faf5" font-size="21">and raw sprouts carry Listeria , which</text><text x="41" y="549" fill="#f6faf5" font-size="21">crosses the placenta and causes</text><text x="41" y="576" fill="#f6faf5" font-size="21">stillbirth. Swordfish, king mackerel,</text><text x="41" y="603" fill="#f6faf5" font-size="21">shark and tilefish are the high-mercury</text><text x="41" y="630" fill="#f6faf5" font-size="21">four. Cooked low-mercury fish such as</text><text x="41" y="657" fill="#f6faf5" font-size="21">salmon is encouraged - the omega-3s</text><text x="41" y="684" fill="#f6faf5" font-size="21">support fetal brain development.</text></g></svg>