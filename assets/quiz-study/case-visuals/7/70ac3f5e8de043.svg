<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A charge nurse is discussing mental status examinations with a newly licensed nurse. Which of the following statements by the newly licensed nurse indicates an understanding of the teaching? (Select all that apply.)</title><desc>Counting backward by sevens assesses cognitive ability. Observing facial expression assesses affect. Writing a sentence indicates language ability. Remote memory is tested by asking the client to state a verifiable fact from their past (date of birth). Abstract thinking is tested by asking the client to interpret something.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A charge nurse is discussing mental status</text><text x="41" y="198" fill="#f6faf5" font-size="21">examinations with a newly licensed nurse.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">&quot;To assess cognitive ability, I should ask</text><text x="41" y="330" fill="#f6faf5" font-size="21">the client to count backward by sevens.&quot; ·</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;To assess affect, I should observe the</text><text x="41" y="384" fill="#f6faf5" font-size="21">client&#x27;s facial expression.&quot; · &quot;To assess</text><text x="41" y="411" fill="#f6faf5" font-size="21">language ability, I…</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Counting backward by sevens assesses</text><text x="41" y="543" fill="#f6faf5" font-size="21">cognitive ability.</text></g></svg>