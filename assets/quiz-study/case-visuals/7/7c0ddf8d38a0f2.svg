<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A client reports low back pain. Which findings are red flags that require immediate evaluation? Select all that apply.</title><desc>Bowel or bladder dysfunction, saddle anesthesia and progressive weakness point to cord or cauda equina compression, and fever with a cancer history raises infection or metastasis. Pain relieved by rest and stiffness after sitting are typical of ordinary mechanical back pain.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Low back red flags</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client reports low back pain. Which</text><text x="41" y="198" fill="#f6faf5" font-size="21">findings are red flags that require</text><text x="41" y="225" fill="#f6faf5" font-size="21">immediate evaluation? Select all that</text><text x="41" y="252" fill="#f6faf5" font-size="21">apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">New bowel or bladder incontinence ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Numbness of the perineum and inner thighs</text><text x="41" y="411" fill="#f6faf5" font-size="21">· Progressive weakness of both legs ·</text><text x="41" y="438" fill="#f6faf5" font-size="21">Fever in a client with a history of cancer</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Bowel or bladder dysfunction, saddle</text><text x="41" y="570" fill="#f6faf5" font-size="21">anesthesia and progressive weakness point</text><text x="41" y="597" fill="#f6faf5" font-size="21">to cord or cauda equina compression, and</text><text x="41" y="624" fill="#f6faf5" font-size="21">fever with a cancer history raises</text><text x="41" y="651" fill="#f6faf5" font-size="21">infection or metastasis. Pain relieved by</text><text x="41" y="678" fill="#f6faf5" font-size="21">rest and stiffness after sitting are</text><text x="41" y="705" fill="#f6faf5" font-size="21">typical of ordinary mechanical back pain.</text></g></svg>