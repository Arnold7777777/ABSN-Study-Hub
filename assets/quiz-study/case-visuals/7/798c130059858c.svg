<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is assessing a 2-week-old infant during a well-baby checkup. When the nurse places a finger in the infant&#x27;s palm, the infant tightly grasps the finger. How should the nurse interpret this finding?</title><desc>The palmar grasp reflex is present at birth and normally disappears around 3 to 4 months , so a tight grasp at 2 weeks is expected. Reflexes are involuntary, not fine motor skill, and reflexive grasping does not indicate seizure activity.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Newborn reflexes</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assessing a 2-week-old infant</text><text x="41" y="198" fill="#f6faf5" font-size="21">during a well-baby checkup. When the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">places a finger in the infant&#x27;s palm, the</text><text x="41" y="252" fill="#f6faf5" font-size="21">infant tightly grasps the finger. How</text><text x="41" y="279" fill="#f6faf5" font-size="21">should the nurse interpret this finding?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">This is an expected palmar grasp reflex</text><text x="41" y="411" fill="#f6faf5" font-size="21">for the infant&#x27;s age.</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The palmar grasp reflex is present at</text><text x="41" y="543" fill="#f6faf5" font-size="21">birth and normally disappears around 3 to</text><text x="41" y="570" fill="#f6faf5" font-size="21">4 months , so a tight grasp at 2 weeks is</text><text x="41" y="597" fill="#f6faf5" font-size="21">expected. Reflexes are involuntary, not</text><text x="41" y="624" fill="#f6faf5" font-size="21">fine motor skill, and reflexive grasping</text><text x="41" y="651" fill="#f6faf5" font-size="21">does not indicate seizure activity.</text></g></svg>