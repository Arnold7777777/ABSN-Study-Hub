<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A client with Huntington disease asks about having children. What does the nurse recommend?</title><desc>Huntington disease is autosomal dominant : one affected parent gives each child a 50% chance . One parent is enough to pass it on, and genetic counseling lets the client weigh testing and family planning.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Traumatic, Infectious, Oncologic &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Degenerative Neuro</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client with Huntington disease asks</text><text x="41" y="231" fill="#f6faf5" font-size="21">about having children. What does the nurse</text><text x="41" y="258" fill="#f6faf5" font-size="21">recommend?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Genetic counseling, because each child has</text><text x="41" y="390" fill="#f6faf5" font-size="21">a 50% chance of inheriting the gene</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Huntington disease is autosomal dominant :</text><text x="41" y="522" fill="#f6faf5" font-size="21">one affected parent gives each child a 50%</text><text x="41" y="549" fill="#f6faf5" font-size="21">chance . One parent is enough to pass it</text><text x="41" y="576" fill="#f6faf5" font-size="21">on, and genetic counseling lets the client</text><text x="41" y="603" fill="#f6faf5" font-size="21">weigh testing and family planning.</text></g></svg>