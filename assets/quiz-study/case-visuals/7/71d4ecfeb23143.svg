<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which principle should guide the order in which a nurse presents teaching content?</title><desc>Learning activities should build from simple to complex and connect new material to what the client already knows, which supports retention and confidence. Starting with the hardest task is tempting as a shortcut, but early failure discourages the learner and slows the whole process.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Organizing Content</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which principle should guide the order in</text><text x="41" y="198" fill="#f6faf5" font-size="21">which a nurse presents teaching content?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Move from simple to complex and from</text><text x="41" y="330" fill="#f6faf5" font-size="21">familiar to unfamiliar</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Learning activities should build from</text><text x="41" y="462" fill="#f6faf5" font-size="21">simple to complex and connect new material</text><text x="41" y="489" fill="#f6faf5" font-size="21">to what the client already knows, which</text><text x="41" y="516" fill="#f6faf5" font-size="21">supports retention and confidence.</text><text x="41" y="543" fill="#f6faf5" font-size="21">Starting with the hardest task is tempting</text><text x="41" y="570" fill="#f6faf5" font-size="21">as a shortcut, but early failure</text><text x="41" y="597" fill="#f6faf5" font-size="21">discourages the learner and slows the</text><text x="41" y="624" fill="#f6faf5" font-size="21">whole process.</text></g></svg>