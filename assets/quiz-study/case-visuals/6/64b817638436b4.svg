<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse gives a scheduled dose two hours late. The provider is notified, the client&#x27;s condition never changes, and no injury occurs. Why would a malpractice claim most likely fail?</title><desc>Malpractice needs all four pieces: a duty, a breach of that duty, the breach causing the harm, and actual damages. Duty and breach exist here, but with no injury there are no damages. Notifying the provider is good practice, not the legal reason the claim collapses.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Negligence &amp; Liability</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse gives a scheduled dose two hours</text><text x="41" y="198" fill="#f6faf5" font-size="21">late. The provider is notified, the</text><text x="41" y="225" fill="#f6faf5" font-size="21">client&#x27;s condition never changes, and no</text><text x="41" y="252" fill="#f6faf5" font-size="21">injury occurs. Why would a malpractice</text><text x="41" y="279" fill="#f6faf5" font-size="21">claim most likely fail?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">No damages resulted from the breach</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Malpractice needs all four pieces: a duty,</text><text x="41" y="516" fill="#f6faf5" font-size="21">a breach of that duty, the breach causing</text><text x="41" y="543" fill="#f6faf5" font-size="21">the harm, and actual damages. Duty and</text><text x="41" y="570" fill="#f6faf5" font-size="21">breach exist here, but with no injury</text><text x="41" y="597" fill="#f6faf5" font-size="21">there are no damages. Notifying the</text><text x="41" y="624" fill="#f6faf5" font-size="21">provider is good practice, not the legal</text><text x="41" y="651" fill="#f6faf5" font-size="21">reason the claim collapses.</text></g></svg>