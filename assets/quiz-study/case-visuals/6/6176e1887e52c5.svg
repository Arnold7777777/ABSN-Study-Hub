<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is assessing circulation in the leg of a client who has a newly applied cast. Which of the following findings indicate impaired peripheral perfusion? Select all that apply.</title><desc>Coolness, pallor, delayed refill, a diminished distal pulse, and paresthesia are the classic signs that blood flow past the cast is compromised and must be reported before tissue damage occurs. Warm toes with brisk refill describe intact circulation and are the comparison finding the nurse is hoping to see.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Peripheral Perfusion</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assessing circulation in the</text><text x="41" y="198" fill="#f6faf5" font-size="21">leg of a client who has a newly applied</text><text x="41" y="225" fill="#f6faf5" font-size="21">cast. Which of the following findings</text><text x="41" y="252" fill="#f6faf5" font-size="21">indicate impaired peripheral perfusion?</text><text x="41" y="279" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Toes that are cool and pale compared with</text><text x="41" y="411" fill="#f6faf5" font-size="21">the other foot · Capillary refill of 6</text><text x="41" y="438" fill="#f6faf5" font-size="21">seconds in the toes · A dorsalis pedis</text><text x="41" y="465" fill="#f6faf5" font-size="21">pulse that is weaker than on the</text><text x="41" y="492" fill="#f6faf5" font-size="21">unaffected side · Numbness and…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">Coolness, pallor, delayed refill, a</text><text x="41" y="624" fill="#f6faf5" font-size="21">diminished distal pulse, and paresthesia</text><text x="41" y="651" fill="#f6faf5" font-size="21">are the classic signs that blood flow past</text><text x="41" y="678" fill="#f6faf5" font-size="21">the cast is compromised and must be</text><text x="41" y="705" fill="#f6faf5" font-size="21">reported before tissue damage occurs.</text></g></svg>