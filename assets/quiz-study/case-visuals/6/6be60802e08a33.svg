<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>Which lipid panel result is most concerning for increased CAD risk?</title><desc>Option B is most concerning: Total cholesterol 240 (should be 60 — low HDL is a risk), LDL 155 (should be &lt;130 — elevated LDL = bad), TG 200 (should be &lt;150). ALL values are unfavorable.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">CAD / Angina</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which lipid panel result is most</text><text x="41" y="198" fill="#f6faf5" font-size="21">concerning for increased CAD risk?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Total cholesterol 240, HDL 38, LDL 155, TG</text><text x="41" y="330" fill="#f6faf5" font-size="21">200</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Option B is most concerning: Total</text><text x="41" y="462" fill="#f6faf5" font-size="21">cholesterol 240 (should be 60 — low HDL is</text><text x="41" y="489" fill="#f6faf5" font-size="21">a risk), LDL 155 (should be &lt;130 —</text><text x="41" y="516" fill="#f6faf5" font-size="21">elevated LDL = bad), TG 200 (should be</text><text x="41" y="543" fill="#f6faf5" font-size="21">&lt;150). ALL values are unfavorable.</text></g></svg>