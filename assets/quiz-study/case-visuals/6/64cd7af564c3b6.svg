<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A client at 9 weeks of gestation reports vaginal bleeding and mild cramping. On examination her cervix is closed and no tissue has passed. Which type of early pregnancy loss does the nurse document?</title><desc>Threatened loss is bleeding with a closed cervix and no tissue passed , and the pregnancy may still continue. A missed loss also has a closed cervix, but there is no bleeding and the tissue is retained, so the bleeding rules it out.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 9 weeks of gestation reports</text><text x="41" y="231" fill="#f6faf5" font-size="21">vaginal bleeding and mild cramping. On</text><text x="41" y="258" fill="#f6faf5" font-size="21">examination her cervix is closed and no</text><text x="41" y="285" fill="#f6faf5" font-size="21">tissue has passed. Which type of early</text><text x="41" y="312" fill="#f6faf5" font-size="21">pregnancy loss does the nurse document?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Threatened</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Threatened loss is bleeding with a closed</text><text x="41" y="549" fill="#f6faf5" font-size="21">cervix and no tissue passed , and the</text><text x="41" y="576" fill="#f6faf5" font-size="21">pregnancy may still continue. A missed</text><text x="41" y="603" fill="#f6faf5" font-size="21">loss also has a closed cervix, but there</text><text x="41" y="630" fill="#f6faf5" font-size="21">is no bleeding and the tissue is retained,</text><text x="41" y="657" fill="#f6faf5" font-size="21">so the bleeding rules it out.</text></g></svg>