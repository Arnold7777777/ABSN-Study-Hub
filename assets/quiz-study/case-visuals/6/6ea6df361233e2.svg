<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A nurse is assessing a client with diabetes mellitus for signs of diabetic neuropathy. Which findings would indicate the presence of this complication? Select all that apply.</title><desc>Burning feet, loss of light-touch sensation, loss of vibration sense and gastroparesis (nerves in the GI tract) are all nerve damage. Blurred vision and floaters are retinopathy, and proteinuria is nephropathy - blood vessel complications, not neuropathy.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Diabetic neuropathy</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assessing a client with</text><text x="41" y="198" fill="#f6faf5" font-size="21">diabetes mellitus for signs of diabetic</text><text x="41" y="225" fill="#f6faf5" font-size="21">neuropathy. Which findings would indicate</text><text x="41" y="252" fill="#f6faf5" font-size="21">the presence of this complication? Select</text><text x="41" y="279" fill="#f6faf5" font-size="21">all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Burning sensation in both feet · Decreased</text><text x="41" y="411" fill="#f6faf5" font-size="21">sensation to light touch in bilateral</text><text x="41" y="438" fill="#f6faf5" font-size="21">lower extremities · Gastroparesis with</text><text x="41" y="465" fill="#f6faf5" font-size="21">delayed gastric emptying · Loss of</text><text x="41" y="492" fill="#f6faf5" font-size="21">vibration sense in the toes</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">Burning feet, loss of light-touch</text><text x="41" y="624" fill="#f6faf5" font-size="21">sensation, loss of vibration sense and</text><text x="41" y="651" fill="#f6faf5" font-size="21">gastroparesis (nerves in the GI tract) are</text><text x="41" y="678" fill="#f6faf5" font-size="21">all nerve damage. Blurred vision and</text><text x="41" y="705" fill="#f6faf5" font-size="21">floaters are retinopathy, and proteinuria</text><text x="41" y="732" fill="#f6faf5" font-size="21">is nephropathy - blood vessel</text><text x="41" y="759" fill="#f6faf5" font-size="21">complications, not neuropathy.</text></g></svg>