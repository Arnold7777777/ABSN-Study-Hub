<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A nurse examines a 12-hour-old newborn. Which findings are expected variations requiring no intervention? Select all that apply.</title><desc>Acrocyanosis, milia and Epstein pearls are normal newborn findings . Jaundice appearing before 24 hours is pathologic , and a bulging fontanel at rest suggests increased intracranial pressure; both require reporting.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Normal Newborn &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Thermoregulation</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse examines a 12-hour-old newborn.</text><text x="41" y="231" fill="#f6faf5" font-size="21">Which findings are expected variations</text><text x="41" y="258" fill="#f6faf5" font-size="21">requiring no intervention? Select all that</text><text x="41" y="285" fill="#f6faf5" font-size="21">apply.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Acrocyanosis of the hands and feet · Tiny</text><text x="41" y="417" fill="#f6faf5" font-size="21">white papules across the nose · Small</text><text x="41" y="444" fill="#f6faf5" font-size="21">white cysts on the hard palate</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Acrocyanosis, milia and Epstein pearls are</text><text x="41" y="576" fill="#f6faf5" font-size="21">normal newborn findings . Jaundice</text><text x="41" y="603" fill="#f6faf5" font-size="21">appearing before 24 hours is pathologic ,</text><text x="41" y="630" fill="#f6faf5" font-size="21">and a bulging fontanel at rest suggests</text><text x="41" y="657" fill="#f6faf5" font-size="21">increased intracranial pressure; both</text><text x="41" y="684" fill="#f6faf5" font-size="21">require reporting.</text></g></svg>