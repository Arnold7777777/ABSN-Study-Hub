<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is giving discharge instructions to a client who has a moderate hearing deficit and does not wear a hearing aid. Which approach should the nurse use?</title><desc>Facing the client in good light supports lip reading and facial cues, and lowering pitch helps because age-related loss affects high frequencies first. Shouting distorts words and raises pitch, and exaggerated mouth movements actually make speech harder to read.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hearing Communication</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is giving discharge instructions</text><text x="41" y="198" fill="#f6faf5" font-size="21">to a client who has a moderate hearing</text><text x="41" y="225" fill="#f6faf5" font-size="21">deficit and does not wear a hearing aid.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which approach should the nurse use?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Face the client in a well-lit room and</text><text x="41" y="384" fill="#f6faf5" font-size="21">speak at a normal rate in a slightly lower</text><text x="41" y="411" fill="#f6faf5" font-size="21">pitch</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Facing the client in good light supports</text><text x="41" y="543" fill="#f6faf5" font-size="21">lip reading and facial cues, and lowering</text><text x="41" y="570" fill="#f6faf5" font-size="21">pitch helps because age-related loss</text><text x="41" y="597" fill="#f6faf5" font-size="21">affects high frequencies first. Shouting</text><text x="41" y="624" fill="#f6faf5" font-size="21">distorts words and raises pitch, and</text><text x="41" y="651" fill="#f6faf5" font-size="21">exaggerated mouth movements actually make</text><text x="41" y="678" fill="#f6faf5" font-size="21">speech harder to read.</text></g></svg>