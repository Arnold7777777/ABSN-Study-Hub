<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which statement about antiretroviral therapy is not true?</title><desc>Antiretroviral therapy is lifelong and continuous - there is no tapering and no drug holiday. Stopping lets the virus rebound and lets resistance develop. Three drugs from at least two classes is the standard combination, aimed at different steps of the lifecycle at once.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">HIV - prevention &amp; ART</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which statement about antiretroviral</text><text x="41" y="198" fill="#f6faf5" font-size="21">therapy is not true?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">It is taken when symptoms appear and then</text><text x="41" y="330" fill="#f6faf5" font-size="21">tapered off</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Antiretroviral therapy is lifelong and</text><text x="41" y="462" fill="#f6faf5" font-size="21">continuous - there is no tapering and no</text><text x="41" y="489" fill="#f6faf5" font-size="21">drug holiday. Stopping lets the virus</text><text x="41" y="516" fill="#f6faf5" font-size="21">rebound and lets resistance develop. Three</text><text x="41" y="543" fill="#f6faf5" font-size="21">drugs from at least two classes is the</text><text x="41" y="570" fill="#f6faf5" font-size="21">standard combination, aimed at different</text><text x="41" y="597" fill="#f6faf5" font-size="21">steps of the lifecycle at once.</text></g></svg>