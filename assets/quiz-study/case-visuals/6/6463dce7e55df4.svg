<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse in a long-term care facility is caring for a client who has major neurocognitive disorder and attempts to wander out of the building, stating &quot;I have to get home.&quot; Which of the following statements should the nurse make?</title><desc>Introducing oneself and redirecting calmly promotes reality. Option a is argumentative, b is negative, c is a &quot;why&quot; question.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse in a long-term care facility is</text><text x="41" y="198" fill="#f6faf5" font-size="21">caring for a client who has major</text><text x="41" y="225" fill="#f6faf5" font-size="21">neurocognitive disorder and attempts to</text><text x="41" y="252" fill="#f6faf5" font-size="21">wander out of the building, stating &quot;I</text><text x="41" y="279" fill="#f6faf5" font-size="21">have to get home.&quot; Which of the following…</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&quot;I am your nurse. Let&#x27;s walk together to</text><text x="41" y="411" fill="#f6faf5" font-size="21">your room.&quot;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Introducing oneself and redirecting calmly</text><text x="41" y="543" fill="#f6faf5" font-size="21">promotes reality. Option a is</text><text x="41" y="570" fill="#f6faf5" font-size="21">argumentative, b is negative, c is a &quot;why&quot;</text><text x="41" y="597" fill="#f6faf5" font-size="21">question.</text></g></svg>