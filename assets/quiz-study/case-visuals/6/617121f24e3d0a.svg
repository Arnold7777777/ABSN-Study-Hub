<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which physiological changes should the nurse expect in a client experiencing moderate to severe anxiety? Select all that apply.</title><desc>Anxiety triggers the sympathetic fight-or-flight response: faster heart rate, breathing and BP, raised glucose, dilated pupils and bronchioles, and blood shunted from the skin and gut to the core.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anxiety - physiological signs</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which physiological changes should the</text><text x="41" y="198" fill="#f6faf5" font-size="21">nurse expect in a client experiencing</text><text x="41" y="225" fill="#f6faf5" font-size="21">moderate to severe anxiety? Select all</text><text x="41" y="252" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Increased pulse rate · Elevated blood</text><text x="41" y="384" fill="#f6faf5" font-size="21">glucose · Dilated pupils · Cool, pale</text><text x="41" y="411" fill="#f6faf5" font-size="21">extremities from peripheral</text><text x="41" y="438" fill="#f6faf5" font-size="21">vasoconstriction</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Anxiety triggers the sympathetic fight-or-</text><text x="41" y="570" fill="#f6faf5" font-size="21">flight response: faster heart rate,</text><text x="41" y="597" fill="#f6faf5" font-size="21">breathing and BP, raised glucose, dilated</text><text x="41" y="624" fill="#f6faf5" font-size="21">pupils and bronchioles, and blood shunted</text><text x="41" y="651" fill="#f6faf5" font-size="21">from the skin and gut to the core.</text></g></svg>