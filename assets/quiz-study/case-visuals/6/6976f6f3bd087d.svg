<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>Complete the statements about ECT side effects and course.</title><desc>Transient confusion and short-term (retrograde/anterograde) memory loss are the most common ECT effects and usually resolve within weeks. A standard course is 2-3 treatments per week, totaling about 6-12.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Complete the statements about ECT side</text><text x="41" y="198" fill="#f6faf5" font-size="21">effects and course.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="222" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">Transient confusion and short-term</text><text x="41" y="330" fill="#f6faf5" font-size="21">(retrograde/anterograde) memory loss are</text><text x="41" y="357" fill="#f6faf5" font-size="21">the most common ECT effects and usually</text><text x="41" y="384" fill="#f6faf5" font-size="21">resolve within weeks. A standard course is</text><text x="41" y="411" fill="#f6faf5" font-size="21">2-3 treatments per week, totaling about</text><text x="41" y="438" fill="#f6faf5" font-size="21">6-12.</text></g></svg>