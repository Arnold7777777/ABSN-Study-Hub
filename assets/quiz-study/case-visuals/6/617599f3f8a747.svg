<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A 2-month-old is brought in by his mother. Which findings from his health history and nurse&#x27;s notes are concerning cues? (Select all that apply.)</title><desc>Prematurity and a 5-week NICU stay raise his risk. A sick sibling suggests where the infection came from. Poor feeding, tachypnea, flaring, retractions, grunting (soft sounds on exhalation), pallor and lethargy show respiratory distress. A heart rate of 156 is within the normal range for a 2-month-old, and a soft, flat fontanel is normal.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Respiratory</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 2-month-old is brought in by his mother.</text><text x="41" y="198" fill="#f6faf5" font-size="21">Which findings from his health history and</text><text x="41" y="225" fill="#f6faf5" font-size="21">nurse&#x27;s notes are concerning cues? (Select</text><text x="41" y="252" fill="#f6faf5" font-size="21">all that apply.)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Born at 32 weeks&#x27; gestation via</text><text x="41" y="384" fill="#f6faf5" font-size="21">spontaneous vaginal delivery ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Uncomplicated NICU stay x 5 weeks · Mother</text><text x="41" y="438" fill="#f6faf5" font-size="21">reports that older sibling has a “cold” ·</text><text x="41" y="465" fill="#f6faf5" font-size="21">Mother reports that infant has not eaten…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Prematurity and a 5-week NICU stay raise</text><text x="41" y="597" fill="#f6faf5" font-size="21">his risk.</text></g></svg>