<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="539" viewBox="0 0 640 539"><title>Match each term to its description.</title><desc>These are the highest-yield definition points in the module. Note the pairs that get confused: circumstantiality gets there eventually, tangentiality never does ; thought blocking is the thought vanishing, not choosing to stop; anosognosia is a symptom of the illness and the leading cause of nonadherence — it is not denial and not stubbornness.</desc><rect width="640" height="539" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match each term to its description.</text><path d="M319 195v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="211" width="594" height="303" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 224) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="245" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="276" fill="#f6faf5" font-size="21">These are the highest-yield definition</text><text x="41" y="303" fill="#f6faf5" font-size="21">points in the module. Note the pairs that</text><text x="41" y="330" fill="#f6faf5" font-size="21">get confused: circumstantiality gets there</text><text x="41" y="357" fill="#f6faf5" font-size="21">eventually, tangentiality never does ;</text><text x="41" y="384" fill="#f6faf5" font-size="21">thought blocking is the thought vanishing,</text><text x="41" y="411" fill="#f6faf5" font-size="21">not choosing to stop; anosognosia is a</text><text x="41" y="438" fill="#f6faf5" font-size="21">symptom of the illness and the leading</text><text x="41" y="465" fill="#f6faf5" font-size="21">cause of nonadherence — it is not denial</text><text x="41" y="492" fill="#f6faf5" font-size="21">and not stubbornness.</text></g></svg>