<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client jumps from talking about losing his job to his car trouble to his neighbor&#x27;s dog. Which response BEST demonstrates focusing?</title><desc>Focusing directs attention to one important idea so it can be explored in depth. Asking him to stay on topic sounds reasonable but corrects the client instead of guiding him, and the why question demands justification.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client jumps from talking about losing</text><text x="41" y="231" fill="#f6faf5" font-size="21">his job to his car trouble to his</text><text x="41" y="258" fill="#f6faf5" font-size="21">neighbor&#x27;s dog. Which response BEST</text><text x="41" y="285" fill="#f6faf5" font-size="21">demonstrates focusing?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">You&#x27;ve mentioned several things. Let&#x27;s go</text><text x="41" y="417" fill="#f6faf5" font-size="21">back to what you said about losing your</text><text x="41" y="444" fill="#f6faf5" font-size="21">job.</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Focusing directs attention to one</text><text x="41" y="576" fill="#f6faf5" font-size="21">important idea so it can be explored in</text><text x="41" y="603" fill="#f6faf5" font-size="21">depth. Asking him to stay on topic sounds</text><text x="41" y="630" fill="#f6faf5" font-size="21">reasonable but corrects the client instead</text><text x="41" y="657" fill="#f6faf5" font-size="21">of guiding him, and the why question</text><text x="41" y="684" fill="#f6faf5" font-size="21">demands justification.</text></g></svg>