<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse observes that the reservoir bag on a client&#x27;s non-rebreather mask collapses completely with each inspiration. Which action should the nurse take first?</title><desc>The reservoir bag must stay at least two-thirds inflated at 10–15 L/min; a fully collapsing bag means the client is not receiving enough oxygen and can effectively suffocate. Switching to a nasal cannula is wrong — it lowers FiO2 for a client who needed the highest available concentration.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Non-Rebreather</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse observes that the reservoir bag on</text><text x="41" y="198" fill="#f6faf5" font-size="21">a client&#x27;s non-rebreather mask collapses</text><text x="41" y="225" fill="#f6faf5" font-size="21">completely with each inspiration. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">action should the nurse take first?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Increase the oxygen flow rate until the</text><text x="41" y="384" fill="#f6faf5" font-size="21">reservoir bag remains inflated</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">The reservoir bag must stay at least two-</text><text x="41" y="516" fill="#f6faf5" font-size="21">thirds inflated at 10–15 L/min; a fully</text><text x="41" y="543" fill="#f6faf5" font-size="21">collapsing bag means the client is not</text><text x="41" y="570" fill="#f6faf5" font-size="21">receiving enough oxygen and can</text><text x="41" y="597" fill="#f6faf5" font-size="21">effectively suffocate. Switching to a</text><text x="41" y="624" fill="#f6faf5" font-size="21">nasal cannula is wrong — it lowers FiO2</text><text x="41" y="651" fill="#f6faf5" font-size="21">for a client who needed the highest</text><text x="41" y="678" fill="#f6faf5" font-size="21">available concentration.</text></g></svg>