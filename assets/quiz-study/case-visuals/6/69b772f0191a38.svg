<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which three Rights of Administration are INCORRECT on this order? “Give Mrs. Mann in room 705 .75 mg injection q6h” Select all that apply.</title><desc>THREE RIGHTS FAIL HERE. Right MEDICATION — no drug name is written at all. Right DOSE — “.75 mg” is a NAKED DECIMAL, which is on the do-not-use list because it reads as 75 mg; it must be written 0.75 mg. Right PATIENT — a name and room number are not two acceptable identifiers, and room number is never one. Time (q6h) and route (injection) are at least stated. An order with any missing or unsafe element must be clarified with the prescriber BEFORE giving it.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Rights of Med Admin</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which three Rights of Administration are</text><text x="41" y="198" fill="#f6faf5" font-size="21">INCORRECT on this order? “Give Mrs. Mann</text><text x="41" y="225" fill="#f6faf5" font-size="21">in room 705 .75 mg injection q6h” Select</text><text x="41" y="252" fill="#f6faf5" font-size="21">all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Right Patient · Right Dose · Right</text><text x="41" y="384" fill="#f6faf5" font-size="21">Medication</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">THREE RIGHTS FAIL HERE. Right MEDICATION —</text><text x="41" y="516" fill="#f6faf5" font-size="21">no drug name is written at all. Right DOSE</text><text x="41" y="543" fill="#f6faf5" font-size="21">— “.75 mg” is a NAKED DECIMAL, which is on</text><text x="41" y="570" fill="#f6faf5" font-size="21">the do-not-use list because it reads as 75</text><text x="41" y="597" fill="#f6faf5" font-size="21">mg; it must be written 0.75 mg. Right</text><text x="41" y="624" fill="#f6faf5" font-size="21">PATIENT — a name and room number are not</text><text x="41" y="651" fill="#f6faf5" font-size="21">two acceptable identifiers, and room</text><text x="41" y="678" fill="#f6faf5" font-size="21">number is never…</text></g></svg>