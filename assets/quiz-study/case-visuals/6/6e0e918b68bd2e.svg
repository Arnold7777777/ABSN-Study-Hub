<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is assessing a client 5 months after the death of their parent. Which findings are consistent with normal, uncomplicated grief? (Select all that apply.)</title><desc>Uncomplicated grief includes fluctuating sadness and somatic complaints such as fatigue, sleep changes, and appetite loss, with some movement toward acceptance by about 6 months. Statements of self-blame with a wish to die and refusal to acknowledge the death by preserving the space untouched point toward complicated grief and need follow-up.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Normal Grief</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assessing a client 5 months</text><text x="41" y="198" fill="#f6faf5" font-size="21">after the death of their parent. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">findings are consistent with normal,</text><text x="41" y="252" fill="#f6faf5" font-size="21">uncomplicated grief? (Select all that</text><text x="41" y="279" fill="#f6faf5" font-size="21">apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">The client describes waves of sadness that</text><text x="41" y="411" fill="#f6faf5" font-size="21">are becoming less frequent · The client</text><text x="41" y="438" fill="#f6faf5" font-size="21">reports occasional trouble falling asleep</text><text x="41" y="465" fill="#f6faf5" font-size="21">and low appetite · The client has returned</text><text x="41" y="492" fill="#f6faf5" font-size="21">to work and is…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">Uncomplicated grief includes fluctuating</text><text x="41" y="624" fill="#f6faf5" font-size="21">sadness and somatic complaints such as</text><text x="41" y="651" fill="#f6faf5" font-size="21">fatigue, sleep changes, and appetite loss,</text><text x="41" y="678" fill="#f6faf5" font-size="21">with some movement toward acceptance by</text><text x="41" y="705" fill="#f6faf5" font-size="21">about 6 months.</text></g></svg>