<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A client has a brachytherapy implant in place. Which action protects staff correctly?</title><desc>Brachytherapy safety is distance of at least 6 feet, a 30-minute maximum exposure, rotating caregivers , a personal dosimeter, a lead apron, and no pregnant staff assigned. Linens and dressings stay in the room, and continuity of assignment - normally a virtue - is exactly backwards here.</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oncologic Disorders &amp; End-of-Life</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Care</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client has a brachytherapy implant in</text><text x="41" y="231" fill="#f6faf5" font-size="21">place. Which action protects staff</text><text x="41" y="258" fill="#f6faf5" font-size="21">correctly?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Remain at least 6 feet away except when</text><text x="41" y="390" fill="#f6faf5" font-size="21">providing care, limit time in the room,</text><text x="41" y="417" fill="#f6faf5" font-size="21">and rotate caregivers</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Brachytherapy safety is distance of at</text><text x="41" y="549" fill="#f6faf5" font-size="21">least 6 feet, a 30-minute maximum</text><text x="41" y="576" fill="#f6faf5" font-size="21">exposure, rotating caregivers , a personal</text><text x="41" y="603" fill="#f6faf5" font-size="21">dosimeter, a lead apron, and no pregnant</text><text x="41" y="630" fill="#f6faf5" font-size="21">staff assigned. Linens and dressings stay</text><text x="41" y="657" fill="#f6faf5" font-size="21">in the room, and continuity of assignment</text><text x="41" y="684" fill="#f6faf5" font-size="21">- normally a virtue - is exactly backwards</text><text x="41" y="711" fill="#f6faf5" font-size="21">here.</text></g></svg>