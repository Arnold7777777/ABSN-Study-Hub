<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client is prescribed two different ophthalmic drops in the same eye. Which instruction is correct?</title><desc>Different drops need 5 to 10 minutes apart so the first is not washed out, and occluding the inner canthus for 2 minutes blocks systemic absorption through the nasolacrimal duct. Back-to-back instillation simply flushes the first drug away.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Disorders - Eye &amp; Ear</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is prescribed two different</text><text x="41" y="198" fill="#f6faf5" font-size="21">ophthalmic drops in the same eye. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">instruction is correct?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Wait 5 to 10 minutes between the two drops</text><text x="41" y="357" fill="#f6faf5" font-size="21">and press the inner canthus for 2 minutes</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Different drops need 5 to 10 minutes apart</text><text x="41" y="489" fill="#f6faf5" font-size="21">so the first is not washed out, and</text><text x="41" y="516" fill="#f6faf5" font-size="21">occluding the inner canthus for 2 minutes</text><text x="41" y="543" fill="#f6faf5" font-size="21">blocks systemic absorption through the</text><text x="41" y="570" fill="#f6faf5" font-size="21">nasolacrimal duct. Back-to-back</text><text x="41" y="597" fill="#f6faf5" font-size="21">instillation simply flushes the first drug</text><text x="41" y="624" fill="#f6faf5" font-size="21">away.</text></g></svg>