<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="539" viewBox="0 0 640 539"><title>Match each postoperative instruction to the joint replacement it belongs with.</title><desc>Knees are pushed to move early with a CPM machine and knee exercises, while hips are protected from the motions that dislocate them - no flexion past 90 degrees, no crossing the legs, abduction pillow in place. Applying hip restrictions to a knee is the common error and it stalls knee ROM recovery.</desc><rect width="640" height="539" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Knee vs hip rehab</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match each postoperative instruction to</text><text x="41" y="198" fill="#f6faf5" font-size="21">the joint replacement it belongs with.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="276" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">Knees are pushed to move early with a CPM</text><text x="41" y="330" fill="#f6faf5" font-size="21">machine and knee exercises, while hips are</text><text x="41" y="357" fill="#f6faf5" font-size="21">protected from the motions that dislocate</text><text x="41" y="384" fill="#f6faf5" font-size="21">them - no flexion past 90 degrees, no</text><text x="41" y="411" fill="#f6faf5" font-size="21">crossing the legs, abduction pillow in</text><text x="41" y="438" fill="#f6faf5" font-size="21">place. Applying hip restrictions to a knee</text><text x="41" y="465" fill="#f6faf5" font-size="21">is the common error and it stalls knee ROM</text><text x="41" y="492" fill="#f6faf5" font-size="21">recovery.</text></g></svg>