<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse assessing a client 2 hours after a fall notes that the left pupil is 6 mm and does not react to light while the right pupil is 3 mm and brisk. Which action should the nurse take?</title><desc>A newly unequal, dilated, nonreactive pupil suggests pressure on the oculomotor nerve from rising intracranial pressure and requires immediate notification. Delaying the recheck is the dangerous choice, because this change can progress to herniation within a short time, and a small number of people do have naturally unequal pupils but that variation is longstanding and both pupils still react.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Pupil Assessment</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse assessing a client 2 hours after a</text><text x="41" y="198" fill="#f6faf5" font-size="21">fall notes that the left pupil is 6 mm and</text><text x="41" y="225" fill="#f6faf5" font-size="21">does not react to light while the right</text><text x="41" y="252" fill="#f6faf5" font-size="21">pupil is 3 mm and brisk. Which action</text><text x="41" y="279" fill="#f6faf5" font-size="21">should the nurse take?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Notify the provider immediately</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A newly unequal, dilated, nonreactive</text><text x="41" y="516" fill="#f6faf5" font-size="21">pupil suggests pressure on the oculomotor</text><text x="41" y="543" fill="#f6faf5" font-size="21">nerve from rising intracranial pressure</text><text x="41" y="570" fill="#f6faf5" font-size="21">and requires immediate notification.</text></g></svg>