<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="458" viewBox="0 0 640 458"><title>Diagnostic criteria for Tourette&#x27;s disorder</title><desc>Tourette&#x27;s disorder is diagnosed when multiple motor tics and at least one vocal tic have been present (waxing and waning) for more than a year, with onset before age 18.</desc><rect width="640" height="458" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Diagnostic criteria for Tourette&#x27;s</text><text x="41" y="198" fill="#f6faf5" font-size="21">disorder</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">Tourette&#x27;s disorder is diagnosed when</text><text x="41" y="330" fill="#f6faf5" font-size="21">multiple motor tics and at least one vocal</text><text x="41" y="357" fill="#f6faf5" font-size="21">tic have been present (waxing and waning)</text><text x="41" y="384" fill="#f6faf5" font-size="21">for more than a year, with onset before</text><text x="41" y="411" fill="#f6faf5" font-size="21">age 18.</text></g></svg>