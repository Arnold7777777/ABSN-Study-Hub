<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>Which victims are immediate under START?</title><desc>START tags a victim immediate for any one of three findings: respirations of 30 or more, an absent radial pulse or capillary refill longer than 2 seconds, or an inability to follow simple commands. Victim B is not immediate; a victim who does not breathe after a single airway maneuver is tagged expectant, because in a mass casualty the resources go where they change survival. That reversal of everyday practice is the hardest part of disaster triage and the most tempting one to get wrong.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mass Casualty Triage</text><rect x="23" y="106" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which victims are immediate under START?</text><path d="M319 195v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="211" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 224) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="245" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="276" fill="#f6faf5" font-size="21">Victim A, with respirations of 34 · Victim</text><text x="41" y="303" fill="#f6faf5" font-size="21">C, with no radial pulse and capillary</text><text x="41" y="330" fill="#f6faf5" font-size="21">refill of 4 seconds · Victim D, who cannot</text><text x="41" y="357" fill="#f6faf5" font-size="21">follow simple commands</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">START tags a victim immediate for any one</text><text x="41" y="489" fill="#f6faf5" font-size="21">of three findings: respirations of 30 or</text><text x="41" y="516" fill="#f6faf5" font-size="21">more, an absent radial pulse or capillary</text><text x="41" y="543" fill="#f6faf5" font-size="21">refill longer than 2 seconds, or an</text><text x="41" y="570" fill="#f6faf5" font-size="21">inability to follow simple commands.</text></g></svg>