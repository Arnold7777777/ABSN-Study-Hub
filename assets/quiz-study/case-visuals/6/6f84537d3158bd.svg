<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A 6-hour-old newborn has a respiratory rate of 68 with mild nasal flaring. The infant has just finished crying vigorously and is otherwise pink with a heart rate of 148. Which action should the nurse take first?</title><desc>Newborn RR is 30-60, so 68 is abnormal, but it may be transient from crying. When two answers are defensible, choose the least invasive first — calm and reassess before escalating to the provider or starting oxygen.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Infant (0–1 year)</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 6-hour-old newborn has a respiratory</text><text x="41" y="198" fill="#f6faf5" font-size="21">rate of 68 with mild nasal flaring.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Swaddle and calm the newborn, then recount</text><text x="41" y="330" fill="#f6faf5" font-size="21">respirations for a full minute</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Newborn RR is 30-60, so 68 is abnormal,</text><text x="41" y="462" fill="#f6faf5" font-size="21">but it may be transient from crying. When</text><text x="41" y="489" fill="#f6faf5" font-size="21">two answers are defensible, choose the</text><text x="41" y="516" fill="#f6faf5" font-size="21">least invasive first — calm and reassess</text><text x="41" y="543" fill="#f6faf5" font-size="21">before escalating to the provider or</text><text x="41" y="570" fill="#f6faf5" font-size="21">starting oxygen.</text></g></svg>