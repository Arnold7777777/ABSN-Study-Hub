<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>A 45-year-old is scheduled for a colectomy at 0800 and the nurse has an order for IV cefazolin. When should the nurse plan to infuse it?</title><desc>PROPHYLACTIC ANTIBIOTICS GO IN WITHIN 60 MINUTES OF INCISION. That timing puts peak tissue levels right where the skin is opened, which is what actually lowers surgical site infection. Giving it the night before or after closure misses the window entirely, and waiting for a fever is treatment, not prophylaxis.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Surgical Antibiotic Timing</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 45-year-old is scheduled for a colectomy</text><text x="41" y="198" fill="#f6faf5" font-size="21">at 0800 and the nurse has an order for IV</text><text x="41" y="225" fill="#f6faf5" font-size="21">cefazolin. When should the nurse plan to</text><text x="41" y="252" fill="#f6faf5" font-size="21">infuse it?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Within 60 minutes before the surgical</text><text x="41" y="384" fill="#f6faf5" font-size="21">incision</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">PROPHYLACTIC ANTIBIOTICS GO IN WITHIN 60</text><text x="41" y="516" fill="#f6faf5" font-size="21">MINUTES OF INCISION.</text></g></svg>