<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A gerontologic nurse is analyzing the data from a client&#x27;s focused respiratory assessment. The nurse is aware that the amount of respiratory dead space increases with age. What is the effect of this physiologic change?</title><desc>The amount of respiratory dead space increases with age. Combined with other changes, this results in a decreased diffusion capacity for oxygen with increasing age, producing lower oxygen levels in the arterial circulation. Decreased shunting and increased ventilation do not occur with age.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 6 · Oxygen Therapy</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A gerontologic nurse is analyzing the data</text><text x="41" y="198" fill="#f6faf5" font-size="21">from a client&#x27;s focused respiratory</text><text x="41" y="225" fill="#f6faf5" font-size="21">assessment.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Decreased diffusion capacity for oxygen</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">The amount of respiratory dead space</text><text x="41" y="462" fill="#f6faf5" font-size="21">increases with age. Combined with other</text><text x="41" y="489" fill="#f6faf5" font-size="21">changes, this results in a decreased</text><text x="41" y="516" fill="#f6faf5" font-size="21">diffusion capacity for oxygen with</text><text x="41" y="543" fill="#f6faf5" font-size="21">increasing age, producing lower oxygen</text><text x="41" y="570" fill="#f6faf5" font-size="21">levels in the arterial circulation.</text><text x="41" y="597" fill="#f6faf5" font-size="21">Decreased shunting and increased</text><text x="41" y="624" fill="#f6faf5" font-size="21">ventilation do not occur with age.</text></g></svg>