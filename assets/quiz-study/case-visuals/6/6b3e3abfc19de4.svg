<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is preparing to test the function of cranial nerve X. Which assessment should the nurse use?</title><desc>The vagus (CN X) is tested by having the client say “aah” — the palate and uvula should rise symmetrically — and by listening to the voice for hoarseness. Identifying a scent tests CN I (olfactory) . The gag reflex tests CN IX (glossopharyngeal) . Smiling and raising the eyebrows tests CN VII (facial) .</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Cranial nerves</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to test the function</text><text x="41" y="198" fill="#f6faf5" font-size="21">of cranial nerve X. Which assessment</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse use?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Have the client open the mouth and say</text><text x="41" y="357" fill="#f6faf5" font-size="21">“aah”</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">The vagus (CN X) is tested by having the</text><text x="41" y="489" fill="#f6faf5" font-size="21">client say “aah” — the palate and uvula</text><text x="41" y="516" fill="#f6faf5" font-size="21">should rise symmetrically — and by</text><text x="41" y="543" fill="#f6faf5" font-size="21">listening to the voice for hoarseness.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Identifying a scent tests CN I (olfactory)</text><text x="41" y="597" fill="#f6faf5" font-size="21">. The gag reflex tests CN IX</text><text x="41" y="624" fill="#f6faf5" font-size="21">(glossopharyngeal) . Smiling and raising</text><text x="41" y="651" fill="#f6faf5" font-size="21">the eyebrows tests CN VII (facial) .</text></g></svg>