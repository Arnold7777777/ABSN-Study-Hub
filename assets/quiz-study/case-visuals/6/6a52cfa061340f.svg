<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which finding should the nurse expect when taking a history from a client who has an abdominal aortic aneurysm?</title><desc>Turbulent flow through the dilated aorta makes a bruit , usually just left of midline, often with a pulsating mass, and back, flank or abdominal pain. Do not palpate deeply over a known or suspected aneurysm - it can rupture. Sudden tearing pain with hypotension means it already has.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which finding should the nurse expect when</text><text x="41" y="198" fill="#f6faf5" font-size="21">taking a history from a client who has an</text><text x="41" y="225" fill="#f6faf5" font-size="21">abdominal aortic aneurysm?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A bruit over the upper mid-abdomen</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Turbulent flow through the dilated aorta</text><text x="41" y="462" fill="#f6faf5" font-size="21">makes a bruit , usually just left of</text><text x="41" y="489" fill="#f6faf5" font-size="21">midline, often with a pulsating mass, and</text><text x="41" y="516" fill="#f6faf5" font-size="21">back, flank or abdominal pain. Do not</text><text x="41" y="543" fill="#f6faf5" font-size="21">palpate deeply over a known or suspected</text><text x="41" y="570" fill="#f6faf5" font-size="21">aneurysm - it can rupture. Sudden tearing</text><text x="41" y="597" fill="#f6faf5" font-size="21">pain with hypotension means it already</text><text x="41" y="624" fill="#f6faf5" font-size="21">has.</text></g></svg>