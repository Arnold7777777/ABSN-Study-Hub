<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="620" viewBox="0 0 640 620"><title>204. A nurse educates a client with hepatic encephalopathy on dietary modifications. Which statement indicates a need for further teaching?</title><desc>a. Eating more chicken will not relieve encephalopathy, so this statement shows the client needs more teaching. Ammonia is lowered with lactulose (and rifaximin), not by changing protein. Current textbooks (Lewis; your Week 10 notes) say do not restrict protein ; clients need adequate protein, spread through the day, with a bedtime snack.</desc><rect width="640" height="620" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">204. A nurse educates a client with</text><text x="41" y="198" fill="#f6faf5" font-size="21">hepatic encephalopathy on dietary</text><text x="41" y="225" fill="#f6faf5" font-size="21">modifications. Which statement indicates a</text><text x="41" y="252" fill="#f6faf5" font-size="21">need for further teaching?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="303" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">a. Eating more chicken will not relieve</text><text x="41" y="384" fill="#f6faf5" font-size="21">encephalopathy, so this statement shows</text><text x="41" y="411" fill="#f6faf5" font-size="21">the client needs more teaching. Ammonia is</text><text x="41" y="438" fill="#f6faf5" font-size="21">lowered with lactulose (and rifaximin),</text><text x="41" y="465" fill="#f6faf5" font-size="21">not by changing protein. Current textbooks</text><text x="41" y="492" fill="#f6faf5" font-size="21">(Lewis; your Week 10 notes) say do not</text><text x="41" y="519" fill="#f6faf5" font-size="21">restrict protein ; clients need adequate</text><text x="41" y="546" fill="#f6faf5" font-size="21">protein, spread through the day, with a</text><text x="41" y="573" fill="#f6faf5" font-size="21">bedtime snack.</text></g></svg>