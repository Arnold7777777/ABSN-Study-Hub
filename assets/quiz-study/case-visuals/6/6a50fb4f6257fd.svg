<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is delivering a meal tray to a client who is blind. Which action by the nurse is most appropriate?</title><desc>Describing the tray using CLOCK POSITIONS (for example, &#x27;your chicken is at 6 o&#x27;clock, your milk is at 2 o&#x27;clock&#x27;) orients the client and PROMOTES INDEPENDENCE in eating. Feeding a client who is capable of self-feeding, or combining the food into one bowl, unnecessarily removes independence and dignity.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Vision Deficit</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is delivering a meal tray to a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client who is blind. Which action by the</text><text x="41" y="225" fill="#f6faf5" font-size="21">nurse is most appropriate?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Describe the location of the food and</text><text x="41" y="357" fill="#f6faf5" font-size="21">beverages using the numbers on the face of</text><text x="41" y="384" fill="#f6faf5" font-size="21">a clock</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="303" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Describing the tray using CLOCK POSITIONS</text><text x="41" y="516" fill="#f6faf5" font-size="21">(for example, &#x27;your chicken is at 6</text><text x="41" y="543" fill="#f6faf5" font-size="21">o&#x27;clock, your milk is at 2 o&#x27;clock&#x27;)</text><text x="41" y="570" fill="#f6faf5" font-size="21">orients the client and PROMOTES</text><text x="41" y="597" fill="#f6faf5" font-size="21">INDEPENDENCE in eating. Feeding a client</text><text x="41" y="624" fill="#f6faf5" font-size="21">who is capable of self-feeding, or</text><text x="41" y="651" fill="#f6faf5" font-size="21">combining the food into one bowl,</text><text x="41" y="678" fill="#f6faf5" font-size="21">unnecessarily removes independence and</text><text x="41" y="705" fill="#f6faf5" font-size="21">dignity.</text></g></svg>