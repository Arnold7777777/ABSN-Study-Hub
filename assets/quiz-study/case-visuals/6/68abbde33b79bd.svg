<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is preparing to administer a cleansing enema to an adult client. Which of the following actions should the nurse take?</title><desc>THE ENEMA TUBING IS LUBRICATED AND INSERTED 3 TO 4 INCHES INTO AN ADULT&#x27;S RECTUM, ANGLED TOWARD THE UMBILICUS TO FOLLOW THE NORMAL CONTOUR OF THE BOWEL. The client is placed in the LEFT lateral Sims&#x27; position because it follows the anatomic path of the descending and sigmoid colon and uses gravity to aid flow. The container is hung 12 to 18 inches above the anus, and the solution is warmed to about 40.5 C (105 F), since cold solution causes cramping and hot solution can burn the mucosa.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Enema Administration</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to administer a</text><text x="41" y="198" fill="#f6faf5" font-size="21">cleansing enema to an adult client. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">of the following actions should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Insert the lubricated tubing 3 to 4 inches</text><text x="41" y="384" fill="#f6faf5" font-size="21">(7.5 to 10 cm) toward the umbilicus</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">THE ENEMA TUBING IS LUBRICATED AND</text><text x="41" y="516" fill="#f6faf5" font-size="21">INSERTED 3 TO 4 INCHES INTO AN ADULT&#x27;S</text><text x="41" y="543" fill="#f6faf5" font-size="21">RECTUM, ANGLED TOWARD THE UMBILICUS TO</text><text x="41" y="570" fill="#f6faf5" font-size="21">FOLLOW THE NORMAL CONTOUR OF THE BOWEL.</text></g></svg>