<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="539" viewBox="0 0 640 539"><title>Match each clinical situation to the acid-base imbalance it typically produces.</title><desc>Sort by the system first: if breathing is the problem it is respiratory, if the gut or kidney is the problem it is metabolic. Then ask whether acid is being kept or lost, so slow breathing keeps CO2 acid, fast breathing loses it, NG suction pulls out hydrochloric acid, and diarrhea dumps bicarbonate base.</desc><rect width="640" height="539" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Acid-base causes</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match each clinical situation to the acid-</text><text x="41" y="198" fill="#f6faf5" font-size="21">base imbalance it typically produces.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="276" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">Sort by the system first: if breathing is</text><text x="41" y="330" fill="#f6faf5" font-size="21">the problem it is respiratory, if the gut</text><text x="41" y="357" fill="#f6faf5" font-size="21">or kidney is the problem it is metabolic.</text><text x="41" y="384" fill="#f6faf5" font-size="21">Then ask whether acid is being kept or</text><text x="41" y="411" fill="#f6faf5" font-size="21">lost, so slow breathing keeps CO2 acid,</text><text x="41" y="438" fill="#f6faf5" font-size="21">fast breathing loses it, NG suction pulls</text><text x="41" y="465" fill="#f6faf5" font-size="21">out hydrochloric acid, and diarrhea dumps</text><text x="41" y="492" fill="#f6faf5" font-size="21">bicarbonate base.</text></g></svg>