<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>A nurse is preparing to perform open endotracheal suctioning for an adult client in the ICU. Which of the following actions should the nurse take?</title><desc>HYPEROXYGENATE first and hold each pass to 10 TO 15 SECONDS to prevent HYPOXEMIA. Suction is applied only on WITHDRAWAL; suctioning while advancing strips and traumatizes the mucosa. Thirty second passes and back-to-back repeats drop the SpO2 sharply; limit to 2 or 3 passes with reoxygenation and rest between each one.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Recognizing the Need for</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Suctioning</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is preparing to perform open</text><text x="41" y="231" fill="#f6faf5" font-size="21">endotracheal suctioning for an adult</text><text x="41" y="258" fill="#f6faf5" font-size="21">client in the ICU. Which of the following</text><text x="41" y="285" fill="#f6faf5" font-size="21">actions should the nurse take?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Hyperoxygenate the client before</text><text x="41" y="417" fill="#f6faf5" font-size="21">suctioning and limit each pass to 10 to 15</text><text x="41" y="444" fill="#f6faf5" font-size="21">seconds</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">HYPEROXYGENATE first and hold each pass to</text><text x="41" y="576" fill="#f6faf5" font-size="21">10 TO 15 SECONDS to prevent HYPOXEMIA.</text></g></svg>