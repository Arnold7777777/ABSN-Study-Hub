<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is assessing a client who has a terminal illness. Which findings indicate that death is approaching? (Select all that apply.)</title><desc>As death approaches, CIRCULATION SHUNTS AWAY FROM THE PERIPHERY TO THE VITAL ORGANS, producing MOTTLING, cool dusky extremities, and a weak thready pulse; neurologic changes produce CHEYNE-STOKES RESPIRATIONS and decreasing level of consciousness. URINE OUTPUT DECREASES and becomes dark and concentrated, and APPETITE AND THIRST DECLINE, so the nurse should offer mouth care rather than force food or fluids.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Signs of Approaching Death</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assessing a client who has a</text><text x="41" y="198" fill="#f6faf5" font-size="21">terminal illness. Which findings indicate</text><text x="41" y="225" fill="#f6faf5" font-size="21">that death is approaching? (Select all</text><text x="41" y="252" fill="#f6faf5" font-size="21">that apply.)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Mottling of the hands, feet, and knees ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Cool, dusky extremities with a weak,</text><text x="41" y="411" fill="#f6faf5" font-size="21">thready pulse · Cheyne-Stokes respirations</text><text x="41" y="438" fill="#f6faf5" font-size="21">with periods of apnea · Decreased level of</text><text x="41" y="465" fill="#f6faf5" font-size="21">consciousness with…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">As death approaches, CIRCULATION SHUNTS</text><text x="41" y="597" fill="#f6faf5" font-size="21">AWAY FROM THE PERIPHERY TO THE VITAL</text><text x="41" y="624" fill="#f6faf5" font-size="21">ORGANS, producing MOTTLING, cool dusky</text><text x="41" y="651" fill="#f6faf5" font-size="21">extremities, and a weak thready pulse;</text></g></svg>