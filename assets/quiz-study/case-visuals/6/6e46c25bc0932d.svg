<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is describing mental health to a group of clients. Which statement best reflects mental health as a concept?</title><desc>Mental health is a dynamic capacity to cope, relate, and adapt along a continuum. It is not simply the absence of a diagnosis, is not fixed, and does not require the absence of all negative emotion.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is describing mental health to a</text><text x="41" y="198" fill="#f6faf5" font-size="21">group of clients. Which statement best</text><text x="41" y="225" fill="#f6faf5" font-size="21">reflects mental health as a concept?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The ability to cope with stress, maintain</text><text x="41" y="357" fill="#f6faf5" font-size="21">relationships, and adapt to change</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Mental health is a dynamic capacity to</text><text x="41" y="489" fill="#f6faf5" font-size="21">cope, relate, and adapt along a continuum.</text><text x="41" y="516" fill="#f6faf5" font-size="21">It is not simply the absence of a</text><text x="41" y="543" fill="#f6faf5" font-size="21">diagnosis, is not fixed, and does not</text><text x="41" y="570" fill="#f6faf5" font-size="21">require the absence of all negative</text><text x="41" y="597" fill="#f6faf5" font-size="21">emotion.</text></g></svg>