<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>112. A nurse assesses a client 36 hours after Roux-en-Y gastric bypass. Which finding is most concerning for an anastomotic leak?</title><desc>b. Tachycardia (HR &gt;100) is often the earliest sign of an anastomotic leak, appearing before fever or abdominal pain. The others are expected post-op.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">112. A nurse assesses a client 36 hours</text><text x="41" y="198" fill="#f6faf5" font-size="21">after Roux-en-Y gastric bypass. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">finding is most concerning for an</text><text x="41" y="252" fill="#f6faf5" font-size="21">anastomotic leak?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">b. Tachycardia (HR &gt;100) is often the</text><text x="41" y="384" fill="#f6faf5" font-size="21">earliest sign of an anastomotic leak,</text><text x="41" y="411" fill="#f6faf5" font-size="21">appearing before fever or abdominal pain.</text><text x="41" y="438" fill="#f6faf5" font-size="21">The others are expected post-op.</text></g></svg>