<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse and a second nurse are verifying a unit of blood at the bedside. Which items must match? Select all that apply.</title><desc>Identity, blood group and Rh, unit number and expiry are all verified by two people at the bedside. A room number is never used to identify a client for anything, least of all blood. Stay with the client for the first 15 minutes, when a reaction is most likely.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematologic Disorders</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse and a second nurse are verifying a</text><text x="41" y="198" fill="#f6faf5" font-size="21">unit of blood at the bedside. Which items</text><text x="41" y="225" fill="#f6faf5" font-size="21">must match? Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The client&#x27;s name and identification</text><text x="41" y="357" fill="#f6faf5" font-size="21">number · The blood group and Rh type · The</text><text x="41" y="384" fill="#f6faf5" font-size="21">unit number on the bag and the paperwork ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">The expiration date</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Identity, blood group and Rh, unit number</text><text x="41" y="543" fill="#f6faf5" font-size="21">and expiry are all verified by two people</text><text x="41" y="570" fill="#f6faf5" font-size="21">at the bedside. A room number is never</text><text x="41" y="597" fill="#f6faf5" font-size="21">used to identify a client for anything,</text><text x="41" y="624" fill="#f6faf5" font-size="21">least of all blood. Stay with the client</text><text x="41" y="651" fill="#f6faf5" font-size="21">for the first 15 minutes, when a reaction</text><text x="41" y="678" fill="#f6faf5" font-size="21">is most likely.</text></g></svg>