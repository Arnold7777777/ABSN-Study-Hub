<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A hospitalized older adult reports difficulty falling asleep and frequent awakenings. Which approach best addresses this problem?</title><desc>Sleep occurs in roughly 90-minute cycles, so clustering care protects full cycles and is the first-line, nonpharmacologic approach. A nightly sedative-hypnotic is the tempting choice, but these drugs increase confusion and fall risk in older adults and are reserved for use after nonpharmacologic measures fail.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sleep Promotion Plan</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A hospitalized older adult reports</text><text x="41" y="198" fill="#f6faf5" font-size="21">difficulty falling asleep and frequent</text><text x="41" y="225" fill="#f6faf5" font-size="21">awakenings. Which approach best addresses</text><text x="41" y="252" fill="#f6faf5" font-size="21">this problem?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Cluster nursing care so the client has</text><text x="41" y="384" fill="#f6faf5" font-size="21">uninterrupted 90-minute blocks of sleep at</text><text x="41" y="411" fill="#f6faf5" font-size="21">night</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Sleep occurs in roughly 90-minute cycles,</text><text x="41" y="543" fill="#f6faf5" font-size="21">so clustering care protects full cycles</text><text x="41" y="570" fill="#f6faf5" font-size="21">and is the first-line, nonpharmacologic</text><text x="41" y="597" fill="#f6faf5" font-size="21">approach.</text></g></svg>