<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A 2-month-old (4.5 kg) with a VP shunt placed 1 month ago is admitted after 3 days of irritability, poor feeding and vomiting. Which findings in her admission assessment require follow-up? (Select all that apply.)</title><desc>Fever, tachycardia, inconsolability, a head that grew 2 cm in a day , a bulging fontanel and vomiting all point to shunt infection or malfunction with rising ICP . A closed posterior fontanel is normal by 2 months, head lag is expected at this age, and RR 30 and equal reactive pupils are normal.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic &amp; Neuromuscular</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 2-month-old (4.5 kg) with a VP shunt</text><text x="41" y="198" fill="#f6faf5" font-size="21">placed 1 month ago is admitted after 3</text><text x="41" y="225" fill="#f6faf5" font-size="21">days of irritability, poor feeding and</text><text x="41" y="252" fill="#f6faf5" font-size="21">vomiting.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Temperature 38.8°C (rectal) · Heart rate</text><text x="41" y="384" fill="#f6faf5" font-size="21">182 beats/min · Irritable, awake and</text><text x="41" y="411" fill="#f6faf5" font-size="21">fussy;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Fever, tachycardia, inconsolability, a</text><text x="41" y="543" fill="#f6faf5" font-size="21">head that grew 2 cm in a day , a bulging</text><text x="41" y="570" fill="#f6faf5" font-size="21">fontanel and vomiting all point to shunt</text><text x="41" y="597" fill="#f6faf5" font-size="21">infection or malfunction with rising ICP .</text><text x="41" y="624" fill="#f6faf5" font-size="21">A closed posterior fontanel is normal by 2</text><text x="41" y="651" fill="#f6faf5" font-size="21">months, head lag is expected at this age,</text><text x="41" y="678" fill="#f6faf5" font-size="21">and RR 30 and equal reactive pupils are</text><text x="41" y="705" fill="#f6faf5" font-size="21">normal.</text></g></svg>