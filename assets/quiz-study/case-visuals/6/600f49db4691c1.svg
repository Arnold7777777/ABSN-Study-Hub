<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="566" viewBox="0 0 640 566"><title>A 24-year-old sexually active client reports pelvic pain and has a temperature of 38.6° C (101.5° F), cervical motion tenderness, and mucopurulent cervical discharge. ESR and CRP are elevated, and chlamydia testing is positive.</title><desc>Pelvic pain and tenderness with fever, elevated ESR and CRP, and a positive chlamydia test are classic pelvic inflammatory disease findings, and PID often requires IV combination antibiotic therapy. Bacterial vaginosis would show a thin, fishy-odor discharge without fever or cervical motion tenderness, fluconazole treats candidiasis rather than PID, and untreated chlamydia risks progressing to PID, ectopic pregnancy, and infertility, so it must never be left untreated.</desc><rect width="640" height="566" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Reproductive Disorders</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 24-year-old sexually active client</text><text x="41" y="198" fill="#f6faf5" font-size="21">reports pelvic pain and has a temperature</text><text x="41" y="225" fill="#f6faf5" font-size="21">of 38.6° C (101.5° F), cervical motion</text><text x="41" y="252" fill="#f6faf5" font-size="21">tenderness, and mucopurulent cervical</text><text x="41" y="279" fill="#f6faf5" font-size="21">discharge.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="222" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="384" fill="#f6faf5" font-size="21">Pelvic pain and tenderness with fever,</text><text x="41" y="411" fill="#f6faf5" font-size="21">elevated ESR and CRP, and a positive</text><text x="41" y="438" fill="#f6faf5" font-size="21">chlamydia test are classic pelvic</text><text x="41" y="465" fill="#f6faf5" font-size="21">inflammatory disease findings, and PID</text><text x="41" y="492" fill="#f6faf5" font-size="21">often requires IV combination antibiotic</text><text x="41" y="519" fill="#f6faf5" font-size="21">therapy.</text></g></svg>