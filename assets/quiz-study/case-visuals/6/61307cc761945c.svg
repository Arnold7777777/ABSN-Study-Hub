<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse has four clients who received medications this hour. Which client should the nurse assess first?</title><desc>Lip tingling and throat tightness after a first dose of an antibiotic are early anaphylaxis , an airway emergency. The ineffective acetaminophen is the tempting choice because the client is uncomfortable and the medication apparently failed, but an unrelieved headache is not airway threatening and can be addressed after the possible anaphylaxis is ruled out.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Medication Reaction Priority</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse has four clients who received</text><text x="41" y="198" fill="#f6faf5" font-size="21">medications this hour. Which client should</text><text x="41" y="225" fill="#f6faf5" font-size="21">the nurse assess first?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A client who received a first dose of</text><text x="41" y="357" fill="#f6faf5" font-size="21">intravenous penicillin 10 minutes ago and</text><text x="41" y="384" fill="#f6faf5" font-size="21">reports tingling lips and a scratchy</text><text x="41" y="411" fill="#f6faf5" font-size="21">throat</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Lip tingling and throat tightness after a</text><text x="41" y="543" fill="#f6faf5" font-size="21">first dose of an antibiotic are early</text><text x="41" y="570" fill="#f6faf5" font-size="21">anaphylaxis , an airway emergency.</text></g></svg>