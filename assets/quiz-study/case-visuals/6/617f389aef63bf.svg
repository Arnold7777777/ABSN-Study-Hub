<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nursing student asks why the abdomen is auscultated before it is palpated. Which response by the nurse is correct?</title><desc>Pressing on the abdomen stimulates or suppresses peristalsis, so sounds heard afterward no longer reflect the client&#x27;s true baseline. Client comfort is a real consideration, but it is not the reason for the reordering, and the sequence change applies only to the abdomen rather than to every system.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Abdominal Sequence</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nursing student asks why the abdomen is</text><text x="41" y="198" fill="#f6faf5" font-size="21">auscultated before it is palpated. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">response by the nurse is correct?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Touching and pressing on the abdomen</text><text x="41" y="357" fill="#f6faf5" font-size="21">alters bowel motility and changes the</text><text x="41" y="384" fill="#f6faf5" font-size="21">sounds heard</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Pressing on the abdomen stimulates or</text><text x="41" y="516" fill="#f6faf5" font-size="21">suppresses peristalsis, so sounds heard</text><text x="41" y="543" fill="#f6faf5" font-size="21">afterward no longer reflect the client&#x27;s</text><text x="41" y="570" fill="#f6faf5" font-size="21">true baseline. Client comfort is a real</text><text x="41" y="597" fill="#f6faf5" font-size="21">consideration, but it is not the reason</text><text x="41" y="624" fill="#f6faf5" font-size="21">for the reordering, and the sequence</text><text x="41" y="651" fill="#f6faf5" font-size="21">change applies only to the abdomen rather</text><text x="41" y="678" fill="#f6faf5" font-size="21">than to every system.</text></g></svg>