<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client asks the nurse whether taking a sleep medication every night is a good long-term plan. Which response by the nurse is accurate?</title><desc>Hypnotics can shorten sleep onset briefly but they suppress deep and REM sleep, cause carryover sedation, and may lead to rebound insomnia when stopped. Combining them with alcohol is dangerous because both depress the central nervous system.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sleep Medications</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client asks the nurse whether taking a</text><text x="41" y="198" fill="#f6faf5" font-size="21">sleep medication every night is a good</text><text x="41" y="225" fill="#f6faf5" font-size="21">long-term plan. Which response by the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse is accurate?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Sleep medications can help for a short</text><text x="41" y="384" fill="#f6faf5" font-size="21">time, but they reduce the quality of</text><text x="41" y="411" fill="#f6faf5" font-size="21">restorative sleep and can cause next-day</text><text x="41" y="438" fill="#f6faf5" font-size="21">drowsiness</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Hypnotics can shorten sleep onset briefly</text><text x="41" y="570" fill="#f6faf5" font-size="21">but they suppress deep and REM sleep,</text><text x="41" y="597" fill="#f6faf5" font-size="21">cause carryover sedation, and may lead to</text><text x="41" y="624" fill="#f6faf5" font-size="21">rebound insomnia when stopped. Combining</text><text x="41" y="651" fill="#f6faf5" font-size="21">them with alcohol is dangerous because</text><text x="41" y="678" fill="#f6faf5" font-size="21">both depress the central nervous system.</text></g></svg>