<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is preparing a 34-year-old client for a lumbar puncture in an outpatient clinic. Which of the following positions should the nurse help the client assume during the procedure?</title><desc>The LATERAL RECUMBENT C-SHAPE (side lying, knees to chest, chin tucked) widens the spaces between the vertebrae so the needle can pass. Prone and supine positions close those intervertebral spaces and block access. Sitting is used only when the client leans forward over a bedside table, not with the legs extended.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Lumbar Puncture Complications</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing a 34-year-old client</text><text x="41" y="198" fill="#f6faf5" font-size="21">for a lumbar puncture in an outpatient</text><text x="41" y="225" fill="#f6faf5" font-size="21">clinic. Which of the following positions</text><text x="41" y="252" fill="#f6faf5" font-size="21">should the nurse help the client assume</text><text x="41" y="279" fill="#f6faf5" font-size="21">during the procedure?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Side lying with the knees drawn up to the</text><text x="41" y="411" fill="#f6faf5" font-size="21">abdomen and the chin tucked toward the</text><text x="41" y="438" fill="#f6faf5" font-size="21">chest</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">The LATERAL RECUMBENT C-SHAPE (side lying,</text><text x="41" y="570" fill="#f6faf5" font-size="21">knees to chest, chin tucked) widens the</text><text x="41" y="597" fill="#f6faf5" font-size="21">spaces between the vertebrae so the needle</text><text x="41" y="624" fill="#f6faf5" font-size="21">can pass.</text></g></svg>