<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>Which statements about bleeding in pregnancy reflect the textbook&#x27;s guidance? Select all that apply.</title><desc>All true except the last. With suspected previa , a vaginal examination can provoke catastrophic hemorrhage — ultrasound first, no vaginal exam . Miscarriage is loss before 20 weeks , most often chromosomal. Abruption is separation late in pregnancy and can trigger DIC .</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which statements about bleeding in</text><text x="41" y="231" fill="#f6faf5" font-size="21">pregnancy reflect the textbook&#x27;s guidance?</text><text x="41" y="258" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Any vaginal bleeding in pregnancy is</text><text x="41" y="390" fill="#f6faf5" font-size="21">considered serious until proven otherwise</text><text x="41" y="417" fill="#f6faf5" font-size="21">· Concealed internal bleeding may make</text><text x="41" y="444" fill="#f6faf5" font-size="21">external loss look deceptively small ·</text><text x="41" y="471" fill="#f6faf5" font-size="21">Spontaneous miscarriage is loss…</text><path d="M319 495v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="511" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 524) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="545" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="576" fill="#f6faf5" font-size="21">All true except the last. With suspected</text><text x="41" y="603" fill="#f6faf5" font-size="21">previa , a vaginal examination can provoke</text><text x="41" y="630" fill="#f6faf5" font-size="21">catastrophic hemorrhage — ultrasound</text><text x="41" y="657" fill="#f6faf5" font-size="21">first, no vaginal exam . Miscarriage is</text><text x="41" y="684" fill="#f6faf5" font-size="21">loss before 20 weeks , most often</text><text x="41" y="711" fill="#f6faf5" font-size="21">chromosomal. Abruption is separation late</text><text x="41" y="738" fill="#f6faf5" font-size="21">in pregnancy and can trigger DIC .</text></g></svg>