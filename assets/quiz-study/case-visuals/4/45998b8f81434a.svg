<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>Which actions should the nurse take for a client with wound evisceration?</title><desc>Low-Fowler with knees bent reduces tension on the abdominal wall, the moist sterile covering protects exposed viscera, and the provider must be notified at once for emergency surgical repair. Sitting upright and ambulating increases intra-abdominal pressure and would worsen the evisceration.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Evisceration Care</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which actions should the nurse take for a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client with wound evisceration?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Place the client in low-Fowler position</text><text x="41" y="330" fill="#f6faf5" font-size="21">with the knees bent · Cover the wound with</text><text x="41" y="357" fill="#f6faf5" font-size="21">sterile saline-moistened gauze · Notify</text><text x="41" y="384" fill="#f6faf5" font-size="21">the provider immediately · Keep the client</text><text x="41" y="411" fill="#f6faf5" font-size="21">NPO in preparation for…</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Low-Fowler with knees bent reduces tension</text><text x="41" y="543" fill="#f6faf5" font-size="21">on the abdominal wall, the moist sterile</text><text x="41" y="570" fill="#f6faf5" font-size="21">covering protects exposed viscera, and the</text><text x="41" y="597" fill="#f6faf5" font-size="21">provider must be notified at once for</text><text x="41" y="624" fill="#f6faf5" font-size="21">emergency surgical repair. Sitting upright</text><text x="41" y="651" fill="#f6faf5" font-size="21">and ambulating increases intra-abdominal</text><text x="41" y="678" fill="#f6faf5" font-size="21">pressure and would worsen the</text><text x="41" y="705" fill="#f6faf5" font-size="21">evisceration.</text></g></svg>