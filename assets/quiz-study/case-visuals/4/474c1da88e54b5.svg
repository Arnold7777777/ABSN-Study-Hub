<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is admitting a client who lives alone, has no close friends, and reports believing they can sense when something bad will happen by noticing patterns in license plate numbers. The client denies hearing voices and has no delusions. Which disorder do these findings most support?</title><desc>Schizotypal PD = socially isolated AND odd — magical thinking, ideas of reference, superstition, &#x27;sixth sense.&#x27; There is no true psychosis. Schizoid is a loner who is content and has normal thinking. Schizophrenia requires hallucinations or delusions, which the client denies. Avoidant PD wants relationships but avoids them out of fear of rejection.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is admitting a client who lives</text><text x="41" y="198" fill="#f6faf5" font-size="21">alone, has no close friends, and reports</text><text x="41" y="225" fill="#f6faf5" font-size="21">believing they can sense when something</text><text x="41" y="252" fill="#f6faf5" font-size="21">bad will happen by noticing patterns in</text><text x="41" y="279" fill="#f6faf5" font-size="21">license plate numbers.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Schizotypal personality disorder</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Schizotypal PD = socially isolated AND odd</text><text x="41" y="516" fill="#f6faf5" font-size="21">— magical thinking, ideas of reference,</text><text x="41" y="543" fill="#f6faf5" font-size="21">superstition, &#x27;sixth sense.&#x27; There is no</text><text x="41" y="570" fill="#f6faf5" font-size="21">true psychosis.</text></g></svg>