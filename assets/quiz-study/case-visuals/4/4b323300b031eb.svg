<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="431" viewBox="0 0 640 431"><title>100. In which order should assessment techniques be performed for the ABDOMEN?</title><desc>b. The abdomen is the exception: Inspect → Auscultate → Percuss → Palpate. Palpation is last because pressing on the abdomen can alter bowel sounds.</desc><rect width="640" height="431" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">100. In which order should assessment</text><text x="41" y="198" fill="#f6faf5" font-size="21">techniques be performed for the ABDOMEN?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">b. The abdomen is the exception: Inspect →</text><text x="41" y="330" fill="#f6faf5" font-size="21">Auscultate → Percuss → Palpate. Palpation</text><text x="41" y="357" fill="#f6faf5" font-size="21">is last because pressing on the abdomen</text><text x="41" y="384" fill="#f6faf5" font-size="21">can alter bowel sounds.</text></g></svg>