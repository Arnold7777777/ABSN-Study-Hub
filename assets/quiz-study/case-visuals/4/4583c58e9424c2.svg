<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A client is brought to the emergency department confused, with new right-sided weakness. No history is available. The airway and breathing are adequate. Which bedside test does the nurse perform before the client goes for CT?</title><desc>Hypoglycemia can mimic a stroke , and a glucose below 50 mg/dL also rules out alteplase, so a fingerstick glucose is checked right away and does not delay the CT. A carotid ultrasound is done later in the admission, not in the emergency phase.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic Dysfunction &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Cerebrovascular Disorders</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client is brought to the emergency</text><text x="41" y="231" fill="#f6faf5" font-size="21">department confused, with new right-sided</text><text x="41" y="258" fill="#f6faf5" font-size="21">weakness.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Capillary blood glucose</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">Hypoglycemia can mimic a stroke , and a</text><text x="41" y="495" fill="#f6faf5" font-size="21">glucose below 50 mg/dL also rules out</text><text x="41" y="522" fill="#f6faf5" font-size="21">alteplase, so a fingerstick glucose is</text><text x="41" y="549" fill="#f6faf5" font-size="21">checked right away and does not delay the</text><text x="41" y="576" fill="#f6faf5" font-size="21">CT. A carotid ultrasound is done later in</text><text x="41" y="603" fill="#f6faf5" font-size="21">the admission, not in the emergency phase.</text></g></svg>