<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>A nurse is preparing to instill otic drops in a 2-year-old child. Which action should the nurse take?</title><desc>FOR A CHILD YOUNGER THAN 3 YEARS, THE PINNA IS PULLED DOWN AND BACK TO STRAIGHTEN THE SHORTER, MORE HORIZONTAL CANAL; UP AND BACK IS USED FOR CLIENTS 3 YEARS AND OLDER. The dropper must never touch or occlude the canal, because that contaminates the solution and can injure the ear. Cold drops can cause vertigo, nausea, and pain, so solutions are warmed to room temperature.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Otic Route</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to instill otic drops</text><text x="41" y="198" fill="#f6faf5" font-size="21">in a 2-year-old child. Which action should</text><text x="41" y="225" fill="#f6faf5" font-size="21">the nurse take?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Pull the pinna down and back</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">FOR A CHILD YOUNGER THAN 3 YEARS, THE</text><text x="41" y="462" fill="#f6faf5" font-size="21">PINNA IS PULLED DOWN AND BACK TO</text><text x="41" y="489" fill="#f6faf5" font-size="21">STRAIGHTEN THE SHORTER, MORE HORIZONTAL</text><text x="41" y="516" fill="#f6faf5" font-size="21">CANAL;</text></g></svg>