<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse plans the order of care for a group of clients. Which clients can safely wait until later in the shift? Select all that apply.</title><desc>Scheduled teaching, a comfort shower, and a water refill can all move later without harming anyone. Chest tightness with sweating may be a heart attack and needs action now. High fever with chills may signal sepsis and needs prompt assessment.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Prioritization</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse plans the order of care for a</text><text x="41" y="198" fill="#f6faf5" font-size="21">group of clients. Which clients can safely</text><text x="41" y="225" fill="#f6faf5" font-size="21">wait until later in the shift? Select all</text><text x="41" y="252" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">A client whose discharge teaching is</text><text x="41" y="384" fill="#f6faf5" font-size="21">already scheduled for the afternoon · A</text><text x="41" y="411" fill="#f6faf5" font-size="21">client who wants a shower before family</text><text x="41" y="438" fill="#f6faf5" font-size="21">arrives · A client asking for the water</text><text x="41" y="465" fill="#f6faf5" font-size="21">pitcher to be refilled</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Scheduled teaching, a comfort shower, and</text><text x="41" y="597" fill="#f6faf5" font-size="21">a water refill can all move later without</text><text x="41" y="624" fill="#f6faf5" font-size="21">harming anyone. Chest tightness with</text><text x="41" y="651" fill="#f6faf5" font-size="21">sweating may be a heart attack and needs</text><text x="41" y="678" fill="#f6faf5" font-size="21">action now. High fever with chills may</text><text x="41" y="705" fill="#f6faf5" font-size="21">signal sepsis and needs prompt assessment.</text></g></svg>