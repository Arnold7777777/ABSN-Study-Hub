<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>Which substance is described as a neuromodulator that controls alertness, gastric secretions, cardiac stimulation, and peripheral allergic responses?</title><desc>Histamine is the neuromodulator behind alertness, gastric acid secretion, cardiac stimulation, and allergy responses — blocking it causes sedation. Dopamine affects alertness and movement but has no role in gastric secretion or allergic response.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Foundations, Neurobiology &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Psychopharm Basics</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which substance is described as a</text><text x="41" y="231" fill="#f6faf5" font-size="21">neuromodulator that controls alertness,</text><text x="41" y="258" fill="#f6faf5" font-size="21">gastric secretions, cardiac stimulation,</text><text x="41" y="285" fill="#f6faf5" font-size="21">and peripheral allergic responses?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Histamine</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Histamine is the neuromodulator behind</text><text x="41" y="522" fill="#f6faf5" font-size="21">alertness, gastric acid secretion, cardiac</text><text x="41" y="549" fill="#f6faf5" font-size="21">stimulation, and allergy responses —</text><text x="41" y="576" fill="#f6faf5" font-size="21">blocking it causes sedation. Dopamine</text><text x="41" y="603" fill="#f6faf5" font-size="21">affects alertness and movement but has no</text><text x="41" y="630" fill="#f6faf5" font-size="21">role in gastric secretion or allergic</text><text x="41" y="657" fill="#f6faf5" font-size="21">response.</text></g></svg>