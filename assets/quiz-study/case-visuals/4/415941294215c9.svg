<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A client is receiving continuous enteral tube feedings. Which outcomes should the nurse include in the plan of care?</title><desc>These four describe measurable client results covering the main risks of tube feeding: aspiration, nutritional adequacy, elimination, and tolerance. Checking residuals is a nursing action, and a gain of 1 pound per day would represent fluid retention rather than nutritional repletion.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Enteral Nutrition Outcomes</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is receiving continuous enteral</text><text x="41" y="198" fill="#f6faf5" font-size="21">tube feedings. Which outcomes should the</text><text x="41" y="225" fill="#f6faf5" font-size="21">nurse include in the plan of care?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The client will remain free of aspiration</text><text x="41" y="357" fill="#f6faf5" font-size="21">during and after feedings · The client</text><text x="41" y="384" fill="#f6faf5" font-size="21">will maintain a weight within 2 pounds of</text><text x="41" y="411" fill="#f6faf5" font-size="21">the established goal weight by discharge ·</text><text x="41" y="438" fill="#f6faf5" font-size="21">The client will have a…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">These four describe measurable client</text><text x="41" y="570" fill="#f6faf5" font-size="21">results covering the main risks of tube</text><text x="41" y="597" fill="#f6faf5" font-size="21">feeding: aspiration, nutritional adequacy,</text><text x="41" y="624" fill="#f6faf5" font-size="21">elimination, and tolerance. Checking</text><text x="41" y="651" fill="#f6faf5" font-size="21">residuals is a nursing action, and a gain</text><text x="41" y="678" fill="#f6faf5" font-size="21">of 1 pound per day would represent fluid</text><text x="41" y="705" fill="#f6faf5" font-size="21">retention rather than nutritional</text><text x="41" y="732" fill="#f6faf5" font-size="21">repletion.</text></g></svg>