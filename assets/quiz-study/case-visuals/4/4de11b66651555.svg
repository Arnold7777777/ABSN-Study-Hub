<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>Three clients are admitted after a suspected anthrax exposure. Which precautions does the nurse implement?</title><desc>Anthrax is bacterial and is not transmitted person to person, so no isolation is required ; treatment is ciprofloxacin or penicillin. Smallpox (airborne) and plague (droplet) are transmissible - grouping all bioterrorism agents together is the trap.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Disaster, Mass Casualty &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Emergency Nursing</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Three clients are admitted after a</text><text x="41" y="231" fill="#f6faf5" font-size="21">suspected anthrax exposure. Which</text><text x="41" y="258" fill="#f6faf5" font-size="21">precautions does the nurse implement?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Standard precautions; anthrax is not</text><text x="41" y="390" fill="#f6faf5" font-size="21">spread person to person</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Anthrax is bacterial and is not</text><text x="41" y="522" fill="#f6faf5" font-size="21">transmitted person to person, so no</text><text x="41" y="549" fill="#f6faf5" font-size="21">isolation is required ; treatment is</text><text x="41" y="576" fill="#f6faf5" font-size="21">ciprofloxacin or penicillin. Smallpox</text><text x="41" y="603" fill="#f6faf5" font-size="21">(airborne) and plague (droplet) are</text><text x="41" y="630" fill="#f6faf5" font-size="21">transmissible - grouping all bioterrorism</text><text x="41" y="657" fill="#f6faf5" font-size="21">agents together is the trap.</text></g></svg>