<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse notes liquid effluent leaking from beneath the ostomy wafer. Which conclusion should the nurse draw?</title><desc>Leaking effluent is corrosive to peristomal skin, and skin breakdown is the primary complication of ostomy care — the wafer must be removed, the skin assessed, and a properly sized appliance applied. Documenting without acting allows a preventable wound to develop.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Ostomy Appliance</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse notes liquid effluent leaking from</text><text x="41" y="198" fill="#f6faf5" font-size="21">beneath the ostomy wafer. Which conclusion</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse draw?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Follow-up is required because the leaking</text><text x="41" y="357" fill="#f6faf5" font-size="21">effluent will damage the skin</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Leaking effluent is corrosive to</text><text x="41" y="489" fill="#f6faf5" font-size="21">peristomal skin, and skin breakdown is the</text><text x="41" y="516" fill="#f6faf5" font-size="21">primary complication of ostomy care — the</text><text x="41" y="543" fill="#f6faf5" font-size="21">wafer must be removed, the skin assessed,</text><text x="41" y="570" fill="#f6faf5" font-size="21">and a properly sized appliance applied.</text><text x="41" y="597" fill="#f6faf5" font-size="21">Documenting without acting allows a</text><text x="41" y="624" fill="#f6faf5" font-size="21">preventable wound to develop.</text></g></svg>