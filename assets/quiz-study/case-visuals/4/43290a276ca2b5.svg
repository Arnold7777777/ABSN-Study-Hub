<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="431" viewBox="0 0 640 431"><title>127. A client with intractable vomiting for 3 days has ABG pH 7.52, PaCO2 48, HCO3 36. Which imbalance best explains this?</title><desc>a. Loss of gastric acid → high pH, high bicarb = metabolic alkalosis. pH is still abnormal, so compensation is only partial.</desc><rect width="640" height="431" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">127. A client with intractable vomiting</text><text x="41" y="198" fill="#f6faf5" font-size="21">for 3 days has ABG pH 7.52, PaCO2 48, HCO3</text><text x="41" y="225" fill="#f6faf5" font-size="21">36. Which imbalance best explains this?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">a. Loss of gastric acid → high pH, high</text><text x="41" y="357" fill="#f6faf5" font-size="21">bicarb = metabolic alkalosis. pH is still</text><text x="41" y="384" fill="#f6faf5" font-size="21">abnormal, so compensation is only partial.</text></g></svg>