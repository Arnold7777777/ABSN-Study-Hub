<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client who is Rh-negative has just had a hydatidiform mole evacuated. Which prescription does the nurse expect?</title><desc>Any pregnancy loss, ectopic or molar evacuation in an Rh-negative client can expose her to Rh-positive cells, so Rho(D) immune globulin is given to prevent sensitization. Follow-up is serial hCG until it is undetectable, avoiding pregnancy for a year.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client who is Rh-negative has just had a</text><text x="41" y="231" fill="#f6faf5" font-size="21">hydatidiform mole evacuated. Which</text><text x="41" y="258" fill="#f6faf5" font-size="21">prescription does the nurse expect?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Rho(D) immune globulin</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">Any pregnancy loss, ectopic or molar</text><text x="41" y="495" fill="#f6faf5" font-size="21">evacuation in an Rh-negative client can</text><text x="41" y="522" fill="#f6faf5" font-size="21">expose her to Rh-positive cells, so Rho(D)</text><text x="41" y="549" fill="#f6faf5" font-size="21">immune globulin is given to prevent</text><text x="41" y="576" fill="#f6faf5" font-size="21">sensitization. Follow-up is serial hCG</text><text x="41" y="603" fill="#f6faf5" font-size="21">until it is undetectable, avoiding</text><text x="41" y="630" fill="#f6faf5" font-size="21">pregnancy for a year.</text></g></svg>