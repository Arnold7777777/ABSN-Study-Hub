<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A nursing student asks why every clinician on the psychiatric unit uses the DSM-5. Which statement best describes a purpose of the DSM-5?</title><desc>The DSM-5 exists to standardize the language and diagnostic criteria used by all mental health clinicians. It does not prescribe treatment — it describes disorders and the criteria used to diagnose them.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Response to Illness &amp; Mental-</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Health Assessment</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nursing student asks why every clinician</text><text x="41" y="231" fill="#f6faf5" font-size="21">on the psychiatric unit uses the DSM-5.</text><text x="41" y="258" fill="#f6faf5" font-size="21">Which statement best describes a purpose</text><text x="41" y="285" fill="#f6faf5" font-size="21">of the DSM-5?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">It provides a standardized nomenclature so</text><text x="41" y="417" fill="#f6faf5" font-size="21">all mental health professionals use the</text><text x="41" y="444" fill="#f6faf5" font-size="21">same language</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">The DSM-5 exists to standardize the</text><text x="41" y="576" fill="#f6faf5" font-size="21">language and diagnostic criteria used by</text><text x="41" y="603" fill="#f6faf5" font-size="21">all mental health clinicians. It does not</text><text x="41" y="630" fill="#f6faf5" font-size="21">prescribe treatment — it describes</text><text x="41" y="657" fill="#f6faf5" font-size="21">disorders and the criteria used to</text><text x="41" y="684" fill="#f6faf5" font-size="21">diagnose them.</text></g></svg>