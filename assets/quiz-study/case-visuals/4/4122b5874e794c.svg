<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client with obsessive-compulsive disorder has completed 4 weeks of exposure and response prevention therapy. Which finding indicates that the treatment has been effective?</title><desc>A substantial drop in ritual frequency with restored daily functioning is exactly what exposure and response prevention is designed to achieve. Complete absence of intrusive thoughts is the tempting answer because it sounds like a cure, but obsessions typically persist at a lower intensity, and the treatment target is the compulsive response rather than the thought. Asking staff to check and wearing gloves are reassurance seeking and avoidance, which substitute for the ritual and maintain the disorder.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anxiety and OCD</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with obsessive-compulsive</text><text x="41" y="198" fill="#f6faf5" font-size="21">disorder has completed 4 weeks of exposure</text><text x="41" y="225" fill="#f6faf5" font-size="21">and response prevention therapy. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">finding indicates that the treatment has</text><text x="41" y="279" fill="#f6faf5" font-size="21">been effective?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">The client washes his hands about 10 times</text><text x="41" y="411" fill="#f6faf5" font-size="21">daily rather than 40 and now arrives at</text><text x="41" y="438" fill="#f6faf5" font-size="21">meals on time</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">A substantial drop in ritual frequency</text><text x="41" y="570" fill="#f6faf5" font-size="21">with restored daily functioning is exactly</text><text x="41" y="597" fill="#f6faf5" font-size="21">what exposure and response prevention is</text><text x="41" y="624" fill="#f6faf5" font-size="21">designed to achieve.</text></g></svg>