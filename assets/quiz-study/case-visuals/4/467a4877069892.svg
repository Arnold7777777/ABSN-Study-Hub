<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A client at 10 weeks of gestation is admitted with vaginal bleeding and cramping. Which nursing actions are appropriate? Select all that apply.</title><desc>For any early bleed the nurse avoids vaginal exams, counts or weighs pads, and saves all passed tissue , since retained products can trigger DIC. Serial exams sound like careful monitoring but are contraindicated, and the word used with the client is miscarriage .</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 10 weeks of gestation is</text><text x="41" y="231" fill="#f6faf5" font-size="21">admitted with vaginal bleeding and</text><text x="41" y="258" fill="#f6faf5" font-size="21">cramping. Which nursing actions are</text><text x="41" y="285" fill="#f6faf5" font-size="21">appropriate? Select all that apply.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Save all tissue the client passes · Count</text><text x="41" y="417" fill="#f6faf5" font-size="21">or weigh perineal pads to estimate blood</text><text x="41" y="444" fill="#f6faf5" font-size="21">loss · Avoid vaginal examinations</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">For any early bleed the nurse avoids</text><text x="41" y="576" fill="#f6faf5" font-size="21">vaginal exams, counts or weighs pads, and</text><text x="41" y="603" fill="#f6faf5" font-size="21">saves all passed tissue , since retained</text><text x="41" y="630" fill="#f6faf5" font-size="21">products can trigger DIC. Serial exams</text><text x="41" y="657" fill="#f6faf5" font-size="21">sound like careful monitoring but are</text><text x="41" y="684" fill="#f6faf5" font-size="21">contraindicated, and the word used with</text><text x="41" y="711" fill="#f6faf5" font-size="21">the client is miscarriage .</text></g></svg>