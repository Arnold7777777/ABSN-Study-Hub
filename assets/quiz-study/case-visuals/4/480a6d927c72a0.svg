<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="515" viewBox="0 0 640 515"><title>A nurse is caring for a client on postoperative day 5 following a colectomy. The client coughs, reports a sudden giving way sensation in the abdomen, and the nurse observes a loop of bowel protruding through the separated incision. Which of the following actions should the nurse take?</title><desc>EVISCERATION IS A SURGICAL EMERGENCY; cover the organs with STERILE SALINE-MOISTENED dressings to keep tissue from drying and necrosing, place the client in low Fowler&#x27;s with knees FLEXED to reduce abdominal tension, keep NPO, and notify the surgeon. NEVER push organs back in, since that introduces infection and can injure bowel. High Fowler with legs straight increases tension on the wound, and fluids are withheld because the client is going to the operating room.</desc><rect width="640" height="515" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Recognizing Cues after Abdominal</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Surgery</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is caring for a client on</text><text x="41" y="231" fill="#f6faf5" font-size="21">postoperative day 5 following a colectomy.</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Cover the wound with sterile gauze</text><text x="41" y="363" fill="#f6faf5" font-size="21">moistened with sterile normal saline</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="87" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">EVISCERATION IS A SURGICAL EMERGENCY;</text></g></svg>