<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>The mother of a newborn is concerned about a bluish mark across her baby&#x27;s back and buttocks. Which response should the nurse make?</title><desc>Congenital dermal melanocytosis - the mark long called a Mongolian spot - is a flat blue-gray patch over the sacrum and buttocks, most common in newborns with darker skin. It is harmless and usually fades by school age. It is documented with its size and location at birth so that it is never later mistaken for a bruise.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The mother of a newborn is concerned about</text><text x="41" y="198" fill="#f6faf5" font-size="21">a bluish mark across her baby&#x27;s back and</text><text x="41" y="225" fill="#f6faf5" font-size="21">buttocks. Which response should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">make?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">“This is frequently seen in newborns of</text><text x="41" y="384" fill="#f6faf5" font-size="21">African American, Asian and Native</text><text x="41" y="411" fill="#f6faf5" font-size="21">American descent.”</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Congenital dermal melanocytosis - the mark</text><text x="41" y="543" fill="#f6faf5" font-size="21">long called a Mongolian spot - is a flat</text><text x="41" y="570" fill="#f6faf5" font-size="21">blue-gray patch over the sacrum and</text><text x="41" y="597" fill="#f6faf5" font-size="21">buttocks, most common in newborns with</text><text x="41" y="624" fill="#f6faf5" font-size="21">darker skin.</text></g></svg>