<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>According to Freud, a 7-year-old channels sexual drive into school, sports, and friendships. Which psychosexual stage is this?</title><desc>Latency (5 to 11 years) follows resolution of the oedipal complex, and drive is channeled into socially appropriate activity such as school and sports. Phallic/oedipal (3 to 5 years) is the stage just before, when genital focus and the oedipal conflict are active.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Theories &amp; Treatment Settings</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">According to Freud, a 7-year-old channels</text><text x="41" y="198" fill="#f6faf5" font-size="21">sexual drive into school, sports, and</text><text x="41" y="225" fill="#f6faf5" font-size="21">friendships. Which psychosexual stage is</text><text x="41" y="252" fill="#f6faf5" font-size="21">this?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Latency</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Latency (5 to 11 years) follows resolution</text><text x="41" y="489" fill="#f6faf5" font-size="21">of the oedipal complex, and drive is</text><text x="41" y="516" fill="#f6faf5" font-size="21">channeled into socially appropriate</text><text x="41" y="543" fill="#f6faf5" font-size="21">activity such as school and sports.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Phallic/oedipal (3 to 5 years) is the</text><text x="41" y="597" fill="#f6faf5" font-size="21">stage just before, when genital focus and</text><text x="41" y="624" fill="#f6faf5" font-size="21">the oedipal conflict are active.</text></g></svg>