<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which treatments are used for sialadenitis and sialolithiasis?</title><desc>Sialadenitis causes pain, swelling and tenderness — warm compresses, hydration and antibiotics if bacterial. For a stone: massage, hydration, sour candy to stimulate flow, and surgical removal if it will not pass.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Salivary Treatments</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which treatments are used for sialadenitis</text><text x="41" y="198" fill="#f6faf5" font-size="21">and sialolithiasis?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Sialadenitis: warm compresses, hydration,</text><text x="41" y="330" fill="#f6faf5" font-size="21">antibiotics if bacterial. Sialolithiasis:</text><text x="41" y="357" fill="#f6faf5" font-size="21">massage, hydration, sour candy, surgical</text><text x="41" y="384" fill="#f6faf5" font-size="21">removal</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Sialadenitis causes pain, swelling and</text><text x="41" y="516" fill="#f6faf5" font-size="21">tenderness — warm compresses, hydration</text><text x="41" y="543" fill="#f6faf5" font-size="21">and antibiotics if bacterial. For a stone:</text><text x="41" y="570" fill="#f6faf5" font-size="21">massage, hydration, sour candy to</text><text x="41" y="597" fill="#f6faf5" font-size="21">stimulate flow, and surgical removal if it</text><text x="41" y="624" fill="#f6faf5" font-size="21">will not pass.</text></g></svg>