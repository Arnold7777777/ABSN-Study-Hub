<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="536" viewBox="0 0 640 536"><title>Which statements to a child before a procedure should the nurse avoid? Select all that apply.</title><desc>Children take words literally. A bee sting is something to fear, “just a little stick” minimizes what they are about to feel and costs you their trust, and “put you to sleep” is what happened to the family pet. Plain, honest, concrete language works: say what will happen, say if it will hurt, and say what you will do about it.</desc><rect width="640" height="536" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which statements to a child before a</text><text x="41" y="198" fill="#f6faf5" font-size="21">procedure should the nurse avoid? Select</text><text x="41" y="225" fill="#f6faf5" font-size="21">all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">“You will feel a little bee sting.” · “It</text><text x="41" y="357" fill="#f6faf5" font-size="21">is just a little stick.” · “They are going</text><text x="41" y="384" fill="#f6faf5" font-size="21">to put you to sleep.”</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="87" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Children take words literally.</text></g></svg>