<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="536" viewBox="0 0 640 536"><title>At 1400 a client reports severe back pain. Prescriptions include oxycodone extended-release 20 mg PO every 12 hr (last given 0600) and oxycodone immediate-release 5 mg PO every 4 hr PRN (last given 2300 yesterday). Which action should the nurse take?</title><desc>The immediate-release dose is ordered every 4 hours as needed and the last one was 15 hours ago , so it is available now and the client is in severe pain. The extended-release dose was given at 0600 and is not due until 1800. Waiting until 1600, or calling the provider before using what is already prescribed, leaves her in pain for no reason.</desc><rect width="640" height="536" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Opioid Safety</text><rect x="23" y="106" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">At 1400 a client reports severe back pain.</text><path d="M319 195v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="211" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 224) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="245" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="276" fill="#f6faf5" font-size="21">Administer oxycodone immediate-release 5</text><text x="41" y="303" fill="#f6faf5" font-size="21">mg PO now</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">The immediate-release dose is ordered</text><text x="41" y="435" fill="#f6faf5" font-size="21">every 4 hours as needed and the last one</text><text x="41" y="462" fill="#f6faf5" font-size="21">was 15 hours ago , so it is available now</text><text x="41" y="489" fill="#f6faf5" font-size="21">and the client is in severe pain.</text></g></svg>