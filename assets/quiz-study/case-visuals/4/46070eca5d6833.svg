<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client with AIDS has dark purplish-brown lesions on the oral mucosa. Which condition does this describe?</title><desc>Kaposi&#x27;s sarcoma - a vascular tumor driven by human herpesvirus 8, appearing as painless purple or brown-black lesions on skin and mucous membranes. It is an AIDS-defining illness on its own, whatever the CD4 count.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">HIV - opportunistic infections</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with AIDS has dark purplish-brown</text><text x="41" y="198" fill="#f6faf5" font-size="21">lesions on the oral mucosa. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">condition does this describe?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Kaposi&#x27;s sarcoma</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Kaposi&#x27;s sarcoma - a vascular tumor driven</text><text x="41" y="462" fill="#f6faf5" font-size="21">by human herpesvirus 8, appearing as</text><text x="41" y="489" fill="#f6faf5" font-size="21">painless purple or brown-black lesions on</text><text x="41" y="516" fill="#f6faf5" font-size="21">skin and mucous membranes. It is an AIDS-</text><text x="41" y="543" fill="#f6faf5" font-size="21">defining illness on its own, whatever the</text><text x="41" y="570" fill="#f6faf5" font-size="21">CD4 count.</text></g></svg>