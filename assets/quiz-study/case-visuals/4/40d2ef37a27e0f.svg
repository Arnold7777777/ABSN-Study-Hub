<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A mother is a carrier of G6PD deficiency and the father is unaffected. What should the nurse explain about inheritance?</title><desc>G6PD deficiency is X-linked recessive. A carrier mother passes the affected X to each son with a 50% chance, so it shows up mostly in boys; daughters with one affected X are usually carriers.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology &amp; Childhood Neoplasms</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A mother is a carrier of G6PD deficiency</text><text x="41" y="198" fill="#f6faf5" font-size="21">and the father is unaffected. What should</text><text x="41" y="225" fill="#f6faf5" font-size="21">the nurse explain about inheritance?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Each son has a 50% chance of having the</text><text x="41" y="357" fill="#f6faf5" font-size="21">disorder</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">G6PD deficiency is X-linked recessive. A</text><text x="41" y="489" fill="#f6faf5" font-size="21">carrier mother passes the affected X to</text><text x="41" y="516" fill="#f6faf5" font-size="21">each son with a 50% chance, so it shows up</text><text x="41" y="543" fill="#f6faf5" font-size="21">mostly in boys; daughters with one</text><text x="41" y="570" fill="#f6faf5" font-size="21">affected X are usually carriers.</text></g></svg>