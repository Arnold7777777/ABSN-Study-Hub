<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is assessing a 42-year-old client who has had a peripheral IV in the right hand for 3 days. The site is red and warm, is tender to touch, and the nurse palpates a firm cord along the path of the vein. There is no drainage and the client is afebrile. Which of the following interpretations and actions is correct?</title><desc>RED, WARM, TENDER, PALPABLE CORD = PHLEBITIS, so the line comes out, warm moist heat goes on, a new site is started elsewhere, and the nurse grades the phlebitis per policy. Infiltration is COOL and PALE, not red and warm. No fever, no purulent drainage means this is not bacteremia, and venous spasm causes cramping pain with slowed flow, not a cord with redness.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">IV Therapy Complications</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assessing a 42-year-old client</text><text x="41" y="198" fill="#f6faf5" font-size="21">who has had a peripheral IV in the right</text><text x="41" y="225" fill="#f6faf5" font-size="21">hand for 3 days.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Phlebitis; discontinue the IV, apply warm</text><text x="41" y="357" fill="#f6faf5" font-size="21">moist compresses, and restart in another</text><text x="41" y="384" fill="#f6faf5" font-size="21">site</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">RED, WARM, TENDER, PALPABLE CORD =</text><text x="41" y="516" fill="#f6faf5" font-size="21">PHLEBITIS, so the line comes out, warm</text><text x="41" y="543" fill="#f6faf5" font-size="21">moist heat goes on, a new site is started</text><text x="41" y="570" fill="#f6faf5" font-size="21">elsewhere, and the nurse grades the</text><text x="41" y="597" fill="#f6faf5" font-size="21">phlebitis per policy.</text></g></svg>