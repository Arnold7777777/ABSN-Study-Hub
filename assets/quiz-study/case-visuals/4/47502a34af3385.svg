<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which are correct monitoring parameters for a client on TPN? Select all that apply.</title><desc>Daily weights, I&amp;O, glucose and temperature; glucose q4h at first; chemistries three times a week; CBC, platelets, PT, LFTs and albumin weekly. Tubing is changed every 24 hours, not 72.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">TPN Monitoring</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which are correct monitoring parameters</text><text x="41" y="198" fill="#f6faf5" font-size="21">for a client on TPN? Select all that</text><text x="41" y="225" fill="#f6faf5" font-size="21">apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Daily weight, intake and output, glucose</text><text x="41" y="357" fill="#f6faf5" font-size="21">and temperature · Glucose every 4 hours</text><text x="41" y="384" fill="#f6faf5" font-size="21">initially · BUN, electrolytes, calcium and</text><text x="41" y="411" fill="#f6faf5" font-size="21">magnesium three times a week · CBC,</text><text x="41" y="438" fill="#f6faf5" font-size="21">platelets, prothrombin time,…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Daily weights, I&amp;O, glucose and</text><text x="41" y="570" fill="#f6faf5" font-size="21">temperature; glucose q4h at first;</text><text x="41" y="597" fill="#f6faf5" font-size="21">chemistries three times a week; CBC,</text><text x="41" y="624" fill="#f6faf5" font-size="21">platelets, PT, LFTs and albumin weekly.</text><text x="41" y="651" fill="#f6faf5" font-size="21">Tubing is changed every 24 hours, not 72.</text></g></svg>