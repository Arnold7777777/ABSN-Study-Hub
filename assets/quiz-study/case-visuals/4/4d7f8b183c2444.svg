<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A female client whose religious practice requires modesty tells the charge nurse she is uncomfortable having a male nurse assist her with bathing. Which response by the charge nurse is most appropriate?</title><desc>Culturally competent care means ACCOMMODATING THE CLIENT&#x27;S PREFERENCES REGARDING CAREGIVER GENDER, BATHING TIME AND METHOD, AND FAMILY PARTICIPATION WHENEVER FEASIBLE, rather than overriding or explaining them away. Telling the client the assignment cannot change dismisses a legitimate cultural and religious need, and assuming that a family member should bathe her makes a decision for the client without asking what she prefers.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Cultural Considerations</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A female client whose religious practice</text><text x="41" y="198" fill="#f6faf5" font-size="21">requires modesty tells the charge nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">she is uncomfortable having a male nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">assist her with bathing. Which response by</text><text x="41" y="279" fill="#f6faf5" font-size="21">the charge nurse is most appropriate?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&#x27;I will adjust the assignment so a female</text><text x="41" y="411" fill="#f6faf5" font-size="21">staff member assists you with hygiene.&#x27;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Culturally competent care means</text><text x="41" y="543" fill="#f6faf5" font-size="21">ACCOMMODATING THE CLIENT&#x27;S PREFERENCES</text><text x="41" y="570" fill="#f6faf5" font-size="21">REGARDING CAREGIVER GENDER, BATHING TIME</text><text x="41" y="597" fill="#f6faf5" font-size="21">AND METHOD, AND FAMILY PARTICIPATION</text><text x="41" y="624" fill="#f6faf5" font-size="21">WHENEVER FEASIBLE, rather than overriding</text><text x="41" y="651" fill="#f6faf5" font-size="21">or explaining them away.</text></g></svg>