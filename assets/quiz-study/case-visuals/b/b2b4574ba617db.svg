<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="539" viewBox="0 0 640 539"><title>A 6-month-old boy is brought in by his mother after 3 days of vomiting and watery diarrhea. He has taken only small amounts of an oral electrolyte solution and has had one wet diaper in the last 12 hours. His usual weight at his 6-month visit two weeks ago was 8.0 kg.</title><desc>This case teaches that infants decompensate late and suddenly. Blood pressure is the last thing to fall in a child, weight change is the most accurate measure of fluid loss, and oral rehydration remains first line until the child is genuinely in shock.</desc><rect width="640" height="539" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Dehydration in the Infant</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 6-month-old boy is brought in by his</text><text x="41" y="198" fill="#f6faf5" font-size="21">mother after 3 days of vomiting and watery</text><text x="41" y="225" fill="#f6faf5" font-size="21">diarrhea.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="249" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">This case teaches that infants</text><text x="41" y="357" fill="#f6faf5" font-size="21">decompensate late and suddenly. Blood</text><text x="41" y="384" fill="#f6faf5" font-size="21">pressure is the last thing to fall in a</text><text x="41" y="411" fill="#f6faf5" font-size="21">child, weight change is the most accurate</text><text x="41" y="438" fill="#f6faf5" font-size="21">measure of fluid loss, and oral</text><text x="41" y="465" fill="#f6faf5" font-size="21">rehydration remains first line until the</text><text x="41" y="492" fill="#f6faf5" font-size="21">child is genuinely in shock.</text></g></svg>