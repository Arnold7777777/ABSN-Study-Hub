<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client on the unit is shouting obscenities, has thrown a chair, and no longer responds to staff direction. Which phase of the aggression cycle is this client in?</title><desc>Crisis means the client has lost control and staff must take charge for safety. In escalation the behavior is moving toward loss of control but the client can still be redirected — that is where talking and PRN medication still work.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anger, Abuse &amp; Violence</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client on the unit is shouting</text><text x="41" y="198" fill="#f6faf5" font-size="21">obscenities, has thrown a chair, and no</text><text x="41" y="225" fill="#f6faf5" font-size="21">longer responds to staff direction. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">phase of the aggression cycle is this</text><text x="41" y="279" fill="#f6faf5" font-size="21">client in?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Crisis</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Crisis means the client has lost control</text><text x="41" y="516" fill="#f6faf5" font-size="21">and staff must take charge for safety. In</text><text x="41" y="543" fill="#f6faf5" font-size="21">escalation the behavior is moving toward</text><text x="41" y="570" fill="#f6faf5" font-size="21">loss of control but the client can still</text><text x="41" y="597" fill="#f6faf5" font-size="21">be redirected — that is where talking and</text><text x="41" y="624" fill="#f6faf5" font-size="21">PRN medication still work.</text></g></svg>