<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client scheduled for surgery next week reports taking ginkgo biloba and garlic supplements daily. Which action should the nurse take?</title><desc>Garlic inhibits platelet aggregation and ginkgo also increases bleeding tendency, so the surgical team must know about them before the procedure. Many herbal products are not regulated like prescription medications, so being natural does not make them free of adverse effects or drug interactions.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Herbal Safety</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client scheduled for surgery next week</text><text x="41" y="198" fill="#f6faf5" font-size="21">reports taking ginkgo biloba and garlic</text><text x="41" y="225" fill="#f6faf5" font-size="21">supplements daily. Which action should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Report the use to the provider, because</text><text x="41" y="384" fill="#f6faf5" font-size="21">these products can increase bleeding risk</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Garlic inhibits platelet aggregation and</text><text x="41" y="516" fill="#f6faf5" font-size="21">ginkgo also increases bleeding tendency,</text><text x="41" y="543" fill="#f6faf5" font-size="21">so the surgical team must know about them</text><text x="41" y="570" fill="#f6faf5" font-size="21">before the procedure. Many herbal products</text><text x="41" y="597" fill="#f6faf5" font-size="21">are not regulated like prescription</text><text x="41" y="624" fill="#f6faf5" font-size="21">medications, so being natural does not</text><text x="41" y="651" fill="#f6faf5" font-size="21">make them free of adverse effects or drug</text><text x="41" y="678" fill="#f6faf5" font-size="21">interactions.</text></g></svg>