<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client taking haloperidol develops sudden spasms of the neck and tongue with an upward-fixed gaze a few hours after a dose increase. Which action should the nurse take first?</title><desc>These are signs of acute dystonia, an early extrapyramidal reaction that can threaten the airway. The priority treatment is a fast-acting anticholinergic (benztropine or diphenhydramine), typically IM/IV.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology: EPS Treatment</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client taking haloperidol develops</text><text x="41" y="198" fill="#f6faf5" font-size="21">sudden spasms of the neck and tongue with</text><text x="41" y="225" fill="#f6faf5" font-size="21">an upward-fixed gaze a few hours after a</text><text x="41" y="252" fill="#f6faf5" font-size="21">dose increase. Which action should the</text><text x="41" y="279" fill="#f6faf5" font-size="21">nurse take first?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Administer the prescribed IM</text><text x="41" y="411" fill="#f6faf5" font-size="21">anticholinergic such as benztropine</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">These are signs of acute dystonia, an</text><text x="41" y="543" fill="#f6faf5" font-size="21">early extrapyramidal reaction that can</text><text x="41" y="570" fill="#f6faf5" font-size="21">threaten the airway. The priority</text><text x="41" y="597" fill="#f6faf5" font-size="21">treatment is a fast-acting anticholinergic</text><text x="41" y="624" fill="#f6faf5" font-size="21">(benztropine or diphenhydramine),</text><text x="41" y="651" fill="#f6faf5" font-size="21">typically IM/IV.</text></g></svg>