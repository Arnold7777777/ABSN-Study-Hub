<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A nurse is teaching a client about the purpose and adverse effects of a new antihypertensive medication. Which teaching method best fits this learning domain?</title><desc>Knowledge and understanding of facts belong to the cognitive domain, which is best served by explanation, printed material, and verbal recall. Practicing on a model addresses psychomotor learning, and group discussion of feelings targets the affective domain, so neither matches this objective.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Cognitive Domain</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a client about the</text><text x="41" y="198" fill="#f6faf5" font-size="21">purpose and adverse effects of a new</text><text x="41" y="225" fill="#f6faf5" font-size="21">antihypertensive medication. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">teaching method best fits this learning</text><text x="41" y="279" fill="#f6faf5" font-size="21">domain?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Using discussion and written material,</text><text x="41" y="411" fill="#f6faf5" font-size="21">then asking the client to explain the</text><text x="41" y="438" fill="#f6faf5" font-size="21">information back</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Knowledge and understanding of facts</text><text x="41" y="570" fill="#f6faf5" font-size="21">belong to the cognitive domain, which is</text><text x="41" y="597" fill="#f6faf5" font-size="21">best served by explanation, printed</text><text x="41" y="624" fill="#f6faf5" font-size="21">material, and verbal recall. Practicing on</text><text x="41" y="651" fill="#f6faf5" font-size="21">a model addresses psychomotor learning,</text><text x="41" y="678" fill="#f6faf5" font-size="21">and group discussion of feelings targets</text><text x="41" y="705" fill="#f6faf5" font-size="21">the affective domain, so neither matches</text><text x="41" y="732" fill="#f6faf5" font-size="21">this objective.</text></g></svg>