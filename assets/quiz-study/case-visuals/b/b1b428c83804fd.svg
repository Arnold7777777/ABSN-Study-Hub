<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="512" viewBox="0 0 640 512"><title>154. A 68-year-old with emphysema has SOB and a productive cough. Which nursing actions best support respiratory status and well-being? (Select all that apply)</title><desc>a, c, d. Hand hygiene and sputum disposal prevent infection; vaccines protect weak lungs. Don&#x27;t set an arbitrary high O2 flow in COPD (CO2 narcosis risk), and don&#x27;t restrict ambulation (muscle loss, DVTs).</desc><rect width="640" height="512" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">154. A 68-year-old with emphysema has SOB</text><text x="41" y="198" fill="#f6faf5" font-size="21">and a productive cough. Which nursing</text><text x="41" y="225" fill="#f6faf5" font-size="21">actions best support respiratory status</text><text x="41" y="252" fill="#f6faf5" font-size="21">and well-being? (Select all that apply)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">a, c, d. Hand hygiene and sputum disposal</text><text x="41" y="384" fill="#f6faf5" font-size="21">prevent infection; vaccines protect weak</text><text x="41" y="411" fill="#f6faf5" font-size="21">lungs. Don&#x27;t set an arbitrary high O2 flow</text><text x="41" y="438" fill="#f6faf5" font-size="21">in COPD (CO2 narcosis risk), and don&#x27;t</text><text x="41" y="465" fill="#f6faf5" font-size="21">restrict ambulation (muscle loss, DVTs).</text></g></svg>