<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="482" viewBox="0 0 640 482"><title>A 2-year-old is admitted with a febrile illness. Which finding should the nurse report to the provider?</title><desc>A toddler breathes 20 to 30 a minute. Forty-eight is nearly double, and in a child the airway is where things go wrong first — respiratory failure, not cardiac arrest, is what arrests children . That is the call. The other three are normal for a 2-year-old , which is the whole trap: a heart rate of 108 sits inside the toddler range of 90 to 140 ; 86/42 is fine when the lowest acceptable systolic is 70 + (2 × age in years) , here 74; and 37.8°C is a low-grade temperature in a child admitted for fever. Judge a child&#x27;s vitals against the band for the age, never against an adult&#x27;s.</desc><rect width="640" height="482" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Toddler &amp; Preschooler</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 2-year-old is admitted with a febrile</text><text x="41" y="198" fill="#f6faf5" font-size="21">illness. Which finding should the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">report to the provider?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Respiratory rate 48/min</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="87" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">A toddler breathes 20 to 30 a minute.</text></g></svg>