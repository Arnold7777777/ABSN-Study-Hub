<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is preparing a 16-year-old for a scheduled surgery. Which teaching approach best matches her stage of cognitive development?</title><desc>By adolescence thinking is formal operational , so she can work with abstract and hypothetical reasoning about her own care. Walking through real equipment step by step is the tempting answer, but that fits the concrete operational school-age child, not a 16-year-old.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">School-Age &amp; Adolescent</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing a 16-year-old for a</text><text x="41" y="198" fill="#f6faf5" font-size="21">scheduled surgery. Which teaching approach</text><text x="41" y="225" fill="#f6faf5" font-size="21">best matches her stage of cognitive</text><text x="41" y="252" fill="#f6faf5" font-size="21">development?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Discuss possible outcomes and have her</text><text x="41" y="384" fill="#f6faf5" font-size="21">reason through why each part of the plan</text><text x="41" y="411" fill="#f6faf5" font-size="21">is done</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">By adolescence thinking is formal</text><text x="41" y="543" fill="#f6faf5" font-size="21">operational , so she can work with</text><text x="41" y="570" fill="#f6faf5" font-size="21">abstract and hypothetical reasoning about</text><text x="41" y="597" fill="#f6faf5" font-size="21">her own care. Walking through real</text><text x="41" y="624" fill="#f6faf5" font-size="21">equipment step by step is the tempting</text><text x="41" y="651" fill="#f6faf5" font-size="21">answer, but that fits the concrete</text><text x="41" y="678" fill="#f6faf5" font-size="21">operational school-age child, not a</text><text x="41" y="705" fill="#f6faf5" font-size="21">16-year-old.</text></g></svg>