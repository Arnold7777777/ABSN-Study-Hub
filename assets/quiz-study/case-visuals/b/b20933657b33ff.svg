<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>Four hours after a thyroidectomy, which finding does the nurse address first?</title><desc>Voice changes signal recurrent laryngeal nerve involvement and airway risk , so they rank first; hypocalcemia (Chvostek, Trousseau, carpopedal spasm) comes next, then neck swelling. Chvostek looks more dramatic on paper but the airway outranks it.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Endocrine Disorders</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Four hours after a thyroidectomy, which</text><text x="41" y="198" fill="#f6faf5" font-size="21">finding does the nurse address first?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">A hoarse, weakening voice</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">Voice changes signal recurrent laryngeal</text><text x="41" y="435" fill="#f6faf5" font-size="21">nerve involvement and airway risk , so</text><text x="41" y="462" fill="#f6faf5" font-size="21">they rank first; hypocalcemia (Chvostek,</text><text x="41" y="489" fill="#f6faf5" font-size="21">Trousseau, carpopedal spasm) comes next,</text><text x="41" y="516" fill="#f6faf5" font-size="21">then neck swelling. Chvostek looks more</text><text x="41" y="543" fill="#f6faf5" font-size="21">dramatic on paper but the airway outranks</text><text x="41" y="570" fill="#f6faf5" font-size="21">it.</text></g></svg>