<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="833" viewBox="0 0 640 833"><title>A nurse is preparing to give an IM injection to a hospitalized 14-month-old and an oral medication to a young infant. Which actions are appropriate? (Select all that apply.)</title><desc>The vastus lateralis is the preferred IM site in infants and small children because of its larger, better-developed muscle mass, and verifying identity with two identifiers plus caregiver confirmation is standard for infants and nonverbal children who cannot state their own name and birth date. Applying topical anesthetic 30-60 minutes before an injection and offering the toddler a real choice such as which leg receives it support atraumatic, developmentally appropriate care. Medication should never be mixed into a full bottle of formula because the infant may not finish it and receive an incomplete dose, and high-risk medications require two-nurse verification rather than a single nurse checking alone.</desc><rect width="640" height="833" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to give an IM</text><text x="41" y="198" fill="#f6faf5" font-size="21">injection to a hospitalized 14-month-old</text><text x="41" y="225" fill="#f6faf5" font-size="21">and an oral medication to a young infant.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which actions are appropriate? (Select all</text><text x="41" y="279" fill="#f6faf5" font-size="21">that apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Use the vastus lateralis muscle for the IM</text><text x="41" y="411" fill="#f6faf5" font-size="21">injection · Verify the child&#x27;s identity</text><text x="41" y="438" fill="#f6faf5" font-size="21">using two identifiers from the ID band,</text><text x="41" y="465" fill="#f6faf5" font-size="21">confirmed by the caregiver · Apply</text><text x="41" y="492" fill="#f6faf5" font-size="21">lidocaine-prilocaine cream to…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">The vastus lateralis is the preferred IM</text><text x="41" y="624" fill="#f6faf5" font-size="21">site in infants and small children because</text><text x="41" y="651" fill="#f6faf5" font-size="21">of its larger, better-developed muscle</text><text x="41" y="678" fill="#f6faf5" font-size="21">mass, and verifying identity with two</text><text x="41" y="705" fill="#f6faf5" font-size="21">identifiers plus caregiver confirmation is</text><text x="41" y="732" fill="#f6faf5" font-size="21">standard for infants and nonverbal</text><text x="41" y="759" fill="#f6faf5" font-size="21">children who cannot state their own name</text><text x="41" y="786" fill="#f6faf5" font-size="21">and birth date.</text></g></svg>