<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client admitted with Raynaud&#x27;s phenomenon is being taught how to limit attacks. Which statement shows correct understanding?</title><desc>Cold triggers the vasospasm, so gloves belong in any cold environment, including the freezer aisle. The color-sequence option is tempting because the three colors are right, but the order is reversed: it is white, then blue, then red .</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Allergic, Inflammatory &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Immunologic Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client admitted with Raynaud&#x27;s</text><text x="41" y="231" fill="#f6faf5" font-size="21">phenomenon is being taught how to limit</text><text x="41" y="258" fill="#f6faf5" font-size="21">attacks. Which statement shows correct</text><text x="41" y="285" fill="#f6faf5" font-size="21">understanding?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">I will wear gloves in cold places,</text><text x="41" y="417" fill="#f6faf5" font-size="21">including the freezer aisle at the store</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Cold triggers the vasospasm, so gloves</text><text x="41" y="549" fill="#f6faf5" font-size="21">belong in any cold environment, including</text><text x="41" y="576" fill="#f6faf5" font-size="21">the freezer aisle. The color-sequence</text><text x="41" y="603" fill="#f6faf5" font-size="21">option is tempting because the three</text><text x="41" y="630" fill="#f6faf5" font-size="21">colors are right, but the order is</text><text x="41" y="657" fill="#f6faf5" font-size="21">reversed: it is white, then blue, then red</text><text x="41" y="684" fill="#f6faf5" font-size="21">.</text></g></svg>