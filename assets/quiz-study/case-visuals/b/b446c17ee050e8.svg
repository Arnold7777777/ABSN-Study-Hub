<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="620" viewBox="0 0 640 620"><title>173. A client 2 hours after cardiac catheterization with stent has a rapidly expanding hematoma at the access site and a drop in blood pressure. Which set of interventions should the nurse implement first?</title><desc>d. Manual pressure controls the expanding hematoma; outlining it tracks expansion, and EKG monitors the heart. (High Fowler&#x27;s could worsen it; keep supine after cath.) Note: post-cath back/abdominal pain + hypotension suggests aortic puncture/hemorrhage.</desc><rect width="640" height="620" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">173. A client 2 hours after cardiac</text><text x="41" y="198" fill="#f6faf5" font-size="21">catheterization with stent has a rapidly</text><text x="41" y="225" fill="#f6faf5" font-size="21">expanding hematoma at the access site and</text><text x="41" y="252" fill="#f6faf5" font-size="21">a drop in blood pressure. Which set of</text><text x="41" y="279" fill="#f6faf5" font-size="21">interventions should the nurse implement</text><text x="41" y="306" fill="#f6faf5" font-size="21">first?</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="249" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="411" fill="#f6faf5" font-size="21">d. Manual pressure controls the expanding</text><text x="41" y="438" fill="#f6faf5" font-size="21">hematoma; outlining it tracks expansion,</text><text x="41" y="465" fill="#f6faf5" font-size="21">and EKG monitors the heart. (High Fowler&#x27;s</text><text x="41" y="492" fill="#f6faf5" font-size="21">could worsen it; keep supine after cath.)</text><text x="41" y="519" fill="#f6faf5" font-size="21">Note: post-cath back/abdominal pain +</text><text x="41" y="546" fill="#f6faf5" font-size="21">hypotension suggests aortic</text><text x="41" y="573" fill="#f6faf5" font-size="21">puncture/hemorrhage.</text></g></svg>