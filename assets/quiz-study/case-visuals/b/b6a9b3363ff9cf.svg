<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is reviewing the community clinic schedule and must identify which services are examples of secondary prevention. Which of the following should the nurse identify as secondary prevention? (Select all that apply.)</title><desc>SECONDARY PREVENTION IS EARLY DETECTION AND SCREENING IN AN ASYMPTOMATIC PERSON, so mammograms, PPD testing, blood pressure screening, Pap smears, colonoscopy, and fecal occult blood testing all qualify. Car seat teaching is primary prevention because it prevents injury from ever happening. Post-stroke physical therapy is tertiary because the disease has already occurred and the goal is restoring function.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Levels of Prevention</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is reviewing the community clinic</text><text x="41" y="198" fill="#f6faf5" font-size="21">schedule and must identify which services</text><text x="41" y="225" fill="#f6faf5" font-size="21">are examples of secondary prevention.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Screening mammogram for a 52-year-old</text><text x="41" y="357" fill="#f6faf5" font-size="21">woman with no breast symptoms · Tuberculin</text><text x="41" y="384" fill="#f6faf5" font-size="21">skin test (PPD) for a newly hired hospital</text><text x="41" y="411" fill="#f6faf5" font-size="21">employee · Blood pressure screening booth</text><text x="41" y="438" fill="#f6faf5" font-size="21">at a shopping center ·…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">SECONDARY PREVENTION IS EARLY DETECTION</text><text x="41" y="570" fill="#f6faf5" font-size="21">AND SCREENING IN AN ASYMPTOMATIC PERSON,</text><text x="41" y="597" fill="#f6faf5" font-size="21">so mammograms, PPD testing, blood pressure</text><text x="41" y="624" fill="#f6faf5" font-size="21">screening, Pap smears, colonoscopy, and</text><text x="41" y="651" fill="#f6faf5" font-size="21">fecal occult blood testing all qualify.</text></g></svg>