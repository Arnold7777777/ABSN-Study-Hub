<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>Which findings does the nurse classify as presumptive signs of pregnancy? Select all that apply.</title><desc>Presumptive signs can be explained by something other than pregnancy : fatigue, urinary frequency, skin changes, breast changes, nausea, amenorrhea, quickening, and in the lecture and Pillitteri, uterine enlargement (fibroids, tumors or a molar pregnancy can also enlarge the uterus). Ballottement is probable, and seeing the fetus on ultrasound is positive. ATI lists uterine enlargement as probable; the lecture and Pillitteri call it presumptive.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which findings does the nurse classify as</text><text x="41" y="231" fill="#f6faf5" font-size="21">presumptive signs of pregnancy? Select all</text><text x="41" y="258" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Fatigue · Frequent urination · Uterine</text><text x="41" y="390" fill="#f6faf5" font-size="21">enlargement · Striae gravidarum and linea</text><text x="41" y="417" fill="#f6faf5" font-size="21">nigra</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Presumptive signs can be explained by</text><text x="41" y="549" fill="#f6faf5" font-size="21">something other than pregnancy : fatigue,</text><text x="41" y="576" fill="#f6faf5" font-size="21">urinary frequency, skin changes, breast</text><text x="41" y="603" fill="#f6faf5" font-size="21">changes, nausea, amenorrhea, quickening,</text><text x="41" y="630" fill="#f6faf5" font-size="21">and in the lecture and Pillitteri, uterine</text><text x="41" y="657" fill="#f6faf5" font-size="21">enlargement (fibroids, tumors or a molar</text><text x="41" y="684" fill="#f6faf5" font-size="21">pregnancy can also enlarge the uterus).</text></g></svg>