<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>The nurse is teaching the parents of a child newly prescribed deferoxamine. Which statement shows the teaching worked?</title><desc>Deferoxamine is a chelator: it binds the extra iron so it leaves in the urine and stool. It is given as a slow subcutaneous (or IV) infusion over 8–12 hours, most nights, for as long as transfusions continue. Yearly hearing and vision checks are part of the plan.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology &amp; Childhood Neoplasms</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is teaching the parents of a</text><text x="41" y="198" fill="#f6faf5" font-size="21">child newly prescribed deferoxamine. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">statement shows the teaching worked?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">&quot;We will run it under the skin with the</text><text x="41" y="357" fill="#f6faf5" font-size="21">pump over 8 to 12 hours, usually</text><text x="41" y="384" fill="#f6faf5" font-size="21">overnight, 5 to 7 nights a week.&quot;</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Deferoxamine is a chelator: it binds the</text><text x="41" y="516" fill="#f6faf5" font-size="21">extra iron so it leaves in the urine and</text><text x="41" y="543" fill="#f6faf5" font-size="21">stool. It is given as a slow subcutaneous</text><text x="41" y="570" fill="#f6faf5" font-size="21">(or IV) infusion over 8–12 hours, most</text><text x="41" y="597" fill="#f6faf5" font-size="21">nights, for as long as transfusions</text><text x="41" y="624" fill="#f6faf5" font-size="21">continue. Yearly hearing and vision checks</text><text x="41" y="651" fill="#f6faf5" font-size="21">are part of the plan.</text></g></svg>