<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>While planning a client&#x27;s care, the nurse identifies nursing actions to minimize the client&#x27;s pleuritic pain. Which intervention should the nurse include in the plan of care?</title><desc>The key characteristic of pleuritic pain is its relationship to respiratory movement. Taking a deep breath, coughing, or sneezing worsens the pain. Because deep breathing and coughing prevent atelectasis, the client should be given an analgesic prior to performing these respiratory exercises. A soft diet is not necessarily indicated, and there is no need for the client to avoid speaking. Ambulation has multiple benefits, but pain management is not among them.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 5 · General Respiratory</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">While planning a client&#x27;s care, the nurse</text><text x="41" y="198" fill="#f6faf5" font-size="21">identifies nursing actions to minimize the</text><text x="41" y="225" fill="#f6faf5" font-size="21">client&#x27;s pleuritic pain. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">intervention should the nurse include in</text><text x="41" y="279" fill="#f6faf5" font-size="21">the plan of care?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Administer an analgesic before coughing</text><text x="41" y="411" fill="#f6faf5" font-size="21">and deep breathing.</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The key characteristic of pleuritic pain</text><text x="41" y="543" fill="#f6faf5" font-size="21">is its relationship to respiratory</text><text x="41" y="570" fill="#f6faf5" font-size="21">movement.</text></g></svg>