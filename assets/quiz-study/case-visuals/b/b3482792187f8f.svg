<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client is brought in from a construction site with a temperature of 41.1°C (106°F), hot dry skin and confusion. Which action is the priority?</title><desc>Heat stroke is a medical emergency — the temperature must come down fast, with cool fluids, cooling blankets, ice packs to the groin, axillae and neck, and continuous monitoring. Antipyretics do not work, because this is not a hypothalamic fever. Hot dry skin and altered mental status separate heat stroke from heat exhaustion.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Disaster, Mass Casualty &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Emergency Nursing</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client is brought in from a construction</text><text x="41" y="231" fill="#f6faf5" font-size="21">site with a temperature of 41.1°C (106°F),</text><text x="41" y="258" fill="#f6faf5" font-size="21">hot dry skin and confusion. Which action</text><text x="41" y="285" fill="#f6faf5" font-size="21">is the priority?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Begin rapid cooling and monitor</text><text x="41" y="417" fill="#f6faf5" font-size="21">continuously</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Heat stroke is a medical emergency — the</text><text x="41" y="549" fill="#f6faf5" font-size="21">temperature must come down fast, with cool</text><text x="41" y="576" fill="#f6faf5" font-size="21">fluids, cooling blankets, ice packs to the</text><text x="41" y="603" fill="#f6faf5" font-size="21">groin, axillae and neck, and continuous</text><text x="41" y="630" fill="#f6faf5" font-size="21">monitoring.</text></g></svg>