<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A woman tells the nurse she is returning home to her abusive partner because she is not ready to leave. Which response by the nurse is most therapeutic?</title><desc>The survivor decides when and whether to leave; the nurse&#x27;s role is to stay non-judgmental, express concern, and help build a safety plan and know the resources. &#x27;Why&#x27; questions blame the survivor, ordering her to leave is advice-giving, and confronting the abuser increases her danger.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anger, Abuse &amp; Violence</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A woman tells the nurse she is returning</text><text x="41" y="198" fill="#f6faf5" font-size="21">home to her abusive partner because she is</text><text x="41" y="225" fill="#f6faf5" font-size="21">not ready to leave. Which response by the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse is most therapeutic?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&#x27;I am concerned about your safety. Can we</text><text x="41" y="384" fill="#f6faf5" font-size="21">talk about a safety plan for when things</text><text x="41" y="411" fill="#f6faf5" font-size="21">escalate?&#x27;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The survivor decides when and whether to</text><text x="41" y="543" fill="#f6faf5" font-size="21">leave; the nurse&#x27;s role is to stay non-</text><text x="41" y="570" fill="#f6faf5" font-size="21">judgmental, express concern, and help</text><text x="41" y="597" fill="#f6faf5" font-size="21">build a safety plan and know the</text><text x="41" y="624" fill="#f6faf5" font-size="21">resources. &#x27;Why&#x27; questions blame the</text><text x="41" y="651" fill="#f6faf5" font-size="21">survivor, ordering her to leave is advice-</text><text x="41" y="678" fill="#f6faf5" font-size="21">giving, and confronting the abuser</text><text x="41" y="705" fill="#f6faf5" font-size="21">increases her danger.</text></g></svg>