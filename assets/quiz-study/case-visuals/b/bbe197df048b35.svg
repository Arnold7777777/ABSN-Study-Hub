<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is caring for a client who has an arteriovenous fistula in the left arm and an IV infusing in the right forearm. Where should the nurse measure the blood pressure?</title><desc>The extremity with a fistula must never be used because cuff pressure can damage or clot the access, and inflating above an infusing IV risks infiltration and interrupts the infusion. A thigh or popliteal measurement with a correctly sized cuff is the appropriate alternative when both arms are unavailable.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Blood Pressure Technique</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client who has an</text><text x="41" y="198" fill="#f6faf5" font-size="21">arteriovenous fistula in the left arm and</text><text x="41" y="225" fill="#f6faf5" font-size="21">an IV infusing in the right forearm. Where</text><text x="41" y="252" fill="#f6faf5" font-size="21">should the nurse measure the blood</text><text x="41" y="279" fill="#f6faf5" font-size="21">pressure?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Either thigh using an appropriately sized</text><text x="41" y="411" fill="#f6faf5" font-size="21">cuff</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The extremity with a fistula must never be</text><text x="41" y="543" fill="#f6faf5" font-size="21">used because cuff pressure can damage or</text><text x="41" y="570" fill="#f6faf5" font-size="21">clot the access, and inflating above an</text><text x="41" y="597" fill="#f6faf5" font-size="21">infusing IV risks infiltration and</text><text x="41" y="624" fill="#f6faf5" font-size="21">interrupts the infusion.</text></g></svg>