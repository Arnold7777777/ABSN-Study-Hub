<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is assessing a 71-year-old client who has a tracheostomy on a medical-surgical unit. Which of the following findings indicate that the client needs suctioning? (Select all that apply.)</title><desc>SUCTION FOR FINDINGS, NOT FOR THE CLOCK. Gurgling or coarse crackles over the trachea, restlessness with a dropping SpO2, and visible secretions the client cannot cough out are all ASSESSMENT-BASED indicators of retained secretions. Clear lung sounds after an effective productive cough mean the client is clearing the airway independently, and routine scheduled suctioning is not indicated because it causes needless hypoxemia and mucosal trauma.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assessing a 71-year-old client</text><text x="41" y="198" fill="#f6faf5" font-size="21">who has a tracheostomy on a medical-</text><text x="41" y="225" fill="#f6faf5" font-size="21">surgical unit. Which of the following</text><text x="41" y="252" fill="#f6faf5" font-size="21">findings indicate that the client needs</text><text x="41" y="279" fill="#f6faf5" font-size="21">suctioning? (Select all that apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Coarse gurgling crackles auscultated over</text><text x="41" y="411" fill="#f6faf5" font-size="21">the trachea · New restlessness with SpO2</text><text x="41" y="438" fill="#f6faf5" font-size="21">falling from 96% to 88% · Visible</text><text x="41" y="465" fill="#f6faf5" font-size="21">secretions bubbling in the tracheostomy</text><text x="41" y="492" fill="#f6faf5" font-size="21">tube with a weak, ineffective…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="87" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">SUCTION FOR FINDINGS, NOT FOR THE CLOCK.</text></g></svg>