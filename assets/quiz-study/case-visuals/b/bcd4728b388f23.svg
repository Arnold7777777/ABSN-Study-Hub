<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse in a pediatric clinic is caring for a preschool-age child who has a new diagnosis of ADHD. Which of the following statements should the nurse include when teaching the parent?</title><desc>Inattentive/impulsive behavior increases injury risk. ADHD behaviors are present before age 12; argumentativeness is ODD; below-average intellect is intellectual development disorder.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurodevelopmental: ADHD</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse in a pediatric clinic is caring</text><text x="41" y="198" fill="#f6faf5" font-size="21">for a preschool-age child who has a new</text><text x="41" y="225" fill="#f6faf5" font-size="21">diagnosis of ADHD. Which of the following</text><text x="41" y="252" fill="#f6faf5" font-size="21">statements should the nurse include when</text><text x="41" y="279" fill="#f6faf5" font-size="21">teaching the parent?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&quot;Because of this disorder, your child is</text><text x="41" y="411" fill="#f6faf5" font-size="21">at an increased risk for injury.&quot;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Inattentive/impulsive behavior increases</text><text x="41" y="543" fill="#f6faf5" font-size="21">injury risk. ADHD behaviors are present</text><text x="41" y="570" fill="#f6faf5" font-size="21">before age 12; argumentativeness is ODD;</text><text x="41" y="597" fill="#f6faf5" font-size="21">below-average intellect is intellectual</text><text x="41" y="624" fill="#f6faf5" font-size="21">development disorder.</text></g></svg>