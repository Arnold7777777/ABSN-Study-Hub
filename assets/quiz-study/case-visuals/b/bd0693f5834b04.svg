<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A nurse is teaching a client who has polycythemia vera about self-care measures. Which of the following interventions should the nurse include?</title><desc>Elevating the legs promotes venous return and reduces the stasis that leads to clots — the whole nursing priority in polycythemia vera. One liter is far too little ; the client needs at least 3 L a day to keep the blood from thickening further. Continuous support hose and any tight clothing restrict circulation. Flossing is avoided — the platelets are numerous but dysfunctional, so gums bleed easily; a soft toothbrush is used instead.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Polycythemia Vera</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a client who has</text><text x="41" y="198" fill="#f6faf5" font-size="21">polycythemia vera about self-care</text><text x="41" y="225" fill="#f6faf5" font-size="21">measures. Which of the following</text><text x="41" y="252" fill="#f6faf5" font-size="21">interventions should the nurse include?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;Elevate your legs when sitting.&quot;</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Elevating the legs promotes venous return</text><text x="41" y="489" fill="#f6faf5" font-size="21">and reduces the stasis that leads to clots</text><text x="41" y="516" fill="#f6faf5" font-size="21">— the whole nursing priority in</text><text x="41" y="543" fill="#f6faf5" font-size="21">polycythemia vera.</text></g></svg>