<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>An RN is working with an LPN on a medical unit. Which client should the RN care for personally?</title><desc>Teaching is part of the RN scope and cannot be transferred, particularly for a high-alert medication where the client must learn bleeding precautions and monitoring. Catheter removal is the tempting choice because it is invasive, but it is a routine, predictable procedure well within LPN scope for a stable client.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">RN-Only Responsibilities</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An RN is working with an LPN on a medical</text><text x="41" y="198" fill="#f6faf5" font-size="21">unit. Which client should the RN care for</text><text x="41" y="225" fill="#f6faf5" font-size="21">personally?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A client who needs discharge teaching</text><text x="41" y="357" fill="#f6faf5" font-size="21">about a newly prescribed anticoagulant</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Teaching is part of the RN scope and</text><text x="41" y="489" fill="#f6faf5" font-size="21">cannot be transferred, particularly for a</text><text x="41" y="516" fill="#f6faf5" font-size="21">high-alert medication where the client</text><text x="41" y="543" fill="#f6faf5" font-size="21">must learn bleeding precautions and</text><text x="41" y="570" fill="#f6faf5" font-size="21">monitoring.</text></g></svg>