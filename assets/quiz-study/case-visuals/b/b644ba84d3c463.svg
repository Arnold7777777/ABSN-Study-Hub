<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client is scheduled for allergy skin testing. The record shows the client has been taking prednisone daily. Which action should the nurse take?</title><desc>Corticosteroids and antihistamines flatten the skin response , so the test reads negative whether or not she is allergic. Prednisone is stopped around two weeks beforehand and antihistamines for several days, on the provider&#x27;s instruction.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is scheduled for allergy skin</text><text x="41" y="198" fill="#f6faf5" font-size="21">testing. The record shows the client has</text><text x="41" y="225" fill="#f6faf5" font-size="21">been taking prednisone daily. Which action</text><text x="41" y="252" fill="#f6faf5" font-size="21">should the nurse take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Postpone the testing and notify the</text><text x="41" y="384" fill="#f6faf5" font-size="21">provider</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Corticosteroids and antihistamines flatten</text><text x="41" y="516" fill="#f6faf5" font-size="21">the skin response , so the test reads</text><text x="41" y="543" fill="#f6faf5" font-size="21">negative whether or not she is allergic.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Prednisone is stopped around two weeks</text><text x="41" y="597" fill="#f6faf5" font-size="21">beforehand and antihistamines for several</text><text x="41" y="624" fill="#f6faf5" font-size="21">days, on the provider&#x27;s instruction.</text></g></svg>