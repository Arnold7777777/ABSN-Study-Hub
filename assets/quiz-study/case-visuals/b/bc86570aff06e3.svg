<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A nurse is providing perineal care for a client who can do very little to help with the procedure. Which of the following actions should the nurse take?</title><desc>Front-to-back cleansing, replacing the foreskin, and drying thoroughly protect skin integrity and reduce urinary infection risk. Reusing the same cloth surface simply spreads organisms, and leaving the client exposed to air dry sacrifices privacy and warmth for no benefit.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Perineal Care</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is providing perineal care for a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client who can do very little to help with</text><text x="41" y="225" fill="#f6faf5" font-size="21">the procedure. Which of the following</text><text x="41" y="252" fill="#f6faf5" font-size="21">actions should the nurse take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Cleanse from the pubic area back toward</text><text x="41" y="384" fill="#f6faf5" font-size="21">the rectum · Retract the foreskin to clean</text><text x="41" y="411" fill="#f6faf5" font-size="21">the tip of the penis, then return it to</text><text x="41" y="438" fill="#f6faf5" font-size="21">its usual position · Pat the area</text><text x="41" y="465" fill="#f6faf5" font-size="21">completely dry before covering…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Front-to-back cleansing, replacing the</text><text x="41" y="597" fill="#f6faf5" font-size="21">foreskin, and drying thoroughly protect</text><text x="41" y="624" fill="#f6faf5" font-size="21">skin integrity and reduce urinary</text><text x="41" y="651" fill="#f6faf5" font-size="21">infection risk. Reusing the same cloth</text><text x="41" y="678" fill="#f6faf5" font-size="21">surface simply spreads organisms, and</text><text x="41" y="705" fill="#f6faf5" font-size="21">leaving the client exposed to air dry</text><text x="41" y="732" fill="#f6faf5" font-size="21">sacrifices privacy and warmth for no</text><text x="41" y="759" fill="#f6faf5" font-size="21">benefit.</text></g></svg>