<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A home health nurse assesses an 81-year-old woman with an unsteady gait and poor night vision. Select all changes the nurse should recommend.</title><desc>Loose rugs, dim lighting, and no bathroom support are the classic causes of falls in older adults, and all three are fixable in one visit. Cords across a walkway are another tripping hazard. Draping laundry on a space heater is a fire risk.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Community &amp; Home Health</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A home health nurse assesses an 81-year-</text><text x="41" y="198" fill="#f6faf5" font-size="21">old woman with an unsteady gait and poor</text><text x="41" y="225" fill="#f6faf5" font-size="21">night vision. Select all changes the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">should recommend.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Remove loose throw rugs from hallways and</text><text x="41" y="384" fill="#f6faf5" font-size="21">the bathroom · Install grab bars beside</text><text x="41" y="411" fill="#f6faf5" font-size="21">the toilet and inside the tub · Add night</text><text x="41" y="438" fill="#f6faf5" font-size="21">lights along the path from bed to bathroom</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Loose rugs, dim lighting, and no bathroom</text><text x="41" y="570" fill="#f6faf5" font-size="21">support are the classic causes of falls in</text><text x="41" y="597" fill="#f6faf5" font-size="21">older adults, and all three are fixable in</text><text x="41" y="624" fill="#f6faf5" font-size="21">one visit. Cords across a walkway are</text><text x="41" y="651" fill="#f6faf5" font-size="21">another tripping hazard. Draping laundry</text><text x="41" y="678" fill="#f6faf5" font-size="21">on a space heater is a fire risk.</text></g></svg>