<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="536" viewBox="0 0 640 536"><title>An infant weighs 9 pounds 7 ounces. What is the infant&#x27;s weight in kilograms? (Round to the nearest tenth.)</title><desc>First convert the ounces to a fraction of a pound: 7 ÷ 16 = 0.4375, so the infant weighs 9.4375 lb. Then 9.4375 ÷ 2.2 = 4.29 → 4.3 KG. THE MOST COMMON ERROR IS IGNORING THE OUNCES or dividing by 16 instead of 2.2. Choosing 20.8 means you MULTIPLIED by 2.2 — remember kilograms is always the SMALLER number.</desc><rect width="640" height="536" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Weight Conversion</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An infant weighs 9 pounds 7 ounces. What</text><text x="41" y="198" fill="#f6faf5" font-size="21">is the infant&#x27;s weight in kilograms?</text><text x="41" y="225" fill="#f6faf5" font-size="21">(Round to the nearest tenth.)</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">4.3 kg</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">First convert the ounces to a fraction of</text><text x="41" y="462" fill="#f6faf5" font-size="21">a pound: 7 ÷ 16 = 0.4375, so the infant</text><text x="41" y="489" fill="#f6faf5" font-size="21">weighs 9.4375 lb.</text></g></svg>