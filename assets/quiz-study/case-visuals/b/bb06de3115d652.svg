<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A 24-year-old client is taken to the OR for an emergency appendectomy. The nurse reviews the anesthesia plan. Which combination of agents places this client at the highest risk for malignant hyperthermia?</title><desc>MALIGNANT HYPERTHERMIA IS TRIGGERED BY INHALED VOLATILE ANESTHETICS PLUS SUCCINYLCHOLINE. Sevoflurane is a volatile gas and succinylcholine is the classic depolarizing blocker, so that pair is the highest risk. Propofol, fentanyl, midazolam, and local or spinal anesthetics are non-triggering. MH is GENETIC, so always ask about family history of anesthesia problems before surgery.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Malignant Hyperthermia</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 24-year-old client is taken to the OR</text><text x="41" y="198" fill="#f6faf5" font-size="21">for an emergency appendectomy. The nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">reviews the anesthesia plan. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">combination of agents places this client</text><text x="41" y="279" fill="#f6faf5" font-size="21">at the highest risk for malignant</text><text x="41" y="306" fill="#f6faf5" font-size="21">hyperthermia?</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">Sevoflurane and succinylcholine</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">MALIGNANT HYPERTHERMIA IS TRIGGERED BY</text><text x="41" y="543" fill="#f6faf5" font-size="21">INHALED VOLATILE ANESTHETICS PLUS</text><text x="41" y="570" fill="#f6faf5" font-size="21">SUCCINYLCHOLINE.</text></g></svg>