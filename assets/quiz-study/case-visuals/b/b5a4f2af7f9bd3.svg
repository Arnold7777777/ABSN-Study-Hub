<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A client says a medication gives them a headache, and their chart lists a penicillin allergy causing throat swelling. How should the nurse record these?</title><desc>A side effect is an unwanted but expected response; an allergy is an immune reaction. Recording a headache as an allergy can cost the client a drug they could safely have, and blurring the two can cost them their life if a real allergy is not taken seriously.</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Allergic, Inflammatory &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Immunologic Disorders</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client says a medication gives them a</text><text x="41" y="231" fill="#f6faf5" font-size="21">headache, and their chart lists a</text><text x="41" y="258" fill="#f6faf5" font-size="21">penicillin allergy causing throat</text><text x="41" y="285" fill="#f6faf5" font-size="21">swelling. How should the nurse record</text><text x="41" y="312" fill="#f6faf5" font-size="21">these?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">The headache as a side effect and the</text><text x="41" y="444" fill="#f6faf5" font-size="21">throat swelling as an allergy</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">A side effect is an unwanted but expected</text><text x="41" y="576" fill="#f6faf5" font-size="21">response; an allergy is an immune</text><text x="41" y="603" fill="#f6faf5" font-size="21">reaction. Recording a headache as an</text><text x="41" y="630" fill="#f6faf5" font-size="21">allergy can cost the client a drug they</text><text x="41" y="657" fill="#f6faf5" font-size="21">could safely have, and blurring the two</text><text x="41" y="684" fill="#f6faf5" font-size="21">can cost them their life if a real allergy</text><text x="41" y="711" fill="#f6faf5" font-size="21">is not taken seriously.</text></g></svg>