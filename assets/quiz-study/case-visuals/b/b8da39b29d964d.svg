<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which findings should the nurse assess for in a client who has an aortic aneurysm?</title><desc>An aneurysm is a weakened, stretched section of the aortic wall , and the findings come from what it presses on: hoarseness, difficulty swallowing, breathlessness , plus back, flank or abdominal pain and a pulsating mass with a bruit . Do not palpate deeply. Sudden tearing pain with hypotension means rupture.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which findings should the nurse assess for</text><text x="41" y="198" fill="#f6faf5" font-size="21">in a client who has an aortic aneurysm?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Pain, hoarseness, difficulty swallowing</text><text x="41" y="330" fill="#f6faf5" font-size="21">and a pulsating mass</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">An aneurysm is a weakened, stretched</text><text x="41" y="462" fill="#f6faf5" font-size="21">section of the aortic wall , and the</text><text x="41" y="489" fill="#f6faf5" font-size="21">findings come from what it presses on:</text><text x="41" y="516" fill="#f6faf5" font-size="21">hoarseness, difficulty swallowing,</text><text x="41" y="543" fill="#f6faf5" font-size="21">breathlessness , plus back, flank or</text><text x="41" y="570" fill="#f6faf5" font-size="21">abdominal pain and a pulsating mass with a</text><text x="41" y="597" fill="#f6faf5" font-size="21">bruit .</text></g></svg>