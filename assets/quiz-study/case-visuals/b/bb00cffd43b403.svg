<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client who had a knee replacement has physical therapy scheduled at 1000 and has a PRN oral opioid available every 4 hours, last given at 0600. Which action by the nurse is best?</title><desc>It takes less medication to prevent pain than to chase it, so dosing before a predictably painful activity allows the client to participate and improves the outcome of therapy. Waiting for the client to hurt during therapy means the peak effect arrives after the session is over.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Preemptive Analgesia</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who had a knee replacement has</text><text x="41" y="198" fill="#f6faf5" font-size="21">physical therapy scheduled at 1000 and has</text><text x="41" y="225" fill="#f6faf5" font-size="21">a PRN oral opioid available every 4 hours,</text><text x="41" y="252" fill="#f6faf5" font-size="21">last given at 0600. Which action by the</text><text x="41" y="279" fill="#f6faf5" font-size="21">nurse is best?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Give the dose about 30 to 45 minutes</text><text x="41" y="411" fill="#f6faf5" font-size="21">before the session</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">It takes less medication to prevent pain</text><text x="41" y="543" fill="#f6faf5" font-size="21">than to chase it, so dosing before a</text><text x="41" y="570" fill="#f6faf5" font-size="21">predictably painful activity allows the</text><text x="41" y="597" fill="#f6faf5" font-size="21">client to participate and improves the</text><text x="41" y="624" fill="#f6faf5" font-size="21">outcome of therapy. Waiting for the client</text><text x="41" y="651" fill="#f6faf5" font-size="21">to hurt during therapy means the peak</text><text x="41" y="678" fill="#f6faf5" font-size="21">effect arrives after the session is over.</text></g></svg>