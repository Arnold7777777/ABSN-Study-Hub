<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A nurse is preparing to obtain a blood specimen by femoral venipuncture from a toddler. In which position should the nurse place the child?</title><desc>Femoral venipuncture needs the groin exposed, so the child lies supine with the legs frog-legged — thighs abducted, knees out to the side, hips rotated outward. That widens the femoral vein at the inguinal crease and moves the artery off it. The other three are real positions for other procedures: side-lying knees-to-chest and flexed sitting are both lumbar puncture, and semi-recumbent is gavage or tube feeding.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to obtain a blood</text><text x="41" y="198" fill="#f6faf5" font-size="21">specimen by femoral venipuncture from a</text><text x="41" y="225" fill="#f6faf5" font-size="21">toddler. In which position should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse place the child?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Supine with the legs in a frog position</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Femoral venipuncture needs the groin</text><text x="41" y="489" fill="#f6faf5" font-size="21">exposed, so the child lies supine with the</text><text x="41" y="516" fill="#f6faf5" font-size="21">legs frog-legged — thighs abducted, knees</text><text x="41" y="543" fill="#f6faf5" font-size="21">out to the side, hips rotated outward.</text></g></svg>