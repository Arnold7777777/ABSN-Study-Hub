<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is planning a health promotion program for a high school. Which topic should the nurse prioritize based on the leading cause of death in this age group?</title><desc>UNINTENTIONAL INJURY, PRIMARILY MOTOR VEHICLE CRASHES, IS THE LEADING CAUSE OF DEATH IN ADOLESCENTS, so motor vehicle safety is the priority topic. Risk-taking behavior, peer influence, and a sense of invincibility make this age group especially vulnerable. Sun protection, calcium, and diabetes prevention are all valuable but do not address the leading cause of mortality for adolescents.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Adolescent Safety</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is planning a health promotion</text><text x="41" y="198" fill="#f6faf5" font-size="21">program for a high school. Which topic</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse prioritize based on the</text><text x="41" y="252" fill="#f6faf5" font-size="21">leading cause of death in this age group?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Motor vehicle safety, including seat belt</text><text x="41" y="384" fill="#f6faf5" font-size="21">use and not driving under the influence</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">UNINTENTIONAL INJURY, PRIMARILY MOTOR</text><text x="41" y="516" fill="#f6faf5" font-size="21">VEHICLE CRASHES, IS THE LEADING CAUSE OF</text><text x="41" y="543" fill="#f6faf5" font-size="21">DEATH IN ADOLESCENTS, so motor vehicle</text><text x="41" y="570" fill="#f6faf5" font-size="21">safety is the priority topic.</text></g></svg>