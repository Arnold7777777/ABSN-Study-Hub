<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is told during change of shift report that a client is stuporous. When assessing the client, which of the following findings should the nurse expect?</title><desc>A stuporous client requires vigorous or painful stimuli to elicit a response. GCS less than 7 and decorticate rigidity occur with comatose clients.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is told during change of shift</text><text x="41" y="198" fill="#f6faf5" font-size="21">report that a client is stuporous. When</text><text x="41" y="225" fill="#f6faf5" font-size="21">assessing the client, which of the</text><text x="41" y="252" fill="#f6faf5" font-size="21">following findings should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">expect?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">The client arouses briefly in response to</text><text x="41" y="411" fill="#f6faf5" font-size="21">a sternal rub.</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A stuporous client requires vigorous or</text><text x="41" y="543" fill="#f6faf5" font-size="21">painful stimuli to elicit a response. GCS</text><text x="41" y="570" fill="#f6faf5" font-size="21">less than 7 and decorticate rigidity occur</text><text x="41" y="597" fill="#f6faf5" font-size="21">with comatose clients.</text></g></svg>