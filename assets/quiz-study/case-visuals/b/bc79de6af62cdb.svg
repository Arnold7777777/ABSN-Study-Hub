<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>A client at 28 weeks of gestation asks the nurse why her provider said her blood count was low but did not start an iron supplement. Which explanation by the nurse is most accurate?</title><desc>Cardiac output rises 25-50% and plasma volume rises 40-50%, so hemoglobin looks lower from dilution - the physiologic anemia of pregnancy. Calling it iron deficiency is the trap: it is a dilutional change, not a deficiency, and should not be treated as one without labs.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 28 weeks of gestation asks the</text><text x="41" y="231" fill="#f6faf5" font-size="21">nurse why her provider said her blood</text><text x="41" y="258" fill="#f6faf5" font-size="21">count was low but did not start an iron</text><text x="41" y="285" fill="#f6faf5" font-size="21">supplement. Which explanation by the nurse</text><text x="41" y="312" fill="#f6faf5" font-size="21">is most accurate?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Your plasma volume rises 40 to 50 percent,</text><text x="41" y="444" fill="#f6faf5" font-size="21">so your blood is more dilute, not</text><text x="41" y="471" fill="#f6faf5" font-size="21">deficient.</text><path d="M319 495v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="511" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 524) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="545" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="576" fill="#f6faf5" font-size="21">Cardiac output rises 25-50% and plasma</text><text x="41" y="603" fill="#f6faf5" font-size="21">volume rises 40-50%, so hemoglobin looks</text><text x="41" y="630" fill="#f6faf5" font-size="21">lower from dilution - the physiologic</text><text x="41" y="657" fill="#f6faf5" font-size="21">anemia of pregnancy. Calling it iron</text><text x="41" y="684" fill="#f6faf5" font-size="21">deficiency is the trap: it is a dilutional</text><text x="41" y="711" fill="#f6faf5" font-size="21">change, not a deficiency, and should not</text><text x="41" y="738" fill="#f6faf5" font-size="21">be treated as one without labs.</text></g></svg>