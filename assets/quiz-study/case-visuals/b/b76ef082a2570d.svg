<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="647" viewBox="0 0 640 647"><title>The intraoperative phase typically begins with the {0}, which verifies the right client, the right operation and the right {1}. Throughout the case the {2} advocates for the client.</title><desc>The time out is the pause that kicks off the intraoperative phase, and everyone stops to confirm right operation, right patient, right location before an incision is made. The scrub nurse is the tempting answer for the advocate role, but the scrub person is inside the sterile field managing instruments while the circulating nurse is free to watch out for the client.</desc><rect width="640" height="647" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Surgical time out</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The intraoperative phase typically begins</text><text x="41" y="198" fill="#f6faf5" font-size="21">with the {0}, which verifies the right</text><text x="41" y="225" fill="#f6faf5" font-size="21">client, the right operation and the right</text><text x="41" y="252" fill="#f6faf5" font-size="21">{1}. Throughout the case the {2} advocates</text><text x="41" y="279" fill="#f6faf5" font-size="21">for the client.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="303" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="384" fill="#f6faf5" font-size="21">The time out is the pause that kicks off</text><text x="41" y="411" fill="#f6faf5" font-size="21">the intraoperative phase, and everyone</text><text x="41" y="438" fill="#f6faf5" font-size="21">stops to confirm right operation, right</text><text x="41" y="465" fill="#f6faf5" font-size="21">patient, right location before an incision</text><text x="41" y="492" fill="#f6faf5" font-size="21">is made. The scrub nurse is the tempting</text><text x="41" y="519" fill="#f6faf5" font-size="21">answer for the advocate role, but the</text><text x="41" y="546" fill="#f6faf5" font-size="21">scrub person is inside the sterile field</text><text x="41" y="573" fill="#f6faf5" font-size="21">managing instruments while the circulating</text><text x="41" y="600" fill="#f6faf5" font-size="21">nurse is free to watch out for the client.</text></g></svg>