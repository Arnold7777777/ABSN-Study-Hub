<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A newborn weighs 3.4 kg. The provider prescribes a medication 15 mg/kg/dose q6h. How many milligrams will the nurse give per dose?</title><desc>Per dose means weight times the per-dose amount: 3.4 kg x 15 mg/kg/dose = 51 mg . The &quot;q6h&quot; is a distractor when the question asks per dose; it would only be used to find the 24-hour total of 204 mg.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Newborn Feeding</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A newborn weighs 3.4 kg. The provider</text><text x="41" y="198" fill="#f6faf5" font-size="21">prescribes a medication 15 mg/kg/dose q6h.</text><text x="41" y="225" fill="#f6faf5" font-size="21">How many milligrams will the nurse give</text><text x="41" y="252" fill="#f6faf5" font-size="21">per dose?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">51 mg</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Per dose means weight times the per-dose</text><text x="41" y="489" fill="#f6faf5" font-size="21">amount: 3.4 kg x 15 mg/kg/dose = 51 mg .</text><text x="41" y="516" fill="#f6faf5" font-size="21">The &quot;q6h&quot; is a distractor when the</text><text x="41" y="543" fill="#f6faf5" font-size="21">question asks per dose; it would only be</text><text x="41" y="570" fill="#f6faf5" font-size="21">used to find the 24-hour total of 204 mg.</text></g></svg>