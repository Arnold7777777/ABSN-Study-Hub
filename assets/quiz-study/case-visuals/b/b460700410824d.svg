<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>After a client&#x27;s death, family members ask to wash the body themselves and request that only women be present. Which action should the nurse take?</title><desc>Death rituals vary widely among cultures and faiths, and accommodating them supports grieving and shows respect. Finishing the care first seems efficient but takes away the very ritual the family asked to perform.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Cultural Practices</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">After a client&#x27;s death, family members ask</text><text x="41" y="198" fill="#f6faf5" font-size="21">to wash the body themselves and request</text><text x="41" y="225" fill="#f6faf5" font-size="21">that only women be present. Which action</text><text x="41" y="252" fill="#f6faf5" font-size="21">should the nurse take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Arrange privacy and time for the family to</text><text x="41" y="384" fill="#f6faf5" font-size="21">perform the ritual with female staff</text><text x="41" y="411" fill="#f6faf5" font-size="21">assisting as needed</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Death rituals vary widely among cultures</text><text x="41" y="543" fill="#f6faf5" font-size="21">and faiths, and accommodating them</text><text x="41" y="570" fill="#f6faf5" font-size="21">supports grieving and shows respect.</text><text x="41" y="597" fill="#f6faf5" font-size="21">Finishing the care first seems efficient</text><text x="41" y="624" fill="#f6faf5" font-size="21">but takes away the very ritual the family</text><text x="41" y="651" fill="#f6faf5" font-size="21">asked to perform.</text></g></svg>