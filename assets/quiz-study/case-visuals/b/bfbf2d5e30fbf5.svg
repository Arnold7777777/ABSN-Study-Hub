<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is planning care for a hospitalized older adult who is at high risk for falls. Which outcomes should the nurse include in the plan of care?</title><desc>Remaining free of falls is the overall outcome, and calling for help and wearing nonskid footwear are specific client behaviors that can be observed and reinforced . Restraints are a last resort that increase injury, agitation, and deconditioning and are never written as a goal. Keeping the bed low is correct practice but describes the nurse&#x27;s action rather than a client outcome.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Fall Prevention Planning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is planning care for a</text><text x="41" y="198" fill="#f6faf5" font-size="21">hospitalized older adult who is at high</text><text x="41" y="225" fill="#f6faf5" font-size="21">risk for falls. Which outcomes should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse include in the plan of care?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">The client will remain free of falls</text><text x="41" y="384" fill="#f6faf5" font-size="21">throughout the hospitalization · The</text><text x="41" y="411" fill="#f6faf5" font-size="21">client will call for assistance before</text><text x="41" y="438" fill="#f6faf5" font-size="21">getting out of bed · The client will wear</text><text x="41" y="465" fill="#f6faf5" font-size="21">nonskid footwear whenever out of…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Remaining free of falls is the overall</text><text x="41" y="597" fill="#f6faf5" font-size="21">outcome, and calling for help and wearing</text><text x="41" y="624" fill="#f6faf5" font-size="21">nonskid footwear are specific client</text><text x="41" y="651" fill="#f6faf5" font-size="21">behaviors that can be observed and</text><text x="41" y="678" fill="#f6faf5" font-size="21">reinforced .</text></g></svg>