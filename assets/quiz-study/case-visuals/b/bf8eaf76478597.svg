<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client is prescribed two different ophthalmic medications to be instilled at the same time each morning. What should the nurse teach?</title><desc>Different eye medications are separated by 5 to 10 minutes so the second does not simply wash the first out. Drops are never mixed, and never given on alternate days without a prescriber changing the order.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Disorders - Eye &amp; Ear</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is prescribed two different</text><text x="41" y="198" fill="#f6faf5" font-size="21">ophthalmic medications to be instilled at</text><text x="41" y="225" fill="#f6faf5" font-size="21">the same time each morning. What should</text><text x="41" y="252" fill="#f6faf5" font-size="21">the nurse teach?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Wait 5 to 10 minutes between the two</text><text x="41" y="384" fill="#f6faf5" font-size="21">medications</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Different eye medications are separated by</text><text x="41" y="516" fill="#f6faf5" font-size="21">5 to 10 minutes so the second does not</text><text x="41" y="543" fill="#f6faf5" font-size="21">simply wash the first out. Drops are never</text><text x="41" y="570" fill="#f6faf5" font-size="21">mixed, and never given on alternate days</text><text x="41" y="597" fill="#f6faf5" font-size="21">without a prescriber changing the order.</text></g></svg>