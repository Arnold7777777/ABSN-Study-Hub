<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A primigravida at 38 weeks says, &quot;I can finally breathe more easily, but now I am urinating all the time.&quot; What does the nurse explain?</title><desc>Lightening is the fetal head settling into the pelvis, about 2 weeks before term in a first pregnancy (often not until labor in later ones). Pressure lifts off the diaphragm, so breathing eases, but it returns to the bladder, so frequency comes back.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A primigravida at 38 weeks says, &quot;I can</text><text x="41" y="231" fill="#f6faf5" font-size="21">finally breathe more easily, but now I am</text><text x="41" y="258" fill="#f6faf5" font-size="21">urinating all the time.&quot; What does the</text><text x="41" y="285" fill="#f6faf5" font-size="21">nurse explain?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">The baby has dropped into the pelvis</text><text x="41" y="417" fill="#f6faf5" font-size="21">(lightening)</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Lightening is the fetal head settling into</text><text x="41" y="549" fill="#f6faf5" font-size="21">the pelvis, about 2 weeks before term in a</text><text x="41" y="576" fill="#f6faf5" font-size="21">first pregnancy (often not until labor in</text><text x="41" y="603" fill="#f6faf5" font-size="21">later ones). Pressure lifts off the</text><text x="41" y="630" fill="#f6faf5" font-size="21">diaphragm, so breathing eases, but it</text><text x="41" y="657" fill="#f6faf5" font-size="21">returns to the bladder, so frequency comes</text><text x="41" y="684" fill="#f6faf5" font-size="21">back.</text></g></svg>