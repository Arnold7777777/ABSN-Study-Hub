<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>A client with Sjögren&#x27;s syndrome reports dry eyes and dry mouth. Which measures should the nurse teach? Select all that apply.</title><desc>Artificial tears, frequent sips, sugar-free stimulants, dental follow-up and humidified air all help. Alcohol-based mouthwash dries the mouth further . Saliva protects teeth, so without it dental caries accelerate — which is why the dentist matters here.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Allergic, Inflammatory &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Immunologic Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client with Sjögren&#x27;s syndrome reports</text><text x="41" y="231" fill="#f6faf5" font-size="21">dry eyes and dry mouth. Which measures</text><text x="41" y="258" fill="#f6faf5" font-size="21">should the nurse teach? Select all that</text><text x="41" y="285" fill="#f6faf5" font-size="21">apply.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Use preservative-free artificial tears</text><text x="41" y="417" fill="#f6faf5" font-size="21">regularly · Sip water frequently and use</text><text x="41" y="444" fill="#f6faf5" font-size="21">sugar-free gum or lozenges · Have regular</text><text x="41" y="471" fill="#f6faf5" font-size="21">dental checks · Use a humidifier at night</text><path d="M319 495v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="511" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 524) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="545" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="576" fill="#f6faf5" font-size="21">Artificial tears, frequent sips, sugar-</text><text x="41" y="603" fill="#f6faf5" font-size="21">free stimulants, dental follow-up and</text><text x="41" y="630" fill="#f6faf5" font-size="21">humidified air all help. Alcohol-based</text><text x="41" y="657" fill="#f6faf5" font-size="21">mouthwash dries the mouth further . Saliva</text><text x="41" y="684" fill="#f6faf5" font-size="21">protects teeth, so without it dental</text><text x="41" y="711" fill="#f6faf5" font-size="21">caries accelerate — which is why the</text><text x="41" y="738" fill="#f6faf5" font-size="21">dentist matters here.</text></g></svg>