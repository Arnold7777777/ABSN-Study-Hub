<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>Which statement about the DSM-5 is accurate?</title><desc>The DSM-5 describes mental disorders and their diagnostic criteria, drawn from clinical experience and research, and is used by all mental health clinicians who diagnose — not psychiatrists alone. Nursing diagnoses come from a separate nursing taxonomy.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Response to Illness &amp; Mental-</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Health Assessment</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which statement about the DSM-5 is</text><text x="41" y="231" fill="#f6faf5" font-size="21">accurate?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">It outlines specific diagnostic criteria</text><text x="41" y="363" fill="#f6faf5" font-size="21">based on clinical experience and research</text><text x="41" y="390" fill="#f6faf5" font-size="21">and is used by all clinicians who diagnose</text><text x="41" y="417" fill="#f6faf5" font-size="21">psychiatric disorders</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">The DSM-5 describes mental disorders and</text><text x="41" y="549" fill="#f6faf5" font-size="21">their diagnostic criteria, drawn from</text><text x="41" y="576" fill="#f6faf5" font-size="21">clinical experience and research, and is</text><text x="41" y="603" fill="#f6faf5" font-size="21">used by all mental health clinicians who</text><text x="41" y="630" fill="#f6faf5" font-size="21">diagnose — not psychiatrists alone.</text><text x="41" y="657" fill="#f6faf5" font-size="21">Nursing diagnoses come from a separate</text><text x="41" y="684" fill="#f6faf5" font-size="21">nursing taxonomy.</text></g></svg>