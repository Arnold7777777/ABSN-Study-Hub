<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="833" viewBox="0 0 640 833"><title>A nurse is reinforcing foot care teaching for a client who has diabetes mellitus with peripheral neuropathy. Which of the following instructions should the nurse include?</title><desc>Neuropathy blunts protective sensation, so water temperature is verified objectively, lotion is applied everywhere EXCEPT BETWEEN THE TOES because trapped moisture causes maceration and fungal infection, NAILS ARE CUT STRAIGHT ACROSS to prevent ingrown nails, and feet are inspected daily. OVER-THE-COUNTER CORN AND CALLUS REMOVERS ARE CONTRAINDICATED because they are chemical caustics that can cause ulceration, and new shoes are broken in gradually, about 1 to 2 hr at a time.</desc><rect width="640" height="833" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Diabetic Foot Care</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is reinforcing foot care teaching</text><text x="41" y="198" fill="#f6faf5" font-size="21">for a client who has diabetes mellitus</text><text x="41" y="225" fill="#f6faf5" font-size="21">with peripheral neuropathy. Which of the</text><text x="41" y="252" fill="#f6faf5" font-size="21">following instructions should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">include?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Test the water temperature with a</text><text x="41" y="411" fill="#f6faf5" font-size="21">thermometer or with an area that has</text><text x="41" y="438" fill="#f6faf5" font-size="21">intact sensation · Apply lotion to the</text><text x="41" y="465" fill="#f6faf5" font-size="21">tops and bottoms of the feet but not</text><text x="41" y="492" fill="#f6faf5" font-size="21">between the toes · Cut the toenails…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">Neuropathy blunts protective sensation, so</text><text x="41" y="624" fill="#f6faf5" font-size="21">water temperature is verified objectively,</text><text x="41" y="651" fill="#f6faf5" font-size="21">lotion is applied everywhere EXCEPT</text><text x="41" y="678" fill="#f6faf5" font-size="21">BETWEEN THE TOES because trapped moisture</text><text x="41" y="705" fill="#f6faf5" font-size="21">causes maceration and fungal infection,</text><text x="41" y="732" fill="#f6faf5" font-size="21">NAILS ARE CUT STRAIGHT ACROSS to prevent</text><text x="41" y="759" fill="#f6faf5" font-size="21">ingrown nails, and feet are inspected</text><text x="41" y="786" fill="#f6faf5" font-size="21">daily.</text></g></svg>