<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is choosing pain scales for a group of clients. Standardized numeric self-report scales are generally appropriate beginning at about what age?</title><desc>Self-report with a standardized numeric scale is reliable for most clients from about age 7 upward, because that is when children reliably grasp ranking and numbers. Younger children are better served by a picture-based scale, and waiting until age 12 would needlessly deny school-age children the chance to rate their own pain.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Pain Scales</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is choosing pain scales for a</text><text x="41" y="198" fill="#f6faf5" font-size="21">group of clients. Standardized numeric</text><text x="41" y="225" fill="#f6faf5" font-size="21">self-report scales are generally</text><text x="41" y="252" fill="#f6faf5" font-size="21">appropriate beginning at about what age?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">7 years</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Self-report with a standardized numeric</text><text x="41" y="489" fill="#f6faf5" font-size="21">scale is reliable for most clients from</text><text x="41" y="516" fill="#f6faf5" font-size="21">about age 7 upward, because that is when</text><text x="41" y="543" fill="#f6faf5" font-size="21">children reliably grasp ranking and</text><text x="41" y="570" fill="#f6faf5" font-size="21">numbers.</text></g></svg>