<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A client admitted with iron-deficiency anemia is being discharged on oral ferrous sulfate. Which client statements indicate correct understanding of the teaching? Select all that apply.</title><desc>Vitamin C doubles iron absorption, iron is best on an empty stomach (with food only if it upsets the gut), and black tarry stools are expected , not a sign of bleeding — so stopping the drug for that reason is wrong. Liquid iron stains the teeth and must be taken through a straw rather than sipped from a cup.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematologic Disorders</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client admitted with iron-deficiency</text><text x="41" y="198" fill="#f6faf5" font-size="21">anemia is being discharged on oral ferrous</text><text x="41" y="225" fill="#f6faf5" font-size="21">sulfate. Which client statements indicate</text><text x="41" y="252" fill="#f6faf5" font-size="21">correct understanding of the teaching?</text><text x="41" y="279" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">I will take the iron with a glass of</text><text x="41" y="411" fill="#f6faf5" font-size="21">orange juice. · I will take it on an empty</text><text x="41" y="438" fill="#f6faf5" font-size="21">stomach unless it upsets my stomach. · I</text><text x="41" y="465" fill="#f6faf5" font-size="21">should expect my stools to turn black and</text><text x="41" y="492" fill="#f6faf5" font-size="21">tarry.</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">Vitamin C doubles iron absorption, iron is</text><text x="41" y="624" fill="#f6faf5" font-size="21">best on an empty stomach (with food only</text><text x="41" y="651" fill="#f6faf5" font-size="21">if it upsets the gut), and black tarry</text><text x="41" y="678" fill="#f6faf5" font-size="21">stools are expected , not a sign of</text><text x="41" y="705" fill="#f6faf5" font-size="21">bleeding — so stopping the drug for that</text><text x="41" y="732" fill="#f6faf5" font-size="21">reason is wrong.</text></g></svg>