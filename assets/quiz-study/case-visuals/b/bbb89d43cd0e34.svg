<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="458" viewBox="0 0 640 458"><title>2. A competent client refuses a scheduled blood transfusion for religious reasons. The nurse&#x27;s best action is to:</title><desc>c. Autonomy: a competent adult may refuse care. The nurse ensures the refusal is informed, notifies the provider, and documents. Giving it anyway = battery.</desc><rect width="640" height="458" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">2. A competent client refuses a scheduled</text><text x="41" y="198" fill="#f6faf5" font-size="21">blood transfusion for religious reasons.</text><text x="41" y="225" fill="#f6faf5" font-size="21">The nurse&#x27;s best action is to:</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">c. Autonomy: a competent adult may refuse</text><text x="41" y="357" fill="#f6faf5" font-size="21">care. The nurse ensures the refusal is</text><text x="41" y="384" fill="#f6faf5" font-size="21">informed, notifies the provider, and</text><text x="41" y="411" fill="#f6faf5" font-size="21">documents. Giving it anyway = battery.</text></g></svg>