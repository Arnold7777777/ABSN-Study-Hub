<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>A nurse is teaching a prenatal class about exercises. Which of the following pairings are correct? (Select all that apply.)</title><desc>Each prenatal exercise has its own target. Squatting works the perineum and pelvic floor and opens the pelvic outlet. Kegels strengthen the pelvic floor for continence now and recovery afterwards. The pelvic tilt (angry cat) eases the low backache caused by the shifted center of gravity. Tailor sitting stretches the inner thigh and groin for delivery positions. Squatting is not an abdominal exercise, and no prenatal exercise is prescribed for toning or weight loss.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nutrition &amp; Health Promotion in</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is teaching a prenatal class about</text><text x="41" y="231" fill="#f6faf5" font-size="21">exercises. Which of the following pairings</text><text x="41" y="258" fill="#f6faf5" font-size="21">are correct? (Select all that apply.)</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Squatting — stretches and strengthens the</text><text x="41" y="390" fill="#f6faf5" font-size="21">perineal muscles · Kegel exercises —</text><text x="41" y="417" fill="#f6faf5" font-size="21">strengthen the pelvic floor · Pelvic tilt</text><text x="41" y="444" fill="#f6faf5" font-size="21">— relieves low back ache · Tailor sitting</text><text x="41" y="471" fill="#f6faf5" font-size="21">— stretches the inner…</text><path d="M319 495v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="511" width="594" height="87" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 524) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="545" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="576" fill="#f6faf5" font-size="21">Each prenatal exercise has its own target.</text></g></svg>