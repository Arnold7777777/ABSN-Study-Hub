<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>A 34-year-old woman in the clinic has been using budesonide inhaler twice daily for 3 weeks. She reports white patches on her tongue and inner cheeks along with a sore mouth. Which statement by the client indicates the teaching she MISSED?</title><desc>Steroid left in the mouth feeds Candida, which produces the white patches of oral thrush. Rinsing and spitting after every dose prevents it, and a spacer reduces oropharyngeal deposition. Using a spacer, daily dosing, and shaking the canister are all correct technique, not the cause. RINSE THE MOUTH AFTER A STEROID INHALER.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Inhaled Corticosteroid Teaching</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 34-year-old woman in the clinic has been</text><text x="41" y="198" fill="#f6faf5" font-size="21">using budesonide inhaler twice daily for 3</text><text x="41" y="225" fill="#f6faf5" font-size="21">weeks.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">I do not rinse my mouth after I use my</text><text x="41" y="357" fill="#f6faf5" font-size="21">inhaler.</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Steroid left in the mouth feeds Candida,</text><text x="41" y="489" fill="#f6faf5" font-size="21">which produces the white patches of oral</text><text x="41" y="516" fill="#f6faf5" font-size="21">thrush.</text></g></svg>