<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is preparing heparin for a client. Which action is required?</title><desc>Heparin is a high-alert medication and needs an independent double check by a second nurse. It is given subcutaneously or IV, never intramuscularly , because an IM injection into an anticoagulated client bleeds into the muscle. Doses are not rounded.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematologic Disorders</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing heparin for a client.</text><text x="41" y="198" fill="#f6faf5" font-size="21">Which action is required?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Verify the dose independently with a</text><text x="41" y="330" fill="#f6faf5" font-size="21">second nurse</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Heparin is a high-alert medication and</text><text x="41" y="462" fill="#f6faf5" font-size="21">needs an independent double check by a</text><text x="41" y="489" fill="#f6faf5" font-size="21">second nurse. It is given subcutaneously</text><text x="41" y="516" fill="#f6faf5" font-size="21">or IV, never intramuscularly , because an</text><text x="41" y="543" fill="#f6faf5" font-size="21">IM injection into an anticoagulated client</text><text x="41" y="570" fill="#f6faf5" font-size="21">bleeds into the muscle. Doses are not</text><text x="41" y="597" fill="#f6faf5" font-size="21">rounded.</text></g></svg>