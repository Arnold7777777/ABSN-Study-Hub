<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A 4-year-old is admitted with petechiae and bruising that appeared after a viral illness and is diagnosed with ITP. Which nursing actions are appropriate? Select all that apply.</title><desc>ITP follows a viral illness and causes petechiae and bruising, so care is bleeding precautions , no rectal route in a thrombocytopenic child, and reassurance that it is usually self-limiting . Aspirin is tempting as a familiar antipyretic but is contraindicated in peds, and factor VIII replacement belongs to hemophilia, not ITP.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology &amp; Childhood Neoplasms</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 4-year-old is admitted with petechiae</text><text x="41" y="198" fill="#f6faf5" font-size="21">and bruising that appeared after a viral</text><text x="41" y="225" fill="#f6faf5" font-size="21">illness and is diagnosed with ITP. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">nursing actions are appropriate? Select</text><text x="41" y="279" fill="#f6faf5" font-size="21">all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Institute bleeding precautions · Take</text><text x="41" y="411" fill="#f6faf5" font-size="21">temperatures by the axillary route rather</text><text x="41" y="438" fill="#f6faf5" font-size="21">than rectally · Tell the parents the</text><text x="41" y="465" fill="#f6faf5" font-size="21">condition is usually self-limiting</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">ITP follows a viral illness and causes</text><text x="41" y="597" fill="#f6faf5" font-size="21">petechiae and bruising, so care is</text><text x="41" y="624" fill="#f6faf5" font-size="21">bleeding precautions , no rectal route in</text><text x="41" y="651" fill="#f6faf5" font-size="21">a thrombocytopenic child, and reassurance</text><text x="41" y="678" fill="#f6faf5" font-size="21">that it is usually self-limiting .</text></g></svg>