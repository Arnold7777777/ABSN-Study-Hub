<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>Case 9J · An 82-year-old with a chronic indwelling catheter becomes acutely confused with T 101.8°F and HR 108. What does the nurse suspect FIRST?</title><desc>New confusion + fever in a catheterized older adult = CAUTI until proven otherwise; UTIs are a leading cause of sepsis in elders. Obtain a UA/culture and treat.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Case 9J · An 82-year-old with a chronic</text><text x="41" y="198" fill="#f6faf5" font-size="21">indwelling catheter becomes acutely</text><text x="41" y="225" fill="#f6faf5" font-size="21">confused with T 101.8°F and HR 108. What</text><text x="41" y="252" fill="#f6faf5" font-size="21">does the nurse suspect FIRST?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Catheter-associated UTI / urosepsis</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">New confusion + fever in a catheterized</text><text x="41" y="489" fill="#f6faf5" font-size="21">older adult = CAUTI until proven</text><text x="41" y="516" fill="#f6faf5" font-size="21">otherwise; UTIs are a leading cause of</text><text x="41" y="543" fill="#f6faf5" font-size="21">sepsis in elders. Obtain a UA/culture and</text><text x="41" y="570" fill="#f6faf5" font-size="21">treat.</text></g></svg>