<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="458" viewBox="0 0 640 458"><title>179. A client with a newly implanted ICD asks how they&#x27;ll know it&#x27;s working properly. What is the best response?</title><desc>c. Remote monitoring plus scheduled follow-ups is the standard. A shock means a dangerous rhythm was detected (or malfunction)-not a routine &quot;good sign.&quot;</desc><rect width="640" height="458" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">179. A client with a newly implanted ICD</text><text x="41" y="198" fill="#f6faf5" font-size="21">asks how they&#x27;ll know it&#x27;s working</text><text x="41" y="225" fill="#f6faf5" font-size="21">properly. What is the best response?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">c. Remote monitoring plus scheduled</text><text x="41" y="357" fill="#f6faf5" font-size="21">follow-ups is the standard. A shock means</text><text x="41" y="384" fill="#f6faf5" font-size="21">a dangerous rhythm was detected (or</text><text x="41" y="411" fill="#f6faf5" font-size="21">malfunction)-not a routine &quot;good sign.&quot;</text></g></svg>