<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is choosing a site for a pulse oximeter probe on a client who has peripheral vascular disease and cool hands. Which site should the nurse select?</title><desc>When peripheral perfusion is poor, a more central site such as the earlobe, bridge of the nose, or forehead gives a more reliable signal. A toe on an extremity with vascular disease has the least reliable flow of all the choices, and artificial nails block light transmission just as polish does.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Pulse Oximetry</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is choosing a site for a pulse</text><text x="41" y="198" fill="#f6faf5" font-size="21">oximeter probe on a client who has</text><text x="41" y="225" fill="#f6faf5" font-size="21">peripheral vascular disease and cool</text><text x="41" y="252" fill="#f6faf5" font-size="21">hands. Which site should the nurse select?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Earlobe</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">When peripheral perfusion is poor, a more</text><text x="41" y="489" fill="#f6faf5" font-size="21">central site such as the earlobe, bridge</text><text x="41" y="516" fill="#f6faf5" font-size="21">of the nose, or forehead gives a more</text><text x="41" y="543" fill="#f6faf5" font-size="21">reliable signal. A toe on an extremity</text><text x="41" y="570" fill="#f6faf5" font-size="21">with vascular disease has the least</text><text x="41" y="597" fill="#f6faf5" font-size="21">reliable flow of all the choices, and</text><text x="41" y="624" fill="#f6faf5" font-size="21">artificial nails block light transmission</text><text x="41" y="651" fill="#f6faf5" font-size="21">just as polish does.</text></g></svg>