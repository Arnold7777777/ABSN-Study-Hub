<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse has finished teaching a client to use a metered dose inhaler. What should the nurse document?</title><desc>Documentation of teaching must be factual and specific, recording what was taught, how, who received it, and objective evidence of the client&#x27;s understanding. Teaching completed is tempting because it is quick, but it gives the next nurse no information about what still needs reinforcement.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Documentation</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse has finished teaching a client to</text><text x="41" y="198" fill="#f6faf5" font-size="21">use a metered dose inhaler. What should</text><text x="41" y="225" fill="#f6faf5" font-size="21">the nurse document?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The content taught, who was present, the</text><text x="41" y="357" fill="#f6faf5" font-size="21">method, and the client&#x27;s response</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Documentation of teaching must be factual</text><text x="41" y="489" fill="#f6faf5" font-size="21">and specific, recording what was taught,</text><text x="41" y="516" fill="#f6faf5" font-size="21">how, who received it, and objective</text><text x="41" y="543" fill="#f6faf5" font-size="21">evidence of the client&#x27;s understanding.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Teaching completed is tempting because it</text><text x="41" y="597" fill="#f6faf5" font-size="21">is quick, but it gives the next nurse no</text><text x="41" y="624" fill="#f6faf5" font-size="21">information about what still needs</text><text x="41" y="651" fill="#f6faf5" font-size="21">reinforcement.</text></g></svg>