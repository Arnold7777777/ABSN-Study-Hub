<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is assisting with discharge planning for a client who has a severe mental illness and requires supervision. The client&#x27;s partner works all day but is home by late afternoon. Which of the following strategies should the nurse suggest?</title><desc>A partial hospitalization program provides daytime treatment while allowing the client home at night with a responsible family member present. The other options do not provide adequate supervision.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assisting with discharge</text><text x="41" y="198" fill="#f6faf5" font-size="21">planning for a client who has a severe</text><text x="41" y="225" fill="#f6faf5" font-size="21">mental illness and requires supervision.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Attending a partial hospitalization</text><text x="41" y="357" fill="#f6faf5" font-size="21">program.</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">A partial hospitalization program provides</text><text x="41" y="489" fill="#f6faf5" font-size="21">daytime treatment while allowing the</text><text x="41" y="516" fill="#f6faf5" font-size="21">client home at night with a responsible</text><text x="41" y="543" fill="#f6faf5" font-size="21">family member present. The other options</text><text x="41" y="570" fill="#f6faf5" font-size="21">do not provide adequate supervision.</text></g></svg>