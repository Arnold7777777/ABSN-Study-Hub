<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A nurse is precepting a newly licensed nurse about preventing peripheral IV complications on a busy surgical unit. Which of the following actions by the newly licensed nurse indicate an understanding of prevention?</title><desc>PREVENTION = STABILIZE, PUMP, AND ASSESS. Securing the catheter prevents mechanical phlebitis and dislodgement, pumps control high-alert drugs like potassium to prevent speed shock and extravasation, and routine site checks catch problems early. MILKING the tubing forces fluid into tissue and can dislodge a clot or catheter fragment, and a tiny vein over a joint raises infiltration and phlebitis risk; choose an appropriate gauge in a straight, non-flexion vein.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">IV Therapy Complications</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is precepting a newly licensed</text><text x="41" y="198" fill="#f6faf5" font-size="21">nurse about preventing peripheral IV</text><text x="41" y="225" fill="#f6faf5" font-size="21">complications on a busy surgical unit.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Secures the catheter with a stabilization</text><text x="41" y="357" fill="#f6faf5" font-size="21">device so the hub does not move · Uses an</text><text x="41" y="384" fill="#f6faf5" font-size="21">electronic infusion pump for high-alert</text><text x="41" y="411" fill="#f6faf5" font-size="21">medications such as potassium · Assesses</text><text x="41" y="438" fill="#f6faf5" font-size="21">the insertion site at…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="87" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">PREVENTION = STABILIZE, PUMP, AND ASSESS.</text></g></svg>