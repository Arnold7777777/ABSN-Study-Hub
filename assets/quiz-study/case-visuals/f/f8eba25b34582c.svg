<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A client says, &quot;I couldn&#x27;t get out of bed for three days.&quot; Which response by the nurse uses restating?</title><desc>Restating repeats the client&#x27;s main idea in similar words so he knows he was heard and can expand on it. The alarm suggestion is advice, which ends exploration and shifts responsibility to the nurse.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client says, &quot;I couldn&#x27;t get out of bed</text><text x="41" y="231" fill="#f6faf5" font-size="21">for three days.&quot; Which response by the</text><text x="41" y="258" fill="#f6faf5" font-size="21">nurse uses restating?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">You weren&#x27;t able to get out of bed for</text><text x="41" y="390" fill="#f6faf5" font-size="21">three days.</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Restating repeats the client&#x27;s main idea</text><text x="41" y="522" fill="#f6faf5" font-size="21">in similar words so he knows he was heard</text><text x="41" y="549" fill="#f6faf5" font-size="21">and can expand on it. The alarm suggestion</text><text x="41" y="576" fill="#f6faf5" font-size="21">is advice, which ends exploration and</text><text x="41" y="603" fill="#f6faf5" font-size="21">shifts responsibility to the nurse.</text></g></svg>