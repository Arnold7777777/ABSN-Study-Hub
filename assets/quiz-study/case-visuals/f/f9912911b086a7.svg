<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client has a low hemoglobin, a high mean corpuscular volume and reports numbness in both feet. Which deficiency does this suggest?</title><desc>Both B12 and folate deficiency give a macrocytic anemia, but only B12 deficiency causes neurologic signs — numbness, tingling, gait problems — and those can become permanent. That is why the two are distinguished rather than treated as one. Iron deficiency is microcytic.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematologic Disorders</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has a low hemoglobin, a high mean</text><text x="41" y="198" fill="#f6faf5" font-size="21">corpuscular volume and reports numbness in</text><text x="41" y="225" fill="#f6faf5" font-size="21">both feet. Which deficiency does this</text><text x="41" y="252" fill="#f6faf5" font-size="21">suggest?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Vitamin B12 deficiency</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Both B12 and folate deficiency give a</text><text x="41" y="489" fill="#f6faf5" font-size="21">macrocytic anemia, but only B12 deficiency</text><text x="41" y="516" fill="#f6faf5" font-size="21">causes neurologic signs — numbness,</text><text x="41" y="543" fill="#f6faf5" font-size="21">tingling, gait problems — and those can</text><text x="41" y="570" fill="#f6faf5" font-size="21">become permanent. That is why the two are</text><text x="41" y="597" fill="#f6faf5" font-size="21">distinguished rather than treated as one.</text><text x="41" y="624" fill="#f6faf5" font-size="21">Iron deficiency is microcytic.</text></g></svg>