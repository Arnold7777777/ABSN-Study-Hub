<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A nurse is administering single-dose (unit-dose) oral liquid medications to clients on a medical unit. Which of the following actions should the nurse take?</title><desc>Unit-dose packages stay SEALED until the BEDSIDE, after two client identifiers are checked, so the drug stays identifiable and an unused dose can be returned. SHAKE suspensions or the client gets an uneven concentration of drug. PALM THE LABEL so drips do not destroy it. Never use a parenteral or Luer syringe for an oral dose because it can be connected to IV tubing by mistake, and pre-pouring in the med room defeats bedside identification.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Administering Single-Dose Oral</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Liquid Me</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is administering single-dose</text><text x="41" y="231" fill="#f6faf5" font-size="21">(unit-dose) oral liquid medications to</text><text x="41" y="258" fill="#f6faf5" font-size="21">clients on a medical unit. Which of the</text><text x="41" y="285" fill="#f6faf5" font-size="21">following actions should the nurse take?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Open the unit-dose package at the bedside</text><text x="41" y="417" fill="#f6faf5" font-size="21">after identifying the client · Shake a</text><text x="41" y="444" fill="#f6faf5" font-size="21">suspension thoroughly before measuring the</text><text x="41" y="471" fill="#f6faf5" font-size="21">dose · Hold the bottle with the medication</text><text x="41" y="498" fill="#f6faf5" font-size="21">label facing the palm…</text><path d="M319 522v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="538" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 551) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="572" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="603" fill="#f6faf5" font-size="21">Unit-dose packages stay SEALED until the</text><text x="41" y="630" fill="#f6faf5" font-size="21">BEDSIDE, after two client identifiers are</text><text x="41" y="657" fill="#f6faf5" font-size="21">checked, so the drug stays identifiable</text><text x="41" y="684" fill="#f6faf5" font-size="21">and an unused dose can be returned.</text></g></svg>