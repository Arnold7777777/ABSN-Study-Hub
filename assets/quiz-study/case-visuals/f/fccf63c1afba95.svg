<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse delivers a meal tray to a client who has significant vision loss but eats independently. Which action should the nurse take?</title><desc>Describing the tray by clock position gives the client the information needed to eat without help, which protects independence and dignity. Feeding a client who can feed themselves creates unnecessary dependence, and leaving the tray undescribed invites spills and missed food.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Meal Tray Assistance</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse delivers a meal tray to a client</text><text x="41" y="198" fill="#f6faf5" font-size="21">who has significant vision loss but eats</text><text x="41" y="225" fill="#f6faf5" font-size="21">independently. Which action should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Describe the position of each food and</text><text x="41" y="384" fill="#f6faf5" font-size="21">drink using clock positions before leaving</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Describing the tray by clock position</text><text x="41" y="516" fill="#f6faf5" font-size="21">gives the client the information needed to</text><text x="41" y="543" fill="#f6faf5" font-size="21">eat without help, which protects</text><text x="41" y="570" fill="#f6faf5" font-size="21">independence and dignity. Feeding a client</text><text x="41" y="597" fill="#f6faf5" font-size="21">who can feed themselves creates</text><text x="41" y="624" fill="#f6faf5" font-size="21">unnecessary dependence, and leaving the</text><text x="41" y="651" fill="#f6faf5" font-size="21">tray undescribed invites spills and missed</text><text x="41" y="678" fill="#f6faf5" font-size="21">food.</text></g></svg>