<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>Ten minutes into an IV infusion a client reports itching and dizziness. BP is 86/52, HR 118, RR 24. What does the nurse do first?</title><desc>This is type I (IgE-mediated) hypersensitivity, and the first action is to stop the offending infusion before any drug is given. Reaching for diphenhydramine while the antigen keeps running lets the reaction progress to anaphylaxis.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Allergic, Inflammatory &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Immunologic Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Ten minutes into an IV infusion a client</text><text x="41" y="231" fill="#f6faf5" font-size="21">reports itching and dizziness. BP is</text><text x="41" y="258" fill="#f6faf5" font-size="21">86/52, HR 118, RR 24. What does the nurse</text><text x="41" y="285" fill="#f6faf5" font-size="21">do first?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Stop the infusion</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">This is type I (IgE-mediated)</text><text x="41" y="522" fill="#f6faf5" font-size="21">hypersensitivity, and the first action is</text><text x="41" y="549" fill="#f6faf5" font-size="21">to stop the offending infusion before any</text><text x="41" y="576" fill="#f6faf5" font-size="21">drug is given. Reaching for</text><text x="41" y="603" fill="#f6faf5" font-size="21">diphenhydramine while the antigen keeps</text><text x="41" y="630" fill="#f6faf5" font-size="21">running lets the reaction progress to</text><text x="41" y="657" fill="#f6faf5" font-size="21">anaphylaxis.</text></g></svg>