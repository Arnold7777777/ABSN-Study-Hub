<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A chemical spill in the hospital&#x27;s own laboratory forces evacuation of two floors. How should the nurse classify this event?</title><desc>Internal disasters occur within the facility itself, such as a fire, structural failure, or on-site spill. External disasters happen in the community and send victims to the hospital. A mass casualty event is defined by casualties outstripping resources, which is not described here.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Emergency &amp; Triage</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A chemical spill in the hospital&#x27;s own</text><text x="41" y="198" fill="#f6faf5" font-size="21">laboratory forces evacuation of two</text><text x="41" y="225" fill="#f6faf5" font-size="21">floors. How should the nurse classify this</text><text x="41" y="252" fill="#f6faf5" font-size="21">event?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">An internal disaster, since it happened</text><text x="41" y="384" fill="#f6faf5" font-size="21">inside the facility</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Internal disasters occur within the</text><text x="41" y="516" fill="#f6faf5" font-size="21">facility itself, such as a fire,</text><text x="41" y="543" fill="#f6faf5" font-size="21">structural failure, or on-site spill.</text><text x="41" y="570" fill="#f6faf5" font-size="21">External disasters happen in the community</text><text x="41" y="597" fill="#f6faf5" font-size="21">and send victims to the hospital. A mass</text><text x="41" y="624" fill="#f6faf5" font-size="21">casualty event is defined by casualties</text><text x="41" y="651" fill="#f6faf5" font-size="21">outstripping resources, which is not</text><text x="41" y="678" fill="#f6faf5" font-size="21">described here.</text></g></svg>