<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client has been receiving oxygen at 6 L per minute by nasal cannula for 2 days and reports a dry, sore nose. Which complication is this client most at risk for?</title><desc>High-flow cannula oxygen dries the mucosa and the tubing presses on the ears and cheeks, so mucosal drying and device-related pressure injury are the expected problems, and humidification plus padding prevent them. Oxygen toxicity is the tempting choice, but it develops with high concentrations, generally above 50 percent, delivered over a prolonged period rather than with a 6 L cannula.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oxygen Delivery Complications</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has been receiving oxygen at 6 L</text><text x="41" y="198" fill="#f6faf5" font-size="21">per minute by nasal cannula for 2 days and</text><text x="41" y="225" fill="#f6faf5" font-size="21">reports a dry, sore nose. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">complication is this client most at risk</text><text x="41" y="279" fill="#f6faf5" font-size="21">for?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Breakdown of the nasal mucosa and skin</text><text x="41" y="411" fill="#f6faf5" font-size="21">over the ears</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">High-flow cannula oxygen dries the mucosa</text><text x="41" y="543" fill="#f6faf5" font-size="21">and the tubing presses on the ears and</text><text x="41" y="570" fill="#f6faf5" font-size="21">cheeks, so mucosal drying and device-</text><text x="41" y="597" fill="#f6faf5" font-size="21">related pressure injury are the expected</text><text x="41" y="624" fill="#f6faf5" font-size="21">problems, and humidification plus padding</text><text x="41" y="651" fill="#f6faf5" font-size="21">prevent them.</text></g></svg>