<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>The nurse is caring for a child with a fractured femur in traction. Which action will the nurse complete?</title><desc>Traction works only if the weights hang freely at all times and the ropes stay in the pulley grooves. Nurses and UAP do not remove the weights or change them on their own.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Musculoskeletal</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is caring for a child with a</text><text x="41" y="198" fill="#f6faf5" font-size="21">fractured femur in traction. Which action</text><text x="41" y="225" fill="#f6faf5" font-size="21">will the nurse complete?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Ensure traction weights are hanging</text><text x="41" y="357" fill="#f6faf5" font-size="21">freely, not touching the bed or floor.</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Traction works only if the weights hang</text><text x="41" y="489" fill="#f6faf5" font-size="21">freely at all times and the ropes stay in</text><text x="41" y="516" fill="#f6faf5" font-size="21">the pulley grooves. Nurses and UAP do not</text><text x="41" y="543" fill="#f6faf5" font-size="21">remove the weights or change them on their</text><text x="41" y="570" fill="#f6faf5" font-size="21">own.</text></g></svg>