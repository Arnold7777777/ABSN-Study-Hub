<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client is scheduled for a cerebral angiogram. Which laboratory results does the nurse review before the procedure? Select all that apply.</title><desc>Iodinated contrast can injure the kidneys, so BUN and creatinine are checked; an arterial puncture also requires coagulation studies and a platelet count to judge the bleeding risk when the sheath is pulled. Amylase and a lipid panel have no bearing on the safety of the procedure.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic Dysfunction &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Cerebrovascular Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client is scheduled for a cerebral</text><text x="41" y="231" fill="#f6faf5" font-size="21">angiogram. Which laboratory results does</text><text x="41" y="258" fill="#f6faf5" font-size="21">the nurse review before the procedure?</text><text x="41" y="285" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">BUN and serum creatinine · PT/INR and aPTT</text><text x="41" y="417" fill="#f6faf5" font-size="21">· Platelet count</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Iodinated contrast can injure the kidneys,</text><text x="41" y="549" fill="#f6faf5" font-size="21">so BUN and creatinine are checked; an</text><text x="41" y="576" fill="#f6faf5" font-size="21">arterial puncture also requires</text><text x="41" y="603" fill="#f6faf5" font-size="21">coagulation studies and a platelet count</text><text x="41" y="630" fill="#f6faf5" font-size="21">to judge the bleeding risk when the sheath</text><text x="41" y="657" fill="#f6faf5" font-size="21">is pulled. Amylase and a lipid panel have</text><text x="41" y="684" fill="#f6faf5" font-size="21">no bearing on the safety of the procedure.</text></g></svg>