<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>A nurse is planning care for a client who is undergoing brachytherapy with a sealed vaginal implant to treat endometrial cancer. Which action should the nurse include in the plan of care?</title><desc>A lead apron is part of time, distance and shielding while the source is in. With a sealed implant the radiation stays inside the source, so urine and feces are not radioactive and need no special handling. Linens stay in the room only while the implant is in; once it is removed they are ordinary linens, and a lead container is for a dislodged source, picked up with tongs. Visitors are limited to 30 minutes a day, at least 6 feet away, with no pregnant visitors or children.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oncologic Disorders &amp; End-of-Life</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Care</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is planning care for a client who</text><text x="41" y="231" fill="#f6faf5" font-size="21">is undergoing brachytherapy with a sealed</text><text x="41" y="258" fill="#f6faf5" font-size="21">vaginal implant to treat endometrial</text><text x="41" y="285" fill="#f6faf5" font-size="21">cancer. Which action should the nurse</text><text x="41" y="312" fill="#f6faf5" font-size="21">include in the plan of care?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Wear a lead apron while providing care to</text><text x="41" y="444" fill="#f6faf5" font-size="21">the client</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">A lead apron is part of time, distance and</text><text x="41" y="576" fill="#f6faf5" font-size="21">shielding while the source is in.</text></g></svg>