<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="566" viewBox="0 0 640 566"><title>Comparing alcohol and opioid withdrawal:</title><desc>Alcohol withdrawal starts sooner (4 to 12 hours), is more severe, lasts longer, and can kill ; opioid withdrawal starts at 6 to 24 hours , peaks on day 2 to 3, resolves in about a week, and is treated mostly with comfort measures. Never assume an opioid-dependent client is low priority, but the client in alcohol withdrawal is the one who needs the closest watch.</desc><rect width="640" height="566" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Comparing alcohol and opioid withdrawal:</text><path d="M319 195v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="211" width="594" height="330" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 224) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="245" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="276" fill="#f6faf5" font-size="21">Alcohol withdrawal starts sooner (4 to 12</text><text x="41" y="303" fill="#f6faf5" font-size="21">hours), is more severe, lasts longer, and</text><text x="41" y="330" fill="#f6faf5" font-size="21">can kill ; opioid withdrawal starts at 6</text><text x="41" y="357" fill="#f6faf5" font-size="21">to 24 hours , peaks on day 2 to 3,</text><text x="41" y="384" fill="#f6faf5" font-size="21">resolves in about a week, and is treated</text><text x="41" y="411" fill="#f6faf5" font-size="21">mostly with comfort measures. Never assume</text><text x="41" y="438" fill="#f6faf5" font-size="21">an opioid-dependent client is low</text><text x="41" y="465" fill="#f6faf5" font-size="21">priority, but the client in alcohol</text><text x="41" y="492" fill="#f6faf5" font-size="21">withdrawal is the one who needs the</text><text x="41" y="519" fill="#f6faf5" font-size="21">closest watch.</text></g></svg>