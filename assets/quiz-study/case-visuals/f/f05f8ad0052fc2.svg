<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is preparing to obtain an oral temperature on a client who just finished drinking a cup of hot coffee. Which action should the nurse take?</title><desc>HOT OR COLD ORAL INTAKE, SMOKING, AND CHEWING GUM ALTER ORAL TEMPERATURE READINGS, SO THE NURSE MUST WAIT 15 TO 30 MINUTES BEFORE MEASURING. Subtracting an arbitrary amount is not an accepted practice and produces an unreliable value. Switching to the axilla is inaccurate as an automatic substitution because axillary readings run lower and are the least accurate route.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Temperature Measurement</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to obtain an oral</text><text x="41" y="198" fill="#f6faf5" font-size="21">temperature on a client who just finished</text><text x="41" y="225" fill="#f6faf5" font-size="21">drinking a cup of hot coffee. Which action</text><text x="41" y="252" fill="#f6faf5" font-size="21">should the nurse take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Wait 15 to 30 minutes before obtaining the</text><text x="41" y="384" fill="#f6faf5" font-size="21">oral temperature</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">HOT OR COLD ORAL INTAKE, SMOKING, AND</text><text x="41" y="516" fill="#f6faf5" font-size="21">CHEWING GUM ALTER ORAL TEMPERATURE</text><text x="41" y="543" fill="#f6faf5" font-size="21">READINGS, SO THE NURSE MUST WAIT 15 TO 30</text><text x="41" y="570" fill="#f6faf5" font-size="21">MINUTES BEFORE MEASURING.</text></g></svg>