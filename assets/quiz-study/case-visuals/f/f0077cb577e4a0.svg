<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A nurse is planning care for a client in a later stage of Alzheimer disease on a memory-care unit. Which interventions are appropriate? Select all that apply.</title><desc>Clients forget to eat, or forget they have eaten, so supervise meals and weigh weekly to catch loss or gain. A television left on at night overstimulates and escalates agitation, while a simple familiar task such as folding towels redirects it. A tray left alone may go untouched, and arguing about reality increases agitation.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Traumatic, Infectious, Oncologic &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Degenerative Neuro</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is planning care for a client in a</text><text x="41" y="231" fill="#f6faf5" font-size="21">later stage of Alzheimer disease on a</text><text x="41" y="258" fill="#f6faf5" font-size="21">memory-care unit. Which interventions are</text><text x="41" y="285" fill="#f6faf5" font-size="21">appropriate? Select all that apply.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Weigh the client weekly · Stay with the</text><text x="41" y="417" fill="#f6faf5" font-size="21">client and supervise or assist at meals ·</text><text x="41" y="444" fill="#f6faf5" font-size="21">Turn off the television at night · Offer a</text><text x="41" y="471" fill="#f6faf5" font-size="21">simple task such as folding towels when</text><text x="41" y="498" fill="#f6faf5" font-size="21">agitation builds</text><path d="M319 522v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="538" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 551) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="572" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="603" fill="#f6faf5" font-size="21">Clients forget to eat, or forget they have</text><text x="41" y="630" fill="#f6faf5" font-size="21">eaten, so supervise meals and weigh weekly</text><text x="41" y="657" fill="#f6faf5" font-size="21">to catch loss or gain.</text></g></svg>