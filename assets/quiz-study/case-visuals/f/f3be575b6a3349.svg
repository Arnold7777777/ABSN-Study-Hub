<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>104. A client who signed a surgical consent states, just before going to the OR, that they have changed their mind. What should the nurse do?</title><desc>b. A client can withdraw consent at any time, even after signing. Stop and notify the provider — the nurse never pressures the client to continue.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">104. A client who signed a surgical</text><text x="41" y="198" fill="#f6faf5" font-size="21">consent states, just before going to the</text><text x="41" y="225" fill="#f6faf5" font-size="21">OR, that they have changed their mind.</text><text x="41" y="252" fill="#f6faf5" font-size="21">What should the nurse do?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">b. A client can withdraw consent at any</text><text x="41" y="384" fill="#f6faf5" font-size="21">time, even after signing. Stop and notify</text><text x="41" y="411" fill="#f6faf5" font-size="21">the provider — the nurse never pressures</text><text x="41" y="438" fill="#f6faf5" font-size="21">the client to continue.</text></g></svg>