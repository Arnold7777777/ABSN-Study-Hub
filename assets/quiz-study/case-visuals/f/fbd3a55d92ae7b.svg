<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A client receiving external beam radiation asks how to care for the treated skin. Which instruction is correct?</title><desc>Irradiated skin is fragile: gentle washing, patting dry, loose cotton clothing, no heat or ice, no scrubbing , and only lotions the radiation team approves. The field markings stay until the course is finished — they are how the beam is aimed.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oncologic Disorders &amp; End-of-Life</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Care</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client receiving external beam radiation</text><text x="41" y="231" fill="#f6faf5" font-size="21">asks how to care for the treated skin.</text><text x="41" y="258" fill="#f6faf5" font-size="21">Which instruction is correct?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Wash gently with lukewarm water and mild</text><text x="41" y="390" fill="#f6faf5" font-size="21">soap, and pat dry</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Irradiated skin is fragile: gentle</text><text x="41" y="522" fill="#f6faf5" font-size="21">washing, patting dry, loose cotton</text><text x="41" y="549" fill="#f6faf5" font-size="21">clothing, no heat or ice, no scrubbing ,</text><text x="41" y="576" fill="#f6faf5" font-size="21">and only lotions the radiation team</text><text x="41" y="603" fill="#f6faf5" font-size="21">approves. The field markings stay until</text><text x="41" y="630" fill="#f6faf5" font-size="21">the course is finished — they are how the</text><text x="41" y="657" fill="#f6faf5" font-size="21">beam is aimed.</text></g></svg>