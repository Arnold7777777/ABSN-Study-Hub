<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="596" viewBox="0 0 640 596"><title>While assessing a client with fever and headache, the nurse flexes the client&#x27;s neck toward the chest, and the client involuntarily draws up the hips and knees. How does the nurse document this?</title><desc>Brudzinski sign : flexing the neck causes flexion of the hips and knees. Kernig sign is tested with the hip flexed to 90 degrees, and is positive when extending the knee causes pain or resistance. Both point to meningeal irritation; Babinski is a plantar reflex, and posturing is a response to a painful stimulus.</desc><rect width="640" height="596" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Traumatic, Infectious, Oncologic &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Degenerative Neuro</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">While assessing a client with fever and</text><text x="41" y="231" fill="#f6faf5" font-size="21">headache, the nurse flexes the client&#x27;s</text><text x="41" y="258" fill="#f6faf5" font-size="21">neck toward the chest, and the client</text><text x="41" y="285" fill="#f6faf5" font-size="21">involuntarily draws up the hips and knees.</text><text x="41" y="312" fill="#f6faf5" font-size="21">How does the nurse document this?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Positive Brudzinski sign</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Brudzinski sign : flexing the neck causes</text><text x="41" y="549" fill="#f6faf5" font-size="21">flexion of the hips and knees.</text></g></svg>