<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>Which nursing actions prevent newborn heat loss? Select all that apply.</title><desc>Each action blocks one route: drying stops evaporation , a hat and skin-to-skin stop radiation and convection , pre-warming stops conduction . A window is a cold surface that pulls radiant heat away. Newborns cannot shiver, so they burn brown fat instead - which costs glucose and oxygen they cannot spare.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Normal Newborn &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Thermoregulation</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which nursing actions prevent newborn heat</text><text x="41" y="231" fill="#f6faf5" font-size="21">loss? Select all that apply.</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Dry the newborn immediately and remove wet</text><text x="41" y="363" fill="#f6faf5" font-size="21">linens · Place a hat on the head · Place</text><text x="41" y="390" fill="#f6faf5" font-size="21">the newborn skin-to-skin with the mother ·</text><text x="41" y="417" fill="#f6faf5" font-size="21">Pre-warm surfaces before laying the</text><text x="41" y="444" fill="#f6faf5" font-size="21">newborn down</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Each action blocks one route: drying stops</text><text x="41" y="576" fill="#f6faf5" font-size="21">evaporation , a hat and skin-to-skin stop</text><text x="41" y="603" fill="#f6faf5" font-size="21">radiation and convection , pre-warming</text><text x="41" y="630" fill="#f6faf5" font-size="21">stops conduction .</text></g></svg>