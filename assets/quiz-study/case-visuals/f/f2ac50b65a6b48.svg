<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A client is midway through a course of external beam radiation to the chest. Which statement by the client tells the nurse that more teaching is needed?</title><desc>Skin protection is the priority with external beam radiation, so treated skin is patted dry and never rubbed with a towel. The statement about the grandchildren sounds like a dangerous mistake, but it is correct teaching: external beam clients are not radioactive, and only a client with a brachytherapy source in place emits radiation.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oncologic Disorders &amp; End-of-Life</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Care</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client is midway through a course of</text><text x="41" y="231" fill="#f6faf5" font-size="21">external beam radiation to the chest.</text><text x="41" y="258" fill="#f6faf5" font-size="21">Which statement by the client tells the</text><text x="41" y="285" fill="#f6faf5" font-size="21">nurse that more teaching is needed?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">&quot;I dry the treated skin by rubbing it</text><text x="41" y="417" fill="#f6faf5" font-size="21">briskly with a towel.&quot;</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Skin protection is the priority with</text><text x="41" y="549" fill="#f6faf5" font-size="21">external beam radiation, so treated skin</text><text x="41" y="576" fill="#f6faf5" font-size="21">is patted dry and never rubbed with a</text><text x="41" y="603" fill="#f6faf5" font-size="21">towel.</text></g></svg>