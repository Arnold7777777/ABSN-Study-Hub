<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client who has terminal cancer tells the nurse, &#x27;If I can just make it to my daughter&#x27;s wedding in June, I will do whatever the doctors say.&#x27; Which stage of grief does this statement reflect?</title><desc>Bargaining is the attempt to negotiate for more time or a better outcome, often framed as a trade with a provider or a higher power. Denial is the close distractor, but this client clearly accepts the prognosis and is negotiating within it rather than rejecting it.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Kubler-Ross Stages</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who has terminal cancer tells the</text><text x="41" y="198" fill="#f6faf5" font-size="21">nurse, &#x27;If I can just make it to my</text><text x="41" y="225" fill="#f6faf5" font-size="21">daughter&#x27;s wedding in June, I will do</text><text x="41" y="252" fill="#f6faf5" font-size="21">whatever the doctors say.&#x27; Which stage of</text><text x="41" y="279" fill="#f6faf5" font-size="21">grief does this statement reflect?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Bargaining</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Bargaining is the attempt to negotiate for</text><text x="41" y="516" fill="#f6faf5" font-size="21">more time or a better outcome, often</text><text x="41" y="543" fill="#f6faf5" font-size="21">framed as a trade with a provider or a</text><text x="41" y="570" fill="#f6faf5" font-size="21">higher power. Denial is the close</text><text x="41" y="597" fill="#f6faf5" font-size="21">distractor, but this client clearly</text><text x="41" y="624" fill="#f6faf5" font-size="21">accepts the prognosis and is negotiating</text><text x="41" y="651" fill="#f6faf5" font-size="21">within it rather than rejecting it.</text></g></svg>