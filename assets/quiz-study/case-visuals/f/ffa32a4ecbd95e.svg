<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which findings suggest infection of a prosthetic joint? Select all that apply.</title><desc>Fever, redness, and drainage are the three classic signs of a prosthetic joint infection and must be reported immediately. Pain that keeps improving and a clean, dry, approximated incision are exactly what normal healing looks like.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Prosthetic joint infection</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which findings suggest infection of a</text><text x="41" y="198" fill="#f6faf5" font-size="21">prosthetic joint? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Fever and chills · Redness and warmth at</text><text x="41" y="330" fill="#f6faf5" font-size="21">the surgical site · Drainage from the</text><text x="41" y="357" fill="#f6faf5" font-size="21">incision</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Fever, redness, and drainage are the three</text><text x="41" y="489" fill="#f6faf5" font-size="21">classic signs of a prosthetic joint</text><text x="41" y="516" fill="#f6faf5" font-size="21">infection and must be reported</text><text x="41" y="543" fill="#f6faf5" font-size="21">immediately. Pain that keeps improving and</text><text x="41" y="570" fill="#f6faf5" font-size="21">a clean, dry, approximated incision are</text><text x="41" y="597" fill="#f6faf5" font-size="21">exactly what normal healing looks like.</text></g></svg>