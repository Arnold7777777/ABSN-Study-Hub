<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A client has been on strict bed rest in a private room on transmission-based precautions for 10 days. Which interventions should the nurse implement to prevent sensory deprivation? (Select all that apply.)</title><desc>Isolation and immobility are the classic causes of SENSORY DEPRIVATION, and the nurse prevents it by providing MEANINGFUL, ORIENTING STIMULATION: clocks, calendars, familiar objects, visitors, consistent caregivers, and clear day/night cues. Reducing caregiver contact and eliminating television or radio REMOVE stimulation and would worsen deprivation.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Deprivation</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has been on strict bed rest in a</text><text x="41" y="198" fill="#f6faf5" font-size="21">private room on transmission-based</text><text x="41" y="225" fill="#f6faf5" font-size="21">precautions for 10 days. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">interventions should the nurse implement</text><text x="41" y="279" fill="#f6faf5" font-size="21">to prevent sensory deprivation? (Select</text><text x="41" y="306" fill="#f6faf5" font-size="21">all that apply.)</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">Place a clock and a calendar where the</text><text x="41" y="438" fill="#f6faf5" font-size="21">client can see them · Encourage the family</text><text x="41" y="465" fill="#f6faf5" font-size="21">to bring in photographs and familiar</text><text x="41" y="492" fill="#f6faf5" font-size="21">personal objects · Assign consistent</text><text x="41" y="519" fill="#f6faf5" font-size="21">caregivers to the client…</text><path d="M319 543v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="559" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 572) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="593" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="624" fill="#f6faf5" font-size="21">Isolation and immobility are the classic</text><text x="41" y="651" fill="#f6faf5" font-size="21">causes of SENSORY DEPRIVATION, and the</text><text x="41" y="678" fill="#f6faf5" font-size="21">nurse prevents it by providing MEANINGFUL,</text><text x="41" y="705" fill="#f6faf5" font-size="21">ORIENTING STIMULATION: clocks, calendars,</text><text x="41" y="732" fill="#f6faf5" font-size="21">familiar objects, visitors, consistent</text><text x="41" y="759" fill="#f6faf5" font-size="21">caregivers, and clear day/night cues.</text></g></svg>