<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A client is pregnant now. She previously delivered twins at 38 weeks who are both alive and well, and had a miscarriage at 11 weeks. How does the nurse record her parity?</title><desc>Parity counts pregnancies carried to 20 weeks or beyond, not babies , so a twin birth at term is para 1. The miscarriage at 11 weeks did not reach 20 weeks and does not add to parity, though a stillbirth would count.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client is pregnant now. She previously</text><text x="41" y="231" fill="#f6faf5" font-size="21">delivered twins at 38 weeks who are both</text><text x="41" y="258" fill="#f6faf5" font-size="21">alive and well, and had a miscarriage at</text><text x="41" y="285" fill="#f6faf5" font-size="21">11 weeks. How does the nurse record her</text><text x="41" y="312" fill="#f6faf5" font-size="21">parity?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Para 1</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Parity counts pregnancies carried to 20</text><text x="41" y="549" fill="#f6faf5" font-size="21">weeks or beyond, not babies , so a twin</text><text x="41" y="576" fill="#f6faf5" font-size="21">birth at term is para 1. The miscarriage</text><text x="41" y="603" fill="#f6faf5" font-size="21">at 11 weeks did not reach 20 weeks and</text><text x="41" y="630" fill="#f6faf5" font-size="21">does not add to parity, though a</text><text x="41" y="657" fill="#f6faf5" font-size="21">stillbirth would count.</text></g></svg>