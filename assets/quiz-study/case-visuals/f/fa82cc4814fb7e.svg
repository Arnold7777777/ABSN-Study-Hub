<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A 4-year-old with spastic cerebral palsy is admitted for a feeding evaluation. Which statements about this child&#x27;s care are accurate? Select all that apply.</title><desc>Cerebral palsy is a permanent but non-progressive motor disorder, and care centers on nutrition, safe swallowing, mobility and communication, with Botox for focal spasticity and monitoring for the hepatotoxicity risk of baclofen and diazepam. Assuming intellectual disability is the trap — intelligence is often normal in cerebral palsy and must never be presumed impaired.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic &amp; Neuromuscular</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 4-year-old with spastic cerebral palsy</text><text x="41" y="198" fill="#f6faf5" font-size="21">is admitted for a feeding evaluation.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which statements about this child&#x27;s care</text><text x="41" y="252" fill="#f6faf5" font-size="21">are accurate? Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Cerebral palsy is permanent but non-</text><text x="41" y="384" fill="#f6faf5" font-size="21">progressive · Nutrition and safe</text><text x="41" y="411" fill="#f6faf5" font-size="21">swallowing are priorities of care · Botox</text><text x="41" y="438" fill="#f6faf5" font-size="21">may be used for focal spasticity ·</text><text x="41" y="465" fill="#f6faf5" font-size="21">Baclofen and diazepam carry a risk of…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Cerebral palsy is a permanent but non-</text><text x="41" y="597" fill="#f6faf5" font-size="21">progressive motor disorder, and care</text><text x="41" y="624" fill="#f6faf5" font-size="21">centers on nutrition, safe swallowing,</text><text x="41" y="651" fill="#f6faf5" font-size="21">mobility and communication, with Botox for</text><text x="41" y="678" fill="#f6faf5" font-size="21">focal spasticity and monitoring for the</text><text x="41" y="705" fill="#f6faf5" font-size="21">hepatotoxicity risk of baclofen and</text><text x="41" y="732" fill="#f6faf5" font-size="21">diazepam.</text></g></svg>