<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client states, &#x27;I know I can manage my own medications and get myself to my appointments.&#x27; This belief in one&#x27;s own ability to determine outcomes is called:</title><desc>Self-efficacy is the belief in one&#x27;s own ability to influence outcomes, and it is a key protective factor supporting recovery and resilience. Stigma is the opposite kind of belief — that one is flawed and shameful.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Response to Illness &amp; Mental-</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Health Assessment</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client states, &#x27;I know I can manage my</text><text x="41" y="231" fill="#f6faf5" font-size="21">own medications and get myself to my</text><text x="41" y="258" fill="#f6faf5" font-size="21">appointments.&#x27; This belief in one&#x27;s own</text><text x="41" y="285" fill="#f6faf5" font-size="21">ability to determine outcomes is called:</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Self-efficacy</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Self-efficacy is the belief in one&#x27;s own</text><text x="41" y="522" fill="#f6faf5" font-size="21">ability to influence outcomes, and it is a</text><text x="41" y="549" fill="#f6faf5" font-size="21">key protective factor supporting recovery</text><text x="41" y="576" fill="#f6faf5" font-size="21">and resilience. Stigma is the opposite</text><text x="41" y="603" fill="#f6faf5" font-size="21">kind of belief — that one is flawed and</text><text x="41" y="630" fill="#f6faf5" font-size="21">shameful.</text></g></svg>