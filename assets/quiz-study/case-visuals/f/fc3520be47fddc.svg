<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse observes four clients in the dayroom. Which client should the nurse assess first?</title><desc>Clenched fists, jaw tension, refusal to respond, and invading a peer&#x27;s personal space are late prodromal signs of imminent assault ; intervening now prevents injury to the peer and the client. Arguing about privileges is the tempting distractor because it is confrontational, but verbal negotiation is a lower stage of escalation. Loud, intrusive behavior in mania and shouting at a hallucination before self-isolating are both expected and non-assaultive.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Aggression and Violence</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse observes four clients in the</text><text x="41" y="198" fill="#f6faf5" font-size="21">dayroom. Which client should the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">assess first?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A client pacing the hallway with clenched</text><text x="41" y="357" fill="#f6faf5" font-size="21">fists and a rigid jaw who has stopped</text><text x="41" y="384" fill="#f6faf5" font-size="21">answering staff and is now standing over a</text><text x="41" y="411" fill="#f6faf5" font-size="21">seated peer</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Clenched fists, jaw tension, refusal to</text><text x="41" y="543" fill="#f6faf5" font-size="21">respond, and invading a peer&#x27;s personal</text><text x="41" y="570" fill="#f6faf5" font-size="21">space are late prodromal signs of imminent</text><text x="41" y="597" fill="#f6faf5" font-size="21">assault ;</text></g></svg>