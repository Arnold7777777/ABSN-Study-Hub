<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A nurse is teaching a group of nursing students about the acute inflammatory response. Which of the following statements should the nurse include? (Select all that apply.)</title><desc>IN ACUTE INFLAMMATION, CHEMICAL MEDIATORS CAUSE VASODILATION AND INCREASE CAPILLARY PERMEABILITY, PRODUCING THE CLASSIC REDNESS, WARMTH, SWELLING, PAIN, AND LOSS OF FUNCTION, WHILE WBCs MIGRATE TO AND INCREASE AT THE SITE. Local temperature RISES because blood flow increases, so the vasoconstriction option is incorrect. Inflammation is a protective response to any injury, such as a sprain or burn, and does not always mean infection.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Inflammatory Response</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a group of nursing</text><text x="41" y="198" fill="#f6faf5" font-size="21">students about the acute inflammatory</text><text x="41" y="225" fill="#f6faf5" font-size="21">response. Which of the following</text><text x="41" y="252" fill="#f6faf5" font-size="21">statements should the nurse include?</text><text x="41" y="279" fill="#f6faf5" font-size="21">(Select all that apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Vasodilation increases blood flow to the</text><text x="41" y="411" fill="#f6faf5" font-size="21">area, causing redness and warmth ·</text><text x="41" y="438" fill="#f6faf5" font-size="21">Chemical mediators such as histamine</text><text x="41" y="465" fill="#f6faf5" font-size="21">increase capillary permeability · Fluid</text><text x="41" y="492" fill="#f6faf5" font-size="21">shifting into the interstitial…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">IN ACUTE INFLAMMATION, CHEMICAL MEDIATORS</text><text x="41" y="624" fill="#f6faf5" font-size="21">CAUSE VASODILATION AND INCREASE CAPILLARY</text><text x="41" y="651" fill="#f6faf5" font-size="21">PERMEABILITY, PRODUCING THE CLASSIC</text><text x="41" y="678" fill="#f6faf5" font-size="21">REDNESS, WARMTH, SWELLING, PAIN, AND LOSS</text><text x="41" y="705" fill="#f6faf5" font-size="21">OF FUNCTION, WHILE WBCs MIGRATE TO AND</text><text x="41" y="732" fill="#f6faf5" font-size="21">INCREASE AT THE SITE.</text></g></svg>