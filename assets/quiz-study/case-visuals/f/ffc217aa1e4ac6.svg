<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client asks why a spacer was added to the metered-dose inhaler. Which explanation by the nurse is most accurate?</title><desc>A spacer suspends the aerosol so the client can inhale it slowly, improving lung deposition and reducing oropharyngeal drug. It does not change the dose delivered, and while it reduces oral deposition, the client still rinses after inhaled corticosteroids.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Spacer Use</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client asks why a spacer was added to</text><text x="41" y="198" fill="#f6faf5" font-size="21">the metered-dose inhaler. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">explanation by the nurse is most accurate?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">It holds the mist so more medication</text><text x="41" y="357" fill="#f6faf5" font-size="21">reaches the lungs instead of the mouth</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">A spacer suspends the aerosol so the</text><text x="41" y="489" fill="#f6faf5" font-size="21">client can inhale it slowly, improving</text><text x="41" y="516" fill="#f6faf5" font-size="21">lung deposition and reducing oropharyngeal</text><text x="41" y="543" fill="#f6faf5" font-size="21">drug. It does not change the dose</text><text x="41" y="570" fill="#f6faf5" font-size="21">delivered, and while it reduces oral</text><text x="41" y="597" fill="#f6faf5" font-size="21">deposition, the client still rinses after</text><text x="41" y="624" fill="#f6faf5" font-size="21">inhaled corticosteroids.</text></g></svg>