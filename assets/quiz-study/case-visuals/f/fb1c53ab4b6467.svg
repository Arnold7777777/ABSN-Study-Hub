<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A nurse has completed discharge teaching about a new anticoagulant. Which elements should the nurse include in the documentation?</title><desc>Documentation should show what was taught, how, to whom, how learning was verified, and what remains to be done, because unrecorded teaching is legally treated as teaching that never happened. Subjective judgments about motivation are not objective data and do not belong in the record.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Documentation of Teaching</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse has completed discharge teaching</text><text x="41" y="198" fill="#f6faf5" font-size="21">about a new anticoagulant. Which elements</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse include in the</text><text x="41" y="252" fill="#f6faf5" font-size="21">documentation?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">The specific content that was taught · The</text><text x="41" y="384" fill="#f6faf5" font-size="21">teaching method and materials provided ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Who was present during the teaching · How</text><text x="41" y="438" fill="#f6faf5" font-size="21">understanding was evaluated, the client&#x27;s</text><text x="41" y="465" fill="#f6faf5" font-size="21">response, and any…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Documentation should show what was taught,</text><text x="41" y="597" fill="#f6faf5" font-size="21">how, to whom, how learning was verified,</text><text x="41" y="624" fill="#f6faf5" font-size="21">and what remains to be done, because</text><text x="41" y="651" fill="#f6faf5" font-size="21">unrecorded teaching is legally treated as</text><text x="41" y="678" fill="#f6faf5" font-size="21">teaching that never happened. Subjective</text><text x="41" y="705" fill="#f6faf5" font-size="21">judgments about motivation are not</text><text x="41" y="732" fill="#f6faf5" font-size="21">objective data and do not belong in the</text><text x="41" y="759" fill="#f6faf5" font-size="21">record.</text></g></svg>