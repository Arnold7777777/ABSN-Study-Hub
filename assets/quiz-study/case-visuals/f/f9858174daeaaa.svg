<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which actions demonstrate correct walker technique? Select all that apply.</title><desc>Push the walker forward, step in with the weak leg, then bring the strong leg through - the walker stays in front creating the base of support. Never pull the walker back toward the body; that drags the client&#x27;s center of gravity forward over an unsupported base and is a classic fall setup.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Walker technique</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which actions demonstrate correct walker</text><text x="41" y="198" fill="#f6faf5" font-size="21">technique? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Push the walker forward before stepping ·</text><text x="41" y="330" fill="#f6faf5" font-size="21">Step into the walker with the weak leg</text><text x="41" y="357" fill="#f6faf5" font-size="21">first · Bring the strong leg through last</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Push the walker forward, step in with the</text><text x="41" y="489" fill="#f6faf5" font-size="21">weak leg, then bring the strong leg</text><text x="41" y="516" fill="#f6faf5" font-size="21">through - the walker stays in front</text><text x="41" y="543" fill="#f6faf5" font-size="21">creating the base of support. Never pull</text><text x="41" y="570" fill="#f6faf5" font-size="21">the walker back toward the body; that</text><text x="41" y="597" fill="#f6faf5" font-size="21">drags the client&#x27;s center of gravity</text><text x="41" y="624" fill="#f6faf5" font-size="21">forward over an unsupported base and is a</text><text x="41" y="651" fill="#f6faf5" font-size="21">classic fall setup.</text></g></svg>