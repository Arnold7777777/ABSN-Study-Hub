<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client at 30 weeks reports shortness of breath climbing stairs. Which explanation is physiologically correct?</title><desc>The diaphragm is displaced upward by as much as 4 cm , so mild exertional breathlessness late in pregnancy is expected. What is not expected is dyspnea at rest, chest pain, or a sudden change — those get worked up.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 30 weeks reports shortness of</text><text x="41" y="231" fill="#f6faf5" font-size="21">breath climbing stairs. Which explanation</text><text x="41" y="258" fill="#f6faf5" font-size="21">is physiologically correct?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">The enlarging uterus displaces the</text><text x="41" y="390" fill="#f6faf5" font-size="21">diaphragm upward, reducing lung expansion</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">The diaphragm is displaced upward by as</text><text x="41" y="522" fill="#f6faf5" font-size="21">much as 4 cm , so mild exertional</text><text x="41" y="549" fill="#f6faf5" font-size="21">breathlessness late in pregnancy is</text><text x="41" y="576" fill="#f6faf5" font-size="21">expected. What is not expected is dyspnea</text><text x="41" y="603" fill="#f6faf5" font-size="21">at rest, chest pain, or a sudden change —</text><text x="41" y="630" fill="#f6faf5" font-size="21">those get worked up.</text></g></svg>