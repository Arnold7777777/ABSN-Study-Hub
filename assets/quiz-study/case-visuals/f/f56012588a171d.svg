<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="536" viewBox="0 0 640 536"><title>A client prescribed docusate sodium 50 mg PO twice daily refuses it because of nausea. Which action should the nurse take?</title><desc>A client may refuse any medication . Withhold it, document the refusal and the reason, and notify the provider — nausea may need treating, or the drug may need to change. Changing the route or doubling the next dose would be practicing without a prescription. Pressing her to take it overrides her right to refuse.</desc><rect width="640" height="536" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Medication Refusal</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client prescribed docusate sodium 50 mg</text><text x="41" y="198" fill="#f6faf5" font-size="21">PO twice daily refuses it because of</text><text x="41" y="225" fill="#f6faf5" font-size="21">nausea. Which action should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Withhold the medication and notify the</text><text x="41" y="384" fill="#f6faf5" font-size="21">provider</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="87" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A client may refuse any medication .</text></g></svg>