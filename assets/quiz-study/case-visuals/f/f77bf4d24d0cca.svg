<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>At a 15-month well-child visit the routine anemia screening is abnormal. The parent reports the toddler drinks about 40 oz of whole milk a day from a bottle and eats very little table food. Which instruction should the nurse give?</title><desc>Cow&#x27;s milk is capped at 16-24 oz per day precisely because its calcium blocks iron absorption, which is what the excess 40 oz is doing here. Switching to low-fat is doubly wrong: whole milk is kept until age 2, and changing the fat content does nothing about the volume causing the problem.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Toddler &amp; Preschooler</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">At a 15-month well-child visit the routine</text><text x="41" y="198" fill="#f6faf5" font-size="21">anemia screening is abnormal.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Cut cow&#x27;s milk back to 16-24 oz a day,</text><text x="41" y="330" fill="#f6faf5" font-size="21">because the calcium in milk blocks iron</text><text x="41" y="357" fill="#f6faf5" font-size="21">absorption</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Cow&#x27;s milk is capped at 16-24 oz per day</text><text x="41" y="489" fill="#f6faf5" font-size="21">precisely because its calcium blocks iron</text><text x="41" y="516" fill="#f6faf5" font-size="21">absorption, which is what the excess 40 oz</text><text x="41" y="543" fill="#f6faf5" font-size="21">is doing here. Switching to low-fat is</text><text x="41" y="570" fill="#f6faf5" font-size="21">doubly wrong: whole milk is kept until age</text><text x="41" y="597" fill="#f6faf5" font-size="21">2, and changing the fat content does</text><text x="41" y="624" fill="#f6faf5" font-size="21">nothing about the volume causing the</text><text x="41" y="651" fill="#f6faf5" font-size="21">problem.</text></g></svg>