<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is caring for a client in balanced suspension skeletal traction. Which actions should the nurse take? Select all that apply.</title><desc>Weights hang free at all times and are never lifted or removed unless the prescription states traction may be removed. Neurovascular checks, rope and pulley inspection, pin care, and reporting unrelieved spasm pain are all correct.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Skeletal Traction Care</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client in balanced</text><text x="41" y="198" fill="#f6faf5" font-size="21">suspension skeletal traction. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">actions should the nurse take? Select all</text><text x="41" y="252" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Assess neurovascular status every hour for</text><text x="41" y="384" fill="#f6faf5" font-size="21">the first 24 hours · Check the ropes and</text><text x="41" y="411" fill="#f6faf5" font-size="21">pulleys for fraying and knots every 8 to</text><text x="41" y="438" fill="#f6faf5" font-size="21">12 hours · Provide pin site care per</text><text x="41" y="465" fill="#f6faf5" font-size="21">facility protocol · Notify…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Weights hang free at all times and are</text><text x="41" y="597" fill="#f6faf5" font-size="21">never lifted or removed unless the</text><text x="41" y="624" fill="#f6faf5" font-size="21">prescription states traction may be</text><text x="41" y="651" fill="#f6faf5" font-size="21">removed. Neurovascular checks, rope and</text><text x="41" y="678" fill="#f6faf5" font-size="21">pulley inspection, pin care, and reporting</text><text x="41" y="705" fill="#f6faf5" font-size="21">unrelieved spasm pain are all correct.</text></g></svg>