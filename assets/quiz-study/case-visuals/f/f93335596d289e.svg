<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client who has alcohol use disorder states, “I’ve read that problems with substances can have a variety of predisposing factors.” The nurse should identify this statement as which of the following defense mechanisms?</title><desc>Intellectualization — the client uses academic language and theory (“predisposing factors”) to avoid the emotion. The tell is textbook vocabulary with no feeling words. Rationalization gives an excuse ; denial refuses the problem; projection blames someone else .</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who has alcohol use disorder</text><text x="41" y="198" fill="#f6faf5" font-size="21">states, “I’ve read that problems with</text><text x="41" y="225" fill="#f6faf5" font-size="21">substances can have a variety of</text><text x="41" y="252" fill="#f6faf5" font-size="21">predisposing factors.” The nurse should</text><text x="41" y="279" fill="#f6faf5" font-size="21">identify this statement as which of the</text><text x="41" y="306" fill="#f6faf5" font-size="21">following…</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">Intellectualization</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Intellectualization — the client uses</text><text x="41" y="543" fill="#f6faf5" font-size="21">academic language and theory</text><text x="41" y="570" fill="#f6faf5" font-size="21">(“predisposing factors”) to avoid the</text><text x="41" y="597" fill="#f6faf5" font-size="21">emotion. The tell is textbook vocabulary</text><text x="41" y="624" fill="#f6faf5" font-size="21">with no feeling words. Rationalization</text><text x="41" y="651" fill="#f6faf5" font-size="21">gives an excuse ; denial refuses the</text><text x="41" y="678" fill="#f6faf5" font-size="21">problem; projection blames someone else .</text></g></svg>