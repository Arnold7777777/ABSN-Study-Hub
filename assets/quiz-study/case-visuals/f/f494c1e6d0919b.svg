<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>Which condition most directly reduces the blood&#x27;s oxygen-carrying capacity?</title><desc>Oxygen is carried on hemoglobin, so a low hemoglobin directly reduces how much oxygen the blood can transport — an anemic client can be tissue-hypoxic with a normal-looking SpO2, because saturation is a percentage, not a quantity. Dehydration thickens secretions and impairs clearance, but it does not lower hemoglobin.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oxygen Carrying Capacity</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which condition most directly reduces the</text><text x="41" y="198" fill="#f6faf5" font-size="21">blood&#x27;s oxygen-carrying capacity?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Anemia</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">Oxygen is carried on hemoglobin, so a low</text><text x="41" y="435" fill="#f6faf5" font-size="21">hemoglobin directly reduces how much</text><text x="41" y="462" fill="#f6faf5" font-size="21">oxygen the blood can transport — an anemic</text><text x="41" y="489" fill="#f6faf5" font-size="21">client can be tissue-hypoxic with a</text><text x="41" y="516" fill="#f6faf5" font-size="21">normal-looking SpO2, because saturation is</text><text x="41" y="543" fill="#f6faf5" font-size="21">a percentage, not a quantity.</text></g></svg>