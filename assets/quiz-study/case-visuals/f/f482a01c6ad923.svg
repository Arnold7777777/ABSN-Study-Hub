<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client attends all groups, uses the unit&#x27;s services fully, states a goal of returning to work, and alternates between asking for help and managing independently. Which Peplau phase does this indicate?</title><desc>The exploitation or working phase is when the client makes full use of services, goals emerge, and behavior fluctuates between dependence and independence. Resolution is the confusable one, but by then the client has given up dependent behavior and no longer needs the services.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Theories &amp; Treatment Settings</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client attends all groups, uses the</text><text x="41" y="198" fill="#f6faf5" font-size="21">unit&#x27;s services fully, states a goal of</text><text x="41" y="225" fill="#f6faf5" font-size="21">returning to work, and alternates between</text><text x="41" y="252" fill="#f6faf5" font-size="21">asking for help and managing</text><text x="41" y="279" fill="#f6faf5" font-size="21">independently. Which Peplau phase does</text><text x="41" y="306" fill="#f6faf5" font-size="21">this indicate?</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">Exploitation (working) phase</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The exploitation or working phase is when</text><text x="41" y="543" fill="#f6faf5" font-size="21">the client makes full use of services,</text><text x="41" y="570" fill="#f6faf5" font-size="21">goals emerge, and behavior fluctuates</text><text x="41" y="597" fill="#f6faf5" font-size="21">between dependence and independence.</text><text x="41" y="624" fill="#f6faf5" font-size="21">Resolution is the confusable one, but by</text><text x="41" y="651" fill="#f6faf5" font-size="21">then the client has given up dependent</text><text x="41" y="678" fill="#f6faf5" font-size="21">behavior and no longer needs the services.</text></g></svg>