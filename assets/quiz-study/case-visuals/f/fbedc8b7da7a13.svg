<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which are legal or safety requirements for restraint and seclusion? Select all that apply.</title><desc>Restraint requires a provider order, continuous monitoring, prompt release when criteria are met, and use of the least-restrictive option. PRN or standing restraint orders are never permitted.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which are legal or safety requirements for</text><text x="41" y="198" fill="#f6faf5" font-size="21">restraint and seclusion? Select all that</text><text x="41" y="225" fill="#f6faf5" font-size="21">apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A provider order is required (obtained</text><text x="41" y="357" fill="#f6faf5" font-size="21">ASAP if started in an emergency) ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Continuous monitoring of circulation,</text><text x="41" y="411" fill="#f6faf5" font-size="21">vitals, hydration, and toileting · Release</text><text x="41" y="438" fill="#f6faf5" font-size="21">the client as soon as behavioral…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Restraint requires a provider order,</text><text x="41" y="570" fill="#f6faf5" font-size="21">continuous monitoring, prompt release when</text><text x="41" y="597" fill="#f6faf5" font-size="21">criteria are met, and use of the least-</text><text x="41" y="624" fill="#f6faf5" font-size="21">restrictive option. PRN or standing</text><text x="41" y="651" fill="#f6faf5" font-size="21">restraint orders are never permitted.</text></g></svg>