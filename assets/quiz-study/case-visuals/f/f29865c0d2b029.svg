<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>Which statements by a client with obsessive-compulsive disorder indicate more effective coping? Select all that apply.</title><desc>Effective coping means recognizing anxiety and using healthy strategies (exercise, relaxation) while rituals decrease. Defending the rituals or having family perform them (accommodation) keeps the disorder going.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">OCD - evaluating coping</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which statements by a client with</text><text x="41" y="198" fill="#f6faf5" font-size="21">obsessive-compulsive disorder indicate</text><text x="41" y="225" fill="#f6faf5" font-size="21">more effective coping? Select all that</text><text x="41" y="252" fill="#f6faf5" font-size="21">apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;When I feel anxiety building in the</text><text x="41" y="384" fill="#f6faf5" font-size="21">morning, I go to an exercise class.&quot; ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">&quot;This new project makes me anxious, so I&#x27;m</text><text x="41" y="438" fill="#f6faf5" font-size="21">using deep breathing.&quot; · &quot;I used to wash</text><text x="41" y="465" fill="#f6faf5" font-size="21">the door handle ten times;</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Effective coping means recognizing anxiety</text><text x="41" y="597" fill="#f6faf5" font-size="21">and using healthy strategies (exercise,</text><text x="41" y="624" fill="#f6faf5" font-size="21">relaxation) while rituals decrease.</text><text x="41" y="651" fill="#f6faf5" font-size="21">Defending the rituals or having family</text><text x="41" y="678" fill="#f6faf5" font-size="21">perform them (accommodation) keeps the</text><text x="41" y="705" fill="#f6faf5" font-size="21">disorder going.</text></g></svg>