<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is preparing to teach four clients about newly prescribed therapies. Which client demonstrates the greatest readiness to learn?</title><desc>Asking practical questions about the upcoming task signals motivation and engagement, the clearest evidence of readiness. Denial, high anxiety, and sedation all block learning, and anxiety in particular is easy to misread as attentiveness when the client is actually unable to absorb information.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Assessing Readiness</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to teach four clients</text><text x="41" y="198" fill="#f6faf5" font-size="21">about newly prescribed therapies. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">client demonstrates the greatest readiness</text><text x="41" y="252" fill="#f6faf5" font-size="21">to learn?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">A client who asks what supplies will be</text><text x="41" y="384" fill="#f6faf5" font-size="21">needed at home to change the dressing</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Asking practical questions about the</text><text x="41" y="516" fill="#f6faf5" font-size="21">upcoming task signals motivation and</text><text x="41" y="543" fill="#f6faf5" font-size="21">engagement, the clearest evidence of</text><text x="41" y="570" fill="#f6faf5" font-size="21">readiness. Denial, high anxiety, and</text><text x="41" y="597" fill="#f6faf5" font-size="21">sedation all block learning, and anxiety</text><text x="41" y="624" fill="#f6faf5" font-size="21">in particular is easy to misread as</text><text x="41" y="651" fill="#f6faf5" font-size="21">attentiveness when the client is actually</text><text x="41" y="678" fill="#f6faf5" font-size="21">unable to absorb information.</text></g></svg>