<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is caring for a client whose plaster cast was applied 30 minutes ago. Which action is correct?</title><desc>Handle a wet plaster cast with the palms. Fingertips leave indentations, and every indentation becomes a pressure point against skin you cannot see. Let warm dry air circulate rather than covering it, and never rest a wet cast on a hard edge.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Wet Plaster Cast</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client whose</text><text x="41" y="198" fill="#f6faf5" font-size="21">plaster cast was applied 30 minutes ago.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which action is correct?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Support the cast with the palms of the</text><text x="41" y="357" fill="#f6faf5" font-size="21">hands</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Handle a wet plaster cast with the palms.</text><text x="41" y="489" fill="#f6faf5" font-size="21">Fingertips leave indentations, and every</text><text x="41" y="516" fill="#f6faf5" font-size="21">indentation becomes a pressure point</text><text x="41" y="543" fill="#f6faf5" font-size="21">against skin you cannot see. Let warm dry</text><text x="41" y="570" fill="#f6faf5" font-size="21">air circulate rather than covering it, and</text><text x="41" y="597" fill="#f6faf5" font-size="21">never rest a wet cast on a hard edge.</text></g></svg>