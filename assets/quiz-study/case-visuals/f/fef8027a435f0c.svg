<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A nurse is reviewing expected age-related changes with an 80-year-old client. Which cardiovascular change should the nurse expect?</title><desc>With aging, autonomic responsiveness declines, so the heart rate varies less and rises less in response to stress or activity; arteries also stiffen and contractility falls. That is why older adults tolerate dehydration, infection and position changes poorly. Monitor heart rate, BP and the ECG.</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Older adult - cardiovascular</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">changes</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is reviewing expected age-related</text><text x="41" y="231" fill="#f6faf5" font-size="21">changes with an 80-year-old client. Which</text><text x="41" y="258" fill="#f6faf5" font-size="21">cardiovascular change should the nurse</text><text x="41" y="285" fill="#f6faf5" font-size="21">expect?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">A slower, smaller heart-rate response to</text><text x="41" y="417" fill="#f6faf5" font-size="21">stress (reduced heart rate variability)</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">With aging, autonomic responsiveness</text><text x="41" y="549" fill="#f6faf5" font-size="21">declines, so the heart rate varies less</text><text x="41" y="576" fill="#f6faf5" font-size="21">and rises less in response to stress or</text><text x="41" y="603" fill="#f6faf5" font-size="21">activity; arteries also stiffen and</text><text x="41" y="630" fill="#f6faf5" font-size="21">contractility falls. That is why older</text><text x="41" y="657" fill="#f6faf5" font-size="21">adults tolerate dehydration, infection and</text><text x="41" y="684" fill="#f6faf5" font-size="21">position changes poorly. Monitor heart</text><text x="41" y="711" fill="#f6faf5" font-size="21">rate, BP and the ECG.</text></g></svg>