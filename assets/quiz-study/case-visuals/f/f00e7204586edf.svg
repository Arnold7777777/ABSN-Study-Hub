<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>Which findings suggest a systemic lupus erythematosus flare rather than stable disease? Select all that apply.</title><desc>A flare shows as new organ involvement - proteinuria means lupus nephritis, the complication that decides prognosis - plus fever, weight loss, worsening rash and arthritis. Sun exposure is a classic trigger , which is why sunscreen is a daily prescription, not a comfort measure. A normal blood pressure is reassuring, not a flare sign.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Allergic, Inflammatory &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Immunologic Disorders</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which findings suggest a systemic lupus</text><text x="41" y="231" fill="#f6faf5" font-size="21">erythematosus flare rather than stable</text><text x="41" y="258" fill="#f6faf5" font-size="21">disease? Select all that apply.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">New proteinuria · Butterfly rash worsening</text><text x="41" y="390" fill="#f6faf5" font-size="21">after a beach day · Weight loss with fever</text><text x="41" y="417" fill="#f6faf5" font-size="21">· New joint pain and swelling</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">A flare shows as new organ involvement -</text><text x="41" y="549" fill="#f6faf5" font-size="21">proteinuria means lupus nephritis, the</text><text x="41" y="576" fill="#f6faf5" font-size="21">complication that decides prognosis - plus</text><text x="41" y="603" fill="#f6faf5" font-size="21">fever, weight loss, worsening rash and</text><text x="41" y="630" fill="#f6faf5" font-size="21">arthritis.</text></g></svg>