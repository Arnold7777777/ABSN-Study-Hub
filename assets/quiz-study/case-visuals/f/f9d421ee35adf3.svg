<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client has been in protective isolation for two weeks and is now withdrawn, bored, and unsure what day it is. Which action should the nurse take?</title><desc>Orientation cues plus scheduled meaningful contact treat sensory deprivation directly by restoring input the isolation removed. Reducing conversation and daylight seems restful but it deepens the deprivation and worsens the confusion and withdrawal.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Deprivation</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has been in protective isolation</text><text x="41" y="198" fill="#f6faf5" font-size="21">for two weeks and is now withdrawn, bored,</text><text x="41" y="225" fill="#f6faf5" font-size="21">and unsure what day it is. Which action</text><text x="41" y="252" fill="#f6faf5" font-size="21">should the nurse take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Place a clock and calendar in view and</text><text x="41" y="384" fill="#f6faf5" font-size="21">stop in to talk at set times each shift</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Orientation cues plus scheduled meaningful</text><text x="41" y="516" fill="#f6faf5" font-size="21">contact treat sensory deprivation directly</text><text x="41" y="543" fill="#f6faf5" font-size="21">by restoring input the isolation removed.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Reducing conversation and daylight seems</text><text x="41" y="597" fill="#f6faf5" font-size="21">restful but it deepens the deprivation and</text><text x="41" y="624" fill="#f6faf5" font-size="21">worsens the confusion and withdrawal.</text></g></svg>