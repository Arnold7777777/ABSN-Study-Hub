<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="536" viewBox="0 0 640 536"><title>A nurse discovers a fire in a client&#x27;s trash can. Using the RACE acronym, which action should the nurse take FIRST?</title><desc>RACE stands for RESCUE, ALARM, CONFINE, EXTINGUISH, and RESCUING CLIENTS IN IMMEDIATE DANGER ALWAYS COMES FIRST. The alarm is activated second, the fire is confined third, and extinguishing is last and only for small contained fires. PASS (Pull, Aim at the base, Squeeze, Sweep) describes how to operate the extinguisher itself.</desc><rect width="640" height="536" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Fire Safety</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse discovers a fire in a client&#x27;s</text><text x="41" y="198" fill="#f6faf5" font-size="21">trash can. Using the RACE acronym, which</text><text x="41" y="225" fill="#f6faf5" font-size="21">action should the nurse take FIRST?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Rescue and remove the client from the room</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">RACE stands for RESCUE, ALARM, CONFINE,</text><text x="41" y="462" fill="#f6faf5" font-size="21">EXTINGUISH, and RESCUING CLIENTS IN</text><text x="41" y="489" fill="#f6faf5" font-size="21">IMMEDIATE DANGER ALWAYS COMES FIRST.</text></g></svg>