<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client has documented orthostatic hypotension. Which outcome should the nurse include in the plan of care?</title><desc>The outcome pairs the behavior that prevents symptoms with the measurable result , absence of dizziness and falls. Bed rest is the tempting protective answer, but immobility worsens deconditioning and orthostatic intolerance and creates new risks such as thromboembolism and pressure injury.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Orthostatic Hypotension Plan</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has documented orthostatic</text><text x="41" y="198" fill="#f6faf5" font-size="21">hypotension. Which outcome should the</text><text x="41" y="225" fill="#f6faf5" font-size="21">nurse include in the plan of care?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The client will change positions slowly</text><text x="41" y="357" fill="#f6faf5" font-size="21">and remain free of dizziness and falls</text><text x="41" y="384" fill="#f6faf5" font-size="21">throughout the hospitalization</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">The outcome pairs the behavior that</text><text x="41" y="516" fill="#f6faf5" font-size="21">prevents symptoms with the measurable</text><text x="41" y="543" fill="#f6faf5" font-size="21">result , absence of dizziness and falls.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Bed rest is the tempting protective</text><text x="41" y="597" fill="#f6faf5" font-size="21">answer, but immobility worsens</text><text x="41" y="624" fill="#f6faf5" font-size="21">deconditioning and orthostatic intolerance</text><text x="41" y="651" fill="#f6faf5" font-size="21">and creates new risks such as</text><text x="41" y="678" fill="#f6faf5" font-size="21">thromboembolism and pressure injury.</text></g></svg>