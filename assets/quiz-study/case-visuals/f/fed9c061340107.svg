<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is preparing to comb the hair of a client who has tightly curled hair. Which action should the nurse take?</title><desc>A wide-toothed comb or pick moves through tightly curled hair without breaking it, and hair care is strongly tied to culture and identity, so the client&#x27;s own routine guides the plan. A fine-toothed comb pulled through curls snaps hair and hurts, and daily shampooing dries many hair types.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hair Care Preferences</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to comb the hair of a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client who has tightly curled hair. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">action should the nurse take?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Use a wide-toothed comb or pick and ask</text><text x="41" y="357" fill="#f6faf5" font-size="21">the client how they usually care for their</text><text x="41" y="384" fill="#f6faf5" font-size="21">hair</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A wide-toothed comb or pick moves through</text><text x="41" y="516" fill="#f6faf5" font-size="21">tightly curled hair without breaking it,</text><text x="41" y="543" fill="#f6faf5" font-size="21">and hair care is strongly tied to culture</text><text x="41" y="570" fill="#f6faf5" font-size="21">and identity, so the client&#x27;s own routine</text><text x="41" y="597" fill="#f6faf5" font-size="21">guides the plan. A fine-toothed comb</text><text x="41" y="624" fill="#f6faf5" font-size="21">pulled through curls snaps hair and hurts,</text><text x="41" y="651" fill="#f6faf5" font-size="21">and daily shampooing dries many hair</text><text x="41" y="678" fill="#f6faf5" font-size="21">types.</text></g></svg>