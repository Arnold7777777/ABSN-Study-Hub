<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>56. A client returns from PACU after abdominal surgery. SpO2 is 91% on 2 L O2. Which action is priority?</title><desc>b. Position first — semi-Fowler&#x27;s improves lung expansion and is first-line for a low post-op SpO2. Encourage deep breathing/coughing, then reassess before escalating.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">56. A client returns from PACU after</text><text x="41" y="198" fill="#f6faf5" font-size="21">abdominal surgery. SpO2 is 91% on 2 L O2.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which action is priority?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">b. Position first — semi-Fowler&#x27;s improves</text><text x="41" y="357" fill="#f6faf5" font-size="21">lung expansion and is first-line for a low</text><text x="41" y="384" fill="#f6faf5" font-size="21">post-op SpO2. Encourage deep</text><text x="41" y="411" fill="#f6faf5" font-size="21">breathing/coughing, then reassess before</text><text x="41" y="438" fill="#f6faf5" font-size="21">escalating.</text></g></svg>