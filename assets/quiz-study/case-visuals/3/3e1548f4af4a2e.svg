<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>A nurse is to infuse an IV antibiotic in 250 mL of 0.9% sodium chloride over 90 min using an infusion pump. Which rate in mL/hr should the nurse program? (Round to the nearest whole number.)</title><desc>STEP 1, convert minutes to hours: 90 min divided by 60 min/hr = 1.5 hr. STEP 2, FORMULA: volume divided by time = 250 mL divided by 1.5 hr = 166.67, WHICH ROUNDS TO 167 mL/hr. A common wrong answer is 278 mL/hr, which comes from dividing 250 by 0.9 after mistakenly treating 90 min as 0.9 hr. Answering 150 mL/hr comes from setting the rate to the volume infused in the first hour without accounting for the remaining 100 mL.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">IV Rate</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is to infuse an IV antibiotic in</text><text x="41" y="198" fill="#f6faf5" font-size="21">250 mL of 0.9% sodium chloride over 90 min</text><text x="41" y="225" fill="#f6faf5" font-size="21">using an infusion pump. Which rate in</text><text x="41" y="252" fill="#f6faf5" font-size="21">mL/hr should the nurse program? (Round to</text><text x="41" y="279" fill="#f6faf5" font-size="21">the nearest whole number.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">167 mL/hr</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">STEP 1, convert minutes to hours: 90 min</text><text x="41" y="516" fill="#f6faf5" font-size="21">divided by 60 min/hr = 1.5 hr.</text></g></svg>