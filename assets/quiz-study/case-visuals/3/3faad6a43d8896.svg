<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>How should the nurse interpret a tuberculin skin test result of 6 mm of induration in a client who has HIV?</title><desc>The three thresholds, and this is one your notes may have inverted: 5 mm or more is positive in the highest-risk group - HIV or immunosuppression, recent close contact, or fibrotic changes on chest x-ray. 10 mm or more for other increased-risk groups such as recent immigrants, people who inject drugs, healthcare workers and children under 4. 15 mm or more for someone with no risk factors. Read at 48 to 72 hr , and measure the induration, not the redness .</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">How should the nurse interpret a</text><text x="41" y="198" fill="#f6faf5" font-size="21">tuberculin skin test result of 6 mm of</text><text x="41" y="225" fill="#f6faf5" font-size="21">induration in a client who has HIV?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Positive, because 5 mm or more is positive</text><text x="41" y="357" fill="#f6faf5" font-size="21">in an immunocompromised client</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">The three thresholds, and this is one your</text><text x="41" y="489" fill="#f6faf5" font-size="21">notes may have inverted: 5 mm or more is</text><text x="41" y="516" fill="#f6faf5" font-size="21">positive in the highest-risk group - HIV</text><text x="41" y="543" fill="#f6faf5" font-size="21">or immunosuppression, recent close</text><text x="41" y="570" fill="#f6faf5" font-size="21">contact, or fibrotic changes on chest</text><text x="41" y="597" fill="#f6faf5" font-size="21">x-ray.</text></g></svg>