<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client at 30 weeks reports dizziness when lying flat on her back. What is the nurse&#x27;s best action?</title><desc>This is supine hypotensive syndrome : the gravid uterus compresses the inferior vena cava, venous return falls, and cardiac output with it. Turning to the side lifts the uterus off the vena cava and fixes it in seconds. Left is taught by convention, but any lateral tilt works.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 30 weeks reports dizziness</text><text x="41" y="231" fill="#f6faf5" font-size="21">when lying flat on her back. What is the</text><text x="41" y="258" fill="#f6faf5" font-size="21">nurse&#x27;s best action?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Turn the client onto her left side</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">This is supine hypotensive syndrome : the</text><text x="41" y="495" fill="#f6faf5" font-size="21">gravid uterus compresses the inferior vena</text><text x="41" y="522" fill="#f6faf5" font-size="21">cava, venous return falls, and cardiac</text><text x="41" y="549" fill="#f6faf5" font-size="21">output with it. Turning to the side lifts</text><text x="41" y="576" fill="#f6faf5" font-size="21">the uterus off the vena cava and fixes it</text><text x="41" y="603" fill="#f6faf5" font-size="21">in seconds. Left is taught by convention,</text><text x="41" y="630" fill="#f6faf5" font-size="21">but any lateral tilt works.</text></g></svg>