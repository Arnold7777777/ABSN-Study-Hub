<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Why do respiratory infections cause more obstruction in children than in adults?</title><desc>It is a matter of diameter . A child&#x27;s airway lumen is narrow, so a given amount of edema or secretion blocks proportionally far more of it. This one anatomical fact explains why croup, bronchiolitis and epiglottitis are emergencies in children and nuisances in adults.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Respiratory</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Why do respiratory infections cause more</text><text x="41" y="198" fill="#f6faf5" font-size="21">obstruction in children than in adults?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">The lumens of children&#x27;s bronchi are</text><text x="41" y="330" fill="#f6faf5" font-size="21">narrower, so the same swelling obstructs</text><text x="41" y="357" fill="#f6faf5" font-size="21">more airflow</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">It is a matter of diameter . A child&#x27;s</text><text x="41" y="489" fill="#f6faf5" font-size="21">airway lumen is narrow, so a given amount</text><text x="41" y="516" fill="#f6faf5" font-size="21">of edema or secretion blocks</text><text x="41" y="543" fill="#f6faf5" font-size="21">proportionally far more of it. This one</text><text x="41" y="570" fill="#f6faf5" font-size="21">anatomical fact explains why croup,</text><text x="41" y="597" fill="#f6faf5" font-size="21">bronchiolitis and epiglottitis are</text><text x="41" y="624" fill="#f6faf5" font-size="21">emergencies in children and nuisances in</text><text x="41" y="651" fill="#f6faf5" font-size="21">adults.</text></g></svg>