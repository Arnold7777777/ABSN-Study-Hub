<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>Which phase of wound healing occurs first, immediately after tissue injury?</title><desc>Hemostasis is first — vasoconstriction limits bleeding while the clotting cascade builds a fibrin mesh that also blocks pathogens. Inflammation follows with vasodilation so immune cells can enter, which is why students often reverse these two.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Wound Healing Phases</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which phase of wound healing occurs first,</text><text x="41" y="198" fill="#f6faf5" font-size="21">immediately after tissue injury?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Hemostasis</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">Hemostasis is first — vasoconstriction</text><text x="41" y="435" fill="#f6faf5" font-size="21">limits bleeding while the clotting cascade</text><text x="41" y="462" fill="#f6faf5" font-size="21">builds a fibrin mesh that also blocks</text><text x="41" y="489" fill="#f6faf5" font-size="21">pathogens. Inflammation follows with</text><text x="41" y="516" fill="#f6faf5" font-size="21">vasodilation so immune cells can enter,</text><text x="41" y="543" fill="#f6faf5" font-size="21">which is why students often reverse these</text><text x="41" y="570" fill="#f6faf5" font-size="21">two.</text></g></svg>