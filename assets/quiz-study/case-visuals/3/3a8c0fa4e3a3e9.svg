<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which conditions can cause a heart murmur? Select all that apply.</title><desc>SPASM : S tenosis of a valve, P artial obstruction, A neurysms, S eptal defect, M itral regurgitation. What they all share is turbulent flow - blood forced through something narrowed, or leaking where it should not. A conduction problem such as heart block changes the rhythm , not the sound of flow.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which conditions can cause a heart murmur?</text><text x="41" y="198" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Partial obstruction · Valve stenosis ·</text><text x="41" y="330" fill="#f6faf5" font-size="21">Mitral regurgitation · A septal defect ·</text><text x="41" y="357" fill="#f6faf5" font-size="21">Aneurysm</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">SPASM : S tenosis of a valve, P artial</text><text x="41" y="489" fill="#f6faf5" font-size="21">obstruction, A neurysms, S eptal defect, M</text><text x="41" y="516" fill="#f6faf5" font-size="21">itral regurgitation. What they all share</text><text x="41" y="543" fill="#f6faf5" font-size="21">is turbulent flow - blood forced through</text><text x="41" y="570" fill="#f6faf5" font-size="21">something narrowed, or leaking where it</text><text x="41" y="597" fill="#f6faf5" font-size="21">should not. A conduction problem such as</text><text x="41" y="624" fill="#f6faf5" font-size="21">heart block changes the rhythm , not the</text><text x="41" y="651" fill="#f6faf5" font-size="21">sound of flow.</text></g></svg>