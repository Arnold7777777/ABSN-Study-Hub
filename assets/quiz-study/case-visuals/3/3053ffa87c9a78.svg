<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A nurse is giving a medication to an 11-month-old. How should the nurse identify the child?</title><desc>An infant cannot state a name or date of birth, so identification rests on two identifiers from the wristband, confirmed by the caregiver . A room or crib number identifies a location, not a child, and children are moved between them.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Patient Identification Before</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Medication</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is giving a medication to an</text><text x="41" y="231" fill="#f6faf5" font-size="21">11-month-old. How should the nurse</text><text x="41" y="258" fill="#f6faf5" font-size="21">identify the child?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Check two identifiers on the wristband,</text><text x="41" y="390" fill="#f6faf5" font-size="21">confirmed with the caregiver</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">An infant cannot state a name or date of</text><text x="41" y="522" fill="#f6faf5" font-size="21">birth, so identification rests on two</text><text x="41" y="549" fill="#f6faf5" font-size="21">identifiers from the wristband, confirmed</text><text x="41" y="576" fill="#f6faf5" font-size="21">by the caregiver . A room or crib number</text><text x="41" y="603" fill="#f6faf5" font-size="21">identifies a location, not a child, and</text><text x="41" y="630" fill="#f6faf5" font-size="21">children are moved between them.</text></g></svg>