<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>An HIV-positive patient has had diarrhea for 10 days, BP 84/52, HR 122, K⁺ 2.9, and telemetry has been ordered. What does the nurse do first?</title><desc>She is hypotensive and tachycardic from ten days of fluid loss — perfusion comes first , so the isotonic bolus goes in. The monitor is absolutely indicated with a potassium of 2.9 and goes on essentially alongside, but it does not restore a blood pressure. Potassium is never given IV push — it must be diluted and infused on a pump.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Infectious Diseases &amp; HIV</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An HIV-positive patient has had diarrhea</text><text x="41" y="198" fill="#f6faf5" font-size="21">for 10 days, BP 84/52, HR 122, K⁺ 2.9, and</text><text x="41" y="225" fill="#f6faf5" font-size="21">telemetry has been ordered. What does the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse do first?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Initiate an IV isotonic fluid bolus</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">She is hypotensive and tachycardic from</text><text x="41" y="489" fill="#f6faf5" font-size="21">ten days of fluid loss — perfusion comes</text><text x="41" y="516" fill="#f6faf5" font-size="21">first , so the isotonic bolus goes in.</text></g></svg>