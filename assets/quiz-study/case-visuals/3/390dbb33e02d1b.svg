<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is teaching a nursing student about performing passive range-of-motion exercises for a client who is unconscious. Which statement by the student indicates an understanding of the teaching?</title><desc>THE PRIMARY GOAL OF PASSIVE ROM IS TO PREVENT CONTRACTURES and maintain joint flexibility. Passive ROM does not build strength because the client is not contracting the muscle; ACTIVE ROM is required for strengthening. An unconscious client cannot report discomfort, so the nurse moves each joint only to the point of resistance, and ROM is performed at least 2 to 3 times daily rather than once.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Range of Motion</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a nursing student</text><text x="41" y="198" fill="#f6faf5" font-size="21">about performing passive range-of-motion</text><text x="41" y="225" fill="#f6faf5" font-size="21">exercises for a client who is unconscious.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which statement by the student indicates</text><text x="41" y="279" fill="#f6faf5" font-size="21">an understanding of the teaching?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&#x27;The main goal of these exercises is to</text><text x="41" y="411" fill="#f6faf5" font-size="21">prevent contractures.&#x27;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">THE PRIMARY GOAL OF PASSIVE ROM IS TO</text><text x="41" y="543" fill="#f6faf5" font-size="21">PREVENT CONTRACTURES and maintain joint</text><text x="41" y="570" fill="#f6faf5" font-size="21">flexibility.</text></g></svg>