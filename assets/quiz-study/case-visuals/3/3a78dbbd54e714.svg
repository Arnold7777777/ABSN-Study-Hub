<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client asks why she is prescribed iron with vitamin C. What should the nurse explain?</title><desc>Vitamin C increases iron absorption , so iron is taken with orange juice or a vitamin C source and on an empty stomach if tolerated. Milk, antacids and tea reduce absorption. Warn her that stools turn black, and treat the constipation with fluid and fiber.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nutrition &amp; Health Promotion in</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client asks why she is prescribed iron</text><text x="41" y="231" fill="#f6faf5" font-size="21">with vitamin C. What should the nurse</text><text x="41" y="258" fill="#f6faf5" font-size="21">explain?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Vitamin C helps the iron be absorbed</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">Vitamin C increases iron absorption , so</text><text x="41" y="495" fill="#f6faf5" font-size="21">iron is taken with orange juice or a</text><text x="41" y="522" fill="#f6faf5" font-size="21">vitamin C source and on an empty stomach</text><text x="41" y="549" fill="#f6faf5" font-size="21">if tolerated. Milk, antacids and tea</text><text x="41" y="576" fill="#f6faf5" font-size="21">reduce absorption. Warn her that stools</text><text x="41" y="603" fill="#f6faf5" font-size="21">turn black, and treat the constipation</text><text x="41" y="630" fill="#f6faf5" font-size="21">with fluid and fiber.</text></g></svg>