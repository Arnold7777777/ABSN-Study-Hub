<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is setting up a sterile field for a complex dressing change. Which action by the nurse contaminates the field and requires the nurse to start over?</title><desc>THE OUTER 2.5 cm (1 in) BORDER OF A STERILE FIELD IS CONSIDERED CONTAMINATED, SO AN ITEM PLACED 1 cm FROM THE EDGE CONTAMINATES THE FIELD AND IT MUST BE SET UP AGAIN. Sterile items are kept above the waist and within the line of vision, and the first flap of a package is opened away from the body, so those actions are correct. Surgical asepsis eliminates all microorganisms, whereas medical asepsis only reduces their number.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Surgical Asepsis</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is setting up a sterile field for</text><text x="41" y="198" fill="#f6faf5" font-size="21">a complex dressing change. Which action by</text><text x="41" y="225" fill="#f6faf5" font-size="21">the nurse contaminates the field and</text><text x="41" y="252" fill="#f6faf5" font-size="21">requires the nurse to start over?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Placing a sterile gauze package 1 cm (0.5</text><text x="41" y="384" fill="#f6faf5" font-size="21">in) from the edge of the field</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">THE OUTER 2.5 cm (1 in) BORDER OF A</text><text x="41" y="516" fill="#f6faf5" font-size="21">STERILE FIELD IS CONSIDERED CONTAMINATED,</text><text x="41" y="543" fill="#f6faf5" font-size="21">SO AN ITEM PLACED 1 cm FROM THE EDGE</text><text x="41" y="570" fill="#f6faf5" font-size="21">CONTAMINATES THE FIELD AND IT MUST BE SET</text><text x="41" y="597" fill="#f6faf5" font-size="21">UP AGAIN.</text></g></svg>