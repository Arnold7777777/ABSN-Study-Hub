<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>In the playroom, two 2-year-olds sit beside each other, each pushing a separate truck and neither sharing or coordinating with the other. A parent asks whether her child is antisocial. Which response is correct?</title><desc>Toddlers play parallel — alongside but not with each other; associative play belongs to the preschooler. Pushing a 2-year-old to share also collides with autonomy versus shame and doubt, the stage this child is working through.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Toddler &amp; Preschooler</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">In the playroom, two 2-year-olds sit</text><text x="41" y="198" fill="#f6faf5" font-size="21">beside each other, each pushing a separate</text><text x="41" y="225" fill="#f6faf5" font-size="21">truck and neither sharing or coordinating</text><text x="41" y="252" fill="#f6faf5" font-size="21">with the other.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;This is parallel play and it is exactly</text><text x="41" y="384" fill="#f6faf5" font-size="21">what we expect at 2.&quot;</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Toddlers play parallel — alongside but not</text><text x="41" y="516" fill="#f6faf5" font-size="21">with each other; associative play belongs</text><text x="41" y="543" fill="#f6faf5" font-size="21">to the preschooler. Pushing a 2-year-old</text><text x="41" y="570" fill="#f6faf5" font-size="21">to share also collides with autonomy</text><text x="41" y="597" fill="#f6faf5" font-size="21">versus shame and doubt, the stage this</text><text x="41" y="624" fill="#f6faf5" font-size="21">child is working through.</text></g></svg>