<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="464" viewBox="0 0 640 464"><title>Nurse&#x27;s note. Select each finding that suggests increasing intracranial pressure.</title><desc>A full tense fontanelle in a quiet upright infant, a high-pitched cry and forceful vomiting without preceding nausea are classic infant signs of rising pressure. The falling pulse with a rising systolic and widening pulse pressure is Cushing triad, a late and ominous sign. Feeding well, an unchanged head circumference over hours, and equal reactive pupils are reassuring rather than concerning.</desc><rect width="640" height="464" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Increased Intracranial Pressure in</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">the Infant</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Nurse&#x27;s note. Select each finding that</text><text x="41" y="231" fill="#f6faf5" font-size="21">suggests increasing intracranial pressure.</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="336" fill="#f6faf5" font-size="21">A full tense fontanelle in a quiet upright</text><text x="41" y="363" fill="#f6faf5" font-size="21">infant, a high-pitched cry and forceful</text><text x="41" y="390" fill="#f6faf5" font-size="21">vomiting without preceding nausea are</text><text x="41" y="417" fill="#f6faf5" font-size="21">classic infant signs of rising pressure.</text></g></svg>