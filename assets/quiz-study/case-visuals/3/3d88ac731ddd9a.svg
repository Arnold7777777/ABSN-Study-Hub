<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A provider writes the order: &quot;Soft wrist restraints PRN for agitation.&quot; Which action by the nurse is correct?</title><desc>Federal rules bar PRN and standing restraint orders. Each episode needs its own order based on the client&#x27;s condition right then. Applying them under the PRN wording is the trap, because the order looks valid on paper.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Restraints &amp; Safety</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A provider writes the order: &quot;Soft wrist</text><text x="41" y="198" fill="#f6faf5" font-size="21">restraints PRN for agitation.&quot; Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">action by the nurse is correct?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Call the provider, since restraints cannot</text><text x="41" y="357" fill="#f6faf5" font-size="21">be ordered PRN or as standing orders</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Federal rules bar PRN and standing</text><text x="41" y="489" fill="#f6faf5" font-size="21">restraint orders. Each episode needs its</text><text x="41" y="516" fill="#f6faf5" font-size="21">own order based on the client&#x27;s condition</text><text x="41" y="543" fill="#f6faf5" font-size="21">right then. Applying them under the PRN</text><text x="41" y="570" fill="#f6faf5" font-size="21">wording is the trap, because the order</text><text x="41" y="597" fill="#f6faf5" font-size="21">looks valid on paper.</text></g></svg>