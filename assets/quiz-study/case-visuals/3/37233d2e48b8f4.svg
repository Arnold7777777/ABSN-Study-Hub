<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is choosing a site to start an IV infusion for a 76-year-old client who is right-handed and lives alone. Which of the following actions should the nurse take? (Select all that apply.)</title><desc>Use the NONDOMINANT arm and a FOREARM vein; the forearm has more supporting tissue than the back of the hand, which has fragile, mobile veins and little subcutaneous cushion in older adults. Joints and areas of flexion kink the catheter and cause dislodgement and infiltration. TRACTION BELOW the site anchors rolling veins. The antecubital fossa is saved for emergencies or specific therapies, not routine infusions.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">IV Therapy in Older Adults</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is choosing a site to start an IV</text><text x="41" y="198" fill="#f6faf5" font-size="21">infusion for a 76-year-old client who is</text><text x="41" y="225" fill="#f6faf5" font-size="21">right-handed and lives alone. Which of the</text><text x="41" y="252" fill="#f6faf5" font-size="21">following actions should the nurse take?</text><text x="41" y="279" fill="#f6faf5" font-size="21">(Select all that apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Choose a vein in the left forearm · Avoid</text><text x="41" y="411" fill="#f6faf5" font-size="21">veins that lie directly over a joint or</text><text x="41" y="438" fill="#f6faf5" font-size="21">area of flexion · Stabilize the vein by</text><text x="41" y="465" fill="#f6faf5" font-size="21">applying skin traction just below the</text><text x="41" y="492" fill="#f6faf5" font-size="21">insertion site</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">Use the NONDOMINANT arm and a FOREARM</text><text x="41" y="624" fill="#f6faf5" font-size="21">vein;</text></g></svg>