<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>A client on heparin drip has an aPTT result of 120 seconds. The normal aPTT is 25–35 seconds. What should the nurse do FIRST?</title><desc>Supratherapeutic aPTT indicates over-anticoagulation -&gt; bleeding risk. Therapeutic aPTT for heparin = 60–100 seconds (1.5–2.5× normal). aPTT 120 = too high. FIRST: assess for bleeding (urine, stools, gums, neuro). Then notify provider — may need to decrease or hold heparin. Protamine sulfate = antidote for heparin overdose, but requires order.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Cardiac Meds</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client on heparin drip has an aPTT</text><text x="41" y="198" fill="#f6faf5" font-size="21">result of 120 seconds. The normal aPTT is</text><text x="41" y="225" fill="#f6faf5" font-size="21">25–35 seconds. What should the nurse do</text><text x="41" y="252" fill="#f6faf5" font-size="21">FIRST?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Assess the client for signs of bleeding,</text><text x="41" y="384" fill="#f6faf5" font-size="21">then notify provider</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Supratherapeutic aPTT indicates over-</text><text x="41" y="516" fill="#f6faf5" font-size="21">anticoagulation -&gt; bleeding risk.</text></g></svg>