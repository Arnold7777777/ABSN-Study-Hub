<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A nurse is planning care for a client newly diagnosed with generalized tonic-clonic epilepsy. Which interventions should the nurse include in the plan of care? (Select all that apply.)</title><desc>A seizure plan protects the airway and prevents injury, so oxygen, suction, padded rails, and a low bed belong in it. Steady daily dosing keeps drug levels therapeutic, and activity limits protect the client if a seizure hits without warning. Nothing is ever placed in the mouth during a seizure, because it can break teeth or block the airway. Restraining a moving limb does not stop the seizure and can tear muscle or fracture bone.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic Dysfunction &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Cerebrovascular Disorders</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is planning care for a client</text><text x="41" y="231" fill="#f6faf5" font-size="21">newly diagnosed with generalized tonic-</text><text x="41" y="258" fill="#f6faf5" font-size="21">clonic epilepsy. Which interventions</text><text x="41" y="285" fill="#f6faf5" font-size="21">should the nurse include in the plan of</text><text x="41" y="312" fill="#f6faf5" font-size="21">care? (Select all that apply.)</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Keep oxygen and suction equipment set up</text><text x="41" y="444" fill="#f6faf5" font-size="21">at the bedside.</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">A seizure plan protects the airway and</text><text x="41" y="576" fill="#f6faf5" font-size="21">prevents injury, so oxygen, suction,</text><text x="41" y="603" fill="#f6faf5" font-size="21">padded rails, and a low bed belong in it.</text></g></svg>