<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse observes four situations while walking through the unit. Which situation places a client at greatest risk for infection?</title><desc>A drainage bag on the floor becomes contaminated and can allow organisms to travel up the closed system, so the bag must hang below the bladder on the bed frame and never touch the floor. The alcohol rub before entry is tempting only if the student assumes soap and water is always required, but alcohol-based rub is appropriate unless hands are visibly soiled or the client has C. difficile.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Infection Transmission Risk</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse observes four situations while</text><text x="41" y="198" fill="#f6faf5" font-size="21">walking through the unit. Which situation</text><text x="41" y="225" fill="#f6faf5" font-size="21">places a client at greatest risk for</text><text x="41" y="252" fill="#f6faf5" font-size="21">infection?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">A urinary drainage bag is lying on the</text><text x="41" y="384" fill="#f6faf5" font-size="21">floor next to the bed frame</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A drainage bag on the floor becomes</text><text x="41" y="516" fill="#f6faf5" font-size="21">contaminated and can allow organisms to</text><text x="41" y="543" fill="#f6faf5" font-size="21">travel up the closed system, so the bag</text><text x="41" y="570" fill="#f6faf5" font-size="21">must hang below the bladder on the bed</text><text x="41" y="597" fill="#f6faf5" font-size="21">frame and never touch the floor.</text></g></svg>