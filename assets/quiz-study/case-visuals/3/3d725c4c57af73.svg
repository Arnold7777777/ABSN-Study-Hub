<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>The nurse is caring for a group of clients on the acute care unit. Which client(s) will benefit from urinary catheterization? Select all that apply.</title><desc>A CATHETER REQUIRES A MEDICAL INDICATION, NOT CONVENIENCE. Acute retention from an enlarged prostate is a true indication, and a straight cath is appropriate to obtain a sterile specimen from a confused client who cannot cooperate with a clean catch. BEING UNABLE TO WALK TO THE BATHROOM IS NOT AN INDICATION — that is exactly the convenience catheter that drives CAUTI rates, and a bedpan or toileting assistance is the answer. Having a UTI is a reason to AVOID a catheter, not place one.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Catheter Indications</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is caring for a group of clients</text><text x="41" y="198" fill="#f6faf5" font-size="21">on the acute care unit. Which client(s)</text><text x="41" y="225" fill="#f6faf5" font-size="21">will benefit from urinary catheterization?</text><text x="41" y="252" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">A client with an enlarged prostate that is</text><text x="41" y="384" fill="#f6faf5" font-size="21">unable to void · A confused client that</text><text x="41" y="411" fill="#f6faf5" font-size="21">requires a sterile urine specimen to be</text><text x="41" y="438" fill="#f6faf5" font-size="21">obtained</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">A CATHETER REQUIRES A MEDICAL INDICATION,</text><text x="41" y="570" fill="#f6faf5" font-size="21">NOT CONVENIENCE.</text></g></svg>