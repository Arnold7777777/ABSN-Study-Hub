<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A nurse is beginning a psychosocial assessment for a client from a culture different from their own. Which action is best?</title><desc>Use the cultural formulation interview (CFI) and assess the client&#x27;s own beliefs about health, illness, diet, and decision-making. Awareness of culture prevents stereotyping and stigma. Applying your own norms or skipping the topic leads to biased care.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Response to Illness &amp; Mental-</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Health Assessment</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is beginning a psychosocial</text><text x="41" y="231" fill="#f6faf5" font-size="21">assessment for a client from a culture</text><text x="41" y="258" fill="#f6faf5" font-size="21">different from their own. Which action is</text><text x="41" y="285" fill="#f6faf5" font-size="21">best?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Use the cultural formulation interview and</text><text x="41" y="417" fill="#f6faf5" font-size="21">ask about the client&#x27;s health beliefs</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Use the cultural formulation interview</text><text x="41" y="549" fill="#f6faf5" font-size="21">(CFI) and assess the client&#x27;s own beliefs</text><text x="41" y="576" fill="#f6faf5" font-size="21">about health, illness, diet, and decision-</text><text x="41" y="603" fill="#f6faf5" font-size="21">making. Awareness of culture prevents</text><text x="41" y="630" fill="#f6faf5" font-size="21">stereotyping and stigma. Applying your own</text><text x="41" y="657" fill="#f6faf5" font-size="21">norms or skipping the topic leads to</text><text x="41" y="684" fill="#f6faf5" font-size="21">biased care.</text></g></svg>