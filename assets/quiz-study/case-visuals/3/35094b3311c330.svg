<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A nurse is teaching a client who has a new prescription for buspirone. Which of the following adverse effects should the nurse identify as the most common?</title><desc>Dizziness is the most common adverse effect of buspirone. Insomnia is also on the list, which is exactly why it is such a good distractor — but when the stem asks for the most common or expected effect, choose dizziness. Teach the client to rise slowly because of the fall risk.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology:</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Benzodiazepines</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is teaching a client who has a new</text><text x="41" y="231" fill="#f6faf5" font-size="21">prescription for buspirone. Which of the</text><text x="41" y="258" fill="#f6faf5" font-size="21">following adverse effects should the nurse</text><text x="41" y="285" fill="#f6faf5" font-size="21">identify as the most common?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Dizziness</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Dizziness is the most common adverse</text><text x="41" y="522" fill="#f6faf5" font-size="21">effect of buspirone. Insomnia is also on</text><text x="41" y="549" fill="#f6faf5" font-size="21">the list, which is exactly why it is such</text><text x="41" y="576" fill="#f6faf5" font-size="21">a good distractor — but when the stem asks</text><text x="41" y="603" fill="#f6faf5" font-size="21">for the most common or expected effect,</text><text x="41" y="630" fill="#f6faf5" font-size="21">choose dizziness. Teach the client to rise</text><text x="41" y="657" fill="#f6faf5" font-size="21">slowly because of the fall risk.</text></g></svg>