<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="536" viewBox="0 0 640 536"><title>A nurse enters the room of a client receiving oxygen by nasal cannula and finds the pulse oximeter alarming with a reading of 84%. The client is sitting upright and can speak only in short phrases. Which action should the nurse take first?</title><desc>ASSESS THE CLIENT BEFORE THE EQUIPMENT; SPEAKING IN SHORT PHRASES CORROBORATES TRUE HYPOXEMIA RATHER THAN A FAULTY PROBE. Changing the probe first assumes the device is wrong and delays recognition of respiratory compromise. Silencing an alarm without evaluating the client is never appropriate, and documentation always follows assessment and intervention.</desc><rect width="640" height="536" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Prioritization</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse enters the room of a client</text><text x="41" y="198" fill="#f6faf5" font-size="21">receiving oxygen by nasal cannula and</text><text x="41" y="225" fill="#f6faf5" font-size="21">finds the pulse oximeter alarming with a</text><text x="41" y="252" fill="#f6faf5" font-size="21">reading of 84%.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Assess the client&#x27;s respiratory effort and</text><text x="41" y="384" fill="#f6faf5" font-size="21">auscultate lung sounds</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="87" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">ASSESS THE CLIENT BEFORE THE EQUIPMENT;</text></g></svg>