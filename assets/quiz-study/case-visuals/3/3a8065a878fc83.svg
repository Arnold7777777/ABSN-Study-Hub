<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client with diabetes is being taught foot care. Which statement indicates a need for further teaching?</title><desc>Soaking macerates the skin, and neuropathy means she cannot feel water that is too hot. Feet are washed in lukewarm water and dried carefully between the toes. Daily inspection, shoes at all times and straight-across nails are all correct.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Diabetes</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with diabetes is being taught</text><text x="41" y="198" fill="#f6faf5" font-size="21">foot care. Which statement indicates a</text><text x="41" y="225" fill="#f6faf5" font-size="21">need for further teaching?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">“I will soak my feet in hot water each</text><text x="41" y="357" fill="#f6faf5" font-size="21">evening to soften the calluses.”</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Soaking macerates the skin, and neuropathy</text><text x="41" y="489" fill="#f6faf5" font-size="21">means she cannot feel water that is too</text><text x="41" y="516" fill="#f6faf5" font-size="21">hot. Feet are washed in lukewarm water and</text><text x="41" y="543" fill="#f6faf5" font-size="21">dried carefully between the toes. Daily</text><text x="41" y="570" fill="#f6faf5" font-size="21">inspection, shoes at all times and</text><text x="41" y="597" fill="#f6faf5" font-size="21">straight-across nails are all correct.</text></g></svg>