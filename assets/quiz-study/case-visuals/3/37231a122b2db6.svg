<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client at 20 weeks of gestation asks how to keep exercising safely. Which statement by the client indicates correct understanding?</title><desc>The recommended pattern is 3 times weekly for 30 continuous minutes — 5 minutes of warm-up, 20 minutes active, 5 minutes of cool-down. Lying flat sounds supportive, but supine positions are avoided after the first trimester ; she should also eat protein plus a complex carbohydrate beforehand and hydrate, not restrict fluids.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nutrition &amp; Health Promotion in</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 20 weeks of gestation asks how</text><text x="41" y="231" fill="#f6faf5" font-size="21">to keep exercising safely. Which statement</text><text x="41" y="258" fill="#f6faf5" font-size="21">by the client indicates correct</text><text x="41" y="285" fill="#f6faf5" font-size="21">understanding?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">&quot;I&#x27;ll exercise three times a week for 30</text><text x="41" y="417" fill="#f6faf5" font-size="21">continuous minutes, with a 5-minute warm-</text><text x="41" y="444" fill="#f6faf5" font-size="21">up and a 5-minute cool-down.&quot;</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">The recommended pattern is 3 times weekly</text><text x="41" y="576" fill="#f6faf5" font-size="21">for 30 continuous minutes — 5 minutes of</text><text x="41" y="603" fill="#f6faf5" font-size="21">warm-up, 20 minutes active, 5 minutes of</text><text x="41" y="630" fill="#f6faf5" font-size="21">cool-down.</text></g></svg>