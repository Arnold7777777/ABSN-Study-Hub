<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="680" viewBox="0 0 640 680"><title>Axillary temperature is 36.2°C (97.2°F) , blood glucose is 52 mg/dL, and the newborn has not yet voided. Vitamin K and erythromycin ointment have been given. Normal: newborn blood glucose above 40 to 45 mg/dL</title><desc>An axillary temperature below 36.5°C falls under the expected newborn range of 36.5-37.5°C and meets the definition of hypothermia, so skin-to-skin contact with the parent, or a radiant warmer if needed, is the priority warming intervention, since cold stress can lead to hypoglycemia and other complications. Acetaminophen does not address hypothermia, and there is no indication to repeat the vitamin K dose since it was already given.</desc><rect width="640" height="680" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Normal Newborn &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Thermoregulation</text><rect x="23" y="139" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Axillary temperature is 36.2°C (97.2°F) ,</text><text x="41" y="231" fill="#f6faf5" font-size="21">blood glucose is 52 mg/dL, and the newborn</text><text x="41" y="258" fill="#f6faf5" font-size="21">has not yet voided. Vitamin K and</text><text x="41" y="285" fill="#f6faf5" font-size="21">erythromycin ointment have been given.</text><text x="41" y="312" fill="#f6faf5" font-size="21">Normal: newborn blood glucose above 40 to</text><text x="41" y="339" fill="#f6faf5" font-size="21">45 mg/dL</text><path d="M319 363v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="379" width="594" height="276" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 392) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="413" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="444" fill="#f6faf5" font-size="21">An axillary temperature below 36.5°C falls</text><text x="41" y="471" fill="#f6faf5" font-size="21">under the expected newborn range of</text><text x="41" y="498" fill="#f6faf5" font-size="21">36.5-37.5°C and meets the definition of</text><text x="41" y="525" fill="#f6faf5" font-size="21">hypothermia, so skin-to-skin contact with</text><text x="41" y="552" fill="#f6faf5" font-size="21">the parent, or a radiant warmer if needed,</text><text x="41" y="579" fill="#f6faf5" font-size="21">is the priority warming intervention,</text><text x="41" y="606" fill="#f6faf5" font-size="21">since cold stress can lead to hypoglycemia</text><text x="41" y="633" fill="#f6faf5" font-size="21">and other complications.</text></g></svg>