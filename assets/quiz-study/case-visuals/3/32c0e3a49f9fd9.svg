<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client is scheduled for a laparoscopic gallbladder removal. Whose duty is it to describe the operation, what could go wrong, the expected benefit, and other options before she signs the consent?</title><desc>The provider doing the procedure carries the duty to explain it. The admitting nurse is the classic wrong pick because she is the one at the bedside holding the form. Her job is supporting and witnessing, not disclosing the medical details.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Consent &amp; Rights</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is scheduled for a laparoscopic</text><text x="41" y="198" fill="#f6faf5" font-size="21">gallbladder removal. Whose duty is it to</text><text x="41" y="225" fill="#f6faf5" font-size="21">describe the operation, what could go</text><text x="41" y="252" fill="#f6faf5" font-size="21">wrong, the expected benefit, and other</text><text x="41" y="279" fill="#f6faf5" font-size="21">options before she signs the consent?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">The surgeon who will perform the procedure</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">The provider doing the procedure carries</text><text x="41" y="516" fill="#f6faf5" font-size="21">the duty to explain it. The admitting</text><text x="41" y="543" fill="#f6faf5" font-size="21">nurse is the classic wrong pick because</text><text x="41" y="570" fill="#f6faf5" font-size="21">she is the one at the bedside holding the</text><text x="41" y="597" fill="#f6faf5" font-size="21">form. Her job is supporting and</text><text x="41" y="624" fill="#f6faf5" font-size="21">witnessing, not disclosing the medical</text><text x="41" y="651" fill="#f6faf5" font-size="21">details.</text></g></svg>