<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which of the following should the nurse include when documenting a client education session?</title><desc>Teaching records should state the content, the method, and objective evidence of the client&#x27;s response so care can be continued by others. Labeling the client unmotivated is a subjective opinion rather than a fact, and insurance data belongs in the financial record.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Documentation</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which of the following should the nurse</text><text x="41" y="198" fill="#f6faf5" font-size="21">include when documenting a client</text><text x="41" y="225" fill="#f6faf5" font-size="21">education session?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The specific content that was taught · The</text><text x="41" y="357" fill="#f6faf5" font-size="21">method used, such as demonstration or</text><text x="41" y="384" fill="#f6faf5" font-size="21">video · The client&#x27;s response and the</text><text x="41" y="411" fill="#f6faf5" font-size="21">evidence that learning occurred</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Teaching records should state the content,</text><text x="41" y="543" fill="#f6faf5" font-size="21">the method, and objective evidence of the</text><text x="41" y="570" fill="#f6faf5" font-size="21">client&#x27;s response so care can be continued</text><text x="41" y="597" fill="#f6faf5" font-size="21">by others. Labeling the client unmotivated</text><text x="41" y="624" fill="#f6faf5" font-size="21">is a subjective opinion rather than a</text><text x="41" y="651" fill="#f6faf5" font-size="21">fact, and insurance data belongs in the</text><text x="41" y="678" fill="#f6faf5" font-size="21">financial record.</text></g></svg>