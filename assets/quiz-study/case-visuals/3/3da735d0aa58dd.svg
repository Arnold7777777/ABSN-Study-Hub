<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="539" viewBox="0 0 640 539"><title>Wrap the severed part in {0}, seal it inside a bag, and then place that bag in {1}.</title><desc>The part goes into dry sterile gauze or a clean cloth, into a sealed bag, and the sealed bag is submerged in ice water mixed one part ice to three parts water. Packing it in dry ice or laying it on ice freezes the tissue and makes replantation impossible.</desc><rect width="640" height="539" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Severed part care</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Wrap the severed part in {0}, seal it</text><text x="41" y="198" fill="#f6faf5" font-size="21">inside a bag, and then place that bag in</text><text x="41" y="225" fill="#f6faf5" font-size="21">{1}.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="249" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">The part goes into dry sterile gauze or a</text><text x="41" y="357" fill="#f6faf5" font-size="21">clean cloth, into a sealed bag, and the</text><text x="41" y="384" fill="#f6faf5" font-size="21">sealed bag is submerged in ice water mixed</text><text x="41" y="411" fill="#f6faf5" font-size="21">one part ice to three parts water. Packing</text><text x="41" y="438" fill="#f6faf5" font-size="21">it in dry ice or laying it on ice freezes</text><text x="41" y="465" fill="#f6faf5" font-size="21">the tissue and makes replantation</text><text x="41" y="492" fill="#f6faf5" font-size="21">impossible.</text></g></svg>