<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which statement about the CD4+ helper T cell is false ?</title><desc>The helper cell directs ; it does not kill. Direct killing is the job of the CD8+ cytotoxic T cell . Mixing the two up is the commonest error here, and it matters because a CD4 count tells you about coordination, not about killing power.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">HIV - virology &amp; lifecycle</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which statement about the CD4+ helper T</text><text x="41" y="198" fill="#f6faf5" font-size="21">cell is false ?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">It is cytotoxic and kills infected cells</text><text x="41" y="330" fill="#f6faf5" font-size="21">directly</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">The helper cell directs ; it does not</text><text x="41" y="462" fill="#f6faf5" font-size="21">kill. Direct killing is the job of the</text><text x="41" y="489" fill="#f6faf5" font-size="21">CD8+ cytotoxic T cell . Mixing the two up</text><text x="41" y="516" fill="#f6faf5" font-size="21">is the commonest error here, and it</text><text x="41" y="543" fill="#f6faf5" font-size="21">matters because a CD4 count tells you</text><text x="41" y="570" fill="#f6faf5" font-size="21">about coordination, not about killing</text><text x="41" y="597" fill="#f6faf5" font-size="21">power.</text></g></svg>