<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client started haloperidol 3 days ago and now cannot sit still, paces continuously, and says he feels an unbearable inner restlessness. What is the most likely cause of these findings?</title><desc>Motor restlessness with a subjective inner drive to move, appearing days after starting a high-potency antipsychotic, is akathisia , treated by lowering the dose or adding a beta blocker or benzodiazepine. Worsening psychosis is the most dangerous distractor because misreading akathisia as agitation leads to increasing the very drug causing it, which worsens the symptom and is associated with suicide risk. Tardive dyskinesia appears after months to years and involves involuntary orofacial movements.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology: Akathisia</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client started haloperidol 3 days ago</text><text x="41" y="198" fill="#f6faf5" font-size="21">and now cannot sit still, paces</text><text x="41" y="225" fill="#f6faf5" font-size="21">continuously, and says he feels an</text><text x="41" y="252" fill="#f6faf5" font-size="21">unbearable inner restlessness. What is the</text><text x="41" y="279" fill="#f6faf5" font-size="21">most likely cause of these findings?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Akathisia, an extrapyramidal side effect</text><text x="41" y="411" fill="#f6faf5" font-size="21">of the antipsychotic</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Motor restlessness with a subjective inner</text><text x="41" y="543" fill="#f6faf5" font-size="21">drive to move, appearing days after</text><text x="41" y="570" fill="#f6faf5" font-size="21">starting a high-potency antipsychotic, is</text><text x="41" y="597" fill="#f6faf5" font-size="21">akathisia , treated by lowering the dose</text><text x="41" y="624" fill="#f6faf5" font-size="21">or adding a beta blocker or</text><text x="41" y="651" fill="#f6faf5" font-size="21">benzodiazepine.</text></g></svg>