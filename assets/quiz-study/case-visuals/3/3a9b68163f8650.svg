<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client is being discharged after an involuntary inpatient hold and is now stable but still needs frequent structured support. Which setting is most appropriate for continued care?</title><desc>Care moves one step down in restrictiveness — from inpatient to an intensive outpatient program, which honors the least restrictive environment while keeping structured support. Discharging with no follow-up abandons a recently unstable client, and returning to a locked unit is more restrictive than his condition now requires.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Theories &amp; Treatment Settings</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is being discharged after an</text><text x="41" y="198" fill="#f6faf5" font-size="21">involuntary inpatient hold and is now</text><text x="41" y="225" fill="#f6faf5" font-size="21">stable but still needs frequent structured</text><text x="41" y="252" fill="#f6faf5" font-size="21">support. Which setting is most appropriate</text><text x="41" y="279" fill="#f6faf5" font-size="21">for continued care?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Intensive outpatient program</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Care moves one step down in</text><text x="41" y="516" fill="#f6faf5" font-size="21">restrictiveness — from inpatient to an</text><text x="41" y="543" fill="#f6faf5" font-size="21">intensive outpatient program, which honors</text><text x="41" y="570" fill="#f6faf5" font-size="21">the least restrictive environment while</text><text x="41" y="597" fill="#f6faf5" font-size="21">keeping structured support.</text></g></svg>