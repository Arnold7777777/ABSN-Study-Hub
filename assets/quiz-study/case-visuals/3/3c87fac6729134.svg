<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which opportunistic infection comes from a parasite shed in cat faeces, and typically presents with headache, confusion and focal neurological signs?</title><desc>Toxoplasma gondii - a parasite from cat faeces, causing brain lesions once CD4 falls below about 100. Do not confuse it with histoplasmosis , which is a fungus inhaled from bird and bat droppings . The teaching differs: someone else empties the litter tray, and avoid disturbing soil under bird roosts.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">HIV - opportunistic infections</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which opportunistic infection comes from a</text><text x="41" y="198" fill="#f6faf5" font-size="21">parasite shed in cat faeces, and typically</text><text x="41" y="225" fill="#f6faf5" font-size="21">presents with headache, confusion and</text><text x="41" y="252" fill="#f6faf5" font-size="21">focal neurological signs?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Toxoplasmosis</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Toxoplasma gondii - a parasite from cat</text><text x="41" y="489" fill="#f6faf5" font-size="21">faeces, causing brain lesions once CD4</text><text x="41" y="516" fill="#f6faf5" font-size="21">falls below about 100. Do not confuse it</text><text x="41" y="543" fill="#f6faf5" font-size="21">with histoplasmosis , which is a fungus</text><text x="41" y="570" fill="#f6faf5" font-size="21">inhaled from bird and bat droppings . The</text><text x="41" y="597" fill="#f6faf5" font-size="21">teaching differs: someone else empties the</text><text x="41" y="624" fill="#f6faf5" font-size="21">litter tray, and avoid disturbing soil</text><text x="41" y="651" fill="#f6faf5" font-size="21">under bird roosts.</text></g></svg>