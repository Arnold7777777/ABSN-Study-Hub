<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>The nurse is caring for a client with a severe nosebleed. The health care provider inserts a nasal sponge. What should the nurse teach the client about this intervention?</title><desc>A compressed nasal sponge may be used. Once the sponge becomes saturated with blood or is moistened with a small amount of saline, it will expand and produce tamponade to halt the bleeding. The packing may remain in place for 48 hours or up to 3 or 4 days if necessary to control bleeding. This does not require the client to be supine or to avoid all NSAIDs. Packing does not increase the risk for sinusitis.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 4 · Rhinitis / Sinusitis</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is caring for a client with a</text><text x="41" y="198" fill="#f6faf5" font-size="21">severe nosebleed. The health care provider</text><text x="41" y="225" fill="#f6faf5" font-size="21">inserts a nasal sponge. What should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse teach the client about this</text><text x="41" y="279" fill="#f6faf5" font-size="21">intervention?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">The sponge can stay in place for 3 to 4</text><text x="41" y="411" fill="#f6faf5" font-size="21">days if needed</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="87" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A compressed nasal sponge may be used.</text></g></svg>