<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is to give a time-critical medication scheduled for 0800. Which times are acceptable for administration? (Select all that apply.)</title><desc>A time-critical medication must be given within 30 minutes before or after the scheduled time — here, 0730 to 0830. 0745 and 0830 fall inside that window. 0700 is a full hour early, and 0845 and 0900 are too late. Non-time-critical daily medications have a wider window, but these do not.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Medication Timing</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is to give a time-critical</text><text x="41" y="198" fill="#f6faf5" font-size="21">medication scheduled for 0800. Which times</text><text x="41" y="225" fill="#f6faf5" font-size="21">are acceptable for administration? (Select</text><text x="41" y="252" fill="#f6faf5" font-size="21">all that apply.)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">0745 · 0830</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">A time-critical medication must be given</text><text x="41" y="489" fill="#f6faf5" font-size="21">within 30 minutes before or after the</text><text x="41" y="516" fill="#f6faf5" font-size="21">scheduled time — here, 0730 to 0830. 0745</text><text x="41" y="543" fill="#f6faf5" font-size="21">and 0830 fall inside that window. 0700 is</text><text x="41" y="570" fill="#f6faf5" font-size="21">a full hour early, and 0845 and 0900 are</text><text x="41" y="597" fill="#f6faf5" font-size="21">too late. Non-time-critical daily</text><text x="41" y="624" fill="#f6faf5" font-size="21">medications have a wider window, but these</text><text x="41" y="651" fill="#f6faf5" font-size="21">do not.</text></g></svg>