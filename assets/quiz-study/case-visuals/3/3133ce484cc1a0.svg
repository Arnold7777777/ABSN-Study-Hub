<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="566" viewBox="0 0 640 566"><title>162. A client with PE is prescribed a heparin infusion. Which actions should be included in the plan of care? (Select all that apply)</title><desc>a, b, d, e. Monitor aPTT (goal ~2x normal), watch for bleeding, keep the antidote (protamine) available, and use a soft toothbrush. Avoid IM injections (bleeding into muscle). (Instructor added daily CBC to monitor for heparin-induced thrombocytopenia.)</desc><rect width="640" height="566" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">162. A client with PE is prescribed a</text><text x="41" y="198" fill="#f6faf5" font-size="21">heparin infusion. Which actions should be</text><text x="41" y="225" fill="#f6faf5" font-size="21">included in the plan of care? (Select all</text><text x="41" y="252" fill="#f6faf5" font-size="21">that apply)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="249" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">a, b, d, e. Monitor aPTT (goal ~2x</text><text x="41" y="384" fill="#f6faf5" font-size="21">normal), watch for bleeding, keep the</text><text x="41" y="411" fill="#f6faf5" font-size="21">antidote (protamine) available, and use a</text><text x="41" y="438" fill="#f6faf5" font-size="21">soft toothbrush. Avoid IM injections</text><text x="41" y="465" fill="#f6faf5" font-size="21">(bleeding into muscle). (Instructor added</text><text x="41" y="492" fill="#f6faf5" font-size="21">daily CBC to monitor for heparin-induced</text><text x="41" y="519" fill="#f6faf5" font-size="21">thrombocytopenia.)</text></g></svg>