<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="536" viewBox="0 0 640 536"><title>A nurse is administering 1,000 mL of lactated Ringer&#x27;s IV over 10 hr by gravity using tubing with a drop factor of 15 gtt/mL. What flow rate in gtt/min should the nurse set? (Round to the nearest whole number.)</title><desc>STEP 1, find mL/hr: 1,000 mL divided by 10 hr = 100 mL/hr. STEP 2, FORMULA: (mL/hr x DROP FACTOR) divided by 60 min = (100 x 15) divided by 60 = 1,500 divided by 60 = 25 gtt/min. A common wrong answer is 17 gtt/min, from using a 10 gtt/mL drop factor instead of the 15 gtt/mL printed on the package. Answering 100 gtt/min means the student stopped at mL/hr and never applied the drop factor.</desc><rect width="640" height="536" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">IV Drip Rate</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is administering 1,000 mL of</text><text x="41" y="198" fill="#f6faf5" font-size="21">lactated Ringer&#x27;s IV over 10 hr by gravity</text><text x="41" y="225" fill="#f6faf5" font-size="21">using tubing with a drop factor of 15</text><text x="41" y="252" fill="#f6faf5" font-size="21">gtt/mL.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">25 gtt/min</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">STEP 1, find mL/hr: 1,000 mL divided by 10</text><text x="41" y="489" fill="#f6faf5" font-size="21">hr = 100 mL/hr.</text></g></svg>