<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="596" viewBox="0 0 640 596"><title>A nurse is teaching a client who is having external radiation therapy. Which statement shows that the client understands the teaching?</title><desc>Washing the radiated skin with the hand is gentler than a washcloth. Nothing goes on the field — no lotions, powders, ointments or creams — unless the radiation team prescribes it ; the skin is patted dry, never rubbed ; and during treatment the area is protected from sun by clothing and shade, not sunscreen .</desc><rect width="640" height="596" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oncologic Disorders &amp; End-of-Life</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Care</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is teaching a client who is having</text><text x="41" y="231" fill="#f6faf5" font-size="21">external radiation therapy. Which</text><text x="41" y="258" fill="#f6faf5" font-size="21">statement shows that the client</text><text x="41" y="285" fill="#f6faf5" font-size="21">understands the teaching?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">“I will wash the treated area with my hand</text><text x="41" y="417" fill="#f6faf5" font-size="21">instead of a washcloth.”</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Washing the radiated skin with the hand is</text><text x="41" y="549" fill="#f6faf5" font-size="21">gentler than a washcloth.</text></g></svg>