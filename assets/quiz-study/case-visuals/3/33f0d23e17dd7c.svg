<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is performing a neurologic assessment. Which of the following findings should the nurse document as EXPECTED?</title><desc>PERRLA, SYMMETRIC 5/5 MUSCLE STRENGTH, FULL ORIENTATION TO PERSON PLACE TIME AND SITUATION, AND A STEADY COORDINATED GAIT ARE ALL EXPECTED NEUROLOGIC FINDINGS. A UNILATERALLY DILATED NONREACTIVE PUPIL IS AN EMERGENCY suggesting increased intracranial pressure with cranial nerve III compression and must be reported immediately. Muscle strength is graded 0 to 5, with 5 representing full strength against gravity and full resistance.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neuro Assessment</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is performing a neurologic</text><text x="41" y="198" fill="#f6faf5" font-size="21">assessment. Which of the following</text><text x="41" y="225" fill="#f6faf5" font-size="21">findings should the nurse document as</text><text x="41" y="252" fill="#f6faf5" font-size="21">EXPECTED?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Pupils equal, round, 3 mm, and briskly</text><text x="41" y="384" fill="#f6faf5" font-size="21">reactive to light with accommodation ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Muscle strength graded 5/5 in all</text><text x="41" y="438" fill="#f6faf5" font-size="21">extremities · Client is oriented to</text><text x="41" y="465" fill="#f6faf5" font-size="21">person, place, time, and situation ·…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">PERRLA, SYMMETRIC 5/5 MUSCLE STRENGTH,</text><text x="41" y="597" fill="#f6faf5" font-size="21">FULL ORIENTATION TO PERSON PLACE TIME AND</text><text x="41" y="624" fill="#f6faf5" font-size="21">SITUATION, AND A STEADY COORDINATED GAIT</text><text x="41" y="651" fill="#f6faf5" font-size="21">ARE ALL EXPECTED NEUROLOGIC FINDINGS.</text></g></svg>