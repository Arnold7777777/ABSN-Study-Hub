<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is teaching a parent about storing prepared infant formula. Which of the following statements by the parent indicates a need for further teaching?</title><desc>Once the newborn has fed from a bottle, saliva has entered the formula and bacteria multiply in it, so leftovers are discarded rather than saved for the next feeding. The other three are correct: prepared formula refrigerated immediately keeps 24 hr, formula left at room temperature 2 hr, and a started bottle 1 hr from the beginning of the feed.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Newborn Feeding</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a parent about storing</text><text x="41" y="198" fill="#f6faf5" font-size="21">prepared infant formula. Which of the</text><text x="41" y="225" fill="#f6faf5" font-size="21">following statements by the parent</text><text x="41" y="252" fill="#f6faf5" font-size="21">indicates a need for further teaching?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">“I can save what my baby doesn’t finish</text><text x="41" y="384" fill="#f6faf5" font-size="21">and offer it at the next feeding.”</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Once the newborn has fed from a bottle,</text><text x="41" y="516" fill="#f6faf5" font-size="21">saliva has entered the formula and</text><text x="41" y="543" fill="#f6faf5" font-size="21">bacteria multiply in it, so leftovers are</text><text x="41" y="570" fill="#f6faf5" font-size="21">discarded rather than saved for the next</text><text x="41" y="597" fill="#f6faf5" font-size="21">feeding.</text></g></svg>