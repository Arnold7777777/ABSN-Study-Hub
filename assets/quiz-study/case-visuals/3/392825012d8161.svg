<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A nurse is caring for a dying client whose cultural and religious practices differ from the nurse&#x27;s own. Which actions should the nurse take? (Select all that apply.)</title><desc>Asking rather than assuming, identifying the family decision maker, and accommodating preferences are the foundations of culturally responsive care. Assuming beliefs from group membership stereotypes the client, and dismissing traditional practices that are not harmful shuts down communication and trust.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Culturally Responsive Care</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a dying client whose</text><text x="41" y="198" fill="#f6faf5" font-size="21">cultural and religious practices differ</text><text x="41" y="225" fill="#f6faf5" font-size="21">from the nurse&#x27;s own. Which actions should</text><text x="41" y="252" fill="#f6faf5" font-size="21">the nurse take? (Select all that apply.)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Ask the client and family which practices</text><text x="41" y="384" fill="#f6faf5" font-size="21">and rituals are important to them ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Identify who in the family the client</text><text x="41" y="438" fill="#f6faf5" font-size="21">wants involved in decision making ·</text><text x="41" y="465" fill="#f6faf5" font-size="21">Accommodate requests about diet,…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Asking rather than assuming, identifying</text><text x="41" y="597" fill="#f6faf5" font-size="21">the family decision maker, and</text><text x="41" y="624" fill="#f6faf5" font-size="21">accommodating preferences are the</text><text x="41" y="651" fill="#f6faf5" font-size="21">foundations of culturally responsive care.</text><text x="41" y="678" fill="#f6faf5" font-size="21">Assuming beliefs from group membership</text><text x="41" y="705" fill="#f6faf5" font-size="21">stereotypes the client, and dismissing</text><text x="41" y="732" fill="#f6faf5" font-size="21">traditional practices that are not harmful</text><text x="41" y="759" fill="#f6faf5" font-size="21">shuts down communication and trust.</text></g></svg>