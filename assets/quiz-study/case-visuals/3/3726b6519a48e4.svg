<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>Which food should the nurse recommend as the best source of folate for a client trying to conceive?</title><desc>Folate lives in dark green leafy vegetables , and a cup of cooked spinach carries around 230 mcg - most of the 400 mcg recommended before conception, rising to 600 mcg during pregnancy. The apple, milk and egg supply only a few micrograms each. Getting enough before conception is what protects against neural tube defects, because the neural tube closes by week 4.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which food should the nurse recommend as</text><text x="41" y="198" fill="#f6faf5" font-size="21">the best source of folate for a client</text><text x="41" y="225" fill="#f6faf5" font-size="21">trying to conceive?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">One cup of cooked spinach</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Folate lives in dark green leafy</text><text x="41" y="462" fill="#f6faf5" font-size="21">vegetables , and a cup of cooked spinach</text><text x="41" y="489" fill="#f6faf5" font-size="21">carries around 230 mcg - most of the 400</text><text x="41" y="516" fill="#f6faf5" font-size="21">mcg recommended before conception, rising</text><text x="41" y="543" fill="#f6faf5" font-size="21">to 600 mcg during pregnancy.</text></g></svg>