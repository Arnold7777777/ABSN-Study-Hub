<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A 10-month-old has been crying and vomiting for 6 hours and is now lying quietly. Heart rate is 220, blood pressure 85/45 and capillary refill 4 seconds. What does the nurse do?</title><desc>A child who goes quiet after a long period of distress , with a heart rate far above the infant range and slow capillary refill, is decompensating , not settling. Children hold their blood pressure until late, so a &quot;normal&quot; BP is not reassuring.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 10-month-old has been crying and</text><text x="41" y="198" fill="#f6faf5" font-size="21">vomiting for 6 hours and is now lying</text><text x="41" y="225" fill="#f6faf5" font-size="21">quietly. Heart rate is 220, blood pressure</text><text x="41" y="252" fill="#f6faf5" font-size="21">85/45 and capillary refill 4 seconds. What</text><text x="41" y="279" fill="#f6faf5" font-size="21">does the nurse do?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Notify the provider immediately: these are</text><text x="41" y="411" fill="#f6faf5" font-size="21">signs of decompensation</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A child who goes quiet after a long period</text><text x="41" y="543" fill="#f6faf5" font-size="21">of distress , with a heart rate far above</text><text x="41" y="570" fill="#f6faf5" font-size="21">the infant range and slow capillary</text><text x="41" y="597" fill="#f6faf5" font-size="21">refill, is decompensating , not settling.</text><text x="41" y="624" fill="#f6faf5" font-size="21">Children hold their blood pressure until</text><text x="41" y="651" fill="#f6faf5" font-size="21">late, so a &quot;normal&quot; BP is not reassuring.</text></g></svg>