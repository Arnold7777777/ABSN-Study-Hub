<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client says, &quot;Do you think my family hates me?&quot; Which response by the nurse is BEST?</title><desc>Reflecting directs the question back to the client and invites him to explore his own feelings. The first option is false reassurance — it sounds kind, but the nurse cannot know how the family feels and the topic is closed before the client can explore it.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client says, &quot;Do you think my family</text><text x="41" y="231" fill="#f6faf5" font-size="21">hates me?&quot; Which response by the nurse is</text><text x="41" y="258" fill="#f6faf5" font-size="21">BEST?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">What are your thoughts about that?</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">Reflecting directs the question back to</text><text x="41" y="495" fill="#f6faf5" font-size="21">the client and invites him to explore his</text><text x="41" y="522" fill="#f6faf5" font-size="21">own feelings. The first option is false</text><text x="41" y="549" fill="#f6faf5" font-size="21">reassurance — it sounds kind, but the</text><text x="41" y="576" fill="#f6faf5" font-size="21">nurse cannot know how the family feels and</text><text x="41" y="603" fill="#f6faf5" font-size="21">the topic is closed before the client can</text><text x="41" y="630" fill="#f6faf5" font-size="21">explore it.</text></g></svg>