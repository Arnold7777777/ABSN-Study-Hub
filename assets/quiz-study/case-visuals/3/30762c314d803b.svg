<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A 32-year-old female client had a normal Papanicolaou test performed together with human papillomavirus testing. Which information should the nurse provide about the next screening?</title><desc>From ages 21 to 65 the Pap test is generally done every 3 years, and starting at age 30 the interval can extend to 5 years when HPV co-testing is performed and results are normal. The yearly option is tempting because that was the older practice, but current guidelines lengthened the interval.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Cervical Screening</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 32-year-old female client had a normal</text><text x="41" y="198" fill="#f6faf5" font-size="21">Papanicolaou test performed together with</text><text x="41" y="225" fill="#f6faf5" font-size="21">human papillomavirus testing. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">information should the nurse provide about</text><text x="41" y="279" fill="#f6faf5" font-size="21">the next screening?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Screening can be repeated in 5 years</text><text x="41" y="411" fill="#f6faf5" font-size="21">because HPV testing was done with the Pap</text><text x="41" y="438" fill="#f6faf5" font-size="21">test</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">From ages 21 to 65 the Pap test is</text><text x="41" y="570" fill="#f6faf5" font-size="21">generally done every 3 years, and starting</text><text x="41" y="597" fill="#f6faf5" font-size="21">at age 30 the interval can extend to 5</text><text x="41" y="624" fill="#f6faf5" font-size="21">years when HPV co-testing is performed and</text><text x="41" y="651" fill="#f6faf5" font-size="21">results are normal. The yearly option is</text><text x="41" y="678" fill="#f6faf5" font-size="21">tempting because that was the older</text><text x="41" y="705" fill="#f6faf5" font-size="21">practice, but current guidelines</text><text x="41" y="732" fill="#f6faf5" font-size="21">lengthened the interval.</text></g></svg>