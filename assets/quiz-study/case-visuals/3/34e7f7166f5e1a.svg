<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>Which actions are part of safe TPN administration? Select all that apply.</title><desc>Safe TPN means glucose every 4 hours, daily electrolytes, a pump-controlled rate, and never letting the bag run dry. Abruptly stopping the infusion is the dangerous option — it produces rebound hypoglycemia; nausea is assessed and reported while the infusion continues as ordered.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">TPN Safety</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which actions are part of safe TPN</text><text x="41" y="198" fill="#f6faf5" font-size="21">administration? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Check blood glucose every 4 hours ·</text><text x="41" y="330" fill="#f6faf5" font-size="21">Monitor serum electrolytes at least daily</text><text x="41" y="357" fill="#f6faf5" font-size="21">· Keep a backup bag available so the</text><text x="41" y="384" fill="#f6faf5" font-size="21">solution never runs out · Administer the</text><text x="41" y="411" fill="#f6faf5" font-size="21">solution using an infusion pump</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Safe TPN means glucose every 4 hours,</text><text x="41" y="543" fill="#f6faf5" font-size="21">daily electrolytes, a pump-controlled</text><text x="41" y="570" fill="#f6faf5" font-size="21">rate, and never letting the bag run dry.</text><text x="41" y="597" fill="#f6faf5" font-size="21">Abruptly stopping the infusion is the</text><text x="41" y="624" fill="#f6faf5" font-size="21">dangerous option — it produces rebound</text><text x="41" y="651" fill="#f6faf5" font-size="21">hypoglycemia; nausea is assessed and</text><text x="41" y="678" fill="#f6faf5" font-size="21">reported while the infusion continues as</text><text x="41" y="705" fill="#f6faf5" font-size="21">ordered.</text></g></svg>