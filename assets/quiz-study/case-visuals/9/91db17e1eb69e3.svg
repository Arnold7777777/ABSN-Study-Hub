<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse wants to address the esteem needs of a client with chronic mental illness. Which intervention is most appropriate?</title><desc>Esteem needs involve competence, achievement, and respect from self and others — recognizing a mastered skill directly meets that need. The social hour is tempting but targets love and belonging, the level below esteem.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Theories &amp; Treatment Settings</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse wants to address the esteem needs</text><text x="41" y="198" fill="#f6faf5" font-size="21">of a client with chronic mental illness.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which intervention is most appropriate?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Praise the client for correctly managing</text><text x="41" y="357" fill="#f6faf5" font-size="21">his own medications this week</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Esteem needs involve competence,</text><text x="41" y="489" fill="#f6faf5" font-size="21">achievement, and respect from self and</text><text x="41" y="516" fill="#f6faf5" font-size="21">others — recognizing a mastered skill</text><text x="41" y="543" fill="#f6faf5" font-size="21">directly meets that need. The social hour</text><text x="41" y="570" fill="#f6faf5" font-size="21">is tempting but targets love and</text><text x="41" y="597" fill="#f6faf5" font-size="21">belonging, the level below esteem.</text></g></svg>