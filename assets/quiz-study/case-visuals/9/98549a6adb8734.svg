<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which are correct instructions for safe infant sleep? Select all that apply.</title><desc>Back to sleep, firm flat surface, own sleep space in the caregiver&#x27;s room, no smoke. Bumper pads, pillows, blankets and soft toys all raise the risk of suffocation - the old instinct to pad the crib is exactly what the guidance reversed.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Infant (0–1 year)</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which are correct instructions for safe</text><text x="41" y="198" fill="#f6faf5" font-size="21">infant sleep? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Place the infant on the back to sleep ·</text><text x="41" y="330" fill="#f6faf5" font-size="21">Use a firm mattress with no soft bedding ·</text><text x="41" y="357" fill="#f6faf5" font-size="21">Room-share without bed-sharing · Keep the</text><text x="41" y="384" fill="#f6faf5" font-size="21">room free of smoke exposure</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Back to sleep, firm flat surface, own</text><text x="41" y="516" fill="#f6faf5" font-size="21">sleep space in the caregiver&#x27;s room, no</text><text x="41" y="543" fill="#f6faf5" font-size="21">smoke. Bumper pads, pillows, blankets and</text><text x="41" y="570" fill="#f6faf5" font-size="21">soft toys all raise the risk of</text><text x="41" y="597" fill="#f6faf5" font-size="21">suffocation - the old instinct to pad the</text><text x="41" y="624" fill="#f6faf5" font-size="21">crib is exactly what the guidance</text><text x="41" y="651" fill="#f6faf5" font-size="21">reversed.</text></g></svg>