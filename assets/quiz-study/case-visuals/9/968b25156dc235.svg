<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A 66-year-old taking oxycodone with acetaminophen after knee surgery tells the nurse he also takes over-the-counter acetaminophen 500 mg tablets for headaches. Which teaching is most important?</title><desc>ACETAMINOPHEN HIDES IN COMBINATION PRODUCTS AND THE CEILING IS ABOUT 4 G PER DAY, LESS WITH LIVER DISEASE OR ALCOHOL USE. Stacking a combination opioid on top of OTC acetaminophen is the classic accidental overdose. The toxicity is HEPATIC, not renal, and the antidote is acetylcysteine.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Acetaminophen Ceiling</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 66-year-old taking oxycodone with</text><text x="41" y="198" fill="#f6faf5" font-size="21">acetaminophen after knee surgery tells the</text><text x="41" y="225" fill="#f6faf5" font-size="21">nurse he also takes over-the-counter</text><text x="41" y="252" fill="#f6faf5" font-size="21">acetaminophen 500 mg tablets for</text><text x="41" y="279" fill="#f6faf5" font-size="21">headaches. Which teaching is most</text><text x="41" y="306" fill="#f6faf5" font-size="21">important?</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">Your prescription pain pill already</text><text x="41" y="438" fill="#f6faf5" font-size="21">contains acetaminophen; keep your total at</text><text x="41" y="465" fill="#f6faf5" font-size="21">or below about 4 grams a day.</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">ACETAMINOPHEN HIDES IN COMBINATION</text><text x="41" y="597" fill="#f6faf5" font-size="21">PRODUCTS AND THE CEILING IS ABOUT 4 G PER</text><text x="41" y="624" fill="#f6faf5" font-size="21">DAY, LESS WITH LIVER DISEASE OR ALCOHOL</text><text x="41" y="651" fill="#f6faf5" font-size="21">USE. Stacking a combination opioid on top</text><text x="41" y="678" fill="#f6faf5" font-size="21">of OTC acetaminophen is the classic</text><text x="41" y="705" fill="#f6faf5" font-size="21">accidental overdose. The toxicity is</text><text x="41" y="732" fill="#f6faf5" font-size="21">HEPATIC, not renal, and the antidote is</text><text x="41" y="759" fill="#f6faf5" font-size="21">acetylcysteine.</text></g></svg>