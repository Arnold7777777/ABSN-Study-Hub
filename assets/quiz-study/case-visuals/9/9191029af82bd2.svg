<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>Which services are part of psychiatric rehabilitation for a client with chronic mental illness? Select all that apply.</title><desc>Psychiatric rehabilitation goes beyond managing the disease and the medications to build living, work, and social skills plus housing and community supports — key resources for the homeless mentally ill. Permanent institutionalization is the opposite of the least-restrictive-environment principle.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Response to Illness &amp; Mental-</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Health Assessment</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which services are part of psychiatric</text><text x="41" y="231" fill="#f6faf5" font-size="21">rehabilitation for a client with chronic</text><text x="41" y="258" fill="#f6faf5" font-size="21">mental illness? Select all that apply.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Independent living and self-care skills</text><text x="41" y="390" fill="#f6faf5" font-size="21">training · Work-readiness and vocational</text><text x="41" y="417" fill="#f6faf5" font-size="21">skills · Social skills training · Linkage</text><text x="41" y="444" fill="#f6faf5" font-size="21">to community-based supports and housing</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Psychiatric rehabilitation goes beyond</text><text x="41" y="576" fill="#f6faf5" font-size="21">managing the disease and the medications</text><text x="41" y="603" fill="#f6faf5" font-size="21">to build living, work, and social skills</text><text x="41" y="630" fill="#f6faf5" font-size="21">plus housing and community supports — key</text><text x="41" y="657" fill="#f6faf5" font-size="21">resources for the homeless mentally ill.</text><text x="41" y="684" fill="#f6faf5" font-size="21">Permanent institutionalization is the</text><text x="41" y="711" fill="#f6faf5" font-size="21">opposite of the least-restrictive-</text><text x="41" y="738" fill="#f6faf5" font-size="21">environment principle.</text></g></svg>