<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client is brought to the ED by law enforcement after 4 days of little sleep, rapid pressured speech, and grandiose statements. Which findings should the nurse recognize as cues requiring priority follow-up? (Select all that apply.)</title><desc>This is the miss pattern that cost you 5 of 9 Clinical Judgment points. Appearance and thought process are documented , not prioritized . Maslow and ABC put the physiologic and safety cues first: sleep deprivation, dehydration/no intake, and self-injury . Bright clothing and flight of ideas confirm mania but are not the urgent cues. When a mania stem lists both, pick the body finding, not the behavior finding.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is brought to the ED by law</text><text x="41" y="198" fill="#f6faf5" font-size="21">enforcement after 4 days of little sleep,</text><text x="41" y="225" fill="#f6faf5" font-size="21">rapid pressured speech, and grandiose</text><text x="41" y="252" fill="#f6faf5" font-size="21">statements.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Has slept about 2 hours total in 4 days ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Has not eaten or had fluids since</text><text x="41" y="411" fill="#f6faf5" font-size="21">yesterday morning · Superficial</text><text x="41" y="438" fill="#f6faf5" font-size="21">lacerations on both wrists</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">This is the miss pattern that cost you 5</text><text x="41" y="570" fill="#f6faf5" font-size="21">of 9 Clinical Judgment points.</text></g></svg>