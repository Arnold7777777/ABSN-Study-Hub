<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A 45-year-old woman is discharged on oral potassium chloride after treatment for hypokalemia. Which statement shows she understands the teaching?</title><desc>ORAL KCl IS A GI IRRITANT - take it WITH FOOD AND A FULL GLASS OF WATER, sitting upright. An empty stomach causes nausea and ulceration, lying down lets the tablet burn the esophagus, and crushing an extended-release form dumps the entire dose at once.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oral Potassium Teaching</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 45-year-old woman is discharged on oral</text><text x="41" y="198" fill="#f6faf5" font-size="21">potassium chloride after treatment for</text><text x="41" y="225" fill="#f6faf5" font-size="21">hypokalemia. Which statement shows she</text><text x="41" y="252" fill="#f6faf5" font-size="21">understands the teaching?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">I will take it with a meal and a full</text><text x="41" y="384" fill="#f6faf5" font-size="21">glass of water.</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">ORAL KCl IS A GI IRRITANT - take it WITH</text><text x="41" y="516" fill="#f6faf5" font-size="21">FOOD AND A FULL GLASS OF WATER, sitting</text><text x="41" y="543" fill="#f6faf5" font-size="21">upright. An empty stomach causes nausea</text><text x="41" y="570" fill="#f6faf5" font-size="21">and ulceration, lying down lets the tablet</text><text x="41" y="597" fill="#f6faf5" font-size="21">burn the esophagus, and crushing an</text><text x="41" y="624" fill="#f6faf5" font-size="21">extended-release form dumps the entire</text><text x="41" y="651" fill="#f6faf5" font-size="21">dose at once.</text></g></svg>