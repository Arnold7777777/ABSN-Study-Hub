<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client with advanced cancer rates pain as 9 on a 0 to 10 scale despite taking a scheduled nonopioid plus a weak opioid. Which action should the nurse take?</title><desc>When pain persists at the second step of the ladder, the next step is a strong opioid given around the clock with a breakthrough dose available, and there is no ceiling dose that limits titration for cancer pain. Continuing an ineffective regimen or holding analgesics entirely leaves severe pain untreated, and nonpharmacologic measures are added to analgesia rather than substituted for it.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">WHO Analgesic Ladder</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with advanced cancer rates pain</text><text x="41" y="198" fill="#f6faf5" font-size="21">as 9 on a 0 to 10 scale despite taking a</text><text x="41" y="225" fill="#f6faf5" font-size="21">scheduled nonopioid plus a weak opioid.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which action should the nurse take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Contact the provider about a strong opioid</text><text x="41" y="384" fill="#f6faf5" font-size="21">scheduled around the clock with a dose</text><text x="41" y="411" fill="#f6faf5" font-size="21">available for breakthrough pain</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">When pain persists at the second step of</text><text x="41" y="543" fill="#f6faf5" font-size="21">the ladder, the next step is a strong</text><text x="41" y="570" fill="#f6faf5" font-size="21">opioid given around the clock with a</text><text x="41" y="597" fill="#f6faf5" font-size="21">breakthrough dose available, and there is</text><text x="41" y="624" fill="#f6faf5" font-size="21">no ceiling dose that limits titration for</text><text x="41" y="651" fill="#f6faf5" font-size="21">cancer pain.</text></g></svg>