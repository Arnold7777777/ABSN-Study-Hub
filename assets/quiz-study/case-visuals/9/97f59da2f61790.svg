<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="539" viewBox="0 0 640 539"><title>118. A terminally ill, competent client whose family insists on aggressive treatment says, &quot;I just want to be done with all of this and be comfortable.&quot; What is the nurse&#x27;s best response?</title><desc>b. A competent client is the decision maker. The nurse supports the client speaking with the provider, without acting as intermediary or applying family pressure.</desc><rect width="640" height="539" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">118. A terminally ill, competent client</text><text x="41" y="198" fill="#f6faf5" font-size="21">whose family insists on aggressive</text><text x="41" y="225" fill="#f6faf5" font-size="21">treatment says, &quot;I just want to be done</text><text x="41" y="252" fill="#f6faf5" font-size="21">with all of this and be comfortable.&quot; What</text><text x="41" y="279" fill="#f6faf5" font-size="21">is the nurse&#x27;s best response?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="384" fill="#f6faf5" font-size="21">b. A competent client is the decision</text><text x="41" y="411" fill="#f6faf5" font-size="21">maker. The nurse supports the client</text><text x="41" y="438" fill="#f6faf5" font-size="21">speaking with the provider, without acting</text><text x="41" y="465" fill="#f6faf5" font-size="21">as intermediary or applying family</text><text x="41" y="492" fill="#f6faf5" font-size="21">pressure.</text></g></svg>