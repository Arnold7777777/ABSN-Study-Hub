<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse has met daily with a client who has borderline personality disorder. Which client statement best indicates that the therapeutic relationship is working?</title><desc>Bringing the feeling to the nurse in words rather than acting on it demonstrates trust plus a substituted coping skill , which is exactly what the relationship is meant to build. Idealizing one nurse while devaluing others is the tempting distractor because it sounds like a compliment about the relationship, but it is splitting and signals that boundaries and staff consistency need reinforcement. Requesting personal contact is a boundary violation, and premature closure avoids the work.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationship</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse has met daily with a client who</text><text x="41" y="198" fill="#f6faf5" font-size="21">has borderline personality disorder. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">client statement best indicates that the</text><text x="41" y="252" fill="#f6faf5" font-size="21">therapeutic relationship is working?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">When I got angry today I came and told you</text><text x="41" y="384" fill="#f6faf5" font-size="21">about it instead of cutting myself</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Bringing the feeling to the nurse in words</text><text x="41" y="516" fill="#f6faf5" font-size="21">rather than acting on it demonstrates</text><text x="41" y="543" fill="#f6faf5" font-size="21">trust plus a substituted coping skill ,</text><text x="41" y="570" fill="#f6faf5" font-size="21">which is exactly what the relationship is</text><text x="41" y="597" fill="#f6faf5" font-size="21">meant to build.</text></g></svg>