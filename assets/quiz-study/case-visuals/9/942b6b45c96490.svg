<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A 5-year-old with acute lymphocytic leukemia (platelets 90,000/mcL, bleeding gums, petechiae) has been admitted to the oncology unit with plans to start chemotherapy. What interventions should the nurse include in the plan of care? (Select all that apply.)</title><desc>Supervised gentle toothbrushing and soft food protect bleeding gums and mouth sores, many chemotherapy drugs damage tissue if the IV infiltrates , and ondansetron prevents chemotherapy nausea. Bed rest is not usually required; quiet activities are enough to manage fatigue.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology &amp; Childhood Neoplasms</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 5-year-old with acute lymphocytic</text><text x="41" y="198" fill="#f6faf5" font-size="21">leukemia (platelets 90,000/mcL, bleeding</text><text x="41" y="225" fill="#f6faf5" font-size="21">gums, petechiae) has been admitted to the</text><text x="41" y="252" fill="#f6faf5" font-size="21">oncology unit with plans to start</text><text x="41" y="279" fill="#f6faf5" font-size="21">chemotherapy.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Supervise toothbrushing. · Offer soft, not</text><text x="41" y="411" fill="#f6faf5" font-size="21">crunchy food. · Monitor IV sites for</text><text x="41" y="438" fill="#f6faf5" font-size="21">infiltration. · Administration of</text><text x="41" y="465" fill="#f6faf5" font-size="21">ondansetron.</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Supervised gentle toothbrushing and soft</text><text x="41" y="597" fill="#f6faf5" font-size="21">food protect bleeding gums and mouth</text><text x="41" y="624" fill="#f6faf5" font-size="21">sores, many chemotherapy drugs damage</text><text x="41" y="651" fill="#f6faf5" font-size="21">tissue if the IV infiltrates , and</text><text x="41" y="678" fill="#f6faf5" font-size="21">ondansetron prevents chemotherapy nausea.</text><text x="41" y="705" fill="#f6faf5" font-size="21">Bed rest is not usually required; quiet</text><text x="41" y="732" fill="#f6faf5" font-size="21">activities are enough to manage fatigue.</text></g></svg>