<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client who rates incisional pain as 8 on a 0 to 10 scale is scheduled for teaching about dressing changes. Which action should the nurse take first?</title><desc>Physical discomfort blocks concentration and retention, so relieving pain first makes the session effective rather than wasted. Teaching a family member is tempting and may be appropriate later, but it does not meet the client&#x27;s own learning need and skips the fixable barrier.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Readiness to Learn</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who rates incisional pain as 8 on</text><text x="41" y="198" fill="#f6faf5" font-size="21">a 0 to 10 scale is scheduled for teaching</text><text x="41" y="225" fill="#f6faf5" font-size="21">about dressing changes. Which action</text><text x="41" y="252" fill="#f6faf5" font-size="21">should the nurse take first?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Give the prescribed analgesic and teach</text><text x="41" y="384" fill="#f6faf5" font-size="21">once the client is comfortable</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Physical discomfort blocks concentration</text><text x="41" y="516" fill="#f6faf5" font-size="21">and retention, so relieving pain first</text><text x="41" y="543" fill="#f6faf5" font-size="21">makes the session effective rather than</text><text x="41" y="570" fill="#f6faf5" font-size="21">wasted. Teaching a family member is</text><text x="41" y="597" fill="#f6faf5" font-size="21">tempting and may be appropriate later, but</text><text x="41" y="624" fill="#f6faf5" font-size="21">it does not meet the client&#x27;s own learning</text><text x="41" y="651" fill="#f6faf5" font-size="21">need and skips the fixable barrier.</text></g></svg>