<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is planning care for a client who has assaulted others when he feels crowded. Which approach best addresses this client&#x27;s problem?</title><desc>Respecting personal space, approaching singly, and keeping an unobstructed exit remove the specific trigger while preserving staff safety , and this is the least restrictive effective approach. Two-person escorts are the tempting answer because more staff feels safer, but a group approach increases the sense of being crowded and can precipitate the assault it is meant to prevent. Room restriction is unnecessarily restrictive, and adding a roommate increases crowding.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anger and Aggression</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is planning care for a client who</text><text x="41" y="198" fill="#f6faf5" font-size="21">has assaulted others when he feels</text><text x="41" y="225" fill="#f6faf5" font-size="21">crowded. Which approach best addresses</text><text x="41" y="252" fill="#f6faf5" font-size="21">this client&#x27;s problem?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Plan for staff to approach the client one</text><text x="41" y="384" fill="#f6faf5" font-size="21">at a time, at least an arm&#x27;s length away,</text><text x="41" y="411" fill="#f6faf5" font-size="21">using a calm voice with a clear exit path</text><text x="41" y="438" fill="#f6faf5" font-size="21">for both</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Respecting personal space, approaching</text><text x="41" y="570" fill="#f6faf5" font-size="21">singly, and keeping an unobstructed exit</text><text x="41" y="597" fill="#f6faf5" font-size="21">remove the specific trigger while</text><text x="41" y="624" fill="#f6faf5" font-size="21">preserving staff safety , and this is the</text><text x="41" y="651" fill="#f6faf5" font-size="21">least restrictive effective approach.</text></g></svg>