<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>Which actions belong in the resolution?</title><desc>The client controls who receives her health information, so her permission comes before the family conversation, and much of this conflict turns out to be grief and missing information rather than a disagreement about values. An ethics consultation clarifies the issue and recommends; it does not take the decision away from the client. Documenting her own words and the process that produced them is what protects everyone, including her, if the question is raised again.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Refusal of Treatment, Capacity,</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">and Family Conflict</text><rect x="23" y="139" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which actions belong in the resolution?</text><path d="M319 228v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="244" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 257) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="278" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="309" fill="#f6faf5" font-size="21">Ask the client&#x27;s permission before</text><text x="41" y="336" fill="#f6faf5" font-size="21">discussing her information with the</text><text x="41" y="363" fill="#f6faf5" font-size="21">daughter · Have the team give the daughter</text><text x="41" y="390" fill="#f6faf5" font-size="21">the prognosis the client agrees to share ·</text><text x="41" y="417" fill="#f6faf5" font-size="21">Document the client&#x27;s decision…</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">The client controls who receives her</text><text x="41" y="549" fill="#f6faf5" font-size="21">health information, so her permission</text><text x="41" y="576" fill="#f6faf5" font-size="21">comes before the family conversation, and</text><text x="41" y="603" fill="#f6faf5" font-size="21">much of this conflict turns out to be</text><text x="41" y="630" fill="#f6faf5" font-size="21">grief and missing information rather than</text><text x="41" y="657" fill="#f6faf5" font-size="21">a disagreement about values.</text></g></svg>