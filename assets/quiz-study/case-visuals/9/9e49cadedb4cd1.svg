<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse taught a client with a new colostomy how to empty and change the pouch yesterday. Which finding indicates that learning occurred?</title><desc>Evaluation of a psychomotor objective requires observing the client perform the skill independently and correctly. Verbal appreciation, video viewing, and reading are all exposure to information rather than evidence that the client can do the task.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Evaluating Learning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse taught a client with a new</text><text x="41" y="198" fill="#f6faf5" font-size="21">colostomy how to empty and change the</text><text x="41" y="225" fill="#f6faf5" font-size="21">pouch yesterday. Which finding indicates</text><text x="41" y="252" fill="#f6faf5" font-size="21">that learning occurred?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">The client empties and changes the pouch</text><text x="41" y="384" fill="#f6faf5" font-size="21">correctly without prompting</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Evaluation of a psychomotor objective</text><text x="41" y="516" fill="#f6faf5" font-size="21">requires observing the client perform the</text><text x="41" y="543" fill="#f6faf5" font-size="21">skill independently and correctly. Verbal</text><text x="41" y="570" fill="#f6faf5" font-size="21">appreciation, video viewing, and reading</text><text x="41" y="597" fill="#f6faf5" font-size="21">are all exposure to information rather</text><text x="41" y="624" fill="#f6faf5" font-size="21">than evidence that the client can do the</text><text x="41" y="651" fill="#f6faf5" font-size="21">task.</text></g></svg>