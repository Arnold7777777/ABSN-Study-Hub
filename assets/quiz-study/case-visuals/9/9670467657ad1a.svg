<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which finding should alert the nurse to a hemolytic transfusion reaction in a school-age child?</title><desc>Flank pain comes from destroyed red cells hitting the kidneys, and it is the classic sign. Laryngeal edema is an allergic reaction; distended neck veins are circulatory overload . In every case: stop the transfusion, keep the line open with 0.9% sodium chloride , and notify the provider and blood bank.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which finding should alert the nurse to a</text><text x="41" y="198" fill="#f6faf5" font-size="21">hemolytic transfusion reaction in a</text><text x="41" y="225" fill="#f6faf5" font-size="21">school-age child?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Flank pain</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Flank pain comes from destroyed red cells</text><text x="41" y="462" fill="#f6faf5" font-size="21">hitting the kidneys, and it is the classic</text><text x="41" y="489" fill="#f6faf5" font-size="21">sign. Laryngeal edema is an allergic</text><text x="41" y="516" fill="#f6faf5" font-size="21">reaction; distended neck veins are</text><text x="41" y="543" fill="#f6faf5" font-size="21">circulatory overload . In every case: stop</text><text x="41" y="570" fill="#f6faf5" font-size="21">the transfusion, keep the line open with</text><text x="41" y="597" fill="#f6faf5" font-size="21">0.9% sodium chloride , and notify the</text><text x="41" y="624" fill="#f6faf5" font-size="21">provider and blood bank.</text></g></svg>