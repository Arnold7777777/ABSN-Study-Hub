<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>The nurse is reviewing several client cases involving hypersensitivity reactions. Which of the following scenarios are correctly matched with their hypersensitivity type? Select all that apply.</title><desc>Nickel dermatitis and the tuberculin skin test are delayed (Type IV) reactions, serum sickness is an antibody-molecule complex reaction (Type III), and anaphylaxis is Type I. Allergic rhinitis is a Type I allergic reaction, not Type II ; Type II is an antibody attacking a cell, such as a hemolytic transfusion reaction.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hypersensitivity types</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is reviewing several client</text><text x="41" y="198" fill="#f6faf5" font-size="21">cases involving hypersensitivity</text><text x="41" y="225" fill="#f6faf5" font-size="21">reactions. Which of the following</text><text x="41" y="252" fill="#f6faf5" font-size="21">scenarios are correctly matched with their</text><text x="41" y="279" fill="#f6faf5" font-size="21">hypersensitivity type? Select all that</text><text x="41" y="306" fill="#f6faf5" font-size="21">apply.</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">A client with contact dermatitis after</text><text x="41" y="438" fill="#f6faf5" font-size="21">wearing nickel jewelry - Type IV · A</text><text x="41" y="465" fill="#f6faf5" font-size="21">client with serum sickness after receiving</text><text x="41" y="492" fill="#f6faf5" font-size="21">antitoxin therapy - Type III · A client</text><text x="41" y="519" fill="#f6faf5" font-size="21">with a positive tuberculin…</text><path d="M319 543v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="559" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 572) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="593" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="624" fill="#f6faf5" font-size="21">Nickel dermatitis and the tuberculin skin</text><text x="41" y="651" fill="#f6faf5" font-size="21">test are delayed (Type IV) reactions,</text><text x="41" y="678" fill="#f6faf5" font-size="21">serum sickness is an antibody-molecule</text><text x="41" y="705" fill="#f6faf5" font-size="21">complex reaction (Type III), and</text><text x="41" y="732" fill="#f6faf5" font-size="21">anaphylaxis is Type I.</text></g></svg>