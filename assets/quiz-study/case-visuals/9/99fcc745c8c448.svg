<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A child is being discharged with atopic dermatitis. Which statements by a guardian show that the teaching was effective? Select all that apply.</title><desc>Moisturizer goes on within about 3 minutes of the bath, on damp skin - that is what traps the water in. Short nails limit the damage from scratching, which is what turns eczema into infection. Mild detergent avoids one of the commonest triggers. Scrubbing scabs off damages healing skin and spreads infection , bubble bath strips the skin’s own oils , and topical medication is used in a thin layer, because more is not better and steroids thin the skin.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A child is being discharged with atopic</text><text x="41" y="198" fill="#f6faf5" font-size="21">dermatitis. Which statements by a guardian</text><text x="41" y="225" fill="#f6faf5" font-size="21">show that the teaching was effective?</text><text x="41" y="252" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">“We will put the moisturizer on straight</text><text x="41" y="384" fill="#f6faf5" font-size="21">after the bath.” · “We will use a mild</text><text x="41" y="411" fill="#f6faf5" font-size="21">detergent for the washing.” · “We will</text><text x="41" y="438" fill="#f6faf5" font-size="21">keep her fingernails cut short.”</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Moisturizer goes on within about 3 minutes</text><text x="41" y="570" fill="#f6faf5" font-size="21">of the bath, on damp skin - that is what</text><text x="41" y="597" fill="#f6faf5" font-size="21">traps the water in.</text></g></svg>