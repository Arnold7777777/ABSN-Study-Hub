<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="539" viewBox="0 0 640 539"><title>How many capsules should the nurse give per day?</title><desc>Same three steps - pounds to kilograms, then milligrams, then capsules. The answer comes out at 1.02, and a capsule cannot be split , so it rounds to 1 . Keep the unrounded kilogram figure all the way through; rounding 34.09 to 34 early still gives 1 here, but on a narrower drug that habit is how doses go wrong.</desc><rect width="640" height="539" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">How many capsules should the nurse give</text><text x="41" y="198" fill="#f6faf5" font-size="21">per day?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="276" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">Same three steps - pounds to kilograms,</text><text x="41" y="330" fill="#f6faf5" font-size="21">then milligrams, then capsules. The answer</text><text x="41" y="357" fill="#f6faf5" font-size="21">comes out at 1.02, and a capsule cannot be</text><text x="41" y="384" fill="#f6faf5" font-size="21">split , so it rounds to 1 . Keep the</text><text x="41" y="411" fill="#f6faf5" font-size="21">unrounded kilogram figure all the way</text><text x="41" y="438" fill="#f6faf5" font-size="21">through; rounding 34.09 to 34 early still</text><text x="41" y="465" fill="#f6faf5" font-size="21">gives 1 here, but on a narrower drug that</text><text x="41" y="492" fill="#f6faf5" font-size="21">habit is how doses go wrong.</text></g></svg>