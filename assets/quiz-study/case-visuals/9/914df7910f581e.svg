<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>After instilling an eye drop, which action should the nurse take?</title><desc>Gentle pressure on the lacrimal sac at the inner corner for about 2 minutes stops the drop draining down the tear duct, which both keeps it in the eye and limits systemic absorption — the reason it matters for a beta blocker such as timolol. Wiping goes inner to outer , and rapid blinking pumps the drop away.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Disorders - Eye &amp; Ear</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">After instilling an eye drop, which action</text><text x="41" y="198" fill="#f6faf5" font-size="21">should the nurse take?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Apply gentle pressure to the lacrimal sac</text><text x="41" y="330" fill="#f6faf5" font-size="21">for 2 minutes</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Gentle pressure on the lacrimal sac at the</text><text x="41" y="462" fill="#f6faf5" font-size="21">inner corner for about 2 minutes stops the</text><text x="41" y="489" fill="#f6faf5" font-size="21">drop draining down the tear duct, which</text><text x="41" y="516" fill="#f6faf5" font-size="21">both keeps it in the eye and limits</text><text x="41" y="543" fill="#f6faf5" font-size="21">systemic absorption — the reason it</text><text x="41" y="570" fill="#f6faf5" font-size="21">matters for a beta blocker such as</text><text x="41" y="597" fill="#f6faf5" font-size="21">timolol.</text></g></svg>