<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="566" viewBox="0 0 640 566"><title>A client reports stiffness lasting two hours each morning that {0} with gentle movement; this points to {1}, which usually begins in the {2}.</title><desc>Prolonged morning stiffness that loosens with movement is the RA signature, and RA starts in the small joints of the hands and feet before spreading. In OA the stiffness is under 30 minutes and pain increases the more the weight-bearing joint is used.</desc><rect width="640" height="566" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">RA vs OA</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client reports stiffness lasting two</text><text x="41" y="198" fill="#f6faf5" font-size="21">hours each morning that {0} with gentle</text><text x="41" y="225" fill="#f6faf5" font-size="21">movement; this points to {1}, which</text><text x="41" y="252" fill="#f6faf5" font-size="21">usually begins in the {2}.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="249" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">Prolonged morning stiffness that loosens</text><text x="41" y="384" fill="#f6faf5" font-size="21">with movement is the RA signature, and RA</text><text x="41" y="411" fill="#f6faf5" font-size="21">starts in the small joints of the hands</text><text x="41" y="438" fill="#f6faf5" font-size="21">and feet before spreading. In OA the</text><text x="41" y="465" fill="#f6faf5" font-size="21">stiffness is under 30 minutes and pain</text><text x="41" y="492" fill="#f6faf5" font-size="21">increases the more the weight-bearing</text><text x="41" y="519" fill="#f6faf5" font-size="21">joint is used.</text></g></svg>