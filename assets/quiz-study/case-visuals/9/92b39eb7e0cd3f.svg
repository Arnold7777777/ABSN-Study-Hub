<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>A client with social anxiety disorder is working on coping at a new job. Which statements indicate progress? Select all that apply.</title><desc>Progress in social anxiety means gradual exposure to feared situations (systematic desensitization), naming the anxiety while managing it, and refocusing attention away from the fear. Avoidance relieves anxiety briefly but reinforces the disorder.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Social anxiety disorder -</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">evaluating progress</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client with social anxiety disorder is</text><text x="41" y="231" fill="#f6faf5" font-size="21">working on coping at a new job. Which</text><text x="41" y="258" fill="#f6faf5" font-size="21">statements indicate progress? Select all</text><text x="41" y="285" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">&quot;I went to lunch with two coworkers and</text><text x="41" y="417" fill="#f6faf5" font-size="21">focused on the conversation.&quot; · &quot;I&#x27;m still</text><text x="41" y="444" fill="#f6faf5" font-size="21">nervous eating in front of people, but I&#x27;m</text><text x="41" y="471" fill="#f6faf5" font-size="21">working through it.&quot; · &quot;I sat in a coffee</text><text x="41" y="498" fill="#f6faf5" font-size="21">shop by myself for…</text><path d="M319 522v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="538" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 551) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="572" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="603" fill="#f6faf5" font-size="21">Progress in social anxiety means gradual</text><text x="41" y="630" fill="#f6faf5" font-size="21">exposure to feared situations (systematic</text><text x="41" y="657" fill="#f6faf5" font-size="21">desensitization), naming the anxiety while</text><text x="41" y="684" fill="#f6faf5" font-size="21">managing it, and refocusing attention away</text><text x="41" y="711" fill="#f6faf5" font-size="21">from the fear. Avoidance relieves anxiety</text><text x="41" y="738" fill="#f6faf5" font-size="21">briefly but reinforces the disorder.</text></g></svg>