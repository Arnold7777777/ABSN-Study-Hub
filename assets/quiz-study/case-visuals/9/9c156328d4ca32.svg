<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>Which findings are EARLY signs of hypoxia?</title><desc>RAT comes before BED. Early: R estlessness, A nxiety, T achycardia and tachypnea. Late: B radycardia, E xtreme restlessness, D yspnoea. The one to hold on to is that new restlessness or anxiety is hypoxia until proved otherwise - it is often written off as the client being difficult.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which findings are EARLY signs of hypoxia?</text><path d="M319 195v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="211" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 224) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="245" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="276" fill="#f6faf5" font-size="21">Restlessness, anxiety and tachycardia</text><path d="M319 300v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="316" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 329) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="350" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="381" fill="#f6faf5" font-size="21">RAT comes before BED. Early: R</text><text x="41" y="408" fill="#f6faf5" font-size="21">estlessness, A nxiety, T achycardia and</text><text x="41" y="435" fill="#f6faf5" font-size="21">tachypnea. Late: B radycardia, E xtreme</text><text x="41" y="462" fill="#f6faf5" font-size="21">restlessness, D yspnoea. The one to hold</text><text x="41" y="489" fill="#f6faf5" font-size="21">on to is that new restlessness or anxiety</text><text x="41" y="516" fill="#f6faf5" font-size="21">is hypoxia until proved otherwise - it is</text><text x="41" y="543" fill="#f6faf5" font-size="21">often written off as the client being</text><text x="41" y="570" fill="#f6faf5" font-size="21">difficult.</text></g></svg>