<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is caring for an actively dying client who has loud, gurgling respirations. The family is distressed by the sound. Which action should the nurse take first?</title><desc>For TERMINAL SECRETIONS (&#x27;DEATH RATTLE&#x27;), REPOSITIONING THE CLIENT ONTO ONE SIDE WITH THE HEAD ELEVATED is the FIRST and least invasive intervention to allow secretions to drain; anticholinergics such as glycopyrrolate, scopolamine, or atropine may then be given. DEEP SUCTIONING IS USUALLY NOT INDICATED because it causes distress and stimulates additional secretions, and increasing fluids would worsen the secretions.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Terminal Secretions</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for an actively dying</text><text x="41" y="198" fill="#f6faf5" font-size="21">client who has loud, gurgling</text><text x="41" y="225" fill="#f6faf5" font-size="21">respirations. The family is distressed by</text><text x="41" y="252" fill="#f6faf5" font-size="21">the sound. Which action should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">take first?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Reposition the client onto one side with</text><text x="41" y="411" fill="#f6faf5" font-size="21">the head of the bed elevated</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">For TERMINAL SECRETIONS (&#x27;DEATH RATTLE&#x27;),</text><text x="41" y="543" fill="#f6faf5" font-size="21">REPOSITIONING THE CLIENT ONTO ONE SIDE</text><text x="41" y="570" fill="#f6faf5" font-size="21">WITH THE HEAD ELEVATED is the FIRST and</text><text x="41" y="597" fill="#f6faf5" font-size="21">least invasive intervention to allow</text><text x="41" y="624" fill="#f6faf5" font-size="21">secretions to drain;</text></g></svg>