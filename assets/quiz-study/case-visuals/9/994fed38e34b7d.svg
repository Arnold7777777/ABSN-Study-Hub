<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client is pacing, raising his voice, and clenching his fists in the hallway. Which action should the nurse take first?</title><desc>The law and policy require the least restrictive intervention first — verbal de-escalation, reducing stimuli, a walk, or a PRN medication. Restraint and seclusion are used only after less restrictive measures fail and the client is imminently dangerous.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Legal–Ethical Issues &amp; Grief</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is pacing, raising his voice, and</text><text x="41" y="198" fill="#f6faf5" font-size="21">clenching his fists in the hallway. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">action should the nurse take first?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Approach calmly, offer to talk in a</text><text x="41" y="357" fill="#f6faf5" font-size="21">quieter area, and offer the PRN medication</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">The law and policy require the least</text><text x="41" y="489" fill="#f6faf5" font-size="21">restrictive intervention first — verbal</text><text x="41" y="516" fill="#f6faf5" font-size="21">de-escalation, reducing stimuli, a walk,</text><text x="41" y="543" fill="#f6faf5" font-size="21">or a PRN medication. Restraint and</text><text x="41" y="570" fill="#f6faf5" font-size="21">seclusion are used only after less</text><text x="41" y="597" fill="#f6faf5" font-size="21">restrictive measures fail and the client</text><text x="41" y="624" fill="#f6faf5" font-size="21">is imminently dangerous.</text></g></svg>