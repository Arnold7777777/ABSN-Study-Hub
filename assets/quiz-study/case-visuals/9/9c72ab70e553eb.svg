<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client says &quot;I&#x27;m fine, really&quot; while avoiding eye contact, sitting rigidly, and clenching his fists. Which response is BEST?</title><desc>When verbal and nonverbal messages conflict, the nonverbal message is usually the more accurate one; the nurse makes an observation and invites the client to explain. Accepting the words at face value takes the easy exit and misses the real message.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client says &quot;I&#x27;m fine, really&quot; while</text><text x="41" y="231" fill="#f6faf5" font-size="21">avoiding eye contact, sitting rigidly, and</text><text x="41" y="258" fill="#f6faf5" font-size="21">clenching his fists. Which response is</text><text x="41" y="285" fill="#f6faf5" font-size="21">BEST?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">You say you&#x27;re fine, but you look tense to</text><text x="41" y="417" fill="#f6faf5" font-size="21">me. What&#x27;s going on?</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">When verbal and nonverbal messages</text><text x="41" y="549" fill="#f6faf5" font-size="21">conflict, the nonverbal message is usually</text><text x="41" y="576" fill="#f6faf5" font-size="21">the more accurate one; the nurse makes an</text><text x="41" y="603" fill="#f6faf5" font-size="21">observation and invites the client to</text><text x="41" y="630" fill="#f6faf5" font-size="21">explain. Accepting the words at face value</text><text x="41" y="657" fill="#f6faf5" font-size="21">takes the easy exit and misses the real</text><text x="41" y="684" fill="#f6faf5" font-size="21">message.</text></g></svg>