<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="512" viewBox="0 0 640 512"><title>Match each medication used in upper GI disorders on the left with its mechanism of action on the right.</title><desc>Proton pump inhibitors block the H+/K+ ATPase, H2 blockers reduce acid by blocking histamine receptors, sucralfate coats the ulcer to protect it, and antacids neutralize acid already present in the stomach.</desc><rect width="640" height="512" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">medications</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match each medication used in upper GI</text><text x="41" y="198" fill="#f6faf5" font-size="21">disorders on the left with its mechanism</text><text x="41" y="225" fill="#f6faf5" font-size="21">of action on the right.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="222" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">Proton pump inhibitors block the H+/K+</text><text x="41" y="357" fill="#f6faf5" font-size="21">ATPase, H2 blockers reduce acid by</text><text x="41" y="384" fill="#f6faf5" font-size="21">blocking histamine receptors, sucralfate</text><text x="41" y="411" fill="#f6faf5" font-size="21">coats the ulcer to protect it, and</text><text x="41" y="438" fill="#f6faf5" font-size="21">antacids neutralize acid already present</text><text x="41" y="465" fill="#f6faf5" font-size="21">in the stomach.</text></g></svg>