<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client who has been hospitalized for 4 days tells the nurse, &quot;I am in bed 9 hours a night, but I wake up feeling like my body never rested. The aides come in every couple of hours.&quot; The nurse understands that the client is most likely being deprived of which stage of sleep?</title><desc>N3 IS THE DEEP SLOW-WAVE STAGE WHERE PHYSICAL RESTORATION, TISSUE REPAIR, AND GROWTH HORMONE RELEASE OCCUR, so a client deprived of N3 wakes physically unrefreshed. N3 occurs mostly in the first third of the night and is the stage most easily lost to frequent awakenings. REM is tempting, but REM loss produces irritability, poor concentration, and impaired memory consolidation rather than the physical fatigue described.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sleep Stages</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who has been hospitalized for 4</text><text x="41" y="198" fill="#f6faf5" font-size="21">days tells the nurse, &quot;I am in bed 9 hours</text><text x="41" y="225" fill="#f6faf5" font-size="21">a night, but I wake up feeling like my</text><text x="41" y="252" fill="#f6faf5" font-size="21">body never rested.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Stage N3 (slow-wave/deep sleep)</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">N3 IS THE DEEP SLOW-WAVE STAGE WHERE</text><text x="41" y="489" fill="#f6faf5" font-size="21">PHYSICAL RESTORATION, TISSUE REPAIR, AND</text><text x="41" y="516" fill="#f6faf5" font-size="21">GROWTH HORMONE RELEASE OCCUR, so a client</text><text x="41" y="543" fill="#f6faf5" font-size="21">deprived of N3 wakes physically</text><text x="41" y="570" fill="#f6faf5" font-size="21">unrefreshed.</text></g></svg>