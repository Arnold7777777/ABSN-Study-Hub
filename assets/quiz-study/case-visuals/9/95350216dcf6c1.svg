<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client returns from abdominal surgery with significant blood loss. BP is 90/50 mm Hg, heart rate is 120/min, and skin is cool and clammy. Which IV fluid should the nurse anticipate for immediate volume resuscitation?</title><desc>Isotonic 0.9% NaCl stays in the intravascular space, which is exactly what is needed to raise blood pressure after acute blood loss. Hypotonic and dextrose-based fluids leave the bloodstream too quickly and will not restore circulating volume.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">IV Fluid Choice</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client returns from abdominal surgery</text><text x="41" y="198" fill="#f6faf5" font-size="21">with significant blood loss.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">0.9% sodium chloride</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">Isotonic 0.9% NaCl stays in the</text><text x="41" y="435" fill="#f6faf5" font-size="21">intravascular space, which is exactly what</text><text x="41" y="462" fill="#f6faf5" font-size="21">is needed to raise blood pressure after</text><text x="41" y="489" fill="#f6faf5" font-size="21">acute blood loss. Hypotonic and dextrose-</text><text x="41" y="516" fill="#f6faf5" font-size="21">based fluids leave the bloodstream too</text><text x="41" y="543" fill="#f6faf5" font-size="21">quickly and will not restore circulating</text><text x="41" y="570" fill="#f6faf5" font-size="21">volume.</text></g></svg>