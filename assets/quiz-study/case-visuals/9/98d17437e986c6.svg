<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client is admitted with fever and cough attributed to an emerging infectious disease whose route of transmission has not yet been confirmed. What does the nurse do first?</title><desc>Until the route is confirmed, isolate at the most protective level available , then report to public health. Notifying public health first is tempting because reporting is required, but it protects no one while the client sits unisolated with an unknown route.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Infectious Diseases &amp; HIV</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is admitted with fever and cough</text><text x="41" y="198" fill="#f6faf5" font-size="21">attributed to an emerging infectious</text><text x="41" y="225" fill="#f6faf5" font-size="21">disease whose route of transmission has</text><text x="41" y="252" fill="#f6faf5" font-size="21">not yet been confirmed. What does the</text><text x="41" y="279" fill="#f6faf5" font-size="21">nurse do first?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Place the client in the most protective</text><text x="41" y="411" fill="#f6faf5" font-size="21">isolation available</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Until the route is confirmed, isolate at</text><text x="41" y="543" fill="#f6faf5" font-size="21">the most protective level available , then</text><text x="41" y="570" fill="#f6faf5" font-size="21">report to public health. Notifying public</text><text x="41" y="597" fill="#f6faf5" font-size="21">health first is tempting because reporting</text><text x="41" y="624" fill="#f6faf5" font-size="21">is required, but it protects no one while</text><text x="41" y="651" fill="#f6faf5" font-size="21">the client sits unisolated with an unknown</text><text x="41" y="678" fill="#f6faf5" font-size="21">route.</text></g></svg>