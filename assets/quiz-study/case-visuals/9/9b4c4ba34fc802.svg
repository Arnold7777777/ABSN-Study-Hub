<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which clients are at increased risk for shoulder dystocia? Select all that apply.</title><desc>Macrosomia, diabetes, a previous shoulder dystocia and a prolonged second stage all raise the risk. A 34-week fetus is small , which lowers it. The first response is the McRoberts maneuver with suprapubic pressure — never fundal pressure.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which clients are at increased risk for</text><text x="41" y="198" fill="#f6faf5" font-size="21">shoulder dystocia? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">A client with an estimated fetal weight of</text><text x="41" y="330" fill="#f6faf5" font-size="21">4,600 g · A client with poorly controlled</text><text x="41" y="357" fill="#f6faf5" font-size="21">diabetes · A client with a history of</text><text x="41" y="384" fill="#f6faf5" font-size="21">shoulder dystocia · A client with a</text><text x="41" y="411" fill="#f6faf5" font-size="21">prolonged second stage</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Macrosomia, diabetes, a previous shoulder</text><text x="41" y="543" fill="#f6faf5" font-size="21">dystocia and a prolonged second stage all</text><text x="41" y="570" fill="#f6faf5" font-size="21">raise the risk. A 34-week fetus is small ,</text><text x="41" y="597" fill="#f6faf5" font-size="21">which lowers it. The first response is the</text><text x="41" y="624" fill="#f6faf5" font-size="21">McRoberts maneuver with suprapubic</text><text x="41" y="651" fill="#f6faf5" font-size="21">pressure — never fundal pressure.</text></g></svg>