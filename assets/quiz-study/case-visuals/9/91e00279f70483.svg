<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="593" viewBox="0 0 640 593"><title>Match each client presentation to the disorder it best supports.</title><desc>The Cluster A pair separates on thinking: schizoid is a content loner with normal thought, schizotypal is odd with magical thinking and ideas of reference. The Cluster B four separate on what the client wants: borderline fears abandonment (self-harm and splitting), narcissistic wants admiration, antisocial wants to exploit and feels no remorse, histrionic wants attention.</desc><rect width="640" height="593" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match each client presentation to the</text><text x="41" y="198" fill="#f6faf5" font-size="21">disorder it best supports.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="330" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">The Cluster A pair separates on thinking:</text><text x="41" y="330" fill="#f6faf5" font-size="21">schizoid is a content loner with normal</text><text x="41" y="357" fill="#f6faf5" font-size="21">thought, schizotypal is odd with magical</text><text x="41" y="384" fill="#f6faf5" font-size="21">thinking and ideas of reference. The</text><text x="41" y="411" fill="#f6faf5" font-size="21">Cluster B four separate on what the client</text><text x="41" y="438" fill="#f6faf5" font-size="21">wants: borderline fears abandonment (self-</text><text x="41" y="465" fill="#f6faf5" font-size="21">harm and splitting), narcissistic wants</text><text x="41" y="492" fill="#f6faf5" font-size="21">admiration, antisocial wants to exploit</text><text x="41" y="519" fill="#f6faf5" font-size="21">and feels no remorse, histrionic wants</text><text x="41" y="546" fill="#f6faf5" font-size="21">attention.</text></g></svg>