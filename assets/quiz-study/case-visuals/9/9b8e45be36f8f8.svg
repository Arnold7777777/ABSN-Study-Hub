<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A ventilated client in acute respiratory failure has SaO2 88%, RR 32, is agitated and pulling at the ET tube, and ventilator alarms are sounding. Highest priority?</title><desc>With hypoxemia, tachypnea, agitation, and alarms, assess breathing/airway first (ABCs). Don&#x27;t just sedate (masks a low O2 sat), don&#x27;t merely reassure, and don&#x27;t silence the alarm without assessing. Abnormal vitals demand direct assessment.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A ventilated client in acute respiratory</text><text x="41" y="198" fill="#f6faf5" font-size="21">failure has SaO2 88%, RR 32, is agitated</text><text x="41" y="225" fill="#f6faf5" font-size="21">and pulling at the ET tube, and ventilator</text><text x="41" y="252" fill="#f6faf5" font-size="21">alarms are sounding. Highest priority?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Assess the client&#x27;s breathing and airway</text><text x="41" y="384" fill="#f6faf5" font-size="21">status immediately</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">With hypoxemia, tachypnea, agitation, and</text><text x="41" y="516" fill="#f6faf5" font-size="21">alarms, assess breathing/airway first</text><text x="41" y="543" fill="#f6faf5" font-size="21">(ABCs). Don&#x27;t just sedate (masks a low O2</text><text x="41" y="570" fill="#f6faf5" font-size="21">sat), don&#x27;t merely reassure, and don&#x27;t</text><text x="41" y="597" fill="#f6faf5" font-size="21">silence the alarm without assessing.</text><text x="41" y="624" fill="#f6faf5" font-size="21">Abnormal vitals demand direct assessment.</text></g></svg>