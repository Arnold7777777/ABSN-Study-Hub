<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse must obtain a sterile urine specimen for culture from a client who has an indwelling urinary catheter. Which of the following actions should the nurse take?</title><desc>URINE FOR CULTURE IS ASPIRATED FROM THE NEEDLELESS SAMPLING PORT AFTER DISINFECTING IT, WITH THE TUBING BRIEFLY CLAMPED BELOW THE PORT so fresh urine collects. URINE FROM THE DRAINAGE BAG IS NEVER USED FOR CULTURE because it is stagnant and colonized, producing inaccurate results. Disconnecting the catheter from the tubing breaks the closed system and introduces infection risk.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Urinary Specimens</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse must obtain a sterile urine</text><text x="41" y="198" fill="#f6faf5" font-size="21">specimen for culture from a client who has</text><text x="41" y="225" fill="#f6faf5" font-size="21">an indwelling urinary catheter. Which of</text><text x="41" y="252" fill="#f6faf5" font-size="21">the following actions should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">take?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Clamp the tubing below the port, then</text><text x="41" y="411" fill="#f6faf5" font-size="21">cleanse the sampling port with alcohol and</text><text x="41" y="438" fill="#f6faf5" font-size="21">withdraw urine with a syringe</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">URINE FOR CULTURE IS ASPIRATED FROM THE</text><text x="41" y="570" fill="#f6faf5" font-size="21">NEEDLELESS SAMPLING PORT AFTER</text><text x="41" y="597" fill="#f6faf5" font-size="21">DISINFECTING IT, WITH THE TUBING BRIEFLY</text><text x="41" y="624" fill="#f6faf5" font-size="21">CLAMPED BELOW THE PORT so fresh urine</text><text x="41" y="651" fill="#f6faf5" font-size="21">collects.</text></g></svg>