<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>The family of an unresponsive client who is near death is whispering in the hallway. A daughter asks the nurse, &#x27;Should we even bother talking to him anymore?&#x27; Which response by the nurse is most appropriate?</title><desc>HEARING IS BELIEVED TO BE THE LAST SENSE TO BE LOST, so the nurse encourages the family to CONTINUE SPEAKING TO THE CLIENT in a normal tone, identify themselves, and use touch. For the same reason, staff and family should avoid saying anything at the bedside that they would not say if the client were fully awake.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Signs of Approaching Death</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The family of an unresponsive client who</text><text x="41" y="198" fill="#f6faf5" font-size="21">is near death is whispering in the</text><text x="41" y="225" fill="#f6faf5" font-size="21">hallway.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">&#x27;Please keep talking to him. Hearing is</text><text x="41" y="357" fill="#f6faf5" font-size="21">believed to be the last sense to be lost,</text><text x="41" y="384" fill="#f6faf5" font-size="21">so he may still hear your voice.&#x27;</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">HEARING IS BELIEVED TO BE THE LAST SENSE</text><text x="41" y="516" fill="#f6faf5" font-size="21">TO BE LOST, so the nurse encourages the</text><text x="41" y="543" fill="#f6faf5" font-size="21">family to CONTINUE SPEAKING TO THE CLIENT</text><text x="41" y="570" fill="#f6faf5" font-size="21">in a normal tone, identify themselves, and</text><text x="41" y="597" fill="#f6faf5" font-size="21">use touch.</text></g></svg>