<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which goal is realistic and measurable for an older adult identified as being at high risk for falls?</title><desc>This outcome is client-centered and both parts can be observed and measured : falls are counted, and call light use is witnessed. The last option is tempting because it sounds educational, but understand is not measurable; a usable version would say the client will state or demonstrate.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Fall Prevention Goal</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which goal is realistic and measurable for</text><text x="41" y="198" fill="#f6faf5" font-size="21">an older adult identified as being at high</text><text x="41" y="225" fill="#f6faf5" font-size="21">risk for falls?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The client will remain free of falls</text><text x="41" y="357" fill="#f6faf5" font-size="21">during the hospitalization and will use</text><text x="41" y="384" fill="#f6faf5" font-size="21">the call light before getting out of bed</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">This outcome is client-centered and both</text><text x="41" y="516" fill="#f6faf5" font-size="21">parts can be observed and measured : falls</text><text x="41" y="543" fill="#f6faf5" font-size="21">are counted, and call light use is</text><text x="41" y="570" fill="#f6faf5" font-size="21">witnessed. The last option is tempting</text><text x="41" y="597" fill="#f6faf5" font-size="21">because it sounds educational, but</text><text x="41" y="624" fill="#f6faf5" font-size="21">understand is not measurable; a usable</text><text x="41" y="651" fill="#f6faf5" font-size="21">version would say the client will state or</text><text x="41" y="678" fill="#f6faf5" font-size="21">demonstrate.</text></g></svg>