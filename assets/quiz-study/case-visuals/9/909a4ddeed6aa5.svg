<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>A 58-year-old arrives with severe chest pain radiating down the left arm, shortness of breath, diaphoresis and nausea. Which actions and monitoring should the nurse anticipate right away? Select all that apply.</title><desc>These are classic MI cues. The ECG shows ischemia or infarction and the rhythm; troponin released by dying muscle is trended until it peaks; continuous monitoring catches the dysrhythmias (VT, VF) that often follow an MI. Cardioversion is for unstable fast rhythms, and antacids treat GERD.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Suspected MI - immediate actions</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">and monitoring</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A 58-year-old arrives with severe chest</text><text x="41" y="231" fill="#f6faf5" font-size="21">pain radiating down the left arm,</text><text x="41" y="258" fill="#f6faf5" font-size="21">shortness of breath, diaphoresis and</text><text x="41" y="285" fill="#f6faf5" font-size="21">nausea.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Obtain a 12-lead ECG · Draw serial</text><text x="41" y="417" fill="#f6faf5" font-size="21">troponin levels · Place the client on</text><text x="41" y="444" fill="#f6faf5" font-size="21">continuous cardiac monitoring</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">These are classic MI cues. The ECG shows</text><text x="41" y="576" fill="#f6faf5" font-size="21">ischemia or infarction and the rhythm;</text><text x="41" y="603" fill="#f6faf5" font-size="21">troponin released by dying muscle is</text><text x="41" y="630" fill="#f6faf5" font-size="21">trended until it peaks; continuous</text><text x="41" y="657" fill="#f6faf5" font-size="21">monitoring catches the dysrhythmias (VT,</text><text x="41" y="684" fill="#f6faf5" font-size="21">VF) that often follow an MI. Cardioversion</text><text x="41" y="711" fill="#f6faf5" font-size="21">is for unstable fast rhythms, and antacids</text><text x="41" y="738" fill="#f6faf5" font-size="21">treat GERD.</text></g></svg>