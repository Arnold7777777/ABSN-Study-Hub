<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client is brought in after a rattlesnake bite to the right forearm. Which action is correct?</title><desc>Keep her still with the limb at or below heart level, remove jewelry before swelling , and assess edema every 15 to 30 minutes; antivenom is given within 4 to 12 hours. Ice, tourniquets, cutting and elevation are all contraindicated.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Disaster, Mass Casualty &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Emergency Nursing</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client is brought in after a rattlesnake</text><text x="41" y="231" fill="#f6faf5" font-size="21">bite to the right forearm. Which action is</text><text x="41" y="258" fill="#f6faf5" font-size="21">correct?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Immobilize the limb at or below heart</text><text x="41" y="390" fill="#f6faf5" font-size="21">level and remove jewelry</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Keep her still with the limb at or below</text><text x="41" y="522" fill="#f6faf5" font-size="21">heart level, remove jewelry before</text><text x="41" y="549" fill="#f6faf5" font-size="21">swelling , and assess edema every 15 to 30</text><text x="41" y="576" fill="#f6faf5" font-size="21">minutes; antivenom is given within 4 to 12</text><text x="41" y="603" fill="#f6faf5" font-size="21">hours. Ice, tourniquets, cutting and</text><text x="41" y="630" fill="#f6faf5" font-size="21">elevation are all contraindicated.</text></g></svg>