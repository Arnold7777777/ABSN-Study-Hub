<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client has a contaminated abdominal wound that the surgeon intentionally left open for several days to allow drainage before suturing it closed. Which type of wound healing should the nurse document?</title><desc>TERTIARY INTENTION, ALSO CALLED DELAYED PRIMARY CLOSURE, IS USED WHEN A CONTAMINATED OR EDEMATOUS WOUND IS LEFT OPEN AND THEN SURGICALLY CLOSED LATER, and it produces a wider scar. Primary intention describes a clean, approximated surgical incision closed immediately with minimal scarring, and secondary intention describes a wound left open to granulate in from the base without surgical closure.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Wound Healing</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has a contaminated abdominal</text><text x="41" y="198" fill="#f6faf5" font-size="21">wound that the surgeon intentionally left</text><text x="41" y="225" fill="#f6faf5" font-size="21">open for several days to allow drainage</text><text x="41" y="252" fill="#f6faf5" font-size="21">before suturing it closed. Which type of</text><text x="41" y="279" fill="#f6faf5" font-size="21">wound healing should the nurse document?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Tertiary intention</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">TERTIARY INTENTION, ALSO CALLED DELAYED</text><text x="41" y="516" fill="#f6faf5" font-size="21">PRIMARY CLOSURE, IS USED WHEN A</text><text x="41" y="543" fill="#f6faf5" font-size="21">CONTAMINATED OR EDEMATOUS WOUND IS LEFT</text><text x="41" y="570" fill="#f6faf5" font-size="21">OPEN AND THEN SURGICALLY CLOSED LATER, and</text><text x="41" y="597" fill="#f6faf5" font-size="21">it produces a wider scar.</text></g></svg>