<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which nursing actions carry out this plan?</title><desc>Two large-bore lines allow rapid fluid and blood, and NPO status is required before urgent endoscopy. Sitting him up with suction ready protects the airway if he vomits again. Oral iron does nothing during an acute bleed, and oral fluids both delay the procedure and add aspiration risk.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Upper Gastrointestinal Bleed</text><rect x="23" y="106" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which nursing actions carry out this plan?</text><path d="M319 195v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="211" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 224) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="245" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="276" fill="#f6faf5" font-size="21">Insert a second large-bore IV catheter ·</text><text x="41" y="303" fill="#f6faf5" font-size="21">Keep the patient NPO in preparation for</text><text x="41" y="330" fill="#f6faf5" font-size="21">endoscopy · Sit him upright with suction</text><text x="41" y="357" fill="#f6faf5" font-size="21">available at the bedside</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Two large-bore lines allow rapid fluid and</text><text x="41" y="489" fill="#f6faf5" font-size="21">blood, and NPO status is required before</text><text x="41" y="516" fill="#f6faf5" font-size="21">urgent endoscopy. Sitting him up with</text><text x="41" y="543" fill="#f6faf5" font-size="21">suction ready protects the airway if he</text><text x="41" y="570" fill="#f6faf5" font-size="21">vomits again. Oral iron does nothing</text><text x="41" y="597" fill="#f6faf5" font-size="21">during an acute bleed, and oral fluids</text><text x="41" y="624" fill="#f6faf5" font-size="21">both delay the procedure and add</text><text x="41" y="651" fill="#f6faf5" font-size="21">aspiration risk.</text></g></svg>