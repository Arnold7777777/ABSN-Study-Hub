<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="458" viewBox="0 0 640 458"><title>Match each Kubler-Ross stage to the client statement that illustrates it.</title><desc>Remember DABDA . The stages are not linear — clients move back and forth, and not everyone experiences all five, so a client returning to anger after acceptance is not regressing abnormally.</desc><rect width="640" height="458" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match each Kubler-Ross stage to the client</text><text x="41" y="198" fill="#f6faf5" font-size="21">statement that illustrates it.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">Remember DABDA . The stages are not linear</text><text x="41" y="330" fill="#f6faf5" font-size="21">— clients move back and forth, and not</text><text x="41" y="357" fill="#f6faf5" font-size="21">everyone experiences all five, so a client</text><text x="41" y="384" fill="#f6faf5" font-size="21">returning to anger after acceptance is not</text><text x="41" y="411" fill="#f6faf5" font-size="21">regressing abnormally.</text></g></svg>