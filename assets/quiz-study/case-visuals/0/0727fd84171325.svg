<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which statements about the structure of HIV are correct? Select all that apply.</title><desc>HIV is a retrovirus carrying RNA , not DNA - that is the whole reason it needs reverse transcriptase. The spikes are gp120 (attachment) sitting on gp41 (fusion); gp140 is not one of them . All three enzymes travel inside the virus, ready to work the moment it gets in.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">HIV - virology &amp; lifecycle</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which statements about the structure of</text><text x="41" y="198" fill="#f6faf5" font-size="21">HIV are correct? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">HIV is a retrovirus · Surface protein</text><text x="41" y="330" fill="#f6faf5" font-size="21">spikes attach the virus to receptors on</text><text x="41" y="357" fill="#f6faf5" font-size="21">the host cell · Reverse transcriptase,</text><text x="41" y="384" fill="#f6faf5" font-size="21">integrase and protease are carried inside</text><text x="41" y="411" fill="#f6faf5" font-size="21">the virus</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">HIV is a retrovirus carrying RNA , not DNA</text><text x="41" y="543" fill="#f6faf5" font-size="21">- that is the whole reason it needs</text><text x="41" y="570" fill="#f6faf5" font-size="21">reverse transcriptase. The spikes are</text><text x="41" y="597" fill="#f6faf5" font-size="21">gp120 (attachment) sitting on gp41</text><text x="41" y="624" fill="#f6faf5" font-size="21">(fusion); gp140 is not one of them . All</text><text x="41" y="651" fill="#f6faf5" font-size="21">three enzymes travel inside the virus,</text><text x="41" y="678" fill="#f6faf5" font-size="21">ready to work the moment it gets in.</text></g></svg>