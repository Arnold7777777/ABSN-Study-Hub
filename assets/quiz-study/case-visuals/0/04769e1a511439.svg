<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>The nurse taps the facial nerve just in front of a client&#x27;s ear and observes twitching of the lip and cheek. Which electrolyte results should the nurse review?</title><desc>A positive Chvostek&#x27;s sign indicates neuromuscular irritability from low calcium or low magnesium — both signs are seen with LOW values only. Potassium disturbances cause weakness and ECG changes rather than facial twitching on nerve percussion.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Chvostek Sign</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse taps the facial nerve just in</text><text x="41" y="198" fill="#f6faf5" font-size="21">front of a client&#x27;s ear and observes</text><text x="41" y="225" fill="#f6faf5" font-size="21">twitching of the lip and cheek. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">electrolyte results should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">review?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Calcium and magnesium</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A positive Chvostek&#x27;s sign indicates</text><text x="41" y="516" fill="#f6faf5" font-size="21">neuromuscular irritability from low</text><text x="41" y="543" fill="#f6faf5" font-size="21">calcium or low magnesium — both signs are</text><text x="41" y="570" fill="#f6faf5" font-size="21">seen with LOW values only. Potassium</text><text x="41" y="597" fill="#f6faf5" font-size="21">disturbances cause weakness and ECG</text><text x="41" y="624" fill="#f6faf5" font-size="21">changes rather than facial twitching on</text><text x="41" y="651" fill="#f6faf5" font-size="21">nerve percussion.</text></g></svg>