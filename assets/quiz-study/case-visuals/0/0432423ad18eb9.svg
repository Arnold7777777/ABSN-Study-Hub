<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="512" viewBox="0 0 640 512"><title>32. Which nursing responsibilities apply when caring for a client in restraints? (Select all that apply)</title><desc>a, b, c, e, f. All are correct except tying to the side rails — tie to the bed FRAME (the part that moves with the controls). PRN restraint orders are never acceptable; ROM q2h prevents circulatory compromise.</desc><rect width="640" height="512" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">32. Which nursing responsibilities apply</text><text x="41" y="198" fill="#f6faf5" font-size="21">when caring for a client in restraints?</text><text x="41" y="225" fill="#f6faf5" font-size="21">(Select all that apply)</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="222" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">a, b, c, e, f. All are correct except</text><text x="41" y="357" fill="#f6faf5" font-size="21">tying to the side rails — tie to the bed</text><text x="41" y="384" fill="#f6faf5" font-size="21">FRAME (the part that moves with the</text><text x="41" y="411" fill="#f6faf5" font-size="21">controls). PRN restraint orders are never</text><text x="41" y="438" fill="#f6faf5" font-size="21">acceptable; ROM q2h prevents circulatory</text><text x="41" y="465" fill="#f6faf5" font-size="21">compromise.</text></g></svg>