<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>What does reverse transcriptase do?</title><desc>Reverse transcriptase turns RNA into DNA - backwards from the usual direction, which is what &#x27;retro&#x27; means. It is also sloppy, and that error rate is exactly why HIV mutates fast and why resistance appears when doses are missed.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">HIV - virology &amp; lifecycle</text><rect x="23" y="106" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">What does reverse transcriptase do?</text><path d="M319 195v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="211" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 224) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="245" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="276" fill="#f6faf5" font-size="21">Converts viral RNA into viral DNA</text><path d="M319 300v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="316" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 329) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="350" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="381" fill="#f6faf5" font-size="21">Reverse transcriptase turns RNA into DNA -</text><text x="41" y="408" fill="#f6faf5" font-size="21">backwards from the usual direction, which</text><text x="41" y="435" fill="#f6faf5" font-size="21">is what &#x27;retro&#x27; means. It is also sloppy,</text><text x="41" y="462" fill="#f6faf5" font-size="21">and that error rate is exactly why HIV</text><text x="41" y="489" fill="#f6faf5" font-size="21">mutates fast and why resistance appears</text><text x="41" y="516" fill="#f6faf5" font-size="21">when doses are missed.</text></g></svg>