<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client has been in restraints for 45 minutes following an assault on another client. Which finding indicates that the client is ready for release from restraints?</title><desc>Release requires demonstrated behavioral control: the client is calm, cooperative, able to discuss the trigger, and has a plan for the next escalation. A quiet client with closed eyes is the tempting answer because the behavior appears settled, but sleep or silence is not evidence of regained control and clients often re-escalate immediately on release. An angry complaint does not show control, and remaining time on an order is a maximum limit, never a criterion for continuing restraint.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Legal and Ethical: Restraints</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has been in restraints for 45</text><text x="41" y="198" fill="#f6faf5" font-size="21">minutes following an assault on another</text><text x="41" y="225" fill="#f6faf5" font-size="21">client. Which finding indicates that the</text><text x="41" y="252" fill="#f6faf5" font-size="21">client is ready for release from</text><text x="41" y="279" fill="#f6faf5" font-size="21">restraints?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">The client is calm, follows directions,</text><text x="41" y="411" fill="#f6faf5" font-size="21">states what upset him, and agrees to a</text><text x="41" y="438" fill="#f6faf5" font-size="21">plan for managing his anger</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Release requires demonstrated behavioral</text><text x="41" y="570" fill="#f6faf5" font-size="21">control: the client is calm, cooperative,</text><text x="41" y="597" fill="#f6faf5" font-size="21">able to discuss the trigger, and has a</text><text x="41" y="624" fill="#f6faf5" font-size="21">plan for the next escalation.</text></g></svg>