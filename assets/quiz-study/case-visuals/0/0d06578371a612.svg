<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which contraindication should the nurse check for before giving the MMR vaccine?</title><desc>The contraindications are anaphylaxis to neomycin, gelatin or a previous dose , pregnancy, and significant immunosuppression. A mild illness is not a reason to delay - that is one of the commonest missed-vaccination reasons. Note also that after IVIG , live vaccines are deferred for about 11 months .</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which contraindication should the nurse</text><text x="41" y="198" fill="#f6faf5" font-size="21">check for before giving the MMR vaccine?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Anaphylaxis to neomycin or gelatin</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">The contraindications are anaphylaxis to</text><text x="41" y="435" fill="#f6faf5" font-size="21">neomycin, gelatin or a previous dose ,</text><text x="41" y="462" fill="#f6faf5" font-size="21">pregnancy, and significant</text><text x="41" y="489" fill="#f6faf5" font-size="21">immunosuppression. A mild illness is not a</text><text x="41" y="516" fill="#f6faf5" font-size="21">reason to delay - that is one of the</text><text x="41" y="543" fill="#f6faf5" font-size="21">commonest missed-vaccination reasons. Note</text><text x="41" y="570" fill="#f6faf5" font-size="21">also that after IVIG , live vaccines are</text><text x="41" y="597" fill="#f6faf5" font-size="21">deferred for about 11 months .</text></g></svg>