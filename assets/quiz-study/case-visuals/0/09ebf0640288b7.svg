<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>Which finding best shows the intervention worked?</title><desc>The outcome that matters is a client who has regained control and is bargaining rather than shouting, achieved with the least restrictive intervention that worked. Taking the medication was a step in the process and not the result. A normal heart rate and a change of location are consistent with calm but would look the same in someone who was simply worn out.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Agitation, De-escalation, and</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Restraint</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which finding best shows the intervention</text><text x="41" y="231" fill="#f6faf5" font-size="21">worked?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">He is calm and negotiating with staff, and</text><text x="41" y="363" fill="#f6faf5" font-size="21">no restraint or seclusion was needed</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">The outcome that matters is a client who</text><text x="41" y="495" fill="#f6faf5" font-size="21">has regained control and is bargaining</text><text x="41" y="522" fill="#f6faf5" font-size="21">rather than shouting, achieved with the</text><text x="41" y="549" fill="#f6faf5" font-size="21">least restrictive intervention that</text><text x="41" y="576" fill="#f6faf5" font-size="21">worked.</text></g></svg>