<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client has symptomatic sinus bradycardia with a heart rate of 42. Which interventions are appropriate? (SATA)</title><desc>&#x27;Symptomatic&#x27; means the slow rate is impairing perfusion, so act. Atropine (chemical) and transcutaneous pacing (physical) speed the rate; monitor BP/LOC for perfusion and ensure IV access. Trendelenburg isn&#x27;t indicated; amiodarone treats tachydysrhythmias, not bradycardia.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has symptomatic sinus bradycardia</text><text x="41" y="198" fill="#f6faf5" font-size="21">with a heart rate of 42. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">interventions are appropriate? (SATA)</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Administer atropine as ordered · Prepare</text><text x="41" y="357" fill="#f6faf5" font-size="21">for transcutaneous pacing · Monitor blood</text><text x="41" y="384" fill="#f6faf5" font-size="21">pressure and level of consciousness ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Ensure IV access is established</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">&#x27;Symptomatic&#x27; means the slow rate is</text><text x="41" y="543" fill="#f6faf5" font-size="21">impairing perfusion, so act. Atropine</text><text x="41" y="570" fill="#f6faf5" font-size="21">(chemical) and transcutaneous pacing</text><text x="41" y="597" fill="#f6faf5" font-size="21">(physical) speed the rate; monitor BP/LOC</text><text x="41" y="624" fill="#f6faf5" font-size="21">for perfusion and ensure IV access.</text><text x="41" y="651" fill="#f6faf5" font-size="21">Trendelenburg isn&#x27;t indicated; amiodarone</text><text x="41" y="678" fill="#f6faf5" font-size="21">treats tachydysrhythmias, not bradycardia.</text></g></svg>