<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>Which milestone should the nurse expect a 12-month-old to have reached?</title><desc>At 12 months : walks holding a hand, sits from standing, pincer grasp fully developed , tries a 2-block tower, and says 3 to 5 words . Then 18 months - 4-block tower, throws a ball, jumps in place. 2 years - 7-block tower, runs and kicks. 3 years - draws a circle, uses scissors. 4 years - draws a four-sided shape, hops on one foot.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which milestone should the nurse expect a</text><text x="41" y="198" fill="#f6faf5" font-size="21">12-month-old to have reached?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Walking while holding a hand, with a fully</text><text x="41" y="330" fill="#f6faf5" font-size="21">developed pincer grasp and 3 to 5 words</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">At 12 months : walks holding a hand, sits</text><text x="41" y="462" fill="#f6faf5" font-size="21">from standing, pincer grasp fully</text><text x="41" y="489" fill="#f6faf5" font-size="21">developed , tries a 2-block tower, and</text><text x="41" y="516" fill="#f6faf5" font-size="21">says 3 to 5 words .</text></g></svg>