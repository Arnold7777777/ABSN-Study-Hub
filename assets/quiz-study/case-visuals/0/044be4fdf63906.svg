<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Case: a 4-week-old who vomits forcefully after feeds. Each finding may support more than one disease process. Which findings are consistent with gastroenteritis? (Select all that apply.)</title><desc>Viral gastroenteritis causes vomiting, loose stool and weight loss and spreads through sick contacts . An abdominal mass points to intussusception or pyloric stenosis, and a child who stays hungry suggests pyloric stenosis.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Gastrointestinal</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Case: a 4-week-old who vomits forcefully</text><text x="41" y="198" fill="#f6faf5" font-size="21">after feeds. Each finding may support more</text><text x="41" y="225" fill="#f6faf5" font-size="21">than one disease process. Which findings</text><text x="41" y="252" fill="#f6faf5" font-size="21">are consistent with gastroenteritis?</text><text x="41" y="279" fill="#f6faf5" font-size="21">(Select all that apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Vomiting · Weight loss · Loose stool ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Exposure to sick contacts</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Viral gastroenteritis causes vomiting,</text><text x="41" y="543" fill="#f6faf5" font-size="21">loose stool and weight loss and spreads</text><text x="41" y="570" fill="#f6faf5" font-size="21">through sick contacts . An abdominal mass</text><text x="41" y="597" fill="#f6faf5" font-size="21">points to intussusception or pyloric</text><text x="41" y="624" fill="#f6faf5" font-size="21">stenosis, and a child who stays hungry</text><text x="41" y="651" fill="#f6faf5" font-size="21">suggests pyloric stenosis.</text></g></svg>