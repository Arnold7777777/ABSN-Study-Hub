<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse needs the most accurate reflection of core temperature for a client whose temperature readings have been inconsistent. Which route should the nurse select, assuming no contraindications?</title><desc>Of the routine noninvasive routes, rectal measurement most closely reflects core temperature. Axillary is the tempting choice for a squirming or confused client because it is easy and safe, but it is the least accurate route and lags behind true core temperature.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Temperature Routes</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse needs the most accurate reflection</text><text x="41" y="198" fill="#f6faf5" font-size="21">of core temperature for a client whose</text><text x="41" y="225" fill="#f6faf5" font-size="21">temperature readings have been</text><text x="41" y="252" fill="#f6faf5" font-size="21">inconsistent. Which route should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">select, assuming no contraindications?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Rectal</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Of the routine noninvasive routes, rectal</text><text x="41" y="516" fill="#f6faf5" font-size="21">measurement most closely reflects core</text><text x="41" y="543" fill="#f6faf5" font-size="21">temperature. Axillary is the tempting</text><text x="41" y="570" fill="#f6faf5" font-size="21">choice for a squirming or confused client</text><text x="41" y="597" fill="#f6faf5" font-size="21">because it is easy and safe, but it is the</text><text x="41" y="624" fill="#f6faf5" font-size="21">least accurate route and lags behind true</text><text x="41" y="651" fill="#f6faf5" font-size="21">core temperature.</text></g></svg>