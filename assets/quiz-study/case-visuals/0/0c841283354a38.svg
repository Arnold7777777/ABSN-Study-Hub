<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>An Rh-negative client has a miscarriage at 10 weeks. Within what time should Rh immune globulin be given?</title><desc>Rh immune globulin is given within 72 hours of any sensitizing event — miscarriage, ectopic pregnancy, bleeding, amniocentesis, trauma or birth — to prevent antibodies that would attack a future Rh-positive fetus. It is a blood product, so it is verified as one.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">An Rh-negative client has a miscarriage at</text><text x="41" y="231" fill="#f6faf5" font-size="21">10 weeks. Within what time should Rh</text><text x="41" y="258" fill="#f6faf5" font-size="21">immune globulin be given?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Within 72 hours</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">Rh immune globulin is given within 72</text><text x="41" y="495" fill="#f6faf5" font-size="21">hours of any sensitizing event —</text><text x="41" y="522" fill="#f6faf5" font-size="21">miscarriage, ectopic pregnancy, bleeding,</text><text x="41" y="549" fill="#f6faf5" font-size="21">amniocentesis, trauma or birth — to</text><text x="41" y="576" fill="#f6faf5" font-size="21">prevent antibodies that would attack a</text><text x="41" y="603" fill="#f6faf5" font-size="21">future Rh-positive fetus. It is a blood</text><text x="41" y="630" fill="#f6faf5" font-size="21">product, so it is verified as one.</text></g></svg>