<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A nurse is teaching a student about the signs of pregnancy. Which findings are probable signs? Select all that apply.</title><desc>Probable signs are objective findings the examiner can observe that still have other possible causes : Chadwick, Goodell and Hegar signs, ballottement, Braxton Hicks contractions and a positive pregnancy test. Quickening is presumptive because only the client feels it, and fetal heart tones are a positive sign because only a fetus produces them.</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is teaching a student about the</text><text x="41" y="231" fill="#f6faf5" font-size="21">signs of pregnancy. Which findings are</text><text x="41" y="258" fill="#f6faf5" font-size="21">probable signs? Select all that apply.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Braxton Hicks contractions · Positive</text><text x="41" y="390" fill="#f6faf5" font-size="21">urine pregnancy test · Ballottement felt</text><text x="41" y="417" fill="#f6faf5" font-size="21">by the examiner · Softening of the cervix</text><text x="41" y="444" fill="#f6faf5" font-size="21">(Goodell sign) · Bluish discoloration of</text><text x="41" y="471" fill="#f6faf5" font-size="21">the cervix (Chadwick sign)</text><path d="M319 495v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="511" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 524) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="545" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="576" fill="#f6faf5" font-size="21">Probable signs are objective findings the</text><text x="41" y="603" fill="#f6faf5" font-size="21">examiner can observe that still have other</text><text x="41" y="630" fill="#f6faf5" font-size="21">possible causes : Chadwick, Goodell and</text><text x="41" y="657" fill="#f6faf5" font-size="21">Hegar signs, ballottement, Braxton Hicks</text><text x="41" y="684" fill="#f6faf5" font-size="21">contractions and a positive pregnancy</text><text x="41" y="711" fill="#f6faf5" font-size="21">test.</text></g></svg>