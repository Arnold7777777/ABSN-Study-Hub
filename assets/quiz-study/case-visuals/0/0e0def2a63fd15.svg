<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client with a history of Graves&#x27; disease has a temperature of 38.6 °C (101.5 °F), a heart rate of 160, agitation and confusion. Which finding most suggests thyroid storm rather than sepsis alone?</title><desc>Both cause fever, tachycardia and altered mental status. Tachycardia out of proportion to the fever , with a hyperthyroid history, points to thyroid storm . Infection is also a common trigger of storm, so the two can occur together.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Endocrine Disorders</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with a history of Graves&#x27; disease</text><text x="41" y="198" fill="#f6faf5" font-size="21">has a temperature of 38.6 °C (101.5 °F), a</text><text x="41" y="225" fill="#f6faf5" font-size="21">heart rate of 160, agitation and</text><text x="41" y="252" fill="#f6faf5" font-size="21">confusion. Which finding most suggests</text><text x="41" y="279" fill="#f6faf5" font-size="21">thyroid storm rather than sepsis alone?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">A heart rate far higher than the fever</text><text x="41" y="411" fill="#f6faf5" font-size="21">would explain, in a client with a thyroid</text><text x="41" y="438" fill="#f6faf5" font-size="21">history</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Both cause fever, tachycardia and altered</text><text x="41" y="570" fill="#f6faf5" font-size="21">mental status. Tachycardia out of</text><text x="41" y="597" fill="#f6faf5" font-size="21">proportion to the fever , with a</text><text x="41" y="624" fill="#f6faf5" font-size="21">hyperthyroid history, points to thyroid</text><text x="41" y="651" fill="#f6faf5" font-size="21">storm . Infection is also a common trigger</text><text x="41" y="678" fill="#f6faf5" font-size="21">of storm, so the two can occur together.</text></g></svg>