<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A client has completed 5 days of antibiotic therapy for a surgical wound infection. Which finding indicates the therapy was effective?</title><desc>A normal temperature, a normal white blood cell count, and serous rather than purulent drainage together confirm the infection has resolved. Slightly decreased purulent drainage is the tempting choice because it shows some improvement, but any remaining pus means the infection is still active.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Antibiotic Effectiveness</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has completed 5 days of</text><text x="41" y="198" fill="#f6faf5" font-size="21">antibiotic therapy for a surgical wound</text><text x="41" y="225" fill="#f6faf5" font-size="21">infection. Which finding indicates the</text><text x="41" y="252" fill="#f6faf5" font-size="21">therapy was effective?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">The temperature is 98.8 F, the white blood</text><text x="41" y="384" fill="#f6faf5" font-size="21">cell count is 8,000/mm3, and there is</text><text x="41" y="411" fill="#f6faf5" font-size="21">scant serous drainage</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A normal temperature, a normal white blood</text><text x="41" y="543" fill="#f6faf5" font-size="21">cell count, and serous rather than</text><text x="41" y="570" fill="#f6faf5" font-size="21">purulent drainage together confirm the</text><text x="41" y="597" fill="#f6faf5" font-size="21">infection has resolved. Slightly decreased</text><text x="41" y="624" fill="#f6faf5" font-size="21">purulent drainage is the tempting choice</text><text x="41" y="651" fill="#f6faf5" font-size="21">because it shows some improvement, but any</text><text x="41" y="678" fill="#f6faf5" font-size="21">remaining pus means the infection is still</text><text x="41" y="705" fill="#f6faf5" font-size="21">active.</text></g></svg>