<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A client at 41 weeks has been in active labor for 13 hours with adequate contractions. There has been no cervical change and the fetal head remains at 0 station. Which action should the nurse take?</title><desc>Adequate contractions with no cervical change and no descent point to cephalopelvic disproportion, so the nurse notifies the provider and anticipates cesarean birth . Adding more oxytocin is the tempting choice, but the contractions are already adequate — the pelvis, not the power, is the problem.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client at 41 weeks has been in active</text><text x="41" y="198" fill="#f6faf5" font-size="21">labor for 13 hours with adequate</text><text x="41" y="225" fill="#f6faf5" font-size="21">contractions. There has been no cervical</text><text x="41" y="252" fill="#f6faf5" font-size="21">change and the fetal head remains at 0</text><text x="41" y="279" fill="#f6faf5" font-size="21">station. Which action should the nurse</text><text x="41" y="306" fill="#f6faf5" font-size="21">take?</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">Notify the provider and anticipate</text><text x="41" y="438" fill="#f6faf5" font-size="21">preparation for cesarean birth</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Adequate contractions with no cervical</text><text x="41" y="570" fill="#f6faf5" font-size="21">change and no descent point to</text><text x="41" y="597" fill="#f6faf5" font-size="21">cephalopelvic disproportion, so the nurse</text><text x="41" y="624" fill="#f6faf5" font-size="21">notifies the provider and anticipates</text><text x="41" y="651" fill="#f6faf5" font-size="21">cesarean birth . Adding more oxytocin is</text><text x="41" y="678" fill="#f6faf5" font-size="21">the tempting choice, but the contractions</text><text x="41" y="705" fill="#f6faf5" font-size="21">are already adequate — the pelvis, not the</text><text x="41" y="732" fill="#f6faf5" font-size="21">power, is the problem.</text></g></svg>