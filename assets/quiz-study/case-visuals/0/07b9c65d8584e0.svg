<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>Match each ethical principle to the nursing situation that illustrates it.</title><desc>Nonmaleficence = do no harm ; beneficence = do good — these two are the classic mix-up. Fidelity , the sixth principle, means keeping promises and commitments to the client, such as returning at the time you said you would.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match each ethical principle to the</text><text x="41" y="198" fill="#f6faf5" font-size="21">nursing situation that illustrates it.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="222" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">Nonmaleficence = do no harm ; beneficence</text><text x="41" y="330" fill="#f6faf5" font-size="21">= do good — these two are the classic mix-</text><text x="41" y="357" fill="#f6faf5" font-size="21">up. Fidelity , the sixth principle, means</text><text x="41" y="384" fill="#f6faf5" font-size="21">keeping promises and commitments to the</text><text x="41" y="411" fill="#f6faf5" font-size="21">client, such as returning at the time you</text><text x="41" y="438" fill="#f6faf5" font-size="21">said you would.</text></g></svg>