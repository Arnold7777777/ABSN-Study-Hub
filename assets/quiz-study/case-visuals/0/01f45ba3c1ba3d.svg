<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="599" viewBox="0 0 640 599"><title>Nurse&#x27;s note from an intake interview at a first prenatal visit. Select the findings that represent nutrition-related risk factors.</title><desc>Adolescence, a strict vegetarian diet (which can run low in protein, iron, calcium, and vitamin B12), pica (craving nonfood items like ice or laundry starch), and inconsistent prenatal vitamin use are all nutrition-related risk factors described in the book. Being pregnant for the first time, working part-time, having an expected prepregnancy weight, and living with supportive family nearby are neutral or reassuring details that do not represent nutrition risk on their own.</desc><rect width="640" height="599" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nutrition &amp; Health Promotion in</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Nurse&#x27;s note from an intake interview at a</text><text x="41" y="231" fill="#f6faf5" font-size="21">first prenatal visit. Select the findings</text><text x="41" y="258" fill="#f6faf5" font-size="21">that represent nutrition-related risk</text><text x="41" y="285" fill="#f6faf5" font-size="21">factors.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="249" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="390" fill="#f6faf5" font-size="21">Adolescence, a strict vegetarian diet</text><text x="41" y="417" fill="#f6faf5" font-size="21">(which can run low in protein, iron,</text><text x="41" y="444" fill="#f6faf5" font-size="21">calcium, and vitamin B12), pica (craving</text><text x="41" y="471" fill="#f6faf5" font-size="21">nonfood items like ice or laundry starch),</text><text x="41" y="498" fill="#f6faf5" font-size="21">and inconsistent prenatal vitamin use are</text><text x="41" y="525" fill="#f6faf5" font-size="21">all nutrition-related risk factors</text><text x="41" y="552" fill="#f6faf5" font-size="21">described in the book.</text></g></svg>