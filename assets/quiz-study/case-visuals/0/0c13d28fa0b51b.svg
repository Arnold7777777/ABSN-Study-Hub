<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A 78-year-old client who takes warfarin falls at home and is diagnosed with a subdural hematoma. The INR is 5.8 (normal about 1.0; the usual goal on warfarin is 2 to 3). Which medication does the nurse anticipate giving?</title><desc>An INR well above the 2 to 3 target means the warfarin effect is too high and the bleed will keep expanding; warfarin is reversed with vitamin K (often with prothrombin complex concentrate). Protamine reverses heparin, not warfarin, and alteplase and enoxaparin would make the bleeding worse.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic Dysfunction &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Cerebrovascular Disorders</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A 78-year-old client who takes warfarin</text><text x="41" y="231" fill="#f6faf5" font-size="21">falls at home and is diagnosed with a</text><text x="41" y="258" fill="#f6faf5" font-size="21">subdural hematoma.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Vitamin K (phytonadione)</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">An INR well above the 2 to 3 target means</text><text x="41" y="495" fill="#f6faf5" font-size="21">the warfarin effect is too high and the</text><text x="41" y="522" fill="#f6faf5" font-size="21">bleed will keep expanding; warfarin is</text><text x="41" y="549" fill="#f6faf5" font-size="21">reversed with vitamin K (often with</text><text x="41" y="576" fill="#f6faf5" font-size="21">prothrombin complex concentrate).</text><text x="41" y="603" fill="#f6faf5" font-size="21">Protamine reverses heparin, not warfarin,</text><text x="41" y="630" fill="#f6faf5" font-size="21">and alteplase and enoxaparin would make</text><text x="41" y="657" fill="#f6faf5" font-size="21">the bleeding worse.</text></g></svg>