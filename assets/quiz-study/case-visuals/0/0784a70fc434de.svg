<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which approach by the nurse best reflects the principles of adult learning?</title><desc>Adults identify what they need to learn, build on prior experience, and engage more when goals are mutual, so collaborative goal setting is the strongest approach. A single long session is tempting because it seems efficient, but it exceeds attention span and does not allow for feedback or practice.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Adult Learners</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which approach by the nurse best reflects</text><text x="41" y="198" fill="#f6faf5" font-size="21">the principles of adult learning?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Set goals together with the client and</text><text x="41" y="330" fill="#f6faf5" font-size="21">connect new content to past experiences</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Adults identify what they need to learn,</text><text x="41" y="462" fill="#f6faf5" font-size="21">build on prior experience, and engage more</text><text x="41" y="489" fill="#f6faf5" font-size="21">when goals are mutual, so collaborative</text><text x="41" y="516" fill="#f6faf5" font-size="21">goal setting is the strongest approach. A</text><text x="41" y="543" fill="#f6faf5" font-size="21">single long session is tempting because it</text><text x="41" y="570" fill="#f6faf5" font-size="21">seems efficient, but it exceeds attention</text><text x="41" y="597" fill="#f6faf5" font-size="21">span and does not allow for feedback or</text><text x="41" y="624" fill="#f6faf5" font-size="21">practice.</text></g></svg>