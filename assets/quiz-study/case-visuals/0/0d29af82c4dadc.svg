<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>When assessing for substances that are known to harm workers&#x27; lungs, the occupational health nurse should assess their potential exposure to which of the following?</title><desc>Pneumoconiosis is a general term given to any lung disease caused by dusts that are breathed in and then deposited deep in the lungs causing damage. Pneumoconiosis is usually considered an occupational lung disease, and includes asbestosis, silicosis, and coal workers’ pneumoconiosis, also known as “Black Lung Disease.” Asbestos is among the more common causes of pneumoconiosis. Organic acids, solvents, and gypsum do not have this effect.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 5 · General Respiratory</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">When assessing for substances that are</text><text x="41" y="198" fill="#f6faf5" font-size="21">known to harm workers&#x27; lungs, the</text><text x="41" y="225" fill="#f6faf5" font-size="21">occupational health nurse should assess</text><text x="41" y="252" fill="#f6faf5" font-size="21">their potential exposure to which of the</text><text x="41" y="279" fill="#f6faf5" font-size="21">following?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Asbestos</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Pneumoconiosis is a general term given to</text><text x="41" y="516" fill="#f6faf5" font-size="21">any lung disease caused by dusts that are</text><text x="41" y="543" fill="#f6faf5" font-size="21">breathed in and then deposited deep in the</text><text x="41" y="570" fill="#f6faf5" font-size="21">lungs causing damage.</text></g></svg>