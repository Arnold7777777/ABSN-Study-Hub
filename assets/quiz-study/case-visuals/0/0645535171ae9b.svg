<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client admitted with an upper GI hemorrhage has BP 78/50 mm Hg, HR 132/min, RR 28/min, urine output 10 mL/hr, Hgb 8.2 g/dL and Hct 25%. Which intervention does the nurse anticipate first?</title><desc>A low H&amp;H signals active bleeding, so the treatment is fixing the cause plus fluids, with blood products for the hemorrhage. Norepinephrine is tempting because the MAP is low, but pressors come only after fluids fail, and oxygen alone does not treat the underlying volume loss.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Shock &amp; MODS</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client admitted with an upper GI</text><text x="41" y="198" fill="#f6faf5" font-size="21">hemorrhage has BP 78/50 mm Hg, HR 132/min,</text><text x="41" y="225" fill="#f6faf5" font-size="21">RR 28/min, urine output 10 mL/hr, Hgb 8.2</text><text x="41" y="252" fill="#f6faf5" font-size="21">g/dL and Hct 25%. Which intervention does</text><text x="41" y="279" fill="#f6faf5" font-size="21">the nurse anticipate first?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Rapid isotonic crystalloid, with blood</text><text x="41" y="411" fill="#f6faf5" font-size="21">products because bleeding is ongoing</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A low H&amp;H signals active bleeding, so the</text><text x="41" y="543" fill="#f6faf5" font-size="21">treatment is fixing the cause plus fluids,</text><text x="41" y="570" fill="#f6faf5" font-size="21">with blood products for the hemorrhage.</text><text x="41" y="597" fill="#f6faf5" font-size="21">Norepinephrine is tempting because the MAP</text><text x="41" y="624" fill="#f6faf5" font-size="21">is low, but pressors come only after</text><text x="41" y="651" fill="#f6faf5" font-size="21">fluids fail, and oxygen alone does not</text><text x="41" y="678" fill="#f6faf5" font-size="21">treat the underlying volume loss.</text></g></svg>