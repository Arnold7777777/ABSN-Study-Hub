<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client in a manic episode speaks very rapidly, jumping from the weather to a business plan to a song lyric, with loose connections between topics. The nurse documents:</title><desc>Flight of ideas is fragmented shifting thought that is always accompanied by an increased rate of speech, classically in mania. Circumstantial thinking is slow and over-detailed, not pressured.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Response to Illness &amp; Mental-</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Health Assessment</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client in a manic episode speaks very</text><text x="41" y="231" fill="#f6faf5" font-size="21">rapidly, jumping from the weather to a</text><text x="41" y="258" fill="#f6faf5" font-size="21">business plan to a song lyric, with loose</text><text x="41" y="285" fill="#f6faf5" font-size="21">connections between topics. The nurse</text><text x="41" y="312" fill="#f6faf5" font-size="21">documents:</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Flight of ideas</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Flight of ideas is fragmented shifting</text><text x="41" y="549" fill="#f6faf5" font-size="21">thought that is always accompanied by an</text><text x="41" y="576" fill="#f6faf5" font-size="21">increased rate of speech, classically in</text><text x="41" y="603" fill="#f6faf5" font-size="21">mania. Circumstantial thinking is slow and</text><text x="41" y="630" fill="#f6faf5" font-size="21">over-detailed, not pressured.</text></g></svg>