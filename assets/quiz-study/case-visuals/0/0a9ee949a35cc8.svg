<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client is prescribed a benzodiazepine for severe anxiety. The nurse explains that this class of drug works by increasing the function of which neurotransmitter?</title><desc>Benzodiazepines enhance GABA, the inhibitory transmitter — more inhibition → less anxiety and more sedation. Dopamine is the wrong target; blocking dopamine treats psychosis, not anxiety.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Foundations, Neurobiology &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Psychopharm Basics</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client is prescribed a benzodiazepine</text><text x="41" y="231" fill="#f6faf5" font-size="21">for severe anxiety. The nurse explains</text><text x="41" y="258" fill="#f6faf5" font-size="21">that this class of drug works by</text><text x="41" y="285" fill="#f6faf5" font-size="21">increasing the function of which</text><text x="41" y="312" fill="#f6faf5" font-size="21">neurotransmitter?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">GABA</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Benzodiazepines enhance GABA, the</text><text x="41" y="549" fill="#f6faf5" font-size="21">inhibitory transmitter — more inhibition →</text><text x="41" y="576" fill="#f6faf5" font-size="21">less anxiety and more sedation. Dopamine</text><text x="41" y="603" fill="#f6faf5" font-size="21">is the wrong target; blocking dopamine</text><text x="41" y="630" fill="#f6faf5" font-size="21">treats psychosis, not anxiety.</text></g></svg>