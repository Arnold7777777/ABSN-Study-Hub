<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A client asks why buspirone is not helping her anxiety after taking it PRN for 4 days. Which explanation should the nurse give?</title><desc>ATI&#x27;s number is 3 to 4 weeks (your guide said 2–4 — it is corrected now). Buspirone is scheduled daily, not PRN, and not for acute anxiety or panic . It is also not a controlled/scheduled medication , causes no dependence , and needs no taper when stopped. Avoid grapefruit juice — it inhibits CYP3A4 and raises the level.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anxiety: Severe Anxiety</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client asks why buspirone is not helping</text><text x="41" y="198" fill="#f6faf5" font-size="21">her anxiety after taking it PRN for 4</text><text x="41" y="225" fill="#f6faf5" font-size="21">days. Which explanation should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">give?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;Buspirone takes 3 to 4 weeks to work and</text><text x="41" y="384" fill="#f6faf5" font-size="21">must be taken on a schedule, not as</text><text x="41" y="411" fill="#f6faf5" font-size="21">needed.&quot;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">ATI&#x27;s number is 3 to 4 weeks (your guide</text><text x="41" y="543" fill="#f6faf5" font-size="21">said 2–4 — it is corrected now).</text></g></svg>