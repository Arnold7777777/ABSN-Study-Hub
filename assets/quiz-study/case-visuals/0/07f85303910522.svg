<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A nurse palpates the fundus of a pregnant client and finds it midway between the symphysis pubis and the umbilicus. Which gestational age does this finding best support?</title><desc>The fundus sits just above the symphysis at 12 weeks, midway to the umbilicus at 16 weeks , and reaches the xiphoid by 36 weeks. Twelve weeks tempts students because that is when the fundus first becomes palpable, but at that point it is at the symphysis, not midway up.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse palpates the fundus of a pregnant</text><text x="41" y="231" fill="#f6faf5" font-size="21">client and finds it midway between the</text><text x="41" y="258" fill="#f6faf5" font-size="21">symphysis pubis and the umbilicus. Which</text><text x="41" y="285" fill="#f6faf5" font-size="21">gestational age does this finding best</text><text x="41" y="312" fill="#f6faf5" font-size="21">support?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">16 weeks</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">The fundus sits just above the symphysis</text><text x="41" y="549" fill="#f6faf5" font-size="21">at 12 weeks, midway to the umbilicus at 16</text><text x="41" y="576" fill="#f6faf5" font-size="21">weeks , and reaches the xiphoid by 36</text><text x="41" y="603" fill="#f6faf5" font-size="21">weeks. Twelve weeks tempts students</text><text x="41" y="630" fill="#f6faf5" font-size="21">because that is when the fundus first</text><text x="41" y="657" fill="#f6faf5" font-size="21">becomes palpable, but at that point it is</text><text x="41" y="684" fill="#f6faf5" font-size="21">at the symphysis, not midway up.</text></g></svg>