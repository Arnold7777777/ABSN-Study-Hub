<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client with a new ICD asks, &#x27;How will I know if my device is working properly?&#x27; Best nurse response?</title><desc>Remote monitoring plus scheduled follow-ups is the standard, accurate way ICDs are tracked. Feeling a shock is NOT a normal sign of function — it means a dangerous rhythm was detected (or a malfunction). The other options are inaccurate.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with a new ICD asks, &#x27;How will I</text><text x="41" y="198" fill="#f6faf5" font-size="21">know if my device is working properly?&#x27;</text><text x="41" y="225" fill="#f6faf5" font-size="21">Best nurse response?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Scheduled follow-ups and remote monitoring</text><text x="41" y="357" fill="#f6faf5" font-size="21">will track its performance</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Remote monitoring plus scheduled follow-</text><text x="41" y="489" fill="#f6faf5" font-size="21">ups is the standard, accurate way ICDs are</text><text x="41" y="516" fill="#f6faf5" font-size="21">tracked. Feeling a shock is NOT a normal</text><text x="41" y="543" fill="#f6faf5" font-size="21">sign of function — it means a dangerous</text><text x="41" y="570" fill="#f6faf5" font-size="21">rhythm was detected (or a malfunction).</text><text x="41" y="597" fill="#f6faf5" font-size="21">The other options are inaccurate.</text></g></svg>