<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which interventions should the nurse anticipate for a client with bleeding esophageal varices? Select all that apply.</title><desc>Bleeding varices carry high mortality, so care is large-bore IV access, oxygen, blood products, vasoactive drugs, and endoscopic banding. Oral fluids are contraindicated in an actively vomiting client, and a hemorrhaging client is never left unattended.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Esophageal Varices</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which interventions should the nurse</text><text x="41" y="198" fill="#f6faf5" font-size="21">anticipate for a client with bleeding</text><text x="41" y="225" fill="#f6faf5" font-size="21">esophageal varices? Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Insert two large-bore IV catheters ·</text><text x="41" y="357" fill="#f6faf5" font-size="21">Administer oxygen · Prepare for endoscopic</text><text x="41" y="384" fill="#f6faf5" font-size="21">band ligation · Administer blood products</text><text x="41" y="411" fill="#f6faf5" font-size="21">as prescribed</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Bleeding varices carry high mortality, so</text><text x="41" y="543" fill="#f6faf5" font-size="21">care is large-bore IV access, oxygen,</text><text x="41" y="570" fill="#f6faf5" font-size="21">blood products, vasoactive drugs, and</text><text x="41" y="597" fill="#f6faf5" font-size="21">endoscopic banding. Oral fluids are</text><text x="41" y="624" fill="#f6faf5" font-size="21">contraindicated in an actively vomiting</text><text x="41" y="651" fill="#f6faf5" font-size="21">client, and a hemorrhaging client is never</text><text x="41" y="678" fill="#f6faf5" font-size="21">left unattended.</text></g></svg>