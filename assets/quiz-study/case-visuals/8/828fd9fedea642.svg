<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client is admitted to the emergency department after a car accident but does not remember anything about it. The client is unconsciously using which defense mechanism?</title><desc>Repression is the UNCONSCIOUS blocking of painful memories or thoughts from awareness. The client has no memory of the accident — this is not a conscious choice (that would be suppression). Undoing involves symbolic acts to cancel a wrongdoing. Rationalization uses logic to justify behavior.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is admitted to the emergency</text><text x="41" y="198" fill="#f6faf5" font-size="21">department after a car accident but does</text><text x="41" y="225" fill="#f6faf5" font-size="21">not remember anything about it. The client</text><text x="41" y="252" fill="#f6faf5" font-size="21">is unconsciously using which defense</text><text x="41" y="279" fill="#f6faf5" font-size="21">mechanism?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Repression</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Repression is the UNCONSCIOUS blocking of</text><text x="41" y="516" fill="#f6faf5" font-size="21">painful memories or thoughts from</text><text x="41" y="543" fill="#f6faf5" font-size="21">awareness. The client has no memory of the</text><text x="41" y="570" fill="#f6faf5" font-size="21">accident — this is not a conscious choice</text><text x="41" y="597" fill="#f6faf5" font-size="21">(that would be suppression). Undoing</text><text x="41" y="624" fill="#f6faf5" font-size="21">involves symbolic acts to cancel a</text><text x="41" y="651" fill="#f6faf5" font-size="21">wrongdoing. Rationalization uses logic to</text><text x="41" y="678" fill="#f6faf5" font-size="21">justify behavior.</text></g></svg>