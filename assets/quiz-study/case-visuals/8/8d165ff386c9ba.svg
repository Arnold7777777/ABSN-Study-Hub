<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is assessing pain in an alert adult client 2 hours after abdominal surgery. Which assessment finding is the most reliable indicator of the client&#x27;s pain?</title><desc>PAIN IS THE FIFTH VITAL SIGN, AND THE CLIENT&#x27;S SELF-REPORT IS ALWAYS THE MOST RELIABLE INDICATOR OF PAIN. Vital sign changes are unreliable because they normalize with ongoing pain even when pain persists. Behaviors such as watching television or sleeping are distraction and coping mechanisms and must never be used to discount a client&#x27;s reported pain.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Pain as Fifth Vital Sign</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assessing pain in an alert</text><text x="41" y="198" fill="#f6faf5" font-size="21">adult client 2 hours after abdominal</text><text x="41" y="225" fill="#f6faf5" font-size="21">surgery. Which assessment finding is the</text><text x="41" y="252" fill="#f6faf5" font-size="21">most reliable indicator of the client&#x27;s</text><text x="41" y="279" fill="#f6faf5" font-size="21">pain?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">The client&#x27;s self-report of pain rated 7</text><text x="41" y="411" fill="#f6faf5" font-size="21">on a 0 to 10 scale</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">PAIN IS THE FIFTH VITAL SIGN, AND THE</text><text x="41" y="543" fill="#f6faf5" font-size="21">CLIENT&#x27;S SELF-REPORT IS ALWAYS THE MOST</text><text x="41" y="570" fill="#f6faf5" font-size="21">RELIABLE INDICATOR OF PAIN.</text></g></svg>