<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client states that his food is being poisoned. Which nursing approaches are appropriate? Select all that apply.</title><desc>With delusions: focus on feelings and present reality. Never argue or try to prove the belief wrong, and never reinforce it by exploring its details or acting on it. Arguing does not change the belief — it only costs the nurse trust.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client states that his food is being</text><text x="41" y="231" fill="#f6faf5" font-size="21">poisoned. Which nursing approaches are</text><text x="41" y="258" fill="#f6faf5" font-size="21">appropriate? Select all that apply.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Focus on the feeling behind the belief ·</text><text x="41" y="390" fill="#f6faf5" font-size="21">Present reality calmly, without arguing ·</text><text x="41" y="417" fill="#f6faf5" font-size="21">Acknowledge that the belief is frightening</text><text x="41" y="444" fill="#f6faf5" font-size="21">for him</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">With delusions: focus on feelings and</text><text x="41" y="576" fill="#f6faf5" font-size="21">present reality. Never argue or try to</text><text x="41" y="603" fill="#f6faf5" font-size="21">prove the belief wrong, and never</text><text x="41" y="630" fill="#f6faf5" font-size="21">reinforce it by exploring its details or</text><text x="41" y="657" fill="#f6faf5" font-size="21">acting on it. Arguing does not change the</text><text x="41" y="684" fill="#f6faf5" font-size="21">belief — it only costs the nurse trust.</text></g></svg>