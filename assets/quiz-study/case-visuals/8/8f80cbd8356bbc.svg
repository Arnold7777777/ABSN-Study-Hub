<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>Four clients are waiting on the psychiatric unit. Which client does the nurse assess first?</title><desc>Safety first: suicidal ideation with a method and a plan requires immediate assessment and protection. The other concerns are real but none of them threatens a life in the next few minutes.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Response to Illness &amp; Mental-</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Health Assessment</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Four clients are waiting on the</text><text x="41" y="231" fill="#f6faf5" font-size="21">psychiatric unit. Which client does the</text><text x="41" y="258" fill="#f6faf5" font-size="21">nurse assess first?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">A client who says he has been saving his</text><text x="41" y="390" fill="#f6faf5" font-size="21">pills and plans to take them all tonight</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Safety first: suicidal ideation with a</text><text x="41" y="522" fill="#f6faf5" font-size="21">method and a plan requires immediate</text><text x="41" y="549" fill="#f6faf5" font-size="21">assessment and protection. The other</text><text x="41" y="576" fill="#f6faf5" font-size="21">concerns are real but none of them</text><text x="41" y="603" fill="#f6faf5" font-size="21">threatens a life in the next few minutes.</text></g></svg>