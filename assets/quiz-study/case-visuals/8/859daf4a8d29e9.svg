<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>Which actions are part of central-line-associated bloodstream infection (CLABSI) prevention? Select all that apply.</title><desc>Scrub the hub and keep the dressing clean, dry and intact. The single biggest measure is missing from the list and worth saying out loud: remove the line as soon as it is no longer needed — &quot;still patent&quot; is not a reason to keep it. The femoral site carries the highest infection risk and is a last choice. About the 2 minutes: that number is real, but it belongs to a different site. Chlorhexidine–alcohol prep is 30 seconds of friction on a dry site (chest, arm — a subclavian or PICC line) and 2 minutes on a moist site (groin, axilla — a femoral line), then allowed to dry completely either way. Nothing here says femoral, so 30 seconds is the expected answer.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Infectious Diseases &amp; HIV</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which actions are part of central-line-</text><text x="41" y="198" fill="#f6faf5" font-size="21">associated bloodstream infection (CLABSI)</text><text x="41" y="225" fill="#f6faf5" font-size="21">prevention? Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Scrub the hub for 15–30 seconds before</text><text x="41" y="357" fill="#f6faf5" font-size="21">accessing · Change the dressing every 7</text><text x="41" y="384" fill="#f6faf5" font-size="21">days or sooner if soiled</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Scrub the hub and keep the dressing clean,</text><text x="41" y="516" fill="#f6faf5" font-size="21">dry and intact.</text></g></svg>