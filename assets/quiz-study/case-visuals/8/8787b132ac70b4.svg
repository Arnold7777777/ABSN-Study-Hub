<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="536" viewBox="0 0 640 536"><title>A 78-year-old client is admitted after finishing a long course of IV gentamicin. He worked 30 years in a factory without hearing protection and also has impacted cerumen and a history of otosclerosis. Which factors put him at risk for permanent hearing loss? Select all that apply.</title><desc>Sensorineural loss damages the hair cells or nerve and is usually permanent ; its causes are noise, age, and ototoxic drugs such as aminoglycosides like gentamicin. Cerumen and otosclerosis are tempting because they clearly affect hearing, but they are conductive problems - sound cannot get in - and conductive loss is often fixable.</desc><rect width="640" height="536" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Disorders - Eye &amp; Ear</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 78-year-old client is admitted after</text><text x="41" y="198" fill="#f6faf5" font-size="21">finishing a long course of IV gentamicin.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">The prolonged course of gentamicin ·</text><text x="41" y="330" fill="#f6faf5" font-size="21">Thirty years of loud occupational noise ·</text><text x="41" y="357" fill="#f6faf5" font-size="21">His age of 78</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Sensorineural loss damages the hair cells</text><text x="41" y="489" fill="#f6faf5" font-size="21">or nerve and is usually permanent ;</text></g></svg>