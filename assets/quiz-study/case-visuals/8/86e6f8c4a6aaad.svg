<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>A client who exercises regularly asks whether she can continue during pregnancy. Which instructions are correct? Select all that apply.</title><desc>Regular rather than intermittent exercise, a 5-minute warm-up, and avoiding heat and overexertion are all taught. The Valsalva maneuver is specifically avoided — it raises blood pressure and reduces blood flow to the fetus.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nutrition &amp; Health Promotion in</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client who exercises regularly asks</text><text x="41" y="231" fill="#f6faf5" font-size="21">whether she can continue during pregnancy.</text><text x="41" y="258" fill="#f6faf5" font-size="21">Which instructions are correct? Select all</text><text x="41" y="285" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Warm up for about 5 minutes before</text><text x="41" y="417" fill="#f6faf5" font-size="21">exercising · Aim for about 30 minutes</text><text x="41" y="444" fill="#f6faf5" font-size="21">roughly three times a week · Avoid</text><text x="41" y="471" fill="#f6faf5" font-size="21">exercising in hot, humid weather or when</text><text x="41" y="498" fill="#f6faf5" font-size="21">you have a fever · Avoid stretches…</text><path d="M319 522v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="538" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 551) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="572" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="603" fill="#f6faf5" font-size="21">Regular rather than intermittent exercise,</text><text x="41" y="630" fill="#f6faf5" font-size="21">a 5-minute warm-up, and avoiding heat and</text><text x="41" y="657" fill="#f6faf5" font-size="21">overexertion are all taught. The Valsalva</text><text x="41" y="684" fill="#f6faf5" font-size="21">maneuver is specifically avoided — it</text><text x="41" y="711" fill="#f6faf5" font-size="21">raises blood pressure and reduces blood</text><text x="41" y="738" fill="#f6faf5" font-size="21">flow to the fetus.</text></g></svg>