<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A 70-year-old client asks how often hearing should be checked. Which response by the nurse is correct?</title><desc>Hearing screening is offered about every 1 to 3 years for adults 65 and older, and more often if loss is noted. Waiting until the client notices a problem delays detection, because age-related loss develops gradually and is often first noticed by family.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hearing Screening</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 70-year-old client asks how often</text><text x="41" y="198" fill="#f6faf5" font-size="21">hearing should be checked. Which response</text><text x="41" y="225" fill="#f6faf5" font-size="21">by the nurse is correct?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Every 1 to 3 years</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Hearing screening is offered about every 1</text><text x="41" y="462" fill="#f6faf5" font-size="21">to 3 years for adults 65 and older, and</text><text x="41" y="489" fill="#f6faf5" font-size="21">more often if loss is noted. Waiting until</text><text x="41" y="516" fill="#f6faf5" font-size="21">the client notices a problem delays</text><text x="41" y="543" fill="#f6faf5" font-size="21">detection, because age-related loss</text><text x="41" y="570" fill="#f6faf5" font-size="21">develops gradually and is often first</text><text x="41" y="597" fill="#f6faf5" font-size="21">noticed by family.</text></g></svg>