<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which actions are appropriate for a client after knee arthroscopy? Select all that apply.</title><desc>Ice and elevation control the swelling from the fluid used to distend the joint, and neurovascular checks catch compromise early. Fever is never routine after arthroscopy: it is a sign of infection and gets reported, not explained away.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Arthroscopy care</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which actions are appropriate for a client</text><text x="41" y="198" fill="#f6faf5" font-size="21">after knee arthroscopy? Select all that</text><text x="41" y="225" fill="#f6faf5" font-size="21">apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Apply ice to the knee · Elevate the</text><text x="41" y="357" fill="#f6faf5" font-size="21">extremity · Check color, movement and</text><text x="41" y="384" fill="#f6faf5" font-size="21">sensation in the foot · Report increasing</text><text x="41" y="411" fill="#f6faf5" font-size="21">redness, drainage or fever</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Ice and elevation control the swelling</text><text x="41" y="543" fill="#f6faf5" font-size="21">from the fluid used to distend the joint,</text><text x="41" y="570" fill="#f6faf5" font-size="21">and neurovascular checks catch compromise</text><text x="41" y="597" fill="#f6faf5" font-size="21">early. Fever is never routine after</text><text x="41" y="624" fill="#f6faf5" font-size="21">arthroscopy: it is a sign of infection and</text><text x="41" y="651" fill="#f6faf5" font-size="21">gets reported, not explained away.</text></g></svg>