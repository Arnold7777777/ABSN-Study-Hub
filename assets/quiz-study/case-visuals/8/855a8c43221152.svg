<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A vial of powdered medication contains 1.5 g. The nurse wants to reconstitute it so that each 2 mL contains 300 mg of medication. How much diluent should be added to the vial to achieve this concentration?</title><desc>1.5 g = 1,500 mg. 1,500 / 300 = 5 doses, and each dose is 2 mL, so 5 x 2 = 10 mL of diluent . The answer choices here are ours; the recording asked for the number.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Reconstitution math</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A vial of powdered medication contains 1.5</text><text x="41" y="198" fill="#f6faf5" font-size="21">g. The nurse wants to reconstitute it so</text><text x="41" y="225" fill="#f6faf5" font-size="21">that each 2 mL contains 300 mg of</text><text x="41" y="252" fill="#f6faf5" font-size="21">medication. How much diluent should be</text><text x="41" y="279" fill="#f6faf5" font-size="21">added to the vial to achieve this</text><text x="41" y="306" fill="#f6faf5" font-size="21">concentration?</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">10 mL</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">1.5 g = 1,500 mg. 1,500 / 300 = 5 doses,</text><text x="41" y="543" fill="#f6faf5" font-size="21">and each dose is 2 mL, so 5 x 2 = 10 mL of</text><text x="41" y="570" fill="#f6faf5" font-size="21">diluent . The answer choices here are</text><text x="41" y="597" fill="#f6faf5" font-size="21">ours; the recording asked for the number.</text></g></svg>