<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which statements about setting priorities are correct? Select all that apply.</title><desc>Priority setting weighs threat to life first, respects what the client values, and treats actual problems ahead of risks. In non-urgent situations, assessment comes before action. Cardiac arrest flips the usual order, since compressions come before airway and breathing.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Prioritization</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which statements about setting priorities</text><text x="41" y="198" fill="#f6faf5" font-size="21">are correct? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Threats to life are handled before</text><text x="41" y="330" fill="#f6faf5" font-size="21">problems that are only uncomfortable ·</text><text x="41" y="357" fill="#f6faf5" font-size="21">What the client names as most important</text><text x="41" y="384" fill="#f6faf5" font-size="21">belongs in the ranking · Actual problems</text><text x="41" y="411" fill="#f6faf5" font-size="21">usually come before problems that…</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Priority setting weighs threat to life</text><text x="41" y="543" fill="#f6faf5" font-size="21">first, respects what the client values,</text><text x="41" y="570" fill="#f6faf5" font-size="21">and treats actual problems ahead of risks.</text><text x="41" y="597" fill="#f6faf5" font-size="21">In non-urgent situations, assessment comes</text><text x="41" y="624" fill="#f6faf5" font-size="21">before action. Cardiac arrest flips the</text><text x="41" y="651" fill="#f6faf5" font-size="21">usual order, since compressions come</text><text x="41" y="678" fill="#f6faf5" font-size="21">before airway and breathing.</text></g></svg>