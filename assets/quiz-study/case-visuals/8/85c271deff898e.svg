<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>An 8-week-old has a positive Ortolani sign and is fitted with a Pavlik harness. Which statement by the parent indicates correct understanding?</title><desc>The Pavlik harness is used under 6 months and worn about 3 to 4 months , and only the provider adjusts the straps — the same rule that applies to traction weights and braces. A positive Ortolani means hip instability needing further evaluation, and ultrasound is the imaging under 6 months, x-ray after.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Musculoskeletal</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An 8-week-old has a positive Ortolani sign</text><text x="41" y="198" fill="#f6faf5" font-size="21">and is fitted with a Pavlik harness. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">statement by the parent indicates correct</text><text x="41" y="252" fill="#f6faf5" font-size="21">understanding?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;She will wear it for about 3 to 4 months,</text><text x="41" y="384" fill="#f6faf5" font-size="21">and only her provider adjusts the straps.&quot;</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">The Pavlik harness is used under 6 months</text><text x="41" y="516" fill="#f6faf5" font-size="21">and worn about 3 to 4 months , and only</text><text x="41" y="543" fill="#f6faf5" font-size="21">the provider adjusts the straps — the same</text><text x="41" y="570" fill="#f6faf5" font-size="21">rule that applies to traction weights and</text><text x="41" y="597" fill="#f6faf5" font-size="21">braces. A positive Ortolani means hip</text><text x="41" y="624" fill="#f6faf5" font-size="21">instability needing further evaluation,</text><text x="41" y="651" fill="#f6faf5" font-size="21">and ultrasound is the imaging under 6</text><text x="41" y="678" fill="#f6faf5" font-size="21">months, x-ray after.</text></g></svg>