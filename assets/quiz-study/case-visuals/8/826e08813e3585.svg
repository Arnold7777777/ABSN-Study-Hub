<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>Which is the nurse&#x27;s priority at this moment?</title><desc>Before anything useful is said, the physical setup has to be safe: an unblocked exit for staff, adequate distance, and no audience. A student standing behind him and clients gathering around both raise the risk of injury. Documentation and the reason for the cancelation both matter, and both wait.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Agitation, De-escalation, and</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Restraint</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which is the nurse&#x27;s priority at this</text><text x="41" y="231" fill="#f6faf5" font-size="21">moment?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Safety of everyone present, including an</text><text x="41" y="363" fill="#f6faf5" font-size="21">unobstructed exit for staff</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">Before anything useful is said, the</text><text x="41" y="495" fill="#f6faf5" font-size="21">physical setup has to be safe: an</text><text x="41" y="522" fill="#f6faf5" font-size="21">unblocked exit for staff, adequate</text><text x="41" y="549" fill="#f6faf5" font-size="21">distance, and no audience. A student</text><text x="41" y="576" fill="#f6faf5" font-size="21">standing behind him and clients gathering</text><text x="41" y="603" fill="#f6faf5" font-size="21">around both raise the risk of injury.</text><text x="41" y="630" fill="#f6faf5" font-size="21">Documentation and the reason for the</text><text x="41" y="657" fill="#f6faf5" font-size="21">cancelation both matter, and both wait.</text></g></svg>