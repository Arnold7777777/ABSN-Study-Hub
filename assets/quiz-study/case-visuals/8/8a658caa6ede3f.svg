<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is teaching a client about pushing during the second stage of labor. Which of the following statements by the client indicates an understanding of the teaching?</title><desc>Open-glottis pushing means bearing down while breathing out — grunting or groaning, air still moving — and pushing with the urge rather than to someone else’s count. Breath-holding (Valsalva) raises intrathoracic pressure, which drops venous return, cardiac output and placental perfusion, and causes more perineal trauma. Pushing between contractions is ineffective and exhausting. Supine puts the uterus on the vena cava and is avoided.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Labor &amp; Birth</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a client about pushing</text><text x="41" y="198" fill="#f6faf5" font-size="21">during the second stage of labor. Which of</text><text x="41" y="225" fill="#f6faf5" font-size="21">the following statements by the client</text><text x="41" y="252" fill="#f6faf5" font-size="21">indicates an understanding of the</text><text x="41" y="279" fill="#f6faf5" font-size="21">teaching?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">“I should push while I breathe out, when I</text><text x="41" y="411" fill="#f6faf5" font-size="21">feel the urge.”</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Open-glottis pushing means bearing down</text><text x="41" y="543" fill="#f6faf5" font-size="21">while breathing out — grunting or</text><text x="41" y="570" fill="#f6faf5" font-size="21">groaning, air still moving — and pushing</text><text x="41" y="597" fill="#f6faf5" font-size="21">with the urge rather than to someone</text><text x="41" y="624" fill="#f6faf5" font-size="21">else’s count.</text></g></svg>