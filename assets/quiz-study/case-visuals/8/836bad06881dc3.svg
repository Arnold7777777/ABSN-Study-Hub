<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which statement by the parent of a preschooler with diarrhea shows understanding of the teaching?</title><desc>Fruit juice is high in sugar and pulls water into the bowel , worsening diarrhea. Broth and gelatin are the wrong electrolyte mix, and the BRAT diet is no longer recommended - it is too low in protein and energy. Oral rehydration solution plus the usual diet is the current advice.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which statement by the parent of a</text><text x="41" y="198" fill="#f6faf5" font-size="21">preschooler with diarrhea shows</text><text x="41" y="225" fill="#f6faf5" font-size="21">understanding of the teaching?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">“I will limit how much fruit juice my</text><text x="41" y="357" fill="#f6faf5" font-size="21">child drinks.”</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Fruit juice is high in sugar and pulls</text><text x="41" y="489" fill="#f6faf5" font-size="21">water into the bowel , worsening diarrhea.</text><text x="41" y="516" fill="#f6faf5" font-size="21">Broth and gelatin are the wrong</text><text x="41" y="543" fill="#f6faf5" font-size="21">electrolyte mix, and the BRAT diet is no</text><text x="41" y="570" fill="#f6faf5" font-size="21">longer recommended - it is too low in</text><text x="41" y="597" fill="#f6faf5" font-size="21">protein and energy. Oral rehydration</text><text x="41" y="624" fill="#f6faf5" font-size="21">solution plus the usual diet is the</text><text x="41" y="651" fill="#f6faf5" font-size="21">current advice.</text></g></svg>