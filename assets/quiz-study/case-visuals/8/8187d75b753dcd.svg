<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client on a medical unit has a protective (restraining) order against her husband. He arrives at the nurses&#x27; station asking to see her. What is the nurse&#x27;s priority action?</title><desc>The nurse&#x27;s role is to know the order exists and involve security, not to confront the abuser personally; a nurse who is hurt cannot care for anyone. Keep the client&#x27;s location confidential and document the event.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intimate partner violence -</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">protective order</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client on a medical unit has a</text><text x="41" y="231" fill="#f6faf5" font-size="21">protective (restraining) order against her</text><text x="41" y="258" fill="#f6faf5" font-size="21">husband. He arrives at the nurses&#x27; station</text><text x="41" y="285" fill="#f6faf5" font-size="21">asking to see her. What is the nurse&#x27;s</text><text x="41" y="312" fill="#f6faf5" font-size="21">priority action?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Notify hospital security and keep him away</text><text x="41" y="444" fill="#f6faf5" font-size="21">from the client</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">The nurse&#x27;s role is to know the order</text><text x="41" y="576" fill="#f6faf5" font-size="21">exists and involve security, not to</text><text x="41" y="603" fill="#f6faf5" font-size="21">confront the abuser personally; a nurse</text><text x="41" y="630" fill="#f6faf5" font-size="21">who is hurt cannot care for anyone. Keep</text><text x="41" y="657" fill="#f6faf5" font-size="21">the client&#x27;s location confidential and</text><text x="41" y="684" fill="#f6faf5" font-size="21">document the event.</text></g></svg>