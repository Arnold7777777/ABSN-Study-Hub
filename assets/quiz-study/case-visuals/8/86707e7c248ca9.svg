<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client says, &#x27;My husband is being discharged to my care and I don&#x27;t know how I&#x27;ll manage.&#x27; The nurse responds, &#x27;You&#x27;re worried about being able to care for him at home.&#x27; Which technique did the nurse use?</title><desc>Restating gives back the CONTENT — a near-repeat of what the client said. Reflecting gives back the FEELING, naming an emotion the client did not name (for example, &#x27;You sound frightened&#x27;). Clarifying asks for a missing piece. Presenting reality states what is factually true without arguing.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client says, &#x27;My husband is being</text><text x="41" y="198" fill="#f6faf5" font-size="21">discharged to my care and I don&#x27;t know how</text><text x="41" y="225" fill="#f6faf5" font-size="21">I&#x27;ll manage.&#x27; The nurse responds, &#x27;You&#x27;re</text><text x="41" y="252" fill="#f6faf5" font-size="21">worried about being able to care for him</text><text x="41" y="279" fill="#f6faf5" font-size="21">at home.&#x27; Which technique did the nurse…</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Restating</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Restating gives back the CONTENT — a near-</text><text x="41" y="516" fill="#f6faf5" font-size="21">repeat of what the client said. Reflecting</text><text x="41" y="543" fill="#f6faf5" font-size="21">gives back the FEELING, naming an emotion</text><text x="41" y="570" fill="#f6faf5" font-size="21">the client did not name (for example, &#x27;You</text><text x="41" y="597" fill="#f6faf5" font-size="21">sound frightened&#x27;). Clarifying asks for a</text><text x="41" y="624" fill="#f6faf5" font-size="21">missing piece. Presenting reality states</text><text x="41" y="651" fill="#f6faf5" font-size="21">what is factually true without arguing.</text></g></svg>