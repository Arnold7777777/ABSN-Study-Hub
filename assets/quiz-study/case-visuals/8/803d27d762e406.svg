<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A nurse must reinforce preoperative teaching with a client who speaks only Vietnamese. The client&#x27;s 16-year-old daughter offers to interpret. Which action should the nurse take?</title><desc>A QUALIFIED MEDICAL INTERPRETER IS REQUIRED; A FAMILY MEMBER, ESPECIALLY A CHILD, MUST NEVER BE USED because of breaches of confidentiality, inaccurate or filtered translation, and inappropriate role reversal. The nurse speaks in short sentences and LOOKS AT AND SPEAKS TO THE CLIENT, not the interpreter. An untrained bilingual staff member is also not a qualified interpreter.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Interpreters</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse must reinforce preoperative</text><text x="41" y="198" fill="#f6faf5" font-size="21">teaching with a client who speaks only</text><text x="41" y="225" fill="#f6faf5" font-size="21">Vietnamese. The client&#x27;s 16-year-old</text><text x="41" y="252" fill="#f6faf5" font-size="21">daughter offers to interpret. Which action</text><text x="41" y="279" fill="#f6faf5" font-size="21">should the nurse take?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Obtain a qualified medical interpreter and</text><text x="41" y="411" fill="#f6faf5" font-size="21">speak directly to the client</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A QUALIFIED MEDICAL INTERPRETER IS</text><text x="41" y="543" fill="#f6faf5" font-size="21">REQUIRED;</text></g></svg>