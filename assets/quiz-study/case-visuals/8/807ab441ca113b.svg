<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client has slept poorly for several nights in the hospital. Which findings should the nurse expect?</title><desc>Loss of NREM and REM sleep produces irritability, poor concentration, slowed responses, heightened pain sensitivity, and daytime sleepiness. Memory consolidation and physical restoration both depend on adequate sleep, so those functions decline rather than improve.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sleep Deprivation</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has slept poorly for several</text><text x="41" y="198" fill="#f6faf5" font-size="21">nights in the hospital. Which findings</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse expect?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Irritability and mood changes · Decreased</text><text x="41" y="357" fill="#f6faf5" font-size="21">concentration and slowed reaction time ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Increased sensitivity to pain · Daytime</text><text x="41" y="411" fill="#f6faf5" font-size="21">drowsiness</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Loss of NREM and REM sleep produces</text><text x="41" y="543" fill="#f6faf5" font-size="21">irritability, poor concentration, slowed</text><text x="41" y="570" fill="#f6faf5" font-size="21">responses, heightened pain sensitivity,</text><text x="41" y="597" fill="#f6faf5" font-size="21">and daytime sleepiness. Memory</text><text x="41" y="624" fill="#f6faf5" font-size="21">consolidation and physical restoration</text><text x="41" y="651" fill="#f6faf5" font-size="21">both depend on adequate sleep, so those</text><text x="41" y="678" fill="#f6faf5" font-size="21">functions decline rather than improve.</text></g></svg>