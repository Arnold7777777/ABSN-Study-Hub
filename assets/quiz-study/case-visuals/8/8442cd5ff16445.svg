<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>Before meeting a newly assigned client, the nurse reviews the chart, talks with the social worker, and then spends a few minutes examining her own reaction to clients with this diagnosis. These actions occur in which phase?</title><desc>Preinteraction happens before the nurse ever meets the client: review the chart, consult the team, plan the first interaction, and examine personal feelings and biases. Orientation begins only when nurse and client actually meet.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Before meeting a newly assigned client,</text><text x="41" y="231" fill="#f6faf5" font-size="21">the nurse reviews the chart, talks with</text><text x="41" y="258" fill="#f6faf5" font-size="21">the social worker, and then spends a few</text><text x="41" y="285" fill="#f6faf5" font-size="21">minutes examining her own reaction to</text><text x="41" y="312" fill="#f6faf5" font-size="21">clients with this diagnosis.</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Preinteraction phase</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Preinteraction happens before the nurse</text><text x="41" y="549" fill="#f6faf5" font-size="21">ever meets the client: review the chart,</text><text x="41" y="576" fill="#f6faf5" font-size="21">consult the team, plan the first</text><text x="41" y="603" fill="#f6faf5" font-size="21">interaction, and examine personal feelings</text><text x="41" y="630" fill="#f6faf5" font-size="21">and biases. Orientation begins only when</text><text x="41" y="657" fill="#f6faf5" font-size="21">nurse and client actually meet.</text></g></svg>