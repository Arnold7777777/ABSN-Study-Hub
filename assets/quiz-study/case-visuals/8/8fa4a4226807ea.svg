<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is caring for a client who has been taking thioridazine for 3 weeks. The client has hand tremors, drooling, and rigid extremities. Which of the following actions should the nurse take?</title><desc>Tremor, drooling, and rigidity = pseudoparkinsonism , an extrapyramidal symptom. Treat with an anticholinergic — benztropine (or diphenhydramine, trihexyphenidyl, amantadine). A benzodiazepine is the distractor : benzos help akathisia , not motor-slow rigidity. Propranolol is for akathisia.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client who has</text><text x="41" y="198" fill="#f6faf5" font-size="21">been taking thioridazine for 3 weeks. The</text><text x="41" y="225" fill="#f6faf5" font-size="21">client has hand tremors, drooling, and</text><text x="41" y="252" fill="#f6faf5" font-size="21">rigid extremities. Which of the following</text><text x="41" y="279" fill="#f6faf5" font-size="21">actions should the nurse take?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Administer benztropine</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Tremor, drooling, and rigidity =</text><text x="41" y="516" fill="#f6faf5" font-size="21">pseudoparkinsonism , an extrapyramidal</text><text x="41" y="543" fill="#f6faf5" font-size="21">symptom. Treat with an anticholinergic —</text><text x="41" y="570" fill="#f6faf5" font-size="21">benztropine (or diphenhydramine,</text><text x="41" y="597" fill="#f6faf5" font-size="21">trihexyphenidyl, amantadine). A</text><text x="41" y="624" fill="#f6faf5" font-size="21">benzodiazepine is the distractor : benzos</text><text x="41" y="651" fill="#f6faf5" font-size="21">help akathisia , not motor-slow rigidity.</text><text x="41" y="678" fill="#f6faf5" font-size="21">Propranolol is for akathisia.</text></g></svg>