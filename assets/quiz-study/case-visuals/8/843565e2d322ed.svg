<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is teaching Jackson&#x27;s mother how to respond when he has a seizure at home. Which statements show that the teaching has been effective? (Select all that apply.)</title><desc>Stay with him until he is fully awake, turn him onto his side and clear away hazards. Holding or restraining him, or forcing the jaw open during the seizure, can cause injury.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic &amp; Neuromuscular</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching Jackson&#x27;s mother how</text><text x="41" y="198" fill="#f6faf5" font-size="21">to respond when he has a seizure at home.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which statements show that the teaching</text><text x="41" y="252" fill="#f6faf5" font-size="21">has been effective? (Select all that</text><text x="41" y="279" fill="#f6faf5" font-size="21">apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Someone should stay with Jackson until he</text><text x="41" y="411" fill="#f6faf5" font-size="21">fully wakes up after the seizure.</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Stay with him until he is fully awake,</text><text x="41" y="543" fill="#f6faf5" font-size="21">turn him onto his side and clear away</text><text x="41" y="570" fill="#f6faf5" font-size="21">hazards. Holding or restraining him, or</text><text x="41" y="597" fill="#f6faf5" font-size="21">forcing the jaw open during the seizure,</text><text x="41" y="624" fill="#f6faf5" font-size="21">can cause injury.</text></g></svg>