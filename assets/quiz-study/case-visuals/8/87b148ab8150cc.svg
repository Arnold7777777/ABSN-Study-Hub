<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>A parent says her toddler is not doing well with potty training. Which observation best explains why the child has been unsuccessful?</title><desc>Sitting calmly for 5 to 8 minutes is the readiness sign. Getting down after 2 to 3 minutes is not long enough to pass anything, and the crying matters more than the clock — a distressed child becomes a resistant one, and resistance makes the whole process longer. The other three are all signs the child is ready. Knowing the bathroom and following a simple direction is readiness. Pulling clothing up and down is enough — she does not have to dress herself completely. And walking to the toilet counts even if someone lifts her onto the seat; needing help positioning is not a reason to wait.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Toddler &amp; Preschooler</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A parent says her toddler is not doing</text><text x="41" y="198" fill="#f6faf5" font-size="21">well with potty training. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">observation best explains why the child</text><text x="41" y="252" fill="#f6faf5" font-size="21">has been unsuccessful?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">The child cries after 2 to 3 minutes on</text><text x="41" y="384" fill="#f6faf5" font-size="21">the potty and asks to get down</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Sitting calmly for 5 to 8 minutes is the</text><text x="41" y="516" fill="#f6faf5" font-size="21">readiness sign.</text></g></svg>