<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse obtains an SpO2 reading of 84 percent on a client who appears comfortable, is speaking in full sentences, and has pink mucous membranes. Which of the following factors could explain an inaccurate reading? Select all that apply.</title><desc>Pulse oximetry depends on pulsatile arterial flow and clear light transmission, so cold or poorly perfused extremities, nail polish, an inflating cuff proximal to the probe, and motion all corrupt the signal. Recent food intake affects oral temperature, not oxygen saturation, and confusing those two assessments is the error being tested.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Pulse Oximetry</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse obtains an SpO2 reading of 84</text><text x="41" y="198" fill="#f6faf5" font-size="21">percent on a client who appears</text><text x="41" y="225" fill="#f6faf5" font-size="21">comfortable, is speaking in full</text><text x="41" y="252" fill="#f6faf5" font-size="21">sentences, and has pink mucous membranes.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Cold fingers with poor peripheral</text><text x="41" y="384" fill="#f6faf5" font-size="21">perfusion · Dark nail polish on the finger</text><text x="41" y="411" fill="#f6faf5" font-size="21">with the probe · The probe placed on the</text><text x="41" y="438" fill="#f6faf5" font-size="21">same arm as an inflating blood pressure</text><text x="41" y="465" fill="#f6faf5" font-size="21">cuff · Client movement during…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Pulse oximetry depends on pulsatile</text><text x="41" y="597" fill="#f6faf5" font-size="21">arterial flow and clear light</text><text x="41" y="624" fill="#f6faf5" font-size="21">transmission, so cold or poorly perfused</text><text x="41" y="651" fill="#f6faf5" font-size="21">extremities, nail polish, an inflating</text><text x="41" y="678" fill="#f6faf5" font-size="21">cuff proximal to the probe, and motion all</text><text x="41" y="705" fill="#f6faf5" font-size="21">corrupt the signal.</text></g></svg>