<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client with an upper gastrointestinal bleed received 2 units of packed red blood cells. Which finding indicates the transfusion was effective?</title><desc>A rising hemoglobin with a falling heart rate shows oxygen-carrying capacity and circulating volume were restored , so the heart no longer has to compensate. The most tempting wrong answer is the temperature rise, which some students associate with the body responding to the transfusion, but a 2 degree increase signals a febrile reaction. Flank or low back pain and dark scant urine are classic signs of an acute hemolytic reaction.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Transfusion Response</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with an upper gastrointestinal</text><text x="41" y="198" fill="#f6faf5" font-size="21">bleed received 2 units of packed red blood</text><text x="41" y="225" fill="#f6faf5" font-size="21">cells. Which finding indicates the</text><text x="41" y="252" fill="#f6faf5" font-size="21">transfusion was effective?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Hemoglobin rose from 7.1 to 9.4 g/dL and</text><text x="41" y="384" fill="#f6faf5" font-size="21">the heart rate decreased from 118 to 88</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A rising hemoglobin with a falling heart</text><text x="41" y="516" fill="#f6faf5" font-size="21">rate shows oxygen-carrying capacity and</text><text x="41" y="543" fill="#f6faf5" font-size="21">circulating volume were restored , so the</text><text x="41" y="570" fill="#f6faf5" font-size="21">heart no longer has to compensate.</text></g></svg>