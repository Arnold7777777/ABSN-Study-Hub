<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse in a pediatric unit is caring for 4 clients. Which client should the nurse assess first?</title><desc>Chest pain, fever and dyspnea in sickle cell disease indicate acute chest syndrome , a life-threatening airway and breathing emergency. Pallor and fatigue in iron-deficiency anemia, mild swelling in hemophilia, and sore throat in mononucleosis are expected, lower-priority findings.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology prioritization</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse in a pediatric unit is caring for</text><text x="41" y="198" fill="#f6faf5" font-size="21">4 clients. Which client should the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">assess first?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A 7-year-old with sickle cell disease who</text><text x="41" y="357" fill="#f6faf5" font-size="21">has sudden chest pain, fever, and dyspnea</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Chest pain, fever and dyspnea in sickle</text><text x="41" y="489" fill="#f6faf5" font-size="21">cell disease indicate acute chest syndrome</text><text x="41" y="516" fill="#f6faf5" font-size="21">, a life-threatening airway and breathing</text><text x="41" y="543" fill="#f6faf5" font-size="21">emergency. Pallor and fatigue in iron-</text><text x="41" y="570" fill="#f6faf5" font-size="21">deficiency anemia, mild swelling in</text><text x="41" y="597" fill="#f6faf5" font-size="21">hemophilia, and sore throat in</text><text x="41" y="624" fill="#f6faf5" font-size="21">mononucleosis are expected, lower-priority</text><text x="41" y="651" fill="#f6faf5" font-size="21">findings.</text></g></svg>