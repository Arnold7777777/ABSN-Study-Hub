<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is planning assignments on an inpatient unit. Which client is at greatest risk for violence toward others?</title><desc>A persecutory delusion with an identified target and surveillance behavior is the strongest predictor of violence toward others, because the client perceives the attack as self-defense. The client who self-injured is the tempting choice, but self-directed injury predicts risk to self, not to others. Hopeless statements and manic intrusiveness are distressing but are not aimed at anyone.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Risk for Violence</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is planning assignments on an</text><text x="41" y="198" fill="#f6faf5" font-size="21">inpatient unit. Which client is at</text><text x="41" y="225" fill="#f6faf5" font-size="21">greatest risk for violence toward others?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A client with paranoid delusions who</text><text x="41" y="357" fill="#f6faf5" font-size="21">believes a specific peer was sent to</text><text x="41" y="384" fill="#f6faf5" font-size="21">poison him and has begun watching that</text><text x="41" y="411" fill="#f6faf5" font-size="21">peer closely</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A persecutory delusion with an identified</text><text x="41" y="543" fill="#f6faf5" font-size="21">target and surveillance behavior is the</text><text x="41" y="570" fill="#f6faf5" font-size="21">strongest predictor of violence toward</text><text x="41" y="597" fill="#f6faf5" font-size="21">others, because the client perceives the</text><text x="41" y="624" fill="#f6faf5" font-size="21">attack as self-defense.</text></g></svg>