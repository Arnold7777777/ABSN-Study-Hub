<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which combination of medications is most commonly given intramuscularly as a chemical restraint for an acutely aggressive client?</title><desc>The classic IM chemical-restraint combination is haloperidol (Haldol) + lorazepam (Ativan) + diphenhydramine (Benadryl) — antipsychotic, sedative, and an anticholinergic to blunt EPS. The other combinations are maintenance drugs that do nothing for acute aggression.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anger, Abuse &amp; Violence</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which combination of medications is most</text><text x="41" y="198" fill="#f6faf5" font-size="21">commonly given intramuscularly as a</text><text x="41" y="225" fill="#f6faf5" font-size="21">chemical restraint for an acutely</text><text x="41" y="252" fill="#f6faf5" font-size="21">aggressive client?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Haloperidol, lorazepam, and</text><text x="41" y="384" fill="#f6faf5" font-size="21">diphenhydramine</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">The classic IM chemical-restraint</text><text x="41" y="516" fill="#f6faf5" font-size="21">combination is haloperidol (Haldol) +</text><text x="41" y="543" fill="#f6faf5" font-size="21">lorazepam (Ativan) + diphenhydramine</text><text x="41" y="570" fill="#f6faf5" font-size="21">(Benadryl) — antipsychotic, sedative, and</text><text x="41" y="597" fill="#f6faf5" font-size="21">an anticholinergic to blunt EPS. The other</text><text x="41" y="624" fill="#f6faf5" font-size="21">combinations are maintenance drugs that do</text><text x="41" y="651" fill="#f6faf5" font-size="21">nothing for acute aggression.</text></g></svg>