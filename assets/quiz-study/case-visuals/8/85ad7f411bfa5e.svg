<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client who had abdominal surgery 5 days ago coughs forcefully and then reports that &#x27;something gave way.&#x27; The nurse finds loops of bowel protruding through the incision. Which action should the nurse take FIRST?</title><desc>With EVISCERATION the nurse&#x27;s FIRST action is to COVER THE PROTRUDING VISCERA WITH STERILE GAUZE MOISTENED WITH STERILE 0.9% SODIUM CHLORIDE to keep the tissue moist and prevent further contamination and drying. THE ORGANS ARE NEVER REINSERTED. The client is then placed in LOW-FOWLER&#x27;S POSITION WITH THE KNEES BENT to reduce abdominal tension, kept NPO for surgery, and the surgeon is notified immediately.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Wound Complications</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who had abdominal surgery 5 days</text><text x="41" y="198" fill="#f6faf5" font-size="21">ago coughs forcefully and then reports</text><text x="41" y="225" fill="#f6faf5" font-size="21">that &#x27;something gave way.&#x27; The nurse finds</text><text x="41" y="252" fill="#f6faf5" font-size="21">loops of bowel protruding through the</text><text x="41" y="279" fill="#f6faf5" font-size="21">incision.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Cover the wound with sterile gauze</text><text x="41" y="411" fill="#f6faf5" font-size="21">moistened with 0.9% sodium chloride</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">With EVISCERATION the nurse&#x27;s FIRST action</text><text x="41" y="543" fill="#f6faf5" font-size="21">is to COVER THE PROTRUDING VISCERA WITH</text><text x="41" y="570" fill="#f6faf5" font-size="21">STERILE GAUZE MOISTENED WITH STERILE 0.9%</text><text x="41" y="597" fill="#f6faf5" font-size="21">SODIUM CHLORIDE to keep the tissue moist</text><text x="41" y="624" fill="#f6faf5" font-size="21">and prevent further contamination and</text><text x="41" y="651" fill="#f6faf5" font-size="21">drying.</text></g></svg>