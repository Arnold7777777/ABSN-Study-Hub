<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A client has a heart rate of 108/min, a blood pressure of 118/82 mm Hg, cool skin and a urine output of 28 mL/hr after several hours of vomiting. How should the nurse interpret this?</title><desc>A normal blood pressure does not exclude shock. In the compensatory stage, catecholamines maintain the pressure while narrowing the pulse pressure and shunting blood from skin and kidneys — cool skin, rising heart rate, falling urine output. This is the stage where intervention works; waiting for hypotension means waiting for decompensation.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Shock &amp; MODS</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has a heart rate of 108/min, a</text><text x="41" y="198" fill="#f6faf5" font-size="21">blood pressure of 118/82 mm Hg, cool skin</text><text x="41" y="225" fill="#f6faf5" font-size="21">and a urine output of 28 mL/hr after</text><text x="41" y="252" fill="#f6faf5" font-size="21">several hours of vomiting. How should the</text><text x="41" y="279" fill="#f6faf5" font-size="21">nurse interpret this?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Compensatory stage of shock, and it should</text><text x="41" y="411" fill="#f6faf5" font-size="21">be reported</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A normal blood pressure does not exclude</text><text x="41" y="543" fill="#f6faf5" font-size="21">shock.</text></g></svg>