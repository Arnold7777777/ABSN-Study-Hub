<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A 30-year-old client in the PACU is being treated for malignant hyperthermia. Which interventions should the nurse include? Select all that apply.</title><desc>THE MH BUNDLE IS: STOP THE AGENT, 100 PERCENT OXYGEN, DANTROLENE, COOL THE CLIENT, TREAT HYPERKALEMIA AND DYSRHYTHMIAS. Hypermetabolism drives the CO2, potassium, and temperature up, so cooling is required and WARMING is exactly backward. Succinylcholine is a trigger, so giving more would worsen the crisis, not fix the rigidity.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">MH Emergency Care</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 30-year-old client in the PACU is being</text><text x="41" y="198" fill="#f6faf5" font-size="21">treated for malignant hyperthermia. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">interventions should the nurse include?</text><text x="41" y="252" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Administer 100 percent oxygen at high flow</text><text x="41" y="384" fill="#f6faf5" font-size="21">· Reconstitute and give IV dantrolene</text><text x="41" y="411" fill="#f6faf5" font-size="21">sodium · Monitor the ECG and treat</text><text x="41" y="438" fill="#f6faf5" font-size="21">hyperkalemia and dysrhythmias</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">THE MH BUNDLE IS: STOP THE AGENT, 100</text><text x="41" y="570" fill="#f6faf5" font-size="21">PERCENT OXYGEN, DANTROLENE, COOL THE</text><text x="41" y="597" fill="#f6faf5" font-size="21">CLIENT, TREAT HYPERKALEMIA AND</text><text x="41" y="624" fill="#f6faf5" font-size="21">DYSRHYTHMIAS.</text></g></svg>