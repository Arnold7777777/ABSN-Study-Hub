<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A patient with an ICD reports feeling a &quot;blow to the chest&quot; once while walking to the kitchen. What is the most appropriate nursing action?</title><desc>Any ICD shock means the device detected a life-threatening rhythm (VFib or VTach) and fired to terminate it. This must be REPORTED to the provider IMMEDIATELY and the patient assessed. The cause of the event must be investigated. Multiple shocks in a short period = emergency.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">ICD</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A patient with an ICD reports feeling a</text><text x="41" y="198" fill="#f6faf5" font-size="21">&quot;blow to the chest&quot; once while walking to</text><text x="41" y="225" fill="#f6faf5" font-size="21">the kitchen. What is the most appropriate</text><text x="41" y="252" fill="#f6faf5" font-size="21">nursing action?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Notify the provider because the ICD</text><text x="41" y="384" fill="#f6faf5" font-size="21">delivered a shock, indicating a dangerous</text><text x="41" y="411" fill="#f6faf5" font-size="21">rhythm occurred</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Any ICD shock means the device detected a</text><text x="41" y="543" fill="#f6faf5" font-size="21">life-threatening rhythm (VFib or VTach)</text><text x="41" y="570" fill="#f6faf5" font-size="21">and fired to terminate it. This must be</text><text x="41" y="597" fill="#f6faf5" font-size="21">REPORTED to the provider IMMEDIATELY and</text><text x="41" y="624" fill="#f6faf5" font-size="21">the patient assessed. The cause of the</text><text x="41" y="651" fill="#f6faf5" font-size="21">event must be investigated. Multiple</text><text x="41" y="678" fill="#f6faf5" font-size="21">shocks in a short period = emergency.</text></g></svg>