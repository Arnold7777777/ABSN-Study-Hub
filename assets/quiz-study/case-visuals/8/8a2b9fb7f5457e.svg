<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A client receiving continuous gastrostomy tube feedings reports abdominal cramping and has had several loose stools. Which of the following actions should the nurse take first?</title><desc>ASSESS BEFORE ACTING: the nurse checks the client and residual and screens the MED LIST for SORBITOL or MAGNESIUM liquids, which are the most commonly missed cause of tube-feeding diarrhea. Do NOT automatically stop the feeding without assessing, antidiarrheals mask the cause and are not first, and increasing the rate directly worsens diarrhea.</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Causes of Diarrhea with Enteral</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">(G-Tube) Feedings</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client receiving continuous gastrostomy</text><text x="41" y="231" fill="#f6faf5" font-size="21">tube feedings reports abdominal cramping</text><text x="41" y="258" fill="#f6faf5" font-size="21">and has had several loose stools. Which of</text><text x="41" y="285" fill="#f6faf5" font-size="21">the following actions should the nurse</text><text x="41" y="312" fill="#f6faf5" font-size="21">take first?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Assess the client, check gastric residual,</text><text x="41" y="444" fill="#f6faf5" font-size="21">and review the medication list for</text><text x="41" y="471" fill="#f6faf5" font-size="21">sorbitol-containing or magnesium-</text><text x="41" y="498" fill="#f6faf5" font-size="21">containing liquids.</text><path d="M319 522v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="538" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 551) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="572" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="603" fill="#f6faf5" font-size="21">ASSESS BEFORE ACTING: the nurse checks the</text><text x="41" y="630" fill="#f6faf5" font-size="21">client and residual and screens the MED</text><text x="41" y="657" fill="#f6faf5" font-size="21">LIST for SORBITOL or MAGNESIUM liquids,</text><text x="41" y="684" fill="#f6faf5" font-size="21">which are the most commonly missed cause</text><text x="41" y="711" fill="#f6faf5" font-size="21">of tube-feeding diarrhea.</text></g></svg>