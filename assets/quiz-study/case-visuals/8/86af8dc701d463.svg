<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>The partner of a dying client anxiously tells the nurse, &#x27;He stops breathing for almost half a minute and then breathes fast and deep again. Is he suffocating?&#x27; Which response should the nurse make?</title><desc>Cheyne-Stokes breathing is a normal neurologic change at the end of life and is not experienced as suffocation by an unresponsive client, so explanation and presence are what the family needs. Applying a high-flow mask or suctioning treats the family&#x27;s anxiety with an intervention the client does not need and can add distress.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Cheyne-Stokes Respirations</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The partner of a dying client anxiously</text><text x="41" y="198" fill="#f6faf5" font-size="21">tells the nurse, &#x27;He stops breathing for</text><text x="41" y="225" fill="#f6faf5" font-size="21">almost half a minute and then breathes</text><text x="41" y="252" fill="#f6faf5" font-size="21">fast and deep again. Is he suffocating?&#x27;</text><text x="41" y="279" fill="#f6faf5" font-size="21">Which response should the nurse make?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&#x27;This pattern of pauses and deep breaths</text><text x="41" y="411" fill="#f6faf5" font-size="21">is expected near the end of life, and it</text><text x="41" y="438" fill="#f6faf5" font-size="21">does not mean he is struggling or in</text><text x="41" y="465" fill="#f6faf5" font-size="21">distress.&#x27;</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Cheyne-Stokes breathing is a normal</text><text x="41" y="597" fill="#f6faf5" font-size="21">neurologic change at the end of life and</text><text x="41" y="624" fill="#f6faf5" font-size="21">is not experienced as suffocation by an</text><text x="41" y="651" fill="#f6faf5" font-size="21">unresponsive client, so explanation and</text><text x="41" y="678" fill="#f6faf5" font-size="21">presence are what the family needs.</text></g></svg>