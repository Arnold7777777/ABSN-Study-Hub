<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is planning a group teaching session. Which statement about group teaching is accurate?</title><desc>Small groups let the nurse use several strategies at once and let learners benefit from each other&#x27;s questions and experiences. Group teaching does not suit every client, because physical limitations, emotional distress, or privacy concerns can make an individual session necessary.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Group Teaching</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is planning a group teaching</text><text x="41" y="198" fill="#f6faf5" font-size="21">session. Which statement about group</text><text x="41" y="225" fill="#f6faf5" font-size="21">teaching is accurate?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Groups of six or fewer let clients learn</text><text x="41" y="357" fill="#f6faf5" font-size="21">from one another and raise satisfaction</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Small groups let the nurse use several</text><text x="41" y="489" fill="#f6faf5" font-size="21">strategies at once and let learners</text><text x="41" y="516" fill="#f6faf5" font-size="21">benefit from each other&#x27;s questions and</text><text x="41" y="543" fill="#f6faf5" font-size="21">experiences. Group teaching does not suit</text><text x="41" y="570" fill="#f6faf5" font-size="21">every client, because physical</text><text x="41" y="597" fill="#f6faf5" font-size="21">limitations, emotional distress, or</text><text x="41" y="624" fill="#f6faf5" font-size="21">privacy concerns can make an individual</text><text x="41" y="651" fill="#f6faf5" font-size="21">session necessary.</text></g></svg>