<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>Which is the most DANGEROUS type of second-degree AV block that can rapidly progress to complete heart block?</title><desc>Mobitz Type II (2nd degree type II) is DANGEROUS — it can suddenly progress to complete (3rd degree) heart block or asystole without warning. Requires PACEMAKER. Wenckebach (Mobitz I) rarely progresses and often resolves on its own.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Dysrhythmias</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which is the most DANGEROUS type of</text><text x="41" y="198" fill="#f6faf5" font-size="21">second-degree AV block that can rapidly</text><text x="41" y="225" fill="#f6faf5" font-size="21">progress to complete heart block?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Mobitz Type II</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Mobitz Type II (2nd degree type II) is</text><text x="41" y="462" fill="#f6faf5" font-size="21">DANGEROUS — it can suddenly progress to</text><text x="41" y="489" fill="#f6faf5" font-size="21">complete (3rd degree) heart block or</text><text x="41" y="516" fill="#f6faf5" font-size="21">asystole without warning. Requires</text><text x="41" y="543" fill="#f6faf5" font-size="21">PACEMAKER. Wenckebach (Mobitz I) rarely</text><text x="41" y="570" fill="#f6faf5" font-size="21">progresses and often resolves on its own.</text></g></svg>