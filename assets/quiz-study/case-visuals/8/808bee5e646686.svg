<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>How does gastric ulcer pain differ from duodenal ulcer pain?</title><desc>Gastric: pain soon after eating, food does not help and may make it worse, higher malignancy risk. Duodenal: pain 1.5 to 3 hours after eating, relieved by food.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Gastric vs Duodenal Ulcer</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">How does gastric ulcer pain differ from</text><text x="41" y="198" fill="#f6faf5" font-size="21">duodenal ulcer pain?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Gastric pain occurs soon after eating and</text><text x="41" y="330" fill="#f6faf5" font-size="21">may not be relieved or may be worsened by</text><text x="41" y="357" fill="#f6faf5" font-size="21">food; it also carries a higher malignancy</text><text x="41" y="384" fill="#f6faf5" font-size="21">risk</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Gastric: pain soon after eating, food does</text><text x="41" y="516" fill="#f6faf5" font-size="21">not help and may make it worse, higher</text><text x="41" y="543" fill="#f6faf5" font-size="21">malignancy risk. Duodenal: pain 1.5 to 3</text><text x="41" y="570" fill="#f6faf5" font-size="21">hours after eating, relieved by food.</text></g></svg>