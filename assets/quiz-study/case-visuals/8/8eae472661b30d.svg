<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client admitted with pernicious anemia reports numbness and tingling in both feet and an unsteady gait. Which teaching point is most important for the nurse to reinforce?</title><desc>Pernicious anemia is a lack of intrinsic factor , so oral B12 cannot be absorbed and lifelong IM injections are required. Folate is the tempting choice because B12 and folate deficiency look identical on a blood count, but folate deficiency does not produce neurologic signs — the numbness and gait changes are what identify this as B12.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematologic Disorders</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client admitted with pernicious anemia</text><text x="41" y="198" fill="#f6faf5" font-size="21">reports numbness and tingling in both feet</text><text x="41" y="225" fill="#f6faf5" font-size="21">and an unsteady gait. Which teaching point</text><text x="41" y="252" fill="#f6faf5" font-size="21">is most important for the nurse to</text><text x="41" y="279" fill="#f6faf5" font-size="21">reinforce?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Vitamin B12 will be needed as lifelong</text><text x="41" y="411" fill="#f6faf5" font-size="21">intramuscular injections</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Pernicious anemia is a lack of intrinsic</text><text x="41" y="543" fill="#f6faf5" font-size="21">factor , so oral B12 cannot be absorbed</text><text x="41" y="570" fill="#f6faf5" font-size="21">and lifelong IM injections are required.</text></g></svg>