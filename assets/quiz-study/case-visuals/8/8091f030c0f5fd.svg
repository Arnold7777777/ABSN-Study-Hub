<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client with HIV has been taking antiretroviral therapy for three months and asks how the team will know the medication is working. Which laboratory value does the nurse identify?</title><desc>Viral load is what tracks how well ART is working, and therapy lowers it. CD4 is the tempting choice because it is the monitoring lab for HIV itself and rises with treatment, but response to therapy is judged by viral load; WBC is not the HIV monitoring lab at all.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Infectious Diseases &amp; HIV</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with HIV has been taking</text><text x="41" y="198" fill="#f6faf5" font-size="21">antiretroviral therapy for three months</text><text x="41" y="225" fill="#f6faf5" font-size="21">and asks how the team will know the</text><text x="41" y="252" fill="#f6faf5" font-size="21">medication is working. Which laboratory</text><text x="41" y="279" fill="#f6faf5" font-size="21">value does the nurse identify?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Viral load</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Viral load is what tracks how well ART is</text><text x="41" y="516" fill="#f6faf5" font-size="21">working, and therapy lowers it. CD4 is the</text><text x="41" y="543" fill="#f6faf5" font-size="21">tempting choice because it is the</text><text x="41" y="570" fill="#f6faf5" font-size="21">monitoring lab for HIV itself and rises</text><text x="41" y="597" fill="#f6faf5" font-size="21">with treatment, but response to therapy is</text><text x="41" y="624" fill="#f6faf5" font-size="21">judged by viral load; WBC is not the HIV</text><text x="41" y="651" fill="#f6faf5" font-size="21">monitoring lab at all.</text></g></svg>