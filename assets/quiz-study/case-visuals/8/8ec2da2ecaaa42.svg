<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is teaching a group of older adults about age-related changes in the urinary system. Which of the following changes should the nurse identify as an expected finding of aging?</title><desc>AGING PRODUCES DECREASED BLADDER CAPACITY AND MUSCLE TONE, A WEAKER STREAM, INCREASED RESIDUAL VOLUME, AND NOCTURIA, along with reduced renal blood flow and a decreased ability to CONCENTRATE urine. INCONTINENCE IS NEVER A NORMAL PART OF AGING and always warrants assessment, even though age-related changes make it more common.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Aging and Urinary Function</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a group of older</text><text x="41" y="198" fill="#f6faf5" font-size="21">adults about age-related changes in the</text><text x="41" y="225" fill="#f6faf5" font-size="21">urinary system. Which of the following</text><text x="41" y="252" fill="#f6faf5" font-size="21">changes should the nurse identify as an</text><text x="41" y="279" fill="#f6faf5" font-size="21">expected finding of aging?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Decreased bladder capacity and increased</text><text x="41" y="411" fill="#f6faf5" font-size="21">nocturia</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">AGING PRODUCES DECREASED BLADDER CAPACITY</text><text x="41" y="543" fill="#f6faf5" font-size="21">AND MUSCLE TONE, A WEAKER STREAM,</text><text x="41" y="570" fill="#f6faf5" font-size="21">INCREASED RESIDUAL VOLUME, AND NOCTURIA,</text><text x="41" y="597" fill="#f6faf5" font-size="21">along with reduced renal blood flow and a</text><text x="41" y="624" fill="#f6faf5" font-size="21">decreased ability to CONCENTRATE urine.</text></g></svg>