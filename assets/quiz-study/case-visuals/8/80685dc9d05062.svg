<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is reviewing supplements with a client scheduled for surgery in 3 weeks. Which of the following should the nurse instruct the client to stop because of bleeding risk? (Select all that apply.)</title><desc>The bleed-risk group is the 4 G’s + E + O : garlic, ginger, ginkgo, ginseng, vitamin E, omega-3. All supplements should generally be stopped 2–3 weeks before surgery, but the ones asked about for bleeding are those. Saw palmetto is for BPH and melatonin is for sleep.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is reviewing supplements with a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client scheduled for surgery in 3 weeks.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which of the following should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">instruct the client to stop because of</text><text x="41" y="279" fill="#f6faf5" font-size="21">bleeding risk? (Select all that apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Ginkgo biloba · Garlic · Vitamin E ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Ginger</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The bleed-risk group is the 4 G’s + E + O</text><text x="41" y="543" fill="#f6faf5" font-size="21">: garlic, ginger, ginkgo, ginseng, vitamin</text><text x="41" y="570" fill="#f6faf5" font-size="21">E, omega-3. All supplements should</text><text x="41" y="597" fill="#f6faf5" font-size="21">generally be stopped 2–3 weeks before</text><text x="41" y="624" fill="#f6faf5" font-size="21">surgery, but the ones asked about for</text><text x="41" y="651" fill="#f6faf5" font-size="21">bleeding are those. Saw palmetto is for</text><text x="41" y="678" fill="#f6faf5" font-size="21">BPH and melatonin is for sleep.</text></g></svg>