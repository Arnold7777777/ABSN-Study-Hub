<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A 14-year-old arrives with a glucose of 480 mg/dL, Kussmaul respirations, fruity breath, dry mucous membranes and lethargy. Which intervention should the nurse initiate first?</title><desc>In pediatric DKA, isotonic IV fluid resuscitation comes first , with the insulin infusion typically started 1 to 2 hours later, specifically to reduce cerebral edema risk. Oral fluids are unsafe with dehydration and altered consciousness, and urine output must be verified before any IV potassium .</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Endocrine &amp; Metabolic</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 14-year-old arrives with a glucose of</text><text x="41" y="198" fill="#f6faf5" font-size="21">480 mg/dL, Kussmaul respirations, fruity</text><text x="41" y="225" fill="#f6faf5" font-size="21">breath, dry mucous membranes and lethargy.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which intervention should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">initiate first?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">An isotonic intravenous fluid bolus</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">In pediatric DKA, isotonic IV fluid</text><text x="41" y="516" fill="#f6faf5" font-size="21">resuscitation comes first , with the</text><text x="41" y="543" fill="#f6faf5" font-size="21">insulin infusion typically started 1 to 2</text><text x="41" y="570" fill="#f6faf5" font-size="21">hours later, specifically to reduce</text><text x="41" y="597" fill="#f6faf5" font-size="21">cerebral edema risk. Oral fluids are</text><text x="41" y="624" fill="#f6faf5" font-size="21">unsafe with dehydration and altered</text><text x="41" y="651" fill="#f6faf5" font-size="21">consciousness, and urine output must be</text><text x="41" y="678" fill="#f6faf5" font-size="21">verified before any IV potassium .</text></g></svg>