<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse has taught a client about clozapine therapy. Which statement indicates that the teaching was effective?</title><desc>Clozapine requires scheduled absolute neutrophil count monitoring, and fever or sore throat may be the first sign of agranulocytosis , which is fatal if the drug is not stopped. The statement about stopping blood tests after 6 months is tempting because monitoring intervals do lengthen over time, but they never stop entirely while the client is on the drug. Hypersalivation is a common benign effect, and after missing 48 hours or more the drug must be retitrated to avoid severe hypotension.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology: Clozapine</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse has taught a client about</text><text x="41" y="198" fill="#f6faf5" font-size="21">clozapine therapy. Which statement</text><text x="41" y="225" fill="#f6faf5" font-size="21">indicates that the teaching was effective?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">I need to go for my blood counts on</text><text x="41" y="357" fill="#f6faf5" font-size="21">schedule, and I will call right away if I</text><text x="41" y="384" fill="#f6faf5" font-size="21">get a fever or sore throat</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Clozapine requires scheduled absolute</text><text x="41" y="516" fill="#f6faf5" font-size="21">neutrophil count monitoring, and fever or</text><text x="41" y="543" fill="#f6faf5" font-size="21">sore throat may be the first sign of</text><text x="41" y="570" fill="#f6faf5" font-size="21">agranulocytosis , which is fatal if the</text><text x="41" y="597" fill="#f6faf5" font-size="21">drug is not stopped.</text></g></svg>