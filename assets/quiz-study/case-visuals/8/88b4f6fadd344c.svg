<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A nurse is teaching a client who has narcolepsy about daily management. Which instructions should the nurse include? Select all that apply.</title><desc>A fixed schedule, scheduled short naps, prescribed stimulants, and workplace accommodation all reduce sleep attacks and injury risk. Driving on a familiar route is still driving and does not prevent an attack, and alcohol fragments sleep and worsens daytime sleepiness.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Narcolepsy Teaching</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a client who has</text><text x="41" y="198" fill="#f6faf5" font-size="21">narcolepsy about daily management. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">instructions should the nurse include?</text><text x="41" y="252" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Keep the same sleep and wake times every</text><text x="41" y="384" fill="#f6faf5" font-size="21">day · Take short planned naps during the</text><text x="41" y="411" fill="#f6faf5" font-size="21">day · Take the prescribed stimulant on</text><text x="41" y="438" fill="#f6faf5" font-size="21">schedule · Tell your employer so hazardous</text><text x="41" y="465" fill="#f6faf5" font-size="21">tasks can be reassigned</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">A fixed schedule, scheduled short naps,</text><text x="41" y="597" fill="#f6faf5" font-size="21">prescribed stimulants, and workplace</text><text x="41" y="624" fill="#f6faf5" font-size="21">accommodation all reduce sleep attacks and</text><text x="41" y="651" fill="#f6faf5" font-size="21">injury risk. Driving on a familiar route</text><text x="41" y="678" fill="#f6faf5" font-size="21">is still driving and does not prevent an</text><text x="41" y="705" fill="#f6faf5" font-size="21">attack, and alcohol fragments sleep and</text><text x="41" y="732" fill="#f6faf5" font-size="21">worsens daytime sleepiness.</text></g></svg>