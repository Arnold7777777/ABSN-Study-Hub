<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is teaching the mother of an exclusively breastfed 5-month-old. Which statement indicates a need for further teaching?</title><desc>Breast milk requires vitamin D supplementation , and its iron stores run out by 4-6 months, so the no-supplement statement is the wrong one. The other three statements are all accurate as written.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Infant (0–1 year)</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching the mother of an</text><text x="41" y="198" fill="#f6faf5" font-size="21">exclusively breastfed 5-month-old. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">statement indicates a need for further</text><text x="41" y="252" fill="#f6faf5" font-size="21">teaching?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;Breast milk gives her everything she</text><text x="41" y="384" fill="#f6faf5" font-size="21">needs, so she does not need any</text><text x="41" y="411" fill="#f6faf5" font-size="21">supplement.&quot;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Breast milk requires vitamin D</text><text x="41" y="543" fill="#f6faf5" font-size="21">supplementation , and its iron stores run</text><text x="41" y="570" fill="#f6faf5" font-size="21">out by 4-6 months, so the no-supplement</text><text x="41" y="597" fill="#f6faf5" font-size="21">statement is the wrong one. The other</text><text x="41" y="624" fill="#f6faf5" font-size="21">three statements are all accurate as</text><text x="41" y="651" fill="#f6faf5" font-size="21">written.</text></g></svg>