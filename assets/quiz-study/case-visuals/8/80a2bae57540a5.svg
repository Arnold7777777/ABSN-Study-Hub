<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A client gives birth at 38 weeks and 2 days of gestation. Using ACOG definitions, how does the nurse document this birth?</title><desc>ACOG defines early term as 37 0/7 through 38 6/7 weeks, full term as 39 0/7 through 40 6/7, late term as 41 0/7 through 41 6/7, and post-term at 42 0/7 or beyond. Calling 38 2/7 full term is the common error.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client gives birth at 38 weeks and 2</text><text x="41" y="231" fill="#f6faf5" font-size="21">days of gestation. Using ACOG definitions,</text><text x="41" y="258" fill="#f6faf5" font-size="21">how does the nurse document this birth?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Early term</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">ACOG defines early term as 37 0/7 through</text><text x="41" y="495" fill="#f6faf5" font-size="21">38 6/7 weeks, full term as 39 0/7 through</text><text x="41" y="522" fill="#f6faf5" font-size="21">40 6/7, late term as 41 0/7 through 41</text><text x="41" y="549" fill="#f6faf5" font-size="21">6/7, and post-term at 42 0/7 or beyond.</text><text x="41" y="576" fill="#f6faf5" font-size="21">Calling 38 2/7 full term is the common</text><text x="41" y="603" fill="#f6faf5" font-size="21">error.</text></g></svg>