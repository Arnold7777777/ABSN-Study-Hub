<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>Which factors in a client&#x27;s history increase the risk of an ectopic pregnancy? Select all that apply.</title><desc>Anything that scars or narrows the fallopian tube or slows the egg raises the risk: PID and STIs such as chlamydia , a previous ectopic , tubal surgery, an IUD (if pregnancy occurs, it is more likely to be ectopic) and fertility treatment . A previous vaginal birth and blood type are not risk factors.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which factors in a client&#x27;s history</text><text x="41" y="231" fill="#f6faf5" font-size="21">increase the risk of an ectopic pregnancy?</text><text x="41" y="258" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Pelvic inflammatory disease · A previous</text><text x="41" y="390" fill="#f6faf5" font-size="21">chlamydia infection · Pregnancy with an</text><text x="41" y="417" fill="#f6faf5" font-size="21">IUD in place · A previous ectopic</text><text x="41" y="444" fill="#f6faf5" font-size="21">pregnancy · Infertility treatment</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Anything that scars or narrows the</text><text x="41" y="576" fill="#f6faf5" font-size="21">fallopian tube or slows the egg raises the</text><text x="41" y="603" fill="#f6faf5" font-size="21">risk: PID and STIs such as chlamydia , a</text><text x="41" y="630" fill="#f6faf5" font-size="21">previous ectopic , tubal surgery, an IUD</text><text x="41" y="657" fill="#f6faf5" font-size="21">(if pregnancy occurs, it is more likely to</text><text x="41" y="684" fill="#f6faf5" font-size="21">be ectopic) and fertility treatment . A</text><text x="41" y="711" fill="#f6faf5" font-size="21">previous vaginal birth and blood type are</text><text x="41" y="738" fill="#f6faf5" font-size="21">not risk factors.</text></g></svg>