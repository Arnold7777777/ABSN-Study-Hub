<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A nurse is teaching a client who is being discharged with home oxygen therapy. Which of the following instructions should the nurse include? (Select all that apply.)</title><desc>OXYGEN IS NOT FLAMMABLE BUT IT VIGOROUSLY SUPPORTS COMBUSTION, so all teaching centers on eliminating ignition sources: no smoking, distance from flames and heaters, cotton clothing to reduce static sparks, and an accessible fire extinguisher. Petroleum-based products are contraindicated because they are flammable in an oxygen-enriched environment, and a WATER-SOLUBLE lubricant is used instead. Electric razors and other spark-producing electrical devices are also avoided in an oxygen-enriched environment.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oxygen Safety</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a client who is being</text><text x="41" y="198" fill="#f6faf5" font-size="21">discharged with home oxygen therapy. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">of the following instructions should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse include? (Select all that apply.)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Place a No Smoking sign on the door of the</text><text x="41" y="384" fill="#f6faf5" font-size="21">home · Keep the oxygen source at least 10</text><text x="41" y="411" fill="#f6faf5" font-size="21">feet away from open flames, gas stoves,</text><text x="41" y="438" fill="#f6faf5" font-size="21">and space heaters · Wear cotton clothing</text><text x="41" y="465" fill="#f6faf5" font-size="21">rather than wool or…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">OXYGEN IS NOT FLAMMABLE BUT IT VIGOROUSLY</text><text x="41" y="597" fill="#f6faf5" font-size="21">SUPPORTS COMBUSTION, so all teaching</text><text x="41" y="624" fill="#f6faf5" font-size="21">centers on eliminating ignition sources:</text><text x="41" y="651" fill="#f6faf5" font-size="21">no smoking, distance from flames and</text><text x="41" y="678" fill="#f6faf5" font-size="21">heaters, cotton clothing to reduce static</text><text x="41" y="705" fill="#f6faf5" font-size="21">sparks, and an accessible fire</text><text x="41" y="732" fill="#f6faf5" font-size="21">extinguisher.</text></g></svg>