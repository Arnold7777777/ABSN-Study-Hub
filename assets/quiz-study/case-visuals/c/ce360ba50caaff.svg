<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>The client states, &quot;I&#x27;m not sure that the doctor has prescribed the correct medication for my sadness.&quot; Which would be a therapeutic nursing response?</title><desc>This response uses reflection/restating — repeating the client&#x27;s concern back to them in the nurse&#x27;s words to validate the feeling and encourage further exploration. A generalizes the client&#x27;s experience (&quot;a lot of clients&quot;) and is mildly non-therapeutic. C uses &quot;why&quot; (non-therapeutic). D defends the doctor (non-therapeutic) and dismisses the client&#x27;s concern.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The client states, &quot;I&#x27;m not sure that the</text><text x="41" y="198" fill="#f6faf5" font-size="21">doctor has prescribed the correct</text><text x="41" y="225" fill="#f6faf5" font-size="21">medication for my sadness.&quot; Which would be</text><text x="41" y="252" fill="#f6faf5" font-size="21">a therapeutic nursing response?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;So you think that this medication is not</text><text x="41" y="384" fill="#f6faf5" font-size="21">right for you?&quot;</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">This response uses reflection/restating —</text><text x="41" y="516" fill="#f6faf5" font-size="21">repeating the client&#x27;s concern back to</text><text x="41" y="543" fill="#f6faf5" font-size="21">them in the nurse&#x27;s words to validate the</text><text x="41" y="570" fill="#f6faf5" font-size="21">feeling and encourage further exploration.</text></g></svg>