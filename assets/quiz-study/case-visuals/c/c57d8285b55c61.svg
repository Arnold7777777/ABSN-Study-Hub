<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse observes a client using a metered-dose inhaler. Which of the following actions indicate correct technique? Select all that apply.</title><desc>Shake, exhale fully, actuate while inhaling, then hold the breath so the drug deposits in the airways rather than being exhaled. Fast forceful inhalation is wrong — it drives the aerosol onto the back of the throat instead of into the lower airways, which is exactly why a spacer is added for clients who struggle with timing.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Inhaler Technique</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse observes a client using a metered-</text><text x="41" y="198" fill="#f6faf5" font-size="21">dose inhaler. Which of the following</text><text x="41" y="225" fill="#f6faf5" font-size="21">actions indicate correct technique? Select</text><text x="41" y="252" fill="#f6faf5" font-size="21">all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Exhaling fully before inhaling the dose ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Pressing the canister down while breathing</text><text x="41" y="411" fill="#f6faf5" font-size="21">in · Holding the breath for several</text><text x="41" y="438" fill="#f6faf5" font-size="21">seconds after the puff · Shaking the</text><text x="41" y="465" fill="#f6faf5" font-size="21">inhaler before use</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Shake, exhale fully, actuate while</text><text x="41" y="597" fill="#f6faf5" font-size="21">inhaling, then hold the breath so the drug</text><text x="41" y="624" fill="#f6faf5" font-size="21">deposits in the airways rather than being</text><text x="41" y="651" fill="#f6faf5" font-size="21">exhaled.</text></g></svg>