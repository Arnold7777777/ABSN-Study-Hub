<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A nurse is instructing a female client on collecting a clean-catch midstream urine specimen. Which of the following instructions should the nurse include?</title><desc>THE PURPOSE OF A CLEAN-CATCH SPECIMEN IS TO MINIMIZE CONTAMINATION FROM PERINEAL AND URETHRAL FLORA, so the client cleanses front to back, holds the labia apart throughout voiding, discards the initial stream, and collects 30 to 60 mL midstream without touching the sterile interior of the container. COLLECTING THE FIRST PORTION OF THE STREAM IS INCORRECT because that urine flushes organisms from the distal urethra and produces a falsely positive culture. The specimen must reach the laboratory within 1 hour or be refrigerated, since bacteria multiply in urine left at room temperature and falsely elevate colony counts.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Urinary Specimens</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is instructing a female client on</text><text x="41" y="198" fill="#f6faf5" font-size="21">collecting a clean-catch midstream urine</text><text x="41" y="225" fill="#f6faf5" font-size="21">specimen. Which of the following</text><text x="41" y="252" fill="#f6faf5" font-size="21">instructions should the nurse include?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Separate the labia and cleanse from front</text><text x="41" y="384" fill="#f6faf5" font-size="21">to back with each towelette · Begin</text><text x="41" y="411" fill="#f6faf5" font-size="21">urinating into the toilet, then move the</text><text x="41" y="438" fill="#f6faf5" font-size="21">container into the stream to collect the</text><text x="41" y="465" fill="#f6faf5" font-size="21">specimen · Keep the labia…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">THE PURPOSE OF A CLEAN-CATCH SPECIMEN IS</text><text x="41" y="597" fill="#f6faf5" font-size="21">TO MINIMIZE CONTAMINATION FROM PERINEAL</text><text x="41" y="624" fill="#f6faf5" font-size="21">AND URETHRAL FLORA, so the client cleanses</text><text x="41" y="651" fill="#f6faf5" font-size="21">front to back, holds the labia apart</text><text x="41" y="678" fill="#f6faf5" font-size="21">throughout voiding, discards the initial</text><text x="41" y="705" fill="#f6faf5" font-size="21">stream, and collects 30 to 60 mL midstream</text><text x="41" y="732" fill="#f6faf5" font-size="21">without touching the sterile interior of</text><text x="41" y="759" fill="#f6faf5" font-size="21">the container.</text></g></svg>