<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A newborn is 24 hours old and has been formula feeding since birth. The nurse is collecting the heel stick for newborn screening. Which action is correct?</title><desc>The sample is taken from the outer lateral heel with a lancet no deeper than 2.4 mm , at 24 hours and after at least 24 hours of milk or formula. Using an alcohol pad for pressure is the tempting wrong answer; pressure is applied with dry gauze .</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Normal Newborn &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Thermoregulation</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A newborn is 24 hours old and has been</text><text x="41" y="231" fill="#f6faf5" font-size="21">formula feeding since birth. The nurse is</text><text x="41" y="258" fill="#f6faf5" font-size="21">collecting the heel stick for newborn</text><text x="41" y="285" fill="#f6faf5" font-size="21">screening. Which action is correct?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Puncture the outer lateral surface of the</text><text x="41" y="417" fill="#f6faf5" font-size="21">heel with a lancet no deeper than 2.4 mm</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">The sample is taken from the outer lateral</text><text x="41" y="549" fill="#f6faf5" font-size="21">heel with a lancet no deeper than 2.4 mm ,</text><text x="41" y="576" fill="#f6faf5" font-size="21">at 24 hours and after at least 24 hours of</text><text x="41" y="603" fill="#f6faf5" font-size="21">milk or formula. Using an alcohol pad for</text><text x="41" y="630" fill="#f6faf5" font-size="21">pressure is the tempting wrong answer;</text><text x="41" y="657" fill="#f6faf5" font-size="21">pressure is applied with dry gauze .</text></g></svg>