<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is assessing pain in an alert 5-year-old who is 1 day postoperative and can point to pictures. Which pain assessment tool is most appropriate?</title><desc>A picture-based FACES scale lets a preschooler who can point give an actual self-report, which is always preferred when the child can participate. The FLACC is a behavioral tool for children too young or too impaired to self-report, so using it here would discard information the child can provide.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">FACES Scale</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assessing pain in an alert</text><text x="41" y="198" fill="#f6faf5" font-size="21">5-year-old who is 1 day postoperative and</text><text x="41" y="225" fill="#f6faf5" font-size="21">can point to pictures. Which pain</text><text x="41" y="252" fill="#f6faf5" font-size="21">assessment tool is most appropriate?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">FACES scale</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">A picture-based FACES scale lets a</text><text x="41" y="489" fill="#f6faf5" font-size="21">preschooler who can point give an actual</text><text x="41" y="516" fill="#f6faf5" font-size="21">self-report, which is always preferred</text><text x="41" y="543" fill="#f6faf5" font-size="21">when the child can participate. The FLACC</text><text x="41" y="570" fill="#f6faf5" font-size="21">is a behavioral tool for children too</text><text x="41" y="597" fill="#f6faf5" font-size="21">young or too impaired to self-report, so</text><text x="41" y="624" fill="#f6faf5" font-size="21">using it here would discard information</text><text x="41" y="651" fill="#f6faf5" font-size="21">the child can provide.</text></g></svg>