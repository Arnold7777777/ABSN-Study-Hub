<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A client with epilepsy who just reported an aura (déjà vu and seeing spots) now has a tonic-clonic seizure that began at 1402. It is 1408 and the seizure is continuing. What should the nurse do?</title><desc>A tonic-clonic seizure usually lasts 1–3 minutes. More than 5 minutes is status epilepticus — an emergency needing IV medication now. Never restrain.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic Dysfunction &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Cerebrovascular Disorders</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client with epilepsy who just reported</text><text x="41" y="231" fill="#f6faf5" font-size="21">an aura (déjà vu and seeing spots) now has</text><text x="41" y="258" fill="#f6faf5" font-size="21">a tonic-clonic seizure that began at 1402.</text><text x="41" y="285" fill="#f6faf5" font-size="21">It is 1408 and the seizure is continuing.</text><text x="41" y="312" fill="#f6faf5" font-size="21">What should the nurse do?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Activate the emergency response system</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">A tonic-clonic seizure usually lasts 1–3</text><text x="41" y="549" fill="#f6faf5" font-size="21">minutes. More than 5 minutes is status</text><text x="41" y="576" fill="#f6faf5" font-size="21">epilepticus — an emergency needing IV</text><text x="41" y="603" fill="#f6faf5" font-size="21">medication now. Never restrain.</text></g></svg>