<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A 16-year-old in the OR develops jaw rigidity, unexplained tachycardia, and a sharply rising end-tidal CO2 fifteen minutes into a general anesthetic. Which action does the nurse anticipate FIRST?</title><desc>DANTROLENE IS THE ANTIDOTE, AND STOPPING THE TRIGGER GOES WITH IT. Rising end-tidal CO2 is the earliest sign and masseter rigidity with tachycardia is the earliest reliable clinical sign, so treatment starts long before the temperature climbs. Cooling and labs follow, they do not come first. Antipyretics do nothing here because the heat comes from muscle hypermetabolism, not the hypothalamus.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">MH Priority Action</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 16-year-old in the OR develops jaw</text><text x="41" y="198" fill="#f6faf5" font-size="21">rigidity, unexplained tachycardia, and a</text><text x="41" y="225" fill="#f6faf5" font-size="21">sharply rising end-tidal CO2 fifteen</text><text x="41" y="252" fill="#f6faf5" font-size="21">minutes into a general anesthetic. Which</text><text x="41" y="279" fill="#f6faf5" font-size="21">action does the nurse anticipate FIRST?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Stop the volatile anesthetic and prepare</text><text x="41" y="411" fill="#f6faf5" font-size="21">IV dantrolene</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">DANTROLENE IS THE ANTIDOTE, AND STOPPING</text><text x="41" y="543" fill="#f6faf5" font-size="21">THE TRIGGER GOES WITH IT.</text></g></svg>