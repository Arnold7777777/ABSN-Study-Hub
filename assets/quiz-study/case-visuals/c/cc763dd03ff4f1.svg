<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>The nurse double-checks an IV maintenance rate of 14 mL/hr for a 2-month-old who weighs 7 lb 9.6 oz. Using 100 mL/kg/day, what is the correct maintenance rate, and is 14 mL/hr acceptable?</title><desc>9.6 oz ÷ 16 = 0.6 lb, so 7.6 lb ÷ 2.2 = 3.45 kg. 3.45 kg × 100 mL/kg/day = 345 mL/day, and 345 ÷ 24 = 14.4 mL/hr , so 14 mL/hr is fine. 15.1 reads 9.6 oz as 0.96 lb, 31.7 skips the lb-to-kg step, and 345 is the daily total, not the hourly rate.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Respiratory</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse double-checks an IV maintenance</text><text x="41" y="198" fill="#f6faf5" font-size="21">rate of 14 mL/hr for a 2-month-old who</text><text x="41" y="225" fill="#f6faf5" font-size="21">weighs 7 lb 9.6 oz. Using 100 mL/kg/day,</text><text x="41" y="252" fill="#f6faf5" font-size="21">what is the correct maintenance rate, and</text><text x="41" y="279" fill="#f6faf5" font-size="21">is 14 mL/hr acceptable?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">About 14.4 mL/hr — 14 mL/hr is acceptable</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">9.6 oz ÷ 16 = 0.6 lb, so 7.6 lb ÷ 2.2 =</text><text x="41" y="516" fill="#f6faf5" font-size="21">3.45 kg. 3.45 kg × 100 mL/kg/day = 345</text><text x="41" y="543" fill="#f6faf5" font-size="21">mL/day, and 345 ÷ 24 = 14.4 mL/hr , so 14</text><text x="41" y="570" fill="#f6faf5" font-size="21">mL/hr is fine. 15.1 reads 9.6 oz as 0.96</text><text x="41" y="597" fill="#f6faf5" font-size="21">lb, 31.7 skips the lb-to-kg step, and 345</text><text x="41" y="624" fill="#f6faf5" font-size="21">is the daily total, not the hourly rate.</text></g></svg>