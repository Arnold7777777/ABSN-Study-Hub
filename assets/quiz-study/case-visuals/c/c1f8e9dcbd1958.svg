<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="431" viewBox="0 0 640 431"><title>30. Which statement by a nurse about seizure care requires further instruction?</title><desc>b. Never leave a seizing client. Stay and call for help using the call light. Side-lying, timing the seizure, and preparing an airway (for after) are all correct.</desc><rect width="640" height="431" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">30. Which statement by a nurse about</text><text x="41" y="198" fill="#f6faf5" font-size="21">seizure care requires further instruction?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">b. Never leave a seizing client. Stay and</text><text x="41" y="330" fill="#f6faf5" font-size="21">call for help using the call light. Side-</text><text x="41" y="357" fill="#f6faf5" font-size="21">lying, timing the seizure, and preparing</text><text x="41" y="384" fill="#f6faf5" font-size="21">an airway (for after) are all correct.</text></g></svg>