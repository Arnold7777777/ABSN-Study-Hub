<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="512" viewBox="0 0 640 512"><title>Pernicious anemia develops when the stomach fails to produce {0}, which is required for the absorption of {1} in the ileum.</title><desc>Intrinsic factor, secreted by gastric parietal cells, is essential for the absorption of vitamin B12 in the terminal ileum. Loss of intrinsic factor leads to B12 deficiency and pernicious anemia.</desc><rect width="640" height="512" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">pernicious anemia</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Pernicious anemia develops when the</text><text x="41" y="198" fill="#f6faf5" font-size="21">stomach fails to produce {0}, which is</text><text x="41" y="225" fill="#f6faf5" font-size="21">required for the absorption of {1} in the</text><text x="41" y="252" fill="#f6faf5" font-size="21">ileum.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">Intrinsic factor, secreted by gastric</text><text x="41" y="384" fill="#f6faf5" font-size="21">parietal cells, is essential for the</text><text x="41" y="411" fill="#f6faf5" font-size="21">absorption of vitamin B12 in the terminal</text><text x="41" y="438" fill="#f6faf5" font-size="21">ileum. Loss of intrinsic factor leads to</text><text x="41" y="465" fill="#f6faf5" font-size="21">B12 deficiency and pernicious anemia.</text></g></svg>