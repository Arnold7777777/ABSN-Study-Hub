<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>In addition to heart rate, blood pressure, respiratory rate, and temperature, the nurse needs to assess a client&#x27;s arterial oxygen saturation (SaO2). What procedure will best accomplish this?</title><desc>Pulse oximetry is a noninvasive procedure in which a small sensor is positioned over a pulsating vascular bed. It can be used during transport and causes the client no discomfort. An incentive spirometer is used to assist the client with deep breathing after surgery. ABG measurement can measure SaO2, but this is an invasive procedure that can be painful. Some clients with asthma use peak flow meters to measure levels of expired air.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 6 · ABGs</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">In addition to heart rate, blood pressure,</text><text x="41" y="198" fill="#f6faf5" font-size="21">respiratory rate, and temperature, the</text><text x="41" y="225" fill="#f6faf5" font-size="21">nurse needs to assess a client&#x27;s arterial</text><text x="41" y="252" fill="#f6faf5" font-size="21">oxygen saturation (SaO2). What procedure</text><text x="41" y="279" fill="#f6faf5" font-size="21">will best accomplish this?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Pulse oximetry</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Pulse oximetry is a noninvasive procedure</text><text x="41" y="516" fill="#f6faf5" font-size="21">in which a small sensor is positioned over</text><text x="41" y="543" fill="#f6faf5" font-size="21">a pulsating vascular bed.</text></g></svg>