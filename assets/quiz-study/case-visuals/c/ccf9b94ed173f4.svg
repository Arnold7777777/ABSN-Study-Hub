<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>33. A nurse is teaching home safety to a family with a 6-month-old infant. Which statement indicates understanding?</title><desc>b. Rear-facing until age 2 is current guidance. Back-to-sleep (not stomach) prevents SIDS; crib bumpers are a suffocation risk; solid foods at 6 mo of this type are a choking risk.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">33. A nurse is teaching home safety to a</text><text x="41" y="198" fill="#f6faf5" font-size="21">family with a 6-month-old infant. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">statement indicates understanding?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">b. Rear-facing until age 2 is current</text><text x="41" y="357" fill="#f6faf5" font-size="21">guidance. Back-to-sleep (not stomach)</text><text x="41" y="384" fill="#f6faf5" font-size="21">prevents SIDS; crib bumpers are a</text><text x="41" y="411" fill="#f6faf5" font-size="21">suffocation risk; solid foods at 6 mo of</text><text x="41" y="438" fill="#f6faf5" font-size="21">this type are a choking risk.</text></g></svg>