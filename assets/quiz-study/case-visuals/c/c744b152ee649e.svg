<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client who just received teriparatide reports dizziness on standing. Which response by the nurse is correct?</title><desc>Orthostatic hypotension can occur for up to 4 hours after teriparatide. Teach safety rather than stopping the drug. Teriparatide is subcutaneous only, is limited to 2 years of use, and is avoided when there is a history of skeletal malignancy or radiation because of osteosarcoma risk.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Teriparatide Safety</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who just received teriparatide</text><text x="41" y="198" fill="#f6faf5" font-size="21">reports dizziness on standing. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">response by the nurse is correct?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Sit or lie down when this happens; it can</text><text x="41" y="357" fill="#f6faf5" font-size="21">occur for up to 4 hours after a dose</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Orthostatic hypotension can occur for up</text><text x="41" y="489" fill="#f6faf5" font-size="21">to 4 hours after teriparatide. Teach</text><text x="41" y="516" fill="#f6faf5" font-size="21">safety rather than stopping the drug.</text><text x="41" y="543" fill="#f6faf5" font-size="21">Teriparatide is subcutaneous only, is</text><text x="41" y="570" fill="#f6faf5" font-size="21">limited to 2 years of use, and is avoided</text><text x="41" y="597" fill="#f6faf5" font-size="21">when there is a history of skeletal</text><text x="41" y="624" fill="#f6faf5" font-size="21">malignancy or radiation because of</text><text x="41" y="651" fill="#f6faf5" font-size="21">osteosarcoma risk.</text></g></svg>