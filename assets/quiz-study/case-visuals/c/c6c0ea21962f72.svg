<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse reviews the assignment on an acute psychiatric unit. Which client is at greatest risk for neuroleptic malignant syndrome?</title><desc>The classic NMS risk profile is a young male who is dehydrated, agitated, and rapidly loaded with a high-potency first-generation antipsychotic . The client with restlessness on lurasidone is tempting because akathisia is an extrapyramidal symptom, but akathisia alone does not predict NMS. A long-stable second-generation dose and antipsychotic-related weight gain are metabolic and chronic concerns, not NMS precursors.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology: NMS Risk</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse reviews the assignment on an acute</text><text x="41" y="198" fill="#f6faf5" font-size="21">psychiatric unit. Which client is at</text><text x="41" y="225" fill="#f6faf5" font-size="21">greatest risk for neuroleptic malignant</text><text x="41" y="252" fill="#f6faf5" font-size="21">syndrome?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">A young man who is dehydrated and agitated</text><text x="41" y="384" fill="#f6faf5" font-size="21">and has received several rapid</text><text x="41" y="411" fill="#f6faf5" font-size="21">intramuscular doses of haloperidol today</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The classic NMS risk profile is a young</text><text x="41" y="543" fill="#f6faf5" font-size="21">male who is dehydrated, agitated, and</text><text x="41" y="570" fill="#f6faf5" font-size="21">rapidly loaded with a high-potency first-</text><text x="41" y="597" fill="#f6faf5" font-size="21">generation antipsychotic .</text></g></svg>