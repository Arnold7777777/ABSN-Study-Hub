<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which actions should the nurse include for a newborn under phototherapy? Select all that apply.</title><desc>Maximum skin exposure for the light to work, eyes covered to protect the retina, turned often so every surface is treated, and temperature and hydration watched - she can overheat and loses extra water through the skin and stools. No lotions or oils - they can burn under the lights.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which actions should the nurse include for</text><text x="41" y="198" fill="#f6faf5" font-size="21">a newborn under phototherapy? Select all</text><text x="41" y="225" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Increase feeding frequency · Reposition</text><text x="41" y="357" fill="#f6faf5" font-size="21">frequently · Monitor temperature · Remove</text><text x="41" y="384" fill="#f6faf5" font-size="21">clothing except the nappy · Cover the eyes</text><text x="41" y="411" fill="#f6faf5" font-size="21">while under the lights</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Maximum skin exposure for the light to</text><text x="41" y="543" fill="#f6faf5" font-size="21">work, eyes covered to protect the retina,</text><text x="41" y="570" fill="#f6faf5" font-size="21">turned often so every surface is treated,</text><text x="41" y="597" fill="#f6faf5" font-size="21">and temperature and hydration watched -</text><text x="41" y="624" fill="#f6faf5" font-size="21">she can overheat and loses extra water</text><text x="41" y="651" fill="#f6faf5" font-size="21">through the skin and stools. No lotions or</text><text x="41" y="678" fill="#f6faf5" font-size="21">oils - they can burn under the lights.</text></g></svg>