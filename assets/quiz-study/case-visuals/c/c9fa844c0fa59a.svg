<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>The caregiver of a 4-year-old with a polyurethane resin cast on her arm calls because the child is crying that her arm itches. She used a hanger to scratch under her own casts but worries it is too sharp for the child. Which statement by the nurse is appropriate?</title><desc>Nothing goes inside a cast , because objects scratch the skin and can be lost inside. Cool air from a hair dryer or fan, or an ice pack over the cast, eases itching. Do not soak it, and do not put creams under it.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Musculoskeletal</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The caregiver of a 4-year-old with a</text><text x="41" y="198" fill="#f6faf5" font-size="21">polyurethane resin cast on her arm calls</text><text x="41" y="225" fill="#f6faf5" font-size="21">because the child is crying that her arm</text><text x="41" y="252" fill="#f6faf5" font-size="21">itches.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">“Nothing should be put into the cast. You</text><text x="41" y="384" fill="#f6faf5" font-size="21">can blow cool air into it with a hair</text><text x="41" y="411" fill="#f6faf5" font-size="21">dryer.”</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Nothing goes inside a cast , because</text><text x="41" y="543" fill="#f6faf5" font-size="21">objects scratch the skin and can be lost</text><text x="41" y="570" fill="#f6faf5" font-size="21">inside. Cool air from a hair dryer or fan,</text><text x="41" y="597" fill="#f6faf5" font-size="21">or an ice pack over the cast, eases</text><text x="41" y="624" fill="#f6faf5" font-size="21">itching. Do not soak it, and do not put</text><text x="41" y="651" fill="#f6faf5" font-size="21">creams under it.</text></g></svg>