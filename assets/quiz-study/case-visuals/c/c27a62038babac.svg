<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client asks why her sertraline has not worked after four days when the drug reaches steady blood levels within a week. Which explanation reflects the underlying mechanism?</title><desc>SSRIs block reuptake within hours, but the flood of serotonin first stimulates inhibitory presynaptic autoreceptors that dampen firing; only after those receptors downregulate over 2 to 4 weeks does net transmission and downstream BDNF -driven plasticity increase. Fat accumulation, de novo synthesis, and enzyme induction do not explain the lag. The nurse uses this to support adherence through the early period when side effects arrive before benefit.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client asks why her sertraline has not</text><text x="41" y="198" fill="#f6faf5" font-size="21">worked after four days when the drug</text><text x="41" y="225" fill="#f6faf5" font-size="21">reaches steady blood levels within a week.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which explanation reflects the underlying</text><text x="41" y="279" fill="#f6faf5" font-size="21">mechanism?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Reuptake blockade is immediate, but mood</text><text x="41" y="411" fill="#f6faf5" font-size="21">improves only after presynaptic</text><text x="41" y="438" fill="#f6faf5" font-size="21">autoreceptors downregulate and</text><text x="41" y="465" fill="#f6faf5" font-size="21">postsynaptic signaling adapts</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">SSRIs block reuptake within hours, but the</text><text x="41" y="597" fill="#f6faf5" font-size="21">flood of serotonin first stimulates</text><text x="41" y="624" fill="#f6faf5" font-size="21">inhibitory presynaptic autoreceptors that</text><text x="41" y="651" fill="#f6faf5" font-size="21">dampen firing;</text></g></svg>