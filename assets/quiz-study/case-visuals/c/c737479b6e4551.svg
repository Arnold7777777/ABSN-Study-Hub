<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which statements reflect correct principles of surgical asepsis? Select all that apply.</title><desc>Sterility is maintained by keeping the field above the waist and in vision, treating the outer 1 inch border as contaminated, and dropping items from about 6 inches above without reaching over the field. Anything below the waist or out of sight is contaminated even if wrapped, and speed never makes reaching across acceptable.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sterile Principles</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which statements reflect correct</text><text x="41" y="198" fill="#f6faf5" font-size="21">principles of surgical asepsis? Select all</text><text x="41" y="225" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The sterile field is kept above waist</text><text x="41" y="357" fill="#f6faf5" font-size="21">level and in view · The outer 1 inch of</text><text x="41" y="384" fill="#f6faf5" font-size="21">the sterile field is considered</text><text x="41" y="411" fill="#f6faf5" font-size="21">contaminated · Sterile items are dropped</text><text x="41" y="438" fill="#f6faf5" font-size="21">onto the field from about 6 inches…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Sterility is maintained by keeping the</text><text x="41" y="570" fill="#f6faf5" font-size="21">field above the waist and in vision,</text><text x="41" y="597" fill="#f6faf5" font-size="21">treating the outer 1 inch border as</text><text x="41" y="624" fill="#f6faf5" font-size="21">contaminated, and dropping items from</text><text x="41" y="651" fill="#f6faf5" font-size="21">about 6 inches above without reaching over</text><text x="41" y="678" fill="#f6faf5" font-size="21">the field.</text></g></svg>