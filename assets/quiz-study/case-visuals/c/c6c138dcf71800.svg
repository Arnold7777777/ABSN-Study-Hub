<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is providing the first postoperative meal tray for a client whose prescription reads clear liquid diet. Which of the following items on the tray should the nurse remove?</title><desc>A CLEAR LIQUID DIET INCLUDES ONLY LIQUIDS THAT ARE TRANSPARENT AND LEAVE NO RESIDUE, such as broth, gelatin, clear juices without pulp, popsicles, tea, and black coffee. ICE CREAM AND OTHER MILK-BASED ITEMS BELONG TO THE FULL LIQUID DIET, which is the next step in the progression NPO to clear liquid to full liquid to soft or mechanical soft to regular.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Diets</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is providing the first</text><text x="41" y="198" fill="#f6faf5" font-size="21">postoperative meal tray for a client whose</text><text x="41" y="225" fill="#f6faf5" font-size="21">prescription reads clear liquid diet.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which of the following items on the tray</text><text x="41" y="279" fill="#f6faf5" font-size="21">should the nurse remove?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Vanilla ice cream</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A CLEAR LIQUID DIET INCLUDES ONLY LIQUIDS</text><text x="41" y="516" fill="#f6faf5" font-size="21">THAT ARE TRANSPARENT AND LEAVE NO RESIDUE,</text><text x="41" y="543" fill="#f6faf5" font-size="21">such as broth, gelatin, clear juices</text><text x="41" y="570" fill="#f6faf5" font-size="21">without pulp, popsicles, tea, and black</text><text x="41" y="597" fill="#f6faf5" font-size="21">coffee.</text></g></svg>