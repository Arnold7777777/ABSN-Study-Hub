<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is developing a plan of care for a client at risk for falls. Which interventions should the nurse include?</title><desc>A low locked bed, accessible call light, nonskid footwear, and a clear lit path all reduce the chance of a fall and the injury if one occurs. Four raised side rails is the tempting choice because it looks protective, but it is considered a restraint and clients climb over the rails and fall from a greater height. Unassisted ambulation in a high-risk client is unsafe.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Fall Prevention Plan</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is developing a plan of care for a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client at risk for falls. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">interventions should the nurse include?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Keep the bed in the lowest position with</text><text x="41" y="357" fill="#f6faf5" font-size="21">the wheels locked · Place the call light</text><text x="41" y="384" fill="#f6faf5" font-size="21">and personal items within the client&#x27;s</text><text x="41" y="411" fill="#f6faf5" font-size="21">reach · Provide nonskid footwear whenever</text><text x="41" y="438" fill="#f6faf5" font-size="21">the client is out of bed…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">A low locked bed, accessible call light,</text><text x="41" y="570" fill="#f6faf5" font-size="21">nonskid footwear, and a clear lit path all</text><text x="41" y="597" fill="#f6faf5" font-size="21">reduce the chance of a fall and the injury</text><text x="41" y="624" fill="#f6faf5" font-size="21">if one occurs.</text></g></svg>