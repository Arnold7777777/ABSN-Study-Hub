<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which findings should the nurse expect in a client who has peripheral ARTERIAL disease?</title><desc>Arterial disease is not enough blood getting in : pain on walking that stops with rest, cool, dry, hairless skin, thick nails, weak pulses , and ulcers on the toes and pressure points that are dry and punched out. Venous disease is the mirror image - warm, brown-stained skin, edema that improves with elevation , and wet ulcers at the inner ankle . It decides the positioning: arterial legs hang down, venous legs go up.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which findings should the nurse expect in</text><text x="41" y="198" fill="#f6faf5" font-size="21">a client who has peripheral ARTERIAL</text><text x="41" y="225" fill="#f6faf5" font-size="21">disease?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Intermittent claudication, hair loss, cool</text><text x="41" y="357" fill="#f6faf5" font-size="21">dry skin and diminished pulses</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Arterial disease is not enough blood</text><text x="41" y="489" fill="#f6faf5" font-size="21">getting in : pain on walking that stops</text><text x="41" y="516" fill="#f6faf5" font-size="21">with rest, cool, dry, hairless skin, thick</text><text x="41" y="543" fill="#f6faf5" font-size="21">nails, weak pulses , and ulcers on the</text><text x="41" y="570" fill="#f6faf5" font-size="21">toes and pressure points that are dry and</text><text x="41" y="597" fill="#f6faf5" font-size="21">punched out.</text></g></svg>