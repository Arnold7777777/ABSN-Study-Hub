<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A hospital-wide disaster alert is announced and the charge nurse must free medical-surgical beds. Which clients does the nurse identify as appropriate for early discharge? Select all that apply.</title><desc>The clients discharged first are the most stable - those already awaiting discharge, day-surgery clients, and stable chronic clients. Continuous water-seal bubbling signals an air leak and the post-decompression client is still unstable, so neither is stable enough to leave despite having a plan of care that looks routine.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Disaster, Mass Casualty &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Emergency Nursing</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A hospital-wide disaster alert is</text><text x="41" y="231" fill="#f6faf5" font-size="21">announced and the charge nurse must free</text><text x="41" y="258" fill="#f6faf5" font-size="21">medical-surgical beds. Which clients does</text><text x="41" y="285" fill="#f6faf5" font-size="21">the nurse identify as appropriate for</text><text x="41" y="312" fill="#f6faf5" font-size="21">early discharge? Select all that apply.</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">A client already awaiting discharge</text><text x="41" y="444" fill="#f6faf5" font-size="21">paperwork · A day-surgery client who is</text><text x="41" y="471" fill="#f6faf5" font-size="21">awake and ambulating · A stable client</text><text x="41" y="498" fill="#f6faf5" font-size="21">with a well-controlled chronic condition</text><path d="M319 522v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="538" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 551) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="572" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="603" fill="#f6faf5" font-size="21">The clients discharged first are the most</text><text x="41" y="630" fill="#f6faf5" font-size="21">stable - those already awaiting discharge,</text><text x="41" y="657" fill="#f6faf5" font-size="21">day-surgery clients, and stable chronic</text><text x="41" y="684" fill="#f6faf5" font-size="21">clients.</text></g></svg>