<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is discussing complementary therapies that nurses can provide without specialized licensing or certification. Which therapies should the nurse include? Select all that apply.</title><desc>Guided imagery, breath work, humor, music, simple touch, and meditation are within nursing practice and need no separate credential. Chiropractic manipulation and acupuncture require a licensed or certified practitioner, so the nurse arranges a referral rather than performing them.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Complementary Therapy</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is discussing complementary</text><text x="41" y="198" fill="#f6faf5" font-size="21">therapies that nurses can provide without</text><text x="41" y="225" fill="#f6faf5" font-size="21">specialized licensing or certification.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which therapies should the nurse include?</text><text x="41" y="279" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Guided imagery · Breath work · Humor ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Playing music at the bedside</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Guided imagery, breath work, humor, music,</text><text x="41" y="543" fill="#f6faf5" font-size="21">simple touch, and meditation are within</text><text x="41" y="570" fill="#f6faf5" font-size="21">nursing practice and need no separate</text><text x="41" y="597" fill="#f6faf5" font-size="21">credential. Chiropractic manipulation and</text><text x="41" y="624" fill="#f6faf5" font-size="21">acupuncture require a licensed or</text><text x="41" y="651" fill="#f6faf5" font-size="21">certified practitioner, so the nurse</text><text x="41" y="678" fill="#f6faf5" font-size="21">arranges a referral rather than performing</text><text x="41" y="705" fill="#f6faf5" font-size="21">them.</text></g></svg>