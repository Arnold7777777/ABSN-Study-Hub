<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse teaches stress-management techniques to a parent who has verbally abused their children. This intervention is an example of which level of prevention?</title><desc>The abuse has already occurred , so the goal is rehabilitation and preventing recurrence — that is tertiary . The same class taught to a parent who has not abused would be primary . Ask “has the problem already happened?” before choosing.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse teaches stress-management</text><text x="41" y="198" fill="#f6faf5" font-size="21">techniques to a parent who has verbally</text><text x="41" y="225" fill="#f6faf5" font-size="21">abused their children. This intervention</text><text x="41" y="252" fill="#f6faf5" font-size="21">is an example of which level of</text><text x="41" y="279" fill="#f6faf5" font-size="21">prevention?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Tertiary prevention</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">The abuse has already occurred , so the</text><text x="41" y="516" fill="#f6faf5" font-size="21">goal is rehabilitation and preventing</text><text x="41" y="543" fill="#f6faf5" font-size="21">recurrence — that is tertiary . The same</text><text x="41" y="570" fill="#f6faf5" font-size="21">class taught to a parent who has not</text><text x="41" y="597" fill="#f6faf5" font-size="21">abused would be primary . Ask “has the</text><text x="41" y="624" fill="#f6faf5" font-size="21">problem already happened?” before</text><text x="41" y="651" fill="#f6faf5" font-size="21">choosing.</text></g></svg>