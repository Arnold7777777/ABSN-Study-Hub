<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which techniques help when assessing a toddler? Select all that apply.</title><desc>Toddlers cooperate on their own terms: quiet-to-invasive order , caregiver in reach, ears and throat last because they are the worst part, and letting them touch the equipment turns it from a threat into an object. Undressing completely at the start hands away their sense of control immediately.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which techniques help when assessing a</text><text x="41" y="198" fill="#f6faf5" font-size="21">toddler? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Perform the least invasive parts first ·</text><text x="41" y="330" fill="#f6faf5" font-size="21">Keep the caregiver present · Examine the</text><text x="41" y="357" fill="#f6faf5" font-size="21">ears and throat last · Let the child</text><text x="41" y="384" fill="#f6faf5" font-size="21">handle the stethoscope</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Toddlers cooperate on their own terms:</text><text x="41" y="516" fill="#f6faf5" font-size="21">quiet-to-invasive order , caregiver in</text><text x="41" y="543" fill="#f6faf5" font-size="21">reach, ears and throat last because they</text><text x="41" y="570" fill="#f6faf5" font-size="21">are the worst part, and letting them touch</text><text x="41" y="597" fill="#f6faf5" font-size="21">the equipment turns it from a threat into</text><text x="41" y="624" fill="#f6faf5" font-size="21">an object. Undressing completely at the</text><text x="41" y="651" fill="#f6faf5" font-size="21">start hands away their sense of control</text><text x="41" y="678" fill="#f6faf5" font-size="21">immediately.</text></g></svg>