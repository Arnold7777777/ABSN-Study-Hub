<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client who takes glipizide becomes shaky and diaphoretic and reports a headache during morning care. She is awake and able to swallow. Which actions does the nurse take? Select all that apply.</title><desc>Shakiness, sweating and headache in a client on a sulfonylurea point straight to hypoglycemia: check the glucose, treat with 15 g of fast carbohydrate, and recheck in 15 minutes. Glucagon is for the client who is unconscious or cannot swallow, so it is the wrong route here, and withholding oral treatment lets a low glucose keep falling.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Diabetes</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who takes glipizide becomes shaky</text><text x="41" y="198" fill="#f6faf5" font-size="21">and diaphoretic and reports a headache</text><text x="41" y="225" fill="#f6faf5" font-size="21">during morning care. She is awake and able</text><text x="41" y="252" fill="#f6faf5" font-size="21">to swallow. Which actions does the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">take? Select all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Check the blood glucose · Give 15 g of</text><text x="41" y="411" fill="#f6faf5" font-size="21">fast carbohydrate such as 3 glucose</text><text x="41" y="438" fill="#f6faf5" font-size="21">tablets · Recheck the glucose 15 minutes</text><text x="41" y="465" fill="#f6faf5" font-size="21">after treating</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Shakiness, sweating and headache in a</text><text x="41" y="597" fill="#f6faf5" font-size="21">client on a sulfonylurea point straight to</text><text x="41" y="624" fill="#f6faf5" font-size="21">hypoglycemia: check the glucose, treat</text><text x="41" y="651" fill="#f6faf5" font-size="21">with 15 g of fast carbohydrate, and</text><text x="41" y="678" fill="#f6faf5" font-size="21">recheck in 15 minutes.</text></g></svg>