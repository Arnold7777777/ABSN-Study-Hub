<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="536" viewBox="0 0 640 536"><title>At 1000 a nurse notes that 800 mL remains in a client&#x27;s IV bag infusing at 150 mL/hr. Approximately how much longer will the infusion take?</title><desc>FORMULA: volume remaining divided by rate = 800 mL divided by 150 mL/hr = 5.33 hr. TO CONVERT THE DECIMAL PORTION TO MINUTES, MULTIPLY BY 60, NOT BY 100: 0.33 x 60 = 20 min, so the answer is 5 hr 20 min (the bag empties at about 1520). The classic wrong answer is 5 hr 33 min, from reading the decimal .33 directly as 33 minutes. Answering 6 hr comes from rounding the hours up instead of converting the remainder.</desc><rect width="640" height="536" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Infusion Time</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">At 1000 a nurse notes that 800 mL remains</text><text x="41" y="198" fill="#f6faf5" font-size="21">in a client&#x27;s IV bag infusing at 150</text><text x="41" y="225" fill="#f6faf5" font-size="21">mL/hr. Approximately how much longer will</text><text x="41" y="252" fill="#f6faf5" font-size="21">the infusion take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">5 hr 20 min</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">FORMULA: volume remaining divided by rate</text><text x="41" y="489" fill="#f6faf5" font-size="21">= 800 mL divided by 150 mL/hr = 5.33 hr.</text></g></svg>