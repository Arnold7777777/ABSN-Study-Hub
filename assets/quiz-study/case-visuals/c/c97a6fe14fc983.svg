<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse plans to auscultate a client&#x27;s bowel sounds and normal breath sounds. Which part of the stethoscope should the nurse use?</title><desc>The diaphragm transmits high-pitched sounds such as breath sounds, bowel sounds, and normal heart sounds and is pressed firmly to seal against the skin. The bell is held lightly and is reserved for low-pitched sounds such as murmurs and bruits, and pressing the bell firmly turns it into a diaphragm and filters out the very sounds it was chosen for.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Auscultation</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse plans to auscultate a client&#x27;s</text><text x="41" y="198" fill="#f6faf5" font-size="21">bowel sounds and normal breath sounds.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which part of the stethoscope should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse use?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">The diaphragm, pressed firmly against the</text><text x="41" y="384" fill="#f6faf5" font-size="21">skin</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">The diaphragm transmits high-pitched</text><text x="41" y="516" fill="#f6faf5" font-size="21">sounds such as breath sounds, bowel</text><text x="41" y="543" fill="#f6faf5" font-size="21">sounds, and normal heart sounds and is</text><text x="41" y="570" fill="#f6faf5" font-size="21">pressed firmly to seal against the skin.</text></g></svg>