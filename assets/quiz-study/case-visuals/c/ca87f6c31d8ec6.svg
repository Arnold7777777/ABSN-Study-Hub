<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is performing a complete pain assessment using the OLDCARTS framework for a client reporting abdominal pain. Which data should the nurse collect?</title><desc>A COMPLETE PAIN ASSESSMENT COVERS ONSET, LOCATION AND RADIATION, DURATION, CHARACTER OR QUALITY, AGGRAVATING AND ALLEVIATING FACTORS, TIMING, SEVERITY, AND THE CLIENT&#x27;S FUNCTIONAL GOAL FOR PAIN CONTROL. Quality descriptors matter clinically because burning, shooting, or tingling pain suggests NEUROPATHIC pain requiring adjuvant agents rather than an opioid alone. Insurance coverage is a discharge planning concern, and substituting the nurse&#x27;s judgment for the client&#x27;s report is a leading cause of undertreated pain because SELF-REPORT IS THE GOLD STANDARD.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Pain Assessment</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is performing a complete pain</text><text x="41" y="198" fill="#f6faf5" font-size="21">assessment using the OLDCARTS framework</text><text x="41" y="225" fill="#f6faf5" font-size="21">for a client reporting abdominal pain.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which data should the nurse collect?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">When the pain started and whether it began</text><text x="41" y="384" fill="#f6faf5" font-size="21">suddenly or gradually · Where the pain is</text><text x="41" y="411" fill="#f6faf5" font-size="21">located and whether it radiates · What the</text><text x="41" y="438" fill="#f6faf5" font-size="21">pain feels like, such as burning,</text><text x="41" y="465" fill="#f6faf5" font-size="21">cramping, or aching · What…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">A COMPLETE PAIN ASSESSMENT COVERS ONSET,</text><text x="41" y="597" fill="#f6faf5" font-size="21">LOCATION AND RADIATION, DURATION,</text><text x="41" y="624" fill="#f6faf5" font-size="21">CHARACTER OR QUALITY, AGGRAVATING AND</text><text x="41" y="651" fill="#f6faf5" font-size="21">ALLEVIATING FACTORS, TIMING, SEVERITY, AND</text><text x="41" y="678" fill="#f6faf5" font-size="21">THE CLIENT&#x27;S FUNCTIONAL GOAL FOR PAIN</text><text x="41" y="705" fill="#f6faf5" font-size="21">CONTROL.</text></g></svg>