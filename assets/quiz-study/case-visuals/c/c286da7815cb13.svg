<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>Several clients arrive at the ED entrance after a chemical release at a nearby plant. Which actions does the nurse take before these clients enter the treatment area? Select all that apply.</title><desc>PPE protects the nurse first, removing clothing and jewelry alone removes most of the contaminant, and copious head-to-toe irrigation happens in a dedicated decon zone. Taking the sickest client in undecontaminated is the tempting everyday priority but it contaminates the ED, and the runoff must be contained.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Disaster, Mass Casualty &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Emergency Nursing</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Several clients arrive at the ED entrance</text><text x="41" y="231" fill="#f6faf5" font-size="21">after a chemical release at a nearby</text><text x="41" y="258" fill="#f6faf5" font-size="21">plant. Which actions does the nurse take</text><text x="41" y="285" fill="#f6faf5" font-size="21">before these clients enter the treatment</text><text x="41" y="312" fill="#f6faf5" font-size="21">area? Select all that apply.</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Don personal protective equipment before</text><text x="41" y="444" fill="#f6faf5" font-size="21">any client contact · Remove all of each</text><text x="41" y="471" fill="#f6faf5" font-size="21">client&#x27;s clothing and jewelry · Irrigate</text><text x="41" y="498" fill="#f6faf5" font-size="21">head-to-toe with copious soap and water in</text><text x="41" y="525" fill="#f6faf5" font-size="21">a dedicated decon zone</text><path d="M319 549v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="565" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 578) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="599" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="630" fill="#f6faf5" font-size="21">PPE protects the nurse first, removing</text><text x="41" y="657" fill="#f6faf5" font-size="21">clothing and jewelry alone removes most of</text><text x="41" y="684" fill="#f6faf5" font-size="21">the contaminant, and copious head-to-toe</text><text x="41" y="711" fill="#f6faf5" font-size="21">irrigation happens in a dedicated decon</text><text x="41" y="738" fill="#f6faf5" font-size="21">zone.</text></g></svg>