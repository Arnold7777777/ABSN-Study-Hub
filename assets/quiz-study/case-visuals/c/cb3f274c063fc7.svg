<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>Which findings on the pre-MRI screening must the nurse report before the client goes to the scanner? Select all that apply.</title><desc>The scanner is a powerful magnet, so implanted or embedded metal can heat, malfunction or shift, and clips of unknown composition are treated as unsafe until proven otherwise. Removable jewelry is not a contraindication at all, it is simply taken off before the client enters the room.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">MRI safety</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which findings on the pre-MRI screening</text><text x="41" y="198" fill="#f6faf5" font-size="21">must the nurse report before the client</text><text x="41" y="225" fill="#f6faf5" font-size="21">goes to the scanner? Select all that</text><text x="41" y="252" fill="#f6faf5" font-size="21">apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Permanent pacemaker · Cochlear implant ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Aneurysm clip of unknown type · Retained</text><text x="41" y="411" fill="#f6faf5" font-size="21">metal fragments from welding</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The scanner is a powerful magnet, so</text><text x="41" y="543" fill="#f6faf5" font-size="21">implanted or embedded metal can heat,</text><text x="41" y="570" fill="#f6faf5" font-size="21">malfunction or shift, and clips of unknown</text><text x="41" y="597" fill="#f6faf5" font-size="21">composition are treated as unsafe until</text><text x="41" y="624" fill="#f6faf5" font-size="21">proven otherwise. Removable jewelry is not</text><text x="41" y="651" fill="#f6faf5" font-size="21">a contraindication at all, it is simply</text><text x="41" y="678" fill="#f6faf5" font-size="21">taken off before the client enters the</text><text x="41" y="705" fill="#f6faf5" font-size="21">room.</text></g></svg>