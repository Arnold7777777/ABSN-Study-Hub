<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A client who has taken a first-generation antipsychotic for eight years develops slow, writhing tongue and lip movements that persist even after the drug is reduced. Which mechanism explains this, and how does it differ from acute dystonia?</title><desc>Tardive dyskinesia arises after months to years when sustained D2 blockade drives receptor upregulation and supersensitivity , producing late, often irreversible choreoathetoid movements that can worsen on dose reduction and are treated with VMAT2 inhibitors such as valbenazine. Acute dystonia appears within hours to days as sustained painful muscle spasm from an acute dopamine-acetylcholine imbalance and reverses quickly with anticholinergics such as benztropine or diphenhydramine. Benztropine helps dystonia but can worsen TD, so the distinction changes the intervention.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology: EPS Treatment</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who has taken a first-generation</text><text x="41" y="198" fill="#f6faf5" font-size="21">antipsychotic for eight years develops</text><text x="41" y="225" fill="#f6faf5" font-size="21">slow, writhing tongue and lip movements</text><text x="41" y="252" fill="#f6faf5" font-size="21">that persist even after the drug is</text><text x="41" y="279" fill="#f6faf5" font-size="21">reduced.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Chronic D2 blockade causes postsynaptic</text><text x="41" y="411" fill="#f6faf5" font-size="21">receptor upregulation and</text><text x="41" y="438" fill="#f6faf5" font-size="21">supersensitivity; acute dystonia is an</text><text x="41" y="465" fill="#f6faf5" font-size="21">early, reversible dopamine-acetylcholine</text><text x="41" y="492" fill="#f6faf5" font-size="21">imbalance</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">Tardive dyskinesia arises after months to</text><text x="41" y="624" fill="#f6faf5" font-size="21">years when sustained D2 blockade drives</text><text x="41" y="651" fill="#f6faf5" font-size="21">receptor upregulation and supersensitivity</text><text x="41" y="678" fill="#f6faf5" font-size="21">, producing late, often irreversible</text><text x="41" y="705" fill="#f6faf5" font-size="21">choreoathetoid movements that can worsen</text><text x="41" y="732" fill="#f6faf5" font-size="21">on dose reduction and are treated with</text><text x="41" y="759" fill="#f6faf5" font-size="21">VMAT2 inhibitors such as valbenazine.</text></g></svg>