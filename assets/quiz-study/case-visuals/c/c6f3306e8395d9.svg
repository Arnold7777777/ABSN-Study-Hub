<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A nurse is teaching a client about squatting exercises during pregnancy. Which of the following statements should the nurse include?</title><desc>Squatting stretches and strengthens the perineal and pelvic floor muscles and widens the pelvic outlet for the second stage; it is taught as roughly 15 minutes daily, with support for balance. It does not target the abdomen, and weight loss is never the purpose of a prenatal exercise. Relief of low back pain from the shifted center of gravity comes from the pelvic tilt, not squatting. General fitness is not why it is prescribed.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nutrition &amp; Health Promotion in</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is teaching a client about</text><text x="41" y="231" fill="#f6faf5" font-size="21">squatting exercises during pregnancy.</text><text x="41" y="258" fill="#f6faf5" font-size="21">Which of the following statements should</text><text x="41" y="285" fill="#f6faf5" font-size="21">the nurse include?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">“These exercises should be done for 15</text><text x="41" y="417" fill="#f6faf5" font-size="21">minutes each day to strengthen the</text><text x="41" y="444" fill="#f6faf5" font-size="21">perineal muscles.”</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Squatting stretches and strengthens the</text><text x="41" y="576" fill="#f6faf5" font-size="21">perineal and pelvic floor muscles and</text><text x="41" y="603" fill="#f6faf5" font-size="21">widens the pelvic outlet for the second</text><text x="41" y="630" fill="#f6faf5" font-size="21">stage;</text></g></svg>