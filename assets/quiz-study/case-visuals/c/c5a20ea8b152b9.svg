<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client received intravenous potassium replacement for a serum potassium of 2.8 mEq/L. Which finding indicates the treatment was effective?</title><desc>A potassium in the normal range together with the disappearance of U waves , the electrocardiographic signature of hypokalemia, confirms both the laboratory and the physiologic problem resolved. The most tempting wrong answer is 5.6 mEq/L, which shows the level rose but overshot into hyperkalemia. Burning at the site is an infusion-related irritation, and absent reflexes indicate a neuromuscular problem rather than success.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Potassium Replacement</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client received intravenous potassium</text><text x="41" y="198" fill="#f6faf5" font-size="21">replacement for a serum potassium of 2.8</text><text x="41" y="225" fill="#f6faf5" font-size="21">mEq/L. Which finding indicates the</text><text x="41" y="252" fill="#f6faf5" font-size="21">treatment was effective?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Serum potassium of 3.8 mEq/L with</text><text x="41" y="384" fill="#f6faf5" font-size="21">resolution of the U waves on the monitor</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A potassium in the normal range together</text><text x="41" y="516" fill="#f6faf5" font-size="21">with the disappearance of U waves , the</text><text x="41" y="543" fill="#f6faf5" font-size="21">electrocardiographic signature of</text><text x="41" y="570" fill="#f6faf5" font-size="21">hypokalemia, confirms both the laboratory</text><text x="41" y="597" fill="#f6faf5" font-size="21">and the physiologic problem resolved.</text></g></svg>