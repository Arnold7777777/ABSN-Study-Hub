<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client has a sudden gush of amniotic fluid, followed by fetal bradycardia and a visible loop of cord at the introitus. What does the nurse do first?</title><desc>Relieve the pressure immediately — knee-chest or Trendelenburg, and a gloved hand holding the presenting part off the cord until birth. Never push the cord back in. Keep an exposed cord moist with warm sterile saline, give oxygen, and prepare for emergency cesarean. This is one of the true obstetric emergencies.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has a sudden gush of amniotic</text><text x="41" y="198" fill="#f6faf5" font-size="21">fluid, followed by fetal bradycardia and a</text><text x="41" y="225" fill="#f6faf5" font-size="21">visible loop of cord at the introitus.</text><text x="41" y="252" fill="#f6faf5" font-size="21">What does the nurse do first?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Place the client in knee-chest or</text><text x="41" y="384" fill="#f6faf5" font-size="21">Trendelenburg position and lift the</text><text x="41" y="411" fill="#f6faf5" font-size="21">presenting part off the cord</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Relieve the pressure immediately — knee-</text><text x="41" y="543" fill="#f6faf5" font-size="21">chest or Trendelenburg, and a gloved hand</text><text x="41" y="570" fill="#f6faf5" font-size="21">holding the presenting part off the cord</text><text x="41" y="597" fill="#f6faf5" font-size="21">until birth.</text></g></svg>