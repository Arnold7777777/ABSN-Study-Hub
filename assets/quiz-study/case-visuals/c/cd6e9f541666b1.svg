<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A provider performs needle decompression for a tension pneumothorax. What should the nurse expect to occur?</title><desc>After puncture, the needle is removed and the catheter stays, giving trapped air a route out and relieving mediastinal compression until a chest tube is placed. Sealing the site airtight would re-trap air and allow the tension to rebuild.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Needle Decompression</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A provider performs needle decompression</text><text x="41" y="198" fill="#f6faf5" font-size="21">for a tension pneumothorax. What should</text><text x="41" y="225" fill="#f6faf5" font-size="21">the nurse expect to occur?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The needle is removed and the catheter</text><text x="41" y="357" fill="#f6faf5" font-size="21">remains so trapped air can escape</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">After puncture, the needle is removed and</text><text x="41" y="489" fill="#f6faf5" font-size="21">the catheter stays, giving trapped air a</text><text x="41" y="516" fill="#f6faf5" font-size="21">route out and relieving mediastinal</text><text x="41" y="543" fill="#f6faf5" font-size="21">compression until a chest tube is placed.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Sealing the site airtight would re-trap</text><text x="41" y="597" fill="#f6faf5" font-size="21">air and allow the tension to rebuild.</text></g></svg>