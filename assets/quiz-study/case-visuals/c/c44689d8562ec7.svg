<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A 5-year-old who weighs 50 lb has had 220 mL of urine output over the past 6 hours. What is the urine output in mL/kg/hr?</title><desc>50 lb ÷ 2.2 = 22.73 kg; 220 mL ÷ 22.73 kg ÷ 6 hr = 1.61 mL/kg/hr . 0.73 skips the lb-to-kg step, 9.68 forgets to divide by 6 hours, and 0.33 multiplies by 2.2 instead of dividing.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Gastrointestinal</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 5-year-old who weighs 50 lb has had 220</text><text x="41" y="198" fill="#f6faf5" font-size="21">mL of urine output over the past 6 hours.</text><text x="41" y="225" fill="#f6faf5" font-size="21">What is the urine output in mL/kg/hr?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">1.61 mL/kg/hr</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">50 lb ÷ 2.2 = 22.73 kg; 220 mL ÷ 22.73 kg</text><text x="41" y="462" fill="#f6faf5" font-size="21">÷ 6 hr = 1.61 mL/kg/hr . 0.73 skips the</text><text x="41" y="489" fill="#f6faf5" font-size="21">lb-to-kg step, 9.68 forgets to divide by 6</text><text x="41" y="516" fill="#f6faf5" font-size="21">hours, and 0.33 multiplies by 2.2 instead</text><text x="41" y="543" fill="#f6faf5" font-size="21">of dividing.</text></g></svg>