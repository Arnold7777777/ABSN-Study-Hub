<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A health care worker&#x27;s tuberculin skin test, read at 48 hours, shows 14 mm of induration. Which statement by the nurse is accurate?</title><desc>For health care workers 10 mm or more is positive (5 mm for HIV, immunosuppression or close contacts; 15 mm for people with no risk factors). A positive test shows infection, not necessarily active disease : a chest x-ray and, if needed, sputum cultures decide that.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Infectious Diseases &amp; HIV</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A health care worker&#x27;s tuberculin skin</text><text x="41" y="198" fill="#f6faf5" font-size="21">test, read at 48 hours, shows 14 mm of</text><text x="41" y="225" fill="#f6faf5" font-size="21">induration. Which statement by the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">is accurate?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">A positive test means you have been</text><text x="41" y="384" fill="#f6faf5" font-size="21">infected with TB; a chest x-ray is needed</text><text x="41" y="411" fill="#f6faf5" font-size="21">to check for active disease</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">For health care workers 10 mm or more is</text><text x="41" y="543" fill="#f6faf5" font-size="21">positive (5 mm for HIV, immunosuppression</text><text x="41" y="570" fill="#f6faf5" font-size="21">or close contacts; 15 mm for people with</text><text x="41" y="597" fill="#f6faf5" font-size="21">no risk factors). A positive test shows</text><text x="41" y="624" fill="#f6faf5" font-size="21">infection, not necessarily active disease</text><text x="41" y="651" fill="#f6faf5" font-size="21">: a chest x-ray and, if needed, sputum</text><text x="41" y="678" fill="#f6faf5" font-size="21">cultures decide that.</text></g></svg>