<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse administers a tuberculin skin test intradermally on the client&#x27;s inner forearm and notes that no wheal forms at the site. Which action should the nurse take?</title><desc>ABSENCE OF A BLEB OR WHEAL MEANS THE SOLUTION WAS DEPOSITED TOO DEEPLY (SUBCUTANEOUSLY), THE TEST IS INVALID, AND IT MUST BE REPEATED AT ANOTHER SITE AT LEAST 5 cm AWAY, WITH BOTH ATTEMPTS DOCUMENTED. Intradermal injections use a 26 to 27 gauge needle inserted 5 to 15 degrees with the bevel up. Massaging would disperse the solution and further invalidate the result rather than fix it.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intradermal Injections</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse administers a tuberculin skin test</text><text x="41" y="198" fill="#f6faf5" font-size="21">intradermally on the client&#x27;s inner</text><text x="41" y="225" fill="#f6faf5" font-size="21">forearm and notes that no wheal forms at</text><text x="41" y="252" fill="#f6faf5" font-size="21">the site. Which action should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">take?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Repeat the injection at a site at least 5</text><text x="41" y="411" fill="#f6faf5" font-size="21">cm (2 in) from the original site</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">ABSENCE OF A BLEB OR WHEAL MEANS THE</text><text x="41" y="543" fill="#f6faf5" font-size="21">SOLUTION WAS DEPOSITED TOO DEEPLY</text><text x="41" y="570" fill="#f6faf5" font-size="21">(SUBCUTANEOUSLY), THE TEST IS INVALID, AND</text><text x="41" y="597" fill="#f6faf5" font-size="21">IT MUST BE REPEATED AT ANOTHER SITE AT</text><text x="41" y="624" fill="#f6faf5" font-size="21">LEAST 5 cm AWAY, WITH BOTH ATTEMPTS</text><text x="41" y="651" fill="#f6faf5" font-size="21">DOCUMENTED.</text></g></svg>