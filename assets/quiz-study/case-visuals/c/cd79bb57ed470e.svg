<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>A nurse is admitting an infant who weighs 15 lb 8 oz. What is the infant&#x27;s weight in kilograms? (Round to the nearest hundredth.)</title><desc>STEP 1, convert ounces to pounds: 16 oz = 1 lb, so 8 oz divided by 16 = 0.5 lb, giving 15.5 lb. STEP 2, convert to kilograms: 1 kg = 2.2 lb, SO 15.5 lb divided by 2.2 = 7.045, WHICH ROUNDS TO 7.05 kg. A common wrong answer is 7.50, from writing 15 lb 8 oz as 15.8 lb; another is 6.82, from dropping the 8 oz entirely (15 divided by 2.2). Choosing 34.10 means the student MULTIPLIED by 2.2 instead of dividing, which is the error to watch for since pounds are always the larger number.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Weight Conversion</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is admitting an infant who weighs</text><text x="41" y="198" fill="#f6faf5" font-size="21">15 lb 8 oz. What is the infant&#x27;s weight in</text><text x="41" y="225" fill="#f6faf5" font-size="21">kilograms? (Round to the nearest</text><text x="41" y="252" fill="#f6faf5" font-size="21">hundredth.)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">7.05 kg</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">STEP 1, convert ounces to pounds: 16 oz =</text><text x="41" y="489" fill="#f6faf5" font-size="21">1 lb, so 8 oz divided by 16 = 0.5 lb,</text><text x="41" y="516" fill="#f6faf5" font-size="21">giving 15.5 lb.</text></g></svg>