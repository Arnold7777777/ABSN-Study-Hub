<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which position should the nurse recommend at 26 weeks to improve blood flow to the placenta?</title><desc>Side-lying takes the uterus off the vena cava , so more blood returns to the heart and more reaches the placenta. Lying flat on the back can cause supine hypotension - dizziness, nausea, a falling blood pressure and a change in the fetal heart rate. The fix is simply to turn her onto her side .</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which position should the nurse recommend</text><text x="41" y="198" fill="#f6faf5" font-size="21">at 26 weeks to improve blood flow to the</text><text x="41" y="225" fill="#f6faf5" font-size="21">placenta?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Side-lying, preferably on the left</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Side-lying takes the uterus off the vena</text><text x="41" y="462" fill="#f6faf5" font-size="21">cava , so more blood returns to the heart</text><text x="41" y="489" fill="#f6faf5" font-size="21">and more reaches the placenta. Lying flat</text><text x="41" y="516" fill="#f6faf5" font-size="21">on the back can cause supine hypotension -</text><text x="41" y="543" fill="#f6faf5" font-size="21">dizziness, nausea, a falling blood</text><text x="41" y="570" fill="#f6faf5" font-size="21">pressure and a change in the fetal heart</text><text x="41" y="597" fill="#f6faf5" font-size="21">rate. The fix is simply to turn her onto</text><text x="41" y="624" fill="#f6faf5" font-size="21">her side .</text></g></svg>