<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="566" viewBox="0 0 640 566"><title>201. A nurse recognizes which interventions reduce the risk of a CAUTI (catheter-associated UTI)? (Select all that apply)</title><desc>b, e, f, g. Keep the bag below the bladder (no backflow), remove the catheter ASAP, keep tubing unkinked, and do perineal care. Prophylactic antibiotics aren&#x27;t used; monitoring for fever detects (not prevents) infection; routine irrigation breaks the closed system.</desc><rect width="640" height="566" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">201. A nurse recognizes which</text><text x="41" y="198" fill="#f6faf5" font-size="21">interventions reduce the risk of a CAUTI</text><text x="41" y="225" fill="#f6faf5" font-size="21">(catheter-associated UTI)? (Select all</text><text x="41" y="252" fill="#f6faf5" font-size="21">that apply)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="249" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">b, e, f, g. Keep the bag below the bladder</text><text x="41" y="384" fill="#f6faf5" font-size="21">(no backflow), remove the catheter ASAP,</text><text x="41" y="411" fill="#f6faf5" font-size="21">keep tubing unkinked, and do perineal</text><text x="41" y="438" fill="#f6faf5" font-size="21">care. Prophylactic antibiotics aren&#x27;t</text><text x="41" y="465" fill="#f6faf5" font-size="21">used; monitoring for fever detects (not</text><text x="41" y="492" fill="#f6faf5" font-size="21">prevents) infection; routine irrigation</text><text x="41" y="519" fill="#f6faf5" font-size="21">breaks the closed system.</text></g></svg>