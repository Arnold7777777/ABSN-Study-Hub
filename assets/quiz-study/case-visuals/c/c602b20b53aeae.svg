<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="566" viewBox="0 0 640 566"><title>Before a CT scan with contrast the nurse confirms whether the client is allergic to {0} and reviews the {1}; after the scan the client should {2}.</title><desc>Contrast media are iodine based and are cleared by the kidneys, so an iodine allergy and impaired renal function are the two things to catch before the scan. Afterward, hydration flushes the contrast out and protects the kidneys, which is the opposite of keeping the client NPO.</desc><rect width="640" height="566" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">CT with contrast</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Before a CT scan with contrast the nurse</text><text x="41" y="198" fill="#f6faf5" font-size="21">confirms whether the client is allergic to</text><text x="41" y="225" fill="#f6faf5" font-size="21">{0} and reviews the {1}; after the scan</text><text x="41" y="252" fill="#f6faf5" font-size="21">the client should {2}.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="249" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">Contrast media are iodine based and are</text><text x="41" y="384" fill="#f6faf5" font-size="21">cleared by the kidneys, so an iodine</text><text x="41" y="411" fill="#f6faf5" font-size="21">allergy and impaired renal function are</text><text x="41" y="438" fill="#f6faf5" font-size="21">the two things to catch before the scan.</text><text x="41" y="465" fill="#f6faf5" font-size="21">Afterward, hydration flushes the contrast</text><text x="41" y="492" fill="#f6faf5" font-size="21">out and protects the kidneys, which is the</text><text x="41" y="519" fill="#f6faf5" font-size="21">opposite of keeping the client NPO.</text></g></svg>