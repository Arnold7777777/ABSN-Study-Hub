<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>The nurse is monitoring a client receiving oxytocin. Contractions are lasting 100 seconds and occurring every 90 seconds. What is the nurse&#x27;s first action?</title><desc>This is tachysystole — contractions too long and too close for the placenta to refill. Stop the oxytocin first , then turn her on her side, give a fluid bolus and oxygen, and notify the provider.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is monitoring a client receiving</text><text x="41" y="198" fill="#f6faf5" font-size="21">oxytocin. Contractions are lasting 100</text><text x="41" y="225" fill="#f6faf5" font-size="21">seconds and occurring every 90 seconds.</text><text x="41" y="252" fill="#f6faf5" font-size="21">What is the nurse&#x27;s first action?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Stop the oxytocin infusion</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">This is tachysystole — contractions too</text><text x="41" y="489" fill="#f6faf5" font-size="21">long and too close for the placenta to</text><text x="41" y="516" fill="#f6faf5" font-size="21">refill. Stop the oxytocin first , then</text><text x="41" y="543" fill="#f6faf5" font-size="21">turn her on her side, give a fluid bolus</text><text x="41" y="570" fill="#f6faf5" font-size="21">and oxygen, and notify the provider.</text></g></svg>