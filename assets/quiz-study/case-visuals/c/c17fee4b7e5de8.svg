<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse listens over a client&#x27;s right lower quadrant and hears no bowel sounds after 30 seconds. Which action should the nurse take?</title><desc>Bowel sounds are irregular, so absence can only be documented after listening for up to 5 minutes in a quadrant. Palpating to stimulate sounds is doubly wrong here because it changes the very motility being assessed and produces a finding that is not the client&#x27;s baseline.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Bowel Sounds</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse listens over a client&#x27;s right</text><text x="41" y="198" fill="#f6faf5" font-size="21">lower quadrant and hears no bowel sounds</text><text x="41" y="225" fill="#f6faf5" font-size="21">after 30 seconds. Which action should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Listen in each quadrant for up to 5</text><text x="41" y="384" fill="#f6faf5" font-size="21">minutes before documenting absent bowel</text><text x="41" y="411" fill="#f6faf5" font-size="21">sounds</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Bowel sounds are irregular, so absence can</text><text x="41" y="543" fill="#f6faf5" font-size="21">only be documented after listening for up</text><text x="41" y="570" fill="#f6faf5" font-size="21">to 5 minutes in a quadrant. Palpating to</text><text x="41" y="597" fill="#f6faf5" font-size="21">stimulate sounds is doubly wrong here</text><text x="41" y="624" fill="#f6faf5" font-size="21">because it changes the very motility being</text><text x="41" y="651" fill="#f6faf5" font-size="21">assessed and produces a finding that is</text><text x="41" y="678" fill="#f6faf5" font-size="21">not the client&#x27;s baseline.</text></g></svg>