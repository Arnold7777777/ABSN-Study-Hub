<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>A nurse is assessing a 67-year-old client who has a tracheostomy. Which of the following findings indicates that the client needs to be suctioned?</title><desc>COARSE GURGLING over the trachea means SECRETIONS are pooling in the airway, which is a direct indication to suction. A normal respiratory rate, a good SpO2, and clear breath sounds all show a patent airway with no need to suction. Other true indications include restlessness, a falling SpO2, visible secretions, an ineffective cough, tachypnea, and rising peak airway pressures on a ventilator.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Recognizing the Need for</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Suctioning</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is assessing a 67-year-old client</text><text x="41" y="231" fill="#f6faf5" font-size="21">who has a tracheostomy. Which of the</text><text x="41" y="258" fill="#f6faf5" font-size="21">following findings indicates that the</text><text x="41" y="285" fill="#f6faf5" font-size="21">client needs to be suctioned?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Coarse gurgling sounds auscultated over</text><text x="41" y="417" fill="#f6faf5" font-size="21">the trachea</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">COARSE GURGLING over the trachea means</text><text x="41" y="549" fill="#f6faf5" font-size="21">SECRETIONS are pooling in the airway,</text><text x="41" y="576" fill="#f6faf5" font-size="21">which is a direct indication to suction.</text></g></svg>