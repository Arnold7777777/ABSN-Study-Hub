<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="539" viewBox="0 0 640 539"><title>147. A client with a chest tube on water-seal drainage has absent tidaling and bubbling in the water-seal chamber, with increased SOB and chest discomfort. Which action should the nurse take?</title><desc>c. Absent tidaling/bubbling with worsening symptoms means the system isn&#x27;t communicating (kink/occlusion), not full re-expansion; check tubing and notify the provider.</desc><rect width="640" height="539" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">147. A client with a chest tube on water-</text><text x="41" y="198" fill="#f6faf5" font-size="21">seal drainage has absent tidaling and</text><text x="41" y="225" fill="#f6faf5" font-size="21">bubbling in the water-seal chamber, with</text><text x="41" y="252" fill="#f6faf5" font-size="21">increased SOB and chest discomfort. Which</text><text x="41" y="279" fill="#f6faf5" font-size="21">action should the nurse take?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="384" fill="#f6faf5" font-size="21">c. Absent tidaling/bubbling with worsening</text><text x="41" y="411" fill="#f6faf5" font-size="21">symptoms means the system isn&#x27;t</text><text x="41" y="438" fill="#f6faf5" font-size="21">communicating (kink/occlusion), not full</text><text x="41" y="465" fill="#f6faf5" font-size="21">re-expansion; check tubing and notify the</text><text x="41" y="492" fill="#f6faf5" font-size="21">provider.</text></g></svg>