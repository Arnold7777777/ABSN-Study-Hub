<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is caring for a client with metastatic pancreatic cancer who has chosen to discontinue curative treatments and focus on comfort measures. The client expresses a desire to remain at home surrounded by family. Which type of care should the nurse recommend?</title><desc>Hospice is for terminal clients (prognosis of 6 months or less) who have stopped curative treatment , and the client&#x27;s stated goal is to be at home, so home hospice fits. Palliative care can run alongside curative treatment, and the other options put the client in a facility.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hospice vs palliative care</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client with</text><text x="41" y="198" fill="#f6faf5" font-size="21">metastatic pancreatic cancer who has</text><text x="41" y="225" fill="#f6faf5" font-size="21">chosen to discontinue curative treatments</text><text x="41" y="252" fill="#f6faf5" font-size="21">and focus on comfort measures.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Hospice care at home</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Hospice is for terminal clients (prognosis</text><text x="41" y="489" fill="#f6faf5" font-size="21">of 6 months or less) who have stopped</text><text x="41" y="516" fill="#f6faf5" font-size="21">curative treatment , and the client&#x27;s</text><text x="41" y="543" fill="#f6faf5" font-size="21">stated goal is to be at home, so home</text><text x="41" y="570" fill="#f6faf5" font-size="21">hospice fits. Palliative care can run</text><text x="41" y="597" fill="#f6faf5" font-size="21">alongside curative treatment, and the</text><text x="41" y="624" fill="#f6faf5" font-size="21">other options put the client in a</text><text x="41" y="651" fill="#f6faf5" font-size="21">facility.</text></g></svg>