<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is preparing to visualize the tympanic membrane of a 4-year-old admitted with a suspected ear infection. How should the nurse position the pinna for this assessment?</title><desc>The ear assessment technique flips to up and back after age 3 , and this child is 4. Down and back is the tempting answer because it is the technique for the younger child, and students often carry it across the whole pediatric age range.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Toddler &amp; Preschooler</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to visualize the</text><text x="41" y="198" fill="#f6faf5" font-size="21">tympanic membrane of a 4-year-old admitted</text><text x="41" y="225" fill="#f6faf5" font-size="21">with a suspected ear infection. How should</text><text x="41" y="252" fill="#f6faf5" font-size="21">the nurse position the pinna for this</text><text x="41" y="279" fill="#f6faf5" font-size="21">assessment?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Pull the pinna up and back</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">The ear assessment technique flips to up</text><text x="41" y="516" fill="#f6faf5" font-size="21">and back after age 3 , and this child is</text><text x="41" y="543" fill="#f6faf5" font-size="21">4. Down and back is the tempting answer</text><text x="41" y="570" fill="#f6faf5" font-size="21">because it is the technique for the</text><text x="41" y="597" fill="#f6faf5" font-size="21">younger child, and students often carry it</text><text x="41" y="624" fill="#f6faf5" font-size="21">across the whole pediatric age range.</text></g></svg>