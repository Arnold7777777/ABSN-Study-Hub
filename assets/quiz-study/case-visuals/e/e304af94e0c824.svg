<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A 2-month-old with a cyanotic ductal-dependent defect is awaiting surgery. The oxygen saturation reads 80% and the parents ask the nurse to turn the oxygen up. Which action is most appropriate?</title><desc>More oxygen is not the answer for a cyanotic defect; some children are deliberately kept at 75-85% until surgery. Turning the oxygen up is tempting but cannot fix a right-to-left shunt, and stopping prostaglandin E1 would close the duct this infant depends on.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Cardiac</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 2-month-old with a cyanotic ductal-</text><text x="41" y="198" fill="#f6faf5" font-size="21">dependent defect is awaiting surgery. The</text><text x="41" y="225" fill="#f6faf5" font-size="21">oxygen saturation reads 80% and the</text><text x="41" y="252" fill="#f6faf5" font-size="21">parents ask the nurse to turn the oxygen</text><text x="41" y="279" fill="#f6faf5" font-size="21">up. Which action is most appropriate?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Explain that saturations of 75-85% are</text><text x="41" y="411" fill="#f6faf5" font-size="21">expected until the defect is repaired</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">More oxygen is not the answer for a</text><text x="41" y="543" fill="#f6faf5" font-size="21">cyanotic defect; some children are</text><text x="41" y="570" fill="#f6faf5" font-size="21">deliberately kept at 75-85% until surgery.</text><text x="41" y="597" fill="#f6faf5" font-size="21">Turning the oxygen up is tempting but</text><text x="41" y="624" fill="#f6faf5" font-size="21">cannot fix a right-to-left shunt, and</text><text x="41" y="651" fill="#f6faf5" font-size="21">stopping prostaglandin E1 would close the</text><text x="41" y="678" fill="#f6faf5" font-size="21">duct this infant depends on.</text></g></svg>