<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>An adult survivor of childhood abuse tells the nurse she has no memory whatsoever of the years she lived in that home, though family members describe repeated abuse. Which defense mechanism does this represent?</title><desc>Repression excludes emotionally painful thoughts and memories from conscious awareness without the person&#x27;s knowledge. Suppression is the confusable pair, but the suppressing client can tell you exactly what she is choosing not to think about.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Theories &amp; Treatment Settings</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An adult survivor of childhood abuse tells</text><text x="41" y="198" fill="#f6faf5" font-size="21">the nurse she has no memory whatsoever of</text><text x="41" y="225" fill="#f6faf5" font-size="21">the years she lived in that home, though</text><text x="41" y="252" fill="#f6faf5" font-size="21">family members describe repeated abuse.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Repression</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Repression excludes emotionally painful</text><text x="41" y="489" fill="#f6faf5" font-size="21">thoughts and memories from conscious</text><text x="41" y="516" fill="#f6faf5" font-size="21">awareness without the person&#x27;s knowledge.</text><text x="41" y="543" fill="#f6faf5" font-size="21">Suppression is the confusable pair, but</text><text x="41" y="570" fill="#f6faf5" font-size="21">the suppressing client can tell you</text><text x="41" y="597" fill="#f6faf5" font-size="21">exactly what she is choosing not to think</text><text x="41" y="624" fill="#f6faf5" font-size="21">about.</text></g></svg>