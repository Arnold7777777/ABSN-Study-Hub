<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>144. A client with acute respiratory failure has significant anxiety and fear. Which intervention best addresses psychosocial needs?</title><desc>a. Psychosocial care means emotional support for everyone; the others target physical needs or apply only to select clients.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">144. A client with acute respiratory</text><text x="41" y="198" fill="#f6faf5" font-size="21">failure has significant anxiety and fear.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which intervention best addresses</text><text x="41" y="252" fill="#f6faf5" font-size="21">psychosocial needs?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">a. Psychosocial care means emotional</text><text x="41" y="384" fill="#f6faf5" font-size="21">support for everyone; the others target</text><text x="41" y="411" fill="#f6faf5" font-size="21">physical needs or apply only to select</text><text x="41" y="438" fill="#f6faf5" font-size="21">clients.</text></g></svg>