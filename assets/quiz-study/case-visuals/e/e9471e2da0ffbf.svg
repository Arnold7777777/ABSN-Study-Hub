<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A nurse is suctioning a client&#x27;s endotracheal tube when the cardiac monitor shows the heart rate falling from 88/min to 48/min. Which of the following actions should the nurse take first?</title><desc>Bradycardia during suctioning is VAGAL STIMULATION from catheter contact plus hypoxemia, so STOP and OXYGENATE immediately. Finishing the pass or raising the suction pressure deepens the hypoxia and worsens the vagal response. Documenting first delays treatment; stabilize the client, then document and notify the provider.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Recognizing the Need for</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Suctioning</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is suctioning a client&#x27;s</text><text x="41" y="231" fill="#f6faf5" font-size="21">endotracheal tube when the cardiac monitor</text><text x="41" y="258" fill="#f6faf5" font-size="21">shows the heart rate falling from 88/min</text><text x="41" y="285" fill="#f6faf5" font-size="21">to 48/min. Which of the following actions</text><text x="41" y="312" fill="#f6faf5" font-size="21">should the nurse take first?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Stop suctioning and administer oxygen to</text><text x="41" y="444" fill="#f6faf5" font-size="21">the client</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Bradycardia during suctioning is VAGAL</text><text x="41" y="576" fill="#f6faf5" font-size="21">STIMULATION from catheter contact plus</text><text x="41" y="603" fill="#f6faf5" font-size="21">hypoxemia, so STOP and OXYGENATE</text><text x="41" y="630" fill="#f6faf5" font-size="21">immediately.</text></g></svg>