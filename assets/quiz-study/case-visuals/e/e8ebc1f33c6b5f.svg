<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A 79-year-old client living alone takes nine medications from three different prescribers. The client has arthritis in both hands, presbyopia, and a fixed income, and admits to &quot;skipping the expensive one some weeks.&quot; Which nursing action best supports adherence?</title><desc>Adherence barriers here are physical, sensory, cognitive, and financial all at once, so the plan must address each: fewer daily doses, an easy-open organizer, large-print labels, and cost assistance. FIX THE BARRIER, THEN CONFIRM UNDERSTANDING WITH TEACH-BACK, having the client explain the plan back in his or her own words. A dense printed packet ignores presbyopia and literacy, delegating to a neighbor is not a nursing plan, and no nurse endorses missed doses.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Adherence Teaching</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 79-year-old client living alone takes</text><text x="41" y="198" fill="#f6faf5" font-size="21">nine medications from three different</text><text x="41" y="225" fill="#f6faf5" font-size="21">prescribers.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Work with the provider and pharmacist to</text><text x="41" y="357" fill="#f6faf5" font-size="21">simplify the regimen, arrange a weekly</text><text x="41" y="384" fill="#f6faf5" font-size="21">pill organizer with large-print labels,</text><text x="41" y="411" fill="#f6faf5" font-size="21">and refer for prescription assistance</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Adherence barriers here are physical,</text><text x="41" y="543" fill="#f6faf5" font-size="21">sensory, cognitive, and financial all at</text><text x="41" y="570" fill="#f6faf5" font-size="21">once, so the plan must address each: fewer</text><text x="41" y="597" fill="#f6faf5" font-size="21">daily doses, an easy-open organizer,</text><text x="41" y="624" fill="#f6faf5" font-size="21">large-print labels, and cost assistance.</text></g></svg>