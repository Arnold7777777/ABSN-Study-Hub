<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A nurse notices she feels unusually irritated by a client who reminds her of her critical mother, and she has begun spending less time with him. This reaction is BEST described as:</title><desc>Countertransference is the nurse&#x27;s unconscious emotional reaction to the client based on her own past — exactly what the preinteraction phase self-examination is meant to catch. Transference is the reverse: the client transfers feelings about someone in his life onto the nurse.</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse notices she feels unusually</text><text x="41" y="231" fill="#f6faf5" font-size="21">irritated by a client who reminds her of</text><text x="41" y="258" fill="#f6faf5" font-size="21">her critical mother, and she has begun</text><text x="41" y="285" fill="#f6faf5" font-size="21">spending less time with him. This reaction</text><text x="41" y="312" fill="#f6faf5" font-size="21">is BEST described as:</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Countertransference</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Countertransference is the nurse&#x27;s</text><text x="41" y="549" fill="#f6faf5" font-size="21">unconscious emotional reaction to the</text><text x="41" y="576" fill="#f6faf5" font-size="21">client based on her own past — exactly</text><text x="41" y="603" fill="#f6faf5" font-size="21">what the preinteraction phase self-</text><text x="41" y="630" fill="#f6faf5" font-size="21">examination is meant to catch.</text><text x="41" y="657" fill="#f6faf5" font-size="21">Transference is the reverse: the client</text><text x="41" y="684" fill="#f6faf5" font-size="21">transfers feelings about someone in his</text><text x="41" y="711" fill="#f6faf5" font-size="21">life onto the nurse.</text></g></svg>