<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>The nurse is caring for a client with a lower respiratory tract infection. When planning a focused respiratory assessment, the nurse should know that this type of infection most often causes which type of impairment?</title><desc>The lower respiratory tract consists of the lungs, which contain the bronchial and alveolar structures needed for gas exchange. A lower respiratory tract infection does not collapse bronchial structures or close the bronchial tree. An infection does not cause necrosis of lung tissues.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 5 · General Respiratory</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is caring for a client with a</text><text x="41" y="198" fill="#f6faf5" font-size="21">lower respiratory tract infection.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Impaired gas exchange</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">The lower respiratory tract consists of</text><text x="41" y="435" fill="#f6faf5" font-size="21">the lungs, which contain the bronchial and</text><text x="41" y="462" fill="#f6faf5" font-size="21">alveolar structures needed for gas</text><text x="41" y="489" fill="#f6faf5" font-size="21">exchange. A lower respiratory tract</text><text x="41" y="516" fill="#f6faf5" font-size="21">infection does not collapse bronchial</text><text x="41" y="543" fill="#f6faf5" font-size="21">structures or close the bronchial tree. An</text><text x="41" y="570" fill="#f6faf5" font-size="21">infection does not cause necrosis of lung</text><text x="41" y="597" fill="#f6faf5" font-size="21">tissues.</text></g></svg>