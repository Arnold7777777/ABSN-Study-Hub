<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A 16-year-old is starting fluoxetine. Which teaching should the nurse give the client and parents? Select all that apply.</title><desc>SSRIs carry a black box warning for increased suicidality in clients under 25, so the early weeks need close monitoring and frequent follow-up while the drug takes 4 to 6 weeks to work. Families should report changes rather than stop the drug abruptly, which risks discontinuation symptoms.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 16-year-old is starting fluoxetine.</text><text x="41" y="198" fill="#f6faf5" font-size="21">Which teaching should the nurse give the</text><text x="41" y="225" fill="#f6faf5" font-size="21">client and parents? Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">This drug carries a black box warning for</text><text x="41" y="357" fill="#f6faf5" font-size="21">increased suicidal thinking in children,</text><text x="41" y="384" fill="#f6faf5" font-size="21">adolescents, and young adults · Watch</text><text x="41" y="411" fill="#f6faf5" font-size="21">closely for worsening mood, agitation, or</text><text x="41" y="438" fill="#f6faf5" font-size="21">any talk of death, and…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">SSRIs carry a black box warning for</text><text x="41" y="570" fill="#f6faf5" font-size="21">increased suicidality in clients under 25,</text><text x="41" y="597" fill="#f6faf5" font-size="21">so the early weeks need close monitoring</text><text x="41" y="624" fill="#f6faf5" font-size="21">and frequent follow-up while the drug</text><text x="41" y="651" fill="#f6faf5" font-size="21">takes 4 to 6 weeks to work. Families</text><text x="41" y="678" fill="#f6faf5" font-size="21">should report changes rather than stop the</text><text x="41" y="705" fill="#f6faf5" font-size="21">drug abruptly, which risks discontinuation</text><text x="41" y="732" fill="#f6faf5" font-size="21">symptoms.</text></g></svg>