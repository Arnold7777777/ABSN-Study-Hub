<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is teaching a client who has stress incontinence about pelvic floor muscle exercises. Which of the following statements by the client indicates that the teaching was effective?</title><desc>KEGEL EXERCISES INVOLVE CONTRACTING THE PELVIC FLOOR MUSCLES FOR ABOUT 10 SECONDS FOLLOWED BY 10 SECONDS OF RELAXATION, repeated in sets several times daily. Repeatedly interrupting the urine stream is used only briefly to identify the correct muscles and is NOT recommended as ongoing practice because it can promote retention. Results take 4 to 6 weeks or longer, and the abdominal, thigh, and gluteal muscles should stay relaxed.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Pelvic Floor Exercises</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a client who has</text><text x="41" y="198" fill="#f6faf5" font-size="21">stress incontinence about pelvic floor</text><text x="41" y="225" fill="#f6faf5" font-size="21">muscle exercises. Which of the following</text><text x="41" y="252" fill="#f6faf5" font-size="21">statements by the client indicates that</text><text x="41" y="279" fill="#f6faf5" font-size="21">the teaching was effective?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">I will tighten the muscles I would use to</text><text x="41" y="411" fill="#f6faf5" font-size="21">stop my urine stream, hold for 10 seconds,</text><text x="41" y="438" fill="#f6faf5" font-size="21">then relax for 10 seconds</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">KEGEL EXERCISES INVOLVE CONTRACTING THE</text><text x="41" y="570" fill="#f6faf5" font-size="21">PELVIC FLOOR MUSCLES FOR ABOUT 10 SECONDS</text><text x="41" y="597" fill="#f6faf5" font-size="21">FOLLOWED BY 10 SECONDS OF RELAXATION,</text><text x="41" y="624" fill="#f6faf5" font-size="21">repeated in sets several times daily.</text></g></svg>