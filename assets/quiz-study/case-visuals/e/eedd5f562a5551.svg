<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="542" viewBox="0 0 640 542"><title>&quot;Oh you poor thing, I feel terrible about what happened to you.&quot; This is:</title><desc>Sympathy (pity) projects the nurse&#x27;s feelings and encourages dependency. Empathy = understand + communicate it.</desc><rect width="640" height="542" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">&quot;Oh you poor thing, I feel terrible about</text><text x="41" y="231" fill="#f6faf5" font-size="21">what happened to you.&quot; This is:</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Sympathy — diminishes the relationship</text><path d="M319 360v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="376" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 389) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="410" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="441" fill="#f6faf5" font-size="21">Sympathy (pity) projects the nurse&#x27;s</text><text x="41" y="468" fill="#f6faf5" font-size="21">feelings and encourages dependency.</text><text x="41" y="495" fill="#f6faf5" font-size="21">Empathy = understand + communicate it.</text></g></svg>