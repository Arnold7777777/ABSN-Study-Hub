<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A child with leukemia has a platelet count of 18,000/mm3. Which activity should the nurse restrict?</title><desc>With a platelet count this low, bleeding is the risk : no contact sports, no rough play, a soft toothbrush, no razors, no rectal temperatures, and pressure held after any needle stick. Quiet activity is encouraged, not restricted.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology &amp; Childhood Neoplasms</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A child with leukemia has a platelet count</text><text x="41" y="198" fill="#f6faf5" font-size="21">of 18,000/mm3. Which activity should the</text><text x="41" y="225" fill="#f6faf5" font-size="21">nurse restrict?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Contact sports and rough play</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">With a platelet count this low, bleeding</text><text x="41" y="462" fill="#f6faf5" font-size="21">is the risk : no contact sports, no rough</text><text x="41" y="489" fill="#f6faf5" font-size="21">play, a soft toothbrush, no razors, no</text><text x="41" y="516" fill="#f6faf5" font-size="21">rectal temperatures, and pressure held</text><text x="41" y="543" fill="#f6faf5" font-size="21">after any needle stick. Quiet activity is</text><text x="41" y="570" fill="#f6faf5" font-size="21">encouraged, not restricted.</text></g></svg>