<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>Which actions make IV insertion less traumatic for a child? Select all that apply.</title><desc>Anesthetic cream, a protective cover so play does not dislodge the line, a caregiver present and honest preparation all reduce trauma — and preventing a dislodged line prevents a second insertion. The bed is a safe zone ; painful procedures happen in the treatment room.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which actions make IV insertion less</text><text x="41" y="198" fill="#f6faf5" font-size="21">traumatic for a child? Select all that</text><text x="41" y="225" fill="#f6faf5" font-size="21">apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Apply anesthetic cream at least 1 hour</text><text x="41" y="357" fill="#f6faf5" font-size="21">before insertion · Use a protective</text><text x="41" y="384" fill="#f6faf5" font-size="21">covering over the site once it is in ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Allow a caregiver to stay and comfort the</text><text x="41" y="438" fill="#f6faf5" font-size="21">child · Prepare the child in…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Anesthetic cream, a protective cover so</text><text x="41" y="570" fill="#f6faf5" font-size="21">play does not dislodge the line, a</text><text x="41" y="597" fill="#f6faf5" font-size="21">caregiver present and honest preparation</text><text x="41" y="624" fill="#f6faf5" font-size="21">all reduce trauma — and preventing a</text><text x="41" y="651" fill="#f6faf5" font-size="21">dislodged line prevents a second</text><text x="41" y="678" fill="#f6faf5" font-size="21">insertion. The bed is a safe zone ;</text><text x="41" y="705" fill="#f6faf5" font-size="21">painful procedures happen in the treatment</text><text x="41" y="732" fill="#f6faf5" font-size="21">room.</text></g></svg>