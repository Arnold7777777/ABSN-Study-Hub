<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>Which of the following statements about adult learners are accurate? Select all that apply.</title><desc>Adult learners bring experience, help define their own needs, and are distracted by unresolved life concerns that the nurse may need to help address first. Nurse-set goals reduce engagement, and written materials remain useful when they are written at an appropriate reading level.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Adult Learners</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which of the following statements about</text><text x="41" y="198" fill="#f6faf5" font-size="21">adult learners are accurate? Select all</text><text x="41" y="225" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Adults can often identify what they need</text><text x="41" y="357" fill="#f6faf5" font-size="21">to learn · Adults build new learning on</text><text x="41" y="384" fill="#f6faf5" font-size="21">prior information and life experience ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Concerns such as employment or finances</text><text x="41" y="438" fill="#f6faf5" font-size="21">can interfere with…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Adult learners bring experience, help</text><text x="41" y="570" fill="#f6faf5" font-size="21">define their own needs, and are distracted</text><text x="41" y="597" fill="#f6faf5" font-size="21">by unresolved life concerns that the nurse</text><text x="41" y="624" fill="#f6faf5" font-size="21">may need to help address first. Nurse-set</text><text x="41" y="651" fill="#f6faf5" font-size="21">goals reduce engagement, and written</text><text x="41" y="678" fill="#f6faf5" font-size="21">materials remain useful when they are</text><text x="41" y="705" fill="#f6faf5" font-size="21">written at an appropriate reading level.</text></g></svg>