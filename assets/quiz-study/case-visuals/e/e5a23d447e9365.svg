<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A client is 4 hours out from a motor vehicle crash with a suspected splenic injury. Which findings indicate the compensatory stage of shock rather than a later stage? Select all that apply.</title><desc>Tachycardia is the earliest response , and restlessness from cerebral hypoxia with cool clammy skin rounds out the compensatory picture while the blood pressure is still normal . A falling BP marks the progressive stage, and confusion or altered mental status is a late sign, not an early one.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Shock &amp; MODS</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is 4 hours out from a motor</text><text x="41" y="198" fill="#f6faf5" font-size="21">vehicle crash with a suspected splenic</text><text x="41" y="225" fill="#f6faf5" font-size="21">injury. Which findings indicate the</text><text x="41" y="252" fill="#f6faf5" font-size="21">compensatory stage of shock rather than a</text><text x="41" y="279" fill="#f6faf5" font-size="21">later stage? Select all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Heart rate 118/min · Cool, clammy skin ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Restlessness</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Tachycardia is the earliest response , and</text><text x="41" y="543" fill="#f6faf5" font-size="21">restlessness from cerebral hypoxia with</text><text x="41" y="570" fill="#f6faf5" font-size="21">cool clammy skin rounds out the</text><text x="41" y="597" fill="#f6faf5" font-size="21">compensatory picture while the blood</text><text x="41" y="624" fill="#f6faf5" font-size="21">pressure is still normal . A falling BP</text><text x="41" y="651" fill="#f6faf5" font-size="21">marks the progressive stage, and confusion</text><text x="41" y="678" fill="#f6faf5" font-size="21">or altered mental status is a late sign,</text><text x="41" y="705" fill="#f6faf5" font-size="21">not an early one.</text></g></svg>