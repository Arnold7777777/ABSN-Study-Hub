<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A nurse is reviewing laboratory results for a client who has been receiving nutritional support for 5 days. Which of the following laboratory values best reflects the client&#x27;s response to the recent nutritional interventions?</title><desc>PREALBUMIN HAS A HALF-LIFE OF ABOUT 2 DAYS, SO IT REFLECTS SHORT-TERM AND RECENT CHANGES IN PROTEIN AND NUTRITIONAL STATUS AND IS USED TO EVALUATE RESPONSE TO NUTRITION SUPPORT. Albumin has a half-life of roughly 21 days, so it indicates long-term nutritional status and would not yet change after 5 days. Hemoglobin and cholesterol are influenced by many nonnutritional factors.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nutritional Assessment</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is reviewing laboratory results</text><text x="41" y="198" fill="#f6faf5" font-size="21">for a client who has been receiving</text><text x="41" y="225" fill="#f6faf5" font-size="21">nutritional support for 5 days.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Prealbumin</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">PREALBUMIN HAS A HALF-LIFE OF ABOUT 2</text><text x="41" y="462" fill="#f6faf5" font-size="21">DAYS, SO IT REFLECTS SHORT-TERM AND RECENT</text><text x="41" y="489" fill="#f6faf5" font-size="21">CHANGES IN PROTEIN AND NUTRITIONAL STATUS</text><text x="41" y="516" fill="#f6faf5" font-size="21">AND IS USED TO EVALUATE RESPONSE TO</text><text x="41" y="543" fill="#f6faf5" font-size="21">NUTRITION SUPPORT.</text></g></svg>