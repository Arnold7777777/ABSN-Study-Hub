<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse reviews the home medication list of an 83-year-old client admitted after an unwitnessed fall at an assisted living facility. Which medications should the nurse flag for the provider as potentially inappropriate for an older adult?</title><desc>Glyburide is a LONG-ACTING SULFONYLUREA that causes prolonged hypoglycemia as GFR falls; cyclobenzaprine is a sedating muscle relaxant; oxybutynin is a potent anticholinergic. ALL THREE ARE BEERS-LIST DRUGS THAT CAUSE SEDATION, CONFUSION, AND FALLS. Lisinopril is an appropriate first-line antihypertensive, and acetaminophen is the preferred analgesic in older adults because it avoids NSAID GI and renal risk.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Beers List Review</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse reviews the home medication list</text><text x="41" y="198" fill="#f6faf5" font-size="21">of an 83-year-old client admitted after an</text><text x="41" y="225" fill="#f6faf5" font-size="21">unwitnessed fall at an assisted living</text><text x="41" y="252" fill="#f6faf5" font-size="21">facility.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Glyburide 10 mg PO daily · Cyclobenzaprine</text><text x="41" y="384" fill="#f6faf5" font-size="21">10 mg PO three times daily · Oxybutynin 5</text><text x="41" y="411" fill="#f6faf5" font-size="21">mg PO twice daily</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Glyburide is a LONG-ACTING SULFONYLUREA</text><text x="41" y="543" fill="#f6faf5" font-size="21">that causes prolonged hypoglycemia as GFR</text><text x="41" y="570" fill="#f6faf5" font-size="21">falls;</text></g></svg>