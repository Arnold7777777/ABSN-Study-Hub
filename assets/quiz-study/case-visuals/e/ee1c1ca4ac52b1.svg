<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Karen&#x27;s cast is split and her pulses are restored. Therapists are working with her on transfers and ADLs, and she has many questions about going back to school and her normal routine. Given her developmental and cognitive stage, which statement best supports your approach to discharge teaching?</title><desc>Adolescents are developing abstract thinking and can weigh future consequences , so involve her in planning. Concrete-only thinking belongs to school-age children, and at this age peer acceptance usually matters more than family acceptance.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Musculoskeletal</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Karen&#x27;s cast is split and her pulses are</text><text x="41" y="198" fill="#f6faf5" font-size="21">restored.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Adolescents can anticipate future</text><text x="41" y="330" fill="#f6faf5" font-size="21">implications of current decisions.</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Adolescents are developing abstract</text><text x="41" y="462" fill="#f6faf5" font-size="21">thinking and can weigh future consequences</text><text x="41" y="489" fill="#f6faf5" font-size="21">, so involve her in planning. Concrete-</text><text x="41" y="516" fill="#f6faf5" font-size="21">only thinking belongs to school-age</text><text x="41" y="543" fill="#f6faf5" font-size="21">children, and at this age peer acceptance</text><text x="41" y="570" fill="#f6faf5" font-size="21">usually matters more than family</text><text x="41" y="597" fill="#f6faf5" font-size="21">acceptance.</text></g></svg>