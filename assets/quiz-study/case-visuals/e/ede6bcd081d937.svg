<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client has a negative HIV screen a few days after a possible exposure. Which teaching is appropriate?</title><desc>A test can be negative before its target becomes detectable. How long that takes depends on the assay and the timing of exposure, which is why a repeat is planned rather than assumed unnecessary.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Infectious Diseases &amp; HIV</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has a negative HIV screen a few</text><text x="41" y="198" fill="#f6faf5" font-size="21">days after a possible exposure. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">teaching is appropriate?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">“There is a window period before a test</text><text x="41" y="357" fill="#f6faf5" font-size="21">turns positive — follow the plan for</text><text x="41" y="384" fill="#f6faf5" font-size="21">repeat testing.”</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A test can be negative before its target</text><text x="41" y="516" fill="#f6faf5" font-size="21">becomes detectable. How long that takes</text><text x="41" y="543" fill="#f6faf5" font-size="21">depends on the assay and the timing of</text><text x="41" y="570" fill="#f6faf5" font-size="21">exposure, which is why a repeat is planned</text><text x="41" y="597" fill="#f6faf5" font-size="21">rather than assumed unnecessary.</text></g></svg>