<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client with gallbladder disease reports pain in the right shoulder. The nurse should document this finding as which type of pain?</title><desc>Referred pain is felt in an area away from the actual source because nerves from different regions share the same spinal pathways, and gallbladder pain classically refers to the right shoulder. Breakthrough pain is a flare of pain in a client on a stable analgesic regimen, and allodynia is pain from a normally harmless stimulus such as clothing or a breeze.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Referred Pain</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with gallbladder disease reports</text><text x="41" y="198" fill="#f6faf5" font-size="21">pain in the right shoulder. The nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">should document this finding as which type</text><text x="41" y="252" fill="#f6faf5" font-size="21">of pain?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Referred pain</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Referred pain is felt in an area away from</text><text x="41" y="489" fill="#f6faf5" font-size="21">the actual source because nerves from</text><text x="41" y="516" fill="#f6faf5" font-size="21">different regions share the same spinal</text><text x="41" y="543" fill="#f6faf5" font-size="21">pathways, and gallbladder pain classically</text><text x="41" y="570" fill="#f6faf5" font-size="21">refers to the right shoulder.</text></g></svg>