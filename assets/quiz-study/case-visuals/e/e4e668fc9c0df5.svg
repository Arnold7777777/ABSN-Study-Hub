<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse presses the nail bed of a client&#x27;s finger and observes that color returns after 5 seconds. How should the nurse interpret this finding?</title><desc>Color should return within about 2 to 3 seconds, so a 5-second refill indicates reduced peripheral perfusion. Cool environments and aging can slow refill somewhat, but treating a markedly delayed refill as simply age-related risks missing shock or an arterial problem in the limb.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Capillary Refill</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse presses the nail bed of a client&#x27;s</text><text x="41" y="198" fill="#f6faf5" font-size="21">finger and observes that color returns</text><text x="41" y="225" fill="#f6faf5" font-size="21">after 5 seconds. How should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">interpret this finding?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Delayed capillary refill suggesting</text><text x="41" y="384" fill="#f6faf5" font-size="21">impaired perfusion</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Color should return within about 2 to 3</text><text x="41" y="516" fill="#f6faf5" font-size="21">seconds, so a 5-second refill indicates</text><text x="41" y="543" fill="#f6faf5" font-size="21">reduced peripheral perfusion. Cool</text><text x="41" y="570" fill="#f6faf5" font-size="21">environments and aging can slow refill</text><text x="41" y="597" fill="#f6faf5" font-size="21">somewhat, but treating a markedly delayed</text><text x="41" y="624" fill="#f6faf5" font-size="21">refill as simply age-related risks missing</text><text x="41" y="651" fill="#f6faf5" font-size="21">shock or an arterial problem in the limb.</text></g></svg>