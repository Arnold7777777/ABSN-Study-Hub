<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>On postoperative day 4 a client has a temperature of 101.8 F, a WBC of 16,000, and thick yellow drainage with an odor from the incision. Which action should the nurse take first?</title><desc>Fever, leukocytosis, and purulent, malodorous drainage indicate wound infection, so the provider is notified and a culture is obtained before antibiotics are started. Applying a dressing and monitoring delays treatment of an infection that can progress to sepsis.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Postoperative Infection</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">On postoperative day 4 a client has a</text><text x="41" y="198" fill="#f6faf5" font-size="21">temperature of 101.8 F, a WBC of 16,000,</text><text x="41" y="225" fill="#f6faf5" font-size="21">and thick yellow drainage with an odor</text><text x="41" y="252" fill="#f6faf5" font-size="21">from the incision. Which action should the</text><text x="41" y="279" fill="#f6faf5" font-size="21">nurse take first?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Notify the provider and anticipate a wound</text><text x="41" y="411" fill="#f6faf5" font-size="21">culture</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Fever, leukocytosis, and purulent,</text><text x="41" y="543" fill="#f6faf5" font-size="21">malodorous drainage indicate wound</text><text x="41" y="570" fill="#f6faf5" font-size="21">infection, so the provider is notified and</text><text x="41" y="597" fill="#f6faf5" font-size="21">a culture is obtained before antibiotics</text><text x="41" y="624" fill="#f6faf5" font-size="21">are started. Applying a dressing and</text><text x="41" y="651" fill="#f6faf5" font-size="21">monitoring delays treatment of an</text><text x="41" y="678" fill="#f6faf5" font-size="21">infection that can progress to sepsis.</text></g></svg>