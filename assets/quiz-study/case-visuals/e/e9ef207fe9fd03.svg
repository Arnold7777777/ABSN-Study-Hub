<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>An infant is brought in limp with retinal hemorrhages and no external injury. What should the nurse suspect?</title><desc>Retinal hemorrhages with altered consciousness and no external injury are hallmarks of abusive head trauma . Report it. Prevention teaching is part of every newborn discharge: an infant who will not stop crying can be put down safely in the crib while the caregiver steps away.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An infant is brought in limp with retinal</text><text x="41" y="198" fill="#f6faf5" font-size="21">hemorrhages and no external injury. What</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse suspect?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Abusive head trauma from shaking</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Retinal hemorrhages with altered</text><text x="41" y="462" fill="#f6faf5" font-size="21">consciousness and no external injury are</text><text x="41" y="489" fill="#f6faf5" font-size="21">hallmarks of abusive head trauma . Report</text><text x="41" y="516" fill="#f6faf5" font-size="21">it. Prevention teaching is part of every</text><text x="41" y="543" fill="#f6faf5" font-size="21">newborn discharge: an infant who will not</text><text x="41" y="570" fill="#f6faf5" font-size="21">stop crying can be put down safely in the</text><text x="41" y="597" fill="#f6faf5" font-size="21">crib while the caregiver steps away.</text></g></svg>