<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="542" viewBox="0 0 640 542"><title>A nurse is performing a well-child assessment on a 4-month-old infant at a pediatric clinic. Which of the following findings should the nurse identify as a developmental deviation requiring further evaluation?</title><desc>HEAD CONTROL BY 4 MONTHS IS THE BENCHMARK; persistent head lag at 4 months signals a neuromuscular or motor delay and needs referral. Babbling (6 to 9 months), rolling back to abdomen (about 6 months), and sitting unsupported (about 8 to 9 months) are all skills not yet due at 4 months, so they are expected, not deviations. Remember the earlier red flag too: no social smile by 2 to 3 months is abnormal.</desc><rect width="640" height="542" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Identifying Developmental</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Deviations</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is performing a well-child</text><text x="41" y="231" fill="#f6faf5" font-size="21">assessment on a 4-month-old infant at a</text><text x="41" y="258" fill="#f6faf5" font-size="21">pediatric clinic.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">The infant&#x27;s head lags behind the body</text><text x="41" y="390" fill="#f6faf5" font-size="21">when pulled to a sitting position</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="87" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">HEAD CONTROL BY 4 MONTHS IS THE BENCHMARK;</text></g></svg>