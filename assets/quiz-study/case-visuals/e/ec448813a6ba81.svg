<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client has a known abdominal aortic aneurysm that is not yet scheduled for repair. Which nursing action is the priority?</title><desc>High blood pressure drives aortic dilation, so long-term BP control slows growth and lowers the risk of rupture. A ruptured AAA causes sudden, severe abdominal or low back pain with shock; upper chest and neck pain fits a thoracic aneurysm or dissection.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Abdominal aortic aneurysm -</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">priority</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client has a known abdominal aortic</text><text x="41" y="231" fill="#f6faf5" font-size="21">aneurysm that is not yet scheduled for</text><text x="41" y="258" fill="#f6faf5" font-size="21">repair. Which nursing action is the</text><text x="41" y="285" fill="#f6faf5" font-size="21">priority?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Keep the blood pressure in a low-to-normal</text><text x="41" y="417" fill="#f6faf5" font-size="21">range</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">High blood pressure drives aortic</text><text x="41" y="549" fill="#f6faf5" font-size="21">dilation, so long-term BP control slows</text><text x="41" y="576" fill="#f6faf5" font-size="21">growth and lowers the risk of rupture. A</text><text x="41" y="603" fill="#f6faf5" font-size="21">ruptured AAA causes sudden, severe</text><text x="41" y="630" fill="#f6faf5" font-size="21">abdominal or low back pain with shock;</text><text x="41" y="657" fill="#f6faf5" font-size="21">upper chest and neck pain fits a thoracic</text><text x="41" y="684" fill="#f6faf5" font-size="21">aneurysm or dissection.</text></g></svg>