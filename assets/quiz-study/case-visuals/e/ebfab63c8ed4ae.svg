<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A client on dialysis for end-stage kidney disease reports muscle cramps and tingling in the hands. Which medication should the nurse plan to administer?</title><desc>Cramping with tingling in the hands and around the mouth is hypocalcemia , which is common in kidney disease and can be pulled lower by dialysis. Calcium carbonate replaces it and doubles as a phosphate binder - taken with meals for that second job.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client on dialysis for end-stage kidney</text><text x="41" y="198" fill="#f6faf5" font-size="21">disease reports muscle cramps and tingling</text><text x="41" y="225" fill="#f6faf5" font-size="21">in the hands. Which medication should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse plan to administer?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Calcium carbonate</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Cramping with tingling in the hands and</text><text x="41" y="489" fill="#f6faf5" font-size="21">around the mouth is hypocalcemia , which</text><text x="41" y="516" fill="#f6faf5" font-size="21">is common in kidney disease and can be</text><text x="41" y="543" fill="#f6faf5" font-size="21">pulled lower by dialysis. Calcium</text><text x="41" y="570" fill="#f6faf5" font-size="21">carbonate replaces it and doubles as a</text><text x="41" y="597" fill="#f6faf5" font-size="21">phosphate binder - taken with meals for</text><text x="41" y="624" fill="#f6faf5" font-size="21">that second job.</text></g></svg>