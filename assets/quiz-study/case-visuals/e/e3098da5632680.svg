<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>During a transfusion a client becomes restless and dyspnoeic with crackles at the bases. What should the nurse anticipate doing?</title><desc>That is circulatory overload . Slow or stop the infusion, sit the client up, and expect a diuretic to be prescribed.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">During a transfusion a client becomes</text><text x="41" y="198" fill="#f6faf5" font-size="21">restless and dyspnoeic with crackles at</text><text x="41" y="225" fill="#f6faf5" font-size="21">the bases. What should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">anticipate doing?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Slowing or stopping the infusion</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">That is circulatory overload . Slow or</text><text x="41" y="489" fill="#f6faf5" font-size="21">stop the infusion, sit the client up, and</text><text x="41" y="516" fill="#f6faf5" font-size="21">expect a diuretic to be prescribed.</text></g></svg>