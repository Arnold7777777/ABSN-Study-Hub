<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>Which does the nurse initiate first?</title><desc>Fluid comes first. He is profoundly volume depleted, and rehydration alone begins to lower glucose and improve perfusion. Insulin follows once fluids are running and the potassium is known to be safe. Potassium is not given while the level is 5.4 mEq/L. Bicarbonate is reserved for severe acidosis and is not routine.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Diabetic Ketoacidosis</text><rect x="23" y="106" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which does the nurse initiate first?</text><path d="M319 195v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="211" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 224) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="245" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="276" fill="#f6faf5" font-size="21">Isotonic sodium chloride infusion</text><path d="M319 300v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="316" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 329) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="350" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="381" fill="#f6faf5" font-size="21">Fluid comes first. He is profoundly volume</text><text x="41" y="408" fill="#f6faf5" font-size="21">depleted, and rehydration alone begins to</text><text x="41" y="435" fill="#f6faf5" font-size="21">lower glucose and improve perfusion.</text><text x="41" y="462" fill="#f6faf5" font-size="21">Insulin follows once fluids are running</text><text x="41" y="489" fill="#f6faf5" font-size="21">and the potassium is known to be safe.</text><text x="41" y="516" fill="#f6faf5" font-size="21">Potassium is not given while the level is</text><text x="41" y="543" fill="#f6faf5" font-size="21">5.4 mEq/L. Bicarbonate is reserved for</text><text x="41" y="570" fill="#f6faf5" font-size="21">severe acidosis and…</text></g></svg>