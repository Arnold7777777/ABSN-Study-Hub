<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client in crisis states he has a loaded gun at home and is thinking of using it tonight. Which approach should the nurse take?</title><desc>When a client is suicidal, in crisis, or out of touch with reality, the nurse takes the directive role — direct questions about the plan and active problem-solving for safety. Nondirective exploration is appropriate only when the client can safely lead.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anger, Abuse &amp; Violence</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client in crisis states he has a loaded</text><text x="41" y="198" fill="#f6faf5" font-size="21">gun at home and is thinking of using it</text><text x="41" y="225" fill="#f6faf5" font-size="21">tonight. Which approach should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">take?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">A directive approach: ask directly about</text><text x="41" y="384" fill="#f6faf5" font-size="21">the plan and act to remove access and</text><text x="41" y="411" fill="#f6faf5" font-size="21">ensure safety</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">When a client is suicidal, in crisis, or</text><text x="41" y="543" fill="#f6faf5" font-size="21">out of touch with reality, the nurse takes</text><text x="41" y="570" fill="#f6faf5" font-size="21">the directive role — direct questions</text><text x="41" y="597" fill="#f6faf5" font-size="21">about the plan and active problem-solving</text><text x="41" y="624" fill="#f6faf5" font-size="21">for safety. Nondirective exploration is</text><text x="41" y="651" fill="#f6faf5" font-size="21">appropriate only when the client can</text><text x="41" y="678" fill="#f6faf5" font-size="21">safely lead.</text></g></svg>