<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A veteran says, &quot;Sometimes I hear explosions, even though I know I&#x27;m safe at home.&quot; Which response by the nurse is best?</title><desc>Naming the symptom and helping the client talk about the trauma at their own pace, with referral to trauma-focused therapy, is the therapeutic priority. Dismissing, distracting or generalizing does not help the client process the experience.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">PTSD - flashbacks</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A veteran says, &quot;Sometimes I hear</text><text x="41" y="198" fill="#f6faf5" font-size="21">explosions, even though I know I&#x27;m safe at</text><text x="41" y="225" fill="#f6faf5" font-size="21">home.&quot; Which response by the nurse is</text><text x="41" y="252" fill="#f6faf5" font-size="21">best?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;Those sound like flashbacks. I&#x27;d like to</text><text x="41" y="384" fill="#f6faf5" font-size="21">help you arrange time to talk about your</text><text x="41" y="411" fill="#f6faf5" font-size="21">experiences and how you react.&quot;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Naming the symptom and helping the client</text><text x="41" y="543" fill="#f6faf5" font-size="21">talk about the trauma at their own pace,</text><text x="41" y="570" fill="#f6faf5" font-size="21">with referral to trauma-focused therapy,</text><text x="41" y="597" fill="#f6faf5" font-size="21">is the therapeutic priority. Dismissing,</text><text x="41" y="624" fill="#f6faf5" font-size="21">distracting or generalizing does not help</text><text x="41" y="651" fill="#f6faf5" font-size="21">the client process the experience.</text></g></svg>