<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse in a long-term care facility is assessing an 82-year-old resident who has become newly confused and agitated overnight. The resident is afebrile and denies pain. Which of the following actions should the nurse take first?</title><desc>NEW-ONSET CONFUSION IS OFTEN THE ONLY MANIFESTATION OF A UTI IN AN OLDER ADULT, who may not develop fever, dysuria, or urgency because of a blunted immune and sensory response. Obtaining a urinalysis identifies a treatable cause. Sedating the resident masks the underlying problem and increases fall risk, and confusion of acute onset is NEVER a normal age-related change.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">UTI in Older Adults</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse in a long-term care facility is</text><text x="41" y="198" fill="#f6faf5" font-size="21">assessing an 82-year-old resident who has</text><text x="41" y="225" fill="#f6faf5" font-size="21">become newly confused and agitated</text><text x="41" y="252" fill="#f6faf5" font-size="21">overnight.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Collect a urine specimen for urinalysis</text><text x="41" y="384" fill="#f6faf5" font-size="21">and culture</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">NEW-ONSET CONFUSION IS OFTEN THE ONLY</text><text x="41" y="516" fill="#f6faf5" font-size="21">MANIFESTATION OF A UTI IN AN OLDER ADULT,</text><text x="41" y="543" fill="#f6faf5" font-size="21">who may not develop fever, dysuria, or</text><text x="41" y="570" fill="#f6faf5" font-size="21">urgency because of a blunted immune and</text><text x="41" y="597" fill="#f6faf5" font-size="21">sensory response.</text></g></svg>