<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>The 4-week-old with projectile nonbilious vomiting, an RUQ mass and a weight loss of 1 lb (0.45 kg) is transferred to the ED (T 37.1°C, P 171, RR 34, SpO2 99%). Which provider orders does the nurse anticipate at this time? (Select all that apply.)</title><desc>Expect orders to confirm the diagnosis (ultrasound), measure the fluid and electrolyte loss (metabolic panel, strict I&amp;O) and give IV fluids (VAD) before pyloromyotomy. An antiemetic cannot relieve a mechanical obstruction, she stays NPO, and pyloric stenosis is not infectious.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Gastrointestinal</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The 4-week-old with projectile nonbilious</text><text x="41" y="198" fill="#f6faf5" font-size="21">vomiting, an RUQ mass and a weight loss of</text><text x="41" y="225" fill="#f6faf5" font-size="21">1 lb (0.45 kg) is transferred to the ED (T</text><text x="41" y="252" fill="#f6faf5" font-size="21">37.1°C, P 171, RR 34, SpO2 99%).</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Draw metabolic panel · Perform an</text><text x="41" y="384" fill="#f6faf5" font-size="21">abdominal ultrasound · Maintain strict</text><text x="41" y="411" fill="#f6faf5" font-size="21">intake and output (I&amp;Os) · Establish</text><text x="41" y="438" fill="#f6faf5" font-size="21">vascular access device (VAD) site</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Expect orders to confirm the diagnosis</text><text x="41" y="570" fill="#f6faf5" font-size="21">(ultrasound), measure the fluid and</text><text x="41" y="597" fill="#f6faf5" font-size="21">electrolyte loss (metabolic panel, strict</text><text x="41" y="624" fill="#f6faf5" font-size="21">I&amp;O) and give IV fluids (VAD) before</text><text x="41" y="651" fill="#f6faf5" font-size="21">pyloromyotomy. An antiemetic cannot</text><text x="41" y="678" fill="#f6faf5" font-size="21">relieve a mechanical obstruction, she</text><text x="41" y="705" fill="#f6faf5" font-size="21">stays NPO, and pyloric stenosis is not</text><text x="41" y="732" fill="#f6faf5" font-size="21">infectious.</text></g></svg>