<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>84. A client informed about surgery is about to sign the consent form but says, &quot;I&#x27;m not sure I understand what they told me.&quot; Which is the nurse&#x27;s priority action?</title><desc>c. The provider (not the nurse) explains the procedure/risks. If the client has questions, STOP and notify the provider — never pressure them to sign.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">84. A client informed about surgery is</text><text x="41" y="198" fill="#f6faf5" font-size="21">about to sign the consent form but says,</text><text x="41" y="225" fill="#f6faf5" font-size="21">&quot;I&#x27;m not sure I understand what they told</text><text x="41" y="252" fill="#f6faf5" font-size="21">me.&quot; Which is the nurse&#x27;s priority action?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">c. The provider (not the nurse) explains</text><text x="41" y="384" fill="#f6faf5" font-size="21">the procedure/risks. If the client has</text><text x="41" y="411" fill="#f6faf5" font-size="21">questions, STOP and notify the provider —</text><text x="41" y="438" fill="#f6faf5" font-size="21">never pressure them to sign.</text></g></svg>