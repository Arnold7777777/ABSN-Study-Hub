<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client gave birth vaginally 6 hr ago. Which finding should the nurse report? Normal: WBC can reach 20,000 to 25,000/mm³ after birth</title><desc>Saturating a pad in 15 min is postpartum hemorrhage until proved otherwise. The reference point worth memorizing is that one pad soaked in an hour already needs reporting. The other three are all normal at 6 hr - a raised white count is expected after birth and does not by itself mean infection.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client gave birth vaginally 6 hr ago.</text><text x="41" y="198" fill="#f6faf5" font-size="21">Which finding should the nurse report?</text><text x="41" y="225" fill="#f6faf5" font-size="21">Normal: WBC can reach 20,000 to 25,000/mm³</text><text x="41" y="252" fill="#f6faf5" font-size="21">after birth</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">A perineal pad soaked through in 15 min</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Saturating a pad in 15 min is postpartum</text><text x="41" y="489" fill="#f6faf5" font-size="21">hemorrhage until proved otherwise. The</text><text x="41" y="516" fill="#f6faf5" font-size="21">reference point worth memorizing is that</text><text x="41" y="543" fill="#f6faf5" font-size="21">one pad soaked in an hour already needs</text><text x="41" y="570" fill="#f6faf5" font-size="21">reporting. The other three are all normal</text><text x="41" y="597" fill="#f6faf5" font-size="21">at 6 hr - a raised white count is expected</text><text x="41" y="624" fill="#f6faf5" font-size="21">after birth and does not by itself mean</text><text x="41" y="651" fill="#f6faf5" font-size="21">infection.</text></g></svg>