<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="458" viewBox="0 0 640 458"><title>50. A client has an apical heart rate of 84 bpm and a radial rate of 68 bpm. What is the pulse deficit?</title><desc>c. Pulse deficit = apical − radial = 84 − 68 = 16 bpm. It indicates some cardiac contractions aren&#x27;t strong enough to produce a palpable radial pulse.</desc><rect width="640" height="458" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">50. A client has an apical heart rate of</text><text x="41" y="198" fill="#f6faf5" font-size="21">84 bpm and a radial rate of 68 bpm. What</text><text x="41" y="225" fill="#f6faf5" font-size="21">is the pulse deficit?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">c. Pulse deficit = apical − radial = 84 −</text><text x="41" y="357" fill="#f6faf5" font-size="21">68 = 16 bpm. It indicates some cardiac</text><text x="41" y="384" fill="#f6faf5" font-size="21">contractions aren&#x27;t strong enough to</text><text x="41" y="411" fill="#f6faf5" font-size="21">produce a palpable radial pulse.</text></g></svg>