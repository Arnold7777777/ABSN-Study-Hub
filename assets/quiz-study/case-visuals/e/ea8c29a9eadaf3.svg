<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A patient with a mechanical aortic valve asks if they can stop their warfarin because they&#x27;re having dental work. The nurse correctly responds:</title><desc>Mechanical valves = lifelong anticoagulation (warfarin). The provider may bridge with LMWH around procedures — but the patient should NEVER make this decision alone. Stopping anticoagulation risks valve thrombosis -&gt; massive stroke.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Valvular Disease</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A patient with a mechanical aortic valve</text><text x="41" y="198" fill="#f6faf5" font-size="21">asks if they can stop their warfarin</text><text x="41" y="225" fill="#f6faf5" font-size="21">because they&#x27;re having dental work. The</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse correctly responds:</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">No — mechanical valves require lifelong</text><text x="41" y="384" fill="#f6faf5" font-size="21">anticoagulation; the provider will manage</text><text x="41" y="411" fill="#f6faf5" font-size="21">bridging therapy</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Mechanical valves = lifelong</text><text x="41" y="543" fill="#f6faf5" font-size="21">anticoagulation (warfarin). The provider</text><text x="41" y="570" fill="#f6faf5" font-size="21">may bridge with LMWH around procedures —</text><text x="41" y="597" fill="#f6faf5" font-size="21">but the patient should NEVER make this</text><text x="41" y="624" fill="#f6faf5" font-size="21">decision alone. Stopping anticoagulation</text><text x="41" y="651" fill="#f6faf5" font-size="21">risks valve thrombosis -&gt; massive stroke.</text></g></svg>