<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is preparing a 5-year-old for surgery. Based on the child&#x27;s cognitive stage, which teaching approach is most appropriate?</title><desc>A 5-YEAR-OLD IS IN PIAGET&#x27;S PREOPERATIONAL STAGE, WHICH IS CONCRETE, EGOCENTRIC, AND DOMINATED BY MAGICAL THINKING, SO PLAY WITH DOLLS AND ACTUAL EQUIPMENT IS THE BEST TEACHING METHOD. Written booklets and abstract discussions of risk, benefit, and cellular action require formal operational thinking, which does not develop until about age 11 or older. Concrete demonstration also reduces the preschooler&#x27;s fear of bodily harm.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Piaget Cognitive Stages</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing a 5-year-old for</text><text x="41" y="198" fill="#f6faf5" font-size="21">surgery. Based on the child&#x27;s cognitive</text><text x="41" y="225" fill="#f6faf5" font-size="21">stage, which teaching approach is most</text><text x="41" y="252" fill="#f6faf5" font-size="21">appropriate?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Use a doll and simple equipment to show</text><text x="41" y="384" fill="#f6faf5" font-size="21">what will happen, using concrete words</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A 5-YEAR-OLD IS IN PIAGET&#x27;S PREOPERATIONAL</text><text x="41" y="516" fill="#f6faf5" font-size="21">STAGE, WHICH IS CONCRETE, EGOCENTRIC, AND</text><text x="41" y="543" fill="#f6faf5" font-size="21">DOMINATED BY MAGICAL THINKING, SO PLAY</text><text x="41" y="570" fill="#f6faf5" font-size="21">WITH DOLLS AND ACTUAL EQUIPMENT IS THE</text><text x="41" y="597" fill="#f6faf5" font-size="21">BEST TEACHING METHOD.</text></g></svg>