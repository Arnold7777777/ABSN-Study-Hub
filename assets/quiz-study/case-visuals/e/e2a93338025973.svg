<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A 6-year-old cannot swallow a prescribed tablet. Which action is appropriate?</title><desc>Some tablets may be crushed and some may not. Enteric coatings and extended-release forms are never crushed — the coating protects the drug or the stomach, and crushing a long-acting form releases the whole day at once. Check the drug and the policy, and ask pharmacy for a liquid or chewable alternative.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 6-year-old cannot swallow a prescribed</text><text x="41" y="198" fill="#f6faf5" font-size="21">tablet. Which action is appropriate?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Check whether that particular tablet may</text><text x="41" y="330" fill="#f6faf5" font-size="21">be crushed, and check facility policy</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Some tablets may be crushed and some may</text><text x="41" y="462" fill="#f6faf5" font-size="21">not. Enteric coatings and extended-release</text><text x="41" y="489" fill="#f6faf5" font-size="21">forms are never crushed — the coating</text><text x="41" y="516" fill="#f6faf5" font-size="21">protects the drug or the stomach, and</text><text x="41" y="543" fill="#f6faf5" font-size="21">crushing a long-acting form releases the</text><text x="41" y="570" fill="#f6faf5" font-size="21">whole day at once. Check the drug and the</text><text x="41" y="597" fill="#f6faf5" font-size="21">policy, and ask pharmacy for a liquid or</text><text x="41" y="624" fill="#f6faf5" font-size="21">chewable alternative.</text></g></svg>