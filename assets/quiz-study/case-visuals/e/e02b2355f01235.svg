<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>The nurse prepares prescribed pain medication for an acute sickle cell pain crisis for a child weighing 16 kg. The safe dosage range is 10 to 15 mg/kg/dose. What is the maximum safe dose for this patient in milligrams?</title><desc>Maximum = 15 mg/kg × 16 kg = 240 mg per dose (the safe range is 160–240 mg). 160 mg is the minimum, 528 mg comes from treating the weight as pounds (16 kg = 35.2 lb × 15), and 24 mg is a decimal slip.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology &amp; Childhood Neoplasms</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse prepares prescribed pain</text><text x="41" y="198" fill="#f6faf5" font-size="21">medication for an acute sickle cell pain</text><text x="41" y="225" fill="#f6faf5" font-size="21">crisis for a child weighing 16 kg.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">240 mg</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Maximum = 15 mg/kg × 16 kg = 240 mg per</text><text x="41" y="462" fill="#f6faf5" font-size="21">dose (the safe range is 160–240 mg). 160</text><text x="41" y="489" fill="#f6faf5" font-size="21">mg is the minimum, 528 mg comes from</text><text x="41" y="516" fill="#f6faf5" font-size="21">treating the weight as pounds (16 kg =</text><text x="41" y="543" fill="#f6faf5" font-size="21">35.2 lb × 15), and 24 mg is a decimal</text><text x="41" y="570" fill="#f6faf5" font-size="21">slip.</text></g></svg>