<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>23. Which should be included in an orientation plan for newly licensed nurses? (Select all that apply)</title><desc>a, b, d, e, f. Orientation = skills, preceptor, technology/charting, culture, and policies. Budgetary principles are a manager function, not new-nurse orientation.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">23. Which should be included in an</text><text x="41" y="198" fill="#f6faf5" font-size="21">orientation plan for newly licensed</text><text x="41" y="225" fill="#f6faf5" font-size="21">nurses? (Select all that apply)</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">a, b, d, e, f. Orientation = skills,</text><text x="41" y="357" fill="#f6faf5" font-size="21">preceptor, technology/charting, culture,</text><text x="41" y="384" fill="#f6faf5" font-size="21">and policies. Budgetary principles are a</text><text x="41" y="411" fill="#f6faf5" font-size="21">manager function, not new-nurse</text><text x="41" y="438" fill="#f6faf5" font-size="21">orientation.</text></g></svg>