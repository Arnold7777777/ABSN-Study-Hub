<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Twenty minutes into a procedure using succinylcholine and inhaled anesthesia, the anesthesia provider notes a sharply rising end-tidal CO2 and jaw rigidity. Which complication should the nurse suspect?</title><desc>A rising end-tidal CO2 is the earliest sign of malignant hyperthermia, appearing with masseter or generalized muscle rigidity well before the temperature climbs — waiting for fever delays lifesaving treatment. Anaphylaxis presents with hypotension, bronchospasm, and urticaria rather than hypermetabolism and rigidity.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Malignant Hyperthermia</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Twenty minutes into a procedure using</text><text x="41" y="198" fill="#f6faf5" font-size="21">succinylcholine and inhaled anesthesia,</text><text x="41" y="225" fill="#f6faf5" font-size="21">the anesthesia provider notes a sharply</text><text x="41" y="252" fill="#f6faf5" font-size="21">rising end-tidal CO2 and jaw rigidity.</text><text x="41" y="279" fill="#f6faf5" font-size="21">Which complication should the nurse</text><text x="41" y="306" fill="#f6faf5" font-size="21">suspect?</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">Malignant hyperthermia</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A rising end-tidal CO2 is the earliest</text><text x="41" y="543" fill="#f6faf5" font-size="21">sign of malignant hyperthermia, appearing</text><text x="41" y="570" fill="#f6faf5" font-size="21">with masseter or generalized muscle</text><text x="41" y="597" fill="#f6faf5" font-size="21">rigidity well before the temperature</text><text x="41" y="624" fill="#f6faf5" font-size="21">climbs — waiting for fever delays</text><text x="41" y="651" fill="#f6faf5" font-size="21">lifesaving treatment.</text></g></svg>