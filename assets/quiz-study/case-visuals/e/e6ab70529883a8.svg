<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="566" viewBox="0 0 640 566"><title>105. A nurse is caring for a client with fluid volume excess who is short of breath and edematous. The client is anxious and requests more information about the treatment plan. How should the nurse advocate for the client&#x27;s rights?</title><desc>d. A client requesting information has a right to it; the nurse must advocate for understanding. Options a-c all shut down communication. NCLEX favors &quot;explain and ensure understanding.&quot;</desc><rect width="640" height="566" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">105. A nurse is caring for a client with</text><text x="41" y="198" fill="#f6faf5" font-size="21">fluid volume excess who is short of breath</text><text x="41" y="225" fill="#f6faf5" font-size="21">and edematous. The client is anxious and</text><text x="41" y="252" fill="#f6faf5" font-size="21">requests more information about the</text><text x="41" y="279" fill="#f6faf5" font-size="21">treatment plan. How should the nurse</text><text x="41" y="306" fill="#f6faf5" font-size="21">advocate…</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="411" fill="#f6faf5" font-size="21">d. A client requesting information has a</text><text x="41" y="438" fill="#f6faf5" font-size="21">right to it; the nurse must advocate for</text><text x="41" y="465" fill="#f6faf5" font-size="21">understanding. Options a-c all shut down</text><text x="41" y="492" fill="#f6faf5" font-size="21">communication. NCLEX favors &quot;explain and</text><text x="41" y="519" fill="#f6faf5" font-size="21">ensure understanding.&quot;</text></g></svg>