MAD AS A HATTER,</text><text x="41" y="384" fill="#f6faf5" font-size="21">blind as a bat.</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">For Anticholinergic overdose — atropine,</text><text x="41" y="516" fill="#f6faf5" font-size="21">TCAs, antihistamines, the key nursing</text><text x="41" y="543" fill="#f6faf5" font-size="21">point is: Classic picture: hot as a hare,</text><text x="41" y="570" fill="#f6faf5" font-size="21">dry as a bone, red as a beet, MAD AS A</text><text x="41" y="597" fill="#f6faf5" font-size="21">HATTER, blind as a bat.</text></g></svg>