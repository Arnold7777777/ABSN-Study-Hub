<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A client has just returned from coronary angiography through the right femoral artery. Which instruction is accurate?</title><desc>Keeping the leg straight (with the head of the bed low) for the prescribed bed-rest period lets a clot seal the arterial puncture and prevents bleeding or a hematoma. Check the site, distal pulses, color, temperature and sensation of that leg frequently.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Femoral cardiac catheterization -</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">leg straight</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client has just returned from coronary</text><text x="41" y="231" fill="#f6faf5" font-size="21">angiography through the right femoral</text><text x="41" y="258" fill="#f6faf5" font-size="21">artery. Which instruction is accurate?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Keep the right leg straight for the</text><text x="41" y="390" fill="#f6faf5" font-size="21">prescribed time</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Keeping the leg straight (with the head of</text><text x="41" y="522" fill="#f6faf5" font-size="21">the bed low) for the prescribed bed-rest</text><text x="41" y="549" fill="#f6faf5" font-size="21">period lets a clot seal the arterial</text><text x="41" y="576" fill="#f6faf5" font-size="21">puncture and prevents bleeding or a</text><text x="41" y="603" fill="#f6faf5" font-size="21">hematoma. Check the site, distal pulses,</text><text x="41" y="630" fill="#f6faf5" font-size="21">color, temperature and sensation of that</text><text x="41" y="657" fill="#f6faf5" font-size="21">leg frequently.</text></g></svg>