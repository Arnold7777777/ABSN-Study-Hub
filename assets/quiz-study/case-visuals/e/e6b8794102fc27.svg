<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A 70-year-old client receiving enteral feedings through a gastrostomy tube develops frequent watery stools. Which of the following factors should the nurse identify as possible contributing causes?</title><desc>RAPID BOLUS delivery triggers a dumping-type response, SORBITOL in liquid medications is an osmotic laxative, and recent BROAD-SPECTRUM ANTIBIOTICS cause antibiotic-associated diarrhea and C. DIFFICILE. Changing the bag at 6 hours is within the usual 4 to 8 hour open-system hang time and is correct practice, and elevating the head of bed prevents ASPIRATION rather than causing diarrhea.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Causes of Diarrhea with Enteral</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">(G-Tube)</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A 70-year-old client receiving enteral</text><text x="41" y="231" fill="#f6faf5" font-size="21">feedings through a gastrostomy tube</text><text x="41" y="258" fill="#f6faf5" font-size="21">develops frequent watery stools. Which of</text><text x="41" y="285" fill="#f6faf5" font-size="21">the following factors should the nurse</text><text x="41" y="312" fill="#f6faf5" font-size="21">identify as possible contributing causes?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">The formula is being delivered by rapid</text><text x="41" y="444" fill="#f6faf5" font-size="21">bolus rather than continuous infusion.</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">RAPID BOLUS delivery triggers a dumping-</text><text x="41" y="576" fill="#f6faf5" font-size="21">type response, SORBITOL in liquid</text><text x="41" y="603" fill="#f6faf5" font-size="21">medications is an osmotic laxative, and</text><text x="41" y="630" fill="#f6faf5" font-size="21">recent BROAD-SPECTRUM ANTIBIOTICS cause</text><text x="41" y="657" fill="#f6faf5" font-size="21">antibiotic-associated diarrhea and C.</text></g></svg>