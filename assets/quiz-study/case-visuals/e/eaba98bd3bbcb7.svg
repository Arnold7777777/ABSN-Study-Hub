<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which type of play should the nurse expect from a 2-year-old?</title><desc>Infant - solitary. Toddler - parallel. Preschool - associative. School age - cooperative. A toddler will play next to another child quite happily without playing with them, and that is normal, not antisocial. Toys by stage: pat-a-cake for infants, push-pull toys and puppets for toddlers, dress-up and large-piece puzzles for preschoolers, board games and reading for school age.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which type of play should the nurse expect</text><text x="41" y="198" fill="#f6faf5" font-size="21">from a 2-year-old?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Parallel play - playing alongside other</text><text x="41" y="330" fill="#f6faf5" font-size="21">children rather than with them</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Infant - solitary. Toddler - parallel.</text><text x="41" y="462" fill="#f6faf5" font-size="21">Preschool - associative. School age -</text><text x="41" y="489" fill="#f6faf5" font-size="21">cooperative. A toddler will play next to</text><text x="41" y="516" fill="#f6faf5" font-size="21">another child quite happily without</text><text x="41" y="543" fill="#f6faf5" font-size="21">playing with them, and that is normal, not</text><text x="41" y="570" fill="#f6faf5" font-size="21">antisocial. Toys by stage: pat-a-cake for</text><text x="41" y="597" fill="#f6faf5" font-size="21">infants, push-pull toys and puppets for</text><text x="41" y="624" fill="#f6faf5" font-size="21">toddlers, dress-up and…</text></g></svg>