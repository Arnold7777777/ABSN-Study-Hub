<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A client has the problem of risk for impaired skin integrity related to immobility. Which outcome statement is written correctly?</title><desc>A correct outcome names the client, the specific observable result, and the time frame . The last option is tempting because it looks like formal care plan language, but it restates the problem rather than describing the desired result, and the third option is a nursing intervention.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Writing Outcome Statements</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has the problem of risk for</text><text x="41" y="198" fill="#f6faf5" font-size="21">impaired skin integrity related to</text><text x="41" y="225" fill="#f6faf5" font-size="21">immobility. Which outcome statement is</text><text x="41" y="252" fill="#f6faf5" font-size="21">written correctly?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">The client&#x27;s sacral skin will remain</text><text x="41" y="384" fill="#f6faf5" font-size="21">intact and free of nonblanchable redness</text><text x="41" y="411" fill="#f6faf5" font-size="21">through discharge</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A correct outcome names the client, the</text><text x="41" y="543" fill="#f6faf5" font-size="21">specific observable result, and the time</text><text x="41" y="570" fill="#f6faf5" font-size="21">frame . The last option is tempting</text><text x="41" y="597" fill="#f6faf5" font-size="21">because it looks like formal care plan</text><text x="41" y="624" fill="#f6faf5" font-size="21">language, but it restates the problem</text><text x="41" y="651" fill="#f6faf5" font-size="21">rather than describing the desired result,</text><text x="41" y="678" fill="#f6faf5" font-size="21">and the third option is a nursing</text><text x="41" y="705" fill="#f6faf5" font-size="21">intervention.</text></g></svg>