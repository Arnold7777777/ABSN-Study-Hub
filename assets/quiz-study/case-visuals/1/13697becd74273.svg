<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is administering IV vancomycin. Which teaching reflects understanding of the ototoxicity risk?</title><desc>Vancomycin is ototoxic and nephrotoxic , and the risk tracks with the level — which is why peaks and troughs are drawn. The risk comes with sustained high levels over time, not one dose, and oral vancomycin is barely absorbed. Report new tinnitus or hearing change straight away.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Disorders - Eye &amp; Ear</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is administering IV vancomycin.</text><text x="41" y="198" fill="#f6faf5" font-size="21">Which teaching reflects understanding of</text><text x="41" y="225" fill="#f6faf5" font-size="21">the ototoxicity risk?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">&quot;We&#x27;ll check your peak and trough levels.&quot;</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Vancomycin is ototoxic and nephrotoxic ,</text><text x="41" y="462" fill="#f6faf5" font-size="21">and the risk tracks with the level — which</text><text x="41" y="489" fill="#f6faf5" font-size="21">is why peaks and troughs are drawn. The</text><text x="41" y="516" fill="#f6faf5" font-size="21">risk comes with sustained high levels over</text><text x="41" y="543" fill="#f6faf5" font-size="21">time, not one dose, and oral vancomycin is</text><text x="41" y="570" fill="#f6faf5" font-size="21">barely absorbed. Report new tinnitus or</text><text x="41" y="597" fill="#f6faf5" font-size="21">hearing change straight away.</text></g></svg>