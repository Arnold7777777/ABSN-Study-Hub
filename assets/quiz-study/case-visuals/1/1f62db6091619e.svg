<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client with a history of hyperkalemia needs teaching on foods to AVOID. Which should be included? (SATA)</title><desc>High-potassium foods to limit: avocado, banana, potato (very high), and orange. Lettuce and apple are low in potassium. Clients in renal failure or on ACE inhibitors/spironolactone must especially watch intake.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with a history of hyperkalemia</text><text x="41" y="198" fill="#f6faf5" font-size="21">needs teaching on foods to AVOID. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">should be included? (SATA)</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Avocado · Banana · Potato · Orange</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">High-potassium foods to limit: avocado,</text><text x="41" y="462" fill="#f6faf5" font-size="21">banana, potato (very high), and orange.</text><text x="41" y="489" fill="#f6faf5" font-size="21">Lettuce and apple are low in potassium.</text><text x="41" y="516" fill="#f6faf5" font-size="21">Clients in renal failure or on ACE</text><text x="41" y="543" fill="#f6faf5" font-size="21">inhibitors/spironolactone must especially</text><text x="41" y="570" fill="#f6faf5" font-size="21">watch intake.</text></g></svg>