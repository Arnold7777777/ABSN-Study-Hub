<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A client on clozapine calls to report a fever and sore throat. What is the nurse&#x27;s priority concern?</title><desc>Clozapine can cause agranulocytosis, a dangerous fall in neutrophils. Fever and sore throat may signal infection from neutropenia, so the ANC must be checked before assuming a minor illness.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology: Clozapine</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client on clozapine calls to report a</text><text x="41" y="198" fill="#f6faf5" font-size="21">fever and sore throat. What is the nurse&#x27;s</text><text x="41" y="225" fill="#f6faf5" font-size="21">priority concern?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Agranulocytosis</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Clozapine can cause agranulocytosis, a</text><text x="41" y="462" fill="#f6faf5" font-size="21">dangerous fall in neutrophils. Fever and</text><text x="41" y="489" fill="#f6faf5" font-size="21">sore throat may signal infection from</text><text x="41" y="516" fill="#f6faf5" font-size="21">neutropenia, so the ANC must be checked</text><text x="41" y="543" fill="#f6faf5" font-size="21">before assuming a minor illness.</text></g></svg>