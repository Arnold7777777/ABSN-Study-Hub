<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>An infant weighed 8 lb 5 oz at birth and weighs 14 lb 4 oz at the 6-month visit. What does the nurse do?</title><desc>Birth weight doubles by about 6 months and triples by 1 year . Double 8 lb 5 oz is about 16 lb 10 oz, so 14 lb 4 oz is well short and needs follow-up for poor growth.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Infant (0–1 year)</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An infant weighed 8 lb 5 oz at birth and</text><text x="41" y="198" fill="#f6faf5" font-size="21">weighs 14 lb 4 oz at the 6-month visit.</text><text x="41" y="225" fill="#f6faf5" font-size="21">What does the nurse do?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Report the finding: the infant should</text><text x="41" y="357" fill="#f6faf5" font-size="21">weigh about double the birth weight, about</text><text x="41" y="384" fill="#f6faf5" font-size="21">16.5 lb</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Birth weight doubles by about 6 months and</text><text x="41" y="516" fill="#f6faf5" font-size="21">triples by 1 year . Double 8 lb 5 oz is</text><text x="41" y="543" fill="#f6faf5" font-size="21">about 16 lb 10 oz, so 14 lb 4 oz is well</text><text x="41" y="570" fill="#f6faf5" font-size="21">short and needs follow-up for poor growth.</text></g></svg>