<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client on long-term fluphenazine shows constant lip smacking and tongue darting. Which action is most appropriate?</title><desc>Lip smacking and tongue darting are tardive dyskinesia , which can be irreversible, so the provider is notified to reduce, change, or stop the drug. Benztropine treats acute EPS but not TD, and raising the dose only masks the movements temporarily.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology: EPS Treatment</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client on long-term fluphenazine shows</text><text x="41" y="198" fill="#f6faf5" font-size="21">constant lip smacking and tongue darting.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which action is most appropriate?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Notify the provider; these movements may</text><text x="41" y="357" fill="#f6faf5" font-size="21">be permanent and the regimen must be</text><text x="41" y="384" fill="#f6faf5" font-size="21">reviewed</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Lip smacking and tongue darting are</text><text x="41" y="516" fill="#f6faf5" font-size="21">tardive dyskinesia , which can be</text><text x="41" y="543" fill="#f6faf5" font-size="21">irreversible, so the provider is notified</text><text x="41" y="570" fill="#f6faf5" font-size="21">to reduce, change, or stop the drug.</text><text x="41" y="597" fill="#f6faf5" font-size="21">Benztropine treats acute EPS but not TD,</text><text x="41" y="624" fill="#f6faf5" font-size="21">and raising the dose only masks the</text><text x="41" y="651" fill="#f6faf5" font-size="21">movements temporarily.</text></g></svg>