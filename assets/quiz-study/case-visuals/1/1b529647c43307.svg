<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is changing the tubing on a central venous catheter for a 60-year-old client when the client suddenly becomes dyspneic and reports chest pain. The client is hypotensive and anxious, and the nurse auscultates a churning murmur over the precordium. Which of the following actions should the nurse take first?</title><desc>SUDDEN DYSPNEA PLUS CHEST PAIN PLUS CHURNING MURMUR DURING TUBING CHANGE = AIR EMBOLISM, so clamp the line to stop more air entry and turn the client LEFT LATERAL TRENDELENBURG to trap air in the right atrium, then give 100% oxygen and notify the provider. Flat supine does not trap the air. A diuretic treats overload, not air, and yanking the catheter can allow even more air to enter.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">IV Therapy Complications</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is changing the tubing on a</text><text x="41" y="198" fill="#f6faf5" font-size="21">central venous catheter for a 60-year-old</text><text x="41" y="225" fill="#f6faf5" font-size="21">client when the client suddenly becomes</text><text x="41" y="252" fill="#f6faf5" font-size="21">dyspneic and reports chest pain.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Clamp the catheter and position the client</text><text x="41" y="384" fill="#f6faf5" font-size="21">in left lateral Trendelenburg</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">SUDDEN DYSPNEA PLUS CHEST PAIN PLUS</text><text x="41" y="516" fill="#f6faf5" font-size="21">CHURNING MURMUR DURING TUBING CHANGE = AIR</text><text x="41" y="543" fill="#f6faf5" font-size="21">EMBOLISM, so clamp the line to stop more</text><text x="41" y="570" fill="#f6faf5" font-size="21">air entry and turn the client LEFT LATERAL</text><text x="41" y="597" fill="#f6faf5" font-size="21">TRENDELENBURG to trap air in the right</text><text x="41" y="624" fill="#f6faf5" font-size="21">atrium, then give 100% oxygen and notify</text><text x="41" y="651" fill="#f6faf5" font-size="21">the provider.</text></g></svg>