<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is teaching testicular self-examination. Which instruction is correct?</title><desc>Monthly, after a warm bath or shower when the scrotum is relaxed, rolling each testis gently between thumb and fingers. The epididymis is a normal cord-like structure behind the testis and is often mistaken for a lump. A painless hard lump is the finding to report.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Reproductive Disorders</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching testicular self-</text><text x="41" y="198" fill="#f6faf5" font-size="21">examination. Which instruction is correct?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Examine monthly after a warm shower, when</text><text x="41" y="330" fill="#f6faf5" font-size="21">the scrotum is relaxed</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Monthly, after a warm bath or shower when</text><text x="41" y="462" fill="#f6faf5" font-size="21">the scrotum is relaxed, rolling each</text><text x="41" y="489" fill="#f6faf5" font-size="21">testis gently between thumb and fingers.</text><text x="41" y="516" fill="#f6faf5" font-size="21">The epididymis is a normal cord-like</text><text x="41" y="543" fill="#f6faf5" font-size="21">structure behind the testis and is often</text><text x="41" y="570" fill="#f6faf5" font-size="21">mistaken for a lump. A painless hard lump</text><text x="41" y="597" fill="#f6faf5" font-size="21">is the finding to report.</text></g></svg>