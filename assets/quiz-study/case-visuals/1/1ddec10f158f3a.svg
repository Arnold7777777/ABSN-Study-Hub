<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>A client at 14 weeks of gestation has a uterus larger than expected for dates, severe vomiting, dark brown bleeding with grape-like vesicles, and now an elevated blood pressure with proteinuria. Which finding most strongly signals a molar pregnancy?</title><desc>Preeclampsia features before 24 weeks are the giveaway for a hydatidiform mole, since preeclampsia does not normally appear that early. Nausea is tempting because hyperemesis is part of the picture, but nausea, urinary frequency, and no movement at 10 weeks are all expected in pregnancy.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 14 weeks of gestation has a</text><text x="41" y="231" fill="#f6faf5" font-size="21">uterus larger than expected for dates,</text><text x="41" y="258" fill="#f6faf5" font-size="21">severe vomiting, dark brown bleeding with</text><text x="41" y="285" fill="#f6faf5" font-size="21">grape-like vesicles, and now an elevated</text><text x="41" y="312" fill="#f6faf5" font-size="21">blood pressure with proteinuria.</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Preeclampsia features appearing before 24</text><text x="41" y="444" fill="#f6faf5" font-size="21">weeks</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Preeclampsia features before 24 weeks are</text><text x="41" y="576" fill="#f6faf5" font-size="21">the giveaway for a hydatidiform mole,</text><text x="41" y="603" fill="#f6faf5" font-size="21">since preeclampsia does not normally</text><text x="41" y="630" fill="#f6faf5" font-size="21">appear that early. Nausea is tempting</text><text x="41" y="657" fill="#f6faf5" font-size="21">because hyperemesis is part of the</text><text x="41" y="684" fill="#f6faf5" font-size="21">picture, but nausea, urinary frequency,</text><text x="41" y="711" fill="#f6faf5" font-size="21">and no movement at 10 weeks are all</text><text x="41" y="738" fill="#f6faf5" font-size="21">expected in pregnancy.</text></g></svg>