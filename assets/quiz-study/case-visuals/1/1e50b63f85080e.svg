<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>Which neurotransmitter can act as either excitatory or inhibitory?</title><desc>Acetylcholine appears on both the excitatory and the inhibitory list — it is the one transmitter that does both. Glutamate is purely excitatory and GABA is purely inhibitory, which is why they are the classic opposites.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Foundations, Neurobiology &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Psychopharm Basics</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which neurotransmitter can act as either</text><text x="41" y="231" fill="#f6faf5" font-size="21">excitatory or inhibitory?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Acetylcholine</text><path d="M319 360v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="376" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 389) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="410" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="441" fill="#f6faf5" font-size="21">Acetylcholine appears on both the</text><text x="41" y="468" fill="#f6faf5" font-size="21">excitatory and the inhibitory list — it is</text><text x="41" y="495" fill="#f6faf5" font-size="21">the one transmitter that does both.</text><text x="41" y="522" fill="#f6faf5" font-size="21">Glutamate is purely excitatory and GABA is</text><text x="41" y="549" fill="#f6faf5" font-size="21">purely inhibitory, which is why they are</text><text x="41" y="576" fill="#f6faf5" font-size="21">the classic opposites.</text></g></svg>