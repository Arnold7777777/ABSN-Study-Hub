<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>Which actions does the nurse take now?</title><desc>De-escalation works by handing back some control: reflecting the grievance, offering genuine choices, and presenting medication as something he takes rather than something done to him. Threatening restraint escalates nearly everyone and turns a treatment into a punishment. A show of force is reserved for a client who is already violent, not one who is loud and still talking.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Agitation, De-escalation, and</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Restraint</text><rect x="23" y="139" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which actions does the nurse take now?</text><path d="M319 228v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="244" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 257) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="278" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="309" fill="#f6faf5" font-size="21">Say what she hears: that he was counting</text><text x="41" y="336" fill="#f6faf5" font-size="21">on the visit and feels unheard · Offer a</text><text x="41" y="363" fill="#f6faf5" font-size="21">real choice, such as a quieter room or a</text><text x="41" y="390" fill="#f6faf5" font-size="21">phone call to his family · Offer the as-</text><text x="41" y="417" fill="#f6faf5" font-size="21">needed oral medication as…</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">De-escalation works by handing back some</text><text x="41" y="549" fill="#f6faf5" font-size="21">control: reflecting the grievance,</text><text x="41" y="576" fill="#f6faf5" font-size="21">offering genuine choices, and presenting</text><text x="41" y="603" fill="#f6faf5" font-size="21">medication as something he takes rather</text><text x="41" y="630" fill="#f6faf5" font-size="21">than something done to him.</text></g></svg>