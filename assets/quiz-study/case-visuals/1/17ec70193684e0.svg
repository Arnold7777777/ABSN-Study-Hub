<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>The nurse is teaching personal safety to the parents of a 4-year-old. Which points should the nurse include? Select all that apply.</title><desc>As preschoolers become more independent, safety teaching shifts to strangers, traffic and knowing who and how to ask for help . Small chores build initiative. Choking prevention is the priority for younger children.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Toddler &amp; Preschooler</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is teaching personal safety to</text><text x="41" y="198" fill="#f6faf5" font-size="21">the parents of a 4-year-old. Which points</text><text x="41" y="225" fill="#f6faf5" font-size="21">should the nurse include? Select all that</text><text x="41" y="252" fill="#f6faf5" font-size="21">apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Teach the child never to accept a ride,</text><text x="41" y="384" fill="#f6faf5" font-size="21">gifts or candy from a stranger · Teach the</text><text x="41" y="411" fill="#f6faf5" font-size="21">child to recognize police officers and</text><text x="41" y="438" fill="#f6faf5" font-size="21">other community helpers · Cross the street</text><text x="41" y="465" fill="#f6faf5" font-size="21">only while holding an…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">As preschoolers become more independent,</text><text x="41" y="597" fill="#f6faf5" font-size="21">safety teaching shifts to strangers,</text><text x="41" y="624" fill="#f6faf5" font-size="21">traffic and knowing who and how to ask for</text><text x="41" y="651" fill="#f6faf5" font-size="21">help . Small chores build initiative.</text><text x="41" y="678" fill="#f6faf5" font-size="21">Choking prevention is the priority for</text><text x="41" y="705" fill="#f6faf5" font-size="21">younger children.</text></g></svg>