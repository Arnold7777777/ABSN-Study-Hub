<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>The nurse is doing a physical assessment of an 11-year-old. Which approaches are appropriate? Select all that apply.</title><desc>School-age children can follow a head-to-toe sequence, give their own history and understand explanations, and they value modesty and privacy . Leaving them out of the conversation undermines cooperation, and the painful area is examined last .</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is doing a physical assessment</text><text x="41" y="198" fill="#f6faf5" font-size="21">of an 11-year-old. Which approaches are</text><text x="41" y="225" fill="#f6faf5" font-size="21">appropriate? Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Examine head to toe, as for an adult · Ask</text><text x="41" y="357" fill="#f6faf5" font-size="21">the child to describe their own symptoms ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Explain the findings to the child as well</text><text x="41" y="411" fill="#f6faf5" font-size="21">as the parent · Respect a request to be</text><text x="41" y="438" fill="#f6faf5" font-size="21">examined without the…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">School-age children can follow a head-to-</text><text x="41" y="570" fill="#f6faf5" font-size="21">toe sequence, give their own history and</text><text x="41" y="597" fill="#f6faf5" font-size="21">understand explanations, and they value</text><text x="41" y="624" fill="#f6faf5" font-size="21">modesty and privacy . Leaving them out of</text><text x="41" y="651" fill="#f6faf5" font-size="21">the conversation undermines cooperation,</text><text x="41" y="678" fill="#f6faf5" font-size="21">and the painful area is examined last .</text></g></svg>