<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A nurse is caring for a client 24 hr after abdominal surgery. Which drainage on the dressing should the nurse recognize as expected?</title><desc>SEROSANGUINEOUS DRAINAGE, A PALE PINK WATERY MIX OF SERUM AND BLOOD, IS EXPECTED DURING THE FIRST 48 HR AFTER SURGERY. Bright red sanguineous drainage that saturates the dressing indicates active hemorrhage and requires immediate intervention, and green or brown foul-smelling drainage suggests infection or a fistula.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Wound Drainage</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client 24 hr after</text><text x="41" y="198" fill="#f6faf5" font-size="21">abdominal surgery. Which drainage on the</text><text x="41" y="225" fill="#f6faf5" font-size="21">dressing should the nurse recognize as</text><text x="41" y="252" fill="#f6faf5" font-size="21">expected?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">A small amount of pale pink, watery</text><text x="41" y="384" fill="#f6faf5" font-size="21">drainage</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">SEROSANGUINEOUS DRAINAGE, A PALE PINK</text><text x="41" y="516" fill="#f6faf5" font-size="21">WATERY MIX OF SERUM AND BLOOD, IS EXPECTED</text><text x="41" y="543" fill="#f6faf5" font-size="21">DURING THE FIRST 48 HR AFTER SURGERY.</text></g></svg>