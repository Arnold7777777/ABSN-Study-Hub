<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client at 32 weeks arrives with dark red vaginal bleeding, constant abdominal pain, and a uterus that is rigid and board-like on palpation. Which complication does the nurse suspect?</title><desc>Abruption is painful, with dark red bleeding and a rigid board-like uterus ; previa is painless bright red bleeding with a soft uterus. That single word, pain, decides the question, and abruption is also the most common obstetric cause of DIC.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 32 weeks arrives with dark red</text><text x="41" y="231" fill="#f6faf5" font-size="21">vaginal bleeding, constant abdominal pain,</text><text x="41" y="258" fill="#f6faf5" font-size="21">and a uterus that is rigid and board-like</text><text x="41" y="285" fill="#f6faf5" font-size="21">on palpation. Which complication does the</text><text x="41" y="312" fill="#f6faf5" font-size="21">nurse suspect?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Placental abruption</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Abruption is painful, with dark red</text><text x="41" y="549" fill="#f6faf5" font-size="21">bleeding and a rigid board-like uterus ;</text><text x="41" y="576" fill="#f6faf5" font-size="21">previa is painless bright red bleeding</text><text x="41" y="603" fill="#f6faf5" font-size="21">with a soft uterus. That single word,</text><text x="41" y="630" fill="#f6faf5" font-size="21">pain, decides the question, and abruption</text><text x="41" y="657" fill="#f6faf5" font-size="21">is also the most common obstetric cause of</text><text x="41" y="684" fill="#f6faf5" font-size="21">DIC.</text></g></svg>