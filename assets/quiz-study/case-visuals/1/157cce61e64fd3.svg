<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is teaching the parents of a 4-year-old how to build their child&#x27;s fine motor skills. Which activity should the nurse recommend?</title><desc>Scissors. By 4 to 6 a preschooler can hold and use them correctly, and cutting is the activity that builds the skill at this age — alongside copying a square and drawing a person with three parts. Dolls and action figures are imaginative play, which is valuable but not fine motor. A house of cards and small Lego both need a steadier hand and more patience than a preschooler has; those belong to the school-age child, 6 to 12, along with cursive writing.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Toddler &amp; Preschooler</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching the parents of a</text><text x="41" y="198" fill="#f6faf5" font-size="21">4-year-old how to build their child&#x27;s fine</text><text x="41" y="225" fill="#f6faf5" font-size="21">motor skills. Which activity should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse recommend?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Introducing the correct way to hold and</text><text x="41" y="384" fill="#f6faf5" font-size="21">use scissors</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Scissors. By 4 to 6 a preschooler can hold</text><text x="41" y="516" fill="#f6faf5" font-size="21">and use them correctly, and cutting is the</text><text x="41" y="543" fill="#f6faf5" font-size="21">activity that builds the skill at this age</text><text x="41" y="570" fill="#f6faf5" font-size="21">— alongside copying a square and drawing a</text><text x="41" y="597" fill="#f6faf5" font-size="21">person with three parts. Dolls and action</text><text x="41" y="624" fill="#f6faf5" font-size="21">figures are imaginative play, which is</text><text x="41" y="651" fill="#f6faf5" font-size="21">valuable but not fine motor. A house of</text><text x="41" y="678" fill="#f6faf5" font-size="21">cards and…</text></g></svg>