<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is reviewing findings of a client&#x27;s biophysical profile (BPP) with the charge nurse. Which variables should the nurse expect the test to include? Select all that apply.</title><desc>A BPP scores five things, two points each: fetal breathing movements, gross body movements, fetal tone, amniotic fluid volume, and a reactive nonstress test. 8 to 10 is reassuring, 6 is equivocal, 4 or less needs delivery considered. Nothing on the BPP is a maternal measurement.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is reviewing findings of a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client&#x27;s biophysical profile (BPP) with</text><text x="41" y="225" fill="#f6faf5" font-size="21">the charge nurse. Which variables should</text><text x="41" y="252" fill="#f6faf5" font-size="21">the nurse expect the test to include?</text><text x="41" y="279" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Fetal breathing movements · Fetal tone ·</text><text x="41" y="411" fill="#f6faf5" font-size="21">Amniotic fluid volume · Gross fetal body</text><text x="41" y="438" fill="#f6faf5" font-size="21">movements</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">A BPP scores five things, two points each:</text><text x="41" y="570" fill="#f6faf5" font-size="21">fetal breathing movements, gross body</text><text x="41" y="597" fill="#f6faf5" font-size="21">movements, fetal tone, amniotic fluid</text><text x="41" y="624" fill="#f6faf5" font-size="21">volume, and a reactive nonstress test. 8</text><text x="41" y="651" fill="#f6faf5" font-size="21">to 10 is reassuring, 6 is equivocal, 4 or</text><text x="41" y="678" fill="#f6faf5" font-size="21">less needs delivery considered. Nothing on</text><text x="41" y="705" fill="#f6faf5" font-size="21">the BPP is a maternal measurement.</text></g></svg>