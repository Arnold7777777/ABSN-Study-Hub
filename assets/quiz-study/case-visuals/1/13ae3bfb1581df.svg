<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="620" viewBox="0 0 640 620"><title>Treatment for active TB lasts at least {0} and every drug cycle must be completed. Because many TB drugs are {1}, the nurse monitors {2}.</title><desc>TB drugs run at least 6 to 12 months, and stopping early is what breeds resistant organisms, so adherence teaching is central. Rifampin, isoniazid and pyrazinamide are all hard on the liver, so liver enzymes are followed and the client is taught to report jaundice, dark urine or right upper quadrant pain rather than to just stop the drug.</desc><rect width="640" height="620" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">TB treatment</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Treatment for active TB lasts at least {0}</text><text x="41" y="198" fill="#f6faf5" font-size="21">and every drug cycle must be completed.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Because many TB drugs are {1}, the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">monitors {2}.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="303" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">TB drugs run at least 6 to 12 months, and</text><text x="41" y="384" fill="#f6faf5" font-size="21">stopping early is what breeds resistant</text><text x="41" y="411" fill="#f6faf5" font-size="21">organisms, so adherence teaching is</text><text x="41" y="438" fill="#f6faf5" font-size="21">central. Rifampin, isoniazid and</text><text x="41" y="465" fill="#f6faf5" font-size="21">pyrazinamide are all hard on the liver, so</text><text x="41" y="492" fill="#f6faf5" font-size="21">liver enzymes are followed and the client</text><text x="41" y="519" fill="#f6faf5" font-size="21">is taught to report jaundice, dark urine</text><text x="41" y="546" fill="#f6faf5" font-size="21">or right upper quadrant pain rather than</text><text x="41" y="573" fill="#f6faf5" font-size="21">to just stop the drug.</text></g></svg>