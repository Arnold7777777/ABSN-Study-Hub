<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client makes a serious, specific threat to kill a named coworker. Which nursing action reflects the duty to warn (Tarasoff)?</title><desc>When a client voices a serious, specific threat against an identifiable person, the duty to warn overrides confidentiality; the team must warn and protect the intended victim.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client makes a serious, specific threat</text><text x="41" y="198" fill="#f6faf5" font-size="21">to kill a named coworker. Which nursing</text><text x="41" y="225" fill="#f6faf5" font-size="21">action reflects the duty to warn</text><text x="41" y="252" fill="#f6faf5" font-size="21">(Tarasoff)?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Warn and protect the identified potential</text><text x="41" y="384" fill="#f6faf5" font-size="21">victim and notify the team</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">When a client voices a serious, specific</text><text x="41" y="516" fill="#f6faf5" font-size="21">threat against an identifiable person, the</text><text x="41" y="543" fill="#f6faf5" font-size="21">duty to warn overrides confidentiality;</text><text x="41" y="570" fill="#f6faf5" font-size="21">the team must warn and protect the</text><text x="41" y="597" fill="#f6faf5" font-size="21">intended victim.</text></g></svg>