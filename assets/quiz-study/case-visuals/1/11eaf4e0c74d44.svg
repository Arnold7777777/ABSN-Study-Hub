<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is caring for a client whose platelet count dropped from 220,000 to 90,000 in 48 hours. The client has been on heparin for one week. Which nursing actions would be appropriate for this client? Select all that apply.</title><desc>A sharp platelet drop on heparin is heparin-induced thrombocytopenia: stop the heparin, keep monitoring platelets, notify the provider, and watch for clots , because HIT paradoxically causes thrombosis as well as bleeding. Vitamin K reverses warfarin, not heparin, and warfarin would not be started with platelets at 90,000.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Heparin-induced thrombocytopenia</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client whose</text><text x="41" y="198" fill="#f6faf5" font-size="21">platelet count dropped from 220,000 to</text><text x="41" y="225" fill="#f6faf5" font-size="21">90,000 in 48 hours.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Discontinue heparin immediately. · Monitor</text><text x="41" y="357" fill="#f6faf5" font-size="21">platelet count daily. · Notify the</text><text x="41" y="384" fill="#f6faf5" font-size="21">healthcare provider. · Assess for signs of</text><text x="41" y="411" fill="#f6faf5" font-size="21">thrombosis.</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A sharp platelet drop on heparin is</text><text x="41" y="543" fill="#f6faf5" font-size="21">heparin-induced thrombocytopenia: stop the</text><text x="41" y="570" fill="#f6faf5" font-size="21">heparin, keep monitoring platelets, notify</text><text x="41" y="597" fill="#f6faf5" font-size="21">the provider, and watch for clots ,</text><text x="41" y="624" fill="#f6faf5" font-size="21">because HIT paradoxically causes</text><text x="41" y="651" fill="#f6faf5" font-size="21">thrombosis as well as bleeding.</text></g></svg>