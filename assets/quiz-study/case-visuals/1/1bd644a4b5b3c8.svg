<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>The daughter of a client who just died says to the nurse, &#x27;I should have made him see a doctor months ago. This is my fault.&#x27; Which response should the nurse make?</title><desc>Reflecting the feeling invites the daughter to keep talking about the guilt, which is a normal and common part of early grief. Telling her not to blame herself sounds kind but closes the topic and denies the emotion she just voiced.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Response</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The daughter of a client who just died</text><text x="41" y="198" fill="#f6faf5" font-size="21">says to the nurse, &#x27;I should have made him</text><text x="41" y="225" fill="#f6faf5" font-size="21">see a doctor months ago. This is my</text><text x="41" y="252" fill="#f6faf5" font-size="21">fault.&#x27; Which response should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">make?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&#x27;You are wondering whether something you</text><text x="41" y="411" fill="#f6faf5" font-size="21">did differently would have changed this.&#x27;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Reflecting the feeling invites the</text><text x="41" y="543" fill="#f6faf5" font-size="21">daughter to keep talking about the guilt,</text><text x="41" y="570" fill="#f6faf5" font-size="21">which is a normal and common part of early</text><text x="41" y="597" fill="#f6faf5" font-size="21">grief. Telling her not to blame herself</text><text x="41" y="624" fill="#f6faf5" font-size="21">sounds kind but closes the topic and</text><text x="41" y="651" fill="#f6faf5" font-size="21">denies the emotion she just voiced.</text></g></svg>