<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A client with a long history of alcohol use disorder presents with confusion, nystagmus, and ataxia. Which statements about this presentation are accurate? Select all that apply.</title><desc>Wernicke encephalopathy is an acute thiamine deficiency emergency presenting with the triad of confusion, oculomotor changes such as nystagmus, and ataxia, and it is reversible if thiamine is given promptly. Glucose without thiamine consumes remaining thiamine in glycolysis and can precipitate or worsen the encephalopathy, so thiamine comes first . If untreated it progresses to Korsakoff syndrome with permanent anterograde amnesia and confabulation, so attributing the confusion to intoxication alone risks irreversible damage.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with a long history of alcohol</text><text x="41" y="198" fill="#f6faf5" font-size="21">use disorder presents with confusion,</text><text x="41" y="225" fill="#f6faf5" font-size="21">nystagmus, and ataxia. Which statements</text><text x="41" y="252" fill="#f6faf5" font-size="21">about this presentation are accurate?</text><text x="41" y="279" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">The underlying cause is thiamine (vitamin</text><text x="41" y="411" fill="#f6faf5" font-size="21">B1) deficiency · Thiamine should be given</text><text x="41" y="438" fill="#f6faf5" font-size="21">before or with intravenous glucose ·</text><text x="41" y="465" fill="#f6faf5" font-size="21">Untreated Wernicke encephalopathy can</text><text x="41" y="492" fill="#f6faf5" font-size="21">progress to Korsakoff…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">Wernicke encephalopathy is an acute</text><text x="41" y="624" fill="#f6faf5" font-size="21">thiamine deficiency emergency presenting</text><text x="41" y="651" fill="#f6faf5" font-size="21">with the triad of confusion, oculomotor</text><text x="41" y="678" fill="#f6faf5" font-size="21">changes such as nystagmus, and ataxia, and</text><text x="41" y="705" fill="#f6faf5" font-size="21">it is reversible if thiamine is given</text><text x="41" y="732" fill="#f6faf5" font-size="21">promptly.</text></g></svg>