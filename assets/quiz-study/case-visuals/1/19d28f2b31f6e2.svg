<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A nurse is identifying clients who are at increased risk for a health care-associated infection. Which of the following clients should the nurse identify as being at greatest risk? (Select all that apply.)</title><desc>OLDER ADULTS, IMMUNOCOMPROMISED CLIENTS, CLIENTS WHO HAVE CHRONIC DISEASE SUCH AS DIABETES, AND INFANTS WITH IMMATURE IMMUNE SYSTEMS ARE AT HIGHEST RISK, AND INDWELLING DEVICES ARE THE LEADING CAUSE OF HEALTH CARE-ASSOCIATED INFECTIONS. The healthy young adult having a brief outpatient procedure has intact defenses and minimal exposure. Removing invasive devices as early as possible is a key preventive measure.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Infection Risk and HAIs</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is identifying clients who are at</text><text x="41" y="198" fill="#f6faf5" font-size="21">increased risk for a health care-</text><text x="41" y="225" fill="#f6faf5" font-size="21">associated infection. Which of the</text><text x="41" y="252" fill="#f6faf5" font-size="21">following clients should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">identify as being at greatest risk?</text><text x="41" y="306" fill="#f6faf5" font-size="21">(Select all that apply.)</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">An 84-year-old client who has an</text><text x="41" y="438" fill="#f6faf5" font-size="21">indwelling urinary catheter · A client</text><text x="41" y="465" fill="#f6faf5" font-size="21">receiving chemotherapy who has a WBC count</text><text x="41" y="492" fill="#f6faf5" font-size="21">of 1,800/mm3 · A client who has poorly</text><text x="41" y="519" fill="#f6faf5" font-size="21">controlled diabetes mellitus and a…</text><path d="M319 543v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="559" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 572) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="593" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="624" fill="#f6faf5" font-size="21">OLDER ADULTS, IMMUNOCOMPROMISED CLIENTS,</text><text x="41" y="651" fill="#f6faf5" font-size="21">CLIENTS WHO HAVE CHRONIC DISEASE SUCH AS</text><text x="41" y="678" fill="#f6faf5" font-size="21">DIABETES, AND INFANTS WITH IMMATURE IMMUNE</text><text x="41" y="705" fill="#f6faf5" font-size="21">SYSTEMS ARE AT HIGHEST RISK, AND</text><text x="41" y="732" fill="#f6faf5" font-size="21">INDWELLING DEVICES ARE THE LEADING CAUSE</text><text x="41" y="759" fill="#f6faf5" font-size="21">OF HEALTH CARE-ASSOCIATED INFECTIONS.</text></g></svg>