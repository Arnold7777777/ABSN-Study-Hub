<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is caring for a client who has bilateral soft wrist restraints applied. Which of the following actions should the nurse take? (Select all that apply.)</title><desc>RESTRAINTS ARE SECURED WITH A QUICK-RELEASE KNOT TO THE BED FRAME, NEVER TO A SIDE RAIL, because raising or lowering the rail would jerk or tighten the restraint and injure the client. Two fingers should slide easily underneath, circulation and skin are assessed at least every 2 hr with release, ROM, toileting, and fluids, and orders are TIME-LIMITED and must be renewed. PRN RESTRAINT ORDERS ARE NEVER ACCEPTABLE.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Restraints</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client who has</text><text x="41" y="198" fill="#f6faf5" font-size="21">bilateral soft wrist restraints applied.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which of the following actions should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse take? (Select all that apply.)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Secure the restraint straps to the bed</text><text x="41" y="384" fill="#f6faf5" font-size="21">frame using a quick-release knot · Verify</text><text x="41" y="411" fill="#f6faf5" font-size="21">that two fingers can slide between the</text><text x="41" y="438" fill="#f6faf5" font-size="21">restraint and the client&#x27;s skin · Assess</text><text x="41" y="465" fill="#f6faf5" font-size="21">neurovascular status and…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">RESTRAINTS ARE SECURED WITH A QUICK-</text><text x="41" y="597" fill="#f6faf5" font-size="21">RELEASE KNOT TO THE BED FRAME, NEVER TO A</text><text x="41" y="624" fill="#f6faf5" font-size="21">SIDE RAIL, because raising or lowering the</text><text x="41" y="651" fill="#f6faf5" font-size="21">rail would jerk or tighten the restraint</text><text x="41" y="678" fill="#f6faf5" font-size="21">and injure the client.</text></g></svg>