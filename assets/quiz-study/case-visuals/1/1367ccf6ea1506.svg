<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A family asks how hospice differs from palliative care. What is the nurse&#x27;s best answer?</title><desc>Palliative care is comfort care at any stage, including alongside curative treatment. Hospice is a form of palliative care for a limited prognosis, generally about six months, once curative treatment is no longer being pursued. Neither means giving up on the person.</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oncologic Disorders &amp; End-of-Life</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Care</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A family asks how hospice differs from</text><text x="41" y="231" fill="#f6faf5" font-size="21">palliative care. What is the nurse&#x27;s best</text><text x="41" y="258" fill="#f6faf5" font-size="21">answer?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">“Palliative care can run alongside</text><text x="41" y="390" fill="#f6faf5" font-size="21">treatment at any stage; hospice is for a</text><text x="41" y="417" fill="#f6faf5" font-size="21">prognosis of about six months when</text><text x="41" y="444" fill="#f6faf5" font-size="21">curative treatment has stopped.”</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Palliative care is comfort care at any</text><text x="41" y="576" fill="#f6faf5" font-size="21">stage, including alongside curative</text><text x="41" y="603" fill="#f6faf5" font-size="21">treatment. Hospice is a form of palliative</text><text x="41" y="630" fill="#f6faf5" font-size="21">care for a limited prognosis, generally</text><text x="41" y="657" fill="#f6faf5" font-size="21">about six months, once curative treatment</text><text x="41" y="684" fill="#f6faf5" font-size="21">is no longer being pursued. Neither means</text><text x="41" y="711" fill="#f6faf5" font-size="21">giving up on the person.</text></g></svg>