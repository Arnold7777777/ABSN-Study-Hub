<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which over-the-counter medication should the nurse teach a client with liver disease to avoid?</title><desc>Acetaminophen is metabolized by the liver and is directly hepatotoxic in liver disease, so it is avoided. This is the mirror image of kidney teaching, where the drug to avoid is the NSAID — keeping the two straight is the point of this question.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hepatotoxic Drugs</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which over-the-counter medication should</text><text x="41" y="198" fill="#f6faf5" font-size="21">the nurse teach a client with liver</text><text x="41" y="225" fill="#f6faf5" font-size="21">disease to avoid?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Acetaminophen</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Acetaminophen is metabolized by the liver</text><text x="41" y="462" fill="#f6faf5" font-size="21">and is directly hepatotoxic in liver</text><text x="41" y="489" fill="#f6faf5" font-size="21">disease, so it is avoided. This is the</text><text x="41" y="516" fill="#f6faf5" font-size="21">mirror image of kidney teaching, where the</text><text x="41" y="543" fill="#f6faf5" font-size="21">drug to avoid is the NSAID — keeping the</text><text x="41" y="570" fill="#f6faf5" font-size="21">two straight is the point of this</text><text x="41" y="597" fill="#f6faf5" font-size="21">question.</text></g></svg>