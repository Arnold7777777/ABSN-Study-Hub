<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>A client at 10 weeks has a uterus much larger than expected, dark brown vaginal discharge, and severe nausea and vomiting. Her hCG is very high. Which condition should the nurse suspect?</title><desc>A uterus larger than dates, markedly raised hCG, dark brown &#x27;prune juice&#x27; discharge and severe nausea point to a hydatidiform mole . After evacuation, hCG is followed for up to a year and she must avoid pregnancy during that follow-up , because a rising hCG is how choriocarcinoma is detected.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 10 weeks has a uterus much</text><text x="41" y="231" fill="#f6faf5" font-size="21">larger than expected, dark brown vaginal</text><text x="41" y="258" fill="#f6faf5" font-size="21">discharge, and severe nausea and vomiting.</text><text x="41" y="285" fill="#f6faf5" font-size="21">Her hCG is very high. Which condition</text><text x="41" y="312" fill="#f6faf5" font-size="21">should the nurse suspect?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Gestational trophoblastic disease</text><text x="41" y="444" fill="#f6faf5" font-size="21">(hydatidiform mole)</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">A uterus larger than dates, markedly</text><text x="41" y="576" fill="#f6faf5" font-size="21">raised hCG, dark brown &#x27;prune juice&#x27;</text><text x="41" y="603" fill="#f6faf5" font-size="21">discharge and severe nausea point to a</text><text x="41" y="630" fill="#f6faf5" font-size="21">hydatidiform mole . After evacuation, hCG</text><text x="41" y="657" fill="#f6faf5" font-size="21">is followed for up to a year and she must</text><text x="41" y="684" fill="#f6faf5" font-size="21">avoid pregnancy during that follow-up ,</text><text x="41" y="711" fill="#f6faf5" font-size="21">because a rising hCG is how</text><text x="41" y="738" fill="#f6faf5" font-size="21">choriocarcinoma is detected.</text></g></svg>