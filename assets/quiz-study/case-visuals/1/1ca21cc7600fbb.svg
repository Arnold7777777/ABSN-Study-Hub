<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>The occupational health nurse is assessing an employee who has just had respiratory exposure to a toxin. What should the nurse assess? Select all that apply.</title><desc>Key aspects of any assessment of clients with a potential occupational respiratory history include job and job activities, exposure levels, general hygiene, time frame of exposure, effectiveness of respiratory protection used, and direct versus indirect exposures. The client&#x27;s current respiratory status would also be a priority. Occupational lung hazards are not normally influenced by immunizations.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 5 · General Respiratory</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The occupational health nurse is assessing</text><text x="41" y="198" fill="#f6faf5" font-size="21">an employee who has just had respiratory</text><text x="41" y="225" fill="#f6faf5" font-size="21">exposure to a toxin. What should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">assess? Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Time frame of exposure · Type of</text><text x="41" y="384" fill="#f6faf5" font-size="21">respiratory protection used · Breath</text><text x="41" y="411" fill="#f6faf5" font-size="21">sounds · Intensity of exposure</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Key aspects of any assessment of clients</text><text x="41" y="543" fill="#f6faf5" font-size="21">with a potential occupational respiratory</text><text x="41" y="570" fill="#f6faf5" font-size="21">history include job and job activities,</text><text x="41" y="597" fill="#f6faf5" font-size="21">exposure levels, general hygiene, time</text><text x="41" y="624" fill="#f6faf5" font-size="21">frame of exposure, effectiveness of</text><text x="41" y="651" fill="#f6faf5" font-size="21">respiratory protection used, and direct</text><text x="41" y="678" fill="#f6faf5" font-size="21">versus indirect exposures.</text></g></svg>