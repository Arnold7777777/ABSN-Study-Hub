<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="509" viewBox="0 0 640 509"><title>A client with hemophilia is bleeding briskly from a venipuncture site on the forearm. What does the nurse do first?</title><desc>When the client is bleeding right now , compression beats a factor injection. Factor replacement is the definitive treatment and is given before and after procedures, but it does not stop active bleeding this minute; heat is wrong (use ice), and a CBC is the wrong lab because platelets are normal in hemophilia — coags are the priority labs.</desc><rect width="640" height="509" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematologic Disorders</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with hemophilia is bleeding</text><text x="41" y="198" fill="#f6faf5" font-size="21">briskly from a venipuncture site on the</text><text x="41" y="225" fill="#f6faf5" font-size="21">forearm. What does the nurse do first?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Hold firm compression over the site</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">When the client is bleeding right now ,</text><text x="41" y="462" fill="#f6faf5" font-size="21">compression beats a factor injection.</text></g></svg>