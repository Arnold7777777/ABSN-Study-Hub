<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A postoperative client becomes restless and irritable and repeatedly tries to climb out of bed. What should the nurse do first?</title><desc>Restlessness and irritability are the earliest signs of hypoxia, so the nurse assesses oxygenation before assuming agitation or confusion. Sedating this client is the dangerous choice — it would further depress respirations and mask a deteriorating airway.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Hypoxia</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A postoperative client becomes restless</text><text x="41" y="198" fill="#f6faf5" font-size="21">and irritable and repeatedly tries to</text><text x="41" y="225" fill="#f6faf5" font-size="21">climb out of bed. What should the nurse do</text><text x="41" y="252" fill="#f6faf5" font-size="21">first?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Assess the client&#x27;s oxygen saturation and</text><text x="41" y="384" fill="#f6faf5" font-size="21">respiratory status</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Restlessness and irritability are the</text><text x="41" y="516" fill="#f6faf5" font-size="21">earliest signs of hypoxia, so the nurse</text><text x="41" y="543" fill="#f6faf5" font-size="21">assesses oxygenation before assuming</text><text x="41" y="570" fill="#f6faf5" font-size="21">agitation or confusion. Sedating this</text><text x="41" y="597" fill="#f6faf5" font-size="21">client is the dangerous choice — it would</text><text x="41" y="624" fill="#f6faf5" font-size="21">further depress respirations and mask a</text><text x="41" y="651" fill="#f6faf5" font-size="21">deteriorating airway.</text></g></svg>