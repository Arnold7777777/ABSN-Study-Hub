<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>The nurse is creating a plan of care for a client diagnosed with acute laryngitis. Which intervention should be included in the client&#x27;s plan of care?</title><desc>Management of acute laryngitis includes resting the voice, avoiding irritants (including smoking), resting, and inhaling cool, not warm, steam or an aerosol. Fluid intake should be increased, not limited. Warm washcloths on the throat will not help relieve the symptoms of acute laryngitis.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 4 · Larynx / Airway</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is creating a plan of care for a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client diagnosed with acute laryngitis.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which intervention should be included in</text><text x="41" y="252" fill="#f6faf5" font-size="21">the client&#x27;s plan of care?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Encourage the client to limit speech</text><text x="41" y="384" fill="#f6faf5" font-size="21">whenever possible.</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Management of acute laryngitis includes</text><text x="41" y="516" fill="#f6faf5" font-size="21">resting the voice, avoiding irritants</text><text x="41" y="543" fill="#f6faf5" font-size="21">(including smoking), resting, and inhaling</text><text x="41" y="570" fill="#f6faf5" font-size="21">cool, not warm, steam or an aerosol. Fluid</text><text x="41" y="597" fill="#f6faf5" font-size="21">intake should be increased, not limited.</text><text x="41" y="624" fill="#f6faf5" font-size="21">Warm washcloths on the throat will not</text><text x="41" y="651" fill="#f6faf5" font-size="21">help relieve the symptoms of acute</text><text x="41" y="678" fill="#f6faf5" font-size="21">laryngitis.</text></g></svg>