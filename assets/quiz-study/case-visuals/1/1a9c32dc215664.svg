<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Two days after starting a new medication, a child with G6PD deficiency is brought to clinic. Which findings suggest a hemolytic episode? (Select all that apply.)</title><desc>Hemolysis releases hemoglobin (dark urine) and bilirubin (jaundice), and the sudden drop in hemoglobin causes pallor, fatigue and a fast heart rate, usually 1 to 3 days after the trigger. The marrow responds with a HIGH reticulocyte count, not a low one.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology &amp; Childhood Neoplasms</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Two days after starting a new medication,</text><text x="41" y="198" fill="#f6faf5" font-size="21">a child with G6PD deficiency is brought to</text><text x="41" y="225" fill="#f6faf5" font-size="21">clinic. Which findings suggest a hemolytic</text><text x="41" y="252" fill="#f6faf5" font-size="21">episode? (Select all that apply.)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Dark, cola-colored urine · Yellow sclera ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Pallor and tachycardia · Fatigue</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Hemolysis releases hemoglobin (dark urine)</text><text x="41" y="516" fill="#f6faf5" font-size="21">and bilirubin (jaundice), and the sudden</text><text x="41" y="543" fill="#f6faf5" font-size="21">drop in hemoglobin causes pallor, fatigue</text><text x="41" y="570" fill="#f6faf5" font-size="21">and a fast heart rate, usually 1 to 3 days</text><text x="41" y="597" fill="#f6faf5" font-size="21">after the trigger. The marrow responds</text><text x="41" y="624" fill="#f6faf5" font-size="21">with a HIGH reticulocyte count, not a low</text><text x="41" y="651" fill="#f6faf5" font-size="21">one.</text></g></svg>