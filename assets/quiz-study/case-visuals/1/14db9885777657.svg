<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>After de-escalation fails, a client assaults a staff member and the nurse applies restraints as an emergency measure before a provider is available. What must happen next?</title><desc>Restraint in an emergency may be initiated by the RN, but a provider order is required and a face-to-face evaluation must occur within 1 hour. Standing or PRN restraint orders are prohibited, and no charge nurse can authorize restraint for a shift.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Legal–Ethical Issues &amp; Grief</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">After de-escalation fails, a client</text><text x="41" y="198" fill="#f6faf5" font-size="21">assaults a staff member and the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">applies restraints as an emergency measure</text><text x="41" y="252" fill="#f6faf5" font-size="21">before a provider is available. What must</text><text x="41" y="279" fill="#f6faf5" font-size="21">happen next?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">A provider order must be obtained and a</text><text x="41" y="411" fill="#f6faf5" font-size="21">face-to-face evaluation completed within 1</text><text x="41" y="438" fill="#f6faf5" font-size="21">hour</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Restraint in an emergency may be initiated</text><text x="41" y="570" fill="#f6faf5" font-size="21">by the RN, but a provider order is</text><text x="41" y="597" fill="#f6faf5" font-size="21">required and a face-to-face evaluation</text><text x="41" y="624" fill="#f6faf5" font-size="21">must occur within 1 hour. Standing or PRN</text><text x="41" y="651" fill="#f6faf5" font-size="21">restraint orders are prohibited, and no</text><text x="41" y="678" fill="#f6faf5" font-size="21">charge nurse can authorize restraint for a</text><text x="41" y="705" fill="#f6faf5" font-size="21">shift.</text></g></svg>