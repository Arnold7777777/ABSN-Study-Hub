<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>The parent of a 6-year-old with a viral illness asks whether aspirin can be given for the child&#x27;s fever. Which response by the nurse is correct?</title><desc>Aspirin plus a viral illness equals Reye syndrome , and aspirin is never given to a child, with Kawasaki disease as the one exception. Option three is the trap because it reverses that rule — Kawasaki is the situation in which aspirin is used, not the one situation in which it is withheld; giving it with food or waiting until the child is older does not make it safe.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic &amp; Neuromuscular</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The parent of a 6-year-old with a viral</text><text x="41" y="198" fill="#f6faf5" font-size="21">illness asks whether aspirin can be given</text><text x="41" y="225" fill="#f6faf5" font-size="21">for the child&#x27;s fever. Which response by</text><text x="41" y="252" fill="#f6faf5" font-size="21">the nurse is correct?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;Aspirin during a viral illness is linked</text><text x="41" y="384" fill="#f6faf5" font-size="21">to Reye syndrome, so we avoid it.&quot;</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Aspirin plus a viral illness equals Reye</text><text x="41" y="516" fill="#f6faf5" font-size="21">syndrome , and aspirin is never given to a</text><text x="41" y="543" fill="#f6faf5" font-size="21">child, with Kawasaki disease as the one</text><text x="41" y="570" fill="#f6faf5" font-size="21">exception.</text></g></svg>