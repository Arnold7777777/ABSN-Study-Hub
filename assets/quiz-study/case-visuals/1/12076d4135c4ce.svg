<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is explaining the prodromal stage of infection to the parent of a child diagnosed with strep throat. Which statement by the parent indicates a NEED FOR FURTHER TEACHING?</title><desc>THE PRODROMAL STAGE IS WHEN THE CLIENT IS MOST CONTAGIOUS, even though symptoms are still vague — so saying the child can&#x27;t easily spread it is exactly wrong and needs correcting. The other three are all accurate. Know the four stages: INCUBATION (exposed, no symptoms) → PRODROMAL (vague symptoms, MOST contagious) → ILLNESS (specific symptoms) → CONVALESCENCE (recovery).</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Stages of Infection</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is explaining the prodromal stage</text><text x="41" y="198" fill="#f6faf5" font-size="21">of infection to the parent of a child</text><text x="41" y="225" fill="#f6faf5" font-size="21">diagnosed with strep throat. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">statement by the parent indicates a NEED</text><text x="41" y="279" fill="#f6faf5" font-size="21">FOR FURTHER TEACHING?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">“In this stage, my child cannot easily</text><text x="41" y="411" fill="#f6faf5" font-size="21">spread strep throat.”</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">THE PRODROMAL STAGE IS WHEN THE CLIENT IS</text><text x="41" y="543" fill="#f6faf5" font-size="21">MOST CONTAGIOUS, even though symptoms are</text><text x="41" y="570" fill="#f6faf5" font-size="21">still vague — so saying the child can&#x27;t</text><text x="41" y="597" fill="#f6faf5" font-size="21">easily spread it is exactly wrong and</text><text x="41" y="624" fill="#f6faf5" font-size="21">needs correcting.</text></g></svg>