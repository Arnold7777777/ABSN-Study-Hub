<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A nurse is caring for a client who has been taking buspirone for 2 weeks. The client reports a dry, sticky mouth. Which of the following is the nurse’s best response?</title><desc>Xerostomia (dry mouth) is an expected adverse effect of buspirone. It is managed, not treated as an emergency — sip water, sugarless gum or hard candy, good oral hygiene. Other expected effects: dizziness, headache, nausea, insomnia.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology:</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Benzodiazepines</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is caring for a client who has</text><text x="41" y="231" fill="#f6faf5" font-size="21">been taking buspirone for 2 weeks. The</text><text x="41" y="258" fill="#f6faf5" font-size="21">client reports a dry, sticky mouth. Which</text><text x="41" y="285" fill="#f6faf5" font-size="21">of the following is the nurse’s best</text><text x="41" y="312" fill="#f6faf5" font-size="21">response?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">“Xerostomia is an expected effect. Sip</text><text x="41" y="444" fill="#f6faf5" font-size="21">water and try sugarless gum.”</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Xerostomia (dry mouth) is an expected</text><text x="41" y="576" fill="#f6faf5" font-size="21">adverse effect of buspirone. It is</text><text x="41" y="603" fill="#f6faf5" font-size="21">managed, not treated as an emergency — sip</text><text x="41" y="630" fill="#f6faf5" font-size="21">water, sugarless gum or hard candy, good</text><text x="41" y="657" fill="#f6faf5" font-size="21">oral hygiene. Other expected effects:</text><text x="41" y="684" fill="#f6faf5" font-size="21">dizziness, headache, nausea, insomnia.</text></g></svg>