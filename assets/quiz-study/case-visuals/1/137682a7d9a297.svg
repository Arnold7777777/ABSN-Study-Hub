<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Karen, 16, fell while skiing and briefly lost consciousness; she is now alert and oriented. She has had an ORIF of a fractured right femur and casting of her right leg and arm, and is back from PACU awake and taking ice chips. Which of these provider orders should the nurse question? (Select all that apply.)</title><desc>After a loss of consciousness she needs neuro checks more often than every 4 hours . A fresh injury needs ice, not heat , with elevation to limit swelling. She is awake and tolerating ice chips, so clarify the NPO order so her diet can advance. The other orders fit her care.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Musculoskeletal</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Karen, 16, fell while skiing and briefly</text><text x="41" y="198" fill="#f6faf5" font-size="21">lost consciousness;</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Neurologic checks every 4 hours · Heat</text><text x="41" y="330" fill="#f6faf5" font-size="21">pack and elevate right lower extremity and</text><text x="41" y="357" fill="#f6faf5" font-size="21">right upper extremity · NPO</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">After a loss of consciousness she needs</text><text x="41" y="489" fill="#f6faf5" font-size="21">neuro checks more often than every 4 hours</text><text x="41" y="516" fill="#f6faf5" font-size="21">. A fresh injury needs ice, not heat ,</text><text x="41" y="543" fill="#f6faf5" font-size="21">with elevation to limit swelling. She is</text><text x="41" y="570" fill="#f6faf5" font-size="21">awake and tolerating ice chips, so clarify</text><text x="41" y="597" fill="#f6faf5" font-size="21">the NPO order so her diet can advance. The</text><text x="41" y="624" fill="#f6faf5" font-size="21">other orders fit her care.</text></g></svg>