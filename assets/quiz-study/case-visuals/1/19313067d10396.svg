<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A nurse is performing a focused assessment on a client with bronchiectasis. Which are the most prevalent signs and symptoms of this condition? Select all that apply.</title><desc>Characteristic symptoms of bronchiectasis include clubbing of the fingers, chronic cough, and production of purulent sputum in copious amounts. Radiating chest pain, along with additional clinical indicators, are more indicative of a cardiovascular condition. Wheezes on auscultation are common in clients with asthma. An increased AP diameter is noted in clients with chronic obstructive pulmonary disease.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 5 · General Respiratory</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is performing a focused assessment</text><text x="41" y="198" fill="#f6faf5" font-size="21">on a client with bronchiectasis. Which are</text><text x="41" y="225" fill="#f6faf5" font-size="21">the most prevalent signs and symptoms of</text><text x="41" y="252" fill="#f6faf5" font-size="21">this condition? Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Copious, purulent sputum</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Characteristic symptoms of bronchiectasis</text><text x="41" y="489" fill="#f6faf5" font-size="21">include clubbing of the fingers, chronic</text><text x="41" y="516" fill="#f6faf5" font-size="21">cough, and production of purulent sputum</text><text x="41" y="543" fill="#f6faf5" font-size="21">in copious amounts.</text></g></svg>