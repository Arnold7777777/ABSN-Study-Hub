<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>During an abdominal assessment of a healthy 2-year-old, which abdominal contour should the nurse expect?</title><desc>Toddlers normally have a protuberant abdomen because of weak abdominal muscles and lumbar lordosis. In an adult, a protuberant abdomen suggests ascites, obesity or late pregnancy, and a scaphoid one suggests wasting.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Abdominal assessment - toddler</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">contour</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">During an abdominal assessment of a</text><text x="41" y="231" fill="#f6faf5" font-size="21">healthy 2-year-old, which abdominal</text><text x="41" y="258" fill="#f6faf5" font-size="21">contour should the nurse expect?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Protuberant (pot-bellied)</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">Toddlers normally have a protuberant</text><text x="41" y="495" fill="#f6faf5" font-size="21">abdomen because of weak abdominal muscles</text><text x="41" y="522" fill="#f6faf5" font-size="21">and lumbar lordosis. In an adult, a</text><text x="41" y="549" fill="#f6faf5" font-size="21">protuberant abdomen suggests ascites,</text><text x="41" y="576" fill="#f6faf5" font-size="21">obesity or late pregnancy, and a scaphoid</text><text x="41" y="603" fill="#f6faf5" font-size="21">one suggests wasting.</text></g></svg>