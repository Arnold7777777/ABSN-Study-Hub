<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Four clients are being monitored for respiratory failure. Which one should the nurse assess FIRST?</title><desc>Lethargy, diaphoresis, and central cyanosis are LATE signs of respiratory failure and immediately precede respiratory arrest. The others show early or chronic compensated findings; accessory muscle use is worrisome but the client is still alert and moving air.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Acute Respiratory Failure</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Four clients are being monitored for</text><text x="41" y="198" fill="#f6faf5" font-size="21">respiratory failure. Which one should the</text><text x="41" y="225" fill="#f6faf5" font-size="21">nurse assess FIRST?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">A client who has become lethargic and</text><text x="41" y="357" fill="#f6faf5" font-size="21">diaphoretic with central cyanosis</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Lethargy, diaphoresis, and central</text><text x="41" y="489" fill="#f6faf5" font-size="21">cyanosis are LATE signs of respiratory</text><text x="41" y="516" fill="#f6faf5" font-size="21">failure and immediately precede</text><text x="41" y="543" fill="#f6faf5" font-size="21">respiratory arrest. The others show early</text><text x="41" y="570" fill="#f6faf5" font-size="21">or chronic compensated findings; accessory</text><text x="41" y="597" fill="#f6faf5" font-size="21">muscle use is worrisome but the client is</text><text x="41" y="624" fill="#f6faf5" font-size="21">still alert and moving air.</text></g></svg>