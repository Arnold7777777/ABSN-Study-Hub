<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>When should the nurse begin discharge teaching for a hospitalized client?</title><desc>Discharge planning and teaching start at admission so content can be delivered in small pieces, reinforced, and evaluated before the client leaves. Waiting for the discharge order is common practice but leaves no time for practice, questions, or return demonstration.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Discharge Teaching</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">When should the nurse begin discharge</text><text x="41" y="198" fill="#f6faf5" font-size="21">teaching for a hospitalized client?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">At the time of admission</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">Discharge planning and teaching start at</text><text x="41" y="435" fill="#f6faf5" font-size="21">admission so content can be delivered in</text><text x="41" y="462" fill="#f6faf5" font-size="21">small pieces, reinforced, and evaluated</text><text x="41" y="489" fill="#f6faf5" font-size="21">before the client leaves. Waiting for the</text><text x="41" y="516" fill="#f6faf5" font-size="21">discharge order is common practice but</text><text x="41" y="543" fill="#f6faf5" font-size="21">leaves no time for practice, questions, or</text><text x="41" y="570" fill="#f6faf5" font-size="21">return demonstration.</text></g></svg>