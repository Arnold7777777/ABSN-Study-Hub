<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A provider prescribes a pediatric client 10 mL of liquid acetaminophen every 6 hours at home. The nurse should teach the parent to give how many teaspoons per dose?</title><desc>1 TSP = 5 mL, so 10 ÷ 5 = 2 TEASPOONS. Always teach caregivers to use the ORAL SYRINGE or dosing cup that comes with the medication rather than a kitchen spoon, which varies widely in volume and causes real dosing errors in children.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Conversions</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A provider prescribes a pediatric client</text><text x="41" y="198" fill="#f6faf5" font-size="21">10 mL of liquid acetaminophen every 6</text><text x="41" y="225" fill="#f6faf5" font-size="21">hours at home. The nurse should teach the</text><text x="41" y="252" fill="#f6faf5" font-size="21">parent to give how many teaspoons per</text><text x="41" y="279" fill="#f6faf5" font-size="21">dose?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">2 teaspoons</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">1 TSP = 5 mL, so 10 ÷ 5 = 2 TEASPOONS.</text><text x="41" y="516" fill="#f6faf5" font-size="21">Always teach caregivers to use the ORAL</text><text x="41" y="543" fill="#f6faf5" font-size="21">SYRINGE or dosing cup that comes with the</text><text x="41" y="570" fill="#f6faf5" font-size="21">medication rather than a kitchen spoon,</text><text x="41" y="597" fill="#f6faf5" font-size="21">which varies widely in volume and causes</text><text x="41" y="624" fill="#f6faf5" font-size="21">real dosing errors in children.</text></g></svg>