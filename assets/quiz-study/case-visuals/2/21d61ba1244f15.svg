<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which laboratory result in a client who is 24 hr postpartum indicates infection? Normal: WBC can reach 20,000 to 25,000/mm³ after birth; hemoglobin 11 g/dL or higher; platelets 150,000 to 400,000/mm³</title><desc>An ESR above about 20 mm/hr suggests inflammation or infection. The trap is the white count : 12,000 to 25,000/mm3 is normal in the first postpartum week , so 18,000 tells you nothing. A hemoglobin of 10.5 is expected after the blood lost at birth.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which laboratory result in a client who is</text><text x="41" y="198" fill="#f6faf5" font-size="21">24 hr postpartum indicates infection?</text><text x="41" y="225" fill="#f6faf5" font-size="21">Normal: WBC can reach 20,000 to 25,000/mm³</text><text x="41" y="252" fill="#f6faf5" font-size="21">after birth; hemoglobin 11 g/dL or higher;</text><text x="41" y="279" fill="#f6faf5" font-size="21">platelets 150,000 to 400,000/mm³</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Erythrocyte sedimentation rate 26 mm/hr</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">An ESR above about 20 mm/hr suggests</text><text x="41" y="516" fill="#f6faf5" font-size="21">inflammation or infection. The trap is the</text><text x="41" y="543" fill="#f6faf5" font-size="21">white count : 12,000 to 25,000/mm3 is</text><text x="41" y="570" fill="#f6faf5" font-size="21">normal in the first postpartum week , so</text><text x="41" y="597" fill="#f6faf5" font-size="21">18,000 tells you nothing. A hemoglobin of</text><text x="41" y="624" fill="#f6faf5" font-size="21">10.5 is expected after the blood lost at</text><text x="41" y="651" fill="#f6faf5" font-size="21">birth.</text></g></svg>