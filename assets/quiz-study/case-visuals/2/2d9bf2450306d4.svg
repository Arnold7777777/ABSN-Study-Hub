<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="491" viewBox="0 0 640 491"><title>A client develops stridor , facial and lip swelling, a blood pressure of 78/44 and a heart rate of 130 during an intravenous antibiotic infusion.</title><desc>Stridor with facial swelling and hypotension during an infusion is anaphylaxis . Stop the infusion, give IM epinephrine in the anterolateral thigh , and elevate the legs to return volume centrally. Holding epinephrine for oxygen alone, or giving an oral antihistamine, both let the airway close. A beta blocker is the opposite of what she needs and would also blunt the epinephrine. Follow the blood pressure and the oxygen saturation , and stay alert for a biphasic reaction hours later.</desc><rect width="640" height="491" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Allergic, Inflammatory &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Immunologic Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client develops stridor , facial and lip</text><text x="41" y="231" fill="#f6faf5" font-size="21">swelling, a blood pressure of 78/44 and a</text><text x="41" y="258" fill="#f6faf5" font-size="21">heart rate of 130 during an intravenous</text><text x="41" y="285" fill="#f6faf5" font-size="21">antibiotic infusion.</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="390" fill="#f6faf5" font-size="21">Stridor with facial swelling and</text><text x="41" y="417" fill="#f6faf5" font-size="21">hypotension during an infusion is</text><text x="41" y="444" fill="#f6faf5" font-size="21">anaphylaxis .</text></g></svg>