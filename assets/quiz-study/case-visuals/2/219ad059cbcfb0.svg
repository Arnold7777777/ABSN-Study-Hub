<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is assisting with a lumbar puncture. Which position should the nurse help the client assume for the procedure?</title><desc>Curling into a C shape on the side widens the spaces between the vertebrae so the needle can be placed. Sitting is sometimes used with the client leaning forward over a table, but leaning backward closes the interspaces and makes access harder.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Lumbar Puncture</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is assisting with a lumbar</text><text x="41" y="198" fill="#f6faf5" font-size="21">puncture. Which position should the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">help the client assume for the procedure?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Side lying with the knees drawn up and the</text><text x="41" y="357" fill="#f6faf5" font-size="21">chin tucked down</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Curling into a C shape on the side widens</text><text x="41" y="489" fill="#f6faf5" font-size="21">the spaces between the vertebrae so the</text><text x="41" y="516" fill="#f6faf5" font-size="21">needle can be placed. Sitting is sometimes</text><text x="41" y="543" fill="#f6faf5" font-size="21">used with the client leaning forward over</text><text x="41" y="570" fill="#f6faf5" font-size="21">a table, but leaning backward closes the</text><text x="41" y="597" fill="#f6faf5" font-size="21">interspaces and makes access harder.</text></g></svg>