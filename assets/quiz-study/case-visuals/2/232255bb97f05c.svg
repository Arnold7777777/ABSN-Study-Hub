<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A nurse is planning nonpharmacologic comfort measures for a client with pain. Which measures are appropriate? Select all that apply.</title><desc>Distraction, imagery, gentle touch, and reducing environmental stimuli all lower perceived pain and are used alongside analgesics. Nonpharmacologic measures never replace prescribed analgesia against the client&#x27;s wishes, and massaging a limb with a suspected thrombus can dislodge the clot.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nonpharmacologic Measures</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is planning nonpharmacologic</text><text x="41" y="198" fill="#f6faf5" font-size="21">comfort measures for a client with pain.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which measures are appropriate? Select all</text><text x="41" y="252" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Music through earphones · Guided imagery ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Repositioning with gentle massage of tense</text><text x="41" y="411" fill="#f6faf5" font-size="21">muscles · A quiet, dimly lit room with</text><text x="41" y="438" fill="#f6faf5" font-size="21">reduced stimulation</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Distraction, imagery, gentle touch, and</text><text x="41" y="570" fill="#f6faf5" font-size="21">reducing environmental stimuli all lower</text><text x="41" y="597" fill="#f6faf5" font-size="21">perceived pain and are used alongside</text><text x="41" y="624" fill="#f6faf5" font-size="21">analgesics. Nonpharmacologic measures</text><text x="41" y="651" fill="#f6faf5" font-size="21">never replace prescribed analgesia against</text><text x="41" y="678" fill="#f6faf5" font-size="21">the client&#x27;s wishes, and massaging a limb</text><text x="41" y="705" fill="#f6faf5" font-size="21">with a suspected thrombus can dislodge the</text><text x="41" y="732" fill="#f6faf5" font-size="21">clot.</text></g></svg>