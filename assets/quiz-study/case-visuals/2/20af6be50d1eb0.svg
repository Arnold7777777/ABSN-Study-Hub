<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is caring for an older adult client who has been immobile and has not had a formed bowel movement in 6 days. The client now has frequent small amounts of liquid brown stool seeping onto the linens and reports abdominal cramping and rectal pressure. Which of the following actions should the nurse take first?</title><desc>LIQUID STOOL SEEPING AROUND A HARD MASS AFTER SEVERAL DAYS WITHOUT A BOWEL MOVEMENT IS OVERFLOW DIARRHEA FROM A FECAL IMPACTION, and a digital rectal examination confirms it. GIVING AN ANTIDIARRHEAL WOULD WORSEN THE IMPACTION and could lead to obstruction or perforation. Fluid and fiber are appropriate for long-term prevention but will not relieve an existing impaction.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Bowel Elimination</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for an older adult</text><text x="41" y="198" fill="#f6faf5" font-size="21">client who has been immobile and has not</text><text x="41" y="225" fill="#f6faf5" font-size="21">had a formed bowel movement in 6 days.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Perform a digital rectal examination to</text><text x="41" y="357" fill="#f6faf5" font-size="21">assess for impaction</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">LIQUID STOOL SEEPING AROUND A HARD MASS</text><text x="41" y="489" fill="#f6faf5" font-size="21">AFTER SEVERAL DAYS WITHOUT A BOWEL</text><text x="41" y="516" fill="#f6faf5" font-size="21">MOVEMENT IS OVERFLOW DIARRHEA FROM A FECAL</text><text x="41" y="543" fill="#f6faf5" font-size="21">IMPACTION, and a digital rectal</text><text x="41" y="570" fill="#f6faf5" font-size="21">examination confirms it.</text></g></svg>