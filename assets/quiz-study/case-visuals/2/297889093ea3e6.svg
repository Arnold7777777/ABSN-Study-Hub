<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which cranial nerve does the nurse test by asking the client to say “ahh”?</title><desc>CN X, the vagus . Useful neighbours: IX glossopharyngeal - taste at the back of the tongue and the gag reflex, tested with IX and X together; VII facial - smile, frown, close the eyes; XI spinal accessory - shrug and turn the head against resistance; XII hypoglossal - stick out the tongue. III, IV and VI all move the eye, which is why they are tested together by following a finger.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which cranial nerve does the nurse test by</text><text x="41" y="198" fill="#f6faf5" font-size="21">asking the client to say “ahh”?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">The vagus nerve, CN X</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">CN X, the vagus . Useful neighbours: IX</text><text x="41" y="435" fill="#f6faf5" font-size="21">glossopharyngeal - taste at the back of</text><text x="41" y="462" fill="#f6faf5" font-size="21">the tongue and the gag reflex, tested with</text><text x="41" y="489" fill="#f6faf5" font-size="21">IX and X together; VII facial - smile,</text><text x="41" y="516" fill="#f6faf5" font-size="21">frown, close the eyes; XI spinal accessory</text><text x="41" y="543" fill="#f6faf5" font-size="21">- shrug and turn the head against</text><text x="41" y="570" fill="#f6faf5" font-size="21">resistance; XII hypoglossal - stick out</text><text x="41" y="597" fill="#f6faf5" font-size="21">the tongue. III, IV and…</text></g></svg>