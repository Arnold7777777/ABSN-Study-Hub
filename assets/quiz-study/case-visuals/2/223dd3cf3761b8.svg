<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse is reviewing antepartum laboratory results. Which result should be reported to the provider? Normal: hemoglobin 11 g/dL or higher, hematocrit 33% or higher; WBC 5,000 to 15,000/mm³ in pregnancy; platelets 150,000 to 400,000/mm³</title><desc>Plasma volume rises more than red cell mass in pregnancy, so some dilution is expected - but a hematocrit below about 32 to 33% is anemia and is followed up, usually as iron deficiency. A white count up to around 15,000 is normal in pregnancy, and the hemoglobin and platelets here are fine.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is reviewing antepartum laboratory</text><text x="41" y="198" fill="#f6faf5" font-size="21">results.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Hematocrit 31%</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">Plasma volume rises more than red cell</text><text x="41" y="435" fill="#f6faf5" font-size="21">mass in pregnancy, so some dilution is</text><text x="41" y="462" fill="#f6faf5" font-size="21">expected - but a hematocrit below about 32</text><text x="41" y="489" fill="#f6faf5" font-size="21">to 33% is anemia and is followed up,</text><text x="41" y="516" fill="#f6faf5" font-size="21">usually as iron deficiency. A white count</text><text x="41" y="543" fill="#f6faf5" font-size="21">up to around 15,000 is normal in</text><text x="41" y="570" fill="#f6faf5" font-size="21">pregnancy, and the hemoglobin and</text><text x="41" y="597" fill="#f6faf5" font-size="21">platelets here are fine.</text></g></svg>