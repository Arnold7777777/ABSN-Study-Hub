<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>Medical unit, 1500 - Which findings are cues of an upper gastrointestinal bleed?</title><desc>One bleed is followed from the first coffee-ground emesis through hemodynamic collapse to recovery, showing how the priority shifts from identifying the source, to replacing volume, to judging perfusion.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Upper Gastrointestinal Bleed</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Medical unit, 1500 - Which findings are</text><text x="41" y="198" fill="#f6faf5" font-size="21">cues of an upper gastrointestinal bleed?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="222" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">One bleed is followed from the first</text><text x="41" y="330" fill="#f6faf5" font-size="21">coffee-ground emesis through hemodynamic</text><text x="41" y="357" fill="#f6faf5" font-size="21">collapse to recovery, showing how the</text><text x="41" y="384" fill="#f6faf5" font-size="21">priority shifts from identifying the</text><text x="41" y="411" fill="#f6faf5" font-size="21">source, to replacing volume, to judging</text><text x="41" y="438" fill="#f6faf5" font-size="21">perfusion.</text></g></svg>