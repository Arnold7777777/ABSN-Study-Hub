<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A client who received a kidney transplant is discharged on cyclosporine. Which statement indicates a need for further teaching?</title><desc>Grapefruit juice blocks the enzyme that breaks cyclosporine down and can push levels into the toxic, kidney-damaging range. Lifelong use, the same time every day and regular drug-level and kidney-function labs are all correct.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Allergic, Inflammatory &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Immunologic Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client who received a kidney transplant</text><text x="41" y="231" fill="#f6faf5" font-size="21">is discharged on cyclosporine. Which</text><text x="41" y="258" fill="#f6faf5" font-size="21">statement indicates a need for further</text><text x="41" y="285" fill="#f6faf5" font-size="21">teaching?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">&quot;I will take it with my morning glass of</text><text x="41" y="417" fill="#f6faf5" font-size="21">grapefruit juice.&quot;</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Grapefruit juice blocks the enzyme that</text><text x="41" y="549" fill="#f6faf5" font-size="21">breaks cyclosporine down and can push</text><text x="41" y="576" fill="#f6faf5" font-size="21">levels into the toxic, kidney-damaging</text><text x="41" y="603" fill="#f6faf5" font-size="21">range. Lifelong use, the same time every</text><text x="41" y="630" fill="#f6faf5" font-size="21">day and regular drug-level and kidney-</text><text x="41" y="657" fill="#f6faf5" font-size="21">function labs are all correct.</text></g></svg>