<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client has been on the same antipsychotic for 4 years and now shows lip smacking, tongue protrusion, and chewing movements. Which action does the nurse take?</title><desc>Tardive dyskinesia — months to years of exposure, involuntary orofacial movements — is often irreversible , so it must be reported at once so the drug can be stopped or switched (often to clozapine); valbenazine or deutetrabenazine may be added. Anticholinergics like benztropine do not help TD and can worsen it. It does not resolve on its own, and raising the dose makes it worse. Screen with AIMS every 3–6 months.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology: EPS Treatment</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has been on the same</text><text x="41" y="198" fill="#f6faf5" font-size="21">antipsychotic for 4 years and now shows</text><text x="41" y="225" fill="#f6faf5" font-size="21">lip smacking, tongue protrusion, and</text><text x="41" y="252" fill="#f6faf5" font-size="21">chewing movements. Which action does the</text><text x="41" y="279" fill="#f6faf5" font-size="21">nurse take?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Notify the provider — this may be tardive</text><text x="41" y="411" fill="#f6faf5" font-size="21">dyskinesia and the drug may be stopped or</text><text x="41" y="438" fill="#f6faf5" font-size="21">switched</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Tardive dyskinesia — months to years of</text><text x="41" y="570" fill="#f6faf5" font-size="21">exposure, involuntary orofacial movements</text><text x="41" y="597" fill="#f6faf5" font-size="21">— is often irreversible , so it must be</text><text x="41" y="624" fill="#f6faf5" font-size="21">reported at once so the drug can be</text><text x="41" y="651" fill="#f6faf5" font-size="21">stopped or switched (often to clozapine);</text></g></svg>