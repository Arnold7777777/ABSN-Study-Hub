<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is writing outcomes for a client with a new colostomy. Which outcomes are appropriate to include?</title><desc>Appropriate outcomes describe observable client achievements : return demonstration, intact skin, a viable stoma, and stated warning signs. Full acceptance of an altered body image in 24 hours is an unrealistic time frame for a grief process, and measuring the stoma is a nursing action rather than a client outcome.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">New Colostomy Plan</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is writing outcomes for a client</text><text x="41" y="198" fill="#f6faf5" font-size="21">with a new colostomy. Which outcomes are</text><text x="41" y="225" fill="#f6faf5" font-size="21">appropriate to include?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The client will demonstrate emptying the</text><text x="41" y="357" fill="#f6faf5" font-size="21">pouch independently before discharge · The</text><text x="41" y="384" fill="#f6faf5" font-size="21">client&#x27;s peristomal skin will remain</text><text x="41" y="411" fill="#f6faf5" font-size="21">intact and free of excoriation · The</text><text x="41" y="438" fill="#f6faf5" font-size="21">client&#x27;s stoma will remain…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Appropriate outcomes describe observable</text><text x="41" y="570" fill="#f6faf5" font-size="21">client achievements : return</text><text x="41" y="597" fill="#f6faf5" font-size="21">demonstration, intact skin, a viable</text><text x="41" y="624" fill="#f6faf5" font-size="21">stoma, and stated warning signs.</text></g></svg>