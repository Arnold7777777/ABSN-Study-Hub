<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A client 1 day after abdominal surgery reports incisional pain at 8 of 10. Which goal is most appropriate?</title><desc>A functional target with a time frame is realistic after abdominal surgery and lets the nurse judge whether the plan is working. The most tempting wrong answer is being free of all pain by the end of the shift, which sounds compassionate but is an unrealistic target on the first postoperative day and pushes toward oversedation. Medicating on schedule is an intervention, and tolerating pain without medication is not a therapeutic goal.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Postoperative Pain Goals</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client 1 day after abdominal surgery</text><text x="41" y="198" fill="#f6faf5" font-size="21">reports incisional pain at 8 of 10. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">goal is most appropriate?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The client will report pain at 3 of 10 or</text><text x="41" y="357" fill="#f6faf5" font-size="21">less within 1 hour of receiving analgesia</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">A functional target with a time frame is</text><text x="41" y="489" fill="#f6faf5" font-size="21">realistic after abdominal surgery and lets</text><text x="41" y="516" fill="#f6faf5" font-size="21">the nurse judge whether the plan is</text><text x="41" y="543" fill="#f6faf5" font-size="21">working.</text></g></svg>