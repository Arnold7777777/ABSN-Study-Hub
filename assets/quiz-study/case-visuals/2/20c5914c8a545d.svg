<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse notes that a client&#x27;s SpO2 has fallen from 96 percent to 88 percent and the client is now restless and using accessory muscles. Which action should the nurse take first?</title><desc>The client has objective signs of increased work of breathing along with the low reading, so this is real hypoxemia and breathing takes priority over further investigation. Repositioning the probe is the right first move only when the number is low but the client looks and sounds fine, which is not the case here.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Pulse Oximetry</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse notes that a client&#x27;s SpO2 has</text><text x="41" y="198" fill="#f6faf5" font-size="21">fallen from 96 percent to 88 percent and</text><text x="41" y="225" fill="#f6faf5" font-size="21">the client is now restless and using</text><text x="41" y="252" fill="#f6faf5" font-size="21">accessory muscles. Which action should the</text><text x="41" y="279" fill="#f6faf5" font-size="21">nurse take first?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Raise the head of the bed and apply oxygen</text><text x="41" y="411" fill="#f6faf5" font-size="21">as prescribed</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The client has objective signs of</text><text x="41" y="543" fill="#f6faf5" font-size="21">increased work of breathing along with the</text><text x="41" y="570" fill="#f6faf5" font-size="21">low reading, so this is real hypoxemia and</text><text x="41" y="597" fill="#f6faf5" font-size="21">breathing takes priority over further</text><text x="41" y="624" fill="#f6faf5" font-size="21">investigation.</text></g></svg>