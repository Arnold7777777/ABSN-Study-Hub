<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Which principles define atraumatic care? Select all that apply.</title><desc>Atraumatic care rests on three ideas: prevent or minimize separation, promote a sense of control, and prevent or minimize bodily injury and pain — delivered through preparation, honest communication and family involvement. Keeping a child in bed for everything does the opposite: it removes control and turns the bed into a place where painful things happen.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which principles define atraumatic care?</text><text x="41" y="198" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Minimize separation of the child from the</text><text x="41" y="330" fill="#f6faf5" font-size="21">family · Promote a sense of control for</text><text x="41" y="357" fill="#f6faf5" font-size="21">the child and family · Minimize or prevent</text><text x="41" y="384" fill="#f6faf5" font-size="21">physical injury and pain · Prepare the</text><text x="41" y="411" fill="#f6faf5" font-size="21">child and family with…</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Atraumatic care rests on three ideas:</text><text x="41" y="543" fill="#f6faf5" font-size="21">prevent or minimize separation, promote a</text><text x="41" y="570" fill="#f6faf5" font-size="21">sense of control, and prevent or minimize</text><text x="41" y="597" fill="#f6faf5" font-size="21">bodily injury and pain — delivered through</text><text x="41" y="624" fill="#f6faf5" font-size="21">preparation, honest communication and</text><text x="41" y="651" fill="#f6faf5" font-size="21">family involvement.</text></g></svg>