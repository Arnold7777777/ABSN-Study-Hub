<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client with generalized anxiety disorder states, &#x27;I only take my buspirone when I feel really nervous.&#x27; Which response is best?</title><desc>Buspirone must be taken consistently every day to build a therapeutic effect; it does not provide immediate relief, so PRN use indicates the client needs re-teaching.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anxiety: Severe Anxiety</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with generalized anxiety disorder</text><text x="41" y="198" fill="#f6faf5" font-size="21">states, &#x27;I only take my buspirone when I</text><text x="41" y="225" fill="#f6faf5" font-size="21">feel really nervous.&#x27; Which response is</text><text x="41" y="252" fill="#f6faf5" font-size="21">best?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Buspirone works only when taken every day</text><text x="41" y="384" fill="#f6faf5" font-size="21">as prescribed</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Buspirone must be taken consistently every</text><text x="41" y="516" fill="#f6faf5" font-size="21">day to build a therapeutic effect; it does</text><text x="41" y="543" fill="#f6faf5" font-size="21">not provide immediate relief, so PRN use</text><text x="41" y="570" fill="#f6faf5" font-size="21">indicates the client needs re-teaching.</text></g></svg>