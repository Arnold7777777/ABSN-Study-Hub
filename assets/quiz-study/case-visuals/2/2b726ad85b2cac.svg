<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A client says his provider told him he is at risk for anaphylaxis with amoxicillin and he does not understand what that means. Which response by the nurse is appropriate?</title><desc>Anaphylaxis is a severe, rapid, life-threatening hypersensitivity reaction. A predictable effect at a normal dose is a side effect . Symptoms on stopping a drug are withdrawal . An unusual reaction from an inherited difference in metabolism is an idiosyncratic reaction. Only one of these can kill him in minutes.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Medication Reactions</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client says his provider told him he is</text><text x="41" y="198" fill="#f6faf5" font-size="21">at risk for anaphylaxis with amoxicillin</text><text x="41" y="225" fill="#f6faf5" font-size="21">and he does not understand what that</text><text x="41" y="252" fill="#f6faf5" font-size="21">means. Which response by the nurse is</text><text x="41" y="279" fill="#f6faf5" font-size="21">appropriate?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">“It is a severe, life-threatening allergic</text><text x="41" y="411" fill="#f6faf5" font-size="21">reaction.”</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Anaphylaxis is a severe, rapid, life-</text><text x="41" y="543" fill="#f6faf5" font-size="21">threatening hypersensitivity reaction.</text></g></svg>