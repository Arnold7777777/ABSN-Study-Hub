<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client has been orally intubated for 18 days. Which outcome should the nurse anticipate discussing with the team?</title><desc>Endotracheal tubes should stay in no longer than 14-21 days; beyond that the risk of vocal cord damage and tracheal injury rises, so a tracheostomy is created. Leaving the tube for 6 weeks can permanently paralyze the vocal cords.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Endotracheal Tube</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has been orally intubated for 18</text><text x="41" y="198" fill="#f6faf5" font-size="21">days. Which outcome should the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">anticipate discussing with the team?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Placement of a tracheostomy if the airway</text><text x="41" y="357" fill="#f6faf5" font-size="21">is still needed</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Endotracheal tubes should stay in no</text><text x="41" y="489" fill="#f6faf5" font-size="21">longer than 14-21 days; beyond that the</text><text x="41" y="516" fill="#f6faf5" font-size="21">risk of vocal cord damage and tracheal</text><text x="41" y="543" fill="#f6faf5" font-size="21">injury rises, so a tracheostomy is</text><text x="41" y="570" fill="#f6faf5" font-size="21">created. Leaving the tube for 6 weeks can</text><text x="41" y="597" fill="#f6faf5" font-size="21">permanently paralyze the vocal cords.</text></g></svg>