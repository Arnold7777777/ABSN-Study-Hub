<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client received intramuscular benztropine for an acute dystonic reaction. Which finding indicates the medication had the desired effect?</title><desc>Benztropine restores the dopamine-acetylcholine balance, so resolution of the muscle spasm with a return to normal swallowing is the therapeutic endpoint, and it confirms the airway is no longer threatened. Drowsiness is the tempting choice because the client looks calmer, but sedation is an anticholinergic side effect rather than evidence the dystonia resolved. Dry mouth is also a side effect, and the blood pressure change reflects reduced distress, not muscle relaxation.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Psychopharmacology: EPS Treatment</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client received intramuscular</text><text x="41" y="198" fill="#f6faf5" font-size="21">benztropine for an acute dystonic</text><text x="41" y="225" fill="#f6faf5" font-size="21">reaction. Which finding indicates the</text><text x="41" y="252" fill="#f6faf5" font-size="21">medication had the desired effect?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">The client&#x27;s neck has returned to midline</text><text x="41" y="384" fill="#f6faf5" font-size="21">and he is swallowing his secretions</text><text x="41" y="411" fill="#f6faf5" font-size="21">without difficulty</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Benztropine restores the dopamine-</text><text x="41" y="543" fill="#f6faf5" font-size="21">acetylcholine balance, so resolution of</text><text x="41" y="570" fill="#f6faf5" font-size="21">the muscle spasm with a return to normal</text><text x="41" y="597" fill="#f6faf5" font-size="21">swallowing is the therapeutic endpoint,</text><text x="41" y="624" fill="#f6faf5" font-size="21">and it confirms the airway is no longer</text><text x="41" y="651" fill="#f6faf5" font-size="21">threatened.</text></g></svg>