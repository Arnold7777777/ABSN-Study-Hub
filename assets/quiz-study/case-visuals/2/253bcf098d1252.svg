<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client with a spontaneous pneumothorax has a chest tube on a closed water-seal system. The nurse notes no bubbling or tidaling and increasing shortness of breath. Which are APPROPRIATE interventions? (SATA)</title><desc>No tidaling/bubbling with worsening SOB suggests obstruction or developing tension pneumothorax: check tubing for kinks, notify the provider, assess for tension pneumothorax. Do NOT dismiss it as expected, lower the system to the floor, or prioritize ambulation in acute distress.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with a spontaneous pneumothorax</text><text x="41" y="198" fill="#f6faf5" font-size="21">has a chest tube on a closed water-seal</text><text x="41" y="225" fill="#f6faf5" font-size="21">system.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Check the tubing for kinks or occlusions ·</text><text x="41" y="357" fill="#f6faf5" font-size="21">Notify the healthcare provider · Assess</text><text x="41" y="384" fill="#f6faf5" font-size="21">for signs of tension pneumothorax</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">No tidaling/bubbling with worsening SOB</text><text x="41" y="516" fill="#f6faf5" font-size="21">suggests obstruction or developing tension</text><text x="41" y="543" fill="#f6faf5" font-size="21">pneumothorax: check tubing for kinks,</text><text x="41" y="570" fill="#f6faf5" font-size="21">notify the provider, assess for tension</text><text x="41" y="597" fill="#f6faf5" font-size="21">pneumothorax. Do NOT dismiss it as</text><text x="41" y="624" fill="#f6faf5" font-size="21">expected, lower the system to the floor,</text><text x="41" y="651" fill="#f6faf5" font-size="21">or prioritize ambulation in acute</text><text x="41" y="678" fill="#f6faf5" font-size="21">distress.</text></g></svg>