<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which findings are warning signs of cancer? Select all that apply.</title><desc>CAUTION UP : C hange in bowel or bladder habits, A lesion that does not heal, U nusual bleeding or discharge, T hickening or lump, I ndigestion or difficulty swallowing, O bvious change in a wart or mole, N agging cough or hoarseness, U nexplained weight loss, P ernicious anemia. A bruise that resolves normally is not a warning sign.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which findings are warning signs of</text><text x="41" y="198" fill="#f6faf5" font-size="21">cancer? Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Indigestion or difficulty swallowing · A</text><text x="41" y="330" fill="#f6faf5" font-size="21">sore that does not heal · A change in</text><text x="41" y="357" fill="#f6faf5" font-size="21">bowel or bladder habit · Unusual bleeding</text><text x="41" y="384" fill="#f6faf5" font-size="21">or discharge · A thickening or lump</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">CAUTION UP : C hange in bowel or bladder</text><text x="41" y="516" fill="#f6faf5" font-size="21">habits, A lesion that does not heal, U</text><text x="41" y="543" fill="#f6faf5" font-size="21">nusual bleeding or discharge, T hickening</text><text x="41" y="570" fill="#f6faf5" font-size="21">or lump, I ndigestion or difficulty</text><text x="41" y="597" fill="#f6faf5" font-size="21">swallowing, O bvious change in a wart or</text><text x="41" y="624" fill="#f6faf5" font-size="21">mole, N agging cough or hoarseness, U</text><text x="41" y="651" fill="#f6faf5" font-size="21">nexplained weight loss, P ernicious</text><text x="41" y="678" fill="#f6faf5" font-size="21">anemia.</text></g></svg>