<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="539" viewBox="0 0 640 539"><title>Match each personality disorder to its hallmark presentation.</title><desc>Sort by cluster first: A = weird (paranoid, schizoid, schizotypal) · B = wild (borderline, antisocial, histrionic, narcissistic) · C = worried (avoidant, dependent, OCPD). Then pick the motive : borderline fears abandonment, antisocial wants gain, histrionic wants attention, narcissistic wants admiration.</desc><rect width="640" height="539" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match each personality disorder to its</text><text x="41" y="198" fill="#f6faf5" font-size="21">hallmark presentation.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="276" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">Sort by cluster first: A = weird</text><text x="41" y="330" fill="#f6faf5" font-size="21">(paranoid, schizoid, schizotypal) · B =</text><text x="41" y="357" fill="#f6faf5" font-size="21">wild (borderline, antisocial, histrionic,</text><text x="41" y="384" fill="#f6faf5" font-size="21">narcissistic) · C = worried (avoidant,</text><text x="41" y="411" fill="#f6faf5" font-size="21">dependent, OCPD). Then pick the motive :</text><text x="41" y="438" fill="#f6faf5" font-size="21">borderline fears abandonment, antisocial</text><text x="41" y="465" fill="#f6faf5" font-size="21">wants gain, histrionic wants attention,</text><text x="41" y="492" fill="#f6faf5" font-size="21">narcissistic wants admiration.</text></g></svg>