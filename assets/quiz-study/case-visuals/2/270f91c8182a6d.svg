<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A fire breaks out in a client&#x27;s room. In what order does the nurse act?</title><desc>RACE: R escue anyone in immediate danger, A larm, C onfine by closing doors and windows, then E xtinguish or evacuate. In evacuation, ambulatory clients go first, then those needing assistance, then the non-ambulatory. For the extinguisher itself: PASS — pull, aim, squeeze, sweep.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Disaster, Mass Casualty &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Emergency Nursing</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A fire breaks out in a client&#x27;s room. In</text><text x="41" y="231" fill="#f6faf5" font-size="21">what order does the nurse act?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Rescue those in immediate danger, alarm,</text><text x="41" y="363" fill="#f6faf5" font-size="21">confine, extinguish</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">RACE: R escue anyone in immediate danger,</text><text x="41" y="495" fill="#f6faf5" font-size="21">A larm, C onfine by closing doors and</text><text x="41" y="522" fill="#f6faf5" font-size="21">windows, then E xtinguish or evacuate. In</text><text x="41" y="549" fill="#f6faf5" font-size="21">evacuation, ambulatory clients go first,</text><text x="41" y="576" fill="#f6faf5" font-size="21">then those needing assistance, then the</text><text x="41" y="603" fill="#f6faf5" font-size="21">non-ambulatory. For the extinguisher</text><text x="41" y="630" fill="#f6faf5" font-size="21">itself: PASS — pull, aim, squeeze, sweep.</text></g></svg>