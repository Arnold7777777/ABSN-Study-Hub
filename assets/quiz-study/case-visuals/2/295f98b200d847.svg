<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A veteran with posttraumatic stress disorder has attended trauma-focused therapy for 3 months. Which finding indicates that the treatment has been effective?</title><desc>Measurable reduction in symptom frequency plus restored role function is the standard of effectiveness in PTSD treatment. Loss of all memory of the event is the tempting answer because it sounds like relief, but dissociative amnesia is a symptom of trauma, not a treatment goal; the aim is to tolerate the memory without overwhelming arousal. Withdrawing from family is avoidance, and nightly alcohol is self-medication that worsens sleep architecture and PTSD.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Trauma: PTSD</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A veteran with posttraumatic stress</text><text x="41" y="198" fill="#f6faf5" font-size="21">disorder has attended trauma-focused</text><text x="41" y="225" fill="#f6faf5" font-size="21">therapy for 3 months. Which finding</text><text x="41" y="252" fill="#f6faf5" font-size="21">indicates that the treatment has been</text><text x="41" y="279" fill="#f6faf5" font-size="21">effective?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">The client reports nightmares about once a</text><text x="41" y="411" fill="#f6faf5" font-size="21">week rather than five nights a week and</text><text x="41" y="438" fill="#f6faf5" font-size="21">has returned to his part-time job</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Measurable reduction in symptom frequency</text><text x="41" y="570" fill="#f6faf5" font-size="21">plus restored role function is the</text><text x="41" y="597" fill="#f6faf5" font-size="21">standard of effectiveness in PTSD</text><text x="41" y="624" fill="#f6faf5" font-size="21">treatment.</text></g></svg>