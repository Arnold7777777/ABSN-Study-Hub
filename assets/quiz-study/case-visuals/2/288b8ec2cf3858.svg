<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is caring for a client recently diagnosed with aplastic anemia. Which interventions should the nurse include in the plan of care? Select all that apply.</title><desc>Aplastic anemia shuts down all three bone-marrow cell lines, so the client needs infection precautions (low WBCs), transfusions (low RBCs) and bleeding precautions (low platelets) . Iron does not help because the marrow is not producing, oxygen does not fix low carrying capacity, and ambulation will not build stamina while hemoglobin is very low.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Aplastic anemia</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client recently</text><text x="41" y="198" fill="#f6faf5" font-size="21">diagnosed with aplastic anemia. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">interventions should the nurse include in</text><text x="41" y="252" fill="#f6faf5" font-size="21">the plan of care? Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Encourage frequent hand washing and use of</text><text x="41" y="384" fill="#f6faf5" font-size="21">a mask. · Prepare the client for blood</text><text x="41" y="411" fill="#f6faf5" font-size="21">transfusions as prescribed. · Monitor for</text><text x="41" y="438" fill="#f6faf5" font-size="21">signs of bleeding and bruising.</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Aplastic anemia shuts down all three bone-</text><text x="41" y="570" fill="#f6faf5" font-size="21">marrow cell lines, so the client needs</text><text x="41" y="597" fill="#f6faf5" font-size="21">infection precautions (low WBCs),</text><text x="41" y="624" fill="#f6faf5" font-size="21">transfusions (low RBCs) and bleeding</text><text x="41" y="651" fill="#f6faf5" font-size="21">precautions (low platelets) .</text></g></svg>