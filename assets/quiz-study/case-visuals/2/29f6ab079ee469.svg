<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which of the following is a legal responsibility of the nurse in medication administration?</title><desc>Reporting an error is a legal duty , discharged according to facility policy, and it comes after the client has been assessed. Prescribing and changing a regimen are outside the registered nurse&#x27;s scope. Administering medication is a nursing judgment and is not delegated to assistive personnel.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Medication Errors</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which of the following is a legal</text><text x="41" y="198" fill="#f6faf5" font-size="21">responsibility of the nurse in medication</text><text x="41" y="225" fill="#f6faf5" font-size="21">administration?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Reporting medication errors</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Reporting an error is a legal duty ,</text><text x="41" y="462" fill="#f6faf5" font-size="21">discharged according to facility policy,</text><text x="41" y="489" fill="#f6faf5" font-size="21">and it comes after the client has been</text><text x="41" y="516" fill="#f6faf5" font-size="21">assessed. Prescribing and changing a</text><text x="41" y="543" fill="#f6faf5" font-size="21">regimen are outside the registered nurse&#x27;s</text><text x="41" y="570" fill="#f6faf5" font-size="21">scope. Administering medication is a</text><text x="41" y="597" fill="#f6faf5" font-size="21">nursing judgment and is not delegated to</text><text x="41" y="624" fill="#f6faf5" font-size="21">assistive personnel.</text></g></svg>