<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A client has cerumen impaction. Which action by the nurse is appropriate?</title><desc>Never irrigate an ear that may have a perforated drum — fluid enters the middle ear. Inspect first, use body-temperature solution, and direct the flow at the canal wall rather than the drum. Swabs make impaction worse.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Disorders - Eye &amp; Ear</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has cerumen impaction. Which</text><text x="41" y="198" fill="#f6faf5" font-size="21">action by the nurse is appropriate?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Inspect the drum first, and do not</text><text x="41" y="330" fill="#f6faf5" font-size="21">irrigate if it may be perforated</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Never irrigate an ear that may have a</text><text x="41" y="462" fill="#f6faf5" font-size="21">perforated drum — fluid enters the middle</text><text x="41" y="489" fill="#f6faf5" font-size="21">ear. Inspect first, use body-temperature</text><text x="41" y="516" fill="#f6faf5" font-size="21">solution, and direct the flow at the canal</text><text x="41" y="543" fill="#f6faf5" font-size="21">wall rather than the drum. Swabs make</text><text x="41" y="570" fill="#f6faf5" font-size="21">impaction worse.</text></g></svg>