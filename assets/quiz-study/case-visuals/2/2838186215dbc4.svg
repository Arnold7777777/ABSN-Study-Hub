<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>An infant is admitted for cleft palate repair. Which actions should the nurse include in the plan of care? Select all that apply.</title><desc>Post-op care protects the suture line: elbow restraints and nothing rigid in the mouth , with upright feeding and frequent burping to manage feeding difficulty. The 2-3 month timing is the trap — that is when the lip is repaired, while the palate is repaired at 6-12 months before speech develops, and a cleft palate usually prevents an effective breastfeeding seal.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Gastrointestinal</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An infant is admitted for cleft palate</text><text x="41" y="198" fill="#f6faf5" font-size="21">repair. Which actions should the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">include in the plan of care? Select all</text><text x="41" y="252" fill="#f6faf5" font-size="21">that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Apply elbow restraints after surgery ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Keep rigid objects out of the infant&#x27;s</text><text x="41" y="411" fill="#f6faf5" font-size="21">mouth after surgery · Feed the infant</text><text x="41" y="438" fill="#f6faf5" font-size="21">upright and burp frequently</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Post-op care protects the suture line:</text><text x="41" y="570" fill="#f6faf5" font-size="21">elbow restraints and nothing rigid in the</text><text x="41" y="597" fill="#f6faf5" font-size="21">mouth , with upright feeding and frequent</text><text x="41" y="624" fill="#f6faf5" font-size="21">burping to manage feeding difficulty.</text></g></svg>