<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is planning care for a client with a new sigmoid colostomy. Which outcome is most appropriate before discharge?</title><desc>Independent pouch care is observable, achievable before discharge, and directly determines whether the client can manage at home. The most tempting wrong answer is that the client will accept the colostomy: adjustment matters, but acceptance cannot be measured and does not occur on a discharge timeline. The first option describes the nurse&#x27;s teaching activity, and a dusky stoma indicates ischemia, which is a complication rather than a goal.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Ostomy Planning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is planning care for a client with</text><text x="41" y="198" fill="#f6faf5" font-size="21">a new sigmoid colostomy. Which outcome is</text><text x="41" y="225" fill="#f6faf5" font-size="21">most appropriate before discharge?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The client will empty and change the</text><text x="41" y="357" fill="#f6faf5" font-size="21">ostomy pouch independently before</text><text x="41" y="384" fill="#f6faf5" font-size="21">discharge</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Independent pouch care is observable,</text><text x="41" y="516" fill="#f6faf5" font-size="21">achievable before discharge, and directly</text><text x="41" y="543" fill="#f6faf5" font-size="21">determines whether the client can manage</text><text x="41" y="570" fill="#f6faf5" font-size="21">at home.</text></g></svg>