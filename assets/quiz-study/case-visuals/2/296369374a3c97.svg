<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client has had eight negative workups for abdominal pain and remains genuinely distressed and functionally impaired. Which mechanism best explains somatic symptom disorder, and how does it differ from malingering?</title><desc>In somatic symptom disorder, central sensitization lowers the threshold of pain-processing pathways and attentional amplification magnifies benign bodily signals, so the suffering is real and not consciously generated. Malingering is intentional symptom production for external gain such as money or avoiding work, and factitious disorder is intentional production for the internal reward of the sick role. The nurse validates the symptom experience, avoids repeat unnecessary testing, and schedules regular brief visits rather than symptom-triggered ones.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Somatic Symptom Disorder</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has had eight negative workups</text><text x="41" y="198" fill="#f6faf5" font-size="21">for abdominal pain and remains genuinely</text><text x="41" y="225" fill="#f6faf5" font-size="21">distressed and functionally impaired.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Central sensitization and sensory</text><text x="41" y="357" fill="#f6faf5" font-size="21">amplification make normal signals feel</text><text x="41" y="384" fill="#f6faf5" font-size="21">intensely painful, and the distress is not</text><text x="41" y="411" fill="#f6faf5" font-size="21">consciously produced, unlike malingering&#x27;s</text><text x="41" y="438" fill="#f6faf5" font-size="21">deliberate external gain</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">In somatic symptom disorder, central</text><text x="41" y="570" fill="#f6faf5" font-size="21">sensitization lowers the threshold of</text><text x="41" y="597" fill="#f6faf5" font-size="21">pain-processing pathways and attentional</text><text x="41" y="624" fill="#f6faf5" font-size="21">amplification magnifies benign bodily</text><text x="41" y="651" fill="#f6faf5" font-size="21">signals, so the suffering is real and not</text><text x="41" y="678" fill="#f6faf5" font-size="21">consciously generated.</text></g></svg>