<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>The nurse has noted the emergence of a significant amount of fresh blood at the drain site of a client who is postoperative day 1 following total laryngectomy. What is the nurse&#x27;s best action?</title><desc>The nurse promptly notifies the surgeon of any active bleeding, which can occur at a variety of sites, including the surgical site, drains, and trachea. The drain should not be removed or connected to suction. Supine positioning would exacerbate the bleeding. Vitamin K would not be given without an order.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 4 · Larynx / Airway</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse has noted the emergence of a</text><text x="41" y="198" fill="#f6faf5" font-size="21">significant amount of fresh blood at the</text><text x="41" y="225" fill="#f6faf5" font-size="21">drain site of a client who is</text><text x="41" y="252" fill="#f6faf5" font-size="21">postoperative day 1 following total</text><text x="41" y="279" fill="#f6faf5" font-size="21">laryngectomy. What is the nurse&#x27;s best</text><text x="41" y="306" fill="#f6faf5" font-size="21">action?</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">Rapidly assess the client and notify the</text><text x="41" y="438" fill="#f6faf5" font-size="21">surgeon about the client&#x27;s bleeding.</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">The nurse promptly notifies the surgeon of</text><text x="41" y="570" fill="#f6faf5" font-size="21">any active bleeding, which can occur at a</text><text x="41" y="597" fill="#f6faf5" font-size="21">variety of sites, including the surgical</text><text x="41" y="624" fill="#f6faf5" font-size="21">site, drains, and trachea.</text></g></svg>