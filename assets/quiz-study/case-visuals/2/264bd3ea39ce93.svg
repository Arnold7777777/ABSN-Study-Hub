<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A nurse is interviewing the parent of a 24-month-old during a routine visit. Which of the following findings should the nurse identify as requiring further developmental evaluation? Select all that apply.</title><desc>REGRESSION IS ALWAYS A RED FLAG AT ANY AGE, so loss of previously acquired words is reported immediately. No two-word phrases by 24 months signals expressive language delay, and hand dominance before 18 months suggests weakness on the opposite side. Parallel play at 2 years and negativism during autonomy versus shame and doubt are EXPECTED toddler behavior, not deviations.</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Identifying Developmental</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Deviations</text><rect x="23" y="139" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is interviewing the parent of a</text><text x="41" y="231" fill="#f6faf5" font-size="21">24-month-old during a routine visit. Which</text><text x="41" y="258" fill="#f6faf5" font-size="21">of the following findings should the nurse</text><text x="41" y="285" fill="#f6faf5" font-size="21">identify as requiring further</text><text x="41" y="312" fill="#f6faf5" font-size="21">developmental evaluation? Select all that</text><text x="41" y="339" fill="#f6faf5" font-size="21">apply.</text><path d="M319 363v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="379" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 392) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="413" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="444" fill="#f6faf5" font-size="21">The parent reports the child no longer</text><text x="41" y="471" fill="#f6faf5" font-size="21">says several words she used clearly at 15</text><text x="41" y="498" fill="#f6faf5" font-size="21">months · The child does not yet combine</text><text x="41" y="525" fill="#f6faf5" font-size="21">two words into a phrase such as more juice</text><text x="41" y="552" fill="#f6faf5" font-size="21">· The parent reports the…</text><path d="M319 576v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="592" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 605) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="626" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="657" fill="#f6faf5" font-size="21">REGRESSION IS ALWAYS A RED FLAG AT ANY</text><text x="41" y="684" fill="#f6faf5" font-size="21">AGE, so loss of previously acquired words</text><text x="41" y="711" fill="#f6faf5" font-size="21">is reported immediately.</text></g></svg>