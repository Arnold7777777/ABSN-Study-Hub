<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client 3 days postpartum has firm, painfully full breasts. She has been feeding her newborn about every 5 hours to let her breasts fill up. Which instruction does the nurse give?</title><desc>Engorgement results from infrequent emptying , so more frequent feeding is the treatment, not less. Spacing feedings, discarding milk and binding all worsen stasis; cold packs between feeds are comfort measures only, not the priority intervention.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Newborn Feeding</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client 3 days postpartum has firm,</text><text x="41" y="198" fill="#f6faf5" font-size="21">painfully full breasts. She has been</text><text x="41" y="225" fill="#f6faf5" font-size="21">feeding her newborn about every 5 hours to</text><text x="41" y="252" fill="#f6faf5" font-size="21">let her breasts fill up. Which instruction</text><text x="41" y="279" fill="#f6faf5" font-size="21">does the nurse give?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Feed the newborn every 2 to 3 hours, at</text><text x="41" y="411" fill="#f6faf5" font-size="21">least 8 to 12 times a day</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Engorgement results from infrequent</text><text x="41" y="543" fill="#f6faf5" font-size="21">emptying , so more frequent feeding is the</text><text x="41" y="570" fill="#f6faf5" font-size="21">treatment, not less. Spacing feedings,</text><text x="41" y="597" fill="#f6faf5" font-size="21">discarding milk and binding all worsen</text><text x="41" y="624" fill="#f6faf5" font-size="21">stasis; cold packs between feeds are</text><text x="41" y="651" fill="#f6faf5" font-size="21">comfort measures only, not the priority</text><text x="41" y="678" fill="#f6faf5" font-size="21">intervention.</text></g></svg>