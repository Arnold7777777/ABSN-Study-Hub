<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>What is the correct order for teaching a client to use an incentive spirometer?</title><desc>Up, out, in, hold, out, repeat, cough. Sit upright, exhale first, inhale slowly through the device, hold for 3 to 5 seconds (10 is the goal), exhale normally — NOT into the device — repeat 10 times an hour while awake, then cough.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Incentive Spirometer Teaching</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">What is the correct order for teaching a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client to use an incentive spirometer?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Sit upright, exhale, inhale slowly through</text><text x="41" y="330" fill="#f6faf5" font-size="21">the device, hold 3 to 5 seconds, exhale</text><text x="41" y="357" fill="#f6faf5" font-size="21">normally, repeat 10 times per hour while</text><text x="41" y="384" fill="#f6faf5" font-size="21">awake, then cough 2 to 3 times</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Up, out, in, hold, out, repeat, cough. Sit</text><text x="41" y="516" fill="#f6faf5" font-size="21">upright, exhale first, inhale slowly</text><text x="41" y="543" fill="#f6faf5" font-size="21">through the device, hold for 3 to 5</text><text x="41" y="570" fill="#f6faf5" font-size="21">seconds (10 is the goal), exhale normally</text><text x="41" y="597" fill="#f6faf5" font-size="21">— NOT into the device — repeat 10 times an</text><text x="41" y="624" fill="#f6faf5" font-size="21">hour while awake, then cough.</text></g></svg>