<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="539" viewBox="0 0 640 539"><title>81. Discharge teaching for a client with a long-term indwelling catheter should include which instructions? (Select all that apply)</title><desc>a, c, d. Bag below the bladder (prevents backflow), daily perineal/catheter care, and increased fluids. Never disconnect the closed system (infection risk); the separate-container rule is a facility practice, not self-care.</desc><rect width="640" height="539" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">81. Discharge teaching for a client with a</text><text x="41" y="198" fill="#f6faf5" font-size="21">long-term indwelling catheter should</text><text x="41" y="225" fill="#f6faf5" font-size="21">include which instructions? (Select all</text><text x="41" y="252" fill="#f6faf5" font-size="21">that apply)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="222" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="357" fill="#f6faf5" font-size="21">a, c, d. Bag below the bladder (prevents</text><text x="41" y="384" fill="#f6faf5" font-size="21">backflow), daily perineal/catheter care,</text><text x="41" y="411" fill="#f6faf5" font-size="21">and increased fluids. Never disconnect the</text><text x="41" y="438" fill="#f6faf5" font-size="21">closed system (infection risk); the</text><text x="41" y="465" fill="#f6faf5" font-size="21">separate-container rule is a facility</text><text x="41" y="492" fill="#f6faf5" font-size="21">practice, not self-care.</text></g></svg>