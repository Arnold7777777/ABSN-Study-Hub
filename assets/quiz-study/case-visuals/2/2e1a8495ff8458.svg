<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>An older woman reports new urinary leakage. Which age-related change contributes most to this problem?</title><desc>With aging (and after childbirth or menopause) the pelvic floor and urethral muscles weaken, so urine leaks under pressure. Bladder capacity actually decreases. Incontinence is common but never simply normal; it is assessed and treated.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Incontinence in older women -</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">pelvic floor</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">An older woman reports new urinary</text><text x="41" y="231" fill="#f6faf5" font-size="21">leakage. Which age-related change</text><text x="41" y="258" fill="#f6faf5" font-size="21">contributes most to this problem?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Decreased pelvic floor muscle tone</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">With aging (and after childbirth or</text><text x="41" y="495" fill="#f6faf5" font-size="21">menopause) the pelvic floor and urethral</text><text x="41" y="522" fill="#f6faf5" font-size="21">muscles weaken, so urine leaks under</text><text x="41" y="549" fill="#f6faf5" font-size="21">pressure. Bladder capacity actually</text><text x="41" y="576" fill="#f6faf5" font-size="21">decreases. Incontinence is common but</text><text x="41" y="603" fill="#f6faf5" font-size="21">never simply normal; it is assessed and</text><text x="41" y="630" fill="#f6faf5" font-size="21">treated.</text></g></svg>