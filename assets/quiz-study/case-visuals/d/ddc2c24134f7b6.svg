<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is admitting an 82-year-old client who has presbycusis and does not wear hearing aids. Which action should the nurse take when providing admission teaching?</title><desc>Presbycusis causes loss of HIGH-frequency sounds first, so the nurse should LOWER THE PITCH of the voice rather than SHOUT, because shouting RAISES pitch and distorts speech. Facing the client in good light supports speech-reading; exaggerated mouth movements distort lip patterns, and the nurse should REPHRASE rather than simply repeat.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hearing Deficit</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is admitting an 82-year-old client</text><text x="41" y="198" fill="#f6faf5" font-size="21">who has presbycusis and does not wear</text><text x="41" y="225" fill="#f6faf5" font-size="21">hearing aids. Which action should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse take when providing admission</text><text x="41" y="279" fill="#f6faf5" font-size="21">teaching?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Face the client directly in a well-lit</text><text x="41" y="411" fill="#f6faf5" font-size="21">area and speak in a normal tone at a</text><text x="41" y="438" fill="#f6faf5" font-size="21">slightly lower pitch</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Presbycusis causes loss of HIGH-frequency</text><text x="41" y="570" fill="#f6faf5" font-size="21">sounds first, so the nurse should LOWER</text><text x="41" y="597" fill="#f6faf5" font-size="21">THE PITCH of the voice rather than SHOUT,</text><text x="41" y="624" fill="#f6faf5" font-size="21">because shouting RAISES pitch and distorts</text><text x="41" y="651" fill="#f6faf5" font-size="21">speech.</text></g></svg>