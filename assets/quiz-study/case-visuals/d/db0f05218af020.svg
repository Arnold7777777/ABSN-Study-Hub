<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client at 8 weeks&#x27; gestation has unilateral lower abdominal pain and scant vaginal bleeding. Which complication does the nurse suspect first, and why is the visible bleeding misleading?</title><desc>Unilateral pain with scant bleeding early in pregnancy points to an ectopic pregnancy . The textbook&#x27;s rule matters here: the amount of visible bleeding may not reflect the amount actually occurring , because bleeding can be concealed. Caught before rupture, methotrexate may end the pregnancy without surgery.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 8 weeks&#x27; gestation has</text><text x="41" y="231" fill="#f6faf5" font-size="21">unilateral lower abdominal pain and scant</text><text x="41" y="258" fill="#f6faf5" font-size="21">vaginal bleeding. Which complication does</text><text x="41" y="285" fill="#f6faf5" font-size="21">the nurse suspect first, and why is the</text><text x="41" y="312" fill="#f6faf5" font-size="21">visible bleeding misleading?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Ectopic pregnancy; bleeding can be</text><text x="41" y="444" fill="#f6faf5" font-size="21">concealed internally, so the visible</text><text x="41" y="471" fill="#f6faf5" font-size="21">amount understates the loss</text><path d="M319 495v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="511" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 524) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="545" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="576" fill="#f6faf5" font-size="21">Unilateral pain with scant bleeding early</text><text x="41" y="603" fill="#f6faf5" font-size="21">in pregnancy points to an ectopic</text><text x="41" y="630" fill="#f6faf5" font-size="21">pregnancy .</text></g></svg>