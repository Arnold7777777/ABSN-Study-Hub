<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>The parent of a 9-month-old says the baby falls asleep with a bottle of juice in bed. What is the nurse&#x27;s priority teaching?</title><desc>Sugars from milk or juice pooling around the teeth during sleep cause early childhood caries (baby-bottle tooth decay). Milk is no safer than juice. If a bottle is needed, it should hold only water.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Infant (0–1 year)</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The parent of a 9-month-old says the baby</text><text x="41" y="198" fill="#f6faf5" font-size="21">falls asleep with a bottle of juice in</text><text x="41" y="225" fill="#f6faf5" font-size="21">bed. What is the nurse&#x27;s priority</text><text x="41" y="252" fill="#f6faf5" font-size="21">teaching?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Do not put the baby to bed with a bottle</text><text x="41" y="384" fill="#f6faf5" font-size="21">of milk or juice, because it causes early</text><text x="41" y="411" fill="#f6faf5" font-size="21">childhood caries</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Sugars from milk or juice pooling around</text><text x="41" y="543" fill="#f6faf5" font-size="21">the teeth during sleep cause early</text><text x="41" y="570" fill="#f6faf5" font-size="21">childhood caries (baby-bottle tooth</text><text x="41" y="597" fill="#f6faf5" font-size="21">decay). Milk is no safer than juice. If a</text><text x="41" y="624" fill="#f6faf5" font-size="21">bottle is needed, it should hold only</text><text x="41" y="651" fill="#f6faf5" font-size="21">water.</text></g></svg>