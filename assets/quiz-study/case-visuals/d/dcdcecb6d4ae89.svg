<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="785" viewBox="0 0 640 785"><title>A client tells the nurse, &quot;You&#x27;re the only one who understands me. Can I have your cell number so we can keep in touch after discharge?&quot; Which response is BEST?</title><desc>The nurse holds the boundary, names the relationship as professional and time-limited, and redirects to the client&#x27;s real need — support after discharge. Giving the number is a clear boundary violation; hiding behind policy is true but leaves the underlying need unaddressed.</desc><rect width="640" height="785" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client tells the nurse, &quot;You&#x27;re the only</text><text x="41" y="231" fill="#f6faf5" font-size="21">one who understands me. Can I have your</text><text x="41" y="258" fill="#f6faf5" font-size="21">cell number so we can keep in touch after</text><text x="41" y="285" fill="#f6faf5" font-size="21">discharge?&quot; Which response is BEST?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Our relationship is a professional one</text><text x="41" y="417" fill="#f6faf5" font-size="21">that ends at discharge. Let&#x27;s talk about</text><text x="41" y="444" fill="#f6faf5" font-size="21">who will support you at home.</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">The nurse holds the boundary, names the</text><text x="41" y="576" fill="#f6faf5" font-size="21">relationship as professional and time-</text><text x="41" y="603" fill="#f6faf5" font-size="21">limited, and redirects to the client&#x27;s</text><text x="41" y="630" fill="#f6faf5" font-size="21">real need — support after discharge.</text><text x="41" y="657" fill="#f6faf5" font-size="21">Giving the number is a clear boundary</text><text x="41" y="684" fill="#f6faf5" font-size="21">violation; hiding behind policy is true</text><text x="41" y="711" fill="#f6faf5" font-size="21">but leaves the underlying need</text><text x="41" y="738" fill="#f6faf5" font-size="21">unaddressed.</text></g></svg>