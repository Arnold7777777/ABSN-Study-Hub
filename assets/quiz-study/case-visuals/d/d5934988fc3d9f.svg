<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>Which client on the oncology unit does the nurse see first?</title><desc>Neutropenic fever is the one situation where antibiotics are given without a proven infection - cultures plus IV antibiotics, likely admission. ANC under 1,500 is neutropenic and under 500 is severe; with no neutrophils, a low-grade fever may be the only sign of overwhelming sepsis.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Oncologic Disorders &amp; End-of-Life</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Care</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which client on the oncology unit does the</text><text x="41" y="231" fill="#f6faf5" font-size="21">nurse see first?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">A client with ANC 800 and a temperature of</text><text x="41" y="363" fill="#f6faf5" font-size="21">100.8 F</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">Neutropenic fever is the one situation</text><text x="41" y="495" fill="#f6faf5" font-size="21">where antibiotics are given without a</text><text x="41" y="522" fill="#f6faf5" font-size="21">proven infection - cultures plus IV</text><text x="41" y="549" fill="#f6faf5" font-size="21">antibiotics, likely admission. ANC under</text><text x="41" y="576" fill="#f6faf5" font-size="21">1,500 is neutropenic and under 500 is</text><text x="41" y="603" fill="#f6faf5" font-size="21">severe; with no neutrophils, a low-grade</text><text x="41" y="630" fill="#f6faf5" font-size="21">fever may be the only sign of overwhelming</text><text x="41" y="657" fill="#f6faf5" font-size="21">sepsis.</text></g></svg>