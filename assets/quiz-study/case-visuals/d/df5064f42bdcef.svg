<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="563" viewBox="0 0 640 563"><title>A nurse is caring for a client who has been taking fluphenazine for 5 days. The client has a temperature of 40 C (104 F), severe muscle rigidity, altered level of consciousness, and blood pressure of 172/98 mm Hg. Which of the following actions should the nurse take first?</title><desc>Hyperthermia, lead-pipe rigidity , autonomic instability, and altered mental status indicate neuroleptic malignant syndrome , a medical emergency; the first action is to stop the antipsychotic and notify the provider so cooling, hydration, dantrolene, and bromocriptine can be started. Giving another dose would be lethal, and cooling alone or delayed reassessment postpones definitive treatment.</desc><rect width="640" height="563" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neuroleptic Malignant Syndrome</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is caring for a client who has</text><text x="41" y="198" fill="#f6faf5" font-size="21">been taking fluphenazine for 5 days.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Stop the antipsychotic and notify the</text><text x="41" y="330" fill="#f6faf5" font-size="21">provider immediately</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Hyperthermia, lead-pipe rigidity ,</text><text x="41" y="462" fill="#f6faf5" font-size="21">autonomic instability, and altered mental</text><text x="41" y="489" fill="#f6faf5" font-size="21">status indicate neuroleptic malignant</text><text x="41" y="516" fill="#f6faf5" font-size="21">syndrome , a medical emergency;</text></g></svg>