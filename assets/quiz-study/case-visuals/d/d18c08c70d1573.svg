<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>During the orientation phase a client asks the nurse, &quot;Are you married? Do you have kids?&quot; Which response is BEST?</title><desc>The nurse acknowledges the question and refocuses on the client — when in doubt, bring the discussion back to the client. Answering in detail is self-disclosure that meets the nurse&#x27;s needs, not the client&#x27;s; self-disclosure is appropriate only when it benefits the client and supports treatment goals. Flatly refusing is rejecting and damages rapport.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">During the orientation phase a client asks</text><text x="41" y="231" fill="#f6faf5" font-size="21">the nurse, &quot;Are you married? Do you have</text><text x="41" y="258" fill="#f6faf5" font-size="21">kids?&quot; Which response is BEST?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">It sounds like you want to know who I am.</text><text x="41" y="390" fill="#f6faf5" font-size="21">I&#x27;d like to keep our time focused on you —</text><text x="41" y="417" fill="#f6faf5" font-size="21">what would you like me to know about you?</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">The nurse acknowledges the question and</text><text x="41" y="549" fill="#f6faf5" font-size="21">refocuses on the client — when in doubt,</text><text x="41" y="576" fill="#f6faf5" font-size="21">bring the discussion back to the client.</text></g></svg>