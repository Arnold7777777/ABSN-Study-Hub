<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which statement about administering packed red blood cells is correct?</title><desc>Only 0.9 percent NS is compatible - dextrose hemolyzes cells and LR clots them - and the nurse stays for the first 15 minutes with the unit completed within 4 hours . Two-nurse verification precedes all of it.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematologic Disorders</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which statement about administering packed</text><text x="41" y="198" fill="#f6faf5" font-size="21">red blood cells is correct?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Prime with 0.9 percent sodium chloride,</text><text x="41" y="330" fill="#f6faf5" font-size="21">stay with the client the first 15 minutes,</text><text x="41" y="357" fill="#f6faf5" font-size="21">and infuse within 4 hours</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Only 0.9 percent NS is compatible -</text><text x="41" y="489" fill="#f6faf5" font-size="21">dextrose hemolyzes cells and LR clots them</text><text x="41" y="516" fill="#f6faf5" font-size="21">- and the nurse stays for the first 15</text><text x="41" y="543" fill="#f6faf5" font-size="21">minutes with the unit completed within 4</text><text x="41" y="570" fill="#f6faf5" font-size="21">hours . Two-nurse verification precedes</text><text x="41" y="597" fill="#f6faf5" font-size="21">all of it.</text></g></svg>