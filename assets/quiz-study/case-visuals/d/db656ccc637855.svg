<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Why does serum ammonia rise in a client with liver failure?</title><desc>A healthy liver converts ammonia to urea, which the kidneys excrete; a damaged liver cannot, so ammonia accumulates and becomes neurotoxic. The buildup is a liver failure, not a kidney or pancreatic one, which is why the treatment targets gut ammonia.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hepatic Encephalopathy</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Why does serum ammonia rise in a client</text><text x="41" y="198" fill="#f6faf5" font-size="21">with liver failure?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">The liver cannot convert ammonia to urea</text><text x="41" y="330" fill="#f6faf5" font-size="21">for excretion</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">A healthy liver converts ammonia to urea,</text><text x="41" y="462" fill="#f6faf5" font-size="21">which the kidneys excrete; a damaged liver</text><text x="41" y="489" fill="#f6faf5" font-size="21">cannot, so ammonia accumulates and becomes</text><text x="41" y="516" fill="#f6faf5" font-size="21">neurotoxic. The buildup is a liver</text><text x="41" y="543" fill="#f6faf5" font-size="21">failure, not a kidney or pancreatic one,</text><text x="41" y="570" fill="#f6faf5" font-size="21">which is why the treatment targets gut</text><text x="41" y="597" fill="#f6faf5" font-size="21">ammonia.</text></g></svg>