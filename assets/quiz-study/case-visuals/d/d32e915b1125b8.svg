<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which interventions belong in the first hour of care?</title><desc>The hour-1 bundle is cultures before antibiotics when that causes no delay, broad-spectrum antibiotics, at least 30 mL/kg of crystalloid for hypoperfusion, lactate measurement, and vasopressors if the mean pressure stays below 65 mm Hg. Waiting for cultures delays the single intervention most tied to survival. An antipyretic treats the thermometer, not the infection.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sepsis</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which interventions belong in the first</text><text x="41" y="198" fill="#f6faf5" font-size="21">hour of care?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Draw blood cultures before antibiotics if</text><text x="41" y="330" fill="#f6faf5" font-size="21">it causes no delay · Give the broad-</text><text x="41" y="357" fill="#f6faf5" font-size="21">spectrum IV antibiotics · Begin 30 mL/kg</text><text x="41" y="384" fill="#f6faf5" font-size="21">of isotonic crystalloid as ordered</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">The hour-1 bundle is cultures before</text><text x="41" y="516" fill="#f6faf5" font-size="21">antibiotics when that causes no delay,</text><text x="41" y="543" fill="#f6faf5" font-size="21">broad-spectrum antibiotics, at least 30</text><text x="41" y="570" fill="#f6faf5" font-size="21">mL/kg of crystalloid for hypoperfusion,</text><text x="41" y="597" fill="#f6faf5" font-size="21">lactate measurement, and vasopressors if</text><text x="41" y="624" fill="#f6faf5" font-size="21">the mean pressure stays below 65 mm Hg.</text></g></svg>