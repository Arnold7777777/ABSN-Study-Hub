<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse is teaching a client through a medical interpreter. Which of the following actions should the nurse take?</title><desc>Addressing the client, speaking in short segments, and allowing extra time keep the client at the center of the interaction and support accuracy. Asking for a summary lets someone else decide what matters, and jargon increases the chance of mistranslation rather than reducing it.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Using an Interpreter</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a client through a</text><text x="41" y="198" fill="#f6faf5" font-size="21">medical interpreter. Which of the</text><text x="41" y="225" fill="#f6faf5" font-size="21">following actions should the nurse take?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Speak directly to the client rather than</text><text x="41" y="357" fill="#f6faf5" font-size="21">to the interpreter · Use short sentences</text><text x="41" y="384" fill="#f6faf5" font-size="21">and pause frequently · Allow extra time</text><text x="41" y="411" fill="#f6faf5" font-size="21">for the teaching session</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Addressing the client, speaking in short</text><text x="41" y="543" fill="#f6faf5" font-size="21">segments, and allowing extra time keep the</text><text x="41" y="570" fill="#f6faf5" font-size="21">client at the center of the interaction</text><text x="41" y="597" fill="#f6faf5" font-size="21">and support accuracy. Asking for a summary</text><text x="41" y="624" fill="#f6faf5" font-size="21">lets someone else decide what matters, and</text><text x="41" y="651" fill="#f6faf5" font-size="21">jargon increases the chance of</text><text x="41" y="678" fill="#f6faf5" font-size="21">mistranslation rather than reducing it.</text></g></svg>