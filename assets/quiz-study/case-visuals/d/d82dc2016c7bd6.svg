<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A nurse is completing discharge teaching with a client following middle ear surgery. Which statement by the client indicates an understanding of the teaching?</title><desc>Anything that raises middle ear pressure can displace the graft or prosthesis, so bending, lifting, straining and rapid head movement are out for several weeks . The others are the classic distractors: hearing is worse at first because of packing and edema and takes weeks to settle; the dressing comes off when the surgeon says, not on a date the client picks; and hair washing waits about a week, not until the next day.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sensory Disorders - Eye &amp; Ear</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is completing discharge teaching</text><text x="41" y="198" fill="#f6faf5" font-size="21">with a client following middle ear</text><text x="41" y="225" fill="#f6faf5" font-size="21">surgery. Which statement by the client</text><text x="41" y="252" fill="#f6faf5" font-size="21">indicates an understanding of the</text><text x="41" y="279" fill="#f6faf5" font-size="21">teaching?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">I should restrict rapid movements and</text><text x="41" y="411" fill="#f6faf5" font-size="21">avoid bending from the waist for several</text><text x="41" y="438" fill="#f6faf5" font-size="21">weeks.</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Anything that raises middle ear pressure</text><text x="41" y="570" fill="#f6faf5" font-size="21">can displace the graft or prosthesis, so</text><text x="41" y="597" fill="#f6faf5" font-size="21">bending, lifting, straining and rapid head</text><text x="41" y="624" fill="#f6faf5" font-size="21">movement are out for several weeks .</text></g></svg>