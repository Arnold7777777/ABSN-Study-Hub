<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A child arrives at triage holding his wrist, which has an obvious deformity. He is crying. After looking at the injury, what does the nurse do next?</title><desc>Immobilize the injury as it lies , never straighten it, then do a neurovascular check distal to the injury and compare it with the unaffected side. Ice and elevation, not heat, help swelling and pain.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Musculoskeletal</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A child arrives at triage holding his</text><text x="41" y="198" fill="#f6faf5" font-size="21">wrist, which has an obvious deformity. He</text><text x="41" y="225" fill="#f6faf5" font-size="21">is crying. After looking at the injury,</text><text x="41" y="252" fill="#f6faf5" font-size="21">what does the nurse do next?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Immobilize the arm, then check pulses,</text><text x="41" y="384" fill="#f6faf5" font-size="21">color, warmth and sensation below the</text><text x="41" y="411" fill="#f6faf5" font-size="21">injury and compare with the other side</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Immobilize the injury as it lies , never</text><text x="41" y="543" fill="#f6faf5" font-size="21">straighten it, then do a neurovascular</text><text x="41" y="570" fill="#f6faf5" font-size="21">check distal to the injury and compare it</text><text x="41" y="597" fill="#f6faf5" font-size="21">with the unaffected side. Ice and</text><text x="41" y="624" fill="#f6faf5" font-size="21">elevation, not heat, help swelling and</text><text x="41" y="651" fill="#f6faf5" font-size="21">pain.</text></g></svg>