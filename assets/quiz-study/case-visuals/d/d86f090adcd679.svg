<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A toddler with rotavirus gastroenteritis has tachycardia, tachypnea, a high temperature and a low blood pressure. Which finding should the nurse address first?</title><desc>Breathing comes before circulation - and in a dehydrated toddler, fast deep breathing is the body blowing off carbon dioxide to compensate for metabolic acidosis . It signals how sick the child already is.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A toddler with rotavirus gastroenteritis</text><text x="41" y="198" fill="#f6faf5" font-size="21">has tachycardia, tachypnea, a high</text><text x="41" y="225" fill="#f6faf5" font-size="21">temperature and a low blood pressure.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which finding should the nurse address</text><text x="41" y="279" fill="#f6faf5" font-size="21">first?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Tachypnea</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Breathing comes before circulation - and</text><text x="41" y="516" fill="#f6faf5" font-size="21">in a dehydrated toddler, fast deep</text><text x="41" y="543" fill="#f6faf5" font-size="21">breathing is the body blowing off carbon</text><text x="41" y="570" fill="#f6faf5" font-size="21">dioxide to compensate for metabolic</text><text x="41" y="597" fill="#f6faf5" font-size="21">acidosis . It signals how sick the child</text><text x="41" y="624" fill="#f6faf5" font-size="21">already is.</text></g></svg>