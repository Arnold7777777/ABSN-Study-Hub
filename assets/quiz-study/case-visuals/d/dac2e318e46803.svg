<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client with somatic symptom disorder visits the emergency department weekly for abdominal pain with no organic cause found. Which approach should the plan of care include?</title><desc>Regular, time-limited visits with a single provider give the client attention that is not earned through symptoms , which reduces the reinforcement driving the behavior and prevents duplicate workups. More testing is the tempting choice because it seems to answer the client&#x27;s worry, but reassurance from testing is short-lived and repeated workups escalate health anxiety and risk. The symptoms are genuinely experienced, so denying them or refusing all discussion damages the relationship.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Somatic Symptom Disorder</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with somatic symptom disorder</text><text x="41" y="198" fill="#f6faf5" font-size="21">visits the emergency department weekly for</text><text x="41" y="225" fill="#f6faf5" font-size="21">abdominal pain with no organic cause</text><text x="41" y="252" fill="#f6faf5" font-size="21">found. Which approach should the plan of</text><text x="41" y="279" fill="#f6faf5" font-size="21">care include?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Scheduling regular brief appointments with</text><text x="41" y="411" fill="#f6faf5" font-size="21">one primary provider that are not</text><text x="41" y="438" fill="#f6faf5" font-size="21">contingent on symptoms</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Regular, time-limited visits with a single</text><text x="41" y="570" fill="#f6faf5" font-size="21">provider give the client attention that is</text><text x="41" y="597" fill="#f6faf5" font-size="21">not earned through symptoms , which</text><text x="41" y="624" fill="#f6faf5" font-size="21">reduces the reinforcement driving the</text><text x="41" y="651" fill="#f6faf5" font-size="21">behavior and prevents duplicate workups.</text></g></svg>