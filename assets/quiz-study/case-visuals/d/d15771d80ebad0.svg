<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="512" viewBox="0 0 640 512"><title>202. A client presents with severe pain, nausea, and hematuria. Which finding indicates renal colic?</title><desc>c. A stone stuck in the ureter causes intense flank pain radiating to the groin with nausea/hematuria. Epigastric-to-back = pancreatitis; RUQ after fatty meal = cholecystitis; central distension/vomiting = bowel obstruction.</desc><rect width="640" height="512" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">202. A client presents with severe pain,</text><text x="41" y="198" fill="#f6faf5" font-size="21">nausea, and hematuria. Which finding</text><text x="41" y="225" fill="#f6faf5" font-size="21">indicates renal colic?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="222" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">c. A stone stuck in the ureter causes</text><text x="41" y="357" fill="#f6faf5" font-size="21">intense flank pain radiating to the groin</text><text x="41" y="384" fill="#f6faf5" font-size="21">with nausea/hematuria. Epigastric-to-back</text><text x="41" y="411" fill="#f6faf5" font-size="21">= pancreatitis; RUQ after fatty meal =</text><text x="41" y="438" fill="#f6faf5" font-size="21">cholecystitis; central distension/vomiting</text><text x="41" y="465" fill="#f6faf5" font-size="21">= bowel obstruction.</text></g></svg>