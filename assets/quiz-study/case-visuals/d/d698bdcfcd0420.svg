<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A client reports brief spinning that starts when rolling over in bed, lasting under a minute, with no new hearing loss. Which assessment does the nurse anticipate for suspected posterior-canal BPPV?</title><desc>Dix–Hallpike provokes the position-triggered vertigo and lets the clinician watch for the characteristic eye movement. Tonometry measures intraocular pressure, Rinne compares air and bone conduction, and the Amsler grid screens central vision - none of them assess positional vertigo. Note the clue in the stem: no hearing loss , which fits BPPV rather than Ménière or labyrinthitis.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">BPPV / Dix-Hallpike</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client reports brief spinning that</text><text x="41" y="198" fill="#f6faf5" font-size="21">starts when rolling over in bed, lasting</text><text x="41" y="225" fill="#f6faf5" font-size="21">under a minute, with no new hearing loss.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which assessment does the nurse anticipate</text><text x="41" y="279" fill="#f6faf5" font-size="21">for suspected posterior-canal BPPV?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Dix–Hallpike maneuver</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Dix–Hallpike provokes the position-</text><text x="41" y="516" fill="#f6faf5" font-size="21">triggered vertigo and lets the clinician</text><text x="41" y="543" fill="#f6faf5" font-size="21">watch for the characteristic eye movement.</text></g></svg>