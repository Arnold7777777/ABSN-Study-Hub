<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A nurse is teaching a client who has a new prescription for buspirone. Which of the following statements should the nurse include? (Select all that apply.)</title><desc>Buspirone is a scheduled daily medication with a 3–4 week onset (ATI), so it is not PRN and not for acute panic . Rise slowly — dizziness is the most common effect. Grapefruit juice raises buspirone levels. Buspirone is non-addictive — that is its main advantage over benzodiazepines.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is teaching a client who has a new</text><text x="41" y="198" fill="#f6faf5" font-size="21">prescription for buspirone. Which of the</text><text x="41" y="225" fill="#f6faf5" font-size="21">following statements should the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">include? (Select all that apply.)</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">“Take this medication every day, not just</text><text x="41" y="384" fill="#f6faf5" font-size="21">when you feel anxious.” · “It may take 2</text><text x="41" y="411" fill="#f6faf5" font-size="21">to 4 weeks before you notice the full</text><text x="41" y="438" fill="#f6faf5" font-size="21">effect.” · “Rise slowly from sitting or</text><text x="41" y="465" fill="#f6faf5" font-size="21">lying down.” · “Avoid…</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Buspirone is a scheduled daily medication</text><text x="41" y="597" fill="#f6faf5" font-size="21">with a 3–4 week onset (ATI), so it is not</text><text x="41" y="624" fill="#f6faf5" font-size="21">PRN and not for acute panic . Rise slowly</text><text x="41" y="651" fill="#f6faf5" font-size="21">— dizziness is the most common effect.</text><text x="41" y="678" fill="#f6faf5" font-size="21">Grapefruit juice raises buspirone levels.</text><text x="41" y="705" fill="#f6faf5" font-size="21">Buspirone is non-addictive — that is its</text><text x="41" y="732" fill="#f6faf5" font-size="21">main advantage over benzodiazepines.</text></g></svg>