<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which of the following chest tube findings should the nurse report to the provider immediately?</title><desc>A sudden increase in output, bright red blood, an abrupt stop in drainage with worsening symptoms, and continuous water-seal bubbling all signal hemorrhage, obstruction, or an air leak. Tidaling is the one normal finding in this list — it confirms the system is working.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Chest Tube Drainage</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which of the following chest tube findings</text><text x="41" y="198" fill="#f6faf5" font-size="21">should the nurse report to the provider</text><text x="41" y="225" fill="#f6faf5" font-size="21">immediately?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Sudden bright red drainage · Continuous</text><text x="41" y="357" fill="#f6faf5" font-size="21">bubbling in the water-seal chamber ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Drainage greater than 100 mL per hour · No</text><text x="41" y="411" fill="#f6faf5" font-size="21">drainage accompanied by worsening dyspnea</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A sudden increase in output, bright red</text><text x="41" y="543" fill="#f6faf5" font-size="21">blood, an abrupt stop in drainage with</text><text x="41" y="570" fill="#f6faf5" font-size="21">worsening symptoms, and continuous water-</text><text x="41" y="597" fill="#f6faf5" font-size="21">seal bubbling all signal hemorrhage,</text><text x="41" y="624" fill="#f6faf5" font-size="21">obstruction, or an air leak. Tidaling is</text><text x="41" y="651" fill="#f6faf5" font-size="21">the one normal finding in this list — it</text><text x="41" y="678" fill="#f6faf5" font-size="21">confirms the system is working.</text></g></svg>