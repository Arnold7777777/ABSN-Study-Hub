<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>An unidentified adult arrives unconscious after a motorcycle crash with a rapidly expanding epidural hematoma. Surgery is needed immediately. No relative can be reached. Which action is correct?</title><desc>When delay would cost life or limb and the client cannot speak for himself, care proceeds under emergency implied consent. Waiting for a court or a relative is the trap because it sounds careful. Still document the emergency and every attempt to reach family.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Consent &amp; Rights</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An unidentified adult arrives unconscious</text><text x="41" y="198" fill="#f6faf5" font-size="21">after a motorcycle crash with a rapidly</text><text x="41" y="225" fill="#f6faf5" font-size="21">expanding epidural hematoma. Surgery is</text><text x="41" y="252" fill="#f6faf5" font-size="21">needed immediately. No relative can be</text><text x="41" y="279" fill="#f6faf5" font-size="21">reached. Which action is correct?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Take the client to surgery under emergency</text><text x="41" y="411" fill="#f6faf5" font-size="21">implied consent</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">When delay would cost life or limb and the</text><text x="41" y="543" fill="#f6faf5" font-size="21">client cannot speak for himself, care</text><text x="41" y="570" fill="#f6faf5" font-size="21">proceeds under emergency implied consent.</text><text x="41" y="597" fill="#f6faf5" font-size="21">Waiting for a court or a relative is the</text><text x="41" y="624" fill="#f6faf5" font-size="21">trap because it sounds careful. Still</text><text x="41" y="651" fill="#f6faf5" font-size="21">document the emergency and every attempt</text><text x="41" y="678" fill="#f6faf5" font-size="21">to reach family.</text></g></svg>