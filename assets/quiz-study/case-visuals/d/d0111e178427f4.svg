<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>After a total gastrectomy, the nurse teaches the client that lifelong supplementation will be required for which vitamin?</title><desc>Total gastrectomy removes the parietal cells that produce intrinsic factor, so the client can no longer absorb vitamin B12 and needs lifelong parenteral B12. Without it, the client develops pernicious anemia.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">gastric surgery</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">After a total gastrectomy, the nurse</text><text x="41" y="198" fill="#f6faf5" font-size="21">teaches the client that lifelong</text><text x="41" y="225" fill="#f6faf5" font-size="21">supplementation will be required for which</text><text x="41" y="252" fill="#f6faf5" font-size="21">vitamin?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Vitamin B12</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Total gastrectomy removes the parietal</text><text x="41" y="489" fill="#f6faf5" font-size="21">cells that produce intrinsic factor, so</text><text x="41" y="516" fill="#f6faf5" font-size="21">the client can no longer absorb vitamin</text><text x="41" y="543" fill="#f6faf5" font-size="21">B12 and needs lifelong parenteral B12.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Without it, the client develops pernicious</text><text x="41" y="597" fill="#f6faf5" font-size="21">anemia.</text></g></svg>