<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A 3-year-old is admitted with a fever of unknown source, and the provider orders a urine culture. Which action should the nurse take to obtain the specimen?</title><desc>A urine culture requires a sterile catheterized specimen, because a contaminated sample produces an unusable result. A bag specimen is tempting since collection normally moves from least to most invasive, but a bagged or freely voided sample is not sterile — and in a 24-hour collection the first void is discarded , never sent.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 3-year-old is admitted with a fever of</text><text x="41" y="198" fill="#f6faf5" font-size="21">unknown source, and the provider orders a</text><text x="41" y="225" fill="#f6faf5" font-size="21">urine culture. Which action should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse take to obtain the specimen?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Obtain a sterile specimen by urinary</text><text x="41" y="384" fill="#f6faf5" font-size="21">catheterization</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A urine culture requires a sterile</text><text x="41" y="516" fill="#f6faf5" font-size="21">catheterized specimen, because a</text><text x="41" y="543" fill="#f6faf5" font-size="21">contaminated sample produces an unusable</text><text x="41" y="570" fill="#f6faf5" font-size="21">result.</text></g></svg>