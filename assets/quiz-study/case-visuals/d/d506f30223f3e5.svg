<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client has sinus bradycardia with HR 38 bpm, BP 80/50, and altered mental status. What is the FIRST pharmacological treatment?</title><desc>Symptomatic bradycardia (low BP, AMS = signs of decreased cardiac output) is treated FIRST with IV Atropine (0.5–1 mg, repeat q3–5 min, max 3 mg). If atropine fails -&gt; Transcutaneous pacing -&gt; Permanent pacemaker. Amiodarone is for tachyarrhythmias. Cardioversion is for tachyarrhythmias.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Dysrhythmias</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client has sinus bradycardia with HR 38</text><text x="41" y="198" fill="#f6faf5" font-size="21">bpm, BP 80/50, and altered mental status.</text><text x="41" y="225" fill="#f6faf5" font-size="21">What is the FIRST pharmacological</text><text x="41" y="252" fill="#f6faf5" font-size="21">treatment?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Atropine 0.5–1 mg IV</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Symptomatic bradycardia (low BP, AMS =</text><text x="41" y="489" fill="#f6faf5" font-size="21">signs of decreased cardiac output) is</text><text x="41" y="516" fill="#f6faf5" font-size="21">treated FIRST with IV Atropine (0.5–1 mg,</text><text x="41" y="543" fill="#f6faf5" font-size="21">repeat q3–5 min, max 3 mg). If atropine</text><text x="41" y="570" fill="#f6faf5" font-size="21">fails -&gt; Transcutaneous pacing -&gt;</text><text x="41" y="597" fill="#f6faf5" font-size="21">Permanent pacemaker. Amiodarone is for</text><text x="41" y="624" fill="#f6faf5" font-size="21">tachyarrhythmias. Cardioversion is for</text><text x="41" y="651" fill="#f6faf5" font-size="21">tachyarrhythmias.</text></g></svg>