<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>An older adult in the ED has a fractured wrist from a fall and mentions a car crash last week after their vision &#x27;suddenly went blurry&#x27;. What is the nurse&#x27;s priority action?</title><desc>Assessment comes first, and sudden blurred vision plus a fall points at something neurological rather than clumsiness. Assess the neuro status before treating the wrist.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An older adult in the ED has a fractured</text><text x="41" y="198" fill="#f6faf5" font-size="21">wrist from a fall and mentions a car crash</text><text x="41" y="225" fill="#f6faf5" font-size="21">last week after their vision &#x27;suddenly</text><text x="41" y="252" fill="#f6faf5" font-size="21">went blurry&#x27;. What is the nurse&#x27;s priority</text><text x="41" y="279" fill="#f6faf5" font-size="21">action?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Check the client&#x27;s neurological status</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Assessment comes first, and sudden blurred</text><text x="41" y="516" fill="#f6faf5" font-size="21">vision plus a fall points at something</text><text x="41" y="543" fill="#f6faf5" font-size="21">neurological rather than clumsiness.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Assess the neuro status before treating</text><text x="41" y="597" fill="#f6faf5" font-size="21">the wrist.</text></g></svg>