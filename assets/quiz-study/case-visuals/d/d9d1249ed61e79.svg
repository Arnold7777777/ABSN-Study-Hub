<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A client who has a valid living will and a written DNR order becomes unresponsive and apneic. The client&#x27;s adult daughter tearfully insists, &#x27;You have to do everything to save him!&#x27; Which action should the nurse take first?</title><desc>A VALID ADVANCE DIRECTIVE AND DNR ORDER REFLECT THE CLIENT&#x27;S AUTONOMY AND MUST BE HONORED; A FAMILY MEMBER CANNOT REVOKE THEM, and only the client, while competent, may change them. The nurse supports the family emotionally and involves the provider and charge nurse; initiating CPR would violate the client&#x27;s documented wishes, and bluntly telling the daughter she has no rights is nontherapeutic.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Advance Directives</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who has a valid living will and a</text><text x="41" y="198" fill="#f6faf5" font-size="21">written DNR order becomes unresponsive and</text><text x="41" y="225" fill="#f6faf5" font-size="21">apneic.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Stay with the family, notify the charge</text><text x="41" y="357" fill="#f6faf5" font-size="21">nurse and provider, and honor the client&#x27;s</text><text x="41" y="384" fill="#f6faf5" font-size="21">documented wishes</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A VALID ADVANCE DIRECTIVE AND DNR ORDER</text><text x="41" y="516" fill="#f6faf5" font-size="21">REFLECT THE CLIENT&#x27;S AUTONOMY AND MUST BE</text><text x="41" y="543" fill="#f6faf5" font-size="21">HONORED;</text></g></svg>