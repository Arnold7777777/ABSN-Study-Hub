<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Fifteen minutes into a transfusion a client reports low back pain and says she feels that something terrible is about to happen. Which complication should the nurse suspect?</title><desc>Flank or low back pain with a sense of impending doom , in the first minutes of a unit, is an acute hemolytic reaction - incompatible red cells being destroyed, with the debris hitting the kidneys. Fever, chills, hypotension and dark urine follow. Stop the transfusion, keep the vein open with 0.9% sodium chloride through new tubing , then notify the provider and the blood bank. Overload gives dyspnea and crackles instead, and a febrile reaction is fever and chills without the back pain.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Fifteen minutes into a transfusion a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client reports low back pain and says she</text><text x="41" y="225" fill="#f6faf5" font-size="21">feels that something terrible is about to</text><text x="41" y="252" fill="#f6faf5" font-size="21">happen. Which complication should the</text><text x="41" y="279" fill="#f6faf5" font-size="21">nurse suspect?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">An acute hemolytic reaction</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Flank or low back pain with a sense of</text><text x="41" y="516" fill="#f6faf5" font-size="21">impending doom , in the first minutes of a</text><text x="41" y="543" fill="#f6faf5" font-size="21">unit, is an acute hemolytic reaction -</text><text x="41" y="570" fill="#f6faf5" font-size="21">incompatible red cells being destroyed,</text><text x="41" y="597" fill="#f6faf5" font-size="21">with the debris hitting the kidneys.</text></g></svg>