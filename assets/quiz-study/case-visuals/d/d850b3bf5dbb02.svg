<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>Behavioral criteria are met and restraints are removed. Which nursing action is appropriate in the postcrisis phase?</title><desc>In postcrisis the client returns to baseline functioning and attempts reconciliation, so the nurse reviews what happened calmly and non-punitively. Withholding privileges or public apology turns the intervention into punishment, which is never an acceptable use of restraint or seclusion.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Anger, Abuse &amp; Violence</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Behavioral criteria are met and restraints</text><text x="41" y="198" fill="#f6faf5" font-size="21">are removed. Which nursing action is</text><text x="41" y="225" fill="#f6faf5" font-size="21">appropriate in the postcrisis phase?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Discuss the incident with the client</text><text x="41" y="357" fill="#f6faf5" font-size="21">calmly and rationally</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">In postcrisis the client returns to</text><text x="41" y="489" fill="#f6faf5" font-size="21">baseline functioning and attempts</text><text x="41" y="516" fill="#f6faf5" font-size="21">reconciliation, so the nurse reviews what</text><text x="41" y="543" fill="#f6faf5" font-size="21">happened calmly and non-punitively.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Withholding privileges or public apology</text><text x="41" y="597" fill="#f6faf5" font-size="21">turns the intervention into punishment,</text><text x="41" y="624" fill="#f6faf5" font-size="21">which is never an acceptable use of</text><text x="41" y="651" fill="#f6faf5" font-size="21">restraint or seclusion.</text></g></svg>