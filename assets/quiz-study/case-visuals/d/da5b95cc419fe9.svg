<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is selecting a blood pressure cuff for an adult client who has a large upper arm. Which principle should guide the choice?</title><desc>Correct sizing means a bladder roughly 40 percent as wide as the arm circumference and long enough to wrap about 80 percent around the arm, which distributes pressure evenly over the artery. Believing that inflation technique can compensate for a poorly fitted cuff is the common error, because cuff size changes the reading no matter how carefully it is inflated.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Blood Pressure Technique</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is selecting a blood pressure cuff</text><text x="41" y="198" fill="#f6faf5" font-size="21">for an adult client who has a large upper</text><text x="41" y="225" fill="#f6faf5" font-size="21">arm. Which principle should guide the</text><text x="41" y="252" fill="#f6faf5" font-size="21">choice?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">The bladder width should be about 40</text><text x="41" y="384" fill="#f6faf5" font-size="21">percent of the arm circumference and the</text><text x="41" y="411" fill="#f6faf5" font-size="21">bladder length about 80 percent of the way</text><text x="41" y="438" fill="#f6faf5" font-size="21">around the arm</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Correct sizing means a bladder roughly 40</text><text x="41" y="570" fill="#f6faf5" font-size="21">percent as wide as the arm circumference</text><text x="41" y="597" fill="#f6faf5" font-size="21">and long enough to wrap about 80 percent</text><text x="41" y="624" fill="#f6faf5" font-size="21">around the arm, which distributes pressure</text><text x="41" y="651" fill="#f6faf5" font-size="21">evenly over the artery.</text></g></svg>