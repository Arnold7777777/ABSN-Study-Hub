<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is administering an IM injection of an irritating medication using the Z-track technique. Which of the following actions should the nurse take? (Select all that apply.)</title><desc>THE Z-TRACK METHOD SEALS MEDICATION IN THE MUSCLE: DISPLACE THE SKIN LATERALLY, INJECT AT 90 DEGREES, WAIT 10 SEC, WITHDRAW, THEN RELEASE THE TISSUE SO THE TRACK ZIGZAGS SHUT. Massaging would force the irritating drug back into subcutaneous tissue, causing pain and staining. The deltoid tolerates only about 1 mL, so a 3 mL dose requires the ventrogluteal site.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Z-Track Technique</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is administering an IM injection</text><text x="41" y="198" fill="#f6faf5" font-size="21">of an irritating medication using the</text><text x="41" y="225" fill="#f6faf5" font-size="21">Z-track technique. Which of the following</text><text x="41" y="252" fill="#f6faf5" font-size="21">actions should the nurse take? (Select all</text><text x="41" y="279" fill="#f6faf5" font-size="21">that apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Pull the skin and subcutaneous tissue 2.5</text><text x="41" y="411" fill="#f6faf5" font-size="21">to 3.5 cm (1 to 1.5 in) laterally before</text><text x="41" y="438" fill="#f6faf5" font-size="21">inserting the needle · Insert the needle</text><text x="41" y="465" fill="#f6faf5" font-size="21">at a 90-degree angle · Wait about 10</text><text x="41" y="492" fill="#f6faf5" font-size="21">seconds after injecting…</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">THE Z-TRACK METHOD SEALS MEDICATION IN THE</text><text x="41" y="624" fill="#f6faf5" font-size="21">MUSCLE: DISPLACE THE SKIN LATERALLY,</text><text x="41" y="651" fill="#f6faf5" font-size="21">INJECT AT 90 DEGREES, WAIT 10 SEC,</text><text x="41" y="678" fill="#f6faf5" font-size="21">WITHDRAW, THEN RELEASE THE TISSUE SO THE</text><text x="41" y="705" fill="#f6faf5" font-size="21">TRACK ZIGZAGS SHUT.</text></g></svg>