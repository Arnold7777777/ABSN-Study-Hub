<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>On day 7 of heparin therapy a client&#x27;s platelets drop from 220,000 to 90,000 in 48 hours. Which actions does the nurse take? Select all that apply.</title><desc>This is HIT: stop the heparin, follow daily platelet counts, notify, and assess for clot , because HIT clots as well as bleeds. Vitamin K is warfarin&#x27;s antidote, and starting warfarin now is contraindicated - the falling platelet count makes bleeding look like the only risk, which is the trap.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematologic Disorders</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">On day 7 of heparin therapy a client&#x27;s</text><text x="41" y="198" fill="#f6faf5" font-size="21">platelets drop from 220,000 to 90,000 in</text><text x="41" y="225" fill="#f6faf5" font-size="21">48 hours. Which actions does the nurse</text><text x="41" y="252" fill="#f6faf5" font-size="21">take? Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Stop the heparin · Obtain daily platelet</text><text x="41" y="384" fill="#f6faf5" font-size="21">counts · Assess for signs of thrombosis</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">This is HIT: stop the heparin, follow</text><text x="41" y="516" fill="#f6faf5" font-size="21">daily platelet counts, notify, and assess</text><text x="41" y="543" fill="#f6faf5" font-size="21">for clot , because HIT clots as well as</text><text x="41" y="570" fill="#f6faf5" font-size="21">bleeds. Vitamin K is warfarin&#x27;s antidote,</text><text x="41" y="597" fill="#f6faf5" font-size="21">and starting warfarin now is</text><text x="41" y="624" fill="#f6faf5" font-size="21">contraindicated - the falling platelet</text><text x="41" y="651" fill="#f6faf5" font-size="21">count makes bleeding look like the only</text><text x="41" y="678" fill="#f6faf5" font-size="21">risk, which is the trap.</text></g></svg>