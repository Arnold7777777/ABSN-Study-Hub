<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>The health care team is evaluating a ventilated client with a catastrophic brain injury for brain death. Which findings are consistent with brain death? Select all that apply.</title><desc>Brain death requires coma, absent brainstem reflexes, and apnea (no breaths when taken off the ventilator during an apnea test); an EEG with no activity can confirm it. Posturing is a motor response that comes from a functioning brainstem, so it rules brain death out, and a GCS of 8 still shows responses.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic Dysfunction &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Cerebrovascular Disorders</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">The health care team is evaluating a</text><text x="41" y="231" fill="#f6faf5" font-size="21">ventilated client with a catastrophic</text><text x="41" y="258" fill="#f6faf5" font-size="21">brain injury for brain death. Which</text><text x="41" y="285" fill="#f6faf5" font-size="21">findings are consistent with brain death?</text><text x="41" y="312" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Coma with no response to any stimulus ·</text><text x="41" y="444" fill="#f6faf5" font-size="21">Absent cough and gag reflexes · No</text><text x="41" y="471" fill="#f6faf5" font-size="21">spontaneous breaths when the ventilator is</text><text x="41" y="498" fill="#f6faf5" font-size="21">disconnected during an apnea test</text><path d="M319 522v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="538" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 551) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="572" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="603" fill="#f6faf5" font-size="21">Brain death requires coma, absent</text><text x="41" y="630" fill="#f6faf5" font-size="21">brainstem reflexes, and apnea (no breaths</text><text x="41" y="657" fill="#f6faf5" font-size="21">when taken off the ventilator during an</text><text x="41" y="684" fill="#f6faf5" font-size="21">apnea test);</text></g></svg>