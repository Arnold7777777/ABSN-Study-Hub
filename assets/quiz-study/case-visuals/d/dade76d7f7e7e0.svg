<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A 22-year-old client reports vaginal discharge and pelvic pain that has come and gone for several months and asks to be tested for a sexually transmitted infection. Which nursing actions are appropriate? Select all that apply.</title><desc>The workup begins by asking duration , since months of symptoms suggests PID, and the diagnostic specimen is a cervical swab , with partners treated as well. Blood and urine feel like the familiar answers but are not the specimen used for this workup, and a pelvic ultrasound is added only when PID is suspected.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Reproductive Disorders</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 22-year-old client reports vaginal</text><text x="41" y="198" fill="#f6faf5" font-size="21">discharge and pelvic pain that has come</text><text x="41" y="225" fill="#f6faf5" font-size="21">and gone for several months and asks to be</text><text x="41" y="252" fill="#f6faf5" font-size="21">tested for a sexually transmitted</text><text x="41" y="279" fill="#f6faf5" font-size="21">infection.</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Ask how long the symptoms have been going</text><text x="41" y="411" fill="#f6faf5" font-size="21">on · Obtain a cervical swab for testing ·</text><text x="41" y="438" fill="#f6faf5" font-size="21">Explain that her sexual partners also need</text><text x="41" y="465" fill="#f6faf5" font-size="21">to be treated</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">The workup begins by asking duration ,</text><text x="41" y="597" fill="#f6faf5" font-size="21">since months of symptoms suggests PID, and</text><text x="41" y="624" fill="#f6faf5" font-size="21">the diagnostic specimen is a cervical swab</text><text x="41" y="651" fill="#f6faf5" font-size="21">, with partners treated as well.</text></g></svg>