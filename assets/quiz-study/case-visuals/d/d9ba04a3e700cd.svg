<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse is preparing to administer morning medications to a client with dysphagia. Which action should the nurse take FIRST?</title><desc>CHECK THE FORMULATION FIRST — a liquid form may exist, and NOT EVERY TABLET CAN BE CRUSHED (never crush enteric-coated or extended-release, which would dump the entire dose at once). Crushing everything is therefore unsafe, a large glass of water increases aspiration risk in dysphagia, and holding all the medications is premature before you&#x27;ve explored a safe route.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Dysphagia</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is preparing to administer morning</text><text x="41" y="198" fill="#f6faf5" font-size="21">medications to a client with dysphagia.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which action should the nurse take FIRST?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Verify whether any medications are</text><text x="41" y="357" fill="#f6faf5" font-size="21">available in liquid form or may be crushed</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">CHECK THE FORMULATION FIRST — a liquid</text><text x="41" y="489" fill="#f6faf5" font-size="21">form may exist, and NOT EVERY TABLET CAN</text><text x="41" y="516" fill="#f6faf5" font-size="21">BE CRUSHED (never crush enteric-coated or</text><text x="41" y="543" fill="#f6faf5" font-size="21">extended-release, which would dump the</text><text x="41" y="570" fill="#f6faf5" font-size="21">entire dose at once).</text></g></svg>