<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>A nurse is reinforcing discharge teaching with a client who had premature rupture of membranes at 26 weeks of gestation. Which instruction should the nurse include?</title><desc>With the membranes open, infection and cord compression are the two threats , and daily kick counts are how she monitors the fetus at home. She also takes her temperature, watches for foul-smelling drainage, and puts nothing in the vagina - no tampons, no douching, no intercourse - and showers rather than sitting in a tub.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is reinforcing discharge teaching</text><text x="41" y="198" fill="#f6faf5" font-size="21">with a client who had premature rupture of</text><text x="41" y="225" fill="#f6faf5" font-size="21">membranes at 26 weeks of gestation. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">instruction should the nurse include?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">“Keep a daily record of your kick counts.”</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">With the membranes open, infection and</text><text x="41" y="489" fill="#f6faf5" font-size="21">cord compression are the two threats , and</text><text x="41" y="516" fill="#f6faf5" font-size="21">daily kick counts are how she monitors the</text><text x="41" y="543" fill="#f6faf5" font-size="21">fetus at home.</text></g></svg>