<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>According to Erikson, which stage is a 4-year-old working through?</title><desc>Trust vs mistrust - birth to 1. Autonomy vs shame and doubt - 1 to 3, which is why routines and choices matter so much to a toddler. Initiative vs guilt - 3 to 6. Industry vs inferiority - 6 to 12. Identity vs role confusion - 12 to 20.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">According to Erikson, which stage is a</text><text x="41" y="198" fill="#f6faf5" font-size="21">4-year-old working through?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Initiative versus guilt</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">Trust vs mistrust - birth to 1. Autonomy</text><text x="41" y="435" fill="#f6faf5" font-size="21">vs shame and doubt - 1 to 3, which is why</text><text x="41" y="462" fill="#f6faf5" font-size="21">routines and choices matter so much to a</text><text x="41" y="489" fill="#f6faf5" font-size="21">toddler. Initiative vs guilt - 3 to 6.</text><text x="41" y="516" fill="#f6faf5" font-size="21">Industry vs inferiority - 6 to 12.</text><text x="41" y="543" fill="#f6faf5" font-size="21">Identity vs role confusion - 12 to 20.</text></g></svg>