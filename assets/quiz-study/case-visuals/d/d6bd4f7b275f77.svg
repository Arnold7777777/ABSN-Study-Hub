<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>Which nurse statement demonstrates empathy rather than sympathy?</title><desc>Empathy names and validates the client&#x27;s feeling while the nurse stays professionally objective. Sympathy shares the nurse&#x27;s own feelings and shifts the focus onto the nurse, which is nontherapeutic — and no one can know exactly how another person feels.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which nurse statement demonstrates empathy</text><text x="41" y="231" fill="#f6faf5" font-size="21">rather than sympathy?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">You must feel overwhelmed by everything</text><text x="41" y="363" fill="#f6faf5" font-size="21">that has happened.</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">Empathy names and validates the client&#x27;s</text><text x="41" y="495" fill="#f6faf5" font-size="21">feeling while the nurse stays</text><text x="41" y="522" fill="#f6faf5" font-size="21">professionally objective. Sympathy shares</text><text x="41" y="549" fill="#f6faf5" font-size="21">the nurse&#x27;s own feelings and shifts the</text><text x="41" y="576" fill="#f6faf5" font-size="21">focus onto the nurse, which is</text><text x="41" y="603" fill="#f6faf5" font-size="21">nontherapeutic — and no one can know</text><text x="41" y="630" fill="#f6faf5" font-size="21">exactly how another person feels.</text></g></svg>