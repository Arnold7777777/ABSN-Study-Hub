<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A client at 30 weeks says, &quot;I am having a hard time with how much my body has changed.&quot; What is the nurse&#x27;s best response?</title><desc>Normalizing her feelings acknowledges them without judging. Body-image concerns are common and can coexist with healthy attachment. Labeling her as not adapting, promising fast weight loss, or dismissing the feeling all close off the conversation.</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 30 weeks says, &quot;I am having a</text><text x="41" y="231" fill="#f6faf5" font-size="21">hard time with how much my body has</text><text x="41" y="258" fill="#f6faf5" font-size="21">changed.&quot; What is the nurse&#x27;s best</text><text x="41" y="285" fill="#f6faf5" font-size="21">response?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">&quot;Many women have mixed feelings about</text><text x="41" y="417" fill="#f6faf5" font-size="21">their changing bodies while still feeling</text><text x="41" y="444" fill="#f6faf5" font-size="21">close to their baby.&quot;</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Normalizing her feelings acknowledges them</text><text x="41" y="576" fill="#f6faf5" font-size="21">without judging. Body-image concerns are</text><text x="41" y="603" fill="#f6faf5" font-size="21">common and can coexist with healthy</text><text x="41" y="630" fill="#f6faf5" font-size="21">attachment. Labeling her as not adapting,</text><text x="41" y="657" fill="#f6faf5" font-size="21">promising fast weight loss, or dismissing</text><text x="41" y="684" fill="#f6faf5" font-size="21">the feeling all close off the</text><text x="41" y="711" fill="#f6faf5" font-size="21">conversation.</text></g></svg>