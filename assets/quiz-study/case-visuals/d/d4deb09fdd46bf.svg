<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="458" viewBox="0 0 640 458"><title>Distinguishing ODD from Conduct Disorder</title><desc>ODD is a pattern of angry, argumentative, defiant behavior toward authority without serious violation of others&#x27; rights. Conduct disorder involves persistent violation of the basic rights of others and major societal norms.</desc><rect width="640" height="458" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Distinguishing ODD from Conduct Disorder</text><path d="M319 195v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="211" width="594" height="222" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 224) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="245" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="276" fill="#f6faf5" font-size="21">ODD is a pattern of angry, argumentative,</text><text x="41" y="303" fill="#f6faf5" font-size="21">defiant behavior toward authority without</text><text x="41" y="330" fill="#f6faf5" font-size="21">serious violation of others&#x27; rights.</text><text x="41" y="357" fill="#f6faf5" font-size="21">Conduct disorder involves persistent</text><text x="41" y="384" fill="#f6faf5" font-size="21">violation of the basic rights of others</text><text x="41" y="411" fill="#f6faf5" font-size="21">and major societal norms.</text></g></svg>