<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is providing education to a parent of a 12-month-old who is scheduled to receive the first dose of the measles, mumps, and rubella (MMR) vaccine. Which statement by the parent indicates a need for further teaching?</title><desc>Mild respiratory symptoms are not a reason to delay vaccination ; only moderate to severe illness warrants postponement. Measles can cause serious complications, mild fever or rash after the vaccine is common, and the second MMR dose is given at 4 to 6 years before school entry.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">MMR immunization teaching</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 7H55V58H10Z"/><path d="M17 14H48V25H17ZM17 34H23M30 34H36M43 34H48M17 44H23M30 44H36M43 44H48"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is providing education to a parent</text><text x="41" y="198" fill="#f6faf5" font-size="21">of a 12-month-old who is scheduled to</text><text x="41" y="225" fill="#f6faf5" font-size="21">receive the first dose of the measles,</text><text x="41" y="252" fill="#f6faf5" font-size="21">mumps, and rubella (MMR) vaccine.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">I should delay the vaccine if my child has</text><text x="41" y="384" fill="#f6faf5" font-size="21">a mild cold or runny nose.</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Mild respiratory symptoms are not a reason</text><text x="41" y="516" fill="#f6faf5" font-size="21">to delay vaccination ; only moderate to</text><text x="41" y="543" fill="#f6faf5" font-size="21">severe illness warrants postponement.</text><text x="41" y="570" fill="#f6faf5" font-size="21">Measles can cause serious complications,</text><text x="41" y="597" fill="#f6faf5" font-size="21">mild fever or rash after the vaccine is</text><text x="41" y="624" fill="#f6faf5" font-size="21">common, and the second MMR dose is given</text><text x="41" y="651" fill="#f6faf5" font-size="21">at 4 to 6 years before school entry.</text></g></svg>