<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>An 8-year-old has a serum calcium of 7.4 mg/dL. When the nurse taps the cheek over the facial nerve, the cheek twitches. Which additional finding should the nurse expect?</title><desc>The cheek tap producing a facial twitch is Chvostek sign , and its partner in hypocalcemia is Trousseau sign , carpal spasm when the cuff is inflated. A low phosphorus is the tempting choice, but calcium and phosphorus move inversely , so a calcium of 7.4 mg/dL (below the normal 8.8-10.4 mg/dL) goes with a high phosphorus.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Endocrine &amp; Metabolic</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An 8-year-old has a serum calcium of 7.4</text><text x="41" y="198" fill="#f6faf5" font-size="21">mg/dL. When the nurse taps the cheek over</text><text x="41" y="225" fill="#f6faf5" font-size="21">the facial nerve, the cheek twitches.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which additional finding should the nurse</text><text x="41" y="279" fill="#f6faf5" font-size="21">expect?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Carpal spasm when a blood pressure cuff is</text><text x="41" y="411" fill="#f6faf5" font-size="21">inflated on the arm</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The cheek tap producing a facial twitch is</text><text x="41" y="543" fill="#f6faf5" font-size="21">Chvostek sign , and its partner in</text><text x="41" y="570" fill="#f6faf5" font-size="21">hypocalcemia is Trousseau sign , carpal</text><text x="41" y="597" fill="#f6faf5" font-size="21">spasm when the cuff is inflated.</text></g></svg>