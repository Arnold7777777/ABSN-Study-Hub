<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>The plan of care states that the client will ambulate 20 feet with a walker and standby assistance by postoperative day 2. Which finding indicates the goal was met?</title><desc>The goal specified distance, device, level of assistance, and deadline, and this finding meets or exceeds every element . Walking 20 feet with two staff physically supporting the client is the tempting choice because the distance matches, but physical support is more help than standby assistance, so the goal was only partially met.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Ambulation Goal Evaluation</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The plan of care states that the client</text><text x="41" y="198" fill="#f6faf5" font-size="21">will ambulate 20 feet with a walker and</text><text x="41" y="225" fill="#f6faf5" font-size="21">standby assistance by postoperative day 2.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which finding indicates the goal was met?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">On day 2 the client walked 25 feet with a</text><text x="41" y="384" fill="#f6faf5" font-size="21">walker while the nurse walked alongside</text><text x="41" y="411" fill="#f6faf5" font-size="21">without touching the client</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The goal specified distance, device, level</text><text x="41" y="543" fill="#f6faf5" font-size="21">of assistance, and deadline, and this</text><text x="41" y="570" fill="#f6faf5" font-size="21">finding meets or exceeds every element .</text></g></svg>