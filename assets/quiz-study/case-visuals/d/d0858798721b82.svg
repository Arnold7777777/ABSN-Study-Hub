<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A nurse explains psychoimmunology to a client. Which statement is correct?</title><desc>Psychoimmunology looks at how stress and immune function interact and may contribute to illness. Genetics is a separate cause category, and no evidence supports immunizations as a cause.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Response to Illness &amp; Mental-</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Health Assessment</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse explains psychoimmunology to a</text><text x="41" y="231" fill="#f6faf5" font-size="21">client. Which statement is correct?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Prolonged stress can compromise the immune</text><text x="41" y="363" fill="#f6faf5" font-size="21">system and may contribute to the</text><text x="41" y="390" fill="#f6faf5" font-size="21">development of illness</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Psychoimmunology looks at how stress and</text><text x="41" y="522" fill="#f6faf5" font-size="21">immune function interact and may</text><text x="41" y="549" fill="#f6faf5" font-size="21">contribute to illness. Genetics is a</text><text x="41" y="576" fill="#f6faf5" font-size="21">separate cause category, and no evidence</text><text x="41" y="603" fill="#f6faf5" font-size="21">supports immunizations as a cause.</text></g></svg>