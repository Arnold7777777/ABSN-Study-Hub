<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A newborn of a client with diabetes is jittery at 1 hour of age. What should the nurse do first?</title><desc>The infant of a diabetic mother has been making extra insulin in response to the mother&#x27;s glucose, and that supply stops at birth. Jitteriness means check the blood glucose ; hypoglycemia in the newborn is often otherwise silent and is treated with early feeding.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Normal Newborn &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Thermoregulation</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A newborn of a client with diabetes is</text><text x="41" y="231" fill="#f6faf5" font-size="21">jittery at 1 hour of age. What should the</text><text x="41" y="258" fill="#f6faf5" font-size="21">nurse do first?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Check a blood glucose level</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">The infant of a diabetic mother has been</text><text x="41" y="495" fill="#f6faf5" font-size="21">making extra insulin in response to the</text><text x="41" y="522" fill="#f6faf5" font-size="21">mother&#x27;s glucose, and that supply stops at</text><text x="41" y="549" fill="#f6faf5" font-size="21">birth. Jitteriness means check the blood</text><text x="41" y="576" fill="#f6faf5" font-size="21">glucose ; hypoglycemia in the newborn is</text><text x="41" y="603" fill="#f6faf5" font-size="21">often otherwise silent and is treated with</text><text x="41" y="630" fill="#f6faf5" font-size="21">early feeding.</text></g></svg>