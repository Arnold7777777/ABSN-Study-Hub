<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A client is scheduled to undergo tonometry to assess intraocular pressure. Which medication should the nurse advise the client to withhold on the morning of the procedure?</title><desc>Timolol drops are used to lower intraocular pressure, so a morning dose would alter the pressure the tonometry is trying to measure ; the provider wants a reading before the drops are given. Timolol is also a beta blocker, so check pulse and blood pressure if a client on the drops reports dizziness.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Tonometry / glaucoma</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client is scheduled to undergo tonometry</text><text x="41" y="198" fill="#f6faf5" font-size="21">to assess intraocular pressure. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">medication should the nurse advise the</text><text x="41" y="252" fill="#f6faf5" font-size="21">client to withhold on the morning of the</text><text x="41" y="279" fill="#f6faf5" font-size="21">procedure?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Timolol eye drops</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Timolol drops are used to lower</text><text x="41" y="516" fill="#f6faf5" font-size="21">intraocular pressure, so a morning dose</text><text x="41" y="543" fill="#f6faf5" font-size="21">would alter the pressure the tonometry is</text><text x="41" y="570" fill="#f6faf5" font-size="21">trying to measure ; the provider wants a</text><text x="41" y="597" fill="#f6faf5" font-size="21">reading before the drops are given.</text><text x="41" y="624" fill="#f6faf5" font-size="21">Timolol is also a beta blocker, so check</text><text x="41" y="651" fill="#f6faf5" font-size="21">pulse and blood pressure if a client on</text><text x="41" y="678" fill="#f6faf5" font-size="21">the drops reports dizziness.</text></g></svg>