<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A nurse cares for clients from many backgrounds at a neighborhood clinic. Select all actions that reflect culturally responsive care.</title><desc>Culturally responsive care means asking this person about this person, and staying aware of your own assumptions. Group patterns can guide what to ask about, but using them to decide the plan is stereotyping. Every client is an individual, and treating them otherwise leads to wrong care.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Vulnerable Populations</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse cares for clients from many</text><text x="41" y="198" fill="#f6faf5" font-size="21">backgrounds at a neighborhood clinic.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Select all actions that reflect culturally</text><text x="41" y="252" fill="#f6faf5" font-size="21">responsive care.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Asking the client which health practices</text><text x="41" y="384" fill="#f6faf5" font-size="21">matter most to them · Recognizing one&#x27;s</text><text x="41" y="411" fill="#f6faf5" font-size="21">own biases and how they affect care ·</text><text x="41" y="438" fill="#f6faf5" font-size="21">Recording and using the client&#x27;s stated</text><text x="41" y="465" fill="#f6faf5" font-size="21">name and pronouns</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Culturally responsive care means asking</text><text x="41" y="597" fill="#f6faf5" font-size="21">this person about this person, and staying</text><text x="41" y="624" fill="#f6faf5" font-size="21">aware of your own assumptions. Group</text><text x="41" y="651" fill="#f6faf5" font-size="21">patterns can guide what to ask about, but</text><text x="41" y="678" fill="#f6faf5" font-size="21">using them to decide the plan is</text><text x="41" y="705" fill="#f6faf5" font-size="21">stereotyping. Every client is an</text><text x="41" y="732" fill="#f6faf5" font-size="21">individual, and treating them otherwise</text><text x="41" y="759" fill="#f6faf5" font-size="21">leads to wrong care.</text></g></svg>