<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="812" viewBox="0 0 640 812"><title>Which newborn findings require the nurse to notify the provider? Select all that apply.</title><desc>A rate over 60 after the transition period, grunting or flaring, and jaundice within the first 24 hours (which suggests hemolysis rather than physiologic jaundice) are all reported, as is a cluster of features suggesting a chromosomal difference. Milia are normal and disappear on their own.</desc><rect width="640" height="812" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">The Normal Newborn &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Thermoregulation</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which newborn findings require the nurse</text><text x="41" y="231" fill="#f6faf5" font-size="21">to notify the provider? Select all that</text><text x="41" y="258" fill="#f6faf5" font-size="21">apply.</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Respiratory rate of 74 breaths per minute</text><text x="41" y="390" fill="#f6faf5" font-size="21">at 6 hours of age · Grunting and nasal</text><text x="41" y="417" fill="#f6faf5" font-size="21">flaring · Jaundice appearing in the first</text><text x="41" y="444" fill="#f6faf5" font-size="21">24 hours · A single palmar crease with</text><text x="41" y="471" fill="#f6faf5" font-size="21">upslanting eyes and a flat…</text><path d="M319 495v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="511" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 524) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="545" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="576" fill="#f6faf5" font-size="21">A rate over 60 after the transition</text><text x="41" y="603" fill="#f6faf5" font-size="21">period, grunting or flaring, and jaundice</text><text x="41" y="630" fill="#f6faf5" font-size="21">within the first 24 hours (which suggests</text><text x="41" y="657" fill="#f6faf5" font-size="21">hemolysis rather than physiologic</text><text x="41" y="684" fill="#f6faf5" font-size="21">jaundice) are all reported, as is a</text><text x="41" y="711" fill="#f6faf5" font-size="21">cluster of features suggesting a</text><text x="41" y="738" fill="#f6faf5" font-size="21">chromosomal difference. Milia are normal</text><text x="41" y="765" fill="#f6faf5" font-size="21">and disappear on their own.</text></g></svg>