<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Client teaching for lamotrigine (Lamictal) should include which instructions?</title><desc>Lamotrigine carries a risk of Stevens-Johnson Syndrome (SJS), a life-threatening skin rash. Clients must report ANY rash immediately so the drug can be discontinued. Weight gain is not a major concern with lamotrigine. Food administration and dependence are not the priority teaching points.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Client teaching for lamotrigine (Lamictal)</text><text x="41" y="198" fill="#f6faf5" font-size="21">should include which instructions?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Report any rashes to your doctor</text><text x="41" y="330" fill="#f6faf5" font-size="21">immediately.</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Lamotrigine carries a risk of Stevens-</text><text x="41" y="462" fill="#f6faf5" font-size="21">Johnson Syndrome (SJS), a life-threatening</text><text x="41" y="489" fill="#f6faf5" font-size="21">skin rash. Clients must report ANY rash</text><text x="41" y="516" fill="#f6faf5" font-size="21">immediately so the drug can be</text><text x="41" y="543" fill="#f6faf5" font-size="21">discontinued. Weight gain is not a major</text><text x="41" y="570" fill="#f6faf5" font-size="21">concern with lamotrigine. Food</text><text x="41" y="597" fill="#f6faf5" font-size="21">administration and dependence are not the</text><text x="41" y="624" fill="#f6faf5" font-size="21">priority teaching points.</text></g></svg>