<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A client with agoraphobia has not left home in a year and says staying in is the only thing that keeps her calm. Which mechanism explains why avoidance perpetuates her anxiety?</title><desc>Escaping the feared situation produces instant anxiety relief, which negatively reinforces the avoidance, and because the client never stays long enough to learn the feared outcome does not occur, extinction of the conditioned fear cannot occur. The other options misapply mechanisms belonging to GABA pharmacology, memory anatomy, and tardive dyskinesia. This is the rationale for graded exposure, and the nurse prepares the client for anxiety to rise before it falls.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with agoraphobia has not left</text><text x="41" y="198" fill="#f6faf5" font-size="21">home in a year and says staying in is the</text><text x="41" y="225" fill="#f6faf5" font-size="21">only thing that keeps her calm. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">mechanism explains why avoidance</text><text x="41" y="279" fill="#f6faf5" font-size="21">perpetuates her anxiety?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Avoidance is negatively reinforced by</text><text x="41" y="411" fill="#f6faf5" font-size="21">immediate relief and prevents extinction</text><text x="41" y="438" fill="#f6faf5" font-size="21">learning</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Escaping the feared situation produces</text><text x="41" y="570" fill="#f6faf5" font-size="21">instant anxiety relief, which negatively</text><text x="41" y="597" fill="#f6faf5" font-size="21">reinforces the avoidance, and because the</text><text x="41" y="624" fill="#f6faf5" font-size="21">client never stays long enough to learn</text><text x="41" y="651" fill="#f6faf5" font-size="21">the feared outcome does not occur,</text><text x="41" y="678" fill="#f6faf5" font-size="21">extinction of the conditioned fear cannot</text><text x="41" y="705" fill="#f6faf5" font-size="21">occur.</text></g></svg>