<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A 60-year-old post-op patient is receiving potassium chloride 10 mEq in 100 mL NS IV peripherally. Which nursing actions are appropriate? Select all that apply.</title><desc>Pump plus cardiac monitor plus frequent site checks is the potassium safety trio. PERIPHERAL MAX IS ABOUT 10 mEq/hr - higher concentrations require a central line. Never massage a burning site: burning signals phlebitis or infiltration, so STOP the infusion.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">IV Potassium Safety</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 60-year-old post-op patient is receiving</text><text x="41" y="198" fill="#f6faf5" font-size="21">potassium chloride 10 mEq in 100 mL NS IV</text><text x="41" y="225" fill="#f6faf5" font-size="21">peripherally. Which nursing actions are</text><text x="41" y="252" fill="#f6faf5" font-size="21">appropriate? Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Infuse the potassium on an electronic</text><text x="41" y="384" fill="#f6faf5" font-size="21">infusion pump · Maintain continuous</text><text x="41" y="411" fill="#f6faf5" font-size="21">cardiac monitoring during the infusion ·</text><text x="41" y="438" fill="#f6faf5" font-size="21">Assess the IV site frequently for burning,</text><text x="41" y="465" fill="#f6faf5" font-size="21">redness, or swelling</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Pump plus cardiac monitor plus frequent</text><text x="41" y="597" fill="#f6faf5" font-size="21">site checks is the potassium safety trio.</text><text x="41" y="624" fill="#f6faf5" font-size="21">PERIPHERAL MAX IS ABOUT 10 mEq/hr - higher</text><text x="41" y="651" fill="#f6faf5" font-size="21">concentrations require a central line.</text><text x="41" y="678" fill="#f6faf5" font-size="21">Never massage a burning site: burning</text><text x="41" y="705" fill="#f6faf5" font-size="21">signals phlebitis or infiltration, so STOP</text><text x="41" y="732" fill="#f6faf5" font-size="21">the infusion.</text></g></svg>