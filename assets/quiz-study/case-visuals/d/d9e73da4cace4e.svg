<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Four hours after surgery a client is restless and pale with cool clammy skin, a heart rate of 124/min, and a blood pressure of 88/54 mm Hg. Which action should the nurse take first?</title><desc>Restlessness, pallor, diaphoresis, tachycardia, and hypotension are the classic picture of postoperative hemorrhage and impending shock, which requires immediate provider notification while the nurse stays with the client. Waiting 30 minutes to recheck allows a deteriorating client to lose more volume.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Postoperative Hemorrhage</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Four hours after surgery a client is</text><text x="41" y="198" fill="#f6faf5" font-size="21">restless and pale with cool clammy skin, a</text><text x="41" y="225" fill="#f6faf5" font-size="21">heart rate of 124/min, and a blood</text><text x="41" y="252" fill="#f6faf5" font-size="21">pressure of 88/54 mm Hg. Which action</text><text x="41" y="279" fill="#f6faf5" font-size="21">should the nurse take first?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Notify the surgeon immediately</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Restlessness, pallor, diaphoresis,</text><text x="41" y="516" fill="#f6faf5" font-size="21">tachycardia, and hypotension are the</text><text x="41" y="543" fill="#f6faf5" font-size="21">classic picture of postoperative</text><text x="41" y="570" fill="#f6faf5" font-size="21">hemorrhage and impending shock, which</text><text x="41" y="597" fill="#f6faf5" font-size="21">requires immediate provider notification</text><text x="41" y="624" fill="#f6faf5" font-size="21">while the nurse stays with the client.</text><text x="41" y="651" fill="#f6faf5" font-size="21">Waiting 30 minutes to recheck allows a</text><text x="41" y="678" fill="#f6faf5" font-size="21">deteriorating client to lose more volume.</text></g></svg>