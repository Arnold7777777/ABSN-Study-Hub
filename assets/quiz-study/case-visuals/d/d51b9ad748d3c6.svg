<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>174. A client with frequent angina asks about non-pharmacologic measures during an acute episode. Which is most appropriate?</title><desc>b. Rest reduces cardiac oxygen demand during ischemic chest pain. Walking increases demand; Valsalva stresses the heart; cold can cause vasoconstriction/esophageal spasm.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">174. A client with frequent angina asks</text><text x="41" y="198" fill="#f6faf5" font-size="21">about non-pharmacologic measures during an</text><text x="41" y="225" fill="#f6faf5" font-size="21">acute episode. Which is most appropriate?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">b. Rest reduces cardiac oxygen demand</text><text x="41" y="357" fill="#f6faf5" font-size="21">during ischemic chest pain. Walking</text><text x="41" y="384" fill="#f6faf5" font-size="21">increases demand; Valsalva stresses the</text><text x="41" y="411" fill="#f6faf5" font-size="21">heart; cold can cause</text><text x="41" y="438" fill="#f6faf5" font-size="21">vasoconstriction/esophageal spasm.</text></g></svg>