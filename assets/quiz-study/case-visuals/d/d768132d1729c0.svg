<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="650" viewBox="0 0 640 650"><title>A client is brought in after a major fall. He was briefly unconscious at the scene, then woke and talked normally with the paramedics for about 30 minutes. He is now difficult to arouse. Which injury does the nurse suspect?</title><desc>The lucid interval after major trauma — out, awake and fine, then out again — is the signature of an arterial epidural bleed, which moves fast. Subdural is the tempting answer, but it is venous and builds slowly over 24–48 hours to 2 weeks, typically in older adults on anticoagulants or with alcohol use.</desc><rect width="640" height="650" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Traumatic, Infectious, Oncologic &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Degenerative Neuro</text><rect x="23" y="139" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client is brought in after a major fall.</text><path d="M319 228v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="244" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 257) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="278" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="309" fill="#f6faf5" font-size="21">Epidural hematoma</text><path d="M319 333v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="349" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 362) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="383" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="414" fill="#f6faf5" font-size="21">The lucid interval after major trauma —</text><text x="41" y="441" fill="#f6faf5" font-size="21">out, awake and fine, then out again — is</text><text x="41" y="468" fill="#f6faf5" font-size="21">the signature of an arterial epidural</text><text x="41" y="495" fill="#f6faf5" font-size="21">bleed, which moves fast. Subdural is the</text><text x="41" y="522" fill="#f6faf5" font-size="21">tempting answer, but it is venous and</text><text x="41" y="549" fill="#f6faf5" font-size="21">builds slowly over 24–48 hours to 2 weeks,</text><text x="41" y="576" fill="#f6faf5" font-size="21">typically in older adults on</text><text x="41" y="603" fill="#f6faf5" font-size="21">anticoagulants or with alcohol use.</text></g></svg>