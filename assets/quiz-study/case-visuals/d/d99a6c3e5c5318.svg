<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client who has not been taking a prescribed antihypertensive tells the nurse, &#x27;I just stopped taking it.&#x27; Which response should the nurse avoid?</title><desc>A direct why question implies criticism, puts the client on the defensive, and usually produces an excuse rather than the real reason. The other options seek exactly the same information with wording that invites an honest answer, such as an unaffordable copay or an adverse effect.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Why Questions</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client who has not been taking a</text><text x="41" y="198" fill="#f6faf5" font-size="21">prescribed antihypertensive tells the</text><text x="41" y="225" fill="#f6faf5" font-size="21">nurse, &#x27;I just stopped taking it.&#x27; Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">response should the nurse avoid?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&#x27;Why did you stop taking a medication your</text><text x="41" y="384" fill="#f6faf5" font-size="21">provider prescribed?&#x27;</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">A direct why question implies criticism,</text><text x="41" y="516" fill="#f6faf5" font-size="21">puts the client on the defensive, and</text><text x="41" y="543" fill="#f6faf5" font-size="21">usually produces an excuse rather than the</text><text x="41" y="570" fill="#f6faf5" font-size="21">real reason. The other options seek</text><text x="41" y="597" fill="#f6faf5" font-size="21">exactly the same information with wording</text><text x="41" y="624" fill="#f6faf5" font-size="21">that invites an honest answer, such as an</text><text x="41" y="651" fill="#f6faf5" font-size="21">unaffordable copay or an adverse effect.</text></g></svg>