<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client at 39 weeks in the latent phase of labor has painful, uncoordinated contractions occurring every 60 seconds. Which concern should the nurse identify as the priority?</title><desc>Hypertonic contractions leave no relaxation interval , so the placenta cannot be perfused and fetal hypoxia is the priority; the nurse monitors FHR, gives oxygen, repositions, and anticipates tocolytics or cesarean. Maternal exhaustion is real but not the life threat, and these contractions are uncoordinated and ineffective, so they do not produce rapid dilation.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client at 39 weeks in the latent phase</text><text x="41" y="198" fill="#f6faf5" font-size="21">of labor has painful, uncoordinated</text><text x="41" y="225" fill="#f6faf5" font-size="21">contractions occurring every 60 seconds.</text><text x="41" y="252" fill="#f6faf5" font-size="21">Which concern should the nurse identify as</text><text x="41" y="279" fill="#f6faf5" font-size="21">the priority?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Fetal hypoxia from the loss of the</text><text x="41" y="411" fill="#f6faf5" font-size="21">relaxation interval between contractions</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Hypertonic contractions leave no</text><text x="41" y="543" fill="#f6faf5" font-size="21">relaxation interval , so the placenta</text><text x="41" y="570" fill="#f6faf5" font-size="21">cannot be perfused and fetal hypoxia is</text><text x="41" y="597" fill="#f6faf5" font-size="21">the priority;</text></g></svg>