<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A 4-month-old is prescribed 0.6 mL of an oral liquid. Which device should the nurse use?</title><desc>An oral syringe is the most precise device , and the smaller the syringe, the better the accuracy for a small volume. Medicine cups are not accurate below about 5 mL. Keep the syringe cap away from the child — it is a choking hazard.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Intro to Pediatric Nursing</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 4-month-old is prescribed 0.6 mL of an</text><text x="41" y="198" fill="#f6faf5" font-size="21">oral liquid. Which device should the nurse</text><text x="41" y="225" fill="#f6faf5" font-size="21">use?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">An oral syringe</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">An oral syringe is the most precise device</text><text x="41" y="462" fill="#f6faf5" font-size="21">, and the smaller the syringe, the better</text><text x="41" y="489" fill="#f6faf5" font-size="21">the accuracy for a small volume. Medicine</text><text x="41" y="516" fill="#f6faf5" font-size="21">cups are not accurate below about 5 mL.</text><text x="41" y="543" fill="#f6faf5" font-size="21">Keep the syringe cap away from the child —</text><text x="41" y="570" fill="#f6faf5" font-size="21">it is a choking hazard.</text></g></svg>