<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A student asks what cerebral perfusion pressure the brain needs. What does the nurse answer, using the NUR 258 course numbers?</title><desc>CPP = MAP − ICP. Your NUR 258 lecture uses a CPP goal above 50 mmHg, ideally 60–70 ; below that the brain is underperfused. 10–15 mmHg is a normal ICP. (The RegisteredNurseRN quiz gives 60–100 mmHg; your course numbers are the ones to use on your exam.)</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic Dysfunction &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Cerebrovascular Disorders</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A student asks what cerebral perfusion</text><text x="41" y="231" fill="#f6faf5" font-size="21">pressure the brain needs. What does the</text><text x="41" y="258" fill="#f6faf5" font-size="21">nurse answer, using the NUR 258 course</text><text x="41" y="285" fill="#f6faf5" font-size="21">numbers?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Above 50 mmHg, ideally 60 to 70 mmHg</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">CPP = MAP − ICP. Your NUR 258 lecture uses</text><text x="41" y="522" fill="#f6faf5" font-size="21">a CPP goal above 50 mmHg, ideally 60–70 ;</text><text x="41" y="549" fill="#f6faf5" font-size="21">below that the brain is underperfused.</text><text x="41" y="576" fill="#f6faf5" font-size="21">10–15 mmHg is a normal ICP. (The</text><text x="41" y="603" fill="#f6faf5" font-size="21">RegisteredNurseRN quiz gives 60–100 mmHg;</text><text x="41" y="630" fill="#f6faf5" font-size="21">your course numbers are the ones to use on</text><text x="41" y="657" fill="#f6faf5" font-size="21">your exam.)</text></g></svg>