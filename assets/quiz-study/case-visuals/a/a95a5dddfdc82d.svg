<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse is reinforcing teaching with a parent about bottle feeding. Which technique should the nurse include?</title><desc>A nipple kept full of formula keeps the newborn from swallowing air , which means less gas and less spitting up. Never prop a bottle - it risks aspiration and ear infections. Microwaving creates scalding hot spots, and leftover formula is discarded after a feeding because saliva has contaminated it.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is reinforcing teaching with a</text><text x="41" y="198" fill="#f6faf5" font-size="21">parent about bottle feeding. Which</text><text x="41" y="225" fill="#f6faf5" font-size="21">technique should the nurse include?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Keep the nipple full of formula throughout</text><text x="41" y="357" fill="#f6faf5" font-size="21">the feeding</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">A nipple kept full of formula keeps the</text><text x="41" y="489" fill="#f6faf5" font-size="21">newborn from swallowing air , which means</text><text x="41" y="516" fill="#f6faf5" font-size="21">less gas and less spitting up. Never prop</text><text x="41" y="543" fill="#f6faf5" font-size="21">a bottle - it risks aspiration and ear</text><text x="41" y="570" fill="#f6faf5" font-size="21">infections. Microwaving creates scalding</text><text x="41" y="597" fill="#f6faf5" font-size="21">hot spots, and leftover formula is</text><text x="41" y="624" fill="#f6faf5" font-size="21">discarded after a feeding because saliva</text><text x="41" y="651" fill="#f6faf5" font-size="21">has contaminated it.</text></g></svg>