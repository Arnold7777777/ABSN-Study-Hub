<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>A nurse is caring for four children admitted to a pediatric unit. Which child is at greatest risk for a stress reaction to hospitalization?</title><desc>The risk factors stack , and this child has most of them. Age 6 months to about 3–4 years is the peak-vulnerability window — old enough to miss the parent, too young to understand why. Add a first hospitalization that was unplanned (no preparation, no rehearsal) and an anxious parent , whom a toddler reads and mirrors. The 9-year-old had preparation and a planned admission. The 6-month-old has a parent rooming in and prior experience , both protective. The adolescent has peer support , which is what that age needs most. Calming the parent is an intervention for the child.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Stress reactions to</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">hospitalization</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is caring for four children</text><text x="41" y="231" fill="#f6faf5" font-size="21">admitted to a pediatric unit. Which child</text><text x="41" y="258" fill="#f6faf5" font-size="21">is at greatest risk for a stress reaction</text><text x="41" y="285" fill="#f6faf5" font-size="21">to hospitalization?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">A 2-year-old admitted through the</text><text x="41" y="417" fill="#f6faf5" font-size="21">emergency department for the first time,</text><text x="41" y="444" fill="#f6faf5" font-size="21">whose parent is visibly anxious</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">The risk factors stack , and this child</text><text x="41" y="576" fill="#f6faf5" font-size="21">has most of them.</text></g></svg>