<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="731" viewBox="0 0 640 731"><title>A client reports poor sleep, low appetite, feeling cold all the time, low mood, and increased pain sensitivity. Dysfunction of which neurotransmitter best accounts for this cluster?</title><desc>Serotonin regulates food intake, the sleep-wake cycle, temperature regulation, pain control, sexual behavior, and emotion — all of the reported symptoms at once. Acetylcholine also affects sleep-wake, but it does not govern appetite, temperature, and mood regulation.</desc><rect width="640" height="731" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Foundations, Neurobiology &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Psychopharm Basics</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client reports poor sleep, low appetite,</text><text x="41" y="231" fill="#f6faf5" font-size="21">feeling cold all the time, low mood, and</text><text x="41" y="258" fill="#f6faf5" font-size="21">increased pain sensitivity. Dysfunction of</text><text x="41" y="285" fill="#f6faf5" font-size="21">which neurotransmitter best accounts for</text><text x="41" y="312" fill="#f6faf5" font-size="21">this cluster?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Serotonin</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Serotonin regulates food intake, the</text><text x="41" y="549" fill="#f6faf5" font-size="21">sleep-wake cycle, temperature regulation,</text><text x="41" y="576" fill="#f6faf5" font-size="21">pain control, sexual behavior, and emotion</text><text x="41" y="603" fill="#f6faf5" font-size="21">— all of the reported symptoms at once.</text><text x="41" y="630" fill="#f6faf5" font-size="21">Acetylcholine also affects sleep-wake, but</text><text x="41" y="657" fill="#f6faf5" font-size="21">it does not govern appetite, temperature,</text><text x="41" y="684" fill="#f6faf5" font-size="21">and mood regulation.</text></g></svg>