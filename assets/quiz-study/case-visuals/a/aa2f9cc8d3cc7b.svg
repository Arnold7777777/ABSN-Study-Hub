<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="647" viewBox="0 0 640 647"><title>Ms. Okafor, 27, was admitted three days ago with a first episode of psychosis. Haloperidol was started on admission and the dose was increased yesterday afternoon. She takes no other medications. Her baseline on this unit has been alert, ambulatory, and talkative.</title><desc>Neuroleptic malignant syndrome begins as a small set of vital sign changes after a dose increase, becomes a muscle and kidney emergency within hours, and is judged resolved by temperature, rigidity, and creatine kinase rather than by the psychiatric symptoms still waiting underneath.</desc><rect width="640" height="647" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neuroleptic Malignant Syndrome</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Ms. Okafor, 27, was admitted three days</text><text x="41" y="198" fill="#f6faf5" font-size="21">ago with a first episode of psychosis.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Haloperidol was started on admission and</text><text x="41" y="252" fill="#f6faf5" font-size="21">the dose was increased yesterday</text><text x="41" y="279" fill="#f6faf5" font-size="21">afternoon. She takes no other medications.</text><text x="41" y="306" fill="#f6faf5" font-size="21">Her baseline…</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="276" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="411" fill="#f6faf5" font-size="21">Neuroleptic malignant syndrome begins as a</text><text x="41" y="438" fill="#f6faf5" font-size="21">small set of vital sign changes after a</text><text x="41" y="465" fill="#f6faf5" font-size="21">dose increase, becomes a muscle and kidney</text><text x="41" y="492" fill="#f6faf5" font-size="21">emergency within hours, and is judged</text><text x="41" y="519" fill="#f6faf5" font-size="21">resolved by temperature, rigidity, and</text><text x="41" y="546" fill="#f6faf5" font-size="21">creatine kinase rather than by the</text><text x="41" y="573" fill="#f6faf5" font-size="21">psychiatric symptoms still waiting</text><text x="41" y="600" fill="#f6faf5" font-size="21">underneath.</text></g></svg>