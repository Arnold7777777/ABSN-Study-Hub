<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A man tells the nurse he cannot take time off or attend a service after the death of his same-sex partner because his coworkers do not know about the relationship. This best illustrates:</title><desc>Disenfranchised grief is not socially recognized, publicly acknowledged, or openly supported — also seen with miscarriage, death of a pet or an ex-spouse, and staff grieving patients. The intensity is normal; what is missing is social permission to grieve.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Legal–Ethical Issues &amp; Grief</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A man tells the nurse he cannot take time</text><text x="41" y="198" fill="#f6faf5" font-size="21">off or attend a service after the death of</text><text x="41" y="225" fill="#f6faf5" font-size="21">his same-sex partner because his coworkers</text><text x="41" y="252" fill="#f6faf5" font-size="21">do not know about the relationship. This</text><text x="41" y="279" fill="#f6faf5" font-size="21">best illustrates:</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Disenfranchised grief</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Disenfranchised grief is not socially</text><text x="41" y="516" fill="#f6faf5" font-size="21">recognized, publicly acknowledged, or</text><text x="41" y="543" fill="#f6faf5" font-size="21">openly supported — also seen with</text><text x="41" y="570" fill="#f6faf5" font-size="21">miscarriage, death of a pet or an ex-</text><text x="41" y="597" fill="#f6faf5" font-size="21">spouse, and staff grieving patients. The</text><text x="41" y="624" fill="#f6faf5" font-size="21">intensity is normal; what is missing is</text><text x="41" y="651" fill="#f6faf5" font-size="21">social permission to grieve.</text></g></svg>