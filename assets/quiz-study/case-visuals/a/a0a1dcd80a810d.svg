<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A nurse evaluates whether a 5-day-old breastfed newborn is feeding adequately. Which findings indicate adequate intake? Select all that apply.</title><desc>Adequate intake shows as 6 to 8 wet diapers, at least 3 stools daily in the first month, and contentment between feeds , with birth weight regained by 10 to 14 days. Long sleep stretches at this age mean missed feedings, and expected weight loss is only 5 to 10%.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Newborn Feeding</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse evaluates whether a 5-day-old</text><text x="41" y="198" fill="#f6faf5" font-size="21">breastfed newborn is feeding adequately.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which findings indicate adequate intake?</text><text x="41" y="252" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Six to eight wet diapers per day · At</text><text x="41" y="384" fill="#f6faf5" font-size="21">least three loose yellow seedy stools per</text><text x="41" y="411" fill="#f6faf5" font-size="21">day · Content and settled between feedings</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Adequate intake shows as 6 to 8 wet</text><text x="41" y="543" fill="#f6faf5" font-size="21">diapers, at least 3 stools daily in the</text><text x="41" y="570" fill="#f6faf5" font-size="21">first month, and contentment between feeds</text><text x="41" y="597" fill="#f6faf5" font-size="21">, with birth weight regained by 10 to 14</text><text x="41" y="624" fill="#f6faf5" font-size="21">days. Long sleep stretches at this age</text><text x="41" y="651" fill="#f6faf5" font-size="21">mean missed feedings, and expected weight</text><text x="41" y="678" fill="#f6faf5" font-size="21">loss is only 5 to 10%.</text></g></svg>