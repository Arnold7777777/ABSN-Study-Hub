<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="482" viewBox="0 0 640 482"><title>A new ileal conduit stoma should appear:</title><desc>Healthy stoma = pink/red and moist. Dusky/dark = ischemia — report it. Mucus in urine is normal.</desc><rect width="640" height="482" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="87" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M22 12Q3 15 5 40Q7 58 21 53Q31 48 23 38Q17 33 25 29Q33 19 22 12ZM42 12Q61 15 59 40Q57 58 43 53Q33 48 41 38Q47 33 39 29Q31 19 42 12Z"/><path d="M22 36Q31 39 29 56M42 36Q33 39 35 56"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A new ileal conduit stoma should appear:</text><path d="M319 195v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="211" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 224) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="245" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="276" fill="#f6faf5" font-size="21">Pink/red and moist</text><path d="M319 300v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="316" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 329) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="350" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="381" fill="#f6faf5" font-size="21">Healthy stoma = pink/red and moist.</text><text x="41" y="408" fill="#f6faf5" font-size="21">Dusky/dark = ischemia — report it. Mucus</text><text x="41" y="435" fill="#f6faf5" font-size="21">in urine is normal.</text></g></svg>