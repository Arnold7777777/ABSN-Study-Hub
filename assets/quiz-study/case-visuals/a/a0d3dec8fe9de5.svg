<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>A nurse is pouring a liquid medication into a calibrated medication cup for a client on a medical unit. Which of the following actions should the nurse take?</title><desc>Set the cup on a FLAT SURFACE and read the BASE OF THE MENISCUS at EYE LEVEL; holding the cup in the air tilts it and distorts the reading. Reading the top of the curve overestimates the dose. Household teaspoons are not calibrated and vary widely in volume, so use a calibrated cup or an oral syringe instead.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Administering Single-Dose Oral</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Liquid Medications</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A nurse is pouring a liquid medication</text><text x="41" y="231" fill="#f6faf5" font-size="21">into a calibrated medication cup for a</text><text x="41" y="258" fill="#f6faf5" font-size="21">client on a medical unit. Which of the</text><text x="41" y="285" fill="#f6faf5" font-size="21">following actions should the nurse take?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Set the cup on a flat surface and read the</text><text x="41" y="417" fill="#f6faf5" font-size="21">dose at the base of the meniscus at eye</text><text x="41" y="444" fill="#f6faf5" font-size="21">level</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="114" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Set the cup on a FLAT SURFACE and read the</text><text x="41" y="576" fill="#f6faf5" font-size="21">BASE OF THE MENISCUS at EYE LEVEL;</text></g></svg>