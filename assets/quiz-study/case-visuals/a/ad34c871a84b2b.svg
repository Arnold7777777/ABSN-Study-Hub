<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A client receiving enteral feedings reports nausea and abdominal cramping. What is the nurse&#x27;s priority action?</title><desc>Nausea and cramping suggest intolerance or delayed gastric emptying, so the nurse pauses the feeding and measures residual volume before anything else — continued infusion into a full stomach risks aspiration. Medicating first treats the symptom while the underlying volume problem keeps building.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Feeding Intolerance</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client receiving enteral feedings</text><text x="41" y="198" fill="#f6faf5" font-size="21">reports nausea and abdominal cramping.</text><text x="41" y="225" fill="#f6faf5" font-size="21">What is the nurse&#x27;s priority action?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Pause the feeding and check the gastric</text><text x="41" y="357" fill="#f6faf5" font-size="21">residual volume</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="276" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Nausea and cramping suggest intolerance or</text><text x="41" y="489" fill="#f6faf5" font-size="21">delayed gastric emptying, so the nurse</text><text x="41" y="516" fill="#f6faf5" font-size="21">pauses the feeding and measures residual</text><text x="41" y="543" fill="#f6faf5" font-size="21">volume before anything else — continued</text><text x="41" y="570" fill="#f6faf5" font-size="21">infusion into a full stomach risks</text><text x="41" y="597" fill="#f6faf5" font-size="21">aspiration. Medicating first treats the</text><text x="41" y="624" fill="#f6faf5" font-size="21">symptom while the underlying volume</text><text x="41" y="651" fill="#f6faf5" font-size="21">problem keeps building.</text></g></svg>