<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>A client is diagnosed with a threatened miscarriage at 9 weeks. What should the nurse teach her to do?</title><desc>Any tissue passed is saved for examination , which is how a complete miscarriage is confirmed. Nothing is placed in the vagina — no tampons, no douching, no intercourse — because of the infection risk. She counts pads to quantify bleeding.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client is diagnosed with a threatened</text><text x="41" y="231" fill="#f6faf5" font-size="21">miscarriage at 9 weeks. What should the</text><text x="41" y="258" fill="#f6faf5" font-size="21">nurse teach her to do?</text><path d="M319 282v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="298" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 311) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="332" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="363" fill="#f6faf5" font-size="21">Save any tissue or clots passed and bring</text><text x="41" y="390" fill="#f6faf5" font-size="21">them in</text><path d="M319 414v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="430" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 443) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="464" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="495" fill="#f6faf5" font-size="21">Any tissue passed is saved for examination</text><text x="41" y="522" fill="#f6faf5" font-size="21">, which is how a complete miscarriage is</text><text x="41" y="549" fill="#f6faf5" font-size="21">confirmed. Nothing is placed in the vagina</text><text x="41" y="576" fill="#f6faf5" font-size="21">— no tampons, no douching, no intercourse</text><text x="41" y="603" fill="#f6faf5" font-size="21">— because of the infection risk. She</text><text x="41" y="630" fill="#f6faf5" font-size="21">counts pads to quantify bleeding.</text></g></svg>