<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>A child with a ventriculoperitoneal shunt has a headache, vomiting and is difficult to rouse. What should the nurse suspect?</title><desc>Headache, vomiting and a falling level of consciousness in a child with a shunt mean shunt obstruction until proved otherwise and must be reported immediately. Keep the head of the bed elevated and avoid anything that raises intracranial pressure further.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic &amp; Neuromuscular</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 54C23 48 3 34 4 20Q7 4 22 10L32 19Q48 1 59 16Q68 31 32 54Z"/><path d="M9 31H21L26 20L33 41L39 28H54"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A child with a ventriculoperitoneal shunt</text><text x="41" y="198" fill="#f6faf5" font-size="21">has a headache, vomiting and is difficult</text><text x="41" y="225" fill="#f6faf5" font-size="21">to rouse. What should the nurse suspect?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Shunt malfunction with rising intracranial</text><text x="41" y="357" fill="#f6faf5" font-size="21">pressure</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Headache, vomiting and a falling level of</text><text x="41" y="489" fill="#f6faf5" font-size="21">consciousness in a child with a shunt mean</text><text x="41" y="516" fill="#f6faf5" font-size="21">shunt obstruction until proved otherwise</text><text x="41" y="543" fill="#f6faf5" font-size="21">and must be reported immediately. Keep the</text><text x="41" y="570" fill="#f6faf5" font-size="21">head of the bed elevated and avoid</text><text x="41" y="597" fill="#f6faf5" font-size="21">anything that raises intracranial pressure</text><text x="41" y="624" fill="#f6faf5" font-size="21">further.</text></g></svg>