<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A nurse is giving medications on a pediatric unit. Which actions are appropriate? (Select all that apply.)</title><desc>Weight-based checking, two identifiers, treatment-room procedures and documenting straight afterward are all correct. Never promise a child it will not hurt. A young child takes it literally, and when it does hurt you have lost their trust for everything that follows.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is giving medications on a</text><text x="41" y="198" fill="#f6faf5" font-size="21">pediatric unit. Which actions are</text><text x="41" y="225" fill="#f6faf5" font-size="21">appropriate? (Select all that apply.)</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Check the dose against the child&#x27;s weight</text><text x="41" y="357" fill="#f6faf5" font-size="21">in kilograms · Use two identifiers before</text><text x="41" y="384" fill="#f6faf5" font-size="21">every medication · Give a painful</text><text x="41" y="411" fill="#f6faf5" font-size="21">injection in a treatment room rather than</text><text x="41" y="438" fill="#f6faf5" font-size="21">the child&#x27;s bed · Document…</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Weight-based checking, two identifiers,</text><text x="41" y="570" fill="#f6faf5" font-size="21">treatment-room procedures and documenting</text><text x="41" y="597" fill="#f6faf5" font-size="21">straight afterward are all correct. Never</text><text x="41" y="624" fill="#f6faf5" font-size="21">promise a child it will not hurt. A young</text><text x="41" y="651" fill="#f6faf5" font-size="21">child takes it literally, and when it does</text><text x="41" y="678" fill="#f6faf5" font-size="21">hurt you have lost their trust for</text><text x="41" y="705" fill="#f6faf5" font-size="21">everything that follows.</text></g></svg>