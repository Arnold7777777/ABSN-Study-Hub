<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>Which instructions should the nurse include when teaching a client about preventing recurrent UTIs?</title><desc>High fluid intake, regular and post-coital voiding, front-to-back wiping, and avoiding damp or synthetic clothing all reduce recurrence. Stopping antibiotics early breeds resistant organisms and relapse, and bubble baths irritate the urethra rather than soothing it.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">UTI Prevention</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which instructions should the nurse</text><text x="41" y="198" fill="#f6faf5" font-size="21">include when teaching a client about</text><text x="41" y="225" fill="#f6faf5" font-size="21">preventing recurrent UTIs?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Drink more than 3 L of fluid daily unless</text><text x="41" y="357" fill="#f6faf5" font-size="21">restricted · Void every 3 to 4 hours and</text><text x="41" y="384" fill="#f6faf5" font-size="21">after intercourse · Wipe from front to</text><text x="41" y="411" fill="#f6faf5" font-size="21">back · Avoid staying in wet or synthetic</text><text x="41" y="438" fill="#f6faf5" font-size="21">clothing</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">High fluid intake, regular and post-coital</text><text x="41" y="570" fill="#f6faf5" font-size="21">voiding, front-to-back wiping, and</text><text x="41" y="597" fill="#f6faf5" font-size="21">avoiding damp or synthetic clothing all</text><text x="41" y="624" fill="#f6faf5" font-size="21">reduce recurrence. Stopping antibiotics</text><text x="41" y="651" fill="#f6faf5" font-size="21">early breeds resistant organisms and</text><text x="41" y="678" fill="#f6faf5" font-size="21">relapse, and bubble baths irritate the</text><text x="41" y="705" fill="#f6faf5" font-size="21">urethra rather than soothing it.</text></g></svg>