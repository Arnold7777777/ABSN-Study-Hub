<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A provider prescribes potassium chloride 20 mEq IV push for a client with a potassium of 2.9 mEq/L. What should the nurse do first?</title><desc>Potassium is never given IV push in any amount or by any route — it causes cardiac arrest. The nurse holds the dose and clarifies; potassium must be diluted and infused slowly on a pump, so any option that administers it as a push is unsafe even with a central line.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Potassium Safety</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A provider prescribes potassium chloride</text><text x="41" y="198" fill="#f6faf5" font-size="21">20 mEq IV push for a client with a</text><text x="41" y="225" fill="#f6faf5" font-size="21">potassium of 2.9 mEq/L. What should the</text><text x="41" y="252" fill="#f6faf5" font-size="21">nurse do first?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Hold the dose and clarify the prescription</text><text x="41" y="384" fill="#f6faf5" font-size="21">with the provider</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Potassium is never given IV push in any</text><text x="41" y="516" fill="#f6faf5" font-size="21">amount or by any route — it causes cardiac</text><text x="41" y="543" fill="#f6faf5" font-size="21">arrest. The nurse holds the dose and</text><text x="41" y="570" fill="#f6faf5" font-size="21">clarifies; potassium must be diluted and</text><text x="41" y="597" fill="#f6faf5" font-size="21">infused slowly on a pump, so any option</text><text x="41" y="624" fill="#f6faf5" font-size="21">that administers it as a push is unsafe</text><text x="41" y="651" fill="#f6faf5" font-size="21">even with a central line.</text></g></svg>