<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="779" viewBox="0 0 640 779"><title>A 5-year-old with a history of splenectomy, repeated infections, a 5-lb weight loss, easy bleeding, pallor, petechiae, an enlarged liver and enlarged lymph nodes is admitted to the pediatric unit to rule out acute lymphocytic leukemia (ALL). Which prescriptions should the nurse expect? (Select all that apply.)</title><desc>Diagnosing ALL takes a CBC and a bone marrow biopsy , and a lumbar puncture checks for spread to the central nervous system. She is already bleeding, so she needs bleeding precautions . Leukemia is not airborne, so airborne precautions are not indicated.</desc><rect width="640" height="779" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hematology &amp; Childhood Neoplasms</text><rect x="23" y="106" width="594" height="222" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 5-year-old with a history of</text><text x="41" y="198" fill="#f6faf5" font-size="21">splenectomy, repeated infections, a 5-lb</text><text x="41" y="225" fill="#f6faf5" font-size="21">weight loss, easy bleeding, pallor,</text><text x="41" y="252" fill="#f6faf5" font-size="21">petechiae, an enlarged liver and enlarged</text><text x="41" y="279" fill="#f6faf5" font-size="21">lymph nodes is admitted to the pediatric</text><text x="41" y="306" fill="#f6faf5" font-size="21">unit to rule…</text><path d="M319 330v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="346" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 359) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="380" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="411" fill="#f6faf5" font-size="21">Complete blood count (CBC) · Bone marrow</text><text x="41" y="438" fill="#f6faf5" font-size="21">biopsy · Lumbar puncture · Bleeding</text><text x="41" y="465" fill="#f6faf5" font-size="21">precautions</text><path d="M319 489v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="505" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 518) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="539" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="570" fill="#f6faf5" font-size="21">Diagnosing ALL takes a CBC and a bone</text><text x="41" y="597" fill="#f6faf5" font-size="21">marrow biopsy , and a lumbar puncture</text><text x="41" y="624" fill="#f6faf5" font-size="21">checks for spread to the central nervous</text><text x="41" y="651" fill="#f6faf5" font-size="21">system. She is already bleeding, so she</text><text x="41" y="678" fill="#f6faf5" font-size="21">needs bleeding precautions . Leukemia is</text><text x="41" y="705" fill="#f6faf5" font-size="21">not airborne, so airborne precautions are</text><text x="41" y="732" fill="#f6faf5" font-size="21">not indicated.</text></g></svg>