<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A nurse must give a time-critical IV antibiotic scheduled for 1000 to a child. Which administration time is acceptable?</title><desc>Time-critical medications are given within 30 minutes either side of the scheduled time — here 0930 to 1030. 0940 falls inside it. The others are more than 30 minutes early or late, and for an antibiotic that means blood levels drop below what kills the organism.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Medication Timing</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 29L32 10Q45 0 55 10Q67 21 55 34L34 54Q22 65 11 54Q0 43 13 29Z"/><path d="M20 23L43 46"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse must give a time-critical IV</text><text x="41" y="198" fill="#f6faf5" font-size="21">antibiotic scheduled for 1000 to a child.</text><text x="41" y="225" fill="#f6faf5" font-size="21">Which administration time is acceptable?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">0940</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Time-critical medications are given within</text><text x="41" y="462" fill="#f6faf5" font-size="21">30 minutes either side of the scheduled</text><text x="41" y="489" fill="#f6faf5" font-size="21">time — here 0930 to 1030. 0940 falls</text><text x="41" y="516" fill="#f6faf5" font-size="21">inside it. The others are more than 30</text><text x="41" y="543" fill="#f6faf5" font-size="21">minutes early or late, and for an</text><text x="41" y="570" fill="#f6faf5" font-size="21">antibiotic that means blood levels drop</text><text x="41" y="597" fill="#f6faf5" font-size="21">below what kills the organism.</text></g></svg>