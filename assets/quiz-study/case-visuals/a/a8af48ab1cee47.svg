<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>During the third stage of labor, a new nurse starts pulling on the umbilical cord to speed delivery of the placenta. The charge nurse stops her because of the risk of which complication?</title><desc>Traction on the cord before the placenta separates can turn the uterus inside out (uterine inversion) and can leave placental fragments behind. Wait for the signs of separation: a gush of blood, the cord lengthening, and the uterus rising and becoming globular.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Labor &amp; Birth</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">During the third stage of labor, a new</text><text x="41" y="198" fill="#f6faf5" font-size="21">nurse starts pulling on the umbilical cord</text><text x="41" y="225" fill="#f6faf5" font-size="21">to speed delivery of the placenta. The</text><text x="41" y="252" fill="#f6faf5" font-size="21">charge nurse stops her because of the risk</text><text x="41" y="279" fill="#f6faf5" font-size="21">of which complication?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Uterine inversion</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Traction on the cord before the placenta</text><text x="41" y="516" fill="#f6faf5" font-size="21">separates can turn the uterus inside out</text><text x="41" y="543" fill="#f6faf5" font-size="21">(uterine inversion) and can leave</text><text x="41" y="570" fill="#f6faf5" font-size="21">placental fragments behind. Wait for the</text><text x="41" y="597" fill="#f6faf5" font-size="21">signs of separation: a gush of blood, the</text><text x="41" y="624" fill="#f6faf5" font-size="21">cord lengthening, and the uterus rising</text><text x="41" y="651" fill="#f6faf5" font-size="21">and becoming globular.</text></g></svg>