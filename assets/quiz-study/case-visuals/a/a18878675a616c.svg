<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>During a preoperative interview, which substances reported by the client should the nurse report because they increase bleeding risk?</title><desc>Ginkgo, garlic, warfarin, clopidogrel, and aspirin all increase intraoperative and postoperative bleeding risk and must be reported so the surgeon can decide when to hold them. Acetaminophen and a plain multivitamin do not affect platelets or clotting.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Preoperative Assessment</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">During a preoperative interview, which</text><text x="41" y="198" fill="#f6faf5" font-size="21">substances reported by the client should</text><text x="41" y="225" fill="#f6faf5" font-size="21">the nurse report because they increase</text><text x="41" y="252" fill="#f6faf5" font-size="21">bleeding risk?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Ginkgo biloba · Garlic supplements ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Warfarin · Clopidogrel</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Ginkgo, garlic, warfarin, clopidogrel, and</text><text x="41" y="516" fill="#f6faf5" font-size="21">aspirin all increase intraoperative and</text><text x="41" y="543" fill="#f6faf5" font-size="21">postoperative bleeding risk and must be</text><text x="41" y="570" fill="#f6faf5" font-size="21">reported so the surgeon can decide when to</text><text x="41" y="597" fill="#f6faf5" font-size="21">hold them. Acetaminophen and a plain</text><text x="41" y="624" fill="#f6faf5" font-size="21">multivitamin do not affect platelets or</text><text x="41" y="651" fill="#f6faf5" font-size="21">clotting.</text></g></svg>