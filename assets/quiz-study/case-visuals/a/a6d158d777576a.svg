<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>Which actions contaminate a sterile field? Select all that apply.</title><desc>A sterile field must stay dry (moisture wicks microbes upward), must stay in view, and must not sit exposed to air for a prolonged time; the client&#x27;s unsterile hand contaminates it on contact. Dropping a sterile item onto the center of the field is correct practice — sterile touching sterile stays sterile.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Sterile Field</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which actions contaminate a sterile field?</text><text x="41" y="198" fill="#f6faf5" font-size="21">Select all that apply.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Moistening a cotton ball that is sitting</text><text x="41" y="330" fill="#f6faf5" font-size="21">on the field · Delaying the procedure for</text><text x="41" y="357" fill="#f6faf5" font-size="21">one hour after the field is set up ·</text><text x="41" y="384" fill="#f6faf5" font-size="21">Turning away from the sterile field · The</text><text x="41" y="411" fill="#f6faf5" font-size="21">client&#x27;s hand touching the…</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">A sterile field must stay dry (moisture</text><text x="41" y="543" fill="#f6faf5" font-size="21">wicks microbes upward), must stay in view,</text><text x="41" y="570" fill="#f6faf5" font-size="21">and must not sit exposed to air for a</text><text x="41" y="597" fill="#f6faf5" font-size="21">prolonged time;</text></g></svg>