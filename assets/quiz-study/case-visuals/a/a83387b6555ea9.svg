<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>Which of the following individuals may legally give consent on behalf of another person? Select all that apply.</title><desc>Parents of minors, legal guardians, health care power of attorney holders, and court-appointed representatives have legal authority to consent for someone else. A neighbor or the assigned nurse has no legal standing, no matter how involved or well informed they are.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Consent Authority</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5L57 15V31Q56 47 32 60Q8 46 7 31V15Z"/><path d="M19 31L28 40L45 22"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which of the following individuals may</text><text x="41" y="198" fill="#f6faf5" font-size="21">legally give consent on behalf of another</text><text x="41" y="225" fill="#f6faf5" font-size="21">person? Select all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">The parent of a minor child · A legal</text><text x="41" y="357" fill="#f6faf5" font-size="21">guardian · A person who holds durable</text><text x="41" y="384" fill="#f6faf5" font-size="21">power of attorney for health care · A</text><text x="41" y="411" fill="#f6faf5" font-size="21">court-appointed representative</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Parents of minors, legal guardians, health</text><text x="41" y="543" fill="#f6faf5" font-size="21">care power of attorney holders, and court-</text><text x="41" y="570" fill="#f6faf5" font-size="21">appointed representatives have legal</text><text x="41" y="597" fill="#f6faf5" font-size="21">authority to consent for someone else. A</text><text x="41" y="624" fill="#f6faf5" font-size="21">neighbor or the assigned nurse has no</text><text x="41" y="651" fill="#f6faf5" font-size="21">legal standing, no matter how involved or</text><text x="41" y="678" fill="#f6faf5" font-size="21">well informed they are.</text></g></svg>