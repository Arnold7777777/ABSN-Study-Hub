<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A client with a history of gastric bypass presents with a beefy red tongue. What is the likely cause?</title><desc>Loss of parietal cells means no intrinsic factor, so B12 cannot be absorbed. A beefy red tongue plus NEUROLOGIC symptoms — paresthesias, balance problems — is what separates B12 deficiency from iron deficiency.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Beefy Red Tongue</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client with a history of gastric bypass</text><text x="41" y="198" fill="#f6faf5" font-size="21">presents with a beefy red tongue. What is</text><text x="41" y="225" fill="#f6faf5" font-size="21">the likely cause?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Pernicious anemia from loss of intrinsic</text><text x="41" y="357" fill="#f6faf5" font-size="21">factor</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">Loss of parietal cells means no intrinsic</text><text x="41" y="489" fill="#f6faf5" font-size="21">factor, so B12 cannot be absorbed. A beefy</text><text x="41" y="516" fill="#f6faf5" font-size="21">red tongue plus NEUROLOGIC symptoms —</text><text x="41" y="543" fill="#f6faf5" font-size="21">paresthesias, balance problems — is what</text><text x="41" y="570" fill="#f6faf5" font-size="21">separates B12 deficiency from iron</text><text x="41" y="597" fill="#f6faf5" font-size="21">deficiency.</text></g></svg>