<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="671" viewBox="0 0 640 671"><title>Which observations should the nurse recognize as signs of dysphagia? Select all that apply.</title><desc>Coughing or choking with intake, a wet or gurgly voice quality after the swallow, and pocketing food in the cheek are classic oropharyngeal dysphagia findings, and all three are expected after a stroke with facial weakness. A heart rate of 78 sits inside the commonly cited normal adult range of 60 to 100. Food temperature preference is a comfort issue, not a swallowing sign.</desc><rect width="640" height="671" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Dysphagia and Aspiration</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which observations should the nurse</text><text x="41" y="198" fill="#f6faf5" font-size="21">recognize as signs of dysphagia? Select</text><text x="41" y="225" fill="#f6faf5" font-size="21">all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Coughing after sips of thin water · A wet,</text><text x="41" y="357" fill="#f6faf5" font-size="21">gurgly voice after swallowing · Food</text><text x="41" y="384" fill="#f6faf5" font-size="21">pocketed in the right cheek</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Coughing or choking with intake, a wet or</text><text x="41" y="516" fill="#f6faf5" font-size="21">gurgly voice quality after the swallow,</text><text x="41" y="543" fill="#f6faf5" font-size="21">and pocketing food in the cheek are</text><text x="41" y="570" fill="#f6faf5" font-size="21">classic oropharyngeal dysphagia findings,</text><text x="41" y="597" fill="#f6faf5" font-size="21">and all three are expected after a stroke</text><text x="41" y="624" fill="#f6faf5" font-size="21">with facial weakness.</text></g></svg>