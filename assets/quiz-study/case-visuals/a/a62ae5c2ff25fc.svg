<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A 52-year-old client tells the nurse, &quot;My children have moved out and I feel like I have nothing left to offer anyone.&quot; Using Erikson&#x27;s theory, which nursing response best supports this client&#x27;s developmental task?</title><desc>THE MIDDLE ADULT TASK IS GENERATIVITY VERSUS STAGNATION, WHICH IS MET BY GUIDING THE NEXT GENERATION THROUGH MENTORING, VOLUNTEERING, OR COMMUNITY INVOLVEMENT. Encouraging the client to explore these roles directly addresses the risk of stagnation. Life review and acceptance of the past belong to integrity versus despair in the older adult, so that option targets the wrong stage.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Middle Adult Development</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 52-year-old client tells the nurse, &quot;My</text><text x="41" y="198" fill="#f6faf5" font-size="21">children have moved out and I feel like I</text><text x="41" y="225" fill="#f6faf5" font-size="21">have nothing left to offer anyone.&quot; Using</text><text x="41" y="252" fill="#f6faf5" font-size="21">Erikson&#x27;s theory, which nursing response</text><text x="41" y="279" fill="#f6faf5" font-size="21">best supports this client&#x27;s…</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&quot;Tell me about ways you might mentor</text><text x="41" y="411" fill="#f6faf5" font-size="21">others or contribute to your community.&quot;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="168" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">THE MIDDLE ADULT TASK IS GENERATIVITY</text><text x="41" y="543" fill="#f6faf5" font-size="21">VERSUS STAGNATION, WHICH IS MET BY GUIDING</text><text x="41" y="570" fill="#f6faf5" font-size="21">THE NEXT GENERATION THROUGH MENTORING,</text><text x="41" y="597" fill="#f6faf5" font-size="21">VOLUNTEERING, OR COMMUNITY INVOLVEMENT.</text></g></svg>