<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="590" viewBox="0 0 640 590"><title>The nurse is providing education to a client diagnosed with acute rhinosinusitis. For which possible complication should the nurse teach the client to seek follow-up care?</title><desc>Client teaching is an important aspect of nursing care for the client with acute rhinosinusitis. The nurse instructs the client about symptoms of complications that require follow-up. Referral to a health care provider is indicated if periorbital edema and severe pain on palpation occur. Clear drainage and blood-tinged mucus do not require follow-up if the client has acute rhinosinusitis. A persistent headache does not necessarily warrant follow-up.</desc><rect width="640" height="590" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Mod 4 · Rhinitis / Sinusitis</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">The nurse is providing education to a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client diagnosed with acute</text><text x="41" y="225" fill="#f6faf5" font-size="21">rhinosinusitis. For which possible</text><text x="41" y="252" fill="#f6faf5" font-size="21">complication should the nurse teach the</text><text x="41" y="279" fill="#f6faf5" font-size="21">client to seek follow-up care?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Periorbital edema</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="141" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Client teaching is an important aspect of</text><text x="41" y="516" fill="#f6faf5" font-size="21">nursing care for the client with acute</text><text x="41" y="543" fill="#f6faf5" font-size="21">rhinosinusitis.</text></g></svg>