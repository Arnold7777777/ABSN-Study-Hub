<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A client at 34 weeks of gestation becomes pale, diaphoretic and lightheaded while lying flat for an examination. Her BP is 86/52. Which action does the nurse take first?</title><desc>This is supine hypotensive syndrome from the uterus compressing the vena cava, and turning her to the left lateral position restores venous return immediately. Oxygen and fluids may follow, but repositioning fixes the cause and costs nothing.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Physiologic &amp; Psychological</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Changes of Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 34 weeks of gestation becomes</text><text x="41" y="231" fill="#f6faf5" font-size="21">pale, diaphoretic and lightheaded while</text><text x="41" y="258" fill="#f6faf5" font-size="21">lying flat for an examination. Her BP is</text><text x="41" y="285" fill="#f6faf5" font-size="21">86/52. Which action does the nurse take</text><text x="41" y="312" fill="#f6faf5" font-size="21">first?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Turn her onto her left side</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">This is supine hypotensive syndrome from</text><text x="41" y="549" fill="#f6faf5" font-size="21">the uterus compressing the vena cava, and</text><text x="41" y="576" fill="#f6faf5" font-size="21">turning her to the left lateral position</text><text x="41" y="603" fill="#f6faf5" font-size="21">restores venous return immediately. Oxygen</text><text x="41" y="630" fill="#f6faf5" font-size="21">and fluids may follow, but repositioning</text><text x="41" y="657" fill="#f6faf5" font-size="21">fixes the cause and costs nothing.</text></g></svg>