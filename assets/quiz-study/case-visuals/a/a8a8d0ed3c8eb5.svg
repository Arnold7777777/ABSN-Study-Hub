<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="704" viewBox="0 0 640 704"><title>A client stops talking and stares at the floor for nearly a minute after describing a painful memory. Which nursing action is BEST?</title><desc>Silence gives the client time to organize his thoughts and shows the nurse can tolerate difficult emotion. Filling the pause with a new question is a common, well-meant error that takes control of the conversation away from the client.</desc><rect width="640" height="704" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Therapeutic Relationships &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Communication</text><rect x="23" y="139" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client stops talking and stares at the</text><text x="41" y="231" fill="#f6faf5" font-size="21">floor for nearly a minute after describing</text><text x="41" y="258" fill="#f6faf5" font-size="21">a painful memory. Which nursing action is</text><text x="41" y="285" fill="#f6faf5" font-size="21">BEST?</text><path d="M319 309v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="325" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 338) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="359" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="390" fill="#f6faf5" font-size="21">Remain silent and stay attentively with</text><text x="41" y="417" fill="#f6faf5" font-size="21">the client.</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">Silence gives the client time to organize</text><text x="41" y="549" fill="#f6faf5" font-size="21">his thoughts and shows the nurse can</text><text x="41" y="576" fill="#f6faf5" font-size="21">tolerate difficult emotion. Filling the</text><text x="41" y="603" fill="#f6faf5" font-size="21">pause with a new question is a common,</text><text x="41" y="630" fill="#f6faf5" font-size="21">well-meant error that takes control of the</text><text x="41" y="657" fill="#f6faf5" font-size="21">conversation away from the client.</text></g></svg>