<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="752" viewBox="0 0 640 752"><title>A client declines a morning shower, explaining that they bathe in the evening and do not wash their hair on certain days for religious reasons. Which response should the nurse make?</title><desc>Hygiene practices are shaped by culture and personal habit, and honoring them costs nothing clinically while preserving trust and dignity. Charting a refusal misrepresents what happened, since the client is not declining hygiene, only the timing and one specific element.</desc><rect width="640" height="752" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Cultural Preferences</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A client declines a morning shower,</text><text x="41" y="198" fill="#f6faf5" font-size="21">explaining that they bathe in the evening</text><text x="41" y="225" fill="#f6faf5" font-size="21">and do not wash their hair on certain days</text><text x="41" y="252" fill="#f6faf5" font-size="21">for religious reasons. Which response</text><text x="41" y="279" fill="#f6faf5" font-size="21">should the nurse make?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="141" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">Adjust the plan of care to match the</text><text x="41" y="411" fill="#f6faf5" font-size="21">client&#x27;s routine and record the</text><text x="41" y="438" fill="#f6faf5" font-size="21">preferences</text><path d="M319 462v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="478" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 491) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="512" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="543" fill="#f6faf5" font-size="21">Hygiene practices are shaped by culture</text><text x="41" y="570" fill="#f6faf5" font-size="21">and personal habit, and honoring them</text><text x="41" y="597" fill="#f6faf5" font-size="21">costs nothing clinically while preserving</text><text x="41" y="624" fill="#f6faf5" font-size="21">trust and dignity. Charting a refusal</text><text x="41" y="651" fill="#f6faf5" font-size="21">misrepresents what happened, since the</text><text x="41" y="678" fill="#f6faf5" font-size="21">client is not declining hygiene, only the</text><text x="41" y="705" fill="#f6faf5" font-size="21">timing and one specific element.</text></g></svg>