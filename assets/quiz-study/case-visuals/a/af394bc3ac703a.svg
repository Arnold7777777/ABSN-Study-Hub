<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A nurse enters the room and finds a loop of bowel protruding through a client&#x27;s abdominal incision. Which action should the nurse take first?</title><desc>Cover the protruding tissue with a sterile dressing moistened with normal saline to keep it from drying out, then call the provider immediately and keep the client NPO. Never attempt to push organs back in — that risks perforation and contamination of the peritoneum.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Evisceration</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse enters the room and finds a loop</text><text x="41" y="198" fill="#f6faf5" font-size="21">of bowel protruding through a client&#x27;s</text><text x="41" y="225" fill="#f6faf5" font-size="21">abdominal incision. Which action should</text><text x="41" y="252" fill="#f6faf5" font-size="21">the nurse take first?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">Cover the area with a sterile saline-</text><text x="41" y="384" fill="#f6faf5" font-size="21">moistened dressing</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">Cover the protruding tissue with a sterile</text><text x="41" y="516" fill="#f6faf5" font-size="21">dressing moistened with normal saline to</text><text x="41" y="543" fill="#f6faf5" font-size="21">keep it from drying out, then call the</text><text x="41" y="570" fill="#f6faf5" font-size="21">provider immediately and keep the client</text><text x="41" y="597" fill="#f6faf5" font-size="21">NPO. Never attempt to push organs back in</text><text x="41" y="624" fill="#f6faf5" font-size="21">— that risks perforation and contamination</text><text x="41" y="651" fill="#f6faf5" font-size="21">of the peritoneum.</text></g></svg>