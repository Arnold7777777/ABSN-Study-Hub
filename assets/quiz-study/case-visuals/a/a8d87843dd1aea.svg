<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>An 8-year-old is 4 feet 2 inches tall and weighs 62 pounds. Her parent says she has outgrown her booster seat and now uses the regular seat belt. Which response is correct?</title><desc>The threshold is height, not age or weight: booster seat use continues until roughly 4 feet 9 inches , when the lap and shoulder belt fit the skeleton properly. At 4 feet 2 inches she is well short of it.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">School-Age &amp; Adolescent</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">An 8-year-old is 4 feet 2 inches tall and</text><text x="41" y="198" fill="#f6faf5" font-size="21">weighs 62 pounds. Her parent says she has</text><text x="41" y="225" fill="#f6faf5" font-size="21">outgrown her booster seat and now uses the</text><text x="41" y="252" fill="#f6faf5" font-size="21">regular seat belt. Which response is</text><text x="41" y="279" fill="#f6faf5" font-size="21">correct?</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&quot;She should stay in a booster seat until</text><text x="41" y="411" fill="#f6faf5" font-size="21">she reaches about 4 feet 9 inches tall.&quot;</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">The threshold is height, not age or</text><text x="41" y="543" fill="#f6faf5" font-size="21">weight: booster seat use continues until</text><text x="41" y="570" fill="#f6faf5" font-size="21">roughly 4 feet 9 inches , when the lap and</text><text x="41" y="597" fill="#f6faf5" font-size="21">shoulder belt fit the skeleton properly.</text><text x="41" y="624" fill="#f6faf5" font-size="21">At 4 feet 2 inches she is well short of</text><text x="41" y="651" fill="#f6faf5" font-size="21">it.</text></g></svg>