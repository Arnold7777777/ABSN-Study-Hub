<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>During a mass casualty incident using START triage, a client is breathing at 34 breaths per minute with a capillary refill of 4 seconds and cannot follow simple commands. Which category applies?</title><desc>START tags red for a respiratory rate over 30, capillary refill over 2 seconds or absent radial pulse, or inability to follow commands - and this client fails all three. Red means treatable now and will die without it . Black is reserved for those without spontaneous respiration after the airway is opened.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Disaster, Mass Casualty &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Emergency Nursing</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">During a mass casualty incident using</text><text x="41" y="231" fill="#f6faf5" font-size="21">START triage, a client is breathing at 34</text><text x="41" y="258" fill="#f6faf5" font-size="21">breaths per minute with a capillary refill</text><text x="41" y="285" fill="#f6faf5" font-size="21">of 4 seconds and cannot follow simple</text><text x="41" y="312" fill="#f6faf5" font-size="21">commands. Which category applies?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Red - immediate</text><path d="M319 441v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="457" width="594" height="195" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 470) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="491" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="522" fill="#f6faf5" font-size="21">START tags red for a respiratory rate over</text><text x="41" y="549" fill="#f6faf5" font-size="21">30, capillary refill over 2 seconds or</text><text x="41" y="576" fill="#f6faf5" font-size="21">absent radial pulse, or inability to</text><text x="41" y="603" fill="#f6faf5" font-size="21">follow commands - and this client fails</text><text x="41" y="630" fill="#f6faf5" font-size="21">all three.</text></g></svg>