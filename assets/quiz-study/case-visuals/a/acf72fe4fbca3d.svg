<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="677" viewBox="0 0 640 677"><title>Which finding best distinguishes a cerebral contusion from a concussion?</title><desc>In a contusion the brain itself is bruised, and the bruising and bleeding show on imaging ; in a concussion the CT is normal. A brief loss of consciousness, post-concussion headaches and amnesia can all occur with a concussion, so they do not tell the two apart.</desc><rect width="640" height="677" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Neurologic Dysfunction &amp;</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Cerebrovascular Disorders</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M30 13Q20 3 15 16Q3 17 7 28Q-1 42 11 48Q14 59 27 51L30 45ZM35 13Q47 3 51 16Q63 17 59 28Q67 42 54 48Q51 59 38 51L35 45Z"/><path d="M13 28Q25 24 24 35M42 23Q52 25 49 36"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">Which finding best distinguishes a</text><text x="41" y="231" fill="#f6faf5" font-size="21">cerebral contusion from a concussion?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Bruising of brain tissue that is visible</text><text x="41" y="363" fill="#f6faf5" font-size="21">on CT</text><path d="M319 387v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="403" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 416) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="437" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="468" fill="#f6faf5" font-size="21">In a contusion the brain itself is</text><text x="41" y="495" fill="#f6faf5" font-size="21">bruised, and the bruising and bleeding</text><text x="41" y="522" fill="#f6faf5" font-size="21">show on imaging ; in a concussion the CT</text><text x="41" y="549" fill="#f6faf5" font-size="21">is normal. A brief loss of consciousness,</text><text x="41" y="576" fill="#f6faf5" font-size="21">post-concussion headaches and amnesia can</text><text x="41" y="603" fill="#f6faf5" font-size="21">all occur with a concussion, so they do</text><text x="41" y="630" fill="#f6faf5" font-size="21">not tell the two apart.</text></g></svg>