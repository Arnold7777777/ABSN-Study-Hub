<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A runner finishes a marathon and is dizzy and diaphoretic. Serum sodium is 128 mEq/L and potassium is 3.6 mEq/L. Which prescription should the nurse anticipate?</title><desc>An isotonic fluid such as 0.9% NaCl replaces both the water and the sodium lost through sweat while seizure precautions cover the neuro risk of a sodium of 128. Hypotonic fluids such as 0.45% NaCl or D5W would dilute the sodium further and worsen cerebral edema.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Hyponatremia</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A runner finishes a marathon and is dizzy</text><text x="41" y="198" fill="#f6faf5" font-size="21">and diaphoretic. Serum sodium is 128 mEq/L</text><text x="41" y="225" fill="#f6faf5" font-size="21">and potassium is 3.6 mEq/L. Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">prescription should the nurse anticipate?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">0.9% sodium chloride IV with seizure</text><text x="41" y="384" fill="#f6faf5" font-size="21">precautions</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">An isotonic fluid such as 0.9% NaCl</text><text x="41" y="516" fill="#f6faf5" font-size="21">replaces both the water and the sodium</text><text x="41" y="543" fill="#f6faf5" font-size="21">lost through sweat while seizure</text><text x="41" y="570" fill="#f6faf5" font-size="21">precautions cover the neuro risk of a</text><text x="41" y="597" fill="#f6faf5" font-size="21">sodium of 128. Hypotonic fluids such as</text><text x="41" y="624" fill="#f6faf5" font-size="21">0.45% NaCl or D5W would dilute the sodium</text><text x="41" y="651" fill="#f6faf5" font-size="21">further and worsen cerebral edema.</text></g></svg>