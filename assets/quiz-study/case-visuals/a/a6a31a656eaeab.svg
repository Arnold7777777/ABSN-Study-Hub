<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>A nurse notes bony enlargements at a client&#x27;s distal interphalangeal joints. What are these called?</title><desc>Heberden&#x27;s nodes are at the DISTAL interphalangeal joints; Bouchard&#x27;s nodes are at the middle joints. Both are osteoarthritis findings. Rheumatoid nodules occur in RA, and tophi are urate deposits in gout.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Heberden&#x27;s Nodes</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse notes bony enlargements at a</text><text x="41" y="198" fill="#f6faf5" font-size="21">client&#x27;s distal interphalangeal joints.</text><text x="41" y="225" fill="#f6faf5" font-size="21">What are these called?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Heberden&#x27;s nodes</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Heberden&#x27;s nodes are at the DISTAL</text><text x="41" y="462" fill="#f6faf5" font-size="21">interphalangeal joints; Bouchard&#x27;s nodes</text><text x="41" y="489" fill="#f6faf5" font-size="21">are at the middle joints. Both are</text><text x="41" y="516" fill="#f6faf5" font-size="21">osteoarthritis findings. Rheumatoid</text><text x="41" y="543" fill="#f6faf5" font-size="21">nodules occur in RA, and tophi are urate</text><text x="41" y="570" fill="#f6faf5" font-size="21">deposits in gout.</text></g></svg>