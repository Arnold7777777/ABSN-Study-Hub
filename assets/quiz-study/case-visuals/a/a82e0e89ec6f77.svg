<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="617" viewBox="0 0 640 617"><title>Which crutch gait is the slowest but the most stable?</title><desc>Four-point gait keeps three points of contact on the floor at all times, making it the slowest and the most stable, but it requires that both legs can bear weight. Three-point is the tempting answer, yet it exists for non-weight-bearing on one leg and is less stable.</desc><rect width="640" height="617" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Four-point gait</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Which crutch gait is the slowest but the</text><text x="41" y="198" fill="#f6faf5" font-size="21">most stable?</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="303" fill="#f6faf5" font-size="21">Four-point gait</text><path d="M319 327v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="343" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 356) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="377" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="408" fill="#f6faf5" font-size="21">Four-point gait keeps three points of</text><text x="41" y="435" fill="#f6faf5" font-size="21">contact on the floor at all times, making</text><text x="41" y="462" fill="#f6faf5" font-size="21">it the slowest and the most stable, but it</text><text x="41" y="489" fill="#f6faf5" font-size="21">requires that both legs can bear weight.</text><text x="41" y="516" fill="#f6faf5" font-size="21">Three-point is the tempting answer, yet it</text><text x="41" y="543" fill="#f6faf5" font-size="21">exists for non-weight-bearing on one leg</text><text x="41" y="570" fill="#f6faf5" font-size="21">and is less stable.</text></g></svg>