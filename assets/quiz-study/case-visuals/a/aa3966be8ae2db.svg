<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="725" viewBox="0 0 640 725"><title>A 30-year-old is in the acute stage of HIV. Which findings fit that stage? Select all that apply.</title><desc>Acute HIV is a seroconversion illness : enormous viral load, a transient CD4 dip, and symptoms that look like any other virus - which is exactly why it gets missed. Asymptomatic belongs to the chronic stage , not this one. Opportunistic infections come much later.</desc><rect width="640" height="725" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">HIV - testing &amp; staging</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 30-year-old is in the acute stage of</text><text x="41" y="198" fill="#f6faf5" font-size="21">HIV. Which findings fit that stage? Select</text><text x="41" y="225" fill="#f6faf5" font-size="21">all that apply.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="168" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">CD4 below 500 cells/mm³ · No opportunistic</text><text x="41" y="357" fill="#f6faf5" font-size="21">infections present · Very high viral load</text><text x="41" y="384" fill="#f6faf5" font-size="21">· Flu-like illness - fever, sore throat,</text><text x="41" y="411" fill="#f6faf5" font-size="21">rash, swollen nodes</text><path d="M319 435v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="451" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 464) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="485" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="516" fill="#f6faf5" font-size="21">Acute HIV is a seroconversion illness :</text><text x="41" y="543" fill="#f6faf5" font-size="21">enormous viral load, a transient CD4 dip,</text><text x="41" y="570" fill="#f6faf5" font-size="21">and symptoms that look like any other</text><text x="41" y="597" fill="#f6faf5" font-size="21">virus - which is exactly why it gets</text><text x="41" y="624" fill="#f6faf5" font-size="21">missed. Asymptomatic belongs to the</text><text x="41" y="651" fill="#f6faf5" font-size="21">chronic stage , not this one.</text><text x="41" y="678" fill="#f6faf5" font-size="21">Opportunistic infections come much later.</text></g></svg>