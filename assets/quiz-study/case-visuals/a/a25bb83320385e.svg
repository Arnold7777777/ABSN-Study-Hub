<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="758" viewBox="0 0 640 758"><title>A client at 34 weeks of gestation reports a sudden gush of bright red vaginal bleeding. She denies pain, and her uterus is soft and relaxed on palpation. Which action does the nurse take?</title><desc>Painless bright red bleeding with a soft uterus points to placenta previa , and a vaginal exam can tear the placenta and cause catastrophic hemorrhage. Checking dilation feels like good assessment, but it is the one thing that is absolutely contraindicated here.</desc><rect width="640" height="758" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Early Pregnancy Bleeding &amp; Ectopic</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">Pregnancy</text><rect x="23" y="139" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M32 5Q22 19 12 33Q3 50 17 57Q33 68 48 55Q60 44 49 29Z"/><path d="M17 44Q17 51 26 53"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">A client at 34 weeks of gestation reports</text><text x="41" y="231" fill="#f6faf5" font-size="21">a sudden gush of bright red vaginal</text><text x="41" y="258" fill="#f6faf5" font-size="21">bleeding. She denies pain, and her uterus</text><text x="41" y="285" fill="#f6faf5" font-size="21">is soft and relaxed on palpation. Which</text><text x="41" y="312" fill="#f6faf5" font-size="21">action does the nurse take?</text><path d="M319 336v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="352" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 365) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="386" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="417" fill="#f6faf5" font-size="21">Withhold any vaginal examination and</text><text x="41" y="444" fill="#f6faf5" font-size="21">notify the provider</text><path d="M319 468v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="484" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 497) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="518" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="549" fill="#f6faf5" font-size="21">Painless bright red bleeding with a soft</text><text x="41" y="576" fill="#f6faf5" font-size="21">uterus points to placenta previa , and a</text><text x="41" y="603" fill="#f6faf5" font-size="21">vaginal exam can tear the placenta and</text><text x="41" y="630" fill="#f6faf5" font-size="21">cause catastrophic hemorrhage. Checking</text><text x="41" y="657" fill="#f6faf5" font-size="21">dilation feels like good assessment, but</text><text x="41" y="684" fill="#f6faf5" font-size="21">it is the one thing that is absolutely</text><text x="41" y="711" fill="#f6faf5" font-size="21">contraindicated here.</text></g></svg>