<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="623" viewBox="0 0 640 623"><title>For which abdominal assessment does the nurse use deep palpation?</title><desc>Deep palpation (about 5–8 cm, often two-handed) detects organ size and hidden masses. Temperature and texture are judged with light touch, and motility is assessed by auscultation. Palpate tender areas last.</desc><rect width="640" height="623" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Abdominal assessment - deep</text><text x="27" y="109" fill="#ffe29e" font-size="28" font-weight="700">palpation</text><rect x="23" y="139" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 152) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="173" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="204" fill="#f6faf5" font-size="21">For which abdominal assessment does the</text><text x="41" y="231" fill="#f6faf5" font-size="21">nurse use deep palpation?</text><path d="M319 255v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="271" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 284) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="305" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="336" fill="#f6faf5" font-size="21">Liver size and organ enlargement</text><path d="M319 360v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="376" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 389) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="410" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="441" fill="#f6faf5" font-size="21">Deep palpation (about 5–8 cm, often two-</text><text x="41" y="468" fill="#f6faf5" font-size="21">handed) detects organ size and hidden</text><text x="41" y="495" fill="#f6faf5" font-size="21">masses. Temperature and texture are judged</text><text x="41" y="522" fill="#f6faf5" font-size="21">with light touch, and motility is assessed</text><text x="41" y="549" fill="#f6faf5" font-size="21">by auscultation. Palpate tender areas</text><text x="41" y="576" fill="#f6faf5" font-size="21">last.</text></g></svg>