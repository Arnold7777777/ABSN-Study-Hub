<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="698" viewBox="0 0 640 698"><title>A 42-year-old woman at average risk asks the clinic nurse when she should begin mammograms. What is the nurse&#x27;s best response?</title><desc>The US Preventive Services Task Force recommends mammography every 2 years for women ages 40 through 74. Waiting until 50 reflects older advice that changed in 2024, which is why students still see it in outdated materials. Confirm the current statement before teaching a client.</desc><rect width="640" height="698" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Epidemiology</text><rect x="23" y="106" width="594" height="168" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M11 16H52V60H11Z"/><path d="M23 9H40V20H23ZM18 30H45M18 40H45M18 50H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 42-year-old woman at average risk asks</text><text x="41" y="198" fill="#f6faf5" font-size="21">the clinic nurse when she should begin</text><text x="41" y="225" fill="#f6faf5" font-size="21">mammograms. What is the nurse&#x27;s best</text><text x="41" y="252" fill="#f6faf5" font-size="21">response?</text><path d="M319 276v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="292" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 305) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="326" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="357" fill="#f6faf5" font-size="21">&quot;Current guidance says start now and</text><text x="41" y="384" fill="#f6faf5" font-size="21">repeat every 2 years.&quot;</text><path d="M319 408v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="424" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 437) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="458" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="489" fill="#f6faf5" font-size="21">The US Preventive Services Task Force</text><text x="41" y="516" fill="#f6faf5" font-size="21">recommends mammography every 2 years for</text><text x="41" y="543" fill="#f6faf5" font-size="21">women ages 40 through 74. Waiting until 50</text><text x="41" y="570" fill="#f6faf5" font-size="21">reflects older advice that changed in</text><text x="41" y="597" fill="#f6faf5" font-size="21">2024, which is why students still see it</text><text x="41" y="624" fill="#f6faf5" font-size="21">in outdated materials. Confirm the current</text><text x="41" y="651" fill="#f6faf5" font-size="21">statement before teaching a client.</text></g></svg>