<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>True or false: if the stomach is the client&#x27;s problem, a gastrostomy tube is the right feeding route.</title><desc>False. A G/PEG tube delivers straight into the stomach. If the stomach is the problem, or the client is at high aspiration risk or has gastric intolerance, go post-pyloric into the jejunum with a J/PEJ tube.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">G-Tube vs J-Tube</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M23 7V23Q18 32 12 34Q7 46 16 52Q24 59 33 49Q57 43 52 24Q49 16 42 21Q34 26 31 18V7"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">True or false: if the stomach is the</text><text x="41" y="198" fill="#f6faf5" font-size="21">client&#x27;s problem, a gastrostomy tube is</text><text x="41" y="225" fill="#f6faf5" font-size="21">the right feeding route.</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="114" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">False — a G-tube empties into the stomach</text><text x="41" y="357" fill="#f6faf5" font-size="21">and may worsen the problem; use a J-tube</text><path d="M319 381v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="397" width="594" height="222" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 410) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="431" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="462" fill="#f6faf5" font-size="21">False. A G/PEG tube delivers straight into</text><text x="41" y="489" fill="#f6faf5" font-size="21">the stomach. If the stomach is the</text><text x="41" y="516" fill="#f6faf5" font-size="21">problem, or the client is at high</text><text x="41" y="543" fill="#f6faf5" font-size="21">aspiration risk or has gastric</text><text x="41" y="570" fill="#f6faf5" font-size="21">intolerance, go post-pyloric into the</text><text x="41" y="597" fill="#f6faf5" font-size="21">jejunum with a J/PEJ tube.</text></g></svg>