<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="806" viewBox="0 0 640 806"><title>A nurse is reviewing recorded responses made to a client who stated, &#x27;I do not think I can handle this diagnosis.&#x27; Which responses are nontherapeutic? (Select all that apply.)</title><desc>False reassurance, why questions that demand justification, and advice that dismisses the emotion all shut the client down. Naming the feeling and asking an open-ended question keep the conversation open and communicate that the nurse is willing to hear the answer.</desc><rect width="640" height="806" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Nontherapeutic Communication</text><rect x="23" y="106" width="594" height="195" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M5 10H47Q54 10 54 18V37Q54 43 46 43H25L12 53V43H9Q4 42 4 34Z"/><path d="M14 22H42M14 30H34"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A nurse is reviewing recorded responses</text><text x="41" y="198" fill="#f6faf5" font-size="21">made to a client who stated, &#x27;I do not</text><text x="41" y="225" fill="#f6faf5" font-size="21">think I can handle this diagnosis.&#x27; Which</text><text x="41" y="252" fill="#f6faf5" font-size="21">responses are nontherapeutic? (Select all</text><text x="41" y="279" fill="#f6faf5" font-size="21">that apply.)</text><path d="M319 303v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="319" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 332) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="353" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="384" fill="#f6faf5" font-size="21">&#x27;Do not worry, everyone feels that way at</text><text x="41" y="411" fill="#f6faf5" font-size="21">first and it passes.&#x27; · &#x27;Why would you say</text><text x="41" y="438" fill="#f6faf5" font-size="21">something like that?&#x27; · &#x27;You should focus</text><text x="41" y="465" fill="#f6faf5" font-size="21">on being grateful that it was caught</text><text x="41" y="492" fill="#f6faf5" font-size="21">early.&#x27;</text><path d="M319 516v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="532" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 545) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="566" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="597" fill="#f6faf5" font-size="21">False reassurance, why questions that</text><text x="41" y="624" fill="#f6faf5" font-size="21">demand justification, and advice that</text><text x="41" y="651" fill="#f6faf5" font-size="21">dismisses the emotion all shut the client</text><text x="41" y="678" fill="#f6faf5" font-size="21">down. Naming the feeling and asking an</text><text x="41" y="705" fill="#f6faf5" font-size="21">open-ended question keep the conversation</text><text x="41" y="732" fill="#f6faf5" font-size="21">open and communicate that the nurse is</text><text x="41" y="759" fill="#f6faf5" font-size="21">willing to hear the answer.</text></g></svg>