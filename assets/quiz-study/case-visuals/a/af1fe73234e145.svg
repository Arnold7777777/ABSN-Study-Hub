<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="566" viewBox="0 0 640 566"><title>Match each feature to the type of arthritis it describes.</title><desc>RA is autoimmune, symmetrical, small-joint, systemic, deformity-producing, and stiff for over an hour; OA is wear and tear, asymmetrical, weight-bearing, localized, and stiff for under 30 minutes. The trap is the stiffness pair - long stiffness that loosens with movement is RA, brief stiffness with pain that worsens on use is OA.</desc><rect width="640" height="566" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">RA vs OA</text><rect x="23" y="106" width="594" height="114" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 10Q18 5 22 10Q30 8 31 16Q31 21 27 22L44 41Q51 36 56 41Q61 45 56 51Q57 58 50 59Q43 62 40 53L21 32Q14 36 10 30Q5 24 11 19Q6 14 13 10Z"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">Match each feature to the type of</text><text x="41" y="198" fill="#f6faf5" font-size="21">arthritis it describes.</text><path d="M319 222v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="238" width="594" height="303" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 251) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="272" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="303" fill="#f6faf5" font-size="21">RA is autoimmune, symmetrical, small-</text><text x="41" y="330" fill="#f6faf5" font-size="21">joint, systemic, deformity-producing, and</text><text x="41" y="357" fill="#f6faf5" font-size="21">stiff for over an hour; OA is wear and</text><text x="41" y="384" fill="#f6faf5" font-size="21">tear, asymmetrical, weight-bearing,</text><text x="41" y="411" fill="#f6faf5" font-size="21">localized, and stiff for under 30 minutes.</text><text x="41" y="438" fill="#f6faf5" font-size="21">The trap is the stiffness pair - long</text><text x="41" y="465" fill="#f6faf5" font-size="21">stiffness that loosens with movement is</text><text x="41" y="492" fill="#f6faf5" font-size="21">RA, brief stiffness with pain that worsens</text><text x="41" y="519" fill="#f6faf5" font-size="21">on use is OA.</text></g></svg>