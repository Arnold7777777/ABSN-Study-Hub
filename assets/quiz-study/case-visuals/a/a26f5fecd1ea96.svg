<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="485" viewBox="0 0 640 485"><title>146. A client is admitted with a spontaneous pneumothorax. Which findings are expected?</title><desc>d. A collapsed lung tearing from the pleura causes sharp pleuritic pain and SOB. Hemoptysis/night sweats = TB; pink frothy sputum = CHF; orthopnea/PND = pulmonary edema.</desc><rect width="640" height="485" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Clinical reasoning</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">146. A client is admitted with a</text><text x="41" y="198" fill="#f6faf5" font-size="21">spontaneous pneumothorax. Which findings</text><text x="41" y="225" fill="#f6faf5" font-size="21">are expected?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="195" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">Reason through the case</text><text x="41" y="330" fill="#f6faf5" font-size="21">d. A collapsed lung tearing from the</text><text x="41" y="357" fill="#f6faf5" font-size="21">pleura causes sharp pleuritic pain and</text><text x="41" y="384" fill="#f6faf5" font-size="21">SOB. Hemoptysis/night sweats = TB; pink</text><text x="41" y="411" fill="#f6faf5" font-size="21">frothy sputum = CHF; orthopnea/PND =</text><text x="41" y="438" fill="#f6faf5" font-size="21">pulmonary edema.</text></g></svg>