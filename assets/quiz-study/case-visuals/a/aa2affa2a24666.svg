<svg xmlns="http://www.w3.org/2000/svg" role="img" width="640" height="644" viewBox="0 0 640 644"><title>A 5-year-old is 4 hours post tonsillectomy. Which finding most concerns the nurse?</title><desc>Frequent swallowing is the classic sign of post-tonsillectomy hemorrhage — blood trickling down the back of the throat before anyone sees it. Pain, a low-grade temperature and old dark blood are expected in the first hours; bright red bleeding and repeated swallowing are not.</desc><rect width="640" height="644" rx="20" fill="#131e30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="27" y="36" fill="#a7e8db" font-size="17" font-weight="700">STUDY HUB  /  QUESTION MAP</text><text x="27" y="76" fill="#ffe29e" font-size="28" font-weight="700">Respiratory</text><rect x="23" y="106" width="594" height="141" rx="17" fill="#1b3543" stroke="#739395"/><g transform="translate(38 119) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M29 15Q19 7 13 22Q6 36 5 53Q19 59 28 48ZM38 15Q47 7 53 22Q60 36 59 53Q45 59 37 48Z"/><path d="M33 6V32L17 44M33 32L48 44"/></g><text x="96" y="140" fill="#ffe4a5" font-size="23" font-weight="700">Read the situation</text><text x="41" y="171" fill="#f6faf5" font-size="21">A 5-year-old is 4 hours post</text><text x="41" y="198" fill="#f6faf5" font-size="21">tonsillectomy. Which finding most concerns</text><text x="41" y="225" fill="#f6faf5" font-size="21">the nurse?</text><path d="M319 249v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="265" width="594" height="87" rx="17" fill="#274149" stroke="#739395"/><g transform="translate(38 278) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M10 30L26 47L56 13"/></g><text x="96" y="299" fill="#ffe4a5" font-size="23" font-weight="700">What fits here</text><text x="41" y="330" fill="#f6faf5" font-size="21">Repeated swallowing while awake</text><path d="M319 354v11m-6 -5 6 7 6 -7" stroke="#a0ded2" stroke-width="2.6" fill="none"/><rect x="23" y="370" width="594" height="249" rx="17" fill="#333149" stroke="#739395"/><g transform="translate(38 383) scale(.65)" fill="none" stroke="#f0cf81" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M13 13H50V40H32L19 52V40H13ZM20 22H43M20 30H37"/></g><text x="96" y="404" fill="#ffe4a5" font-size="23" font-weight="700">Why it fits</text><text x="41" y="435" fill="#f6faf5" font-size="21">Frequent swallowing is the classic sign of</text><text x="41" y="462" fill="#f6faf5" font-size="21">post-tonsillectomy hemorrhage — blood</text><text x="41" y="489" fill="#f6faf5" font-size="21">trickling down the back of the throat</text><text x="41" y="516" fill="#f6faf5" font-size="21">before anyone sees it. Pain, a low-grade</text><text x="41" y="543" fill="#f6faf5" font-size="21">temperature and old dark blood are</text><text x="41" y="570" fill="#f6faf5" font-size="21">expected in the first hours; bright red</text><text x="41" y="597" fill="#f6faf5" font-size="21">bleeding and repeated swallowing are not.</text></g></svg>