<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc"><title id="title">Prostate cancer, PSA and DRE — memory cue</title><desc id="desc">The growing tree represents development: match care to the stage. Imagine: Imagine a PSA flag and examination point toward evaluation, not an automatic cancer verdict.</desc><rect width="560" height="320" rx="24" fill="#162238"/><path d="M24 22h512M24 298h512" stroke="#e4bb75" stroke-width="3"/><circle cx="280" cy="165" r="137" fill="#1e3447"/><path d="M280 260V90m0 85-60-42m60 3 62-47" stroke="#7cdaca" stroke-width="13"/><ellipse cx="212" cy="121" rx="40" ry="23" fill="#7cdaca" transform="rotate(30 212 121)"/><ellipse cx="344" cy="85" rx="40" ry="23" fill="#d0a1ee" transform="rotate(-30 344 85)"/><path d="m228 242h104l-15 38h-74z" fill="#c58b65"/></svg>