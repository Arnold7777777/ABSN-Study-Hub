<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc"><title id="title">Mastitis — memory cue</title><desc id="desc">The flame represents injury: stop ongoing harm and assess what is threatened. Imagine: The fire represents focal breast inflammation with systemic symptoms, distinct from uncomplicated fullness.</desc><rect width="560" height="320" rx="24" fill="#162238"/><path d="M24 22h512M24 298h512" stroke="#e4bb75" stroke-width="3"/><circle cx="280" cy="165" r="137" fill="#1e3447"/><path d="M280 55q29 60 1 81 51-10 49-54 88 91 35 157-48 50-122 21-76-35-30-114 9 23 26 24-29-58 41-115z" fill="#d47758" stroke="#ffcc94" stroke-width="5"/><path d="M284 155q-51 64-24 90 45 30 60-15 10-29-36-75z" fill="#ffdb83"/></svg>