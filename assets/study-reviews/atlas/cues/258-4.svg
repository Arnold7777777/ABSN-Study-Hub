<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="name description">
<title id="name">The smoky chimney</title><desc id="description">Soot at the chimney and a changing voice recall possible inhalation injury. The bell means obtain urgent airway support: swelling can progress quickly.</desc>
