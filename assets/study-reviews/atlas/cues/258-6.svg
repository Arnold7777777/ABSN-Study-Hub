<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="name description">
<title id="name">Sugar by the clock</title><desc id="description">The sugar cube stands for fast-acting carbohydrate for an alert patient who can swallow safely and has low glucose. The clock cues a glucose recheck after 15 minutes.</desc>
