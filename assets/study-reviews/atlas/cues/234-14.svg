<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="name description">
<title id="name">The bellows and the bell</title><desc id="description">The stiff bellows stands for a preterm newborn working hard to breathe. Grunting, flaring or retractions are cues to get neonatal help.</desc>
