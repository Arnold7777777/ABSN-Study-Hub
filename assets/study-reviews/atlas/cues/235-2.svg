<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="name description">
<title id="name">The moon over an empty crib</title><desc id="description">The moon means every sleep. The empty crib stands for a separate firm, flat sleep surface with no pillows, loose blankets or toys.</desc>
