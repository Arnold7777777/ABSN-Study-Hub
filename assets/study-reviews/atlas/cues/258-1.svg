<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="name description">
<title id="name">Flashes before the curtain</title><desc id="description">New flashes and floaters followed by a curtain over vision suggest retinal detachment. The closing curtain cues urgent ophthalmologic evaluation.</desc>
