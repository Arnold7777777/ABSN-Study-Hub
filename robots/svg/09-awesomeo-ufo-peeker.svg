<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="09-awesomeo-ufo-peeker-title 09-awesomeo-ufo-peeker-desc">
  <title id="09-awesomeo-ufo-peeker-title">UFO rustic robot card peeker</title>
  <desc id="09-awesomeo-ufo-peeker-desc">A curious copper robot peeks under a tiny floating saucer and turquoise beam.</desc>
  <style>
    .bot{transform-origin:180px 205px;animation:peek 3.4s ease-in-out infinite}
    .hand-l{transform-origin:72px 169px;animation:handL 2.8s ease-in-out infinite}
    .hand-r{transform-origin:288px 169px;animation:handR 3.1s ease-in-out infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.3s linear infinite}
    .lamp{animation:pulse 1.8s ease-in-out infinite}
    .float{animation:float 3s ease-in-out infinite}
    .spark{animation:twinkle 1.5s ease-in-out infinite alternate}
    @keyframes peek{0%,100%{transform:translateY(7px) rotate(-.4deg)}50%{transform:translateY(0) rotate(.4deg)}}
    @keyframes handL{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
    @keyframes handR{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-5deg)}}
    @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}
    @keyframes pulse{0%,100%{opacity:.55;filter:drop-shadow(0 0 2px #6fffee)}50%{opacity:1;filter:drop-shadow(0 0 10px #6fffee)}}
    @keyframes float{0%,100%{transform:translateY(-2px)}50%{transform:translateY(5px)}}
    @keyframes twinkle{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd08a"/><stop offset=".28" stop-color="#c36b2d"/><stop offset=".64" stop-color="#71351f"/><stop offset="1" stop-color="#e3a751"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0a5"/><stop offset=".45" stop-color="#c89025"/><stop offset="1" stop-color="#6d4314"/></linearGradient>
    <radialGradient id="screen" cx="50%" cy="35%" r="75%"><stop stop-color="#182a36"/><stop offset="1" stop-color="#05090e"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#07111d" flood-opacity=".45"/></filter>
  </defs>
  <g class="float"><ellipse cx="180" cy="20" rx="55" ry="12" fill="#a96535" stroke="#422419" stroke-width="5"/><path d="M147 18q7-29 33-29t33 29" fill="#a9edff" stroke="#55321e" stroke-width="5"/><path d="M151 30h58l30 79H121z" fill="#6fffee" opacity=".16"/></g>
  <g class="bot" filter="url(#shadow)">
    <path d="M180 39V20" stroke="#8f5526" stroke-width="8" stroke-linecap="round"/>
    <circle class="lamp" cx="180" cy="16" r="9" fill="#6fffee" stroke="#4b2b1a" stroke-width="4"/>
    <rect x="82" y="39" width="196" height="138" rx="55" fill="url(#copper)" stroke="#402319" stroke-width="7"/>
    <path d="M99 69Q180 30 261 69" fill="none" stroke="#ffe0a0" stroke-opacity=".36" stroke-width="8"/>
    <circle cx="102" cy="75" r="6" fill="#4d2b1a"/><circle cx="258" cy="75" r="6" fill="#4d2b1a"/>
    <circle cx="102" cy="145" r="6" fill="#4d2b1a"/><circle cx="258" cy="145" r="6" fill="#4d2b1a"/>
    <rect x="108" y="66" width="144" height="84" rx="31" fill="url(#screen)" stroke="url(#brass)" stroke-width="7"/>
    <g class="eye" fill="#6fffee"><circle cx="148" cy="101" r="15"/><circle cx="212" cy="101" r="15"/><circle cx="148" cy="101" r="6" fill="#06222c"/><circle cx="212" cy="101" r="6" fill="#06222c"/></g>
    <circle cx="180" cy="130" r="9" fill="none" stroke="#6fffee" stroke-width="6"/>
    <path d="M136 164h88l18 35H118z" fill="url(#brass)" stroke="#4c2c19" stroke-width="6"/>
    <g class="hand-l">
      <rect x="49" y="151" width="43" height="24" rx="12" fill="url(#brass)" stroke="#452719" stroke-width="5"/>
      <circle cx="57" cy="158" r="12" fill="url(#copper)" stroke="#452719" stroke-width="4"/>
      <circle cx="72" cy="151" r="12" fill="url(#copper)" stroke="#452719" stroke-width="4"/>
      <circle cx="87" cy="158" r="12" fill="url(#copper)" stroke="#452719" stroke-width="4"/>
    </g>
    <g class="hand-r">
      <rect x="268" y="151" width="43" height="24" rx="12" fill="url(#brass)" stroke="#452719" stroke-width="5"/>
      <circle cx="273" cy="158" r="12" fill="url(#copper)" stroke="#452719" stroke-width="4"/>
      <circle cx="288" cy="151" r="12" fill="url(#copper)" stroke="#452719" stroke-width="4"/>
      <circle cx="303" cy="158" r="12" fill="url(#copper)" stroke="#452719" stroke-width="4"/>
    </g>
  </g>
</svg>
