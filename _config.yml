# Keep the Pages package below its 1 GB limit. These original decks remain
# in this repository; published download links use raw.githubusercontent.com.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - downloads/nur235/NUR235-Content-Mastery-PowerPoint-11x17.pptx
  - downloads/nur235/NUR235_Exam_3_Visual_Review_11x17.pptx
