<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 736" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Pediatric musculoskeletal injuries</title><desc id="d">A growing bone beside an adult one, with the growth plate marked as the weak point in the child, and the bending fractures a child gets - greenstick and buckle - drawn beside a complete adult break. Beside them the six Ps of compartment syndrome in the order they appear. Below, the fracture patterns that suggest abuse, and cast care.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="736" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ffc233" fill-opacity=".22" stroke="#ffc233" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ffc233"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ffc233">THE GROWTH PLATE IS THE WEAK POINT</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">An injury that would sprain an adult ligament fractures a child's physis instead — and that can shorten the limb permanently.</text><rect x="24" y="96" width="452" height="296" rx="14" fill="#ffc233" fill-opacity=".16" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="296" rx="2.5" fill="#ffc233"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🦴  WHY A CHILD'S BONE BREAKS DIFFERENTLY</text><path d="M70 176 q-16 -14 0 -26 q16 -12 24 0 q10 -12 24 0 q14 12 0 26 v108 q14 14 0 26 q-10 12 -24 0 q-8 12 -24 0 q-16 -12 0 -26 z" fill="#e9dfd2" fill-opacity=".35" stroke="#e9dfd2" stroke-opacity=".6" stroke-width="2"/><rect x="71" y="174" width="46" height="9" rx="3" fill="#ff3b6b" fill-opacity=".95"/><rect x="71" y="288" width="46" height="9" rx="3" fill="#ff3b6b" fill-opacity=".95"/><text x="142" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">GROWTH PLATE</text><text x="142" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">the weakest point</text><text x="142" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">damage here can</text><text x="142" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">shorten the limb</text><text x="94" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">A CHILD</text><path d="M268 170 h74" stroke="#e9dfd2" stroke-opacity=".5" stroke-width="12" stroke-linecap="round"/><path d="M306 170 v-9" stroke="#ff8a3d" stroke-width="3"/><path d="M306 164 q6 8 0 16" fill="none" stroke="#e9dfd2" stroke-opacity=".5" stroke-width="12" stroke-linecap="round"/><text x="354" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">GREENSTICK</text><text x="354" y="183" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">bends, cracks one side</text><path d="M268 228 h74" stroke="#e9dfd2" stroke-opacity=".5" stroke-width="12" stroke-linecap="round"/><circle cx="306" cy="228" r="9" fill="#e9dfd2" fill-opacity=".5"/><text x="354" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">BUCKLE</text><text x="354" y="241" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">compresses and bulges</text><path d="M268 286 h74" stroke="#e9dfd2" stroke-opacity=".5" stroke-width="12" stroke-linecap="round"/><path d="M306 285 v-12 M306 287 v12" stroke="#2f6bff" stroke-width="3"/><path d="M304 286 h6" stroke="#0b0716" stroke-width="12"/><text x="354" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">COMPLETE</text><text x="354" y="299" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">what an adult does</text><text x="46" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Children's bones bend rather than snap,</text><text x="46" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">and they heal considerably faster than an adult's.</text><rect x="496" y="96" width="400" height="296" rx="14" fill="#ff3b6b" fill-opacity=".17" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="96" width="5" height="296" rx="2.5" fill="#ff3b6b"/><text x="514" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  COMPARTMENT SYNDROME — THE SIX Ps</text><text x="514" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">They appear roughly in this order:</text><circle cx="528" cy="174" r="10" fill="#ff3b6b" fill-opacity=".9"/><text x="528" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">1</text><text x="546" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">PAIN</text><text x="666" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">out of proportion; worse on stretch</text><circle cx="528" cy="206" r="10" fill="#ff3b6b" fill-opacity=".9"/><text x="528" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">2</text><text x="546" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">PRESSURE</text><text x="666" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">the limb feels tight and full</text><circle cx="528" cy="238" r="10" fill="#ff8a3d" fill-opacity=".9"/><text x="528" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">3</text><text x="546" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">PARAESTHESIA</text><text x="666" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">tingling, numbness</text><circle cx="528" cy="270" r="10" fill="#ffc233" fill-opacity=".9"/><text x="528" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">4</text><text x="546" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">PALLOR</text><text x="666" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">pale, cool</text><circle cx="528" cy="302" r="10" fill="#2f6bff" fill-opacity=".9"/><text x="528" y="306" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">5</text><text x="546" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">PARALYSIS</text><text x="666" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">cannot move it</text><circle cx="528" cy="334" r="10" fill="#2f6bff" fill-opacity=".9"/><text x="528" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">6</text><text x="546" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">PULSELESSNESS</text><text x="666" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">last, and far too late</text><text x="514" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">PAIN is the one that saves the limb. By the time</text><text x="514" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">the pulse has gone, it is often far too late.</text><rect x="24" y="410" width="452" height="288" rx="14" fill="#c02255" fill-opacity=".18" stroke="#c02255" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="410" width="5" height="288" rx="2.5" fill="#c02255"/><text x="46" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">🚨  PATTERNS THAT SUGGEST ABUSE</text><text x="46" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">· A spiral fracture in a child who is not yet walking</text><text x="46" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">· Fractures at several different stages of healing</text><text x="46" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">· A rib, femur or humerus fracture in an infant</text><text x="46" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">· A history that does not match the injury</text><text x="46" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">· A history that keeps changing between tellings</text><text x="46" y="592" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">· A delay in seeking care that is not explained</text><text x="46" y="630" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">Nurses are mandatory reporters. SUSPICION is enough —</text><text x="46" y="650" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">proof is not required and is not your job.</text><text x="46" y="678" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">Document objectively: what you saw, and what was said,</text><text x="46" y="694" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">in their own words. No conclusions in the chart.</text><rect x="496" y="410" width="400" height="288" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="410" width="5" height="288" rx="2.5" fill="#12b886"/><text x="518" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  CASTS AND TRACTION</text><text x="518" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Elevate above the heart for the first 48 hours</text><text x="518" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Ice over the fracture site, not the whole cast</text><text x="518" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Neurovascular checks distal to it, hourly at first</text><text x="518" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Nothing down the cast to scratch — cool air instead</text><text x="518" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· A plaster cast dries in 24–72 h: palms only, no</text><text x="518" y="592" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  fingertips, and leave it uncovered to dry</text><text x="518" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Report: a hot spot, a smell, drainage, or new pain</text><text x="518" y="640" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Traction weights hang FREE and are never lifted off</text><text x="518" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Pin sites: check for redness, drainage, loosening</text><text x="518" y="694" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Hip dysplasia: Pavlik harness, worn 23 hours a day.</text></svg>