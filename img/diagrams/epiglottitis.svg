<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Epiglottitis</title><desc id="d">A side view of the upper airway with a normal epiglottis and a swollen cherry-red one, the four D signs, and the things that must never be done.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="620" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">EPIGLOTTITIS — THE ONE YOU DO NOT TOUCH</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A swollen epiglottis can close the airway in minutes. Everything here protects that airway.</text><rect x="24" y="92" width="420" height="262" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="262" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">WHAT CLOSES THE AIRWAY</text><ellipse cx="136" cy="214" rx="76" ry="66" fill="#e8a9a0" fill-opacity=".18" stroke="#e8a9a0" stroke-opacity=".38" stroke-width="1.6"/><path d="M102 200 q34 -14 68 0 q10 42 -34 62 q-44 -20 -34 -62z" fill="#0b0718" stroke="#8ea6ff" stroke-opacity=".45" stroke-width="1.6"/><path d="M116 204 l24 46 M156 204 l-24 46" stroke="#e9edff" stroke-opacity=".78" stroke-width="5" stroke-linecap="round"/><path d="M102 196 q34 -22 68 0 q-8 12 -34 12 q-26 0 -34 -12z" fill="#12b886" fill-opacity=".92" stroke="#fff" stroke-opacity=".3"/><text x="58" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="start">epiglottis</text><path d="M102 170 L118 192" stroke="#cfd4ff" stroke-opacity=".7" stroke-width="1.3"/><text x="180" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#dfe2ff" fill-opacity="1" text-anchor="start">vocal cords</text><path d="M178 260 L152 240" stroke="#cfd4ff" stroke-opacity=".7" stroke-width="1.3"/><text x="224" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#8ea6ff" fill-opacity="1" text-anchor="end">airway</text><path d="M198 196 L138 228" stroke="#8ea6ff" stroke-opacity=".7" stroke-width="1.3"/><text x="136" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">Normal epiglottis</text><text x="136" y="333" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">Thin flap, airway open</text><ellipse cx="340" cy="214" rx="76" ry="66" fill="#e8a9a0" fill-opacity=".18" stroke="#e8a9a0" stroke-opacity=".38" stroke-width="1.6"/><path d="M306 200 q34 -14 68 0 q10 42 -34 62 q-44 -20 -34 -62z" fill="#0b0718" stroke="#8ea6ff" stroke-opacity=".45" stroke-width="1.6"/><path d="M320 204 l24 46 M360 204 l-24 46" stroke="#e9edff" stroke-opacity=".78" stroke-width="5" stroke-linecap="round"/><ellipse cx="340" cy="206" rx="46" ry="26" fill="#ff3b6b" fill-opacity=".96" stroke="#fff" stroke-opacity=".38" stroke-width="1.6"/><ellipse cx="328" cy="196" rx="20" ry="8" fill="#fff" fill-opacity=".16"/><text x="262" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">epiglottis</text><path d="M306 170 L322 198" stroke="#cfd4ff" stroke-opacity=".7" stroke-width="1.3"/><text x="384" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#dfe2ff" fill-opacity="1" text-anchor="start">vocal cords</text><path d="M382 260 L356 240" stroke="#cfd4ff" stroke-opacity=".7" stroke-width="1.3"/><text x="428" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#8ea6ff" fill-opacity="1" text-anchor="end">airway</text><path d="M402 196 L346 242" stroke="#8ea6ff" stroke-opacity=".7" stroke-width="1.3"/><text x="340" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">Epiglottitis</text><text x="340" y="333" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">Cherry-red, airway gone</text><path d="M212 214 L244 214" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="460" y="92" width="416" height="262" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="92" width="5" height="262" rx="2.5" fill="#ffc233"/><text x="480" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ THE FOUR D’s — SUDDEN ONSET</text><circle cx="496" cy="147" r="13" fill="#ffc233"/><text x="496" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">D</text><text x="518" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Drooling</text><text x="518" y="165" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">cannot swallow her own saliva</text><circle cx="496" cy="187" r="13" fill="#ffc233"/><text x="496" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">D</text><text x="518" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Dysphagia</text><text x="518" y="205" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">painful, refuses to swallow</text><circle cx="496" cy="227" r="13" fill="#ffc233"/><text x="496" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">D</text><text x="518" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Dysphonia</text><text x="518" y="245" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">muffled, hot-potato voice</text><circle cx="496" cy="267" r="13" fill="#ffc233"/><text x="496" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">D</text><text x="518" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Distressed</text><text x="518" y="285" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">tripod position, chin thrust out</text><text x="480" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Fever, and she looks sick fast — hours, not days.</text><rect x="24" y="370" width="852" height="116" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="370" width="5" height="116" rx="2.5" fill="#ff3b6b"/><text x="44" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚫 NEVER — any of these can close the airway</text><rect x="46" y="418" width="158" height="50" rx="11" fill="#ff3b6b" fill-opacity=".30" stroke="#ff3b6b" stroke-opacity=".8"/><text x="125" y="438" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">Do not look in</text><text x="125" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">the throat</text><rect x="214" y="418" width="158" height="50" rx="11" fill="#ff3b6b" fill-opacity=".30" stroke="#ff3b6b" stroke-opacity=".8"/><text x="293" y="438" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">No tongue</text><text x="293" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">blade</text><rect x="382" y="418" width="158" height="50" rx="11" fill="#ff3b6b" fill-opacity=".30" stroke="#ff3b6b" stroke-opacity=".8"/><text x="461" y="438" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">No throat</text><text x="461" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">culture</text><rect x="550" y="418" width="158" height="50" rx="11" fill="#ff3b6b" fill-opacity=".30" stroke="#ff3b6b" stroke-opacity=".8"/><text x="629" y="438" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">Do not lay</text><text x="629" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">her flat</text><rect x="718" y="418" width="158" height="50" rx="11" fill="#ff3b6b" fill-opacity=".30" stroke="#ff3b6b" stroke-opacity=".8"/><text x="797" y="438" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">Do not leave</text><text x="797" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">her alone</text><rect x="24" y="500" width="852" height="98" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="500" width="5" height="98" rx="2.5" fill="#12b886"/><text x="44" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅ WHAT YOU DO, IN ORDER</text><circle cx="59" cy="564" r="13" fill="#12b886"/><text x="59" y="569" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">1</text><text x="79" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Keep her calm</text><text x="79" y="577" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">on the parent’s lap</text><path d="M232 564 L248 564" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="269" cy="564" r="13" fill="#12b886"/><text x="269" y="569" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">2</text><text x="289" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Sitting upright</text><text x="289" y="577" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">let her pick</text><path d="M442 564 L458 564" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="479" cy="564" r="13" fill="#12b886"/><text x="479" y="569" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">3</text><text x="499" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Call for help</text><text x="499" y="577" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">intubation tray at bedside</text><path d="M652 564 L668 564" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="689" cy="564" r="13" fill="#12b886"/><text x="689" y="569" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">4</text><text x="709" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Then IV antibiotics</text><text x="709" y="577" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">after the airway</text></svg>