<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 706" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Isolation precautions</title><desc id="d">Four doorways side by side, one for each category. Above each, the room it needs - a negative-pressure room for airborne, a positive-pressure one for protective isolation - and beside each the kit you put on before you go through: gown and gloves, a surgical mask, an N95. Under each, the organisms that belong there. Below, the ones that catch people out.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="706" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#00c2c7" fill-opacity=".22" stroke="#00c2c7" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#00c2c7"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#00c2c7">GET THE ROOM AND THE MASK RIGHT</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Three transmission-based categories, one protective one, and a few "precautions" that are not isolation at all.</text><rect x="24" y="96" width="212" height="396" rx="14" fill="#ff8a3d" fill-opacity=".15" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="396" rx="2.5" fill="#ff8a3d"/><text x="130.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">CONTACT</text><text x="130.0" y="144" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">touching her, or her things</text><rect x="90" y="158" width="80" height="96" rx="8" fill="#0b0716" fill-opacity=".75" stroke="#ff8a3d" stroke-width="3"/><circle cx="158" cy="238" r="3.5" fill="#ff8a3d"/><text x="130.0" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">private room</text><text x="130.0" y="207" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">or cohort</text><text x="40" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">PUT ON</text><rect x="40" y="282" width="180" height="20" rx="8" fill="#ff8a3d" fill-opacity=".26" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="40" y="306" width="180" height="20" rx="8" fill="#ff8a3d" fill-opacity=".26" stroke="#ff8a3d" stroke-opacity=".75"/><text x="50" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">gown</text><text x="50" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">gloves</text><text x="40" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">WHO GOES IN IT</text><text x="40" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">MRSA · VRE</text><text x="40" y="373" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">C. difficile</text><text x="40" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">scabies · RSV</text><text x="40" y="403" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">draining wounds</text><text x="40" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">impetigo</text><text x="40" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">C. diff: SOAP AND WATER</text><rect x="250" y="96" width="212" height="396" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="250" y="96" width="5" height="396" rx="2.5" fill="#2f6bff"/><text x="356.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">DROPLET</text><text x="356.0" y="144" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">large drops, fall within 1 m</text><rect x="316" y="158" width="80" height="96" rx="8" fill="#0b0716" fill-opacity=".75" stroke="#2f6bff" stroke-width="3"/><circle cx="384" cy="238" r="3.5" fill="#2f6bff"/><text x="356.0" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">private room</text><text x="356.0" y="207" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">door may stay open</text><text x="266" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">PUT ON</text><rect x="266" y="282" width="180" height="20" rx="8" fill="#2f6bff" fill-opacity=".26" stroke="#2f6bff" stroke-opacity=".75"/><rect x="266" y="306" width="180" height="20" rx="8" fill="#2f6bff" fill-opacity=".26" stroke="#2f6bff" stroke-opacity=".75"/><text x="276" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">surgical mask</text><text x="276" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">within 1 meter</text><text x="266" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">WHO GOES IN IT</text><text x="266" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">influenza</text><text x="266" y="373" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">pertussis</text><text x="266" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">mumps · rubella</text><text x="266" y="403" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">meningococcus</text><text x="266" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">group A strep</text><text x="266" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Mask HER for transport</text><rect x="476" y="96" width="212" height="396" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="476" y="96" width="5" height="396" rx="2.5" fill="#ff3b6b"/><text x="582.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">AIRBORNE</text><text x="582.0" y="144" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">tiny, stays suspended</text><rect x="542" y="158" width="80" height="96" rx="8" fill="#0b0716" fill-opacity=".75" stroke="#ff3b6b" stroke-width="3"/><circle cx="610" cy="238" r="3.5" fill="#ff3b6b"/><text x="582.0" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">NEGATIVE pressure</text><text x="582.0" y="207" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">door stays SHUT</text><text x="492" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">PUT ON</text><rect x="492" y="282" width="180" height="20" rx="8" fill="#ff3b6b" fill-opacity=".26" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="492" y="306" width="180" height="20" rx="8" fill="#ff3b6b" fill-opacity=".26" stroke="#ff3b6b" stroke-opacity=".75"/><text x="502" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">N95, fit-tested</text><text x="502" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">gown + gloves if soiling</text><text x="492" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">WHO GOES IN IT</text><text x="492" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Measles</text><text x="492" y="373" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">TB</text><text x="492" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Varicella</text><text x="492" y="403" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><text x="492" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">remember MTV</text><text x="492" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Fit-test before you rely on it</text><rect x="702" y="96" width="212" height="396" rx="14" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="702" y="96" width="5" height="396" rx="2.5" fill="#12b886"/><text x="808.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">PROTECTIVE</text><text x="808.0" y="144" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">SHE is the one protected</text><rect x="768" y="158" width="80" height="96" rx="8" fill="#0b0716" fill-opacity=".75" stroke="#12b886" stroke-width="3"/><circle cx="836" cy="238" r="3.5" fill="#12b886"/><text x="808.0" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">POSITIVE pressure</text><text x="808.0" y="207" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">door stays SHUT</text><text x="718" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">PUT ON</text><rect x="718" y="282" width="180" height="20" rx="8" fill="#12b886" fill-opacity=".26" stroke="#12b886" stroke-opacity=".75"/><rect x="718" y="306" width="180" height="20" rx="8" fill="#12b886" fill-opacity=".26" stroke="#12b886" stroke-opacity=".75"/><text x="728" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">mask, gown, gloves</text><text x="728" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">to protect HER</text><text x="718" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">WHO GOES IN IT</text><text x="718" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">neutropenic</text><text x="718" y="373" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">transplant</text><text x="718" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">severe burns</text><text x="718" y="403" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><text x="718" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">no fresh flowers,</text><text x="718" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">no raw fruit or veg</text><rect x="24" y="510" width="872" height="168" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="510" width="5" height="168" rx="2.5" fill="#ffc233"/><text x="46" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐  THE ONES THAT CATCH PEOPLE</text><text x="46" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">C. difficile</text><text x="206" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">contact — but alcohol gel does NOT kill the spores. Soap and water, and bleach on the surfaces.</text><text x="46" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Neutropenic</text><text x="206" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">is the reverse of isolation: everyone else is the hazard, so the air blows OUT of her room.</text><text x="46" y="620" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Negative vs positive</text><text x="206" y="620" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">airborne pulls air IN so nothing escapes; protective pushes air OUT so nothing gets in.</text><text x="46" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Seizure and fall</text><text x="206" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">precautions are not isolation at all, and neither is a private room for confusion.</text><text x="46" y="674" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text></svg>