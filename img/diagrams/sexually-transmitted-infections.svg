<svg viewBox="0 0 720 656" role="img" aria-label="Top: the genital ulcer contrast - syphilis gives a painless chancre, herpes gives painful grouped blisters. Middle: the six infections laid out by their giveaway finding, organism and first-line treatment. Bottom: what untreated chlamydia and gonorrhea turn into."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="652" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THE ULCER QUESTION</text><rect x="24" y="46" width="332" height="116" rx="12" fill="rgba(255,194,51,.88)" stroke="rgba(255,255,255,.6)" stroke-width="2"/><circle cx="70" cy="92" r="21" fill="#c99a3e" stroke="#8a6a2a" stroke-width="3"/><circle cx="70" cy="92" r="12" fill="#fbf1de"/><text x="104" y="84" font-size="19" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">PAINLESS ulcer</text><text x="104" y="106" font-size="17" font-weight="800" fill="#3a2a00" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">One clean sore, firm edge</text><text x="40" y="142" font-size="19" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">&rarr; SYPHILIS &middot; penicillin G</text><rect x="364" y="46" width="332" height="116" rx="12" fill="rgba(0,194,199,.88)" stroke="rgba(255,255,255,.6)" stroke-width="2"/><circle cx="394" cy="82" r="8" fill="#dffbfc" stroke="#0a5f63" stroke-width="2.5"/><circle cx="410" cy="76" r="8" fill="#dffbfc" stroke="#0a5f63" stroke-width="2.5"/><circle cx="426" cy="84" r="8" fill="#dffbfc" stroke="#0a5f63" stroke-width="2.5"/><circle cx="402" cy="100" r="8" fill="#dffbfc" stroke="#0a5f63" stroke-width="2.5"/><circle cx="420" cy="100" r="8" fill="#dffbfc" stroke="#0a5f63" stroke-width="2.5"/><text x="444" y="84" font-size="19" font-weight="800" fill="#00252b" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">PAINFUL blisters</text><text x="444" y="106" font-size="17" font-weight="800" fill="#013940" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">A cluster that ulcerates</text><text x="380" y="142" font-size="19" font-weight="800" fill="#00252b" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">&rarr; HERPES &middot; acyclovir, no cure</text><text x="24" y="186" font-size="19" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Painless = syphilis. Painful = herpes.</text><text x="24" y="206" font-size="17" font-weight="800" fill="#ffe9b8" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">That one line answers most ulcer questions.</text><text x="24" y="244" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THE SIX, BY THEIR GIVEAWAY</text><rect x="24" y="258" width="672" height="52" rx="10" fill="rgba(157,92,255,.62)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="36" y="280" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Chlamydia</text><text x="36" y="300" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Usually NOTHING at all</text><text x="688" y="280" font-size="17" font-weight="800" fill="#fff" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">Bacteria</text><text x="688" y="300" font-size="17" font-weight="800" fill="#fff" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">doxycycline</text><rect x="24" y="316" width="672" height="52" rx="10" fill="rgba(91,124,250,.66)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="36" y="338" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Gonorrhea</text><text x="36" y="358" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Thick discharge, dysuria</text><text x="688" y="338" font-size="17" font-weight="800" fill="#fff" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">Bacteria</text><text x="688" y="358" font-size="17" font-weight="800" fill="#fff" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">IM ceftriaxone</text><rect x="24" y="374" width="672" height="52" rx="10" fill="rgba(18,184,134,.85)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="36" y="396" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Trichomoniasis</text><text x="36" y="416" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Frothy yellow-green, itchy</text><text x="688" y="396" font-size="17" font-weight="800" fill="#fff" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">Parasite</text><text x="688" y="416" font-size="17" font-weight="800" fill="#fff" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">metronidazole</text><rect x="24" y="432" width="672" height="52" rx="10" fill="rgba(255,194,51,.88)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="36" y="454" font-size="19" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Syphilis</text><text x="36" y="474" font-size="17" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Painless chancre &rarr; palm rash</text><text x="688" y="454" font-size="17" font-weight="800" fill="#231a02" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">Bacteria</text><text x="688" y="474" font-size="17" font-weight="800" fill="#231a02" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">penicillin G</text><rect x="24" y="490" width="672" height="52" rx="10" fill="rgba(0,194,199,.88)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="36" y="512" font-size="19" font-weight="800" fill="#00252b" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Genital herpes</text><text x="36" y="532" font-size="17" font-weight="800" fill="#00252b" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Painful grouped blisters</text><text x="688" y="512" font-size="17" font-weight="800" fill="#00252b" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">Virus</text><text x="688" y="532" font-size="17" font-weight="800" fill="#00252b" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">acyclovir &mdash; controls only</text><rect x="24" y="548" width="672" height="52" rx="10" fill="rgba(201,24,74,.75)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="36" y="570" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">HPV</text><text x="36" y="590" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Warts, or nothing while it changes the cervix</text><text x="688" y="570" font-size="17" font-weight="800" fill="#fff" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">Virus</text><text x="688" y="590" font-size="17" font-weight="800" fill="#fff" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">vaccine prevents it</text><text x="24" y="620" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Screen rather than wait for symptoms.</text><text x="24" y="642" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Treat the partner too, or they just re-infect each other.</text></svg>