<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" role="img" aria-label="Six levels of organization, smallest first: chemical, cellular, tissue, organ, organ system, organism. Each level is built from the one before it."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="302" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="360.0" y="30" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">SMALLEST → LARGEST</text><rect x="30" y="44" width="660" height="34" rx="9" fill="#9d5cff" stroke="rgba(255,255,255,.6)" stroke-width="2"/><circle cx="52" cy="61.0" r="13" fill="rgba(0,0,0,.30)"/><text x="52" y="67.0" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">1</text><text x="76" y="67.0" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Chemical</text><text x="676" y="67.0" font-size="17" font-weight="800" fill="#fff" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">atoms and molecules</text><line x1="360.0" y1="79" x2="360.0" y2="84" stroke="#ffd76a" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="85" width="660" height="34" rx="9" fill="#2f6bff" stroke="rgba(255,255,255,.6)" stroke-width="2"/><circle cx="52" cy="102.0" r="13" fill="rgba(0,0,0,.30)"/><text x="52" y="108.0" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">2</text><text x="76" y="108.0" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Cellular</text><text x="676" y="108.0" font-size="17" font-weight="800" fill="#fff" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">the basic unit of life</text><line x1="360.0" y1="120" x2="360.0" y2="125" stroke="#ffd76a" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="126" width="660" height="34" rx="9" fill="#00c2c7" stroke="rgba(255,255,255,.6)" stroke-width="2"/><circle cx="52" cy="143.0" r="13" fill="rgba(0,0,0,.30)"/><text x="52" y="149.0" font-size="19" font-weight="800" fill="#00252b" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">3</text><text x="76" y="149.0" font-size="19" font-weight="800" fill="#00252b" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Tissue</text><text x="676" y="149.0" font-size="17" font-weight="800" fill="#00252b" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">similar cells, one job</text><line x1="360.0" y1="161" x2="360.0" y2="166" stroke="#ffd76a" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="167" width="660" height="34" rx="9" fill="#12b886" stroke="rgba(255,255,255,.6)" stroke-width="2"/><circle cx="52" cy="184.0" r="13" fill="rgba(0,0,0,.30)"/><text x="52" y="190.0" font-size="19" font-weight="800" fill="#04231a" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">4</text><text x="76" y="190.0" font-size="19" font-weight="800" fill="#04231a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Organ</text><text x="676" y="190.0" font-size="17" font-weight="800" fill="#04231a" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">two or more tissues</text><line x1="360.0" y1="202" x2="360.0" y2="207" stroke="#ffd76a" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="208" width="660" height="34" rx="9" fill="#ffc233" stroke="rgba(255,255,255,.6)" stroke-width="2"/><circle cx="52" cy="225.0" r="13" fill="rgba(0,0,0,.30)"/><text x="52" y="231.0" font-size="19" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">5</text><text x="76" y="231.0" font-size="19" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Organ system</text><text x="676" y="231.0" font-size="17" font-weight="800" fill="#231a02" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">organs cooperating</text><line x1="360.0" y1="243" x2="360.0" y2="248" stroke="#ffd76a" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="249" width="660" height="34" rx="9" fill="#ff8a3d" stroke="rgba(255,255,255,.6)" stroke-width="2"/><circle cx="52" cy="266.0" r="13" fill="rgba(0,0,0,.30)"/><text x="52" y="272.0" font-size="19" font-weight="800" fill="#2b1200" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">6</text><text x="76" y="272.0" font-size="19" font-weight="800" fill="#2b1200" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Organism</text><text x="676" y="272.0" font-size="17" font-weight="800" fill="#2b1200" text-anchor="end" font-family="Segoe UI,Roboto,system-ui,sans-serif">the whole human</text></svg>