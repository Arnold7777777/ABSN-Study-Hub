<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 632" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Obstetric emergencies</title><desc id="d">A birth with the shoulder stuck behind the pubic bone, with a hand pressing just above the pubic bone marked as correct and a hand on the fundus marked with a cross, because fundal pressure drives the shoulder harder in. Beside it the McRoberts position. Below, uterine rupture, inversion and amniotic fluid embolism.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="632" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">FOUR THINGS THAT TURN A BIRTH INTO A CRISIS IN SECONDS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">For shoulder dystocia, where you put your hands is the whole question.</text><rect x="24" y="96" width="470" height="336" rx="14" fill="#ff3b6b" fill-opacity=".16" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="336" rx="2.5" fill="#ff3b6b"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  SHOULDER DYSTOCIA — THE TURTLE SIGN</text><path d="M90 204 q54 -74 116 -10 q34 40 6 92 q-58 42 -110 4 q-30 -44 -12 -86 z" fill="#ffd9c2" fill-opacity=".14" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2"/><ellipse cx="228" cy="258" rx="15" ry="10" fill="#e9dfd2" fill-opacity=".8"/><text x="210" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="end">pubic bone</text><circle cx="258" cy="300" r="20" fill="#ffd9c2" fill-opacity=".6" stroke="#ffd9c2" stroke-opacity=".8" stroke-width="2"/><path d="M282 318 L262 302" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="284" y="306" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">head retracts</text><text x="284" y="319" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">back in</text><circle cx="214" cy="284" r="13" fill="#ff3b6b" fill-opacity=".85"/><text x="192" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="end">shoulder</text><text x="192" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="end">stuck</text><ellipse cx="228" cy="226" rx="21" ry="13" fill="#12b886" fill-opacity=".55" stroke="#12b886" stroke-width="2.5"/><text x="228" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">SUPRAPUBIC</text><ellipse cx="124" cy="188" rx="21" ry="13" fill="#ff3b6b" fill-opacity=".4" stroke="#ff3b6b" stroke-width="2.5"/><path d="M112 176 l24 24 M136 176 l-24 24" stroke="#ff3b6b" stroke-width="4" stroke-linecap="round"/><text x="124" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">FUNDAL — never</text><text x="46" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Fundal pressure drives the shoulder HARDER into the pubic bone</text><text x="46" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">and can rupture the uterus. Suprapubic only.</text><text x="46" y="378" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">1 call and note the time · 2 McRoberts · 3 suprapubic</text><text x="46" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">McRoberts rotates the pelvis and flattens the sacral</text><text x="46" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">promontory. Simple, and it usually works.</text><rect x="514" y="96" width="382" height="336" rx="14" fill="#c02255" fill-opacity=".18" stroke="#c02255" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="336" rx="2.5" fill="#c02255"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">🚨  THE OTHER THREE</text><text x="532" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">UTERINE RUPTURE</text><text x="532" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">sudden tearing pain, then the contractions STOP</text><text x="532" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">loss of station — the presenting part rises</text><text x="532" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">previous classical cesarean is the big risk</text><text x="532" y="214" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">→ stop oxytocin, fluids, straight to theatre</text><text x="532" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">UTERINE INVERSION</text><text x="532" y="256" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">the fundus turns inside out and follows the placenta</text><text x="532" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">sudden massive hemorrhage and shock</text><text x="532" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">never pull on a cord that has not separated</text><text x="532" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">→ do NOT remove the placenta; call, fluids, theatre</text><text x="532" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">AMNIOTIC FLUID EMBOLISM</text><text x="532" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">sudden dyspnoea, then collapse, then DIC</text><text x="532" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">it cannot be predicted or prevented</text><text x="532" y="378" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">→ CPR, oxygen, blood products, immediate delivery</text><rect x="24" y="450" width="872" height="152" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="450" width="5" height="152" rx="2.5" fill="#12b886"/><text x="46" y="480" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  WHAT ALL FOUR NEED, IMMEDIATELY</text><text x="46" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Call for help — you do not manage any of these alone</text><text x="46" y="532" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Two large-bore IVs, fluids running, type and crossmatch</text><text x="46" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Oxygen; continuous fetal and maternal monitoring</text><text x="46" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Stop the oxytocin if it is running</text><text x="486" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Note the TIME everything happened — it matters afterwards</text><text x="486" y="532" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Prepare for immediate operative delivery</text><text x="486" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Someone stays with her and tells her what is happening</text><text x="486" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Document as you go, or you will not remember the order</text></svg>