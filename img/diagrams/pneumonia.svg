<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Pneumonia</title><desc id="d">A healthy alveolus beside one filled with pus and fluid, which is why the crackles, the hypoxia and the consolidation all appear together. Beside it the bronchial tree drawn at its real angles, showing the right mainstem bronchus as the wider, straighter and more vertical one, which is why aspiration lands in the right lower lobe. Below, the classification that changes the antibiotic and the four things that change the outcome.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="720" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">THE INFECTION IS IN THE ALVEOLI THEMSELVES</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Not in the airways — in the gas-exchange sacs. Flood those and every sign follows.</text><rect x="24" y="96" width="470" height="300" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="300" rx="2.5" fill="#2f6bff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🫁  THE SURFACE WHERE OXYGEN CROSSES</text><rect x="46" y="140" width="196" height="184" rx="13" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".7"/><text x="144" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">HEALTHY</text><circle cx="110" cy="226" r="26" fill="#dfe9ff" fill-opacity=".14" stroke="#12b886" stroke-width="2.6"/><circle cx="176" cy="224" r="24" fill="#dfe9ff" fill-opacity=".14" stroke="#12b886" stroke-width="2.6"/><circle cx="140" cy="266" r="27" fill="#dfe9ff" fill-opacity=".14" stroke="#12b886" stroke-width="2.6"/><text x="110" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dfe9ff" fill-opacity="1" text-anchor="middle">AIR</text><text x="144" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">oxygen crosses freely</text><rect x="268" y="140" width="196" height="184" rx="13" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".7"/><text x="366" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">PNEUMONIA</text><circle cx="332" cy="226" r="26" fill="#c8b45a" fill-opacity=".8" stroke="#ff3b6b" stroke-width="2.6"/><circle cx="398" cy="224" r="24" fill="#c8b45a" fill-opacity=".8" stroke="#ff3b6b" stroke-width="2.6"/><circle cx="362" cy="266" r="27" fill="#c8b45a" fill-opacity=".8" stroke="#ff3b6b" stroke-width="2.6"/><text x="332" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#3a2f08" fill-opacity="1" text-anchor="middle">PUS</text><text x="366" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">oxygen cannot cross</text><path d="M248 232 L264 232" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="46" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">That one fact explains all of it: the crackles as air forces</text><text x="46" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">through fluid, the hypoxia, the consolidation on the film.</text><text x="46" y="390" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Dull to percussion, bronchial breath sounds over the patch.</text><rect x="512" y="96" width="384" height="300" rx="14" fill="#ffc233" fill-opacity=".16" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="512" y="96" width="5" height="300" rx="2.5" fill="#ffc233"/><text x="530" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">WHY THE RIGHT LOWER LOBE</text><path d="M704 174 V218" stroke="#e9c9b6" stroke-width="15" stroke-linecap="round" stroke-opacity=".7"/><text x="704.0" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#e6d0bd" fill-opacity="1" text-anchor="middle">trachea</text><path d="M704 218 L664 302" stroke="#ff3b6b" stroke-width="14" stroke-linecap="round"/><path d="M704 218 L780 282" stroke="#2f6bff" stroke-width="9" stroke-linecap="round"/><text x="608.0" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">RIGHT</text><text x="608.0" y="285" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">wider,</text><text x="608.0" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">straighter,</text><text x="608.0" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">more vertical</text><text x="790.0" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">LEFT</text><text x="790.0" y="285" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">narrower,</text><text x="790.0" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">sharper angle</text><text x="530" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Anything aspirated takes the path of least resistance —</text><text x="530" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">so it goes right, and gravity takes it to the lower lobe.</text><text x="530" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Aspiration is the commonest hospital route in. It is why</text><text x="530" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">you sit her up to eat and check the swallow first.</text><rect x="24" y="414" width="872" height="174" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="414" width="5" height="174" rx="2.5" fill="#2f6bff"/><text x="46" y="442" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">THE CLASSIFICATION THAT CHANGES THE ANTIBIOTIC</text><text x="46" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">CAP</text><text x="46" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">community acquired</text><text x="200" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">outside hospital, or under 48 h after admission</text><text x="520" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">Strep pneumoniae; Mycoplasma in young adults</text><text x="46" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">HAP</text><text x="46" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">hospital acquired</text><text x="200" y="506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">48 h or more after admission</text><text x="520" y="506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">Pseudomonas, MRSA, gram negatives — resistant</text><text x="46" y="532" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">VAP</text><text x="46" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">ventilator associated</text><text x="200" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">48 h or more after intubation</text><text x="520" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">the same resistant organisms</text><text x="46" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Aspiration</text><text x="46" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">after a swallow failure</text><text x="200" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">often the right lower lobe</text><text x="520" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">anaerobes</text><rect x="24" y="604" width="872" height="78" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="604" width="5" height="78" rx="2.5" fill="#12b886"/><text x="46" y="632" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅  THE FOUR THINGS THAT ACTUALLY CHANGE THE OUTCOME</text><rect x="46" y="646" width="196" height="28" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".7"/><text x="57" y="665" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#dff3ea" fill-opacity="1" text-anchor="start">Sit her UP — 45° or higher</text><rect x="256" y="646" width="196" height="28" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".7"/><text x="267" y="665" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#dff3ea" fill-opacity="1" text-anchor="start">Get her moving and coughing</text><rect x="466" y="646" width="196" height="28" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".7"/><text x="477" y="665" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#dff3ea" fill-opacity="1" text-anchor="start">Fluids, unless restricted</text><rect x="676" y="646" width="196" height="28" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".7"/><text x="687" y="665" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#dff3ea" fill-opacity="1" text-anchor="start">Antibiotic on time, every time</text></svg>