<svg viewBox="0 0 720 1494" role="img" aria-label="Seven panels showing what each sexually transmitted infection looks like on examination. Syphilis: one round painless ulcer with a firm rolled edge and a clean base. Chancroid: one to three ragged deep ulcers with soft undermined edges, painful. Herpes: a cluster of small blisters that break into shallow painful ulcers. HPV: soft cauliflower-shaped painless growths. Gonorrhea: no lesion but thick yellow-green discharge. Chlamydia: usually nothing visible at all. Trichomoniasis: frothy yellow-green discharge with an inflamed strawberry cervix."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="1490" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="34" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">WHAT YOU ACTUALLY SEE</text><text x="24" y="58" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">The lesion looks the same wherever it lands.</text><rect x="24" y="80" width="672" height="182" rx="12" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.42)" stroke-width="2"/><rect x="24" y="80" width="672" height="6" rx="3" fill="#ffc233"/><circle cx="54" cy="114" r="15" fill="#ffc233"/><text x="54" y="120" font-size="17" font-weight="800" fill="#1a1030" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">1</text><text x="78" y="120" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Syphilis &mdash; the primary chancre</text><text x="78" y="142" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Glans, vulva, anus, cervix, lip</text><ellipse cx="120" cy="204" rx="54" ry="40" fill="#e8c4a8" stroke="#b8845f" stroke-width="2.5"/><circle cx="120" cy="204" r="22" fill="#d9ad8c" stroke="#9a5f3a" stroke-width="6"/><circle cx="120" cy="204" r="13" fill="#f3d9c4"/><text x="212" y="176" font-size="19" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">ONE round ulcer, firm rolled edge</text><text x="212" y="198" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Clean smooth base, no pus</text><text x="212" y="220" font-size="19" font-weight="800" fill="#7ee8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">PAINLESS &mdash; that is the whole point</text><text x="212" y="242" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">It heals by itself. The infection does not.</text><rect x="24" y="276" width="672" height="182" rx="12" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.42)" stroke-width="2"/><rect x="24" y="276" width="672" height="6" rx="3" fill="#ff3b6b"/><circle cx="54" cy="310" r="15" fill="#ff3b6b"/><text x="54" y="316" font-size="17" font-weight="800" fill="#1a1030" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">2</text><text x="78" y="316" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Chancroid &mdash; the painful ulcer</text><text x="78" y="338" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Rare in the US, but it is the contrast</text><ellipse cx="120" cy="400" rx="54" ry="40" fill="#e8c4a8" stroke="#b8845f" stroke-width="2.5"/><circle cx="105" cy="392" r="16" fill="#b0553a" stroke="#8d3f2a" stroke-width="3"/><circle cx="105" cy="392" r="10" fill="#d9c9a8"/><circle cx="133" cy="410" r="13" fill="#b0553a" stroke="#8d3f2a" stroke-width="3"/><circle cx="133" cy="410" r="7" fill="#d9c9a8"/><text x="212" y="372" font-size="19" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">ONE to THREE ragged ulcers</text><text x="212" y="394" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Soft undermined edge, grey dirty base</text><text x="212" y="416" font-size="19" font-weight="800" fill="#ff9db4" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">PAINFUL, with tender swollen nodes</text><text x="212" y="438" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Painful ulcer is what rules syphilis out.</text><rect x="24" y="472" width="672" height="182" rx="12" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.42)" stroke-width="2"/><rect x="24" y="472" width="672" height="6" rx="3" fill="#00c2c7"/><circle cx="54" cy="506" r="15" fill="#00c2c7"/><text x="54" y="512" font-size="17" font-weight="800" fill="#1a1030" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">3</text><text x="78" y="512" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Genital herpes</text><text x="78" y="534" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Shaft, vulva, perianal &mdash; and it comes back</text><ellipse cx="120" cy="596" rx="54" ry="40" fill="#e8c4a8" stroke="#b8845f" stroke-width="2.5"/><circle cx="98" cy="583" r="7" fill="#f2f9ff" stroke="#c14b6a" stroke-width="2.5"/><circle cx="115" cy="577" r="7" fill="#f2f9ff" stroke="#c14b6a" stroke-width="2.5"/><circle cx="133" cy="585" r="7" fill="#f2f9ff" stroke="#c14b6a" stroke-width="2.5"/><circle cx="105" cy="600" r="7" fill="#f2f9ff" stroke="#c14b6a" stroke-width="2.5"/><circle cx="122" cy="598" r="7" fill="#f2f9ff" stroke="#c14b6a" stroke-width="2.5"/><circle cx="140" cy="602" r="7" fill="#f2f9ff" stroke="#c14b6a" stroke-width="2.5"/><circle cx="113" cy="615" r="7" fill="#f2f9ff" stroke="#c14b6a" stroke-width="2.5"/><circle cx="131" cy="617" r="7" fill="#f2f9ff" stroke="#c14b6a" stroke-width="2.5"/><text x="212" y="568" font-size="19" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">A CLUSTER of small blisters</text><text x="212" y="590" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">They break into shallow ulcers, then crust</text><text x="212" y="612" font-size="19" font-weight="800" fill="#ff9db4" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">PAINFUL, burning, stinging</text><text x="212" y="634" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">First outbreak about 14 days after exposure</text><rect x="24" y="668" width="672" height="182" rx="12" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.42)" stroke-width="2"/><rect x="24" y="668" width="672" height="6" rx="3" fill="#c9184a"/><circle cx="54" cy="702" r="15" fill="#c9184a"/><text x="54" y="708" font-size="17" font-weight="800" fill="#1a1030" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">4</text><text x="78" y="708" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">HPV &mdash; genital warts</text><text x="78" y="730" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Condylomata, usually several at once</text><ellipse cx="120" cy="792" rx="54" ry="40" fill="#e8c4a8" stroke="#b8845f" stroke-width="2.5"/><circle cx="87.0" cy="803.0" r="7.0" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="96.0" cy="796.0" r="8.0" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="105.0" cy="803.0" r="7.0" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="92.0" cy="790.0" r="6.0" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="101.0" cy="790.0" r="6.0" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><rect x="93" y="804" width="6" height="12" rx="3" fill="#c98f6b"/><circle cx="110.3" cy="792.2" r="9.1" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="122.0" cy="783.1" r="10.4" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="133.7" cy="792.2" r="9.1" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="116.8" cy="775.3" r="7.8" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="128.5" cy="775.3" r="7.8" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><rect x="119" y="792" width="6" height="12" rx="3" fill="#c98f6b"/><circle cx="137.9" cy="806.6" r="6.3" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="146.0" cy="800.3" r="7.2" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="154.1" cy="806.6" r="6.3" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="142.4" cy="794.9" r="5.4" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><circle cx="150.5" cy="794.9" r="5.4" fill="#e9b9a0" stroke="#a9714f" stroke-width="2"/><rect x="143" y="808" width="6" height="12" rx="3" fill="#c98f6b"/><text x="212" y="764" font-size="19" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Soft fleshy growths, cauliflower surface</text><text x="212" y="786" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Skin-coloured, painless, often several</text><text x="212" y="808" font-size="19" font-weight="800" fill="#7ee8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">The vaccine prevents this one</text><text x="212" y="830" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">It also changes the cervix with nothing to see</text><rect x="24" y="864" width="672" height="182" rx="12" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.42)" stroke-width="2"/><rect x="24" y="864" width="672" height="6" rx="3" fill="#5b7cfa"/><circle cx="54" cy="898" r="15" fill="#5b7cfa"/><text x="54" y="904" font-size="17" font-weight="800" fill="#1a1030" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">5</text><text x="78" y="904" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Gonorrhea</text><text x="78" y="926" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Urethra or cervix &mdash; often nothing at all</text><ellipse cx="120" cy="984" rx="54" ry="40" fill="#e8c4a8" stroke="#b8845f" stroke-width="2.5"/><ellipse cx="120" cy="974" rx="9" ry="13" fill="#b5795a" stroke="#8d5a3f" stroke-width="2"/><path d="M114 984 q 6 20 -2 30 q -3 6 4 8 q 12 3 16 -8 q 4 -16 -4 -30 z" fill="#e8d34a" stroke="#b39b1e" stroke-width="2"/><circle cx="122" cy="1030" r="5" fill="#e8d34a" stroke="#b39b1e" stroke-width="1.6"/><text x="212" y="960" font-size="19" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">No ulcer. THICK yellow-green discharge</text><text x="212" y="982" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Burning to urinate, if anything shows at all</text><text x="212" y="1004" font-size="19" font-weight="800" fill="#7ee8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">IM ceftriaxone</text><text x="212" y="1026" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Most people carry it with no symptoms</text><rect x="24" y="1060" width="672" height="182" rx="12" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.42)" stroke-width="2"/><rect x="24" y="1060" width="672" height="6" rx="3" fill="#9d5cff"/><circle cx="54" cy="1094" r="15" fill="#9d5cff"/><text x="54" y="1100" font-size="17" font-weight="800" fill="#1a1030" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">6</text><text x="78" y="1100" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Chlamydia</text><text x="78" y="1122" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">The commonest one, and the quietest</text><ellipse cx="120" cy="1180" rx="54" ry="40" fill="#e8c4a8" stroke="#b8845f" stroke-width="2.5"/><circle cx="120" cy="1180" r="30" fill="none" stroke="#7ee8ff" stroke-width="5"/><line x1="99" y1="1201" x2="141" y2="1159" stroke="#7ee8ff" stroke-width="5"/><text x="212" y="1156" font-size="19" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">USUALLY NOTHING TO SEE</text><text x="212" y="1178" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Maybe scant discharge or spotting after sex</text><text x="212" y="1200" font-size="19" font-weight="800" fill="#7ee8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Found by SCREENING, not by looking</text><text x="212" y="1222" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Under 25 and sexually active: test every year</text><rect x="24" y="1256" width="672" height="182" rx="12" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.42)" stroke-width="2"/><rect x="24" y="1256" width="672" height="6" rx="3" fill="#12b886"/><circle cx="54" cy="1290" r="15" fill="#12b886"/><text x="54" y="1296" font-size="17" font-weight="800" fill="#1a1030" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">7</text><text x="78" y="1296" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Trichomoniasis</text><text x="78" y="1318" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">The strawberry cervix</text><circle cx="120" cy="1378" r="42" fill="#e79aa6" stroke="#b45c6e" stroke-width="3"/><circle cx="97" cy="1368" r="5" fill="#a8203a"/><circle cx="114" cy="1357" r="5" fill="#a8203a"/><circle cx="132" cy="1363" r="5" fill="#a8203a"/><circle cx="101" cy="1388" r="5" fill="#a8203a"/><circle cx="120" cy="1380" r="5" fill="#a8203a"/><circle cx="141" cy="1384" r="5" fill="#a8203a"/><circle cx="112" cy="1401" r="5" fill="#a8203a"/><circle cx="135" cy="1401" r="5" fill="#a8203a"/><circle cx="147" cy="1376" r="5" fill="#a8203a"/><circle cx="91" cy="1382" r="5" fill="#a8203a"/><ellipse cx="120" cy="1378" rx="10" ry="6" fill="#7d1226"/><text x="212" y="1352" font-size="19" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">FROTHY yellow-green discharge, and it itches</text><text x="212" y="1374" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Punctate red spots on the cervix</text><text x="212" y="1396" font-size="19" font-weight="800" fill="#7ee8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Metronidazole for her AND the partner</text><text x="212" y="1418" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Bacterial vaginosis: thin, grey, fishy, no partner</text><text x="24" y="1474" font-size="19" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Painless single ulcer = syphilis. Painful cluster = herpes.</text></svg>