<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Falls and restraints</title><desc id="d">A ladder of alternatives with a restraint at the very top and everything that has to be tried first stacked below it. Beside it the rules that govern an order, and a knot tied to the movable bed frame rather than the rail. Below, who falls and what actually prevents it, and the order of actions after a fall.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="700" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#12b886"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#12b886">THE QUESTION IS ALWAYS: WHAT DID YOU TRY FIRST?</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A restraint is a last resort. The right answer is nearly always an alternative, or moving her closer to the desk.</text><rect x="24" y="96" width="470" height="336" rx="14" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="336" rx="2.5" fill="#12b886"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🪜  EXHAUST EVERY RUNG BEFORE THE TOP ONE</text><rect x="46" y="390" width="420" height="32" rx="9" fill="#12b886" fill-opacity=".18" stroke="#12b886" stroke-opacity=".8"/><text x="60" y="405" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">Reorient, and reduce the noise</text><rect x="46" y="350" width="420" height="32" rx="9" fill="#12b886" fill-opacity=".18" stroke="#12b886" stroke-opacity=".8"/><text x="60" y="365" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">Treat the cause</text><text x="60" y="378" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">pain, delirium, a full bladder, hypoxia</text><rect x="46" y="310" width="420" height="32" rx="9" fill="#12b886" fill-opacity=".18" stroke="#12b886" stroke-opacity=".8"/><text x="60" y="325" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">Toilet her on a schedule</text><text x="60" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">urgency is a huge cause</text><rect x="46" y="270" width="420" height="32" rx="9" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".8"/><text x="60" y="285" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">Bed and chair alarms</text><rect x="46" y="230" width="420" height="32" rx="9" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".8"/><text x="60" y="245" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">Move her where you can see her</text><text x="60" y="258" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">closer to the desk</text><rect x="46" y="190" width="420" height="32" rx="9" fill="#ff8a3d" fill-opacity=".18" stroke="#ff8a3d" stroke-opacity=".8"/><text x="60" y="205" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#eef0ff" fill-opacity="1" text-anchor="start">Sitter, or family at the bedside</text><rect x="46" y="150" width="420" height="32" rx="9" fill="#ff3b6b" fill-opacity=".30" stroke="#ff3b6b" stroke-opacity=".8"/><text x="60" y="165" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">RESTRAINT</text><text x="60" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">only when everything below has failed</text><path d="M36 402 L36 164" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="514" y="96" width="382" height="336" rx="14" fill="#ff3b6b" fill-opacity=".16" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="336" rx="2.5" fill="#ff3b6b"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">📋  IF IT DOES COME TO A RESTRAINT</text><text x="532" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· A provider order is required — always</text><text x="532" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· NEVER PRN. Never "as needed"</text><text x="532" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Time-limited, and it must be renewed</text><text x="532" y="214" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Least restrictive type that works</text><text x="532" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Quick-release knot, tied to the MOVABLE</text><text x="532" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">  bed frame — never to the side rail</text><text x="532" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Check and release: circulation, ROM,</text><text x="532" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">  toileting, skin, on a schedule</text><text x="532" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Two fingers must slide under it</text><text x="532" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Document what you tried before it</text><path d="M574 352 h150" stroke="#8e96c8" stroke-width="6" stroke-linecap="round"/><text x="730" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="start">side rail</text><path d="M574 386 h150" stroke="#cfd4ff" stroke-width="8" stroke-linecap="round"/><text x="730" y="390" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#cfd4ff" fill-opacity="1" text-anchor="start">movable frame</text><circle cx="630" cy="386" r="9" fill="none" stroke="#12b886" stroke-width="4"/><path d="M636 392 l14 14" stroke="#12b886" stroke-width="4" stroke-linecap="round"/><text x="630" y="420" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">tie HERE — it moves with the bed</text><path d="M624 346 l12 12 M636 346 l-12 12" stroke="#ff3b6b" stroke-width="3.4" stroke-linecap="round"/><rect x="24" y="450" width="470" height="212" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="450" width="5" height="212" rx="2.5" fill="#2f6bff"/><text x="46" y="480" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">👀  WHO FALLS</text><text x="46" y="508" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· A previous fall — the strongest predictor of all</text><text x="46" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Over 65 · confusion or delirium · poor vision</text><text x="46" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Sedatives, opioids, antihypertensives, and</text><text x="46" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">  diuretics — she is rushing to the toilet</text><text x="46" y="588" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Orthostatic drop: 20 systolic or 10 diastolic</text><text x="46" y="608" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Tethers: IV poles, catheters, oxygen tubing</text><text x="46" y="628" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Unfamiliar room, wrong footwear, weakness</text><text x="46" y="654" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Bed low and locked · call bell in reach · non-slip footwear · lighting.</text><rect x="514" y="450" width="382" height="212" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="450" width="5" height="212" rx="2.5" fill="#ffc233"/><text x="532" y="480" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🩺  AFTER A FALL — IN THIS ORDER</text><circle cx="544" cy="506" r="9" fill="#ffc233"/><text x="544" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">1</text><text x="560" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Assess HER first — do not move her yet</text><circle cx="544" cy="528" r="9" fill="#ffc233"/><text x="544" y="532" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">2</text><text x="560" y="532" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Then vital signs and a neuro check</text><circle cx="544" cy="550" r="9" fill="#ffc233"/><text x="544" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">3</text><text x="560" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Then notify the provider and the family</text><circle cx="544" cy="572" r="9" fill="#ffc233"/><text x="544" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">4</text><text x="560" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Then document what you found</text><text x="560" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Incident report — factual, and it does NOT</text><text x="560" y="620" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">go in the chart, and is not referred to in it</text><text x="532" y="642" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Assessing before moving is the whole point —</text><text x="532" y="656" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">you do not know what she broke yet.</text></svg>