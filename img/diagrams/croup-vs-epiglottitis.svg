<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 726" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Croup versus epiglottitis</title><desc id="d">Two children side by side: one with croup, unwell but interactive, and one with epiglottitis sitting bolt upright in the tripod position, leaning forward with the chin out and drooling. Under each, the airway drawn - narrowed below the cords in croup, and a swollen epiglottis sitting over the opening in epiglottitis. Below, the point-by-point comparison and the rule about putting nothing in the mouth.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="726" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">A BARKING COUGH, OR A CHILD SITTING FORWARD AND DROOLING</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A small amount of swelling closes a small airway. One goes home; the other needs a surgeon.</text><rect x="24" y="96" width="426" height="340" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="340" rx="2.5" fill="#2f6bff"/><text x="237.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">CROUP</text><text x="237.0" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c3d2ff" fill-opacity="1" text-anchor="middle">viral · parainfluenza · gradual, often at night</text><circle cx="136" cy="194" r="24" fill="#ffd9c2" fill-opacity=".6" stroke="#ffd9c2" stroke-opacity=".8" stroke-width="2"/><path d="M136 216 q26 -8 26 28 v48 q0 14 -26 14 q-26 0 -26 -14 v-48 q0 -36 26 -28 z" fill="#ffd9c2" fill-opacity=".28" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="2"/><text x="136" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">Sitting normally. Unwell,</text><text x="136" y="333" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">but still interacting</text><circle cx="128" cy="190" r="3" fill="#3a2030"/><circle cx="144" cy="190" r="3" fill="#3a2030"/><text x="166" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">“bark”</text><rect x="264" y="186" width="150" height="112" rx="11" fill="#0b0716" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".16"/><path d="M301 202 V284" stroke="#e9c9b6" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/><path d="M377 202 V284" stroke="#e9c9b6" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/><path d="M305 230 l16 0" stroke="#dfe9ff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/><path d="M373 230 l-16 0" stroke="#dfe9ff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/><path d="M305 238 q22 16 0 32" fill="none" stroke="#2f6bff" stroke-width="9" stroke-linecap="round"/><path d="M373 238 q-22 16 0 32" fill="none" stroke="#2f6bff" stroke-width="9" stroke-linecap="round"/><text x="339" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">narrow BELOW the cords</text><text x="44" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">BARKING, seal-like cough · hoarse voice · no drooling</text><text x="44" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">low-grade fever · any position is fine</text><text x="44" y="420" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Cool mist, steroids, nebulised adrenaline. Often home.</text><rect x="470" y="96" width="426" height="340" rx="14" fill="#ff3b6b" fill-opacity=".16" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="470" y="96" width="5" height="340" rx="2.5" fill="#ff3b6b"/><text x="683.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">EPIGLOTTITIS</text><text x="683.0" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">bacterial · H. influenzae b · sudden, over hours</text><circle cx="586" cy="194" r="24" fill="#ffd9c2" fill-opacity=".6" stroke="#ffd9c2" stroke-opacity=".8" stroke-width="2"/><path d="M566 214 q22 -6 30 26 v46 q0 14 -18 14 h-18 q-16 0 -16 -16 v-44 q0 -22 22 -26 z" fill="#ffd9c2" fill-opacity=".28" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="2"/><path d="M553 226 q-10 10 -34 46" fill="none" stroke="#ffd9c2" stroke-opacity=".6" stroke-width="11" stroke-linecap="round"/><circle cx="519" cy="272" r="7" fill="#ffd9c2" fill-opacity=".7"/><path d="M585 226 q9 10 30 46" fill="none" stroke="#ffd9c2" stroke-opacity=".6" stroke-width="11" stroke-linecap="round"/><circle cx="615" cy="272" r="7" fill="#ffd9c2" fill-opacity=".7"/><text x="570" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">TRIPOD — leaning forward,</text><text x="570" y="333" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">chin out, will not lie down</text><circle cx="578" cy="190" r="3" fill="#3a2030"/><circle cx="594" cy="190" r="3" fill="#3a2030"/><path d="M592 208 q4 14 0 22" fill="none" stroke="#9fd8ff" stroke-width="4" stroke-linecap="round" stroke-opacity=".9"/><text x="622" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">DROOLING</text><rect x="716" y="186" width="150" height="112" rx="11" fill="#0b0716" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".16"/><path d="M753 202 V284" stroke="#e9c9b6" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/><path d="M829 202 V284" stroke="#e9c9b6" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/><path d="M757 230 l16 0" stroke="#dfe9ff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/><path d="M825 230 l-16 0" stroke="#dfe9ff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/><ellipse cx="791" cy="224" rx="34" ry="15" fill="#ff3b6b" fill-opacity=".95"/><text x="791" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">epiglottis swollen over it</text><text x="490" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">NO cough · muffled "hot potato" voice · drooling</text><text x="490" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">fever over 39 °C · toxic, anxious, very still</text><text x="490" y="420" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Emergency airway in theatre. IV antibiotics.</text><rect x="24" y="454" width="452" height="232" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="454" width="5" height="232" rx="2.5" fill="#ffc233"/><text x="46" y="484" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐  THE 4 Ds OF EPIGLOTTITIS</text><text x="46" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">D</text><text x="60" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">rooling</text><text x="160" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">she cannot swallow her own saliva</text><text x="46" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">D</text><text x="60" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">ysphagia</text><text x="160" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">swallowing hurts, or will not happen</text><text x="46" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">D</text><text x="60" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">ysphonia</text><text x="160" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">muffled voice, or none at all</text><text x="46" y="606" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">D</text><text x="60" y="606" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">istress</text><text x="160" y="606" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">sitting forward, working to breathe</text><text x="46" y="654" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">A child drooling, sitting forward and not talking is</text><text x="46" y="672" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">epiglottitis until proven otherwise.</text><rect x="496" y="454" width="400" height="232" rx="14" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="454" width="5" height="232" rx="2.5" fill="#ff3b6b"/><text x="518" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  NOTHING GOES IN THE MOUTH</text><text x="518" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No tongue depressor</text><text x="518" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No throat swab</text><text x="518" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No oral thermometer</text><text x="518" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No oral airway</text><text x="518" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Do not lie her down</text><text x="518" y="640" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">Any of them can trigger complete laryngospasm</text><text x="518" y="656" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">and shut the airway entirely. Keep her calm, keep</text><text x="518" y="672" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">her upright, and get the airway team.</text></svg>