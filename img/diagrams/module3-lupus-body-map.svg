<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc"><title id="title">Lupus: one disease, many body systems</title><desc id="desc">A body map connects lupus with skin, joints, kidneys, heart and lungs, brain and blood.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a6b7df"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect width="1100" height="880" rx="24" fill="#10152b"/>
<text x="36" y="39" font-size="16" fill="#aabfe8" font-weight="700">NUR 258  /  MODULE 3  /  VISUAL STUDY GUIDE</text>
<text x="36" y="88" font-size="36" fill="#fff" font-weight="800">Lupus: one disease, many body systems</text>
<text x="36" y="125" font-size="21" fill="#c7d4ed" font-weight="400">Connect the familiar skin and joint findings to organ monitoring.</text>
<circle cx="550" cy="249" r="47" fill="#655ba0" stroke="#d5caff" stroke-width="3"/><path d="M492 318 Q550 290 608 318 L646 464 L607 480 L593 409 L592 545 L610 701 L566 701 L550 571 L534 701 L490 701 L508 545 L507 409 L493 480 L454 464Z" fill="#38365f" stroke="#b8abea" stroke-width="3"/>
<path d="M416 234 L507 255" stroke="#a6b7df" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="36" y="165" width="380" height="144" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="56" y="201" font-size="22" fill="#edb0d5" font-weight="800">SKIN</text>
<text x="56" y="241" font-size="21" fill="#edf2ff" font-weight="400">Photosensitive rash</text>
<text x="56" y="272" font-size="21" fill="#edf2ff" font-weight="400">Hair loss; mouth sores</text>
<path d="M684 234 L590 248" stroke="#a6b7df" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="684" y="165" width="380" height="144" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="704" y="201" font-size="22" fill="#edb0d5" font-weight="800">BRAIN / NERVES</text>
<text x="704" y="241" font-size="21" fill="#edf2ff" font-weight="400">New confusion or seizure:</text>
<text x="704" y="272" font-size="21" fill="#edf2ff" font-weight="400">urgent assessment</text>
<path d="M416 422 L512 371" stroke="#a6b7df" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="36" y="353" width="380" height="144" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="56" y="389" font-size="22" fill="#a9caff" font-weight="800">HEART / LUNGS</text>
<text x="56" y="429" font-size="21" fill="#edf2ff" font-weight="400">Chest pain or breathlessness:</text>
<text x="56" y="460" font-size="21" fill="#edf2ff" font-weight="400">assess promptly</text>
<path d="M684 422 L591 442" stroke="#a6b7df" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="684" y="353" width="380" height="144" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="704" y="389" font-size="22" fill="#8fe7d9" font-weight="800">KIDNEYS</text>
<text x="704" y="429" font-size="21" fill="#edf2ff" font-weight="400">Track BP, urine and renal labs.</text>
<text x="704" y="460" font-size="21" fill="#edf2ff" font-weight="400">Edema or urine changes: report.</text>
<path d="M416 610 L504 520" stroke="#a6b7df" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="36" y="541" width="380" height="144" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="56" y="577" font-size="22" fill="#f1d397" font-weight="800">JOINTS / ENERGY</text>
<text x="56" y="617" font-size="21" fill="#edf2ff" font-weight="400">Joint pain, swelling, fatigue</text>
<text x="56" y="648" font-size="21" fill="#edf2ff" font-weight="400">Balance activity with rest.</text>
<path d="M684 610 L590 530" stroke="#a6b7df" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="684" y="541" width="380" height="144" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="704" y="577" font-size="22" fill="#d0b5ff" font-weight="800">BLOOD / IMMUNITY</text>
<text x="704" y="617" font-size="21" fill="#edf2ff" font-weight="400">Follow CBC and infection signs.</text>
<text x="704" y="648" font-size="21" fill="#edf2ff" font-weight="400">Fever needs evaluation.</text>
<rect x="36" y="721" width="1028" height="77" rx="18" fill="#233b3d" stroke="#70d8c7" stroke-width="2"/>
<text x="57" y="752" font-size="20" fill="#8cebdc" font-weight="800">EVERYDAY PROTECTION</text>
<text x="57" y="782" font-size="22" fill="#edf2ff" font-weight="400">Sun protection • follow-up labs • prescribed medicines • report new organ symptoms</text>
<text x="36" y="838" font-size="16" fill="#abbddb" font-weight="400">Sources: NIH / NIAMS lupus overview and diagnosis, treatment and steps to take.</text>
<text x="36" y="864" font-size="15" fill="#abbddb" font-weight="400">Study aid • Reviewed September 23, 2026 • Source links and text version accompany this graphic.</text>
</g></svg>