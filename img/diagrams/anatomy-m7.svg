rt" font-family="Segoe UI,Roboto,system-ui,sans-serif">hearing</text><line x1="394" y1="273" x2="394" y2="282" stroke="#ffd76a" stroke-width="2.4" marker-end="url(#ah)"/><rect x="372" y="284" width="324" height="46" rx="9" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/><circle cx="394" cy="307" r="13" fill="#ffd76a"/><text x="394" y="313" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">5</text><text x="416" y="304" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Auditory nerve</text><text x="416" y="324" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">CN VIII</text><text x="24" y="372" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Semicircular canals = balance and rotation · cochlea = hearing</text></svg>