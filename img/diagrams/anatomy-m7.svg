<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-label="Left: the eye in section with cornea, iris, lens, vitreous body and retina labelled along the path light takes. Right: the ear with the tympanic membrane, the three ossicles, the cochlea and the semicircular canals, and the order sound travels."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="386" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THE EYE — LIGHT’S PATH</text><circle cx="170" cy="150" r="86" fill="#1c2b57" stroke="#e9e2ff" stroke-width="4"/><path d="M84 150 a 86 86 0 0 1 26 -60 l 0 120 a 86 86 0 0 1 -26 -60 z" fill="#7ee8ff" opacity=".9"/><rect x="98" y="104" width="11" height="28" rx="5" fill="#12b886" stroke="#a5f3d4" stroke-width="1.6"/><rect x="98" y="168" width="11" height="28" rx="5" fill="#12b886" stroke="#a5f3d4" stroke-width="1.6"/><ellipse cx="126" cy="150" rx="15" ry="31" fill="#9d5cff" stroke="#fff" stroke-width="2"/><path d="M210 80 a 86 86 0 0 1 0 140" fill="none" stroke="#ff3b6b" stroke-width="8"/><line x1="20" y1="150" x2="84" y2="150" stroke="#ffd76a" stroke-width="3" marker-end="url(#ah)"/><text x="76" y="64" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Cornea</text><text x="150" y="64" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Iris</text><text x="150" y="250" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Lens</text><text x="276" y="250" font-size="17" font-weight="800" fill="#fff" text-anchor="midd