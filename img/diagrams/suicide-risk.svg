<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Assessing suicide risk</title><desc id="d">The assessment drawn as a staircase - ideation, then plan, then means, then a time - each step raising the risk. Beside it a mood line falling into depression and then lifting suddenly, with the lift marked as the most dangerous point, because a decision has been made and the energy to act has returned. Below, what you do and what you never do.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="690" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">ASKING DIRECTLY DOES NOT PLANT THE IDEA</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">It is the single most important question in psychiatric nursing, and it is asked in plain words.</text><rect x="24" y="96" width="470" height="300" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="300" rx="2.5" fill="#ffc233"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🪜  EACH ANSWER RAISES THE RISK</text><rect x="52" y="320" width="400" height="44" rx="10" fill="#12b886" fill-opacity=".24" stroke="#12b886" stroke-opacity=".8"/><text x="66" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">IDEATION</text><text x="66" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">"Are you thinking of killing yourself?"</text><rect x="76" y="268" width="376" height="44" rx="10" fill="#ffc233" fill-opacity=".24" stroke="#ffc233" stroke-opacity=".8"/><text x="90" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">PLAN</text><text x="90" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">"Have you thought about how?"</text><rect x="100" y="216" width="352" height="44" rx="10" fill="#ff8a3d" fill-opacity=".24" stroke="#ff8a3d" stroke-opacity=".8"/><text x="114" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">MEANS</text><text x="114" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">"Do you have access to that?"</text><rect x="124" y="164" width="328" height="44" rx="10" fill="#ff3b6b" fill-opacity=".24" stroke="#ff3b6b" stroke-opacity=".8"/><text x="138" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">TIME</text><text x="138" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">"Have you decided when?"</text><text x="46" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Plain words. NOT "hurting yourself" — that means something else.</text><rect x="514" y="96" width="382" height="300" rx="14" fill="#ff3b6b" fill-opacity=".17" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="300" rx="2.5" fill="#ff3b6b"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">📈  THE MOMENT THAT IS MISSED</text><rect x="544" y="148" width="322" height="130" rx="9" fill="#0b0716" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".16"/><path d="M544.0 179.3 L547.2 182.2 L550.4 184.3 L553.7 186.3 L556.9 188.1 L560.1 189.8 L563.3 191.4 L566.5 193.0 L569.8 194.6 L573.0 196.1 L576.2 197.6 L579.4 199.0 L582.6 200.4 L585.9 201.8 L589.1 203.2 L592.3 204.6 L595.5 205.9 L598.7 207.2 L602.0 208.5 L605.2 209.8 L608.4 211.1 L611.6 212.4 L614.8 213.6 L618.1 214.8 L621.3 216.1 L624.5 217.3 L627.7 218.5 L630.9 219.7 L634.2 220.9 L637.4 222.1 L640.6 223.3 L643.8 224.4 L647.0 225.6 L650.3 226.7 L653.5 227.9 L656.7 229.0 L659.9 230.2 L663.1 231.3 L666.4 232.4 L669.6 233.5 L672.8 234.6 L676.0 235.7 L679.2 236.8 L682.5 237.9 L685.7 239.0 L688.9 240.1 L692.1 241.2 L695.3 242.3 L698.6 243.3 L701.8 244.4 L705.0 245.5 L708.2 246.5 L711.4 247.6 L714.7 248.6 L717.9 249.7 L721.1 250.7 L724.3 250.7 L727.5 250.7 L730.8 250.7 L734.0 250.7 L737.2 250.7 L740.4 250.7 L743.6 250.7 L746.9 250.7 L750.1 250.7 L753.3 250.7 L756.5 250.7 L759.7 250.7 L763.0 250.7 L766.2 250.7 L769.4 250.7 L772.6 250.7 L775.8 250.7 L779.1 248.7 L782.3 246.7 L785.5 244.7 L788.7 242.7 L791.9 240.7 L795.2 238.7 L798.4 236.7 L801.6 234.7 L804.8 232.7 L808.0 230.7 L811.3 228.7 L814.5 226.7 L817.7 224.7 L820.9 222.7 L824.1 220.6 L827.4 218.6 L830.6 216.6 L833.8 214.6 L837.0 212.6 L840.2 210.6 L843.5 208.6 L846.7 206.6 L849.9 204.6 L853.1 202.6 L856.3 200.6 L859.6 198.6 L862.8 196.6 L866.0 194.6" fill="none" stroke="#2f6bff" stroke-width="3" stroke-linejoin="round"/><rect x="775.8" y="150" width="90.2" height="126" fill="#ff3b6b" fill-opacity=".22"/><text x="820.9200000000001" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">HIGHEST RISK</text><text x="552" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="start">mood over time  →</text><text x="532" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">A sudden lift after a long low is not recovery.</text><text x="532" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">She has decided — and the energy to act has</text><text x="532" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">come back with it. Watch her more closely,</text><text x="532" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">not less.</text><text x="532" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Giving possessions away, putting affairs in order.</text><rect x="24" y="414" width="470" height="232" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="414" width="5" height="232" rx="2.5" fill="#12b886"/><text x="46" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  WHAT YOU DO</text><text x="46" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Ask directly, in plain words, and wait for the answer</text><text x="46" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Stay with her. A high-risk patient is not left alone —</text><text x="46" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  not to fetch something, not for a minute</text><text x="46" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Remove the means: belts, cords, sharps, medications,</text><text x="46" y="556" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  glass, lighters. Check what she brought in</text><text x="46" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Constant observation means constant, including the</text><text x="46" y="596" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  bathroom, and it is handed over in person</text><text x="46" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· A no-harm contract is NOT a safety plan and does not</text><text x="46" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  reduce risk. Do not rely on one</text><rect x="514" y="414" width="382" height="232" rx="14" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="414" width="5" height="232" rx="2.5" fill="#ff3b6b"/><text x="532" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  WHAT YOU DO NOT DO</text><text x="532" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Do not avoid the word</text><text x="546" y="493" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">asking does not plant the idea</text><text x="532" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Do not promise secrecy</text><text x="546" y="525" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">you cannot keep it, and she knows</text><text x="532" y="542" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Do not argue or moralise</text><text x="546" y="557" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">it ends the conversation</text><text x="532" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Do not leave her alone</text><text x="546" y="589" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">not even briefly</text><text x="532" y="606" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Do not start individual therapy</text><text x="546" y="621" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">not until the crisis is stable</text><text x="532" y="642" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Crisis intervention first. Everything else waits.</text></svg>