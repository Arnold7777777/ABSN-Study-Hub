<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Bedside procedures: the positions and the complications</title><desc id="d">Four figures drawn in the position each procedure needs - sitting forward over a table for a thoracentesis, curled on the side for a lumbar puncture, flat with the bladder emptied for a paracentesis, and on the side for an endoscopy. Under each, the complication that procedure is known for. Below, the four steps that are the same every time.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="700" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">THE POSITION IS THE MOST TESTED DETAIL</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">It differs for every procedure — and so does the one complication each is known for.</text><rect x="24" y="96" width="212" height="316" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="316" rx="2.5" fill="#2f6bff"/><text x="130.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">THORACENTESIS</text><text x="130.0" y="144" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">fluid off the pleural space</text><path d="M106 240 h96" stroke="#8e96c8" stroke-width="5" stroke-linecap="round"/><path d="M168 240 v34" stroke="#8e96c8" stroke-width="4"/><circle cx="134" cy="208" r="15" fill="#ffd9c2" fill-opacity=".55"/><path d="M106 228 q22 -6 26 40" fill="none" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="20" stroke-linecap="round"/><path d="M122 226 q20 14 30 8" fill="none" stroke="#ffd9c2" stroke-opacity=".4" stroke-width="9" stroke-linecap="round"/><text x="90.0" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="end">back</text><text x="40" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">POSITION</text><text x="40" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">sitting up, leaning</text><text x="40" y="315" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">forward over a table,</text><text x="40" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">arms on a pillow</text><text x="40" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">WATCH FOR</text><text x="40" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">PNEUMOTHORAX —</text><text x="40" y="385" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">sudden dyspnoea,</text><text x="40" y="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">chest pain</text><rect x="250" y="96" width="212" height="316" rx="14" fill="#9d5cff" fill-opacity=".15" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="250" y="96" width="5" height="316" rx="2.5" fill="#9d5cff"/><text x="356.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="middle">LUMBAR PUNCTURE</text><text x="356.0" y="144" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">CSF from the spinal canal</text><path d="M301 266 h110" stroke="#8e96c8" stroke-width="5" stroke-linecap="round"/><path d="M386 246 q-40 -46 6 -60 q44 -12 52 26 q6 30 -24 34" fill="none" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="20" stroke-linecap="round"/><circle cx="326" cy="208" r="14" fill="#ffd9c2" fill-opacity=".55"/><text x="390.0" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">spine</text><text x="266" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">POSITION</text><text x="266" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">side-lying, curled</text><text x="266" y="315" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">into a C — knees to</text><text x="266" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">chest, chin down</text><text x="266" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">WATCH FOR</text><text x="266" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">HEADACHE — lie flat,</text><text x="266" y="385" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">fluids, caffeine.</text><text x="266" y="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">It is positional</text><rect x="476" y="96" width="212" height="316" rx="14" fill="#ffc233" fill-opacity=".15" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="476" y="96" width="5" height="316" rx="2.5" fill="#ffc233"/><text x="582.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">PARACENTESIS</text><text x="582.0" y="144" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">fluid off the abdomen</text><path d="M524 258 h116" stroke="#8e96c8" stroke-width="5" stroke-linecap="round"/><path d="M550 234 h84" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="24" stroke-linecap="round"/><circle cx="536" cy="226" r="14" fill="#ffd9c2" fill-opacity=".55"/><ellipse cx="598" cy="234" rx="20" ry="13" fill="#ffc233" fill-opacity=".45" stroke="#ffc233" stroke-width="2"/><text x="598.0" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">fluid</text><text x="492" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">POSITION</text><text x="492" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">EMPTY THE BLADDER</text><text x="492" y="315" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">first, then upright</text><text x="492" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">or high Fowler's</text><text x="492" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">WATCH FOR</text><text x="492" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">HYPOVOLAEMIA —</text><text x="492" y="385" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">the fluid came out</text><text x="492" y="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">of her circulation</text><rect x="702" y="96" width="212" height="316" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="702" y="96" width="5" height="316" rx="2.5" fill="#ff3b6b"/><text x="808.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">ENDOSCOPY (EGD)</text><text x="808.0" y="144" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">a camera into the stomach</text><path d="M750 258 h116" stroke="#8e96c8" stroke-width="5" stroke-linecap="round"/><path d="M782 234 h78" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="22" stroke-linecap="round"/><circle cx="766" cy="226" r="14" fill="#ffd9c2" fill-opacity=".55"/><path d="M758 216 q10 10 0 20" fill="none" stroke="#ff3b6b" stroke-width="4" stroke-linecap="round"/><text x="718" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">POSITION</text><text x="718" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">side-lying, and NPO</text><text x="718" y="315" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">until the gag reflex</text><text x="718" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">has come back</text><text x="718" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">WATCH FOR</text><text x="718" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">PERFORATION —</text><text x="718" y="385" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">pain, fever, rigid</text><text x="718" y="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">abdomen, bleeding</text><rect x="24" y="430" width="872" height="228" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="430" width="5" height="228" rx="2.5" fill="#12b886"/><text x="46" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🔁  THE SAME FOUR STEPS, EVERY TIME</text><text x="46" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">BEFORE</text><text x="46" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· signed consent — before any sedation, never after</text><text x="46" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· allergies · coagulation studies · platelet count</text><text x="46" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· hold anticoagulants · baseline vitals · bladder empty</text><text x="46" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· explain the position, and practise it with her</text><text x="338" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">DURING</text><text x="338" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· she holds still — that is the one thing you coach</text><text x="338" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· vital signs and oxygen saturation throughout</text><text x="338" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· watch the level of consciousness</text><text x="338" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· stay where she can see you, and keep talking to her</text><text x="630" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">AFTER</text><text x="630" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· vital signs on a schedule, not just once</text><text x="630" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· check the dressing — soaking means bleeding</text><text x="630" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· the one complication that procedure is known for</text><text x="630" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· label specimens at the bedside, in front of her</text><text x="46" y="622" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Consent is signed BEFORE sedation. A sedated patient cannot consent, and a consent taken after is not consent.</text><text x="46" y="644" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Anything that punctures gets coagulation studies and a platelet count first.</text></svg>