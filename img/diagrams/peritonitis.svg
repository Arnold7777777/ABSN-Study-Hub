<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 656" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Peritonitis</title><desc id="d">An abdomen in cross-section with a hollow organ perforated and its contents spilling into the sterile peritoneal cavity, and fluid drawn leaving the blood vessels and pooling in the abdomen - liters of it - which is third-spacing. Beside it the position she adopts, knees drawn up and completely still. Below, what you find, what you do and what is never done.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="656" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">SOMETHING PERFORATED AND SPILLED INTO A STERILE SPACE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">The abdomen goes board-like and silent, and she will not let you press on it. This is surgical.</text><rect x="24" y="96" width="512" height="300" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="300" rx="2.5" fill="#ff3b6b"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🔥  WHAT SPILLS, AND WHAT LEAVES THE CIRCULATION</text><ellipse cx="190" cy="256" rx="128" ry="92" fill="#ffd9c2" fill-opacity=".13" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="3"/><text x="190" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="middle">the peritoneal cavity — sterile</text><path d="M142 226 q40 -22 74 4 q10 40 -22 56 q-46 8 -60 -20 z" fill="#e9c9b6" fill-opacity=".35" stroke="#e9c9b6" stroke-opacity=".7" stroke-width="2.5"/><text x="182" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="middle">gut</text><circle cx="212" cy="276" r="7" fill="#0b0716"/><text x="232" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">PERFORATION</text><circle cx="226" cy="304" r="9" fill="#ff8a3d" fill-opacity=".8"/><circle cx="248" cy="318" r="7" fill="#ff8a3d" fill-opacity=".8"/><circle cx="202" cy="322" r="6" fill="#ff8a3d" fill-opacity=".8"/><circle cx="266" cy="296" r="6" fill="#ff8a3d" fill-opacity=".8"/><text x="248" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">stool, acid, bile</text><path d="M74 200 L116 212" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><path d="M74 236 L116 248" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><path d="M74 280 L116 292" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="66" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="end">fluid leaves</text><text x="66" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="end">the vessels</text><text x="340" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">THIRD-SPACING</text><text x="340" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">The inflamed peritoneum weeps</text><text x="340" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">liters of fluid out of the</text><text x="340" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">circulation and into the abdomen.</text><text x="340" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">It is still in her body, but it is</text><text x="340" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">doing nothing — so the blood</text><text x="340" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">pressure falls and the heart</text><text x="340" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">rate climbs while the abdomen</text><text x="340" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">gets bigger.</text><text x="46" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">The gut stops moving as well — a paralytic ileus.</text><text x="46" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Distension, vomiting, and no bowel sounds at all.</text><rect x="556" y="96" width="340" height="300" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="556" y="96" width="5" height="300" rx="2.5" fill="#2f6bff"/><text x="574" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">HOW SHE LIES</text><circle cx="610" cy="218" r="20" fill="#ffd9c2" fill-opacity=".5" stroke="#ffd9c2" stroke-opacity=".7" stroke-width="2"/><path d="M638 226 h74" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="30" stroke-linecap="round"/><path d="M712 230 q34 -6 44 -34" fill="none" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="17" stroke-linecap="round"/><path d="M586 260 h96" stroke="#8e96c8" stroke-width="4" stroke-linecap="round"/><text x="574" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Knees drawn up, absolutely still.</text><text x="574" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Moving hurts, so she does not move —</text><text x="574" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">and a patient who will not move after</text><text x="574" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">abdominal pain is telling you something.</text><text x="574" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Rebound tenderness: it hurts more when</text><text x="574" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">you let go than when you press.</text><rect x="24" y="414" width="452" height="200" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="414" width="5" height="200" rx="2.5" fill="#12b886"/><text x="46" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  WHAT YOU DO</text><text x="46" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Nothing by mouth. NG tube to decompress.</text><text x="46" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Two large-bore IVs and aggressive fluids —</text><text x="46" y="512" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  she is losing volume into her own abdomen.</text><text x="46" y="532" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Broad-spectrum antibiotics, after cultures.</text><text x="46" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Semi-Fowler's: it pools the contamination low</text><text x="46" y="572" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  and helps her breathe.</text><text x="46" y="592" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Pain relief, and prepare her for theatre.</text><rect x="496" y="414" width="400" height="200" rx="14" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="414" width="5" height="200" rx="2.5" fill="#ff3b6b"/><text x="518" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  NEVER</text><text x="518" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No heat to the abdomen</text><text x="532" y="491" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">it spreads the infection</text><text x="518" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No enema, no laxative</text><text x="532" y="525" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">it can rupture more bowel</text><text x="518" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Nothing by mouth</text><text x="532" y="559" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">she is going to theatre</text><text x="518" y="578" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No analgesia before assessment</text><text x="532" y="593" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">only until it is diagnosed</text></svg>