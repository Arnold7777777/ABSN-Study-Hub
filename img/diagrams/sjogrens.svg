<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 622" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Sjogren's syndrome</title><desc id="d">A figure with the moisture-making glands picked out - the lacrimal glands behind the eyes and the salivary glands at the jaw - each crossed through, because the body has attacked its own moisture supply. Around it, everything that follows from something drying out. Below, primary against secondary, and the damage that follows.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="622" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#00c2c7" fill-opacity=".22" stroke="#00c2c7" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#00c2c7"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#00c2c7">THE BODY HAS ATTACKED ITS OWN MOISTURE SUPPLY</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Every sign on the page follows from something drying out. That is the whole disease in one sentence.</text><rect x="24" y="96" width="470" height="300" rx="14" fill="#00c2c7" fill-opacity=".16" stroke="#00c2c7" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="300" rx="2.5" fill="#00c2c7"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">💧  THE GLANDS THAT MAKE MOISTURE</text><circle cx="190" cy="254" r="72" fill="#ffd9c2" fill-opacity=".16" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2.5"/><ellipse cx="162" cy="232" rx="18" ry="11" fill="#ffffff" fill-opacity=".85"/><circle cx="162" cy="232" r="7" fill="#5b7fb8"/><ellipse cx="142" cy="218" rx="10" ry="7" fill="#ff3b6b" fill-opacity=".85"/><path d="M137 213 l10 10 M147 213 l-10 10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="138" cy="280" rx="14" ry="10" fill="#ff3b6b" fill-opacity=".85"/><path d="M132 274 l12 12 M144 274 l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/><ellipse cx="218" cy="232" rx="18" ry="11" fill="#ffffff" fill-opacity=".85"/><circle cx="218" cy="232" r="7" fill="#5b7fb8"/><ellipse cx="238" cy="218" rx="10" ry="7" fill="#ff3b6b" fill-opacity=".85"/><path d="M233 213 l10 10 M243 213 l-10 10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="242" cy="280" rx="14" ry="10" fill="#ff3b6b" fill-opacity=".85"/><path d="M236 274 l12 12 M248 274 l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M178 270 q12 10 24 0" fill="none" stroke="#3a2030" stroke-width="3" stroke-linecap="round"/><text x="190" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">LACRIMAL — tears</text><text x="190" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">SALIVARY — saliva</text><text x="46" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#bff3f0" fill-opacity="1" text-anchor="start">Lymphocytes infiltrate and destroy the exocrine glands. One idea,</text><text x="46" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#bff3f0" fill-opacity="1" text-anchor="start">and every symptom is downstream of it.</text><text x="46" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Nine in ten are women, usually diagnosed after 40.</text><rect x="514" y="96" width="382" height="300" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="300" rx="2.5" fill="#ffc233"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">👀  EVERYTHING DOWNSTREAM OF DRY</text><text x="532" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Eyes</text><text x="664" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">gritty, burning, "sand in the eye";</text><text x="664" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">corneal damage if it is not treated</text><text x="532" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Mouth</text><text x="664" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">dry, sticky; hard to swallow dry food;</text><text x="664" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">rampant dental CARIES; oral thrush</text><text x="532" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Taste and smell</text><text x="664" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">both dulled — saliva carries taste</text><text x="532" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Throat, nose</text><text x="664" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">hoarseness, dry cough, nosebleeds</text><text x="532" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Vagina</text><text x="664" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">dryness and painful intercourse</text><text x="532" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Joints, fatigue</text><text x="664" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">common — often what she mentions first</text><text x="532" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Caries is the one people miss. No saliva means no</text><text x="532" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">protection, and the teeth go fast.</text><rect x="24" y="414" width="452" height="180" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="414" width="5" height="180" rx="2.5" fill="#2f6bff"/><text x="46" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🔀  PRIMARY vs SECONDARY</text><text x="46" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">PRIMARY</text><text x="190" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">on its own</text><text x="46" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">SECONDARY</text><text x="190" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">alongside another autoimmune disease —</text><text x="190" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">rheumatoid arthritis, lupus, scleroderma</text><text x="46" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A patient with RA or lupus who now has gritty eyes and a dry</text><text x="46" y="572" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">mouth is describing SECONDARY Sjögren's — not a new,</text><text x="46" y="590" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">unrelated problem.</text><rect x="496" y="414" width="400" height="180" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="414" width="5" height="180" rx="2.5" fill="#12b886"/><text x="518" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  WHAT ACTUALLY HELPS</text><text x="518" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Preservative-free artificial tears, often</text><text x="518" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Sip water constantly; sugar-free gum or sweets</text><text x="518" y="508" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Dental review every 3–6 months, fluoride, and no</text><text x="518" y="526" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  sugary drinks between meals</text><text x="518" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Humidifier; avoid smoke, wind and hair dryers</text><text x="518" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Avoid anticholinergics and antihistamines — they</text><text x="518" y="580" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  dry her out further</text><text x="518" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Pilocarpine can stimulate what gland is left</text></svg>