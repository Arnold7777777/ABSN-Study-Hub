<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Brain abscess</title><desc id="d">A head in cross-section with the middle ear and the sinuses marked and arrows running the short distance from each into the brain, where a ring-enhancing abscess sits. Beside it the triad and the diagnosis. Below, the lumbar puncture that must not be done and the care.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="640" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#c02255" fill-opacity=".22" stroke="#c02255" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#c02255"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#c02255">AN UNTREATED EAR OR SINUS INFECTION SITS MILLIMETRES AWAY</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Chronic otitis media and mastoiditis are the classic route in — and that is the exam pathway.</text><rect x="24" y="96" width="470" height="288" rx="14" fill="#c02255" fill-opacity=".17" stroke="#c02255" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="288" rx="2.5" fill="#c02255"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">🦠  HOW IT GETS THERE</text><circle cx="190" cy="252" r="86" fill="#ffd9c2" fill-opacity=".14" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2.5"/><circle cx="190" cy="248" r="64" fill="#8e96c8" fill-opacity=".22"/><path d="M154 220 q18 -12 36 0 q18 12 36 0" fill="none" stroke="#0b0716" stroke-opacity=".3" stroke-width="3"/><path d="M154 240 q18 -12 36 0 q18 12 36 0" fill="none" stroke="#0b0716" stroke-opacity=".3" stroke-width="3"/><path d="M154 260 q18 -12 36 0 q18 12 36 0" fill="none" stroke="#0b0716" stroke-opacity=".3" stroke-width="3"/><path d="M154 280 q18 -12 36 0 q18 12 36 0" fill="none" stroke="#0b0716" stroke-opacity=".3" stroke-width="3"/><circle cx="212" cy="238" r="20" fill="#2a1030" stroke="#ff3b6b" stroke-width="6"/><text x="246" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ring-enhancing</text><text x="246" y="235" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">abscess</text><circle cx="118" cy="270" r="13" fill="#ff8a3d" fill-opacity=".85"/><text x="82" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">middle ear</text><text x="82" y="317" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">mastoiditis</text><circle cx="166" cy="186" r="12" fill="#ffc233" fill-opacity=".85"/><text x="142" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">sinuses</text><path d="M130 264 L186 244" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><path d="M172 196 L198 224" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="46" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Also: dental infection · bloodborne from anywhere ·</text><text x="46" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">penetrating injury, skull fracture, neurosurgery.</text><text x="46" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">This is why a chronic ear infection is not left alone.</text><rect x="514" y="96" width="382" height="288" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="288" rx="2.5" fill="#2f6bff"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">👀  THE TRIAD — AND ONE OF IT IS UNRELIABLE</text><circle cx="544" cy="152" r="9" fill="#ff3b6b"/><text x="544" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">1</text><text x="560" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">HEADACHE</text><text x="560" y="167" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">usually first, and the worst symptom</text><circle cx="544" cy="184" r="9" fill="#ffc233"/><text x="544" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">2</text><text x="560" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">FEVER</text><text x="560" y="199" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">unreliable — up to half have none</text><circle cx="544" cy="216" r="9" fill="#2f6bff"/><text x="544" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">3</text><text x="560" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">FOCAL DEFICIT</text><text x="560" y="231" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">depends entirely on where it sits</text><text x="532" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Plus rising ICP: nausea and projectile vomiting,</text><text x="532" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">a change in LOC, seizures, papilloedema.</text><text x="532" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">DIAGNOSIS</text><text x="532" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· MRI with contrast — the test of choice</text><text x="532" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Blood cultures BEFORE antibiotics</text><text x="532" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Aspiration for culture guides the definitive drug</text><text x="532" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A worsening headache with a NEW deficit is enough.</text><rect x="24" y="402" width="452" height="190" rx="14" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="402" width="5" height="190" rx="2.5" fill="#ff3b6b"/><text x="46" y="434" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  NO LUMBAR PUNCTURE</text><text x="46" y="464" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">When a mass and raised pressure are suspected, taking</text><text x="46" y="484" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">fluid off the bottom lets the brain move DOWN through</text><text x="46" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">the foramen magnum. That is herniation, and it is fatal.</text><text x="46" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Imaging comes FIRST. Always.</text><text x="46" y="564" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">The same rule applies to any suspected space-occupying</text><text x="46" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">lesion, not just an abscess.</text><rect x="496" y="402" width="400" height="190" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="402" width="5" height="190" rx="2.5" fill="#12b886"/><text x="518" y="434" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  THE CARE</text><text x="518" y="464" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Long-course IV antibiotics — weeks, not days</text><text x="518" y="484" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Surgical drainage or excision if it is large</text><text x="518" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Head of bed at 30°, head midline, never flexed</text><text x="518" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Neuro checks: LOC first, every time</text><text x="518" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Seizure precautions — the bed, and padding</text><text x="518" y="564" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Nothing that raises ICP: no straining, no</text><text x="518" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  coughing, no Valsalva; cluster the care</text></svg>