<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Head lice and impetigo</title><desc id="d">A hair shaft with a nit glued to it beside a honey-crusted impetigo lesion, with the treatment and the school rule for each.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="560" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">HEAD LICE vs IMPETIGO — BOTH ITCH, NOTHING ELSE MATCHES</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">One lives on the hair shaft. The other is a crust on the skin. Different bug, different rule.</text><rect x="24" y="92" width="420" height="226" rx="14" fill="#9d5cff" fill-opacity=".18" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="226" rx="2.5" fill="#9d5cff"/><text x="44" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">🪲 HEAD LICE — on the hair shaft</text><path d="M78 148 q10 46 -4 92" stroke="#c8a37a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M182 148 q10 46 -4 92" stroke="#c8a37a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M286 148 q10 46 -4 92" stroke="#c8a37a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M60 148 l300 0" stroke="#e8c9a8" stroke-width="6" stroke-opacity=".55" stroke-linecap="round"/><text x="60" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#e8c9a8" fill-opacity="1" text-anchor="start">scalp</text><ellipse cx="82" cy="176" rx="7" ry="4.5" fill="#f2ead2" stroke="#8d7a52" stroke-width="1"/><ellipse cx="186" cy="176" rx="7" ry="4.5" fill="#f2ead2" stroke="#8d7a52" stroke-width="1"/><ellipse cx="290" cy="176" rx="7" ry="4.5" fill="#f2ead2" stroke="#8d7a52" stroke-width="1"/><path d="M186 176 L186 206 L228 206" stroke="#f2ead2" stroke-opacity=".75" stroke-width="1.3" fill="none"/><text x="234" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#f2ead2" fill-opacity="1" text-anchor="start">nits — glued on;</text><text x="234" y="217" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#f2ead2" fill-opacity="1" text-anchor="start">dandruff would slide off</text><ellipse cx="386" cy="186" rx="13" ry="8.5" fill="#9a7b52"/><ellipse cx="374" cy="186" rx="5" ry="4.5" fill="#7d6242"/><path d="M380 181 l7 -8 M380 191 l7 8" stroke="#9a7b52" stroke-width="1.8" stroke-linecap="round"/><path d="M388 181 l7 -8 M388 191 l7 8" stroke="#9a7b52" stroke-width="1.8" stroke-linecap="round"/><path d="M396 181 l7 -8 M396 191 l7 8" stroke="#9a7b52" stroke-width="1.8" stroke-linecap="round"/><text x="386" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e3d3bb" fill-opacity="1" text-anchor="middle">the louse itself</text><circle cx="46" cy="257.5" r="2.6" fill="#cfd4ff"/><text x="56" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Itching behind the ears</tspan><tspan> and at the nape.</tspan></text><circle cx="46" cy="276.5" r="2.6" fill="#cfd4ff"/><text x="56" y="281" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Permethrin,</tspan><tspan> then comb nits out with a fine comb.</tspan></text><circle cx="46" cy="295.5" r="2.6" fill="#cfd4ff"/><text x="56" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Wash bedding hot,</tspan><tspan> bag soft toys 14 days.</tspan></text><rect x="460" y="92" width="416" height="226" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="92" width="5" height="226" rx="2.5" fill="#ffc233"/><text x="480" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🦠 IMPETIGO — crust on the skin</text><ellipse cx="566" cy="196" rx="52" ry="62" fill="#f0c3a6" fill-opacity=".34" stroke="#f0c3a6" stroke-opacity=".55" stroke-width="1.6"/><circle cx="548" cy="178" r="4.5" fill="#3a2a08" fill-opacity=".8"/><circle cx="584" cy="178" r="4.5" fill="#3a2a08" fill-opacity=".8"/><path d="M566 190 l0 14 l7 0" fill="none" stroke="#3a2a08" stroke-opacity=".55" stroke-width="1.6"/><path d="M550 224 q16 9 32 0" fill="none" stroke="#3a2a08" stroke-opacity=".6" stroke-width="2"/><circle cx="540" cy="214" r="19" fill="#ff9f4d" fill-opacity=".55"/><circle cx="540" cy="214" r="13" fill="#e8b33c" fill-opacity=".95"/><circle cx="592" cy="218" r="16" fill="#ff9f4d" fill-opacity=".55"/><circle cx="592" cy="218" r="10" fill="#e8b33c" fill-opacity=".95"/><circle cx="566" cy="236" r="15" fill="#ff9f4d" fill-opacity=".55"/><circle cx="566" cy="236" r="9" fill="#e8b33c" fill-opacity=".95"/><circle cx="596" cy="196" r="13" fill="#ff9f4d" fill-opacity=".55"/><circle cx="596" cy="196" r="7" fill="#e8b33c" fill-opacity=".95"/><path d="M614 214 L664 202" stroke="#ffe0b0" stroke-opacity=".8" stroke-width="1.4"/><text x="670" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffe0b0" fill-opacity="1" text-anchor="start">honey-coloured crust</text><text x="670" y="214" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffe0b0" fill-opacity="1" text-anchor="start">around the nose and mouth</text><text x="670" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe0b0" fill-opacity="1" text-anchor="start">It weeps, then dries</text><text x="670" y="251" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe0b0" fill-opacity="1" text-anchor="start">to a golden scab.</text><circle cx="482" cy="269.5" r="2.6" fill="#cfd4ff"/><text x="492" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Staph or strep.</tspan><tspan> Topical mupirocin; oral if widespread.</tspan></text><circle cx="482" cy="288.5" r="2.6" fill="#cfd4ff"/><text x="492" y="293" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Very contagious</tspan><tspan> by touch — own towel, own bedding.</tspan></text><circle cx="482" cy="307.5" r="2.6" fill="#cfd4ff"/><text x="492" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Cut the nails</tspan><tspan> so scratching does not spread it.</tspan></text><rect x="24" y="334" width="420" height="124" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="334" width="5" height="124" rx="2.5" fill="#12b886"/><text x="44" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🏫 WHEN SHE GOES BACK</text><circle cx="46" cy="381.5" r="2.6" fill="#cfd4ff"/><text x="56" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Lice:</tspan><tspan> after the first treatment. No no-nit rule.</tspan></text><circle cx="46" cy="400.5" r="2.6" fill="#cfd4ff"/><text x="56" y="405" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Impetigo:</tspan><tspan> 24 hours of antibiotic, lesions covered.</tspan></text><circle cx="46" cy="419.5" r="2.6" fill="#cfd4ff"/><text x="56" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Neither</tspan><tspan> needs the whole class treated.</tspan></text><rect x="460" y="334" width="416" height="124" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="334" width="5" height="124" rx="2.5" fill="#ff3b6b"/><text x="480" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚫 COMMON MISTAKES</text><circle cx="482" cy="381.5" r="2.6" fill="#ffd9e2"/><text x="492" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">No kerosene, mayonnaise or petroleum jelly.</text><circle cx="482" cy="400.5" r="2.6" fill="#ffd9e2"/><text x="492" y="405" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Do not share hats, combs or pillows.</text><circle cx="482" cy="419.5" r="2.6" fill="#ffd9e2"/><text x="492" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Impetigo after strep — watch for dark urine.</text><rect x="24" y="472" width="852" height="66" rx="14" fill="#ffc233" fill-opacity=".20" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="472" width="5" height="66" rx="2.5" fill="#ffc233"/><text x="44" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ THE TELL</text><text x="44" y="519" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Nits are glued to the hair and will not slide off — dandruff slides. Honey-crust on the face is impetigo, not eczema.</text></svg>