<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Conjunctivitis</title><desc id="d">Three eyes drawn side by side showing bacterial, viral and allergic conjunctivitis, with the discharge that tells them apart and the school rules for each.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="560" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#00c2c7" fill-opacity=".22" stroke="#00c2c7" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#00c2c7"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#00c2c7">CONJUNCTIVITIS — TELL THEM APART BY THE DISCHARGE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Same red eye, three different causes. The discharge is the whole question.</text><rect x="24" y="92" width="852" height="200" rx="14" fill="#2f6bff" fill-opacity=".13" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="200" rx="2.5" fill="#2f6bff"/><ellipse cx="172" cy="168" rx="62" ry="36" fill="#ffffff" fill-opacity=".92"/><ellipse cx="172" cy="168" rx="62" ry="36" fill="#ff3b6b" fill-opacity=".30"/><path d="M126 160 q15 -3 23 -4" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.72"/><path d="M132 178 q13 3 20 5" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.72"/><path d="M216 158 q-15 -4 -22 -5" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.72"/><path d="M210 180 q-13 4 -19 6" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.72"/><path d="M142 150 q10 -6 15 -9" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.72"/><path d="M202 186 q-10 6 -15 9" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.72"/><circle cx="172" cy="168" r="21" fill="#5b7fb8"/><circle cx="172" cy="168" r="9" fill="#100a1e"/><circle cx="165" cy="160" r="4" fill="#fff" fill-opacity=".8"/><path d="M110 168 q62 -46 124 0" fill="none" stroke="#e8b79b" stroke-width="3" stroke-opacity=".8"/><path d="M110 168 q62 46 124 0" fill="none" stroke="#e8b79b" stroke-width="3" stroke-opacity=".8"/><circle cx="128" cy="198" r="5" fill="#f0d264" fill-opacity=".92"/><circle cx="137" cy="202" r="5" fill="#f0d264" fill-opacity=".92"/><circle cx="146" cy="198" r="5" fill="#f0d264" fill-opacity=".92"/><circle cx="155" cy="202" r="5" fill="#f0d264" fill-opacity=".92"/><circle cx="164" cy="198" r="5" fill="#f0d264" fill-opacity=".92"/><circle cx="173" cy="202" r="5" fill="#f0d264" fill-opacity=".92"/><text x="172" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">Bacterial</text><ellipse cx="450" cy="168" rx="62" ry="36" fill="#ffffff" fill-opacity=".92"/><ellipse cx="450" cy="168" rx="62" ry="36" fill="#ff3b6b" fill-opacity=".34"/><path d="M404 160 q15 -3 23 -4" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.8160000000000001"/><path d="M410 178 q13 3 20 5" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.8160000000000001"/><path d="M494 158 q-15 -4 -22 -5" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.8160000000000001"/><path d="M488 180 q-13 4 -19 6" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.8160000000000001"/><path d="M420 150 q10 -6 15 -9" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.8160000000000001"/><path d="M480 186 q-10 6 -15 9" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.8160000000000001"/><circle cx="450" cy="168" r="21" fill="#5b7fb8"/><circle cx="450" cy="168" r="9" fill="#100a1e"/><circle cx="443" cy="160" r="4" fill="#fff" fill-opacity=".8"/><path d="M388 168 q62 -46 124 0" fill="none" stroke="#e8b79b" stroke-width="3" stroke-opacity=".8"/><path d="M388 168 q62 46 124 0" fill="none" stroke="#e8b79b" stroke-width="3" stroke-opacity=".8"/><circle cx="406" cy="198" r="5" fill="#cfe6ff" fill-opacity=".92"/><circle cx="415" cy="202" r="5" fill="#cfe6ff" fill-opacity=".92"/><circle cx="424" cy="198" r="5" fill="#cfe6ff" fill-opacity=".92"/><circle cx="433" cy="202" r="5" fill="#cfe6ff" fill-opacity=".92"/><text x="450" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">Viral</text><ellipse cx="728" cy="168" rx="62" ry="36" fill="#ffffff" fill-opacity=".92"/><ellipse cx="728" cy="168" rx="62" ry="36" fill="#ff3b6b" fill-opacity=".22"/><path d="M682 160 q15 -3 23 -4" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.528"/><path d="M688 178 q13 3 20 5" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.528"/><path d="M772 158 q-15 -4 -22 -5" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.528"/><path d="M766 180 q-13 4 -19 6" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.528"/><path d="M698 150 q10 -6 15 -9" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.528"/><path d="M758 186 q-10 6 -15 9" stroke="#ff3b6b" stroke-width="1.5" fill="none" stroke-opacity="0.528"/><circle cx="728" cy="168" r="21" fill="#5b7fb8"/><circle cx="728" cy="168" r="9" fill="#100a1e"/><circle cx="721" cy="160" r="4" fill="#fff" fill-opacity=".8"/><path d="M666 168 q62 -46 124 0" fill="none" stroke="#e8b79b" stroke-width="3" stroke-opacity=".8"/><path d="M666 168 q62 46 124 0" fill="none" stroke="#e8b79b" stroke-width="3" stroke-opacity=".8"/><text x="786" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#fff" fill-opacity="1" text-anchor="middle">✨</text><text x="728" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">Allergic</text><text x="172" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e8ebff" fill-opacity="1" text-anchor="middle">Thick yellow-green pus</text><text x="172" y="271" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e8ebff" fill-opacity="1" text-anchor="middle">Lids crusted shut on waking</text><text x="450" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e8ebff" fill-opacity="1" text-anchor="middle">Watery, clear, runs</text><text x="450" y="271" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e8ebff" fill-opacity="1" text-anchor="middle">Often with a cold</text><text x="728" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e8ebff" fill-opacity="1" text-anchor="middle">Stringy and clear — itches</text><text x="728" y="271" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e8ebff" fill-opacity="1" text-anchor="middle">Both eyes, seasonal</text><rect x="24" y="306" width="276" height="152" rx="14" fill="#ffc233" fill-opacity=".20" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="306" width="5" height="152" rx="2.5" fill="#ffc233"/><text x="42" y="332" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">BACTERIAL</text><circle cx="44" cy="351.5" r="2.6" fill="#cfd4ff"/><text x="54" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Antibiotic drops or ointment</text><circle cx="44" cy="370.5" r="2.6" fill="#cfd4ff"/><text x="54" y="375" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Back to school 24 h after starting</text><circle cx="44" cy="389.5" r="2.6" fill="#cfd4ff"/><text x="54" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Warm compress lifts the crust</text><circle cx="44" cy="408.5" r="2.6" fill="#cfd4ff"/><text x="54" y="413" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">One eye first, then the other</text><rect x="312" y="306" width="276" height="152" rx="14" fill="#2f6bff" fill-opacity=".20" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="312" y="306" width="5" height="152" rx="2.5" fill="#2f6bff"/><text x="330" y="332" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">VIRAL</text><circle cx="332" cy="351.5" r="2.6" fill="#cfd4ff"/><text x="342" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">No antibiotic — it will not help</text><circle cx="332" cy="370.5" r="2.6" fill="#cfd4ff"/><text x="342" y="375" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Cool compress, comfort only</text><circle cx="332" cy="389.5" r="2.6" fill="#cfd4ff"/><text x="342" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Very contagious for 10 to 14 days</text><circle cx="332" cy="408.5" r="2.6" fill="#cfd4ff"/><text x="342" y="413" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Adenovirus, often after a cold</text><rect x="600" y="306" width="276" height="152" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="600" y="306" width="5" height="152" rx="2.5" fill="#12b886"/><text x="618" y="332" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">ALLERGIC</text><circle cx="620" cy="351.5" r="2.6" fill="#cfd4ff"/><text x="630" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Antihistamine drops</text><circle cx="620" cy="370.5" r="2.6" fill="#cfd4ff"/><text x="630" y="375" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Not contagious — no school rule</text><circle cx="620" cy="389.5" r="2.6" fill="#cfd4ff"/><text x="630" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Cool compress, remove the trigger</text><circle cx="620" cy="408.5" r="2.6" fill="#cfd4ff"/><text x="630" y="413" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Itching is the giveaway</text><rect x="24" y="472" width="852" height="66" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="472" width="5" height="66" rx="2.5" fill="#ff3b6b"/><text x="44" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨 THE ONE THAT IS NOT CONJUNCTIVITIS</text><text x="44" y="522" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Pain, light sensitivity or blurred vision means it is not simple pink eye — that eye goes to a provider today.</text></svg>