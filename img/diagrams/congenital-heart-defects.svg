<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 734" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Congenital heart defects sorted by shunt direction</title><desc id="d">A heart drawn twice with a hole in the septum. Left to right, oxygenated blood floods back into the lungs and the child goes into heart failure but stays pink. Right to left, deoxygenated blood is pushed out to the body and the child is blue, and oxygen does not fix it. Below, coarctation shown as the arm-versus-leg blood pressure difference, and the tet spell with the knee-chest position.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="734" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">SORT THEM BY WHICH WAY THE BLOOD GOES</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Left → right floods the lungs. Right → left makes a blue baby. That is the whole rule.</text><rect x="24" y="96" width="426" height="322" rx="14" fill="#ff3b6b" fill-opacity=".13" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="322" rx="2.5" fill="#ff3b6b"/><text x="237.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">ACYANOTIC — still pink</text><path d="M145 150 h84 v146 h-84 z" fill="#4d7dff" fill-opacity=".30" stroke="#4d7dff" stroke-width="2.4" rx="8"/><path d="M245 150 h84 v146 h-84 z" fill="#ff4d6d" fill-opacity=".30" stroke="#ff4d6d" stroke-width="2.4"/><text x="187.0" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#4d7dff" fill-opacity="1" text-anchor="middle">RIGHT</text><text x="187.0" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#cfd9ff" fill-opacity="1" text-anchor="middle">from the body</text><text x="287.0" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff4d6d" fill-opacity="1" text-anchor="middle">LEFT</text><text x="287.0" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#ffd0d8" fill-opacity="1" text-anchor="middle">from the lungs</text><path d="M237 150 V228 M237 264 V296" stroke="#e6d8c4" stroke-width="7" stroke-linecap="round"/><path d="M271.0 246 L203.0 246" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="237.0" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff4d6d" fill-opacity="1" text-anchor="middle">LEFT → RIGHT</text><text x="187.0" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#4d7dff" fill-opacity="1" text-anchor="middle">straight back to</text><text x="187.0" y="331" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#4d7dff" fill-opacity="1" text-anchor="middle">the LUNGS again</text><text x="46" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Too much blood through the lungs → HEART FAILURE.</text><text x="46" y="371" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Poor feeding, sweating while feeding, poor growth,</text><text x="46" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">tachypnoea. Pink, but working far too hard.</text><text x="46" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">ASD · VSD · PDA · coarctation · pulmonary stenosis</text><rect x="470" y="96" width="426" height="322" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="470" y="96" width="5" height="322" rx="2.5" fill="#2f6bff"/><text x="683.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">CYANOTIC — a blue baby</text><path d="M591 150 h84 v146 h-84 z" fill="#4d7dff" fill-opacity=".30" stroke="#4d7dff" stroke-width="2.4" rx="8"/><path d="M691 150 h84 v146 h-84 z" fill="#ff4d6d" fill-opacity=".30" stroke="#ff4d6d" stroke-width="2.4"/><text x="633.0" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#4d7dff" fill-opacity="1" text-anchor="middle">RIGHT</text><text x="633.0" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#cfd9ff" fill-opacity="1" text-anchor="middle">from the body</text><text x="733.0" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff4d6d" fill-opacity="1" text-anchor="middle">LEFT</text><text x="733.0" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#ffd0d8" fill-opacity="1" text-anchor="middle">from the lungs</text><path d="M683 150 V228 M683 264 V296" stroke="#e6d8c4" stroke-width="7" stroke-linecap="round"/><path d="M649.0 246 L717.0 246" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="683.0" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#4d7dff" fill-opacity="1" text-anchor="middle">RIGHT → LEFT</text><text x="733.0" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#4d7dff" fill-opacity="1" text-anchor="middle">out to the BODY</text><text x="733.0" y="331" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#4d7dff" fill-opacity="1" text-anchor="middle">with no oxygen</text><text x="492" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Blood skips the lungs → CYANOSIS that oxygen</text><text x="492" y="371" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">does not fix. Clubbing later, tet spells, squatting.</text><text x="492" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Blue from birth or within the first days.</text><text x="492" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">The T list: Tetralogy · Transposition · Truncus ·</text><text x="492" y="425" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Tricuspid atresia · Total anomalous venous return</text><rect x="24" y="458" width="452" height="252" rx="14" fill="#ffc233" fill-opacity=".16" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="458" width="5" height="252" rx="2.5" fill="#ffc233"/><text x="46" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🧠  COARCTATION — CHECK ALL FOUR LIMBS</text><path d="M66 632 C70 568 100 542 136 542 C170 542 192 572 194 632" fill="none" stroke="#ff3b6b" stroke-width="13" stroke-linecap="round"/><text x="60" y="650" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffd0dc" fill-opacity="1" text-anchor="start">from the heart</text><path d="M118 544 v-26" stroke="#ff3b6b" stroke-width="8" stroke-linecap="round"/><path d="M146 544 v-26" stroke="#ff3b6b" stroke-width="8" stroke-linecap="round"/><text x="132" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">to the ARMS</text><path d="M186 594 l-11 -8 M186 602 l-11 8 M202 594 l11 -8 M202 602 l11 8" stroke="#ffc233" stroke-width="3.2" stroke-linecap="round"/><text x="216" y="602" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">the narrowing</text><text x="194" y="650" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">to the LEGS</text><text x="330" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ARMS</text><text x="330" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">high BP,</text><text x="330" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">bounding pulses</text><text x="330" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">LEGS</text><text x="330" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">low BP, weak or</text><text x="330" y="632" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">absent pulses;</text><text x="330" y="648" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">cool feet</text><text x="46" y="670" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A child with hypertension who has only had an arm cuff</text><text x="46" y="688" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">is a coarctation you have just missed.</text><rect x="496" y="458" width="400" height="252" rx="14" fill="#c02255" fill-opacity=".18" stroke="#c02255" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="458" width="5" height="252" rx="2.5" fill="#c02255"/><text x="516" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">🔴  TETRALOGY OF FALLOT — PROV</text><text x="522" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">P</text><text x="534" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe0e8" fill-opacity="1" text-anchor="start">ulmonary stenosis</text><text x="522" y="535" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">R</text><text x="534" y="535" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe0e8" fill-opacity="1" text-anchor="start">ight ventricular hypertrophy</text><text x="522" y="556" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">O</text><text x="534" y="556" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe0e8" fill-opacity="1" text-anchor="start">verriding aorta</text><text x="522" y="577" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">V</text><text x="534" y="577" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe0e8" fill-opacity="1" text-anchor="start">SD</text><text x="516" y="614" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  THE TET SPELL</text><text x="516" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Sudden deep cyanosis on crying, feeding or straining.</text><text x="516" y="654" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">KNEE–CHEST position at once — it raises systemic</text><text x="516" y="672" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">resistance and pushes blood back into the lungs.</text><text x="516" y="694" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffe0e8" fill-opacity="1" text-anchor="start">Older children squat on their own. Same mechanism.</text></svg>