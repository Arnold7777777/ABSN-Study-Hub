<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto">
<title id="t">Which pain scale for which age</title>
<desc id="d">An age ruler from birth to eighteen years showing which pain tool fits. NIPS or CRIES for the newborn. FLACC is watched by the nurse and suits two months to seven years, scoring face, legs, activity, cry and consolability nought to two each. The Wong-Baker FACES scale is pointed at by the child from about three years. A nought to ten number scale suits children of about eight and older who can rank things. Self-report always beats observation whenever the child can give it.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient></defs>
<style>
 text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
 .h1{font-weight:800;font-size:19px}
 .h2{font-weight:800;font-size:16px}
 .bd{font-size:15px}
 .sm{font-size:13.5px}
 .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
 .k{font-weight:800}
</style>
<rect width="920" height="760" rx="22" fill="url(#bg)"/>
<rect x="20" y="18" width="880" height="80" rx="14" fill="rgba(47,107,255,.20)" stroke="#2f6bff" stroke-width="2"/>
<text x="42" y="48" class="h1" fill="#bcd0ff">The tool follows what the child can do</text>
<text x="42" y="76" class="bd" fill="#e7e9ff">Not what age they are on paper. Can they point? Can they rank? That is the whole decision.</text>
<g transform="translate(60,140)">
 <line x1="0" y1="0" x2="800" y2="0" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
 <g class="sm" fill="#cfd6f5">
  <text x="0" y="24" text-anchor="middle">birth</text><text x="133" y="24" text-anchor="middle">2 mo</text>
  <text x="222" y="24" text-anchor="middle">3 y</text><text x="400" y="24" text-anchor="middle">7 y</text>
  <text x="489" y="24" text-anchor="middle">8 y</text><text x="800" y="24" text-anchor="middle">18 y</text>
 </g>
 <rect x="0" y="44" width="133" height="42" rx="8" fill="rgba(157,92,255,.45)" stroke="#9d5cff" stroke-width="2"/>
 <text x="66" y="70" class="sm k" fill="#ffffff" text-anchor="middle">NIPS / CRIES</text>
 <rect x="133" y="96" width="267" height="42" rx="8" fill="rgba(0,194,199,.42)" stroke="#00c2c7" stroke-width="2"/>
 <text x="266" y="122" class="sm k" fill="#ffffff" text-anchor="middle">FLACC &#8212; you watch</text>
 <rect x="222" y="148" width="578" height="42" rx="8" fill="rgba(255,194,51,.92)" stroke="#ffc233" stroke-width="2"/>
 <text x="511" y="174" class="sm k" fill="#2a1f00" text-anchor="middle">FACES &#8212; the child points</text>
 <rect x="489" y="200" width="311" height="42" rx="8" fill="rgba(18,184,134,.42)" stroke="#12b886" stroke-width="2"/>
 <text x="644" y="226" class="sm k" fill="#ffffff" text-anchor="middle">0&#8211;10 numbers &#8212; the child ranks</text>
</g>
<rect x="20" y="420" width="440" height="230" rx="16" fill="rgba(0,194,199,.14)" stroke="#00c2c7" stroke-width="2"/>
<text x="42" y="450" class="h2" fill="#7ff0f2">FLACC &#183; 2 months to 7 years</text>
<text x="42" y="474" class="sm" fill="#c7f0e2">You score it by watching. Five things, 0&#8211;2 each, out of 10.</text>
<g class="bd" fill="#e7e9ff">
 <text x="42" y="506"><tspan class="k" fill="#7ff0f2">F</tspan>ace &#8212; from no expression to a constant quiver</text>
 <text x="42" y="532"><tspan class="k" fill="#7ff0f2">L</tspan>egs &#8212; relaxed, restless, or drawn up</text>
 <text x="42" y="558"><tspan class="k" fill="#7ff0f2">A</tspan>ctivity &#8212; lying quietly, squirming, or rigid</text>
 <text x="42" y="584"><tspan class="k" fill="#7ff0f2">C</tspan>ry &#8212; none, whimpering, or steady crying</text>
 <text x="42" y="610"><tspan class="k" fill="#7ff0f2">C</tspan>onsolability &#8212; content, reassurable, or not</text>
</g>
<text x="42" y="638" class="sm" fill="#c7f0e2">Also the tool for a child who cannot speak or is intubated.</text>
<rect x="480" y="420" width="420" height="230" rx="16" fill="rgba(255,194,51,.18)" stroke="#ffc233" stroke-width="2"/>
<text x="502" y="450" class="h2" fill="#ffc233">FACES &#183; from about 3 years</text>
<g transform="translate(502,470)">
 <circle cx="22" cy="22" r="21" fill="#ffe08a" stroke="#7a5a08" stroke-width="2"/>
 <circle cx="15" cy="17" r="2.6" fill="#3a2a00"/><circle cx="29" cy="17" r="2.6" fill="#3a2a00"/>
 <path d="M12 28 Q22 36 32 28" fill="none" stroke="#3a2a00" stroke-width="2.4"/>
 <circle cx="86" cy="22" r="21" fill="#ffd066" stroke="#7a5a08" stroke-width="2"/>
 <circle cx="79" cy="17" r="2.6" fill="#3a2a00"/><circle cx="93" cy="17" r="2.6" fill="#3a2a00"/>
 <path d="M76 30 h20" fill="none" stroke="#3a2a00" stroke-width="2.4"/>
 <circle cx="150" cy="22" r="21" fill="#ffab73" stroke="#7a3a08" stroke-width="2"/>
 <circle cx="143" cy="17" r="2.6" fill="#3a2a00"/><circle cx="157" cy="17" r="2.6" fill="#3a2a00"/>
 <path d="M140 33 Q150 25 160 33" fill="none" stroke="#3a2a00" stroke-width="2.4"/>
 <circle cx="214" cy="22" r="21" fill="#ff8fa3" stroke="#7a0a20" stroke-width="2"/>
 <circle cx="207" cy="17" r="2.6" fill="#3a0010"/><circle cx="221" cy="17" r="2.6" fill="#3a0010"/>
 <path d="M204 34 Q214 24 224 34" fill="none" stroke="#3a0010" stroke-width="2.6"/>
 <circle cx="278" cy="22" r="21" fill="#ff3b6b" stroke="#5a0018" stroke-width="2"/>
 <path d="M268 15 l8 6 M288 15 l-8 6" stroke="#ffffff" stroke-width="2.6"/>
 <path d="M266 36 Q278 24 290 36" fill="none" stroke="#ffffff" stroke-width="2.8"/>
</g>
<text x="502" y="546" class="sm" fill="#ffeec2">The child points. Never you.</text>
<text x="502" y="568" class="sm" fill="#ffeec2">Say &#8220;no hurt&#8221; to &#8220;hurts worst&#8221; &#8212; not happy and sad.</text>
<text x="502" y="606" class="h2" fill="#5aebb4">0&#8211;10 numbers &#183; about 8 and up</text>
<text x="502" y="630" class="sm" fill="#c7f0e2">Needs a child who can count and rank.</text>
<rect x="20" y="666" width="880" height="76" rx="14" fill="rgba(18,184,134,.20)" stroke="#12b886" stroke-width="2"/>
<text x="42" y="696" class="h2" fill="#5aebb4">THE RULE THAT OUTRANKS ALL OF THEM</text>
<text x="42" y="724" class="bd" fill="#e8ffef">If the child can tell you, <tspan class="k" fill="#ffc233">their number is the number</tspan>. Self-report beats anything you observe.</text>
</svg>
