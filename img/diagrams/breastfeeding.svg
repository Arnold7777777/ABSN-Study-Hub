<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Breastfeeding: the latch and the output</title><desc id="d">A shallow latch drawn beside a deep one - in the shallow one the mouth takes only the nipple, in the deep one it takes a good mouthful of areola with the lips flanged out, the chin touching and the nose free. Beside them the signs a feed is working, judged by output rather than intake. Below, the common problems and what each one needs.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="610" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">YOU CANNOT MEASURE A BREASTFEED — SO JUDGE IT BY OUTPUT</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">And nipple pain almost always means a shallow latch. The fix is to re-latch, not to stop.</text><rect x="24" y="96" width="470" height="268" rx="14" fill="#9d5cff" fill-opacity=".15" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="268" rx="2.5" fill="#9d5cff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">👄  WHERE THE MOUTH SITS</text><rect x="46" y="146" width="196" height="176" rx="12" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".72"/><text x="144" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">SHALLOW</text><circle cx="104" cy="242" r="46" fill="#ffd9c2" fill-opacity=".26"/><circle cx="134" cy="242" r="22" fill="#c98a78" fill-opacity=".55"/><ellipse cx="144" cy="242" rx="8" ry="10" fill="#a8615a"/><path d="M148 242 q26 -12 52 0 q-26 12 -52 0 z" fill="#ffd9c2" fill-opacity=".75"/><circle cx="210" cy="242" r="19" fill="#ffd9c2" fill-opacity=".55"/><circle cx="212" cy="234" r="2.6" fill="#3a2030"/><text x="144" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">the nipple only</text><text x="144" y="306" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">so it gets pinched, and</text><text x="144" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">it hurts. Re-latch.</text><rect x="266" y="146" width="196" height="176" rx="12" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".72"/><text x="364" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">DEEP</text><circle cx="324" cy="242" r="46" fill="#ffd9c2" fill-opacity=".26"/><circle cx="354" cy="242" r="22" fill="#c98a78" fill-opacity=".55"/><ellipse cx="364" cy="242" rx="8" ry="10" fill="#a8615a"/><path d="M354 242 q26 -26 52 0 q-26 26 -52 0 z" fill="#ffd9c2" fill-opacity=".75"/><circle cx="416" cy="242" r="19" fill="#ffd9c2" fill-opacity=".55"/><circle cx="418" cy="234" r="2.6" fill="#3a2030"/><text x="364" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">nipple AND areola</text><text x="364" y="306" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="middle">lips flanged out, chin on</text><text x="364" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="middle">the breast, nose free</text><text x="46" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Never pull her off — break the seal with a clean finger first.</text><rect x="514" y="96" width="382" height="268" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="268" rx="2.5" fill="#12b886"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅  SIGNS IT IS WORKING</text><text x="532" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Wet nappies</text><text x="532" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">6–8 a day once the milk is in, from day 4</text><text x="532" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Stools</text><text x="532" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">3–4 a day; meconium → green → yellow, seedy</text><text x="532" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Weight</text><text x="532" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">back to birth weight by 2 weeks</text><text x="532" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Frequency</text><text x="532" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">8–12 feeds in 24 hours in the early weeks</text><text x="532" y="306" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">At the breast</text><text x="532" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">audible swallowing; she comes off content</text><text x="532" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Up to 10% weight loss in the first days is normal.</text><rect x="24" y="382" width="872" height="198" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="382" width="5" height="198" rx="2.5" fill="#2f6bff"/><text x="46" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🩺  WHAT GOES WRONG, AND WHAT IT NEEDS</text><text x="46" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">ENGORGEMENT</text><text x="190" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">both breasts, hard, day 3–5</text><text x="500" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">feed often · warm before, cold after</text><text x="46" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">MASTITIS</text><text x="190" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">ONE breast, red wedge, fever, flu-like</text><text x="500" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">KEEP FEEDING · antibiotics · rest</text><text x="46" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">SORE NIPPLES</text><text x="190" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">cracked, pain through the feed</text><text x="500" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">fix the latch · air dry · own milk on them</text><text x="46" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">PLUGGED DUCT</text><text x="190" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">a tender lump, no fever</text><text x="500" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">feed from that side first · massage toward the nipple</text><text x="46" y="564" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Mastitis is NOT a reason to stop. Emptying the breast is part of the treatment — stopping makes it worse.</text></svg>