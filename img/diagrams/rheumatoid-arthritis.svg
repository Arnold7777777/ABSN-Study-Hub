<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Rheumatoid arthritis</title><desc id="d">A normal joint beside one with pannus and eroded cartilage, then the pattern that separates rheumatoid arthritis from osteoarthritis.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="600" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#c02255" fill-opacity=".22" stroke="#c02255" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#c02255"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#c02255">RHEUMATOID ARTHRITIS — SYMMETRIC, AND STIFF IN THE MORNING</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">The immune system attacks the joint lining. That is why it is both sides, and why it comes with fatigue.</text><rect x="24" y="92" width="400" height="288" rx="14" fill="#2f6bff" fill-opacity=".13" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="288" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">INSIDE THE JOINT</text><path d="M100 201 l0 -52 q0 -15 22 -15 q22 0 22 15 l0 52z" fill="#efe3d0" fill-opacity=".88"/><path d="M100 229 l0 52 q0 15 22 15 q22 0 22 -15 l0 -52z" fill="#efe3d0" fill-opacity=".88"/><rect x="100" y="201" width="44" height="7" rx="3" fill="#bfe6ff" fill-opacity=".92"/><rect x="100" y="222" width="44" height="7" rx="3" fill="#bfe6ff" fill-opacity=".92"/><rect x="100" y="208" width="44" height="14" fill="#9fe8d4" fill-opacity=".5"/><path d="M98 186 q-18 26 0 52" fill="none" stroke="#9fb6ff" stroke-width="4" stroke-opacity=".9"/><path d="M146 186 q18 26 0 52" fill="none" stroke="#9fb6ff" stroke-width="4" stroke-opacity=".9"/><text x="122" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="middle">smooth cartilage,</text><text x="122" y="335" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="middle">open joint space</text><text x="122" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">Healthy</text><path d="M280 205 l0 -52 q0 -15 22 -15 q22 0 22 15 l0 52z" fill="#efe3d0" fill-opacity=".88"/><path d="M280 216 l0 52 q0 15 22 15 q22 0 22 -15 l0 -52z" fill="#efe3d0" fill-opacity=".88"/><rect x="280" y="205" width="44" height="3" rx="3" fill="#bfe6ff" fill-opacity=".34"/><rect x="280" y="213" width="44" height="3" rx="3" fill="#bfe6ff" fill-opacity=".34"/><rect x="280" y="208" width="44" height="5" fill="#ff3b6b" fill-opacity=".92"/><path d="M278 186 q-18 26 0 52" fill="none" stroke="#ff3b6b" stroke-width="10" stroke-opacity=".9"/><path d="M326 186 q18 26 0 52" fill="none" stroke="#ff3b6b" stroke-width="10" stroke-opacity=".9"/><text x="302" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">pannus eats the cartilage,</text><text x="302" y="335" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">joint space narrows</text><text x="302" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">Rheumatoid</text><rect x="440" y="92" width="436" height="288" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="440" y="92" width="5" height="288" rx="2.5" fill="#ffc233"/><text x="460" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ RA vs OA — THE FOUR THAT DECIDE IT</text><text x="460" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><text x="618" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">RA</text><text x="790" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#2f6bff" fill-opacity="1" text-anchor="middle">OA</text><rect x="458" y="162" width="400" height="26" rx="8" fill="#ffffff" fill-opacity=".07"/><text x="466" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Cause</text><text x="618" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">autoimmune</text><text x="790" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">wear and tear</text><rect x="458" y="194" width="400" height="26" rx="8" fill="#ffffff" fill-opacity=".03"/><text x="466" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Pattern</text><text x="618" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">symmetric</text><text x="790" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">one side</text><rect x="458" y="226" width="400" height="26" rx="8" fill="#ffffff" fill-opacity=".07"/><text x="466" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Joints</text><text x="618" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">small, hands first</text><text x="790" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">big, weight-bearing</text><rect x="458" y="258" width="400" height="26" rx="8" fill="#ffffff" fill-opacity=".03"/><text x="466" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Stiffness</text><text x="618" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">&gt;60 min a.m.</text><text x="790" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">&lt;30 min, after use</text><rect x="458" y="290" width="400" height="26" rx="8" fill="#ffffff" fill-opacity=".07"/><text x="466" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Whole body?</text><text x="618" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">fever, fatigue</text><text x="790" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">joint only</text><rect x="458" y="322" width="400" height="26" rx="8" fill="#ffffff" fill-opacity=".03"/><text x="466" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Labs</text><text x="618" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">RF, anti-CCP, ESR ↑</text><text x="790" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">normal</text><rect x="24" y="396" width="528" height="130" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="396" width="5" height="130" rx="2.5" fill="#12b886"/><text x="44" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">💊 THE DRUGS, IN THE ORDER THEY ARE STARTED</text><circle cx="46" cy="445.5" r="2.6" fill="#bff3e2"/><text x="56" y="450" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">DMARDs early —</tspan><tspan> methotrexate is first line. It stops damage.</tspan></text><circle cx="46" cy="464.5" r="2.6" fill="#bff3e2"/><text x="56" y="469" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Methotrexate:</tspan><tspan> weekly, with folic acid. Never in pregnancy.</tspan></text><circle cx="46" cy="483.5" r="2.6" fill="#bff3e2"/><text x="56" y="488" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Biologics</tspan><tspan> (etanercept, infliximab) — screen for TB first.</tspan></text><circle cx="46" cy="502.5" r="2.6" fill="#bff3e2"/><text x="56" y="507" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Steroids and NSAIDs</tspan><tspan> are for symptoms only, not the disease.</tspan></text><rect x="568" y="396" width="308" height="130" rx="14" fill="#9d5cff" fill-opacity=".20" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="568" y="396" width="5" height="130" rx="2.5" fill="#9d5cff"/><text x="588" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">🏠 WHAT SHE DOES AT HOME</text><circle cx="590" cy="445.5" r="2.6" fill="#e0ccff"/><text x="600" y="450" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Warm shower in the morning loosens it.</text><circle cx="590" cy="464.5" r="2.6" fill="#e0ccff"/><text x="600" y="469" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Ice a hot, swollen joint.</text><circle cx="590" cy="483.5" r="2.6" fill="#e0ccff"/><text x="600" y="488" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Move it daily — rest stiffens it further.</text><circle cx="590" cy="502.5" r="2.6" fill="#e0ccff"/><text x="600" y="507" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Large joints and both hands for lifting.</text><rect x="24" y="542" width="852" height="44" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="542" width="5" height="44" rx="2.5" fill="#ff3b6b"/><text x="44" y="570" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">🚨 On methotrexate, a sore throat or a fever is reported the same day — it suppresses the marrow.</text></svg>