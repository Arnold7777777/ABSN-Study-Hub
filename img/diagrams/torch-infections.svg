<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 612" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">TORCH infections in pregnancy</title><desc id="d">A pregnancy timeline with the damage curve highest in the first trimester, because that is when organs form, tapering as the pregnancy goes on. Under it each infection with what it does to the baby and the one thing to teach about it.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="612" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#c02255" fill-opacity=".22" stroke="#c02255" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#c02255"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#c02255">THE EARLIER IT HAPPENS, THE WORSE THE DAMAGE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Because early is when the organs are forming. First-trimester rubella is the classic example.</text><rect x="24" y="96" width="872" height="196" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="196" rx="2.5" fill="#ff3b6b"/><text x="46" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">📉  WHEN IT MATTERS MOST</text><rect x="60" y="152" width="800" height="78" rx="9" fill="#0b0716" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".14"/><path d="M60.0 158.0 L60.0 158.0 L70.0 160.7 L80.0 163.4 L90.0 165.9 L100.0 168.3 L110.0 170.6 L120.0 172.9 L130.0 175.0 L140.0 177.0 L150.0 179.0 L160.0 180.9 L170.0 182.6 L180.0 184.4 L190.0 186.0 L200.0 187.6 L210.0 189.1 L220.0 190.6 L230.0 192.0 L240.0 193.3 L250.0 194.6 L260.0 195.8 L270.0 197.0 L280.0 198.1 L290.0 199.2 L300.0 200.2 L310.0 201.2 L320.0 202.1 L330.0 203.0 L340.0 203.9 L350.0 204.8 L360.0 205.6 L370.0 206.3 L380.0 207.1 L390.0 207.8 L400.0 208.4 L410.0 209.1 L420.0 209.7 L430.0 210.3 L440.0 210.9 L450.0 211.4 L460.0 211.9 L470.0 212.4 L480.0 212.9 L490.0 213.4 L500.0 213.8 L510.0 214.3 L520.0 214.7 L530.0 215.0 L540.0 215.4 L550.0 215.8 L560.0 216.1 L570.0 216.4 L580.0 216.8 L590.0 217.1 L600.0 217.3 L610.0 217.6 L620.0 217.9 L630.0 218.1 L640.0 218.4 L650.0 218.6 L660.0 218.8 L670.0 219.1 L680.0 219.3 L690.0 219.5 L700.0 219.7 L710.0 219.8 L720.0 220.0 L730.0 220.2 L740.0 220.3 L750.0 220.5 L760.0 220.6 L770.0 220.8 L780.0 220.9 L790.0 221.0 L800.0 221.2 L810.0 221.3 L820.0 221.4 L830.0 221.5 L840.0 221.6 L850.0 221.7 L860.0 221.8 L860 230 L60 230 Z" fill="#ff3b6b" fill-opacity=".35" stroke="#ff3b6b" stroke-width="2.6"/><path d="M60.0 230 v10" stroke="#8e96c8" stroke-width="1.8"/><text x="60.0" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="start">conception</text><path d="M326.7 230 v10" stroke="#8e96c8" stroke-width="1.8"/><text x="326.66666666666663" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">13 weeks</text><path d="M593.3 230 v10" stroke="#8e96c8" stroke-width="1.8"/><text x="593.3333333333333" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">27 weeks</text><path d="M860.0 230 v10" stroke="#8e96c8" stroke-width="1.8"/><text x="860.0" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="end">birth</text><text x="150" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ORGANS FORMING — worst damage</text><text x="844" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#9aa3d8" fill-opacity="1" text-anchor="end">less structural damage</text><text x="46" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Any of these crossing early can cause structural defects. Later, they cause growth restriction and infection instead.</text><rect x="24" y="308" width="872" height="274" rx="14" fill="#c02255" fill-opacity=".17" stroke="#c02255" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="308" width="5" height="274" rx="2.5" fill="#c02255"/><text x="46" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">🦠  EACH ONE, AND THE TEACHING THAT MATTERS</text><text x="46" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">T</text><text x="62" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">oxoplasmosis</text><text x="210" y="367" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">hydrocephalus, intracranial calcification, chorioretinitis</text><text x="210" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">→ no cat litter · gloves gardening · cook meat through · wash produce</text><text x="46" y="414" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">O</text><text x="62" y="414" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">ther</text><text x="210" y="411" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">syphilis, varicella, parvovirus B19, hepatitis B, HIV, Zika, group B strep</text><text x="210" y="428" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">→ syphilis: penicillin · GBS: screen at 35–37 weeks, IV in labour</text><text x="46" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">R</text><text x="62" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ubella</text><text x="210" y="455" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">DEAFNESS, cataracts, cardiac defects, intellectual disability</text><text x="210" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">→ vaccinate BEFORE pregnancy — it is live, so never during</text><text x="46" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">C</text><text x="62" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">ytomegalovirus</text><text x="210" y="499" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">the commonest congenital infection; hearing loss, microcephaly</text><text x="210" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">→ handwashing after nappies and toddler saliva. No vaccine</text><text x="46" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">H</text><text x="62" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">erpes simplex</text><text x="210" y="543" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">skin, eye and mouth disease; encephalitis; disseminated</text><text x="210" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">→ CAESAREAN if there are active lesions at the time of labour</text></svg>