<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 796" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Sensory deprivation and sensory overload</title><desc id="d">One dial with too little input at one end and too much at the other, both ending in the same confusion in the middle of the page. Under each end, the setting it happens in and what she looks like. Below, who is at risk and the intervention that is nearly always the answer.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="796" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#00c2c7" fill-opacity=".22" stroke="#00c2c7" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#00c2c7"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#00c2c7">BOTH ENDS LOOK THE SAME — SO LOOK AT THE ROOM</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Too little input and too much input both end in confusion. The environment is what tells you which.</text><rect x="24" y="96" width="426" height="300" rx="14" fill="#2f6bff" fill-opacity=".16" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="300" rx="2.5" fill="#2f6bff"/><text x="237" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">DEPRIVATION</text><text x="237" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">too little input — a quiet single room</text><text x="46" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">WHAT SHE LOOKS LIKE</text><text x="46" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· drowsy, bored, withdrawn</text><text x="46" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· then disoriented</text><text x="46" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· may hallucinate</text><text x="46" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· loses track of day and night</text><text x="46" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· sleeps at the wrong times</text><text x="46" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">WHAT FIXES IT</text><text x="46" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· open the curtains; a clock and calendar in view</text><text x="46" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· radio or television that SHE chooses</text><text x="46" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· familiar objects from home; regular visitors</text><text x="46" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· talk to her, and say what day it is</text><rect x="470" y="96" width="426" height="300" rx="14" fill="#ff3b6b" fill-opacity=".16" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="470" y="96" width="5" height="300" rx="2.5" fill="#ff3b6b"/><text x="683" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">OVERLOAD</text><text x="683" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">too much input — intensive care</text><text x="492" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">WHAT SHE LOOKS LIKE</text><text x="492" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· restless, irritable</text><text x="492" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· cannot concentrate</text><text x="492" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· racing thoughts</text><text x="492" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· jumps at every alarm</text><text x="492" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· cannot sleep at all</text><text x="492" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">WHAT FIXES IT</text><text x="492" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· cluster the care; protect blocks of sleep</text><text x="492" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· alarms down; lights down at night</text><text x="492" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· one person speaking at a time</text><text x="492" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· explain each procedure before it happens</text><rect x="24" y="414" width="872" height="120" rx="14" fill="#00c2c7" fill-opacity=".16" stroke="#00c2c7" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="414" width="5" height="120" rx="2.5" fill="#00c2c7"/><text x="46" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">🎚️  THE SAME DIAL, BOTH ENDS</text><rect x="60" y="472" width="800" height="26" rx="13" fill="#0b0716" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".18"/><rect x="60" y="472" width="230" height="26" rx="13" fill="#2f6bff" fill-opacity=".55"/><rect x="360" y="472" width="200" height="26" rx="13" fill="#12b886" fill-opacity=".5"/><rect x="630" y="472" width="230" height="26" rx="13" fill="#ff3b6b" fill-opacity=".55"/><text x="175" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">TOO LITTLE</text><text x="460" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#062a1e" fill-opacity="1" text-anchor="middle">the right amount</text><text x="745" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">TOO MUCH</text><text x="175" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">↓  CONFUSION</text><text x="745" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">CONFUSION  ↓</text><rect x="24" y="552" width="470" height="176" rx="14" fill="#9d5cff" fill-opacity=".15" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="552" width="5" height="176" rx="2.5" fill="#9d5cff"/><text x="46" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">👀  WHO IS AT RISK</text><text x="46" y="612" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">· Older adults with reduced hearing, vision, taste, touch</text><text x="46" y="632" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">· Anyone in isolation, or on prolonged bed rest</text><text x="46" y="652" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">· Intensive care; anyone intubated or restrained</text><text x="46" y="672" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">· Stroke patients with a field loss or neglect</text><text x="46" y="692" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">· Anyone who cannot use their aids — glasses left at</text><text x="46" y="712" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">  home, a hearing aid with a flat battery</text><rect x="514" y="552" width="382" height="176" rx="14" fill="#12b886" fill-opacity=".18" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="552" width="5" height="176" rx="2.5" fill="#12b886"/><text x="536" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅  THE ANSWER THAT IS NEARLY</text><text x="536" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">ALWAYS RIGHT</text><text x="536" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Give her back her glasses and her</text><text x="536" y="656" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">hearing aid.</text><text x="536" y="684" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">An enormous share of "acute confusion"</text><text x="536" y="702" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">in an older adult is simply someone who</text><text x="536" y="720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">cannot see or hear what is happening.</text></svg>