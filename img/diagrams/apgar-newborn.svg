<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 840" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">APGAR scoring and newborn thermoregulation</title><desc id="d">A newborn drawn with a pink body and blue hands and feet, which is normal acrocyanosis and the reason a healthy baby usually scores nine rather than ten. Beside it the five APGAR signs scored nought to two, and the score bands. Below, the four routes a wet newborn loses heat by, drawn as arrows off the baby, with what stops each one.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="840" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#12b886"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#12b886">APGAR GRADES THE TRANSITION — IT NEVER GUIDES CARE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Scored at 1 minute and again at 5. You do not wait a minute to act on a baby who is not breathing.</text><rect x="24" y="96" width="300" height="330" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="330" rx="2.5" fill="#2f6bff"/><text x="174.0" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">WHY 9, NOT 10</text><circle cx="174" cy="166" r="34" fill="#ffc4b0" fill-opacity=".85"/><circle cx="163" cy="160" r="3.4" fill="#3a2030"/><circle cx="185" cy="160" r="3.4" fill="#3a2030"/><path d="M163 176 q11 9 22 0" fill="none" stroke="#3a2030" stroke-width="2.6" stroke-linecap="round"/><path d="M140 204 q34 -12 68 0 v70 q0 20 -34 20 q-34 0 -34 -20 z" fill="#ffc4b0" fill-opacity=".85"/><path d="M144 214 q-16 16 -24 34" stroke="#ffc4b0" stroke-width="13" fill="none" stroke-linecap="round" stroke-opacity=".85"/><circle cx="118" cy="250" r="9" fill="#7fa8ff"/><path d="M159 292 v34" stroke="#ffc4b0" stroke-width="14" fill="none" stroke-linecap="round" stroke-opacity=".85"/><ellipse cx="159" cy="332" rx="10" ry="7" fill="#7fa8ff"/><path d="M204 214 q16 16 24 34" stroke="#ffc4b0" stroke-width="13" fill="none" stroke-linecap="round" stroke-opacity=".85"/><circle cx="230" cy="250" r="9" fill="#7fa8ff"/><path d="M189 292 v34" stroke="#ffc4b0" stroke-width="14" fill="none" stroke-linecap="round" stroke-opacity=".85"/><ellipse cx="189" cy="332" rx="10" ry="7" fill="#7fa8ff"/><text x="42" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Body pink, hands and feet blue =</text><text x="42" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">ACROCYANOSIS. Normal for 24–48 h.</text><text x="42" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">It costs one point on Appearance, which</text><text x="42" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">is why healthy babies score 9.</text><rect x="340" y="96" width="556" height="330" rx="14" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="340" y="96" width="5" height="330" rx="2.5" fill="#12b886"/><text x="358" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">FIVE SIGNS, 0 TO 2 EACH</text><circle cx="546" cy="146" r="11" fill="#ff3b6b" fill-opacity=".85"/><text x="546" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">0</text><circle cx="680" cy="146" r="11" fill="#ffc233" fill-opacity=".85"/><text x="680" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">1</text><circle cx="806" cy="146" r="11" fill="#12b886" fill-opacity=".85"/><text x="806" y="151" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">2</text><rect x="356" y="164" width="524" height="36" rx="9" fill="#ffffff" fill-opacity=".07"/><text x="366" y="185" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A</text><text x="378" y="185" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e8ffef" fill-opacity="1" text-anchor="start">ppearance</text><text x="546" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">blue or pale</text><text x="546" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">all over</text><text x="680" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="middle">body pink,</text><text x="680" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="middle">extremities blue</text><text x="806" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="middle">completely</text><text x="806" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="middle">pink</text><rect x="356" y="206" width="524" height="36" rx="9" fill="#ffffff" fill-opacity=".03"/><text x="366" y="227" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">P</text><text x="378" y="227" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e8ffef" fill-opacity="1" text-anchor="start">ulse</text><text x="546" y="227" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">absent</text><text x="680" y="227" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="middle">under 100</text><text x="806" y="227" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="middle">over 100</text><rect x="356" y="248" width="524" height="36" rx="9" fill="#ffffff" fill-opacity=".07"/><text x="366" y="269" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">G</text><text x="378" y="269" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e8ffef" fill-opacity="1" text-anchor="start">rimace</text><text x="546" y="269" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">no response</text><text x="680" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="middle">a grimace</text><text x="680" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="middle">only</text><text x="806" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="middle">cry, cough,</text><text x="806" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="middle">sneeze</text><rect x="356" y="290" width="524" height="36" rx="9" fill="#ffffff" fill-opacity=".03"/><text x="366" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A</text><text x="378" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e8ffef" fill-opacity="1" text-anchor="start">ctivity</text><text x="546" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">limp</text><text x="680" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="middle">some flexion</text><text x="806" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="middle">active</text><text x="806" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="middle">movement</text><rect x="356" y="332" width="524" height="36" rx="9" fill="#ffffff" fill-opacity=".07"/><text x="366" y="353" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">R</text><text x="378" y="353" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e8ffef" fill-opacity="1" text-anchor="start">espirations</text><text x="546" y="353" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">absent</text><text x="680" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="middle">slow, irregular,</text><text x="680" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="middle">weak cry</text><text x="806" y="353" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="middle">good strong cry</text><text x="546" y="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">0–3  resuscitate</text><text x="680" y="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">4–6  moderate</text><text x="806" y="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">7–10  good</text><rect x="24" y="440" width="872" height="62" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="440" width="5" height="62" rx="2.5" fill="#ffc233"/><text x="46" y="464" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">The 1-minute score reflects conditions in the womb.</text><text x="46" y="484" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">The 5-minute score matters more — it shows the response to whatever you did.</text><rect x="24" y="518" width="872" height="300" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="518" width="5" height="300" rx="2.5" fill="#ff3b6b"/><text x="46" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🌡️  A NEWBORN CANNOT SHIVER — THE FOUR WAYS HEAT LEAVES</text><circle cx="160" cy="634" r="26" fill="#ffc4b0" fill-opacity=".8"/><path d="M134 664 q26 -10 52 0 v54 q0 16 -26 16 q-26 0 -26 -16 z" fill="#ffc4b0" fill-opacity=".8"/><path d="M136 644 L92 598" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="300" y="576" width="574" height="42" rx="10" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".7"/><text x="312" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">EVAPORATION</text><text x="312" y="610" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">from wet skin</text><text x="470" y="603" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Dry her at once, take the wet linen away</text><path d="M184 644 L228 598" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="300" y="624" width="574" height="42" rx="10" fill="#2f6bff" fill-opacity=".18" stroke="#2f6bff" stroke-opacity=".7"/><text x="312" y="642" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">CONDUCTION</text><text x="312" y="658" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">from a cold surface</text><text x="470" y="651" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Pre-warm the scale, the mattress, your hands</text><path d="M136 688 L92 734" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="300" y="672" width="574" height="42" rx="10" fill="#12b886" fill-opacity=".18" stroke="#12b886" stroke-opacity=".7"/><text x="312" y="690" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">CONVECTION</text><text x="312" y="706" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">from moving air</text><text x="470" y="699" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Away from doors, vents and draughts</text><path d="M184 688 L228 734" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="300" y="720" width="574" height="42" rx="10" fill="#ff8a3d" fill-opacity=".18" stroke="#ff8a3d" stroke-opacity=".7"/><text x="312" y="738" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">RADIATION</text><text x="312" y="754" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">from a cold wall nearby</text><text x="470" y="747" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Cot away from windows and outside walls</text><text x="46" y="786" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Drying her immediately is the single most important thing done at birth.</text><text x="46" y="804" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A cold baby burns glucose and oxygen, and quickly becomes a hypoglycaemic, acidotic one.</text></svg>