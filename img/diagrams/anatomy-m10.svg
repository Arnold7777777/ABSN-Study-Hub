<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 502" role="img" aria-label="The heart in section with its four chambers and four valves, and the eight-step path a drop of blood takes from the vena cava through the lungs and out the aorta. Below, the conduction system from SA node to Purkinje fibers."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="498" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">FOUR CHAMBERS, FOUR VALVES</text><rect x="28" y="52" width="160" height="86" rx="12" fill="rgba(91,124,250,.55)" stroke="rgba(255,255,255,.6)" stroke-width="2"/><text x="108.0" y="86" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Right atrium</text><text x="108.0" y="108" font-size="17" font-weight="800" fill="#e9e2ff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">from the body</text><rect x="200" y="52" width="160" height="86" rx="12" fill="rgba(255,59,107,.5)" stroke="rgba(255,255,255,.6)" stroke-width="2"/><text x="280.0" y="86" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Left atrium</text><text x="280.0" y="108" font-size="17" font-weight="800" fill="#e9e2ff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">from the lungs</text><rect x="28" y="166" width="160" height="110" rx="12" fill="rgba(91,124,250,.72)" stroke="rgba(255,255,255,.6)" stroke-width="2"/><text x="108.0" y="200" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Right ventricle</text><text x="108.0" y="222" font-size="17" font-weight="800" fill="#e9e2ff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">to the lungs</text><rect x="200" y="166" width="160" height="110" rx="12" fill="rgba(255,59,107,.68)" stroke="rgba(255,255,255,.6)" stroke-width="2"/><text x="280.0" y="200" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Left ventricle</text><text x="280.0" y="222" font-size="17" font-weight="800" fill="#e9e2ff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">to the body</text><text x="28" y="156" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">&#9660; tricuspid</text><text x="200" y="156" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">&#9660; bicuspid</text><text x="28" y="292" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">&#9660; pulmonary valve</text><text x="240" y="292" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">&#9660; aortic valve</text><text x="392" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">ONE DROP, IN ORDER</text><circle cx="404" cy="61" r="11" fill="#ffd76a"/><text x="404" y="67" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">1</text><text x="422" y="67" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Vena cava</text><line x1="404" y1="72" x2="404" y2="80" stroke="rgba(255,215,106,.7)" stroke-width="2.4"/><circle cx="404" cy="91" r="11" fill="#ffd76a"/><text x="404" y="97" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">2</text><text x="422" y="97" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Right atrium</text><line x1="404" y1="102" x2="404" y2="110" stroke="rgba(255,215,106,.7)" stroke-width="2.4"/><circle cx="404" cy="121" r="11" fill="#ffd76a"/><text x="404" y="127" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">3</text><text x="422" y="127" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Tricuspid valve</text><line x1="404" y1="132" x2="404" y2="140" stroke="rgba(255,215,106,.7)" stroke-width="2.4"/><circle cx="404" cy="151" r="11" fill="#ffd76a"/><text x="404" y="157" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">4</text><text x="422" y="157" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Right ventricle</text><line x1="404" y1="162" x2="404" y2="170" stroke="rgba(255,215,106,.7)" stroke-width="2.4"/><circle cx="404" cy="181" r="11" fill="#ffd76a"/><text x="404" y="187" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">5</text><text x="422" y="187" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Pulmonary valve</text><line x1="404" y1="192" x2="404" y2="200" stroke="rgba(255,215,106,.7)" stroke-width="2.4"/><circle cx="404" cy="211" r="11" fill="#ffd76a"/><text x="404" y="217" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">6</text><text x="422" y="217" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Lungs — picks up O&#8322;</text><line x1="404" y1="222" x2="404" y2="230" stroke="rgba(255,215,106,.7)" stroke-width="2.4"/><circle cx="404" cy="241" r="11" fill="#ffd76a"/><text x="404" y="247" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">7</text><text x="422" y="247" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Left atrium → mitral</text><line x1="404" y1="252" x2="404" y2="260" stroke="rgba(255,215,106,.7)" stroke-width="2.4"/><circle cx="404" cy="271" r="11" fill="#ffd76a"/><text x="404" y="277" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">8</text><text x="422" y="277" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Left ventricle → aorta</text><text x="24" y="336" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THE ELECTRICAL PATH</text><rect x="24" y="348" width="332" height="64" rx="10" fill="rgba(0,194,199,.42)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><circle cx="50" cy="380" r="14" fill="#ffd76a"/><text x="50" y="386" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">1</text><text x="74" y="374" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">SA node</text><text x="74" y="396" font-size="17" font-weight="800" fill="#d6fbff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">the pacemaker</text><rect x="372" y="348" width="332" height="64" rx="10" fill="rgba(0,194,199,.42)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><circle cx="398" cy="380" r="14" fill="#ffd76a"/><text x="398" y="386" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">2</text><text x="422" y="374" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">AV node</text><text x="422" y="396" font-size="17" font-weight="800" fill="#d6fbff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">the delay</text><rect x="24" y="420" width="332" height="64" rx="10" fill="rgba(0,194,199,.42)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><circle cx="50" cy="452" r="14" fill="#ffd76a"/><text x="50" y="458" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">3</text><text x="74" y="446" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Bundle of His</text><text x="74" y="468" font-size="17" font-weight="800" fill="#d6fbff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">down the septum</text><rect x="372" y="420" width="332" height="64" rx="10" fill="rgba(0,194,199,.42)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><circle cx="398" cy="452" r="14" fill="#ffd76a"/><text x="398" y="458" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">4</text><text x="422" y="446" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Purkinje fibers</text><text x="422" y="468" font-size="17" font-weight="800" fill="#d6fbff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">ventricles squeeze</text></svg>