<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Nephrotic syndrome versus acute glomerulonephritis</title><desc id="d">The glomerular filter drawn twice. In nephrotic syndrome the pores are stretched wide and protein pours through into frothy urine, with severe puffy oedema and a low albumin. In glomerulonephritis the membrane is inflamed and red cells force through into cola-coloured urine, with high blood pressure. Below, the point-by-point comparison.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="720" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#00c2c7" fill-opacity=".22" stroke="#00c2c7" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#00c2c7"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#00c2c7">ONE LEAKS PROTEIN. THE OTHER LEAKS BLOOD.</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">NephrOtic leaks prOtein. NephrItic leaks blood and causes hypertensIon.</text><rect x="24" y="96" width="426" height="392" rx="14" fill="#ffc233" fill-opacity=".14" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="392" rx="2.5" fill="#ffc233"/><text x="237.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">💧  NEPHROTIC</text><text x="237.0" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="middle">the pores are stretched wide open</text><text x="50" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#cfd4ff" fill-opacity="1" text-anchor="start">BLOOD side</text><rect x="44.0" y="214" width="46.1" height="16" rx="5" fill="#ffc233" fill-opacity=".85"/><rect x="99.1" y="214" width="46.1" height="16" rx="5" fill="#ffc233" fill-opacity=".85"/><rect x="154.3" y="214" width="46.1" height="16" rx="5" fill="#ffc233" fill-opacity=".85"/><rect x="209.4" y="214" width="46.1" height="16" rx="5" fill="#ffc233" fill-opacity=".85"/><rect x="264.6" y="214" width="46.1" height="16" rx="5" fill="#ffc233" fill-opacity=".85"/><rect x="319.7" y="214" width="46.1" height="16" rx="5" fill="#ffc233" fill-opacity=".85"/><rect x="374.9" y="214" width="46.1" height="16" rx="5" fill="#ffc233" fill-opacity=".85"/><text x="50" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#cfd4ff" fill-opacity="1" text-anchor="start">URINE side</text><circle cx="100.7" cy="188.0" r="7" fill="#ffc233" fill-opacity=".95"/><circle cx="168.8" cy="180.0" r="7" fill="#ffc233" fill-opacity=".95"/><circle cx="245.5" cy="192.0" r="7" fill="#ffc233" fill-opacity=".95"/><circle cx="330.7" cy="184.0" r="7" fill="#ffc233" fill-opacity=".95"/><circle cx="134.8" cy="222.0" r="7" fill="#ffc233" fill-opacity=".95"/><circle cx="220.0" cy="222.0" r="7" fill="#ffc233" fill-opacity=".95"/><circle cx="305.2" cy="222.0" r="7" fill="#ffc233" fill-opacity=".95"/><circle cx="117.7" cy="254.0" r="7" fill="#ffc233" fill-opacity=".95"/><circle cx="194.4" cy="260.0" r="7" fill="#ffc233" fill-opacity=".95"/><circle cx="271.1" cy="256.0" r="7" fill="#ffc233" fill-opacity=".95"/><circle cx="347.8" cy="262.0" r="7" fill="#ffc233" fill-opacity=".95"/><text x="46" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">PROTEIN pours through</text><path d="M68 334 v42 q0 10 10 10 h32 q10 0 10 -10 v-42 z" fill="#0b0716" fill-opacity=".8" stroke="#cfd4ff" stroke-opacity=".5" stroke-width="2"/><path d="M70 346 v30 q0 10 10 10 h32 q10 0 10 -10 v-30 z" fill="#e9dfae" fill-opacity=".95"/><circle cx="75.0" cy="342.0" r="3.2" fill="#fff" fill-opacity=".75"/><circle cx="81.4" cy="346.0" r="2.7" fill="#fff" fill-opacity=".75"/><circle cx="87.8" cy="350.0" r="2.2" fill="#fff" fill-opacity=".75"/><circle cx="94.2" cy="342.0" r="3.2" fill="#fff" fill-opacity=".75"/><circle cx="100.6" cy="346.0" r="2.7" fill="#fff" fill-opacity=".75"/><circle cx="107.0" cy="350.0" r="2.2" fill="#fff" fill-opacity=".75"/><circle cx="113.4" cy="342.0" r="3.2" fill="#fff" fill-opacity=".75"/><text x="94" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">frothy urine</text><text x="154" y="324" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Albumin falls → the blood cannot hold water</text><text x="154" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Water leaves the vessels → SEVERE oedema</text><text x="154" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Puffy eyes on waking, then ascites</text><text x="154" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Blood pressure normal or LOW</text><text x="154" y="404" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Cholesterol climbs. Steroids are the mainstay.</text><text x="46" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Immunoglobulins go out with the protein, and she is on</text><text x="46" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">steroids — infection is the real danger here.</text><rect x="470" y="96" width="426" height="392" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="470" y="96" width="5" height="392" rx="2.5" fill="#ff3b6b"/><text x="683.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">🩸  NEPHRITIC</text><text x="683.0" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">the membrane is inflamed and swollen</text><text x="496" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#cfd4ff" fill-opacity="1" text-anchor="start">BLOOD side</text><rect x="490.0" y="214" width="37.9" height="22" rx="5" fill="#c02255" fill-opacity=".85"/><rect x="532.9" y="214" width="37.9" height="22" rx="5" fill="#c02255" fill-opacity=".85"/><rect x="575.8" y="214" width="37.9" height="22" rx="5" fill="#c02255" fill-opacity=".85"/><rect x="618.7" y="214" width="37.9" height="22" rx="5" fill="#c02255" fill-opacity=".85"/><rect x="661.6" y="214" width="37.9" height="22" rx="5" fill="#c02255" fill-opacity=".85"/><rect x="704.4" y="214" width="37.9" height="22" rx="5" fill="#c02255" fill-opacity=".85"/><rect x="747.3" y="214" width="37.9" height="22" rx="5" fill="#c02255" fill-opacity=".85"/><rect x="790.2" y="214" width="37.9" height="22" rx="5" fill="#c02255" fill-opacity=".85"/><rect x="833.1" y="214" width="37.9" height="22" rx="5" fill="#c02255" fill-opacity=".85"/><rect x="486" y="212" width="394" height="26" rx="8" fill="#ff3b6b" fill-opacity=".22"/><text x="496" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#cfd4ff" fill-opacity="1" text-anchor="start">URINE side</text><circle cx="555.2" cy="184.0" r="6" fill="#ff2d55" fill-opacity=".95"/><circle cx="640.4" cy="178.0" r="6" fill="#ff2d55" fill-opacity=".95"/><circle cx="725.6" cy="186.0" r="6" fill="#ff2d55" fill-opacity=".95"/><circle cx="810.8" cy="180.0" r="6" fill="#ff2d55" fill-opacity=".95"/><circle cx="597.8" cy="224.0" r="6" fill="#ff2d55" fill-opacity=".95"/><circle cx="717.1" cy="224.0" r="6" fill="#ff2d55" fill-opacity=".95"/><circle cx="580.8" cy="260.0" r="6" fill="#ff2d55" fill-opacity=".95"/><circle cx="674.5" cy="266.0" r="6" fill="#ff2d55" fill-opacity=".95"/><circle cx="768.2" cy="262.0" r="6" fill="#ff2d55" fill-opacity=".95"/><text x="492" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">RED CELLS force through</text><path d="M514 334 v42 q0 10 10 10 h32 q10 0 10 -10 v-42 z" fill="#0b0716" fill-opacity=".8" stroke="#cfd4ff" stroke-opacity=".5" stroke-width="2"/><path d="M516 346 v30 q0 10 10 10 h32 q10 0 10 -10 v-30 z" fill="#5b2418" fill-opacity=".95"/><text x="540" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">cola-coloured</text><text x="600" y="324" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Inflammation blocks filtration → fluid is held</text><text x="600" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Blood pressure goes HIGH</text><text x="600" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Oedema mild, mostly around the eyes</text><text x="600" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Albumin normal, cholesterol normal</text><text x="600" y="404" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Supportive care: BP control and fluid limits</text><text x="492" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Sore throat or impetigo 1–3 weeks ago is the</text><text x="492" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">giveaway history. ASO up, complement C3 down.</text><rect x="24" y="504" width="872" height="195" rx="14" fill="#2f6bff" fill-opacity=".13" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="504" width="5" height="195" rx="2.5" fill="#2f6bff"/><text x="46" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">SIDE BY SIDE</text><text x="200" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">NEPHROTIC</text><text x="520" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">GLOMERULONEPHRITIS</text><text x="46" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Urine</text><text x="200" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">massive protein, frothy</text><text x="520" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">blood — tea or cola coloured</text><text x="46" y="573" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Oedema</text><text x="200" y="573" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">severe and generalised</text><text x="520" y="573" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">mild, periorbital</text><text x="46" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Blood pressure</text><text x="200" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">normal or low</text><text x="520" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">HIGH</text><text x="46" y="615" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Albumin</text><text x="200" y="615" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">LOW</text><text x="520" y="615" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">normal</text><text x="46" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Preceded by</text><text x="200" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">often nothing — idiopathic</text><text x="520" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">strep throat or impetigo, 1–3 weeks</text><text x="46" y="657" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Age</text><text x="200" y="657" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">2–7 years</text><text x="520" y="657" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">5–12 years</text><text x="46" y="678" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Treatment</text><text x="200" y="678" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">steroids, albumin, low salt</text><text x="520" y="678" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">supportive; BP control, fluid limits</text></svg>