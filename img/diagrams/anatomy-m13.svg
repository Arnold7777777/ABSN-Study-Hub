<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="The alimentary canal drawn top to bottom with the accessory organs beside it: mouth, oesophagus, stomach, small intestine, large intestine, and the liver, gallbladder and pancreas that feed into it. Below, the two pancreatic hormones."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="396" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THE CANAL — FOOD’S ROUTE</text><rect x="24" y="52" width="336" height="48" rx="10" fill="rgba(255,194,51,.42)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="36" y="73" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Mouth</text><text x="36" y="92" font-size="17" font-weight="800" fill="#ffeec2" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">chewing + salivary amylase</text><line x1="332" y1="100" x2="332" y2="109" stroke="#ffd76a" stroke-width="2.2" marker-end="url(#ah)"/><rect x="24" y="108" width="336" height="48" rx="10" fill="rgba(255,194,51,.42)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="36" y="129" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Esophagus</text><text x="36" y="148" font-size="17" font-weight="800" fill="#ffeec2" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">peristalsis, not gravity</text><line x1="332" y1="156" x2="332" y2="165" stroke="#ffd76a" stroke-width="2.2" marker-end="url(#ah)"/><rect x="24" y="164" width="336" height="48" rx="10" fill="rgba(255,194,51,.42)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="36" y="185" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Stomach</text><text x="36" y="204" font-size="17" font-weight="800" fill="#ffeec2" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">rugae stretch; acid + pepsin</text><line x1="332" y1="212" x2="332" y2="221" stroke="#ffd76a" stroke-width="2.2" marker-end="url(#ah)"/><rect x="24" y="220" width="336" height="48" rx="10" fill="rgba(255,194,51,.42)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="36" y="241" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Small intestine</text><text x="36" y="260" font-size="17" font-weight="800" fill="#ffeec2" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">villi and lacteals absorb here</text><line x1="332" y1="268" x2="332" y2="277" stroke="#ffd76a" stroke-width="2.2" marker-end="url(#ah)"/><rect x="24" y="276" width="336" height="48" rx="10" fill="rgba(255,194,51,.42)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="36" y="297" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Large intestine</text><text x="36" y="316" font-size="17" font-weight="800" fill="#ffeec2" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">water back, bacteria, stool</text><text x="384" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THE ACCESSORY ORGANS</text><rect x="384" y="52" width="312" height="56" rx="10" fill="rgba(201,24,74,.6)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="396" y="76" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Liver</text><text x="396" y="96" font-size="17" font-weight="800" fill="#f0eaff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">makes bile, processes it all</text><rect x="384" y="118" width="312" height="56" rx="10" fill="rgba(18,184,134,.55)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="396" y="142" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Gallbladder</text><text x="396" y="162" font-size="17" font-weight="800" fill="#f0eaff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">stores and releases bile</text><rect x="384" y="184" width="312" height="56" rx="10" fill="rgba(157,92,255,.6)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="396" y="208" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Pancreas</text><text x="396" y="228" font-size="17" font-weight="800" fill="#f0eaff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">enzymes out, hormones in</text><text x="384" y="268" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Food never enters them</text><text x="24" y="346" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THE PANCREAS, BOTH JOBS</text><rect x="24" y="358" width="340" height="34" rx="9" fill="rgba(255,59,107,.55)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="36" y="380" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Insulin — sugar out of the blood</text><rect x="376" y="358" width="320" height="34" rx="9" fill="rgba(0,194,199,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="388" y="380" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Glucagon — sugar back in</text></svg>