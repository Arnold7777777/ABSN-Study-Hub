<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 748" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Tuberculosis: how it hides and how it is found</title><desc id="d">The four stages drawn: droplet nuclei reaching the alveoli, a macrophage swallowing the bacillus but failing to kill it, a granuloma walling it up where it sits dormant, and the wall breaking down when immunity drops. Beside them a lung with cavitation at the apices, because the bacillus is aerobic. Below, latent against active, and the three tests.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="748" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">THE WAXY COAT IS THE WHOLE STORY</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">It resists drying, resists ordinary stains, and resists being digested by the macrophage that swallows it.</text><rect x="24" y="96" width="590" height="268" rx="14" fill="#ff8a3d" fill-opacity=".16" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="268" rx="2.5" fill="#ff8a3d"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">🦠  WHAT HAPPENS AFTER SHE BREATHES IT IN</text><rect x="46" y="152" width="256" height="88" rx="12" fill="#2f6bff" fill-opacity=".18" stroke="#2f6bff" stroke-opacity=".78"/><circle cx="72" cy="176" r="11" fill="#2f6bff"/><text x="72" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">1</text><text x="92" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">INHALED</text><text x="62" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">droplet nuclei reach the alveoli</text><ellipse cx="256" cy="204" rx="6" ry="3" fill="#2f6bff" fill-opacity=".85"/><ellipse cx="265" cy="211" rx="6" ry="3" fill="#2f6bff" fill-opacity=".85"/><ellipse cx="274" cy="218" rx="6" ry="3" fill="#2f6bff" fill-opacity=".85"/><rect x="326" y="152" width="256" height="88" rx="12" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".78"/><circle cx="352" cy="176" r="11" fill="#ffc233"/><text x="352" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">2</text><text x="372" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">ENGULFED</text><text x="342" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">a macrophage swallows it —</text><text x="342" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">but cannot kill it</text><circle cx="544" cy="210" r="15" fill="#9aa3d8" fill-opacity=".45"/><ellipse cx="544" cy="210" rx="7" ry="3.4" fill="#ffc233"/><rect x="46" y="256" width="256" height="88" rx="12" fill="#12b886" fill-opacity=".18" stroke="#12b886" stroke-opacity=".78"/><circle cx="72" cy="280" r="11" fill="#12b886"/><text x="72" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">3</text><text x="92" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">WALLED OFF</text><text x="62" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">a granuloma forms around it;</text><text x="62" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">the bacillus survives inside, dormant</text><circle cx="264" cy="314" r="16" fill="none" stroke="#12b886" stroke-width="5"/><ellipse cx="264" cy="314" rx="7" ry="3.4" fill="#e8c94a" fill-opacity=".8"/><rect x="326" y="256" width="256" height="88" rx="12" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".78"/><circle cx="352" cy="280" r="11" fill="#ff3b6b"/><text x="352" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">4</text><text x="372" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">REACTIVATION</text><text x="342" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">immunity drops, the wall breaks</text><text x="342" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">down → active disease</text><path d="M556 324 a16 16 0 1 1 10 -12" fill="none" stroke="#ff3b6b" stroke-width="5" stroke-linecap="round"/><ellipse cx="560" cy="302" rx="6" ry="3" fill="#e8c94a"/><ellipse cx="564" cy="318" rx="6" ry="3" fill="#e8c94a"/><ellipse cx="554" cy="330" rx="6" ry="3" fill="#e8c94a"/><text x="46" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Aerobic, so it settles where the oxygen is highest — hence the cavitation at the apices.</text><rect x="634" y="96" width="262" height="268" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="634" y="96" width="5" height="268" rx="2.5" fill="#2f6bff"/><text x="765.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">WHERE IT SITS</text><path d="M753 180 q-30 10 -44 62 q-4 44 --32 50 q--18 -38 --12 -112 z" fill="#dfe9ff" fill-opacity=".2" stroke="#dfe9ff" stroke-opacity=".5" stroke-width="2"/><path d="M777 180 q30 10 44 62 q4 44 -32 50 q-18 -38 -12 -112 z" fill="#dfe9ff" fill-opacity=".2" stroke="#dfe9ff" stroke-opacity=".5" stroke-width="2"/><rect x="759" y="180" width="12" height="112" rx="5" fill="#8a90b8" fill-opacity=".55"/><circle cx="733" cy="204" r="11" fill="none" stroke="#ff3b6b" stroke-width="4"/><circle cx="797" cy="204" r="11" fill="none" stroke="#ff3b6b" stroke-width="4"/><text x="765.0" y="160" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">APICES</text><text x="765.0" y="324" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="middle">Cavities form at the top,</text><text x="765.0" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="middle">where the oxygen is.</text><text x="765.0" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">That is the classic film.</text><rect x="24" y="382" width="872" height="186" rx="14" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="382" width="5" height="186" rx="2.5" fill="#12b886"/><text x="46" y="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">LATENT  vs  ACTIVE</text><text x="300" y="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">LATENT INFECTION</text><text x="600" y="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ACTIVE DISEASE</text><text x="46" y="436" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Symptoms</text><text x="300" y="436" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">none at all</text><text x="600" y="436" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">cough, fever, night sweats, weight loss</text><text x="46" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Contagious?</text><text x="300" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">NO</text><text x="600" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">YES — airborne precautions</text><text x="46" y="480" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Chest X-ray</text><text x="300" y="480" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">normal</text><text x="600" y="480" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">abnormal; cavitation at the apices</text><text x="46" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Skin or blood test</text><text x="300" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">POSITIVE</text><text x="600" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">positive</text><text x="46" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Sputum</text><text x="300" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">negative</text><text x="600" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">positive — this is what confirms it</text><text x="46" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Treatment</text><text x="300" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">still treated, to stop it reactivating</text><text x="600" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">multi-drug, for months</text><rect x="24" y="584" width="872" height="138" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="584" width="5" height="138" rx="2.5" fill="#ffc233"/><text x="46" y="614" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🧪  THE THREE TESTS THAT GET CONFUSED</text><text x="46" y="642" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">MANTOUX (PPD)</text><text x="46" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· read at 48–72 hours</text><text x="46" y="682" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· measure INDURATION, not redness</text><text x="46" y="700" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· once positive, always positive — never repeat it</text><text x="338" y="642" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">IGRA blood test</text><text x="338" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· one visit, one draw</text><text x="338" y="682" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· BCG vaccination does NOT affect it</text><text x="338" y="700" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· useful where BCG has been given</text><text x="630" y="642" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">SPUTUM AFB × 3</text><text x="630" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· this is what confirms ACTIVE disease</text><text x="630" y="682" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· and what clears her from isolation</text><text x="630" y="700" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· early morning, three separate days</text></svg>