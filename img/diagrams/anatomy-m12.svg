<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-label="The airway from the nose down: nasal cavity, pharynx, larynx, trachea, bronchi, bronchioles and alveoli, split into upper and lower tract. Beside it, the three cells of the alveolus and what each one does."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="392" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">NOSE TO ALVEOLUS</text><rect x="24" y="52" width="352" height="40" rx="9" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/><rect x="30" y="59" width="8" height="26" rx="4" fill="#00c2c7"/><text x="46" y="71" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Nasal cavity</text><text x="46" y="87" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">warms, moistens, filters</text><line x1="348" y1="92" x2="348" y2="101" stroke="#ffd76a" stroke-width="2.2" marker-end="url(#ah)"/><rect x="24" y="100" width="352" height="40" rx="9" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/><rect x="30" y="107" width="8" height="26" rx="4" fill="#00c2c7"/><text x="46" y="119" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Pharynx</text><text x="46" y="135" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">shared with food</text><line x1="348" y1="140" x2="348" y2="149" stroke="#ffd76a" stroke-width="2.2" marker-end="url(#ah)"/><rect x="24" y="148" width="352" height="40" rx="9" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/><rect x="30" y="155" width="8" height="26" rx="4" fill="#00c2c7"/><text x="46" y="167" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Larynx</text><text x="46" y="183" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">voice box · epiglottis</text><line x1="348" y1="188" x2="348" y2="197" stroke="#ffd76a" stroke-width="2.2" marker-end="url(#ah)"/><rect x="24" y="196" width="352" height="40" rx="9" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/><rect x="30" y="203" width="8" height="26" rx="4" fill="#ffc233"/><text x="46" y="215" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Trachea</text><text x="46" y="231" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">C-rings hold it open</text><line x1="348" y1="236" x2="348" y2="245" stroke="#ffd76a" stroke-width="2.2" marker-end="url(#ah)"/><rect x="24" y="244" width="352" height="40" rx="9" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/><rect x="30" y="251" width="8" height="26" rx="4" fill="#ffc233"/><text x="46" y="263" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Bronchi</text><text x="46" y="279" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">right one is steeper</text><line x1="348" y1="284" x2="348" y2="293" stroke="#ffd76a" stroke-width="2.2" marker-end="url(#ah)"/><rect x="24" y="292" width="352" height="40" rx="9" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/><rect x="30" y="299" width="8" height="26" rx="4" fill="#ffc233"/><text x="46" y="311" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Bronchioles</text><text x="46" y="327" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">muscle, no cartilage</text><line x1="348" y1="332" x2="348" y2="341" stroke="#ffd76a" stroke-width="2.2" marker-end="url(#ah)"/><rect x="24" y="340" width="352" height="40" rx="9" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/><rect x="30" y="347" width="8" height="26" rx="4" fill="#12b886"/><text x="46" y="359" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Alveoli</text><text x="46" y="375" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">where gas actually swaps</text><rect x="24" y="384" width="0" height="0" rx="11" fill="rgba(0,0,0,0)" stroke="rgba(0,0,0,0)" stroke-width="2"/><text x="400" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">UPPER vs LOWER</text><rect x="400" y="48" width="296" height="64" rx="10" fill="rgba(0,194,199,.45)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="412" y="72" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Upper: nose → larynx</text><text x="412" y="96" font-size="17" font-weight="800" fill="#d6fbff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Above the trachea</text><rect x="400" y="124" width="296" height="64" rx="10" fill="rgba(255,194,51,.55)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="412" y="148" font-size="19" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Lower: trachea → alveoli</text><text x="412" y="172" font-size="17" font-weight="800" fill="#3a2a00" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Cartilage fades out</text><text x="400" y="220" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">INSIDE ONE ALVEOLUS</text><rect x="400" y="236" width="296" height="46" rx="9" fill="rgba(18,184,134,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="412" y="256" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Type I cell</text><text x="412" y="274" font-size="17" font-weight="800" fill="#d9ffee" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">flat — gas crosses here</text><rect x="400" y="290" width="296" height="46" rx="9" fill="rgba(18,184,134,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="412" y="310" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Type II cell</text><text x="412" y="328" font-size="17" font-weight="800" fill="#d9ffee" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">makes surfactant</text><rect x="400" y="344" width="296" height="46" rx="9" fill="rgba(18,184,134,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="412" y="364" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Macrophage</text><text x="412" y="382" font-size="17" font-weight="800" fill="#d9ffee" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">eats what got through</text></svg>