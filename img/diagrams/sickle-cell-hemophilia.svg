<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 716" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Sickle cell disease and haemophilia</title><desc id="d">Round red cells flowing freely through a capillary beside stiff crescent-shaped ones jammed in it, with the tissue beyond going without. Under it the triggers and the treatments set out as mirror images of each other. Beside them haemophilia, with the clotting cascade stopping at the missing factor, and the joint filling with blood.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="716" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#c02255" fill-opacity=".22" stroke="#c02255" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#c02255"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#c02255">ONE CLOGS THE VESSEL. THE OTHER CANNOT FORM A CLOT.</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Both inherited, and each has one intervention that matters more than the rest.</text><rect x="24" y="96" width="470" height="348" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="348" rx="2.5" fill="#ff3b6b"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🩸  SICKLE CELL — THE CELLS JAM</text><path d="M60 162 h190" stroke="#e9c9b6" stroke-opacity=".3" stroke-width="30" stroke-linecap="round"/><ellipse cx="74" cy="162" rx="12" ry="9" fill="#ff3b6b" fill-opacity=".9"/><ellipse cx="114" cy="162" rx="12" ry="9" fill="#ff3b6b" fill-opacity=".9"/><ellipse cx="154" cy="162" rx="12" ry="9" fill="#ff3b6b" fill-opacity=".9"/><ellipse cx="194" cy="162" rx="12" ry="9" fill="#ff3b6b" fill-opacity=".9"/><ellipse cx="234" cy="162" rx="12" ry="9" fill="#ff3b6b" fill-opacity=".9"/><path d="M66 192 L244 192" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="155" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">flows freely</text><path d="M60 236 h190" stroke="#e9c9b6" stroke-opacity=".3" stroke-width="30" stroke-linecap="round"/><path d="M74 236 q14 -14 24 0 q-10 -6 -24 0 z" fill="#c02255" fill-opacity=".95" transform="rotate(-30 86 236)"/><path d="M106 236 q14 -14 24 0 q-10 -6 -24 0 z" fill="#c02255" fill-opacity=".95" transform="rotate(20 118 236)"/><path d="M134 236 q14 -14 24 0 q-10 -6 -24 0 z" fill="#c02255" fill-opacity=".95" transform="rotate(-10 146 236)"/><path d="M156 236 q14 -14 24 0 q-10 -6 -24 0 z" fill="#c02255" fill-opacity=".95" transform="rotate(40 168 236)"/><path d="M184 236 q14 -14 24 0 q-10 -6 -24 0 z" fill="#c02255" fill-opacity=".95" transform="rotate(0 196 236)"/><path d="M216 228 l16 16 M232 228 l-16 16" stroke="#ff3b6b" stroke-width="3.4" stroke-linecap="round"/><text x="155" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">jammed — the tissue beyond starves</text><text x="266" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">normal</text><text x="266" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">sickled</text><text x="46" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">TRIGGER</text><text x="258" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">SO THE TREATMENT IS</text><text x="46" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">hypoxia — altitude, infection</text><text x="258" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">→ oxygen</text><text x="46" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">dehydration</text><text x="258" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">→ hydration, aggressively</text><text x="46" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">cold — it vasoconstricts</text><text x="258" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">→ WARMTH, never cold</text><text x="46" y="390" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">stress, infection, acidosis</text><text x="258" y="390" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">→ treat the cause; analgesia</text><text x="46" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Everything that triggers a crisis takes away oxygen or water.</text><text x="46" y="434" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">The treatment is simply that list, read backwards.</text><rect x="514" y="96" width="382" height="348" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="348" rx="2.5" fill="#2f6bff"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🧬  HAEMOPHILIA — THE CLOT NEVER SETS</text><rect x="546" y="152" width="76" height="34" rx="10" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".8"/><text x="584" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">injury</text><path d="M624 169 L630 169" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="632" y="152" width="76" height="34" rx="10" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".8"/><text x="670" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">platelet</text><text x="670" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">plug</text><path d="M710 169 L716 169" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="718" y="152" width="76" height="34" rx="10" fill="#ff3b6b" fill-opacity=".30" stroke="#ff3b6b" stroke-opacity=".8" stroke-dasharray="6 4"/><text x="756" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">FACTOR</text><text x="756" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">VIII</text><path d="M796 169 L802 169" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="804" y="152" width="76" height="34" rx="10" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".8"/><text x="842" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">stable</text><text x="842" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">clot</text><path d="M724 196 l16 16 M740 196 l-16 16" stroke="#ff3b6b" stroke-width="3.4" stroke-linecap="round"/><text x="732" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">missing — so it never</text><text x="732" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">gets past this point</text><path d="M592 244 v30 M592 308 v30" stroke="#e9c9b6" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"/><circle cx="592" cy="292" r="22" fill="#ff3b6b" fill-opacity=".7" stroke="#ff3b6b" stroke-width="2.5"/><text x="626" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">HAEMARTHROSIS —</text><text x="626" y="301" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">blood inside the joint.</text><text x="626" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Far too painful to move.</text><text x="532" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Elevate · factor replacement · no range of motion ·</text><text x="532" y="377" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">ice for comfort. NEVER aspirin or NSAIDs.</text><text x="532" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">X-linked recessive: mothers carry it, sons have it.</text><text x="532" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">aPTT is prolonged; the platelet count is normal.</text><rect x="24" y="462" width="872" height="180" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="462" width="5" height="180" rx="2.5" fill="#ffc233"/><text x="46" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐  WHAT GETS ASKED</text><text x="46" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Sickle cell is autosomal recessive: two genes is the disease, one gene is the trait and usually silent.</text><text x="46" y="541" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Symptoms do not start before about 6 months, because fetal haemoglobin protects them until then.</text><text x="46" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Infection is the leading cause of death in young children — penicillin prophylaxis and every vaccine.</text><text x="46" y="583" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· NEVER cold to a sickle crisis: cold vasoconstricts and worsens the sickling. Warm compresses only.</text><text x="46" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· NEVER aspirin in either: it promotes acidosis in sickle cell, and it blocks platelets in haemophilia.</text><text x="46" y="625" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Pain in sickle cell is chronically under-treated. Opioids are appropriate, and asking for them is not drug-seeking.</text></svg>