<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Seizures</title><desc id="d">Focal and generalised seizure types, what you do during a seizure and what you never do, and the difference between a seizure and status epilepticus.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="560" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">SEIZURES — WHAT YOU DO IS MOSTLY WHAT YOU DO NOT DO</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Protect the head, time it, turn her on her side. Everything else waits until it stops.</text><rect x="24" y="92" width="852" height="152" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="152" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">THE TWO FAMILIES</text><path d="M96 190 q0 -40 44 -40 q44 0 44 40 q0 34 -44 34 q-44 0 -44 -34z" fill="#cbb6ff" fill-opacity=".22" stroke="#cbb6ff" stroke-opacity=".55" stroke-width="1.6"/><path d="M140 150 l0 74" stroke="#cbb6ff" stroke-opacity=".5" stroke-width="1.6"/><path d="M96 190 q0 -40 44 -40 l0 74 q-44 0 -44 -34z" fill="#ffc233" fill-opacity=".6"/><text x="140" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#ffc233" fill-opacity="1" text-anchor="middle">FOCAL</text><text x="140" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="middle">one area — aware or not</text><circle cx="214" cy="147.5" r="2.6" fill="#ffeec2"/><text x="224" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#eaecff"><tspan font-weight="800">Aware:</tspan><tspan> she can tell you about it afterwards.</tspan></text><circle cx="214" cy="165.5" r="2.6" fill="#ffeec2"/><text x="224" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#eaecff"><tspan font-weight="800">Impaired awareness:</tspan><tspan> staring, lip-smacking, picking at clothes.</tspan></text><circle cx="214" cy="183.5" r="2.6" fill="#ffeec2"/><text x="224" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#eaecff"><tspan font-weight="800">May spread</tspan><tspan> to become generalised.</tspan></text><path d="M516 190 q0 -40 44 -40 q44 0 44 40 q0 34 -44 34 q-44 0 -44 -34z" fill="#cbb6ff" fill-opacity=".22" stroke="#cbb6ff" stroke-opacity=".55" stroke-width="1.6"/><path d="M560 150 l0 74" stroke="#cbb6ff" stroke-opacity=".5" stroke-width="1.6"/><path d="M516 190 q0 -40 44 -40 q44 0 44 40 q0 34 -44 34 q-44 0 -44 -34z" fill="#ff3b6b" fill-opacity=".55"/><text x="560" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">GENERALISED</text><text x="560" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">both sides from the start</text><circle cx="636" cy="147.5" r="2.6" fill="#ffd9e2"/><text x="646" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#eaecff"><tspan font-weight="800">Tonic-clonic:</tspan><tspan> stiff, then jerks. Incontinent.</tspan></text><circle cx="636" cy="165.5" r="2.6" fill="#ffd9e2"/><text x="646" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#eaecff"><tspan font-weight="800">Absence:</tspan><tspan> blank stare, seconds long.</tspan></text><circle cx="636" cy="183.5" r="2.6" fill="#ffd9e2"/><text x="646" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#eaecff"><tspan font-weight="800">Atonic:</tspan><tspan> drops suddenly. Helmet.</tspan></text><rect x="24" y="260" width="420" height="158" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="260" width="5" height="158" rx="2.5" fill="#12b886"/><text x="44" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅ DURING — WHAT YOU DO</text><circle cx="46" cy="309.5" r="2.6" fill="#bff3e2"/><text x="56" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Stay with her</tspan><tspan> and time it from the first movement.</tspan></text><circle cx="46" cy="328.5" r="2.6" fill="#bff3e2"/><text x="56" y="333" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Protect the head;</tspan><tspan> move furniture, loosen tight clothing.</tspan></text><circle cx="46" cy="347.5" r="2.6" fill="#bff3e2"/><text x="56" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Turn her on her side</tspan><tspan> when the jerking stops.</tspan></text><circle cx="46" cy="366.5" r="2.6" fill="#bff3e2"/><text x="56" y="371" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Suction and oxygen</tspan><tspan> ready at the bedside.</tspan></text><circle cx="46" cy="385.5" r="2.6" fill="#bff3e2"/><text x="56" y="390" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Note what it looked like</tspan><tspan> — where it started, how long.</tspan></text><rect x="460" y="260" width="416" height="158" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="260" width="5" height="158" rx="2.5" fill="#ff3b6b"/><text x="480" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚫 NEVER</text><circle cx="482" cy="309.5" r="2.6" fill="#ffd9e2"/><text x="492" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Nothing in the mouth. She cannot swallow her tongue.</text><circle cx="482" cy="328.5" r="2.6" fill="#ffd9e2"/><text x="492" y="333" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Do not restrain her — you will break something.</text><circle cx="482" cy="347.5" r="2.6" fill="#ffd9e2"/><text x="492" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Do not move her unless she is somewhere dangerous.</text><circle cx="482" cy="366.5" r="2.6" fill="#ffd9e2"/><text x="492" y="371" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Do not leave her alone.</text><circle cx="482" cy="385.5" r="2.6" fill="#ffd9e2"/><text x="492" y="390" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Do not give anything by mouth until fully alert.</text><rect x="24" y="434" width="852" height="108" rx="14" fill="#ffc233" fill-opacity=".20" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="434" width="5" height="108" rx="2.5" fill="#ffc233"/><text x="44" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🚨 STATUS EPILEPTICUS — THE ONE THAT KILLS</text><text x="44" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.8" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">A seizure lasting more than 5 minutes, or seizures back to back without waking up in between.</text><circle cx="59" cy="516" r="13" fill="#ffc233"/><text x="59" y="521" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">1</text><text x="80" y="521" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Airway, oxygen</text><path d="M224 516 L242 516" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="269" cy="516" r="13" fill="#ffc233"/><text x="269" y="521" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">2</text><text x="290" y="521" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">IV lorazepam</text><path d="M434 516 L452 516" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="479" cy="516" r="13" fill="#ffc233"/><text x="479" y="521" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">3</text><text x="500" y="521" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Then phenytoin</text><path d="M644 516 L662 516" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="689" cy="516" r="13" fill="#ffc233"/><text x="689" y="521" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">4</text><text x="710" y="521" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Find the cause</text></svg>