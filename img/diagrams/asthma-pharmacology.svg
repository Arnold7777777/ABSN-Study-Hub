<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Asthma pharmacology</title><desc id="d">Cross-sections of a normal, constricted and inflamed bronchiole, then the rescue and controller drug classes with the order of use and the teaching points.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="640" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">ASTHMA — THE DRUGS, AND WHEN EACH ONE IS FOR</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Two problems in one airway: muscle that squeezes, and a lining that swells. Each gets its own drug.</text><rect x="24" y="92" width="852" height="190" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="190" rx="2.5" fill="#2f6bff"/><text x="42" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">WHAT IS ACTUALLY WRONG INSIDE THE AIRWAY</text><circle cx="160" cy="186" r="46" fill="none" stroke="#12b886" stroke-width="12" stroke-opacity=".85"/><circle cx="160" cy="186" r="44" fill="#ffb3c6" fill-opacity=".30"/><circle cx="160" cy="186" r="40" fill="#0b0718"/><text x="160" y="264" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">Normal</text><text x="160" y="283" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">Wide lumen, thin muscle</text><circle cx="450" cy="186" r="33" fill="none" stroke="#ffc233" stroke-width="26" stroke-opacity=".85"/><circle cx="450" cy="186" r="24" fill="#ffb3c6" fill-opacity=".30"/><circle cx="450" cy="186" r="20" fill="#0b0718"/><text x="450" y="258" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">Bronchospasm</text><text x="450" y="277" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">Muscle squeezes shut</text><circle cx="740" cy="186" r="25" fill="none" stroke="#ff3b6b" stroke-width="22" stroke-opacity=".85"/><circle cx="740" cy="186" r="18" fill="#ffb3c6" fill-opacity=".55"/><circle cx="740" cy="186" r="14" fill="#0b0718"/><path d="M726 186 a14 14 0 0 0 28 0 a14 14 0 0 1 -28 0z" fill="#d8e36a" fill-opacity=".85"/><circle cx="740" cy="186" r="7" fill="#d8e36a" fill-opacity=".55"/><text x="740" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">Inflamed + mucus</text><text x="740" y="267" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">Swollen lining, plugged</text><path d="M232 186 L396 186" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M500 186 L690 186" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="314" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#cfd4ff" fill-opacity="1" text-anchor="middle">trigger</text><text x="595" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#cfd4ff" fill-opacity="1" text-anchor="middle">hours later</text><rect x="24" y="298" width="418" height="208" rx="14" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="298" width="5" height="208" rx="2.5" fill="#ff3b6b"/><text x="44" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨 RESCUE — opens the muscle</text><text x="44" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Short-acting beta-2 agonist (SABA)</text><circle cx="46" cy="367.5" r="2.6" fill="#cfd4ff"/><text x="56" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#eaecff"><tspan font-weight="800">Albuterol</tspan><tspan> — the one she carries.</tspan></text><circle cx="46" cy="387.5" r="2.6" fill="#cfd4ff"/><text x="56" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#eaecff"><tspan font-weight="800">Works in minutes,</tspan><tspan> lasts 4 to 6 hours.</tspan></text><circle cx="46" cy="407.5" r="2.6" fill="#cfd4ff"/><text x="56" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#eaecff"><tspan font-weight="800">Side effects:</tspan><tspan> tachycardia, tremor, jitteriness.</tspan></text><circle cx="46" cy="427.5" r="2.6" fill="#cfd4ff"/><text x="56" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#eaecff"><tspan font-weight="800">Using it more than 2 days a week</tspan><tspan> = poor control.</tspan></text><circle cx="46" cy="447.5" r="2.6" fill="#cfd4ff"/><text x="56" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#eaecff"><tspan font-weight="800">Ipratropium</tspan><tspan> is added in a severe attack.</tspan></text><text x="44" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">It does nothing for the swelling.</text><rect x="458" y="298" width="418" height="208" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="458" y="298" width="5" height="208" rx="2.5" fill="#12b886"/><text x="478" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🛡️ CONTROLLER — calms the lining</text><text x="478" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#c8f5e6" fill-opacity="1" text-anchor="start">Inhaled corticosteroid (ICS), daily</text><circle cx="480" cy="367.5" r="2.6" fill="#cfd4ff"/><text x="490" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#eaecff"><tspan font-weight="800">Fluticasone, budesonide</tspan><tspan> — every day, attack or not.</tspan></text><circle cx="480" cy="387.5" r="2.6" fill="#cfd4ff"/><text x="490" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#eaecff"><tspan font-weight="800">Takes 1 to 2 weeks</tspan><tspan> to work. Not for an attack.</tspan></text><circle cx="480" cy="407.5" r="2.6" fill="#cfd4ff"/><text x="490" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#eaecff"><tspan font-weight="800">Rinse the mouth</tspan><tspan> after — stops thrush.</tspan></text><circle cx="480" cy="427.5" r="2.6" fill="#cfd4ff"/><text x="490" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#eaecff"><tspan font-weight="800">Montelukast</tspan><tspan> is an oral add-on, not a rescue.</tspan></text><circle cx="480" cy="447.5" r="2.6" fill="#cfd4ff"/><text x="490" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#eaecff"><tspan font-weight="800">Salmeterol (LABA)</tspan><tspan> never used alone.</tspan></text><text x="478" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Stopping it because she feels fine is the classic error.</text><rect x="24" y="522" width="852" height="96" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="522" width="5" height="96" rx="2.5" fill="#ffc233"/><text x="44" y="550" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ THE ORDER SHE MUST GET RIGHT</text><circle cx="59" cy="586" r="13" fill="#ffc233"/><text x="59" y="591" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">1</text><text x="79" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Bronchodilator first</text><text x="79" y="599" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">albuterol</text><path d="M232 586 L248 586" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="269" cy="586" r="13" fill="#ffc233"/><text x="269" y="591" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">2</text><text x="289" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Wait 5 minutes</text><text x="289" y="599" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">airways open</text><path d="M442 586 L458 586" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="479" cy="586" r="13" fill="#ffc233"/><text x="479" y="591" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">3</text><text x="499" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Then the steroid</text><text x="499" y="599" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">reaches deeper</text><path d="M652 586 L668 586" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="689" cy="586" r="13" fill="#ffc233"/><text x="689" y="591" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">4</text><text x="709" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Rinse the mouth</text><text x="709" y="599" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">prevents thrush</text></svg>