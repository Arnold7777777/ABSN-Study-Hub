<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1020" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto">
<title id="t">Caput succedaneum, cephalhematoma and subgaleal hemorrhage — why one crosses the sutures and one cannot</title>
<desc id="d">A newborn skull seen from above, showing the separate bones and the seams between them, called sutures. Then a cut through the scalp showing four layers: skin, loose tissue, the galea sheet, and the periosteum wrapped around each bone. Caput succedaneum collects in the loose tissue above the periosteum, so it spreads straight across a suture. A cephalhematoma collects under the periosteum, which is anchored at every suture, so the blood is fenced inside one bone and stops dead at the seam. A subgaleal hemorrhage sits under the galea, crosses everything, and is an emergency. Below, the three compared by timing, feel and risk.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5aebb4"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff8fa3"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffc233"/></marker>
</defs>
<style>
 text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
 .h1{font-weight:800;font-size:19px}
 .h2{font-weight:800;font-size:16px}
 .bd{font-size:15px}
 .sm{font-size:13.5px}
 .k{font-weight:800}
</style>
<rect width="920" height="1020" rx="22" fill="url(#bg)"/>

<!-- header -->
<rect x="20" y="18" width="880" height="72" rx="13" fill="rgba(47,107,255,.20)" stroke="#2f6bff" stroke-width="2"/>
<text x="42" y="46" class="h1" fill="#bcd0ff">Both are a lump on a newborn&#8217;s head.</text>
<text x="42" y="70" class="bd" fill="#e7e9ff">A <tspan class="k" fill="#ffc233">suture</tspan> is a seam between two skull bones. Whether the swelling can cross it tells you which layer it is in.</text>

<!-- ============ 1 : the seams ============ -->
<rect x="20" y="104" width="880" height="252" rx="16" fill="rgba(0,194,199,.12)" stroke="#00c2c7" stroke-width="2"/>
<text x="42" y="134" class="h2" fill="#7ff0f2">1 &#183; A NEWBORN SKULL IS SEPARATE PLATES</text>

<g transform="translate(160,248)">
 <ellipse cx="0" cy="0" rx="98" ry="112" fill="#f0c9b4" stroke="#b8846a" stroke-width="2.5"/>
 <path d="M-94 -40 L94 -40" stroke="#8a4a2f" stroke-width="5" stroke-linecap="round"/>
 <path d="M0 -40 L0 72" stroke="#8a4a2f" stroke-width="5" stroke-linecap="round"/>
 <path d="M-72 82 L0 72 L72 82" stroke="#8a4a2f" stroke-width="5" fill="none" stroke-linejoin="round"/>
 <path d="M0 -64 L20 -40 L0 -16 L-20 -40 z" fill="#ffc233" stroke="#7a5a08" stroke-width="2"/>
 <path d="M0 58 L14 78 L-14 78 z" fill="#12b886" stroke="#0a5c46" stroke-width="2"/>
 <text x="0" y="-88" class="sm k" fill="#3a2418" text-anchor="middle">FRONT</text>
</g>
<line x1="330" y1="176" x2="182" y2="204" stroke="#ffc233" stroke-width="2" marker-end="url(#ay)"/>
<text x="338" y="174" class="bd k" fill="#ffc233">anterior fontanel &#8212; the soft spot</text>
<line x1="330" y1="216" x2="200" y2="216" stroke="#ff8a3d" stroke-width="2" marker-end="url(#ay)"/>
<text x="338" y="221" class="bd" fill="#ffd9bd">the brown lines are <tspan class="k" fill="#ff8a3d">sutures</tspan> &#8212; seams, not bone</text>
<text x="338" y="266" class="bd" fill="#e7e9ff">The bones are <tspan class="k" fill="#ffc233">not fused yet</tspan>. That is what lets</text>
<text x="338" y="288" class="bd" fill="#e7e9ff">the head mold its way through the birth canal.</text>
<text x="338" y="322" class="bd k" fill="#5aebb4">Caput Crosses. Cephalhematoma is Contained.</text>

<!-- ============ 2 : the cross-section ============ -->
<rect x="20" y="370" width="880" height="336" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
<text x="42" y="400" class="h2" fill="#ffffff">2 &#183; CUT THROUGH THE SCALP AND LOOK</text>

<g transform="translate(0,430)">
 <!-- layer bands -->
 <rect x="180" y="34" width="440" height="24" fill="#f3cdb6" stroke="#b8846a" stroke-width="1.5"/>
 <text x="170" y="51" class="sm k" fill="#ffd0b8" text-anchor="end">skin</text>
 <rect x="180" y="58" width="440" height="36" fill="#fce3a8" stroke="#c9a94f" stroke-width="1.5"/>
 <text x="170" y="81" class="sm k" fill="#ffe9a8" text-anchor="end">loose tissue</text>
 <rect x="180" y="94" width="440" height="16" fill="#cbd3ee" stroke="#8b97c4" stroke-width="1.5"/>
 <text x="170" y="107" class="sm k" fill="#cfd8ff" text-anchor="end">galea sheet</text>
 <rect x="180" y="110" width="440" height="13" fill="#ff3b6b"/>
 <text x="170" y="121" class="sm k" fill="#ff8fa3" text-anchor="end">periosteum</text>
 <rect x="180" y="123" width="440" height="44" fill="#e9e4f7" stroke="#9d8fc4" stroke-width="1.5"/>
 <text x="170" y="150" class="sm k" fill="#ddd6f5" text-anchor="end">skull bone</text>

 <!-- the seam cuts the periosteum and the bone, not the layers above -->
 <rect x="392" y="110" width="10" height="57" fill="#0d0819"/>
 <path d="M397 108 L397 169" stroke="#ffc233" stroke-width="4" stroke-dasharray="6 5"/>
 <text x="397" y="190" class="sm k" fill="#ffc233" text-anchor="middle">THE SUTURE</text>

 <!-- SUBGALEAL : under the galea, spanning the whole width -->
 <path d="M189 94 Q397 64 611 94 Z" fill="#c02255" opacity=".95" stroke="#ff8fa3" stroke-width="1.5" stroke-dasharray="5 4"/>

 <!-- CEPHALHEMATOMA : under periosteum, flush against the seam, stops dead -->
 <path d="M240 123 Q318 90 392 123 L392 123 Z" fill="#ff3b6b" stroke="#ff8fa3" stroke-width="2"/>
 <path d="M240 123 Q318 90 392 123" fill="none" stroke="#ff3b6b" stroke-width="7" stroke-linecap="round"/>
 <path d="M392 92 L392 126" stroke="#ff8fa3" stroke-width="4"/>

 <!-- CAPUT : in the loose tissue, straddling the seam -->
 <path d="M297 94 Q397 52 501 94 Z" fill="#12b886" opacity=".92" stroke="#5aebb4" stroke-width="2"/>

 <!-- callouts, all in clear space -->
 <line x1="636" y1="-4" x2="500" y2="30" stroke="#5aebb4" stroke-width="2" marker-end="url(#ag)"/>
 <text x="648" y="-14" class="bd k" fill="#5aebb4">CAPUT succedaneum</text>
 <text x="648" y="6" class="sm" fill="#c7f0e2">above the periosteum, so</text>
 <text x="648" y="24" class="sm" fill="#c7f0e2">nothing fences it &#8212; it</text>
 <text x="648" y="42" class="sm k" fill="#5aebb4">crosses the seam</text>

 <line x1="250" y1="206" x2="300" y2="134" stroke="#ff8fa3" stroke-width="2" marker-end="url(#ar)"/>
 <text x="180" y="228" class="bd k" fill="#ff8fa3">CEPHALHEMATOMA</text>
 <text x="180" y="248" class="sm" fill="#ffd0dc">under the periosteum. It reaches</text>
 <text x="180" y="266" class="sm" fill="#ffd0dc">the seam and <tspan class="k">stops dead</tspan>.</text>

 <line x1="620" y1="206" x2="560" y2="98" stroke="#ff8fa3" stroke-width="2" marker-end="url(#ar)"/>
 <text x="560" y="228" class="bd k" fill="#ff8fa3">SUBGALEAL</text>
 <text x="560" y="248" class="sm" fill="#ffd0dc">under the galea sheet.</text>
 <text x="560" y="266" class="sm" fill="#ffd0dc">Crosses <tspan class="k">everything</tspan>.</text>
</g>

<!-- ============ 3 : the comparison ============ -->
<rect x="20" y="720" width="286" height="286" rx="14" fill="rgba(18,184,134,.20)" stroke="#12b886" stroke-width="2"/>
<text x="42" y="750" class="h2" fill="#5aebb4">CAPUT SUCCEDANEUM</text>
<text x="42" y="782" class="bd" fill="#e8ffef">Crosses sutures &#183; <tspan class="k">YES</tspan></text>
<text x="42" y="810" class="bd" fill="#e8ffef">Present <tspan class="k">at birth</tspan></text>
<text x="42" y="838" class="bd" fill="#e8ffef">Soft, pits when pressed</text>
<text x="42" y="866" class="bd" fill="#e8ffef">Gone in <tspan class="k">days</tspan></text>
<text x="42" y="906" class="bd k" fill="#c7f0e2">Jaundice risk: low</text>
<text x="42" y="934" class="sm" fill="#c7f0e2">Reassure the parents.</text>
<text x="42" y="956" class="sm" fill="#c7f0e2">Nothing needs doing.</text>

<rect x="317" y="720" width="286" height="286" rx="14" fill="rgba(255,59,107,.20)" stroke="#ff3b6b" stroke-width="2"/>
<text x="339" y="750" class="h2" fill="#ff8fa3">CEPHALHEMATOMA</text>
<text x="339" y="782" class="bd" fill="#ffd0dc">Crosses sutures &#183; <tspan class="k">NO</tspan></text>
<text x="339" y="810" class="bd" fill="#ffd0dc">Appears <tspan class="k">hours later</tspan></text>
<text x="339" y="838" class="bd" fill="#ffd0dc">Firm, sharp edge at the seam</text>
<text x="339" y="866" class="bd" fill="#ffd0dc">Gone in <tspan class="k">weeks</tspan></text>
<text x="339" y="906" class="bd k" fill="#ffc233">Jaundice risk: HIGHER</text>
<text x="339" y="934" class="sm" fill="#ffd0dc">Trapped blood breaks</text>
<text x="339" y="956" class="sm" fill="#ffd0dc">down into bilirubin.</text>

<rect x="614" y="720" width="286" height="286" rx="14" fill="rgba(192,34,85,.36)" stroke="#ff3b6b" stroke-width="3"/>
<text x="636" y="750" class="h2" fill="#ffffff">&#128680; SUBGALEAL</text>
<text x="636" y="776" class="h2" fill="#ffc233">THIS ONE IS AN EMERGENCY</text>
<text x="636" y="810" class="bd" fill="#ffd0dc">Crosses sutures &#183; <tspan class="k">YES</tspan></text>
<text x="636" y="838" class="bd" fill="#ffd0dc">Boggy, spreading, shifts</text>
<text x="636" y="866" class="bd" fill="#ffd0dc">Swelling behind the ears</text>
<text x="636" y="894" class="bd" fill="#ffd0dc">Rising pulse, falling BP</text>
<text x="636" y="934" class="bd k" fill="#ffc233">A newborn can lose most</text>
<text x="636" y="956" class="bd k" fill="#ffc233">of their blood in here.</text>
</svg>
