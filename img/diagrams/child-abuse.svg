<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Recognising child abuse</title><desc id="d">A child drawn twice: on one the areas children normally bruise are shaded - shins, knees, elbows, forehead, all the bony points on the front - and on the other the areas that raise concern are shaded: the torso, the ears, the neck, the buttocks and the inner thighs. Below, the patterns by category, what neglect looks like, and how to document it.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="740" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#c02255" fill-opacity=".22" stroke="#c02255" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#c02255"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#c02255">A HISTORY THAT DOES NOT FIT THE INJURY</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">That is the single most important indicator — that, and a history that changes between tellings.</text><rect x="24" y="96" width="470" height="356" rx="14" fill="#c02255" fill-opacity=".17" stroke="#c02255" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="356" rx="2.5" fill="#c02255"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">🩹  WHERE THE BRUISE IS MATTERS MOST</text><rect x="46" y="146" width="196" height="244" rx="12" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".72"/><text x="144" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">ORDINARY</text><circle cx="144" cy="210" r="18" fill="#ffd9c2" fill-opacity=".35" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="2"/><rect x="121" y="230" width="46" height="62" rx="14" fill="#ffd9c2" fill-opacity=".3" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="2"/><path d="M122 238 q-10 20 -14 44" fill="none" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="11" stroke-linecap="round"/><path d="M133 294 v40" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="13" stroke-linecap="round"/><path d="M166 238 q10 20 14 44" fill="none" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="11" stroke-linecap="round"/><path d="M155 294 v40" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="13" stroke-linecap="round"/><ellipse cx="144" cy="196" rx="12" ry="6" fill="#12b886" fill-opacity=".7"/><ellipse cx="133" cy="332" rx="7" ry="11" fill="#12b886" fill-opacity=".7"/><ellipse cx="155" cy="332" rx="7" ry="11" fill="#12b886" fill-opacity=".7"/><ellipse cx="112" cy="274" rx="7" ry="8" fill="#12b886" fill-opacity=".7"/><ellipse cx="176" cy="274" rx="7" ry="8" fill="#12b886" fill-opacity=".7"/><ellipse cx="133" cy="306" rx="8" ry="8" fill="#12b886" fill-opacity=".7"/><ellipse cx="155" cy="306" rx="8" ry="8" fill="#12b886" fill-opacity=".7"/><text x="144" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">forehead · shins · knees</text><text x="144" y="359" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">elbows — the bony points</text><text x="144" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">on the FRONT, where an</text><text x="144" y="385" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">active child falls</text><rect x="266" y="146" width="196" height="244" rx="12" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".72"/><text x="364" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">CONCERNING</text><circle cx="364" cy="210" r="18" fill="#ffd9c2" fill-opacity=".35" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="2"/><rect x="341" y="230" width="46" height="62" rx="14" fill="#ffd9c2" fill-opacity=".3" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="2"/><path d="M342 238 q-10 20 -14 44" fill="none" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="11" stroke-linecap="round"/><path d="M353 294 v40" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="13" stroke-linecap="round"/><path d="M386 238 q10 20 14 44" fill="none" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="11" stroke-linecap="round"/><path d="M375 294 v40" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="13" stroke-linecap="round"/><ellipse cx="364" cy="254" rx="22" ry="26" fill="#ff3b6b" fill-opacity=".7"/><ellipse cx="345" cy="208" rx="7" ry="9" fill="#ff3b6b" fill-opacity=".7"/><ellipse cx="383" cy="208" rx="7" ry="9" fill="#ff3b6b" fill-opacity=".7"/><ellipse cx="364" cy="226" rx="13" ry="6" fill="#ff3b6b" fill-opacity=".7"/><ellipse cx="353" cy="310" rx="7" ry="13" fill="#ff3b6b" fill-opacity=".7"/><ellipse cx="375" cy="310" rx="7" ry="13" fill="#ff3b6b" fill-opacity=".7"/><text x="364" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">TORSO · EARS · NECK</text><text x="364" y="359" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">buttocks · inner thighs</text><text x="364" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">any bruise on a baby who</text><text x="364" y="385" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">is not yet cruising</text><text x="46" y="422" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">The mnemonic is TEN-4: Torso, Ears, Neck in a child under 4 — or ANY</text><text x="46" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">bruise in a baby under 4 months. Those need explaining.</text><rect x="514" y="96" width="382" height="356" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="356" rx="2.5" fill="#ff3b6b"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">👀  BY CATEGORY</text><text x="532" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Bruising</text><text x="624" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">patterned marks — a belt, a hand,</text><text x="624" y="167" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">a cord, a buckle</text><text x="532" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Burns</text><text x="624" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">stocking or glove distribution;</text><text x="624" y="209" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">sharp waterline edges; cigarette-</text><text x="624" y="224" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">sized circles; symmetrical burns</text><text x="532" y="251" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Fractures</text><text x="624" y="251" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">spiral in a child not yet walking;</text><text x="624" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">several at different stages of</text><text x="624" y="281" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">healing; rib, femur or humerus</text><text x="624" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">in an infant</text><text x="532" y="323" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Head</text><text x="624" y="323" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">retinal hemorrhages; a subdural</text><text x="624" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">bleed with no adequate explanation</text><text x="532" y="365" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Behavior</text><text x="624" y="365" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">watchfulness, flinching, or NO</text><text x="624" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">distress at a painful procedure</text><rect x="24" y="470" width="452" height="244" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="470" width="5" height="244" rx="2.5" fill="#ffc233"/><text x="46" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🧠  NEGLECT LOOKS DIFFERENT</text><text x="46" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">More common than physical abuse, and easier to miss because</text><text x="46" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">there is nothing dramatic to see.</text><text x="46" y="570" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Failure to thrive; poor growth with no medical cause</text><text x="46" y="589" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Persistently dirty, unsuitable or missing clothing</text><text x="46" y="608" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Untreated dental decay or an obvious untreated condition</text><text x="46" y="627" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Repeatedly missed appointments and immunizations</text><text x="46" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Frequent hunger; hoarding or stealing food</text><text x="46" y="665" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Left unsupervised at an age where that is unsafe</text><text x="46" y="688" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><rect x="496" y="470" width="400" height="244" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="470" width="5" height="244" rx="2.5" fill="#12b886"/><text x="518" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">📝  SUSPICION IS ENOUGH</text><text x="518" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Nurses are mandatory reporters. You do not need</text><text x="518" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">proof, and finding it is not your job.</text><text x="518" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Document what you SAW: size, color, shape,</text><text x="518" y="592" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  exact location. Use a body map</text><text x="518" y="610" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Document what was SAID, in their own words,</text><text x="518" y="628" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  in quotation marks — child and carer separately</text><text x="518" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· No conclusions, no opinions, no accusations</text><text x="518" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Interview the child alone where you can, and</text><text x="518" y="682" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  never lead: "tell me about this" not "did he..."</text><text x="518" y="700" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Keep the child safe first. Report per policy</text></svg>