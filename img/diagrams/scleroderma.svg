<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 756" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Scleroderma and CREST</title><desc id="d">A hand drawn three times in the three colors of a Raynaud attack - white, then blue, then red as the blood comes back - and the CREST letters each with what they mean. Below, what you see system by system, the renal crisis that is an emergency, and the daily care.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="756" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">THE SKIN HARDENS, AND SO DOES EVERYTHING UNDER IT</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A sudden blood pressure spike in scleroderma is renal crisis until proven otherwise.</text><rect x="24" y="96" width="470" height="272" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="272" rx="2.5" fill="#2f6bff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🌡️  RAYNAUD — THE THREE COLORS, IN ORDER</text><rect x="87" y="224" width="46" height="42" rx="10" fill="#f2ece6"/><rect x="89" y="192" width="9" height="34" rx="4.5" fill="#f2ece6"/><rect x="101" y="192" width="9" height="34" rx="4.5" fill="#f2ece6"/><rect x="113" y="192" width="9" height="34" rx="4.5" fill="#f2ece6"/><rect x="125" y="192" width="9" height="34" rx="4.5" fill="#f2ece6"/><rect x="78" y="228" width="9" height="20" rx="4.5" fill="#f2ece6" transform="rotate(-35 78 228)"/><text x="110" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">WHITE</text><text x="110" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">the vessels clamp shut</text><path d="M162 236 L200 236" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="237" y="224" width="46" height="42" rx="10" fill="#6f86c9"/><rect x="239" y="192" width="9" height="34" rx="4.5" fill="#6f86c9"/><rect x="251" y="192" width="9" height="34" rx="4.5" fill="#6f86c9"/><rect x="263" y="192" width="9" height="34" rx="4.5" fill="#6f86c9"/><rect x="275" y="192" width="9" height="34" rx="4.5" fill="#6f86c9"/><rect x="228" y="228" width="9" height="20" rx="4.5" fill="#6f86c9" transform="rotate(-35 228 228)"/><text x="260" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">BLUE</text><text x="260" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">the tissue is starved</text><path d="M312 236 L350 236" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="387" y="224" width="46" height="42" rx="10" fill="#ff6b7f"/><rect x="389" y="192" width="9" height="34" rx="4.5" fill="#ff6b7f"/><rect x="401" y="192" width="9" height="34" rx="4.5" fill="#ff6b7f"/><rect x="413" y="192" width="9" height="34" rx="4.5" fill="#ff6b7f"/><rect x="425" y="192" width="9" height="34" rx="4.5" fill="#ff6b7f"/><rect x="378" y="228" width="9" height="20" rx="4.5" fill="#ff6b7f" transform="rotate(-35 378 228)"/><text x="410" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">RED</text><text x="410" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">blood floods back</text><text x="410" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">and it burns</text><text x="46" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Triggered by cold and by stress. Both are avoidable,</text><text x="46" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">and that is most of the daily management.</text><rect x="514" y="96" width="382" height="272" rx="14" fill="#ff8a3d" fill-opacity=".17" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="272" rx="2.5" fill="#ff8a3d"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">⭐  CREST</text><text x="534" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">C</text><text x="552" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffe1c2" fill-opacity="1" text-anchor="start">alcinosis</text><text x="552" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">calcium deposits under the skin</text><text x="534" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">R</text><text x="552" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffe1c2" fill-opacity="1" text-anchor="start">aynaud</text><text x="552" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">the three colors, with cold or stress</text><text x="534" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">E</text><text x="552" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffe1c2" fill-opacity="1" text-anchor="start">sophageal dysmotility</text><text x="552" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">severe reflux, food sticking</text><text x="534" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">S</text><text x="552" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffe1c2" fill-opacity="1" text-anchor="start">clerodactyly</text><text x="552" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">tight, shiny, claw-like fingers</text><text x="534" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">T</text><text x="552" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffe1c2" fill-opacity="1" text-anchor="start">elangiectasia</text><text x="552" y="324" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">small dilated vessels on the surface</text><rect x="24" y="386" width="470" height="262" rx="14" fill="#9d5cff" fill-opacity=".15" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="386" width="5" height="262" rx="2.5" fill="#9d5cff"/><text x="46" y="416" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">👀  SYSTEM BY SYSTEM</text><text x="46" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">Skin</text><text x="126" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">tight, shiny, hard; the wrinkles go; a mask-like</text><text x="126" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">face with a mouth that will not open far</text><text x="46" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">Hands</text><text x="126" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">puffy first, then sclerodactyly and contractures</text><text x="46" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">GI</text><text x="126" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">severe reflux, dysphagia, early satiety, constipation</text><text x="46" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">Lungs</text><text x="126" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">exertional dyspnoea and a dry cough — and this is</text><text x="126" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">the leading cause of death</text><text x="46" y="592" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">Kidney</text><text x="126" y="592" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">sudden severe hypertension: renal crisis</text><text x="46" y="622" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">The lungs are what actually kills — any new</text><text x="46" y="638" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">breathlessness gets investigated.</text><rect x="514" y="386" width="382" height="262" rx="14" fill="#ff3b6b" fill-opacity=".19" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="386" width="5" height="262" rx="2.5" fill="#ff3b6b"/><text x="532" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  RENAL CRISIS</text><text x="532" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Abrupt malignant hypertension with a rapidly</text><text x="532" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">rising creatinine. A true emergency.</text><text x="532" y="488" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Treated with ACE INHIBITORS — and a sudden</text><text x="532" y="506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">BP spike in scleroderma is renal crisis until</text><text x="532" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">proven otherwise. Report it now.</text><text x="532" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">DAILY CARE</text><text x="532" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Warm: gloves, layers, warm the car first</text><text x="532" y="592" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Stop smoking — nicotine constricts. Non-negotiable</text><text x="532" y="610" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Inspect fingertips daily for ulcers; report early</text><text x="532" y="628" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Small frequent meals; sit up 1–2 h after eating</text></svg>