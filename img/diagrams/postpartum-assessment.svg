<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 762" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Postpartum assessment: BUBBLE-HE and the descending fundus</title><desc id="d">An abdomen with the umbilicus marked and the fundus drawn where it should sit on each of the first five days, dropping about a fingerbreadth a day, with what a boggy, deviated or stalled fundus each mean. Beside it BUBBLE-HE letter by letter, and below the complications and the three mood states.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="762" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">THE FUNDUS DESCENDS ABOUT ONE FINGERBREADTH A DAY</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Firm, midline, and one centimetre lower each day. Anything else is telling you something.</text><rect x="24" y="96" width="396" height="464" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="464" rx="2.5" fill="#2f6bff"/><text x="42" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">WHERE IT SHOULD BE</text><ellipse cx="152" cy="332" rx="86" ry="112" fill="#ffd9c2" fill-opacity=".13" stroke="#ffd9c2" stroke-opacity=".4" stroke-width="2"/><circle cx="152" cy="272" r="5" fill="#c99b78"/><path d="M72 272 H232" stroke="#ffd9c2" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="5 5"/><text x="62" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e6d0bd" fill-opacity="1" text-anchor="end">umbilicus</text><ellipse cx="152" cy="272" rx="30" ry="9" fill="#12b886" fill-opacity=".55" stroke="#12b886" stroke-width="2"/><text x="204" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">birth  U</text><ellipse cx="152" cy="292" rx="30" ry="9" fill="#12b886" fill-opacity=".55" stroke="#12b886" stroke-width="2"/><text x="204" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">day 1  U−1</text><ellipse cx="152" cy="312" rx="30" ry="9" fill="#00c2c7" fill-opacity=".55" stroke="#00c2c7" stroke-width="2"/><text x="204" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">day 2  U−2</text><ellipse cx="152" cy="332" rx="30" ry="9" fill="#2f6bff" fill-opacity=".55" stroke="#2f6bff" stroke-width="2"/><text x="204" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">day 3  U−3</text><ellipse cx="152" cy="352" rx="30" ry="9" fill="#2f6bff" fill-opacity=".55" stroke="#2f6bff" stroke-width="2"/><text x="204" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">day 4  U−4</text><ellipse cx="152" cy="372" rx="30" ry="9" fill="#9d5cff" fill-opacity=".55" stroke="#9d5cff" stroke-width="2"/><text x="204" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">day 5  U−5</text><text x="42" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">By about day 10 it has gone back below the pubic bone</text><text x="42" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">and can no longer be felt at all.</text><rect x="436" y="96" width="460" height="176" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="436" y="96" width="5" height="176" rx="2.5" fill="#ff3b6b"/><text x="454" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🧠  WHEN IT IS NOT WHERE IT SHOULD BE</text><text x="460" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Boggy and soft</text><text x="460" y="169" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">→ massage → empty bladder → reassess</text><text x="460" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">High and pushed to the RIGHT</text><text x="460" y="201" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">→ a full bladder is displacing it</text><text x="460" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Not descending at all</text><text x="460" y="233" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">→ retained fragments, or infection</text><text x="454" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Support the lower segment with one hand while you massage</text><text x="454" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">with the other, or you can invert the uterus.</text><rect x="436" y="288" width="460" height="272" rx="14" fill="#9d5cff" fill-opacity=".14" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="436" y="288" width="5" height="272" rx="2.5" fill="#9d5cff"/><text x="454" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">⭐  BUBBLE-HE</text><text x="460" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">B</text><text x="472" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="start">reasts</text><text x="586" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">soft, filling, engorged; milk day 3–5</text><text x="460" y="369" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">U</text><text x="472" y="369" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="start">terus</text><text x="586" y="369" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">FIRM, midline, one cm lower a day</text><text x="460" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">B</text><text x="472" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="start">ladder</text><text x="586" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">voiding fully; first void within 6–8 h</text><text x="460" y="419" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">B</text><text x="472" y="419" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="start">owels</text><text x="586" y="419" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">sounds, flatus; a movement in 2–3 days</text><text x="460" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">L</text><text x="472" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="start">ochia</text><text x="586" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">rubra → serosa → alba; amount, clots, smell</text><text x="460" y="469" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">E</text><text x="472" y="469" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="start">pisiotomy</text><text x="586" y="469" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">REEDA — mild odema, edges together</text><text x="460" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">H</text><text x="472" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="start">omans / legs</text><text x="586" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">calf pain, warmth, swelling — DVT risk is up</text><text x="460" y="519" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">E</text><text x="472" y="519" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="start">motional</text><text x="586" y="519" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">mood, bonding, support at home</text><text x="454" y="550" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">REEDA = Redness · Edema · Ecchymosis · Discharge · Approximation</text><rect x="24" y="578" width="872" height="160" rx="14" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="578" width="5" height="160" rx="2.5" fill="#12b886"/><text x="46" y="608" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🧠  THREE DIFFERENT THINGS, AND THEY ARE NOT DEGREES OF EACH OTHER</text><rect x="46" y="624" width="276" height="100" rx="12" fill="#12b886" fill-opacity=".18" stroke="#12b886" stroke-opacity=".75"/><text x="60" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">BLUES</text><text x="60" y="662" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">day 3–5, gone by day 10</text><text x="60" y="682" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">tearful, up and down, but coping.</text><text x="60" y="704" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Reassure. It is common and it passes.</text><rect x="330" y="624" width="276" height="100" rx="12" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".75"/><text x="344" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">DEPRESSION</text><text x="344" y="662" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">any time in the first year</text><text x="344" y="682" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">persistent, cannot enjoy the baby,</text><text x="344" y="704" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Screen, refer, treat. It does not just pass.</text><rect x="614" y="624" width="276" height="100" rx="12" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".75"/><text x="628" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">PSYCHOSIS</text><text x="628" y="662" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">usually within 2 weeks</text><text x="628" y="682" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">hallucinations, delusions about the baby.</text><text x="628" y="704" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">EMERGENCY. Never alone with the baby.</text></svg>