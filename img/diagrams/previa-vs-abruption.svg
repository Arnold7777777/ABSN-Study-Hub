<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 712" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Placenta previa versus abruptio placentae</title><desc id="d">Two uteruses in cross-section. In previa the placenta lies across the cervix and bright red blood runs straight out, painlessly. In abruption the placenta has torn away from the upper wall, dark blood is trapped behind it and the uterus is rigid. Below, the point-by-point contrast and the vaginal examination that must never be done.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="712" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#c02255" fill-opacity=".22" stroke="#c02255" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#c02255"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#c02255">PLACENTA PREVIA  vs  ABRUPTIO PLACENTAE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Painless and bright, or agonising and board-like. They are opposites almost everywhere.</text><rect x="24" y="96" width="426" height="372" rx="14" fill="#ffc233" fill-opacity=".13" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="372" rx="2.5" fill="#ffc233"/><text x="237.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">🩸  PREVIA</text><text x="237.0" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="middle">painless · bright red · all of it visible</text><path d="M237 186 C321 200 307 342 237 358 C167 342 153 200 237 186 Z" fill="#f4b9c6" fill-opacity=".13" stroke="#ffc233" stroke-width="3.4"/><path d="M211 352 L263 352 L254 400 L220 400 Z" fill="#f4b9c6" fill-opacity=".10" stroke="#ffc233" stroke-width="3"/><path d="M237 354 V396" stroke="#150a1e" stroke-width="6" stroke-linecap="round"/><circle cx="237" cy="242" r="19" fill="#ffd9c2" fill-opacity=".45" stroke="#ffd9c2" stroke-opacity=".6" stroke-width="2"/><path d="M251 254 q22 20 2 40" fill="none" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"/><path d="M183 318 a78 86 0 0 0 108 0 q-54 26 -108 0 Z" fill="#c02255" fill-opacity=".95"/><text x="40" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Placenta lies ACROSS</text><text x="40" y="349" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">the cervix — it blocks</text><text x="40" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">the way out</text><circle cx="237" cy="412" r="6" fill="#ff2d55" fill-opacity=".95"/><circle cx="237" cy="430" r="5" fill="#ff2d55" fill-opacity=".95"/><text x="267.0" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Bleeds straight out.</text><text x="267.0" y="423" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Bright, and painless.</text><text x="237.0" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">Uterus stays SOFT and non-tender</text><rect x="470" y="96" width="426" height="372" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="470" y="96" width="5" height="372" rx="2.5" fill="#ff3b6b"/><text x="683.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">🚨  ABRUPTION</text><text x="683.0" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">agonising · dark red · often concealed</text><path d="M683 186 C767 200 753 342 683 358 C613 342 599 200 683 186 Z" fill="#f4b9c6" fill-opacity=".13" stroke="#ff3b6b" stroke-width="3.4"/><path d="M657 352 L709 352 L700 400 L666 400 Z" fill="#f4b9c6" fill-opacity=".10" stroke="#ff3b6b" stroke-width="3"/><path d="M683 354 V396" stroke="#150a1e" stroke-width="6" stroke-linecap="round"/><circle cx="683" cy="242" r="19" fill="#ffd9c2" fill-opacity=".45" stroke="#ffd9c2" stroke-opacity=".6" stroke-width="2"/><path d="M697 254 q22 20 2 40" fill="none" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"/><path d="M635 224 q48 -22 96 -4 q-46 22 -96 4 Z" fill="#c02255" fill-opacity=".95"/><path d="M637 220 q46 -26 92 -6 q-48 -12 -92 6 Z" fill="#6b0f28" fill-opacity=".97"/><text x="486" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffb3c4" fill-opacity="1" text-anchor="start">Torn OFF the wall.</text><text x="486" y="203" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">Dark blood fills</text><text x="486" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">the gap behind it</text><path d="M769 234 l11 -7 M769 242 l11 7" stroke="#ff3b6b" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".95"/><path d="M773 274 l11 -7 M773 282 l11 7" stroke="#ff3b6b" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".95"/><path d="M769 314 l11 -7 M769 322 l11 7" stroke="#ff3b6b" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".95"/><path d="M597 234 l-11 -7 M597 242 l-11 7" stroke="#ff3b6b" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".95"/><path d="M593 274 l-11 -7 M593 282 l-11 7" stroke="#ff3b6b" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".95"/><path d="M597 314 l-11 -7 M597 322 l-11 7" stroke="#ff3b6b" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".95"/><circle cx="683" cy="416" r="4" fill="#ff2d55" fill-opacity=".9"/><text x="717.0" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffb3c4" fill-opacity="1" text-anchor="start">Only a trickle shows.</text><text x="717.0" y="411" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">Trust the vital signs,</text><text x="717.0" y="426" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">not the pad count.</text><text x="683.0" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">Uterus RIGID, board-like, exquisitely tender</text><rect x="24" y="484" width="872" height="148" rx="14" fill="#2f6bff" fill-opacity=".13" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="484" width="5" height="148" rx="2.5" fill="#2f6bff"/><text x="44" y="507" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">THE CONTRAST</text><text x="172" y="507" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">PREVIA</text><text x="500" y="507" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ABRUPTION</text><text x="44" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Pain</text><text x="172" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">None at all</text><text x="500" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Constant, tearing</text><text x="44" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Uterus</text><text x="172" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Soft, relaxed, non-tender</text><text x="500" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Rigid, board-like, very tender</text><text x="44" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Blood</text><text x="172" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Bright red, all of it visible</text><text x="500" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Dark red, may be entirely hidden</text><text x="44" y="596" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Foetus</text><text x="172" y="596" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Usually fine at first</text><text x="500" y="596" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Distress early — late decelerations</text><text x="44" y="618" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Behind it</text><text x="172" y="618" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Prior C-section, previa, age &gt;35</text><text x="500" y="618" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Hypertension, trauma, cocaine, smoking</text><rect x="24" y="646" width="872" height="62" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="646" width="5" height="62" rx="2.5" fill="#ff3b6b"/><text x="46" y="672" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffe3ea" fill-opacity="1" text-anchor="start">⛔  NEVER do a vaginal or digital cervical exam when previa is suspected.</text><text x="46" y="693" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">The examining finger can tear the placenta. Ultrasound makes the diagnosis — safely, and definitively.</text></svg>