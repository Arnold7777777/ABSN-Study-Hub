<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Newborn jaundice</title><desc id="d">How jaundice spreads head to toe, the line between physiologic and pathologic, and how phototherapy is managed.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="540" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#ffc233" fill-opacity=".22" stroke="#ffc233" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ffc233"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ffc233">NEWBORN JAUNDICE — THE CLOCK IS THE DIAGNOSIS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Yellow in the first 24 hours is always pathologic. After that, when it started tells you what it is.</text><rect x="24" y="92" width="340" height="250" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="250" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">IT SPREADS HEAD TO TOE</text><circle cx="194" cy="166" r="30" fill="#e8c94a" fill-opacity=".85"/><path d="M160 204 q34 -16 68 0 l6 78 q2 18 -16 20 l-48 0 q-18 -2 -16 -20z" fill="#e8c94a" fill-opacity=".62"/><path d="M164 226 l-30 48 M224 226 l30 48" stroke="#e8c94a" stroke-opacity=".45" stroke-width="11" stroke-linecap="round"/><path d="M179 302 l-12 52 M209 302 l12 52" stroke="#e8c94a" stroke-opacity=".28" stroke-width="13" stroke-linecap="round"/><path d="M238 166 L292 166" stroke="#e8c94a" stroke-opacity=".8" stroke-width="1.3"/><text x="298" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#f4e2a0" fill-opacity="1" text-anchor="start">face  ~5</text><path d="M238 226 L292 226" stroke="#e8c94a" stroke-opacity=".8" stroke-width="1.3"/><text x="298" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#f4e2a0" fill-opacity="1" text-anchor="start">chest ~10</text><path d="M238 280 L292 280" stroke="#e8c94a" stroke-opacity=".8" stroke-width="1.3"/><text x="298" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#f4e2a0" fill-opacity="1" text-anchor="start">abdomen ~12</text><path d="M238 336 L292 336" stroke="#e8c94a" stroke-opacity=".8" stroke-width="1.3"/><text x="298" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#f4e2a0" fill-opacity="1" text-anchor="start">soles  &gt;15</text><text x="44" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Further down the body = higher level.</text><rect x="380" y="92" width="496" height="250" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="380" y="92" width="5" height="250" rx="2.5" fill="#ffc233"/><text x="400" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ PHYSIOLOGIC vs PATHOLOGIC</text><text x="568" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#12b886" fill-opacity="1" text-anchor="middle">Physiologic</text><text x="786" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">Pathologic</text><rect x="398" y="161" width="462" height="24" rx="8" fill="#ffffff" fill-opacity=".07"/><text x="406" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Starts</text><text x="568" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="middle">after 24 h</text><text x="786" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">in the first 24 h</text><rect x="398" y="191" width="462" height="24" rx="8" fill="#ffffff" fill-opacity=".03"/><text x="406" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Peaks</text><text x="568" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="middle">day 3 to 5</text><text x="786" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">rises fast, &gt;5 mg/dL a day</text><rect x="398" y="221" width="462" height="24" rx="8" fill="#ffffff" fill-opacity=".07"/><text x="406" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Gone by</text><text x="568" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="middle">day 7 to 10</text><text x="786" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">lasts past 2 weeks</text><rect x="398" y="251" width="462" height="24" rx="8" fill="#ffffff" fill-opacity=".03"/><text x="406" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Cause</text><text x="568" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="middle">immature liver</text><text x="786" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">ABO or Rh, sepsis, biliary</text><rect x="398" y="281" width="462" height="24" rx="8" fill="#ffffff" fill-opacity=".07"/><text x="406" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Bilirubin</text><text x="568" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="middle">unconjugated, mild</text><text x="786" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="middle">high, or conjugated</text><text x="400" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">Yellow on day one is never normal. That is the whole rule.</text><rect x="24" y="358" width="528" height="128" rx="14" fill="#9d5cff" fill-opacity=".20" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="358" width="5" height="128" rx="2.5" fill="#9d5cff"/><text x="44" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">💡 PHOTOTHERAPY — WHAT YOU ACTUALLY DO</text><circle cx="46" cy="407.5" r="2.6" fill="#e0ccff"/><text x="56" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Eye patches on,</tspan><tspan> nappy off — as much skin exposed as possible.</tspan></text><circle cx="46" cy="426.5" r="2.6" fill="#e0ccff"/><text x="56" y="431" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Turn her every 2 hours</tspan><tspan> so the light reaches all of her.</tspan></text><circle cx="46" cy="445.5" r="2.6" fill="#e0ccff"/><text x="56" y="450" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Extra fluids</tspan><tspan> — the light causes water loss and loose green stools.</tspan></text><circle cx="46" cy="464.5" r="2.6" fill="#e0ccff"/><text x="56" y="469" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">No lotions or oils</tspan><tspan> — they burn under the light.</tspan></text><rect x="568" y="358" width="308" height="128" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="568" y="358" width="5" height="128" rx="2.5" fill="#ff3b6b"/><text x="588" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨 KERNICTERUS</text><text x="588" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Bilirubin crossing into the brain.</text><circle cx="590" cy="425.5" r="2.6" fill="#ffd9e2"/><text x="600" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">High-pitched cry, arching back</text><circle cx="590" cy="444.5" r="2.6" fill="#ffd9e2"/><text x="600" y="449" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Poor feeding, then lethargy</text><circle cx="590" cy="463.5" r="2.6" fill="#ffd9e2"/><text x="600" y="468" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">The damage is permanent</text><rect x="24" y="502" width="852" height="26" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="502" width="5" height="26" rx="2.5" fill="#12b886"/><text x="44" y="521" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="start">✅ Feeding early and often is the best prevention — it moves bilirubin out in the stool.</text></svg>