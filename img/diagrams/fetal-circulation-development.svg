<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 648" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">The umbilical cord, the fetal shunts and the teratogen window</title><desc id="d">The umbilical cord in cross-section showing two arteries and one vein, with the vein coloured red because it is the one carrying oxygenated blood to the baby and the arteries blue - the opposite of adult circulation. Beside it the three shunts that route blood past the lungs and liver. Below, a timeline of pregnancy with weeks three to eight marked as the window when organs form and damage becomes permanent.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="648" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">THE CORD IS COLOURED BACKWARDS — AND THAT IS THE QUESTION</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">AVA: two Arteries, one Vein. The VEIN carries the oxygenated blood TO the baby.</text><rect x="24" y="96" width="396" height="310" rx="14" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="310" rx="2.5" fill="#ff3b6b"/><text x="222.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">THE CORD, CUT ACROSS</text><circle cx="174" cy="242" r="72" fill="#e9d7c6" fill-opacity=".20" stroke="#e9d7c6" stroke-opacity=".55" stroke-width="3"/><text x="174" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#e6d0bd" fill-opacity="1" text-anchor="middle">Wharton's jelly cushions them</text><circle cx="174" cy="218" r="26" fill="#ff4d6d" fill-opacity=".9"/><text x="174" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">VEIN</text><circle cx="144" cy="272" r="17" fill="#4d7dff" fill-opacity=".9"/><text x="144" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">art</text><circle cx="204" cy="272" r="17" fill="#4d7dff" fill-opacity=".9"/><text x="204" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">art</text><text x="262" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff4d6d" fill-opacity="1" text-anchor="start">ONE VEIN</text><text x="262" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">carries OXYGENATED</text><text x="262" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">blood TO the baby</text><text x="262" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#4d7dff" fill-opacity="1" text-anchor="start">TWO ARTERIES</text><text x="262" y="256" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">carry deoxygenated</text><text x="262" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">blood AWAY, back to</text><text x="262" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">the placenta</text><text x="42" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Exactly the opposite of adult circulation, which is why</text><text x="42" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">it is asked. A TWO-vessel cord is abnormal — look for</text><text x="42" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">kidney and other anomalies.</text><rect x="436" y="96" width="460" height="310" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="436" y="96" width="5" height="310" rx="2.5" fill="#2f6bff"/><text x="454" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🔀  THREE SHUNTS — LUNGS AND LIVER SKIPPED</text><rect x="454" y="158" width="424" height="56" rx="11" fill="#2f6bff" fill-opacity=".16" stroke="#2f6bff" stroke-opacity=".7"/><text x="468" y="179" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Ductus venosus</text><text x="468" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">umbilical vein → inferior vena cava</text><text x="686" y="179" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">past the LIVER</text><text x="686" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">becomes the ligamentum venosum</text><rect x="454" y="224" width="424" height="56" rx="11" fill="#2f6bff" fill-opacity=".16" stroke="#2f6bff" stroke-opacity=".7"/><text x="468" y="245" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Foramen ovale</text><text x="468" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">right atrium → left atrium</text><text x="686" y="245" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">past the LUNGS</text><text x="686" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">closes as left-sided pressure rises</text><rect x="454" y="290" width="424" height="56" rx="11" fill="#2f6bff" fill-opacity=".16" stroke="#2f6bff" stroke-opacity=".7"/><text x="468" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Ductus arteriosus</text><text x="468" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">pulmonary artery → aorta</text><text x="686" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">past the LUNGS again</text><text x="686" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">closes with the first breaths</text><text x="454" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">The lungs are full of fluid and the placenta is doing the oxygenating,</text><text x="454" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">so blood is routed round them. The first breaths reverse all of it.</text><rect x="24" y="424" width="872" height="200" rx="14" fill="#ffc233" fill-opacity=".16" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="424" width="5" height="200" rx="2.5" fill="#ffc233"/><text x="46" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⏰  WEEKS 3 TO 8 — WHEN DAMAGE BECOMES PERMANENT</text><rect x="60" y="492" width="800" height="30" rx="9" fill="#ffffff" fill-opacity=".07"/><rect x="60.0" y="492" width="40.0" height="30" rx="9" fill="#2f6bff" fill-opacity=".8"/><rect x="100.0" y="492" width="120.0" height="30" rx="9" fill="#ff3b6b" fill-opacity=".9"/><rect x="220.0" y="492" width="640.0" height="30" rx="9" fill="#12b886" fill-opacity=".55"/><text x="160.0" y="512" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">3–8 wk</text><text x="540.0" y="512" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#062a1e" fill-opacity="1" text-anchor="middle">WEEK 9 TO BIRTH · ORGANS GROW AND MATURE</text><text x="60.0" y="484" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">weeks 1–2: all-or-nothing</text><text x="206.0" y="484" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">WEEKS 3–8: ORGANS FORM — HIGHEST TERATOGEN RISK</text><path d="M130.0 524 v10" stroke="#ffeec2" stroke-width="2" stroke-linecap="round" stroke-opacity=".7"/><text x="130.0" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="middle">heart starts beating</text><path d="M180.0 524 v28" stroke="#ffeec2" stroke-width="2" stroke-linecap="round" stroke-opacity=".7"/><text x="180.0" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="middle">seen on ultrasound</text><path d="M420.0 524 v10" stroke="#ffeec2" stroke-width="2" stroke-linecap="round" stroke-opacity=".7"/><text x="420.0" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="middle">quickening</text><path d="M540.0 524 v28" stroke="#ffeec2" stroke-width="2" stroke-linecap="round" stroke-opacity=".7"/><text x="540.0" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="middle">viability</text><path d="M760.0 524 v10" stroke="#ffeec2" stroke-width="2" stroke-linecap="round" stroke-opacity=".7"/><text x="760.0" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="middle">surfactant adequate</text><text x="46" y="606" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Weeks 3 to 8 is usually before she knows she is pregnant. That is the whole argument for folic acid BEFORE conception.</text></svg>