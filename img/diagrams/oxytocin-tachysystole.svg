 L412.5 173.7 L414.1 177.6 L415.8 183.7 L417.4 191.5 L419.0 200.8 L420.6 211.0 L422.2 221.7 L423.9 232.2 L425.5 241.7 L427.1 249.4 L428.8 252.0 L430.4 252.0 L432.0 252.0" fill="none" stroke="#12b886" stroke-width="2.6" stroke-linejoin="round"/><text x="46" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#9aa3d8" fill-opacity="1" text-anchor="start">10 minutes</text><text x="42" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">The green stretches are the rest — that is when blood</text><text x="42" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">refills the placenta and reaches the baby.</text><rect x="470" y="96" width="426" height="236" rx="14" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="470" y="96" width="5" height="236" rx="2.5" fill="#ff3b6b"/><text x="683.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">TACHYSYSTOLE</text><text x="683.0" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">too often, too long, no rest tone</text><rect x="488" y="162" width="390" height="96" rx="9" fill="#0b0716" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".16"/><rect x="488.0" y="164" width="3.2" height="92" fill="#12b886" fill-opacity=".26"/><rect x="533.5" y="164" width="11.4" height="92" fill="#12b886" fill-opacity=".26"/><rect x="588.8" y="164" width="11.4" height="92" fill="#12b886" fill-opacity=".26"/><rect x="644.0" y="164" width="9.8" height="92" fill="#12b886" fill-opacity=".26"/><rect x="697.6" y="164" width="11.4" height="92" fill="#12b886" fill-opacity=".26"/><rect x="752.9" y="164" width="11.4" height="92" fill="#12b886" fill-opacity=".26"/><rect x="806.5" y="164" width="11.4" height="92" fill="#12b886" fill-opacity=".26"/><rect x="861.8" y="164" width="11.4" height="92" fill="#12b886" fill-opacity=".26"/><path d="M488.0 252.0 L489.6 248.4 L491.2 242.7 L492.9 235.7 L494.5 228.1 L496.1 220.2 L497.8 212.2 L499.4 204.4 L501.0 197.1 L502.6 190.4 L504.2 184.5 L505.9 179.7 L507.5 175.9 L509.1 173.4 L510.8 172.1 L512.4 172.2 L514.0 173.6 L515.6 176.3 L517.2 180.1 L518.9 185.1 L520.5 191.1 L522.1 197.8 L523.8 205.2 L525.4 213.1 L527.0 221.0 L528.6 229.0 L530.2 236.5 L531.9 243.3 L533.5 248.9 L535.1 252.0 L536.8 252.0 L538.4 252.0 L540.0 252.0 L541.6 252.0 L543.2 251.0 L544.9 246.3 L546.5 240.0 L548.1 232.8 L549.8 225.0 L551.4 217.0 L553.0 209.1 L554.6 201.4 L556.2 194.3 L557.9 188.0 L559.5 182.5 L561.1 178.0 L562.8 174.8 L564.4 172.7 L566.0 172.0 L567.6 172.6 L569.2 174.5 L570.9 177.7 L572.5 182.0 L574.1 187.4 L575.8 193.7 L577.4 200.7 L579.0 208.3 L580.6 216.2 L582.2 224.2 L583.9 232.0 L585.5 239.3 L587.1 245.7 L588.8 250.7 L590.4 252.0 L592.0 252.0 L593.6 252.0 L595.2 252.0 L596.9 252.0 L598.5 249.4 L600.1 243.9 L601.8 237.2 L603.4 229.7 L605.0 221.8 L606.6 213.8 L608.2 206.0 L609.9 198.5 L611.5 191.7 L613.1 185.6 L614.8 180.6 L616.4 176.6 L618.0 173.8 L619.6 172.3 L621.2 172.1 L622.9 173.2 L624.5 175.6 L626.1 179.3 L627.8 184.0 L629.4 189.8 L631.0 196.4 L632.6 203.7 L634.2 211.5 L635.9 219.4 L637.5 227.4 L639.1 235.0 L640.8 242.0 L642.4 247.9 L644.0 251.9 L645.6 252.0 L647.2 252.0 L648.9 252.0 L650.5 252.0 L652.1 251.6 L653.8 247.4 L655.4 241.3 L657.0 234.3 L658.6 226.6 L660.2 218.6 L661.9 210.6 L663.5 202.9 L665.1 195.7 L666.8 189.2 L668.4 183.5 L670.0 178.8 L671.6 175.3 L673.2 173.0 L674.9 172.0 L676.5 172.4 L678.1 174.0 L679.8 176.9 L681.4 181.0 L683.0 186.2 L684.6 192.4 L686.2 199.3 L687.9 206.8 L689.5 214.6 L691.1 222.6 L692.8 230.5 L694.4 237.9 L696.0 244.6 L697.6 249.8 L699.2 252.0 L700.9 252.0 L702.5 252.0 L704.1 252.0 L705.8 252.0 L707.4 250.3 L709.0 245.1 L710.6 238.6 L712.2 231.2 L713.9 223.4 L715.5 215.4 L717.1 207.5 L718.8 200.0 L720.4 193.0 L722.0 186.8 L723.6 181.5 L725.2 177.3 L726.9 174.2 L728.5 172.5 L730.1 172.0 L731.8 172.9 L733.4 175.0 L735.0 178.4 L736.6 183.0 L738.2 188.6 L739.9 195.0 L741.5 202.2 L743.1 209.9 L744.8 217.8 L746.4 225.8 L748.0 233.5 L749.6 240.7 L751.2 246.9 L752.9 251.3 L754.5 252.0 L756.1 252.0 L757.8 252.0 L759.4 252.0 L761.0 252.0 L762.6 248.4 L764.2 242.7 L765.9 235.7 L767.5 228.1 L769.1 220.2 L770.8 212.2 L772.4 204.4 L774.0 197.1 L775.6 190.4 L777.2 184.5 L778.9 179.7 L780.5 175.9 L782.1 173.4 L783.8 172.1 L785.4 172.2 L787.0 173.6 L788.6 176.3 L790.2 180.1 L791.9 185.1 L793.5 191.1 L795.1 197.8 L796.8 205.2 L798.4 213.1 L800.0 221.0 L801.6 229.0 L803.2 236.5 L804.9 243.3 L806.5 248.9 L808.1 252.0 L809.8 252.0 L811.4 252.0 L813.0 252.0 L814.6 252.0 L816.2 251.0 L817.9 246.3 L819.5 240.0 L821.1 232.8 L822.8 225.0 L824.4 217.0 L826.0 209.1 L827.6 201.4 L829.2 194.3 L830.9 188.0 L832.5 182.5 L834.1 178.0 L835.8 174.8 L837.4 172.7 L839.0 172.0 L840.6 172.6 L842.2 174.5 L843.9 177.7 L845.5 182.0 L847.1 187.4 L848.8 193.7 L850.4 200.7 L852.0 208.3 L853.6 216.2 L855.2 224.2 L856.9 232.0 L858.5 239.3 L860.1 245.7 L861.8 250.7 L863.4 252.0 L865.0 252.0 L866.6 252.0 L868.2 252.0 L869.9 252.0 L871.5 249.4 L873.1 243.9 L874.8 237.2 L876.4 229.7 L878.0 221.8" fill="none" stroke="#ff3b6b" stroke-width="2.6" stroke-linejoin="round"/><text x="492" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#9aa3d8" fill-opacity="1" text-anchor="start">10 minutes</text><text x="488" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Almost no green left. The uterus never fully relaxes,</text><text x="488" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">so the placenta never refills. The baby runs out.</text><rect x="24" y="350" width="452" height="206" rx="14" fill="#ff3b6b" fill-opacity=".16" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="350" width="5" height="206" rx="2.5" fill="#ff3b6b"/><text x="46" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  STOP THE INFUSION IF</text><text x="46" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Contractions closer together than every 2 minutes</text><text x="46" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Any contraction lasting longer than 90 seconds</text><text x="46" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Resting tone does not return between them</text><text x="46" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Late decelerations, or any non-reassuring pattern</text><text x="46" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Suspected uterine rupture</text><text x="46" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Then: left side · oxygen 8–10 L · increase the maintenance IV ·</text><text x="46" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">notify the provider.</text><rect x="496" y="350" width="400" height="206" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="350" width="5" height="206" rx="2.5" fill="#2f6bff"/><text x="518" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">💉  WHY IT RUNS AS A SECONDARY LINE</text><text x="518" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Oxytocin is a high-alert medication.</text><text x="518" y="428" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">It always runs on a pump, piggybacked onto</text><text x="518" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">a maintenance line — so it can be stopped</text><text x="518" y="468" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">instantly without losing the IV access you</text><text x="518" y="488" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">are about to need.</text><text x="518" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">An unripe cervix is ripened first — inducing one</text><text x="518" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">that is not ready usually ends in cesarean.</text></svg>