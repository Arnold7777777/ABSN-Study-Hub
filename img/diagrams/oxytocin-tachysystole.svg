<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 584" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Oxytocin, tachysystole and cesarean care</title><desc id="d">Two contraction traces side by side. In the first the uterus relaxes fully between contractions and the shaded rest periods are when the placenta refills; in the second the contractions come too often and too long and there is almost no shaded rest left, which is how the baby is starved of oxygen. Below, when to stop the infusion and what follows a cesarean.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="584" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">THE UTERUS MUST RELAX TO PERFUSE THE PLACENTA</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Blood reaches the baby BETWEEN contractions, not during them. Take away the rest and you take away the oxygen.</text><rect x="24" y="96" width="426" height="236" rx="14" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="236" rx="2.5" fill="#12b886"/><text x="237.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">NORMAL</text><text x="237.0" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">contractions every 3 min, 60 s long</text><rect x="42" y="162" width="390" height="96" rx="9" fill="#0b0716" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".16"/><rect x="76.1" y="164" width="84.5" height="92" fill="#12b886" fill-opacity=".26"/><rect x="193.1" y="164" width="84.5" height="92" fill="#12b886" fill-opacity=".26"/><rect x="310.1" y="164" width="84.5" height="92" fill="#12b886" fill-opacity=".26"/><rect x="427.1" y="164" width="6.5" height="92" fill="#12b886" fill-opacity=".26"/><path d="M42.0 252.0 L43.6 246.6 L45.2 238.1 L46.9 228.0 L48.5 217.4 L50.1 206.8 L51.8 196.9 L53.4 188.2 L55.0 181.0 L56.6 175.8 L58.2 172.8 L59.9 172.0 L61.5 173.7 L63.1 177.6 L64.8 183.7 L66.4 191.5 L68.0 200.8 L69.6 211.0 L71.2 221.7 L72.9 232.2 L74.5 241.7 L76.1 249.4 L77.8 252.0 L79.4 252.0 L81.0 252.0 L82.6 252.0 L84.2 252.0 L85.9 252.0 L87.5 252.0 L89.1 252.0 L90.8 252.0 L92.4 252.0 L94.0 252.0 L95.6 252.0 L97.2 252.0 L98.9 252.0 L100.5 252.0 L102.1 252.0 L103.8 252.0 L105.4 252.0 L107.0 252.0 L108.6 252.0 L110.2 252.0 L111.9 252.0 L113.5 252.0 L115.1 252.0 L116.8 252.0 L118.4 252.0 L120.0 252.0 L121.6 252.0 L123.2 252.0 L124.9 252.0 L126.5 252.0 L128.1 252.0 L129.8 252.0 L131.4 252.0 L133.0 252.0 L134.6 252.0 L136.2 252.0 L137.9 252.0 L139.5 252.0 L141.1 252.0 L142.8 252.0 L144.4 252.0 L146.0 252.0 L147.6 252.0 L149.2 252.0 L150.9 252.0 L152.5 252.0 L154.1 252.0 L155.8 252.0 L157.4 252.0 L159.0 252.0 L160.6 246.6 L