<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Colonoscopy</title><desc id="d">The preparation and recovery set out on a timeline from three days before to the hours afterwards, with what is allowed at each point. Beside it the clear-liquid rule and why nothing red or purple is allowed. Below, what is normal afterwards and the perforation you watch for.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="610" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">THE QUESTIONS ARE ABOUT THE PREP AND THE HOURS AFTER</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Not about the procedure. And the one complication that matters is perforation.</text><rect x="24" y="96" width="872" height="218" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="218" rx="2.5" fill="#2f6bff"/><text x="46" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">⏱️  THE TIMELINE</text><rect x="46" y="158" width="132" height="96" rx="11" fill="#ffc233" fill-opacity=".20" stroke="#ffc233" stroke-opacity=".78"/><text x="58" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">3 days before</text><text x="58" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">stop iron; stop</text><text x="58" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">seeds, nuts, popcorn</text><path d="M180 206 L192 206" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="194" y="158" width="132" height="96" rx="11" fill="#ff8a3d" fill-opacity=".20" stroke="#ff8a3d" stroke-opacity=".78"/><text x="206" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">the day before</text><text x="206" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">CLEAR LIQUIDS only</text><text x="206" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">start the bowel prep</text><path d="M328 206 L340 206" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="342" y="158" width="132" height="96" rx="11" fill="#ff8a3d" fill-opacity=".20" stroke="#ff8a3d" stroke-opacity=".78"/><text x="354" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">the evening</text><text x="354" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">keep drinking it —</text><text x="354" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">the prep only works if</text><text x="354" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">it is finished</text><text x="354" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">until it runs clear</text><path d="M476 206 L488 206" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="490" y="158" width="132" height="96" rx="11" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".78"/><text x="502" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">the morning</text><text x="502" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">nothing by mouth</text><text x="502" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">usually from midnight</text><path d="M624 206 L636 206" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="638" y="158" width="132" height="96" rx="11" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".78"/><text x="650" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">afterwards</text><text x="650" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">left side; cramping</text><text x="650" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">and gas are NORMAL</text><text x="46" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">The prep is the part patients abandon. Warn her it will be unpleasant and that stopping halfway means</text><text x="46" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">doing the whole thing again — that is what gets it finished.</text><rect x="24" y="332" width="452" height="178" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="332" width="5" height="178" rx="2.5" fill="#ff3b6b"/><text x="46" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🍒  NOTHING RED OR PURPLE</text><text x="46" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">It stains the bowel wall and looks exactly like blood</text><text x="46" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">on the screen. So the answer to "which drink is</text><text x="46" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">not allowed" is always the red one.</text><text x="46" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">YES</text><text x="90" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">water · clear broth · apple juice · black tea</text><text x="46" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">NO</text><text x="90" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">red or purple anything · milk · anything opaque</text><text x="46" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Milk is not a clear liquid, however thin it looks.</text><rect x="496" y="332" width="400" height="178" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="332" width="5" height="178" rx="2.5" fill="#ffc233"/><text x="518" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🚨  PERFORATION — THE ONE THAT MATTERS</text><text x="518" y="390" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">NORMAL afterwards</text><text x="518" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">cramping, flatus, a little spotting; left side</text><text x="518" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">helps the air move</text><text x="518" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">REPORT AT ONCE</text><text x="518" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· severe or worsening abdominal pain</text><text x="518" y="487" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· a rigid or distended abdomen</text><text x="518" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· fever, or heavy rectal bleeding</text><text x="518" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><rect x="24" y="526" width="872" height="62" rx="14" fill="#12b886" fill-opacity=".17" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="526" width="5" height="62" rx="2.5" fill="#12b886"/><text x="46" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Screening starts at 45 and repeats every 10 years if it is normal.</text><text x="46" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">It is the only test that both finds AND removes polyps in one visit.</text></svg>