<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" role="img" aria-label="A spun tube of blood separated into its layers: plasma on top at fifty-five percent, a thin buffy coat of white cells and platelets, and packed red cells at forty-five percent. Beside it, what each formed element does, and the three vessel types."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="410" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">SPIN A TUBE OF BLOOD</text><rect x="40" y="52" width="134" height="232" rx="14" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.55)" stroke-width="2.5"/><rect x="44" y="56" width="126" height="121.60000000000001" rx="10" fill="#ffd76a"/><rect x="44" y="179.60000000000002" width="126" height="14" fill="#e9e2ff"/><rect x="44" y="195.60000000000002" width="126" height="84.4" rx="10" fill="#c9184a"/><text x="107.0" y="116" font-size="19" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">PLASMA</text><text x="107.0" y="138" font-size="19" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">55%</text><text x="107.0" y="232" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">RED CELLS</text><text x="107.0" y="254" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">45%</text><polyline points="164,186.60000000000002 226,186.60000000000002 226,342" fill="none" stroke="rgba(233,226,255,.75)" stroke-width="1.8"/><circle cx="164" cy="186.60000000000002" r="3.4" fill="rgba(233,226,255,.75)"/><text x="24" y="364" font-size="17" font-weight="800" fill="#e9e2ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">The sliver between them is the buffy coat — white cells and platelets</text><rect x="258" y="52" width="438" height="44" rx="9" fill="rgba(201,24,74,.72)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="270" y="72" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Erythrocytes — red cells</text><text x="270" y="90" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">No nucleus, biconcave, carries O&#8322;</text><rect x="258" y="104" width="438" height="44" rx="9" fill="rgba(0,194,199,.55)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="270" y="124" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Leukocytes — white cells</text><text x="270" y="142" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Defense — they leave the vessel</text><rect x="258" y="156" width="438" height="44" rx="9" fill="rgba(157,92,255,.62)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="270" y="176" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Thrombocytes — platelets</text><text x="270" y="194" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Fragments that plug holes and clot</text><text x="258" y="236" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THREE VESSELS</text><rect x="258" y="256" width="14" height="14" rx="7" fill="#ff3b6b"/><text x="280" y="268" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Arteries — away from the heart</text><rect x="258" y="296" width="14" height="14" rx="7" fill="#7ee8ff"/><text x="280" y="308" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Capillaries — one cell thick — exchange</text><rect x="258" y="336" width="14" height="14" rx="7" fill="#5b7cfa"/><text x="280" y="348" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Veins — back to the heart</text><text x="24" y="390" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Plasma is mostly water; the cells are what get counted on a CBC</text></svg>