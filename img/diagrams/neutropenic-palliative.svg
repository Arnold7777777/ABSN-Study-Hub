<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Neutropenic precautions and palliative care</title><desc id="d">The absolute neutrophil count drawn as a scale with the severe zone below 500 shaded, and beside it a nadir curve showing the count falling to its lowest point 7 to 10 days after a chemotherapy dose, which is the highest-risk window. Below, the precautions and the difference between hospice and palliative care.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="700" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">A SINGLE TEMPERATURE OF 38 °C IS AN EMERGENCY</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Below an ANC of 500 she cannot mount an inflammatory response — so pus, redness and swelling may simply not appear.</text><rect x="24" y="96" width="452" height="268" rx="14" fill="#ff3b6b" fill-opacity=".16" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="268" rx="2.5" fill="#ff3b6b"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🔢  THE NUMBER THAT CHANGES EVERYTHING</text><rect x="60" y="166" width="380" height="30" rx="15" fill="#0b0716" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".18"/><rect x="60.0" y="166" width="95.0" height="30" rx="15" fill="#ff3b6b" fill-opacity=".75"/><rect x="155.0" y="166" width="95.0" height="30" fill="#ffc233" fill-opacity=".55"/><rect x="345.0" y="166" width="95.0" height="30" rx="15" fill="#12b886" fill-opacity=".5"/><path d="M155.0 196 v10" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.8"/><text x="155.0" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">500</text><path d="M250.0 196 v10" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.8"/><text x="250.0" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">1000</text><path d="M345.0 196 v10" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.8"/><text x="345.0" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">1500</text><text x="107.5" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">SEVERE</text><text x="202.5" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">moderate</text><text x="392.5" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#062a1e" fill-opacity="1" text-anchor="middle">normal</text><text x="46" y="256" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Below 500 the usual signs of infection may be entirely absent —</text><text x="46" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">no pus, no redness, no swelling, because she cannot make them.</text><text x="46" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">So the ONLY sign left is a temperature. A single reading of</text><text x="46" y="324" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">38 °C means cultures and IV antibiotics within the hour.</text><text x="46" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Do not wait for a second reading, and do not give paracetamol first.</text><rect x="496" y="96" width="400" height="268" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="96" width="5" height="268" rx="2.5" fill="#ffc233"/><text x="514" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">📉  WHEN THE DANGER ARRIVES</text><rect x="536" y="148" width="320" height="130" rx="9" fill="#0b0716" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".16"/><path d="M536.0 168.4 L539.2 169.1 L542.4 169.9 L545.6 170.8 L548.8 171.7 L552.0 172.8 L555.2 174.0 L558.4 175.3 L561.6 176.7 L564.8 178.3 L568.0 180.0 L571.2 181.8 L574.4 183.8 L577.6 185.9 L580.8 188.2 L584.0 190.6 L587.2 193.1 L590.4 195.8 L593.6 198.6 L596.8 201.6 L600.0 204.6 L603.2 207.8 L606.4 211.0 L609.6 214.3 L612.8 217.6 L616.0 220.9 L619.2 224.3 L622.4 227.6 L625.6 230.9 L628.8 234.0 L632.0 237.1 L635.2 240.1 L638.4 242.9 L641.6 245.6 L644.8 248.0 L648.0 250.2 L651.2 252.2 L654.4 253.9 L657.6 255.3 L660.8 256.4 L664.0 257.2 L667.2 257.7 L670.4 257.8 L673.6 257.7 L676.8 257.2 L680.0 256.4 L683.2 255.3 L686.4 253.9 L689.6 252.2 L692.8 250.2 L696.0 248.0 L699.2 245.6 L702.4 242.9 L705.6 240.1 L708.8 237.1 L712.0 234.0 L715.2 230.9 L718.4 227.6 L721.6 224.3 L724.8 220.9 L728.0 217.6 L731.2 214.3 L734.4 211.0 L737.6 207.8 L740.8 204.6 L744.0 201.6 L747.2 198.6 L750.4 195.8 L753.6 193.1 L756.8 190.6 L760.0 188.2 L763.2 185.9 L766.4 183.8 L769.6 181.8 L772.8 180.0 L776.0 178.3 L779.2 176.7 L782.4 175.3 L785.6 174.0 L788.8 172.8 L792.0 171.7 L795.2 170.8 L798.4 169.9 L801.6 169.1 L804.8 168.4 L808.0 167.8 L811.2 167.3 L814.4 166.8 L817.6 166.4 L820.8 166.1 L824.0 165.7 L827.2 165.5 L830.4 165.2 L833.6 165.0 L836.8 164.9 L840.0 164.7 L843.2 164.6 L846.4 164.5 L849.6 164.4 L852.8 164.3 L856.0 164.3" fill="none" stroke="#ffc233" stroke-width="3" stroke-linejoin="round"/><rect x="625.6" y="150" width="89.6" height="126" fill="#ff3b6b" fill-opacity=".22"/><text x="670.4" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">NADIR</text><text x="540" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="start">chemo dose</text><text x="670.4" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">day 7–10</text><text x="856" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="end">recovery</text><text x="514" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">The lowest count comes 7 to 10 days AFTER the dose —</text><text x="514" y="332" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">not on the day of it. That is the window that matters,</text><text x="514" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">and it is usually at home.</text><rect x="24" y="382" width="452" height="274" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="382" width="5" height="274" rx="2.5" fill="#12b886"/><text x="46" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🛡️  THE PRECAUTIONS</text><text x="46" y="438" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">IN HOSPITAL</text><text x="46" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Hand hygiene — by a wide margin the most effective</text><text x="46" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Private room; positive pressure if available</text><text x="46" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· No fresh flowers, no standing water, no plants</text><text x="46" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· No raw fruit, raw vegetables, or undercooked food</text><text x="46" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· No rectal temperatures, suppositories or enemas</text><text x="46" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">AT HOME — teach it BEFORE the nadir</text><text x="46" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Take her temperature and know the number to call</text><text x="46" y="612" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Avoid crowds and anyone unwell</text><text x="46" y="630" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· No live vaccines, for her or her household</text><text x="46" y="648" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Wash produce; cook everything through</text><rect x="496" y="382" width="400" height="274" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="382" width="5" height="274" rx="2.5" fill="#2f6bff"/><text x="514" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🕊️  HOSPICE vs PALLIATIVE</text><text x="514" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">PALLIATIVE</text><text x="514" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">any stage, any prognosis, alongside</text><text x="514" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">treatment that is still trying to cure</text><text x="514" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">HOSPICE</text><text x="514" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">curative treatment has stopped;</text><text x="514" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">prognosis about six months or less</text><text x="514" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">All hospice is palliative. Not all palliative</text><text x="514" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">care is hospice.</text><text x="514" y="614" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Follow HER stated goal, not the one you</text><text x="514" y="632" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">would pick. She decides while she is able —</text><text x="514" y="650" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">not the family.</text></svg>