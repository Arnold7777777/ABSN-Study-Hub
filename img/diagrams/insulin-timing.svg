<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 722" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Insulin: onset, peak and duration</title><desc id="d">Four insulins drawn as bars along one 24-hour clock, each starting at its onset, bulging at its peak and ending at its duration - so the peaks can be compared at a glance. The peak is where hypoglycaemia happens. Below, the rules that never bend and what is taught before discharge.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="722" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">THE PEAK IS WHERE THE HYPOGLYCAEMIA IS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">If you know when an insulin peaks, you know when she has to eat and when you watch her.</text><rect x="24" y="96" width="872" height="322" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="322" rx="2.5" fill="#2f6bff"/><text x="46" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">⏱️  FOUR INSULINS ON ONE 24-HOUR CLOCK</text><path d="M210.0 158 V350" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.4"/><text x="210.0" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">0h</text><path d="M316.7 158 V350" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.4"/><text x="316.6666666666667" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">4h</text><path d="M423.3 158 V350" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.4"/><text x="423.33333333333337" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">8h</text><path d="M530.0 158 V350" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.4"/><text x="530.0" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">12h</text><path d="M636.7 158 V350" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.4"/><text x="636.6666666666667" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">16h</text><path d="M743.3 158 V350" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.4"/><text x="743.3333333333334" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">20h</text><path d="M850.0 158 V350" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.4"/><text x="850.0" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">24h</text><text x="46" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">RAPID</text><text x="46" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">lispro · aspart · glulisine</text><rect x="216.7" y="170" width="100.0" height="22" rx="11" fill="#ff3b6b" fill-opacity=".28" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="232.0" y="170" width="42.0" height="22" rx="11" fill="#ff3b6b" fill-opacity=".9"/><text x="253.0" y="185" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">PEAK</text><text x="210.66666666666666" y="185" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="end">on</text><text x="46" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">SHORT (regular)</text><text x="46" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">the only one that goes IV</text><rect x="230.0" y="216" width="153.3" height="22" rx="11" fill="#ffc233" fill-opacity=".28" stroke="#ffc233" stroke-opacity=".75"/><rect x="254.0" y="216" width="84.0" height="22" rx="11" fill="#ffc233" fill-opacity=".9"/><text x="296.0" y="231" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">PEAK</text><text x="224.0" y="231" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="end">on</text><text x="46" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">INTERMEDIATE</text><text x="46" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">NPH — the cloudy one</text><rect x="250.0" y="262" width="360.0" height="22" rx="11" fill="#ff8a3d" fill-opacity=".28" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="327.3" y="262" width="224.0" height="22" rx="11" fill="#ff8a3d" fill-opacity=".9"/><text x="439.33333333333326" y="277" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">PEAK</text><text x="244.0" y="277" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="end">on</text><text x="46" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">LONG</text><text x="46" y="332" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">glargine · detemir · degludec</text><rect x="250.0" y="308" width="600.0" height="22" rx="11" fill="#12b886" fill-opacity=".28" stroke="#12b886" stroke-opacity=".75"/><text x="476.6666666666667" y="323" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#062a1e" fill-opacity="1" text-anchor="middle">no pronounced peak</text><text x="244.0" y="323" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="end">on</text><text x="46" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Rapid peaks before the tray is cleared. NPH peaks while she is asleep — which is why</text><text x="46" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">3 a.m. hypoglycaemia keeps appearing in questions.</text><rect x="24" y="436" width="452" height="208" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="436" width="5" height="208" rx="2.5" fill="#ff3b6b"/><text x="46" y="468" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  THE RULES THAT NEVER BEND</text><text x="46" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Only REGULAR insulin goes IV</text><text x="60" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">never NPH, never a long-acting</text><text x="46" y="529" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Never mix a long-acting with anything</text><text x="60" y="543" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">glargine goes in its own syringe</text><text x="46" y="558" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× CLEAR before cloudy</text><text x="60" y="572" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">regular first, then NPH — "RN": Regular, NPH</text><text x="46" y="587" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Never shake NPH</text><text x="60" y="601" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">roll it between your palms</text><text x="46" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Rotate within one site</text><text x="60" y="630" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">not between sites — absorption differs</text><rect x="496" y="436" width="400" height="208" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="436" width="5" height="208" rx="2.5" fill="#12b886"/><text x="518" y="468" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🎓  BEFORE SHE GOES HOME</text><text x="518" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Return demonstration of the injection — watched,</text><text x="518" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  not asked about</text><text x="518" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· How to recognise a hypo, and the 15/15 rule</text><text x="518" y="558" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Fast sugar with her at all times, and in the car</text><text x="518" y="578" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Sick days: NEVER stop the insulin</text><text x="518" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Store the in-use pen at room temperature; spares</text><text x="518" y="618" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  in the fridge, and never in the freezer</text><text x="518" y="638" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Sharps disposal, and never share a pen</text></svg>