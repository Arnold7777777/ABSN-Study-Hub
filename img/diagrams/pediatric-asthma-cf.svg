<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Paediatric asthma and cystic fibrosis</title><desc id="d">An airway in cross-section, open and then narrowed by the three things asthma does at once - muscle spasm, a swollen wall and a mucus plug. Beside it a graph of how loud the wheeze is plotted against how hard the child is working, showing the wheeze fading to silence while the work keeps climbing, which is the silent chest. Below, rescue against controller inhalers, and cystic fibrosis system by system.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="620" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#00c2c7" fill-opacity=".22" stroke="#00c2c7" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#00c2c7"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#00c2c7">A SILENT CHEST IS NOT IMPROVEMENT</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Three things narrow the airway at once, and all three are reversible. That is what separates asthma from COPD.</text><rect x="24" y="96" width="452" height="300" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="300" rx="2.5" fill="#2f6bff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">💨  WHAT NARROWS IT — THREE THINGS AT ONCE</text><circle cx="140" cy="236" r="62" fill="none" stroke="#c8a898" stroke-width="9" stroke-opacity=".85"/><circle cx="140" cy="236" r="50" fill="#e9c9b6" fill-opacity=".30"/><circle cx="140" cy="236" r="42" fill="#0b0716" fill-opacity=".9"/><text x="140" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">OPEN</text><circle cx="340" cy="236" r="58" fill="none" stroke="#ff3b6b" stroke-width="17" stroke-opacity=".85"/><circle cx="340" cy="236" r="42" fill="#e9c9b6" fill-opacity=".55"/><circle cx="340" cy="236" r="20" fill="#0b0716" fill-opacity=".9"/><circle cx="333" cy="231" r="9" fill="#ffc233" fill-opacity=".92"/><circle cx="346" cy="239" r="8" fill="#ffc233" fill-opacity=".92"/><circle cx="338" cy="245" r="7" fill="#ffc233" fill-opacity=".92"/><text x="340" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">ASTHMA</text><path d="M224 236 L254 236" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="46" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">1  muscle spasm around it</text><text x="46" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">2  the wall swells inward</text><text x="46" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">3  mucus plugs the middle</text><text x="250" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c3d2ff" fill-opacity="1" text-anchor="start">All three reverse. That is</text><text x="250" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c3d2ff" fill-opacity="1" text-anchor="start">what makes it asthma.</text><rect x="496" y="96" width="400" height="300" rx="14" fill="#ff3b6b" fill-opacity=".16" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="96" width="5" height="300" rx="2.5" fill="#ff3b6b"/><text x="514" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  THE SILENT CHEST</text><rect x="530" y="146" width="328" height="132" rx="9" fill="#0b0716" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".16"/><path d="M530.0 270.0 L533.3 258.8 L536.6 251.8 L539.8 245.9 L543.1 240.5 L546.4 235.6 L549.7 231.0 L553.0 226.6 L556.2 222.5 L559.5 218.6 L562.8 214.9 L566.1 211.3 L569.4 207.9 L572.6 204.6 L575.9 201.4 L579.2 198.4 L582.5 195.5 L585.8 192.8 L589.0 190.2 L592.3 187.7 L595.6 185.3 L598.9 183.0 L602.2 180.8 L605.4 178.8 L608.7 176.9 L612.0 175.1 L615.3 173.4 L618.6 171.8 L621.8 170.4 L625.1 169.0 L628.4 167.8 L631.7 166.7 L635.0 165.7 L638.2 164.9 L641.5 164.1 L644.8 163.5 L648.1 162.9 L651.4 162.5 L654.6 162.2 L657.9 162.1 L661.2 162.0 L664.5 162.1 L667.8 162.2 L671.0 162.5 L674.3 162.9 L677.6 163.5 L680.9 164.1 L684.2 164.9 L687.4 165.7 L690.7 166.7 L694.0 167.8 L697.3 169.0 L700.6 170.4 L703.8 171.8 L707.1 173.4 L710.4 175.1 L713.7 176.9 L717.0 178.8 L720.2 180.8 L723.5 183.0 L726.8 185.3 L730.1 187.7 L733.4 190.2 L736.6 192.8 L739.9 195.5 L743.2 198.4 L746.5 201.4 L749.8 204.6 L753.0 207.9 L756.3 211.3 L759.6 214.9 L762.9 218.6 L766.2 222.5 L769.4 226.6 L772.7 231.0 L776.0 235.6 L779.3 240.5 L782.6 245.9 L785.8 251.8 L789.1 258.8 L792.4 237.6 L795.7 240.3 L799.0 243.0 L802.2 245.7 L805.5 248.4 L808.8 251.1 L812.1 253.8 L815.4 256.5 L818.6 259.2 L821.9 261.9 L825.2 264.6 L828.5 267.3 L831.8 270.0 L835.0 270.0 L838.3 270.0 L841.6 270.0 L844.9 270.0 L848.2 270.0 L851.4 270.0 L854.7 270.0 L858.0 270.0" fill="none" stroke="#ffc233" stroke-width="3" stroke-linejoin="round"/><path d="M530.0 253.8 L533.3 253.6 L536.6 253.2 L539.8 252.8 L543.1 252.4 L546.4 251.9 L549.7 251.4 L553.0 250.9 L556.2 250.4 L559.5 249.8 L562.8 249.2 L566.1 248.6 L569.4 248.0 L572.6 247.3 L575.9 246.7 L579.2 246.0 L582.5 245.3 L585.8 244.6 L589.0 243.9 L592.3 243.2 L595.6 242.5 L598.9 241.7 L602.2 241.0 L605.4 240.2 L608.7 239.4 L612.0 238.7 L615.3 237.9 L618.6 237.1 L621.8 236.3 L625.1 235.4 L628.4 234.6 L631.7 233.8 L635.0 232.9 L638.2 232.1 L641.5 231.2 L644.8 230.4 L648.1 229.5 L651.4 228.6 L654.6 227.7 L657.9 226.8 L661.2 225.9 L664.5 225.0 L667.8 224.1 L671.0 223.2 L674.3 222.2 L677.6 221.3 L680.9 220.3 L684.2 219.4 L687.4 218.4 L690.7 217.5 L694.0 216.5 L697.3 215.5 L700.6 214.6 L703.8 213.6 L707.1 212.6 L710.4 211.6 L713.7 210.6 L717.0 209.6 L720.2 208.6 L723.5 207.6 L726.8 206.5 L730.1 205.5 L733.4 204.5 L736.6 203.5 L739.9 202.4 L743.2 201.4 L746.5 200.3 L749.8 199.3 L753.0 198.2 L756.3 197.1 L759.6 196.1 L762.9 195.0 L766.2 193.9 L769.4 192.8 L772.7 191.7 L776.0 190.6 L779.3 189.5 L782.6 188.4 L785.8 187.3 L789.1 186.2 L792.4 185.1 L795.7 184.0 L799.0 182.9 L802.2 181.7 L805.5 180.6 L808.8 179.5 L812.1 178.3 L815.4 177.2 L818.6 176.1 L821.9 174.9 L825.2 173.8 L828.5 172.6 L831.8 171.4 L835.0 170.3 L838.3 169.1 L841.6 167.9 L844.9 166.7 L848.2 165.6 L851.4 164.4 L854.7 163.2 L858.0 162.0" fill="none" stroke="#ff3b6b" stroke-width="3" stroke-linejoin="round"/><rect x="799.0" y="148" width="59.0" height="128" fill="#ff3b6b" fill-opacity=".18"/><text x="828.48" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">SILENT</text><circle cx="536" cy="292" r="4.5" fill="#ffc233"/><text x="546" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">how loud the wheeze is</text><circle cx="694" cy="292" r="4.5" fill="#ff3b6b"/><text x="704" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">how hard she is working</text><text x="530" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="start">getting worse  →</text><text x="514" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">The wheeze needs moving air to make a sound. When almost</text><text x="514" y="354" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">no air is moving, the wheeze goes — and the work does not.</text><text x="514" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">A child who stops wheezing but works harder, drowsy</text><text x="514" y="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">or cyanosed is heading for arrest. Escalate now.</text><rect x="24" y="414" width="452" height="178" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="414" width="5" height="178" rx="2.5" fill="#12b886"/><text x="46" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅  DO NOT MIX THE TWO INHALERS UP</text><text x="46" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start"></text><text x="120" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">RESCUE</text><text x="280" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">CONTROLLER</text><text x="46" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Drug</text><text x="120" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">short-acting beta-2 —</text><text x="280" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">inhaled corticosteroid —</text><text x="46" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start"></text><text x="120" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">albuterol / salbutamol</text><text x="280" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">fluticasone, budesonide</text><text x="46" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">When</text><text x="120" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">during an attack</text><text x="280" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">every day, even when well</text><text x="46" y="550" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Speed</text><text x="120" y="550" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">works in minutes</text><text x="280" y="550" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">takes weeks; prevents attacks</text><text x="46" y="570" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Watch</text><text x="120" y="570" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">tachycardia, tremor</text><text x="280" y="570" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">rinse the mouth — thrush</text><text x="46" y="586" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Rescue first, then the steroid, and rinse afterwards.</text><rect x="496" y="414" width="400" height="178" rx="14" fill="#ff8a3d" fill-opacity=".17" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="414" width="5" height="178" rx="2.5" fill="#ff8a3d"/><text x="518" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">🧂  CYSTIC FIBROSIS — EVERYTHING THICKENS</text><text x="518" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Lungs</text><text x="586" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">thick mucus, infection after infection</text><text x="518" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Pancreas</text><text x="586" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">enzymes cannot get out → they do not absorb fat</text><text x="518" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Gut</text><text x="586" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">meconium ileus at birth; bulky, greasy, foul stools</text><text x="518" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Sweat</text><text x="586" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">salty skin — sweat chloride over 60 confirms it</text><text x="518" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Growth</text><text x="586" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">hungry, eating well, still not gaining</text><text x="518" y="586" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Enzymes with EVERY meal and snack. Chest physio daily.</text></svg>