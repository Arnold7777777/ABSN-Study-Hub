<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 738" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Central versus peripheral nervous system</title><desc id="d">A body with the brain and spinal cord picked out in one colour as the central nervous system and the nerves branching out from it in another as the peripheral. Beside it the same nerve cut twice: the peripheral one regrowing slowly along its sheath, the central one not regrowing at all. Below, the demyelinating pair - multiple sclerosis in the centre, Guillain-Barré in the periphery - and the two halves of the autonomic system.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="738" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">CENTRAL DOES NOT REGENERATE. PERIPHERAL DOES.</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">That one fact predicts more of neurology than any list — including which damage is permanent.</text><rect x="24" y="96" width="380" height="316" rx="14" fill="#9d5cff" fill-opacity=".14" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="316" rx="2.5" fill="#9d5cff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">THE TWO TERRITORIES</text><ellipse cx="150" cy="182" rx="30" ry="26" fill="#9d5cff" fill-opacity=".55" stroke="#9d5cff" stroke-width="2.5"/><path d="M150 206 V352" stroke="#9d5cff" stroke-width="13" stroke-linecap="round"/><text x="150" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">brain</text><text x="110" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="end">cord</text><path d="M150 222 q-22 4 -46 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 222 q22 4 46 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 242 q-22 4 -60 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 242 q22 4 60 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 262 q-22 4 -74 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 262 q22 4 74 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 282 q-22 4 -46 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 282 q22 4 46 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 302 q-22 4 -60 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 302 q22 4 60 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 322 q-22 4 -74 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 322 q22 4 74 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 342 q-22 4 -46 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><path d="M150 342 q22 4 46 16" fill="none" stroke="#00c2c7" stroke-width="4" stroke-linecap="round"/><text x="246" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">PERIPHERAL</text><text x="246" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#bff3f0" fill-opacity="1" text-anchor="start">nerves, ganglia</text><text x="46" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">CENTRAL: brain + cord. Skull, vertebrae, meninges and the</text><text x="46" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">blood–brain barrier protect it. Myelin from oligodendrocytes.</text><text x="46" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#bff3f0" fill-opacity="1" text-anchor="start">PERIPHERAL: little protection. Myelin from Schwann cells.</text><rect x="424" y="96" width="472" height="316" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="424" y="96" width="5" height="316" rx="2.5" fill="#2f6bff"/><text x="442" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">✂️  CUT ONE OF EACH AND WAIT</text><rect x="442" y="140" width="416" height="104" rx="12" fill="#00c2c7" fill-opacity=".15" stroke="#00c2c7" stroke-opacity=".7"/><text x="458" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">A PERIPHERAL NERVE</text><path d="M458 198 h96" stroke="#00c2c7" stroke-width="9" stroke-linecap="round"/><path d="M560 190 l12 -14 M572 190 l-12 14" stroke="#ff3b6b" stroke-width="3" stroke-linecap="round"/><path d="M580 198 h66" stroke="#00c2c7" stroke-width="9" stroke-linecap="round" stroke-dasharray="9 7" stroke-opacity=".8"/><path d="M584 220 L640 220" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="612" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="middle">regrows, slowly</text><text x="672" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Schwann cells lay down a</text><text x="672" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">track for the axon to follow.</text><rect x="442" y="260" width="416" height="104" rx="12" fill="#9d5cff" fill-opacity=".15" stroke="#9d5cff" stroke-opacity=".7"/><text x="458" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">THE SPINAL CORD</text><path d="M458 318 h96" stroke="#9d5cff" stroke-width="9" stroke-linecap="round"/><path d="M560 310 l12 -14 M572 310 l-12 14" stroke="#ff3b6b" stroke-width="3" stroke-linecap="round"/><path d="M580 318 h66" stroke="#5a5f7d" stroke-width="9" stroke-linecap="round" stroke-opacity=".55"/><text x="612" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#8e96c8" fill-opacity="1" text-anchor="middle">nothing happens</text><text x="672" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">No track, and scar tissue</text><text x="672" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">blocks the way. It is permanent.</text><text x="442" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A severed peripheral nerve may slowly recover. A spinal cord</text><text x="442" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">injury does not. That is the difference in one sentence.</text><rect x="24" y="430" width="452" height="262" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="430" width="5" height="262" rx="2.5" fill="#ff3b6b"/><text x="46" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🧠  BOTH ARE DEMYELINATION — WHERE IS THE DIFFERENCE</text><rect x="46" y="488" width="408" height="76" rx="11" fill="#9d5cff" fill-opacity=".16" stroke="#9d5cff" stroke-opacity=".7"/><text x="60" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">MULTIPLE SCLEROSIS</text><text x="60" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="start">CENTRAL</text><text x="140" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">relapses and remits, over years</text><text x="60" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">→ damage accumulates</text><rect x="46" y="576" width="408" height="76" rx="11" fill="#00c2c7" fill-opacity=".16" stroke="#00c2c7" stroke-opacity=".7"/><text x="60" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">GUILLAIN-BARRÉ</text><text x="60" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="start">PERIPHERAL</text><text x="140" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">ascends from the feet upward, fast</text><text x="60" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">→ usually recovers</text><text x="46" y="662" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">GBS ascending to the diaphragm is the emergency —</text><text x="46" y="680" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">watch the vital capacity, not the saturation.</text><rect x="496" y="430" width="400" height="262" rx="14" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="430" width="5" height="262" rx="2.5" fill="#12b886"/><text x="518" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">⚡  SPLITTING THE PERIPHERAL SIDE</text><text x="518" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">SOMATIC</text><text x="622" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">voluntary — skeletal muscle</text><text x="518" y="508" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">AUTONOMIC</text><text x="622" y="508" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">involuntary — organs, glands</text><text x="518" y="542" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">SYMPATHETIC</text><text x="660" y="542" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">PARASYMPATHETIC</text><text x="518" y="564" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· fight or flight</text><text x="660" y="564" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· rest and digest</text><text x="518" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· heart rate UP</text><text x="660" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· heart rate DOWN</text><text x="518" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· pupils DILATE</text><text x="660" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· pupils CONSTRICT</text><text x="518" y="624" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· gut slows</text><text x="660" y="624" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· gut speeds up</text><text x="518" y="644" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· bronchi OPEN</text><text x="660" y="644" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· bronchi narrow</text><text x="518" y="666" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Anticholinergics block the parasympathetic side,</text><text x="518" y="682" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">which is why they look sympathetic.</text></svg>