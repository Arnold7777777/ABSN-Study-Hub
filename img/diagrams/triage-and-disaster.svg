<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 800" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto">
<title id="t">Disaster triage — the four tags, and how everyday priorities invert</title>
<desc id="d">In a mass casualty the goal changes from doing everything for one person to doing the most good for the most people. Four tags: red is immediate, life threatening but survivable with quick treatment. Yellow is delayed, serious injuries that can wait a short while. Green is minimal, the walking wounded. Black is expectant, injuries so severe that survival is unlikely with the resources available. The person screaming is usually green, because they have an airway. Also START triage: can they walk, are they breathing, what is the respiratory rate, is the radial pulse present, can they follow commands.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient></defs>
<style>
 text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
 .h1{font-weight:800;font-size:19px}
 .h2{font-weight:800;font-size:16px}
 .bd{font-size:15px}
 .sm{font-size:13.5px}
 .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
 .k{font-weight:800}
</style>
<rect width="920" height="800" rx="22" fill="url(#bg)"/>
<rect x="20" y="18" width="880" height="104" rx="14" fill="rgba(255,59,107,.20)" stroke="#ff3b6b" stroke-width="2"/>
<text x="42" y="48" class="h1" fill="#ff8fa3">Everyday nursing inverts in a disaster</text>
<text x="42" y="78" class="bd" fill="#ffd0dc">Normally: <tspan class="k" fill="#ffc233">the sickest person is seen first.</tspan> That is the whole rule.</text>
<text x="42" y="106" class="bd" fill="#ffd0dc">In a mass casualty: <tspan class="k" fill="#ffc233">the most good for the most people.</tspan> The sickest may be tagged last.</text>

<g transform="translate(20,140)">
 <rect x="0" y="0" width="212" height="248" rx="14" fill="rgba(255,59,107,.30)" stroke="#ff3b6b" stroke-width="3"/>
 <rect x="18" y="18" width="80" height="30" rx="7" fill="#ff3b6b"/>
 <text x="58" y="39" class="h2" fill="#ffffff" text-anchor="middle">RED</text>
 <text x="18" y="76" class="h2" fill="#ff8fa3">Immediate</text>
 <text x="18" y="106" class="bd" fill="#ffd0dc">Will die without</text>
 <text x="18" y="128" class="bd" fill="#ffd0dc">care right now &#8212;</text>
 <text x="18" y="150" class="bd" fill="#ffd0dc">but <tspan class="k">can be saved</tspan>.</text>
 <text x="18" y="186" class="sm" fill="#ffd0dc">Airway blocked, tension</text>
 <text x="18" y="206" class="sm" fill="#ffd0dc">pneumothorax, bleeding</text>
 <text x="18" y="226" class="sm" fill="#ffd0dc">you can stop, shock.</text>

 <rect x="228" y="0" width="212" height="248" rx="14" fill="rgba(255,194,51,.26)" stroke="#ffc233" stroke-width="3"/>
 <rect x="246" y="18" width="96" height="30" rx="7" fill="#ffc233"/>
 <text x="294" y="39" class="h2" fill="#2a1f00" text-anchor="middle">YELLOW</text>
 <text x="246" y="76" class="h2" fill="#ffc233">Delayed</text>
 <text x="246" y="106" class="bd" fill="#ffeec2">Serious, but they</text>
 <text x="246" y="128" class="bd" fill="#ffeec2">can <tspan class="k">wait a while</tspan></text>
 <text x="246" y="150" class="bd" fill="#ffeec2">without dying.</text>
 <text x="246" y="186" class="sm" fill="#ffeec2">Closed fractures, big burns</text>
 <text x="246" y="206" class="sm" fill="#ffeec2">with a stable airway,</text>
 <text x="246" y="226" class="sm" fill="#ffeec2">abdominal injury, stable.</text>

 <rect x="456" y="0" width="212" height="248" rx="14" fill="rgba(18,184,134,.26)" stroke="#12b886" stroke-width="3"/>
 <rect x="474" y="18" width="90" height="30" rx="7" fill="#12b886"/>
 <text x="519" y="39" class="h2" fill="#04281c" text-anchor="middle">GREEN</text>
 <text x="474" y="76" class="h2" fill="#5aebb4">Minimal</text>
 <text x="474" y="106" class="bd" fill="#c7f0e2">The <tspan class="k">walking</tspan></text>
 <text x="474" y="128" class="bd" fill="#c7f0e2"><tspan class="k">wounded</tspan>. Minor</text>
 <text x="474" y="150" class="bd" fill="#c7f0e2">injuries only.</text>
 <text x="474" y="186" class="sm" fill="#c7f0e2">Sprains, small lacerations,</text>
 <text x="474" y="206" class="sm" fill="#c7f0e2">minor burns. Often the</text>
 <text x="474" y="226" class="sm" fill="#c7f0e2">loudest people there.</text>

 <rect x="684" y="0" width="196" height="248" rx="14" fill="rgba(60,60,70,.6)" stroke="#8a8a99" stroke-width="3"/>
 <rect x="702" y="18" width="86" height="30" rx="7" fill="#2a2a33" stroke="#8a8a99" stroke-width="1.5"/>
 <text x="745" y="39" class="h2" fill="#ffffff" text-anchor="middle">BLACK</text>
 <text x="702" y="76" class="h2" fill="#cfcfd8">Expectant</text>
 <text x="702" y="106" class="bd" fill="#dcdce4">Injuries so severe</text>
 <text x="702" y="128" class="bd" fill="#dcdce4">that survival is</text>
 <text x="702" y="150" class="bd" fill="#dcdce4">unlikely <tspan class="k">with what</tspan></text>
 <text x="702" y="172" class="bd" fill="#dcdce4"><tspan class="k">you have</tspan>.</text>
 <text x="702" y="206" class="sm" fill="#dcdce4">Comfort care, not</text>
 <text x="702" y="226" class="sm" fill="#dcdce4">abandonment.</text>
</g>

<rect x="20" y="404" width="530" height="252" rx="16" fill="rgba(0,194,199,.14)" stroke="#00c2c7" stroke-width="2"/>
<text x="42" y="434" class="h2" fill="#7ff0f2">START &#183; THE 30-SECOND SORT, IN ORDER</text>
<g transform="translate(42,450)">
 <text x="0" y="26" class="bd" fill="#e7e9ff"><tspan class="k" fill="#7ff0f2">1.</tspan> Can they <tspan class="k">walk</tspan>? &#8594; <tspan class="k" fill="#5aebb4">GREEN</tspan>. Send them to one place.</text>
 <text x="0" y="56" class="bd" fill="#e7e9ff"><tspan class="k" fill="#7ff0f2">2.</tspan> <tspan class="k">Breathing?</tspan> Not after you open the airway &#8594; <tspan class="k" fill="#cfcfd8">BLACK</tspan>.</text>
 <text x="0" y="86" class="bd" fill="#e7e9ff"><tspan class="k" fill="#7ff0f2">3.</tspan> Breaths over <tspan class="num k">30</tspan> a minute &#8594; <tspan class="k" fill="#ff8fa3">RED</tspan>.</text>
 <text x="0" y="116" class="bd" fill="#e7e9ff"><tspan class="k" fill="#7ff0f2">4.</tspan> No <tspan class="k">radial pulse</tspan>, or refill over 2 seconds &#8594; <tspan class="k" fill="#ff8fa3">RED</tspan>.</text>
 <text x="0" y="146" class="bd" fill="#e7e9ff"><tspan class="k" fill="#7ff0f2">5.</tspan> Cannot <tspan class="k">follow a simple command</tspan> &#8594; <tspan class="k" fill="#ff8fa3">RED</tspan>.</text>
 <text x="0" y="180" class="bd k" fill="#ffc233">Everyone left over is YELLOW.</text>
</g>

<rect x="566" y="404" width="334" height="252" rx="16" fill="rgba(157,92,255,.20)" stroke="#9d5cff" stroke-width="2"/>
<text x="588" y="434" class="h2" fill="#d3b8ff">THE TRAPS</text>
<text x="588" y="466" class="bd" fill="#e0d0ff">The person <tspan class="k" fill="#ffc233">screaming</tspan> is usually</text>
<text x="588" y="488" class="bd" fill="#e0d0ff">GREEN. Screaming needs an airway.</text>
<text x="588" y="524" class="bd" fill="#e0d0ff">The <tspan class="k" fill="#ffc233">silent</tspan> one is the emergency.</text>
<text x="588" y="560" class="bd" fill="#e0d0ff">Tags get <tspan class="k">re-checked</tspan>. A yellow can</text>
<text x="588" y="582" class="bd" fill="#e0d0ff">become a red in ten minutes.</text>
<text x="588" y="618" class="bd" fill="#e0d0ff">You do not stop to do CPR.</text>
<text x="588" y="640" class="sm" fill="#e0d0ff">One rescuer on one arrest = dozens untriaged.</text>

<rect x="20" y="672" width="880" height="112" rx="16" fill="rgba(255,194,51,.16)" stroke="#ffc233" stroke-width="2"/>
<text x="42" y="702" class="h2" fill="#ffc233">WHO GETS DISCHARGED TO MAKE ROOM</text>
<text x="42" y="732" class="bd" fill="#ffeec2">When the beds have to be emptied, the ones who go home are the <tspan class="k">most stable</tspan>, not the most improved.</text>
<text x="42" y="760" class="bd" fill="#ffeec2">Think: who could be cared for by family, at home, for 48 hours, without a nurse?</text>
</svg>
