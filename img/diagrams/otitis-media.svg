<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Otitis media and the growing eustachian tube</title><desc id="d">A toddler head and an adult head side by side, each with the eustachian tube drawn between the middle ear and the throat. In the toddler it is short, wide and almost level, so fluid from the nose runs into the ear; in the adult it is longer and slopes downward, so fluid drains away. Below, what the ear looks like at each age, and the rupture that feels like recovery.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="660" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">IT IS THE ANGLE OF THE TUBE, NOT THE CHILD</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A young eustachian tube is short, wide and almost horizontal — so fluid runs the wrong way.</text><rect x="24" y="96" width="430" height="268" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="268" rx="2.5" fill="#ff3b6b"/><text x="239.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">TODDLER</text><circle cx="134" cy="236" r="66" fill="#ffd9c2" fill-opacity=".16" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="2.5"/><circle cx="180" cy="222" r="13" fill="#ff3b6b" fill-opacity=".8"/><text x="200" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">middle ear</text><circle cx="94" cy="238" r="10" fill="#e9c9b6" fill-opacity=".55"/><text x="76" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="middle">throat</text><path d="M102 238 L168 220" stroke="#ff3b6b" stroke-width="13" stroke-linecap="round"/><path d="M110 222 L156 208" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="138" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">fluid runs IN</text><text x="44" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">short, wide, almost level</text><text x="44" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">so ear infections are constant</text><rect x="474" y="96" width="422" height="268" rx="14" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="96" width="5" height="268" rx="2.5" fill="#12b886"/><text x="685.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">SCHOOL AGE AND UP</text><circle cx="584" cy="236" r="66" fill="#ffd9c2" fill-opacity=".16" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="2.5"/><circle cx="630" cy="222" r="13" fill="#12b886" fill-opacity=".8"/><text x="650" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">middle ear</text><circle cx="544" cy="278" r="10" fill="#e9c9b6" fill-opacity=".55"/><text x="526" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="middle">throat</text><path d="M552 278 L618 220" stroke="#12b886" stroke-width="8" stroke-linecap="round"/><path d="M608 230 L564 288" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="614" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">drains AWAY</text><text x="494" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">longer, narrower, and it</text><text x="494" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">slopes downward</text><text x="494" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">so they largely stop by school age</text><rect x="24" y="382" width="872" height="140" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="382" width="5" height="140" rx="2.5" fill="#2f6bff"/><text x="46" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">WHAT YOU FIND</text><text x="230" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">IN AN INFANT</text><text x="620" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">IN AN OLDER CHILD</text><text x="46" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Pain</text><text x="230" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">pulls or rubs the ear, irritable, crying</text><text x="620" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">says the ear hurts</text><text x="46" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Feeding</text><text x="230" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">poor — sucking increases the pressure</text><text x="620" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">appetite reduced</text><text x="46" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Sleep</text><text x="230" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">worse lying flat</text><text x="620" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">worse at night</text><text x="46" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">The drum</text><text x="230" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">red, bulging, immobile; no light reflex</text><text x="620" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">the same</text><rect x="24" y="538" width="872" height="96" rx="14" fill="#ff3b6b" fill-opacity=".19" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="538" width="5" height="96" rx="2.5" fill="#ff3b6b"/><text x="46" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  SUDDEN PAIN RELIEF WITH NEW DRAINAGE IS NOT RECOVERY</text><text x="46" y="596" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">The drum has ruptured. The pressure is off, so it stops hurting — and that is exactly why it gets</text><text x="46" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">missed. Report it. Keep the ear dry, and no swimming until it is reviewed.</text></svg>