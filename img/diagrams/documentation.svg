<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 664" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Documentation and handover</title><desc id="d">A chart line with an error corrected the right way - a single line through it with initials and a date, the original still readable - beside the three wrong ways: scribbled out, covered with correction fluid, and erased. Below, the rules that generate the questions, what never goes in a chart, and SBAR.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="664" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">THE ORIGINAL MUST STAY READABLE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">One line through it, your initials, the date. Nothing is ever erased or covered over.</text><rect x="24" y="96" width="872" height="232" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="232" rx="2.5" fill="#2f6bff"/><text x="46" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">✏️  CORRECTING AN ERROR</text><rect x="46" y="154" width="196" height="88" rx="10" fill="#f4efe6" fill-opacity=".93"/><text x="58" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#2a2434" fill-opacity="1" text-anchor="start">0800  Lasix 40 mg PO</text><text x="58" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#2a2434" fill-opacity="1" text-anchor="start">0800  Lasix 20 mg PO</text><path d="M58 174 h122" stroke="#7a1f33" stroke-width="1.6"/><text x="186" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="800" fill="#7a1f33" fill-opacity="1" text-anchor="start">JS 3/4</text><rect x="46" y="154" width="196" height="88" rx="10" fill="none" stroke="#12b886" stroke-width="3" stroke-opacity=".9"/><text x="144" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">ONE LINE, INITIAL, DATE</text><rect x="266" y="154" width="196" height="88" rx="10" fill="#f4efe6" fill-opacity=".93"/><text x="278" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#2a2434" fill-opacity="1" text-anchor="start">0800  Lasix 40 mg PO</text><text x="278" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#2a2434" fill-opacity="1" text-anchor="start">0800  Lasix 20 mg PO</text><path d="M278 175 q10 -8 20 0" fill="none" stroke="#2a2434" stroke-width="2.4" stroke-opacity=".85"/><path d="M296 175 q10 -8 20 0" fill="none" stroke="#2a2434" stroke-width="2.4" stroke-opacity=".85"/><path d="M314 175 q10 -8 20 0" fill="none" stroke="#2a2434" stroke-width="2.4" stroke-opacity=".85"/><path d="M332 175 q10 -8 20 0" fill="none" stroke="#2a2434" stroke-width="2.4" stroke-opacity=".85"/><path d="M350 175 q10 -8 20 0" fill="none" stroke="#2a2434" stroke-width="2.4" stroke-opacity=".85"/><path d="M368 175 q10 -8 20 0" fill="none" stroke="#2a2434" stroke-width="2.4" stroke-opacity=".85"/><path d="M386 175 q10 -8 20 0" fill="none" stroke="#2a2434" stroke-width="2.4" stroke-opacity=".85"/><rect x="266" y="154" width="196" height="88" rx="10" fill="none" stroke="#ff3b6b" stroke-width="3" stroke-opacity=".9"/><text x="364" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">scribbled out</text><path d="M354 184 l20 20 M374 184 l-20 20" stroke="#ff3b6b" stroke-width="4" stroke-linecap="round"/><rect x="486" y="154" width="196" height="88" rx="10" fill="#f4efe6" fill-opacity=".93"/><text x="498" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#2a2434" fill-opacity="1" text-anchor="start">0800  Lasix 40 mg PO</text><text x="498" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#2a2434" fill-opacity="1" text-anchor="start">0800  Lasix 20 mg PO</text><rect x="496" y="168" width="128" height="12" rx="2" fill="#ffffff"/><rect x="486" y="154" width="196" height="88" rx="10" fill="none" stroke="#ff3b6b" stroke-width="3" stroke-opacity=".9"/><text x="584" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">correction fluid</text><path d="M574 184 l20 20 M594 184 l-20 20" stroke="#ff3b6b" stroke-width="4" stroke-linecap="round"/><rect x="706" y="154" width="196" height="88" rx="10" fill="#f4efe6" fill-opacity=".93"/><text x="718" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#2a2434" fill-opacity="1" text-anchor="start">0800  Lasix 40 mg PO</text><text x="718" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#2a2434" fill-opacity="1" text-anchor="start">0800  Lasix 20 mg PO</text><rect x="716" y="168" width="128" height="12" rx="2" fill="#f4efe6"/><path d="M716 174 h128" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="3 3"/><rect x="706" y="154" width="196" height="88" rx="10" fill="none" stroke="#ff3b6b" stroke-width="3" stroke-opacity=".9"/><text x="804" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">erased</text><path d="M794 184 l20 20 M814 184 l-20 20" stroke="#ff3b6b" stroke-width="4" stroke-linecap="round"/><text x="46" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Everything except the first one destroys the record — and looks like concealment afterwards.</text><rect x="24" y="346" width="452" height="232" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="346" width="5" height="232" rx="2.5" fill="#12b886"/><text x="46" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">📝  THE RULES THAT GENERATE THE QUESTIONS</text><text x="46" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Chart AFTER you act, never before. Charting a drug</text><text x="46" y="426" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  before giving it is falsification</text><text x="46" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Objective before subjective: what you measured and</text><text x="46" y="466" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  saw. Her words go in quotation marks</text><text x="46" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Only what YOU did or witnessed. Never chart for</text><text x="46" y="506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  someone else</text><text x="46" y="526" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Late entry is labelled "late entry", with both times</text><text x="46" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· No blank lines — draw a line through unused space</text><text x="46" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Sign every entry with name and credentials</text><rect x="496" y="346" width="400" height="232" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="346" width="5" height="232" rx="2.5" fill="#ff3b6b"/><text x="518" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  WHAT NEVER GOES IN A CHART</text><text x="518" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">× Opinions and judgements about her</text><text x="518" y="426" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">× Criticism of a colleague or the care given</text><text x="518" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">× Blame, or who was at fault</text><text x="518" y="466" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">× That an incident report was filed — the report</text><text x="518" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">  exists, but the chart never refers to it</text><text x="518" y="506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">× Anything you did not see yourself</text><text x="518" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">SBAR for the handover</text><text x="518" y="558" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Situation · Background · Assessment · Recommendation</text><text x="518" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">The Recommendation is the part people leave off.</text></svg>