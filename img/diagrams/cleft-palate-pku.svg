<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Cleft lip and palate, and newborn screening</title><desc id="d">A palate drawn intact and then with a cleft through it, showing the open route between mouth and nose that stops the baby making suction. Beside it how she is fed and positioned before repair. Below, PKU and what the newborn screen is looking for.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="700" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">SHE CANNOT MAKE SUCTION — THAT IS THE WHOLE FEEDING PROBLEM</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A cleft leaves the mouth open to the nose, so there is nothing to suck against.</text><rect x="24" y="96" width="470" height="272" rx="14" fill="#ff8a3d" fill-opacity=".16" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="272" rx="2.5" fill="#ff8a3d"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">👶  WHY THE SUCK DOES NOT WORK</text><rect x="46" y="146" width="196" height="150" rx="12" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".7"/><text x="144" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">INTACT</text><ellipse cx="144" cy="226" rx="52" ry="40" fill="#e9c9b6" fill-opacity=".4" stroke="#e9c9b6" stroke-opacity=".7" stroke-width="2.5"/><path d="M102 244 q42 -34 84 0" fill="none" stroke="#f4ece2" stroke-opacity=".7" stroke-width="7" stroke-linecap="round"/><text x="144" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">a closed roof to suck against</text><rect x="266" y="146" width="196" height="150" rx="12" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".7"/><text x="364" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">CLEFT PALATE</text><ellipse cx="364" cy="226" rx="52" ry="40" fill="#e9c9b6" fill-opacity=".4" stroke="#e9c9b6" stroke-opacity=".7" stroke-width="2.5"/><path d="M322 244 q42 -34 84 0" fill="none" stroke="#f4ece2" stroke-opacity=".7" stroke-width="7" stroke-linecap="round"/><path d="M364 196 v52" stroke="#0b0716" stroke-width="12" stroke-linecap="round"/><text x="364" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">open to the nose above</text><text x="46" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Air leaks out through the nose, so no negative pressure</text><text x="46" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">builds — and nothing comes out of the bottle.</text><rect x="514" y="96" width="382" height="272" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="272" rx="2.5" fill="#12b886"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🍼  FEEDING BEFORE REPAIR</text><text x="532" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">· A wide-based or squeezable bottle</text><text x="544" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">with a long soft teat</text><text x="532" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Hold her UPRIGHT, near sitting</text><text x="544" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">so milk does not go up the nose</text><text x="532" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Burp often</text><text x="544" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">she swallows a great deal of air</text><text x="532" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Finish in 20–30 minutes</text><text x="544" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">longer burns more than it delivers</text><text x="532" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Breastfeeding is often possible</text><text x="544" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">with a shield, and patience</text><text x="532" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Lip repaired at 2–3 months. Palate at 9–18 months,</text><text x="532" y="354" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">late enough for growth, early enough for speech.</text><rect x="24" y="386" width="470" height="300" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="386" width="5" height="300" rx="2.5" fill="#2f6bff"/><text x="46" y="416" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🩺  AFTER THE REPAIR</text><text x="46" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· NOTHING hard in the mouth: no straws, no spoons in the</text><text x="46" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">  mouth, no pacifiers, no suction catheters</text><text x="46" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Elbow immobilisers so she cannot reach the suture line</text><text x="46" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Position: after a LIP repair, on her back or side —</text><text x="46" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">  never prone. After a PALATE repair, prone is allowed</text><text x="46" y="558" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Clean the suture line after every feed</text><text x="46" y="580" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Feed with a cup or a wide soft teat, per the surgeon</text><text x="46" y="602" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Pain control matters — crying strains the repair</text><text x="46" y="624" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Recurrent ear infections are common: the tube does not</text><text x="46" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">  drain properly, so hearing is checked repeatedly</text><text x="46" y="682" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><rect x="514" y="386" width="382" height="300" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="386" width="5" height="300" rx="2.5" fill="#ffc233"/><text x="532" y="416" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🧪  NEWBORN SCREENING — PKU</text><text x="532" y="442" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">She cannot break phenylalanine down, so it builds up</text><text x="532" y="459" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">and damages the developing brain. Permanently.</text><text x="532" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">THE SCREEN</text><text x="532" y="506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Heel stick, AFTER 24 hours of protein feeding —</text><text x="532" y="523" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">  before that it can be falsely negative</text><text x="532" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Repeat if she was tested very early or was</text><text x="532" y="557" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">  transfused</text><text x="532" y="590" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">THE DIET</text><text x="532" y="610" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Low phenylalanine, for LIFE — not just childhood</text><text x="532" y="627" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· No high-protein foods: meat, dairy, eggs, nuts</text><text x="532" y="644" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· No aspartame — it is phenylalanine</text><text x="532" y="661" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Special formula supplies what she still needs</text><text x="532" y="678" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Back on strict control BEFORE any pregnancy</text></svg>