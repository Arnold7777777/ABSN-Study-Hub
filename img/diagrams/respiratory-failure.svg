<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Acute respiratory failure, type I versus type II</title><desc id="d">Two gauges. The first shows the oxygen coming in, with the arrow below sixty, which is type one failure. The second shows carbon dioxide going out, with the arrow above fifty and a falling pH, which is type two. Under each, what causes it and what it needs. Below, the earliest sign and the escalation rule.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="620" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">RESPIRATORY FAILURE IS A NUMBER, NOT A DISEASE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">The lungs do two jobs: get oxygen IN and get carbon dioxide OUT. Which one has failed decides what you do.</text><rect x="24" y="96" width="426" height="322" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="322" rx="2.5" fill="#ff3b6b"/><text x="237.0" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">TYPE I — OXYGENATION</text><text x="237.0" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">the problem is getting O₂ IN</text><rect x="87" y="192" width="300" height="22" rx="11" fill="#0b0716" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".18"/><rect x="87.0" y="192" width="112.5" height="22" rx="11" fill="#ff3b6b" fill-opacity=".55"/><path d="M199.5 184 v30" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3" stroke-opacity=".7"/><text x="199.5" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffffff" fill-opacity="1" text-anchor="middle">60</text><path d="M154.5 226 l-7 -12 h14 z" fill="#ff3b6b"/><text x="154.5" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">48 mmHg</text><text x="87.0" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="start">30</text><text x="387.0" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="end">110</text><text x="107.0" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="start">PaO₂</text><text x="46" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Blood is passing alveoli that are collapsed,</text><text x="46" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">flooded or blocked, so it picks up nothing.</text><text x="46" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">CAUSES</text><text x="46" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">pneumonia · ARDS · pulmonary oedema ·</text><text x="46" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">pulmonary embolism · atelectasis</text><text x="46" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Support the failing job: oxygen, PEEP,</text><text x="46" y="414" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">open the alveoli back up.</text><rect x="470" y="96" width="426" height="322" rx="14" fill="#ffc233" fill-opacity=".16" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="470" y="96" width="5" height="322" rx="2.5" fill="#ffc233"/><text x="683.0" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">TYPE II — VENTILATION</text><text x="683.0" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="middle">CO₂ will not come OUT</text><rect x="533" y="192" width="300" height="22" rx="11" fill="#0b0716" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".18"/><rect x="661.6" y="192" width="171.4" height="22" rx="11" fill="#ffc233" fill-opacity=".55"/><path d="M661.6 184 v30" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3" stroke-opacity=".7"/><text x="661.5714285714286" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffffff" fill-opacity="1" text-anchor="middle">50</text><path d="M721.6 226 l-7 -12 h14 z" fill="#ffc233"/><text x="721.5714285714286" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">64 mmHg</text><text x="533.0" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="start">20</text><text x="833.0" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="end">90</text><text x="553.0" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="start">PaCO₂</text><text x="683.0" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">with pH under 7.35</text><text x="492" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">She is simply not moving enough air.</text><text x="492" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">CAUSES</text><text x="492" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">COPD exacerbation · opioid overdose ·</text><text x="492" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Guillain-Barré · myasthenic crisis · trauma</text><text x="492" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Support the failing job: ventilate her.</text><text x="492" y="414" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">BiPAP, or intubation.</text><rect x="24" y="436" width="872" height="130" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="436" width="5" height="130" rx="2.5" fill="#12b886"/><text x="46" y="468" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">⭐  THE EARLIEST SIGN IS NOT THE SATURATION</text><text x="46" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">It is RESTLESSNESS and CONFUSION. A brain short of oxygen gets agitated before anything</text><text x="46" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">shows on a monitor — and the saturation probe is the last thing to tell you.</text><text x="46" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Many patients have both types at once. A COPD exacerbation is the classic mixed picture.</text></svg>