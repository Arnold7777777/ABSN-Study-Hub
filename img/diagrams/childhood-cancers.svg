<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Childhood cancers</title><desc id="d">An abdomen with a smooth one-sided mass marked as a Wilms tumour and a hand crossed out over it, because palpating it can spread the cancer. Beside it neuroblastoma, which crosses the midline. Below, leukaemia, the emergency temperature, and why allopurinol is given.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="700" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">DO NOT PALPATE THE ABDOMEN</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A Wilms tumour has a fragile capsule. Pressing on it can seed the cancer — a sign goes over the cot.</text><rect x="24" y="96" width="470" height="288" rx="14" fill="#ff3b6b" fill-opacity=".17" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="288" rx="2.5" fill="#ff3b6b"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  THE TWO ABDOMINAL MASSES</text><rect x="46" y="146" width="196" height="176" rx="12" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".7"/><text x="144" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">WILMS TUMOUR</text><ellipse cx="144" cy="238" rx="66" ry="48" fill="#ffd9c2" fill-opacity=".16" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2"/><path d="M144 200 v76" stroke="#ffd9c2" stroke-opacity=".35" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="116" cy="238" r="24" fill="#ff3b6b" fill-opacity=".85"/><text x="144" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">firm, smooth, ONE side</text><text x="144" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">does not cross</text><ellipse cx="116" cy="202" rx="22" ry="14" fill="#7ce0ff" fill-opacity=".45" stroke="#7ce0ff" stroke-opacity=".8" stroke-width="2"/><path d="M104 190 l24 24 M128 190 l-24 24" stroke="#ff3b6b" stroke-width="4.5" stroke-linecap="round"/><text x="144" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">nephroblastoma — the kidney</text><rect x="266" y="146" width="196" height="176" rx="12" fill="#ff8a3d" fill-opacity=".14" stroke="#ff8a3d" stroke-opacity=".7"/><text x="364" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">NEUROBLASTOMA</text><ellipse cx="364" cy="238" rx="66" ry="48" fill="#ffd9c2" fill-opacity=".16" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2"/><path d="M364 200 v76" stroke="#ffd9c2" stroke-opacity=".35" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M338 230 q22 -22 44 0 q16 22 -6 34 q-30 8 -46 -6 q-14 -18 8 -28 z" fill="#ff8a3d" fill-opacity=".85"/><text x="364" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">irregular, CROSSES</text><text x="364" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">the midline</text><text x="364" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">from sympathetic nerve tissue</text><text x="46" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Both are usually found by a parent on a nappy change or in the bath.</text><text x="46" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Sign over the cot: DO NOT PALPATE THE ABDOMEN.</text><rect x="514" y="96" width="382" height="288" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="288" rx="2.5" fill="#2f6bff"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🩸  ALL — THE COMMONEST OF ALL</text><text x="532" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Peaks at 2 to 5 years, and it has a HIGH cure rate —</text><text x="532" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">which is worth saying to parents early, and out loud.</text><text x="532" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">WHAT BRINGS THEM IN</text><text x="532" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· pallor and fatigue</text><text x="546" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">the marrow is crowded out</text><text x="532" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· bruising, petechiae, nosebleeds</text><text x="546" y="264" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">platelets are low</text><text x="532" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· infection after infection</text><text x="546" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">the white cells do not work</text><text x="532" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· bone pain, limping</text><text x="546" y="324" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">marrow expansion</text><text x="532" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· fever, big nodes, big spleen</text><text x="532" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A limping child with bruises and pallor is not clumsy.</text><rect x="24" y="402" width="470" height="262" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="402" width="5" height="262" rx="2.5" fill="#ff3b6b"/><text x="46" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  THE PRECAUTIONS THAT ARE ALWAYS ASKED</text><text x="46" y="464" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">A fever with an ANC under 500 is an EMERGENCY —</text><text x="46" y="482" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">cultures and IV antibiotics within the hour.</text><text x="46" y="512" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">× No rectal temperatures, suppositories or enemas —</text><text x="46" y="533" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">  the mucosa tears and it is a route straight in</text><text x="46" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">× No IM injections while the platelets are low</text><text x="46" y="575" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">× No aspirin, no NSAIDs — they block platelets</text><text x="46" y="596" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">× No live vaccines, for her or anyone at home</text><text x="46" y="617" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Soft toothbrush; electric razor; no contact sport</text><text x="46" y="638" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Hand hygiene, and keep unwell visitors away</text><rect x="514" y="402" width="382" height="262" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="402" width="5" height="262" rx="2.5" fill="#ffc233"/><text x="532" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">💊  WHY ALLOPURINOL</text><text x="532" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Chemotherapy kills cells in enormous numbers.</text><text x="532" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">They spill purines, which become URIC ACID,</text><text x="532" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">which crystallises in the kidneys.</text><text x="532" y="526" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Allopurinol plus generous hydration stops that</text><text x="532" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">happening. It is part of preventing tumour</text><text x="532" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">lysis syndrome.</text><text x="532" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">TUMOUR LYSIS LABS</text><text x="532" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">↑ potassium   ↑ phosphate   ↑ uric acid</text><text x="532" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">↓ calcium</text><text x="532" y="658" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">The high potassium is what stops the heart.</text></svg>