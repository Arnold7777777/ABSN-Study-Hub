<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Ostomy care</title><desc id="d">The bowel drawn as a loop with the stoma sites marked along it in order, and the output under each getting thicker as you move further along - liquid from the ileum, pasty from the transverse colon, formed from the sigmoid. Beside it the stoma colours, healthy pink through to the dusky ones you report at once. Below, the day-to-day care.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="690" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">THE FURTHER ALONG THE BOWEL, THE THICKER THE OUTPUT</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">That one sentence answers most ostomy questions. The other half is the colour of the stoma.</text><rect x="24" y="96" width="560" height="306" rx="14" fill="#ff8a3d" fill-opacity=".15" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="306" rx="2.5" fill="#ff8a3d"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">🔁  WHERE IT IS DECIDES WHAT COMES OUT</text><path d="M66 242 H542" stroke="#e9c9b6" stroke-opacity=".5" stroke-width="26" stroke-linecap="round"/><text x="66" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="start">SMALL BOWEL</text><text x="542" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="end">END OF THE COLON</text><path d="M66 194 L542 194" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="304.0" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">further along  →  more water reabsorbed</text><circle cx="85" cy="242" r="12" fill="#ff3b6b" fill-opacity=".95" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><text x="85.03999999999999" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">ILEOSTOMY</text><text x="85.03999999999999" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">ileum</text><circle cx="75" cy="276" r="4" fill="#ff3b6b" fill-opacity=".85"/><circle cx="85" cy="281" r="4" fill="#ff3b6b" fill-opacity=".85"/><circle cx="95" cy="276" r="4" fill="#ff3b6b" fill-opacity=".85"/><text x="85.03999999999999" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">LIQUID</text><circle cx="228" cy="242" r="12" fill="#ff8a3d" fill-opacity=".95" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><text x="227.84" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">ASCENDING</text><text x="227.84" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">colostomy</text><ellipse cx="228" cy="278" rx="18" ry="7" fill="#ff8a3d" fill-opacity=".8"/><text x="227.84" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">liquid</text><circle cx="361" cy="242" r="12" fill="#ffc233" fill-opacity=".95" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><text x="361.12" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">TRANSVERSE</text><text x="361.12" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">colostomy</text><ellipse cx="361" cy="278" rx="15" ry="10" fill="#ffc233" fill-opacity=".85"/><text x="361.12" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">pasty</text><circle cx="513" cy="242" r="12" fill="#12b886" fill-opacity=".95" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><text x="513.44" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">SIGMOID</text><text x="513.44" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">colostomy</text><rect x="500" y="271" width="26" height="15" rx="7" fill="#12b886" fill-opacity=".9"/><text x="513.44" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">formed</text><text x="46" y="332" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">Ileostomy: 500–1300 mL a day, continuous, enzyme-rich. Highest</text><text x="46" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">risk of dehydration, electrolyte loss and skin breakdown.</text><text x="46" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">A sigmoid colostomy can become predictable enough to need only</text><text x="46" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">a cap. An ileostomy never will.</text><rect x="604" y="96" width="292" height="306" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="604" y="96" width="5" height="306" rx="2.5" fill="#ff3b6b"/><text x="622" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🎨  THE COLOUR</text><circle cx="646" cy="168" r="18" fill="#ff6b8a"/><text x="674" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">PINK to BEEFY RED</text><text x="674" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">moist, a little swollen</text><text x="674" y="193" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">healthy</text><circle cx="646" cy="226" r="18" fill="#c98aa0"/><text x="674" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">PALE</text><text x="674" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">poor perfusion</text><text x="674" y="251" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">report</text><circle cx="646" cy="284" r="18" fill="#8a5a8a"/><text x="674" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">DUSKY or PURPLE</text><text x="674" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">blood supply failing</text><text x="674" y="309" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">report NOW</text><circle cx="646" cy="342" r="18" fill="#3a2a38"/><text x="674" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">BLACK</text><text x="674" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">necrosis</text><text x="674" y="367" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">emergency</text><text x="622" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A little bleeding when you clean it is normal.</text><rect x="24" y="420" width="872" height="244" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="420" width="5" height="244" rx="2.5" fill="#2f6bff"/><text x="46" y="450" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🩺  DAY TO DAY</text><text x="46" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">THE APPLIANCE</text><text x="46" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Cut the opening 2–3 mm larger than the stoma —</text><text x="46" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">no bigger, or the skin gets burned by output.</text><text x="46" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Empty at one-third to one-half full, or the weight</text><text x="46" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">breaks the seal.</text><text x="46" y="580" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Change every 3–7 days, and whenever it leaks.</text><text x="46" y="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Warm the wafer in your hands so it sticks.</text><text x="484" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">DIET AND TEACHING</text><text x="484" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Chew well. Add new foods one at a time.</text><text x="484" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Gas: beans, cabbage, fizzy drinks, chewing gum.</text><text x="484" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Odour: fish, eggs, garlic, onion. Yoghurt helps.</text><text x="484" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Blockage risk with an ileostomy: nuts, popcorn,</text><text x="484" y="580" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">celery, corn, dried fruit, skins.</text><text x="484" y="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Ileostomy — drink MORE, and salt is not the enemy.</text><text x="46" y="650" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Report: no output for 4–6 hours with cramping · a dusky stoma · output over 1000 mL a day · a stoma that pulls inward.</text></svg>