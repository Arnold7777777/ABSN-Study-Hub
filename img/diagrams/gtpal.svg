<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">GTPAL and the three levels of certainty in pregnancy</title><desc id="d">The worked example drawn out: four pregnancies laid side by side - the current one, a term daughter, a twin pregnancy that produced two living children from one birth, and a miscarriage - with lines showing which letter of GTPAL each one feeds. Below, the three levels of certainty, presumptive, probable and positive.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="690" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">GTPAL — COUNT PREGNANCIES, NOT BABIES</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Twins are ONE pregnancy and ONE birth, but TWO living children. That is the bit that catches people.</text><rect x="24" y="96" width="872" height="92" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="92" rx="2.5" fill="#2f6bff"/><rect x="46" y="114" width="164" height="60" rx="12" fill="#2f6bff" fill-opacity=".20" stroke="#2f6bff" stroke-opacity=".7"/><text x="60" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">G</text><text x="82" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="start">Gravida</text><text x="60" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">every pregnancy, this one too</text><rect x="216" y="114" width="164" height="60" rx="12" fill="#2f6bff" fill-opacity=".20" stroke="#2f6bff" stroke-opacity=".7"/><text x="230" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">T</text><text x="252" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="start">Term</text><text x="230" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">births at 37 weeks or more</text><rect x="386" y="114" width="164" height="60" rx="12" fill="#2f6bff" fill-opacity=".20" stroke="#2f6bff" stroke-opacity=".7"/><text x="400" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">P</text><text x="422" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="start">Preterm</text><text x="400" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">births from 20 to 36+6</text><rect x="556" y="114" width="164" height="60" rx="12" fill="#2f6bff" fill-opacity=".20" stroke="#2f6bff" stroke-opacity=".7"/><text x="570" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A</text><text x="592" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="start">Abortions</text><text x="570" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">any loss before 20 weeks</text><rect x="726" y="114" width="164" height="60" rx="12" fill="#2f6bff" fill-opacity=".20" stroke="#2f6bff" stroke-opacity=".7"/><text x="740" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">L</text><text x="762" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="start">Living</text><text x="740" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">children alive right now</text><rect x="24" y="204" width="872" height="300" rx="14" fill="#9d5cff" fill-opacity=".14" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="204" width="5" height="300" rx="2.5" fill="#9d5cff"/><text x="46" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">🧠  WORKED EXAMPLE — she is pregnant now, and has had:</text><rect x="42" y="264" width="176" height="120" rx="14" fill="#12b886" fill-opacity=".18" stroke="#12b886" stroke-opacity=".7"/><text x="130" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">This pregnancy</text><text x="130" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">ongoing</text><text x="130" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">G</text><rect x="248" y="264" width="176" height="120" rx="14" fill="#2f6bff" fill-opacity=".18" stroke="#2f6bff" stroke-opacity=".7"/><text x="336" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">A term daughter</text><text x="336" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">born at 39 weeks</text><circle cx="336" cy="330" r="14" fill="#ffd9c2" fill-opacity=".85" stroke="#ffd9c2" stroke-width="2"/><circle cx="332" cy="327" r="2" fill="#5b3a22"/><circle cx="340" cy="327" r="2" fill="#5b3a22"/><path d="M332 334 q4 4 8 0" fill="none" stroke="#5b3a22" stroke-width="1.6" stroke-linecap="round"/><text x="336" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">G · T · L</text><rect x="454" y="264" width="176" height="120" rx="14" fill="#ff8a3d" fill-opacity=".18" stroke="#ff8a3d" stroke-opacity=".7"/><text x="542" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">Twin boys</text><text x="542" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">ONE birth, at 34 weeks</text><circle cx="522" cy="330" r="14" fill="#ffd9c2" fill-opacity=".85" stroke="#ffd9c2" stroke-width="2"/><circle cx="518" cy="327" r="2" fill="#5b3a22"/><circle cx="526" cy="327" r="2" fill="#5b3a22"/><path d="M518 334 q4 4 8 0" fill="none" stroke="#5b3a22" stroke-width="1.6" stroke-linecap="round"/><circle cx="562" cy="330" r="14" fill="#ffd9c2" fill-opacity=".85" stroke="#ffd9c2" stroke-width="2"/><circle cx="558" cy="327" r="2" fill="#5b3a22"/><circle cx="566" cy="327" r="2" fill="#5b3a22"/><path d="M558 334 q4 4 8 0" fill="none" stroke="#5b3a22" stroke-width="1.6" stroke-linecap="round"/><text x="542" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">G · P · L L</text><rect x="660" y="264" width="176" height="120" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".7"/><text x="748" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">A miscarriage</text><text x="748" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">at 10 weeks</text><circle cx="748" cy="330" r="14" fill="#6a6f8f" fill-opacity=".45" stroke="#6a6f8f" stroke-width="2"/><text x="748" y="335" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#9aa0c0" fill-opacity="1" text-anchor="middle">×</text><text x="748" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">G · A</text><rect x="46" y="404" width="164" height="66" rx="12" fill="#ffc233" fill-opacity=".22" stroke="#ffc233" stroke-opacity=".8"/><text x="64" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">G</text><text x="90" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">4</text><text x="58" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">current+daughter+twins+loss</text><rect x="216" y="404" width="164" height="66" rx="12" fill="#ffc233" fill-opacity=".22" stroke="#ffc233" stroke-opacity=".8"/><text x="234" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">T</text><text x="260" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">1</text><text x="228" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">the daughter</text><rect x="386" y="404" width="164" height="66" rx="12" fill="#ffc233" fill-opacity=".22" stroke="#ffc233" stroke-opacity=".8"/><text x="404" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">P</text><text x="430" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">1</text><text x="398" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">the twin pregnancy — one birth</text><rect x="556" y="404" width="164" height="66" rx="12" fill="#ffc233" fill-opacity=".22" stroke="#ffc233" stroke-opacity=".8"/><text x="574" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A</text><text x="600" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">1</text><text x="568" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">the miscarriage</text><rect x="726" y="404" width="164" height="66" rx="12" fill="#ffc233" fill-opacity=".22" stroke="#ffc233" stroke-opacity=".8"/><text x="744" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">L</text><text x="770" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">3</text><text x="738" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">three children are alive</text><text x="46" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">P is 1, not 2: the twins were one preterm BIRTH. L is 3: three children are alive.</text><rect x="24" y="518" width="872" height="152" rx="14" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="518" width="5" height="152" rx="2.5" fill="#12b886"/><text x="46" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">👀  THREE LEVELS OF CERTAINTY</text><rect x="46" y="559" width="140" height="22" rx="8" fill="#ff3b6b" fill-opacity=".9"/><text x="116" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">PRESUMPTIVE</text><text x="196" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">what SHE feels</text><text x="376" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">amenorrhoea · nausea · fatigue · sore breasts · quickening</text><rect x="46" y="589" width="140" height="22" rx="8" fill="#ffc233" fill-opacity=".9"/><text x="116" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">PROBABLE</text><text x="196" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">what the EXAMINER finds</text><text x="376" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">a positive test · Goodell · Chadwick · Hegar · Braxton Hicks</text><rect x="46" y="619" width="140" height="22" rx="8" fill="#12b886" fill-opacity=".9"/><text x="116" y="634" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">POSITIVE</text><text x="196" y="634" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">from the FOETUS itself</text><text x="376" y="634" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">foetal heart tones · seen on ultrasound · you feel it move</text><text x="46" y="662" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A positive pregnancy test is only PROBABLE — hCG also rises with a molar pregnancy and some tumours.</text></svg>