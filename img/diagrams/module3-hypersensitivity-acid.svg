<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1226" role="img" aria-labelledby="title desc"><title id="title">Hypersensitivity I-IV: remember ACID</title><desc id="desc">Four panels comparing hypersensitivity types I to IV by mechanism, timing and classic examples, using the memory word ACID.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a6b7df"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif">
<rect width="1100" height="1226" rx="24" fill="#10152b"/>
<text x="36" y="39" font-size="16" fill="#aabfe8" font-weight="700">NUR 258  /  MODULE 3  /  VISUAL STUDY GUIDE</text>
<text x="36" y="88" font-size="36" fill="#fff" font-weight="800">Hypersensitivity I–IV: remember ACID</text>
<text x="36" y="125" font-size="21" fill="#c7d4ed">Identify the mechanism first. Timing is a clue, not a diagnosis.</text>
<rect x="36" y="164" width="504" height="428" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="70" y="256" font-size="72" font-weight="800" fill="#ffb8d4">A</text>
<text x="158" y="214" font-size="21" font-weight="800" fill="#ffb8d4">TYPE I</text>
<text x="158" y="250" font-size="27" font-weight="800" fill="#fff">ALLERGIC</text>
<text x="64" y="294" font-size="19" fill="#edf2ff">IgE activates mast cells; mediators</text>
<text x="64" y="320" font-size="19" fill="#edf2ff">such as histamine are released.</text>
<circle cx="82" cy="370" r="12" fill="#ffb8d4"/>
<text x="64" y="420" font-size="16" fill="#c7d4ed">allergen</text>
<line x1="102" y1="370" x2="148" y2="370" stroke="#a6b7df" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="160" y="352" width="96" height="44" rx="16" fill="#2a3157" stroke="#ffb8d4" stroke-width="2"/>
<path d="M208 352 l-9 -12 M208 352 l9 -12 M208 352 v-9" stroke="#ffb8d4" stroke-width="3" fill="none"/>
<text x="160" y="420" font-size="16" fill="#c7d4ed">IgE on mast cell</text>
<line x1="264" y1="370" x2="310" y2="370" stroke="#a6b7df" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="322" cy="370" r="6" fill="#ffb8d4"/>
<circle cx="344" cy="356" r="6" fill="#ffb8d4"/>
<circle cx="348" cy="386" r="6" fill="#ffb8d4"/>
<circle cx="370" cy="372" r="6" fill="#ffb8d4"/>
<text x="316" y="420" font-size="16" fill="#c7d4ed">mediators</text>
<text x="64" y="464" font-size="19" fill="#ffb8d4" font-weight="700">Timing</text>
<text x="64" y="490" font-size="19" fill="#edf2ff">Usually rapid after re-exposure; often minutes.</text>
<text x="64" y="524" font-size="19" fill="#ffb8d4" font-weight="700">Examples</text>
<text x="64" y="550" font-size="19" fill="#edf2ff">IgE-mediated anaphylaxis; allergic rhinitis.</text>
<rect x="560" y="164" width="504" height="428" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="594" y="256" font-size="72" font-weight="800" fill="#f3d38f">C</text>
<text x="682" y="214" font-size="21" font-weight="800" fill="#f3d38f">TYPE II</text>
<text x="682" y="250" font-size="27" font-weight="800" fill="#fff">CYTOTOXIC</text>
<text x="588" y="294" font-size="19" fill="#edf2ff">IgG or IgM targets antigens on</text>
<text x="588" y="320" font-size="19" fill="#edf2ff">cells or tissues.</text>
<circle cx="634" cy="370" r="24" fill="#3a2b3a" stroke="#f3d38f" stroke-width="3"/>
<path d="M610 370 L596 370 m-6 -6 l6 6 l6 -6" stroke="#f3d38f" stroke-width="3" fill="none"/>
<path d="M658 370 L672 370 m-6 -6 l6 6 l6 -6" stroke="#f3d38f" stroke-width="3" fill="none"/>
<path d="M634 394 L634 406 m-6 -6 l6 6 l6 -6" stroke="#f3d38f" stroke-width="3" fill="none"/>
<text x="600" y="420" font-size="16" fill="#c7d4ed">antibody on cell</text>
<line x1="692" y1="370" x2="738" y2="370" stroke="#a6b7df" stroke-width="3" marker-end="url(#arrow)"/>
<text x="750" y="364" font-size="18" fill="#edf2ff">cell destroyed, or</text>
<text x="750" y="388" font-size="18" fill="#edf2ff">function altered</text>
<text x="588" y="464" font-size="19" fill="#f3d38f" font-weight="700">Timing</text>
<text x="588" y="490" font-size="19" fill="#edf2ff">Variable; do not classify by time alone.</text>
<text x="588" y="524" font-size="19" fill="#f3d38f" font-weight="700">Examples</text>
<text x="588" y="550" font-size="19" fill="#edf2ff">Immune hemolytic transfusion reaction;</text>
<text x="588" y="576" font-size="19" fill="#edf2ff">autoimmune hemolytic anemia.</text>
<rect x="36" y="612" width="504" height="428" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="70" y="704" font-size="72" font-weight="800" fill="#c7b7ff">I</text>
<text x="158" y="662" font-size="21" font-weight="800" fill="#c7b7ff">TYPE III</text>
<text x="158" y="698" font-size="27" font-weight="800" fill="#fff">IMMUNE COMPLEX</text>
<text x="64" y="742" font-size="19" fill="#edf2ff">Antigen–antibody complexes deposit in</text>
<text x="64" y="768" font-size="19" fill="#edf2ff">tissues and trigger inflammation.</text>
<circle cx="78" cy="800" r="8" fill="#c7b7ff"/>
<circle cx="90" cy="806" r="8" fill="none" stroke="#c7b7ff" stroke-width="2"/>
<circle cx="106" cy="820" r="8" fill="#c7b7ff"/>
<circle cx="118" cy="826" r="8" fill="none" stroke="#c7b7ff" stroke-width="2"/>
<circle cx="82" cy="836" r="8" fill="#c7b7ff"/>
<circle cx="94" cy="842" r="8" fill="none" stroke="#c7b7ff" stroke-width="2"/>
<text x="64" y="868" font-size="16" fill="#c7d4ed">immune complexes</text>
<line x1="146" y1="818" x2="192" y2="818" stroke="#a6b7df" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="204" y="803" width="190" height="30" rx="8" fill="#2a3157" stroke="#c7b7ff" stroke-width="2"/>
<circle cx="236" cy="818" r="7" fill="#c7b7ff"/>
<circle cx="296" cy="818" r="7" fill="#c7b7ff"/>
<circle cx="356" cy="818" r="7" fill="#c7b7ff"/>
<text x="236" y="868" font-size="16" fill="#c7d4ed">deposit in a vessel</text>
<text x="64" y="912" font-size="19" fill="#c7b7ff" font-weight="700">Timing</text>
<text x="64" y="938" font-size="19" fill="#edf2ff">Variable; hours to days or longer.</text>
<text x="64" y="972" font-size="19" fill="#c7b7ff" font-weight="700">Examples</text>
<text x="64" y="998" font-size="19" fill="#edf2ff">Serum sickness; immune-complex</text>
<text x="64" y="1024" font-size="19" fill="#edf2ff">features of SLE.</text>
<rect x="560" y="612" width="504" height="428" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="594" y="704" font-size="72" font-weight="800" fill="#8fe2d5">D</text>
<text x="682" y="662" font-size="21" font-weight="800" fill="#8fe2d5">TYPE IV</text>
<text x="682" y="698" font-size="27" font-weight="800" fill="#fff">DELAYED</text>
<text x="588" y="742" font-size="19" fill="#edf2ff">T cells drive the reaction; antibodies</text>
<text x="588" y="768" font-size="19" fill="#edf2ff">are not the mediators.</text>
<circle cx="608" cy="818" r="15" fill="#8fe2d5"/>
<text x="588" y="868" font-size="16" fill="#c7d4ed">T cell</text>
<line x1="632" y1="818" x2="678" y2="818" stroke="#a6b7df" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="690" y="802" width="196" height="44" rx="8" fill="#1b2140" stroke="#485579" stroke-width="2"/>
<path d="M734 814 q34 -26 68 0 Z" fill="#8fe2d5" opacity=".85"/>
<line x1="690" y1="814" x2="886" y2="814" stroke="#485579" stroke-width="2"/>
<text x="690" y="868" font-size="16" fill="#c7d4ed">raised, inflamed skin</text>
<text x="588" y="912" font-size="19" fill="#8fe2d5" font-weight="700">Timing</text>
<text x="588" y="938" font-size="19" fill="#edf2ff">Often 48–72 hours in classic delayed reactions.</text>
<text x="588" y="972" font-size="19" fill="#8fe2d5" font-weight="700">Examples</text>
<text x="588" y="998" font-size="19" fill="#edf2ff">Poison ivy or nickel contact dermatitis;</text>
<text x="588" y="1024" font-size="19" fill="#edf2ff">tuberculin skin-test reaction.</text>
<rect x="36" y="1064" width="1028" height="56" rx="18" fill="#2e2c41" stroke="#aa9bdc" stroke-width="2"/>
<text x="56" y="1100" font-size="23" fill="#e0d6ff" font-weight="700">I = IgE • II = cell or tissue target • III = deposited complexes • IV = T cells</text>
<text x="36" y="1152" font-size="16" fill="#abbddb">Sources: Merck Manual Professional, Gell and Coombs classification · CDC tuberculin skin test guidance</text>
<text x="36" y="1176" font-size="16" fill="#abbddb">· CDC dental infection-control guidelines, for the two kinds of latex reaction.</text>
<text x="36" y="1204" font-size="15" fill="#abbddb">Study aid • Reviewed September 23, 2026 • Source links and text version accompany this graphic.</text>
</g></svg>