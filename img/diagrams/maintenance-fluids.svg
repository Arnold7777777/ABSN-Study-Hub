<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 900" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto">
<title id="t">Maintenance fluids &#8212; what they are and how Holliday-Segar works</title>
<desc id="d">Maintenance fluid is the amount a child needs each day just to stay even, replacing what is lost in urine, breathing and sweat. It is not treatment for dehydration. The Holliday-Segar rule splits the weight into three bands: the first ten kilograms get 100 mL per kg, the next ten get 50, and every kilogram past twenty gets 20. A worked example for a 26 kg child gives 1620 mL a day, or 67.5 mL an hour.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient></defs>
<style>
 text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
 .h1{font-weight:800;font-size:19px}
 .h2{font-weight:800;font-size:16px}
 .bd{font-size:15px}
 .sm{font-size:13.5px}
 .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
 .k{font-weight:800}
</style>
<rect width="920" height="900" rx="22" fill="url(#bg)"/>
<rect x="20" y="18" width="880" height="118" rx="14" fill="rgba(47,107,255,.20)" stroke="#2f6bff" stroke-width="2"/>
<text x="42" y="48" class="h1" fill="#bcd0ff">What &#8220;maintenance fluid&#8221; actually means</text>
<text x="42" y="76" class="bd" fill="#e7e9ff">A child who cannot drink normally still loses fluid all day &#8212; in urine, in every breath, through the skin.</text>
<text x="42" y="100" class="bd" fill="#e7e9ff">Maintenance is the amount that <tspan class="k" fill="#ffc233">replaces those losses and nothing more</tspan>. It keeps a normal child normal.</text>
<text x="42" y="124" class="bd" fill="#ffd0dc">It is <tspan class="k">not</tspan> treatment for dehydration. A dehydrated child needs this <tspan class="k">plus</tspan> a deficit replacement on top.</text>
<rect x="20" y="152" width="880" height="286" rx="16" fill="rgba(0,194,199,.12)" stroke="#00c2c7" stroke-width="2"/>
<text x="42" y="182" class="h2" fill="#7ff0f2">HOLLIDAY-SEGAR &#183; SPLIT THE CHILD&#8217;S WEIGHT INTO THREE BANDS</text>
<g transform="translate(42,200)">
 <rect x="0" y="0" width="250" height="96" rx="12" fill="rgba(18,184,134,.28)" stroke="#12b886" stroke-width="2"/>
 <text x="18" y="30" class="h2" fill="#5aebb4">First 10 kg</text>
 <text x="18" y="60" class="num" font-size="26" fill="#ffffff">100 mL/kg</text>
 <text x="18" y="82" class="sm" fill="#c7f0e2">every kg from 1 to 10</text>
 <rect x="270" y="0" width="250" height="96" rx="12" fill="rgba(255,194,51,.24)" stroke="#ffc233" stroke-width="2"/>
 <text x="288" y="30" class="h2" fill="#ffc233">Next 10 kg</text>
 <text x="288" y="60" class="num" font-size="26" fill="#ffffff">50 mL/kg</text>
 <text x="288" y="82" class="sm" fill="#ffeec2">every kg from 11 to 20</text>
 <rect x="540" y="0" width="250" height="96" rx="12" fill="rgba(157,92,255,.28)" stroke="#9d5cff" stroke-width="2"/>
 <text x="558" y="30" class="h2" fill="#d3b8ff">Every kg past 20</text>
 <text x="558" y="60" class="num" font-size="26" fill="#ffffff">20 mL/kg</text>
 <text x="558" y="82" class="sm" fill="#e0d0ff">21, 22, 23 and upward</text>
</g>
<text x="42" y="336" class="bd" fill="#e7e9ff"><tspan class="k" fill="#ffc233">Why it steps down:</tspan> a small body burns energy faster per kilogram, so it needs more fluid per kilogram.</text>
<text x="42" y="360" class="bd" fill="#e7e9ff">As the child gets bigger, each extra kilogram needs less.</text>
<g transform="translate(42,382)">
 <rect x="0" y="0" width="300" height="30" rx="6" fill="#12b886"/>
 <rect x="300" y="0" width="300" height="30" fill="#ffc233"/>
 <rect x="600" y="0" width="180" height="30" rx="6" fill="#9d5cff"/>
 <text x="150" y="20" class="sm k" fill="#04281c" text-anchor="middle">kg 1&#8211;10</text>
 <text x="450" y="20" class="sm k" fill="#2a1f00" text-anchor="middle">kg 11&#8211;20</text>
 <text x="690" y="20" class="sm k" fill="#ffffff" text-anchor="middle">kg 21+</text>
 <text x="0" y="48" class="sm" fill="#cfd6f5">0 kg</text>
 <text x="300" y="48" class="sm" fill="#cfd6f5" text-anchor="middle">10 kg</text>
 <text x="600" y="48" class="sm" fill="#cfd6f5" text-anchor="middle">20 kg</text>
</g>
<rect x="20" y="454" width="530" height="230" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.24)" stroke-width="2"/>
<text x="42" y="484" class="h2" fill="#ffffff">WORKED EXAMPLE &#183; A CHILD WHO WEIGHS 26 kg</text>
<text x="42" y="518" class="bd" fill="#5aebb4">first 10 kg</text><text x="230" y="518" class="num bd" fill="#ffffff">10 &#215; 100 = 1000 mL</text>
<text x="42" y="548" class="bd" fill="#ffc233">next 10 kg</text><text x="230" y="548" class="num bd" fill="#ffffff">10 &#215; 50 &#160;= &#160;500 mL</text>
<text x="42" y="578" class="bd" fill="#d3b8ff">the last 6 kg</text><text x="230" y="578" class="num bd" fill="#ffffff">&#160;6 &#215; 20 &#160;= &#160;120 mL</text>
<line x1="230" y1="594" x2="500" y2="594" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
<text x="42" y="622" class="h2" fill="#ffc233">a day</text><text x="230" y="622" class="num" font-size="21" fill="#ffc233">= 1620 mL</text>
<text x="42" y="658" class="h2" fill="#5aebb4">an hour</text><text x="230" y="658" class="num" font-size="21" fill="#5aebb4">1620 &#247; 24 = 67.5 mL/hr</text>
<rect x="566" y="454" width="334" height="230" rx="16" fill="rgba(157,92,255,.20)" stroke="#9d5cff" stroke-width="2"/>
<text x="588" y="484" class="h2" fill="#d3b8ff">THE 4&#8211;2&#8211;1 SHORTCUT</text>
<text x="588" y="510" class="sm" fill="#e0d0ff">Same rule, straight to mL per hour.</text>
<text x="588" y="544" class="num bd" fill="#5aebb4">4 mL/kg/hr</text><text x="712" y="544" class="bd" fill="#e7e9ff">first 10 kg</text>
<text x="588" y="574" class="num bd" fill="#ffc233">2 mL/kg/hr</text><text x="712" y="574" class="bd" fill="#e7e9ff">next 10 kg</text>
<text x="588" y="604" class="num bd" fill="#d3b8ff">1 mL/kg/hr</text><text x="712" y="604" class="bd" fill="#e7e9ff">each kg past 20</text>
<text x="588" y="644" class="sm" fill="#e0d0ff">Our 26 kg child:</text>
<text x="588" y="668" class="num bd" fill="#ffffff">40 + 20 + 6 = 66 mL/hr</text>
<rect x="20" y="702" width="880" height="180" rx="16" fill="rgba(255,59,107,.18)" stroke="#ff3b6b" stroke-width="2"/>
<text x="42" y="732" class="h2" fill="#ff8fa3">&#9888;&#65039; WHAT MAINTENANCE DOES NOT COVER</text>
<text x="42" y="762" class="bd" fill="#ffd0dc">&#8226; <tspan class="k">Fluid already lost.</tspan> A dehydrated child gets maintenance <tspan class="k">plus</tspan> the deficit, over 24 hours.</text>
<text x="42" y="790" class="bd" fill="#ffd0dc">&#8226; <tspan class="k">Ongoing losses.</tspan> Vomiting, diarrhea, fever, burns, a drain &#8212; each one is added on top.</text>
<text x="42" y="818" class="bd" fill="#ffd0dc">&#8226; <tspan class="k">Shock.</tspan> That is a bolus of <tspan class="num">20 mL/kg</tspan> isotonic fluid, fast &#8212; a different calculation.</text>
<text x="42" y="856" class="bd k" fill="#ffc233">Weigh the child in kilograms yourself &#8212; the whole number is built on it.</text>
</svg>
