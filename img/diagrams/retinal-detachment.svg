<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Retinal detachment</title><desc id="d">A cross-section of the eye with the retina lining the back and one section peeled away from the choroid behind it, drawn as a curtain falling across the field of view. Beside it the sequence - floaters, then flashes, then the curtain, then painless loss - and the contrast with closed-angle glaucoma, which hurts. Below, why a gas bubble means lying face down.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="690" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">RETINAL DETACHMENT — A CURTAIN, AND NO PAIN AT ALL</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">The retina has no blood supply of its own. Off the choroid, it starts to die. Time is sight.</text><rect x="24" y="96" width="452" height="342" rx="14" fill="#2f6bff" fill-opacity=".13" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="342" rx="2.5" fill="#2f6bff"/><circle cx="220" cy="264" r="108" fill="#101a33" stroke="#8ea6ff" stroke-opacity=".55" stroke-width="2.4"/><circle cx="220" cy="264" r="100" fill="#1b2f5c" fill-opacity=".75"/><path d="M240.6 167.2 L246.0 168.5 L251.4 170.1 L256.7 172.0 L261.8 174.3 L266.9 176.8 L271.7 179.6 L276.4 182.7 L281.0 186.0 L285.3 189.6 L289.4 193.4 L293.3 197.4 L296.9 201.7 L300.3 206.2 L303.5 210.8 L306.4 215.6 L309.0 220.6 L311.3 225.7 L313.3 231.0 L315.0 236.3 L316.5 241.7 L317.6 247.2 L318.4 252.8 L318.8 258.4 L319.0 264.0 L318.8 269.6 L318.4 275.2 L317.6 280.8 L316.5 286.3 L315.0 291.7 L313.3 297.0 L311.3 302.3 L309.0 307.4 L306.4 312.4 L303.5 317.2 L300.3 321.8 L296.9 326.3 L293.3 330.6 L289.4 334.6 L285.3 338.4 L281.0 342.0 L276.4 345.3 L271.7 348.4 L266.9 351.2 L261.8 353.7 L256.7 356.0 L251.4 357.9 L246.0 359.5 L240.6 360.8" fill="none" stroke="#c02255" stroke-width="9" stroke-linecap="round" stroke-opacity=".85"/><path d="M238.5 176.9 L240.0 177.3 L241.5 177.6 L243.0 178.0 L244.5 178.4 L246.0 178.9 L247.5 179.4 L249.0 179.8 L250.4 180.4 L251.9 180.9 L253.3 181.5 L254.8 182.1 L256.2 182.7 L257.6 183.3 L259.0 184.0 L260.4 184.7 L261.8 185.4 L263.1 186.2 L264.5 186.9 L265.8 187.7 L267.2 188.5 L268.5 189.4 L269.8 190.2 L271.0 191.1 L272.3 192.0 L273.6 192.9 L274.8 193.9 L276.0 194.8 L277.2 195.8 L278.4 196.8 L279.6 197.9 L280.7 198.9 L281.8 200.0 L282.9 201.1 L284.0 202.2 L285.1 203.3 L286.1 204.4 L287.2 205.6 L288.2 206.8 L289.2 208.0 L290.1 209.2 L291.1 210.4 L292.0 211.7 L292.9 213.0 L293.8 214.2 L294.6 215.5 L295.5 216.8 L296.3 218.2 L297.1 219.5" fill="none" stroke="#12b886" stroke-width="7" stroke-linecap="round"/><path d="M308.5 273.3 L308.2 275.6 L307.9 277.9 L307.5 280.2 L307.1 282.5 L306.5 284.8 L306.0 287.0 L305.3 289.3 L304.6 291.5 L303.9 293.7 L303.1 295.9 L302.2 298.1 L301.3 300.2 L300.3 302.3 L299.3 304.4 L298.2 306.5 L297.1 308.5 L295.9 310.5 L294.6 312.5 L293.3 314.4 L292.0 316.3 L290.6 318.2 L289.2 320.0 L287.7 321.8 L286.1 323.6 L284.6 325.3 L282.9 326.9 L281.3 328.6 L279.6 330.1 L277.8 331.7 L276.0 333.2 L274.2 334.6 L272.3 336.0 L270.4 337.3 L268.5 338.6 L266.5 339.9 L264.5 341.1 L262.5 342.2 L260.4 343.3 L258.3 344.3 L256.2 345.3 L254.1 346.2 L251.9 347.1 L249.7 347.9 L247.5 348.6 L245.3 349.3 L243.0 350.0 L240.8 350.5 L238.5 351.1" fill="none" stroke="#12b886" stroke-width="7" stroke-linecap="round"/><path d="M297.1 219.5 L296.5 221.2 L295.8 222.8 L295.1 224.5 L294.5 226.1 L293.8 227.6 L293.1 229.1 L292.4 230.6 L291.7 232.1 L291.1 233.5 L290.4 234.8 L289.8 236.2 L289.2 237.4 L288.7 238.7 L288.2 239.9 L287.7 241.0 L287.3 242.1 L287.0 243.2 L286.7 244.2 L286.5 245.2 L286.4 246.2 L286.3 247.2 L286.3 248.1 L286.4 249.0 L286.5 249.9 L286.7 250.7 L287.0 251.6 L287.4 252.4 L287.9 253.3 L288.4 254.1 L289.0 254.9 L289.7 255.8 L290.4 256.6 L291.2 257.5 L292.1 258.3 L293.1 259.2 L294.0 260.1 L295.1 261.0 L296.2 262.0 L297.3 263.0 L298.5 264.0 L299.7 265.0 L300.9 266.1 L302.2 267.2 L303.5 268.4 L304.7 269.6 L306.0 270.8 L307.3 272.0 L308.5 273.3" fill="none" stroke="#ff3b6b" stroke-width="7" stroke-linecap="round"/><path d="M128 218 q-40 46 0 92" fill="#cfe0ff" fill-opacity=".22" stroke="#cfe0ff" stroke-opacity=".7" stroke-width="2.6"/><ellipse cx="146" cy="264" rx="13" ry="30" fill="#dfe9ff" fill-opacity=".55" stroke="#dfe9ff" stroke-opacity=".7" stroke-width="2"/><text x="118" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">light in</text><text x="344" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">choroid</text><text x="344" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">feeds the retina</text><text x="344" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">retina, attached</text><text x="344" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="start">and being fed</text><text x="344" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">PEELED OFF</text><text x="344" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">no blood supply —</text><text x="344" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">these cells are dying</text><text x="344" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="start">She sees this bit</text><text x="344" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">as a CURTAIN coming</text><text x="344" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">down across her view.</text><text x="44" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Completely painless — the retina has no pain fibres.</text><text x="44" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">That is why people wait, and the waiting is what costs sight.</text><rect x="496" y="96" width="400" height="176" rx="14" fill="#ffc233" fill-opacity=".15" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="96" width="5" height="176" rx="2.5" fill="#ffc233"/><text x="514" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐  THE SEQUENCE, IN ORDER</text><circle cx="526" cy="148" r="10" fill="#ffc233"/><text x="526" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">1</text><text x="544" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">Floaters</text><text x="544" y="163" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">a sudden shower of spots</text><circle cx="526" cy="177" r="10" fill="#ffc233"/><text x="526" y="181" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">2</text><text x="544" y="177" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">Flashes of light</text><text x="544" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">especially out to the side</text><circle cx="526" cy="206" r="10" fill="#ffc233"/><text x="526" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">3</text><text x="544" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">A curtain or shadow</text><text x="544" y="221" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">moving across the field</text><circle cx="526" cy="235" r="10" fill="#ffc233"/><text x="526" y="239" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">4</text><text x="544" y="235" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">Painless loss of vision</text><text x="544" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">in that part of the view</text><rect x="496" y="286" width="400" height="152" rx="14" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="286" width="5" height="152" rx="2.5" fill="#ff3b6b"/><text x="514" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">SUDDEN VISION LOSS — WHICH ONE?</text><text x="514" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">PAINLESS</text><text x="514" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="start">Retinal detachment</text><text x="514" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c7f0e2" fill-opacity="1" text-anchor="start">curtain · floaters · flashes</text><text x="514" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">PAINFUL</text><text x="514" y="416" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">Closed-angle glaucoma</text><text x="514" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">halos · nausea · fixed mid-dilated pupil</text><rect x="24" y="456" width="872" height="214" rx="14" fill="#9d5cff" fill-opacity=".15" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="456" width="5" height="214" rx="2.5" fill="#9d5cff"/><text x="46" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">🚨  THE POSITIONING QUESTION — THE ONE EYE THAT GOES FACE DOWN</text><circle cx="150" cy="574" r="52" fill="#1b2f5c" stroke="#8ea6ff" stroke-opacity=".6" stroke-width="2.2"/><path d="M193 556 a52 52 0 0 1 0 36" fill="none" stroke="#ff3b6b" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="542" r="15" fill="#dff3ff" fill-opacity=".9"/><text x="150" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#123" fill-opacity="1" text-anchor="middle">gas</text><text x="150" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">SITTING UP</text><text x="150" y="644" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffc9d6" fill-opacity="1" text-anchor="middle">Bubble rises to the top,</text><text x="150" y="660" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffc9d6" fill-opacity="1" text-anchor="middle">nowhere near the tear.</text><circle cx="420" cy="574" r="52" fill="#1b2f5c" stroke="#8ea6ff" stroke-opacity=".6" stroke-width="2.2"/><path d="M463 556 a52 52 0 0 1 0 36" fill="none" stroke="#ff3b6b" stroke-width="5" stroke-linecap="round"/><circle cx="420" cy="606" r="15" fill="#dff3ff" fill-opacity=".9"/><text x="420" y="610" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#123" fill-opacity="1" text-anchor="middle">gas</text><text x="420" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">FACE DOWN</text><text x="420" y="644" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#c7f0e2" fill-opacity="1" text-anchor="middle">Bubble presses the retina</text><text x="420" y="660" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#c7f0e2" fill-opacity="1" text-anchor="middle">back against the choroid.</text><path d="M230 574 L336 574" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="524" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">The bubble always floats UP. To press it against a tear at</text><text x="524" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">the back of the eye, the back must be on top — so she lies</text><text x="524" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">face down, often most of the day, for several days.</text><text x="524" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffe1a8" fill-opacity="1" text-anchor="start">This is the ONLY eye condition positioned face down.</text><text x="524" y="614" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffe1a8" fill-opacity="1" text-anchor="start">Everything else is head up, never the operated side.</text><text x="524" y="654" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffe1a8" fill-opacity="1" text-anchor="start">No flying and no altitude while the bubble is in.</text></svg>