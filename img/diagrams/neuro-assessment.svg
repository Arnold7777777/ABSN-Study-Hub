<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 550" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Focused neurological assessment</title><desc id="d">The level of consciousness drawn as a scale from alert down to comatose, with the direction that matters marked. Below it pupils drawn at their actual sizes in millimetres, from pinpoint through normal to fixed and dilated. Beside them the assessment in order and the Cushing pattern, which is late.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="550" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">LEVEL OF CONSCIOUSNESS CHANGES FIRST — BEFORE ANYTHING ELSE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Before the pupils, before the vital signs, before the motor changes. If you assess one thing, assess that.</text><rect x="24" y="96" width="560" height="176" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="176" rx="2.5" fill="#2f6bff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">📉  THE SCALE SHE SLIDES DOWN</text><rect x="46" y="148" width="100" height="46" rx="10" fill="#12b886" fill-opacity=".26" stroke="#12b886" stroke-opacity=".8"/><text x="96.0" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">ALERT</text><text x="96.0" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">awake</text><text x="96.0" y="193" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">oriented</text><text x="96.0" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">engaged</text><path d="M148 171 L156 171" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="158" y="148" width="100" height="46" rx="10" fill="#00c2c7" fill-opacity=".26" stroke="#00c2c7" stroke-opacity=".8"/><text x="208.0" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="middle">LETHARGIC</text><text x="208.0" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">drowsy</text><text x="208.0" y="193" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">rouses easily</text><path d="M260 171 L268 171" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="270" y="148" width="100" height="46" rx="10" fill="#ffc233" fill-opacity=".26" stroke="#ffc233" stroke-opacity=".8"/><text x="320.0" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">OBTUNDED</text><text x="320.0" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">hard to rouse</text><text x="320.0" y="193" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">dulled</text><path d="M372 171 L380 171" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="382" y="148" width="100" height="46" rx="10" fill="#ff8a3d" fill-opacity=".26" stroke="#ff8a3d" stroke-opacity=".8"/><text x="432.0" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">STUPOROUS</text><text x="432.0" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">only to vigorous stimulus</text><path d="M484 171 L492 171" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="494" y="148" width="100" height="46" rx="10" fill="#ff3b6b" fill-opacity=".26" stroke="#ff3b6b" stroke-opacity=".8"/><text x="544.0" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">COMATOSE</text><text x="544.0" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">no response at all</text><text x="46" y="224" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ANY move to the right is a deterioration until proven otherwise.</text><text x="46" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">"More restless" and "harder to wake" both count.</text><text x="46" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Orientation goes in order: TIME first, then place, then person.</text><rect x="604" y="96" width="292" height="176" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="604" y="96" width="5" height="176" rx="2.5" fill="#12b886"/><text x="622" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  IN THIS ORDER</text><circle cx="634" cy="148" r="9" fill="#12b886"/><text x="634" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">1</text><text x="650" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">LOC</text><text x="712" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">awake? oriented?</text><circle cx="634" cy="172" r="9" fill="#12b886"/><text x="634" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">2</text><text x="650" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Pupils</text><text x="712" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">PERRLA, size, reaction</text><circle cx="634" cy="196" r="9" fill="#12b886"/><text x="634" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">3</text><text x="650" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Motor</text><text x="712" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">strength, symmetry, drift</text><circle cx="634" cy="220" r="9" fill="#12b886"/><text x="634" y="224" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">4</text><text x="650" y="224" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Sensory</text><text x="712" y="224" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">touch, pain, position</text><circle cx="634" cy="244" r="9" fill="#12b886"/><text x="634" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">5</text><text x="650" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Vitals</text><text x="712" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">the Cushing pattern — late</text><rect x="24" y="290" width="560" height="232" rx="14" fill="#9d5cff" fill-opacity=".15" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="290" width="5" height="232" rx="2.5" fill="#9d5cff"/><text x="46" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">👁️  PUPILS, DRAWN AT THEIR ACTUAL SIZE</text><circle cx="76" cy="386" r="33" fill="#e9dfd2" fill-opacity=".55"/><circle cx="76" cy="386" r="27" fill="#6d8fb8" fill-opacity=".8"/><circle cx="76.0" cy="386" r="3.2" fill="#0b0716"/><text x="76" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">1 mm</text><text x="76" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">PINPOINT</text><text x="76" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">opioids</text><text x="76" y="475" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">pontine bleed</text><circle cx="184" cy="386" r="33" fill="#e9dfd2" fill-opacity=".55"/><circle cx="184" cy="386" r="27" fill="#6d8fb8" fill-opacity=".8"/><circle cx="184.0" cy="386" r="9.6" fill="#0b0716"/><text x="184" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">3 mm</text><text x="184" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">normal</text><text x="184" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">2 to 6 mm</text><text x="184" y="475" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">reactive</text><circle cx="292" cy="386" r="33" fill="#e9dfd2" fill-opacity=".55"/><circle cx="292" cy="386" r="27" fill="#6d8fb8" fill-opacity=".8"/><circle cx="292.0" cy="386" r="16.0" fill="#0b0716"/><text x="292" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">5 mm</text><text x="292" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">normal</text><text x="292" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">in a dim room</text><circle cx="400" cy="386" r="33" fill="#e9dfd2" fill-opacity=".55"/><circle cx="400" cy="386" r="27" fill="#6d8fb8" fill-opacity=".8"/><circle cx="400.0" cy="386" r="22.4" fill="#0b0716"/><text x="400" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">7 mm</text><text x="400" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">DILATED</text><text x="400" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">both — anoxia</text><text x="400" y="475" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">atropine</text><circle cx="508" cy="386" r="33" fill="#e9dfd2" fill-opacity=".55"/><circle cx="508" cy="386" r="27" fill="#6d8fb8" fill-opacity=".8"/><circle cx="508.0" cy="386" r="25.6" fill="#0b0716"/><text x="508" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">8 mm</text><text x="508" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">FIXED, one side</text><text x="508" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">herniation — emergency</text><text x="46" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">A NEW one-sided dilation with a sluggish reaction is a</text><text x="46" y="506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">herniating brain. Call — do not re-check in an hour.</text><rect x="604" y="290" width="292" height="232" rx="14" fill="#ff3b6b" fill-opacity=".17" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="604" y="290" width="5" height="232" rx="2.5" fill="#ff3b6b"/><text x="622" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  THE CUSHING PATTERN</text><text x="622" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">BP</text><text x="696" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">widening pulse pressure</text><text x="696" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">systolic up, diastolic down</text><text x="622" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Pulse</text><text x="696" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">bradycardia</text><text x="696" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">slow and bounding</text><text x="622" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Breathing</text><text x="696" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">irregular</text><text x="696" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">Cheyne-Stokes</text><text x="622" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">This is LATE. Herniation is already</text><text x="622" y="506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">happening — call before you see it.</text></svg>