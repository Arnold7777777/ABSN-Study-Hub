<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Ectopic and molar pregnancy</title><desc id="d">On the left a uterus with its tubes, the pregnancy implanted in one tube, and blood from the rupture tracking up to irritate the diaphragm and refer pain to the shoulder. On the right the same uterus filled with the grape-like tissue of a hydatidiform mole and an hCG gauge pinned at the top. Below, what each one needs.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="700" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">EARLY PREGNANCY BLEEDING — SORTED BY WHERE THE PREGNANCY IS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Shoulder pain means a ruptured ectopic. Sky-high hCG with no foetus means a mole.</text><rect x="24" y="96" width="426" height="330" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="330" rx="2.5" fill="#ff3b6b"/><text x="237.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">🩸  ECTOPIC — in the tube</text><path d="M237 202 C289 212 281 292 237 304 C193 292 185 212 237 202 Z" fill="#f4b9c6" fill-opacity=".13" stroke="#ff3b6b" stroke-width="3"/><path d="M197 222 q-30 -34 -58 -12" fill="none" stroke="#ff3b6b" stroke-width="7" stroke-linecap="round"/><ellipse cx="133" cy="208" rx="12" ry="9" fill="#ff3b6b" fill-opacity=".35" stroke="#ff3b6b" stroke-width="2"/><path d="M277 222 q30 -34 58 -12" fill="none" stroke="#ff3b6b" stroke-width="7" stroke-linecap="round"/><ellipse cx="341" cy="208" rx="12" ry="9" fill="#ff3b6b" fill-opacity=".35" stroke="#ff3b6b" stroke-width="2"/><path d="M222 302 h30 l-6 34 h-18 z" fill="#f4b9c6" fill-opacity=".12" stroke="#ff3b6b" stroke-width="2.6"/><circle cx="309" cy="214" r="13" fill="#ffc233" fill-opacity=".95"/><text x="309.0" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">implanted HERE</text><text x="309.0" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="middle">~90% in a tube</text><path d="M299 206 q-30 -46 -96 -56" fill="none" stroke="#ff3b6b" stroke-width="3.4" stroke-dasharray="6 5" stroke-linecap="round"/><path d="M181 150 h96" stroke="#ff3b6b" stroke-width="4" stroke-linecap="round" stroke-opacity=".8"/><text x="229.0" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">blood irritates the DIAPHRAGM</text><path d="M181.0 150 L139.0 166" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="40" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">referred</text><text x="40" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">SHOULDER pain</text><text x="44" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Classic triad: missed period + one-sided stabbing pain</text><text x="44" y="363" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">+ spotting. hCG rises more slowly than it should.</text><text x="44" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Shoulder pain in early pregnancy is a ruptured</text><text x="44" y="403" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ectopic until proven otherwise. Straight to theatre.</text><rect x="470" y="96" width="426" height="330" rx="14" fill="#ff8a3d" fill-opacity=".15" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="470" y="96" width="5" height="330" rx="2.5" fill="#ff8a3d"/><text x="683.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">🍇  MOLAR — grapes, and no baby</text><path d="M637 202 C689 212 681 292 637 304 C593 292 585 212 637 202 Z" fill="#f4b9c6" fill-opacity=".13" stroke="#ff8a3d" stroke-width="3"/><path d="M597 222 q-30 -34 -58 -12" fill="none" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round"/><ellipse cx="533" cy="208" rx="12" ry="9" fill="#ff8a3d" fill-opacity=".35" stroke="#ff8a3d" stroke-width="2"/><path d="M677 222 q30 -34 58 -12" fill="none" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round"/><ellipse cx="741" cy="208" rx="12" ry="9" fill="#ff8a3d" fill-opacity=".35" stroke="#ff8a3d" stroke-width="2"/><path d="M622 302 h30 l-6 34 h-18 z" fill="#f4b9c6" fill-opacity=".12" stroke="#ff8a3d" stroke-width="2.6"/><circle cx="615" cy="230" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><circle cx="635" cy="224" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><circle cx="655" cy="232" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><circle cx="609" cy="250" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><circle cx="629" cy="246" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><circle cx="649" cy="248" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><circle cx="665" cy="258" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><circle cx="619" cy="270" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><circle cx="639" cy="268" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><circle cx="657" cy="274" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><circle cx="633" cy="286" r="9" fill="#ff8a3d" fill-opacity=".85" stroke="#fff" stroke-opacity=".25"/><rect x="800" y="182" width="34" height="150" rx="17" fill="#0b0716" fill-opacity=".8" stroke="#cfd4ff" stroke-opacity=".4" stroke-width="2"/><rect x="804" y="190" width="26" height="128" rx="13" fill="#ff8a3d" fill-opacity=".9"/><text x="817" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">hCG</text><text x="817" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffe1c2" fill-opacity="1" text-anchor="middle">far higher</text><text x="817" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffe1c2" fill-opacity="1" text-anchor="middle">than it</text><text x="817" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffe1c2" fill-opacity="1" text-anchor="middle">should be</text><text x="490" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">A uterus far too big for the dates, dark brown</text><text x="490" y="363" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">"prune juice" bleeding, and severe vomiting.</text><text x="490" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">No fetal heart tones — because there is no</text><text x="490" y="403" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">foetus. hCG is followed for a year afterwards.</text><rect x="24" y="444" width="872" height="208" rx="14" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="444" width="5" height="208" rx="2.5" fill="#12b886"/><text x="46" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  WHAT EACH ONE NEEDS</text><text x="46" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ECTOPIC</text><text x="46" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Unruptured → methotrexate. No folic acid and no alcohol while on it,</text><text x="46" y="543" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· and no intercourse until the hCG is undetectable.</text><text x="46" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Ruptured → two large-bore IVs, type and crossmatch, oxygen, theatre.</text><text x="46" y="581" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· RhoGAM if she is Rh negative. And name the loss — it is one.</text><text x="480" y="502" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">MOLAR</text><text x="480" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">· Evacuated by suction curettage — it is not a pregnancy.</text><text x="480" y="543" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">· Serial hCG for a full year: it must fall to zero and stay there.</text><text x="480" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">· Reliable contraception all year: a new pregnancy would</text><text x="480" y="581" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">· raise hCG and hide a choriocarcinoma developing.</text><text x="46" y="620" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Both present as first-trimester bleeding. Where the pregnancy is —</text><text x="46" y="638" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">and whether there is a foetus at all — is what separates them.</text></svg>