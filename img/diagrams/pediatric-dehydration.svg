<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 800" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto">
<title id="t">Dehydration in a child &#8212; where to look, and the three severities</title>
<desc id="d">Seven places to look on a child for dehydration: the fontanelle, the eyes and whether there are tears, the mouth, skin turgor on the abdomen, capillary refill, wet diapers, and level of alertness. Then the three severities: mild at about five percent, moderate at about ten percent, and severe at fifteen percent or more, which is shock. Blood pressure falls last. Weight is the most accurate measure because one kilogram lost is one liter of fluid lost.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffc233"/></marker></defs>
<style>
 text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
 .h1{font-weight:800;font-size:19px}
 .h2{font-weight:800;font-size:16px}
 .bd{font-size:15px}
 .sm{font-size:13.5px}
 .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
 .k{font-weight:800}
</style>
<rect width="920" height="800" rx="22" fill="url(#bg)"/>
<rect x="20" y="18" width="880" height="80" rx="14" fill="rgba(47,107,255,.20)" stroke="#2f6bff" stroke-width="2"/>
<text x="42" y="48" class="h1" fill="#bcd0ff">A child dries out faster than an adult</text>
<text x="42" y="76" class="bd" fill="#e7e9ff">More body water, a bigger surface area for their size, and no way to fetch their own drink.</text>
<rect x="20" y="112" width="880" height="292" rx="16" fill="rgba(0,194,199,.12)" stroke="#00c2c7" stroke-width="2"/>
<text x="42" y="142" class="h2" fill="#7ff0f2">WHERE TO LOOK &#183; SEVEN PLACES, HEAD DOWNWARD</text>
<g transform="translate(150,290)">
 <ellipse cx="0" cy="-84" rx="46" ry="52" fill="#f0c9b4" stroke="#b8846a" stroke-width="2"/>
 <path d="M0 -122 L14 -104 L0 -86 L-14 -104 z" fill="#7fd8da" stroke="#0a5c46" stroke-width="1.5"/>
 <circle cx="-17" cy="-88" r="6" fill="#3a2418"/><circle cx="17" cy="-88" r="6" fill="#3a2418"/>
 <path d="M-14 -62 Q0 -54 14 -62" fill="none" stroke="#8a4a2f" stroke-width="3"/>
 <path d="M-30 -30 h60 v92 h-60 z" fill="#f0c9b4" stroke="#b8846a" stroke-width="2"/>
</g>
<g class="bd">
 <line x1="232" y1="168" x2="164" y2="176" stroke="#ffc233" stroke-width="2" marker-end="url(#ay)"/>
 <text x="240" y="166" fill="#ffc233" class="k">Fontanelle</text>
 <text x="240" y="186" class="sm" fill="#ffeec2">sunken, on a baby under 18 months</text>
 <line x1="232" y1="216" x2="170" y2="204" stroke="#ffc233" stroke-width="2" marker-end="url(#ay)"/>
 <text x="240" y="214" fill="#ffc233" class="k">Eyes</text>
 <text x="240" y="234" class="sm" fill="#ffeec2">sunken, and <tspan class="k">no tears when crying</tspan></text>
 <line x1="232" y1="262" x2="168" y2="232" stroke="#ffc233" stroke-width="2" marker-end="url(#ay)"/>
 <text x="240" y="260" fill="#ffc233" class="k">Mouth</text>
 <text x="240" y="280" class="sm" fill="#ffeec2">dry, tacky &#8212; check the tongue, not the lips</text>
 <line x1="232" y1="322" x2="184" y2="300" stroke="#ffc233" stroke-width="2" marker-end="url(#ay)"/>
 <text x="240" y="320" fill="#ffc233" class="k">Skin turgor</text>
 <text x="240" y="340" class="sm" fill="#ffeec2">pinch the <tspan class="k">abdomen</tspan>; a tent that stays is late</text>
 <text x="560" y="166" fill="#ffc233" class="k">Capillary refill</text>
 <text x="560" y="186" class="sm" fill="#ffeec2">over 2 seconds is abnormal</text>
 <text x="560" y="222" fill="#ffc233" class="k">Wet diapers</text>
 <text x="560" y="242" class="sm" fill="#ffeec2">ask how many today versus normal</text>
 <text x="560" y="278" fill="#ffc233" class="k">How they act</text>
 <text x="560" y="298" class="sm" fill="#ffeec2">irritable, then floppy. Listlessness is late.</text>
 <text x="560" y="344" fill="#5aebb4" class="k">Weight is the truest measure</text>
 <text x="560" y="364" class="sm" fill="#c7f0e2">1 kg lost = 1 liter lost. Same scale, no clothes.</text>
</g>
<rect x="20" y="420" width="286" height="220" rx="14" fill="rgba(18,184,134,.20)" stroke="#12b886" stroke-width="2"/>
<text x="42" y="450" class="h2" fill="#5aebb4">MILD &#183; about 5%</text>
<text x="42" y="478" class="bd" fill="#e8ffef"><tspan class="k">Thirsty</tspan></text>
<text x="42" y="508" class="sm" fill="#c7f0e2">Alert</text>
<text x="42" y="530" class="sm" fill="#c7f0e2">Mouth still moist-ish</text>
<text x="42" y="552" class="sm" fill="#c7f0e2">Heart rate normal or a little up</text>
<text x="42" y="574" class="sm" fill="#c7f0e2">Still passing urine</text>
<text x="42" y="612" class="bd k" fill="#5aebb4">Oral rehydration wins here</text>
<rect x="317" y="420" width="286" height="220" rx="14" fill="rgba(255,194,51,.22)" stroke="#ffc233" stroke-width="2"/>
<text x="339" y="450" class="h2" fill="#ffc233">MODERATE &#183; about 10%</text>
<text x="339" y="478" class="bd" fill="#ffeec2"><tspan class="k">Dry and tachycardic</tspan></text>
<text x="339" y="508" class="sm" fill="#ffeec2">Dry mucous membranes</text>
<text x="339" y="530" class="sm" fill="#ffeec2">Sunken fontanelle</text>
<text x="339" y="552" class="sm" fill="#ffeec2">Reduced skin turgor</text>
<text x="339" y="574" class="sm" fill="#ffeec2">Fewer wet diapers, irritable</text>
<text x="339" y="612" class="bd k" fill="#ffc233">Blood pressure still normal</text>
<rect x="614" y="420" width="286" height="220" rx="14" fill="rgba(255,59,107,.24)" stroke="#ff3b6b" stroke-width="3"/>
<text x="636" y="450" class="h2" fill="#ff8fa3">SEVERE &#183; 15% or more</text>
<text x="636" y="478" class="bd" fill="#ffd0dc"><tspan class="k">This is shock</tspan></text>
<text x="636" y="508" class="sm" fill="#ffd0dc">Lethargy</text>
<text x="636" y="530" class="sm" fill="#ffd0dc">Marked tachycardia</text>
<text x="636" y="552" class="sm" fill="#ffd0dc">Cool, mottled skin</text>
<text x="636" y="574" class="sm" fill="#ffd0dc">No tears, minimal urine</text>
<text x="636" y="612" class="bd k" fill="#ffc233">20 mL/kg bolus, fast</text>
<rect x="20" y="656" width="880" height="124" rx="16" fill="rgba(255,59,107,.16)" stroke="#ff3b6b" stroke-width="2"/>
<text x="42" y="686" class="h2" fill="#ff8fa3">&#9888;&#65039; THE ONE THAT CATCHES PEOPLE OUT</text>
<text x="42" y="716" class="bd" fill="#ffd0dc"><tspan class="k" fill="#ffc233">Blood pressure falls last.</tspan> A child holds it up by beating faster, right until they cannot.</text>
<text x="42" y="744" class="bd" fill="#ffd0dc">So a normal blood pressure never rules dehydration out &#8212; and once it drops, you are already late.</text>
<text x="42" y="770" class="bd" fill="#ffd0dc">Rising heart rate and falling urine output tell you first.</text>
</svg>
