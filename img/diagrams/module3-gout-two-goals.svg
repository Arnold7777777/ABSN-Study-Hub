<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc"><title id="title">Gout: two treatment goals</title><desc id="desc">Two columns distinguish gout flare treatment from long-term urate lowering, with a note on starting therapy during flares.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a6b7df"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect width="1100" height="880" rx="24" fill="#10152b"/>
<text x="36" y="39" font-size="16" fill="#aabfe8" font-weight="700">NUR 258  /  MODULE 3  /  VISUAL STUDY GUIDE</text>
<text x="36" y="88" font-size="36" fill="#fff" font-weight="800">Gout: two treatment goals</text>
<text x="36" y="125" font-size="21" fill="#c7d4ed" font-weight="400">Relieve today’s inflammation and reduce future urate crystal burden.</text>
<rect x="36" y="168" width="497" height="438" rx="18" fill="#362638" stroke="#f0a8c6" stroke-width="2"/>
<rect x="553" y="168" width="511" height="438" rx="18" fill="#203840" stroke="#80dcd1" stroke-width="2"/>
<text x="60" y="214" font-size="27" fill="#ffc3dc" font-weight="800">DURING A FLARE</text>
<text x="577" y="214" font-size="27" fill="#9af0df" font-weight="800">LONG-TERM PREVENTION</text>
<text x="60" y="259" font-size="23" fill="#edf2ff" font-weight="400">Goal: reduce inflammation / pain</text>
<text x="577" y="259" font-size="23" fill="#edf2ff" font-weight="400">Goal: lower serum urate</text>
<text x="60" y="317" font-size="24" fill="#edf2ff" font-weight="400">Prescribed options include:</text>
<text x="60" y="348" font-size="24" fill="#edf2ff" font-weight="400">• Colchicine</text>
<text x="60" y="379" font-size="24" fill="#edf2ff" font-weight="400">• An NSAID</text>
<text x="60" y="410" font-size="24" fill="#edf2ff" font-weight="400">• A glucocorticoid</text>
<text x="577" y="317" font-size="24" fill="#edf2ff" font-weight="400">Allopurinol is the preferred</text>
<text x="577" y="348" font-size="24" fill="#edf2ff" font-weight="400">first-line urate-lowering drug.</text>
<text x="577" y="379" font-size="24" fill="#edf2ff" font-weight="400"></text>
<text x="577" y="410" font-size="24" fill="#edf2ff" font-weight="400">Start low; titrate using urate labs.</text>
<text x="60" y="487" font-size="22" fill="#edf2ff" font-weight="400">Choice depends on kidney function,</text>
<text x="60" y="518" font-size="22" fill="#edf2ff" font-weight="400">bleeding risk, interactions and</text>
<text x="60" y="549" font-size="22" fill="#edf2ff" font-weight="400">other patient factors.</text>
<text x="577" y="487" font-size="22" fill="#edf2ff" font-weight="400">Typical serum urate target: &lt;6 mg/dL.</text>
<text x="577" y="518" font-size="22" fill="#edf2ff" font-weight="400">Anti-inflammatory prophylaxis is</text>
<text x="577" y="549" font-size="22" fill="#edf2ff" font-weight="400">used when starting therapy.</text>
<rect x="36" y="633" width="1028" height="165" rx="18" fill="#2b2942" stroke="#b4a4fa" stroke-width="2"/>
<text x="58" y="673" font-size="25" fill="#d6c4ff" font-weight="800">THE TIMING TRAP</text>
<text x="58" y="712" font-size="22" fill="#edf2ff" font-weight="400">Allopurinol is not an immediate pain reliever.</text>
<text x="58" y="743" font-size="22" fill="#edf2ff" font-weight="400">Do not stop established urate-lowering therapy just because a flare occurs.</text>
<text x="58" y="774" font-size="22" fill="#edf2ff" font-weight="400">When indicated, starting during a flare is conditionally recommended by ACR.</text>
<text x="36" y="838" font-size="16" fill="#abbddb" font-weight="400">Source: 2020 American College of Rheumatology guideline for the management of gout.</text>
<text x="36" y="864" font-size="15" fill="#abbddb" font-weight="400">Study aid • Reviewed September 23, 2026 • Source links and text version accompany this graphic.</text>
</g></svg>