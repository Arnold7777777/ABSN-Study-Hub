<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 764" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Type 1 diabetes in children</title><desc id="d">A cell with glucose piled up outside it and the door shut because there is no insulin to open it, so the body starves in a sea of sugar. Beside it the three polys with weight loss, the clue parents actually notice, and type 1 against type 2. Below, hypoglycaemia and the sick day rules.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="764" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#12b886"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#12b886">EATING MORE AND LOSING WEIGHT AT THE SAME TIME</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">There is no insulin at all, so glucose cannot get into the cells. She is starving in a sea of sugar.</text><rect x="24" y="96" width="430" height="286" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="286" rx="2.5" fill="#2f6bff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🔒  THE DOOR WITH NO KEY</text><circle cx="200" cy="238" r="66" fill="#2f6bff" fill-opacity=".18" stroke="#2f6bff" stroke-width="3"/><text x="200" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c3d2ff" fill-opacity="1" text-anchor="middle">the cell</text><text x="200" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">starving</text><rect x="191" y="150" width="18" height="42" rx="5" fill="#ffc233" fill-opacity=".85"/><text x="230" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">shut — no</text><text x="230" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">insulin to</text><text x="230" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">open it</text><circle cx="104" cy="192" r="8" fill="#ff8a3d" fill-opacity=".9"/><circle cx="122" cy="220" r="8" fill="#ff8a3d" fill-opacity=".9"/><circle cx="96" cy="244" r="8" fill="#ff8a3d" fill-opacity=".9"/><circle cx="128" cy="260" r="8" fill="#ff8a3d" fill-opacity=".9"/><circle cx="104" cy="284" r="8" fill="#ff8a3d" fill-opacity=".9"/><circle cx="140" cy="194" r="8" fill="#ff8a3d" fill-opacity=".9"/><circle cx="142" cy="290" r="8" fill="#ff8a3d" fill-opacity=".9"/><text x="116" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">glucose piling up</text><text x="46" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">So the blood sugar climbs while the cells burn fat and</text><text x="46" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">muscle for fuel. That is where the weight goes.</text><rect x="474" y="96" width="422" height="286" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="96" width="5" height="286" rx="2.5" fill="#12b886"/><text x="492" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">💧  THE THREE POLYS, PLUS THE FOURTH THING</text><text x="492" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">POLYURIA</text><text x="604" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">sugar drags water out through the kidneys</text><text x="492" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">POLYDIPSIA</text><text x="604" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">so she is constantly thirsty</text><text x="492" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">POLYPHAGIA</text><text x="604" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">the cells are starving, so she is ravenous</text><text x="492" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">WEIGHT LOSS</text><text x="604" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">and yet she is losing weight anyway</text><text x="492" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">THE CLUE PARENTS ACTUALLY NOTICE</text><text x="492" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">New bedwetting in a child who was dry, or a toddler</text><text x="492" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">soaking through nappies again. Plus tiredness,</text><text x="492" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">irritability, and blurred vision.</text><rect x="24" y="400" width="872" height="160" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="400" width="5" height="160" rx="2.5" fill="#2f6bff"/><text x="46" y="426" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">TYPE 1  vs  TYPE 2</text><text x="230" y="426" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">TYPE 1</text><text x="560" y="426" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">TYPE 2</text><text x="46" y="450" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Onset</text><text x="230" y="450" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">sudden — weeks</text><text x="560" y="450" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">gradual, often years</text><text x="46" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Build</text><text x="230" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">often thin; recent weight loss</text><text x="560" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">usually overweight</text><text x="46" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Insulin</text><text x="230" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">always required</text><text x="560" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">diet, metformin, sometimes insulin</text><text x="46" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Ketones</text><text x="230" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">common at diagnosis</text><text x="560" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">uncommon</text><text x="46" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Skin</text><text x="230" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">no</text><text x="560" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">acanthosis nigricans — dark velvety neck</text><rect x="24" y="576" width="452" height="190" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="576" width="5" height="190" rx="2.5" fill="#ff3b6b"/><text x="46" y="606" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  HYPOGLYCAEMIA — ACT FIRST, ASK AFTER</text><text x="46" y="632" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">In a child, a sudden change in BEHAVIOUR is the sign —</text><text x="46" y="650" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">irritable, tearful, silly, or suddenly quiet. Check the glucose.</text><text x="46" y="676" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Awake: 15 g of fast sugar, wait 15 minutes, recheck.</text><text x="46" y="694" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Not awake: nothing by mouth — glucagon, or IV dextrose.</text><text x="46" y="728" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Then a snack with protein, or it comes straight back down.</text><text x="46" y="748" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Cold, clammy — needs candy. Hot, dry — sugar high.</text><rect x="496" y="576" width="400" height="190" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="576" width="5" height="190" rx="2.5" fill="#ffc233"/><text x="518" y="606" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🤒  SICK DAY RULES</text><text x="518" y="634" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· NEVER stop the insulin — illness raises the</text><text x="518" y="654" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">  glucose even when she is not eating</text><text x="518" y="674" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Check glucose every 3–4 hours</text><text x="518" y="694" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Check ketones if glucose is over 240</text><text x="518" y="714" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Fluids constantly, in small amounts</text><text x="518" y="734" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Call if vomiting, ketones, or glucose stays high</text></svg>