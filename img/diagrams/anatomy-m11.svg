<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-label="A lymph node in section with afferent vessels entering, the capsule, cortex and medulla, and one efferent vessel leaving. Beside it the difference between innate and adaptive immunity, and the three lymphocytes."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="392" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">ONE LYMPH NODE</text><ellipse cx="176" cy="158" rx="96" ry="72" fill="#5b7cfa" stroke="#e9e2ff" stroke-width="3"/><ellipse cx="176" cy="158" rx="70" ry="50" fill="#9d5cff" opacity=".9"/><ellipse cx="176" cy="158" rx="40" ry="26" fill="#ffc233"/><text x="176" y="164" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Medulla</text><text x="176" y="122" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Cortex</text><text x="176" y="72" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Capsule</text><line x1="24" y1="126" x2="90" y2="126" stroke="#7ee8ff" stroke-width="3" marker-end="url(#ah)"/><line x1="24" y1="158" x2="90" y2="158" stroke="#7ee8ff" stroke-width="3" marker-end="url(#ah)"/><line x1="24" y1="190" x2="90" y2="190" stroke="#7ee8ff" stroke-width="3" marker-end="url(#ah)"/><text x="24" y="258" font-size="17" font-weight="800" fill="#7ee8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">3 afferent vessels in</text><line x1="262" y1="158" x2="350" y2="158" stroke="#ffd76a" stroke-width="3.5" marker-end="url(#ah)"/><text x="276" y="200" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">1 efferent out</text><text x="24" y="296" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Many ways in, one way out</text><text x="24" y="320" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">That is why a node swells</text><rect x="364" y="52" width="332" height="44" rx="9" fill="rgba(255,194,51,.88)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="376" y="72" font-size="19" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Innate — born with it</text><text x="376" y="90" font-size="17" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Skin, mucus, fever, phagocytes</text><rect x="364" y="104" width="332" height="44" rx="9" fill="rgba(18,184,134,.85)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="376" y="124" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Adaptive — learned</text><text x="376" y="142" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Slower first, then it remembers</text><text x="364" y="232" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THE THREE LYMPHOCYTES</text><rect x="364" y="248" width="332" height="38" rx="9" fill="rgba(157,92,255,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="376" y="273" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">B cells — make antibodies</text><rect x="364" y="294" width="332" height="38" rx="9" fill="rgba(157,92,255,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="376" y="319" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">T cells — kill and direct</text><rect x="364" y="340" width="332" height="38" rx="9" fill="rgba(157,92,255,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="376" y="365" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">NK cells — kill on sight</text></svg>