<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Mastectomy and the affected arm</title><desc id="d">An arm with its lymph drainage running up through the axillary nodes on one side, and the same arm on the other side with those nodes removed and the fluid backing up, which is lymphoedema. Beside them the procedures and how much of the node field each takes. Below, the positioning immediately after surgery and the lifelong rules for that arm.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="690" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">THE NODES ARE THE PART THAT CHANGES THE NURSING</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Taking the axillary nodes removes the drainage route for that arm — permanently, and for the rest of her life.</text><rect x="24" y="96" width="470" height="306" rx="14" fill="#9d5cff" fill-opacity=".15" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="306" rx="2.5" fill="#9d5cff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">💧  WHERE THE FLUID GOES</text><rect x="46" y="146" width="196" height="180" rx="12" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".7"/><text x="144" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">NODES INTACT</text><path d="M108 210 v96" stroke="#ffd9c2" stroke-opacity=".35" stroke-width="26" stroke-linecap="round"/><circle cx="130" cy="196" r="6" fill="#12b886" fill-opacity=".9"/><circle cx="148" cy="196" r="6" fill="#12b886" fill-opacity=".9"/><circle cx="130" cy="212" r="6" fill="#12b886" fill-opacity=".9"/><circle cx="148" cy="212" r="6" fill="#12b886" fill-opacity=".9"/><path d="M108 286 L108 224" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="196" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">drains</text><text x="196" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">freely</text><rect x="266" y="146" width="196" height="180" rx="12" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".7"/><text x="364" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">NODES REMOVED</text><path d="M328 210 v96" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="26" stroke-linecap="round"/><path d="M328 250 v54" stroke="#ff3b6b" stroke-opacity=".35" stroke-width="40" stroke-linecap="round"/><circle cx="350" cy="196" r="6" fill="none" stroke="#6a6f8f" stroke-width="2" stroke-dasharray="3 2"/><circle cx="368" cy="196" r="6" fill="none" stroke="#6a6f8f" stroke-width="2" stroke-dasharray="3 2"/><circle cx="350" cy="212" r="6" fill="none" stroke="#6a6f8f" stroke-width="2" stroke-dasharray="3 2"/><circle cx="368" cy="212" r="6" fill="none" stroke="#6a6f8f" stroke-width="2" stroke-dasharray="3 2"/><path d="M320 222 l16 16 M336 222 l-16 16" stroke="#ff3b6b" stroke-width="3.4" stroke-linecap="round"/><text x="416" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">nowhere</text><text x="416" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">to go</text><text x="364" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">LYMPHEDEMA</text><text x="46" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">Not a swelling that resolves. Once the route is gone it is gone,</text><text x="46" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">and the risk lasts for the rest of her life — decades later too.</text><rect x="514" y="96" width="382" height="306" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="306" rx="2.5" fill="#2f6bff"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🔪  WHAT EACH ONE TAKES</text><rect x="532" y="154" width="346" height="46" rx="11" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".7"/><text x="546" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Lumpectomy</text><text x="546" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">the tumour and a margin; breast kept</text><circle cx="812" cy="168" r="5.5" fill="#12b886" fill-opacity=".85"/><circle cx="828" cy="168" r="5.5" fill="#12b886" fill-opacity=".85"/><circle cx="812" cy="184" r="5.5" fill="#12b886" fill-opacity=".85"/><circle cx="828" cy="184" r="5.5" fill="#12b886" fill-opacity=".85"/><rect x="532" y="210" width="346" height="46" rx="11" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".7"/><text x="546" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Sentinel node biopsy</text><text x="546" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">only the FIRST draining node</text><circle cx="812" cy="224" r="5.5" fill="none" stroke="#6a6f8f" stroke-width="2" stroke-dasharray="3 2"/><circle cx="828" cy="224" r="5.5" fill="#12b886" fill-opacity=".85"/><circle cx="812" cy="240" r="5.5" fill="#12b886" fill-opacity=".85"/><circle cx="828" cy="240" r="5.5" fill="#12b886" fill-opacity=".85"/><rect x="532" y="266" width="346" height="46" rx="11" fill="#ffc233" fill-opacity=".16" stroke="#ffc233" stroke-opacity=".7"/><text x="546" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Simple mastectomy</text><text x="546" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">the whole breast; nodes left alone</text><circle cx="812" cy="280" r="5.5" fill="#12b886" fill-opacity=".85"/><circle cx="828" cy="280" r="5.5" fill="#12b886" fill-opacity=".85"/><circle cx="812" cy="296" r="5.5" fill="#12b886" fill-opacity=".85"/><circle cx="828" cy="296" r="5.5" fill="#12b886" fill-opacity=".85"/><rect x="532" y="322" width="346" height="46" rx="11" fill="#ff3b6b" fill-opacity=".16" stroke="#ff3b6b" stroke-opacity=".7"/><text x="546" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Modified radical</text><text x="546" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">whole breast PLUS the axillary nodes</text><circle cx="812" cy="336" r="5.5" fill="none" stroke="#6a6f8f" stroke-width="2" stroke-dasharray="3 2"/><circle cx="828" cy="336" r="5.5" fill="none" stroke="#6a6f8f" stroke-width="2" stroke-dasharray="3 2"/><circle cx="812" cy="352" r="5.5" fill="none" stroke="#6a6f8f" stroke-width="2" stroke-dasharray="3 2"/><circle cx="828" cy="352" r="5.5" fill="none" stroke="#6a6f8f" stroke-width="2" stroke-dasharray="3 2"/><text x="532" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A sentinel biopsy takes one node — far less</text><text x="532" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">lymphoedema risk than clearing the axilla.</text><rect x="24" y="420" width="452" height="254" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="420" width="5" height="254" rx="2.5" fill="#12b886"/><text x="46" y="450" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  IMMEDIATELY AFTER SURGERY</text><text x="46" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Semi-Fowler's, affected arm ELEVATED on a pillow —</text><text x="46" y="499" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  above the level of the heart, so gravity drains it</text><text x="46" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Turn onto her back or the UNAFFECTED side.</text><text x="46" y="541" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  Never onto the operative side</text><text x="46" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Empty and record the drain; expect it for days</text><text x="46" y="583" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Hand and wrist exercises start early; shoulder</text><text x="46" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  exercises wait for the surgeon's go-ahead</text><text x="46" y="625" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Check the dressing AND underneath her — blood</text><text x="46" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  runs round to the back when she is lying down</text><text x="46" y="668" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><rect x="496" y="420" width="400" height="254" rx="14" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="420" width="5" height="254" rx="2.5" fill="#ff3b6b"/><text x="518" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  THAT ARM, FOR LIFE</text><text x="518" y="482" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No blood pressure cuff on it</text><text x="518" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No venipuncture, injections, IVs or finger sticks</text><text x="518" y="526" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No tight jewellery, watches or sleeves</text><text x="518" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No heavy lifting — usually nothing over 5 to 10 lb</text><text x="518" y="570" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Gloves for gardening and washing up</text><text x="518" y="592" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Insect repellent; treat any cut at once</text><text x="518" y="614" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Sunscreen, and no very hot baths</text><text x="518" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Electric razor for the underarm, never a blade</text><text x="518" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A limb-alert bracelet, so nobody does it for her.</text></svg>