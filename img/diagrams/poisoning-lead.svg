<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Poisoning and lead exposure</title><desc id="d">The first five actions in order, then the two reasons vomiting is never induced drawn out: a caustic burning the osophagus a second time on the way back up, and a petroleum product being aspirated into the lungs. Below, the antidotes, and lead exposure with its blood levels and where it comes from.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="720" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">CALL POISON CONTROL BEFORE YOU GIVE ANYTHING</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Toddlers explore by mouth, so poisoning peaks around age two. Take the container with you.</text><rect x="24" y="96" width="430" height="268" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="268" rx="2.5" fill="#12b886"/><text x="46" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🚨  THE FIRST ACTIONS, IN ORDER</text><circle cx="66" cy="158" r="11" fill="#12b886"/><text x="66" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">1</text><text x="88" y="159" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Assess the child — ABC first</text><text x="88" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">always, before the substance</text><circle cx="66" cy="196" r="11" fill="#12b886"/><text x="66" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">2</text><text x="88" y="197" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Remove what is left from her mouth</text><text x="88" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">do not make her swallow it</text><circle cx="66" cy="234" r="11" fill="#12b886"/><text x="66" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">3</text><text x="88" y="235" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Call Poison Control</text><text x="88" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">BEFORE giving anything at all</text><circle cx="66" cy="272" r="11" fill="#12b886"/><text x="66" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">4</text><text x="88" y="273" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Take the container with you</text><text x="88" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">the label changes the treatment</text><circle cx="66" cy="310" r="11" fill="#12b886"/><text x="66" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">5</text><text x="88" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">Treat as directed</text><text x="88" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">charcoal, antidote, or support</text><text x="46" y="354" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">A parent's description of what she drank is often wrong.</text><rect x="474" y="96" width="422" height="268" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="96" width="5" height="268" rx="2.5" fill="#ff3b6b"/><text x="492" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  NEVER INDUCE VOMITING</text><text x="492" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Ipecac is no longer recommended, and for these two it is dangerous:</text><rect x="492" y="162" width="180" height="128" rx="11" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".7"/><text x="582" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">CAUSTIC</text><text x="582" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">lye, drain cleaner</text><circle cx="548" cy="214" r="15" fill="#ffd9c2" fill-opacity=".5"/><path d="M552 228 v54" stroke="#e9c9b6" stroke-opacity=".6" stroke-width="11" stroke-linecap="round"/><path d="M570 270 L570 230" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="584" y="256" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">burns it a</text><text x="584" y="269" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">SECOND time</text><text x="584" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">on the way up</text><rect x="692" y="162" width="180" height="128" rx="11" fill="#ffc233" fill-opacity=".14" stroke="#ffc233" stroke-opacity=".7"/><text x="782" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">PETROLEUM</text><text x="782" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">petrol, polish</text><circle cx="748" cy="214" r="15" fill="#ffd9c2" fill-opacity=".5"/><path d="M752 228 v54" stroke="#e9c9b6" stroke-opacity=".6" stroke-width="11" stroke-linecap="round"/><path d="M734 232 v40" stroke="#9aa3d8" stroke-opacity=".6" stroke-width="8" stroke-linecap="round"/><path d="M750 266 L734 248" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="782" y="256" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">down the</text><text x="782" y="269" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">AIRWAY —</text><text x="782" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">pneumonitis</text><text x="492" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Charcoal binds many things but NOT caustics, alcohols, iron,</text><text x="492" y="332" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">lithium or petroleum — and it is useless once absorbed.</text><text x="492" y="354" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">It is also never given to a child who is not fully awake.</text><rect x="24" y="382" width="430" height="178" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="382" width="5" height="178" rx="2.5" fill="#2f6bff"/><text x="46" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">💊  THE ANTIDOTES WORTH KNOWING</text><text x="46" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Paracetamol / acetaminophen</text><text x="230" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">N-acetylcysteine — best within 8 h</text><text x="46" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Opioids</text><text x="230" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">naloxone</text><text x="46" y="480" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Iron</text><text x="230" y="480" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">deferoxamine</text><text x="46" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Benzodiazepines</text><text x="230" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">flumazenil</text><text x="46" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Organophosphates</text><text x="230" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">atropine + pralidoxime</text><text x="46" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Warfarin</text><text x="230" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">vitamin K</text><text x="46" y="556" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Iron tablets look exactly like sweets. Classic pediatric poisoning.</text><rect x="474" y="382" width="422" height="178" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="382" width="5" height="178" rx="2.5" fill="#ffc233"/><text x="492" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🧠  LEAD — IT DOES ITS DAMAGE SILENTLY</text><text x="492" y="436" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">There are usually NO symptoms until the damage is done.</text><text x="492" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Paint and dust in housing built before 1978</text><text x="492" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Soil, some imported pottery, old plumbing</text><text x="492" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Screen at 12 and 24 months where risk is high</text><text x="492" y="512" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Blood level 5 µg/dL or more prompts action;</text><text x="492" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">  chelation at higher levels (succimer, EDTA)</text><text x="492" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Iron and calcium in the diet reduce absorption</text><text x="492" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text></svg>