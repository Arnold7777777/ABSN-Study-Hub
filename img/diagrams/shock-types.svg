<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 820" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto">
<title id="t">The four kinds of shock, and what MODS is</title>
<desc id="d">Shock is any state where the tissues are not getting enough oxygen, and there are only three ways that happens: not enough fluid in the pipes, a pump that will not push, or pipes opened too wide. Hypovolemic is lost volume. Cardiogenic is a failing pump. Distributive, covering septic, anaphylactic and neurogenic, is dilated pipes. Obstructive is something physically blocking flow. The three stages are compensated, progressive and irreversible, and in the compensated stage the blood pressure is still normal. Multiple organ dysfunction syndrome is what shock becomes when two or more organ systems fail.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient></defs>
<style>
 text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
 .h1{font-weight:800;font-size:19px}
 .h2{font-weight:800;font-size:16px}
 .bd{font-size:15px}
 .sm{font-size:13.5px}
 .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
 .k{font-weight:800}
</style>
<rect width="920" height="820" rx="22" fill="url(#bg)"/>
<rect x="20" y="18" width="880" height="106" rx="14" fill="rgba(47,107,255,.20)" stroke="#2f6bff" stroke-width="2"/>
<text x="42" y="48" class="h1" fill="#bcd0ff">Shock is one problem: the tissues are not getting oxygen</text>
<text x="42" y="78" class="bd" fill="#e7e9ff">There are only three ways that happens. Every type below is one of these three.</text>
<text x="42" y="106" class="bd" fill="#ffd0dc"><tspan class="k" fill="#ffc233">Not enough fluid in the pipes</tspan> &#160;&#183;&#160; <tspan class="k" fill="#ffc233">a pump that will not push</tspan> &#160;&#183;&#160; <tspan class="k" fill="#ffc233">pipes opened too wide</tspan></text>

<g transform="translate(20,142)">
 <rect x="0" y="0" width="212" height="252" rx="14" fill="rgba(255,59,107,.22)" stroke="#ff3b6b" stroke-width="2"/>
 <text x="18" y="32" class="h2" fill="#ff8fa3">HYPOVOLEMIC</text>
 <text x="18" y="54" class="sm" fill="#ffd0dc">not enough fluid</text>
 <rect x="18" y="68" width="170" height="28" rx="8" fill="#3a2a44" stroke="#ff8fa3" stroke-width="1.5"/>
 <rect x="20" y="70" width="56" height="24" rx="7" fill="#ff3b6b"/>
 <text x="18" y="130" class="bd" fill="#ffd0dc">Bleeding, burns, vomiting,</text>
 <text x="18" y="152" class="bd" fill="#ffd0dc">diarrhea, third spacing.</text>
 <text x="18" y="190" class="bd k" fill="#ffc233">Give volume.</text>
 <text x="18" y="214" class="sm" fill="#ffd0dc">Isotonic fluid, then blood</text>
 <text x="18" y="234" class="sm" fill="#ffd0dc">if the loss was blood.</text>

 <rect x="228" y="0" width="212" height="252" rx="14" fill="rgba(157,92,255,.24)" stroke="#9d5cff" stroke-width="2"/>
 <text x="246" y="32" class="h2" fill="#d3b8ff">CARDIOGENIC</text>
 <text x="246" y="54" class="sm" fill="#e0d0ff">the pump has failed</text>
 <path d="M274 100 C274 86 254 86 254 100 C254 112 274 124 274 124 C274 124 294 112 294 100 C294 86 274 86 274 100 Z" fill="#9d5cff" stroke="#d3b8ff" stroke-width="2"/>
 <path d="M310 110 h56" stroke="#d3b8ff" stroke-width="3" stroke-dasharray="5 5"/>
 <text x="246" y="152" class="bd" fill="#e0d0ff">Big MI, cardiomyopathy,</text>
 <text x="246" y="174" class="bd" fill="#e0d0ff">arrhythmia, valve failure.</text>
 <text x="246" y="206" class="bd k" fill="#ffc233">Help the pump.</text>
 <text x="246" y="230" class="sm" fill="#e0d0ff">Inotropes &#8212; not fluid.</text>

 <rect x="456" y="0" width="212" height="252" rx="14" fill="rgba(255,138,61,.24)" stroke="#ff8a3d" stroke-width="2"/>
 <text x="474" y="32" class="h2" fill="#ffab73">DISTRIBUTIVE</text>
 <text x="474" y="54" class="sm" fill="#ffd9bd">the pipes opened up</text>
 <rect x="474" y="72" width="170" height="16" rx="8" fill="#5a3a24" stroke="#ffab73" stroke-width="1.5"/>
 <rect x="474" y="66" width="170" height="28" rx="14" fill="none" stroke="#ff8a3d" stroke-width="2" stroke-dasharray="6 4"/>
 <text x="474" y="132" class="bd" fill="#ffd9bd"><tspan class="k" fill="#ffc233">Septic</tspan> &#8212; infection</text>
 <text x="474" y="156" class="bd" fill="#ffd9bd"><tspan class="k" fill="#ffc233">Anaphylactic</tspan> &#8212; allergy</text>
 <text x="474" y="180" class="bd" fill="#ffd9bd"><tspan class="k" fill="#ffc233">Neurogenic</tspan> &#8212; cord injury</text>
 <text x="474" y="212" class="bd k" fill="#ffc233">Fill, then squeeze.</text>
 <text x="474" y="234" class="sm" fill="#ffd9bd">Fluid first, then vasopressors.</text>

 <rect x="684" y="0" width="196" height="252" rx="14" fill="rgba(0,194,199,.20)" stroke="#00c2c7" stroke-width="2"/>
 <text x="702" y="32" class="h2" fill="#7ff0f2">OBSTRUCTIVE</text>
 <text x="702" y="54" class="sm" fill="#c7f0e2">something is in the way</text>
 <rect x="702" y="72" width="156" height="16" rx="8" fill="#0d3f45" stroke="#7ff0f2" stroke-width="1.5"/>
 <rect x="766" y="66" width="16" height="28" rx="4" fill="#ff3b6b"/>
 <text x="702" y="132" class="bd" fill="#c7f0e2">Tension pneumothorax,</text>
 <text x="702" y="156" class="bd" fill="#c7f0e2">cardiac tamponade,</text>
 <text x="702" y="180" class="bd" fill="#c7f0e2">massive PE.</text>
 <text x="702" y="212" class="bd k" fill="#ffc233">Remove the block.</text>
 <text x="702" y="234" class="sm" fill="#c7f0e2">Fluid alone will not fix it.</text>
</g>

<rect x="20" y="410" width="880" height="158" rx="16" fill="rgba(255,194,51,.18)" stroke="#ffc233" stroke-width="2"/>
<text x="42" y="440" class="h2" fill="#ffc233">THE THREE STAGES &#8212; AND WHY THE FIRST ONE IS EASY TO MISS</text>
<g transform="translate(42,456)">
 <rect x="0" y="0" width="196" height="48" rx="10" fill="rgba(18,184,134,.34)" stroke="#12b886" stroke-width="2"/>
 <text x="16" y="20" class="bd k" fill="#5aebb4">1 &#183; Compensated</text>
 <text x="16" y="38" class="sm" fill="#c7f0e2">BP still normal</text>
 <rect x="210" y="0" width="196" height="48" rx="10" fill="rgba(255,194,51,.30)" stroke="#ffc233" stroke-width="2"/>
 <text x="226" y="20" class="bd k" fill="#ffc233">2 &#183; Progressive</text>
 <text x="226" y="38" class="sm" fill="#ffeec2">BP falling, organs hurting</text>
 <rect x="420" y="0" width="196" height="48" rx="10" fill="rgba(255,59,107,.30)" stroke="#ff3b6b" stroke-width="2"/>
 <text x="436" y="20" class="bd k" fill="#ff8fa3">3 &#183; Irreversible</text>
 <text x="436" y="38" class="sm" fill="#ffd0dc">damage is permanent</text>
 <text x="634" y="20" class="bd" fill="#e7e9ff">Catching stage 1 is</text>
 <text x="634" y="40" class="bd k" fill="#ffc233">the whole job.</text>
</g>
<text x="42" y="544" class="bd" fill="#ffeec2"><tspan class="k">In stage 1 the blood pressure is normal.</tspan> Watch heart rate, urine output, mental status and lactate instead.</text>

<rect x="20" y="584" width="880" height="216" rx="16" fill="rgba(255,59,107,.20)" stroke="#ff3b6b" stroke-width="2"/>
<text x="42" y="614" class="h2" fill="#ff8fa3">MODS &#8212; MULTIPLE ORGAN DYSFUNCTION SYNDROME</text>
<text x="42" y="644" class="bd" fill="#ffd0dc">What shock becomes if it is not stopped: <tspan class="k" fill="#ffc233">two or more organ systems failing at once</tspan>.</text>
<g transform="translate(42,662)" class="sm" fill="#ffffff">
 <rect x="0" y="0" width="130" height="44" rx="9" fill="rgba(47,107,255,.4)" stroke="#2f6bff" stroke-width="1.5"/>
 <text x="14" y="19" class="k">Lungs</text><text x="14" y="35">ARDS</text>
 <rect x="142" y="0" width="130" height="44" rx="9" fill="rgba(18,184,134,.4)" stroke="#12b886" stroke-width="1.5"/>
 <text x="156" y="19" class="k">Kidneys</text><text x="156" y="35">urine drops</text>
 <rect x="284" y="0" width="130" height="44" rx="9" fill="rgba(255,194,51,.4)" stroke="#ffc233" stroke-width="1.5"/>
 <text x="298" y="19" class="k">Liver</text><text x="298" y="35">enzymes rise</text>
 <rect x="426" y="0" width="140" height="44" rx="9" fill="rgba(157,92,255,.4)" stroke="#9d5cff" stroke-width="1.5"/>
 <text x="440" y="19" class="k">Blood</text><text x="440" y="35">DIC, platelets fall</text>
 <rect x="578" y="0" width="130" height="44" rx="9" fill="rgba(0,194,199,.4)" stroke="#00c2c7" stroke-width="1.5"/>
 <text x="592" y="19" class="k">Brain</text><text x="592" y="35">confusion</text>
 <rect x="720" y="0" width="118" height="44" rx="9" fill="rgba(255,59,107,.4)" stroke="#ff3b6b" stroke-width="1.5"/>
 <text x="734" y="19" class="k">Gut</text><text x="734" y="35">ileus, bleeding</text>
</g>
<text x="42" y="748" class="bd" fill="#ffd0dc">Mortality climbs with every organ that joins in. There is no treatment for MODS itself &#8212;</text>
<text x="42" y="776" class="bd k" fill="#ffc233">you treat the shock that caused it, early, before it ever gets here.</text>
</svg>
