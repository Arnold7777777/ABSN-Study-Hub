<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Reye syndrome</title><desc id="d">The chain from a viral illness plus aspirin to a swollen liver and brain, with the staged signs and the one rule that prevents it.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="540" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">REYE SYNDROME — WHY CHILDREN DO NOT GET ASPIRIN</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A viral illness plus aspirin, then the liver and the brain swell together. It is preventable.</text><rect x="24" y="92" width="852" height="176" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="176" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">THE CHAIN</text><circle cx="118" cy="188" r="34" fill="#2f6bff" fill-opacity=".78"/><path d="M152 188 l9 0" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/><path d="M142 212 l6 6" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/><path d="M118 222 l0 9" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/><path d="M94 212 l-6 6" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/><path d="M84 188 l-9 0" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/><path d="M94 164 l-6 -6" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/><path d="M118 154 l-0 -9" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/><path d="M142 164 l6 -6" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/><text x="118" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" fill="#fff" fill-opacity="1" text-anchor="middle">🦠</text><text x="118" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">Viral illness</text><text x="118" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">flu or chickenpox</text><path d="M160 188 L218 188" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><rect x="228" y="160" width="76" height="56" rx="26" fill="#f6f2ff" fill-opacity=".95"/><path d="M266 166 l0 44" stroke="#b9b2cf" stroke-width="2"/><text x="266" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#2a1b46" fill-opacity="1" text-anchor="middle">ASA</text><text x="266" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">Aspirin given</text><text x="266" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">for the fever</text><path d="M316 188 L374 188" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><ellipse cx="424" cy="188" rx="42" ry="27" fill="#ff8a3d" fill-opacity=".65"/><path d="M392 188 q10 -12 20 0 q10 12 20 0 q10 -12 20 0" fill="none" stroke="#2a1b06" stroke-width="2.6"/><text x="424" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">Mitochondria fail</text><text x="424" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">ammonia builds up</text><path d="M474 188 L532 188" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><path d="M556 166 q46 -12 74 6 q10 26 -14 38 q-34 14 -58 -4 q-14 -18 -2 -40z" fill="#c02255" fill-opacity=".8"/><text x="596" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="middle">Fatty liver</text><text x="596" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">AST, ALT, ammonia ↑</text><path d="M646 188 L704 188" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><path d="M724 190 q0 -30 30 -30 q30 0 30 30 q0 26 -30 26 q-30 0 -30 -26z" fill="#ff3b6b" fill-opacity=".8"/><path d="M754 162 l0 54 M736 172 q18 8 36 0 M736 200 q18 -8 36 0" fill="none" stroke="#3a0a18" stroke-width="2" stroke-opacity=".7"/><text x="754" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">Brain swells</text><text x="754" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">cerebral odema</text><rect x="24" y="284" width="528" height="172" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="284" width="5" height="172" rx="2.5" fill="#ffc233"/><text x="44" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ HOW IT SHOWS UP — IN THIS ORDER</text><rect x="46" y="325" width="66" height="21" rx="10" fill="#ffc233" fill-opacity=".9"/><text x="79" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">Stage I</text><text x="122" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Relentless vomiting, lethargy</text><rect x="46" y="353" width="66" height="21" rx="10" fill="#ffc233" fill-opacity=".9"/><text x="79" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">Stage II</text><text x="122" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Confusion, combative, hyperventilating</text><rect x="46" y="381" width="66" height="21" rx="10" fill="#ffc233" fill-opacity=".9"/><text x="79" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">Stage III</text><text x="122" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Unresponsive, decorticate posturing</text><rect x="46" y="409" width="66" height="21" rx="10" fill="#ffc233" fill-opacity=".9"/><text x="79" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">Stage IV</text><text x="122" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Decerebrate, fixed pupils, coma</text><text x="46" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">The vomiting that will not stop is the early flag.</text><rect x="568" y="284" width="308" height="172" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="568" y="284" width="5" height="172" rx="2.5" fill="#12b886"/><text x="588" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅ THE RULE</text><text x="588" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="900" fill="#fff" fill-opacity="1" text-anchor="start">No aspirin under 19</text><circle cx="590" cy="361.5" r="2.6" fill="#bff3e2"/><text x="600" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Acetaminophen or ibuprofen instead.</text><circle cx="590" cy="379.5" r="2.6" fill="#bff3e2"/><text x="600" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Check labels — Pepto-Bismol has salicylate.</text><circle cx="590" cy="397.5" r="2.6" fill="#bff3e2"/><text x="600" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Kawasaki disease is the one exception,</text><circle cx="590" cy="415.5" r="2.6" fill="#bff3e2"/><text x="600" y="420" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">and only with a specialist directing it.</text><rect x="24" y="472" width="852" height="50" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="472" width="5" height="50" rx="2.5" fill="#ff3b6b"/><text x="44" y="495" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">🚨 Ask about aspirin in any child with a virus who starts vomiting</text><text x="44" y="513" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">and will not stop. That question is the diagnosis.</text></svg>