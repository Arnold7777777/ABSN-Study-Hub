<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 728" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Preterm labour</title><desc id="d">A 48-hour bar showing the tocolytic holding the birth off while the steroid works on the foetal lungs underneath it - one buys the time and the other spends it. Beside it what counts as preterm labour, and magnesium given here for a different reason than in preeclampsia. Below, the warning signs to teach.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="728" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ffc233" fill-opacity=".22" stroke="#ffc233" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ffc233"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ffc233">ONE DRUG BUYS 48 HOURS. THE OTHER SPENDS THEM.</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Contractions alone are not preterm labour — the cervix has to be changing.</text><rect x="24" y="96" width="872" height="236" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="236" rx="2.5" fill="#ffc233"/><text x="46" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⏱️  WHY 48 HOURS, AND NOT SOME OTHER NUMBER</text><rect x="60" y="158" width="800" height="40" rx="12" fill="#2f6bff" fill-opacity=".30" stroke="#2f6bff" stroke-opacity=".85"/><text x="460.0" y="183" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">TOCOLYTIC — holds the birth off for about 48 hours</text><text x="68" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">nifedipine · indomethacin · terbutaline</text><rect x="60" y="234" width="800" height="40" rx="12" fill="#12b886" fill-opacity=".30" stroke="#12b886" stroke-opacity=".85"/><text x="460.0" y="259" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">CORTICOSTEROID — matures the foetal lungs in that window</text><text x="68" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">betamethasone · dexamethasone — and 48 hours is exactly how long they need to work</text><path d="M862 178 L862 230" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="46" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">The tocolytic exists to create the window. It is not treating the labour — it is buying time for the steroid.</text><rect x="24" y="352" width="452" height="180" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="352" width="5" height="180" rx="2.5" fill="#2f6bff"/><text x="46" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🧬  WHAT ACTUALLY COUNTS</text><text x="46" y="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Regular contractions WITH cervical change,</text><text x="46" y="428" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#c3d2ff" fill-opacity="1" text-anchor="start">before 37 weeks. Contractions alone are not it.</text><text x="46" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">RISK FACTORS</text><text x="46" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· a previous preterm birth — the strongest predictor</text><text x="46" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· infection: UTI, bacterial vaginosis, chorioamnionitis</text><text x="46" y="512" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· multiple gestation; a short cervix; PROM</text><text x="46" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">An untreated UTI is a PREVENTABLE cause.</text><rect x="496" y="352" width="400" height="180" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="352" width="5" height="180" rx="2.5" fill="#ff3b6b"/><text x="518" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">💉  MAGNESIUM HERE IS FOR SOMETHING ELSE</text><text x="518" y="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Before about 32 weeks, magnesium is given for</text><text x="518" y="428" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">FOETAL NEUROPROTECTION — it lowers the risk</text><text x="518" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">of cerebral palsy.</text><text x="518" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Same drug, same monitoring — REFLEXES first,</text><text x="518" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">then respirations, then urine output, with</text><text x="518" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">calcium gluconate at the bedside.</text><text x="518" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">In preeclampsia the same drug prevents seizures.</text><rect x="24" y="552" width="872" height="140" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="552" width="5" height="140" rx="2.5" fill="#12b886"/><text x="46" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">👀  TEACH HER TO REPORT ANY OF THESE</text><text x="46" y="612" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· more than 4–6 contractions an hour</text><text x="336" y="612" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· low dull backache that comes and goes</text><text x="626" y="612" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· pelvic pressure — like it is pushing down</text><text x="46" y="634" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· a change in discharge: more, watery, or bloody</text><text x="336" y="634" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· menstrual-like cramping; abdominal tightening</text><text x="626" y="634" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· any gush or trickle of fluid</text><text x="46" y="660" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Women dismiss backache and pressure as normal pregnancy. Teaching the difference is what</text><text x="46" y="678" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">gets them in early enough for the steroid to work.</text></svg>