<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-label="A neuron drawn left to right: dendrites receiving, cell body, myelinated axon, axon terminals. Beneath it the five steps from nerve impulse to muscle contraction."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="368" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">ONE NEURON, LEFT TO RIGHT</text><line x1="82" y1="96" x2="40" y2="51" stroke="#9d5cff" stroke-width="4"/><line x1="82" y1="96" x2="40" y2="66" stroke="#9d5cff" stroke-width="4"/><line x1="82" y1="96" x2="40" y2="81" stroke="#9d5cff" stroke-width="4"/><line x1="82" y1="96" x2="40" y2="96" stroke="#9d5cff" stroke-width="4"/><line x1="82" y1="96" x2="40" y2="111" stroke="#9d5cff" stroke-width="4"/><line x1="82" y1="96" x2="40" y2="126" stroke="#9d5cff" stroke-width="4"/><line x1="82" y1="96" x2="40" y2="141" stroke="#9d5cff" stroke-width="4"/><circle cx="104" cy="96" r="26" fill="#9d5cff" stroke="#e2d2ff" stroke-width="3"/><circle cx="104" cy="96" r="10" fill="#5b2ea8"/><line x1="130" y1="96" x2="470" y2="96" stroke="#ffd76a" stroke-width="7"/><rect x="150" y="83" width="46" height="26" rx="12" fill="#ffc233" stroke="#fff6d6" stroke-width="2"/><rect x="214" y="83" width="46" height="26" rx="12" fill="#ffc233" stroke="#fff6d6" stroke-width="2"/><rect x="278" y="83" width="46" height="26" rx="12" fill="#ffc233" stroke="#fff6d6" stroke-width="2"/><rect x="342" y="83" width="46" height="26" rx="12" fill="#ffc233" stroke="#fff6d6" stroke-width="2"/><rect x="406" y="83" width="46" height="26" rx="12" fill="#ffc233" stroke="#fff6d6" stroke-width="2"/><line x1="470" y1="96" x2="512" y2="68" stroke="#12b886" stroke-width="4"/><circle cx="514" cy="68" r="5" fill="#a5f3d4"/><line x1="470" y1="96" x2="512" y2="82" stroke="#12b886" stroke-width="4"/><circle cx="514" cy="82" r="5" fill="#a5f3d4"/><line x1="470" y1="96" x2="512" y2="96" stroke="#12b886" stroke-width="4"/><circle cx="514" cy="96" r="5" fill="#a5f3d4"/><line x1="470" y1="96" x2="512" y2="110" stroke="#12b886" stroke-width="4"/><circle cx="514" cy="110" r="5" fill="#a5f3d4"/><line x1="470" y1="96" x2="512" y2="124" stroke="#12b886" stroke-width="4"/><circle cx="514" cy="124" r="5" fill="#a5f3d4"/><text x="66" y="152" font-size="19" font-weight="800" fill="#c9b3ff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Dendrites</text><text x="66" y="172" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">receive</text><text x="320" y="50" font-size="19" font-weight="800" fill="#ffe9b8" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Myelinated axon</text><text x="104" y="50" font-size="19" font-weight="800" fill="#c9b3ff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Soma</text><text x="578" y="152" font-size="19" font-weight="800" fill="#a5f3d4" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Terminals</text><text x="578" y="172" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">release</text><text x="360" y="200" font-size="17" font-weight="800" fill="#ffe9b8" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">The myelin insulates the axon and speeds the signal</text><text x="24" y="238" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">NERVE TO MOVEMENT</text><rect x="24" y="252" width="336" height="46" rx="9" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width=