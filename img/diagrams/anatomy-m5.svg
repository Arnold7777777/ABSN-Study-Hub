e="#ffd76a" stroke-width="2.4" marker-end="url(#ah)"/><rect x="368" y="310" width="336" height="46" rx="9" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/><circle cx="390" cy="333" r="13" fill="#ffd76a"/><text x="390" y="339" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">2</text><text x="412" y="330" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Ca&#178;&#8314; leaves the SR</text><text x="412" y="350" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">the muscle contracts</text></svg>