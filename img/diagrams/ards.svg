<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">ARDS</title><desc id="d">One alveolus drawn healthy and the same alveolus in ARDS: the membrane leaking, the sac full of protein-rich fluid, surfactant gone and the sac collapsed, with blood running past and picking up no oxygen. That is a shunt, and it is why adding oxygen does not work. Beside it the chest film, and below the ventilator settings and prone positioning.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="740" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">REFRACTORY MEANS THE OXYGEN DOES NOT WORK</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Blood cannot pick up oxygen from an alveolus that is full of fluid, however rich the gas above it.</text><rect x="24" y="96" width="620" height="344" rx="14" fill="#2f6bff" fill-opacity=".13" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="344" rx="2.5" fill="#2f6bff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🫁  ONE ALVEOLUS, BEFORE AND AFTER</text><rect x="46" y="140" width="290" height="244" rx="13" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".72"/><text x="191" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">HEALTHY</text><circle cx="154" cy="248" r="46" fill="#dfe9ff" fill-opacity=".16" stroke="#12b886" stroke-width="4"/><text x="154" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#dfe9ff" fill-opacity="1" text-anchor="middle">AIR</text><path d="M102 254 a52 52 0 0 0 104 0" fill="none" stroke="#ff4d6d" stroke-width="9" stroke-linecap="round"/><text x="154" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">blood leaves LOADED</text><rect x="354" y="140" width="290" height="244" rx="13" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".72"/><text x="499" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">ARDS</text><circle cx="462" cy="248" r="46" fill="#3a4a7a" fill-opacity=".85" stroke="#ff3b6b" stroke-width="4" stroke-dasharray="8 5"/><text x="462" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#dfe9ff" fill-opacity="1" text-anchor="middle">FULL OF</text><text x="462" y="257" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#dfe9ff" fill-opacity="1" text-anchor="middle">FLUID</text><ellipse cx="538" cy="210" rx="20" ry="9" fill="#3a4a7a" fill-opacity=".8" stroke="#ff3b6b" stroke-width="2.5"/><text x="538" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">collapsed —</text><text x="538" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">no surfactant</text><path d="M410 254 a52 52 0 0 0 104 0" fill="none" stroke="#4d7dff" stroke-width="9" stroke-linecap="round"/><text x="462" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">blood leaves EMPTY</text><path d="M336 246 L352 246" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="46" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Blood flowing past a fluid-filled sac picks up nothing.</text><text x="46" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">That is a SHUNT — and you cannot oxygenate your way out of one.</text><rect x="660" y="96" width="236" height="344" rx="14" fill="#9d5cff" fill-opacity=".14" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="660" y="96" width="5" height="344" rx="2.5" fill="#9d5cff"/><text x="778.0" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="middle">THE FILM</text><rect x="690" y="144" width="176" height="150" rx="10" fill="#0b0716" fill-opacity=".85" stroke="#cfd4ff" stroke-opacity=".3" stroke-width="2"/><path d="M768 162 q-26 8 -40 62 q-4 46 --30 52 q--16 -40 --10 -114 z" fill="#dfe9ff" fill-opacity=".55"/><path d="M788 162 q26 8 40 62 q4 46 -30 52 q-16 -40 -10 -114 z" fill="#dfe9ff" fill-opacity=".55"/><rect x="771" y="162" width="14" height="120" rx="5" fill="#8a90b8" fill-opacity=".6"/><text x="778" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="middle">WHITE-OUT</text><text x="678" y="332" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">Bilateral infiltrates, both</text><text x="678" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="start">lungs, appearing quickly.</text><text x="678" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Wedge pressure NORMAL —</text><text x="678" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">this is not fluid overload.</text><rect x="24" y="458" width="452" height="258" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="458" width="5" height="258" rx="2.5" fill="#ff3b6b"/><text x="46" y="488" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🧨  HOW A NORMAL LUNG BECOMES ARDS</text><text x="46" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">An insult — sepsis is the commonest — sets off a</text><text x="46" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">systemic inflammatory response.</text><text x="46" y="556" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">The alveolar–capillary membrane turns leaky.</text><text x="46" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Protein-rich fluid pours into the alveoli.</text><text x="46" y="596" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Surfactant is destroyed, so sacs collapse and</text><text x="46" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">will not reopen.</text><text x="46" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">Blood runs past collapsed, flooded sacs and picks</text><text x="46" y="656" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">up no oxygen. Days later the lung fibroses and stiffens.</text><text x="46" y="690" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Sets it off: sepsis · aspiration · near-drowning · trauma ·</text><text x="46" y="706" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">pancreatitis · multiple transfusions · inhalation injury.</text><rect x="496" y="458" width="400" height="258" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="458" width="5" height="258" rx="2.5" fill="#12b886"/><text x="518" y="488" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  WHAT ACTUALLY HELPS</text><text x="518" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">LOW tidal volume  4–6 mL/kg</text><text x="518" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">Small breaths, because big ones tear an</text><text x="518" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">already injured lung.</text><text x="518" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">PEEP</text><text x="518" y="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">Holds the collapsed sacs open between</text><text x="518" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">breaths. Watch the BP — it drops venous return.</text><text x="518" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">PRONE positioning</text><text x="518" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">Face down opens the dependent lung behind</text><text x="518" y="680" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">the heart. It improves survival.</text><text x="518" y="706" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Treat the cause. The vent only buys time.</text></svg>