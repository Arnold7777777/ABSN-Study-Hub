<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Umbilical cord prolapse</title><desc id="d">The birth canal in cross-section with the fetal head descending and the cord trapped and flattened between the head and the pelvic wall, and a gloved hand lifting the head off it. Beside it the actions in order and the things that are never done. Below, the knee-chest and Trendelenburg positions drawn out.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="690" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">UMBILICAL CORD PROLAPSE — YOUR HAND GOES IN AND STAYS IN</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">The cord is squeezed between the baby and the pelvis. This is counted in minutes.</text><rect x="24" y="96" width="430" height="356" rx="14" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="356" rx="2.5" fill="#ff3b6b"/><path d="M88 136 C92 216 140 274 150 354 L234 354 C244 274 292 216 296 136 Z" fill="#f4b9c6" fill-opacity=".10"/><path d="M88 136 C92 216 140 274 150 354" fill="none" stroke="#cbb8a0" stroke-opacity=".85" stroke-width="9" stroke-linecap="round"/><path d="M296 136 C292 216 244 274 234 354" fill="none" stroke="#cbb8a0" stroke-opacity=".85" stroke-width="9" stroke-linecap="round"/><text x="58" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#e6d8c4" fill-opacity="1" text-anchor="start">pelvis</text><circle cx="192" cy="252" r="56" fill="#ffd9c2" fill-opacity=".55" stroke="#ffd9c2" stroke-opacity=".85" stroke-width="2.5"/><text x="192" y="257" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#5b3a22" fill-opacity="1" text-anchor="middle">baby</text><path d="M256.0 140.0 L257.3 144.8 L258.6 149.6 L259.8 154.4 L260.9 159.2 L261.9 164.0 L262.7 168.8 L263.4 173.5 L263.8 178.3 L264.0 183.1 L264.0 187.9 L263.7 192.7 L263.3 197.5 L262.6 202.3 L261.8 207.1 L256.0 211.9 L256.0 216.7 L256.0 221.5 L256.0 226.2 L256.0 231.0 L256.0 235.8 L256.0 240.6 L256.0 245.4 L256.0 250.2 L256.0 255.0 L256.0 259.8 L256.0 264.6 L256.0 269.4 L256.0 274.2 L248.1 279.0 L248.3 283.8 L248.8 288.5 L249.5 293.3 L250.4 298.1 L251.4 302.9 L252.5 307.7 L253.8 312.5 L255.1 317.3 L256.4 322.1 L257.7 326.9 L259.0 331.7 L260.2 336.5 L261.3 341.2 L262.2 346.0 L262.9 350.8 L263.5 355.6 L263.9 360.4 L264.0 365.2 L263.9 370.0" fill="none" stroke="#ffc233" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M256.0 211.9 L256.0 216.7 L256.0 221.5 L256.0 226.2 L256.0 231.0 L256.0 235.8 L256.0 240.6 L256.0 245.4 L256.0 250.2 L256.0 255.0 L256.0 259.8 L256.0 264.6 L256.0 269.4 L256.0 274.2" fill="none" stroke="#ff3b6b" stroke-width="3.5" stroke-linecap="round"/><text x="274" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">cord slipped down</text><text x="274" y="179" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">ahead of the baby</text><text x="274" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">FLATTENED here —</text><text x="274" y="269" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">blood flow stops</text><path d="M170 370 q-30 -6 -30 -28 q0 -20 22 -20 h60 q22 0 22 20 q0 22 -30 28 Z" fill="#7ce0ff" fill-opacity=".5" stroke="#7ce0ff" stroke-opacity=".95" stroke-width="2.4"/><path d="M192 358 L192 318" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="44" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#bfeaff" fill-opacity="1" text-anchor="start">Your gloved hand lifts the head OFF the cord</text><text x="44" y="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#bfeaff" fill-opacity="1" text-anchor="start">and does not come out — not to call, not in the lift.</text><text x="44" y="433" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">The first action after ANY rupture of membranes</text><text x="44" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">is the fetal heart rate. Not the pad, not the color.</text><rect x="474" y="96" width="422" height="178" rx="14" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="96" width="5" height="178" rx="2.5" fill="#12b886"/><text x="492" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  ACT — DO NOT INVESTIGATE</text><circle cx="504" cy="148" r="9" fill="#12b886"/><text x="504" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#08301f" fill-opacity="1" text-anchor="middle">1</text><text x="520" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">Press the emergency bell. Call for help.</text><circle cx="504" cy="172" r="9" fill="#12b886"/><text x="504" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#08301f" fill-opacity="1" text-anchor="middle">2</text><text x="520" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">Gloved hand lifts the presenting part off the cord.</text><circle cx="504" cy="196" r="9" fill="#12b886"/><text x="504" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#08301f" fill-opacity="1" text-anchor="middle">3</text><text x="520" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">Knee-chest or Trendelenburg.</text><circle cx="504" cy="220" r="9" fill="#12b886"/><text x="504" y="224" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#08301f" fill-opacity="1" text-anchor="middle">4</text><text x="520" y="224" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">Oxygen 8–10 L. Stop the oxytocin.</text><circle cx="504" cy="244" r="9" fill="#12b886"/><text x="504" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#08301f" fill-opacity="1" text-anchor="middle">5</text><text x="520" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">Prepare for immediate cesarean.</text><rect x="474" y="288" width="422" height="118" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="288" width="5" height="118" rx="2.5" fill="#ff3b6b"/><text x="492" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  THE ABSOLUTE NEVERS</text><text x="504" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Never push the cord back in  —  it causes vasospasm</text><text x="504" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Never leave her to go and call  —  use the bell</text><text x="504" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Never take your hand out  —  until the team takes over</text><rect x="474" y="418" width="422" height="34" rx="14" fill="#ffc233" fill-opacity=".20" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="418" width="5" height="34" rx="2.5" fill="#ffc233"/><text x="492" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">Cord outside the body → sterile saline gauze. Never replace it.</text><rect x="24" y="470" width="872" height="198" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="470" width="5" height="198" rx="2.5" fill="#2f6bff"/><text x="46" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🧠  WHY THESE TWO POSITIONS — GRAVITY TAKES THE WEIGHT OFF</text><path d="M58 632 H264" stroke="#8e96c8" stroke-width="4" stroke-linecap="round"/><path d="M102 622 Q162 574 208 584" fill="none" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="17" stroke-linecap="round"/><circle cx="86" cy="618" r="15" fill="#ffd9c2" fill-opacity=".55" stroke="#ffd9c2" stroke-opacity=".85" stroke-width="2"/><circle cx="210" cy="586" r="17" fill="#ffd9c2" fill-opacity=".62"/><path d="M212 590 L230 618 L198 628" fill="none" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 558 L210 530" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="160" y="526" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">KNEE–CHEST</text><text x="160" y="656" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c3d2ff" fill-opacity="1" text-anchor="middle">Hips above the heart</text><path d="M320 628 L526 578" stroke="#8e96c8" stroke-width="4" stroke-linecap="round"/><path d="M366 614 L490 584" fill="none" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="17" stroke-linecap="round"/><circle cx="350" cy="618" r="15" fill="#ffd9c2" fill-opacity=".55" stroke="#ffd9c2" stroke-opacity=".85" stroke-width="2"/><path d="M512 582 V636 M336 626 V636" stroke="#8e96c8" stroke-width="3.5" stroke-linecap="round"/><path d="M490 560 L490 532" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="422" y="526" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">TRENDELENBURG</text><text x="422" y="656" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c3d2ff" fill-opacity="1" text-anchor="middle">Whole bed tilted head-down</text><text x="590" y="532" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">Both do one job: take the baby's weight</text><text x="590" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">off the cord, and keep it off until the</text><text x="590" y="572" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">cesarean starts.</text><text x="590" y="612" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Variable decelerations mean cord</text><text x="590" y="632" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">compression — VEAL CHOP. A prolapse</text><text x="590" y="652" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">is the extreme form of it.</text></svg>