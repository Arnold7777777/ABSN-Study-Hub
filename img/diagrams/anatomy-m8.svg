<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="A body outline with the endocrine glands marked in place: pituitary and hypothalamus in the head, thyroid and parathyroids in the neck, adrenals on the kidneys, the pancreas, and the gonads. Beside it, the difference between endocrine and exocrine glands."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="326" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">WHERE THE GLANDS SIT</text><circle cx="150" cy="76" r="30" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><path d="M108 116 q 42 -12 84 0 l 14 96 q -56 16 -112 0 z" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><path d="M118 216 l 12 92 M182 216 l -12 92" stroke="rgba(255,255,255,.5)" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="150" cy="72" r="9" fill="#9d5cff" stroke="#fff" stroke-width="2"/><line x1="292" y1="59" x2="150" y2="72" stroke="#9d5cff" stroke-width="1.8"/><circle cx="150" cy="72" r="3.4" fill="#9d5cff"/><circle cx="300" cy="59" r="6" fill="#9d5cff"/><text x="314" y="64" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Pituitary + hypothalamus</text><circle cx="150" cy="124" r="9" fill="#00c2c7" stroke="#fff" stroke-width="2"/><line x1="292" y1="105" x2="150" y2="124" stroke="#00c2c7" stroke-width="1.8"/><circle cx="150" cy="124" r="3.4" fill="#00c2c7"/><circle cx="300" cy="105" r="6" fill="#00c2c7"/><text x="314" y="110" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Thyroid + parathyroids</text><circle cx="124" cy="178" r="9" fill="#ffc233" stroke="#fff" stroke-width="2"/><line x1="292" y1="151" x2="124" y2="178" stroke="#ffc233" stroke-width="1.8"/><circle cx="124" cy="178" r="3.4" fill="#ffc233"/><circle cx="300" cy="151" r="6" fill="#ffc233"/><text x="314" y="156" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Adrenals on the kidneys</text><circle cx="166" cy="192" r="9" fill="#12b886" stroke="#fff" stroke-width="2"/><line x1="292" y1="197" x2="166" y2="192" stroke="#12b886" stroke-width="1.8"/><circle cx="166" cy="192" r="3.4" fill="#12b886"/><circle cx="300" cy="197" r="6" fill="#12b886"/><text x="314" y="202" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Pancreas</text><circle cx="150" cy="212" r="9" fill="#ff3b6b" stroke="#fff" stroke-width="2"/><line x1="292" y1="243" x2="150" y2="212" stroke="#ff3b6b" stroke-width="1.8"/><circle cx="150" cy="212" r="3.4" fill="#ff3b6b"/><circle cx="300" cy="243" r="6" fill="#ff3b6b"/><text x="314" y="248" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Gonads</text><rect x="300" y="278" width="396" height="40" rx="9" fill="rgba(157,92,255,.55)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="312" y="296" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Endocrine: no ducts, into blood</text><text x="312" y="312" font-size="17" font-weight="800" fill="#e9dcff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Exocrine: down a duct, onto a surface</text></svg>