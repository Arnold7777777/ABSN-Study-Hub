<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Stroke</title><desc id="d">An artery blocked by a clot beside one that has burst, the BE FAST signs, the time window for thrombolysis, and the left versus right differences.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="570" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">STROKE — CLOT OR BLEED, AND THE CLOCK IS THE TREATMENT</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">The two look identical at the door. A CT scan before anything else is what separates them.</text><rect x="24" y="92" width="420" height="200" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="200" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">TWO THINGS THAT LOOK THE SAME</text><path d="M56 168 q40 -22 80 0 q40 22 80 0" fill="none" stroke="#e0566f" stroke-width="20" stroke-opacity=".55" stroke-linecap="round"/><path d="M56 168 q40 -22 80 0 q40 22 80 0" fill="none" stroke="#2a0d18" stroke-width="10" stroke-linecap="round"/><ellipse cx="136" cy="171" rx="15" ry="7" fill="#f2c94c" transform="rotate(14 136 171)"/><text x="136" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">Ischaemic</text><text x="136" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">a clot blocks it</text><text x="136" y="265" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#ffc233" fill-opacity="1" text-anchor="middle">87% of strokes</text><path d="M268 168 q40 -22 80 0 q40 22 80 0" fill="none" stroke="#e0566f" stroke-width="20" stroke-opacity=".55" stroke-linecap="round"/><path d="M268 168 q40 -22 80 0 q40 22 80 0" fill="none" stroke="#2a0d18" stroke-width="10" stroke-linecap="round"/><circle cx="350" cy="178" r="22" fill="#ff3b6b" fill-opacity=".8"/><circle cx="360" cy="190" r="11" fill="#c02255" fill-opacity=".95"/><text x="348" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">Hemorrhagic</text><text x="348" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">it bursts</text><text x="348" y="265" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">13% — worse odds</text><text x="44" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">CT scan first. Thrombolytics into a bleed are fatal.</text><rect x="460" y="92" width="416" height="200" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="92" width="5" height="200" rx="2.5" fill="#ffc233"/><text x="480" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ BE FAST</text><circle cx="496" cy="146" r="11" fill="#ffc233"/><text x="496" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">B</text><text x="516" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Balance lost suddenly</text><circle cx="496" cy="170" r="11" fill="#ffc233"/><text x="496" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">E</text><text x="516" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Eyes — vision loss or double</text><circle cx="496" cy="194" r="11" fill="#ffc233"/><text x="496" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">F</text><text x="516" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Face droops on one side</text><circle cx="496" cy="218" r="11" fill="#ffc233"/><text x="496" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">A</text><text x="516" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Arm drifts down when both are raised</text><circle cx="496" cy="242" r="11" fill="#ffc233"/><text x="496" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">S</text><text x="516" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Speech slurred or nonsense</text><circle cx="496" cy="266" r="11" fill="#ffc233"/><text x="496" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">T</text><text x="516" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Time — note when she was last normal</text><text x="480" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">Last known well is the number the whole plan hangs on.</text><rect x="24" y="308" width="420" height="166" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="308" width="5" height="166" rx="2.5" fill="#12b886"/><text x="44" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">⏱️ THE WINDOWS</text><rect x="46" y="349" width="66" height="20" rx="9" fill="#12b886" fill-opacity=".92"/><text x="79" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">4.5 h</text><text x="120" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="700" fill="#bff3e2" fill-opacity="1" text-anchor="start">IV alteplase, from last known well</text><rect x="46" y="373" width="66" height="20" rx="9" fill="#12b886" fill-opacity=".92"/><text x="79" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">24 h</text><text x="120" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="700" fill="#bff3e2" fill-opacity="1" text-anchor="start">mechanical thrombectomy, selected cases</text><rect x="46" y="397" width="66" height="20" rx="9" fill="#12b886" fill-opacity=".92"/><text x="79" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">&lt; 25 min</text><text x="120" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="700" fill="#bff3e2" fill-opacity="1" text-anchor="start">to the CT scanner from arrival</text><rect x="46" y="421" width="66" height="20" rx="9" fill="#12b886" fill-opacity=".92"/><text x="79" y="436" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">NPO</text><text x="120" y="436" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="700" fill="#bff3e2" fill-opacity="1" text-anchor="start">until a swallow screen is passed</text><text x="46" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="start">Do not treat a BP of 180 in an ischaemic stroke —</text><text x="46" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="start">that pressure is perfusing the brain.</text><rect x="460" y="308" width="416" height="166" rx="14" fill="#9d5cff" fill-opacity=".20" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="308" width="5" height="166" rx="2.5" fill="#9d5cff"/><text x="480" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">🧠 LEFT BRAIN vs RIGHT BRAIN</text><text x="600" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="900" fill="#2f6bff" fill-opacity="1" text-anchor="middle">LEFT stroke</text><text x="786" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="900" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">RIGHT stroke</text><rect x="478" y="373" width="382" height="18" rx="7" fill="#ffffff" fill-opacity=".07"/><text x="484" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Weak side</text><text x="600" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">right</text><text x="786" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">left</text><rect x="478" y="395" width="382" height="18" rx="7" fill="#ffffff" fill-opacity=".03"/><text x="484" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Language</text><text x="600" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">aphasia</text><text x="786" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">intact</text><rect x="478" y="417" width="382" height="18" rx="7" fill="#ffffff" fill-opacity=".07"/><text x="484" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Behavior</text><text x="600" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">cautious</text><text x="786" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">impulsive</text><rect x="478" y="439" width="382" height="18" rx="7" fill="#ffffff" fill-opacity=".03"/><text x="484" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Neglect</text><text x="600" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">rare</text><text x="786" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">ignores left side</text><rect x="24" y="490" width="852" height="58" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="490" width="5" height="58" rx="2.5" fill="#ff3b6b"/><text x="44" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨 THE RIGHT-SIDED STROKE IS THE FALL RISK</text><text x="44" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Impulsive, denies the deficit, does not see her left side. Approach from the unaffected side; bed rails up.</text></svg>