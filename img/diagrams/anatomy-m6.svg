<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="A cross-section through the skull showing the three meninges in order from outside in: dura mater, arachnoid mater and pia mater, with the brain beneath. Beside it, which spinal root carries sensory and which carries motor."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="336" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">MENINGES — OUTSIDE IN</text><circle cx="190" cy="180" r="140" fill="#c9c9d6" stroke="rgba(0,0,0,.35)" stroke-width="2"/><circle cx="190" cy="180" r="126" fill="#ff3b6b" stroke="rgba(0,0,0,.35)" stroke-width="2"/><circle cx="190" cy="180" r="112" fill="#ffc233" stroke="rgba(0,0,0,.35)" stroke-width="2"/><circle cx="190" cy="180" r="100" fill="#00c2c7" stroke="rgba(0,0,0,.35)" stroke-width="2"/><circle cx="190" cy="180" r="92" fill="#e8b4c8" stroke="rgba(0,0,0,.35)" stroke-width="2"/><rect x="352" y="64" width="336" height="44" rx="9" fill="#c9c9d6" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="364" y="84" font-size="19" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Skull</text><text x="364" y="102" font-size="17" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">bone</text><rect x="352" y="116" width="336" height="44" rx="9" fill="#ff3b6b" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="364" y="136" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Dura mater</text><text x="364" y="154" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">tough outer layer</text><rect x="352" y="168" width="336" height="44" rx="9" fill="#ffc233" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="364" y="188" font-size="19" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Arachnoid mater</text><text x="364" y="206" font-size="17" font-weight="800" fill="#231a02" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">web-like middle</text><rect x="352" y="220" width="336" height="44" rx="9" fill="#00c2c7" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="364" y="240" font-size="19" font-weight="800" fill="#00252b" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Pia mater</text><text x="364" y="258" font-size="17" font-weight="800" fill="#00252b" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">clings to the brain</text><text x="352" y="292" font-size="19" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Remember D-A-P, outside in</text><text x="24" y="326" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Dorsal root = sensory in · Ventral root = motor out</text></svg>