<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 552" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Gestational diabetes</title><desc id="d">The causal chain drawn out: the placenta makes hormones that deliberately make the mother insulin resistant, her glucose rises, glucose crosses the placenta but her insulin does not, so the baby makes its own, grows large on it, and then at birth the sugar supply stops while the insulin is still high - which is why the baby goes hypoglycaemic within an hour. Below, screening and management.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="552" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#12b886"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#12b886">THE PLACENTA MAKES HER INSULIN RESISTANT ON PURPOSE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">It is keeping glucose circulating for the foetus. If her pancreas cannot keep up, that is gestational diabetes.</text><rect x="24" y="96" width="872" height="216" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="216" rx="2.5" fill="#2f6bff"/><text x="46" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">⛓️  ONE CHAIN, AND IT ENDS AT THE BABY</text><rect x="46" y="152" width="268" height="60" rx="11" fill="#12b886" fill-opacity=".18" stroke="#12b886" stroke-opacity=".75"/><circle cx="68" cy="174" r="10" fill="#12b886"/><text x="68" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">1</text><text x="86" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">The placenta makes hPL</text><text x="86" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">and other hormones, on purpose</text><path d="M316 182.0 L330 182.0" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="334" y="152" width="268" height="60" rx="11" fill="#00c2c7" fill-opacity=".18" stroke="#00c2c7" stroke-opacity=".75"/><circle cx="356" cy="174" r="10" fill="#00c2c7"/><text x="356" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">2</text><text x="374" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">She becomes insulin resistant</text><text x="374" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">so glucose stays in the blood</text><path d="M604 182.0 L618 182.0" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="622" y="152" width="268" height="60" rx="11" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".75"/><circle cx="644" cy="174" r="10" fill="#ffc233"/><text x="644" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">3</text><text x="662" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Her glucose rises</text><text x="662" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">if the pancreas cannot keep up</text><path d="M756 212 v14 H180 v10" stroke="#cfd4ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="46" y="236" width="268" height="60" rx="11" fill="#ff8a3d" fill-opacity=".18" stroke="#ff8a3d" stroke-opacity=".75"/><circle cx="68" cy="258" r="10" fill="#ff8a3d"/><text x="68" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">4</text><text x="86" y="258" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Glucose crosses. Insulin does NOT</text><text x="86" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">the placenta lets one through</text><path d="M316 266.0 L330 266.0" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="334" y="236" width="268" height="60" rx="11" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".75"/><circle cx="356" cy="258" r="10" fill="#ff3b6b"/><text x="356" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">5</text><text x="374" y="258" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">The baby makes its own insulin</text><text x="374" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">a lot of it, all the time</text><path d="M604 266.0 L618 266.0" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="622" y="236" width="268" height="60" rx="11" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".75"/><circle cx="644" cy="258" r="10" fill="#ff3b6b"/><text x="644" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b0716" fill-opacity="1" text-anchor="middle">6</text><text x="662" y="258" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">The baby grows large</text><text x="662" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">MACROSOMIA — insulin makes it grow</text><rect x="24" y="330" width="452" height="190" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="330" width="5" height="190" rx="2.5" fill="#ff3b6b"/><text x="46" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  AND THEN THE CORD IS CUT</text><text x="46" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">The sugar supply stops instantly.</text><text x="46" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">The baby's insulin does not.</text><text x="46" y="434" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">So a large baby of a diabetic mother goes</text><text x="46" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">HYPOGLYCAEMIC within the first hour —</text><text x="46" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">jittery, poor feeding, a weak cry, sometimes</text><text x="46" y="488" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">nothing visible at all. Check the glucose.</text><text x="46" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Also: birth injury, shoulder dystocia, jaundice.</text><rect x="496" y="330" width="400" height="190" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="330" width="5" height="190" rx="2.5" fill="#12b886"/><text x="518" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🧪  SCREENING AND MANAGEMENT</text><text x="518" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">24–28 weeks</text><text x="626" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">1-hour glucose challenge, no fasting</text><text x="518" y="404" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">if raised</text><text x="626" y="404" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">3-hour tolerance test, fasting</text><text x="518" y="422" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#9fd8c0" fill-opacity="1" text-anchor="start">two or more abnormal values confirm it</text><text x="518" y="450" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">MANAGEMENT, IN ORDER</text><text x="518" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Diet first: controlled carbohydrate, small frequent meals</text><text x="518" y="488" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Exercise, unless there is a reason not to</text><text x="518" y="506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Insulin if diet does not hold it — it does not cross the placenta</text><text x="518" y="522" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text></svg>