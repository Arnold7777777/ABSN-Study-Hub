<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 750" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Hydrocephalus and spina bifida</title><desc id="d">An infant head in cross-section with the ventricles swollen with CSF, the fontanelle bulging and the eyes driven downward into the sunset sign, beside a growth chart where the head circumference crosses upward through the percentile lines. Below, the shunt route from ventricle to abdomen, and the spina bifida sac with how it is positioned and protected.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="750" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">ONE IS ABOUT PRESSURE. THE OTHER IS ABOUT PROTECTING A SAC.</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">In an infant the skull can still expand — so the head grows before the pressure spikes.</text><rect x="24" y="96" width="430" height="320" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="320" rx="2.5" fill="#2f6bff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🧠  HYDROCEPHALUS IN AN INFANT</text><circle cx="150" cy="246" r="82" fill="#ffd9c2" fill-opacity=".2" stroke="#ffd9c2" stroke-opacity=".6" stroke-width="3"/><path d="M138 266 q-34 -30 -14 -56 q26 -20 40 6 q14 -26 40 -6 q20 26 -14 56 q-26 16 -52 0 z" fill="#2f6bff" fill-opacity=".8"/><text x="150" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">CSF</text><path d="M124 172 q26 -22 52 0" fill="none" stroke="#ff3b6b" stroke-width="6" stroke-linecap="round"/><text x="200" y="162" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">fontanelle BULGING</text><text x="74" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="end">sutures</text><text x="74" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="end">separated</text><ellipse cx="120" cy="296" rx="15" ry="11" fill="#ffffff" fill-opacity=".9"/><circle cx="120" cy="302" r="8" fill="#3a5c8a"/><ellipse cx="180" cy="296" rx="15" ry="11" fill="#ffffff" fill-opacity=".9"/><circle cx="180" cy="302" r="8" fill="#3a5c8a"/><text x="214" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">"sunset eyes" —</text><text x="214" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">white above the iris</text><text x="46" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">High-pitched cry · irritable · poor feeding · vomiting ·</text><text x="46" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">scalp shiny with distended veins</text><text x="46" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Older child, skull already fused: headache worse on waking.</text><rect x="474" y="96" width="422" height="320" rx="14" fill="#ffc233" fill-opacity=".16" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="96" width="5" height="320" rx="2.5" fill="#ffc233"/><text x="492" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">📈  THE EARLIEST OBJECTIVE SIGN</text><rect x="524" y="146" width="322" height="176" rx="9" fill="#0b0716" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".16"/><path d="M530 209.2 q161 -14 308 -22" fill="none" stroke="#8e96c8" stroke-width="1.6" stroke-opacity=".7"/><text x="518" y="213.2" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="end">97th</text><path d="M530 239.1 q161 -14 308 -22" fill="none" stroke="#8e96c8" stroke-width="1.6" stroke-opacity=".7"/><text x="518" y="243.12" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="end">50th</text><path d="M530 269.0 q161 -14 308 -22" fill="none" stroke="#8e96c8" stroke-width="1.6" stroke-opacity=".7"/><text x="518" y="273.04" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="end">15th</text><path d="M530 296.2 q161 -14 308 -22" fill="none" stroke="#8e96c8" stroke-width="1.6" stroke-opacity=".7"/><text x="518" y="300.24" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="end">3rd</text><path d="M530.0 266.3 L537.5 265.8 L545.1 265.2 L552.6 264.5 L560.2 263.8 L567.8 263.0 L575.3 262.1 L582.9 261.1 L590.4 260.0 L598.0 258.9 L605.5 257.6 L613.0 256.3 L620.6 254.9 L628.1 253.4 L635.7 251.8 L643.2 250.2 L650.8 248.4 L658.4 246.5 L665.9 244.6 L673.5 242.6 L681.0 240.5 L688.5 238.2 L696.1 235.9 L703.6 233.5 L711.2 231.1 L718.8 228.5 L726.3 225.8 L733.9 223.0 L741.4 220.2 L749.0 217.2 L756.5 214.2 L764.0 211.0 L771.6 207.8 L779.1 204.4 L786.7 201.0 L794.2 197.4 L801.8 193.8 L809.4 190.1 L816.9 186.3 L824.5 182.3 L832.0 178.3" fill="none" stroke="#ff3b6b" stroke-width="3.4" stroke-linejoin="round"/><circle cx="832.0" cy="178.3" r="5" fill="#ff3b6b"/><text x="530" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="start">age  →</text><text x="846" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="end">head circumference</text><text x="492" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Measure at every well-child visit up to 2 years. A head that</text><text x="492" y="378" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">CROSSES percentile lines upward is the earliest hard sign —</text><text x="492" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">well before the fontanelle bulges or the eyes change.</text><rect x="24" y="434" width="430" height="288" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="434" width="5" height="288" rx="2.5" fill="#ff3b6b"/><text x="46" y="464" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  VP SHUNT — WATCH FOR THE PRESSURE RETURNING</text><circle cx="130" cy="542" r="36" fill="#ffd9c2" fill-opacity=".2" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="2.5"/><circle cx="130" cy="538" r="13" fill="#2f6bff" fill-opacity=".8"/><path d="M138 550 q34 26 40 84" fill="none" stroke="#12b886" stroke-width="5" stroke-linecap="round"/><ellipse cx="186" cy="646" rx="40" ry="26" fill="#ffd9c2" fill-opacity=".18" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="2"/><text x="186" y="650" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="middle">abdomen</text><text x="226" y="550" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">CSF drains from a</text><text x="226" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">ventricle down to</text><text x="226" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">the peritoneum</text><text x="46" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Irritability, lethargy, poor feeding, vomiting</text><text x="46" y="683" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Bulging fontanelle; head circumference climbing again</text><text x="46" y="702" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Fever — a shunt infection looks the same as a blockage</text><text x="46" y="721" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Position on the UNOPERATED side, flat, after surgery</text><rect x="474" y="434" width="422" height="288" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="434" width="5" height="288" rx="2.5" fill="#12b886"/><text x="496" y="464" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">👶  SPINA BIFIDA — PROTECT THE SAC</text><path d="M516 524 q40 -30 80 0 v70 q-40 26 -80 0 z" fill="#ffd9c2" fill-opacity=".18" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="2"/><circle cx="556" cy="568" r="20" fill="#ff3b6b" fill-opacity=".55" stroke="#ff3b6b" stroke-width="2.5"/><text x="556" y="572" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">sac</text><text x="610" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">lies PRONE, so nothing</text><text x="610" y="556" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">presses on the sac</text><text x="496" y="626" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Sterile, saline-moistened, non-adherent dressing over it</text><text x="496" y="645" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Prone or side-lying — never on the back</text><text x="496" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· LATEX-FREE from birth: repeated exposure sensitises them</text><text x="496" y="683" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Measure head circumference — hydrocephalus often follows</text><text x="496" y="702" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Watch for a leak, and keep stool off it</text><text x="496" y="730" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text></svg>