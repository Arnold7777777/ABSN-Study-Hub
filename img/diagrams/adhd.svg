<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">ADHD and ADD</title><desc id="d">The three presentations of ADHD as overlapping circles, the diagnostic thresholds, and how stimulant medication is monitored.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="580" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">ADHD — THREE PRESENTATIONS, ONE DIAGNOSIS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">It is one disorder that shows up three ways. What you monitor is the same either way.</text><rect x="24" y="92" width="468" height="236" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="236" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">THE THREE PRESENTATIONS</text><circle cx="196" cy="210" r="72" fill="#2f6bff" fill-opacity=".38" stroke="#2f6bff" stroke-opacity=".85" stroke-width="2"/><circle cx="300" cy="210" r="72" fill="#ff8a3d" fill-opacity=".38" stroke="#ff8a3d" stroke-opacity=".85" stroke-width="2"/><text x="150" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">Inattentive</text><text x="150" y="217" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">(was “ADD”)</text><text x="346" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">Hyperactive</text><text x="346" y="217" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">impulsive</text><text x="248" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#fff" fill-opacity="1" text-anchor="middle">Combined</text><text x="248" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.8" font-weight="400" fill="#fff" fill-opacity="1" text-anchor="middle">most common</text><text x="60" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#cfe0ff" fill-opacity="1" text-anchor="start">Loses things, does not finish,</text><text x="60" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#cfe0ff" fill-opacity="1" text-anchor="start">looks like daydreaming</text><text x="456" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9bd" fill-opacity="1" text-anchor="end">Cannot stay seated, blurts,</text><text x="456" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9bd" fill-opacity="1" text-anchor="end">cannot wait a turn</text><rect x="508" y="92" width="368" height="236" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="508" y="92" width="5" height="236" rx="2.5" fill="#ffc233"/><text x="528" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ WHAT MAKES IT A DIAGNOSIS</text><rect x="530" y="135" width="76" height="24" rx="12" fill="#ffc233" fill-opacity=".92"/><text x="568" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">6+</text><text x="616" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">symptoms, under age 17</text><rect x="530" y="169" width="76" height="24" rx="12" fill="#ffc233" fill-opacity=".92"/><text x="568" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">5+</text><text x="616" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">symptoms, 17 and older</text><rect x="530" y="203" width="76" height="24" rx="12" fill="#ffc233" fill-opacity=".92"/><text x="568" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">6 months</text><text x="616" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">or longer</text><rect x="530" y="237" width="76" height="24" rx="12" fill="#ffc233" fill-opacity=".92"/><text x="568" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">Before 12</text><text x="616" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">some symptoms present</text><rect x="530" y="271" width="76" height="24" rx="12" fill="#ffc233" fill-opacity=".92"/><text x="568" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">2 settings</text><text x="616" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">home AND school — not just one</text><text x="528" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">Two settings is the one students miss.</text><rect x="24" y="344" width="528" height="178" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="344" width="5" height="178" rx="2.5" fill="#12b886"/><text x="44" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">💊 STIMULANTS — WHAT YOU MONITOR</text><circle cx="46" cy="393.5" r="2.6" fill="#bff3e2"/><text x="56" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Methylphenidate, amphetamine salts.</tspan><tspan> Schedule II.</tspan></text><circle cx="46" cy="412.5" r="2.6" fill="#bff3e2"/><text x="56" y="417" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Give after breakfast,</tspan><tspan> last dose before 4 pm — or no sleep.</tspan></text><circle cx="46" cy="431.5" r="2.6" fill="#bff3e2"/><text x="56" y="436" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Appetite suppression:</tspan><tspan> weigh, and plot height every visit.</tspan></text><circle cx="46" cy="450.5" r="2.6" fill="#bff3e2"/><text x="56" y="455" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Check heart rate and BP</tspan><tspan> at each visit.</tspan></text><circle cx="46" cy="469.5" r="2.6" fill="#bff3e2"/><text x="56" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Atomoxetine</tspan><tspan> is the non-stimulant — watch mood, suicidality.</tspan></text><circle cx="46" cy="488.5" r="2.6" fill="#bff3e2"/><text x="56" y="493" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Drug holidays</tspan><tspan> only if the prescriber directs them.</tspan></text><rect x="568" y="344" width="308" height="178" rx="14" fill="#9d5cff" fill-opacity=".20" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="568" y="344" width="5" height="178" rx="2.5" fill="#9d5cff"/><text x="588" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">🏫 WHAT ACTUALLY HELPS</text><circle cx="590" cy="393.5" r="2.6" fill="#e0ccff"/><text x="600" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">One instruction at a time.</text><circle cx="590" cy="412.5" r="2.6" fill="#e0ccff"/><text x="600" y="417" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Written routine she can see.</text><circle cx="590" cy="431.5" r="2.6" fill="#e0ccff"/><text x="600" y="436" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Seat near the teacher, away from windows.</text><circle cx="590" cy="450.5" r="2.6" fill="#e0ccff"/><text x="600" y="455" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Break long tasks into short pieces.</text><circle cx="590" cy="469.5" r="2.6" fill="#e0ccff"/><text x="600" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Praise the effort, not just the result.</text><circle cx="590" cy="488.5" r="2.6" fill="#e0ccff"/><text x="600" y="493" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Medication + therapy beats either alone.</text><rect x="24" y="538" width="852" height="30" rx="14" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="538" width="5" height="30" rx="2.5" fill="#ff3b6b"/><text x="44" y="559" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">🚨 A sudden drop off the growth curve, or a resting heart rate that keeps climbing, is reported before the next dose.</text></svg>