<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Meniere's disease</title><desc id="d">The inner ear drawn as a closed membranous system, normal on one side and distended with endolymph on the other, with balance and hearing organs both sitting inside it - which is why they fail together. Beside it the triad plus the fourth sign students leave out. Below, the safety problem and how it differs from the other vertigos.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="640" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#00c2c7" fill-opacity=".22" stroke="#00c2c7" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#00c2c7"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#00c2c7">ONE FLUID, TWO ORGANS — SO THEY FAIL TOGETHER</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Endolymph builds up in a closed system, and the rising pressure distorts balance and hearing at once.</text><rect x="24" y="96" width="470" height="288" rx="14" fill="#00c2c7" fill-opacity=".16" stroke="#00c2c7" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="288" rx="2.5" fill="#00c2c7"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">💧  A CLOSED SYSTEM, FILLING UP</text><rect x="46" y="146" width="196" height="176" rx="12" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".72"/><text x="144" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">NORMAL</text><circle cx="144" cy="244" r="32" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-width="3"/><circle cx="144" cy="244" r="18" fill="none" stroke="#12b886" stroke-width="3"/><circle cx="113" cy="218" r="9" fill="none" stroke="#12b886" stroke-width="3"/><circle cx="144" cy="204" r="9" fill="none" stroke="#12b886" stroke-width="3"/><circle cx="175" cy="218" r="9" fill="none" stroke="#12b886" stroke-width="3"/><text x="144" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">hearing</text><text x="86" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="end">balance</text><text x="144" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">endolymph in balance</text><rect x="266" y="146" width="196" height="176" rx="12" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".72"/><text x="364" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">DISTENDED</text><circle cx="364" cy="244" r="40" fill="#ff3b6b" fill-opacity=".5" stroke="#ff3b6b" stroke-width="3"/><circle cx="364" cy="244" r="26" fill="none" stroke="#ff3b6b" stroke-width="3"/><circle cx="327" cy="213" r="11" fill="none" stroke="#ff3b6b" stroke-width="3"/><circle cx="364" cy="196" r="11" fill="none" stroke="#ff3b6b" stroke-width="3"/><circle cx="401" cy="213" r="11" fill="none" stroke="#ff3b6b" stroke-width="3"/><text x="364" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">hearing</text><text x="298" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="end">balance</text><text x="364" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">pressure distorts BOTH</text><text x="364" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">almost always ONE ear</text><text x="46" y="354" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#bff3f0" fill-opacity="1" text-anchor="start">Endolymphatic hydrops: over-produced or under-absorbed. It usually</text><text x="46" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#bff3f0" fill-opacity="1" text-anchor="start">begins between 40 and 60, and the affected ear is where the fullness is.</text><rect x="514" y="96" width="382" height="288" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="288" rx="2.5" fill="#ffc233"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐  THE TRIAD, PLUS THE ONE PEOPLE FORGET</text><text x="532" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">VERTIGO</text><text x="664" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">the room spinning — not light-headed.</text><text x="664" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Minutes to hours, with nausea</text><text x="532" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">HEARING LOSS</text><text x="664" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">fluctuating at first, low frequencies,</text><text x="664" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">then permanent</text><text x="532" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">TINNITUS</text><text x="664" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">roaring or ringing in that ear</text><text x="532" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">AURAL FULLNESS</text><text x="664" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">the ear feels blocked and full —</text><text x="664" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">this is the one students leave out</text><text x="532" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">All four in ONE ear, arriving in attacks.</text><text x="532" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Between attacks she may be completely well.</text><rect x="24" y="402" width="452" height="190" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="402" width="5" height="190" rx="2.5" fill="#ff3b6b"/><text x="46" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  THE SAFETY PROBLEM</text><text x="46" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">An attack arrives without warning and she cannot stand.</text><text x="46" y="488" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Lie still in a darkened room until it passes</text><text x="46" y="508" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· No driving, no ladders, no swimming alone, no</text><text x="46" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">  operating machinery — this is not negotiable</text><text x="46" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Call bell in reach; assist with walking</text><text x="46" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Move slowly; no sudden head turns</text><text x="46" y="588" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">· Low SODIUM diet, and diuretics — the point is to</text><text x="46" y="608" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">  reduce the fluid</text><rect x="496" y="402" width="400" height="190" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="402" width="5" height="190" rx="2.5" fill="#2f6bff"/><text x="518" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🔎  WHICH VERTIGO IS IT?</text><text x="518" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Ménière's</text><text x="660" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">vertigo, hearing loss, tinnitus, fullness</text><text x="518" y="479" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">BPPV</text><text x="660" y="479" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">seconds, triggered by a head POSITION.</text><text x="660" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">No hearing loss</text><text x="518" y="517" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Labyrinthitis</text><text x="660" y="517" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">days, after a viral illness. Hearing IS</text><text x="660" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">affected</text><text x="518" y="555" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Vestibular neuritis</text><text x="660" y="555" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">days, vertigo only. Hearing is NOT</text><text x="660" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">affected</text><text x="518" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Hearing loss is what separates them.</text></svg>