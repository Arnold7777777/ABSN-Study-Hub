<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 656" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">After a tonsillectomy, and the tracheostomy airway</title><desc id="d">A head in profile showing blood running down the back of the throat after a tonsillectomy, which is why there is nothing to see and why frequent swallowing is the earliest sign. Beside it the two risk windows on a timeline. Below, positioning, what she may and may not have, and the tracheostomy rules.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="656" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">THE BLEED YOU CANNOT SEE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Blood runs down the back of the throat, so a child who keeps swallowing is bleeding until proven otherwise.</text><rect x="24" y="96" width="470" height="288" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="288" rx="2.5" fill="#ff3b6b"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🩸  WHY THERE IS NOTHING TO SEE</text><path d="M132 216 q46 -56 88 -8 q22 30 8 64 q-10 26 -40 30 q-40 4 -56 -22 q-16 -30 0 -64 z" fill="#ffd9c2" fill-opacity=".18" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="2.5"/><circle cx="162" cy="220" r="4" fill="#3a2030"/><path d="M148 264 q16 8 30 0" fill="none" stroke="#3a2030" stroke-width="3" stroke-linecap="round"/><circle cx="202" cy="248" r="8" fill="#ff3b6b" fill-opacity=".9"/><path d="M202 254 q10 30 -2 62" fill="none" stroke="#ff3b6b" stroke-width="6" stroke-linecap="round"/><path d="M206 276 L202 308" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="232" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">tonsil bed</text><text x="232" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">blood runs</text><text x="232" y="303" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">DOWN and BACK</text><text x="232" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">— so she swallows it</text><text x="46" y="344" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">FREQUENT SWALLOWING is the earliest sign. So is being unusually</text><text x="46" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">quiet and pale. Restlessness and a rising pulse come before the</text><text x="46" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">blood pressure moves at all.</text><rect x="514" y="96" width="382" height="288" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="288" rx="2.5" fill="#ffc233"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⏱️  THE TWO RISK WINDOWS</text><rect x="554" y="188" width="302" height="22" rx="11" fill="#0b0716" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".16"/><rect x="554.0" y="188" width="21.6" height="22" rx="11" fill="#ff3b6b" fill-opacity=".8"/><rect x="705.0" y="188" width="64.7" height="22" rx="11" fill="#ff3b6b" fill-opacity=".8"/><path d="M554.0 210 v8" stroke="#8e96c8" stroke-width="1.6"/><text x="554.0" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">day 0</text><path d="M705.0 210 v8" stroke="#8e96c8" stroke-width="1.6"/><text x="705.0" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">day 7</text><path d="M769.7 210 v8" stroke="#8e96c8" stroke-width="1.6"/><text x="769.7142857142858" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">day 10</text><path d="M856.0 210 v8" stroke="#8e96c8" stroke-width="1.6"/><text x="856.0" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8e96c8" fill-opacity="1" text-anchor="middle">day 14</text><text x="564.7857142857143" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">first 24 h</text><text x="737.3571428571429" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">the scab separates</text><text x="532" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">She looks better at a week, and then bleeds. Warn the parents</text><text x="532" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">about the second window before they go home.</text><text x="532" y="324" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">NO straws, NO coughing or throat clearing, NO red or</text><text x="532" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">purple drinks, NO milk or ice cream early — it thickens</text><text x="532" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">secretions and makes her clear her throat.</text><rect x="24" y="402" width="452" height="200" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="402" width="5" height="200" rx="2.5" fill="#12b886"/><text x="46" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  POSITIONING AND COMFORT</text><text x="46" y="464" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· PRONE or side-lying while she is sleepy — it lets</text><text x="46" y="484" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  secretions drain out of the mouth</text><text x="46" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Ice collar; cool clear fluids; ice lollies</text><text x="46" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Soft, cool diet for a week or two</text><text x="46" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Analgesia around the clock — a sore throat that is</text><text x="46" y="564" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  not treated stops her drinking</text><text x="46" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Expect some ear pain: it is referred, not an infection</text><rect x="496" y="402" width="400" height="200" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="402" width="5" height="200" rx="2.5" fill="#2f6bff"/><text x="518" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🫁  TRACHEOSTOMY — THE NON-NEGOTIABLES</text><text x="518" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· A spare tube of the SAME size, and one size</text><text x="518" y="478" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">  smaller, taped at the bedside. Always</text><text x="518" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Obturator taped to the bed for reinsertion</text><text x="518" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Suction only on the way OUT, under 10 seconds</text><text x="518" y="532" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Pre-oxygenate; sterile technique</text><text x="518" y="550" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Two people for tie changes — one holds the tube</text><text x="518" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Humidified air: the nose is bypassed</text><text x="518" y="586" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· Nothing that sheds: no powder, no fluff, no aerosols</text></svg>