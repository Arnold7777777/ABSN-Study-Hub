<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Eye cancer: leukocoria and uveal melanoma</title><desc id="d">Two eyes in a flash photograph - one showing the normal red reflex and the other reflecting white, which is leukocoria and the sign of retinoblastoma. Beside it uveal melanoma, the adult one. Below, what each spreads to and what a nurse can actually catch.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="600" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">A WHITE PUPIL IN A YOUNG CHILD IS NEVER DISMISSED</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Parents often notice it first in a flash photograph — one eye glows red, the other white.</text><rect x="24" y="96" width="470" height="268" rx="14" fill="#ff3b6b" fill-opacity=".17" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="268" rx="2.5" fill="#ff3b6b"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">📷  THE FLASH PHOTOGRAPH</text><rect x="85" y="176" width="330" height="126" rx="12" fill="#0b0716" fill-opacity=".85" stroke="#cfd4ff" stroke-opacity=".28" stroke-width="2"/><ellipse cx="178" cy="220" rx="40" ry="26" fill="#ffffff" fill-opacity=".92"/><circle cx="178" cy="220" r="19" fill="#6d8fb8"/><circle cx="178" cy="220" r="11" fill="#e0405f"/><text x="178" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">normal red reflex</text><ellipse cx="322" cy="220" rx="40" ry="26" fill="#ffffff" fill-opacity=".92"/><circle cx="322" cy="220" r="19" fill="#6d8fb8"/><circle cx="322" cy="220" r="11" fill="#f2ece6"/><text x="322" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">LEUKOCORIA — white</text><text x="46" y="332" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">One eye glowing red and the other white in a photo is often how it</text><text x="46" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">is found — and it is an urgent referral, not a wait-and-see.</text><rect x="514" y="96" width="382" height="268" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="268" rx="2.5" fill="#2f6bff"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">THE TWO THAT MATTER</text><rect x="532" y="148" width="346" height="102" rx="11" fill="#ff3b6b" fill-opacity=".16" stroke="#ff3b6b" stroke-opacity=".75"/><text x="546" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">RETINOBLASTOMA</text><text x="546" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="start">children under 5 · the RETINA</text><text x="546" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· LEUKOCORIA — a white pupil</text><text x="546" y="219" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· squint, red painful eye, poor vision</text><text x="546" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· inherited RB1 in ~40%, often BOTH eyes</text><text x="546" y="249" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· spreads locally, then brain and bone</text><rect x="532" y="260" width="346" height="102" rx="11" fill="#ffc233" fill-opacity=".16" stroke="#ffc233" stroke-opacity=".75"/><text x="546" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">UVEAL MELANOMA</text><text x="546" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="start">adults · the UVEA</text><text x="546" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· often no early sign at all</text><text x="546" y="331" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· found on a routine eye examination</text><text x="546" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· light eyes, fair skin, certain moles</text><text x="546" y="361" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· spreads to the LIVER, characteristically</text><rect x="24" y="382" width="872" height="172" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="382" width="5" height="172" rx="2.5" fill="#12b886"/><text x="46" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">👀  WHAT A NURSE CAN ACTUALLY CATCH</text><text x="46" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· A white pupil reflex in any child — refer the same day</text><text x="46" y="466" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· A parent who says "one eye looks odd in photos". Believe her</text><text x="46" y="488" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· A new squint in a child. It is not always just a squint</text><text x="46" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· A red reflex is checked at every well-child visit for a reason</text><text x="46" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Retinoblastoma is curable when it is caught early, and sight can often be saved. Late, the eye usually cannot.</text></svg>