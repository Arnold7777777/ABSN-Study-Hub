<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Cancer prevention and early detection</title><desc id="d">The three levels of prevention, the screening ages, the seven CAUTION warning signs and the modifiable risks.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="600" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#12b886"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#12b886">CANCER — PREVENT IT, FIND IT EARLY, OR LIMIT THE DAMAGE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Three levels of prevention. Know which level a question is asking about before you answer.</text><rect x="24" y="92" width="276" height="180" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="180" rx="2.5" fill="#12b886"/><text x="42" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#12b886" fill-opacity="1" text-anchor="start">PRIMARY</text><text x="42" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Stop it happening</text><circle cx="44" cy="161.5" r="2.6" fill="#cfd4ff"/><text x="54" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">HPV and hepatitis B vaccines</text><circle cx="44" cy="181.5" r="2.6" fill="#cfd4ff"/><text x="54" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Stop smoking, limit alcohol</text><circle cx="44" cy="201.5" r="2.6" fill="#cfd4ff"/><text x="54" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Sunscreen and shade</text><circle cx="44" cy="221.5" r="2.6" fill="#cfd4ff"/><text x="54" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Diet, weight, activity</text><rect x="312" y="92" width="276" height="180" rx="14" fill="#2f6bff" fill-opacity=".20" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="312" y="92" width="5" height="180" rx="2.5" fill="#2f6bff"/><text x="330" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#2f6bff" fill-opacity="1" text-anchor="start">SECONDARY</text><text x="330" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Find it early</text><circle cx="332" cy="161.5" r="2.6" fill="#cfd4ff"/><text x="342" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Screening tests on schedule</text><circle cx="332" cy="181.5" r="2.6" fill="#cfd4ff"/><text x="342" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Mammogram, colonoscopy, Pap</text><circle cx="332" cy="201.5" r="2.6" fill="#cfd4ff"/><text x="342" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Self-examination</text><circle cx="332" cy="221.5" r="2.6" fill="#cfd4ff"/><text x="342" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Report changes promptly</text><rect x="600" y="92" width="276" height="180" rx="14" fill="#9d5cff" fill-opacity=".20" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="600" y="92" width="5" height="180" rx="2.5" fill="#9d5cff"/><text x="618" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#9d5cff" fill-opacity="1" text-anchor="start">TERTIARY</text><text x="618" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Limit the damage</text><circle cx="620" cy="161.5" r="2.6" fill="#cfd4ff"/><text x="630" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Treatment and rehabilitation</text><circle cx="620" cy="181.5" r="2.6" fill="#cfd4ff"/><text x="630" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Manage side effects</text><circle cx="620" cy="201.5" r="2.6" fill="#cfd4ff"/><text x="630" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Prevent recurrence</text><circle cx="620" cy="221.5" r="2.6" fill="#cfd4ff"/><text x="630" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Palliative and survivorship care</text><rect x="24" y="288" width="420" height="230" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="288" width="5" height="230" rx="2.5" fill="#ffc233"/><text x="44" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.6" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ THE SEVEN WARNING SIGNS — C A U T I O N</text><circle cx="60" cy="342" r="11" fill="#ffc233"/><text x="60" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">C</text><text x="80" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Change in bowel or bladder habits</text><circle cx="60" cy="366" r="11" fill="#ffc233"/><text x="60" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">A</text><text x="80" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">A sore that does not heal</text><circle cx="60" cy="390" r="11" fill="#ffc233"/><text x="60" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">U</text><text x="80" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Unusual bleeding or discharge</text><circle cx="60" cy="414" r="11" fill="#ffc233"/><text x="60" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">T</text><text x="80" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Thickening or a lump</text><circle cx="60" cy="438" r="11" fill="#ffc233"/><text x="60" y="442" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">I</text><text x="80" y="442" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Indigestion or trouble swallowing</text><circle cx="60" cy="462" r="11" fill="#ffc233"/><text x="60" y="466" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">O</text><text x="80" y="466" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Obvious change in a wart or mole</text><circle cx="60" cy="486" r="11" fill="#ffc233"/><text x="60" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">N</text><text x="80" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Nagging cough or hoarseness</text><rect x="460" y="288" width="416" height="230" rx="14" fill="#2f6bff" fill-opacity=".18" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="288" width="5" height="230" rx="2.5" fill="#2f6bff"/><text x="480" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">📅 SCREENING — WHEN IT STARTS</text><rect x="478" y="329" width="380" height="24" rx="8" fill="#ffffff" fill-opacity=".07"/><text x="486" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Colorectal</text><text x="586" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="900" fill="#ffc233" fill-opacity="1" text-anchor="start">45</text><text x="648" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#cfe0ff" fill-opacity="1" text-anchor="start">colonoscopy q10 y</text><rect x="478" y="357" width="380" height="24" rx="8" fill="#ffffff" fill-opacity=".03"/><text x="486" y="374" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Breast</text><text x="586" y="374" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="900" fill="#ffc233" fill-opacity="1" text-anchor="start">40–45</text><text x="648" y="374" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#cfe0ff" fill-opacity="1" text-anchor="start">mammogram yearly</text><rect x="478" y="385" width="380" height="24" rx="8" fill="#ffffff" fill-opacity=".07"/><text x="486" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Cervical</text><text x="586" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="900" fill="#ffc233" fill-opacity="1" text-anchor="start">21</text><text x="648" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#cfe0ff" fill-opacity="1" text-anchor="start">Pap q3 y; +HPV q5 y at 30</text><rect x="478" y="413" width="380" height="24" rx="8" fill="#ffffff" fill-opacity=".03"/><text x="486" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Lung</text><text x="586" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="900" fill="#ffc233" fill-opacity="1" text-anchor="start">50</text><text x="648" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#cfe0ff" fill-opacity="1" text-anchor="start">low-dose CT if 20 pack-years</text><rect x="478" y="441" width="380" height="24" rx="8" fill="#ffffff" fill-opacity=".07"/><text x="486" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Prostate</text><text x="586" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="900" fill="#ffc233" fill-opacity="1" text-anchor="start">50</text><text x="648" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#cfe0ff" fill-opacity="1" text-anchor="start">discuss PSA; 45 if high risk</text><rect x="478" y="469" width="380" height="24" rx="8" fill="#ffffff" fill-opacity=".03"/><text x="486" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Skin</text><text x="586" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="900" fill="#ffc233" fill-opacity="1" text-anchor="start">any age</text><text x="648" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#cfe0ff" fill-opacity="1" text-anchor="start">ABCDE on every mole</text><rect x="24" y="534" width="852" height="56" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="534" width="5" height="56" rx="2.5" fill="#ff3b6b"/><text x="44" y="558" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.4" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨 ABCDE for a mole:</text><text x="222" y="558" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.8" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Asymmetry · Border irregular · Colour varied · Diameter &gt;6 mm · Evolving</text><text x="44" y="580" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Tobacco is the single biggest modifiable risk — behind about a third of all cancer deaths.</text></svg>