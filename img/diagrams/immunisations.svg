<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Immunizations: live versus inactivated</title><desc id="d">The two columns side by side - live attenuated vaccines containing a weakened organism, and inactivated ones that cannot replicate - with who may have each, and hanging off the live column the four situations in which it is withheld. Below, the schedule in outline and the commonest missed opportunity.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="680" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">LIVE OR NOT LIVE — THAT IS ALMOST THE WHOLE TOPIC</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A live vaccine holds a weakened organism, so it is withheld from anyone who cannot fight even a weakened infection.</text><rect x="24" y="96" width="430" height="300" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="300" rx="2.5" fill="#ff3b6b"/><text x="239.0" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">LIVE ATTENUATED</text><text x="239.0" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">a weakened but living organism</text><text x="44" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">EXAMPLES</text><text x="44" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">MMR · Varicella · Rotavirus</text><text x="44" y="215" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">intranasal influenza · BCG</text><text x="44" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">zoster (live formulation)</text><text x="44" y="263" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">To someone immunocompromised?</text><text x="44" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">NO</text><text x="44" y="301" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">In pregnancy?</text><text x="44" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">NO</text><text x="44" y="339" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Spacing</text><text x="44" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">together, or 4 weeks apart</text><rect x="474" y="96" width="422" height="300" rx="14" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="96" width="5" height="300" rx="2.5" fill="#12b886"/><text x="685.0" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">INACTIVATED / SUBUNIT</text><text x="685.0" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">it cannot replicate at all</text><text x="494" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">EXAMPLES</text><text x="494" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">DTaP · Hib · IPV · HepA · HepB</text><text x="494" y="215" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">PCV · HPV · injectable influenza</text><text x="494" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Tdap · meningococcal</text><text x="494" y="263" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">To someone immunocompromised?</text><text x="494" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Yes</text><text x="494" y="301" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">In pregnancy?</text><text x="494" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Yes — Tdap is recommended</text><text x="494" y="339" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Spacing</text><text x="494" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">no spacing rule</text><rect x="24" y="414" width="430" height="190" rx="14" fill="#ff3b6b" fill-opacity=".19" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="414" width="5" height="190" rx="2.5" fill="#ff3b6b"/><text x="46" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  WITHHOLD A LIVE VACCINE WHEN</text><text x="46" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Immunocompromised</text><text x="60" y="489" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">chemo, high-dose steroids, low CD4, transplant</text><text x="46" y="506" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Pregnant</text><text x="60" y="521" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">and avoid pregnancy for 4 weeks after</text><text x="46" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Recent IVIG or blood product</text><text x="60" y="553" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">wait ~11 months — the antibodies block it</text><text x="46" y="570" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Severe febrile illness</text><text x="60" y="585" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">postpone until she has recovered</text><text x="46" y="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><rect x="474" y="414" width="422" height="190" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="474" y="414" width="5" height="190" rx="2.5" fill="#ffc233"/><text x="496" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">📅  THE SCHEDULE IN OUTLINE</text><text x="496" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">birth</text><text x="566" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">HepB</text><text x="496" y="489" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">2 mo</text><text x="566" y="489" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">DTaP · IPV · Hib · PCV · RV · HepB</text><text x="496" y="508" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">4 mo</text><text x="566" y="508" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">DTaP · IPV · Hib · PCV · RV</text><text x="496" y="527" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">6 mo</text><text x="566" y="527" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">DTaP · PCV · flu yearly from now</text><text x="496" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">12–15 mo</text><text x="566" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">MMR · Varicella · Hib · PCV · HepA</text><text x="496" y="565" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">4–6 yr</text><text x="566" y="565" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">DTaP · IPV · MMR · Varicella</text><text x="496" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">11–12 yr</text><text x="566" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Tdap · HPV · meningococcal</text><text x="496" y="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><rect x="24" y="620" width="872" height="60" rx="14" fill="#12b886" fill-opacity=".17" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="620" width="5" height="60" rx="2.5" fill="#12b886"/><text x="46" y="650" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">⭐  A mild cold with a low fever is NOT a reason to postpone. Withholding vaccines for minor illness is</text><text x="46" y="670" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">the single commonest missed opportunity — and it is a favourite question.</text></svg>