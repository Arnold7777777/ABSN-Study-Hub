<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc"><title id="title">Four conditions: spot the pattern</title><desc id="desc">Four comparison cards for rheumatoid arthritis, lupus, gout and fibromyalgia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a6b7df"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect width="1100" height="880" rx="24" fill="#10152b"/>
<text x="36" y="39" font-size="16" fill="#aabfe8" font-weight="700">NUR 258  /  MODULE 3  /  VISUAL STUDY GUIDE</text>
<text x="36" y="88" font-size="36" fill="#fff" font-weight="800">Four conditions: spot the pattern</text>
<text x="36" y="125" font-size="21" fill="#c7d4ed" font-weight="400">Use the pattern to guide assessment; no single symptom or lab makes the diagnosis.</text>
<rect x="36" y="164" width="504" height="257" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="58" y="206" font-size="25" fill="#ffb8d4" font-weight="800">RHEUMATOID ARTHRITIS</text>
<text x="58" y="250" font-size="21" fill="#edf2ff" font-weight="400">Autoimmune joint inflammation</text>
<text x="58" y="281" font-size="21" fill="#edf2ff" font-weight="400">Often symmetric small-joint swelling</text>
<text x="58" y="312" font-size="21" fill="#edf2ff" font-weight="400">Prolonged morning stiffness</text>
<text x="58" y="343" font-size="21" fill="#edf2ff" font-weight="400">RF / anti-CCP support the workup</text>
<text x="58" y="374" font-size="21" fill="#edf2ff" font-weight="400">Priority: joint function + disease control</text>
<rect x="560" y="164" width="504" height="257" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="582" y="206" font-size="25" fill="#c7b7ff" font-weight="800">LUPUS</text>
<text x="582" y="250" font-size="21" fill="#edf2ff" font-weight="400">Autoimmune, multiple organ systems</text>
<text x="582" y="281" font-size="21" fill="#edf2ff" font-weight="400">Rash, joint symptoms and fatigue</text>
<text x="582" y="312" font-size="21" fill="#edf2ff" font-weight="400">Kidney / heart / lung involvement</text>
<text x="582" y="343" font-size="21" fill="#edf2ff" font-weight="400">ANA is one part of the workup</text>
<text x="582" y="374" font-size="21" fill="#edf2ff" font-weight="400">Priority: detect organ involvement</text>
<rect x="36" y="444" width="504" height="257" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="58" y="486" font-size="25" fill="#f3d38f" font-weight="800">GOUT</text>
<text x="58" y="530" font-size="21" fill="#edf2ff" font-weight="400">Urate crystals trigger inflammation</text>
<text x="58" y="561" font-size="21" fill="#edf2ff" font-weight="400">Abrupt, intensely painful hot joint</text>
<text x="58" y="592" font-size="21" fill="#edf2ff" font-weight="400">Often the great toe; other joints too</text>
<text x="58" y="623" font-size="21" fill="#edf2ff" font-weight="400">Joint-fluid crystals support diagnosis</text>
<text x="58" y="654" font-size="21" fill="#edf2ff" font-weight="400">Priority: flare relief + urate control</text>
<rect x="560" y="444" width="504" height="257" rx="18" fill="#1d2343" stroke="#485579" stroke-width="2"/>
<text x="582" y="486" font-size="25" fill="#8fe2d5" font-weight="800">FIBROMYALGIA</text>
<text x="582" y="530" font-size="21" fill="#edf2ff" font-weight="400">Altered pain processing</text>
<text x="582" y="561" font-size="21" fill="#edf2ff" font-weight="400">Widespread pain, fatigue, poor sleep</text>
<text x="582" y="592" font-size="21" fill="#edf2ff" font-weight="400">No inflammatory joint damage</text>
<text x="582" y="623" font-size="21" fill="#edf2ff" font-weight="400">No specific diagnostic blood test</text>
<text x="582" y="654" font-size="21" fill="#edf2ff" font-weight="400">Priority: sleep, activity + pain care</text>
<rect x="36" y="747" width="1028" height="53" rx="18" fill="#2e2c41" stroke="#aa9bdc" stroke-width="2"/>
<text x="56" y="781" font-size="24" fill="#e0d6ff" font-weight="700">Normal tests do not invalidate pain. These conditions can coexist.</text>
<text x="36" y="838" font-size="16" fill="#abbddb" font-weight="400">Sources: NIAMS rheumatoid arthritis, lupus, gout and fibromyalgia patient resources.</text>
<text x="36" y="864" font-size="15" fill="#abbddb" font-weight="400">Study aid • Reviewed September 23, 2026 • Source links and text version accompany this graphic.</text>
</g></svg>