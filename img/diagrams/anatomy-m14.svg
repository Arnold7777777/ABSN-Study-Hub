<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 426" role="img" aria-label="One nephron drawn along the path filtrate takes: afferent arteriole, glomerulus in Bowman capsule, proximal tubule, loop of Henle, distal tubule and collecting duct. Below, the route urine takes out, and the male and female reproductive tracts side by side."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffd76a"/></marker></defs><rect x="2" y="2" width="716" height="422" rx="16" fill="rgba(10,8,22,.55)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><text x="24" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">ONE NEPHRON, IN ORDER</text><rect x="24" y="52" width="412" height="46" rx="10" fill="rgba(157,92,255,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><circle cx="46" cy="75" r="13" fill="#ffd76a"/><text x="46" y="81" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">1</text><text x="68" y="72" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Afferent arteriole</text><text x="68" y="91" font-size="17" font-weight="800" fill="#e9dcff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">wide in — keeps the pressure up</text><line x1="46" y1="98" x2="46" y2="106" stroke="#ffd76a" stroke-width="2.4" marker-end="url(#ah)"/><rect x="24" y="106" width="412" height="46" rx="10" fill="rgba(157,92,255,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><circle cx="46" cy="129" r="13" fill="#ffd76a"/><text x="46" y="135" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">2</text><text x="68" y="126" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Glomerulus in Bowman capsule</text><text x="68" y="145" font-size="17" font-weight="800" fill="#e9dcff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">pressure pushes filtrate out</text><line x1="46" y1="152" x2="46" y2="160" stroke="#ffd76a" stroke-width="2.4" marker-end="url(#ah)"/><rect x="24" y="160" width="412" height="46" rx="10" fill="rgba(157,92,255,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><circle cx="46" cy="183" r="13" fill="#ffd76a"/><text x="46" y="189" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">3</text><text x="68" y="180" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Proximal convoluted tubule</text><text x="68" y="199" font-size="17" font-weight="800" fill="#e9dcff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">most of it is taken straight back</text><line x1="46" y1="206" x2="46" y2="214" stroke="#ffd76a" stroke-width="2.4" marker-end="url(#ah)"/><rect x="24" y="214" width="412" height="46" rx="10" fill="rgba(157,92,255,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><circle cx="46" cy="237" r="13" fill="#ffd76a"/><text x="46" y="243" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">4</text><text x="68" y="234" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Loop of Henle</text><text x="68" y="253" font-size="17" font-weight="800" fill="#e9dcff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">concentrates the urine</text><line x1="46" y1="260" x2="46" y2="268" stroke="#ffd76a" stroke-width="2.4" marker-end="url(#ah)"/><rect x="24" y="268" width="412" height="46" rx="10" fill="rgba(157,92,255,.5)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><circle cx="46" cy="291" r="13" fill="#ffd76a"/><text x="46" y="297" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">5</text><text x="68" y="288" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Distal tubule + collecting duct</text><text x="68" y="307" font-size="17" font-weight="800" fill="#e9dcff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">hormones do the fine tuning</text><text x="460" y="32" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THEN OUT</text><rect x="460" y="52" width="236" height="46" rx="10" fill="rgba(0,194,199,.45)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="578" y="82" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Kidney</text><line x1="578" y1="98" x2="578" y2="106" stroke="#ffd76a" stroke-width="2.4" marker-end="url(#ah)"/><rect x="460" y="106" width="236" height="46" rx="10" fill="rgba(0,194,199,.45)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="578" y="136" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Ureter</text><line x1="578" y1="152" x2="578" y2="160" stroke="#ffd76a" stroke-width="2.4" marker-end="url(#ah)"/><rect x="460" y="160" width="236" height="46" rx="10" fill="rgba(0,194,199,.45)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="578" y="190" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Bladder</text><line x1="578" y1="206" x2="578" y2="214" stroke="#ffd76a" stroke-width="2.4" marker-end="url(#ah)"/><rect x="460" y="214" width="236" height="46" rx="10" fill="rgba(0,194,199,.45)" stroke="rgba(255,255,255,.5)" stroke-width="2"/><text x="578" y="244" font-size="19" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">Urethra</text><text x="460" y="288" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Kidneys sit behind</text><text x="460" y="310" font-size="17" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">the peritoneum</text><text x="24" y="344" font-size="17" font-weight="800" fill="#ffd76a" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">THE TWO TRACTS</text><rect x="24" y="356" width="316" height="58" rx="10" fill="rgba(91,124,250,.55)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="36" y="380" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Male: testes → epididymis</text><text x="36" y="402" font-size="17" font-weight="800" fill="#dbe4ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Prostate adds the fluid</text><rect x="352" y="356" width="344" height="58" rx="10" fill="rgba(255,59,107,.55)" stroke="rgba(255,255,255,.55)" stroke-width="2"/><text x="364" y="380" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Female: ovary, tube, uterus</text><text x="364" y="402" font-size="17" font-weight="800" fill="#ffe0e8" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Fertilize in the tube</text></svg>