<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Increased intracranial pressure</title><desc id="d">The skull as a fixed box with three contents, the early and late signs including Cushing triad, and the nursing measures that lower pressure.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="560" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">INCREASED ICP — A FIXED BOX WITH THREE THINGS IN IT</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Brain, blood and CSF share one rigid skull. If one grows, another must shrink, or the pressure rises.</text><rect x="24" y="92" width="400" height="216" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="216" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">THE MONRO–KELLIE RULE</text><rect x="70" y="142" width="300" height="120" rx="16" fill="none" stroke="#cfd4ff" stroke-width="4" stroke-opacity=".7"/><rect x="76" y="148" width="230" height="108" rx="10" fill="#9d5cff" fill-opacity=".55"/><text x="191.0" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="900" fill="#fff" fill-opacity="1" text-anchor="middle">Brain</text><text x="191.0" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle">80%</text><rect x="308" y="148" width="28" height="108" rx="10" fill="#ff3b6b" fill-opacity=".55"/><text x="322.0" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="900" fill="#fff" fill-opacity="1" text-anchor="middle">Blood</text><text x="322.0" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle">10%</text><rect x="338" y="148" width="28" height="108" rx="10" fill="#00c2c7" fill-opacity=".55"/><text x="352.0" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="900" fill="#fff" fill-opacity="1" text-anchor="middle">CSF</text><text x="352.0" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="middle">10%</text><text x="44" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#cfe0ff" fill-opacity="1" text-anchor="start">Normal ICP is 5 to 15 mmHg. Above 20 sustained is treated.</text><rect x="440" y="92" width="436" height="216" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="440" y="92" width="5" height="216" rx="2.5" fill="#ffc233"/><text x="460" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.8" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ EARLY SIGNS COME FIRST — AND THEY ARE SUBTLE</text><text x="460" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#ffc233" fill-opacity="1" text-anchor="start">EARLY</text><circle cx="462" cy="163.5" r="2.6" fill="#ffeec2"/><text x="472" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">A change in level of consciousness — the first sign</text><circle cx="462" cy="181.5" r="2.6" fill="#ffeec2"/><text x="472" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Restless, confused, harder to rouse</text><circle cx="462" cy="199.5" r="2.6" fill="#ffeec2"/><text x="472" y="204" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Headache, worse in the morning</text><circle cx="462" cy="217.5" r="2.6" fill="#ffeec2"/><text x="472" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Vomiting without nausea, often projectile</text><text x="460" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="900" fill="#ff3b6b" fill-opacity="1" text-anchor="start">LATE</text><circle cx="462" cy="265.5" r="2.6" fill="#ffd9e2"/><text x="472" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Pupil fixed and dilated on one side</text><circle cx="462" cy="283.5" r="2.6" fill="#ffd9e2"/><text x="472" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Posturing, then no response at all</text><rect x="24" y="324" width="420" height="138" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="324" width="5" height="138" rx="2.5" fill="#ff3b6b"/><text x="44" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.8" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨 CUSHING TRIAD — HERNIATION IS HAPPENING</text><rect x="46" y="364" width="376" height="22" rx="8" fill="#ff3b6b" fill-opacity=".22"/><text x="54" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">BP</text><text x="126" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">widening pulse pressure</text><text x="414" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="end">↑ sys, ↓ dia</text><rect x="46" y="390" width="376" height="22" rx="8" fill="#ff3b6b" fill-opacity=".22"/><text x="54" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Pulse</text><text x="126" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">bradycardia</text><text x="414" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="end">slow, bounding</text><rect x="46" y="416" width="376" height="22" rx="8" fill="#ff3b6b" fill-opacity=".22"/><text x="54" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Breathing</text><text x="126" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">irregular</text><text x="414" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="end">Cheyne-Stokes</text><text x="46" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">This is late. Call before you finish assessing.</text><rect x="460" y="324" width="416" height="138" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="324" width="5" height="138" rx="2.5" fill="#12b886"/><text x="480" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅ WHAT LOWERS THE PRESSURE</text><circle cx="482" cy="371.5" r="2.6" fill="#bff3e2"/><text x="492" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#eaecff"><tspan font-weight="800">Head of bed 30°,</tspan><tspan> head midline — never flexed.</tspan></text><circle cx="482" cy="389.5" r="2.6" fill="#bff3e2"/><text x="492" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#eaecff"><tspan font-weight="800">No hip flexion,</tspan><tspan> no straining, no Valsalva.</tspan></text><circle cx="482" cy="407.5" r="2.6" fill="#bff3e2"/><text x="492" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#eaecff"><tspan font-weight="800">Cluster care;</tspan><tspan> space out anything stimulating.</tspan></text><circle cx="482" cy="425.5" r="2.6" fill="#bff3e2"/><text x="492" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" fill="#eaecff"><tspan font-weight="800">Mannitol or hypertonic saline;</tspan><tspan> watch osmolality.</tspan></text><rect x="24" y="478" width="852" height="60" rx="14" fill="#ffc233" fill-opacity=".20" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="478" width="5" height="60" rx="2.5" fill="#ffc233"/><text x="44" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ THE ONE TO REMEMBER</text><text x="44" y="526" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.6" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">A change in level of consciousness is the earliest sign, every time. By the time the pupils change, you are already late.</text></svg>