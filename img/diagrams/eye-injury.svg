<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Eye injuries</title><desc id="d">A cross-section of the eye labelled, then the four injury types with what you do and never do for each.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="580" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#00c2c7" fill-opacity=".22" stroke="#00c2c7" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#00c2c7"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#00c2c7">EYE INJURY — WHAT YOU DO IN THE FIRST FIVE MINUTES</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Chemical, penetrating, blunt or foreign body. Only one of them gets irrigated.</text><rect x="24" y="92" width="400" height="216" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="216" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">THE PARTS THAT GET INJURED</text><ellipse cx="200" cy="210" rx="86" ry="72" fill="#eef1ff" fill-opacity=".14" stroke="#9fb6ff" stroke-opacity=".6" stroke-width="2"/><path d="M116 240 q-34 -30 0 -60 q10 26 0 60z" fill="#bfe6ff" fill-opacity=".55" stroke="#bfe6ff" stroke-opacity=".8"/><ellipse cx="144" cy="210" rx="34" ry="46" fill="#5b7fb8" fill-opacity=".85"/><ellipse cx="144" cy="210" rx="17" ry="26" fill="#0d0819"/><ellipse cx="144" cy="210" rx="42" ry="52" fill="none" stroke="#bfe6ff" stroke-opacity=".8" stroke-width="3"/><circle cx="252" cy="210" r="16" fill="#f7f4ff" fill-opacity=".85"/><path d="M82 152 L116 180" stroke="#cfd4ff" stroke-opacity=".7" stroke-width="1.3"/><text x="82" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#cfd4ff" fill-opacity="1" text-anchor="end">cornea</text><path d="M96 272 L130 244" stroke="#cfd4ff" stroke-opacity=".7" stroke-width="1.3"/><text x="96" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#cfd4ff" fill-opacity="1" text-anchor="end">iris</text><path d="M272 152 L240 164" stroke="#cfd4ff" stroke-opacity=".7" stroke-width="1.3"/><text x="272" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#cfd4ff" fill-opacity="1" text-anchor="start">sclera</text><path d="M296 268 L256 226" stroke="#cfd4ff" stroke-opacity=".7" stroke-width="1.3"/><text x="296" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#cfd4ff" fill-opacity="1" text-anchor="start">lens</text><rect x="440" y="92" width="436" height="216" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="440" y="92" width="5" height="216" rx="2.5" fill="#ff3b6b"/><text x="460" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨 CHEMICAL SPLASH — THE ONLY ONE YOU FLUSH</text><text x="460" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Irrigate first. Do not wait for an assessment.</text><circle cx="462" cy="169.5" r="2.6" fill="#ffd9e2"/><text x="472" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Copious water or saline,</tspan><tspan> at least 15 to 20 minutes.</tspan></text><circle cx="462" cy="188.5" r="2.6" fill="#ffd9e2"/><text x="472" y="193" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Flush inner corner outward</tspan><tspan> — away from the other eye.</tspan></text><circle cx="462" cy="207.5" r="2.6" fill="#ffd9e2"/><text x="472" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Hold the lid open;</tspan><tspan> she will want to squeeze it shut.</tspan></text><circle cx="462" cy="226.5" r="2.6" fill="#ffd9e2"/><text x="472" y="231" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Alkali (drain cleaner, lime)</tspan><tspan> is worse than acid — it keeps going.</tspan></text><circle cx="462" cy="245.5" r="2.6" fill="#ffd9e2"/><text x="472" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Remove contacts</tspan><tspan> if they come out easily. Do not dig.</tspan></text><circle cx="462" cy="264.5" r="2.6" fill="#ffd9e2"/><text x="472" y="269" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Only then</tspan><tspan> check visual acuity and call.</tspan></text><rect x="24" y="324" width="852" height="76" rx="14" fill="#ffc233" fill-opacity=".20" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="324" width="5" height="76" rx="2.5" fill="#ffc233"/><text x="44" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Penetrating / impaled object</text><circle cx="46" cy="363.5" r="2.6" fill="#dfe2ff"/><text x="56" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.9" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Stabilise the object where it is — never remove it.</text><circle cx="46" cy="380.5" r="2.6" fill="#dfe2ff"/><text x="56" y="385" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.9" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Cover BOTH eyes; the eyes move together.</text><circle cx="46" cy="397.5" r="2.6" fill="#dfe2ff"/><text x="56" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.9" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Nothing by mouth, head of bed up, to theatre.</text><rect x="24" y="408" width="852" height="76" rx="14" fill="#ff8a3d" fill-opacity=".20" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="408" width="5" height="76" rx="2.5" fill="#ff8a3d"/><text x="44" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Blunt trauma — the black eye</text><circle cx="46" cy="447.5" r="2.6" fill="#dfe2ff"/><text x="56" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.9" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Ice 15 min on, 15 off, for the first 24 hours.</text><circle cx="46" cy="464.5" r="2.6" fill="#dfe2ff"/><text x="56" y="469" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.9" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Watch for hyphaema — blood pooling in front of the iris.</text><circle cx="46" cy="481.5" r="2.6" fill="#dfe2ff"/><text x="56" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.9" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Sudden pain with a hard globe is acute glaucoma.</text><rect x="24" y="492" width="852" height="76" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="492" width="5" height="76" rx="2.5" fill="#12b886"/><text x="44" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Foreign body on the surface</text><circle cx="46" cy="531.5" r="2.6" fill="#dfe2ff"/><text x="56" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.9" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Do not rub. Blink, then irrigate gently.</text><circle cx="46" cy="548.5" r="2.6" fill="#dfe2ff"/><text x="56" y="553" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.9" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Evert the upper lid to look under it.</text><circle cx="46" cy="565.5" r="2.6" fill="#dfe2ff"/><text x="56" y="570" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.9" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Rust ring or embedded metal goes to a provider.</text><rect x="24" y="552" width="852" height="0" rx="14" fill="#ff3b6b" fill-opacity=".0" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="552" width="5" height="0" rx="2.5" fill="#ff3b6b"/></svg>