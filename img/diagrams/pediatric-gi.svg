<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 706" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Paediatric GI emergencies</title><desc id="d">Three drawings: a thickened pyloric muscle blocking the way out of the stomach, a length of bowel telescoped inside the next length, and a segment of colon with no nerve cells so nothing moves past it. Under each, the age, the vomit, the stool and the abdomen. Below, what matters most in each.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="706" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff8a3d"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff8a3d">THREE GUTS, THREE DIFFERENT PROBLEMS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">How the baby vomits and what the stool looks like tells you which one you are looking at.</text><rect x="24" y="96" width="288" height="366" rx="14" fill="#ffc233" fill-opacity=".15" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="366" rx="2.5" fill="#ffc233"/><text x="168.0" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">PYLORIC STENOSIS</text><text x="168.0" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">3 to 6 weeks old</text><path d="M160 174 q-46 6 -46 44 q0 34 40 40 q26 4 34 -14" fill="#e9c9b6" fill-opacity=".22" stroke="#e9c9b6" stroke-opacity=".7" stroke-width="3"/><text x="124.0" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="middle">stomach</text><path d="M194 230 q22 -10 34 0 v34 q-12 10 -34 0 z" fill="#ff3b6b" fill-opacity=".85"/><path d="M211 232 v34" stroke="#0b0716" stroke-width="3"/><text x="238.0" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">muscle</text><text x="238.0" y="249" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">thickened</text><text x="238.0" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">shut</text><path d="M138.0 180 L96.0 162" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="110.0" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">PROJECTILE</text><text x="40" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Vomit</text><text x="134" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">projectile, NO bile</text><text x="40" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Stool</text><text x="134" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">constipated, small</text><text x="40" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Abdomen</text><text x="134" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">olive mass, RUQ</text><text x="40" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start"></text><text x="134" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">visible peristalsis</text><text x="40" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Hungry after?</text><text x="134" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">YES — ravenous</text><text x="40" y="414" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Losing gastric acid →</text><text x="40" y="431" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">metabolic ALKALOSIS with</text><text x="40" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">low K and low Cl.</text><rect x="316" y="96" width="288" height="366" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="316" y="96" width="5" height="366" rx="2.5" fill="#ff3b6b"/><text x="460.0" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">INTUSSUSCEPTION</text><text x="460.0" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">6 months to 3 years</text><path d="M364 214 h72" stroke="#e9c9b6" stroke-opacity=".7" stroke-width="30" stroke-linecap="round"/><path d="M454 214 h84" stroke="#e9c9b6" stroke-opacity=".45" stroke-width="42" stroke-linecap="round"/><path d="M452 214 h44" stroke="#ff3b6b" stroke-opacity=".9" stroke-width="24" stroke-linecap="round"/><path d="M416.0 176 L466.0 176" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="440.0" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">telescopes IN</text><text x="476.0" y="258" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">sausage-shaped mass</text><text x="476.0" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">you can feel</text><text x="332" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Vomit</text><text x="426" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">bile-stained</text><text x="332" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Stool</text><text x="426" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">CURRANT-JELLY —</text><text x="332" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start"></text><text x="426" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">blood and mucus</text><text x="332" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Abdomen</text><text x="426" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">sausage mass; she</text><text x="332" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start"></text><text x="426" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">draws her knees up</text><text x="332" y="414" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">A stool that suddenly looks</text><text x="332" y="431" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">normal can mean it has</text><text x="332" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">reduced — tell the surgeon.</text><rect x="608" y="96" width="288" height="366" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="608" y="96" width="5" height="366" rx="2.5" fill="#2f6bff"/><text x="752.0" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">HIRSCHSPRUNG</text><text x="752.0" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">newborn</text><path d="M648 214 h96" stroke="#e9c9b6" stroke-opacity=".65" stroke-width="34" stroke-linecap="round"/><path d="M756 214 h56" stroke="#ff3b6b" stroke-opacity=".9" stroke-width="18" stroke-linecap="round"/><circle cx="656" cy="188" r="2.6" fill="#12b886"/><circle cx="676" cy="188" r="2.6" fill="#12b886"/><circle cx="696" cy="188" r="2.6" fill="#12b886"/><circle cx="716" cy="188" r="2.6" fill="#12b886"/><circle cx="736" cy="188" r="2.6" fill="#12b886"/><text x="690.0" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">nerves present</text><text x="798.0" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">NO nerve cells</text><text x="688.0" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#e6d0bd" fill-opacity="1" text-anchor="middle">distended above</text><text x="798.0" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">narrow — nothing</text><text x="798.0" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">gets past</text><text x="624" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Vomit</text><text x="718" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">bile-stained</text><text x="624" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Stool</text><text x="718" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">ribbon-like, thin</text><text x="624" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start"></text><text x="718" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">NO meconium in 48 h</text><text x="624" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Abdomen</text><text x="718" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">distended</text><text x="624" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Hungry after?</text><text x="718" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">no</text><text x="624" y="414" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">No ganglion cells, so that</text><text x="624" y="431" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">segment never relaxes.</text><text x="624" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">It is removed surgically.</text><rect x="24" y="480" width="872" height="176" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="480" width="5" height="176" rx="2.5" fill="#ffc233"/><text x="46" y="512" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐  THE ONE THAT IS ALWAYS ASKED</text><text x="46" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">"Projectile vomiting, then immediately hungry again, in a four-week-old" is pyloric stenosis,</text><text x="46" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">every time. The stomach empties forcefully but nothing gets through, so the baby is genuinely starving.</text><text x="46" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Bile in the vomit means the blockage is BELOW the duodenum. No bile means it is above it —</text><text x="46" y="624" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">which is why pyloric stenosis is the non-bilious one and the other two are not.</text><text x="46" y="650" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">All three are surgical. All three need fluids and electrolytes corrected first.</text></svg>