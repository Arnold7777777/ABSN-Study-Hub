<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 756" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Autonomic dysreflexia</title><desc id="d">The spinal cord drawn vertically with the injury marked at T6. Below the injury a full bladder sends a pain signal racing up; above the injury the brain sends a stop signal back down and it is blocked at the level of the injury, so the vasoconstriction below never switches off. The picture splits at T6 - flushed and sweating above, pale and cold below. Beside it the loop, the vital signs, and the order of actions, which begins with sitting her upright.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="756" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">AUTONOMIC DYSREFLEXIA — T6 AND ABOVE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Below the injury the body screams. Above it, nobody can hear. BP ↑↑↑ with HR ↓.</text><rect x="24" y="96" width="396" height="416" rx="14" fill="#2f6bff" fill-opacity=".13" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="416" rx="2.5" fill="#2f6bff"/><rect x="38" y="112" width="368" height="176" rx="10" fill="#ff3b6b" fill-opacity=".11"/><rect x="38" y="304" width="368" height="194" rx="10" fill="#2f6bff" fill-opacity=".11"/><circle cx="174" cy="158" r="22" fill="#ffd9c2" fill-opacity=".45" stroke="#ffd9c2" stroke-opacity=".75" stroke-width="2"/><path d="M174 188 V468" stroke="#ffd9c2" stroke-opacity=".35" stroke-width="26" stroke-linecap="round"/><rect x="166" y="188.0" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".9"/><rect x="166" y="212.4" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".9"/><rect x="166" y="236.7" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".9"/><rect x="166" y="261.1" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".9"/><rect x="166" y="285.5" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".9"/><rect x="166" y="309.8" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".40"/><rect x="166" y="334.2" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".40"/><rect x="166" y="358.5" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".40"/><rect x="166" y="382.9" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".40"/><rect x="166" y="407.3" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".40"/><rect x="166" y="431.6" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".40"/><rect x="166" y="456.0" width="16" height="12" rx="3.5" fill="#cfd4ff" fill-opacity=".40"/><path d="M142 296 H206" stroke="#ff3b6b" stroke-width="5" stroke-linecap="round"/><path d="M166 288 l15 15 M181 288 l-15 15" stroke="#ff3b6b" stroke-width="4.5" stroke-linecap="round"/><text x="216" y="301" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">T6 — the injury</text><path d="M128 438 L128 314" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="46" y="404" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#cfd4ff" fill-opacity="1" text-anchor="start">pain signal</text><text x="46" y="419" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#cfd4ff" fill-opacity="1" text-anchor="start">races up</text><path d="M128 206 L128 278" stroke="#ff3b6b" stroke-width="2.4" fill="none" marker-end="url(#arR)"/><text x="46" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffb3c4" fill-opacity="1" text-anchor="start">"STOP" from</text><text x="46" y="249" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">the brain —</text><text x="46" y="264" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffb3c4" fill-opacity="1" text-anchor="start">blocked at T6</text><text x="216" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ABOVE the injury</text><text x="216" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">· flushed, sweating</text><text x="216" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">· pounding headache</text><text x="216" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">· blurred vision</text><text x="216" y="212" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">· nasal congestion</text><text x="216" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">· vessels DILATED</text><text x="216" y="354" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">BELOW the injury</text><text x="216" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· pale, cold, goosebumps</text><text x="216" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· nothing felt at all</text><text x="216" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">· vessels CLAMPED SHUT</text><ellipse cx="174" cy="464" rx="24" ry="20" fill="#ffc233" fill-opacity=".55" stroke="#ffc233" stroke-width="2.4"/><text x="174" y="469" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1a1005" fill-opacity="1" text-anchor="middle">💧</text><text x="208" y="458" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Full bladder — the usual</text><text x="208" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">trigger. Or impacted bowel,</text><text x="208" y="489" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">or anything painful below.</text><rect x="440" y="96" width="456" height="176" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="440" y="96" width="5" height="176" rx="2.5" fill="#ff3b6b"/><text x="458" y="122" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🧬  WHY THE PRESSURE NEVER COMES DOWN</text><circle cx="468" cy="142" r="9" fill="#ff3b6b" fill-opacity=".9"/><text x="468" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">1</text><text x="484" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe0e8" fill-opacity="1" text-anchor="start">Something painful below the injury — usually a full bladder</text><circle cx="468" cy="166" r="9" fill="#ff3b6b" fill-opacity=".9"/><text x="468" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">2</text><text x="484" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe0e8" fill-opacity="1" text-anchor="start">Sympathetic surge → everything below clamps shut</text><circle cx="468" cy="190" r="9" fill="#ff3b6b" fill-opacity=".9"/><text x="468" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">3</text><text x="484" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe0e8" fill-opacity="1" text-anchor="start">Blood pressure spikes, dangerously</text><circle cx="468" cy="214" r="9" fill="#ff3b6b" fill-opacity=".9"/><text x="468" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">4</text><text x="484" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe0e8" fill-opacity="1" text-anchor="start">The brain notices and sends the stop signal down</text><circle cx="468" cy="238" r="9" fill="#ff3b6b" fill-opacity=".9"/><text x="468" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">5</text><text x="484" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffe0e8" fill-opacity="1" text-anchor="start">It cannot get past the injury. The crisis continues.</text><rect x="440" y="286" width="456" height="88" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="440" y="286" width="5" height="88" rx="2.5" fill="#ffc233"/><text x="458" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">BP ↑↑↑   with   HR ↓</text><text x="458" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Compare to HER baseline, not to 120/80. Many people with a high</text><text x="458" y="358" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">injury run a systolic in the 90s — a 40 mmHg rise is the crisis.</text><rect x="440" y="388" width="456" height="124" rx="14" fill="#2f6bff" fill-opacity=".13" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="440" y="388" width="5" height="124" rx="2.5" fill="#2f6bff"/><text x="458" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">THE SPLIT IS THE GIVEAWAY</text><text x="548" y="434" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ABOVE</text><text x="718" y="434" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">BELOW</text><text x="458" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Vessels</text><text x="548" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">dilated</text><text x="718" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">clamped shut</text><text x="458" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Skin</text><text x="548" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">flushed, sweating</text><text x="718" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">pale, cold, goosebumps</text><text x="458" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Feels</text><text x="548" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffc9d6" fill-opacity="1" text-anchor="start">pounding headache</text><text x="718" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">nothing at all</text><rect x="24" y="530" width="872" height="194" rx="14" fill="#12b886" fill-opacity=".15" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="530" width="5" height="194" rx="2.5" fill="#12b886"/><text x="46" y="558" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  WHAT YOU DO — AND THE FIRST ONE IS BACKWARDS</text><rect x="46" y="568" width="72" height="19" rx="9.5" fill="#ff3b6b" fill-opacity=".9"/><text x="82" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">1 · FIRST</text><text x="128" y="582" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eaf6f0" fill-opacity="1" text-anchor="start">Sit her UPRIGHT and lower the legs. Gravity drops the pressure within</text><text x="128" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eaf6f0" fill-opacity="1" text-anchor="start">seconds. This is the one emergency where you do NOT lie her flat.</text><rect x="46" y="612" width="72" height="19" rx="9.5" fill="#ff8a3d" fill-opacity=".9"/><text x="82" y="626" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">2</text><text x="128" y="626" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eaf6f0" fill-opacity="1" text-anchor="start">Loosen everything tight — clothing, abdominal binder, stockings, straps.</text><rect x="46" y="640" width="72" height="19" rx="9.5" fill="#ffc233" fill-opacity=".9"/><text x="82" y="654" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">3</text><text x="128" y="654" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eaf6f0" fill-opacity="1" text-anchor="start">Find the trigger, bladder first: a kinked or blocked catheter, or a full bladder.</text><text x="128" y="670" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eaf6f0" fill-opacity="1" text-anchor="start">Then check for impaction, then the skin.</text><rect x="46" y="684" width="72" height="19" rx="9.5" fill="#2f6bff" fill-opacity=".9"/><text x="82" y="698" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">4</text><text x="128" y="698" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eaf6f0" fill-opacity="1" text-anchor="start">Blood pressure every 2–5 minutes throughout.</text><rect x="46" y="712" width="72" height="19" rx="9.5" fill="#12b886" fill-opacity=".9"/><text x="82" y="726" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1a1005" fill-opacity="1" text-anchor="middle">5</text><text x="128" y="726" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eaf6f0" fill-opacity="1" text-anchor="start">Still high once the trigger is gone → rapid-acting antihypertensive, as prescribed.</text></svg>