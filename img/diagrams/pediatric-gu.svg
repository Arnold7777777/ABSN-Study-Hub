<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Pediatric genitourinary</title><desc id="d">Hypospadias drawn with the urethral opening on the underside and the foreskin marked as tissue the surgeon needs, so it is never circumcised. Beside it cryptorchidism, an empty scrotum with the testis still undescended. Below, care after repair, and enuresis.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="640" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">DO NOT CIRCUMCISE A BABY WITH HYPOSPADIAS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">The surgeon uses that foreskin tissue to reconstruct the urethra. Once it is gone, it is gone.</text><rect x="24" y="96" width="470" height="268" rx="14" fill="#2f6bff" fill-opacity=".16" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="268" rx="2.5" fill="#2f6bff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">👶  THE TWO FOUND AT THE NEWBORN EXAM</text><rect x="46" y="142" width="196" height="164" rx="12" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".72"/><text x="144" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">HYPOSPADIAS</text><path d="M110 208 h56 q12 0 12 14 q0 14 -12 14 h-56 q-12 0 -12 -14 q0 -14 12 -14 z" fill="#ffd9c2" fill-opacity=".45"/><circle cx="160" cy="236" r="5" fill="#ff3b6b"/><text x="174" y="258" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">opening on the</text><text x="174" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">UNDERSIDE</text><path d="M178 212 q-14 8 0 16" fill="none" stroke="#12b886" stroke-width="5" stroke-linecap="round"/><text x="60" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">the surgeon</text><text x="60" y="214" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">needs this</text><text x="144" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">NEVER circumcise</text><rect x="266" y="142" width="196" height="164" rx="12" fill="#ffc233" fill-opacity=".14" stroke="#ffc233" stroke-opacity=".72"/><text x="364" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">CRYPTORCHIDISM</text><ellipse cx="342" cy="244" rx="20" ry="26" fill="#ffd9c2" fill-opacity=".35" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="2"/><ellipse cx="386" cy="244" rx="20" ry="26" fill="#ffd9c2" fill-opacity=".35" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="2"/><circle cx="342" cy="246" r="10" fill="#ffc233" fill-opacity=".9"/><circle cx="394" cy="188" r="10" fill="#ffc233" fill-opacity=".9"/><path d="M394 202 L388 230" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="414" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">still up</text><text x="342" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">empty</text><text x="364" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">orchiopexy by 6–18 months</text><text x="46" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Repair for both is usually at 6 to 18 months. Orchiopexy protects</text><text x="46" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">fertility and makes cancer surveillance possible later.</text><rect x="514" y="96" width="382" height="268" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="268" rx="2.5" fill="#12b886"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  AFTER THE REPAIR</text><text x="532" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· DOUBLE NAPPY technique to protect the stent</text><text x="532" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  or catheter — the inner one catches stool,</text><text x="532" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  the outer one holds the tubing away from it</text><text x="532" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Watch the urine output, and any bleeding</text><text x="532" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Encourage fluids; the stream should be strong</text><text x="532" y="264" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· No straddle toys, sandpits or rough play for</text><text x="532" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  a few weeks — and no bike riding after</text><text x="532" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  an orchiopexy, where the testis is stitched</text><text x="532" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  in place and must not be pulled on</text><rect x="24" y="382" width="872" height="200" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="382" width="5" height="200" rx="2.5" fill="#ffc233"/><text x="46" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🛀  ENURESIS — WHAT ACTUALLY HELPS</text><text x="46" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">Bedwetting is normal until about age 5, and even then it is common. It is not laziness and it is not deliberate.</text><text x="46" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Fluids earlier in the day, less in the evening</text><text x="46" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Empty the bladder right before bed</text><text x="46" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· A bed alarm is the most effective single measure</text><text x="46" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Reward the dry nights; never punish the wet ones</text><text x="484" y="474" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Rule out a UTI, constipation and diabetes first</text><text x="484" y="496" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Constipation is the commonest reversible cause</text><text x="484" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Let her help change the sheets — matter-of-factly</text><text x="484" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Desmopressin exists, for camps and sleepovers</text><text x="46" y="574" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Shame makes it worse and delays help. That is usually the answer the question is looking for.</text></svg>