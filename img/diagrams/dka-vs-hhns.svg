<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">DKA versus HHNS</title><desc id="d">Diabetic ketoacidosis beside hyperosmolar hyperglycaemic state, with the glucose and pH values that separate them and the treatment order.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="600" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">DKA vs HHNS — SAME EMERGENCY, TWO DIFFERENT PICTURES</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Both are dangerously high glucose. Ketones and pH are what tell them apart.</text><rect x="24" y="92" width="420" height="300" rx="14" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="300" rx="2.5" fill="#ff3b6b"/><text x="44" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🧪 DKA — type 1, ketones, acidosis</text><text x="44" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">No insulin at all, so fat is burned for fuel.</text><text x="46" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Glucose  &gt;250 mg/dL</text><rect x="46" y="172" width="240" height="14" rx="7" fill="#ffffff" fill-opacity=".10"/><rect x="106" y="172" width="55" height="14" rx="7" fill="#ff3b6b" fill-opacity=".85"/><text x="294" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">high</text><text x="46" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">pH  &lt;7.35</text><rect x="46" y="218" width="240" height="14" rx="7" fill="#ffffff" fill-opacity=".10"/><rect x="58" y="218" width="60" height="14" rx="7" fill="#ff3b6b" fill-opacity=".85"/><text x="294" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ACIDIC</text><text x="46" y="256" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Bicarbonate  &lt;18</text><rect x="46" y="264" width="240" height="14" rx="7" fill="#ffffff" fill-opacity=".10"/><rect x="55" y="264" width="52" height="14" rx="7" fill="#ff3b6b" fill-opacity=".85"/><text x="294" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">low</text><text x="46" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Ketones</text><rect x="46" y="310" width="240" height="14" rx="7" fill="#ffffff" fill-opacity=".10"/><rect x="214" y="310" width="62" height="14" rx="7" fill="#ff3b6b" fill-opacity=".85"/><text x="294" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">PRESENT</text><circle cx="46" cy="347.5" r="2.6" fill="#ffd9e2"/><text x="56" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Kussmaul breathing,</tspan><tspan> fruity breath, abdominal pain.</tspan></text><circle cx="46" cy="366.5" r="2.6" fill="#ffd9e2"/><text x="56" y="371" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Hours to develop.</tspan><tspan> Often the first sign of type 1.</tspan></text><rect x="460" y="92" width="416" height="300" rx="14" fill="#ff8a3d" fill-opacity=".20" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="92" width="5" height="300" rx="2.5" fill="#ff8a3d"/><text x="480" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.4" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">🌊 HHNS — type 2, no ketones, dehydration</text><text x="480" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" font-weight="700" fill="#ffd9bd" fill-opacity="1" text-anchor="start">Some insulin left, so fat is not burned. Just water loss.</text><text x="482" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Glucose  &gt;600 mg/dL</text><rect x="482" y="172" width="236" height="14" rx="7" fill="#ffffff" fill-opacity=".10"/><rect x="623" y="172" width="84" height="14" rx="7" fill="#ff8a3d" fill-opacity=".85"/><text x="726" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">extreme</text><text x="482" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">pH  normal</text><rect x="482" y="218" width="236" height="14" rx="7" fill="#ffffff" fill-opacity=".10"/><rect x="557" y="218" width="66" height="14" rx="7" fill="#ff8a3d" fill-opacity=".85"/><text x="726" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">normal</text><text x="482" y="256" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Bicarbonate  normal</text><rect x="482" y="264" width="236" height="14" rx="7" fill="#ffffff" fill-opacity=".10"/><rect x="557" y="264" width="66" height="14" rx="7" fill="#ff8a3d" fill-opacity=".85"/><text x="726" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">normal</text><text x="482" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Ketones</text><rect x="482" y="310" width="236" height="14" rx="7" fill="#ffffff" fill-opacity=".10"/><rect x="486" y="310" width="14" height="14" rx="7" fill="#ff8a3d" fill-opacity=".85"/><text x="726" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">ABSENT</text><circle cx="482" cy="347.5" r="2.6" fill="#ffd9bd"/><text x="492" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Profound dehydration,</tspan><tspan> altered mental status, seizures.</tspan></text><circle cx="482" cy="366.5" r="2.6" fill="#ffd9bd"/><text x="492" y="371" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Days to develop.</tspan><tspan> Older adults. Higher mortality.</tspan></text><rect x="24" y="408" width="852" height="116" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="408" width="5" height="116" rx="2.5" fill="#12b886"/><text x="44" y="436" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅ TREATMENT — SAME ORDER FOR BOTH</text><circle cx="60" cy="476" r="14" fill="#12b886"/><text x="60" y="481" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">1</text><text x="82" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">FLUIDS first</text><text x="82" y="489" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">0.9% saline. Volume,</text><text x="82" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">not sugar, is what kills.</text><path d="M244 476 L254 476" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="272" cy="476" r="14" fill="#12b886"/><text x="272" y="481" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">2</text><text x="294" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Insulin drip</text><text x="294" y="489" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">Regular insulin,</text><text x="294" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">IV only.</text><path d="M456 476 L466 476" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="484" cy="476" r="14" fill="#12b886"/><text x="484" y="481" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">3</text><text x="506" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">POTASSIUM</text><text x="506" y="489" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">Insulin drives K+ in,</text><text x="506" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">so it will fall.</text><path d="M668 476 L678 476" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="696" cy="476" r="14" fill="#12b886"/><text x="696" y="481" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">4</text><text x="718" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Add dextrose</text><text x="718" y="489" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">At a glucose of 250,</text><text x="718" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#e6e9ff" fill-opacity="1" text-anchor="start">to avoid a crash.</text><rect x="24" y="540" width="852" height="60" rx="14" fill="#ffc233" fill-opacity=".20" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="540" width="5" height="60" rx="2.5" fill="#ffc233"/><text x="44" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ THE TWO THAT DECIDE IT — ketones and pH</text><text x="44" y="588" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.8" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Acidosis with ketones is DKA. A normal pH and no ketones, however high the glucose, is HHNS.</text></svg>