<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 736" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Discomforts of pregnancy, and the ones that are not</title><desc id="d">The common discomforts by trimester, each with why it happens and what actually helps, and separately the findings that are never filed as normal discomfort - swelling of the face and hands, and the supine hypotension that has one simple fix.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="736" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#12b886"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#12b886">MOST OF IT IS MECHANICAL OR HORMONAL — BUT NOT ALL OF IT</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Swelling of the FACE and HANDS is preeclampsia until proven otherwise. Never a discomfort.</text><rect x="24" y="96" width="872" height="296" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="296" rx="2.5" fill="#2f6bff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🧘  WHAT IT IS, WHY, AND WHAT ACTUALLY HELPS</text><text x="46" y="154" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Morning sickness</text><text x="46" y="167" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">hCG, first trimester</text><text x="230" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">dry crackers BEFORE rising · small frequent meals · never an empty stomach</text><text x="46" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Heartburn</text><text x="46" y="197" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">relaxed sphincter + pressure</text><text x="230" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">small meals · stay upright after eating · avoid spicy and fatty</text><text x="46" y="214" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Constipation</text><text x="46" y="227" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">slowed motility + iron</text><text x="230" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">fiber, fluids, walking. No stimulant laxatives</text><text x="46" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Leg cramps</text><text x="46" y="257" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">circulation and calcium</text><text x="230" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">DORSIFLEX the foot — do not point the toes</text><text x="46" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">Backache</text><text x="46" y="287" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">the centre of gravity has moved</text><text x="230" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">pelvic tilt exercises · low heels · side-lying with a pillow between the knees</text><text x="46" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">Varicosities, piles</text><text x="46" y="317" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">venous pressure</text><text x="230" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">elevate the legs · do not cross them · side-lying · support hose</text><text x="46" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Urinary frequency</text><text x="46" y="347" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">the uterus presses on the bladder</text><text x="230" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">normal early and late. Burning is NOT — that is a UTI</text><text x="46" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Nasal stuffiness</text><text x="46" y="377" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">increased vascularity</text><text x="230" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">humidifier, saline. Nosebleeds and bleeding gums come from the same thing</text><rect x="24" y="410" width="470" height="214" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="410" width="5" height="214" rx="2.5" fill="#ffc233"/><text x="46" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🔄  SUPINE HYPOTENSION — ONE FIX</text><path d="M80 566 h150" stroke="#8e96c8" stroke-width="4" stroke-linecap="round"/><path d="M94 542 h110" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="24" stroke-linecap="round"/><circle cx="82" cy="530" r="16" fill="#ffd9c2" fill-opacity=".5"/><ellipse cx="174" cy="528" rx="30" ry="24" fill="#f4b9c6" fill-opacity=".3" stroke="#f4b9c6" stroke-opacity=".6" stroke-width="2"/><path d="M94 560 h96" stroke="#2f6bff" stroke-width="7" stroke-linecap="round"/><text x="216" y="566" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">vena cava</text><path d="M158 552 l16 16 M174 552 l-16 16" stroke="#ff3b6b" stroke-width="4" stroke-linecap="round"/><text x="46" y="590" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Flat on her back, the uterus compresses the inferior</text><text x="46" y="608" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">vena cava. Venous return drops, so cardiac output</text><text x="46" y="626" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">drops, and so does her blood pressure.</text><rect x="514" y="410" width="382" height="214" rx="14" fill="#ff3b6b" fill-opacity=".19" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="410" width="5" height="214" rx="2.5" fill="#ff3b6b"/><text x="536" y="442" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  NOT A DISCOMFORT</text><text x="536" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Odema of the FACE and HANDS</text><text x="550" y="487" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">preeclampsia until proven otherwise</text><text x="536" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× A headache that will not shift</text><text x="550" y="519" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">with visual changes — the same</text><text x="536" y="536" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Burning with urination</text><text x="550" y="551" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">a UTI, and it can start preterm labor</text><text x="536" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Any bleeding, at any stage</text><text x="550" y="583" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">never filed as normal</text><text x="536" y="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Reduced fetal movement</text><text x="550" y="615" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffb3c4" fill-opacity="1" text-anchor="start">counted, and reported the same day</text><text x="536" y="638" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><rect x="24" y="638" width="872" height="62" rx="14" fill="#12b886" fill-opacity=".17" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="638" width="5" height="62" rx="2.5" fill="#12b886"/><text x="46" y="666" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">THE FIX: turn her onto her LEFT side. It lifts the uterus off the vessel.</text><text x="46" y="686" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#dff3ea" fill-opacity="1" text-anchor="start">"Left side" is the answer to an enormous number of maternity questions.</text></svg>