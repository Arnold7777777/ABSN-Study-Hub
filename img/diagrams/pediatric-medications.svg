<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Pediatric medication administration</title><desc id="d">A scale showing the same child weighed in pounds and in kilograms, with the 2.2-times overdose that follows if the two are confused. Beside it the injection sites by age with the maximum volume each will take. Below, how to check a dose and how to get a small child to take it.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="640" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">WEIGH IN KILOGRAMS. ONLY EVER KILOGRAMS.</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Recording pounds and treating them as kilograms is a 2.2-times overdose, and it has killed children.</text><rect x="24" y="96" width="470" height="236" rx="14" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="236" rx="2.5" fill="#ff3b6b"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⚖️  THE SAME CHILD, TWO NUMBERS</text><rect x="60" y="152" width="180" height="96" rx="12" fill="#12b886" fill-opacity=".18" stroke="#12b886" stroke-opacity=".8"/><text x="150" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">20</text><text x="150" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">kg</text><text x="150" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">the real weight</text><rect x="280" y="152" width="180" height="96" rx="12" fill="#ff3b6b" fill-opacity=".18" stroke="#ff3b6b" stroke-opacity=".8"/><text x="370" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">44</text><text x="370" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">lb</text><text x="370" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">the SAME child</text><text x="46" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Chart the 44 as kilograms and every dose that follows is</text><text x="46" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">calculated for a 44 kg child. That is 2.2 times too much,</text><text x="46" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">every single time, until somebody notices.</text><rect x="514" y="96" width="382" height="236" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="236" rx="2.5" fill="#2f6bff"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">💉  SITE AND VOLUME, BY AGE</text><text x="532" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">AGE</text><text x="648" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">SITE</text><text x="850" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">MAX mL</text><text x="532" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Infant</text><text x="648" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">vastus lateralis</text><text x="850" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">0.5–1</text><text x="532" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Toddler / child</text><text x="648" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">vastus lateralis; deltoid once she walks</text><text x="850" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">1</text><text x="532" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Adolescent</text><text x="648" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">deltoid or ventrogluteal</text><text x="850" y="240" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">1–2</text><text x="532" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Subcut, any age</text><text x="648" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">abdomen, thigh, upper arm</text><text x="850" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">0.5–1</text><text x="532" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">The vastus lateralis is THE pediatric IM site. The gluteal</text><text x="532" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">muscle is not developed until she has walked for a year.</text><rect x="24" y="350" width="452" height="208" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="350" width="5" height="208" rx="2.5" fill="#ffc233"/><text x="46" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🧠  CHECKING A DOSE</text><text x="46" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Doses are mg per kg — know the safe range BEFORE</text><text x="46" y="427" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">  you draw it up, not after</text><text x="46" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Independent double-check by a second nurse for the</text><text x="46" y="465" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">  high-alert ones: insulin, opioids, chemotherapy,</text><text x="46" y="484" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">  digoxin, anticoagulants</text><text x="46" y="503" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· If the number looks large or small, RECALCULATE</text><text x="46" y="522" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">  before you question the child</text><text x="46" y="541" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Oral syringes for liquids. Never a kitchen spoon</text><text x="46" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">· Two identifiers — and ask the parent to confirm</text><rect x="496" y="350" width="400" height="208" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="350" width="5" height="208" rx="2.5" fill="#12b886"/><text x="518" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🍬  GETTING IT INTO A SMALL CHILD</text><text x="518" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Never call it sweets, and never lie about the taste</text><text x="518" y="427" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Offer a choice about HOW, never about WHETHER</text><text x="518" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Small syringe into the side of the cheek, slowly —</text><text x="518" y="465" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  not down the middle, which makes her gag</text><text x="518" y="484" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· A cold drink or an ice lolly first dulls the taste</text><text x="518" y="503" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Never mix it into a full bottle or a whole meal —</text><text x="518" y="522" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  if she stops halfway you have no idea what she had</text><text x="518" y="541" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Praise afterwards, every time, however it went</text></svg>