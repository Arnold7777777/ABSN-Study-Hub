<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 726" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Postpartum hemorrhage</title><desc id="d">Two abdomens side by side after birth. On one the fundus is boggy, soft, high and pushed off to the side by a full bladder, and it is bleeding; on the other it is firm, midline and at the umbilicus, and it is still bleeding, which means the tone is not the problem: look for trauma such as a laceration or hematoma, retained tissue, or a clotting problem. Below, the four Ts, and the urgent actions that happen together: call for help early, assess the fundus and massage it only if boggy, empty the bladder, IV access, fluids and uterotonics, quantify blood loss, and watch for shock.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="726" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">POSTPARTUM HEMORRHAGE — CALL EARLY, FEEL THE FUNDUS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">The uterus stops bleeding by contracting. One that will not contract cannot clamp the vessels.</text><rect x="24" y="96" width="426" height="320" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="320" rx="2.5" fill="#ff3b6b"/><text x="237.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">BOGGY — soft, high, off to the side</text><ellipse cx="174" cy="228" rx="104" ry="86" fill="#ffd9c2" fill-opacity=".16" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2"/><circle cx="174" cy="228" r="5" fill="#c99b78"/><path d="M74 228 H274" stroke="#ffd9c2" stroke-opacity=".35" stroke-width="1.4" stroke-dasharray="5 5"/><text x="282" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#e6d0bd" fill-opacity="1" text-anchor="start">umbilicus</text><ellipse cx="208" cy="202" rx="44" ry="30" fill="#ff3b6b" fill-opacity=".45" stroke="#ff3b6b" stroke-width="3" stroke-dasharray="7 5"/><text x="208" y="207" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">BOGGY</text><text x="46" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">This one is TONE — uterine atony, the commonest cause.</text><text x="46" y="353" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">A full bladder pushes it up and to the side and stops it</text><text x="46" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">contracting, which is why she empties it early on.</text><text x="46" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">→ MASSAGE, lower segment supported; uterotonics.</text><rect x="470" y="96" width="426" height="320" rx="14" fill="#ffc233" fill-opacity=".15" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="470" y="96" width="5" height="320" rx="2.5" fill="#ffc233"/><text x="683.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">FIRM — and still bleeding</text><ellipse cx="620" cy="228" rx="104" ry="86" fill="#ffd9c2" fill-opacity=".16" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2"/><circle cx="620" cy="228" r="5" fill="#c99b78"/><path d="M520 228 H720" stroke="#ffd9c2" stroke-opacity=".35" stroke-width="1.4" stroke-dasharray="5 5"/><text x="728" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#e6d0bd" fill-opacity="1" text-anchor="start">umbilicus</text><circle cx="620" cy="226" r="34" fill="#12b886" fill-opacity=".70" stroke="#12b886" stroke-width="3"/><text x="620" y="231" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#042a1c" fill-opacity="1" text-anchor="middle">FIRM</text><text x="492" y="334" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Firm but still bleeding? Then tone is not the problem.</text><text x="492" y="353" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Look for trauma (a laceration or a hematoma), retained</text><text x="492" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">tissue, or a clotting problem. Firm does not prove which.</text><text x="492" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">→ More massage will not help. Notify; find the cause.</text><rect x="24" y="434" width="872" height="172" rx="14" fill="#9d5cff" fill-opacity=".14" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="434" width="5" height="172" rx="2.5" fill="#9d5cff"/><text x="46" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">⭐  THE FOUR Ts</text><text x="190" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">RECOGNISE IT BY</text><text x="520" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">FIX</text><text x="46" y="490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Tone</text><text x="46" y="504" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">atony — the commonest</text><text x="190" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">boggy, soft uterus</text><text x="520" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">massage and uterotonics</text><text x="46" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Trauma</text><text x="46" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">laceration, hematoma</text><text x="190" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">firm uterus, still bleeding; pain, swelling</text><text x="520" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">find and repair; evacuate a hematoma</text><text x="46" y="550" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Tissue</text><text x="46" y="564" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">retained placenta</text><text x="190" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">placenta not intact; bleeding persists</text><text x="520" y="554" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">manual removal, D&amp;C</text><text x="46" y="580" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">Thrombin</text><text x="46" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="start">a clotting disorder</text><text x="190" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">oozing everywhere, no clots forming</text><text x="520" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">blood products</text><rect x="24" y="622" width="872" height="74" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="622" width="5" height="74" rx="2.5" fill="#12b886"/><text x="46" y="645" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🚨  ACT TOGETHER, NOT ONE STEP AT A TIME</text><rect x="46.0" y="652" width="132" height="36" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".7"/><text x="54.0" y="667" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#dff3ea" fill-opacity="1" text-anchor="start">Call for help early</text><text x="54.0" y="681" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">notify in parallel</text><rect x="185.6" y="652" width="132" height="36" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".7"/><text x="193.6" y="667" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#dff3ea" fill-opacity="1" text-anchor="start">Fundus: if boggy,</text><text x="193.6" y="681" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">massage + support</text><rect x="325.2" y="652" width="132" height="36" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".7"/><text x="333.2" y="667" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#dff3ea" fill-opacity="1" text-anchor="start">Empty the bladder</text><text x="333.2" y="681" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">void or catheter</text><rect x="464.8" y="652" width="132" height="36" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".7"/><text x="472.8" y="667" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#dff3ea" fill-opacity="1" text-anchor="start">IV access, fluids</text><text x="472.8" y="681" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">uterotonics per order</text><rect x="604.4" y="652" width="132" height="36" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".7"/><text x="612.4" y="667" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#dff3ea" fill-opacity="1" text-anchor="start">Quantify blood loss</text><text x="612.4" y="681" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">weigh, don&#39;t guess</text><rect x="744.0" y="652" width="132" height="36" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".7"/><text x="752.0" y="667" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#dff3ea" fill-opacity="1" text-anchor="start">Vitals, shock signs</text><text x="752.0" y="681" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">pulse rises first</text></svg>