<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Feeding the newborn</title><desc id="d">The four feeding holds drawn from above - cradle, cross-cradle, football and side-lying - showing where the baby lies against the mother in each. Beside them the feeding cues in order, from stirring through to crying, which is a late one. Below, what a good latch looks like and how to take the baby off.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="690" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">BRING THE BABY TO THE BREAST, NOT THE BREAST TO THE BABY</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">And catch her at the early cues — a crying baby latches badly.</text><rect x="24" y="96" width="560" height="292" rx="14" fill="#9d5cff" fill-opacity=".15" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="292" rx="2.5" fill="#9d5cff"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">🤱  THE FOUR HOLDS, SEEN FROM ABOVE</text><rect x="46" y="152" width="122" height="140" rx="11" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".7"/><ellipse cx="107" cy="214" rx="26" ry="34" fill="#ffd9c2" fill-opacity=".24" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2"/><circle cx="107" cy="172" r="12" fill="#ffd9c2" fill-opacity=".4"/><path d="M125 200 q30 20 34 44" fill="none" stroke="#ffd9c2" stroke-opacity=".4" stroke-width="10" stroke-linecap="round"/><ellipse cx="145" cy="236" rx="13" ry="20" fill="#ffd9c2" fill-opacity=".65" stroke="#ffd9c2" stroke-opacity=".85" stroke-width="2"/><circle cx="137" cy="220" r="8" fill="#ffd9c2" fill-opacity=".8"/><text x="107" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">CRADLE</text><text x="107" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">the everyday one</text><rect x="180" y="152" width="122" height="140" rx="11" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".7"/><ellipse cx="241" cy="214" rx="26" ry="34" fill="#ffd9c2" fill-opacity=".24" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2"/><circle cx="241" cy="172" r="12" fill="#ffd9c2" fill-opacity=".4"/><path d="M223 200 q-32 24 -6 52" fill="none" stroke="#ffd9c2" stroke-opacity=".4" stroke-width="10" stroke-linecap="round"/><ellipse cx="277" cy="234" rx="13" ry="20" fill="#ffd9c2" fill-opacity=".65" stroke="#ffd9c2" stroke-opacity=".85" stroke-width="2"/><circle cx="269" cy="218" r="8" fill="#ffd9c2" fill-opacity=".8"/><text x="241" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">CROSS-CRADLE</text><text x="241" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">most control of</text><text x="241" y="289" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">the head</text><rect x="314" y="152" width="122" height="140" rx="11" fill="#ffc233" fill-opacity=".14" stroke="#ffc233" stroke-opacity=".7"/><ellipse cx="375" cy="214" rx="26" ry="34" fill="#ffd9c2" fill-opacity=".24" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2"/><circle cx="375" cy="172" r="12" fill="#ffd9c2" fill-opacity=".4"/><path d="M391 208 q30 -6 34 24" fill="none" stroke="#ffd9c2" stroke-opacity=".4" stroke-width="10" stroke-linecap="round"/><ellipse cx="415" cy="212" rx="13" ry="20" fill="#ffd9c2" fill-opacity=".65" stroke="#ffd9c2" stroke-opacity=".85" stroke-width="2"/><circle cx="407" cy="196" r="8" fill="#ffd9c2" fill-opacity=".8"/><path d="M415 234 h26" stroke="#ffc233" stroke-width="2.4" stroke-dasharray="3 3"/><text x="375" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">FOOTBALL</text><text x="375" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">after a caesarean —</text><text x="375" y="289" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">off the incision</text><rect x="448" y="152" width="122" height="140" rx="11" fill="#ff8a3d" fill-opacity=".14" stroke="#ff8a3d" stroke-opacity=".7"/><ellipse cx="509" cy="214" rx="26" ry="34" fill="#ffd9c2" fill-opacity=".24" stroke="#ffd9c2" stroke-opacity=".45" stroke-width="2"/><circle cx="509" cy="172" r="12" fill="#ffd9c2" fill-opacity=".4"/><ellipse cx="543" cy="218" rx="13" ry="20" fill="#ffd9c2" fill-opacity=".65" stroke="#ffd9c2" stroke-opacity=".85" stroke-width="2"/><circle cx="535" cy="202" r="8" fill="#ffd9c2" fill-opacity=".8"/><text x="509" y="260" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">SIDE-LYING</text><text x="509" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">at night, and</text><text x="509" y="289" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">when she is sore</text><text x="46" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">Whichever hold: her whole body faces the mother, ear–shoulder–hip in a line,</text><text x="46" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dfd0ff" fill-opacity="1" text-anchor="start">and her nose is level with the nipple before she opens.</text><rect x="604" y="96" width="292" height="292" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="604" y="96" width="5" height="292" rx="2.5" fill="#ffc233"/><text x="622" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">👀  THE CUES, IN ORDER</text><rect x="622" y="158" width="256" height="26" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".8"/><text x="634" y="176" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">stirring, rousing</text><path d="M750 184 v6" stroke="#cfd4ff" stroke-width="2" stroke-opacity=".6"/><rect x="622" y="192" width="256" height="26" rx="9" fill="#12b886" fill-opacity=".22" stroke="#12b886" stroke-opacity=".8"/><text x="634" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">turning the head, rooting</text><path d="M750 218 v6" stroke="#cfd4ff" stroke-width="2" stroke-opacity=".6"/><rect x="622" y="226" width="256" height="26" rx="9" fill="#ffc233" fill-opacity=".22" stroke="#ffc233" stroke-opacity=".8"/><text x="634" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">hand to mouth</text><path d="M750 252 v6" stroke="#cfd4ff" stroke-width="2" stroke-opacity=".6"/><rect x="622" y="260" width="256" height="26" rx="9" fill="#ff8a3d" fill-opacity=".22" stroke="#ff8a3d" stroke-opacity=".8"/><text x="634" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">fussing, squirming</text><path d="M750 286 v6" stroke="#cfd4ff" stroke-width="2" stroke-opacity=".6"/><rect x="622" y="294" width="256" height="26" rx="9" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".8"/><text x="634" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">CRYING — a LATE cue</text><text x="622" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">Catch her early. A crying baby is</text><text x="622" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">disorganised and latches badly.</text><rect x="24" y="406" width="872" height="236" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="406" width="5" height="236" rx="2.5" fill="#12b886"/><text x="46" y="436" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅  A GOOD LATCH — CHECK EVERY ONE</text><text x="46" y="468" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Mouth WIDE open, chin pressed into the breast, nose clear</text><text x="46" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Lips flanged outward like a fish — not tucked in</text><text x="46" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· More areola showing ABOVE the top lip than below the bottom</text><text x="484" y="468" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Slow, deep sucking with audible swallowing</text><text x="484" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Cheeks rounded, not dimpled or drawing in</text><text x="484" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· No pain after the first few seconds, and no clicking</text><text x="46" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Brush her lip, wait for a WIDE gape, then bring her to the breast. Not the other way round.</text><text x="46" y="588" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">To take her off: slide a clean finger into the corner of her mouth to break the seal first. Never pull.</text><text x="46" y="624" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">Feed on cue, roughly 8–12 times in 24 hours, both breasts offered. No clock.</text></svg>