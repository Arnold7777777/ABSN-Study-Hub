<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 806" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Spinal cord injury</title><desc id="d">The spinal cord drawn vertically with each level band marked and what is lost below it, and the two critical lines picked out: C4, above which she cannot breathe unaided, and T6, above which autonomic dysreflexia becomes possible. Below, spinal shock against neurogenic shock, which are constantly confused.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="806" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">FIND THE LEVEL, THEN LOOK DOWNWARD</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Everything below the injury is affected. Everything above it is normal. Two numbers do most of the work.</text><rect x="24" y="96" width="872" height="424" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="424" rx="2.5" fill="#2f6bff"/><text x="46" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">📏  THE LEVELS WORTH MEMORISING</text><rect x="137" y="162" width="26" height="46" rx="6" fill="#ff3b6b" fill-opacity=".55" stroke="#ff3b6b" stroke-width="2"/><text x="176" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">C1–C4</text><text x="176" y="199" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">all four limbs, and the DIAPHRAGM</text><text x="470" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">C3, 4 and 5 keep the diaphragm alive. At or above C4</text><text x="470" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">she cannot breathe unaided — ventilator.</text><rect x="137" y="226" width="26" height="46" rx="6" fill="#ff8a3d" fill-opacity=".55" stroke="#ff8a3d" stroke-width="2"/><text x="176" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">C5–C8</text><text x="176" y="263" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">tetraplegia, with some arm function</text><text x="470" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">The diaphragm works, but the cough is weak.</text><text x="470" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">Watch for retained secretions.</text><rect x="137" y="290" width="26" height="46" rx="6" fill="#ffc233" fill-opacity=".55" stroke="#ffc233" stroke-width="2"/><text x="176" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">T1–T6</text><text x="176" y="327" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">paraplegia; poor trunk control</text><text x="470" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">At or above T6, autonomic dysreflexia becomes</text><text x="470" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">possible.</text><rect x="137" y="354" width="26" height="46" rx="6" fill="#12b886" fill-opacity=".55" stroke="#12b886" stroke-width="2"/><text x="176" y="374" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">T6–T12</text><text x="176" y="391" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">paraplegia, better trunk control</text><text x="470" y="382" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Independent wheelchair use is realistic.</text><rect x="137" y="418" width="26" height="46" rx="6" fill="#2f6bff" fill-opacity=".55" stroke="#2f6bff" stroke-width="2"/><text x="176" y="438" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">L1–S5</text><text x="176" y="455" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">leg weakness; bowel, bladder, sexual function</text><text x="470" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">Bracing and walking may be possible.</text><path d="M46 217.0 H874" stroke="#ff3b6b" stroke-width="2.4" stroke-dasharray="7 5"/><rect x="52" y="209.5" width="332" height="15" rx="7" fill="#160a1e"/><text x="60" y="221.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">C4  —  above this she cannot breathe — VENTILATOR</text><path d="M46 345.0 H874" stroke="#ff3b6b" stroke-width="2.4" stroke-dasharray="7 5"/><rect x="52" y="337.5" width="332" height="15" rx="7" fill="#160a1e"/><text x="60" y="349.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">T6  —  at or above this, AUTONOMIC DYSREFLEXIA</text><text x="46" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">If a question asks what she can do, find the level and read downward. That is nearly always the whole method.</text><rect x="24" y="538" width="872" height="265" rx="14" fill="#ff3b6b" fill-opacity=".17" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="538" width="5" height="265" rx="2.5" fill="#ff3b6b"/><text x="46" y="568" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🌀  THE TWO SHOCKS THAT GET CONFUSED</text><text x="280" y="592" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">SPINAL SHOCK</text><text x="620" y="592" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">NEUROGENIC SHOCK</text><text x="46" y="618" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">What it is</text><text x="280" y="618" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">a temporary loss of ALL cord function below the injury</text><text x="620" y="618" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">loss of sympathetic tone below the injury</text><text x="46" y="641" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">When</text><text x="280" y="641" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">immediately, and it lasts days to weeks</text><text x="620" y="641" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">immediately, with injuries at T6 and above</text><text x="46" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Reflexes</text><text x="280" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">ABSENT — flaccid, areflexic</text><text x="620" y="664" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">may return</text><text x="46" y="687" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Blood pressure</text><text x="280" y="687" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">usually normal</text><text x="620" y="687" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">HYPOTENSION</text><text x="46" y="710" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Pulse</text><text x="280" y="710" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">usually normal</text><text x="620" y="710" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">BRADYCARDIA — this is the giveaway</text><text x="46" y="733" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Skin</text><text x="280" y="733" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">unremarkable</text><text x="620" y="733" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">warm, dry, flushed below the injury</text><text x="46" y="756" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Treatment</text><text x="280" y="756" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffe1c2" fill-opacity="1" text-anchor="start">supportive; wait for it to resolve</text><text x="620" y="756" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">fluids, vasopressors, atropine for the slow rate</text><text x="46" y="787" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Hypotension WITH bradycardia is the pairing. Every other shock gives hypotension with a FAST heart rate.</text></svg>