<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto">
<title id="t">Pediatric vital sign ranges by age, and why blood pressure falls last</title>
<desc id="d">Heart rate, respiratory rate and systolic blood pressure ranges for newborn, infant, toddler, school age and adolescent. Everything slows down as the child grows. A child compensates by raising the heart rate and keeps compensating until they cannot, so blood pressure is the last thing to fall. A slow heart rate in a sick child is a pre-arrest sign.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient></defs>
<style>
 text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
 .h1{font-weight:800;font-size:19px}
 .h2{font-weight:800;font-size:16px}
 .bd{font-size:15px}
 .sm{font-size:13.5px}
 .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
 .k{font-weight:800}
</style>
<rect width="920" height="720" rx="22" fill="url(#bg)"/>
<rect x="20" y="18" width="880" height="82" rx="14" fill="rgba(47,107,255,.20)" stroke="#2f6bff" stroke-width="2"/>
<text x="42" y="48" class="h1" fill="#bcd0ff">Everything slows down as they grow</text>
<text x="42" y="76" class="bd" fill="#e7e9ff">A newborn&#8217;s heart runs at nearly twice an adult&#8217;s. Learn the shape of the trend, not five separate tables.</text>
<g transform="translate(20,116)">
 <rect x="0" y="0" width="880" height="316" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
 <text x="26" y="34" class="h2" fill="#ffffff">AGE</text>
 <text x="268" y="34" class="h2" fill="#ff8fa3">HEART RATE</text>
 <text x="500" y="34" class="h2" fill="#7ff0f2">BREATHS / MIN</text>
 <text x="722" y="34" class="h2" fill="#ffc233">SYSTOLIC BP</text>
 <line x1="26" y1="46" x2="854" y2="46" stroke="rgba(255,255,255,.28)" stroke-width="2"/>
 <g class="bd">
  <text x="26" y="82" fill="#e7e9ff" class="k">Newborn</text>
  <text x="268" y="82" class="num" fill="#ffd0dc">110&#8211;160</text><text x="500" y="82" class="num" fill="#c7f0e2">30&#8211;60</text><text x="722" y="82" class="num" fill="#ffeec2">65&#8211;85</text>
  <text x="26" y="132" fill="#e7e9ff" class="k">Infant</text>
  <text x="268" y="132" class="num" fill="#ffd0dc">100&#8211;150</text><text x="500" y="132" class="num" fill="#c7f0e2">25&#8211;40</text><text x="722" y="132" class="num" fill="#ffeec2">70&#8211;100</text>
  <text x="26" y="182" fill="#e7e9ff" class="k">Toddler</text>
  <text x="268" y="182" class="num" fill="#ffd0dc">90&#8211;140</text><text x="500" y="182" class="num" fill="#c7f0e2">20&#8211;30</text><text x="722" y="182" class="num" fill="#ffeec2">80&#8211;110</text>
  <text x="26" y="232" fill="#e7e9ff" class="k">School age</text>
  <text x="268" y="232" class="num" fill="#ffd0dc">70&#8211;120</text><text x="500" y="232" class="num" fill="#c7f0e2">18&#8211;25</text><text x="722" y="232" class="num" fill="#ffeec2">85&#8211;120</text>
  <text x="26" y="282" fill="#e7e9ff" class="k">Adolescent</text>
  <text x="268" y="282" class="num" fill="#ffd0dc">60&#8211;100</text><text x="500" y="282" class="num" fill="#c7f0e2">12&#8211;20</text><text x="722" y="282" class="num" fill="#ffeec2">95&#8211;140</text>
 </g>
 <rect x="256" y="56" width="150" height="242" rx="10" fill="none" stroke="#ff3b6b" stroke-width="2" stroke-dasharray="6 5" opacity=".55"/>
</g>
<rect x="20" y="450" width="530" height="250" rx="16" fill="rgba(255,59,107,.20)" stroke="#ff3b6b" stroke-width="2"/>
<text x="42" y="480" class="h2" fill="#ff8fa3">&#128680; WHY BLOOD PRESSURE IS THE LAST THING TO GO</text>
<text x="42" y="512" class="bd" fill="#ffd0dc">A child cannot squeeze much harder, so they compensate by</text>
<text x="42" y="536" class="bd" fill="#ffd0dc"><tspan class="k" fill="#ffc233">beating faster</tspan>. They keep it up far longer than an adult would.</text>
<text x="42" y="572" class="bd" fill="#ffd0dc">A normal blood pressure in a sick child proves <tspan class="k">nothing</tspan>.</text>
<text x="42" y="596" class="bd" fill="#ffd0dc">By the time it falls, they are already crashing.</text>
<text x="42" y="636" class="h2" fill="#ffffff">A SLOW HEART RATE IS NOT GOOD NEWS</text>
<text x="42" y="666" class="bd" fill="#ffd0dc">Bradycardia in a sick child is a <tspan class="k" fill="#ffc233">pre-arrest sign</tspan>.</text>
<text x="42" y="688" class="bd" fill="#ffd0dc">It means they have run out of compensating.</text>
<rect x="566" y="450" width="334" height="250" rx="16" fill="rgba(0,194,199,.14)" stroke="#00c2c7" stroke-width="2"/>
<text x="588" y="480" class="h2" fill="#7ff0f2">HOW TO MEASURE THEM</text>
<text x="588" y="512" class="bd" fill="#e7e9ff">Count breaths for a <tspan class="k" fill="#7ff0f2">full minute</tspan>.</text>
<text x="588" y="534" class="sm" fill="#c7f0e2">Young children breathe irregularly.</text>
<text x="588" y="570" class="bd" fill="#e7e9ff">Count them <tspan class="k" fill="#7ff0f2">before you touch</tspan> the</text>
<text x="588" y="592" class="bd" fill="#e7e9ff">child. Crying wrecks the numbers.</text>
<text x="588" y="628" class="bd" fill="#e7e9ff">The BP cuff must cover about</text>
<text x="588" y="650" class="bd" fill="#e7e9ff"><tspan class="k" fill="#7ff0f2">two thirds</tspan> of the upper arm.</text>
<text x="588" y="678" class="sm" fill="#c7f0e2">Too small reads high, too big reads low.</text>
</svg>
