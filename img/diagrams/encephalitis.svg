<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 676" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Encephalitis versus meningitis</title><desc id="d">A brain inside its meninges drawn twice. On one the covering is inflamed and the brain is not, which gives a stiff neck; on the other the brain tissue itself is inflamed, which gives altered thinking, seizures and focal deficits. Below, the comparison and the herpes encephalitis that must not be missed.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="676" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">ONE INFLAMES THE WRAPPER. THE OTHER INFLAMES THE BRAIN.</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Which layer is inflamed decides every sign on the page.</text><rect x="24" y="96" width="426" height="268" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="268" rx="2.5" fill="#2f6bff"/><text x="237.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">MENINGITIS</text><text x="237.0" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">the covering</text><circle cx="142" cy="236" r="62" fill="none" stroke="#2f6bff" stroke-width="12" stroke-opacity=".95"/><circle cx="142" cy="236" r="48" fill="#8e96c8" fill-opacity=".25"/><path d="M114 212 q14 -12 28 0 q14 12 28 0" fill="none" stroke="#0b0716" stroke-opacity=".35" stroke-width="3"/><path d="M114 228 q14 -12 28 0 q14 12 28 0" fill="none" stroke="#0b0716" stroke-opacity=".35" stroke-width="3"/><path d="M114 244 q14 -12 28 0 q14 12 28 0" fill="none" stroke="#0b0716" stroke-opacity=".35" stroke-width="3"/><path d="M114 260 q14 -12 28 0 q14 12 28 0" fill="none" stroke="#0b0716" stroke-opacity=".35" stroke-width="3"/><text x="142" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">meninges inflamed</text><text x="234" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· NUCHAL RIGIDITY</text><text x="234" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· headache, fever</text><text x="234" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· photophobia</text><text x="234" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· Kernig and Brudzinski</text><text x="234" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· thinking usually intact</text><rect x="470" y="96" width="426" height="268" rx="14" fill="#ff3b6b" fill-opacity=".15" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="470" y="96" width="5" height="268" rx="2.5" fill="#ff3b6b"/><text x="683.0" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">ENCEPHALITIS</text><text x="683.0" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">the brain itself</text><circle cx="588" cy="236" r="62" fill="none" stroke="#9aa3d8" stroke-width="12" stroke-opacity=".4"/><circle cx="588" cy="236" r="48" fill="#ff3b6b" fill-opacity=".6"/><path d="M560 212 q14 -12 28 0 q14 12 28 0" fill="none" stroke="#0b0716" stroke-opacity=".35" stroke-width="3"/><path d="M560 228 q14 -12 28 0 q14 12 28 0" fill="none" stroke="#0b0716" stroke-opacity=".35" stroke-width="3"/><path d="M560 244 q14 -12 28 0 q14 12 28 0" fill="none" stroke="#0b0716" stroke-opacity=".35" stroke-width="3"/><path d="M560 260 q14 -12 28 0 q14 12 28 0" fill="none" stroke="#0b0716" stroke-opacity=".35" stroke-width="3"/><text x="588" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">BRAIN TISSUE inflamed</text><text x="680" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· ALTERED MENTAL STATUS</text><text x="680" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· confusion, personality change</text><text x="680" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· SEIZURES — common</text><text x="680" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· focal deficits: weakness,</text><text x="680" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">· speech, behaviour</text><rect x="24" y="382" width="872" height="160" rx="14" fill="#9d5cff" fill-opacity=".14" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="382" width="5" height="160" rx="2.5" fill="#9d5cff"/><text x="46" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">SIDE BY SIDE</text><text x="230" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">MENINGITIS</text><text x="600" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">ENCEPHALITIS</text><text x="46" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Inflamed</text><text x="230" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">the meninges — the covering</text><text x="600" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">the brain tissue</text><text x="46" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Dominant sign</text><text x="230" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">nuchal rigidity, headache, fever</text><text x="600" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">altered mental status</text><text x="46" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Seizures</text><text x="230" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">possible</text><text x="600" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">common</text><text x="46" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Focal deficits</text><text x="230" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">uncommon</text><text x="600" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">common</text><text x="46" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Commonest cause</text><text x="230" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">bacterial or viral</text><text x="600" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">viral — especially HSV-1</text><rect x="24" y="558" width="872" height="128" rx="14" fill="#ff3b6b" fill-opacity=".19" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="558" width="5" height="128" rx="2.5" fill="#ff3b6b"/><text x="46" y="590" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨  HERPES ENCEPHALITIS — THE ONE THAT MUST NOT BE MISSED</text><text x="46" y="620" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">HSV-1 targets the TEMPORAL LOBE, so it presents as bizarre behaviour, personality change,</text><text x="46" y="640" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">memory loss, and hallucinations of smell or taste — which is easy to read as psychiatric.</text><text x="46" y="670" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">IV aciclovir is started on SUSPICION, before confirmation. Waiting for the result costs brain.</text></svg>