<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Iron deficiency anemia and pica</title><desc id="d">Normal red cells beside small pale ones, the lab pattern, how to give iron so it is absorbed, and what pica is.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="580" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#c02255" fill-opacity=".22" stroke="#c02255" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#c02255"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#c02255">IRON DEFICIENCY ANEMIA — SMALL CELLS, PALE CELLS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Too little iron makes small pale cells. The labs, the iron rules, and the craving that gives it away.</text><rect x="24" y="92" width="420" height="216" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="216" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">WHAT THE CELLS LOOK LIKE</text><circle cx="122" cy="186" r="26" fill="#e04a63" fill-opacity=".95"/><circle cx="122" cy="186" r="9" fill="#150c26"/><circle cx="168" cy="202" r="26" fill="#e04a63" fill-opacity=".95"/><circle cx="168" cy="202" r="9" fill="#150c26"/><circle cx="142" cy="238" r="26" fill="#e04a63" fill-opacity=".95"/><circle cx="142" cy="238" r="9" fill="#150c26"/><circle cx="186" cy="162" r="26" fill="#e04a63" fill-opacity=".95"/><circle cx="186" cy="162" r="9" fill="#150c26"/><text x="140" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">Normal</text><text x="140" y="293" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">Big, deep red, small centre</text><circle cx="300" cy="186" r="17" fill="#e04a63" fill-opacity=".55"/><circle cx="300" cy="186" r="9" fill="#150c26"/><circle cx="340" cy="204" r="17" fill="#e04a63" fill-opacity=".55"/><circle cx="340" cy="204" r="9" fill="#150c26"/><circle cx="316" cy="234" r="17" fill="#e04a63" fill-opacity=".55"/><circle cx="316" cy="234" r="9" fill="#150c26"/><circle cx="356" cy="166" r="17" fill="#e04a63" fill-opacity=".55"/><circle cx="356" cy="166" r="9" fill="#150c26"/><text x="322" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">Iron deficient</text><text x="322" y="293" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#dfe2ff" fill-opacity="1" text-anchor="middle">Microcytic, hypochromic</text><rect x="460" y="92" width="416" height="216" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="92" width="5" height="216" rx="2.5" fill="#ffc233"/><text x="480" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🧪 THE LAB PATTERN</text><text x="482" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">Hemoglobin</text><text x="700" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">↓ low</text><text x="482" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">MCV (size)</text><text x="700" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">↓ low</text><text x="482" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">Ferritin (stores)</text><text x="700" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">↓ low — earliest</text><text x="482" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">TIBC</text><text x="700" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">↑ HIGH</text><text x="482" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">Reticulocytes</text><text x="700" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">↑ rise once iron starts</text><text x="482" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#ffeec2" fill-opacity="1" text-anchor="start">Ferritin falls first, hemoglobin falls last.</text><rect x="24" y="324" width="528" height="178" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="324" width="5" height="178" rx="2.5" fill="#12b886"/><text x="44" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">💊 GIVING IRON SO IT ACTUALLY ABSORBS</text><circle cx="46" cy="373.5" r="2.6" fill="#bff3e2"/><text x="56" y="378" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Empty stomach</tspan><tspan> absorbs best — with food if it upsets her.</tspan></text><circle cx="46" cy="392.5" r="2.6" fill="#bff3e2"/><text x="56" y="397" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Vitamin C</tspan><tspan> (orange juice) doubles absorption.</tspan></text><circle cx="46" cy="411.5" r="2.6" fill="#bff3e2"/><text x="56" y="416" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Never with milk,</tspan><tspan> antacids, tea or calcium — they block it.</tspan></text><circle cx="46" cy="430.5" r="2.6" fill="#bff3e2"/><text x="56" y="435" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Liquid iron:</tspan><tspan> straw, then rinse — it stains teeth.</tspan></text><circle cx="46" cy="449.5" r="2.6" fill="#bff3e2"/><text x="56" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Stools turn black.</tspan><tspan> That is expected, not bleeding.</tspan></text><circle cx="46" cy="468.5" r="2.6" fill="#bff3e2"/><text x="56" y="473" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Give the full course</tspan><tspan> — usually 3 months past a normal Hgb.</tspan></text><rect x="568" y="324" width="308" height="178" rx="14" fill="#9d5cff" fill-opacity=".20" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="568" y="324" width="5" height="178" rx="2.5" fill="#9d5cff"/><text x="588" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">🧩 PICA</text><text x="588" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.8" font-weight="700" fill="#e8dcff" fill-opacity="1" text-anchor="start">Eating things that are not food</text><text x="592" y="404" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#fff" fill-opacity="1" text-anchor="start">🧊</text><text x="616" y="404" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">ice</text><text x="592" y="428" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#fff" fill-opacity="1" text-anchor="start">🩹</text><text x="616" y="428" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">clay or dirt</text><text x="592" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#fff" fill-opacity="1" text-anchor="start">📄</text><text x="616" y="452" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">paper</text><text x="592" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#fff" fill-opacity="1" text-anchor="start">🪟</text><text x="616" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">paint chips</text><text x="588" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Paint chips also mean a lead level.</text><rect x="24" y="518" width="852" height="46" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="518" width="5" height="46" rx="2.5" fill="#ff3b6b"/><text x="44" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">🚨 Toddlers on more than 24 oz of cow’s milk a day are the classic case</text><text x="44" y="557" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">— the milk fills them up and blocks the iron.</text></svg>