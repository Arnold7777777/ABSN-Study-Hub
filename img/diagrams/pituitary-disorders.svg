<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Pituitary disorders</title><desc id="d">The anterior and posterior pituitary with the hormones each releases, then SIADH beside diabetes insipidus as exact opposites.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="620" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">THE PITUITARY — TOO MUCH ADH, OR NONE AT ALL</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">One gland, two lobes. Most exam questions come down to ADH, and ADH holds on to water.</text><rect x="24" y="92" width="400" height="250" rx="14" fill="#2f6bff" fill-opacity=".13" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="250" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">ONE GLAND, TWO LOBES</text><path d="M136 224 q-16 -34 16 -34 q32 0 16 34 q-4 20 -16 20 q-12 0 -16 -20z" fill="#f0c8dd" fill-opacity=".35" stroke="#f0c8dd" stroke-opacity=".55"/><path d="M152 184 l0 -34" stroke="#f0c8dd" stroke-opacity=".6" stroke-width="6" stroke-linecap="round"/><text x="152" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#f0c8dd" fill-opacity="1" text-anchor="middle">hypothalamus</text><ellipse cx="136" cy="240" rx="24" ry="20" fill="#ff8a3d" fill-opacity=".82"/><ellipse cx="172" cy="240" rx="19" ry="18" fill="#00c2c7" fill-opacity=".82"/><text x="136" y="245" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="900" fill="#2a1b06" fill-opacity="1" text-anchor="middle">ANT</text><text x="172" y="245" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">POST</text><text x="154" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">Anterior makes them</text><text x="154" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.6" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="middle">Posterior stores them</text><text x="240" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">ANTERIOR</text><text x="240" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#ffd9bd" fill-opacity="1" text-anchor="start">GH — growth</text><text x="240" y="207" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#ffd9bd" fill-opacity="1" text-anchor="start">TSH — thyroid</text><text x="240" y="224" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#ffd9bd" fill-opacity="1" text-anchor="start">ACTH — cortisol</text><text x="240" y="241" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#ffd9bd" fill-opacity="1" text-anchor="start">FSH / LH — gonads</text><text x="240" y="258" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#ffd9bd" fill-opacity="1" text-anchor="start">Prolactin — milk</text><text x="240" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">POSTERIOR</text><text x="240" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#bff3e2" fill-opacity="1" text-anchor="start">ADH — holds water</text><text x="240" y="329" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="400" fill="#bff3e2" fill-opacity="1" text-anchor="start">Oxytocin — labor, milk</text><rect x="440" y="92" width="436" height="250" rx="14" fill="#ffc233" fill-opacity=".18" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="440" y="92" width="5" height="250" rx="2.5" fill="#ffc233"/><text x="460" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">⭐ SIADH vs DI — EXACT OPPOSITES</text><text x="626" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#2f6bff" fill-opacity="1" text-anchor="middle">SIADH</text><text x="626" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">too much ADH</text><text x="800" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="900" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">DI</text><text x="800" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">no ADH</text><rect x="458" y="177" width="400" height="18" rx="6" fill="#ffffff" fill-opacity=".07"/><text x="464" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Water</text><text x="626" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">held on to</text><text x="800" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">poured out</text><rect x="458" y="198" width="400" height="18" rx="6" fill="#ffffff" fill-opacity=".03"/><text x="464" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Urine</text><text x="626" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">small, concentrated</text><text x="800" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">huge, dilute</text><rect x="458" y="219" width="400" height="18" rx="6" fill="#ffffff" fill-opacity=".07"/><text x="464" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Urine sp. gravity</text><text x="626" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">HIGH &gt;1.030</text><text x="800" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">LOW &lt;1.005</text><rect x="458" y="240" width="400" height="18" rx="6" fill="#ffffff" fill-opacity=".03"/><text x="464" y="253" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Serum sodium</text><text x="626" y="253" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">LOW — dilutional</text><text x="800" y="253" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">HIGH</text><rect x="458" y="261" width="400" height="18" rx="6" fill="#ffffff" fill-opacity=".07"/><text x="464" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Serum osmolality</text><text x="626" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">LOW</text><text x="800" y="274" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">HIGH</text><rect x="458" y="282" width="400" height="18" rx="6" fill="#ffffff" fill-opacity=".03"/><text x="464" y="295" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Weight</text><text x="626" y="295" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">gains</text><text x="800" y="295" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">loses</text><rect x="458" y="303" width="400" height="18" rx="6" fill="#ffffff" fill-opacity=".07"/><text x="464" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Treat with</text><text x="626" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#cfe0ff" fill-opacity="1" text-anchor="middle">fluid restriction</text><text x="800" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.2" font-weight="800" fill="#ffd9bd" fill-opacity="1" text-anchor="middle">desmopressin + fluids</text><rect x="24" y="358" width="420" height="148" rx="14" fill="#2f6bff" fill-opacity=".20" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="358" width="5" height="148" rx="2.5" fill="#2f6bff"/><text x="44" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">💧 SIADH — drowning from the inside</text><circle cx="46" cy="407.5" r="2.6" fill="#cfe0ff"/><text x="56" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eaecff"><tspan font-weight="800">Causes:</tspan><tspan> small-cell lung cancer, head injury, SSRIs.</tspan></text><circle cx="46" cy="425.5" r="2.6" fill="#cfe0ff"/><text x="56" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eaecff"><tspan font-weight="800">Signs:</tspan><tspan> headache, confusion, seizures — from low sodium.</tspan></text><circle cx="46" cy="443.5" r="2.6" fill="#cfe0ff"/><text x="56" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eaecff"><tspan font-weight="800">Restrict fluids.</tspan><tspan> Daily weights are the best measure.</tspan></text><circle cx="46" cy="461.5" r="2.6" fill="#cfe0ff"/><text x="56" y="466" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eaecff"><tspan font-weight="800">Correct sodium slowly</tspan><tspan> — fast correction damages the brain.</tspan></text><rect x="460" y="358" width="416" height="148" rx="14" fill="#ff8a3d" fill-opacity=".20" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="358" width="5" height="148" rx="2.5" fill="#ff8a3d"/><text x="480" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">🏜️ DI — drying out</text><circle cx="482" cy="407.5" r="2.6" fill="#ffd9bd"/><text x="492" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eaecff"><tspan font-weight="800">Causes:</tspan><tspan> pituitary surgery, head trauma, lithium.</tspan></text><circle cx="482" cy="425.5" r="2.6" fill="#ffd9bd"/><text x="492" y="430" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eaecff"><tspan font-weight="800">Signs:</tspan><tspan> thirst that will not quit, 4 to 20 L of urine a day.</tspan></text><circle cx="482" cy="443.5" r="2.6" fill="#ffd9bd"/><text x="492" y="448" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eaecff"><tspan font-weight="800">Desmopressin</tspan><tspan> replaces the ADH. Keep water available.</tspan></text><circle cx="482" cy="461.5" r="2.6" fill="#ffd9bd"/><text x="492" y="466" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#eaecff"><tspan font-weight="800">Watch for</tspan><tspan> hypotension and tachycardia — losing volume.</tspan></text><rect x="24" y="522" width="852" height="84" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="522" width="5" height="84" rx="2.5" fill="#ff3b6b"/><text x="44" y="550" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨 AFTER PITUITARY SURGERY</text><circle cx="46" cy="567.5" r="2.6" fill="#ffd9e2"/><text x="56" y="572" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">Clear drainage from the nose that tests positive for glucose is CSF</tspan><tspan> — report it now.</tspan></text><circle cx="46" cy="586.5" r="2.6" fill="#ffd9e2"/><text x="56" y="591" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.4" fill="#eaecff"><tspan font-weight="800">No coughing, sneezing, straining or bending</tspan><tspan> — and never blow the nose.</tspan></text></svg>