<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Newborn hypoglycaemia</title><desc id="d">Who is at risk of newborn hypoglycaemia, the signs, the glucose thresholds and what you do first.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="500" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#ffc233" fill-opacity=".22" stroke="#ffc233" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ffc233"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ffc233">NEWBORN HYPOGLYCAEMIA — THE JITTERY BABY</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A newborn burns glucose fast and stores almost none. Jitteriness is the sign you act on.</text><rect x="24" y="92" width="420" height="200" rx="14" fill="#2f6bff" fill-opacity=".16" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="200" rx="2.5" fill="#2f6bff"/><text x="44" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🧮 THE NUMBER</text><text x="44" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" font-weight="900" fill="#fff" fill-opacity="1" text-anchor="start">&lt; 40 mg/dL</text><text x="44" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#cfe0ff" fill-opacity="1" text-anchor="start">is hypoglycaemia in a newborn</text><rect x="46" y="204" width="376" height="18" rx="9" fill="#ffffff" fill-opacity=".10"/><rect x="46" y="204" width="128" height="18" rx="9" fill="#ff3b6b" fill-opacity=".9"/><rect x="174" y="204" width="248" height="18" rx="9" fill="#12b886" fill-opacity=".55"/><text x="52" y="217" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#fff" fill-opacity="1" text-anchor="start">LOW</text><text x="182" y="217" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="start">target 45 to 90</text><path d="M174 222 l0 8" stroke="#fff" stroke-width="2"/><text x="174" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="900" fill="#fff" fill-opacity="1" text-anchor="middle">40</text><text x="46" y="264" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">Screen at 30 minutes of age in anyone at risk,</text><text x="46" y="281" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" font-weight="700" fill="#e8ebff" fill-opacity="1" text-anchor="start">then before each feed. Treat before you confirm.</text><rect x="460" y="92" width="416" height="200" rx="14" fill="#ff8a3d" fill-opacity=".20" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="92" width="5" height="200" rx="2.5" fill="#ff8a3d"/><text x="480" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">👶 WHO IS AT RISK</text><circle cx="482" cy="141.5" r="2.6" fill="#ffd9bd"/><text x="492" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Infant of a diabetic mother</tspan><tspan> — the classic one.</tspan></text><circle cx="482" cy="160.5" r="2.6" fill="#ffd9bd"/><text x="492" y="165" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Large for gestational age</tspan><tspan> and small for gestational age.</tspan></text><circle cx="482" cy="179.5" r="2.6" fill="#ffd9bd"/><text x="492" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Preterm</tspan><tspan> — no glycogen stores laid down yet.</tspan></text><circle cx="482" cy="198.5" r="2.6" fill="#ffd9bd"/><text x="492" y="203" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Cold stressed</tspan><tspan> — burns glucose to make heat.</tspan></text><circle cx="482" cy="217.5" r="2.6" fill="#ffd9bd"/><text x="492" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Sepsis, asphyxia,</tspan><tspan> or any respiratory distress.</tspan></text><circle cx="482" cy="236.5" r="2.6" fill="#ffd9bd"/><text x="492" y="241" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Late preterm</tspan><tspan> 34 to 36 weeks, feeding poorly.</tspan></text><rect x="24" y="308" width="420" height="118" rx="14" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="308" width="5" height="118" rx="2.5" fill="#ff3b6b"/><text x="44" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.4" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">🚨 THE SIGNS — NON-SPECIFIC AND EASY TO MISS</text><rect x="46" y="362" width="124" height="24" rx="9" fill="#ff3b6b" fill-opacity=".28" stroke="#ff3b6b" stroke-opacity=".7"/><text x="108" y="378" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">Jittery, tremors</text><rect x="178" y="362" width="124" height="24" rx="9" fill="#ff3b6b" fill-opacity=".28" stroke="#ff3b6b" stroke-opacity=".7"/><text x="240" y="378" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">Poor feeding</text><rect x="310" y="362" width="124" height="24" rx="9" fill="#ff3b6b" fill-opacity=".28" stroke="#ff3b6b" stroke-opacity=".7"/><text x="372" y="378" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">Weak, high cry</text><rect x="46" y="392" width="124" height="24" rx="9" fill="#ff3b6b" fill-opacity=".28" stroke="#ff3b6b" stroke-opacity=".7"/><text x="108" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">Lethargy, floppy</text><rect x="178" y="392" width="124" height="24" rx="9" fill="#ff3b6b" fill-opacity=".28" stroke="#ff3b6b" stroke-opacity=".7"/><text x="240" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">Sweating, pallor</text><rect x="310" y="392" width="124" height="24" rx="9" fill="#ff3b6b" fill-opacity=".28" stroke="#ff3b6b" stroke-opacity=".7"/><text x="372" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.4" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">Apnoea, cyanosis</text><rect x="460" y="308" width="416" height="118" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="460" y="308" width="5" height="118" rx="2.5" fill="#12b886"/><text x="480" y="336" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅ WHAT YOU DO</text><circle cx="482" cy="355.5" r="2.6" fill="#bff3e2"/><text x="492" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Feed her.</tspan><tspan> Breast or formula is first line if she can suck.</tspan></text><circle cx="482" cy="374.5" r="2.6" fill="#bff3e2"/><text x="492" y="379" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">If she cannot feed</tspan><tspan> or stays low — IV dextrose.</tspan></text><circle cx="482" cy="393.5" r="2.6" fill="#bff3e2"/><text x="492" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.2" fill="#eaecff"><tspan font-weight="800">Keep her warm</tspan><tspan> while you do it; cold makes it worse.</tspan></text><rect x="24" y="442" width="852" height="44" rx="14" fill="#ffc233" fill-opacity=".20" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="442" width="5" height="44" rx="2.5" fill="#ffc233"/><text x="44" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.2" font-weight="800" fill="#ffeec2" fill-opacity="1" text-anchor="start">⭐ Jittery plus a mother with diabetes equals a glucose check — before you reach for anything else.</text></svg>