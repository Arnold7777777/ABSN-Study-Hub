<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Breast cancer</title><desc id="d">A breast drawn twice: one with a smooth, rounded, mobile lump that moves when pushed, and one with a hard irregular mass tethered to the skin above it, dimpling it. Beside them the quadrant map showing where most cancers arise. Below, what the receptors decide and the arm rules after node surgery.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="700" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#c02255" fill-opacity=".22" stroke="#c02255" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#c02255"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#c02255">PAINLESS IS THE TRAP</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">People assume cancer hurts, so a painless lump gets ignored — and painless is exactly what the worrying one is.</text><rect x="24" y="96" width="470" height="300" rx="14" fill="#c02255" fill-opacity=".17" stroke="#c02255" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="300" rx="2.5" fill="#c02255"/><text x="46" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#c02255" fill-opacity="1" text-anchor="start">✋  THE TWO LUMPS, TO THE TOUCH</text><rect x="46" y="144" width="196" height="180" rx="12" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".72"/><text x="144" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">MORE OFTEN BENIGN</text><path d="M94 242 q50 -34 100 0 q14 44 -50 44 q-64 0 -50 -44 z" fill="#ffd9c2" fill-opacity=".26" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="2"/><circle cx="136" cy="258" r="15" fill="#12b886" fill-opacity=".85"/><path d="M160 258 L178 258" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="144" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">soft · smooth · MOBILE</text><text x="144" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="middle">often tender, and cyclical</text><rect x="266" y="144" width="196" height="180" rx="12" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".72"/><text x="364" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">MORE WORRYING</text><path d="M314 242 q30 -40 44 0 q-8 12 -22 8 q-14 -4 -22 -8 q26 30 52 0 q14 44 -52 44 q-64 0 -50 -44 z" fill="#ffd9c2" fill-opacity=".26" stroke="#ffd9c2" stroke-opacity=".55" stroke-width="2"/><path d="M350 246 q22 -20 30 -2 q-6 24 -30 22 q-24 -4 -18 -22 q10 -14 18 2 z" fill="#ff3b6b" fill-opacity=".9"/><text x="364" y="294" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">hard · irregular · FIXED</text><text x="364" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="middle">painless · usually one</text><text x="394" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">skin dimples</text><text x="46" y="352" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">Also report: peau d'orange (skin pitted like orange peel), a firm</text><text x="46" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">axillary node, a newly inverted nipple, one-sided bloody discharge,</text><text x="46" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffd9e2" fill-opacity="1" text-anchor="start">and a red, warm, swollen breast without infection.</text><rect x="514" y="96" width="382" height="300" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="514" y="96" width="5" height="300" rx="2.5" fill="#ffc233"/><text x="532" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">📍  WHERE THEY ARISE</text><circle cx="664" cy="244" r="76" fill="#ffd9c2" fill-opacity=".16" stroke="#ffd9c2" stroke-opacity=".5" stroke-width="2.5"/><path d="M588 244 H740 M664 168 V320" stroke="#ffd9c2" stroke-opacity=".4" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M664 168 A76 76 0 0 1 740 244 L664 244 Z" fill="#ff3b6b" fill-opacity=".55"/><text x="698" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="middle">50%</text><path d="M726 198 q26 -18 42 -6" fill="none" stroke="#ff3b6b" stroke-width="6" stroke-linecap="round"/><text x="782" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">and into</text><text x="782" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">the armpit</text><text x="664" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">UPPER OUTER QUADRANT</text><text x="532" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Because that is where most of the breast tissue actually is,</text><text x="532" y="388" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">and it extends up into the axillary tail.</text><rect x="24" y="414" width="452" height="240" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="414" width="5" height="240" rx="2.5" fill="#2f6bff"/><text x="46" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">🧬  WHAT THE RECEPTORS DECIDE</text><text x="46" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">ER / PR positive</text><text x="46" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">feeds on oestrogen</text><text x="46" y="510" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">→ tamoxifen, or an aromatase inhibitor</text><text x="46" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">HER2 positive</text><text x="46" y="546" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">grows fast</text><text x="46" y="564" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">→ trastuzumab — watch the heart</text><text x="46" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">TRIPLE NEGATIVE</text><text x="46" y="600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8ea6d8" fill-opacity="1" text-anchor="start">none of the three</text><text x="46" y="618" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">→ chemotherapy only; a harder course</text><text x="46" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">The receptor status is what chooses the drug — it is not just staging.</text><rect x="496" y="414" width="400" height="240" rx="14" fill="#ff3b6b" fill-opacity=".19" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="414" width="5" height="240" rx="2.5" fill="#ff3b6b"/><text x="518" y="446" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">⛔  THAT ARM, AFTER NODE SURGERY</text><text x="518" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No blood pressure cuff</text><text x="518" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No venipuncture, injections or finger sticks</text><text x="518" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No tight jewellery, watches or sleeves</text><text x="518" y="542" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× No heavy lifting; gloves for gardening</text><text x="518" y="564" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Elevate it after surgery, above the heart</text><text x="518" y="586" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffd9e2" fill-opacity="1" text-anchor="start">× Report any swelling, redness or new heaviness</text><text x="518" y="620" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Taking the axillary nodes removes the drainage route</text><text x="518" y="638" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">for that arm permanently — the rules never expire.</text></svg>