<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">The stages of labour</title><desc id="d">The cervix drawn at 0, 3, 6, 8 and 10 centimetres at their true relative sizes, with the phase each belongs to, how she behaves in it and what you do. Above that, the four stages as a strip. Below, true labour against false labour.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="690" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#9d5cff" fill-opacity=".22" stroke="#9d5cff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#9d5cff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#9d5cff">LABOUR IS MEASURED BY THE CERVIX, NOT BY THE CONTRACTIONS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A woman contracting hard with no cervical change is not in labour.</text><rect x="24" y="96" width="872" height="84" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="84" rx="2.5" fill="#2f6bff"/><text x="46" y="122" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">THE FOUR STAGES</text><rect x="46" y="134" width="246" height="42" rx="10" fill="#9d5cff" fill-opacity=".26" stroke="#9d5cff" stroke-opacity=".8"/><text x="58" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">FIRST</text><text x="58" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">onset → 10 cm · much the longest</text><rect x="300" y="134" width="176" height="42" rx="10" fill="#12b886" fill-opacity=".26" stroke="#12b886" stroke-opacity=".8"/><text x="312" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">SECOND</text><text x="312" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">10 cm → the baby · pushing</text><rect x="484" y="134" width="166" height="42" rx="10" fill="#ffc233" fill-opacity=".26" stroke="#ffc233" stroke-opacity=".8"/><text x="496" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">THIRD</text><text x="496" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">baby → placenta · 5–30 min</text><rect x="658" y="134" width="202" height="42" rx="10" fill="#ff3b6b" fill-opacity=".26" stroke="#ff3b6b" stroke-opacity=".8"/><text x="670" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">FOURTH</text><text x="670" y="166" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#e7e9ff" fill-opacity="1" text-anchor="start">first 1–4 hours · watch for PPH</text><rect x="24" y="196" width="872" height="290" rx="14" fill="#9d5cff" fill-opacity=".14" stroke="#9d5cff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="196" width="5" height="290" rx="2.5" fill="#9d5cff"/><text x="46" y="224" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#9d5cff" fill-opacity="1" text-anchor="start">👀  THE CERVIX AT TRUE RELATIVE SIZE — 10 cm is not a metaphor</text><circle cx="108" cy="308" r="43" fill="none" stroke="#e6c9b8" stroke-opacity=".45" stroke-width="10"/><text x="108" y="374" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#9aa3d8" fill-opacity="1" text-anchor="middle">0 cm</text><text x="108" y="391" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">CLOSED</text><text x="108" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">not in labour</text><text x="108" y="427" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">thick and closed</text><circle cx="284" cy="308" r="43" fill="none" stroke="#e6c9b8" stroke-opacity=".45" stroke-width="10"/><circle cx="284" cy="308" r="10.2" fill="#2a1030" stroke="#12b886" stroke-width="3"/><text x="284" y="374" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">3 cm</text><text x="284" y="391" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">LATENT</text><text x="284" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">0–5 cm</text><text x="284" y="427" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">Talkative, sociable.</text><text x="284" y="441" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">Walk, eat lightly, rest.</text><circle cx="460" cy="308" r="43" fill="none" stroke="#e6c9b8" stroke-opacity=".45" stroke-width="10"/><circle cx="460" cy="308" r="20.4" fill="#2a1030" stroke="#ffc233" stroke-width="3"/><text x="460" y="374" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">6 cm</text><text x="460" y="391" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">ACTIVE</text><text x="460" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">6–7 cm</text><text x="460" y="427" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">Serious, inward, focused.</text><text x="460" y="441" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">Breathing, positions,</text><text x="460" y="455" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">often the epidural.</text><circle cx="636" cy="308" r="43" fill="none" stroke="#e6c9b8" stroke-opacity=".45" stroke-width="10"/><circle cx="636" cy="308" r="27.2" fill="#2a1030" stroke="#ff8a3d" stroke-width="3"/><text x="636" y="374" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">8 cm</text><text x="636" y="391" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">TRANSITION</text><text x="636" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">8–10 cm</text><text x="636" y="427" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">Irritable, shaking, sick.</text><text x="636" y="441" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">"I can't do this."</text><text x="636" y="455" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">Firm, calm reassurance.</text><circle cx="812" cy="308" r="43" fill="none" stroke="#e6c9b8" stroke-opacity=".45" stroke-width="10"/><circle cx="812" cy="308" r="34.0" fill="#2a1030" stroke="#ff3b6b" stroke-width="3"/><text x="812" y="374" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">10 cm</text><text x="812" y="391" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">COMPLETE</text><text x="812" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#c9d0ff" fill-opacity="1" text-anchor="middle">push</text><text x="812" y="427" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">Urge to push, often</text><text x="812" y="441" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">involuntary. Open-glottis</text><text x="812" y="455" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#dfe3ff" fill-opacity="1" text-anchor="middle">pushing with contractions.</text><text x="46" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">"I can't do this any more" is the transition line — and the answer is that it is the shortest phase and the baby is nearly here.</text><rect x="24" y="502" width="872" height="155" rx="14" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="502" width="5" height="155" rx="2.5" fill="#12b886"/><text x="46" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">TRUE  vs  FALSE LABOUR</text><text x="240" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">TRUE</text><text x="600" y="528" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">FALSE</text><text x="46" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Cervix</text><text x="240" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">dilates and effaces — the decider</text><text x="600" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">no change</text><text x="46" y="573" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Contractions</text><text x="240" y="573" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">regular; closer, longer, stronger</text><text x="600" y="573" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">irregular, do not intensify</text><text x="46" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">Pain starts</text><text x="240" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">in the BACK, radiating round</text><text x="600" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">front or abdomen only</text><text x="46" y="615" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">With walking</text><text x="240" y="615" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">gets stronger</text><text x="600" y="615" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">often eases</text><text x="46" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#c9d0ff" fill-opacity="1" text-anchor="start">With a bath</text><text x="240" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">carries on</text><text x="600" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">settles</text></svg>