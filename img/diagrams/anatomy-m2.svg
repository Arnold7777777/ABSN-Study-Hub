ont-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Lysosomes</text><text x="420" y="113" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">digest waste</text><circle cx="398" cy="146" r="14" fill="#ff3b6b" stroke="#0d0a1c" stroke-width="2.5"/><text x="398" y="152" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">3</text><text x="420" y="141" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Mitochondria</text><text x="420" y="159" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">makes the ATP</text><circle cx="398" cy="192" r="14" fill="#9d5cff" stroke="#0d0a1c" stroke-width="2.5"/><text x="398" y="198" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">4</text><text x="420" y="187" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Nucleus</text><text x="420" y="205" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">the DNA lives here</text><circle cx="398" cy="238" r="14" fill="#12b886" stroke="#0d0a1c" stroke-width="2.5"/><text x="398" y="244" font-size="17" font-weight="800" fill="#04261b" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">5</text><text x="420" y="233" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Rough ER</text><text x="420" y="251" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">ribosomes → proteins</text><circle cx="398" cy="284" r="14" fill="#ffc233" stroke="#0d0a1c" stroke-width="2.5"/><text x="398" y="290" font-size="17" font-weight="800" fill="#231a02" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">6</text><text x="420" y="279" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Golgi apparatus</text><text x="420" y="297" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">packages and ships</text><circle cx="398" cy="330" r="14" fill="#00c2c7" stroke="#0d0a1c" stroke-width="2.5"/><text x="398" y="336" font-size="17" font-weight="800" fill="#00252b" text-anchor="middle" font-family="Segoe UI,Roboto,system-ui,sans-serif">7</text><text x="420" y="325" font-size="19" font-weight="800" fill="#fff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">Smooth ER</text><text x="420" y="343" font-size="17" font-weight="800" fill="#cfd8ff" text-anchor="start" font-family="Segoe UI,Roboto,system-ui,sans-serif">lipids; detoxifies</text></svg>