<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Complications of prematurity</title><desc id="d">A newborn outline with the four organ systems that fail in prematurity marked on it, and what each one looks like.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="900" height="600" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="852" height="54" rx="13" fill="#2f6bff" fill-opacity=".22" stroke="#2f6bff" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#2f6bff"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#2f6bff">THE PRETERM NEWBORN — WHAT FAILS, AND WHERE</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">Everything immature at once. Four systems, four problems, four different signs.</text><rect x="24" y="92" width="380" height="396" rx="14" fill="#2f6bff" fill-opacity=".13" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="92" width="5" height="396" rx="2.5" fill="#2f6bff"/><text x="44" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">WHERE EACH PROBLEM IS</text><circle cx="214" cy="182" r="46" fill="#f6d3bd" fill-opacity=".26" stroke="#f6d3bd" stroke-opacity=".5" stroke-width="1.8"/><path d="M168 242 q46 -22 92 0 l10 108 q2 24 -22 26 l-68 0 q-24 -2 -22 -26z" fill="#f6d3bd" fill-opacity=".26" stroke="#f6d3bd" stroke-opacity=".5" stroke-width="1.8"/><path d="M174 270 l-40 62 M254 270 l40 62" stroke="#f6d3bd" stroke-opacity=".45" stroke-width="12" stroke-linecap="round"/><path d="M194 372 l-16 66 M234 372 l16 66" stroke="#f6d3bd" stroke-opacity=".45" stroke-width="14" stroke-linecap="round"/><circle cx="214" cy="176" r="17" fill="#ff3b6b" fill-opacity=".9"/><text x="214" y="181" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="900" fill="#fff" fill-opacity="1" text-anchor="middle">IVH</text><ellipse cx="194" cy="282" rx="19" ry="24" fill="#ffc233" fill-opacity=".85"/><ellipse cx="234" cy="282" rx="19" ry="24" fill="#ffc233" fill-opacity=".85"/><text x="214" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">RDS</text><circle cx="214" cy="334" r="18" fill="#ff8a3d" fill-opacity=".88"/><text x="214" y="339" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="900" fill="#1a1005" fill-opacity="1" text-anchor="middle">NEC</text><circle cx="278" cy="318" r="16" fill="#00c2c7" fill-opacity=".88"/><text x="278" y="323" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">°C</text><path d="M197 176 L92 176" stroke="#ff3b6b" stroke-opacity=".75" stroke-width="1.4"/><text x="86" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="end">brain</text><path d="M175 282 L92 282" stroke="#ffc233" stroke-opacity=".75" stroke-width="1.4"/><text x="86" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="end">lungs</text><path d="M196 340 L92 362" stroke="#ff8a3d" stroke-opacity=".75" stroke-width="1.4"/><text x="86" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="end">gut</text><text x="278" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="middle">skin</text><rect x="420" y="92" width="456" height="92" rx="14" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="420" y="92" width="5" height="92" rx="2.5" fill="#ff3b6b"/><text x="440" y="118" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">IVH — intraventricular hemorrhage</text><circle cx="442" cy="133.5" r="2.6" fill="#dfe2ff"/><text x="452" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Fragile vessels round the ventricles bleed.</text><circle cx="442" cy="150.5" r="2.6" fill="#dfe2ff"/><text x="452" y="155" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Bulging fontanelle, seizures, sudden anemia, apnoea.</text><circle cx="442" cy="167.5" r="2.6" fill="#dfe2ff"/><text x="452" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Handle gently, head midline, no rapid position changes.</text><rect x="420" y="192" width="456" height="92" rx="14" fill="#ffc233" fill-opacity=".20" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="420" y="192" width="5" height="92" rx="2.5" fill="#ffc233"/><text x="440" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">RDS — respiratory distress syndrome</text><circle cx="442" cy="233.5" r="2.6" fill="#dfe2ff"/><text x="452" y="238" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Not enough surfactant, so alveoli collapse each breath.</text><circle cx="442" cy="250.5" r="2.6" fill="#dfe2ff"/><text x="452" y="255" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Grunting, nasal flaring, retractions, tachypnoea.</text><circle cx="442" cy="267.5" r="2.6" fill="#dfe2ff"/><text x="452" y="272" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Surfactant down the ETT, CPAP. Long O2 → BPD.</text><rect x="420" y="292" width="456" height="92" rx="14" fill="#ff8a3d" fill-opacity=".20" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="420" y="292" width="5" height="92" rx="2.5" fill="#ff8a3d"/><text x="440" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">NEC — necrotising enterocolitis</text><circle cx="442" cy="333.5" r="2.6" fill="#dfe2ff"/><text x="452" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Immature gut wall becomes ischaemic and dies.</text><circle cx="442" cy="350.5" r="2.6" fill="#dfe2ff"/><text x="452" y="355" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Distended shiny abdomen, bilious residual, bloody stool.</text><circle cx="442" cy="367.5" r="2.6" fill="#dfe2ff"/><text x="452" y="372" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">NPO immediately, OG tube to suction, no rectal temps.</text><rect x="420" y="392" width="456" height="92" rx="14" fill="#00c2c7" fill-opacity=".20" stroke="#00c2c7" stroke-opacity=".62" filter="url(#sh)"/><rect x="420" y="392" width="5" height="92" rx="2.5" fill="#00c2c7"/><text x="440" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#00c2c7" fill-opacity="1" text-anchor="start">Cold stress — she cannot warm herself</text><circle cx="442" cy="433.5" r="2.6" fill="#dfe2ff"/><text x="452" y="438" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">No brown fat, huge surface area, no shivering.</text><circle cx="442" cy="450.5" r="2.6" fill="#dfe2ff"/><text x="452" y="455" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Cold → hypoglycaemia → acidosis, in that order.</text><circle cx="442" cy="467.5" r="2.6" fill="#dfe2ff"/><text x="452" y="472" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.8" font-weight="400" fill="#eaecff" fill-opacity="1" text-anchor="start">Radiant warmer, hat, skin to skin, warm everything you touch her with.</text><rect x="24" y="504" width="852" height="74" rx="14" fill="#12b886" fill-opacity=".20" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="504" width="5" height="74" rx="2.5" fill="#12b886"/><text x="44" y="532" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">✅ THE PRIORITY ORDER AT DELIVERY</text><circle cx="59" cy="558" r="13" fill="#12b886"/><text x="59" y="563" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">1</text><text x="80" y="563" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Airway, breathing</text><path d="M224 558 L242 558" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="269" cy="558" r="13" fill="#12b886"/><text x="269" y="563" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">2</text><text x="290" y="563" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Warmth</text><path d="M434 558 L452 558" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="479" cy="558" r="13" fill="#12b886"/><text x="479" y="563" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">3</text><text x="500" y="563" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Glucose</text><path d="M644 558 L662 558" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><circle cx="689" cy="558" r="13" fill="#12b886"/><text x="689" y="563" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="900" fill="#04231a" fill-opacity="1" text-anchor="middle">4</text><text x="710" y="563" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#fff" fill-opacity="1" text-anchor="start">Gentle handling</text></svg>