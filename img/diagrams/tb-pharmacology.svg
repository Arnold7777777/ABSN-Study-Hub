<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 664" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Tuberculosis pharmacology: RIPE</title><desc id="d">The four drugs each with the part of the body it damages, drawn as an icon - the liver for all four, orange body fluids for rifampicin, the eyes for ethambutol, the nerves for isoniazid and the joints for pyrazinamide. Beside them why four drugs for months rather than one for a week. Below, the teaching that carries the marks.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="664" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">FOUR DRUGS AT ONCE, FOR MONTHS</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">A bacillus would have to be resistant to all four to survive — and stopping early is what creates resistant TB.</text><rect x="24" y="96" width="212" height="250" rx="14" fill="#ff8a3d" fill-opacity=".16" stroke="#ff8a3d" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="250" rx="2.5" fill="#ff8a3d"/><text x="42" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">R</text><text x="64" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="start">IFAMPICIN</text><rect x="42" y="148" width="176" height="24" rx="10" fill="#ff8a3d" fill-opacity=".28" stroke="#ff8a3d" stroke-opacity=".8"/><text x="130" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ff8a3d" fill-opacity="1" text-anchor="middle">watch ORANGE everything</text><text x="42" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">tears, urine, sweat and saliva turn</text><text x="42" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">orange-red. Harmless, but she must</text><text x="42" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">be warned or she will stop taking it.</text><text x="42" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Soft contact lenses stain permanently.</text><text x="42" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">It makes oral contraceptives FAIL —</text><text x="42" y="313" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">she needs another method.</text><rect x="250" y="96" width="212" height="250" rx="14" fill="#2f6bff" fill-opacity=".16" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="250" y="96" width="5" height="250" rx="2.5" fill="#2f6bff"/><text x="268" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">I</text><text x="290" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">SONIAZID</text><rect x="268" y="148" width="176" height="24" rx="10" fill="#2f6bff" fill-opacity=".28" stroke="#2f6bff" stroke-opacity=".8"/><text x="356" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="middle">watch the NERVES</text><text x="268" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">peripheral neuropathy — tingling and</text><text x="268" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">numbness in the hands and feet.</text><text x="268" y="245" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Given WITH pyridoxine (vitamin B6),</text><text x="268" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">which is what prevents it.</text><text x="268" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">No alcohol. Watch the liver.</text><rect x="476" y="96" width="212" height="250" rx="14" fill="#ffc233" fill-opacity=".16" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="476" y="96" width="5" height="250" rx="2.5" fill="#ffc233"/><text x="494" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">P</text><text x="516" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">YRAZINAMIDE</text><rect x="494" y="148" width="176" height="24" rx="10" fill="#ffc233" fill-opacity=".28" stroke="#ffc233" stroke-opacity=".8"/><text x="582" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="middle">watch the JOINTS</text><text x="494" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">raises uric acid, so it can set off</text><text x="494" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">gout — joint pain and swelling.</text><text x="494" y="245" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Drink plenty of fluid.</text><text x="494" y="279" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Watch the liver here too.</text><rect x="702" y="96" width="212" height="250" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="702" y="96" width="5" height="250" rx="2.5" fill="#12b886"/><text x="720" y="134" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">E</text><text x="742" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">THAMBUTOL</text><rect x="720" y="148" width="176" height="24" rx="10" fill="#12b886" fill-opacity=".28" stroke="#12b886" stroke-opacity=".8"/><text x="808" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">watch the EYES</text><text x="720" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">optic neuritis: blurred vision and,</text><text x="720" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">characteristically, loss of</text><text x="720" y="228" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">RED-GREEN colour discrimination.</text><text x="720" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Baseline and monthly vision checks.</text><text x="720" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start">Report any visual change at once.</text><rect x="24" y="360" width="872" height="62" rx="14" fill="#ff3b6b" fill-opacity=".20" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="360" width="5" height="62" rx="2.5" fill="#ff3b6b"/><text x="46" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">ALL FOUR are hepatotoxic. Baseline liver function tests, then watch for it:</text><text x="46" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffd9e2" fill-opacity="1" text-anchor="start">nausea, right upper quadrant pain, dark urine, yellow eyes — and no alcohol at all.</text><rect x="24" y="440" width="452" height="200" rx="14" fill="#2f6bff" fill-opacity=".15" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="440" width="5" height="200" rx="2.5" fill="#2f6bff"/><text x="46" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">💉  WHY FOUR DRUGS, AND WHY SO LONG</text><text x="46" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">RESISTANCE</text><text x="46" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">In a population of billions, a few are already</text><text x="46" y="532" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">resistant to any single drug. Four at once means</text><text x="46" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">a bacillus would have to beat all four.</text><text x="46" y="576" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">DORMANCY</text><text x="46" y="594" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">It divides slowly and hides inside granulomas,</text><text x="46" y="610" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">so the drugs need months to reach them all.</text><text x="46" y="636" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Intensive phase: 2 months of all four. Then 4 more of R and I.</text><rect x="496" y="440" width="400" height="200" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="440" width="5" height="200" rx="2.5" fill="#12b886"/><text x="518" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🎓  THE TEACHING THAT CARRIES THE MARKS</text><text x="518" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Take it EVERY day. Stopping early creates</text><text x="518" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  multi-drug-resistant TB — that is the whole reason</text><text x="518" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· DOT: a worker watches her swallow every dose. Not</text><text x="518" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  distrust — it is the intervention with the best</text><text x="518" y="570" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  evidence, and the right answer for missed doses</text><text x="518" y="588" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· She is no longer contagious after about 2–3 weeks</text><text x="518" y="606" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  of treatment, with 3 negative sputum samples</text><text x="518" y="624" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Cover the mouth; her own room until then</text></svg>