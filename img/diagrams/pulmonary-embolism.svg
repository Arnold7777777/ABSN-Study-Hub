<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" role="img" aria-labelledby="t d" style="display:block;width:100%;height:auto"><title id="t">Pulmonary embolism</title><desc id="d">The route a clot takes from a deep vein in the leg, up the vena cava, through the right heart and into a pulmonary artery where it wedges. Beside it two lung segments compared: a normal one that is both ventilated and perfused, and the blocked one that still gets air but no blood, which is dead space. Below, why the gases come back low on both oxygen and carbon dioxide, and what you do.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1033"/><stop offset="1" stop-color="#0d0819"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfd4ff"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff3b6b"/></marker></defs><rect width="920" height="690" rx="18" fill="url(#bg)"/><rect x="24" y="22" width="872" height="54" rx="13" fill="#ff3b6b" fill-opacity=".22" stroke="#ff3b6b" stroke-opacity=".75"/><rect x="24" y="22" width="6" height="54" rx="3" fill="#ff3b6b"/><text x="42" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#ff3b6b">PULMONARY EMBOLISM — AIR ARRIVES, BLOOD DOES NOT</text><text x="42" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#d9dcff" fill-opacity=".92">The suddenness is the clue. Sudden dyspnoea, pleuritic pain and tachycardia, out of nowhere.</text><rect x="24" y="96" width="396" height="356" rx="14" fill="#2f6bff" fill-opacity=".14" stroke="#2f6bff" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="96" width="5" height="356" rx="2.5" fill="#2f6bff"/><text x="42" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">WHERE IT CAME FROM</text><path d="M142 426 V346" stroke="#4d7dff" stroke-width="11" stroke-linecap="round" stroke-opacity=".75"/><circle cx="142" cy="396" r="9" fill="#8a2c3f"/><text x="164" y="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#c3d2ff" fill-opacity="1" text-anchor="start">DVT in a leg vein</text><text x="164" y="415" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9fb2e8" fill-opacity="1" text-anchor="start">90% of them start here</text><path d="M142 346 V284" stroke="#4d7dff" stroke-width="13" stroke-linecap="round" stroke-opacity=".75"/><text x="164" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#c3d2ff" fill-opacity="1" text-anchor="start">up the vena cava</text><rect x="106" y="228" width="72" height="56" rx="14" fill="#4d7dff" fill-opacity=".28" stroke="#4d7dff" stroke-width="2.4"/><text x="142" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#4d7dff" fill-opacity="1" text-anchor="middle">RIGHT</text><text x="142" y="266" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#4d7dff" fill-opacity="1" text-anchor="middle">heart</text><path d="M142 228 q0 -34 62 -34 h44" fill="none" stroke="#4d7dff" stroke-width="11" stroke-linecap="round" stroke-opacity=".75"/><circle cx="234" cy="194" r="12" fill="#8a2c3f"/><text x="254" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">WEDGED in a</text><text x="254" y="203" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">pulmonary artery</text><path d="M142 382 L142 296" stroke="#cfd4ff" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="42" y="442" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Virchow: stasis · vessel injury · hypercoagulability</text><rect x="436" y="96" width="460" height="356" rx="14" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".62" filter="url(#sh)"/><rect x="436" y="96" width="5" height="356" rx="2.5" fill="#ff3b6b"/><text x="454" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">THE SEGMENT STILL GETS AIR — IT JUST GETS NO BLOOD</text><rect x="458" y="142" width="196" height="176" rx="13" fill="#12b886" fill-opacity=".14" stroke="#12b886" stroke-opacity=".7"/><text x="556" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="middle">NORMAL</text><path d="M556 172 v26 M534 198 h44" stroke="#cfd4ff" stroke-width="7" stroke-linecap="round" stroke-opacity=".8"/><text x="556" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><circle cx="526" cy="228" r="21" fill="#dfe9ff" fill-opacity=".22" stroke="#dfe9ff" stroke-opacity=".55" stroke-width="2"/><circle cx="556" cy="238" r="21" fill="#dfe9ff" fill-opacity=".22" stroke="#dfe9ff" stroke-opacity=".55" stroke-width="2"/><circle cx="586" cy="228" r="21" fill="#dfe9ff" fill-opacity=".22" stroke="#dfe9ff" stroke-opacity=".55" stroke-width="2"/><path d="M460 270 q46 20 98 0 q46 -20 98 0" fill="none" stroke="#ff4d6d" stroke-width="7" stroke-linecap="round" stroke-opacity=".9"/><text x="556" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">air in, blood past, gas swaps</text><rect x="676" y="142" width="196" height="176" rx="13" fill="#ff3b6b" fill-opacity=".14" stroke="#ff3b6b" stroke-opacity=".7"/><text x="774" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="middle">BLOCKED</text><path d="M774 172 v26 M752 198 h44" stroke="#cfd4ff" stroke-width="7" stroke-linecap="round" stroke-opacity=".8"/><text x="774" y="190" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#eef0ff" fill-opacity="1" text-anchor="start"></text><circle cx="744" cy="228" r="21" fill="#dfe9ff" fill-opacity=".22" stroke="#dfe9ff" stroke-opacity=".55" stroke-width="2"/><circle cx="774" cy="238" r="21" fill="#dfe9ff" fill-opacity=".22" stroke="#dfe9ff" stroke-opacity=".55" stroke-width="2"/><circle cx="804" cy="228" r="21" fill="#dfe9ff" fill-opacity=".22" stroke="#dfe9ff" stroke-opacity=".55" stroke-width="2"/><path d="M678 270 q46 20 98 0 q46 -20 98 0" fill="none" stroke="#5a5f7d" stroke-width="7" stroke-linecap="round" stroke-opacity=".7"/><circle cx="706" cy="278" r="10" fill="#8a2c3f"/><path d="M768 272 l14 14 M782 272 l-14 14" stroke="#ff3b6b" stroke-width="3.4" stroke-linecap="round"/><text x="774" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#e7e9ff" fill-opacity="1" text-anchor="middle">air in, no blood — DEAD SPACE</text><text x="454" y="346" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">That segment is ventilated and not perfused. It is doing no gas</text><text x="454" y="364" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffd0dc" fill-opacity="1" text-anchor="start">exchange at all, and no amount of oxygen changes that.</text><text x="454" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">Meanwhile the right ventricle pumps against a blocked bed —</text><text x="454" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">right heart strain first, then obstructive shock.</text><text x="454" y="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">A clot in the lung is why she is suddenly short of breath at rest.</text><rect x="24" y="470" width="452" height="172" rx="14" fill="#ffc233" fill-opacity=".17" stroke="#ffc233" stroke-opacity=".62" filter="url(#sh)"/><rect x="24" y="470" width="5" height="172" rx="2.5" fill="#ffc233"/><text x="46" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffc233" fill-opacity="1" text-anchor="start">🧪  THE GAS PATTERN THAT GIVES IT AWAY</text><text x="46" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">PaO₂  ↓</text><text x="160" y="534" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#2f6bff" fill-opacity="1" text-anchor="start">PaCO₂  ↓</text><text x="46" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">Low oxygen you would expect. Low CO₂ is the surprise —</text><text x="46" y="580" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">she is breathing fast and blowing it off. Respiratory</text><text x="46" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#ffeec2" fill-opacity="1" text-anchor="start">alkalosis early; acidosis later if it is not fixed.</text><text x="46" y="628" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ff3b6b" fill-opacity="1" text-anchor="start">A normal D-dimer rules it out. A raised one does not rule it in.</text><rect x="496" y="470" width="400" height="172" rx="14" fill="#12b886" fill-opacity=".16" stroke="#12b886" stroke-opacity=".62" filter="url(#sh)"/><rect x="496" y="470" width="5" height="172" rx="2.5" fill="#12b886"/><text x="518" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#12b886" fill-opacity="1" text-anchor="start">🩺  WHAT YOU DO</text><text x="518" y="530" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Sit her UP — high Fowler's</text><text x="518" y="550" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Oxygen, high flow</text><text x="518" y="570" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· Stay with her; call for help</text><text x="518" y="590" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">· IV access; anticoagulation as ordered</text><text x="518" y="610" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  Prevention is the real answer: early</text><text x="518" y="630" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#dff3ea" fill-opacity="1" text-anchor="start">  mobility, SCDs, prophylactic heparin</text></svg>