<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">Magnesium: monitor in parallel</title><desc id="desc">Toxicity signs do not have to appear in a fixed sequence.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect x="0" y="0" width="1200" height="950" rx="0" fill="#fffdf9"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#007f86"/><text x="60" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="3">OBSTETRICS • MEDICATION MONITORING</text><text x="60" y="125" font-family="Georgia,serif" font-size="44" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Magnesium: monitor in parallel</text><text x="60" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Toxicity signs do not have to appear in a fixed sequence.</text><rect x="60" y="222" width="525" height="201" rx="18" fill="#edf6f5"/><text x="85" y="259" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="2">REFLEXES</text><text x="85" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Deep tendon reflexes</text><text x="85" y="345.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Decreased or absent reflexes can</text><text x="85" y="378.6" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">signal magnesium toxicity.</text><rect x="615" y="222" width="525" height="201" rx="18" fill="#edf6f5"/><text x="640" y="259" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="2">BREATHING</text><text x="640" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Respiration</text><text x="640" y="345.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Monitor rate and effort. Respiratory</text><text x="640" y="378.6" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">depression is a serious warning.</text><rect x="60" y="447" width="525" height="201" rx="18" fill="#edf6f5"/><text x="85" y="484" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="2">CLEARANCE</text><text x="85" y="528" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Urine output</text><text x="85" y="570.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Reduced output may impair magnesium</text><text x="85" y="603.6" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">clearance and increase toxicity risk.</text><rect x="615" y="447" width="525" height="201" rx="18" fill="#edf6f5"/><text x="640" y="484" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="2">PATIENT</text><text x="640" y="528" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Overall condition</text><text x="640" y="570.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Assess consciousness, vital signs and</text><text x="640" y="603.6" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">ordered laboratory values.</text><rect x="60" y="688" width="1080" height="155" rx="18" fill="#f9e9ef"/><text x="85" y="733" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Suspected toxicity → stop the infusion and get urgent help.</text><text x="85" y="776.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Support breathing and circulation. Prepare calcium gluconate and administer only</text><text x="85" y="809.6" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">as ordered or directed by the emergency protocol.</text><line x1="60" y1="874" x2="1140" y2="874" stroke="#d7e6e8" stroke-width="2"/><text x="60" y="912" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">ABSN STUDY HUB  •  Visual study aid  •  Sources and readable notes in companion guide</text></svg>