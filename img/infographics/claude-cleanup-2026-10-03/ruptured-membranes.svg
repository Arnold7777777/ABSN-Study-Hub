<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc"><title id="title">When membranes rupture</title><desc id="desc">Collect useful observations and recognize findings that need urgent review.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect x="0" y="0" width="1200" height="970" rx="0" fill="#fffdf9"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#007f86"/><text x="60" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="3">LABOR • ROM ASSESSMENT</text><text x="60" y="125" font-family="Georgia,serif" font-size="44" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">When membranes rupture</text><text x="60" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Collect useful observations and recognize findings that need urgent review.</text><rect x="60" y="222" width="1080" height="108" rx="18" fill="#edf6f5"/><circle cx="110" cy="256" r="24" fill="#007f86"/><text x="110" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">1</text><text x="150" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Rupture time</text><text x="435" y="255.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Record when rupture occurred and whether labor has</text><text x="435" y="285.8" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">started.</text><rect x="60" y="348" width="1080" height="108" rx="18" fill="#f0f3f8"/><circle cx="110" cy="382" r="24" fill="#007f86"/><text x="110" y="391" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">2</text><text x="150" y="391" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Fetal assessment</text><text x="435" y="381.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Assess fetal heart rate promptly. Abnormal findings or a</text><text x="435" y="411.8" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">suspected prolapsed cord require an immediate response.</text><rect x="60" y="474" width="1080" height="108" rx="18" fill="#edf6f5"/><circle cx="110" cy="508" r="24" fill="#007f86"/><text x="110" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">3</text><text x="150" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Fluid</text><text x="435" y="507.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Document amount, color and odor. Report concerning</text><text x="435" y="537.8" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">findings, including meconium or a foul odor.</text><rect x="60" y="600" width="1080" height="108" rx="18" fill="#f0f3f8"/><circle cx="110" cy="634" r="24" fill="#007f86"/><text x="110" y="643" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">4</text><text x="150" y="643" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Maternal condition</text><text x="435" y="633.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Check temperature and other clinical findings. Watch for</text><text x="435" y="663.8" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">infection; follow the monitoring plan.</text><rect x="60" y="726" width="1080" height="108" rx="18" fill="#edf6f5"/><circle cx="110" cy="760" r="24" fill="#007f86"/><text x="110" y="769" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">5</text><text x="150" y="769" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Plan &amp; document</text><text x="435" y="759.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Follow gestational-age and facility guidance. Avoid</text><text x="435" y="789.8" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">unnecessary digital examinations after rupture.</text><text x="60" y="882" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Immediate escalation depends on the findings—not one fixed checklist interval.</text><line x1="60" y1="894" x2="1140" y2="894" stroke="#d7e6e8" stroke-width="2"/><text x="60" y="932" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">ABSN STUDY HUB  •  Visual study aid  •  Sources and readable notes in companion guide</text></svg>