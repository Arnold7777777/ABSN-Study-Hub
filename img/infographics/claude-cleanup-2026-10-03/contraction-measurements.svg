<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Reading a contraction</title><desc id="desc">Three measurements. Three different questions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect x="0" y="0" width="1200" height="900" rx="0" fill="#fffdf9"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#007f86"/><text x="60" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="3">LABOR • CONTRACTION PATTERN</text><text x="60" y="125" font-family="Georgia,serif" font-size="44" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Reading a contraction</text><text x="60" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Three measurements. Three different questions.</text><rect x="60" y="218" width="1080" height="345" rx="18" fill="#f3f7fa"/><line x1="100" y1="474" x2="1095" y2="474" stroke="#536578" stroke-width="2"/><text x="1080" y="509" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#536578" font-weight="400" font-style="normal" text-anchor="end" letter-spacing="0">Time →</text><path d="M110 470 L160 470 C190 470 205 295 260 295 C315 295 330 470 360 470 L540 470 C570 470 585 295 640 295 C695 295 710 470 740 470 L1080 470" fill="none" stroke="#007f86" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="160" y1="277" x2="160" y2="489" stroke="#536578" stroke-width="1" stroke-dasharray="6 6"/><line x1="360" y1="277" x2="360" y2="489" stroke="#536578" stroke-width="1" stroke-dasharray="6 6"/><line x1="540" y1="277" x2="540" y2="489" stroke="#536578" stroke-width="1" stroke-dasharray="6 6"/><line x1="160" y1="530" x2="355" y2="530" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/><text x="260" y="520" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#007f86" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">DURATION</text><line x1="160" y1="270" x2="535" y2="270" stroke="#ad355d" stroke-width="3"/><text x="350" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">FREQUENCY: onset → next onset</text><line x1="800" y1="464" x2="800" y2="306" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/><text x="831" y="353.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">INTENSITY = how</text><text x="831" y="385.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">strong</text><circle cx="84" cy="606" r="24" fill="#007f86"/><text x="84" y="615" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">1</text><text x="124" y="615" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Duration</text><text x="60" y="662.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Start of one contraction</text><text x="60" y="695.6" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">to its end. Usually</text><text x="60" y="729.2" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">recorded in seconds.</text><circle cx="454" cy="606" r="24" fill="#007f86"/><text x="454" y="615" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">2</text><text x="494" y="615" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Frequency</text><text x="430" y="662.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Start of one contraction</text><text x="430" y="695.6" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">to the start of the next.</text><text x="430" y="729.2" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Usually recorded in</text><text x="430" y="762.8" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">minutes.</text><circle cx="824" cy="606" r="24" fill="#007f86"/><text x="824" y="615" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">3</text><text x="864" y="615" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Intensity</text><text x="800" y="662.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Strength assessed by</text><text x="800" y="695.6" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">palpation or an</text><text x="800" y="729.2" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">appropriate pressure</text><text x="800" y="762.8" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">measurement.</text><text x="60" y="800" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">External monitor height does not reliably measure contraction strength.</text><line x1="60" y1="824" x2="1140" y2="824" stroke="#d7e6e8" stroke-width="2"/><text x="60" y="862" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">ABSN STUDY HUB  •  Visual study aid  •  Sources and readable notes in companion guide</text></svg>