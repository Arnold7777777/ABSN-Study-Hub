<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">Shoulder dystocia: remember the landmarks</title><desc id="desc">An obstetric emergency requiring a coordinated, trained team.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect x="0" y="0" width="1200" height="1020" rx="0" fill="#fffdf9"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#007f86"/><text x="60" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="3">LABOR • EMERGENCY CONCEPTS</text><text x="60" y="125" font-family="Georgia,serif" font-size="44" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Shoulder dystocia: remember the landmarks</text><text x="60" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">An obstetric emergency requiring a coordinated, trained team.</text><rect x="60" y="215" width="475" height="537" rx="18" fill="#edf6f5"/><text x="85" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="1">WHY DELIVERY IS BLOCKED</text><path d="M145 362 C105 300 220 288 270 331 C327 288 439 304 408 369 C386 409 369 466 349 493 L310 509 L236 509 L197 493 C183 456 165 409 145 362" fill="none" stroke="#bca88e" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><line x1="208" y1="478" x2="347" y2="478" stroke="#bca88e" stroke-width="25"/><rect x="213" y="405" width="122" height="59" rx="24" fill="#b5d7dc"/><circle cx="274" cy="541" r="47" fill="#b5d7dc"/><line x1="394" y1="430" x2="337" y2="432" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="404" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Shoulder</text><line x1="100" y1="501" x2="217" y2="482" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/><text x="85" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Pubic bone</text><text x="85" y="628.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">One shoulder may become trapped</text><text x="85" y="663.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">behind the pubic bone after the</text><text x="85" y="698.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">head delivers.</text><text x="85" y="729" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#536578" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0">Simplified relationship—not a procedure view.</text><rect x="565" y="215" width="575" height="244" rx="18" fill="#f0f3f8"/><circle cx="614" cy="258" r="24" fill="#007f86"/><text x="614" y="267" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">1</text><text x="654" y="267" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">McRoberts maneuver</text><text x="593" y="321.0" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">The team assists with marked flexion</text><text x="593" y="358.8" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">of the patient’s hips: thighs move</text><text x="593" y="396.6" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">toward the abdomen.</text><text x="593" y="423" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Think: change pelvic position.</text><rect x="565" y="483" width="575" height="269" rx="18" fill="#f0f3f8"/><circle cx="614" cy="526" r="24" fill="#007f86"/><text x="614" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">2</text><text x="654" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Suprapubic pressure</text><text x="593" y="589.0" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Pressure is applied just above the</text><text x="593" y="626.8" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">pubic bone, directed to help release</text><text x="593" y="664.6" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">the impacted shoulder.</text><text x="593" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Think: pressure LOW, above the pubis.</text><rect x="60" y="788" width="1080" height="118" rx="18" fill="#f9e9ef"/><text x="87" y="834" font-family="Segoe UI,Arial,sans-serif" font-size="31" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Never use fundal pressure for shoulder dystocia.</text><text x="87" y="877" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Call for help promptly. Further maneuvers follow the obstetric emergency protocol.</text><line x1="60" y1="944" x2="1140" y2="944" stroke="#d7e6e8" stroke-width="2"/><text x="60" y="982" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">ABSN STUDY HUB  •  Visual study aid  •  Sources and readable notes in companion guide</text></svg>