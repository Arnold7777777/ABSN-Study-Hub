<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">APGAR: five signs, ten possible points</title><desc id="desc">Assess at 1 and 5 minutes; each component receives 0, 1 or 2 points.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect x="0" y="0" width="1200" height="1050" rx="0" fill="#fffdf9"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#007f86"/><text x="60" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="3">NEWBORN • STRUCTURED ASSESSMENT</text><text x="60" y="125" font-family="Georgia,serif" font-size="44" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">APGAR: five signs, ten possible points</text><text x="60" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Assess at 1 and 5 minutes; each component receives 0, 1 or 2 points.</text><rect x="60" y="222" width="330" height="62" rx="0" fill="#007f86"/><text x="80" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="white" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">SIGN</text><rect x="390" y="222" width="250" height="62" rx="0" fill="#007f86"/><text x="410" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="white" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">0 POINTS</text><rect x="640" y="222" width="250" height="62" rx="0" fill="#007f86"/><text x="660" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="white" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">1 POINT</text><rect x="890" y="222" width="250" height="62" rx="0" fill="#007f86"/><text x="910" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="white" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">2 POINTS</text><rect x="60" y="284" width="330" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="80" y="317.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Appearance</text><rect x="390" y="284" width="250" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="410" y="317.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Blue / pale</text><rect x="640" y="284" width="250" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="660" y="317.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Pink body; blue</text><text x="660" y="349.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">extremities</text><rect x="890" y="284" width="250" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="910" y="317.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Completely pink</text><rect x="60" y="384" width="330" height="100" rx="0" fill="#f3f5f8" stroke="white" stroke-width="2"/><text x="80" y="417.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Pulse</text><rect x="390" y="384" width="250" height="100" rx="0" fill="#f3f5f8" stroke="white" stroke-width="2"/><text x="410" y="417.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Absent</text><rect x="640" y="384" width="250" height="100" rx="0" fill="#f3f5f8" stroke="white" stroke-width="2"/><text x="660" y="417.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Below 100/min</text><rect x="890" y="384" width="250" height="100" rx="0" fill="#f3f5f8" stroke="white" stroke-width="2"/><text x="910" y="417.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">100/min or more</text><rect x="60" y="484" width="330" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="80" y="517.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Grimace / reflex</text><text x="80" y="549.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">response</text><rect x="390" y="484" width="250" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="410" y="517.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">No response</text><rect x="640" y="484" width="250" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="660" y="517.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Grimace / weak</text><text x="660" y="549.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">response</text><rect x="890" y="484" width="250" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="910" y="517.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Cough, sneeze or</text><text x="910" y="549.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">active withdrawal</text><rect x="60" y="584" width="330" height="100" rx="0" fill="#f3f5f8" stroke="white" stroke-width="2"/><text x="80" y="617.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Activity / muscle tone</text><rect x="390" y="584" width="250" height="100" rx="0" fill="#f3f5f8" stroke="white" stroke-width="2"/><text x="410" y="617.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Limp</text><rect x="640" y="584" width="250" height="100" rx="0" fill="#f3f5f8" stroke="white" stroke-width="2"/><text x="660" y="617.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Some flexion</text><rect x="890" y="584" width="250" height="100" rx="0" fill="#f3f5f8" stroke="white" stroke-width="2"/><text x="910" y="617.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Active motion</text><rect x="60" y="684" width="330" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="80" y="717.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Respiration</text><rect x="390" y="684" width="250" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="410" y="717.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Absent</text><rect x="640" y="684" width="250" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="660" y="717.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Slow / irregular;</text><text x="660" y="749.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">weak cry</text><rect x="890" y="684" width="250" height="100" rx="0" fill="#edf6f5" stroke="white" stroke-width="2"/><text x="910" y="717.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Good breathing;</text><text x="910" y="749.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">strong cry</text><text x="60" y="831" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">5-minute score in term / late-preterm newborns</text><text x="60" y="873" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">7–10: reassuring</text><text x="430" y="873" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">4–6: moderately abnormal</text><text x="800" y="873" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">0–3: low</text><rect x="60" y="905" width="1080" height="57" rx="18" fill="#f9e9ef"/><text x="83" y="942" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Do not wait for an APGAR score to start needed resuscitation.</text><line x1="60" y1="974" x2="1140" y2="974" stroke="#d7e6e8" stroke-width="2"/><text x="60" y="1012" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">ABSN STUDY HUB  •  Visual study aid  •  Sources and readable notes in companion guide</text></svg>