<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Lochia changes over time</title><desc id="desc">Use the overall trend together with the patient’s symptoms.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect x="0" y="0" width="1200" height="920" rx="0" fill="#fffdf9"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#007f86"/><text x="60" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="3">POSTPARTUM • EXPECTED PROGRESSION</text><text x="60" y="125" font-family="Georgia,serif" font-size="44" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Lochia changes over time</text><text x="60" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Use the overall trend together with the patient’s symptoms.</text><rect x="60" y="231" width="340" height="402" rx="18" fill="#edf6f5"/><text x="230" y="281" font-family="Segoe UI,Arial,sans-serif" font-size="31" fill="#102b46" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">RUBRA</text><text x="230" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#536578" font-weight="400" font-style="normal" text-anchor="middle" letter-spacing="0">First 3–4 days</text><rect x="171" y="348" width="118" height="179" rx="37" fill="white" stroke="#d7e6e8" stroke-width="2"/><rect x="191" y="371" width="78" height="132" rx="28" fill="#b6425d"/><text x="230" y="579" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">Red / bloody</text><rect x="430" y="231" width="340" height="402" rx="18" fill="#edf6f5"/><text x="600" y="281" font-family="Segoe UI,Arial,sans-serif" font-size="31" fill="#102b46" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">SEROSA</text><text x="600" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#536578" font-weight="400" font-style="normal" text-anchor="middle" letter-spacing="0">Then, roughly to day 10</text><rect x="541" y="348" width="118" height="179" rx="37" fill="white" stroke="#d7e6e8" stroke-width="2"/><rect x="561" y="371" width="78" height="132" rx="28" fill="#c78472"/><text x="600" y="579" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">Pink / brown</text><rect x="800" y="231" width="340" height="402" rx="18" fill="#edf6f5"/><text x="970" y="281" font-family="Segoe UI,Arial,sans-serif" font-size="31" fill="#102b46" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">ALBA</text><text x="970" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#536578" font-weight="400" font-style="normal" text-anchor="middle" letter-spacing="0">Around day 10 onward</text><rect x="911" y="348" width="118" height="179" rx="37" fill="white" stroke="#d7e6e8" stroke-width="2"/><rect x="931" y="371" width="78" height="132" rx="28" fill="#dcc889"/><text x="970" y="579" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">Yellow-white / lighter</text><line x1="390" y1="432" x2="423" y2="432" stroke="#007f86" stroke-width="4" marker-end="url(#arrow)"/><line x1="760" y1="432" x2="793" y2="432" stroke="#007f86" stroke-width="4" marker-end="url(#arrow)"/><text x="60" y="691" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Timing varies; discharge usually becomes lighter over several weeks.</text><rect x="60" y="725" width="1080" height="104" rx="18" fill="#f9e9ef"/><text x="82" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Report heavy or increasing bleeding, large clots, foul odor, fever or dizziness.</text><text x="82" y="802" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Soaking a pad within an hour warrants prompt assessment.</text><line x1="60" y1="844" x2="1140" y2="844" stroke="#d7e6e8" stroke-width="2"/><text x="60" y="882" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">ABSN STUDY HUB  •  Visual study aid  •  Sources and readable notes in companion guide</text></svg>