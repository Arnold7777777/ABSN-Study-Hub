<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc"><title id="title">The menstrual cycle: connect the phases</title><desc id="desc">A 28-day cycle is an illustration. Real cycle length and ovulation timing vary.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect x="0" y="0" width="1200" height="970" rx="0" fill="#fffdf9"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#007f86"/><text x="60" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="3">REPRODUCTIVE HEALTH • CYCLE MAP</text><text x="60" y="125" font-family="Georgia,serif" font-size="44" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">The menstrual cycle: connect the phases</text><text x="60" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">A 28-day cycle is an illustration. Real cycle length and ovulation timing vary.</text><text x="60" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="2">OVARY</text><rect x="60" y="264" width="455" height="167" rx="18" fill="#edf6f5"/><text x="80" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Follicular phase</text><text x="80" y="351.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Follicles develop; estrogen</text><text x="80" y="383.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">generally rises.</text><rect x="535" y="264" width="185" height="167" rx="18" fill="#edf6f5"/><text x="555" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Ovulation</text><text x="555" y="351.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">LH surge →</text><text x="555" y="383.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">release.</text><rect x="740" y="264" width="400" height="167" rx="18" fill="#edf6f5"/><text x="760" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Luteal phase</text><text x="760" y="351.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Corpus luteum produces</text><text x="760" y="383.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">progesterone.</text><text x="60" y="488" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="2">UTERUS</text><rect x="60" y="510" width="250" height="162" rx="18" fill="#f9edf0"/><text x="80" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Menstruation</text><text x="80" y="598.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">The lining sheds.</text><rect x="330" y="510" width="390" height="162" rx="18" fill="#f9edf0"/><text x="350" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Proliferative phase</text><text x="350" y="598.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Estrogen supports rebuilding</text><text x="350" y="630.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">the lining.</text><rect x="740" y="510" width="400" height="162" rx="18" fill="#f9edf0"/><text x="760" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Secretory phase</text><text x="760" y="598.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Progesterone supports a</text><text x="760" y="630.2" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">receptive lining.</text><line x1="65" y1="720" x2="1130" y2="720" stroke="#007f86" stroke-width="4" marker-end="url(#arrow)"/><text x="60" y="758" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Day 1: bleeding begins</text><text x="620" y="758" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#536578" font-weight="400" font-style="normal" text-anchor="middle" letter-spacing="0">Illustrative ovulation near midcycle</text><text x="1120" y="758" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#007f86" font-weight="700" font-style="normal" text-anchor="end" letter-spacing="0">Next cycle</text><rect x="60" y="802" width="1080" height="78" rx="18" fill="#f0f3f8"/><text x="82" y="835.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Without pregnancy, hormone levels fall and the next menstrual bleed begins.</text><text x="82" y="868.6" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Ovulation is not always on day 14.</text><line x1="60" y1="894" x2="1140" y2="894" stroke="#d7e6e8" stroke-width="2"/><text x="60" y="932" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">ABSN STUDY HUB  •  Visual study aid  •  Sources and readable notes in companion guide</text></svg>