<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc"><title id="title">Rh immune globulin: prevention, not treatment</title><desc id="desc">For eligible, unsensitized RhD-negative patients—not established anti-D sensitization.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#007f86"/></marker></defs><rect x="0" y="0" width="1200" height="990" rx="0" fill="#fffdf9"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#007f86"/><text x="60" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="3">PREGNANCY • RHD PROPHYLAXIS</text><text x="60" y="125" font-family="Georgia,serif" font-size="44" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Rh immune globulin: prevention, not treatment</text><text x="60" y="171" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">For eligible, unsensitized RhD-negative patients—not established anti-D sensitization.</text><rect x="60" y="218" width="1080" height="129" rx="18" fill="#edf6f5"/><text x="84" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="2">START WITH ELIGIBILITY</text><text x="84" y="304.0" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Check maternal RhD type, antibody findings and the clinical situation.</text><text x="84" y="341.8" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Follow the obstetric protocol.</text><line x1="599" y1="356" x2="599" y2="414" stroke="#007f86" stroke-width="4" marker-end="url(#arrow)"/><rect x="60" y="443" width="340" height="327" rx="18" fill="#f0f3f8"/><circle cx="104" cy="482" r="24" fill="#007f86"/><text x="104" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">1</text><text x="144" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Routine antenatal</text><text x="80" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Around 28 weeks</text><text x="80" y="593.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Given when indicated to</text><text x="80" y="628.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">help prevent</text><text x="80" y="663.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">sensitization during</text><text x="80" y="698.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">pregnancy.</text><rect x="430" y="443" width="340" height="327" rx="18" fill="#f0f3f8"/><circle cx="474" cy="482" r="24" fill="#007f86"/><text x="474" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">2</text><text x="514" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">After delivery</text><text x="450" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Within 72 hours</text><text x="450" y="593.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Indicated after birth</text><text x="450" y="628.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">of an RhD-positive</text><text x="450" y="663.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">infant for an eligible</text><text x="450" y="698.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">patient.</text><rect x="800" y="443" width="340" height="327" rx="18" fill="#f0f3f8"/><circle cx="844" cy="482" r="24" fill="#007f86"/><text x="844" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="white" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0">3</text><text x="884" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#102b46" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Other events</text><text x="820" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#007f86" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Assess individually</text><text x="820" y="593.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Bleeding, trauma and</text><text x="820" y="628.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">procedures may require</text><text x="820" y="663.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">prophylaxis;</text><text x="820" y="698.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">gestational age and</text><text x="820" y="733.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">protocol matter.</text><rect x="60" y="806" width="1080" height="86" rx="18" fill="#f9edf0"/><text x="82" y="844" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#ad355d" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0">Early-pregnancy loss recommendations vary with gestation and guidance.</text><text x="82" y="879" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#102b46" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">Rh immune globulin does not remove an established immune anti-D response.</text><line x1="60" y1="914" x2="1140" y2="914" stroke="#d7e6e8" stroke-width="2"/><text x="60" y="952" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#536578" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0">ABSN STUDY HUB  •  Visual study aid  •  Sources and readable notes in companion guide</text></svg>